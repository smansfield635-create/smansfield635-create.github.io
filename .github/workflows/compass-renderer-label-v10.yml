name: Compass Renderer Label v10
on:
  push:
    branches:
      - compass/renderer-label-v10
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compass/renderer-label-v10
      - name: Patch renderer-owned labels and cache identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/compass/compass.crystals.js')
          s = p.read_text()
          old = '''    proxy.dataset.roomId =\n      node.id;\n\n    proxy.dataset.wing =\n      node.wing;'''
          new = '''    proxy.dataset.roomId =\n      node.id;\n\n    proxy.dataset.label =\n      node.label;\n\n    proxy.dataset.wing =\n      node.wing;'''
          if old not in s:
              raise SystemExit('room proxy anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          s = s.replace('compass-contextual-quick-pass-v9', 'compass-contextual-quick-pass-v10')
          s = s.replace('content:attr(aria-label);', 'content:attr(data-label);')
          s = s.replace("['pointerup','touchend','click','keydown']", "['pointerup','touchend','click','keydown','wheel']")
          p.write_text(s)
          PY
      - name: Quick procedural review
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          c = Path('assets/compass/compass.crystals.js').read_text()
          h = Path('index.html').read_text()
          assert 'proxy.dataset.label =\n      node.label;' in c
          assert 'content:attr(data-label);' in h
          assert 'compass-contextual-quick-pass-v10' in h
          assert "['pointerup','touchend','click','keydown','wheel']" in h
          assert 'data-compass-mirrorland-inline-back' in h
          print('PASS: renderer owns room label value; v10 cache; page-wide ambience; Mirrorland return preserved')
          PY
      - name: Commit and self-clean
        shell: bash
        run: |
          rm .github/workflows/compass-renderer-label-v10.yml
          git config user.name "smansfield635-create"
          git config user.email "smansfield635@gmail.com"
          git add assets/compass/compass.crystals.js index.html .github/workflows/compass-renderer-label-v10.yml
          git commit -m "Bind Compass room labels in renderer"
          git push origin HEAD:compass/renderer-label-v10
