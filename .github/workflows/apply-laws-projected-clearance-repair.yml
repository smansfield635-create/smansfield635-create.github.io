            node.target.x;
          node.transform.y =
            node.target.y;
          node.transform.z =
            node.target.z;
        }

        (
          rigidClusterLaw
            ? [
                "sx",
                "sy",
                "sz",
                "prominence",
                "halo",
                "rotationSpeed",
                "float"
              ]
            : [
                "x",
                "y",
                "z",
                "sx",
                "sy",
                "sz",
                "prominence",
                "halo",
                "rotationSpeed",
                "float"
              ]
        ).forEach(
          key => {
            node.transform[key] =
              node.transform[key] +
              (
                node.target[key] -
                node.transform[key]
              ) *
                interpolation;
          }
        );'''
          crystals = replace_exact(
              crystals,
              old_transform,
              new_transform,
              'RIGID_CLUSTER_POSITION_INTERPOLATION'
          )

          crystals = replace_exact(
              crystals,
              '''  function nodeFloatY(node) {
    return state.reducedMotion
      ? 0
      : Math.sin(''',
              '''  function nodeFloatY(node) {
    if (
