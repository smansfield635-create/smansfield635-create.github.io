<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ABC Roofing CRM · Synthetic Source System</title><style>:root{color-scheme:light;--bg:#f3f5f7;--card:#fff;--ink:#17212a;--muted:#66737e;--line:#dce2e7;--accent:#245f76}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.eyebrow{font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}h1{margin:.15em 0;font-size:2.3rem}.muted{color:var(--muted)}.metrics,.layout{display:grid;gap:12px}.metrics{grid-template-columns:repeat(4,1fr);margin:18px 0}.metric,.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}.metric b{display:block;font-size:1.5rem}.layout{grid-template-columns:340px 1fr}.search{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}.jobs{display:grid;gap:7px;max-height:70vh;overflow:auto}.job{padding:11px;border:1px solid var(--line);border-radius:9px;background:white;text-align:left;cursor:pointer}.job.active{outline:2px solid var(--accent)}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.tag{display:inline-block;padding:3px 8px;border-radius:99px;background:#edf2f5}.btn{padding:9px 13px;border:1px solid var(--line);border-radius:9px;background:#fff;color:inherit;text-decoration:none}.objective{padding:10px;border-left:3px solid var(--accent);background:#f7fafb;margin:7px 0}.govPanel{margin-top:14px;padding:14px;border:1px solid #d7b55b;border-radius:10px;background:#fff9e9}.govPanel.good{border-color:#79b995;background:#f2fbf6}.govActions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.govHidden{display:none}@media(max-width:760px){.metrics{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.jobs{max-height:35vh}}</style></head><body><main class="wrap"><div class="top"><div><div class="eyebrow">Synthetic source system · integration example</div><h1>ABC Roofing CRM</h1><p class="muted">What ABC already uses. Turn the added check on to see how Governance could appear inside a CRM that supports integration.</p></div><div><button id="crmGovToggle" class="btn">Governance: OFF</button> <a class="btn" href="/prototypes/abc-roofing/">Global Bridge</a></div></div><section id="metrics" class="metrics"></section><section class="panel"><div class="eyebrow">Agile operating cycle</div><h2 id="cycle"></h2><div id="objectives"></div></section><div class="layout" style="margin-top:12px"><aside class="panel"><input id="search" class="search" placeholder="Search job, customer, branch"><div style="display:flex;gap:6px;margin-bottom:10px"><button id="activeFilter" class="btn">Active</button><button id="completedFilter" class="btn">Completed</button><button id="allFilter" class="btn">All</button></div><div id="jobs" class="jobs"></div></aside><section id="detail" class="panel"></section></div></main><script src="./governance-adapter-v1.js?v=20260930-crm-gov-r1"></script><script src="./crm-v1.js?v=20260930-crm-gov-r1"></script></body></html>
