name: UCIC Hurricane Mechanistic Early Warning Execution v1

on:
  pull_request:
    paths:
      - 'research/route-operator-platform-v1/registered-challenges/ucic-hurricane-mechanistic-early-warning-v1/**'
      - '.github/workflows/ucic-hurricane-mechanistic-early-warning-execution-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn
      - name: Execute frozen TC-RADAR temporal holdout study
        run: python research/route-operator-platform-v1/registered-challenges/ucic-hurricane-mechanistic-early-warning-v1/run-execution-v1.py | tee ucic-hurricane-execution.log
      - name: Verify terminal result exists
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/route-operator-platform-v1/registered-challenges/ucic-hurricane-mechanistic-early-warning-v1/execution-result.v1.json')
          x=json.loads(p.read_text())
          assert x['terminal_disposition'] in {'SUPPORTED_WITH_LIMITATIONS','SIGNAL_PRESENT_INCONCLUSIVE','NOT_SUPPORTED','UNEVALUABLE'}
          print('TERMINAL_DISPOSITION=' + x['terminal_disposition'])
          PY
      - name: Preserve empirical result
        uses: actions/upload-artifact@v4
        with:
          name: ucic-hurricane-mechanistic-early-warning-execution-v1
          if-no-files-found: error
          retention-days: 90
          path: |
            research/route-operator-platform-v1/registered-challenges/ucic-hurricane-mechanistic-early-warning-v1/execution-protocol.v1.json
            research/route-operator-platform-v1/registered-challenges/ucic-hurricane-mechanistic-early-warning-v1/execution-result.v1.json
            ucic-hurricane-execution.log
