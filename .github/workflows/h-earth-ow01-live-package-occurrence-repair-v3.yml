name: H-Earth OW01 Live Package Occurrence Repair v3

on:
  push:
    branches:
      - control-plane-delivery/h-earth-ow01-public-product-20260814-014
    paths:
      - '.github/workflows/h-earth-ow01-live-package-occurrence-repair-v3.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve repaired terrain identity
        run: test "$(git hash-object h-earth-3d/terrain/h-earth.terrain-field.js)" = "c32431f4c0b0eff7812fca24daacac90bd4e7020"
      - name: Apply proven occurrence transform in workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap, subprocess
          source=Path('.github/workflows/h-earth-ow01-live-package-occurrence-repair-v2.yml').read_text().splitlines()
          start=next(i for i,line in enumerate(source) if "python3 - <<'PY'" in line)
          end=next(i for i in range(start+1,len(source)) if source[i].strip()=='PY')
          Path('/tmp/v2.py').write_text(textwrap.dedent('\n'.join(source[start+1:end]))+'\n')
          subprocess.run(['python3','/tmp/v2.py'],check=True)
          p=Path('showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js'); t=p.read_text()
          pairs=[
            ("import { getHEarthRun8ER2CanonicalLiveRenderPackage } from './live-render-package.run8e-r2.canonical.js';","import { getHEarthOW01CanonicalLiveRenderPackageOccurrence } from './live-render-package.run8e-r2.canonical.js';"),
            ("const LOGICAL_ID = 'H_EARTH_RUN_8E_R2_LIVE_RENDER_PACKAGE_9BD0B898';\nconst RUNTIME_ID = LOGICAL_ID;","const RUNTIME_OCCURRENCE_ID = 'H_EARTH_OW01_GRATITUDE_COASTAL_ENTRY_LIVE_RENDER_PACKAGE_OCCURRENCE_001';"),
            ("  const renderPackage = getHEarthRun8ER2CanonicalLiveRenderPackage();","  const renderPackage = getHEarthOW01CanonicalLiveRenderPackageOccurrence();"),
            ("  if (renderPackage.packageIdentity !== RUNTIME_ID) throw new Error(`R3C_RUNTIME_PACKAGE_IDENTITY_MISMATCH:${renderPackage.packageIdentity}`);","  if (renderPackage.packageOccurrenceId !== RUNTIME_OCCURRENCE_ID) throw new Error(`R3C_RUNTIME_PACKAGE_OCCURRENCE_MISMATCH:${renderPackage.packageOccurrenceId}`);")]
          for old,new in pairs:
            if t.count(old)!=1: raise SystemExit(f'PAIR_COUNT:{t.count(old)}:{old[:80]}')
            t=t.replace(old,new)
          p.write_text(t)
          PY
      - name: Verify new occurrence remains valid
        run: |
          node --input-type=module <<'NODE'
          import { buildHEarthRun8ENeutralPackage } from './showroom/globe/h-earth/render/run8e-successor-environment.js';
          import { getHEarthOW01CanonicalLiveRenderPackageOccurrence } from './showroom/globe/h-earth/render/live-render-package.run8e-r2.canonical.js';
          import { createHEarthRun8ER2DCanonicalGPUUploadViews, evaluateHEarthRun8ER2DCanonicalGPUUploadViews } from './showroom/globe/h-earth/render/gpu-upload-views.run8e-r2d.js';
          const historical=buildHEarthRun8ENeutralPackage();
          const current=buildHEarthRun8ENeutralPackage({compositionMode:'CONTENT_ADDRESSED_CURRENT_TERRAIN'});
          const pkg=getHEarthOW01CanonicalLiveRenderPackageOccurrence();
          const gpu=evaluateHEarthRun8ER2DCanonicalGPUUploadViews(createHEarthRun8ER2DCanonicalGPUUploadViews(pkg));
          console.log(JSON.stringify({historicalOk:historical.ok,historicalIssues:historical.issues,currentOk:current.ok,occurrence:pkg.packageOccurrenceId,identity:pkg.packageIdentity,primitiveCount:pkg.primitiveCount,roleCounts:pkg.roleCounts,gpu},null,2));
          if(historical.ok===true||current.ok!==true||pkg.eligible!==true||gpu.eligible!==true) process.exit(1);
          NODE
      - name: Install browser harness
        run: |
          mkdir -p /tmp/ow01-v3
          npm --prefix /tmp/ow01-v3 init -y >/dev/null
          npm --prefix /tmp/ow01-v3 install playwright@1.55.0 >/dev/null
          /tmp/ow01-v3/node_modules/.bin/playwright install --with-deps chromium >/dev/null
      - name: Serve repaired workspace
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ow01-v3-server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/showroom/globe/h-earth/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/showroom/globe/h-earth/ >/dev/null
      - name: Capture repaired default-route startup state
        run: |
          cat >/tmp/ow01-v3/diagnose.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const page=await browser.newPage({viewport:{width:1440,height:900},hasTouch:true});
          const consoleMessages=[],pageErrors=[],requestFailures=[];
          page.on('console',m=>consoleMessages.push(`${m.type()}:${m.text()}`));
          page.on('pageerror',e=>pageErrors.push(String(e)));
          page.on('requestfailed',r=>requestFailures.push(`${r.url()} :: ${r.failure()?.errorText??'unknown'}`));
          const response=await page.goto('http://127.0.0.1:4173/showroom/globe/h-earth/',{waitUntil:'domcontentloaded',timeout:120000});
          await page.waitForTimeout(12000);
          const state=await page.evaluate(()=>{
            const root=document.getElementById('h-earth-functional-landscape-route');
            const api=window.H_EARTH_RUN8E_PUBLIC_ROUTE;
            return {url:location.href,rootDataset:root?{...root.dataset}:null,apiPresent:!!api,apiReady:api?.ready??null,receipt:api?.getReceipt?.()??null,canvasCount:document.querySelectorAll('canvas').length,bodyText:document.body.innerText.slice(0,8000)};
          });
          await page.screenshot({path:'/tmp/ow01-v3/startup.png'});
          console.log('OW01_REPAIRED_STARTUP_STATE='+JSON.stringify({status:response?.status(),state,consoleMessages,pageErrors,requestFailures},null,2));
          await browser.close();
          NODE
          cd /tmp/ow01-v3 && node diagnose.mjs
      - name: Upload startup screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ow01-repaired-startup-state
          path: /tmp/ow01-v3/startup.png
          retention-days: 30
