name: Compass Gen1526 Candidate Browser Qualification

on:
  pull_request:
    paths:
      - 'assets/compass/compass.identity-3d.js'
      - 'assets/compass/compass.brain-scene.js'
      - '.github/ai-router/projects/compass/verify-performance-successor.mjs'
      - '.github/ai-router/projects/compass/verify-display-continuity.v1.mjs'
      - '.github/workflows/compass-performance-successor-validation.yml'
      - '.github/workflows/compass-carousel-successor-live-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GEN1526_GOVERNING_HEAD: f8eefd20fc1cdcdc777e070f008bb2e2b8580da1
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  COMPASS_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  COMPASS_PERFORMANCE_OUTPUT: /tmp/compass-gen1526-performance.json
  COMPASS_VERIFICATION_OUTPUT: /tmp/compass-gen1526-display.json

jobs:
  qualify-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact checkout and static Gen1526 contract
        run: |
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$GEN1526_GOVERNING_HEAD" "$EXPECTED_HEAD"
          git diff --quiet "$GEN1526_GOVERNING_HEAD" -- assets/compass/compass.crystals.js
          node .github/ai-router/projects/compass/verify-performance-successor.mjs
          node .github/ai-router/projects/compass/verify-display-continuity.v1.mjs
          jq -e '.result == "PASS_CLOSED" and .lockGeneration == 1526' /tmp/compass-gen1526-performance.json >/dev/null
          jq -e '.result == "PASS_CLOSED" and .lockGeneration == 1526' /tmp/compass-gen1526-display.json >/dev/null
      - name: Install browser runtime
        env:
          npm_config_package_lock: 'false'
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Start isolated candidate server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/compass-gen1526-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
      - name: Qualify surfaces and profile tablet scheduler
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const candidate=process.env.EXPECTED_HEAD,base=`http://127.0.0.1:4173/?candidate=${candidate}`;
          const checks=[],metrics={},controls={};
          const check=(id,pass,evidence)=>checks.push({id,pass:Boolean(pass),evidence});
          const measure=async page=>page.evaluate(async()=>{const a=[];let last=performance.now();for(let i=0;i<90;i++)await new Promise(r=>requestAnimationFrame(now=>{a.push(now-last);last=now;r()}));const s=a.slice(5).sort((x,y)=>x-y);return{median:Number((s[Math.floor(s.length*.5)]||999).toFixed(2)),p95:Number((s[Math.floor(s.length*.95)]||999).toFixed(2)),samples:s.length}});
          const browser=await chromium.launch({headless:true});
          for(const [name,width,height,reduced] of [['desktop',1440,900,false],['tablet',820,1180,false],['phone',390,844,false],['reduced',820,1180,true]]){
            const controlContext=await browser.newContext({viewport:{width,height},reducedMotion:reduced?'reduce':'no-preference'});const control=await controlContext.newPage();await control.setContent('<!doctype html><main>control</main>');await control.waitForTimeout(250);controls[name]=await measure(control);await controlContext.close();
            const context=await browser.newContext({viewport:{width,height},reducedMotion:reduced?'reduce':'no-preference'});const page=await context.newPage(),errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(`${base}&surface=${name}`,{waitUntil:'domcontentloaded',timeout:30000});await page.waitForFunction(()=>globalThis.DGB_COMPASS_IDENTITY_3D_GEN1524?.mounted===true,{timeout:15000});await page.waitForTimeout(1800);
            const evidence=await page.evaluate(()=>{const spatial=document.querySelector('[data-compass-spatial-instrument]'),craft=document.querySelector('canvas[data-compass-spacecraft-layer]'),brain=document.querySelector('[data-human-brain] canvas')||document.querySelector('canvas[data-brain-contract]'),identity=globalThis.DGB_COMPASS_IDENTITY_3D_GEN1524,renderer=globalThis.DGB_UPSTREAM_COMPASS_RENDERER,rr=renderer?.receipt?.()||globalThis.DGB_UPSTREAM_COMPASS_RENDERER_RECEIPT||null;return{provenance:identity?.provenance,spatial:{renderer:spatial?.dataset.compassSpatialRenderer,canvasVisible:spatial?.querySelector('canvas[data-upstream-compass-canvas]')?.dataset.upstreamCompassCanvasVisible},craft:{present:Boolean(craft),display:craft?getComputedStyle(craft).display:null,designId:craft?.dataset.designId,adoption:craft?.dataset.adoption,tier:craft?.dataset.performanceTier,policy:craft?.dataset.performancePolicy},brain:{present:Boolean(brain),topology:brain?.dataset.brainTopology,bulbs:brain?.dataset.brainPosteriorBulbs,material:brain?.dataset.brainMaterial,tier:brain?.dataset.brainPerformanceTier},cardinals:document.querySelectorAll('[data-cardinal-id]').length,rooms:document.querySelectorAll('[data-compass-room-declarations] [data-compass-room]').length,overflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth,rendererReceipt:rr?{firstEnhancedFrameCompleted:rr.firstEnhancedFrameCompleted,lastWebGLError:rr.lastWebGLError}:null}});
            const frame=await measure(page);metrics[name]=frame;await page.screenshot({path:`/tmp/compass-gen1526-${name}.png`,fullPage:true});
            check(`${name}_NO_PAGE_ERRORS`,errors.length===0,errors);check(`${name}_CARDINAL_AND_ROOM_FLOOR`,evidence.cardinals===4&&evidence.rooms===19,evidence);check(`${name}_NO_HORIZONTAL_OVERFLOW`,evidence.overflow<=2,evidence.overflow);check(`${name}_SPATIAL_COMPASS_RENDERED`,evidence.spatial.renderer==='upstream-authoritative-webgl'&&evidence.spatial.canvasVisible==='true'&&evidence.rendererReceipt?.firstEnhancedFrameCompleted===true&&evidence.rendererReceipt?.lastWebGLError===0,evidence.spatial);check(`${name}_LAWS_PROVENANCE`,evidence.provenance?.designId==='DGB_SCOUTCRAFT_01'&&evidence.provenance?.adoption==='DIRECT_CANONICAL_GEOMETRY_MODULE_CONSUMPTION',evidence.provenance);if(reduced||width<=720)check(`${name}_SPACECRAFT_SUSPENDED`,!evidence.craft.present||evidence.craft.display==='none',evidence.craft);if(evidence.brain.present)check(`${name}_BRAIN_ANATOMY`,evidence.brain.topology==='CONTINUOUS_MIDBRAIN_PONS_MEDULLA_SINGLE_POSTERIOR_INFERIOR_CEREBELLAR_MASS'&&evidence.brain.bulbs==='none'&&evidence.brain.material==='NATIVE_ROSE_FLESH_V1',evidence.brain);check(`${name}_FRAME_CADENCE`,frame.median<=18.5&&frame.p95<=26,{targetMs:16.7,...frame,runnerControl:controls[name]});await context.close();
          }
          const profileContext=await browser.newContext({viewport:{width:820,height:1180},reducedMotion:'no-preference'});
          await profileContext.addInitScript(()=>{const stats=new Map(),source=()=>{const s=String(new Error().stack||'').split('\n').slice(2);return s.find(x=>x.includes('127.0.0.1:4173'))||s[0]||'unknown'},record=(kind,key,d)=>{const id=`${kind}|${key}`,r=stats.get(id)||{kind,source:key,calls:0,totalMs:0,maxMs:0,over8:0,over16:0};r.calls++;r.totalMs+=d;r.maxMs=Math.max(r.maxMs,d);if(d>8)r.over8++;if(d>16)r.over16++;stats.set(id,r)};const raf=window.requestAnimationFrame.bind(window);window.requestAnimationFrame=cb=>{const key=source();return raf(ts=>{const t=performance.now();try{return cb(ts)}finally{record('raf',key,performance.now()-t)}})};const st=window.setTimeout.bind(window);window.setTimeout=(cb,ms,...args)=>{const key=source();if(typeof cb!=='function')return st(cb,ms,...args);return st((...inner)=>{const t=performance.now();try{return cb(...inner)}finally{record('timeout',key,performance.now()-t)}},ms,...args)};const si=window.setInterval.bind(window);window.setInterval=(cb,ms,...args)=>{const key=source();if(typeof cb!=='function')return si(cb,ms,...args);return si((...inner)=>{const t=performance.now();try{return cb(...inner)}finally{record('interval',key,performance.now()-t)}},ms,...args)};window.__DGB_SCHEDULER_PROFILE__=()=>Array.from(stats.values()).map(x=>({...x,totalMs:Number(x.totalMs.toFixed(3)),maxMs:Number(x.maxMs.toFixed(3))})).sort((a,b)=>b.totalMs-a.totalMs).slice(0,80)});
          const profilePage=await profileContext.newPage();await profilePage.goto(`${base}&surface=tablet&profile=scheduler`,{waitUntil:'domcontentloaded',timeout:30000});await profilePage.waitForFunction(()=>globalThis.DGB_COMPASS_IDENTITY_3D_GEN1524?.mounted===true,{timeout:15000});await profilePage.waitForTimeout(5000);const schedulerProfile=await profilePage.evaluate(()=>globalThis.__DGB_SCHEDULER_PROFILE__?.()||[]);await profileContext.close();await browser.close();
          const failures=checks.filter(x=>!x.pass),receipt={schema:'COMPASS_CONTINUOUS_RENDERERS_GEN1526_BROWSER_RECEIPT_v7_SCHEDULER_PROFILE',operationId:'COMPASS_CONTINUOUS_RENDERERS_PERFORMANCE_CONTINUATION_20260817_008',lockGeneration:1526,governingHead:process.env.GEN1526_GOVERNING_HEAD,candidateHead:candidate,targetFrameBudgetMs:16.7,result:failures.length?'FAIL_CLOSED':'PASS_CLOSED',metrics,runnerControls:controls,schedulerProfile,checks,failures:failures.map(x=>x.id)};fs.writeFileSync('/tmp/compass-gen1526-browser.json',JSON.stringify(receipt,null,2)+'\n');console.log(JSON.stringify(receipt,null,2));if(failures.length)process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-gen1526-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/compass-gen1526-performance.json
            /tmp/compass-gen1526-display.json
            /tmp/compass-gen1526-browser.json
            /tmp/compass-gen1526-*.png
            /tmp/compass-gen1526-server.log
          retention-days: 90
