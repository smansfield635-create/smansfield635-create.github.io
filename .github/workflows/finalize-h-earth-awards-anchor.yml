name: Finalize H-Earth Awards media anchor

on:
  push:
    branches:
      - agent/awards-h-earth-self-contained-media-repair
    paths:
      - '.github/workflows/finalize-h-earth-awards-anchor.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/awards-h-earth-self-contained-media-repair
          fetch-depth: 0

      - name: Refresh exact experience file digests
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          page = Path('showroom/globe/h-earth/awards/index.html')
          media = Path('showroom/globe/h-earth/awards/media/diamond-gate-h-earth-awards-18s-vivaldi.mp4')
          receipt_path = Path('h-earth-3d/experience-anchor/receipts/AWARDS_COMPASS_VIDEO_20260815_001.json')

          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          receipt = json.loads(receipt_path.read_text())
          receipt['experienceFiles'] = [
              {'path': str(page), 'sha256': sha256(page)},
              {'path': str(media), 'sha256': sha256(media)}
          ]
          receipt_path.write_text(json.dumps(receipt, indent=2) + '\n')
          print('page_sha256=' + receipt['experienceFiles'][0]['sha256'])
          print('media_sha256=' + receipt['experienceFiles'][1]['sha256'])
          PY

      - name: Commit refreshed anchor receipt and retire finalizer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add h-earth-3d/experience-anchor/receipts/AWARDS_COMPASS_VIDEO_20260815_001.json
          git rm .github/workflows/finalize-h-earth-awards-anchor.yml
          git commit -m 'Refresh Awards self-contained media anchor receipt'
          git push origin HEAD:agent/awards-h-earth-self-contained-media-repair
