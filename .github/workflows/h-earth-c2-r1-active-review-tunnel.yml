name: H-Earth C2-R1 Active Complete-World Review

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/h-earth-c2-r1-active-review-tunnel.yml'

concurrency:
  group: h-earth-c2-r1-active-review-tunnel
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  publish-active-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    env:
      SERVE_COMMIT: 1e16d25ad83f891e14fdc347dca9306032f9cd78
      VERIFIED_PRODUCT_HEAD: a699c5a64e2bf54d950a69c839c3d9ee41b6514f
      REVIEW_ENTRY: preview/h-earth/c2-r1/a699c5a64e2bf54d950a69c839c3d9ee41b6514f/index.html
      KEY_MODULE: preview/h-earth/c2-r1/a699c5a64e2bf54d950a69c839c3d9ee41b6514f/_source/h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/complete-world.js
      RENDER_MODULE: preview/h-earth/c2-r1/a699c5a64e2bf54d950a69c839c3d9ee41b6514f/_source/h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/complete-world-persistent-renderer.js
      LOCAL_ORIGIN: http://127.0.0.1:4188
      SESSION_SECONDS: '7200'
      TARGET_PR: '418'
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out immutable publication commit
        uses: actions/checkout@v4
        with:
          ref: 1e16d25ad83f891e14fdc347dca9306032f9cd78
          fetch-depth: 0

      - name: Verify exact publication and review carriers
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SERVE_COMMIT"
          test -f "$REVIEW_ENTRY"
          test -f "$KEY_MODULE"
          test -f "$RENDER_MODULE"
          test -f preview/h-earth/c2-r1/a699c5a64e2bf54d950a69c839c3d9ee41b6514f/byte-manifest.json
          test -f preview/h-earth/c2-r1/a699c5a64e2bf54d950a69c839c3d9ee41b6514f/byte-manifest.sha256

      - name: Install browser and tunnel runtime
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
          curl --fail --location --retry 5 --retry-all-errors \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            --output /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version
          sha256sum /tmp/cloudflared | tee /tmp/cloudflared.sha256

      - name: Launch verify publish and hold active occurrence
        run: |
          set -euo pipefail
          cleanup() {
            if [ -f /tmp/cloudflared.pid ]; then kill "$(cat /tmp/cloudflared.pid)" 2>/dev/null || true; fi
            if [ -f /tmp/origin.pid ]; then kill "$(cat /tmp/origin.pid)" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          python3 -m http.server 4188 --bind 127.0.0.1 > /tmp/origin.log 2>&1 &
          echo $! > /tmp/origin.pid

          local_ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$LOCAL_ORIGIN/$REVIEW_ENTRY" --output /tmp/local-index.html; then
              local_ready=true
              break
            fi
            sleep 1
          done
          test "$local_ready" = true
          test -s /tmp/local-index.html

          /tmp/cloudflared tunnel --url "$LOCAL_ORIGIN" --no-autoupdate --protocol http2 > /tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cloudflared.pid

          public_base=''
          for attempt in $(seq 1 120); do
            public_base="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 || true)"
            if [ -n "$public_base" ]; then break; fi
            sleep 1
          done
          if [ -z "$public_base" ]; then
            cat /tmp/cloudflared.log >&2
            echo DIRECT_TUNNEL_PUBLIC_BASE_URL_NOT_CREATED >&2
            exit 1
          fi

          occurrence_url="${public_base}/${REVIEW_ENTRY}"
          public_ready=false
          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error "$occurrence_url" --output /tmp/public-index.html \
              && curl --fail --silent --show-error "${public_base}/${KEY_MODULE}" --output /tmp/public-complete-world.js \
              && curl --fail --silent --show-error "${public_base}/${RENDER_MODULE}" --output /tmp/public-renderer.js; then
              public_ready=true
              break
            fi
            sleep 1
          done
          if [ "$public_ready" != true ]; then
            cat /tmp/cloudflared.log >&2
            echo DIRECT_TUNNEL_PUBLIC_DOCUMENT_UNREACHABLE >&2
            exit 1
          fi

          curl --fail --silent --show-error --head "$occurrence_url" | tee /tmp/public-index.headers
          curl --fail --silent --show-error --head "${public_base}/${KEY_MODULE}" | tee /tmp/public-js.headers
          grep -Eiq '^content-type: *text/html' /tmp/public-index.headers
          grep -Eiq '^content-type: *(text|application)/(javascript|ecmascript)' /tmp/public-js.headers

          cmp --silent "$REVIEW_ENTRY" /tmp/public-index.html
          cmp --silent "$KEY_MODULE" /tmp/public-complete-world.js
          cmp --silent "$RENDER_MODULE" /tmp/public-renderer.js

          cat > /tmp/verify-public.mjs <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const url = process.env.OCCURRENCE_URL;
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 412, height: 915 }, deviceScaleFactor: 1, isMobile: true, hasTouch: true });
          const page = await context.newPage();
          const consoleErrors = [];
          const pageErrors = [];
          const requestFailures = [];
          const httpFailures = [];
          page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()); });
          page.on('pageerror', error => pageErrors.push(error.message));
          page.on('requestfailed', request => requestFailures.push({ url: request.url(), failure: request.failure()?.errorText ?? 'UNKNOWN' }));
          page.on('response', response => { if (response.status() >= 400) httpFailures.push({ url: response.url(), status: response.status() }); });

          await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 180000 });
          await page.waitForFunction(() => {
            const api = globalThis.H_EARTH_C2_R1_COMPLETE_WORLD;
            return api?.ready === true || api?.failed === true;
          }, null, { timeout: 720000 });

          const result = await page.evaluate(() => {
            const api = globalThis.H_EARTH_C2_R1_COMPLETE_WORLD;
            const receipt = api?.ready === true ? api.getReceipt() : null;
            const failure = api?.failed === true ? api.getFailureReceipt() : null;
            const canvas = document.getElementById('complete-world-canvas');
            return {
              ready: api?.ready === true,
              failed: api?.failed === true,
              receipt,
              failure,
              webgl2ContextPresent: Boolean(canvas?.getContext('webgl2')),
              rootReady: document.getElementById('complete-world-root')?.dataset.ready === 'true'
            };
          });

          await browser.close();
          const receipt = result.receipt;
          const counters = receipt?.packageBinding?.counters;
          const renderer = receipt?.renderer;
          const valid = result.ready === true
            && result.failed === false
            && result.rootReady === true
            && result.webgl2ContextPresent === true
            && receipt?.packageIdentity === 'H_EARTH_C2_R1_COMPLETE_WORLD_PACKAGE_218F37AE'
            && receipt?.packageContentDigest === 'fnv1a32:218f37ae'
            && counters?.candidateSampleFailureCount === 0
            && counters?.boundTerrainVertexCount === 10419
            && counters?.boundShorelineVertexCount === 299
            && renderer?.counters?.contextCreationCount === 1
            && renderer?.counters?.rendererInitializationCount === 1
            && renderer?.counters?.visiblePresentationCount >= 1
            && consoleErrors.length === 0
            && pageErrors.length === 0
            && requestFailures.length === 0
            && httpFailures.length === 0;

          const output = { valid, url, result, consoleErrors, pageErrors, requestFailures, httpFailures };
          fs.writeFileSync('/tmp/public-browser-receipt.json', JSON.stringify(output, null, 2));
          if (!valid) {
            console.error(JSON.stringify(output, null, 2));
            process.exit(1);
          }
          NODE

          OCCURRENCE_URL="$occurrence_url" node /tmp/verify-public.mjs

          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          expected_expiration="$(date -u -d "+120 minutes" +%Y-%m-%dT%H:%M:%SZ)"
          sha256sum /tmp/public-index.html /tmp/public-complete-world.js /tmp/public-renderer.js | tee /tmp/public-byte-digests.sha256
          printf '%s\n' "$occurrence_url" | tee /tmp/complete-world-active-url.txt

          body="VERIFIED_COMPLETE_WORLD_REVIEW_OCCURRENCE = ACTIVE_USER_ACCESSIBLE_ONE_CLICK_URL

Exact verified product head: \`$VERIFIED_PRODUCT_HEAD\`
Publication commit served: \`$SERVE_COMMIT\`
Started: \`$started_at\`
Expected expiration: \`$expected_expiration\`

[OPEN THE COMPLETE H-EARTH WORLD REVIEW]($occurrence_url)

Public HTML/JavaScript MIME, exact byte correspondence, WebGL2 startup, package identity, visible frame, and zero console/page/request/HTTP failures verified before this link was posted."
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR}/comments" -f body="$body"

          deadline=$((SECONDS + SESSION_SECONDS))
          while [ "$SECONDS" -lt "$deadline" ]; do
            curl --fail --silent --show-error --retry 3 "$occurrence_url" --output /dev/null
            sleep 30
          done
