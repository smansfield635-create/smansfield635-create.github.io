name: Build Awards aggressive media crop

on:
  push:
    branches:
      - agent/awards-aggressive-media-crop-20260815
    paths:
      - '.github/workflows/build-awards-aggressive-media-crop.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/awards-aggressive-media-crop-20260815
          fetch-depth: 0

      - name: Apply stronger live-page crop
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('showroom/globe/h-earth/awards/index.html')
          s = p.read_text()
          old = '.lens-media{width:min(560px,100%);max-width:100%;margin:22px auto 18px}.lens-media[hidden]{display:none}.lens-media-frame{position:relative;aspect-ratio:4/5;overflow:hidden;border:1px solid rgba(173,151,236,.34);border-radius:20px;background:#000;box-shadow:0 18px 55px rgba(0,0,0,.35)}.lens-media iframe,.lens-media video{position:absolute;inset:0;width:100%;height:100%;border:0}.lens-media video{display:block;object-fit:cover;object-position:center 52%;background:#000;cursor:pointer;transform:scale(1.12);transform-origin:center center}'
          new = '.lens-media{width:min(520px,100%);max-width:100%;margin:22px auto 18px}.lens-media[hidden]{display:none}.lens-media-frame{position:relative;aspect-ratio:4/5;overflow:hidden;border:1px solid rgba(173,151,236,.34);border-radius:20px;background:#000;box-shadow:0 18px 55px rgba(0,0,0,.35)}.lens-media iframe,.lens-media video{position:absolute;inset:0;width:100%;height:100%;border:0}.lens-media video{display:block;object-fit:cover;object-position:center 60%;background:#000;cursor:pointer;transform:scale(1.48);transform-origin:center center}'
          if old not in s:
              raise SystemExit('expected live media windowing CSS not found; refusing drifted mutation')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify bounded page-only mutation
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'diamond-gate-compass-mirrorland-36s.mp4' showroom/globe/h-earth/awards/index.html
          grep -F 'diamond-gate-h-earth-audralia-30s-vivaldi.mp4' showroom/globe/h-earth/awards/index.html
          grep -F 'transform:scale(1.48)' showroom/globe/h-earth/awards/index.html
          grep -F 'object-position:center 60%' showroom/globe/h-earth/awards/index.html
          test "$(git diff --name-only | tr -d '\r')" = 'showroom/globe/h-earth/awards/index.html'

      - name: Commit page-only correction and retire builder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add showroom/globe/h-earth/awards/index.html
          git rm .github/workflows/build-awards-aggressive-media-crop.yml
          git commit -m 'Crop Awards S26 reels past browser chrome'
          git push origin HEAD:agent/awards-aggressive-media-crop-20260815

# armed-after-install
