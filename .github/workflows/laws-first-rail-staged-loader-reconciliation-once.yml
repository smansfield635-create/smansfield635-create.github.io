name: Laws FIRST rail staged-loader reconciliation once

on:
  pull_request:
    types: [synchronize, ready_for_review]
    paths:
      - '.github/workflows/laws-first-rail-staged-loader-reconciliation-once.yml'

permissions:
  contents: write

jobs:
  reconcile-staged-loader:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - name: Check out exact correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/laws-first-indicator-cache-bust-001
          fetch-depth: 0

      - name: Reconcile Compass-zone preload corridor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          html_path = Path('laws/index.html')
          html = html_path.read_text()
          old = '''    observeSection(
      "#laws-orbit",
      reason => {
        runWhenIdle(
          () => {
            loadOrbitSystems(reason);
            loadInteractionSystems("orbit-visible");
          },
          500
        );
      },
      {
        rootMargin:
          "620px 0px"
      }
    );'''
          new = '''    observeSection(
      ".laws-compass-primary",
      reason => {
        runWhenIdle(
          () => {
            loadOrbitSystems(reason);
            loadInteractionSystems("compass-zone-proximity");
          },
          500
        );
      },
      {
        rootMargin:
          "1200px 0px"
      }
    );'''
          if old not in html:
              raise SystemExit('bounded staged-loader observation block not found')
          html = html.replace(old, new, 1)

          architecture_marker = 'data-laws-first-rail-architecture="persistent-compass-zone-v2"'
          preload_marker = 'data-laws-first-rail-preload="compass-zone-proximity-1200px"'
          if preload_marker not in html:
              if architecture_marker not in html:
                  raise SystemExit('FIRST rail architecture marker not found')
              html = html.replace(architecture_marker, architecture_marker + ' ' + preload_marker, 1)
          html_path.write_text(html)

          verifier_path = Path('scripts/verify-laws-first-rail-architecture.mjs')
          verifier = verifier_path.read_text()
          source_marker = "  assert.ok(html.includes('data-laws-first-rail-architecture=\"persistent-compass-zone-v2\"'), 'Architecture marker missing.');"
          additions = """  assert.ok(html.includes('data-laws-first-rail-preload=\"compass-zone-proximity-1200px\"'), 'Compass-zone preload marker missing.');
          assert.ok(html.includes('observeSection(\\n      \".laws-compass-primary\"'), 'Staged loader does not observe the Compass zone.');
          assert.ok(html.includes('loadInteractionSystems(\"compass-zone-proximity\")'), 'Interaction preload reason missing.');
          assert.ok(html.includes('\"1200px 0px\"'), 'Compass-zone preload corridor is not 1200px.');""".replace('          ', '')
          if 'Compass-zone preload marker missing.' not in verifier:
              if source_marker not in verifier:
                  raise SystemExit('architecture verifier source marker not found')
              verifier = verifier.replace(source_marker, source_marker + '\n' + additions, 1)
          verifier_path.write_text(verifier)

          control_path = Path('laws/control-plane/renewal/laws-first-persistent-rail-and-tablet-reflow-v2.json')
          control = json.loads(control_path.read_text())
          guarantees = control.setdefault('guarantees', [])
          guarantee = 'COMPASS_ZONE_PRELOAD_CORRIDOR_PRESERVED_AFTER_REFLOW'
          if guarantee not in guarantees:
              guarantees.append(guarantee)
          control['staged_loader_observation_target'] = '.laws-compass-primary'
          control['staged_loader_root_margin'] = '1200px 0px'
          control['staged_loader_interaction_reason'] = 'compass-zone-proximity'
          control_path.write_text(json.dumps(control, indent=2) + '\n')
          PY

      - name: Commit staged-loader reconciliation
        shell: bash
        run: |
          git add laws/index.html scripts/verify-laws-first-rail-architecture.mjs \
            laws/control-plane/renewal/laws-first-persistent-rail-and-tablet-reflow-v2.json
          git config user.name "laws-rail-loader-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Preserve Compass staged loading after hero reflow"
          git push origin HEAD:agent/laws-first-indicator-cache-bust-001
