name: H-Earth OW01 Live Package Occurrence Repair v3

on:
  push:
    branches:
      - control-plane-delivery/h-earth-ow01-public-product-20260814-014
    paths:
      - '.github/workflows/h-earth-ow01-live-package-occurrence-repair-v3.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve repaired terrain identity
        run: |
          set -euo pipefail
          test "$(git hash-object h-earth-3d/terrain/h-earth.terrain-field.js)" = "c32431f4c0b0eff7812fca24daacac90bd4e7020"
      - name: Apply proven v2 occurrence transform
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap, subprocess
          source=Path('.github/workflows/h-earth-ow01-live-package-occurrence-repair-v2.yml').read_text().splitlines()
          start=next(i for i,line in enumerate(source) if "python3 - <<'PY'" in line)
          end=next(i for i in range(start+1,len(source)) if source[i].strip()=='PY')
          script=textwrap.dedent('\n'.join(source[start+1:end]))+'\n'
          Path('/tmp/ow01-v2-transform.py').write_text(script)
          subprocess.run(['python3','/tmp/ow01-v2-transform.py'],check=True)
          PY
      - name: Bind default promoted additive renderer to OW01 occurrence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js')
          t=p.read_text()
          def once(old,new):
              global t
              c=t.count(old)
              if c!=1: raise SystemExit(f'ADDITIVE_EXACT_REPLACEMENT_COUNT:{c}:{old[:100]}')
              t=t.replace(old,new)
          once("import { getHEarthRun8ER2CanonicalLiveRenderPackage } from './live-render-package.run8e-r2.canonical.js';",
               "import { getHEarthOW01CanonicalLiveRenderPackageOccurrence } from './live-render-package.run8e-r2.canonical.js';")
          once("const LOGICAL_ID = 'H_EARTH_RUN_8E_R2_LIVE_RENDER_PACKAGE_9BD0B898';\nconst RUNTIME_ID = LOGICAL_ID;",
               "const RUNTIME_OCCURRENCE_ID = 'H_EARTH_OW01_GRATITUDE_COASTAL_ENTRY_LIVE_RENDER_PACKAGE_OCCURRENCE_001';")
          once("  const renderPackage = getHEarthRun8ER2CanonicalLiveRenderPackage();",
               "  const renderPackage = getHEarthOW01CanonicalLiveRenderPackageOccurrence();")
          once("  if (renderPackage.packageIdentity !== RUNTIME_ID) throw new Error(`R3C_RUNTIME_PACKAGE_IDENTITY_MISMATCH:${renderPackage.packageIdentity}`);",
               "  if (renderPackage.packageOccurrenceId !== RUNTIME_OCCURRENCE_ID) throw new Error(`R3C_RUNTIME_PACKAGE_OCCURRENCE_MISMATCH:${renderPackage.packageOccurrenceId}`);")
          p.write_text(t)
          PY
      - name: Verify historical truth and new package occurrence
        run: |
          node --input-type=module <<'NODE'
          import { buildHEarthRun8ENeutralPackage } from './showroom/globe/h-earth/render/run8e-successor-environment.js';
          import { getHEarthOW01LiveRenderPackageOccurrence, evaluateHEarthRun8ER2ImmutableLiveRenderPackage } from './showroom/globe/h-earth/render/live-render-package.run8e-r2.js';
          import { getHEarthOW01CanonicalLiveRenderPackageOccurrence } from './showroom/globe/h-earth/render/live-render-package.run8e-r2.canonical.js';
          import { createHEarthRun8ER2DCanonicalGPUUploadViews, evaluateHEarthRun8ER2DCanonicalGPUUploadViews } from './showroom/globe/h-earth/render/gpu-upload-views.run8e-r2d.js';
          const historical=buildHEarthRun8ENeutralPackage();
          const current=buildHEarthRun8ENeutralPackage({compositionMode:'CONTENT_ADDRESSED_CURRENT_TERRAIN'});
          const raw=getHEarthOW01LiveRenderPackageOccurrence();
          const rawEval=evaluateHEarthRun8ER2ImmutableLiveRenderPackage(raw);
          const canonical=getHEarthOW01CanonicalLiveRenderPackageOccurrence();
          const canonicalEval=evaluateHEarthRun8ER2ImmutableLiveRenderPackage(canonical);
          const views=createHEarthRun8ER2DCanonicalGPUUploadViews(canonical);
          const viewsEval=evaluateHEarthRun8ER2DCanonicalGPUUploadViews(views);
          const result={historical:{ok:historical.ok,issues:historical.issues},current:{ok:current.ok,primitiveCount:current.primitiveCount,vegetationPrimitiveCount:current.vegetationPrimitiveCount},occurrence:canonical.packageOccurrenceId,identity:canonical.packageIdentity,digest:canonical.contentDigest,primitiveCount:canonical.primitiveCount,roleCounts:canonical.roleCounts,rawEligible:raw.eligible,rawEvaluation:rawEval,canonicalEligible:canonical.eligible,canonicalEvaluation:canonicalEval,gpuViews:viewsEval};
          console.log(JSON.stringify(result,null,2));
          if(historical.ok===true) throw new Error('HISTORICAL_R2_COUNT_TRUTH_WAS_WEAKENED');
          if(current.ok!==true||raw.eligible!==true||rawEval.eligible!==true||canonical.eligible!==true||canonicalEval.eligible!==true||viewsEval.eligible!==true) process.exit(1);
          if(canonical.packageOccurrenceId!=='H_EARTH_OW01_GRATITUDE_COASTAL_ENTRY_LIVE_RENDER_PACKAGE_OCCURRENCE_001') process.exit(1);
          NODE
      - name: Install bounded browser harness
        run: |
          mkdir -p /tmp/ow01-v3
          npm --prefix /tmp/ow01-v3 init -y >/dev/null
          npm --prefix /tmp/ow01-v3 install playwright@1.55.0 >/dev/null
          /tmp/ow01-v3/node_modules/.bin/playwright install --with-deps chromium >/dev/null
      - name: Serve exact repaired candidate
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ow01-v3-server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/showroom/globe/h-earth/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/showroom/globe/h-earth/ >/dev/null
      - name: Prove default live route GPU presentation and interaction
        run: |
          cat >/tmp/ow01-v3/verify.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const context=await browser.newContext({viewport:{width:1440,height:900},hasTouch:true,isMobile:false});
          const page=await context.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push(`page:${String(e)}`));
          page.on('console',m=>{if(m.type()==='error'&&!/favicon/i.test(m.text()))errors.push(`console:${m.text()}`)});
          const response=await page.goto('http://127.0.0.1:4173/showroom/globe/h-earth/',{waitUntil:'domcontentloaded',timeout:120000});
          await page.waitForFunction(()=>document.getElementById('h-earth-functional-landscape-route')?.dataset.run8eReady==='true',{timeout:30000});
          await page.waitForTimeout(1500);
          const initial=await page.evaluate(()=>({url:location.href,routeReady:document.getElementById('h-earth-functional-landscape-route')?.dataset.run8eReady,apiReady:window.H_EARTH_RUN8E_PUBLIC_ROUTE?.ready===true,receipt:window.H_EARTH_RUN8E_PUBLIC_ROUTE?.getReceipt?.()??null}));
          const canvases=page.locator('canvas'); const count=await canvases.count(); let best=null;
          for(let i=0;i<count;i++){const box=await canvases.nth(i).boundingBox();if(box&&(!best||box.width*box.height>best.box.width*best.box.height))best={i,box};}
          if(!best) throw new Error('NO_INTERACTIVE_CANVAS');
          const x=best.box.x+best.box.width*.52,y=best.box.y+best.box.height*.52;
          await page.mouse.move(x,y); await page.mouse.down(); await page.mouse.move(x+90,y-25,{steps:10}); await page.mouse.up(); await page.mouse.wheel(0,-280); await page.waitForTimeout(1200);
          const final=await page.evaluate(()=>({gesture:document.getElementById('h-earth-functional-landscape-route')?.dataset.gestureUsed??null,receipt:window.H_EARTH_RUN8E_PUBLIC_ROUTE?.getReceipt?.()??null}));
          await page.screenshot({path:'/tmp/ow01-v3/default-live-route.png'});
          const initialFrames=initial.receipt?.liveGpu?.counters?.gpuFramebufferPresentationCount??0;
          const finalFrames=final.receipt?.liveGpu?.counters?.gpuFramebufferPresentationCount??0;
          const proposals=final.receipt?.intake?.counters?.navigationProposalCount??0;
          const selectedRenderer=final.receipt?.liveGpu?.selectedRendererPath??null;
          const fatal=errors.filter(x=>/R2_GPU_VIEW_SOURCE_INVALID|R3A_PACKAGE_REJECTED|R3A_GPU_VIEWS_REJECTED|R3C_RUNTIME_PACKAGE|R3C_INITIAL_PACKET_PACKAGE_MISMATCH|R3E2_LIVE_GPU_BINDING_NOT_READY/i.test(x));
          const result={status:response?.status(),initialUrl:initial.url,routeReady:initial.routeReady,apiReady:initial.apiReady,canvasCount:count,initialFrames,finalFrames,proposals,gesture:final.gesture,selectedRenderer,errors,fatal};
          console.log(JSON.stringify(result,null,2));
          await browser.close();
          if(response?.status()!==200||initial.apiReady!==true||initialFrames<1||finalFrames<=initialFrames||proposals<1||final.gesture!=='true'||fatal.length) process.exit(1);
          NODE
          cd /tmp/ow01-v3 && node verify.mjs
      - name: Commit bounded compatibility repair and remove transient carriers
        run: |
          set -euo pipefail
          git rm .github/workflows/h-earth-ow01-live-package-occurrence-repair.yml .github/workflows/h-earth-ow01-live-package-occurrence-repair-v2.yml .github/workflows/h-earth-ow01-live-package-occurrence-repair-v3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            showroom/globe/h-earth/render/run8e-successor-environment.js \
            h-earth-3d/integration/h-earth.run8e-successor-environment-transfer.js \
            showroom/globe/h-earth/render/live-render-package.run8e-r2.js \
            showroom/globe/h-earth/render/live-render-package.run8e-r2.canonical.js \
            showroom/globe/h-earth/render/live-renderer-contract.run8e-r3a.js \
            showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.js \
            showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js
          git commit -m 'OW01: qualify new live-render package occurrence [skip ci]'
          git push origin HEAD:control-plane-delivery/h-earth-ow01-public-product-20260814-014
