name: Laws celestial gateway CP2 construction

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/laws-celestial-gateway-cp2-construction.yml]

permissions:
  contents: write

jobs:
  construct:
    if: github.head_ref == 'agent/laws-celestial-gateway-cp2-execution-001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0bf5bcd63132d92fa6a4758a4f57ef2a6f524038
          fetch-depth: 0
      - name: Construct bounded Laws candidate
        env:
          TARGET_BRANCH: agent/laws-celestial-gateway-auxiliary-clusters-cp2-001
        run: |
          set -euo pipefail
          git checkout -B "$TARGET_BRANCH" 0bf5bcd63132d92fa6a4758a4f57ef2a6f524038
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          ROOT=Path('.')
          BUILD='LAWS_CELESTIAL_GATEWAY_AUXILIARY_CLUSTERS_20260729A'
          TOKEN=BUILD
          def read(p): return (ROOT/p).read_text(encoding='utf-8')
          def write(p,s): (ROOT/p).write_text(s,encoding='utf-8')
          def one(s,a,b,label):
              n=s.count(a)
              if n!=1: raise SystemExit(f'{label}: expected 1 occurrence, found {n}')
              return s.replace(a,b,1)

          # Controller: six cluster authorities and twenty-four child routes.
          p='laws/index.controller.js'; s=read(p)
          s=one(s,'  const DIRECTIONS = Object.freeze([\n    "flow",\n    "integrity",\n    "reality",\n    "structure"\n  ]);','  const DIRECTIONS = Object.freeze([\n    "flow",\n    "integrity",\n    "reality",\n    "structure",\n    "test",\n    "research"\n  ]);','controller directions')
          s=one(s,'  const DIRECTION_LABELS = Object.freeze({\n    flow: "Flow",\n    integrity: "Integrity",\n    reality: "Reality",\n    structure: "Structure"\n  });','  const DIRECTION_LABELS = Object.freeze({\n    flow: "Flow",\n    integrity: "Integrity",\n    reality: "Reality",\n    structure: "Structure",\n    test: "Test",\n    research: "Research"\n  });','controller labels')
          s=one(s,'      structure: Object.freeze([\n        0,\n        0,\n        HALF_SQRT_TWO,\n        HALF_SQRT_TWO\n      ])\n    });','      structure: Object.freeze([\n        0,\n        0,\n        HALF_SQRT_TWO,\n        HALF_SQRT_TWO\n      ]),\n\n      test: Object.freeze([0, 0, -0.3826834323650898, 0.9238795325112867]),\n      research: Object.freeze([0, 0, 0.3826834323650898, 0.9238795325112867])\n    });','controller gateway quaternions')
          s=s.replace('categoryCount: 4,\n      lawCount: 16,\n      routeCount: 16,','categoryCount: 6,\n      lawCount: 24,\n      routeCount: 24,')
          s=s.replace('DIRECTIONS.length === 4','DIRECTIONS.length === 6').replace('new Set(DIRECTIONS).size === 4','new Set(DIRECTIONS).size === 6')
          s=s.replace('directionCount: 4,','directionCount: 6,')
          for old,new in [('registry.lawRecords.length === 16','registry.lawRecords.length === 24'),('registry.lawRoutes.length === 16','registry.lawRoutes.length === 24'),('registry.lawById.size === 16','registry.lawById.size === 24'),('registry.lawByRoute.size === 16','registry.lawByRoute.size === 24'),('lawCount: 16,\n      routeCount: 16,','lawCount: 24,\n      routeCount: 24,')]: s=s.replace(old,new)
          s=s.replace('4 [data-laws-category] controls','6 [data-laws-category] controls').replace('- 16 declared law routes','- 24 declared child routes')
          write(p,s)

          # Crystals: cardinal reduction, geodesic solar/lunar gateways, six clusters.
          p='laws/index.crystals.js'; s=read(p)
          s=one(s,'  const DIRECTIONS = Object.freeze([\n    "flow",\n    "integrity",\n    "reality",\n    "structure"\n  ]);\n\n  const AUXILIARY_IDS = Object.freeze([\n    "test",\n    "research"\n  ]);','  const CARDINAL_IDS = Object.freeze([\n    "flow",\n    "integrity",\n    "reality",\n    "structure"\n  ]);\n\n  const GATEWAY_IDS = Object.freeze(["test", "research"]);\n  const DIRECTIONS = Object.freeze([...CARDINAL_IDS, ...GATEWAY_IDS]);\n  const AUXILIARY_IDS = Object.freeze([]);','crystals partition')
          s=s.replace('categoryScale:\n     0.96,','categoryScale:\n     0.768,').replace('focusedCategoryScale:\n     1.30,','focusedCategoryScale:\n     1.04,')
          s=s.replace('controls.length === 16','controls.length === 24').replace('expected: 16,','expected: 24,').replace('state.relocatedLawElements.length === 16','state.relocatedLawElements.length === 24').replace('.lawsCanonicalLawControlCount =\n       "16";','.lawsCanonicalLawControlCount =\n       "24";').replace('relocatedCanonicalLawCount:\n           16,','relocatedCanonicalLawCount:\n           24,')
          sphere='''\n\n  function createCelestialSphereMesh(options = {}) {\n    const segments=Math.max(12,options.segments||28), rings=Math.max(8,options.rings||18), radius=options.radius||0.64;\n    const color=options.color||[1,1,1], mode=options.mode==="solar"?"solar":"lunar";\n    const positions=[],normals=[],colors=[];\n    function point(ring,segment){\n      const v=ring/rings,u=segment/segments,phi=v*Math.PI,theta=u*Math.PI*2;\n      const nx=Math.sin(phi)*Math.cos(theta),ny=Math.cos(phi),nz=Math.sin(phi)*Math.sin(theta);\n      const relief=mode==="lunar"?1+0.035*Math.sin(theta*7+phi*3)*Math.sin(phi*9)-0.020*Math.max(0,Math.cos(theta*5-phi*8)):1+0.012*Math.sin(theta*11+phi*7);\n      const shade=mode==="solar"?0.86+0.14*Math.sin(theta*5+phi*9)**2:0.62+0.30*(ny*0.5+0.5)+0.08*Math.sin(theta*9-phi*4);\n      return {position:[nx*radius*relief,ny*radius*relief,nz*radius*relief],normal:normalizeVector([nx,ny,nz]),color:[clamp(color[0]*shade,0,1),clamp(color[1]*shade,0,1),clamp(color[2]*shade,0,1)]};\n    }\n    function push(v){positions.push(...v.position);normals.push(...v.normal);colors.push(...v.color);}\n    for(let ring=0;ring<rings;ring+=1){for(let segment=0;segment<segments;segment+=1){const next=(segment+1)%segments,a=point(ring,segment),b=point(ring+1,segment),c=point(ring+1,next),d=point(ring,next);push(a);push(b);push(c);push(a);push(c);push(d);}}\n    return Object.freeze({positions:new Float32Array(positions),normals:new Float32Array(normals),colors:new Float32Array(colors),vertexCount:positions.length/3});\n  }\n'''
          marker='\n  function lawColorForDirection(direction) {'
          if marker not in s: raise SystemExit('sphere insertion marker missing')
          s=s.replace(marker,sphere+marker,1)
          s=one(s,'  function lawColorForDirection(direction) {\n    if (direction === "flow") {\n      return PALETTE.lawFlow;\n    }\n\n    if (direction === "integrity") {\n      return PALETTE.lawIntegrity;\n    }\n\n    if (direction === "reality") {\n      return PALETTE.lawReality;\n    }\n\n    return PALETTE.lawStructure;\n  }','  function lawColorForDirection(direction) {\n    if (direction === "flow") return PALETTE.lawFlow;\n    if (direction === "integrity") return PALETTE.lawIntegrity;\n    if (direction === "reality") return PALETTE.lawReality;\n    if (direction === "structure") return PALETTE.lawStructure;\n    if (direction === "test") return PALETTE.test;\n    return PALETTE.research;\n  }','law color mapping')
          old='''    DIRECTIONS.forEach(direction => {\n      const warm =\n        direction === "reality" ||\n        direction === "structure";\n\n      meshes.set(\n        `category-${direction}`,\n        createDiamondStarMesh({\n          points: QUALITY.categorySegments,\n          radius: 0.72,\n          inner: 0.30,\n          depth: 0.42,\n          crown: 0.20,\n          color: PALETTE[direction],\n          warmth: warm ? 0.10 : 0.02\n        })\n      );\n\n      meshes.set(\n        `law-${direction}`,\n        createDiamondStarMesh({\n          points: QUALITY.lawSegments,\n          radius: 0.42,\n          inner: 0.20,\n          depth: 0.25,\n          crown: 0.10,\n          color: lawColorForDirection(direction),\n          warmth: warm ? 0.08 : 0.02\n        })\n      );\n    });'''
          new='''    DIRECTIONS.forEach(direction => {\n      const gateway=GATEWAY_IDS.includes(direction);\n      const warm=direction === "reality" || direction === "structure" || direction === "test";\n      meshes.set(`category-${direction}`, gateway ? createCelestialSphereMesh({segments:30,rings:20,radius:direction === "test" ? 0.68 : 0.64,color:PALETTE[direction],mode:direction === "test" ? "solar" : "lunar"}) : createDiamondStarMesh({points:QUALITY.categorySegments,radius:0.72,inner:0.30,depth:0.42,crown:0.20,color:PALETTE[direction],warmth:warm ? 0.10 : 0.02}));\n      meshes.set(`law-${direction}`,createDiamondStarMesh({points:gateway?8:QUALITY.lawSegments,radius:gateway?0.48:0.42,inner:gateway?0.21:0.20,depth:gateway?0.29:0.25,crown:gateway?0.13:0.10,color:lawColorForDirection(direction),warmth:warm?0.08:0.02}));\n    });'''
          s=one(s,old,new,'mesh loop')
          s=s.replace('            material:\n               "CATEGORY_IDLE",','            material:\n               direction === "test" ? "AUTHORITY_SOLAR" : direction === "research" ? "AUTHORITY_LUNAR" : "CATEGORY_IDLE",')
          mat='''    AUTHORITY_SOLAR:\n      Object.freeze({specular:1.30,rim:1.62,emissive:0.54,alpha:0.99,sparkle:0.18,halo:1.58,contrast:1.24}),\n\n    AUTHORITY_LUNAR:\n      Object.freeze({specular:0.72,rim:1.18,emissive:0.09,alpha:0.98,sparkle:0.05,halo:0.82,contrast:1.30}),\n\n'''
          mk='    LAW_IDLE:\n       Object.freeze({'
          if mk not in s: raise SystemExit('material marker missing')
          s=s.replace(mk,mat+mk,1)
          old='''        node.material =\n          primary\n            ? "CATEGORY_FOCUSED"\n            : "CATEGORY_IDLE";\n\n        const scale =\n          (\n            primary\n              ? QUALITY.focusedCategoryScale\n              : QUALITY.categoryScale\n          ) *\n          (\n            0.72 +\n            sphere.depth *\n              0.42\n          );'''
          new='''        const gateway=GATEWAY_IDS.includes(direction);\n        node.material=direction === "test" ? "AUTHORITY_SOLAR" : direction === "research" ? "AUTHORITY_LUNAR" : primary ? "CATEGORY_FOCUSED" : "CATEGORY_IDLE";\n        const scale=(gateway ? QUALITY.auxiliaryScale : primary ? QUALITY.focusedCategoryScale : QUALITY.categoryScale) * (gateway ? 0.78 + sphere.depth * 0.34 : 0.72 + sphere.depth * 0.42);'''
          s=one(s,old,new,'constellation targets')
          s,n=re.subn(r'\n\s{4}AUXILIARY_IDS\.forEach\(\n.*?\n\s{4}\);\n\s{2}\}', '\n  }', s, count=1, flags=re.S)
          if n!=1: raise SystemExit(f'aux target loop removal count={n}')
          old='''        const scale =\n          selected\n            ? QUALITY.selectedLawScale\n            : primary\n              ? QUALITY.primaryLawScale\n              : QUALITY.lawScale;'''
          new='''        const gatewayCluster=GATEWAY_IDS.includes(direction);\n        const scale=(selected ? QUALITY.selectedLawScale : primary ? QUALITY.primaryLawScale : QUALITY.lawScale) * (gatewayCluster ? 1.18 : 1);'''
          s=one(s,old,new,'cluster scale')
          write(p,s)

          # Interactions: six-authority orbit and stacked labels.
          p='laws/index.interactions.js'; s=read(p)
          s=s.replace('version:"1.3.0-six-node-test-research",build:"LAWS_SIX_NODE_TEST_RESEARCH_ARENA_20260729A"',f'version:"1.4.0-celestial-gateway-clusters",build:"{BUILD}"')
          s=one(s,'const D=Object.freeze(["flow","integrity","reality","structure"]);','const D=Object.freeze(["flow","integrity","reality","structure","test","research"]);','interaction directions')
          s=one(s,'const LABEL=Object.freeze({flow:"Flow",integrity:"Integrity",reality:"Reality",structure:"Structure"});','const LABEL=Object.freeze({flow:"Flow",integrity:"Integrity",reality:"Reality",structure:"Structure",test:"Test",research:"Research"});','interaction labels')
          s=one(s,'const LETTER=Object.freeze({flow:"F",integrity:"I",reality:"R",structure:"S"});','const LETTER=Object.freeze({flow:"F",integrity:"I",reality:"R",structure:"S",test:"T",research:"R"});','interaction letters')
          s=one(s,'const VECTOR=Object.freeze({flow:[0,1,0],integrity:[1,0,0],reality:[0,-1,0],structure:[-1,0,0]});','const VECTOR=Object.freeze({flow:[0,1,0],integrity:[1,0,0],reality:[0,-1,0],structure:[-1,0,0],test:[0.76,0,0.65],research:[-0.76,0,0.65]});','interaction vectors')
          s=s.replace('S.labels.size===4','S.labels.size===6').replace('S.lawLabels.size===16','S.lawLabels.size===24').replace('c.getCanonicalLawRecords().length!==16||c.getCanonicalLawRoutes().length!==16','c.getCanonicalLawRecords().length!==24||c.getCanonicalLawRoutes().length!==24')
          s=one(s,'el.textContent=text(control.dataset.lawLabel||control.dataset.label||id);S.lawLabels.set(id,el);','const lines=text(control.dataset.labelLines).split("|").map(text).filter(Boolean);el.replaceChildren();for(const line of(lines.length?lines:[text(control.dataset.lawLabel||control.dataset.label||id)])){const span=document.createElement("span");span.dataset.lawsLabelLine=line==="&"?"ampersand":"word";span.textContent=line;el.append(span);}S.lawLabels.set(id,el);','stacked labels')
          write(p,s)

          # Main HTML: solar/lunar gateways, eight child records, cache tokens.
          p='laws/index.html'; h=read(p)
          h=h.replace('data-laws-root-contract="law-compass-four-cardinal-sixteen-law-two-auxiliary-route-gateway"','data-laws-root-contract="law-compass-four-cardinal-two-celestial-gateway-twenty-four-child-route"').replace('data-laws-navigation-model="four-cardinal-sixteen-law-two-auxiliary-route-gateway"','data-laws-navigation-model="four-cardinal-two-celestial-gateway-six-cluster-authority"').replace('data-laws-category-count="4"','data-laws-category-count="6" data-laws-cardinal-count="4" data-laws-celestial-gateway-count="2"').replace('data-laws-law-count="16"','data-laws-law-count="24"').replace('data-laws-route-destination-count="18"','data-laws-route-destination-count="24"').replace('data-laws-secondary-label-model="active-cluster-primary-law-label-only"','data-laws-secondary-label-model="active-cluster-primary-stacked-label-only"').replace('data-laws-bounded-round="LAWS_SIX_NODE_TEST_RESEARCH_ARENA_20260729A"',f'data-laws-bounded-round="{BUILD}"').replace('data-laws-test-method="reversible-admissibility-direct-route"','data-laws-test-method="four-member-reversible-admissibility-cluster"')
          test='''            <button class="laws-star laws-star--authority laws-star--test" type="button" data-laws-object data-laws-semantic-star data-laws-fallback-star data-laws-category data-laws-gateway="solar" data-direction="test" data-category-label="Test" data-label="Test" data-destination-type="category" data-destination-id="test" data-route="/laws/test/" data-content-id="test" data-lens="reversible-admissibility" data-panel-eyebrow="Solar gateway" data-panel-title="Test" data-panel-body="Open the four-part Test cluster: Admission and Baseline, Forward Construction, Reverse Audit, and Results and Records." data-panel-relationship="Test applies the four Laws to admissibility, construction, reversal, and classification. It remains a method authority, not a fifth law." data-panel-function="Reversible admissibility" data-coordinate-label="Test / Solar gateway" data-laws-object-id="gateway-test" data-laws-object-size="authority" data-laws-object-shape="solar-object" data-laws-object-behavior="cluster" data-laws-cluster-id="test" aria-label="Test solar gateway. Open its four-member cluster." aria-expanded="false"><span class="laws-authority-label" aria-hidden="true">Test</span><span class="sr-only">Test — solar gateway to the reversible admissibility cluster</span></button>'''
          research='''            <button class="laws-star laws-star--authority laws-star--research" type="button" data-laws-object data-laws-semantic-star data-laws-fallback-star data-laws-category data-laws-gateway="lunar" data-direction="research" data-category-label="Research" data-label="Research" data-destination-type="category" data-destination-id="research" data-route="/laws/research/" data-content-id="research" data-lens="evidence-custody" data-panel-eyebrow="Lunar gateway" data-panel-title="Research" data-panel-body="Open the four-part Research cluster: Evidence and Sources, Methods and Models, Applied Investigations, and Findings and Boundaries." data-panel-relationship="Research preserves evidence, methods, applications, results, and limits without becoming a fifth law or upgrading claim maturity." data-panel-function="Evidence custody" data-coordinate-label="Research / Lunar gateway" data-laws-object-id="gateway-research" data-laws-object-size="authority" data-laws-object-shape="lunar-object" data-laws-object-behavior="cluster" data-laws-cluster-id="research" aria-label="Research lunar gateway. Open its four-member cluster." aria-expanded="false"><span class="laws-authority-label" aria-hidden="true">Research</span><span class="sr-only">Research — lunar gateway to the evidence-custody cluster</span></button>'''
          h,n=re.subn(r'\s*<button\s+class="laws-star laws-star--authority laws-star--test".*?</button>','\n'+test,h,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'test replacement={n}')
          h,n=re.subn(r'\s*<button\s+class="laws-star laws-star--authority laws-star--research".*?</button>','\n\n'+research,h,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'research replacement={n}')
          specs=[
          ('test','test-admission-baseline','Admission & Baseline','Admission|&|Baseline','/laws/test/#admission-baseline','Admission','Baseline','Define what may enter, preserve proposition identity, and establish the fixed comparison authority.'),
          ('test','test-forward-construction','Forward Construction','Forward|Construction','/laws/test/#forward-construction','Forward','Construction','Construct the proposition through ordered evidence and justification while applying Flow, Integrity, Reality, and Structure.'),
          ('test','test-reverse-audit','Reverse Audit','Reverse|Audit','/laws/test/#reverse-audit','Reverse','Audit','Return through the accepted record to detect baseline drift, contradiction, identity loss, or invented evidence.'),
          ('test','test-results-records','Results & Records','Results|&|Records','/laws/test/#results-records','Results','Records','Classify pass, fail, held, insufficient evidence, or not admitted while preserving receipts and Research links.'),
          ('research','research-evidence-sources','Evidence & Sources','Evidence|&|Sources','/laws/research/#evidence-sources','Evidence','Sources','Inspect datasets, documents, observations, references, provenance, and evidence standing.'),
          ('research','research-methods-models','Methods & Models','Methods|&|Models','/laws/research/#methods-models','Methods','Models','Inspect formulas, analytical methods, assumptions, comparisons, and model construction.'),
          ('research','research-applied-investigations','Applied Investigations','Applied|Investigations','/laws/research/#applied-investigations','Applied','Investigations','Inspect domain studies, experiments, implementations, case studies, and project applications.'),
          ('research','research-findings-boundaries','Findings & Boundaries','Findings|&|Boundaries','/laws/research/#findings-boundaries','Findings','Boundaries','Inspect supported conclusions, negative and mixed results, limitations, unresolved questions, and prohibited claims.')]
          children=[]
          for direction,lid,label,lines,route,eyebrow,function,body in specs:
              children.append(f'<button class="laws-star laws-star--small laws-star--law" type="button" data-laws-object data-laws-semantic-star data-laws-fallback-star data-laws-law data-laws-law-control data-direction="{direction}" data-law-id="{lid}" data-law-label="{label}" data-label-lines="{lines}" data-label="{label.replace("&","and")}" data-destination-type="law" data-destination-id="{lid}" data-route="{route}" data-content-id="{lid}" data-lens="cluster-route" data-panel-eyebrow="{eyebrow}" data-panel-title="{label}" data-panel-body="{body}" data-panel-relationship="This cluster member preserves its exact method, evidence, and claim boundary." data-panel-function="{function}" data-coordinate-label="{direction.title()} / {label}" aria-label="{label}. {direction.title()} cluster route."><span class="sr-only">{label}</span></button>')
          marker='<button class="laws-star laws-star--small laws-star--law" type="button" data-laws-object data-laws-semantic-star data-laws-fallback-star data-laws-law data-laws-law-control data-direction="flow"'
          if marker not in h: raise SystemExit('first law marker missing')
          h=h.replace(marker,'\n            '.join(children)+'\n\n            '+marker,1)
          h=h.replace('Four cardinal law families surround the fixed Main Compass.\n          Two larger noncardinal authorities provide a reversible Test method\n          and one consolidated Research destination. Select a law family to\n          expose its four law routes, or enter Test or Research directly,','Four reduced cardinal law stars surround the fixed Main Compass.\n          A solar Test gateway and lunar Research gateway occupy mirrored positions.\n          Select any of the six authorities to expose its four-member cluster,')
          for asset in ('controller','crystals','interactions'):
              h,n=re.subn(rf'(/laws/index\.{asset}\.js\?v=)[^"\']+',rf'\1{TOKEN}',h)
              if n!=1: raise SystemExit(f'{asset} token={n}')
          h,n=re.subn(r'(/laws/index\.css\?v=)[^"\']+',rf'\1{TOKEN}',h)
          if n!=1: raise SystemExit(f'css token={n}')
          write(p,h)

          # CSS overrides.
          p='laws/index.css'; c=read(p); c+='''\n\n/* CELESTIAL GATEWAY AND AUXILIARY CLUSTER CP2 */\n:root{--laws-category-size:clamp(2.52rem,4.64vw,4.08rem);--laws-authority-size:clamp(4.15rem,7.4vw,6.45rem)}\n[data-laws-category][data-laws-gateway]{width:var(--laws-authority-size);aspect-ratio:1}\n[data-laws-category][data-laws-gateway="solar"]::before{clip-path:circle(49% at 50% 50%);background:radial-gradient(circle at 34% 28%,#fffde2 0 8%,#fff0a1 17%,#ffbd3f 46%,#b84d00 76%,#4d1700 100%);box-shadow:inset -.65rem -.8rem 1.25rem rgba(117,30,0,.62),inset .35rem .25rem .8rem rgba(255,255,255,.48),0 0 1.35rem rgba(255,223,105,.78),0 0 3.6rem rgba(255,143,31,.42);filter:drop-shadow(0 0 .85rem rgba(255,198,63,.68))}\n[data-laws-category][data-laws-gateway="lunar"]::before{clip-path:circle(49% at 50% 50%);background:radial-gradient(circle at 33% 28%,rgba(255,255,255,.96) 0 7%,transparent 8%),radial-gradient(circle at 66% 62%,rgba(31,38,61,.72) 0 9%,transparent 10%),radial-gradient(circle at 44% 71%,rgba(58,66,91,.68) 0 6%,transparent 7%),radial-gradient(circle at 52% 43%,#d7dcf0 0 18%,#858da9 54%,#34394f 82%,#151827 100%);box-shadow:inset -.85rem -.7rem 1.35rem rgba(7,10,24,.78),inset .28rem .2rem .72rem rgba(255,255,255,.34),0 0 1.1rem rgba(178,194,255,.42),0 0 2.8rem rgba(111,91,205,.22);filter:drop-shadow(0 0 .68rem rgba(163,178,239,.44))}\n[data-laws-projected-law-label]{display:grid;min-width:clamp(4.8rem,12vw,7rem);gap:.05rem;border-radius:.8rem;white-space:normal}\n[data-laws-projected-law-label] [data-laws-label-line]{display:block}\n[data-laws-projected-law-label] [data-laws-label-line="ampersand"]{font-size:.72em;line-height:.82;opacity:.82}\n'''; write(p,c)

          # Test and Research overview pages.
