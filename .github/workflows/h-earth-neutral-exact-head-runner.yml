          EXERCISE: ${{ github.event_name == 'pull_request' && 'false' || inputs.exercise_vegetation_residency }}
          TIMING_SHIM: ${{ github.event_name == 'pull_request' && 'false' || inputs.apply_timing_shim }}
        run: |
          test "$TARGET_SHA" = 60b3c07f0216645119a1b92b16dac82cae739145
          test "$ROUTE_PATH" = /showroom/globe/h-earth/
          test "$EXERCISE" = false
          test "$TIMING_SHIM" = false
      - name: Check out immutable runner tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: tooling
          persist-credentials: false
      - name: Check out complete fixed baseline
        uses: actions/checkout@v4
        with:
          ref: 60b3c07f0216645119a1b92b16dac82cae739145
          path: baseline
          persist-credentials: false
      - name: Check out complete fixed candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '60b3c07f0216645119a1b92b16dac82cae739145' }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate bounded comparison tooling
        working-directory: tooling
        run: node --test tools/h-earth-ground-material-comparison.v1.test.mjs tools/h-earth-groundcover-factor-overlay.test.mjs
      - name: Install Chromium
        working-directory: tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture twenty exact-candidate groundcover factor frames
        working-directory: tooling
        env:
