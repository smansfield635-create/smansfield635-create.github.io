name: Awards Temporary Media Materializer

on:
  pull_request:
    paths:
      - '.media-staging/awards-compass-v2/**'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Materialize Compass picture master
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.media-staging/awards-compass-v2/part-*.b64)
          if ((${#parts[@]} == 0)); then
            echo 'No staged Compass media parts remain; materialization already complete.'
            exit 0
          fi
          mkdir -p showroom/globe/h-earth/awards/media
          cat "${parts[@]}" > /tmp/compass-v2.b64
          base64 --decode /tmp/compass-v2.b64 > showroom/globe/h-earth/awards/media/diamond-gate-compass-story-v2-36s.mp4
          test -s showroom/globe/h-earth/awards/media/diamond-gate-compass-story-v2-36s.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 showroom/globe/h-earth/awards/media/diamond-gate-compass-story-v2-36s.mp4
          rm -rf .media-staging/awards-compass-v2
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Materialize Compass story picture master'
          git push origin HEAD:${{ github.head_ref }}
