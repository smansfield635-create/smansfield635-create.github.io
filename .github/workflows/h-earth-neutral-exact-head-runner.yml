            await page.locator('#h-earth-loading-screen [data-enter]').click();
            await page.waitForFunction(()=>window.H_EARTH_STARTUP_LOADER?.getReceipt?.()?.mode==='entered',
              null,{timeout:30000,polling:200});
            await page.waitForFunction(()=>{
              const phase=window.H_EARTH_RUN8E_PUBLIC_ROUTE?.getLiveGpuReceipt?.()?.vegetationBackground?.phase;
              return phase==='OWNER_PREPARED'||phase==='FAILED';
            },null,{timeout:600000,polling:500});
            const populated=await snapshot(page),populatedFrame=await screen(page,'public-entered-populated');
            assert.equal(populated.backgroundPhase,'OWNER_PREPARED','PUBLIC_VEGETATION_NOT_PREPARED');
            assert.equal(populated.owner?.roots,3805291,'ROOT_COUNT_DRIFT');
            assert.equal(populated.owner?.bytes,60884656,'PACKED_BYTES_DRIFT');
            assert.equal(populated.owner?.wide,496748,'WIDE_ROOT_DRIFT');
            assert.equal(populated.owner?.frozen,343076,'FROZEN_ROOT_DRIFT');
            assert.equal(populated.worldRebuilds,0,'WORLD_REBUILT');
            await page.mouse.move(bounds.x+bounds.width*.5,bounds.y+bounds.height*.5);
            await page.mouse.wheel(0,-280);
            await page.waitForTimeout(1700);
            const afterWheel=await snapshot(page),afterWheelFrame=await screen(page,'public-after-travel');
            const p1=populated.nav?.position,p2=afterWheel.nav?.position;
            assert(p1&&p2&&Math.hypot(p1.x-p2.x,p1.z-p2.z)>.1,'ENTERED_CAMERA_DID_NOT_TRAVEL');
            assert.equal(afterWheel.worldRebuilds,0,'TRAVEL_REBUILT_WORLD');
            requireEight(logs);
            receipt.publicEnter={result:'PASS_PUBLIC_ENTER_AND_TRAVEL',before,beforeFrame,
              movedBeforeEnter,changedFrame,populated,populatedFrame,afterWheel,afterWheelFrame,logs};
            await page.close();
            const replayPage=await ctx.newPage(),replayLogs=watch(replayPage);
            await replayPage.goto(base+'/showroom/globe/h-earth/vegetation-prototype.html?prototype=single-owner-v1&arrival=approved-four-trees',
              {waitUntil:'domcontentloaded',timeout:120000});
            await replayPage.waitForFunction(()=>{
              const r=window.H_EARTH_RUN8E_PUBLIC_ROUTE?.getReceipt?.()?.singleOwnerVegetationQualification;
              return r?.result==='CAPTURED_POPULATED_CONTINUITY'||document.querySelector('#h-earth-functional-landscape-route')?.dataset.run8eError==='true';
            },null,{timeout:600000,polling:400});
            const replay=await replayPage.evaluate(()=>{
              const r=window.H_EARTH_RUN8E_PUBLIC_ROUTE?.getReceipt?.()?.singleOwnerVegetationQualification;
              const gpu=window.H_EARTH_RUN8E_PUBLIC_ROUTE?.getLiveGpuReceipt?.();
              return {result:r?.result,requestedStepsPerDirection:r?.requestedStepsPerDirection,
                returnDistanceMeters:r?.returnDistanceMeters,installedControlIdentityStable:r?.installedControlIdentityStable,
                coarseCoverageSubmittedThroughout:r?.coarseCoverageSubmittedThroughout,
                presentationScope:r?.presentationScope,observations:r?.observations?.map(x=>({
                  label:x.label,position:x.position,navigationSequence:x.navigationSequence,
                  roots:x.vegetation?.installedRootCount,bytes:x.vegetation?.gpuUploadedBytes,
                  perFrameUploadBytes:x.vegetation?.perFrameUploadBytes})),
                ownerRoots:gpu?.resources?.singleOwnerVegetation?.installedRootCount,
                ownerBytes:gpu?.resources?.singleOwnerVegetation?.gpuUploadedBytes,
                framePresentations:gpu?.counters?.gpuFramebufferPresentationCount,
                worldRebuilds:gpu?.counters?.worldRebuildCount};
            });
            const replayFrame=await screen(replayPage,'strict-forward-and-return');
            assert.equal(replay.result,'CAPTURED_POPULATED_CONTINUITY','REPLAY_NOT_CAPTURED');
            assert.equal(replay.requestedStepsPerDirection,8,'REPLAY_STEP_COUNT_CHANGED');
            assert.equal(replay.observations?.length,18,'REPLAY_OBSERVATIONS_MISSING');
            assert(replay.returnDistanceMeters<.01,'REPLAY_RETURN_DRIFT');
            assert.equal(replay.installedControlIdentityStable,true,'REPLAY_CONTROL_ID_DRIFT');
            assert.equal(replay.coarseCoverageSubmittedThroughout,true,'REPLAY_COARSE_COVERAGE_LOST');
            assert.equal(replay.presentationScope,'EVERY_RECORDED_WALK_STEP','REPLAY_PRESENTATION_NOT_PER_STEP');
            assert.equal(replay.ownerRoots,3805291,'REPLAY_ROOT_DRIFT');
            assert.equal(replay.ownerBytes,60884656,'REPLAY_PACKED_BYTES_DRIFT');
            assert.equal(replay.worldRebuilds,0,'REPLAY_WORLD_REBUILT');
            assert(replay.framePresentations>=18,'REPLAY_GPU_PRESENTATIONS_MISSING');
            requireEight(replayLogs);
            receipt.strictReplay={...replay,replayFrame,logs:replayLogs};
            await replayPage.close();await ctx.close();
            receipt.result='PASS_EXACT_SOURCE_PUBLIC_ENTER_AND_STRICT_TRAVERSAL_HOSTED_CHROMIUM';
          }catch(e){
            receipt.result='FAIL_CLOSED';receipt.errors.push(e?.stack??String(e));
            process.exitCode=1;
          }finally{
            await fs.writeFile(dir+'receipt.json',JSON.stringify(receipt,null,2)+'\n');
            await browser.close();
          }
          GEN3453_TRAVERSE
          node --check .p3-gen3453-current-world-traverse.mjs
