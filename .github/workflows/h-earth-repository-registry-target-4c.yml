name: H-Earth Repository Registry Target 4C Bounded Fixture Audit

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  execute-fixture-audit:
    if: github.event.pull_request.head.ref == 'agent/h-earth-repository-registry-target-4c-execution-001'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: agent/h-earth-repository-registry-installation-001
      WORKFLOW_PATH: .github/workflows/h-earth-repository-registry-target-4c.yml
      RECEIPT_PATH: h-earth-3d/registry/h-earth.repository-registry.target-4c-receipt.json

    steps:
      - name: Check out actual installation branch
        uses: actions/checkout@v4
        with:
          ref: agent/h-earth-repository-registry-installation-001
          fetch-depth: 0

      - name: Execute static and dynamic fixture audits
        shell: bash
        run: |
          set -euo pipefail
          export TARGET_COMMIT="$(git rev-parse HEAD)"
          node --experimental-default-type=module \
            tools/h-earth-repository-registry-target-4c-audit.mjs \
            > "$RECEIPT_PATH"

      - name: Verify complete fixture result
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipt = JSON.parse(fs.readFileSync(process.env.RECEIPT_PATH, 'utf8'));
          if (receipt.result !== 'PASS') throw new Error('TARGET_4C_NOT_PASS');
          if (receipt.executionEnvironment !== 'BOUNDED_GITHUB_ACTION_ACTUAL_BRANCH_CHECKOUT') throw new Error('TARGET_4C_WRONG_ENVIRONMENT');
          if (receipt.staticAudit.result !== 'PASS') throw new Error('TARGET_4C_STATIC_AUDIT_FAIL');
          if (receipt.fixtureExecution.finalResult !== 'PASS') throw new Error('TARGET_4C_FIXTURE_EXECUTION_FAIL');
          if (receipt.fixtureExecution.executedFixtureCount !== 33) throw new Error('TARGET_4C_FIXTURE_COUNT_MISMATCH');
          if (receipt.fixtureExecution.failedFixtureCount !== 0) throw new Error('TARGET_4C_FAILED_FIXTURES_PRESENT');
          const counts = receipt.fixtureExecution.fixtureClassCounts;
          if (counts.POSITIVE !== 6 || counts.NEGATIVE !== 13 || counts.DRIFT !== 6 || counts.ADVERSARIAL !== 8) throw new Error('TARGET_4C_CLASS_COUNTS_MISMATCH');
          if (receipt.protectedIdentities.target2RegistryGitBlob !== '10ab7b203e03fde419e526d0cce2c0af42860911') throw new Error('TARGET_2_DRIFT');
          if (receipt.protectedIdentities.target3InstructionGitBlob !== 'de421803f21808ce27b2ffff349af8756c4d9929') throw new Error('TARGET_3_DRIFT');
          if (receipt.protectedIdentities.target4AContractGitBlob !== 'a6733c868cfee1abce172c0ac901fecf3dd209b2') throw new Error('TARGET_4A_DRIFT');
          if (receipt.protectedIdentities.target4BEngineGitBlob !== 'b2d7e0290a2032bef36205e1e1e5b0d3e72ca759') throw new Error('TARGET_4B_DRIFT');
          NODE

      - name: Commit receipts and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm "$WORKFLOW_PATH"
          git add "$RECEIPT_PATH" h-earth-3d/registry/fixtures/receipts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Target 4C-13: record bounded fixture execution receipts'
          git push origin "HEAD:$TARGET_BRANCH"
