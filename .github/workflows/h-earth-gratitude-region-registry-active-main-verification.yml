name: H-Earth Gratitude Region Registry Active Main Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/h-earth-gratitude-region-registry-active-main-verification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-active-main-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact registry merge commit from main
        uses: actions/checkout@v4
        with:
          ref: 879e47bd6b8bb2289878d6c2938fe892d4b23471
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify active-main commit and registry blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "879e47bd6b8bb2289878d6c2938fe892d4b23471"
          test "$(git hash-object h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.gratitude-region-coordinate-reconciliation-scope.js)" = "cacf05628627d3f427ae37fbbc0e00139ce8351a"
          test "$(git hash-object h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js)" = "c4b0ba5e1df387735c49a3c569e323cf35a68768"
          git fetch --no-tags origin a0cadd1e5ce70d98c34f11ddacb063c91816bd93

      - name: Execute active-main registry verification twice
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import loadDependencies from './h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js';
          import registryFacade, {
            H_EARTH_GRATITUDE_REGION_COORDINATE_RECONCILIATION_PACKAGE_OCCURRENCES,
            H_EARTH_GRATITUDE_REGION_COORDINATE_RECONCILIATION_SCOPE_NODE
          } from './h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.gratitude-region-coordinate-reconciliation-scope.js';
          import { runAutomaticHEarthPreflight } from './h-earth-3d/registry/activation/h-earth.repository-registry.auto-preflight.js';

          const ACTIVE_MAIN_COMMIT = '879e47bd6b8bb2289878d6c2938fe892d4b23471';
          const PACKAGE_HEAD = 'a0cadd1e5ce70d98c34f11ddacb063c91816bd93';
          const ACTIVE_OVERLAY_BLOB = 'cacf05628627d3f427ae37fbbc0e00139ce8351a';
          const ACTIVE_LOADER_BLOB = 'c4b0ba5e1df387735c49a3c569e323cf35a68768';
          const SELF_PATH = '/h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.gratitude-region-coordinate-reconciliation-scope.js';
          const LOADER_PATH = '/h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js';
          const PACKAGE_NODE_ID = H_EARTH_GRATITUDE_REGION_COORDINATE_RECONCILIATION_SCOPE_NODE.nodeId;

          const stable = (value) => value === null || typeof value !== 'object'
            ? JSON.stringify(value)
            : Array.isArray(value)
              ? `[${value.map(stable).join(',')}]`
              : `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${stable(value[key])}`).join(',')}}`;
          const digest = (value) => crypto.createHash('sha256').update(stable(value)).digest('hex');
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const blobAt = (commit, repositoryPath) => {
            const line = git('ls-tree', commit, '--', repositoryPath.replace(/^\//, ''));
            return line.match(/^\d+\s+blob\s+([0-9a-f]{40})\t/)?.[1] ?? null;
          };

          function executeVerification() {
            const issues = [];
            const dependencies = loadDependencies();
            const expected = new Map(H_EARTH_GRATITUDE_REGION_COORDINATE_RECONCILIATION_PACKAGE_OCCURRENCES);
            const allPackagePaths = [...expected.keys()];
            const governedPaths = allPackagePaths.filter((path) => path.startsWith('/h-earth-3d/') || path.startsWith('/showroom/globe/h-earth/'));
            const overlayBlob = blobAt(ACTIVE_MAIN_COMMIT, SELF_PATH);
            const loaderBlob = blobAt(ACTIVE_MAIN_COMMIT, LOADER_PATH);

            if (git('rev-parse', 'HEAD') !== ACTIVE_MAIN_COMMIT) issues.push('ACTIVE_MAIN_COMMIT_MISMATCH');
            if (overlayBlob !== ACTIVE_OVERLAY_BLOB) issues.push('ACTIVE_OVERLAY_BLOB_MISMATCH');
            if (loaderBlob !== ACTIVE_LOADER_BLOB) issues.push('ACTIVE_LOADER_BLOB_MISMATCH');
            if (dependencies.identityVerified !== true) issues.push('LOADER_DEPENDENCY_IDENTITY_NOT_VERIFIED');
            if (dependencies.registryFacade !== registryFacade) issues.push('LOADER_FACADE_NOT_ACTIVE_OVERLAY');
            if (allPackagePaths.length !== 16) issues.push(`PACKAGE_PATH_COUNT_${allPackagePaths.length}_NOT_16`);
            if (governedPaths.length !== 15) issues.push(`GOVERNED_PATH_COUNT_${governedPaths.length}_NOT_15`);
            if (new Set(allPackagePaths).size !== 16) issues.push('DUPLICATE_PACKAGE_PATH');

            const actualPackageOccurrences = [];
            for (const [path, expectedBlob] of expected.entries()) {
              const actualBlob = blobAt(PACKAGE_HEAD, path);
              actualPackageOccurrences.push({ path, expectedBlob, actualBlob, exactMatch: actualBlob === expectedBlob });
              if (actualBlob !== expectedBlob) issues.push(`PACKAGE_GIT_BLOB_MISMATCH:${path}:${actualBlob}`);
            }

            for (const path of [...allPackagePaths, SELF_PATH, LOADER_PATH]) {
              const resolution = registryFacade.resolveHEarthRepositoryRegistryPath(path);
              if (resolution.resolved !== true || resolution.unresolved !== false) issues.push(`PATH_UNRESOLVED:${path}`);
              if (!resolution.nodes.some((node) => node.nodeId === PACKAGE_NODE_ID)) issues.push(`PACKAGE_NODE_NOT_RESOLVED:${path}`);
              if (!Array.isArray(resolution.occurrences) || resolution.occurrences.length < 1) issues.push(`OCCURRENCE_UNRESOLVED:${path}`);
              if (expected.has(path)) {
                const occurrence = resolution.occurrences.find((entry) => entry.path === path && entry.commitSha === PACKAGE_HEAD);
                if (!occurrence) issues.push(`EXACT_COMMIT_OCCURRENCE_MISSING:${path}`);
                if (occurrence && occurrence.gitBlobSha !== expected.get(path)) issues.push(`EXACT_REGISTRY_BLOB_MISMATCH:${path}`);
              }
            }

            const preflight = runAutomaticHEarthPreflight({
              paths: governedPaths,
              taskText: 'Active-main Gratitude Region registry execution verification before PR 311 base and delta reconciliation',
              mutationIntent: false
            });
            const failureCodes = preflight.validatorReceipt?.failureCodes ?? [];
            const resolvedPaths = preflight.validatorReceipt?.resolvedPaths ?? [];
            const affectedNodeIds = preflight.scopePreview?.affectedNodeIds ?? [];
            if (preflight.finalDisposition !== 'PASS') issues.push(`PREFLIGHT_DISPOSITION_${preflight.finalDisposition}`);
            if (preflight.continuation !== 'READ_ONLY_CONTINUATION_PERMITTED') issues.push(`PREFLIGHT_CONTINUATION_${preflight.continuation}`);
            if (failureCodes.length !== 0) issues.push(`PREFLIGHT_FAILURE_CODES:${failureCodes.join(',')}`);
            if (resolvedPaths.length !== 15) issues.push(`PREFLIGHT_RESOLVED_PATH_COUNT_${resolvedPaths.length}_NOT_15`);
            if (!affectedNodeIds.includes(PACKAGE_NODE_ID)) issues.push('PACKAGE_NODE_NOT_IN_AFFECTED_SCOPE');

            const instance = registryFacade.getHEarthRepositoryRegistryInstance();
            if (!instance.nodes.some((node) => node.nodeId === PACKAGE_NODE_ID)) issues.push('PACKAGE_NODE_NOT_IN_ACTIVE_MAIN_INSTANCE');
            if (H_EARTH_GRATITUDE_REGION_COORDINATE_RECONCILIATION_SCOPE_NODE.authorityClass !== 'NO_AUTHORITY') issues.push('PACKAGE_NODE_AUTHORITY_OVERREACH');
            if (H_EARTH_GRATITUDE_REGION_COORDINATE_RECONCILIATION_SCOPE_NODE.allowedMutationScope !== 'READ_ONLY_INSPECTION') issues.push('PACKAGE_NODE_MUTATION_SCOPE_OVERREACH');
            if (H_EARTH_GRATITUDE_REGION_COORDINATE_RECONCILIATION_SCOPE_NODE.lifecycleStatus !== 'CANDIDATE') issues.push('PACKAGE_NODE_LIFECYCLE_PROMOTION');

            const prohibited = new Set(H_EARTH_GRATITUDE_REGION_COORDINATE_RECONCILIATION_SCOPE_NODE.prohibitedMutations ?? []);
            for (const required of [
              'SPATIAL_CANDIDATE_ACCEPTANCE',
              'FINAL_COORDINATE_ASSIGNMENT',
              'PR_311_RETARGET_OR_MERGE',
              'CANONICALIZATION',
              'TERRAIN_OR_GEOMETRY_MUTATION',
              'RUNTIME_GAMEPLAY_ROUTE_OR_PRODUCT_MUTATION'
            ]) if (!prohibited.has(required)) issues.push(`PROHIBITION_MISSING:${required}`);

            const base = {
              schemaVersion: 'H_EARTH_GRATITUDE_REGION_REGISTRY_ACTIVE_MAIN_EXECUTION_VERIFICATION_RECEIPT_v1',
              operationClass: 'READ_ONLY_ACTIVE_MAIN_REGISTRY_EXECUTION_VERIFICATION',
              activeMainCommit: ACTIVE_MAIN_COMMIT,
              activeOverlayBlob: overlayBlob,
              activeLoaderBlob: loaderBlob,
              packageHead: PACKAGE_HEAD,
              exactPackagePathCount: allPackagePaths.length,
              governedPreflightPathCount: governedPaths.length,
              exactPackageBlobMatches: actualPackageOccurrences.every((entry) => entry.exactMatch),
              actualPackageOccurrences,
              loaderIdentityVerified: dependencies.identityVerified,
              packageWorkflowPathRegistered: registryFacade.resolveHEarthRepositoryRegistryPath('/.github/workflows/h-earth-gratitude-region-coordinate-reconciliation.yml').resolved,
              registrySelfPathResolved: registryFacade.resolveHEarthRepositoryRegistryPath(SELF_PATH).resolved,
              registryLoaderPathResolved: registryFacade.resolveHEarthRepositoryRegistryPath(LOADER_PATH).resolved,
              activePackageNodePresent: instance.nodes.some((node) => node.nodeId === PACKAGE_NODE_ID),
              preflightFinalDisposition: preflight.finalDisposition,
              preflightContinuation: preflight.continuation,
              preflightResolvedPathCount: resolvedPaths.length,
              preflightAffectedNodeIds: affectedNodeIds,
              preflightFailureCodes: failureCodes,
              requestedPathUnresolvedClosed: !failureCodes.includes('REQUESTED_PATH_UNRESOLVED'),
              operationScopeUnresolvedClosed: !failureCodes.includes('OPERATION_SCOPE_UNRESOLVED'),
              spatialCandidateAcceptanceCreated: false,
              finalCoordinateAuthorityCreated: false,
              pr311RetargetAuthorityCreated: false,
              pr311MergeAuthorityCreated: false,
              canonicalizationAuthorityCreated: false,
              terrainMutationAuthorityCreated: false,
              geometryConstructionAuthorityCreated: false,
              productConstructionAuthorityCreated: false,
              nextAuthorizedOperation: 'PR_311_BASE_AND_DELTA_RECONCILIATION',
              issues
            };
            return { ...base, receiptDigest: digest(base), status: issues.length === 0 ? 'PASS_CLOSED' : 'FAIL_STOPPED' };
          }

          const first = executeVerification();
          const second = executeVerification();
          const deterministic = first.receiptDigest === second.receiptDigest;
          fs.writeFileSync('/tmp/h-earth-active-main-registry-verification.first.json', `${JSON.stringify(first, null, 2)}\n`);
          fs.writeFileSync('/tmp/h-earth-active-main-registry-verification.second.json', `${JSON.stringify(second, null, 2)}\n`);
          const custody = {
            schemaVersion: 'H_EARTH_GRATITUDE_REGION_REGISTRY_ACTIVE_MAIN_EXECUTION_VERIFICATION_CUSTODY_v1',
            status: deterministic && first.status === 'PASS_CLOSED' && second.status === 'PASS_CLOSED' ? 'PASS_CLOSED' : 'FAIL_STOPPED',
            activeMainCommit: first.activeMainCommit,
            activeOverlayBlob: first.activeOverlayBlob,
            activeLoaderBlob: first.activeLoaderBlob,
            packageHead: first.packageHead,
            firstExecutionDigest: first.receiptDigest,
            secondExecutionDigest: second.receiptDigest,
            deterministicRepeatExecution: deterministic,
            exactPackagePathCount: first.exactPackagePathCount,
            preflightResolvedPathCount: first.preflightResolvedPathCount,
            preflightFinalDisposition: first.preflightFinalDisposition,
            preflightFailureCodes: first.preflightFailureCodes,
            requestedPathUnresolvedClosed: first.requestedPathUnresolvedClosed,
            operationScopeUnresolvedClosed: first.operationScopeUnresolvedClosed,
            pr311RetargetAuthorityCreated: false,
            pr311MergeAuthorityCreated: false,
            canonicalizationAuthorityCreated: false,
            productConstructionAuthorityCreated: false,
            nextAuthorizedOperation: 'PR_311_BASE_AND_DELTA_RECONCILIATION'
          };
          fs.writeFileSync('/tmp/h-earth-active-main-registry-verification.custody.json', `${JSON.stringify(custody, null, 2)}\n`);
          console.log(JSON.stringify(custody, null, 2));
          if (custody.status !== 'PASS_CLOSED') process.exitCode = 1;
          NODE

      - name: Upload active-main registry verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-gratitude-region-registry-active-main-verification-evidence
          path: |
            /tmp/h-earth-active-main-registry-verification.first.json
            /tmp/h-earth-active-main-registry-verification.second.json
            /tmp/h-earth-active-main-registry-verification.custody.json
          if-no-files-found: error
          retention-days: 30
