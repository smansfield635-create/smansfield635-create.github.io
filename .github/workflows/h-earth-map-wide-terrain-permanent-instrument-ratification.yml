name: PR570 v3 Permanent Instrument Post-Merge Verification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h-earth-map-wide-terrain-permanent-instrument-ratification.yml'

permissions:
  contents: write
  actions: read
  pull-requests: read

env:
  PRE_MERGE_MAIN: a4ba663dbff1d780cf80e8e40ecaa396c2ee85c7
  SOURCE_BASE: 3ac9279dc82e56f7b0d67972ce56048d07e5ecfa
  SOURCE_HEAD: 7c0b8871928b21cd9b2806f058bce34eed11f2ba
  SOURCE_FINGERPRINT: 3f1024c9dc2fed15d3a8a7a25387066a48f5a8ffddf2e3cfd00b96dd95e45f28
  PACKAGE_COMMIT: a1076744a3a3f330ef31638867f0b48d6cc87047
  CANDIDATE_HEAD: 778ee21b73d836473e6388cdc7634a05c221e374
  MERGE_COMMIT: 0d88fe21aba99c97b73fcdc68d44af57d55b68be
  REGISTRY_PATH: h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.map-wide-instrument-scope-registration.js
  NODE_ID: H_EARTH_MAP_WIDE_TERRAIN_ARTICULATION_ESTATE_RESERVATION_INSTRUMENT
  LOCK_REF: refs/heads/operation-locks/repository-operation-intake-v1
  ROUTER_OPERATION_ID: H_EARTH_MAP_WIDE_INSTRUMENT_ROUTER_OWNERSHIP_R_002
  ROUTER_LOCK_SCOPE: REPOSITORY_AI_ROUTER_INFRASTRUCTURE:H_EARTH_MAP_WIDE_INSTRUMENT_OWNERSHIP:R:V2
  ROUTER_LOCK_GENERATION: '111'
  RATIFICATION_OPERATION_ID: H_EARTH_MAP_WIDE_INSTRUMENT_PERMANENT_RATIFICATION_AND_ACTIVATION_v3
  RATIFICATION_LOCK_SCOPE: H_EARTH:MAP_WIDE_INSTRUMENT:PERMANENT_RATIFICATION_AND_ACTIVATION:V3
  RATIFICATION_LOCK_GENERATION: '150'

jobs:
  reproduce-active-merge:
    name: active-merge-${{ matrix.role }}
    strategy:
      fail-fast: false
      matrix:
        role: [builder, fresh-verifier]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reproduce the actual merged instrument
        env:
          EXECUTION_ROLE: ${{ matrix.role }}
          EXECUTION_HOLDER: PR570_V3_POSTMERGE_${{ matrix.role }}_${{ github.run_id }}_${{ github.run_attempt }}
          OUTPUT_DIR: ${{ runner.temp }}/${{ matrix.role }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          cat > "$RUNNER_TEMP/pr570-v3-postmerge.mjs" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import os from 'node:os';
          import crypto from 'node:crypto';
          import { execFileSync, spawnSync } from 'node:child_process';
          import { pathToFileURL } from 'node:url';

          const E=process.env;
          const ROOT=process.cwd();
          const LIFECYCLE=new Set([
            'h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/authority-and-lineage.v1.json',
            'h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/instrument.locator.v1.json',
            'h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/progress-ledger.v1.json'
          ]);
          const NEGATIVE='h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/unregistered-neighbor.v1.json';
          const fail=(code,detail='')=>{const error=new Error(`${code}${detail?`:${detail}`:''}`);error.code=code;throw error;};
          const assert=(value,code,detail='')=>{if(!value)fail(code,detail);};
          const git=(...args)=>execFileSync('git',args,{cwd:ROOT,encoding:'utf8',maxBuffer:64*1024*1024}).trim();
          const readJson=file=>JSON.parse(fs.readFileSync(file,'utf8'));
          const stable=value=>Array.isArray(value)?value.map(stable):value&&typeof value==='object'?Object.fromEntries(Object.keys(value).sort().map(key=>[key,stable(value[key])])):value;
          const canonical=value=>JSON.stringify(stable(value));
          const digest=value=>crypto.createHash('sha256').update(canonical(value)).digest('hex');
          const diffNames=(base,head)=>{const out=git('diff','--name-only',base,head);return out?out.split(/\r?\n/).filter(Boolean).sort():[];};
          const blob=(head,file)=>git('rev-parse',`${head}:${file}`);
          const run=(command,args)=>spawnSync(command,args,{cwd:ROOT,encoding:'utf8',maxBuffer:64*1024*1024});

          assert(git('rev-parse','HEAD^{commit}')===E.MERGE_COMMIT,'MERGE_HEAD_MISMATCH');
          assert(git('status','--porcelain=v1','--untracked-files=all')==='','DIRTY_WORKTREE');
          const parents=git('rev-list','--parents','-n','1',E.MERGE_COMMIT).split(' ');
          assert(parents.length===3&&parents[1]===E.PRE_MERGE_MAIN&&parents[2]===E.CANDIDATE_HEAD,'MERGE_PARENT_MISMATCH',canonical(parents));
          assert(git('rev-parse',`${E.MERGE_COMMIT}^{tree}`)===git('rev-parse',`${E.CANDIDATE_HEAD}^{tree}`),'MERGE_TREE_MISMATCH');
          assert(git('rev-parse',`${E.CANDIDATE_HEAD}^`)===E.PACKAGE_COMMIT,'CANDIDATE_PARENT_MISMATCH');
          assert(git('rev-parse',`${E.PACKAGE_COMMIT}^`)===E.PRE_MERGE_MAIN,'PACKAGE_PARENT_MISMATCH');

          const sourcePaths=diffNames(E.SOURCE_BASE,E.SOURCE_HEAD);
          const packagePaths=diffNames(E.PRE_MERGE_MAIN,E.PACKAGE_COMMIT);
          const activePaths=diffNames(E.PRE_MERGE_MAIN,E.MERGE_COMMIT);
          assert(sourcePaths.length===25&&packagePaths.length===25&&activePaths.length===26,'PATH_COUNT_MISMATCH',`${sourcePaths.length}:${packagePaths.length}:${activePaths.length}`);
          assert(canonical(sourcePaths)===canonical(packagePaths),'PACKAGE_SOURCE_PATH_SET_MISMATCH');
          assert(canonical(activePaths)===canonical([...sourcePaths,E.REGISTRY_PATH].sort()),'ACTIVE_PATH_SET_MISMATCH');

          const preserved=[];
          const lifecycle=[];
          for(const file of sourcePaths){
            const sourceBlob=blob(E.SOURCE_HEAD,file);
            const packageBlob=blob(E.PACKAGE_COMMIT,file);
            if(LIFECYCLE.has(file)){
              assert(sourceBlob!==packageBlob,'LIFECYCLE_BLOB_NOT_SUCCESSOR',file);
              lifecycle.push({path:file,sourceBlob,packageBlob});
            }else{
              assert(sourceBlob===packageBlob,'SOURCE_BLOB_NOT_PRESERVED',file);
              preserved.push({path:file,blob:sourceBlob});
            }
          }
          assert(preserved.length===22&&lifecycle.length===3,'PRESERVATION_CARDINALITY');

          const authority=readJson('h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/authority-and-lineage.v1.json');
          const locator=readJson('h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/instrument.locator.v1.json');
          const ledger=readJson('h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/progress-ledger.v1.json');
          assert(authority.status==='PERMANENT_INSTRUMENT_ACTIVE_BY_SEPARATE_RATIFICATION','AUTHORITY_STATUS');
          assert(authority.immutableBootstrapSource?.exactHead===E.SOURCE_HEAD&&authority.separateRatification?.lockGeneration===150,'AUTHORITY_LINEAGE');
          assert(locator.status==='PERMANENT_INSTRUMENT_ACTIVE_BY_SEPARATE_RATIFICATION'&&locator.ratification?.separateRatificationSatisfied===true,'LOCATOR_STATUS');
          assert(ledger.terminalState==='PERMANENT_INSTRUMENT_ACTIVE_BY_SEPARATE_RATIFICATION','LEDGER_STATUS');
          assert(ledger.activation?.futureOperationsRequireSeparateAdmission===true,'FUTURE_ADMISSION_BOUNDARY');
          assert(ledger.actualTerrainMutationPerformed===false&&ledger.manorConstructionPerformed===false&&ledger.productMutationPerformed===false&&ledger.deploymentPerformed===false&&ledger.releasePerformed===false,'SIDE_EFFECT_BOUNDARY');

          const sourceDir=path.join(os.tmpdir(),`pr570-source-${E.EXECUTION_ROLE}-${process.pid}`);
          execFileSync('git',['worktree','add','--detach',sourceDir,E.SOURCE_HEAD],{cwd:ROOT,stdio:'pipe'});
          const sourceOut=path.join(E.OUTPUT_DIR,'source');
          try{
            execFileSync(process.execPath,['tools/h-earth-map-wide-terrain/self-test.v1.mjs','--root','.','--expected-head',E.SOURCE_HEAD,'--holder',`${E.EXECUTION_HOLDER}_SOURCE`,'--output-dir',sourceOut],{cwd:sourceDir,stdio:'pipe',maxBuffer:64*1024*1024});
          }finally{
            try{execFileSync('git',['worktree','remove','--force',sourceDir],{cwd:ROOT,stdio:'ignore'});}catch{}
          }
          const sourceReceipt=readJson(path.join(sourceOut,'bootstrap-self-test-receipt.json'));
          assert(sourceReceipt.result==='PASS_CLOSED'&&sourceReceipt.packageFingerprint===E.SOURCE_FINGERPRINT,'SOURCE_REPRODUCTION');
          assert(sourceReceipt.negativeFixturesPassed===sourceReceipt.negativeFixtureCount&&sourceReceipt.permanentInstrumentActivated===false,'SOURCE_BOUNDARY');

          const integratedOut=path.join(E.OUTPUT_DIR,'integrated');
          const integrated=run(process.execPath,['tools/h-earth-map-wide-terrain/self-test.v1.mjs','--root','.','--holder',`${E.EXECUTION_HOLDER}_INTEGRATED`,'--output-dir',integratedOut]);
          assert(integrated.status===0,'INTEGRATED_EXECUTION',integrated.stderr);
          const integratedReceipt=readJson(path.join(integratedOut,'bootstrap-self-test-receipt.json'));
          assert(integratedReceipt.result==='PASS_CLOSED'&&integratedReceipt.negativeFixturesPassed===integratedReceipt.negativeFixtureCount,'INTEGRATED_RESULT');

          const registry=await import(`${pathToFileURL(path.join(ROOT,E.REGISTRY_PATH)).href}?role=${encodeURIComponent(E.EXECUTION_ROLE)}`);
          const node=registry.getHEarthRepositoryRegistryNode(E.NODE_ID);
          assert(node?.lifecycleStatus==='ACTIVE'&&node?.nodeSubtype==='PERMANENT_NONPRODUCT_INSTRUMENT','REGISTRY_NODE_STATE');
          assert(node.repositoryPaths.length===13&&node.repositoryOccurrences.length===13,'REGISTRY_CARDINALITY');
          const occurrences=[];
          for(const occurrence of node.repositoryOccurrences){
            const relative=occurrence.path.replace(/^\//,'');
            assert(occurrence.refType==='COMMIT'&&occurrence.refName===E.PACKAGE_COMMIT&&occurrence.commitSha===E.PACKAGE_COMMIT,'OCCURRENCE_COMMIT',relative);
            assert(occurrence.occurrenceClass==='ACCEPTED'&&occurrence.fetchbackStatus==='VERIFIED'&&occurrence.existenceStatus==='PRESENT','OCCURRENCE_STATE',relative);
            assert(occurrence.gitBlobSha===blob(E.PACKAGE_COMMIT,relative),'OCCURRENCE_BLOB',relative);
            occurrences.push({path:occurrence.path,gitBlobSha:occurrence.gitBlobSha});
          }

          const routes=[];
          for(let index=0;index<activePaths.length;index++){
            const file=activePaths[index];
            const output=path.join(E.OUTPUT_DIR,`route-${index}.json`);
            const result=run(process.execPath,['tools/repository-ai-entry-router.mjs','--mutation-intent','--path',file,'--task','PR570 v3 post-merge route verification','--output',output]);
            assert(result.status===0,'ROUTER_EXECUTION',`${file}:${result.stderr}`);
            const receipt=readJson(output);
            assert(receipt.disposition==='PASS'&&receipt.routes?.[0]?.projectId==='H_EARTH','ROUTER_RESULT',file);
            routes.push({path:file,projectId:'H_EARTH',disposition:'PASS'});
          }

          const internalPaths=node.repositoryPaths.map(value=>value.replace(/^\//,''));
          fs.writeFileSync(path.join(E.OUTPUT_DIR,'internal-paths.txt'),`${internalPaths.join('\n')}\n`);
          fs.writeFileSync(path.join(E.OUTPUT_DIR,'negative-path.txt'),`${NEGATIVE}\n`);
          const positiveFile=path.join(E.OUTPUT_DIR,'internal-preflight.json');
          const positiveRun=run(process.execPath,['--experimental-default-type=module','tools/h-earth-repository-registry-auto-preflight.mjs','--paths-file',path.join(E.OUTPUT_DIR,'internal-paths.txt'),'--task','PR570_V3_POSTMERGE_INTERNAL','--mutation-intent','--output',positiveFile]);
          assert(positiveRun.status===0,'INTERNAL_PREFLIGHT_EXECUTION',positiveRun.stderr);
          const positive=readJson(positiveFile);
          const classifications=positive.pathClassification?.classifications??[];
          assert(positive.finalDisposition==='PASS'&&positive.validatorReceipt?.finalDisposition==='PASS','INTERNAL_PREFLIGHT_RESULT');
          assert(classifications.length===13&&classifications.every(item=>item.registered===true&&item.classification==='REGISTERED_H_EARTH_PATH'&&(item.resolvedNodeIds??[]).includes(E.NODE_ID)),'INTERNAL_PREFLIGHT_PATHS');
          const negativeFile=path.join(E.OUTPUT_DIR,'negative-preflight.json');
          const negativeRun=run(process.execPath,['--experimental-default-type=module','tools/h-earth-repository-registry-auto-preflight.mjs','--paths-file',path.join(E.OUTPUT_DIR,'negative-path.txt'),'--task','PR570_V3_POSTMERGE_NEGATIVE','--mutation-intent','--output',negativeFile]);
          assert(negativeRun.status!==0,'NEGATIVE_NEIGHBOR_UNEXPECTED_PASS');
          const negative=readJson(negativeFile);
          assert(negative.finalDisposition==='STOP'&&negative.mutationMayProceed===false&&negative.pathClassification?.classifications?.[0]?.registered===false,'NEGATIVE_NEIGHBOR_RESULT');

          const loader=await import(`${pathToFileURL(path.join(ROOT,'h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js')).href}?role=${encodeURIComponent(E.EXECUTION_ROLE)}`);
          const c2=await loader.runHEarthC2R1MC5AutomaticRegistryPreflight();
          assert(c2.finalDisposition==='PASS'&&c2.requiredFinalDisposition==='PASS'&&c2.mc5Checks?.allHEarthPathsRegistered===true,'C2_R1_REGRESSION');

          const payload=stable({
            schema:'PR570_V3_POSTMERGE_FINGERPRINT_PAYLOAD_v1',
            mergeCommit:E.MERGE_COMMIT,
            preMergeMain:E.PRE_MERGE_MAIN,
            candidateHead:E.CANDIDATE_HEAD,
            packageCommit:E.PACKAGE_COMMIT,
            sourceHead:E.SOURCE_HEAD,
            sourceFingerprint:sourceReceipt.packageFingerprint,
            activePaths,
            preserved,
            lifecycle,
            lifecycleSemantics:{authority:authority.status,locator:locator.status,ledger:ledger.terminalState,futureAdmission:ledger.activation.futureOperationsRequireSeparateAdmission},
            registry:{nodeId:node.nodeId,lifecycleStatus:node.lifecycleStatus,occurrences:occurrences.sort((a,b)=>a.path.localeCompare(b.path))},
            routes,
            internalPreflight:'PASS',
            negativeNeighbor:'STOP',
            c2Preflight:'PASS',
            integratedSemanticFingerprint:integratedReceipt.packageFingerprint,
            boundaries:{actualTerrainMutation:false,manorConstruction:false,productMutation:false,deployment:false,release:false}
          });
          const receipt=stable({
            schema:'PR570_V3_PERMANENT_INSTRUMENT_POSTMERGE_RECEIPT_v1',
            result:'PASS_CLOSED_ACTIVE_MERGE_REPRODUCED',
            executionRole:E.EXECUTION_ROLE,
            executionHolder:E.EXECUTION_HOLDER,
            mergeCommit:E.MERGE_COMMIT,
            packageFingerprint:digest(payload),
            fingerprintPayload:payload,
            changedPathCount:activePaths.length,
            preservedSourceBlobCount:preserved.length,
            lifecycleSuccessorCount:lifecycle.length,
            acceptedOccurrenceCount:occurrences.length,
            routedPathCount:routes.length,
            negativeNeighborStopped:true,
            c2RegressionPass:true,
            actualTerrainMutationPerformed:false,
            manorConstructionPerformed:false,
            productMutationPerformed:false,
            deploymentPerformed:false,
            releasePerformed:false
          });
          fs.writeFileSync(path.join(E.OUTPUT_DIR,'receipt.json'),`${JSON.stringify(receipt,null,2)}\n`);
          NODE
          node "$RUNNER_TEMP/pr570-v3-postmerge.mjs"
      - uses: actions/upload-artifact@v4
        with:
          name: pr570-v3-postmerge-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ matrix.role }}/
          if-no-files-found: error
          retention-days: 90

  certify-close-and-terminate:
    name: certify-active-main-close-locks-and-terminate
    needs: reproduce-active-merge
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: pr570-v3-postmerge-builder-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/builder
      - uses: actions/download-artifact@v4
        with:
          name: pr570-v3-postmerge-fresh-verifier-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verifier
      - name: Verify durable active main and independent fingerprints
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$MERGE_COMMIT" origin/main
          while IFS= read -r file; do
            test "$(git rev-parse "$MERGE_COMMIT:$file")" = "$(git rev-parse "origin/main:$file")"
          done < <(git diff --name-only "$PRE_MERGE_MAIN" "$MERGE_COMMIT")
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const b=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/builder/receipt.json`,'utf8'));
          const v=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/verifier/receipt.json`,'utf8'));
          const required='PASS_CLOSED_ACTIVE_MERGE_REPRODUCED';
          if(b.result!==required||v.result!==required)throw Error('POSTMERGE_RESULT_MISMATCH');
          if(b.executionHolder===v.executionHolder||b.executionRole===v.executionRole)throw Error('POSTMERGE_HOLDERS_NOT_DISTINCT');
          if(b.packageFingerprint!==v.packageFingerprint)throw Error('POSTMERGE_FINGERPRINT_MISMATCH');
          if(b.mergeCommit!==process.env.MERGE_COMMIT||v.mergeCommit!==process.env.MERGE_COMMIT)throw Error('POSTMERGE_IDENTITY_MISMATCH');
          fs.mkdirSync('/tmp/pr570-v3-final',{recursive:true});
          fs.copyFileSync(`${process.env.RUNNER_TEMP}/builder/receipt.json`,'/tmp/pr570-v3-final/builder-receipt.json');
          fs.copyFileSync(`${process.env.RUNNER_TEMP}/verifier/receipt.json`,'/tmp/pr570-v3-final/verifier-receipt.json');
          NODE
      - name: Close router ownership generation 111 pass closed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/operation-intake/repository-operation-lock-manager.v1.mjs \
              --action close --repository "${{ github.repository }}" --lock-ref "$LOCK_REF" \
              --operation-id "$ROUTER_OPERATION_ID" --lock-scope "$ROUTER_LOCK_SCOPE" \
              --lock-generation "$ROUTER_LOCK_GENERATION" --terminal-disposition PASS_CLOSED \
              --output /tmp/pr570-v3-final/generation-111-closure.json; then break; fi
            test "$attempt" -lt 4
            sleep $((attempt * 2))
          done
          node -e "const r=require('/tmp/pr570-v3-final/generation-111-closure.json');if(r.result!=='TERMINAL_CLOSURE_COMMITTED'||!r.lockReleased)process.exit(1)"
      - name: Close ratification generation 150 pass closed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node tools/operation-intake/repository-operation-lock-manager.v1.mjs \
              --action close --repository "${{ github.repository }}" --lock-ref "$LOCK_REF" \
              --operation-id "$RATIFICATION_OPERATION_ID" --lock-scope "$RATIFICATION_LOCK_SCOPE" \
              --lock-generation "$RATIFICATION_LOCK_GENERATION" --terminal-disposition PASS_CLOSED \
              --output /tmp/pr570-v3-final/generation-150-closure.json; then break; fi
            test "$attempt" -lt 4
            sleep $((attempt * 2))
          done
          node -e "const r=require('/tmp/pr570-v3-final/generation-150-closure.json');if(r.result!=='TERMINAL_CLOSURE_COMMITTED'||!r.lockReleased)process.exit(1)"
      - name: Prove terminal ledger and emit activation receipt
        run: |
          set -euo pipefail
          git fetch origin operation-locks/repository-operation-intake-v1
          git show FETCH_HEAD:.github/operation-intake/active-operation-ledger.v1.json > /tmp/pr570-v3-final/terminal-ledger.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const ledger=JSON.parse(fs.readFileSync('/tmp/pr570-v3-final/terminal-ledger.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/pr570-v3-final/builder-receipt.json','utf8'));
          const v=JSON.parse(fs.readFileSync('/tmp/pr570-v3-final/verifier-receipt.json','utf8'));
          const r111=JSON.parse(fs.readFileSync('/tmp/pr570-v3-final/generation-111-closure.json','utf8'));
          const r150=JSON.parse(fs.readFileSync('/tmp/pr570-v3-final/generation-150-closure.json','utf8'));
          const objects=[];
          const walk=value=>{if(!value||typeof value!=='object')return;objects.push(value);for(const nested of Object.values(value))walk(nested);};
          walk(ledger);
          const terminal=(operationId,generation)=>objects.find(item=>item.operationId===operationId&&item.lockGeneration===generation&&item.state==='TERMINAL'&&item.released===true&&item.terminalDisposition==='PASS_CLOSED');
          if(!terminal(process.env.ROUTER_OPERATION_ID,111))throw Error('GENERATION_111_NOT_TERMINAL');
          if(!terminal(process.env.RATIFICATION_OPERATION_ID,150))throw Error('GENERATION_150_NOT_TERMINAL');
          const activeResidual=objects.some(item=>(item.operationId===process.env.ROUTER_OPERATION_ID||item.operationId===process.env.RATIFICATION_OPERATION_ID)&&item.state==='ADMITTED_LOCKED'&&item.released===false);
          if(activeResidual)throw Error('RESIDUAL_AUTHORITY');
          const receipt={
            schema:'PR570_V3_PERMANENT_INSTRUMENT_ACTIVATION_RECEIPT_v1',
            result:'PASS_CLOSED_PERMANENT_INSTRUMENT_ACTIVE_AND_AUTHORITY_TERMINATED',
            repository:'smansfield635-create/smansfield635-create.github.io',
            immutableSourceHead:process.env.SOURCE_HEAD,
            immutableSourceFingerprint:process.env.SOURCE_FINGERPRINT,
            packageCommit:process.env.PACKAGE_COMMIT,
            candidateHead:process.env.CANDIDATE_HEAD,
            mergeCommit:process.env.MERGE_COMMIT,
            postMergePackageFingerprint:b.packageFingerprint,
            builderHolder:b.executionHolder,
            verifierHolder:v.executionHolder,
            distinctExecutionHolders:true,
            changedPathCount:26,
            preservedSourceBlobCount:22,
            lifecycleSuccessorCount:3,
            acceptedOccurrenceCount:13,
            routedPathCount:26,
            internalRegistryPreflight:'PASS',
            negativeNeighbor:'STOP',
            c2Regression:'PASS',
            routerOwnershipGeneration:111,
            routerOwnershipTerminalDisposition:'PASS_CLOSED',
            routerOwnershipClosureCommit:r111.closureCommitSha,
            ratificationGeneration:150,
            ratificationTerminalDisposition:'PASS_CLOSED',
            ratificationClosureCommit:r150.closureCommitSha,
            permanentInstrumentActive:true,
            actualTerrainMutationPerformed:false,
            manorConstructionPerformed:false,
            productMutationPerformed:false,
            deploymentPerformed:false,
            releasePerformed:false,
            futureOperationsRequireSeparateAdmission:true,
            constructionAuthorityActive:false,
            verificationAuthorityActive:false,
            mergeAuthorityActive:false,
            residualAuthority:false,
            verifierCarrierMerged:false
          };
          receipt.receiptDigest=crypto.createHash('sha256').update(JSON.stringify(receipt)).digest('hex');
          fs.writeFileSync('/tmp/pr570-v3-final/activation-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: pr570-v3-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/pr570-v3-final/
          if-no-files-found: error
          retention-days: 90
