name: Compass Display Continuity Validation

on:
  push:
    branches:
      - agent/compass-structural-reconstruction-v3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-bust-v3:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/compass-structural-reconstruction-v3' && !contains(github.event.head_commit.message, 'Advance Compass v3 cache identity')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/compass-structural-reconstruction-v3
          fetch-depth: 0

      - name: Apply exact Compass stylesheet cache identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '/assets/compass/compass.css?v=display-continuity-reference-v2'
          new = '/assets/compass/compass.css?v=display-continuity-reference-v3'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one old cache identity, found {s.count(old)}')
          if new in s:
              raise SystemExit('new cache identity already present before replacement')
          p.write_text(s.replace(old, new, 1))
          s2 = p.read_text()
          if old in s2 or s2.count(new) != 1:
              raise SystemExit('cache identity replacement verification failed')
          PY

      - name: Commit exact delivery change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git diff --name-only)" = "index.html"
          git add index.html
          git commit -m 'Advance Compass v3 cache identity'
          git push origin HEAD:agent/compass-structural-reconstruction-v3
