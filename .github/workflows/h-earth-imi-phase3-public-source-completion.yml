name: H-Earth IMI Phase 3 Public Source Completion

on:
  pull_request:
    paths:
      - '.github/workflows/h-earth-imi-phase3-public-source-completion.yml'
      - 'h-earth-3d/tools/imi-empirical-platform/generalizability/imi-phase3-public-source-completion-addendum.v1.json'
      - 'h-earth-3d/validation/imi-empirical-platform/imi.phase3.datasus-hospital-package-adapter.py'
      - 'h-earth-3d/validation/imi-empirical-platform/imi.phase3.clac-source-probe.py'
      - 'h-earth-3d/validation/imi-empirical-platform/imi.phase3.hospital-external-or-next-release.runner.mjs'
      - 'h-earth-3d/validation/imi-empirical-platform/imi.phase3.speech-heldout-dataset.runner.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify adapter syntax
        run: |
          set -euo pipefail
          python -m py_compile \
            h-earth-3d/validation/imi-empirical-platform/imi.phase3.datasus-hospital-package-adapter.py \
            h-earth-3d/validation/imi-empirical-platform/imi.phase3.clac-source-probe.py
          node --check h-earth-3d/validation/imi-empirical-platform/imi.phase3.hospital-external-or-next-release.runner.mjs
          node --check h-earth-3d/validation/imi-empirical-platform/imi.phase3.speech-heldout-dataset.runner.mjs
          python -m json.tool \
            h-earth-3d/tools/imi-empirical-platform/generalizability/imi-phase3-public-source-completion-addendum.v1.json \
            >/dev/null

  hospital-public-datasus:
    needs: conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded DATASUS adapter dependencies
        run: python -m pip install --disable-pip-version-check requests datasus-dbc==0.1.3 dbfread==2.0.7
      - name: Execute public non-CMS hospital replication
        env:
          PYTHON: python
        run: |
          set -euo pipefail
          node h-earth-3d/validation/imi-empirical-platform/imi.phase3.hospital-external-or-next-release.runner.mjs \
            --output-dir /tmp/imi-phase3-hospital-public \
            2>&1 | tee /tmp/imi-phase3-hospital-public.log
      - name: Upload public hospital evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imi-phase3-hospital-public-source-evidence
          path: |
            /tmp/imi-phase3-hospital-public.log
            /tmp/imi-phase3-hospital-public/**
          retention-days: 90

  speech-public-clac-probe:
    needs: conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded CLAC remote archive dependency
        run: python -m pip install --disable-pip-version-check remotezip==0.12.3
      - name: Inventory public CLAC archive without full download
        env:
          PYTHON: python
        run: |
          set -euo pipefail
          node h-earth-3d/validation/imi-empirical-platform/imi.phase3.speech-heldout-dataset.runner.mjs \
            --output-dir /tmp/imi-phase3-speech-public \
            2>&1 | tee /tmp/imi-phase3-speech-public.log
      - name: Upload CLAC source inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imi-phase3-speech-public-source-probe
          path: |
            /tmp/imi-phase3-speech-public.log
            /tmp/imi-phase3-speech-public/**
          retention-days: 90
