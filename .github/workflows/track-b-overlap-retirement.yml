name: Track B overlap retirement migration
on:
  push:
    branches: [track-b/remove-overlap-authorities]
    paths:
      - '.github/workflows/track-b-overlap-retirement.yml'
permissions:
  contents: write
jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: track-b/remove-overlap-authorities
          fetch-depth: 0
      - name: Retire overlapping static Compass presentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          original=s

          # Replace the historical rendered introduction with the canonical closed Track B shell.
          intro=re.compile(r'<details class="compass-introduction" data-compass-full-introduction>.*?</details>',re.S)
          canonical='''<details class="compass-track-b-intro" data-track-b-introduction><summary>New here? Open the introduction.</summary><div class="compass-track-b-intro__body"><div class="compass-track-b-film"><video controls preload="metadata" playsinline aria-label="Diamond Gate Bridge — Chapter One"><source src="/showroom/globe/h-earth/awards/media/diamond-gate-compass-mirrorland-36s.mp4" type="video/mp4"></video></div><details class="compass-track-b-about"><summary>What is Diamond Gate Bridge?</summary><div class="compass-track-b-about-copy" data-track-b-about-copy><p>Diamond Gate exists because useful ideas are often separated by the boundaries between disciplines, products, institutions, and stories. The estate gives those different kinds of work one place to meet without pretending they are all the same thing.</p><p>It connects research, software, worlds, evidence, governance, construction, and human questions so you can move between them while keeping their differences visible.</p><p>For thousands of years, people have searched for better ways to understand themselves, each other, and the systems they inhabit. Philosophers questioned first principles. Each discipline illuminated part of the landscape.</p><p>Perhaps the next step is not abandoning what came before, but making those pieces easier to see together. The Earth did not become round when we discovered it. What if the next frontier is not outside the box, but outside the cube? Diamond Gate Bridge begins with that question.</p><p>The Compass is how you orient yourself inside that larger purpose. North gives context. East opens worlds. South measures and governs. West builds and tests.</p><p>Bring a question. Move through the estate until the right kind of room becomes clear.</p></div></details></div></details>'''
          s,n=intro.subn(canonical,s,count=1)
          assert n==1,'historical introduction not found exactly once'

          # Remove historical capability cards/cue entirely. Runtime now owns the only rendered capability surface.
          legacy=re.compile(r'<p class="compass-capability-cue">Three ways to engage\.</p>\s*<section class="compass-monuments"[^>]*data-compass-capability-switcher.*?</section>',re.S)
          s,n=legacy.subn('',s,count=1)
          assert n==1,'historical capability presentation not found exactly once'

          # Remove the historical directory and accessibility presentation entirely.
          s,n=re.subn(r'<nav class="compass-selective-routes".*?</nav>','',s,count=1,flags=re.S)
          assert n==1,'historical route directory not found exactly once'
          s,n=re.subn(r'<p class="compass-accessibility-note">.*?</p>','',s,count=1,flags=re.S)
          assert n==1,'historical accessibility paragraph not found exactly once'

          # Place one empty mount anchor between evidence and the final CTA.
          marker='</section><section class="compass-build-cta" aria-labelledby="build-custom-title">'
          assert marker in s,'built/CTA boundary missing'
          s=s.replace(marker,'</section><div data-compass-capability-mount></div><section class="compass-build-cta" aria-labelledby="build-custom-title">',1)

          # Remove obsolete inline behavior bound only to the deleted capability switcher.
          old=re.compile(r"document\.addEventListener\('DOMContentLoaded',\(\)=>\{const capabilityChoices=.*?\}\);(?=\n</script>)",re.S)
          s,n=old.subn('',s,count=1)
          assert n==1,'obsolete inline capability handler not found exactly once'

          assert s!=original
          p.write_text(s)
          PY
      - name: Verify retired presentation is absent
        run: |
          grep -q 'data-compass-capability-mount' index.html
          grep -q 'class="compass-track-b-intro"' index.html
          ! grep -q 'data-compass-capability-switcher' index.html
          ! grep -q 'class="compass-selective-routes"' index.html
          ! grep -q 'class="compass-accessibility-note"' index.html
          ! grep -q 'const capabilityChoices=' index.html
      - name: Commit migration result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'refactor(track-b): retire overlapping static Compass presentation'
          git push origin HEAD:track-b/remove-overlap-authorities
