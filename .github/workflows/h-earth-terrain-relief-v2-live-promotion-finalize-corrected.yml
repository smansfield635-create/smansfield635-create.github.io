name: H-Earth Terrain Relief V2 Exact Live Promotion Finalize Corrected

on:
  push:
    branches:
      - promotion/h-earth-terrain-relief-v2-exact-live-default-001
    paths:
      - .github/workflows/h-earth-terrain-relief-v2-live-promotion-finalize-corrected.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify custody, transplant exact blobs, and promote selector
        shell: bash
        run: |
          set -euo pipefail
          BASE='bc83b194b7a36c4ad7d11ee97f1cfe52224692ec'
          REVIEWED='97003e9de386a8962fb46d0b370005b900a167d6'
          RENDERER='showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js'
          BINDING='showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js'
          INDEX='showroom/globe/h-earth/index.html'
          TEMP_1='.github/workflows/h-earth-terrain-relief-v2-live-promotion-finalize.yml'
          TEMP_2='.github/workflows/h-earth-terrain-relief-v2-promotion-trigger-probe.yml'
          TEMP_3='.github/workflows/h-earth-terrain-relief-v2-live-promotion-finalize-corrected.yml'

          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          mapfile -t initial_paths < <(git diff --name-only "$BASE" HEAD)
          test "${#initial_paths[@]}" -eq 3
          printf '%s\n' "${initial_paths[@]}" | grep -Fx "$TEMP_1"
          printf '%s\n' "${initial_paths[@]}" | grep -Fx "$TEMP_2"
          printf '%s\n' "${initial_paths[@]}" | grep -Fx "$TEMP_3"

          test "$(git hash-object showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-round1-1f520809.js)" = 'de55609b0b0bd66601445a369c727ff7a6d7065d'
          test "$(git hash-object "$BINDING")" = '5eb1b6f2e72ac0525f608850234182b2c646f66f'
          test "$(git hash-object "$INDEX")" = '8e8c646821971f40d57a8a1966133b1dcb9a741b'
          test ! -e "$RENDERER"

          git fetch --no-tags origin "$REVIEWED"
          test "$(git rev-parse "$REVIEWED:$RENDERER")" = '98c6e1f9b9fe4510157367600b85b9d31228056b'
          test "$(git rev-parse "$REVIEWED:$BINDING")" = '16bc8c45fb5c2363326d05f7610e11387b3a4e38'

          git show "$REVIEWED:$RENDERER" > "$RENDERER"
          git show "$REVIEWED:$BINDING" > "$BINDING"
          test "$(git hash-object "$RENDERER")" = '98c6e1f9b9fe4510157367600b85b9d31228056b'
          test "$(git hash-object "$BINDING")" = '16bc8c45fb5c2363326d05f7610e11387b3a4e38'

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('showroom/globe/h-earth/index.html')
          text = path.read_text()
          script_pattern = re.compile(
              r'(<script id="h-earth-cp2-round1-default-promotion">)(.*?)(</script>)',
              re.DOTALL,
          )
          match = script_pattern.search(text)
          if not match:
              raise SystemExit('DEFAULT_PROMOTION_SCRIPT_NOT_FOUND')
          body = match.group(2)
          before_if = "if (!parameters.has('cp2')) {"
          after_if = "if (!parameters.has('visual') && !parameters.has('cp2')) {"
          before_set = "parameters.set('cp2', 'round1-1f520809');"
          after_set = "parameters.set('visual', 'terrain-relief-v2');"
          if body.count(before_if) != 1:
              raise SystemExit(f'DEFAULT_IF_MARKER_COUNT:{body.count(before_if)}')
          if body.count(before_set) != 1:
              raise SystemExit(f'DEFAULT_SET_MARKER_COUNT:{body.count(before_set)}')
          if after_if in body or after_set in body:
              raise SystemExit('DEFAULT_SELECTOR_ALREADY_PROMOTED')
          promoted = body.replace(before_if, after_if).replace(before_set, after_set)
          replacement = match.group(1) + promoted + match.group(3)
          updated = text[:match.start()] + replacement + text[match.end():]
          if updated.count(after_if) != 1 or updated.count(after_set) != 1:
              raise SystemExit('PROMOTED_SELECTOR_COUNT_INVALID')
          path.write_text(updated)
          PY

          node --input-type=module --check < "$RENDERER"
          node --input-type=module --check < "$BINDING"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rendererPath='showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js';
          const bindingPath='showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js';
          const indexPath='showroom/globe/h-earth/index.html';
          const renderer=fs.readFileSync(rendererPath,'utf8');
          const binding=fs.readFileSync(bindingPath,'utf8');
          const index=fs.readFileSync(indexPath,'utf8');
          const requiredRenderer=[
            'H_EARTH_CURRENT_LIVE_BAND_LIMITED_TERRAIN_RELIEF_PRESENTATION_PROFILE_v2',
            '3.306939635357677','2.7318196987737333','2.243994752564138',
            '0.9271838545667874','0.3746065934159120',
            'mix(0.07,0.14,terrainReliefEnvelope)'
          ];
          for(const token of requiredRenderer) if(!renderer.includes(token)) throw new Error(`RENDERER_TOKEN_MISSING:${token}`);
          for(const token of ["'terrain-relief-v2'","'../../render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js'",'const selectedRendererModule = await import(selectedRendererPath);']) if(!binding.includes(token)) throw new Error(`BINDING_TOKEN_MISSING:${token}`);
          if((binding.match(/await import\(selectedRendererPath\)/g)||[]).length!==1) throw new Error('RENDERER_IMPORT_COUNT_NOT_ONE');
          const script=index.match(/<script id="h-earth-cp2-round1-default-promotion">([\s\S]*?)<\/script>/)?.[1]||'';
          for(const token of ["if (!parameters.has('visual') && !parameters.has('cp2'))","parameters.set('visual', 'terrain-relief-v2')"]) if(!script.includes(token)) throw new Error(`INDEX_TOKEN_MISSING:${token}`);
          if(script.includes("if (!parameters.has('cp2'))")) throw new Error('PRIOR_DEFAULT_IF_REMAINS');
          if(script.includes("parameters.set('cp2', 'round1-1f520809')")) throw new Error('PRIOR_DEFAULT_SET_REMAINS');
          NODE

          mapfile -t working_paths < <(git status --short | sed -E 's/^...//')
          printf '%s\n' "${working_paths[@]}" | sort -u > /tmp/working-paths.txt
          test "$(wc -l < /tmp/working-paths.txt)" -eq 3
          grep -Fx "$RENDERER" /tmp/working-paths.txt
          grep -Fx "$BINDING" /tmp/working-paths.txt
          grep -Fx "$INDEX" /tmp/working-paths.txt

      - name: Install Chromium and start local server
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.54.1
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          for n in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/showroom/globe/h-earth/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/server.log
          exit 1

      - name: Validate default V2, explicit V2, CP2 reference, and lifecycle
        shell: bash
        run: |
          cat > .promotion-v2-verify.cjs <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          const CP2='../../render/persistent-live-renderer.run8e-r3c.cp2-round1-1f520809.js';
          const V2='../../render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js';
          async function check(browser,label,query,expectedPath,expectedAdditive,expectedCp2,expectedQuery){
            const context=await browser.newContext({viewport:{width:1280,height:720}});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',error=>errors.push(error.message));
            const response=await page.goto(`http://127.0.0.1:4173/showroom/globe/h-earth/${query}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>document.getElementById('h-earth-functional-landscape-route')?.dataset?.run8eReady==='true'&&typeof window.H_EARTH_RUN8E_PUBLIC_ROUTE?.getLiveGpuReceipt==='function',null,{timeout:120000});
            const state=await page.evaluate(()=>{
              const canvas=document.getElementById('h-earth-functional-landscape-canvas');
              const receipt=window.H_EARTH_RUN8E_PUBLIC_ROUTE.getLiveGpuReceipt();
              const gl=canvas?.getContext?.('webgl2');
              return {href:location.href,search:location.search,receipt,webgl:!!gl,lost:gl?.isContextLost?.()};
            });
            const r=state.receipt, failures=[];
            if(response?.status()!==200) failures.push('HTTP');
            if(!state.webgl||state.lost!==false) failures.push('WEBGL');
            if(r?.selectedRendererPath!==expectedPath) failures.push(`PATH:${r?.selectedRendererPath}`);
            if(r?.additiveVisualRequested!==expectedAdditive) failures.push('ADDITIVE');
            if(r?.liveDifferential?.requested!==expectedCp2) failures.push('CP2');
            if(!state.search.includes(expectedQuery)) failures.push(`QUERY:${state.search}`);
            if(r?.resources?.counters?.shaderCompileCount!==4) failures.push('SHADERS');
            if(r?.resources?.counters?.programLinkCount!==2) failures.push('PROGRAMS');
            if((r?.counters?.gpuFramebufferPresentationCount??0)<1) failures.push('FRAME');
            if(r?.resources?.packageUploadedOnce!==true) failures.push('UPLOAD');
            if(r?.resources?.resourceIdentityStable!==true) failures.push('IDENTITY');
            if(r?.resources?.noPostInitializationResourceCreation!==true) failures.push('POST_RESOURCE');
            if(r?.resources?.noPostInitializationBufferUpload!==true) failures.push('POST_UPLOAD');
            if(errors.length) failures.push(`PAGE:${errors.join(',')}`);
            const result={label,finalUrl:state.href,selectedRendererPath:r?.selectedRendererPath,additiveVisualRequested:r?.additiveVisualRequested,cp2Requested:r?.liveDifferential?.requested,shaderCompileCount:r?.resources?.counters?.shaderCompileCount,programLinkCount:r?.resources?.counters?.programLinkCount,visibleFrames:r?.counters?.gpuFramebufferPresentationCount,packageUploadedOnce:r?.resources?.packageUploadedOnce,resourceIdentityStable:r?.resources?.resourceIdentityStable,noPostInitializationResourceCreation:r?.resources?.noPostInitializationResourceCreation,noPostInitializationBufferUpload:r?.resources?.noPostInitializationBufferUpload,failures};
            await context.close();
            if(failures.length) throw new Error(`${label}:${failures.join('|')}`);
            return result;
          }
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
            let results;
            try{
              results=[
                await check(browser,'NO_QUERY_LIVE_DEFAULT','',V2,true,false,'visual=terrain-relief-v2'),
                await check(browser,'EXPLICIT_VISUAL_V2','?visual=terrain-relief-v2',V2,true,false,'visual=terrain-relief-v2'),
                await check(browser,'EXPLICIT_CP2_REFERENCE','?cp2=round1-1f520809',CP2,false,true,'cp2=round1-1f520809')
              ];
            } finally { await browser.close(); }
            const receipt={receiptType:'H_EARTH_TERRAIN_RELIEF_V2_EXACT_LIVE_DEFAULT_PROMOTION_PREMERGE_VALIDATION_v1',result:'PASS',workflowRunId:process.env.GITHUB_RUN_ID,validationHead:process.env.GITHUB_SHA,executionTimePremergeMainHead:'bc83b194b7a36c4ad7d11ee97f1cfe52224692ec',reviewedCandidateHead:'97003e9de386a8962fb46d0b370005b900a167d6',reviewedRendererBlob:'98c6e1f9b9fe4510157367600b85b9d31228056b',reviewedBindingBlob:'16bc8c45fb5c2363326d05f7610e11387b3a4e38',indexDefaultSelectorDelta:'PASS_EXACT',shaderCompile:'PASS_4_OF_4',programLink:'PASS_2_OF_2',visibleFrame:'PASS',resourceLifecycle:'PASS',results};
            fs.writeFileSync('/tmp/promotion-receipt.json',JSON.stringify(receipt,null,2)+'\n');
            console.log(JSON.stringify(receipt,null,2));
          })().catch(error=>{
            fs.writeFileSync('/tmp/promotion-receipt.json',JSON.stringify({result:'FAIL',workflowRunId:process.env.GITHUB_RUN_ID,error:error.stack||String(error)},null,2)+'\n');
            throw error;
          });
          NODE
          node .promotion-v2-verify.cjs

      - name: Freeze exact three-path promotion head
        shell: bash
        run: |
          set -euo pipefail
          BASE='bc83b194b7a36c4ad7d11ee97f1cfe52224692ec'
          RENDERER='showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js'
          BINDING='showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js'
          INDEX='showroom/globe/h-earth/index.html'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/h-earth-terrain-relief-v2-live-promotion-finalize.yml
          git rm .github/workflows/h-earth-terrain-relief-v2-promotion-trigger-probe.yml
          git rm .github/workflows/h-earth-terrain-relief-v2-live-promotion-finalize-corrected.yml
          rm -f .promotion-v2-verify.cjs
          git add "$RENDERER" "$BINDING" "$INDEX"
          git commit -m 'Promote exact terrain relief V2 as H-Earth live default'
          FINAL_HEAD=$(git rev-parse HEAD)
          RENDERER_BLOB=$(git hash-object "$RENDERER")
          BINDING_BLOB=$(git hash-object "$BINDING")
          INDEX_BLOB=$(git hash-object "$INDEX")
          test "$RENDERER_BLOB" = '98c6e1f9b9fe4510157367600b85b9d31228056b'
          test "$BINDING_BLOB" = '16bc8c45fb5c2363326d05f7610e11387b3a4e38'
          mapfile -t paths < <(git diff --name-only "$BASE" HEAD)
          test "${#paths[@]}" -eq 3
          printf '%s\n' "${paths[@]}" | grep -Fx "$RENDERER"
          printf '%s\n' "${paths[@]}" | grep -Fx "$BINDING"
          printf '%s\n' "${paths[@]}" | grep -Fx "$INDEX"
          git push origin HEAD:promotion/h-earth-terrain-relief-v2-exact-live-default-001
          echo "FINAL_HEAD=$FINAL_HEAD" >> "$GITHUB_ENV"
          echo "RENDERER_BLOB=$RENDERER_BLOB" >> "$GITHUB_ENV"
          echo "BINDING_BLOB=$BINDING_BLOB" >> "$GITHUB_ENV"
          echo "INDEX_BLOB=$INDEX_BLOB" >> "$GITHUB_ENV"

      - name: Publish exact premerge receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipt=JSON.parse(fs.readFileSync('/tmp/promotion-receipt.json','utf8'));
          receipt.promotionExactHead=process.env.FINAL_HEAD;
          receipt.rendererGitBlob=process.env.RENDERER_BLOB;
          receipt.bindingGitBlob=process.env.BINDING_BLOB;
          receipt.indexGitBlob=process.env.INDEX_BLOB;
          fs.writeFileSync('/tmp/promotion-receipt-final.json',JSON.stringify(receipt,null,2)+'\n');
          NODE
          { echo '## Exact terrain relief V2 live-promotion premerge validation'; echo; echo '```json'; cat /tmp/promotion-receipt-final.json; echo '```'; } >/tmp/comment.md
          gh pr comment 529 --repo smansfield635-create/smansfield635-create.github.io --body-file /tmp/comment.md

      - name: Publish failure locator
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 529 --repo smansfield635-create/smansfield635-create.github.io --body "H_EARTH_V2_LIVE_PROMOTION_CORRECTED_FAILURE:${GITHUB_RUN_ID}:${GITHUB_SHA}"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-terrain-relief-v2-live-promotion-corrected-${{ github.run_id }}
          path: |
            /tmp/promotion-receipt.json
            /tmp/promotion-receipt-final.json
            /tmp/server.log
          if-no-files-found: warn
          retention-days: 30
