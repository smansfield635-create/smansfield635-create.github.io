name: Methods Role 6 Audit Admitted Execution Carrier
on:
  pull_request:
    paths:
      - '.github/workflows/methods-role6-audit-admitted-execution-carrier.yml'
      - 'control-plane/methods-information-benchmark/role6-audit-execution-carrier/audit-package.v1.json'
permissions:
  contents: write
  actions: read
concurrency:
  group: methods-role6-audit-admitted-execution-carrier-v2
  cancel-in-progress: false
env:
  REPOSITORY: smansfield635-create/smansfield635-create.github.io
  CARRIER_BASE_HEAD: 7d672c10a99cb525bf9fb4b40b51ec8157944bb5
  CARRIER_OPERATION_ID: METHODS_ROLE_6_AUDIT_ADMITTED_EXECUTION_CARRIER_v2
  CARRIER_LOCK_SCOPE: METHODS_INFORMATION_BENCHMARK/ROLE6_AUDIT/ADMITTED_EXECUTION_CARRIER/V2
  CARRIER_LOCK_GENERATION: '50'
  AUDIT_OPERATION_ID: METHODS_FORMAL_RECORD_TYPE_DEPENDENCY_THREE_ANCHOR_AND_DEVELOPMENTAL_BASELINE_AUDIT_v1
  AUDIT_LOCK_SCOPE: METHODS_INFORMATION_BENCHMARK/ROLE6_AUDIT/FORMAL_RECORD_TYPE_DEPENDENCY_THREE_ANCHOR_DEVELOPMENTAL_BASELINE
  AUDIT_LOCK_GENERATION: '49'
  AUDIT_GOVERNING_HEAD: 7d672c10a99cb525bf9fb4b40b51ec8157944bb5
  AUDIT_BRANCH: audit/methods-role6-formal-record-three-anchor-developmental-baseline-v1-001
  AUDIT_TOOLING_HEAD: a823c1fee318297d77cac6d24d4f268ac45dafcf
  MANIFEST_PATH: control-plane/methods-information-benchmark/role6-audit-execution-carrier/audit-package.v1.json
  LOCK_REF: refs/heads/operation-locks/repository-operation-intake-v1
jobs:
  execute:
    name: execute admitted audit and terminate temporary authorities
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute exact carrier
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILDER_HOLDER: MIB_ROLE6_AUDIT_BUILDER_${{ github.run_id }}_${{ github.run_attempt }}
          FRESH_HOLDER: MIB_ROLE6_AUDIT_FRESH_VERIFIER_${{ github.run_id }}_${{ github.run_attempt }}
          FINAL_HOLDER: MIB_ROLE6_AUDIT_FINAL_VERIFIER_${{ github.run_id }}_${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/evidence"; P="$RUNNER_TEMP/package"; B="$RUNNER_TEMP/builder"; V="$RUNNER_TEMP/fresh"
          mkdir -p "$E" "$P"
          success=0
          close_lock(){
            local op="$1" scope="$2" gen="$3" disp="$4" out="$5"
            for attempt in 1 2 3 4 5; do
              set +e
              node tools/operation-intake/repository-operation-lock-manager.v1.mjs --action close --repository "$REPOSITORY" --lock-ref "$LOCK_REF" --operation-id "$op" --lock-scope "$scope" --lock-generation "$gen" --terminal-disposition "$disp" --output "$out"
              local status=$?
              set -e
              local result code
              result="$(node -e 'const r=require(process.argv[1]);process.stdout.write(String(r.result||""))' "$out")"
              [ "$result" = TERMINAL_CLOSURE_COMMITTED ] && return 0
              code="$(node -e 'const r=require(process.argv[1]);process.stdout.write(String(r.errorCode||""))' "$out")"
              [ "$result" = LOCK_NOT_CLOSED ] && [ "$code" = LEDGER_COMPARE_AND_SWAP_CONFLICT ] || return "$status"
              sleep "$attempt"
            done
            return 1
          }
          finish(){
            local prior=$?; trap - EXIT
            local disp=FAIL_CLOSED audit_ok=0 carrier_ok=0
            [ "$success" = 1 ] && disp=PASS_CLOSED
            close_lock "$AUDIT_OPERATION_ID" "$AUDIT_LOCK_SCOPE" "$AUDIT_LOCK_GENERATION" "$disp" "$E/root-lock-closure-receipt.json" && audit_ok=1 || true
            [ "$audit_ok" = 1 ] && [ "$success" = 1 ] || disp=FAIL_CLOSED
            close_lock "$CARRIER_OPERATION_ID" "$CARRIER_LOCK_SCOPE" "$CARRIER_LOCK_GENERATION" "$disp" "$E/carrier-lock-closure-receipt.json" && carrier_ok=1 || true
            [ "$audit_ok" = 1 ] && [ "$carrier_ok" = 1 ] || exit 1
            exit "$prior"
          }
          trap finish EXIT
          git fetch origin "$CARRIER_BASE_HEAD"
          test "$(git rev-parse "$CARRIER_BASE_HEAD^{commit}")" = "$CARRIER_BASE_HEAD"
          git diff --name-only "$CARRIER_BASE_HEAD...HEAD" | sort > "$RUNNER_TEMP/actual"
          printf '%s\n' '.github/workflows/methods-role6-audit-admitted-execution-carrier.yml' "$MANIFEST_PATH" | sort > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          node --input-type=module <<'NODE'
          import fs from'node:fs';import crypto from'node:crypto';import zlib from'node:zlib';
          import{loadRegistry,validatePackage,packageFingerprint,outputManifestSha256}from'./tools/methods-role6-audit/lib.v1.mjs';
          const h={Accept:'application/vnd.github+json',Authorization:`Bearer ${process.env.GITHUB_TOKEN}`,'X-GitHub-Api-Version':'2022-11-28'};
          const api=async u=>{const r=await fetch(u,{headers:h});if(!r.ok)throw Error(`API:${r.status}:${u}`);return r.json()};
          const m=JSON.parse(fs.readFileSync(process.env.MANIFEST_PATH,'utf8'));
          if(m.schema!=='METHODS_ROLE6_AUDIT_REPOSITORY_RESIDENT_PACKAGE_CARRIER_v2'||m.encoding!=='gzip-base64')throw Error('MANIFEST_IDENTITY');
          if(m.auditLockGeneration!==Number(process.env.AUDIT_LOCK_GENERATION)||m.carrierLockGeneration!==Number(process.env.CARRIER_LOCK_GENERATION)||m.auditOperationId!==process.env.AUDIT_OPERATION_ID||m.carrierOperationId!==process.env.CARRIER_OPERATION_ID||m.auditBranch!==process.env.AUDIT_BRANCH||m.auditToolingHead!==process.env.AUDIT_TOOLING_HEAD||m.governingMainHead!==process.env.AUDIT_GOVERNING_HEAD)throw Error('MANIFEST_BINDING');
          const lf=await api(`https://api.github.com/repos/${process.env.REPOSITORY}/contents/.github/operation-intake/active-operation-ledger.v1.json?ref=${encodeURIComponent('operation-locks/repository-operation-intake-v1')}`);
          const l=JSON.parse(Buffer.from(String(lf.content).replace(/\s/g,''),'base64').toString());
          for(const [op,gen,head] of [[process.env.AUDIT_OPERATION_ID,Number(process.env.AUDIT_LOCK_GENERATION),process.env.AUDIT_GOVERNING_HEAD],[process.env.CARRIER_OPERATION_ID,Number(process.env.CARRIER_LOCK_GENERATION),process.env.CARRIER_BASE_HEAD]]){const x=Object.values(l.activeScopes??{}).find(v=>v.operationId===op);if(!x||x.lockGeneration!==gen||x.governingHead!==head||x.state!=='ADMITTED_LOCKED'||x.released!==false)throw Error(`LOCK_NOT_ACTIVE:${op}`)}
          const gz=Buffer.from(m.compressedBase64,'base64');if(crypto.createHash('sha256').update(gz).digest('hex')!==m.compressedSha256)throw Error('COMPRESSED_HASH');
          const raw=zlib.gunzipSync(gz);if(crypto.createHash('sha256').update(raw).digest('hex')!==m.uncompressedSha256)throw Error('PACKAGE_FILE_HASH');
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/package/audit-package.v1.json`,raw);
          const pkg=JSON.parse(raw),r=loadRegistry(process.cwd());validatePackage(pkg,r);
          const pf=packageFingerprint(pkg,r),om=outputManifestSha256(pkg);if(pf!==m.packageFingerprint||om!==m.outputManifestSha256)throw Error('PACKAGE_IDENTITY');
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/evidence/package-validation-receipt.json`,JSON.stringify({schema:'METHODS_ROLE6_AUDIT_PACKAGE_VALIDATION_RECEIPT_v2',result:'PASS_CLOSED',compressedSha256:m.compressedSha256,uncompressedSha256:m.uncompressedSha256,packageFingerprint:pf,outputManifestSha256:om,substantiveOutputCount:27,returnPacketCount:1,auditLockGeneration:m.auditLockGeneration,carrierLockGeneration:m.carrierLockGeneration},null,2)+'\n');
          NODE
          for p in control-plane/methods-information-benchmark/role6-audit-bootstrap/audit-output-path-registry.v1.json control-plane/methods-information-benchmark/role6-audit-bootstrap/audit-package.schema.v1.json tools/methods-role6-audit/lib.v1.mjs tools/methods-role6-audit/audit-package-materializer.v1.mjs tools/methods-role6-audit/audit-package-verifier.v1.mjs; do test "$(git rev-parse "HEAD:$p")" = "$(git rev-parse "$AUDIT_TOOLING_HEAD:$p")"; done
          git fetch origin "$AUDIT_BRANCH" "$AUDIT_TOOLING_HEAD"
          test "$(git rev-parse "origin/$AUDIT_BRANCH^{commit}")" = "$AUDIT_TOOLING_HEAD"
          git worktree add --detach "$B" "origin/$AUDIT_BRANCH"
          (cd "$B" && node tools/methods-role6-audit/audit-package-materializer.v1.mjs --self-test > "$E/materializer-self-test.json" && node tools/methods-role6-audit/audit-package-materializer.v1.mjs --input "$P/audit-package.v1.json" --output-root . --receipt "$E/audit-materialization.receipt.v1.json" && node tools/methods-role6-audit/audit-package-verifier.v1.mjs --input "$P/audit-package.v1.json" --output-root . --holder "$BUILDER_HOLDER" --receipt "$E/builder-verification-receipt.json" && git config user.name methods-role6-audit-builder && git config user.email actions@users.noreply.github.com && git add control-plane/methods-information-benchmark/role6-audit && test "$(git diff --cached --name-only|wc -l|tr -d ' ')" = 28 && git commit -m 'Materialize 27 Methods Role 6 audit outputs and return packet')
          candidate="$(git -C "$B" rev-parse HEAD^{commit})"; git -C "$B" push origin "HEAD:refs/heads/$AUDIT_BRANCH"
          git worktree add --detach "$V" "$candidate"
          (cd "$V" && node tools/methods-role6-audit/audit-package-verifier.v1.mjs --input "$P/audit-package.v1.json" --output-root . --holder "$FRESH_HOLDER" --receipt "$E/fresh-verification-receipt.json" && test -z "$(git status --porcelain)")
          LEDGER=control-plane/methods-information-benchmark/assignment-state/role6-first-atomic-assignment-v1/first-assignment-ledger.successor.v1.json
          RR=control-plane/methods-information-benchmark/role6-audit/receipts/role6-operation-return.receipt.v1.json
          (cd "$B" && node tools/methods-role6-audit/audit-package-materializer.v1.mjs --input "$P/audit-package.v1.json" --return-assignment --ledger "$LEDGER" --output-receipt "$RR" --successor-ledger "$E/first-assignment-ledger.returned-successor.v1.json" && node tools/methods-role6-audit/audit-package-verifier.v1.mjs --input "$P/audit-package.v1.json" --output-root . --holder "$FINAL_HOLDER" --receipt "$E/final-verification-receipt.json" --final-receipt "$RR" --successor-ledger "$E/first-assignment-ledger.returned-successor.v1.json" && git add "$RR" && test "$(git diff --cached --name-only|wc -l|tr -d ' ')" = 1 && git commit -m 'Return Methods Role 6 audit assignment to inactive')
          final="$(git -C "$B" rev-parse HEAD^{commit})"; git -C "$B" push origin "HEAD:refs/heads/$AUDIT_BRANCH"
          cp "$B/control-plane/methods-information-benchmark/role6-audit/receipts/role6-operation-return.packet.v1.json" "$E/"
          cp "$B/$RR" "$E/"
          node -e 'const fs=require("fs");fs.writeFileSync(process.argv[1],JSON.stringify({schema:"METHODS_ROLE6_AUDIT_EXECUTION_SUMMARY_v1",result:"PASS_CLOSED",auditBranch:process.env.AUDIT_BRANCH,candidateHead:process.argv[2],finalHead:process.argv[3],substantiveOutputs:"27_OF_27",returnArtifacts:"2_OF_2",role6State:"INACTIVE",publicMutation:false,merge:false},null,2)+"\n")' "$E/execution-summary.json" "$candidate" "$final"
          success=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: methods-role6-audit-complete-evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 90
