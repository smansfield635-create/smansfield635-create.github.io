name: H-Earth Retired Capacity-Path Reconciliation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile-retired-capacity-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile active and retired capacity occurrences
        run: |
          sed -i "s/import { fileURLToPath } from 'node:url';/import { fileURLToPath, pathToFileURL } from 'node:url';/" tools/h-earth-capacity-retired-path-reconciliation.mjs
          node --experimental-default-type=module tools/h-earth-capacity-retired-path-reconciliation.mjs
      - name: Restore workflow and remove temporary reconciler
        run: |
          git show origin/main:.github/workflows/h-earth-post-merge-scope-disposition-audit.yml > .github/workflows/h-earth-post-merge-scope-disposition-audit.yml
          rm -f tools/h-earth-capacity-retired-path-reconciliation.mjs
      - name: Commit reconciled final candidate
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Register retired capacity path as absent historical occurrence"
          git push origin "HEAD:${HEAD_BRANCH}"
