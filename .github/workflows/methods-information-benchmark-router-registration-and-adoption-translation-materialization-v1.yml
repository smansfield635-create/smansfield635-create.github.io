name: Methods Information Benchmark Adoption Translation Verification and Closure v1

on:
  workflow_dispatch:
  push:
    branches:
      - materialization/methods-adoption-translation-v1-001
    paths:
      - .github/workflows/methods-information-benchmark-router-registration-and-adoption-translation-materialization-v1.yml

permissions:
  contents: write
  actions: read
  issues: read
  pull-requests: read

env:
  REPOSITORY: smansfield635-create/smansfield635-create.github.io
  BASE: ffe3cb714751ea0e8df2e53611538f6cadcc241c
  SOURCE_AUDIT_HEAD: 7eee0e3f7a8c37e548e7721f1f5c2df69b2a310a
  FINGERPRINT: 4fc8e2280057b426e1573ab5ac4f710e0b0d1881264d443a56fb25b9f560f79e
  G58_OPERATION: METHODS_AND_MODELS_AUDIT_OUTPUT_ADOPTION_AND_PAGE_TRANSLATION_v1
  G58_SCOPE: METHODS_INFORMATION_BENCHMARK/METHODS_AND_MODELS/AUDIT_OUTPUT_ADOPTION_AND_PAGE_TRANSLATION/V1
  G64_OPERATION: METHODS_INFORMATION_BENCHMARK_ROUTER_REGISTRATION_AND_ADOPTION_TRANSLATION_PACKAGE_MATERIALIZATION_v1
  G64_SCOPE: METHODS_INFORMATION_BENCHMARK/ROUTER_REGISTRATION/ADOPTION_TRANSLATION_PACKAGE_MATERIALIZATION/V1
  VERIFIER: .github/ai-router/projects/methods-information-benchmark/verify-router-registration-and-package.v1.mjs
  W: .github/workflows/methods-information-benchmark-router-registration-and-adoption-translation-materialization-v1.yml
  P0: .github/workflows/methods-and-models-audit-output-adoption-and-page-translation-v1.yml
  ROOT: control-plane/methods-information-benchmark/adoption-and-page-translation-v1
  IREC: control-plane/methods-information-benchmark/adoption-and-page-translation-v1/receipts/independent-verification.receipt.v1.json
  CREC: control-plane/methods-information-benchmark/adoption-and-page-translation-v1/receipts/operation-closure.receipt.v1.json

jobs:
  core:
    runs-on: ubuntu-24.04
    outputs:
      head: ${{ steps.identity.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        name: Confirm exact seven-path nonpublic core
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE" "$GITHUB_SHA")" = "$BASE"
          mapfile -t actual < <(git diff --name-only "$BASE..$GITHUB_SHA" | sort)
          mapfile -t expected < <(printf '%s\n' \
            "$W" \
            "$P0" \
            "$ROOT/adoption-register.v1.json" \
            "$ROOT/page-translation-model.v1.json" \
            "$ROOT/review-package.v1.json" \
            "$ROOT/review-summary.v1.json" \
            "$ROOT/rolodex-information-map.v1.json" | sort)
          test "${#actual[@]}" -eq 7
          test "${actual[*]}" = "${expected[*]}"
          test ! -e "$IREC"
          test ! -e "$CREC"
          test "$(sha256sum "$P0" | cut -d' ' -f1)" = "e7cd206fd90ffdd005cbd0f01048792c3d178faa10e353df1a7bb1e856a14686"
          node - <<'NODE'
          const fs = require('fs');
          const root = process.env.ROOT + '/';
          const adoption = JSON.parse(fs.readFileSync(root + 'adoption-register.v1.json'));
          const summary = JSON.parse(fs.readFileSync(root + 'review-summary.v1.json'));
          const manifest = JSON.parse(fs.readFileSync(root + 'review-package.v1.json'));
          if (adoption.entries?.length !== 27 || adoption.counts?.total !== 27) throw new Error('ADOPTION_COUNT');
          if (adoption.sourceBinding?.role6State !== 'INACTIVE' || adoption.sourceBinding?.role6Reopened !== false) throw new Error('ROLE6_BOUNDARY');
          if (manifest.packageFingerprintSha256 !== process.env.FINGERPRINT) throw new Error('PACKAGE_FINGERPRINT');
          const b = summary.stoppingBoundary || {};
          if (b.noPublicMethodsMutation !== true ||
              b.noPublicLawsMutation !== true ||
              b.noDeployment !== true ||
              b.noRelease !== true ||
              b.noFindingPromotionBeyondRecordedDisposition !== true ||
              b.noModificationOfAuditedSourceRecords !== true ||
              b.role6Reactivation !== false) throw new Error('STOPPING_BOUNDARY');
          if (summary.phaseResults?.PHASE_5_BUILD_NONPUBLIC_IMPLEMENTATION_CANDIDATE !== 'NOT_STARTED_NOT_AUTHORIZED_IN_CURRENT_INTAKE' ||
              summary.phaseResults?.PHASE_6_TEST_IMPLEMENTATION !== 'NOT_STARTED' ||
              summary.phaseResults?.PHASE_7_PUBLICATION_OR_ADOPTION_DECISION !== 'NOT_STARTED') throw new Error('IMPLEMENTATION_BOUNDARY');
          NODE
          echo "head=$(git rev-parse HEAD^{commit})" >> "$GITHUB_OUTPUT"

  package:
    needs: core
    strategy:
      matrix:
        lane: [builder, verifier]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.core.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Independently verify exact core bytes
        run: |
          node "$VERIFIER" \
            --mode package \
            --base-head "$BASE" \
            --candidate-head "${{ needs.core.outputs.head }}" \
            --holder "GITHUB_ACTIONS_METHODS_PACKAGE_${{ matrix.lane }}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
            --output "$RUNNER_TEMP/${{ matrix.lane }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: methods-package-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ matrix.lane }}.json

  close58:
    needs: [core, package]
    runs-on: ubuntu-24.04
    outputs:
      head: ${{ steps.identity.outputs.head }}
      core_fingerprint: ${{ steps.identity.outputs.core_fingerprint }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.core.outputs.head }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: methods-package-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package
          merge-multiple: true
      - name: Verify independent core receipts
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const b = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/package/builder.json'));
          const v = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/package/verifier.json'));
          if (b.holder === v.holder ||
              b.result !== 'PASS_MATERIALIZATION_CORE_BYTES_EXACT' ||
              v.result !== b.result ||
              b.sourcePackageFingerprintSha256 !== process.env.FINGERPRINT ||
              v.sourcePackageFingerprintSha256 !== process.env.FINGERPRINT ||
              b.repositoryFingerprint !== v.repositoryFingerprint ||
              b.verifierRepairPerformed || v.verifierRepairPerformed) process.exit(1);
          NODE
      - name: Close generation 58 and commit command receipts
        run: |
          set -euo pipefail
          node tools/operation-intake/repository-operation-lock-manager.v1.mjs \
            --action close \
            --repository "$REPOSITORY" \
            --operation-id "$G58_OPERATION" \
            --lock-scope "$G58_SCOPE" \
            --lock-generation 58 \
            --terminal-disposition PASS_CLOSED \
            --output "$RUNNER_TEMP/g58.json"
          mkdir -p "$(dirname "$IREC")"
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const sort = v => Array.isArray(v) ? v.map(sort) : v && typeof v === 'object' ? Object.fromEntries(Object.keys(v).sort().map(k => [k, sort(v[k])])) : v;
          const H = b => crypto.createHash('sha256').update(b).digest('hex');
          const bt = fs.readFileSync(process.env.RUNNER_TEMP + '/package/builder.json');
          const vt = fs.readFileSync(process.env.RUNNER_TEMP + '/package/verifier.json');
          const b = JSON.parse(bt);
          const v = JSON.parse(vt);
          const c = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/g58.json'));
          if (c.result !== 'TERMINAL_CLOSURE_COMMITTED' || c.lockGeneration !== 58 || c.terminalDisposition !== 'PASS_CLOSED' || c.operationId !== process.env.G58_OPERATION) process.exit(1);
          const common = {
            operationId: process.env.G58_OPERATION,
            lockGeneration: 58,
            sourcePackageFingerprintSha256: process.env.FINGERPRINT,
            repositoryFingerprintSha256: b.repositoryFingerprint,
            role6State: 'INACTIVE',
            reviewRepeated: false,
            packageRegenerated: false,
            publicMethodsMutation: 'NONE',
            publicLawsMutation: 'NONE',
            implementation: 'NONE',
            deployment: 'NONE',
            release: 'NONE'
          };
          const independent = sort({
            schema: 'METHODS_AND_MODELS_ADOPTION_REVIEW_VERIFICATION_RECEIPT_v1',
            result: 'PASS_INDEPENDENT_REPOSITORY_REPRODUCTION',
            ...common,
            candidateHeadBeforeCommandReceipts: '${{ needs.core.outputs.head }}',
            builderHolder: b.holder,
            verifierHolder: v.holder,
            builderReceiptSha256: H(bt),
            verifierReceiptSha256: H(vt),
            distinctExecutionHolders: true,
            verifierRepairPerformed: false
          });
          const closure = sort({
            schema: 'METHODS_AND_MODELS_ADOPTION_REVIEW_OPERATION_CLOSURE_RECEIPT_v1',
            result: 'PASS_CLOSED',
            ...common,
            canonicalGeneration58ClosureReceipt: c,
            role6Reopened: false
          });
          fs.writeFileSync(process.env.IREC, JSON.stringify(independent, null, 2) + '\n');
          fs.writeFileSync(process.env.CREC, JSON.stringify(closure, null, 2) + '\n');
          NODE
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add "$IREC" "$CREC"
          git commit -m 'Close Methods adoption translation generation 58'
          mapfile -t actual < <(git diff --name-only "$BASE..HEAD" | sort)
          test "${#actual[@]}" -eq 9
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - id: identity
        run: |
          set -euo pipefail
          echo "head=$(git rev-parse HEAD^{commit})" >> "$GITHUB_OUTPUT"
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/package/builder.json'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `core_fingerprint=${r.repositoryFingerprint}\n`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: methods-generation-58-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g58.json

  final:
    needs: [core, close58]
    strategy:
      matrix:
        lane: [builder, verifier]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.close58.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Independently verify nine-path final state
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/core" "${{ needs.core.outputs.head }}"
          (
            cd "$RUNNER_TEMP/core"
            node "$VERIFIER" \
              --mode package \
              --base-head "$BASE" \
              --candidate-head "${{ needs.core.outputs.head }}" \
              --holder "GITHUB_ACTIONS_METHODS_FINAL_CORE_${{ matrix.lane }}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
              --output "$RUNNER_TEMP/core-${{ matrix.lane }}.json"
          )
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const { spawnSync } = require('child_process');
          const sort = v => Array.isArray(v) ? v.map(sort) : v && typeof v === 'object' ? Object.fromEntries(Object.keys(v).sort().map(k => [k, sort(v[k])])) : v;
          const can = v => JSON.stringify(sort(v));
          const H = b => crypto.createHash('sha256').update(b).digest('hex');
          const HC = v => H(Buffer.from(can(v)));
          const git = args => {
            const r = spawnSync('git', args, {encoding:'utf8'});
            if (r.error || r.status !== 0) throw new Error(`GIT_${args.join('_')}`);
            return r.stdout.trim();
          };
          const base = process.env.BASE;
          const finalHead = '${{ needs.close58.outputs.head }}';
          const coreHead = '${{ needs.core.outputs.head }}';
          const core = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/core-${{ matrix.lane }}.json'));
          if (core.result !== 'PASS_MATERIALIZATION_CORE_BYTES_EXACT' || core.repositoryFingerprint !== '${{ needs.close58.outputs.core_fingerprint }}' || core.verifierRepairPerformed) throw new Error('CORE');
          const expected = [
            process.env.W,
            process.env.P0,
            process.env.ROOT + '/adoption-register.v1.json',
            process.env.ROOT + '/page-translation-model.v1.json',
            process.env.ROOT + '/review-package.v1.json',
            process.env.ROOT + '/review-summary.v1.json',
            process.env.ROOT + '/rolodex-information-map.v1.json',
            process.env.IREC,
            process.env.CREC
          ].sort();
          const actual = git(['diff','--name-only',`${base}..${finalHead}`]).split(/\r?\n/).filter(Boolean).sort();
          if (can(actual) !== can(expected)) throw new Error('FINAL_PATHS');
          const i = JSON.parse(fs.readFileSync(process.env.IREC));
          const c = JSON.parse(fs.readFileSync(process.env.CREC));
          const cc = c.canonicalGeneration58ClosureReceipt;
          if (i.schema !== 'METHODS_AND_MODELS_ADOPTION_REVIEW_VERIFICATION_RECEIPT_v1' ||
              i.result !== 'PASS_INDEPENDENT_REPOSITORY_REPRODUCTION' ||
              i.sourcePackageFingerprintSha256 !== process.env.FINGERPRINT ||
              i.repositoryFingerprintSha256 !== core.repositoryFingerprint ||
              i.candidateHeadBeforeCommandReceipts !== coreHead ||
              !i.distinctExecutionHolders || i.verifierRepairPerformed ||
              i.role6State !== 'INACTIVE' || i.reviewRepeated || i.packageRegenerated) throw new Error('INDEPENDENT_RECEIPT');
          if (c.schema !== 'METHODS_AND_MODELS_ADOPTION_REVIEW_OPERATION_CLOSURE_RECEIPT_v1' ||
              c.result !== 'PASS_CLOSED' ||
              c.sourcePackageFingerprintSha256 !== process.env.FINGERPRINT ||
              c.repositoryFingerprintSha256 !== core.repositoryFingerprint ||
              c.role6State !== 'INACTIVE' || c.role6Reopened || c.reviewRepeated || c.packageRegenerated ||
              cc?.result !== 'TERMINAL_CLOSURE_COMMITTED' || cc?.lockGeneration !== 58 || cc?.terminalDisposition !== 'PASS_CLOSED' || cc?.operationId !== process.env.G58_OPERATION) throw new Error('CLOSURE_RECEIPT');
          for (const x of [i,c]) {
            if (x.publicMethodsMutation !== 'NONE' || x.publicLawsMutation !== 'NONE' || x.implementation !== 'NONE' || x.deployment !== 'NONE' || x.release !== 'NONE') throw new Error('BOUNDARY');
          }
          const receiptPaths = [process.env.IREC, process.env.CREC];
          const payload = {
            sourcePackageFingerprintSha256: process.env.FINGERPRINT,
            sourceAuditHead: process.env.SOURCE_AUDIT_HEAD,
            coreCandidateHead: coreHead,
            finalCandidateHead: finalHead,
            coreRepositoryFingerprintSha256: core.repositoryFingerprint,
            commandReceiptBlobMap: Object.fromEntries(receiptPaths.map(p => [p, git(['rev-parse',`${finalHead}:${p}`])])),
            commandReceiptSha256: Object.fromEntries(receiptPaths.map(p => [p, H(fs.readFileSync(p))]))
          };
          const out = sort({
            schema: 'METHODS_INFORMATION_BENCHMARK_FINAL_REPOSITORY_VERIFICATION_RECEIPT_v1',
            operationId: process.env.G64_OPERATION,
            result: 'PASS_FINAL_REPOSITORY_PACKAGE_AND_GENERATION58_CLOSURE',
            holder: 'GITHUB_ACTIONS_METHODS_FINAL_${{ matrix.lane }}_${{ github.run_id }}_${{ github.run_attempt }}',
            sourcePackageFingerprintSha256: process.env.FINGERPRINT,
            coreRepositoryFingerprintSha256: core.repositoryFingerprint,
            finalRepositoryFingerprintSha256: HC(payload),
            coreCandidateHead: coreHead,
            finalCandidateHead: finalHead,
            verifiedPathCount: 9,
            generation58Closed: true,
            role6State: 'INACTIVE',
            reviewRepeated: false,
            packageRegenerated: false,
            verifierRepairPerformed: false,
            publicMethodsMutation: 'NONE',
            publicLawsMutation: 'NONE',
            implementation: 'NONE',
            deployment: 'NONE',
            release: 'NONE',
            fingerprintPayload: payload
          });
          fs.writeFileSync(process.env.RUNNER_TEMP + '/${{ matrix.lane }}.json', JSON.stringify(out, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: methods-final-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ matrix.lane }}.json

  close64:
    needs: [close58, final]
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.close58.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: methods-final-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final
          merge-multiple: true
      - name: Compare final holders and close generation 64
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const b = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/final/builder.json'));
          const v = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/final/verifier.json'));
          if (b.holder === v.holder ||
              b.result !== 'PASS_FINAL_REPOSITORY_PACKAGE_AND_GENERATION58_CLOSURE' ||
              v.result !== b.result ||
              b.sourcePackageFingerprintSha256 !== process.env.FINGERPRINT ||
              v.sourcePackageFingerprintSha256 !== process.env.FINGERPRINT ||
              b.coreRepositoryFingerprintSha256 !== v.coreRepositoryFingerprintSha256 ||
              b.finalRepositoryFingerprintSha256 !== v.finalRepositoryFingerprintSha256 ||
              !b.generation58Closed || !v.generation58Closed ||
              b.verifierRepairPerformed || v.verifierRepairPerformed ||
              b.role6State !== 'INACTIVE' || v.role6State !== 'INACTIVE') process.exit(1);
          NODE
          node tools/operation-intake/repository-operation-lock-manager.v1.mjs \
            --action close \
            --repository "$REPOSITORY" \
            --operation-id "$G64_OPERATION" \
            --lock-scope "$G64_SCOPE" \
            --lock-generation 64 \
            --terminal-disposition PASS_CLOSED \
            --output "$RUNNER_TEMP/g64.json"
          node -e "const r=require(process.env.RUNNER_TEMP + '/g64.json'); if(r.result!=='TERMINAL_CLOSURE_COMMITTED'||r.lockGeneration!==64||r.terminalDisposition!=='PASS_CLOSED'||r.operationId!==process.env.G64_OPERATION) process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: methods-materialization-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/g64.json
            ${{ runner.temp }}/final/builder.json
            ${{ runner.temp }}/final/verifier.json
