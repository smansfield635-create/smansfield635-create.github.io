name: Temporary Methods Models Final F11 Verify
on:
  push:
    branches:
      - construction/methods-models-integrated-environment-v1
    paths:
      - 'control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/f11-exact-candidate-certification/**'
      - '.github/workflows/temporary-methods-models-final-f11-verify.yml'
permissions:
  contents: read
concurrency:
  group: methods-models-final-f11-verify
  cancel-in-progress: true
jobs:
  verify-f11-exact-candidate-certification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require fail-propagating shell semantics
        shell: bash
        run: |
          set -euo pipefail
          false | tee /tmp/f11-pipefail-probe.log && { echo 'pipefail probe unexpectedly succeeded'; exit 1; } || true
      - name: Verify exact certified F10 input object
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse d39d9f110ed7fe16109ddcb5b8043b3752c1a36e^{tree})" = "e42a5267c10c1ae5183e2935a49b97af6545f9eb"
          git merge-base --is-ancestor d39d9f110ed7fe16109ddcb5b8043b3752c1a36e HEAD
          printf '%s\n' "HEAD=$(git rev-parse HEAD)" "TREE=$(git rev-parse HEAD^{tree})" "CERTIFIED_ENVIRONMENT_HEAD=d39d9f110ed7fe16109ddcb5b8043b3752c1a36e" "CERTIFIED_ENVIRONMENT_TREE=e42a5267c10c1ae5183e2935a49b97af6545f9eb" | tee f11-candidate-object.log
      - name: Re-establish F9 assembled environment baseline
        shell: bash
        run: |
          set -euo pipefail
          node control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/f9-integrated-environment-assembly/verify.v1.mjs | tee f9-baseline-reverification.log
      - name: Re-establish F10 adversarial verification baseline
        shell: bash
        run: |
          set -euo pipefail
          node control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/f10-adversarial-verification/verify.v1.mjs | tee f10-baseline-reverification.log
      - name: Execute F11 exact candidate certification
        shell: bash
        run: |
          set -euo pipefail
          node control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/f11-exact-candidate-certification/verify.v1.mjs | tee f11-certification.log
      - name: Prove exact F11 changed-path scope from F10 terminal head
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only d39d9f110ed7fe16109ddcb5b8043b3752c1a36e..HEAD | tee f11-changed-paths.log
          if grep -Ev '^(control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/f11-exact-candidate-certification/|\.github/workflows/temporary-methods-models-final-f11-verify\.yml$)' f11-changed-paths.log | grep -q .; then
            echo 'Unexpected non-F11 path changed'; exit 1
          fi
          if grep -Ei '(^|/)f12-|user-visual|laws/research/methods-and-models/|showroom|frontier' f11-changed-paths.log | grep -v 'f11-exact-candidate-certification' | grep -q .; then
            echo 'F12 or public path detected'; exit 1
          fi
      - name: Verify no superseded temporary Final Program verifiers remain
        shell: bash
        run: |
          set -euo pipefail
          git ls-files '.github/workflows/temporary-methods-models-final-f*-verify.yml' | tee f11-temporary-workflow-inventory.log
          if grep -v '^.github/workflows/temporary-methods-models-final-f11-verify.yml$' f11-temporary-workflow-inventory.log | grep -q .; then
            echo 'Superseded temporary Final Program verifier remains'; exit 1
          fi
      - name: Classify governing main drift without rebasing
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --name-only a8ef9e4b4701bd15d09ad14c829e2f4b10f9ccfc..origin/main | tee f11-main-drift.log
          if grep -E '^(control-plane/methods-information-benchmark/|laws/research/methods-and-models/)' f11-main-drift.log | grep -q .; then
            echo 'Methods governing surface drift detected'; exit 1
          fi
          git show a8ef9e4b4701bd15d09ad14c829e2f4b10f9ccfc:.github/ai-router/router.v1.json > /tmp/router-base.json
          git show origin/main:.github/ai-router/router.v1.json > /tmp/router-main.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base=JSON.parse(fs.readFileSync('/tmp/router-base.json','utf8'));
          const main=JSON.parse(fs.readFileSync('/tmp/router-main.json','utf8'));
          const find=r=>(r.projects||[]).find(p=>p.projectId==='METHODS_INFORMATION_BENCHMARK');
          if(JSON.stringify(find(base))!==JSON.stringify(find(main))){
            console.error('Methods-specific global router drift detected');
            process.exit(1);
          }
          NODE
      - name: Preserve F11 certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: methods-models-final-program-f11-exact-candidate-certification
          path: |
            f11-candidate-object.log
            f9-baseline-reverification.log
            f10-baseline-reverification.log
            f11-certification.log
            f11-changed-paths.log
            f11-temporary-workflow-inventory.log
            f11-main-drift.log
