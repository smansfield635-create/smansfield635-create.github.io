name: Methods Role 6 Audit Descriptor Activation v2 Closure Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/methods-role6-audit-activation-validation-v2.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: methods-role6-audit-descriptor-activation-v2-closure
  cancel-in-progress: false

env:
  ACTIVE_MAIN_HEAD: 3753f7307c36f1269f68fd5222a59c1605f12358
  OPERATION_ID: METHODS_ROLE_6_AUDIT_EXECUTION_DESCRIPTOR_ACTIVATION_SUCCESSOR_v2
  LOCK_SCOPE: METHODS_INFORMATION_BENCHMARK/ROLE6_AUDIT/EXECUTION_DESCRIPTOR_ACTIVATION_SUCCESSOR/V2
  LOCK_GENERATION: '45'

jobs:
  close-active-lock:
    if: github.event.pull_request.head.ref == 'activation/methods-role6-audit-execution-descriptor-v2-001'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify activated main and stopping boundary
        shell: bash
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$ACTIVE_MAIN_HEAD"
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('control-plane/methods-information-benchmark/role6-audit-bootstrap/audit-execution-descriptor.v1.json','utf8'));
          const l=JSON.parse(fs.readFileSync('control-plane/methods-information-benchmark/role6-audit-bootstrap/audit-execution-locator.v1.json','utf8'));
          if(d.descriptorId!=='METHODS_ROLE6_AUDIT_EXECUTION_DESCRIPTOR_V1'||d.status!=='ACTIVE_RATIFIED_CERTIFIED'||d.activationOnMain!==true) process.exit(1);
          if(l.status!=='ACTIVE_RATIFIED_CERTIFIED') process.exit(1);
          NODE
          test -z "$(git ls-tree -r --name-only "$ACTIVE_MAIN_HEAD" -- control-plane/methods-information-benchmark/role6-audit/outputs control-plane/methods-information-benchmark/role6-audit/receipts)"
      - id: close
        name: Execute canonical root lock closure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          node tools/operation-intake/repository-operation-lock-manager.v1.mjs \
            --action close \
            --repository smansfield635-create/smansfield635-create.github.io \
            --lock-ref refs/heads/operation-locks/repository-operation-intake-v1 \
            --operation-id "$OPERATION_ID" \
            --lock-scope "$LOCK_SCOPE" \
            --lock-generation "$LOCK_GENERATION" \
            --terminal-disposition PASS_CLOSED \
            --output "$RUNNER_TEMP/root-lock-closure-receipt.json"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          test -f "$RUNNER_TEMP/root-lock-closure-receipt.json" || printf '%s\n' '{"schema":"MISSING_CLOSURE_RECEIPT_v1","result":"MISSING"}' > "$RUNNER_TEMP/root-lock-closure-receipt.json"
          cat "$RUNNER_TEMP/root-lock-closure-receipt.json"
          exit 0
      - name: Emit closure diagnostic record
        if: always()
        shell: bash
        env:
          COMMAND_STATUS: ${{ steps.close.outputs.status }}
        run: |
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const p=process.env.RUNNER_TEMP+'/root-lock-closure-receipt.json';
          const c=JSON.parse(fs.readFileSync(p,'utf8'));
          const out={
            schema:'METHODS_ROLE_6_AUDIT_EXECUTION_DESCRIPTOR_ACTIVATION_CLOSURE_DIAGNOSTIC_v1',
            operationId:process.env.OPERATION_ID,
            exactActiveMainHead:process.env.ACTIVE_MAIN_HEAD,
            activationWorkflowRun:30969033583,
            builderJob:92189154244,
            freshVerifierJob:92189207807,
            activationFingerprint:'2c19836c9998bf43af457fde221e1486b3406f16cad4d87484fcb1b9fac6985a',
            commandExitCode:Number(process.env.COMMAND_STATUS),
            canonicalClosureReceipt:c,
            closureReceiptSha256:crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex'),
            descriptorActiveOnMain:true,
            rootAuditAdmissionPerformed:false,
            substantiveAuditProgress:'0_OF_27',
            returnProgress:'0_OF_2'
          };
          fs.writeFileSync(process.env.RUNNER_TEMP+'/activation-closure-diagnostic.json',JSON.stringify(out,null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: methods-role6-audit-activation-v2-closure-diagnostic
          path: |
            ${{ runner.temp }}/root-lock-closure-receipt.json
            ${{ runner.temp }}/activation-closure-diagnostic.json
          if-no-files-found: error
          retention-days: 90
      - name: Require command-emitted terminal closure
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/root-lock-closure-receipt.json','utf8'));
          if(r.schema!=='REPOSITORY_OPERATION_REMOTE_CLOSURE_RECEIPT_v1') process.exit(1);
          if(r.result!=='TERMINAL_CLOSURE_COMMITTED'||r.lockReleased!==true||r.lockGeneration!==45) process.exit(1);
          if(r.terminalDisposition!=='PASS_CLOSED'||r.operationId!=='METHODS_ROLE_6_AUDIT_EXECUTION_DESCRIPTOR_ACTIVATION_SUCCESSOR_v2') process.exit(1);
          NODE
