<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mirror Manor carousel culling fix</title><style>html,body{margin:0;background:#071018;color:#edf3f4;font:14px/1.4 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:20px}.stage{height:315px;border:1px solid #33414c;border-radius:20px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(71,149,170,.12),transparent 68%)}canvas{display:block;width:min(92vw,640px);height:202px}.status{margin-top:12px;color:#bccbd0}</style></head><body><main><h1>Mirror Manor carousel renderer</h1><div class="stage"><canvas id="house"></canvas></div><p class="status" id="s">loading…</p></main><script src="/assets/compass/compass.house-scene.js"></script><script>const c=document.querySelector('#house');const api=window.CompassHouseScene.mount(c,{foreground:()=>true});setTimeout(()=>{document.querySelector('#s').textContent=JSON.stringify(api.inspect())+' error='+(c.dataset.houseError||'none')},1500);</script></body></html>
