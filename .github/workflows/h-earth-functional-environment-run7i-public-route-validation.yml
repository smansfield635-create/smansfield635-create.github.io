name: H-Earth Functional Environment Run 7I Public Route Validation

on:
  push:
    branches:
      - agent/h-earth-functional-environment-run7i-public-route-001
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-run7i-public-route:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUN7I_BRANCH: agent/h-earth-functional-environment-run7i-public-route-001
      RUN7I_PARENT: 72a1e4ee0add5011203526981bd51edf27c4343d
      RUN7I_ROUTE: showroom/globe/h-earth/index.html
      RUN7I_RECEIPT: h-earth-3d/validation/h-earth.functional-environment.run7i.public-route.receipt.json
      RUN7I_LOCAL_URL: http://127.0.0.1:4173/showroom/globe/h-earth/
    steps:
      - name: Check out Run 7I workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Construct main public-route integration in workspace
        id: construct
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/h-earth-functional-environment-run7i-public-route-001'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('showroom/globe/h-earth/index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          old = '''      data-run6f-ready="false"
                data-run6f-error="false"
                data-public-route="true"'''
          new = '''      data-run6f-ready="false"
                data-run6f-error="false"
                data-run7h-ready="false"
                data-run7h-error="false"
                data-run7i-public-route="true"
                data-public-route="true"'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'data-run7i-public-route="true"' not in text:
              raise SystemExit('RUN7I_ROUTE_ATTRIBUTE_ANCHOR_NOT_FOUND')

          old = '''            <div><dt>Frame</dt><dd id="hud-frame">—</dd></div>
                    </dl>'''
          new = '''            <div><dt>Frame</dt><dd id="hud-frame">—</dd></div>
                      <div><dt>Surface</dt><dd id="hud-surface">—</dd></div>
                      <div><dt>Water</dt><dd id="hud-water">—</dd></div>
                      <div><dt>Biome</dt><dd id="hud-biome">—</dd></div>
                      <div><dt>Traversal</dt><dd id="hud-traversal">—</dd></div>
                      <div><dt>Lifecycle</dt><dd id="hud-lifecycle">—</dd></div>
                      <div><dt>Population</dt><dd id="hud-population">—</dd></div>
                    </dl>'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'id="hud-population"' not in text:
              raise SystemExit('RUN7I_TELEMETRY_ANCHOR_NOT_FOUND')

          old = '''  <script type="module" src="./functional-landscape/index.js?v=gesture-shell-001"></script>'''
          new = '''  <script type="module" src="./functional-landscape/index.js?v=gesture-shell-001"></script>
            <script type="module" src="./functional-landscape/environment-integration.js?v=run7i-public-route-001"></script>'''
          if old in text and 'environment-integration.js?v=run7i-public-route-001' not in text:
              text = text.replace(old, new, 1)
          elif 'environment-integration.js?v=run7i-public-route-001' not in text:
              raise SystemExit('RUN7I_SCRIPT_ANCHOR_NOT_FOUND')

          if text != original:
              path.write_text(text, encoding='utf-8')
              print('RUN7I_ROUTE_CONSTRUCTED=true')
          else:
              print('RUN7I_ROUTE_CONSTRUCTED=false')
          PY

          if git diff --quiet -- "$RUN7I_ROUTE"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$RUN7I_ROUTE"
            git commit -m 'Integrate Run 7H environment into main H-Earth public route'
            git push origin "HEAD:${RUN7I_BRANCH}"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify exact public-route wiring
        run: |
          set -euo pipefail
          grep -q 'data-run7i-public-route="true"' "$RUN7I_ROUTE"
          grep -q 'data-run7h-ready="false"' "$RUN7I_ROUTE"
          grep -q 'functional-landscape/environment-integration.js?v=run7i-public-route-001' "$RUN7I_ROUTE"
          for id in hud-surface hud-water hud-biome hud-traversal hud-lifecycle hud-population; do
            grep -q "id=\"${id}\"" "$RUN7I_ROUTE"
          done
          grep -q 'data-h-earth-public-route="functional-landscape"' "$RUN7I_ROUTE"
          grep -q 'data-h-earth-gesture-primary="true"' "$RUN7I_ROUTE"
          grep -q 'Return to Compass' "$RUN7I_ROUTE"
          grep -q 'Diagnostics' "$RUN7I_ROUTE"

      - name: Install bounded Chromium dependency
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Start bounded workspace server
        run: |
          python3 -m http.server 4173 > h-earth-run7i-server.log 2>&1 &
          echo $! > h-earth-run7i-server.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent "$RUN7I_LOCAL_URL" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat h-earth-run7i-server.log
          exit 1

      - name: Execute desktop and Samsung public-route matrix
        env:
          H_EARTH_RUN7I_URL: http://127.0.0.1:4173/showroom/globe/h-earth/
          H_EARTH_RUN7I_OUTPUT: h-earth-run7i-artifacts
        run: |
          cat > h-earth-run7i-browser.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { chromium } from 'playwright';

          const url = process.env.H_EARTH_RUN7I_URL;
          const output = process.env.H_EARTH_RUN7I_OUTPUT;
          await fs.mkdir(output, { recursive: true });
          const configurations = [
            ['desktop-landscape', 1280, 800, false, false],
            ['samsung-mobile-portrait', 412, 915, true, true],
            ['samsung-mobile-landscape', 915, 412, true, true]
          ];
          const results = [];
          const browser = await chromium.launch({ headless: true });
          try {
            for (const [id, width, height, isMobile, hasTouch] of configurations) {
              const context = await browser.newContext({
                viewport: { width, height }, isMobile, hasTouch, deviceScaleFactor: 1
              });
              const page = await context.newPage();
              const consoleErrors = [];
              const pageErrors = [];
              page.on('console', (message) => {
                if (message.type() === 'error') consoleErrors.push(message.text());
              });
              page.on('pageerror', (error) => pageErrors.push(error.message));

              await page.goto(`${url}?run7i=${Date.now()}-${id}`, {
                waitUntil: 'domcontentloaded', timeout: 120000
              });
              await page.waitForFunction(() =>
                window.H_EARTH_FUNCTIONAL_LANDSCAPE_RUN6F?.ready === true &&
                window.H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN7H?.ready === true &&
                document.getElementById('h-earth-functional-landscape-route')?.dataset.run7hReady === 'true' &&
                document.getElementById('h-earth-functional-landscape-route')?.dataset.run7iPublicRoute === 'true',
              null, { timeout: 120000 });

              const initial = await page.evaluate(async () => {
                await window.H_EARTH_FUNCTIONAL_LANDSCAPE_RUN6F.dispatch({ action: 'RESET' });
                await window.H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN7H.refresh();
                return {
                  run6f: window.H_EARTH_FUNCTIONAL_LANDSCAPE_RUN6F.getBrowserReceipt(),
                  run7h: window.H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN7H.getSnapshot(),
                  route: {
                    title: document.title,
                    publicRoute: document.getElementById('h-earth-functional-landscape-route')?.dataset.publicRoute,
                    gesturePrimary: document.getElementById('h-earth-3d-route-root')?.dataset.hEarthGesturePrimary,
                    returnToCompass: document.getElementById('h-earth-return-to-compass')?.getAttribute('href'),
                    diagnostics: document.getElementById('h-earth-3d-diagnostic-link')?.getAttribute('href')
                  }
                };
              });
              assert.equal(initial.run7h.ready, true);
              assert.equal(initial.run7h.receipt.eligible, true);
              assert.equal(initial.run7h.receipt.authorityCollapse, false);
              assert.equal(initial.run7h.receipt.rendererAuthorityReplaced, false);
              assert.equal(initial.run7h.receipt.cameraAuthorityReplaced, false);
              assert.equal(initial.run7h.receipt.navigationAuthorityReplaced, false);
              assert.equal(initial.route.title, 'H-Earth · Ground-View Matrix');
              assert.equal(initial.route.publicRoute, 'true');
              assert.equal(initial.route.gesturePrimary, 'true');
              assert.equal(initial.route.returnToCompass, '/index.html');
              assert.equal(initial.route.diagnostics, '/showroom/globe/h-earth/diagnostic/');

              const beforeMove = initial.run6f.renderSequence;
              await page.evaluate(() =>
                window.H_EARTH_FUNCTIONAL_LANDSCAPE_RUN6F.dispatch({ action: 'MOVE_FORWARD' }));
              await page.waitForFunction((sequence) =>
                window.H_EARTH_FUNCTIONAL_LANDSCAPE_RUN6F.getBrowserReceipt().renderSequence > sequence &&
                window.H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN7H.getBrowserReceipt().renderSequence > sequence,
              beforeMove, { timeout: 120000 });

              const mount = page.locator('#h-earth-functional-landscape-mount');
              const box = await mount.boundingBox();
              assert.ok(box);
              const beforeGesture = await page.evaluate(() =>
                window.H_EARTH_FUNCTIONAL_LANDSCAPE_RUN6F.getBrowserReceipt().renderSequence);
              await page.dispatchEvent('#h-earth-functional-landscape-mount', 'pointerdown', {
                pointerId: 41, pointerType: hasTouch ? 'touch' : 'mouse', clientX: box.x + 80, clientY: box.y + 80, bubbles: true
              });
              await page.dispatchEvent('#h-earth-functional-landscape-mount', 'pointermove', {
                pointerId: 41, pointerType: hasTouch ? 'touch' : 'mouse', clientX: box.x + 124, clientY: box.y + 80, bubbles: true
              });
              await page.dispatchEvent('#h-earth-functional-landscape-mount', 'pointerup', {
                pointerId: 41, pointerType: hasTouch ? 'touch' : 'mouse', clientX: box.x + 124, clientY: box.y + 80, bubbles: true
              });
              await page.waitForFunction((sequence) =>
                window.H_EARTH_FUNCTIONAL_LANDSCAPE_RUN6F.getBrowserReceipt().renderSequence > sequence,
              beforeGesture, { timeout: 120000 });

              const geographic = await page.evaluate(() =>
                window.H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN7H.runGeographicPath());
              assert.equal(geographic.length, 5);
              assert.equal(geographic.every((entry) =>
                entry.result.ok && entry.environmentReceipt.eligible), true);

              const lifecycle = await page.evaluate(() =>
                window.H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN7H.runLifecycleDistanceProof());
              assert.deepEqual(lifecycle.map((entry) => entry.state),
                ['ACTIVE_DETAIL', 'ACTIVE_REDUCED', 'SLEEPING', 'UNLOADED']);
              assert.equal(lifecycle[2].populationInstanceCount, 0);
              assert.equal(lifecycle[3].populationInstanceCount, 0);

              const final = await page.evaluate(() => {
                const ids = ['hud-surface', 'hud-water', 'hud-biome',
                  'hud-traversal', 'hud-lifecycle', 'hud-population'];
                const hud = Object.fromEntries(ids.map((id) =>
                  [id, document.getElementById(id)?.textContent]));
                const canvas = document.getElementById('h-earth-functional-landscape-canvas');
                const pixels = canvas.getContext('2d').getImageData(
                  0, 0, canvas.width, canvas.height).data;
                let opaque = 0;
                const colors = new Set();
                const stride = Math.max(4,
                  Math.floor(pixels.length / 12000 / 4) * 4);
                for (let index = 0; index < pixels.length; index += stride) {
                  const offset = index - index % 4;
                  if (pixels[offset + 3] === 255) opaque += 1;
                  colors.add(`${pixels[offset]},${pixels[offset + 1]},${pixels[offset + 2]}`);
                }
                const root = document.getElementById('h-earth-functional-landscape-route');
                return {
                  run7h: window.H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN7H.getSnapshot(),
                  hud,
                  hudComplete: Object.values(hud).every((value) => value && value !== '—'),
                  opaquePixelSamples: opaque,
                  sampledColorCount: colors.size,
                  run7hReady: root.dataset.run7hReady,
                  run7hError: root.dataset.run7hError,
                  run7iPublicRoute: root.dataset.run7iPublicRoute,
                  gestureUsed: root.dataset.gestureUsed
                };
              });
              assert.equal(final.run7h.ready, true);
              assert.equal(final.hudComplete, true);
              assert.equal(final.opaquePixelSamples > 0, true);
              assert.equal(final.sampledColorCount > 12, true);
              assert.equal(final.run7hReady, 'true');
              assert.equal(final.run7hError, 'false');
              assert.equal(final.run7iPublicRoute, 'true');
              assert.equal(final.gestureUsed, 'true');
              assert.deepEqual(consoleErrors, []);
              assert.deepEqual(pageErrors, []);

              const screenshot = `${id}.png`;
              await page.screenshot({ path: path.join(output, screenshot), fullPage: true });
              results.push({
                configurationId: id,
                viewport: { width, height },
                isMobile,
                hasTouch,
                geographicWaypointCount: geographic.length,
                lifecycle,
                hud: final.hud,
                run7hReceipt: final.run7h.receipt,
                opaquePixelSamples: final.opaquePixelSamples,
                sampledColorCount: final.sampledColorCount,
                gestureUsed: final.gestureUsed,
                screenshot,
                consoleErrors,
                pageErrors
              });
              await context.close();
            }
          } finally {
            await browser.close();
          }

          const receipt = {
            receiptType: 'H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN_7I_PUBLIC_ROUTE_EXECUTION_CANDIDATE',
            eligible: true,
            status: 'RUN_7I_MAIN_PUBLIC_ROUTE_WORKSPACE_PASS',
            publicRoute: '/showroom/globe/h-earth/',
            configurationCount: results.length,
            desktopExecution: 'PASS',
            samsungMobilePortraitExecution: 'PASS',
            samsungMobileLandscapeExecution: 'PASS',
            run7hIntegrationLoaded: true,
            publicShellPreserved: true,
            gestureControlsPreserved: true,
            environmentTelemetryComplete: true,
            lifecycleTransitionProof: 'PASS',
            actualBrowserExecution: true,
            physicalSamsungInstrumentation: false,
            results,
            issues: []
          };
          await fs.writeFile(path.join(output, 'run7i-execution-candidate.json'),
            `${JSON.stringify(receipt, null, 2)}\n`, 'utf8');
          console.log(JSON.stringify(receipt, null, 2));
          NODE

          set -o pipefail
          node h-earth-run7i-browser.mjs 2>&1 | tee h-earth-run7i-browser.log

      - name: Verify execution candidate
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const receipt = JSON.parse(readFileSync(
            'h-earth-run7i-artifacts/run7i-execution-candidate.json', 'utf8'));
          if (
            receipt.eligible !== true ||
            receipt.status !== 'RUN_7I_MAIN_PUBLIC_ROUTE_WORKSPACE_PASS' ||
            receipt.configurationCount !== 3 ||
            receipt.desktopExecution !== 'PASS' ||
            receipt.samsungMobilePortraitExecution !== 'PASS' ||
            receipt.samsungMobileLandscapeExecution !== 'PASS' ||
            receipt.run7hIntegrationLoaded !== true ||
            receipt.publicShellPreserved !== true ||
            receipt.gestureControlsPreserved !== true ||
            receipt.environmentTelemetryComplete !== true ||
            receipt.lifecycleTransitionProof !== 'PASS' ||
            receipt.actualBrowserExecution !== true ||
            receipt.physicalSamsungInstrumentation !== false ||
            receipt.issues.length !== 0
          ) process.exit(1);
          NODE

      - name: Create durable Run 7I receipt
        id: receipt
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/h-earth-functional-environment-run7i-public-route-001'
        run: |
          if [ -f "$RUN7I_RECEIPT" ]; then
            echo 'created=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export EXECUTED_WORKSPACE_COMMIT="$(git rev-parse HEAD)"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const candidate = JSON.parse(readFileSync(
            'h-earth-run7i-artifacts/run7i-execution-candidate.json', 'utf8'));
          const receipt = {
            receiptType: 'H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN_7I_PUBLIC_ROUTE_RECEIPT',
            eligible: true,
            status: 'RUN_7I_MAIN_PUBLIC_ROUTE_WORKSPACE_PASS',
            parentCommit: process.env.RUN7I_PARENT,
            executedWorkspaceCommit: process.env.EXECUTED_WORKSPACE_COMMIT,
            workspaceBranch: process.env.RUN7I_BRANCH,
            publicRoute: '/showroom/globe/h-earth/',
            consumedRun7HContract: 'H_EARTH_FUNCTIONAL_ENVIRONMENT_COMPOSITE_RUN_7H_v1',
            configurationCount: candidate.configurationCount,
            desktopExecution: candidate.desktopExecution,
            samsungMobilePortraitExecution: candidate.samsungMobilePortraitExecution,
            samsungMobileLandscapeExecution: candidate.samsungMobileLandscapeExecution,
            run7hIntegrationLoaded: candidate.run7hIntegrationLoaded,
            publicShellPreserved: candidate.publicShellPreserved,
            gestureControlsPreserved: candidate.gestureControlsPreserved,
            environmentTelemetryComplete: candidate.environmentTelemetryComplete,
            lifecycleTransitionProof: candidate.lifecycleTransitionProof,
            actualBrowserExecution: candidate.actualBrowserExecution,
            localConstruction: false,
            physicalSamsungInstrumentation: false,
            merged: false,
            deployed: false,
            livePublicRouteVerified: false,
            authorityCollapse: false,
            rendererAuthorityReplaced: false,
            cameraAuthorityReplaced: false,
            navigationAuthorityReplaced: false,
            issues: []
          };
          writeFileSync(process.env.RUN7I_RECEIPT,
            `${JSON.stringify(receipt, null, 2)}\n`, 'utf8');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RUN7I_RECEIPT"
          git commit -m 'Record Run 7I main public-route execution receipt'
          git push origin "HEAD:${RUN7I_BRANCH}"
          echo 'created=true' >> "$GITHUB_OUTPUT"

      - name: Stop bounded workspace server
        if: always()
        run: |
          if [ -f h-earth-run7i-server.pid ]; then
            kill "$(cat h-earth-run7i-server.pid)" || true
          fi

      - name: Upload Run 7I workspace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-run7i-public-route-workspace-evidence
          path: |
            h-earth-run7i-browser.log
            h-earth-run7i-server.log
            h-earth-run7i-artifacts
          if-no-files-found: error
          retention-days: 30

  verify-run7i-live-public-route:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-run7i-public-route
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUN7I_LIVE_URL: https://smansfield635-create.github.io/showroom/globe/h-earth/
    steps:
      - name: Check out merged Run 7I main
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Await deployed main public route
        run: |
          mkdir -p h-earth-run7i-live-artifacts
          for attempt in $(seq 1 90); do
            cache="run7i=${GITHUB_RUN_ID}-${attempt}"
            if curl --fail --silent --show-error --location \
              "${RUN7I_LIVE_URL}?${cache}" \
              -o h-earth-run7i-live-artifacts/live-index.html && \
              grep -q 'data-run7i-public-route="true"' h-earth-run7i-live-artifacts/live-index.html && \
              grep -q 'environment-integration.js?v=run7i-public-route-001' h-earth-run7i-live-artifacts/live-index.html; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Verify deployed public-route source identity
        run: |
          cmp --silent showroom/globe/h-earth/index.html \
            h-earth-run7i-live-artifacts/live-index.html
          sha256sum h-earth-run7i-live-artifacts/live-index.html \
            > h-earth-run7i-live-artifacts/live-index-sha256.txt

      - name: Install bounded Chromium dependency
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Execute live main public route
        env:
          H_EARTH_RUN7I_URL: https://smansfield635-create.github.io/showroom/globe/h-earth/
          H_EARTH_RUN7I_OUTPUT: h-earth-run7i-live-artifacts
        run: |
          cp h-earth-run7i-browser.mjs /tmp/h-earth-run7i-browser.mjs 2>/dev/null || true
          cat > h-earth-run7i-live-browser.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { chromium } from 'playwright';
          const url = process.env.H_EARTH_RUN7I_URL;
          const output = process.env.H_EARTH_RUN7I_OUTPUT;
          const configurations = [
            ['desktop-landscape', 1280, 800, false, false],
            ['samsung-mobile-portrait', 412, 915, true, true],
            ['samsung-mobile-landscape', 915, 412, true, true]
          ];
          const results = [];
          const browser = await chromium.launch({ headless: true });
          try {
            for (const [id, width, height, isMobile, hasTouch] of configurations) {
              const context = await browser.newContext({ viewport: { width, height }, isMobile, hasTouch, deviceScaleFactor: 1 });
              const page = await context.newPage();
              const consoleErrors = [];
              const pageErrors = [];
              page.on('console', (message) => { if (message.type() === 'error') consoleErrors.push(message.text()); });
              page.on('pageerror', (error) => pageErrors.push(error.message));
              await page.goto(`${url}?run7iLive=${Date.now()}-${id}`, { waitUntil: 'domcontentloaded', timeout: 120000 });
              await page.waitForFunction(() =>
                window.H_EARTH_FUNCTIONAL_LANDSCAPE_RUN6F?.ready === true &&
                window.H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN7H?.ready === true &&
                document.getElementById('h-earth-functional-landscape-route')?.dataset.run7hReady === 'true' &&
                document.getElementById('h-earth-functional-landscape-route')?.dataset.run7iPublicRoute === 'true',
              null, { timeout: 120000 });
              const initial = await page.evaluate(async () => {
                await window.H_EARTH_FUNCTIONAL_LANDSCAPE_RUN6F.dispatch({ action: 'RESET' });
                await window.H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN7H.refresh();
                return window.H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN7H.getSnapshot();
              });
              assert.equal(initial.ready, true);
              assert.equal(initial.receipt.eligible, true);
              const geographic = await page.evaluate(() => window.H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN7H.runGeographicPath());
              assert.equal(geographic.length, 5);
              assert.equal(geographic.every((entry) => entry.result.ok && entry.environmentReceipt.eligible), true);
              const lifecycle = await page.evaluate(() => window.H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN7H.runLifecycleDistanceProof());
              assert.deepEqual(lifecycle.map((entry) => entry.state), ['ACTIVE_DETAIL', 'ACTIVE_REDUCED', 'SLEEPING', 'UNLOADED']);
              const final = await page.evaluate(() => {
                const ids = ['hud-surface', 'hud-water', 'hud-biome', 'hud-traversal', 'hud-lifecycle', 'hud-population'];
                const hud = Object.fromEntries(ids.map((id) => [id, document.getElementById(id)?.textContent]));
                const root = document.getElementById('h-earth-functional-landscape-route');
                return {
                  hud,
                  hudComplete: Object.values(hud).every((value) => value && value !== '—'),
                  run7hReady: root.dataset.run7hReady,
                  run7hError: root.dataset.run7hError,
                  run7iPublicRoute: root.dataset.run7iPublicRoute
                };
              });
              assert.equal(final.hudComplete, true);
              assert.equal(final.run7hReady, 'true');
              assert.equal(final.run7hError, 'false');
              assert.equal(final.run7iPublicRoute, 'true');
              assert.deepEqual(consoleErrors, []);
              assert.deepEqual(pageErrors, []);
              const screenshot = `live-${id}.png`;
              await page.screenshot({ path: path.join(output, screenshot), fullPage: true });
              results.push({ configurationId: id, viewport: { width, height }, isMobile, hasTouch, lifecycle, hud: final.hud, screenshot, consoleErrors, pageErrors });
              await context.close();
            }
          } finally {
            await browser.close();
          }
          const receipt = {
            receiptType: 'H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN_7I_MAIN_PUBLIC_ROUTE_LIVE_RECEIPT',
            eligible: true,
            status: 'RUN_7I_MAIN_PUBLIC_ROUTE_LIVE_PASS',
            mergedMainCommit: process.env.GITHUB_SHA,
            liveUrl: url,
            deployedSourceIdentityMatch: true,
            configurationCount: results.length,
            desktopExecution: 'PASS',
            samsungMobilePortraitExecution: 'PASS',
            samsungMobileLandscapeExecution: 'PASS',
            run7hIntegrationLoaded: true,
            publicShellPreserved: true,
            environmentTelemetryComplete: true,
            lifecycleTransitionProof: 'PASS',
            actualLiveBrowserExecution: true,
            physicalSamsungInstrumentation: false,
            results,
            issues: []
          };
          await fs.writeFile(path.join(output, 'run7i-live-receipt.json'), `${JSON.stringify(receipt, null, 2)}\n`, 'utf8');
          console.log(JSON.stringify(receipt, null, 2));
          NODE
          set -o pipefail
          node h-earth-run7i-live-browser.mjs 2>&1 | tee h-earth-run7i-live-artifacts/live-browser.log

      - name: Verify live receipt
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const receipt = JSON.parse(readFileSync('h-earth-run7i-live-artifacts/run7i-live-receipt.json', 'utf8'));
          if (
            receipt.eligible !== true ||
            receipt.status !== 'RUN_7I_MAIN_PUBLIC_ROUTE_LIVE_PASS' ||
            receipt.deployedSourceIdentityMatch !== true ||
            receipt.configurationCount !== 3 ||
            receipt.desktopExecution !== 'PASS' ||
            receipt.samsungMobilePortraitExecution !== 'PASS' ||
            receipt.samsungMobileLandscapeExecution !== 'PASS' ||
            receipt.run7hIntegrationLoaded !== true ||
            receipt.publicShellPreserved !== true ||
            receipt.environmentTelemetryComplete !== true ||
            receipt.lifecycleTransitionProof !== 'PASS' ||
            receipt.actualLiveBrowserExecution !== true ||
            receipt.physicalSamsungInstrumentation !== false ||
            receipt.issues.length !== 0
          ) process.exit(1);
          NODE

      - name: Upload Run 7I live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-run7i-main-public-route-live-evidence
          path: h-earth-run7i-live-artifacts
          if-no-files-found: error
          retention-days: 30
