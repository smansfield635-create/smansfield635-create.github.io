name: Temporary CP3 Constitutional Room Relations Verify

on:
  pull_request:
    paths:
      - 'control-plane/whole-estate/constitutional-room-relation-contracts-v1/**'
      - '.github/workflows/temporary-cp3-constitutional-room-relations-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-checkpoint-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Checkpoint 3 constitutional room relation contracts
        run: node control-plane/whole-estate/constitutional-room-relation-contracts-v1/verify.v1.mjs
