name: Audralia H-Earth Gratitude Geographic Convergence Validation

on:
  pull_request:
    branches:
      - validation/mirror-manor-repaired-harness-base
  workflow_dispatch:

concurrency:
  group: audralia-h-earth-gratitude-geographic-convergence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-geographic-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out geographic dependency surface
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            h-earth-3d
            showroom/globe/h-earth
            showroom/globe/audralia
          sparse-checkout-cone-mode: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Execute Audralia H-Earth geographic convergence verifier
        run: |
          set -o pipefail
          node h-earth-3d/validation/audralia.gratitude-geographic-convergence.v1.mjs \
            2>&1 | tee /tmp/audralia-h-earth-geographic-convergence.log

      - name: Upload convergence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audralia-h-earth-gratitude-geographic-convergence-evidence
          path: /tmp/audralia-h-earth-geographic-convergence.log
          if-no-files-found: error
          retention-days: 30
