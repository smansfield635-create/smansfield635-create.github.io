name: Compass Gen1554 Bounded Presentation Repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/compass-display-continuity-validation.yml'

permissions:
  contents: write

env:
  EXPECTED_HEAD: 6d445f1c205c044ad8cb3aeb1fd5f192f86dd50f
  EXPECTED_BRANCH: compass/instructional-hierarchy-scale-1554
  OPERATION_ID: COMPASS_INSTRUCTIONAL_HIERARCHY_AND_DIMENSIONAL_SCALE_SUCCESSOR_20260819_v1

jobs:
  bounded-repair:
    if: github.head_ref == 'compass/instructional-hierarchy-scale-1554' && github.event.pull_request.head.sha == '6d445f1c205c044ad8cb3aeb1fd5f192f86dd50f'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reverify exact AI-entry route and candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD"
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH"
          node tools/repository-ai-entry-router.mjs \
            --mutation-intent \
            --task "$OPERATION_ID" \
            --path assets/compass/compass.capability-carousel.css \
            --output "$RUNNER_TEMP/router.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/router.json');if(r.disposition!=='PASS'||r.routes?.length!==1||r.routes[0].disposition!=='PASS')process.exit(1)"
      - name: Append bounded visibility and proportionality repair
        shell: bash
        run: |
          set -euo pipefail
          cat >> assets/compass/compass.capability-carousel.css <<'CSS'

