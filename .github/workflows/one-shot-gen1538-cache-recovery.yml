name: One-shot Gen1538 Cache Identity Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-gen1538-cache-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rotate stale Gen1538 capability runtime identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='/assets/compass/compass.capability-carousel.js?v=compass-root-award-finish-successor-v1&g=1536-live-binding-v1'
          new=old+'&cb=e48e34a66bb65a'
          if new in s:
              raise SystemExit(0)
          if s.count(old) != 1:
              raise SystemExit(f'expected one stale capability binding, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit identity repair and self-remove
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/one-shot-gen1538-cache-recovery.yml
          git add index.html .github/workflows/one-shot-gen1538-cache-recovery.yml
          git commit -m 'chore(delivery): bind Gen1538 capability runtime [cache-identity-sync]'
          git push origin HEAD:main
          gh workflow run pages-direct-deploy.yml --ref main
