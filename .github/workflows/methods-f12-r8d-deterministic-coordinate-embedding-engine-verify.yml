name: Methods F12 R8D Deterministic Coordinate Embedding Engine Verify

on:
  push:
    branches:
      - agent/methods-f12-r8d-deterministic-coordinate-embedding-engine-v1

permissions:
  contents: read

jobs:
  verify-r8d-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact terminal R8C parent and frozen boundaries
        shell: bash
        run: |
          set -euo pipefail
          ROOT="control-plane/methods-information-benchmark/f12-recursive-spatial-information-architecture-remediation-v1"
          test "$(git rev-parse HEAD^)" = "071abfc15af87b9350d037ee05fed528631be9a8"
          test "$(git rev-parse 071abfc15af87b9350d037ee05fed528631be9a8^{tree})" = "989d1d9c7de41836b11616de5f24b0d1ad6e42d8"
          test "$(git rev-parse HEAD:$ROOT/r8c-transform-projection-presentation-separation.v1.json)" = "d0c8441bb88b68b91282ff334270b739305ed97b"
          test "$(git rev-parse HEAD:$ROOT/r8b-system-coordinate-atlas-contract.v1.json)" = "ccbe92dc0f4bcee99a34f17ef9efdfcea4329ccf"
          test "$(git rev-parse HEAD:$ROOT/r8a-canonical-delivery-state-space-contract.v1.json)" = "3f593061fa3d4906c769707904108249943e3826"
          test "$(git rev-parse HEAD:$ROOT/r6-spatial-transformation-grammar-contract.v1.json)" = "6abb8d6b30fc92aa1eaff44ca7f8ec4e567b5938"
          test "$(git rev-parse HEAD:$ROOT/r7-continuity-and-accessibility-contract.v1.json)" = "475aa283c3feb2fb6520f953c0a96d94285bc214"
          test "$(git rev-parse HEAD:$ROOT/f12-r8-r12-continuation-corridor-freeze.v1.json)" = "86ea28520cc4954ab533142fc22abd0cac5a9d9e"

      - name: Verify exact terminal R8D payload blobs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="control-plane/methods-information-benchmark/f12-recursive-spatial-information-architecture-remediation-v1"
          test "$(git rev-parse HEAD:$ROOT/r8d-deterministic-coordinate-embedding-engine-contract.v1.json)" = "c851d474a662d4f80c0342ec93c3d7ebe062e53b"
          test "$(git rev-parse HEAD:$ROOT/r8d-deterministic-coordinate-embedding-engine.v1.mjs)" = "0605d450116b0583592fa2906bca71eb4c2598fa"
          test "$(git rev-parse HEAD:$ROOT/r8d-deterministic-coordinate-embedding-engine.verify.v1.mjs)" = "57f610520c360bcc6ed81446a15618a47d159f46"
          node -e "JSON.parse(require('fs').readFileSync('$ROOT/r8d-deterministic-coordinate-embedding-engine-contract.v1.json','utf8'))"
          node --check "$ROOT/r8d-deterministic-coordinate-embedding-engine.v1.mjs"
          node --check "$ROOT/r8d-deterministic-coordinate-embedding-engine.verify.v1.mjs"

      - name: Verify terminal R8D deterministic coordinate embedding engine
        shell: bash
        run: |
          set -euo pipefail
          ROOT="control-plane/methods-information-benchmark/f12-recursive-spatial-information-architecture-remediation-v1"
          node "$ROOT/r8d-deterministic-coordinate-embedding-engine.verify.v1.mjs" | tee r8d-deterministic-coordinate-embedding-verification.json
          grep -Fq '"status": "PASS_CLOSED"' r8d-deterministic-coordinate-embedding-verification.json
          grep -Fq '"engineId": "DETERMINISTIC_COORDINATE_EMBEDDING_ENGINE_v1"' r8d-deterministic-coordinate-embedding-verification.json
          grep -Fq '"deterministicEmbeddingVerified": true' r8d-deterministic-coordinate-embedding-verification.json
          grep -Fq '"crossChartCanonicalInvariantDigestPreserved": true' r8d-deterministic-coordinate-embedding-verification.json
          grep -Fq '"chartNonrepresentabilityFailClosedVerified": true' r8d-deterministic-coordinate-embedding-verification.json
          grep -Fq '"concreteEstateChartInstancesConstructed": false' r8d-deterministic-coordinate-embedding-verification.json
          grep -Fq '"coordinateEmbeddingRuntimeConstructed": true' r8d-deterministic-coordinate-embedding-verification.json
          grep -Fq '"coordinateTransitionRuntimeConstructed": false' r8d-deterministic-coordinate-embedding-verification.json
          grep -Fq '"projectionRuntimeConstructed": false' r8d-deterministic-coordinate-embedding-verification.json
          grep -Fq '"presentationRuntimeConstructed": false' r8d-deterministic-coordinate-embedding-verification.json
          grep -Fq '"visiblePrototypeConstructed": false' r8d-deterministic-coordinate-embedding-verification.json
          grep -Fq '"r8dPassClosed": true' r8d-deterministic-coordinate-embedding-verification.json
          grep -Fq '"r8PassClosed": false' r8d-deterministic-coordinate-embedding-verification.json
          grep -Fq '"r9Unlock": false' r8d-deterministic-coordinate-embedding-verification.json
          grep -Fq '"nextSubcheckpointOnPass": "R8E_CROSS_FRAME_INVARIANCE_AND_ROUNDTRIP_VERIFICATION"' r8d-deterministic-coordinate-embedding-verification.json
          grep -Fq '"r8eEligibility": "ELIGIBLE_READY_FOR_EXECUTION"' r8d-deterministic-coordinate-embedding-verification.json

      - name: Prove exact additive R8D terminal diff scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 071abfc15af87b9350d037ee05fed528631be9a8..HEAD | tee r8d-deterministic-coordinate-embedding-changed-paths.txt
          test "$(wc -l < r8d-deterministic-coordinate-embedding-changed-paths.txt)" -eq 4
          expected="$(mktemp)"
          cat > "$expected" <<'EOF'
          .github/workflows/methods-f12-r8d-deterministic-coordinate-embedding-engine-verify.yml
          control-plane/methods-information-benchmark/f12-recursive-spatial-information-architecture-remediation-v1/r8d-deterministic-coordinate-embedding-engine-contract.v1.json
          control-plane/methods-information-benchmark/f12-recursive-spatial-information-architecture-remediation-v1/r8d-deterministic-coordinate-embedding-engine.v1.mjs
          control-plane/methods-information-benchmark/f12-recursive-spatial-information-architecture-remediation-v1/r8d-deterministic-coordinate-embedding-engine.verify.v1.mjs
          EOF
          sed -i 's/^          //' "$expected"
          sort r8d-deterministic-coordinate-embedding-changed-paths.txt > actual.sorted
          sort "$expected" > expected.sorted
          diff -u expected.sorted actual.sorted
          test -z "$(git diff --diff-filter=MDR --name-only 071abfc15af87b9350d037ee05fed528631be9a8..HEAD)"

      - name: Preserve terminal R8D engine evidence
        uses: actions/upload-artifact@v4
        with:
          name: methods-f12-r8d-deterministic-coordinate-embedding-engine-evidence
          path: |
            control-plane/methods-information-benchmark/f12-recursive-spatial-information-architecture-remediation-v1/r8d-deterministic-coordinate-embedding-engine-contract.v1.json
            r8d-deterministic-coordinate-embedding-verification.json
            r8d-deterministic-coordinate-embedding-changed-paths.txt
