name: H-Earth Gratitude Region Registry Admission Validation

on:
  push:
    branches:
      - agent/h-earth-gratitude-region-coordinate-reconciliation-registry-admission-001
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-registry-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out registry admission branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate exact package and registry scope resolution
        run: |
          node --experimental-default-type=module <<'NODE' | tee /tmp/h-earth-gratitude-region-registry-admission-receipt.json
          import crypto from 'node:crypto';
          import registryFacade, {
            H_EARTH_GRATITUDE_REGION_COORDINATE_RECONCILIATION_PACKAGE_OCCURRENCES,
            H_EARTH_GRATITUDE_REGION_COORDINATE_RECONCILIATION_SCOPE_NODE
          } from './h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.gratitude-region-coordinate-reconciliation-scope.js';
          import { runAutomaticHEarthPreflight } from './h-earth-3d/registry/activation/h-earth.repository-registry.auto-preflight.js';

          const PACKAGE_HEAD = 'a0cadd1e5ce70d98c34f11ddacb063c91816bd93';
          const SELF_PATH = '/h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.gratitude-region-coordinate-reconciliation-scope.js';
          const LOADER_PATH = '/h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js';
          const allPackagePaths = H_EARTH_GRATITUDE_REGION_COORDINATE_RECONCILIATION_PACKAGE_OCCURRENCES.map(([path]) => path);
          const governedPaths = allPackagePaths.filter((path) => path.startsWith('/h-earth-3d/') || path.startsWith('/showroom/globe/h-earth/'));
          const issues = [];

          const expected = new Map(H_EARTH_GRATITUDE_REGION_COORDINATE_RECONCILIATION_PACKAGE_OCCURRENCES);
          if (allPackagePaths.length !== 16) issues.push('PACKAGE_PATH_COUNT_NOT_16');
          if (governedPaths.length !== 15) issues.push('GOVERNED_PATH_COUNT_NOT_15');
          if (new Set(allPackagePaths).size !== 16) issues.push('DUPLICATE_PACKAGE_PATH');

          for (const path of [...allPackagePaths, SELF_PATH, LOADER_PATH]) {
            const resolution = registryFacade.resolveHEarthRepositoryRegistryPath(path);
            if (resolution.resolved !== true || resolution.unresolved !== false) issues.push(`PATH_UNRESOLVED:${path}`);
            if (!resolution.nodes.some((node) => node.nodeId === H_EARTH_GRATITUDE_REGION_COORDINATE_RECONCILIATION_SCOPE_NODE.nodeId)) {
              issues.push(`PACKAGE_NODE_NOT_RESOLVED:${path}`);
            }
            if (!Array.isArray(resolution.occurrences) || resolution.occurrences.length < 1) issues.push(`OCCURRENCE_UNRESOLVED:${path}`);
            if (expected.has(path)) {
              const occurrence = resolution.occurrences.find((entry) => entry.path === path && entry.commitSha === PACKAGE_HEAD);
              if (!occurrence) issues.push(`EXACT_COMMIT_OCCURRENCE_MISSING:${path}`);
              if (occurrence && occurrence.gitBlobSha !== expected.get(path)) issues.push(`EXACT_BLOB_OCCURRENCE_MISMATCH:${path}`);
            }
          }

          const preflight = runAutomaticHEarthPreflight({
            paths: governedPaths,
            taskText: 'Gratitude Region coordinate reconciliation registry admission verification',
            mutationIntent: false
          });
          const failureCodes = preflight.validatorReceipt?.failureCodes ?? [];
          const resolvedPaths = preflight.validatorReceipt?.resolvedPaths ?? [];
          const affectedNodeIds = preflight.scopePreview?.affectedNodeIds ?? [];
          if (failureCodes.includes('REQUESTED_PATH_UNRESOLVED')) issues.push('REQUESTED_PATH_UNRESOLVED_NOT_CLOSED');
          if (failureCodes.includes('OPERATION_SCOPE_UNRESOLVED')) issues.push('OPERATION_SCOPE_UNRESOLVED_NOT_CLOSED');
          if (resolvedPaths.length !== 15) issues.push(`PREFLIGHT_RESOLVED_PATH_COUNT_${resolvedPaths.length}_NOT_15`);
          if (!affectedNodeIds.includes(H_EARTH_GRATITUDE_REGION_COORDINATE_RECONCILIATION_SCOPE_NODE.nodeId)) issues.push('PACKAGE_NODE_NOT_IN_AFFECTED_SCOPE');

          const instance = registryFacade.getHEarthRepositoryRegistryInstance();
          if (!instance.nodes.some((node) => node.nodeId === H_EARTH_GRATITUDE_REGION_COORDINATE_RECONCILIATION_SCOPE_NODE.nodeId)) issues.push('PACKAGE_NODE_NOT_IN_COMBINED_INSTANCE');
          if (H_EARTH_GRATITUDE_REGION_COORDINATE_RECONCILIATION_SCOPE_NODE.authorityClass !== 'NO_AUTHORITY') issues.push('PACKAGE_NODE_AUTHORITY_OVERREACH');
          if (H_EARTH_GRATITUDE_REGION_COORDINATE_RECONCILIATION_SCOPE_NODE.allowedMutationScope !== 'READ_ONLY_INSPECTION') issues.push('PACKAGE_NODE_MUTATION_SCOPE_OVERREACH');
          if (H_EARTH_GRATITUDE_REGION_COORDINATE_RECONCILIATION_SCOPE_NODE.lifecycleStatus !== 'CANDIDATE') issues.push('PACKAGE_NODE_LIFECYCLE_PROMOTION');

          const base = {
            schemaVersion: 'H_EARTH_GRATITUDE_REGION_COORDINATE_RECONCILIATION_REGISTRY_ADMISSION_VALIDATION_RECEIPT_v1',
            registryAdmissionBranch: 'agent/h-earth-gratitude-region-coordinate-reconciliation-registry-admission-001',
            packageHead: PACKAGE_HEAD,
            exactPackagePathCount: allPackagePaths.length,
            governedPreflightPathCount: governedPaths.length,
            packageWorkflowPathRegistered: registryFacade.resolveHEarthRepositoryRegistryPath('/.github/workflows/h-earth-gratitude-region-coordinate-reconciliation.yml').resolved,
            registrySelfPathResolved: registryFacade.resolveHEarthRepositoryRegistryPath(SELF_PATH).resolved,
            registryLoaderPathResolved: registryFacade.resolveHEarthRepositoryRegistryPath(LOADER_PATH).resolved,
            preflightFinalDisposition: preflight.finalDisposition,
            preflightContinuation: preflight.continuation,
            preflightResolvedPathCount: resolvedPaths.length,
            preflightAffectedNodeIds: affectedNodeIds,
            preflightFailureCodes: failureCodes,
            requestedPathUnresolvedClosed: !failureCodes.includes('REQUESTED_PATH_UNRESOLVED'),
            operationScopeUnresolvedClosed: !failureCodes.includes('OPERATION_SCOPE_UNRESOLVED'),
            spatialCandidateAcceptanceCreated: false,
            finalCoordinateAuthorityCreated: false,
            pr311RetargetAuthorityCreated: false,
            pr311MergeAuthorityCreated: false,
            canonicalizationAuthorityCreated: false,
            productConstructionAuthorityCreated: false,
            issues
          };
          const stable = (value) => value === null || typeof value !== 'object'
            ? JSON.stringify(value)
            : Array.isArray(value)
              ? `[${value.map(stable).join(',')}]`
              : `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${stable(value[key])}`).join(',')}}`;
          const digest = crypto.createHash('sha256').update(stable(base)).digest('hex');
          const receipt = { ...base, receiptDigest: digest, status: issues.length === 0 ? 'PASS_CLOSED' : 'FAIL_STOPPED' };
          console.log(JSON.stringify(receipt, null, 2));
          if (issues.length > 0) process.exitCode = 1;
          NODE

      - name: Upload registry admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-gratitude-region-registry-admission-evidence
          path: /tmp/h-earth-gratitude-region-registry-admission-receipt.json
          if-no-files-found: error
          retention-days: 30
