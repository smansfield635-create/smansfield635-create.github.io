name: Issue Comment Fanout Consolidation PR v1

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: issue-comment-fanout-consolidation-v1
  cancel-in-progress: true

jobs:
  consolidate:
    if: github.event.pull_request.head.ref == 'infra/issue-comment-fanout-consolidation-20260826' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra/issue-comment-fanout-consolidation-20260826
          fetch-depth: 0

      - name: Consolidate legacy issue_comment listeners
        run: node tools/issue-comment-fanout-consolidation-v1.mjs

      - name: Verify only central transport retains issue_comment
        run: |
          set -euo pipefail
          count=$(grep -RIl --include='*.yml' --include='*.yaml' '^[[:space:]]*issue_comment:' .github/workflows | wc -l)
          echo "ISSUE_COMMENT_LISTENER_COUNT=$count"
          test "$count" -eq 1

      - name: Commit consolidation to repair branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows evidence/control-plane/issue-comment-fanout-consolidation.receipt.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Control plane: collapse issue-comment workflow fanout'
          git push origin HEAD:infra/issue-comment-fanout-consolidation-20260826
