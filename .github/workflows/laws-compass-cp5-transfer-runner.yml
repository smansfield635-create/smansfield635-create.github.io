name: Laws Compass CP5 one-run transfer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/laws-compass-cp5-transfer-runner.yml

permissions:
  contents: write

jobs:
  transfer-correction-to-isolated-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/laws-compass-cp5-celestial-expression-correction-001
          fetch-depth: 0

      - name: Execute guarded patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/laws_cp5_celestial_patch.py
          node --check laws/index.crystals.js
          git diff --check
          test "$(git diff --name-only | paste -sd, -)" = "laws/index.crystals.js"

      - name: Commit product and remove branch-local helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add laws/index.crystals.js
          git commit -m "Checkpoint 5C: correct celestial opacity relief and identity"
          git rm .github/workflows/laws-compass-cp5-celestial-correction.yml tools/laws_cp5_celestial_patch.py
          git commit -m "Checkpoint 5C: remove temporary correction helpers"
          git push origin HEAD:agent/laws-compass-cp5-celestial-expression-correction-001
