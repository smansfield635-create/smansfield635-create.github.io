<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Audralia OW01 — Gratitude Continental Skeleton & Coastal Entry</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="preview-shell" aria-label="Audralia OW01 Gratitude continental skeleton and coastal-entry nonpublic inspector">
    <header class="preview-toolbar" aria-live="polite">
      <div class="preview-brand">Audralia · Gratitude · OW01</div>
      <div class="preview-status" data-h-earth-status>boot…</div>
      <button class="preview-button" type="button" data-fit-world>reset view</button>
    </header>

    <section class="preview-viewport" aria-label="Interactive Audralia OW01 authoring viewport">
      <canvas
        class="preview-canvas"
        data-h-earth-map-wide-canvas
        aria-label="Interactive 3D Audralia Gratitude geography inspector"
      ></canvas>
    </section>

    <footer class="preview-help" data-h-earth-diagnostic>
      One finger: orbit · two fingers: pan + pinch · wheel: zoom · W/A/S/D or arrows: move.
    </footer>
  </main>

  <script>
    (() => {
      const statusNode = document.querySelector('[data-h-earth-status]');
      const diagnosticNode = document.querySelector('[data-h-earth-diagnostic]');
      const describe = (value) => {
        if (value instanceof Error) return value.message || value.name;
        if (value && typeof value === 'object' && 'message' in value) return String(value.message);
        return String(value ?? 'unknown browser error');
      };
      const markFailure = (label, detail) => {
        if (statusNode) {
          statusNode.textContent = 'ERROR';
          statusNode.dataset.status = label;
        }
        if (diagnosticNode) diagnosticNode.textContent = `${label}: ${describe(detail)}`;
      };
      window.addEventListener('error', (event) => markFailure('WINDOW_ERROR', event.error || event.message));
      window.addEventListener('unhandledrejection', (event) => markFailure('UNHANDLED_REJECTION', event.reason));
      window.__H_EARTH_AUDRALIA_OW01_INSPECTOR_BOOTSTRAP_ACTIVE__ = true;
    })();
  </script>
  <script type="module" src="./app.mjs"></script>
  <script>
    (()=>{
      const ACCEPTED_ATMOSPHERE_HEAD='8381f3323261b4facf70ec1f236c015b7d5df5a9';
      const canvas=document.querySelector('[data-h-earth-map-wide-canvas]');
      const statusNode=document.querySelector('[data-h-earth-status]');
      const diagnosticNode=document.querySelector('[data-h-earth-diagnostic]');
      const focusButton=document.querySelector('[data-fit-world]');
      const PLANET_RADIUS=6200,PLANET_CENTER=[0,-PLANET_RADIUS,0],CLOUD_HEIGHT=92,CLOUD_RADIUS=PLANET_RADIUS+CLOUD_HEIGHT,SUN=[.42,.78,.46];
      const norm=v=>{const l=Math.hypot(...v)||1;return v.map(x=>x/l);};
      const add=(a,b)=>a.map((v,i)=>v+b[i]);
      const sub=(a,b)=>a.map((v,i)=>v-b[i]);
      const scale=(a,s)=>a.map(v=>v*s);
      const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
      const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
      const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
      const smooth=(a,b,v)=>{const t=clamp((v-a)/(b-a||1),0,1);return t*t*(3-2*t);};
      const fail=error=>{console.error('H_EARTH_CLOUD_FIELD_CHECKPOINT_FAILED',error);if(statusNode){statusNode.textContent='ERROR';statusNode.dataset.status='CLOUD_FIELD_FAILED';}if(diagnosticNode)diagnosticNode.textContent=`CLOUD_FIELD_FAILED: ${error instanceof Error?error.message:String(error)}`;};
      let cloudLayer=null,scheduled=false;

      function createCloudLayer(renderer){
        const parent=canvas?.parentElement;if(!(canvas instanceof HTMLCanvasElement)||!(parent instanceof HTMLElement))throw Error('CLOUD_FIELD_VIEWPORT_MISSING');
        if(getComputedStyle(parent).position==='static')parent.style.position='relative';
        const overlay=document.createElement('canvas');overlay.setAttribute('aria-hidden','true');overlay.dataset.hEarthClouds='true';Object.assign(overlay.style,{position:'absolute',pointerEvents:'none',zIndex:'4',background:'transparent'});parent.appendChild(overlay);
        const gl=overlay.getContext('webgl2',{alpha:true,antialias:true,premultipliedAlpha:false,powerPreference:'high-performance'});if(!gl)throw Error('CLOUD_FIELD_WEBGL2_UNAVAILABLE');
        const VS=`#version 300 es\nprecision highp float;\nlayout(location=0) in vec3 aPosition;\nlayout(location=1) in vec3 aNormal;\nuniform mat4 uVP;\nout vec3 vPos;\nout vec3 vNormal;\nvoid main(){vPos=aPosition;vNormal=aNormal;gl_Position=uVP*vec4(aPosition,1.0);}`;
        const FS=`#version 300 es\nprecision highp float;\nin vec3 vPos;\nin vec3 vNormal;\nuniform vec3 uEye;\nuniform vec3 uSunDir;\nuniform float uOpacity;\nout vec4 outColor;\nfloat hash31(vec3 p){p=fract(p*.1031);p+=dot(p,p.yzx+33.33);return fract((p.x+p.y)*p.z);}\nfloat noise3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);float n000=hash31(i+vec3(0.0,0.0,0.0)),n100=hash31(i+vec3(1.0,0.0,0.0)),n010=hash31(i+vec3(0.0,1.0,0.0)),n110=hash31(i+vec3(1.0,1.0,0.0)),n001=hash31(i+vec3(0.0,0.0,1.0)),n101=hash31(i+vec3(1.0,0.0,1.0)),n011=hash31(i+vec3(0.0,1.0,1.0)),n111=hash31(i+vec3(1.0,1.0,1.0));float x00=mix(n000,n100,f.x),x10=mix(n010,n110,f.x),x01=mix(n001,n101,f.x),x11=mix(n011,n111,f.x);return mix(mix(x00,x10,f.y),mix(x01,x11,f.y),f.z);}\nfloat fbm(vec3 p){float v=.55*noise3(p);p=p*2.03+vec3(1.7,-2.1,.9);v+=.27*noise3(p);p=p*2.07+vec3(-.8,1.4,2.2);v+=.13*noise3(p);p=p*2.11+vec3(2.3,.4,-1.2);v+=.05*noise3(p);return v;}\nvoid main(){vec3 n=normalize(vNormal),viewDir=normalize(uEye-vPos),sun=normalize(uSunDir);vec3 stretched=vec3(n.x*2.0,n.y*3.35,n.z*2.55);float macro=fbm(stretched+vec3(.41,1.57,-.29)),weather=fbm(n*4.15+vec3(.71,1.93,-.37)),detail=fbm(n*10.6+vec3(-1.4,.52,2.3)),streak=.032*sin(n.y*13.0+n.x*3.2-n.z*5.1),field=macro*.58+weather*.32+detail*.10+streak,base=smoothstep(.60,.76,field),core=pow(base,1.85),wispy=smoothstep(.565,.635,field)*(1.0-base)*.22,density=clamp(core+wispy,0.0,1.0),daylight=.45+.55*clamp(dot(n,sun)*.5+.5,0.0,1.0),facing=clamp(dot(n,viewDir),0.0,1.0),edge=.76+.24*pow(facing,.35);vec3 shade=mix(vec3(.82,.84,.86),vec3(1.0),daylight);outColor=vec4(shade,uOpacity*density*edge*.90);}`;
        const compile=(type,source)=>{const shader=gl.createShader(type);gl.shaderSource(shader,source);gl.compileShader(shader);if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))throw Error(`CLOUD_SHADER_COMPILE_FAILED:${gl.getShaderInfoLog(shader)}`);return shader;};
        const program=gl.createProgram();gl.attachShader(program,compile(gl.VERTEX_SHADER,VS));gl.attachShader(program,compile(gl.FRAGMENT_SHADER,FS));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(`CLOUD_PROGRAM_LINK_FAILED:${gl.getProgramInfoLog(program)}`);
        const lon=144,lat=92,vertices=[],indices=[],at=(r,c)=>r*(lon+1)+c;
        for(let r=0;r<=lat;r++){const latitude=-Math.PI/2+r/lat*Math.PI,cosLat=Math.cos(latitude),sinLat=Math.sin(latitude);for(let c=0;c<=lon;c++){const longitude=-Math.PI+c/lon*Math.PI*2,n=norm([cosLat*Math.cos(longitude),sinLat,cosLat*Math.sin(longitude)]);vertices.push(PLANET_CENTER[0]+n[0]*CLOUD_RADIUS,PLANET_CENTER[1]+n[1]*CLOUD_RADIUS,PLANET_CENTER[2]+n[2]*CLOUD_RADIUS,...n);}}
        for(let r=0;r<lat;r++)for(let c=0;c<lon;c++){const a=at(r,c),b=at(r,c+1),d=at(r+1,c),e=at(r+1,c+1);indices.push(a,d,b,b,d,e);}
        const vao=gl.createVertexArray();gl.bindVertexArray(vao);const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(vertices),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,24,0);gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,3,gl.FLOAT,false,24,12);const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(indices),gl.STATIC_DRAW);
        const perspective=(fov,aspect,near,far)=>{const f=1/Math.tan(fov/2),inv=1/(near-far);return new Float32Array([f/aspect,0,0,0,0,f,0,0,0,0,(far+near)*inv,-1,0,0,2*far*near*inv,0]);};
        const lookAt=(eye,target,up)=>{const z=norm(sub(eye,target));let x=cross(up,z);if(Math.hypot(...x)<1e-5)x=[1,0,0];x=norm(x);const y=cross(z,x);return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1]);};
        const multiply=(left,right)=>{const output=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)output[c*4+r]=left[r]*right[c*4]+left[4+r]*right[c*4+1]+left[8+r]*right[c*4+2]+left[12+r]*right[c*4+3];return output;};
        const tangentDirection=(u,v)=>{const radius=Math.hypot(u,v);if(radius<1e-9)return[0,1,0];const angle=radius/PLANET_RADIUS,sine=Math.sin(angle),cosine=Math.cos(angle);return norm([sine*u/radius,cosine,sine*v/radius]);};
        const surfacePosition=(direction,elevation=0)=>[PLANET_CENTER[0]+direction[0]*(PLANET_RADIUS+elevation),PLANET_CENTER[1]+direction[1]*(PLANET_RADIUS+elevation),PLANET_CENTER[2]+direction[2]*(PLANET_RADIUS+elevation)];
        const tangentPosition=(u,v)=>surfacePosition(tangentDirection(u,v),0);
        const cameraFrame=snapshot=>{const pitch=clamp(snapshot.pitch,.46,1.49),distance=clamp(snapshot.distance,95,5600),yaw=snapshot.yaw,targetU=snapshot.targetU,targetV=snapshot.targetV,direction=tangentDirection(targetU,targetV),target=surfacePosition(direction,0),pU1=tangentPosition(targetU+1,targetV),pU0=tangentPosition(targetU-1,targetV),pV1=tangentPosition(targetU,targetV+1),pV0=tangentPosition(targetU,targetV-1),eU=norm(sub(pU1,pU0)),eV=norm(sub(pV1,pV0)),horizontal=norm(add(scale(eU,Math.sin(yaw)),scale(eV,Math.cos(yaw)))),eye=add(add(target,scale(direction,distance*Math.sin(pitch)+18)),scale(horizontal,distance*Math.cos(pitch)));return{eye,target,up:direction};};
        const resize=()=>{const rect=canvas.getBoundingClientRect(),parentRect=parent.getBoundingClientRect();overlay.style.left=`${rect.left-parentRect.left}px`;overlay.style.top=`${rect.top-parentRect.top}px`;overlay.style.width=`${rect.width}px`;overlay.style.height=`${rect.height}px`;const dpr=Math.min(1.25,window.devicePixelRatio||1),w=Math.max(1,Math.round(rect.width*dpr)),h=Math.max(1,Math.round(rect.height*dpr));if(overlay.width!==w||overlay.height!==h){overlay.width=w;overlay.height=h;}gl.viewport(0,0,w,h);};
        const diagnostic=renderer=>{if(!diagnosticNode)return;const scaleName=renderer.getViewScale();const text={LOCAL:'LOCAL · accepted atmosphere and Gratitude baseline protected · tuned orbital cloud field fades before local scale · cloud-interior transit intentionally deferred.',REGION:'REGION · tuned sparse planet-anchored cloud field · inspect clear-sky gaps, altitude separation, and confirm geography remains fixed.',CONTINENT:'CONTINENT · broken cloud systems above the accepted atmosphere · inspect parallax, dense cores, clear gaps, and coastline readability.',PLANETARY:'PLANETARY · Cloud Field Checkpoint 1 tuning · sparse procedural cloud systems with clear-sky separation · no texture assets and no weather simulation.'};diagnosticNode.textContent=text[scaleName]||text.LOCAL;};
        const render=()=>{resize();const snapshot=renderer.getSnapshot(),cam=cameraFrame(snapshot),altitude=Math.max(0,Math.hypot(...sub(cam.eye,PLANET_CENTER))-PLANET_RADIUS),entry=smooth(380,1100,altitude),distant=1-smooth(5400,7600,altitude),opacity=.70*entry*distant;gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);if(opacity>.002){const vp=multiply(perspective(55*Math.PI/180,overlay.width/overlay.height,2,PLANET_RADIUS*4.5),lookAt(cam.eye,cam.target,cam.up));gl.disable(gl.DEPTH_TEST);gl.depthMask(false);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.enable(gl.CULL_FACE);gl.cullFace(altitude<CLOUD_HEIGHT?gl.FRONT:gl.BACK);gl.useProgram(program);gl.uniformMatrix4fv(gl.getUniformLocation(program,'uVP'),false,vp);gl.uniform3fv(gl.getUniformLocation(program,'uEye'),cam.eye);gl.uniform3fv(gl.getUniformLocation(program,'uSunDir'),SUN);gl.uniform1f(gl.getUniformLocation(program,'uOpacity'),opacity);gl.bindVertexArray(vao);gl.drawElements(gl.TRIANGLES,indices.length,gl.UNSIGNED_INT,0);gl.disable(gl.CULL_FACE);gl.disable(gl.BLEND);gl.depthMask(true);}overlay.dataset.altitude=altitude.toFixed(2);overlay.dataset.opacity=opacity.toFixed(4);diagnostic(renderer);};
        const evidence=Object.freeze({schema:'H_EARTH_OW01_CLOUD_FIELD_CHECKPOINT_v2',acceptedAtmosphereHead:ACCEPTED_ATMOSPHERE_HEAD,planetCentered:true,cameraCentered:false,geographicAuthority:false,cloudHeightAuthoringUnits:CLOUD_HEIGHT,proceduralThreeDimensionalNoise:true,coverageThreshold:.60,coreThreshold:.76,nonlinearCoreExponent:1.85,lowDensityVeilSuppressed:true,neutralCloudColor:true,textureAssetsUsed:false,weatherSimulationConstructed:false,continuousAnimationConstructed:false,cloudInteriorTransitConstructed:false,localShellFade:true,separatePresentationCanvas:true,rendererMutation:false});
        return Object.freeze({overlay,render,getEvidence:()=>evidence});
      }

      const schedule=()=>{if(!cloudLayer||scheduled)return;scheduled=true;requestAnimationFrame(()=>{scheduled=false;try{cloudLayer.render();}catch(error){fail(error);}});};
      const attach=renderer=>{cloudLayer=createCloudLayer(renderer);cloudLayer.render();window.__H_EARTH_OW01_CLOUD_LAYER__=cloudLayer;window.__H_EARTH_OW01_CLOUD_EVIDENCE__=cloudLayer.getEvidence();canvas.addEventListener('pointermove',schedule);canvas.addEventListener('wheel',schedule,{passive:true});canvas.addEventListener('dblclick',schedule);focusButton?.addEventListener('click',schedule);window.addEventListener('resize',schedule);if(statusNode){statusNode.textContent='REVIEW';statusNode.dataset.status='OW01_CLOUD_FIELD_USER_REVIEW_REQUIRED';}};
      let attempts=0;const wait=()=>{try{const renderer=window.__H_EARTH_AUDRALIA_OPEN_WORLD_OW01_PREVIEW__?.renderer;if(renderer){attach(renderer);return;}if(attempts++<600)requestAnimationFrame(wait);else throw Error('ACCEPTED_RENDERER_NOT_AVAILABLE_FOR_CLOUD_FIELD');}catch(error){fail(error);}};wait();
    })();
  </script>
</body>
