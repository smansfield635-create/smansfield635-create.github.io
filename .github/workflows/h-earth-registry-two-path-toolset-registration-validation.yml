name: PR570 Router Count Defect Fixed Termination

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h-earth-registry-two-path-toolset-registration-validation.yml'

permissions:
  contents: write
  actions: read

jobs:
  terminate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact carrier identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "${{ github.event.pull_request.head.sha }}"
          test "$(git diff --name-only ffe3cb714751ea0e8df2e53611538f6cadcc241c HEAD)" = ".github/workflows/h-earth-registry-two-path-toolset-registration-validation.yml"
          node --check tools/operation-intake/repository-operation-lock-manager.v1.mjs
      - name: Close defective generation 104 FAIL_CLOSED
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if node tools/operation-intake/repository-operation-lock-manager.v1.mjs \
              --action close \
              --repository "${{ github.repository }}" \
              --lock-ref refs/heads/operation-locks/repository-operation-intake-v1 \
              --operation-id H_EARTH_MAP_WIDE_INSTRUMENT_ROUTER_OWNERSHIP_R_001 \
              --lock-scope 'REPOSITORY_AI_ROUTER_INFRASTRUCTURE:H_EARTH_MAP_WIDE_INSTRUMENT_OWNERSHIP:R:V1' \
              --lock-generation 104 \
              --terminal-disposition FAIL_CLOSED \
              --output /tmp/generation-104-closure.json; then
              break
            fi
            test "$attempt" -lt 3
            sleep $((attempt * 2))
          done
          node -e "const r=require('/tmp/generation-104-closure.json');if(r.result!=='TERMINAL_CLOSURE_COMMITTED'||r.lockReleased!==true)process.exit(1)"
      - name: Close termination generation 108 PASS_CLOSED
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if node tools/operation-intake/repository-operation-lock-manager.v1.mjs \
              --action close \
              --repository "${{ github.repository }}" \
              --lock-ref refs/heads/operation-locks/repository-operation-intake-v1 \
              --operation-id H_EARTH_MAP_WIDE_ROUTER_COUNT_DEFECT_TERMINATION_T_001 \
              --lock-scope 'H_EARTH:MAP_WIDE_ROUTER_COUNT_DEFECT:TERMINATION:T:V1' \
              --lock-generation 108 \
              --terminal-disposition PASS_CLOSED \
              --output /tmp/generation-108-closure.json; then
              break
            fi
            test "$attempt" -lt 3
            sleep $((attempt * 2))
          done
          node -e "const r=require('/tmp/generation-108-closure.json');if(r.result!=='TERMINAL_CLOSURE_COMMITTED'||r.lockReleased!==true)process.exit(1)"
      - name: Emit authority termination receipt
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const defective=JSON.parse(fs.readFileSync('/tmp/generation-104-closure.json','utf8'));
          const current=JSON.parse(fs.readFileSync('/tmp/generation-108-closure.json','utf8'));
          const receipt={
            schema:'PR570_ROUTER_COUNT_DEFECT_AUTHORITY_TERMINATION_RECEIPT_v1',
            result:'PASS_CLOSED_DEFECTIVE_OPERATION_TERMINATED',
            defectiveOperationId:'H_EARTH_MAP_WIDE_INSTRUMENT_ROUTER_OWNERSHIP_R_001',
            defectiveGeneration:104,
            defectiveTerminalDisposition:'FAIL_CLOSED',
            terminationOperationId:'H_EARTH_MAP_WIDE_ROUTER_COUNT_DEFECT_TERMINATION_T_001',
            terminationGeneration:108,
            terminationTerminalDisposition:'PASS_CLOSED',
            defectiveClosureCommit:defective.closureCommitSha,
            terminationClosureCommit:current.closureCommitSha,
            repositoryMutationPerformed:false,
            mergePerformed:false,
            residualAuthority:false
          };
          receipt.receiptDigest=crypto.createHash('sha256').update(JSON.stringify(receipt)).digest('hex');
          fs.writeFileSync('/tmp/authority-termination.json',JSON.stringify(receipt,null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: pr570-router-count-defect-termination-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/generation-104-closure.json
            /tmp/generation-108-closure.json
            /tmp/authority-termination.json
          if-no-files-found: error
          retention-days: 90
