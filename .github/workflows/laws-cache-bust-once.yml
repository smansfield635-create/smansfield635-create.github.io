name: Laws cache bust once

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  cache-bust:
    if: github.event.pull_request.head.ref == 'agent/laws-cache-bust-trigger-001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace exact Laws asset versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('laws/index.html')
          text = page.read_text(encoding='utf-8')

          presentation_old = 'LAWS_CP6_EXPERIENTIAL_PRESENTATION_20260801A'
          presentation_new = 'LAWS_CP6_EXPERIENTIAL_PRESENTATION_20260801B'
          polish_old = 'LAWS_CP6_EXPERIENTIAL_POLISH_20260801A'
          polish_new = 'LAWS_CP6_EXPERIENTIAL_POLISH_20260801B'

          presentation_count = text.count(presentation_old)
          polish_count = text.count(polish_old)

          if presentation_count != 2:
              raise SystemExit(
                  f'Expected two presentation identities; found {presentation_count}'
              )
          if polish_count != 1:
              raise SystemExit(
                  f'Expected one polish identity; found {polish_count}'
              )

          text = text.replace(presentation_old, presentation_new)
          text = text.replace(polish_old, polish_new, 1)
          page.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/laws-cache-bust-once.yml')
          if not workflow.exists():
              raise SystemExit('One-shot workflow file missing before cleanup')
          workflow.unlink()
          PY

      - name: Verify bounded diff
        shell: bash
        run: |
          git diff -- laws/index.html .github/workflows/laws-cache-bust-once.yml
          test "$(git diff --numstat -- laws/index.html | awk '{print $1+$2}')" -eq 6
          grep -q 'index.experience.css?v=LAWS_CP6_EXPERIENTIAL_PRESENTATION_20260801B' laws/index.html
          grep -q 'index.experience.js?v=LAWS_CP6_EXPERIENTIAL_PRESENTATION_20260801B' laws/index.html
          grep -q 'index.experience.polish.css?v=LAWS_CP6_EXPERIENTIAL_POLISH_20260801B' laws/index.html
          ! grep -q 'LAWS_CP6_EXPERIENTIAL_PRESENTATION_20260801A' laws/index.html
          ! grep -q 'LAWS_CP6_EXPERIENTIAL_POLISH_20260801A' laws/index.html

      - name: Publish cache identity correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add laws/index.html .github/workflows/laws-cache-bust-once.yml
          git commit -m 'Bust Laws experiential asset cache identities'
          git push origin HEAD:main
