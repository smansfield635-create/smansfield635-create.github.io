name: Exact Candidate Adoption Carrier v1

on:
  workflow_dispatch:
    inputs:
      generation:
        description: Frozen operation generation
        required: true
        type: string
      candidate:
        description: Immutable candidate commit SHA
        required: true
        type: string
      adopt:
        description: Exact adoption request token
        required: true
        type: choice
        options:
          - ADOPT

permissions:
  contents: write

env:
  ADOPTION_GENERATION: ${{ inputs.generation }}
  ADOPTION_CANDIDATE: ${{ inputs.candidate }}
  ADOPTION_REQUEST: ${{ inputs.adopt }}
  ADOPTION_OUTPUT: ${{ runner.temp }}/exact-candidate-adoption-receipt.json
  FINAL_ADOPTION_OUTPUT: ${{ runner.temp }}/exact-candidate-adoption-final.receipt.json

jobs:
  adopt-and-qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted carrier
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Run carrier self-test
        run: node .github/ai-router/exact-candidate-adoption/exact-candidate-adoption-self-test.v1.mjs

      - name: Verify and request exact adoption
        id: adoption
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/ai-router/exact-candidate-adoption/exact-candidate-adoption.v1.mjs

      - name: Reconcile authoritative post-adoption state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const fixture=JSON.parse(fs.readFileSync('.github/ai-router/exact-candidate-adoption/fixtures/gen1378.v1.json','utf8'));
          let raw={result:'NO_EXECUTOR_RECEIPT'};
          if(fs.existsSync(process.env.ADOPTION_OUTPUT)) raw=JSON.parse(fs.readFileSync(process.env.ADOPTION_OUTPUT,'utf8'));
          const url=`https://api.github.com/repos/${fixture.repository}/branches/${encodeURIComponent(fixture.authorizedBranch)}`;
          const response=await fetch(url,{headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${process.env.GITHUB_TOKEN}`,'X-GitHub-Api-Version':'2022-11-28'}});
          if(!response.ok) throw new Error(`POST_ADOPTION_BRANCH_READ_FAILED:${response.status}`);
          const branch=await response.json();
          const observed=branch?.commit?.sha ?? null;
          let result;
          if(observed===fixture.candidate) result=raw.result==='ALREADY_ADOPTED'?'ALREADY_ADOPTED':'ADOPTED';
          else if(observed===fixture.expectedParent) result='REFUSED';
          else result='ADOPTION_OUTCOME_UNKNOWN';
          const receipt={
            schema:'EXACT_CANDIDATE_ADOPTION_FINAL_RECEIPT_v1',
            result,
            generation:fixture.generation,
            candidate:fixture.candidate,
            authorizedBranch:fixture.authorizedBranch,
            expectedParent:fixture.expectedParent,
            observedPostState:observed,
            executorResult:raw.result ?? null,
            executorErrorCode:raw.errorCode ?? null,
            mutationObserved:observed===fixture.candidate && observed!==fixture.expectedParent,
            force:false
          };
          fs.writeFileSync(process.env.FINAL_ADOPTION_OUTPUT,JSON.stringify(receipt,null,2)+'\n');
          if(!['ADOPTED','ALREADY_ADOPTED'].includes(result)) {
            console.error(JSON.stringify(receipt));
            process.exit(result==='ADOPTION_OUTCOME_UNKNOWN'?2:1);
          }
          console.log(JSON.stringify(receipt));
          NODE

      - name: Checkout adopted candidate for explicit qualification
        if: success()
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate }}
          persist-credentials: false

      - name: Qualify Generation 1378 candidate explicitly
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.generation }}" = "1378"
          test "${{ inputs.candidate }}" = "cb0b892fdc20f612e79c1c35307bd476192cddef"
          test ! -e .github/workflows/platform-control-plane-strike-v1.yml
          test ! -d .github/ai-router/platform-control-plane
          node - <<'NODE'
          const fs=require('fs');
          const router=JSON.parse(fs.readFileSync('.github/ai-router/router.v1.json','utf8'));
          const retired='.github/workflows/platform-control-plane-strike-v1.yml';
          if(router.routerInfrastructure.ownedExactPaths.includes(retired)) throw new Error('RETIRED_WORKFLOW_REFERENCE_STILL_PRESENT');
          NODE
          node tools/repository-ai-entry-router.mjs --self-test --output "$RUNNER_TEMP/router-self-test-receipt.json"
          node - <<'NODE'
          const fs=require('fs');
          const p=process.env.RUNNER_TEMP+'/router-self-test-receipt.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          const result=String(r.result ?? r.status ?? '');
          if(!/PASS/i.test(result)) throw new Error('ROUTER_SELF_TEST_NONPASS:'+result);
          NODE

      - name: Emit qualification receipt
        if: success()
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const adoption=JSON.parse(fs.readFileSync(process.env.FINAL_ADOPTION_OUTPUT,'utf8'));
          const router=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/router-self-test-receipt.json','utf8'));
          const receipt={schema:'EXACT_CANDIDATE_ADOPTION_QUALIFICATION_RECEIPT_v1',result:'PASS_CLOSED',generation:1378,candidate:'cb0b892fdc20f612e79c1c35307bd476192cddef',adoptionResult:adoption.result,routerSelfTest:router};
          const text=JSON.stringify(receipt,null,2)+'\n';
          receipt.receiptDigest=crypto.createHash('sha256').update(text).digest('hex');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/exact-candidate-qualification-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          NODE

      - name: Upload immutable adoption evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-candidate-adoption-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/exact-candidate-adoption-receipt.json
            ${{ runner.temp }}/exact-candidate-adoption-final.receipt.json
            ${{ runner.temp }}/exact-candidate-qualification-receipt.json
            ${{ runner.temp }}/router-self-test-receipt.json
          if-no-files-found: warn
          retention-days: 90
