name: Compass Gen1526 Candidate Browser Qualification

on:
  pull_request:
    paths:
      - 'assets/compass/compass.identity-3d.js'
      - 'assets/compass/compass.brain-scene.js'
      - '.github/ai-router/projects/compass/verify-performance-successor.mjs'
      - '.github/ai-router/projects/compass/verify-display-continuity.v1.mjs'
      - '.github/workflows/compass-performance-successor-validation.yml'
      - '.github/workflows/compass-carousel-successor-live-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GEN1526_GOVERNING_HEAD: f8eefd20fc1cdcdc777e070f008bb2e2b8580da1
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  COMPASS_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  COMPASS_PERFORMANCE_OUTPUT: /tmp/compass-gen1526-performance.json
  COMPASS_VERIFICATION_OUTPUT: /tmp/compass-gen1526-display.json

jobs:
  qualify-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact checkout and static Gen1526 contract
        run: |
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$GEN1526_GOVERNING_HEAD" "$EXPECTED_HEAD"
          git diff --quiet "$GEN1526_GOVERNING_HEAD" -- assets/compass/compass.crystals.js
          node .github/ai-router/projects/compass/verify-performance-successor.mjs
          node .github/ai-router/projects/compass/verify-display-continuity.v1.mjs
          jq -e '.result == "PASS_CLOSED" and .lockGeneration == 1526' /tmp/compass-gen1526-performance.json >/dev/null
          jq -e '.result == "PASS_CLOSED" and .lockGeneration == 1526' /tmp/compass-gen1526-display.json >/dev/null
      - name: Install browser runtime
        env:
          npm_config_package_lock: 'false'
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Start isolated candidate server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/compass-gen1526-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
      - name: Isolate tablet RAF ownership on independent pages
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const candidate=process.env.EXPECTED_HEAD;
          const base=`http://127.0.0.1:4173/?candidate=${candidate}&surface=tablet&raf-isolation=1`;
          const measure=async page=>page.evaluate(async()=>{const a=[];let last=performance.now();for(let i=0;i<90;i++)await new Promise(r=>requestAnimationFrame(now=>{a.push(now-last);last=now;r()}));const s=a.slice(5).sort((x,y)=>x-y);return{median:Number((s[Math.floor(s.length*.5)]||999).toFixed(2)),p95:Number((s[Math.floor(s.length*.95)]||999).toFixed(2)),samples:s.length}});
          const browser=await chromium.launch({headless:true});
          const controlContext=await browser.newContext({viewport:{width:820,height:1180}});const control=await controlContext.newPage();await control.setContent('<!doctype html><main>control</main>');await control.waitForTimeout(250);const runnerControl=await measure(control);await controlContext.close();
          const scenarios={};
          const runScenario=async(name,blocks)=>{const context=await browser.newContext({viewport:{width:820,height:1180},reducedMotion:'no-preference'});await context.addInitScript(()=>{const native=window.requestAnimationFrame.bind(window);window.__DGB_RAF_BLOCKS__=[];window.requestAnimationFrame=cb=>{const stack=String(new Error().stack||'').split('\n').slice(2);const source=stack.find(x=>x.includes('127.0.0.1:4173'))||stack[0]||'unknown';return native(ts=>{if((window.__DGB_RAF_BLOCKS__||[]).some(pattern=>source.includes(pattern)))return;return cb(ts);});};});const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(String(e)));await page.goto(`${base}&scenario=${name}`,{waitUntil:'domcontentloaded',timeout:30000});await page.waitForFunction(()=>globalThis.DGB_COMPASS_IDENTITY_3D_GEN1524?.mounted===true,{timeout:15000});await page.waitForTimeout(1800);await page.evaluate(b=>{window.__DGB_RAF_BLOCKS__=b;},blocks);await page.waitForTimeout(500);const cadence=await measure(page);const state=await page.evaluate(()=>({mirrorland:globalThis.DGB_COMPASS_MIRRORLAND_WINDOW?.getState?.()||null,crystalReceipt:globalThis.DGB_COMPASS_CRYSTALS_RECEIPT||null,spatialReceipt:globalThis.DGB_UPSTREAM_COMPASS_RENDERER?.receipt?.()||globalThis.DGB_UPSTREAM_COMPASS_RENDERER_RECEIPT||null,cardinals:document.querySelectorAll('[data-cardinal-id]').length,rooms:document.querySelectorAll('[data-compass-room-declarations] [data-compass-room]').length}));scenarios[name]={blocks,cadence,errors,state};await context.close();};
          await runScenario('baseline',[]);
          await runScenario('mirrorland_only',['compass.mirrorland-window.js']);
          await runScenario('crystals_only',['compass.crystals.js']);
          await runScenario('mirrorland_and_crystals',['compass.mirrorland-window.js','compass.crystals.js']);
          await runScenario('spatial_only',['upstream-compass.renderer.js']);
          await browser.close();
          const pass=v=>v.median<=18.5&&v.p95<=26;
          const receipt={schema:'COMPASS_GEN1526_TABLET_RAF_OWNER_ISOLATION_v1',operationId:'COMPASS_CONTINUOUS_RENDERERS_PERFORMANCE_CONTINUATION_20260817_008',lockGeneration:1526,governingHead:process.env.GEN1526_GOVERNING_HEAD,candidateHead:candidate,targetFrameBudgetMs:16.7,runnerControl,scenarios,causalPasses:Object.fromEntries(Object.entries(scenarios).map(([k,v])=>[k,pass(v.cadence)]))};
          fs.writeFileSync('/tmp/compass-gen1526-browser.json',JSON.stringify(receipt,null,2)+'\n');console.log(JSON.stringify(receipt,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-gen1526-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/compass-gen1526-performance.json
            /tmp/compass-gen1526-display.json
            /tmp/compass-gen1526-browser.json
            /tmp/compass-gen1526-server.log
          retention-days: 90
