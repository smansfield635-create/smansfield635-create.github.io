name: H-Earth Neutral Exact Head Runner

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/h-earth-neutral-exact-head-runner.yml'
      - 'tools/h-earth-ground-material-comparison.v1.mjs'
      - 'tools/h-earth-ground-material-comparison.v1.test.mjs'
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact candidate SHA to execute unchanged
        required: true
        type: string
      route_path:
        description: Optional repository route path; defaults to root H-Earth route
        required: false
        default: '/showroom/globe/h-earth/'
        type: string
      route_query:
        description: Optional query string without leading question mark
        required: false
        default: ''
        type: string
      exercise_vegetation_residency:
        description: After READY, exercise bounded Gen2523 vegetation residency to completion
        required: false
        default: false
        type: boolean
      apply_timing_shim:
        description: Apply Variant-B timing observation shim
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  exact-head:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.route_query != 'qualification=gen2711-grass-beach-fast-v1' && inputs.route_query != 'qualification=ground-material-gen2898-stage-c' && inputs.route_query != 'qualification=groundcover-factor-v1' && inputs.route_query != 'qualification=groundcover-mapwide-scout-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1

      - name: Require exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.target_sha }}"

      - name: Fetch fixed woodland-meadow qualification history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 376210ddefeacbf0f22f66233c7e8746d6be075c
          git fetch --no-tags --depth=1 origin 7804b359aa032caa00f8dd526f8e4186df97fac9
          git fetch --no-tags --depth=1 origin 35e7fc09a9fdae8df7fb9d0f1f90913f9b1d1fba
          git cat-file -e 376210ddefeacbf0f22f66233c7e8746d6be075c^{commit}
          git cat-file -e 7804b359aa032caa00f8dd526f8e4186df97fac9^{commit}
          git cat-file -e 35e7fc09a9fdae8df7fb9d0f1f90913f9b1d1fba^{commit}

      - name: Execute source-applicable woodland mechanical qualification
        shell: bash
        env:
          EXACT_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/h-earth-exact-evidence
          # Preserve the archived October 6 validator unchanged and enforce
          # it on its original frozen candidate, not later approved trees.
          historical_head=35e7fc09a9fdae8df7fb9d0f1f90913f9b1d1fba
          if [ "$EXACT_TARGET_SHA" = "$historical_head" ]; then
            node h-earth-3d/validation/h-earth.woodland-meadow-distribution-20261006.mjs --output /tmp/h-earth-exact-evidence/woodland-meadow-distribution-mechanical.json
          else
            # Later four-tree source is a separately accepted composition.
            # Unknown P2 sector/rock/tree identities must fail CLOSED:
            # a future boulder change needs fresh source-qualified proof.
            sector=showroom/globe/h-earth/render/geometry-landscape-sector.p2.js
            rock=showroom/globe/h-earth/render/woodland-rock-presentation.v1.js
            tree=showroom/globe/h-earth/render/geometry-woodland-tree-trial.js
            sector_blob="$(git hash-object "$sector")"
            rock_blob="$(git hash-object "$rock")"
            tree_blob="$(git hash-object "$tree")"
            test "$sector_blob" = c26247dcb69cb52c968fcd3ef6c2626eaa577d03
            test "$rock_blob" = 77e7038d27862a39c31676d1d9a1ee9a84d5f267
            test "$tree_blob" = 3958513dec53aa27f4216388a190f772e71fb9b0
            printf '%s  %s\n' '48f754ca1b11b8fe7eeb0e8d4573f6b6cb544cf438322a115eb52c44d3b29d5a' 'showroom/globe/h-earth/render/assets/h-earth-canonical-base-world.v1.json.gz' | sha256sum --check --status
            node --check "$sector"
            node --check "$rock"
            node --check "$tree"
            # Exact later geology changes only its module cache identity; the
            # historical Gen2694 cache chain is not a universal future invariant.
            # Every other exact SHA keeps the original fail-closed source check.
            if [ "$EXACT_TARGET_SHA" = '05200380887d06d841a3e8e4c627a6eb3dc24e2e' ]; then
              node --check showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js
              node --check showroom/globe/h-earth/functional-landscape/navigation.js
              node --check showroom/globe/h-earth/diagnostic/run8e-r3d/pointer-touch-intake.js
              node --test \
                h-earth-3d/validation/h-earth.geological-formation-successor.test.mjs \
                h-earth-3d/validation/h-earth.geological-portal-interface.test.mjs \
                h-earth-3d/validation/h-earth.run8e-geology-integration.v1.test.mjs \
                > /tmp/h-earth-exact-evidence/gen2735-geology-node36.tap
              grep -Eq '^# pass 36$' /tmp/h-earth-exact-evidence/gen2735-geology-node36.tap
              jq -n --arg target "$EXACT_TARGET_SHA" '{
                schema:"H_EARTH_GEN2735_GEOLOGICAL_BROWSER_PREFLIGHT_v1",
                result:"SOURCE_VERIFIED_NOT_BROWSER_ACCEPTANCE",
                candidateHead:$target,sourceSuitePassed:36,
                historicalGen2694CacheChain:"NOT_APPLICABLE_CHANGED_MODULE_URLS",
                protectedWorldIdentityCheckedSeparately:true,
                browserDrawExecuted:false,ownerVisualAcceptance:false,
                releaseAuthorized:false
              }' > /tmp/h-earth-exact-evidence/modern-source-binding.json
            elif [ "$EXACT_TARGET_SHA" = '828b25664903ee0723846f133012abc3d5fd7db6' ]; then
