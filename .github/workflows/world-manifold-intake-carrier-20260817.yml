name: World Manifold Gen306 Far Context Diagnostic

on:
  push:
    branches:
      - control-plane-carrier/world-manifold-intake-20260817
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_HEAD: e9c18e8097725c05aa5261a21a2af24c8ef3e55f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: smansfield635-create/smansfield635-create.github.io
          ref: ${{ env.CANDIDATE_HEAD }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Print far-context native result
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { constructHEarthDistantContextGeometry } from './showroom/globe/h-earth/render/geometry-distant-context.js';
          import { buildHEarthWorldManifoldRepresentationPlan } from './h-earth-3d/integration/h-earth.world-representation-plan.js';
          const plan=buildHEarthWorldManifoldRepresentationPlan({cameraWorld:{x:0,y:8,z:-40},rings:[520,820,1180,1680,2200],sectorCount:64});
          console.log('PLAN',JSON.stringify({eligible:plan.eligible,issues:plan.issues,water:plan.vertices.filter(v=>v.sample.surfaceClass==='WATER').length,land:plan.vertices.filter(v=>v.sample.surfaceClass!=='WATER').length}));
          const result=constructHEarthDistantContextGeometry({cameraWorld:{x:0,y:8,z:-40}});
          console.log('RESULT',JSON.stringify({ok:result.ok,status:result.status,issues:result.issues,primitive:result.primitives?.[0]?{id:result.primitives[0].primitiveId,bounds:result.primitives[0].geometry?.bounds,metadata:result.primitives[0].metadata}:null}));
          if(result.ok!==true) process.exit(31);
          NODE
