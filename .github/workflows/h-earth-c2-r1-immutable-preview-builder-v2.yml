name: H-Earth C2-R1 Immutable Preview Builder V2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h-earth-c2-r1-immutable-preview-builder-v2.yml'

permissions:
  contents: write

concurrency:
  group: h-earth-c2-r1-immutable-preview-builder-v2
  cancel-in-progress: false

jobs:
  materialize-verify-commit:
    if: github.head_ref == 'publication/h-earth-c2-r1-immutable-preview-a699c5a-001'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_HEAD: a699c5a64e2bf54d950a69c839c3d9ee41b6514f
      PUBLICATION_BRANCH: publication/h-earth-c2-r1-immutable-preview-a699c5a-001
      PREVIEW_ROOT: preview/h-earth/c2-r1/a699c5a64e2bf54d950a69c839c3d9ee41b6514f
      PREVIEW_URL_PATH: /preview/h-earth/c2-r1/a699c5a64e2bf54d950a69c839c3d9ee41b6514f/index.html
      PLAYWRIGHT_VERSION: 1.55.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publication/h-earth-c2-r1-immutable-preview-a699c5a-001
          fetch-depth: 0
          path: publication
      - uses: actions/checkout@v4
        with:
          ref: a699c5a64e2bf54d950a69c839c3d9ee41b6514f
          fetch-depth: 1
          path: source

      - name: Materialize exact self-contained preview
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re,shutil,subprocess
          from pathlib import Path,PurePosixPath

          ws=Path(os.environ['GITHUB_WORKSPACE']); src=ws/'source'; pub=ws/'publication'
          preview_rel=PurePosixPath(os.environ['PREVIEW_ROOT']); out=pub/Path(str(preview_rel))
          prefix='/'+str(preview_rel).strip('/')+'/'
          source_head=os.environ['SOURCE_HEAD']
          entry=PurePosixPath('h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/index.html')
          text_ext={'.js','.mjs','.html','.json','.css','.txt','.svg'}
          spec_re=re.compile(r"(?:from\s+|import\s*\(\s*|import\s+|fetch\s*\(\s*)['\"]([^'\"]+)['\"]")
          html_re=re.compile(r"(?:src|href)\s*=\s*['\"]([^'\"]+)['\"]",re.I)
          absolute_re=re.compile(r"(['\"])(/[^'\"`\s]+)\1")
          if out.exists(): shutil.rmtree(out)
          out.mkdir(parents=True)

          def normalize(owner,spec):
            if spec.startswith(('http://','https://','data:','blob:','#')): return None
            if spec.startswith('/'): p=PurePosixPath(spec.lstrip('/'))
            elif spec.startswith('.'): p=owner.parent.joinpath(spec)
            else: return None
            return PurePosixPath(os.path.normpath(str(p)).replace('\\','/'))

          def existing(owner,spec,strict=False):
            p=normalize(owner,spec)
            if p is None: return None
            if (src/Path(str(p))).is_file(): return p
            if strict: raise FileNotFoundError(f'UNRESOLVED_RUNTIME_DEPENDENCY:{owner}:{spec}:{p}')
            return None

          q=[entry]; seen=set()
          while q:
            item=q.pop(0)
            if item in seen: continue
            path=src/Path(str(item))
            if not path.is_file(): raise FileNotFoundError(f'SOURCE_FILE_MISSING:{item}')
            seen.add(item)
            if path.suffix.lower() not in text_ext: continue
            text=path.read_text('utf-8')
            specs=[m.group(1) for m in spec_re.finditer(text)]
            if path.suffix.lower() in {'.html','.svg'}: specs += [m.group(1) for m in html_re.finditer(text)]
            for spec in specs:
              dep=existing(item,spec,strict=True)
              if dep is not None and dep not in seen: q.append(dep)
            for m in absolute_re.finditer(text):
              dep=existing(item,m.group(2),strict=False)
              if dep is not None and dep not in seen: q.append(dep)

          def rebase(owner,text):
            def replace_absolute(m):
              spec=m.group(2); dep=existing(owner,spec,strict=False)
              if dep is None: return m.group(0)
              return m.group(1)+prefix+'_source/'+str(dep)+m.group(1)
            return absolute_re.sub(replace_absolute,text)

          def sha(data): return hashlib.sha256(data).hexdigest()
          rows=[]
          for item in sorted(seen,key=str):
            sp=src/Path(str(item)); raw=sp.read_bytes(); blob=subprocess.check_output(['git','-C',str(src),'rev-parse',f'{source_head}:{item}'],text=True).strip()
            transform='NONE'
            if item==entry:
              text=raw.decode('utf-8')
              if '<meta name="robots"' not in text: text=text.replace('</title>','</title>\n  <meta name="robots" content="noindex,nofollow,noarchive">',1)
              text=text.replace('<html lang="en"','<html lang="en" data-preview-class="IMMUTABLE_UNLINKED_NONPRODUCTION_REVIEW" data-source-head="a699c5a64e2bf54d950a69c839c3d9ee41b6514f"',1)
              text=text.replace('<header>','<header><div class="badge" style="border-color:#f4c86a;color:#ffe9a8;background:#5a430f66">Nonproduction immutable review · exact verified head a699c5a</div>',1)
              text=text.replace('<script type="module" src="./complete-world.js"></script>','<script type="module" src="./_source/h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/complete-world.js"></script>\n  <script type="module" src="./preview-correspondence-verifier.js"></script>',1)
              text=text.replace('</footer>','<p><strong>Byte correspondence:</strong> <output id="preview-correspondence-status">Verifying immutable preview files…</output></p></footer>',1)
              rel=PurePosixPath('index.html'); data=text.encode(); transform='ENTRY_REBASED_LABEL_AND_NOINDEX'
            else:
              rel=PurePosixPath('_source')/item
              if sp.suffix.lower() in text_ext:
                original=raw.decode('utf-8'); changed=rebase(item,original); data=changed.encode()
                if changed!=original: transform='ABSOLUTE_EXISTING_FILE_PATHS_REBASED'
              else: data=raw
            dp=out/Path(str(rel)); dp.parent.mkdir(parents=True,exist_ok=True); dp.write_bytes(data)
            rows.append({'sourceFile':str(item),'sourceCommit':source_head,'sourceBlob':blob,'sourceSha256':sha(raw),'previewFile':str(rel),'previewSha256':sha(data),'transform':transform})

          verifier="""const node=document.getElementById('preview-correspondence-status');
          const hex=b=>[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
          const dig=async b=>hex(await crypto.subtle.digest('SHA-256',b));
          const base=new URL('./',import.meta.url);
          try{const mr=await fetch(new URL('byte-manifest.json',base),{cache:'no-store'}),dr=await fetch(new URL('byte-manifest.sha256',base),{cache:'no-store'});if(!mr.ok||!dr.ok)throw new Error(`MANIFEST_HTTP_FAILURE:${mr.status}:${dr.status}`);const mb=await mr.arrayBuffer(),expected=(await dr.text()).trim().split(/\\s+/)[0],actual=await dig(mb);if(actual!==expected)throw new Error('MANIFEST_DIGEST_MISMATCH');const m=JSON.parse(new TextDecoder().decode(mb)),all=[...m.sourceEntries,...m.generatedFiles],results=[];for(const row of all){const r=await fetch(new URL(row.previewFile,base),{cache:'no-store'});if(!r.ok)throw new Error(`PREVIEW_FILE_HTTP_FAILURE:${row.previewFile}:${r.status}`);const a=await dig(await r.arrayBuffer());results.push({previewFile:row.previewFile,expected:row.previewSha256,actual:a,match:a===row.previewSha256});if(a!==row.previewSha256)throw new Error(`PREVIEW_FILE_DIGEST_MISMATCH:${row.previewFile}`)}window.H_EARTH_C2_R1_PREVIEW_CORRESPONDENCE=Object.freeze({status:'PASS',sourceHead:m.sourceHead,fileCount:all.length,manifestDigest:actual,results});if(node)node.textContent=`PASS · ${all.length} files bound to ${m.sourceHead.slice(0,12)}`;}catch(e){window.H_EARTH_C2_R1_PREVIEW_CORRESPONDENCE=Object.freeze({status:'FAIL',error:{name:e.name,message:e.message}});if(node)node.textContent=`FAIL · ${e.message}`;console.error('H_EARTH_C2_R1_PREVIEW_CORRESPONDENCE_FAILURE',e)}
          """
          vp=out/'preview-correspondence-verifier.js'; vp.write_text(verifier,'utf-8')
          generated=[{'previewFile':'preview-correspondence-verifier.js','previewSha256':sha(vp.read_bytes()),'generationAuthority':'H_EARTH_C2_R1_COMPLETE_WORLD_IMMUTABLE_PREVIEW_PUBLICATION_001'}]
          manifest={'manifestType':'H_EARTH_C2_R1_IMMUTABLE_PREVIEW_SOURCE_TO_PREVIEW_BYTE_MANIFEST_v2','operationId':'H_EARTH_C2_R1_COMPLETE_WORLD_IMMUTABLE_PREVIEW_PUBLICATION_001','sourceHead':source_head,'previewPath':str(preview_rel)+'/', 'expectedPublicEntry':'https://diamondgatebridge.com/'+str(preview_rel)+'/index.html','packageIdentity':'H_EARTH_C2_R1_COMPLETE_WORLD_PACKAGE_218F37AE','packageContentDigest':'fnv1a32:218f37ae','sourceDependencyClosureCount':len(rows),'generatedFileCount':len(generated),'sourceEntries':rows,'generatedFiles':generated,'manifestSelfBinding':'byte-manifest.sha256','boundaries':{'unlinkedFromPublicNavigation':True,'publicDefaultRouteMutated':False,'productCandidateMerged':False,'sourceBehaviorChanged':False,'cloudflareUsed':False}}
          mp=out/'byte-manifest.json'; mp.write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n','utf-8'); md=sha(mp.read_bytes())
          (out/'byte-manifest.sha256').write_text(f'{md}  byte-manifest.json\n','utf-8')
          (out/'publication-receipt.json').write_text(json.dumps({'operationId':'H_EARTH_C2_R1_COMPLETE_WORLD_IMMUTABLE_PREVIEW_PUBLICATION_001','status':'MATERIALIZED_PENDING_LOCAL_BROWSER_PROOF','sourceHead':source_head,'previewFileCount':len(rows)+len(generated)+3,'dependencyClosureResult':'PASS','byteManifestResult':'PASS','manifestDigest':'sha256:'+md},indent=2)+'\n','utf-8')
          print(json.dumps({'closureCount':len(rows),'previewFileCount':len(rows)+len(generated)+3,'manifestDigest':md}))
          PY

      - name: Verify complete byte manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])/'publication'/os.environ['PREVIEW_ROOT']; src=Path(os.environ['GITHUB_WORKSPACE'])/'source'; m=json.loads((root/'byte-manifest.json').read_text())
          assert hashlib.sha256((root/'byte-manifest.json').read_bytes()).hexdigest()==(root/'byte-manifest.sha256').read_text().split()[0]
          accounted={'byte-manifest.json','byte-manifest.sha256','publication-receipt.json'}
          for row in m['sourceEntries']:
            s=src/row['sourceFile']; d=root/row['previewFile']; assert s.is_file() and d.is_file(); assert subprocess.check_output(['git','-C',str(src),'rev-parse',f"{m['sourceHead']}:{row['sourceFile']}"],text=True).strip()==row['sourceBlob']; assert hashlib.sha256(s.read_bytes()).hexdigest()==row['sourceSha256']; assert hashlib.sha256(d.read_bytes()).hexdigest()==row['previewSha256']; accounted.add(row['previewFile'])
          for row in m['generatedFiles']:
            d=root/row['previewFile']; assert d.is_file() and hashlib.sha256(d.read_bytes()).hexdigest()==row['previewSha256']; accounted.add(row['previewFile'])
          actual={str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}; assert actual==accounted,(sorted(actual-accounted),sorted(accounted-actual)); print(json.dumps({'result':'PASS','sourceEntries':len(m['sourceEntries']),'previewFiles':len(actual)}))
          PY

      - name: Install browser
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pw" "$RUNNER_TEMP/proof"
          cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium

      - name: Execute desktop and mobile local proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4188 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/publication" >"$RUNNER_TEMP/proof/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS "http://127.0.0.1:4188$PREVIEW_URL_PATH" >/dev/null && break; sleep 1; done
          cat > "$RUNNER_TEMP/pw/verify.mjs" <<'JS'
          import fs from 'node:fs';import path from 'node:path';import process from 'node:process';import {chromium} from 'playwright';
          const url=`http://127.0.0.1:4188${process.env.PREVIEW_URL_PATH}`,out=path.join(process.env.RUNNER_TEMP,'proof'),assert=(v,c,d=null)=>{if(!v){const e=new Error(c);e.detail=d;throw e}},sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function touch(page){await page.evaluate(async()=>{const c=document.getElementById('complete-world-canvas'),f=(t,id,x,y)=>c.dispatchEvent(new PointerEvent(t,{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:id===1,clientX:x,clientY:y,buttons:t==='pointerup'?0:1,pressure:t==='pointerup'?0:.5}));f('pointerdown',1,100,220);f('pointermove',1,210,220);await new Promise(r=>setTimeout(r,300));f('pointerup',1,210,220);f('pointerdown',1,100,360);f('pointerdown',2,220,360);f('pointermove',1,100,275);f('pointermove',2,220,275);await new Promise(r=>setTimeout(r,300));f('pointermove',1,55,275);f('pointermove',2,265,275);await new Promise(r=>setTimeout(r,300));f('pointerup',1,55,275);f('pointerup',2,265,275)})}
          async function run(browser,cfg){const context=await browser.newContext({viewport:cfg.viewport,deviceScaleFactor:cfg.dpr,isMobile:cfg.mobile,hasTouch:cfg.mobile}),page=await context.newPage(),consoleErrors=[],pageErrors=[],requestFailures=[],httpFailures=[];page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});page.on('pageerror',e=>pageErrors.push(e.message));page.on('requestfailed',r=>requestFailures.push({url:r.url(),failure:r.failure()}));page.on('response',r=>{if(r.status()>=400&&!r.url().endsWith('/favicon.ico'))httpFailures.push({url:r.url(),status:r.status()})});try{await page.goto(url,{waitUntil:'domcontentloaded',timeout:120000});await page.waitForFunction(()=>{const s=window.H_EARTH_C2_R1_COMPLETE_WORLD;return s?.ready===true||s?.failed===true},null,{timeout:120000,polling:250});const state=await page.evaluate(()=>{const s=window.H_EARTH_C2_R1_COMPLETE_WORLD;return s.failed?{failed:true,receipt:s.getFailureReceipt()}:{failed:false,receipt:s.getReceipt()}});if(state.failed){fs.writeFileSync(path.join(out,`${cfg.name}-runtime-failure.json`),JSON.stringify(state.receipt,null,2));throw Object.assign(new Error(`RUNTIME_FAILED:${state.receipt.rootRejectionCode}`),{detail:state.receipt})}await page.waitForFunction(()=>window.H_EARTH_C2_R1_PREVIEW_CORRESPONDENCE?.status==='PASS',null,{timeout:120000,polling:250});const before=state.receipt;assert(before.packageIdentity==='H_EARTH_C2_R1_COMPLETE_WORLD_PACKAGE_218F37AE','PACKAGE_IDENTITY',before.packageIdentity);assert(before.packageContentDigest==='fnv1a32:218f37ae','PACKAGE_DIGEST',before.packageContentDigest);assert(before.packageBinding.counters.candidateSampleFailureCount===0,'SAMPLE_FAILURE');assert(before.packageBinding.counters.boundTerrainVertexCount===10419,'TERRAIN_COUNT');assert(before.packageBinding.counters.boundShorelineVertexCount===299,'SHORELINE_COUNT');assert(before.renderer.counters.contextCreationCount===1&&before.renderer.counters.rendererInitializationCount===1,'WEBGL_INIT');if(cfg.mobile)await touch(page);else{const b=await page.locator('#complete-world-canvas').boundingBox();assert(b,'CANVAS_BOX');await page.mouse.move(b.x+b.width/2,b.y+b.height/2);await page.mouse.down();await page.mouse.move(b.x+b.width/2+100,b.y+b.height/2,{steps:10});await page.mouse.up();await page.mouse.wheel(0,-220);await sleep(350)}const after=await page.evaluate(()=>window.H_EARTH_C2_R1_COMPLETE_WORLD.getReceipt());assert(after.renderer.counters.visiblePresentationCount>before.renderer.counters.visiblePresentationCount,'FRAMES');assert(after.intake.counters.navigationProposalCount>before.intake.counters.navigationProposalCount,'NAVIGATION');if(cfg.mobile){assert(after.intake.counters.touchPointerEventCount>before.intake.counters.touchPointerEventCount,'TOUCH');assert(after.intake.counters.twoFingerTravelProposalCount>before.intake.counters.twoFingerTravelProposalCount,'TRAVEL');assert(after.intake.counters.pinchProposalCount>before.intake.counters.pinchProposalCount,'PINCH')}assert(consoleErrors.length===0,'CONSOLE',consoleErrors);assert(pageErrors.length===0,'PAGE',pageErrors);assert(requestFailures.length===0,'REQUEST',requestFailures);assert(httpFailures.length===0,'HTTP',httpFailures);await page.screenshot({path:path.join(out,`${cfg.name}.png`),fullPage:true});const receipt={name:cfg.name,before,after,correspondence:await page.evaluate(()=>window.H_EARTH_C2_R1_PREVIEW_CORRESPONDENCE),consoleErrors,pageErrors,requestFailures,httpFailures};fs.writeFileSync(path.join(out,`${cfg.name}.json`),JSON.stringify(receipt,null,2));return receipt}catch(e){fs.writeFileSync(path.join(out,`${cfg.name}-harness-failure.json`),JSON.stringify({error:{name:e.name,message:e.message,detail:e.detail??null},consoleErrors,pageErrors,requestFailures,httpFailures},null,2));throw e}finally{await context.close()}}
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--disable-dev-shm-usage']});try{const cfgs=[{name:'desktop-1440x900',viewport:{width:1440,height:900},dpr:1,mobile:false},{name:'mobile-412x915',viewport:{width:412,height:915},dpr:2.625,mobile:true},{name:'mobile-390x844',viewport:{width:390,height:844},dpr:3,mobile:true}],rows=[];for(const c of cfgs)rows.push(await run(browser,c));fs.writeFileSync(path.join(out,'local-preview-summary.json'),JSON.stringify({status:'PASS',sourceHead:process.env.SOURCE_HEAD,scenarios:rows.map(r=>r.name)},null,2))}finally{await browser.close()}
          JS
          cd "$RUNNER_TEMP/pw" && node verify.mjs
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['GITHUB_WORKSPACE'])/'publication'/os.environ['PREVIEW_ROOT']/'publication-receipt.json'; r=json.loads(p.read_text()); r.update({'status':'ROLE_1_PREMERGE_PROOF_PASS','localPreviewResult':'PASS','webgl2Result':'PASS_SINGLE_INITIALIZATION','cameraNavigationAndTouchResult':'PASS','consolePageRequestHttpResult':'PASS_ZERO_FAILURES'}); p.write_text(json.dumps(r,indent=2)+'\n')
          PY

      - name: Commit preview root only
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/publication"
          git config user.name h-earth-role1-preview-publisher
          git config user.email actions@users.noreply.github.com
          git add "$PREVIEW_ROOT"
          test -n "$(git status --porcelain -- "$PREVIEW_ROOT")"
          git commit -m 'H-Earth C2-R1: materialize immutable hash-bound preview'
          git push origin "HEAD:$PUBLICATION_BRANCH"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h-earth-c2-r1-immutable-preview-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/proof
            publication/${{ env.PREVIEW_ROOT }}/byte-manifest.json
            publication/${{ env.PREVIEW_ROOT }}/byte-manifest.sha256
            publication/${{ env.PREVIEW_ROOT }}/publication-receipt.json
          if-no-files-found: error
          retention-days: 30
