name: Laws FIRST rail transformer correction once

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - '.github/workflows/laws-first-rail-transform-fix-once.yml'

permissions:
  contents: write

jobs:
  install-corrected-architecture:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - name: Check out exact correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/laws-first-indicator-cache-bust-001
          fetch-depth: 0

      - name: Correct string replacement helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/laws-first-rail-architecture-transform.cjs')
          text = path.read_text()
          old = '''function replaceOnce(source, pattern, replacement, label) {
            const matches = source.match(pattern);
            if (!matches) throw new Error(`${label}: marker not found`);
            const result = source.replace(pattern, replacement);
            if (result === source) throw new Error(`${label}: replacement made no change`);
            return result;
          }'''.replace('          ', '')
          new = '''function replaceOnce(source, pattern, replacement, label) {
            if (!source.includes(pattern)) throw new Error(`${label}: marker not found`);
            const result = source.replace(pattern, replacement);
            if (result === source) throw new Error(`${label}: replacement made no change`);
            return result;
          }'''.replace('          ', '')
          if old not in text:
              raise SystemExit('replacement helper marker not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply full-file architectural correction
        run: node tools/laws-first-rail-architecture-transform.cjs

      - name: Remove temporary installers and commit durable files
        shell: bash
        run: |
          git rm -f tools/laws-first-rail-architecture-transform.cjs
          git rm -f .github/workflows/laws-first-rail-architecture-pr-once.yml
          git rm -f .github/workflows/laws-first-rail-architecture-once.yml
          git rm -f .github/workflows/laws-first-rail-transform-fix-once.yml
          git rm -f .github/.laws-first-rail-trigger
          git add laws/index.html laws/index.experience.js laws/index.experience.polish.css \
            scripts/verify-laws-first-rail-architecture.mjs \
            .github/workflows/laws-first-rail-architecture-verification.yml \
            laws/control-plane/renewal/laws-first-persistent-rail-and-tablet-reflow-v2.json
          git config user.name "laws-rail-architecture-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Restore persistent FIRST rail and tablet hero reflow"
          git push origin HEAD:agent/laws-first-indicator-cache-bust-001
