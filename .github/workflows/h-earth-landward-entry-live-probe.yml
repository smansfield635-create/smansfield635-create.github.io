name: H-Earth Landward Entry Live Probe

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - ".github/workflows/h-earth-landward-entry-live-probe.yml"

permissions:
  contents: read

concurrency:
  group: h-earth-landward-entry-live-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-public-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact merged-source probe
        uses: actions/checkout@v4
        with:
          ref: agent/h-earth-landward-entry-live-probe-001
          fetch-depth: 0

      - name: Verify repository source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^:showroom/globe/h-earth/capacity.js)" = \
            "d8a6846251d9bb573b0647d0f72a04ccad20d906"
          test "$(git merge-base HEAD origin/main)" = \
            "691346d3f0dbe8e16f46c705a78d26f63c733d1b"
          mkdir -p artifacts/h-earth-landward-entry-live-probe
          git rev-parse HEAD^ \
            > artifacts/h-earth-landward-entry-live-probe/source-main-commit.txt
          git rev-parse HEAD^:showroom/globe/h-earth/capacity.js \
            > artifacts/h-earth-landward-entry-live-probe/source-capacity-blob.txt
          sha256sum showroom/globe/h-earth/capacity.js \
            > artifacts/h-earth-landward-entry-live-probe/source-capacity.sha256

      - name: Wait for exact public capacity bytes
        shell: bash
        run: |
          set -euo pipefail
          source_path="showroom/globe/h-earth/capacity.js"
          base_url="https://diamondgatebridge.com/showroom/globe/h-earth/capacity.js"
          matched=false
          : > artifacts/h-earth-landward-entry-live-probe/deployment-attempts.log

          for attempt in $(seq 1 36); do
            probe_url="${base_url}?commit=691346d3f0dbe8e16f46c705a78d26f63c733d1b&attempt=${attempt}"
            status="$(curl \
              --silent \
              --show-error \
              --location \
              --output /tmp/public-capacity.js \
              --dump-header /tmp/public-capacity.headers \
              --write-out '%{http_code}' \
              --header 'Cache-Control: no-cache, no-store, max-age=0' \
              --header 'Pragma: no-cache' \
              --header 'User-Agent: H-Earth-Landward-Entry-Live-Probe/1.0' \
              "$probe_url" || true)"

            printf '%s attempt=%s status=%s bytes=%s\n' \
              "$(date -u +%FT%TZ)" \
              "$attempt" \
              "$status" \
              "$(wc -c < /tmp/public-capacity.js 2>/dev/null || printf 0)" \
              | tee -a artifacts/h-earth-landward-entry-live-probe/deployment-attempts.log

            if [ "$status" = "200" ] && cmp -s "$source_path" /tmp/public-capacity.js; then
              matched=true
              cp /tmp/public-capacity.js \
                artifacts/h-earth-landward-entry-live-probe/public-capacity.js
              cp /tmp/public-capacity.headers \
                artifacts/h-earth-landward-entry-live-probe/public-capacity.headers.txt
              printf '%s\n' "$probe_url" \
                > artifacts/h-earth-landward-entry-live-probe/public-capacity-url.txt
              break
            fi

            sleep 20
          done

          if [ "$matched" != "true" ]; then
            echo "PUBLIC_CAPACITY_EXACT_BYTES_NOT_OBSERVED" >&2
            exit 1
          fi

          test "$(git hash-object /tmp/public-capacity.js)" = \
            "d8a6846251d9bb573b0647d0f72a04ccad20d906"
          sha256sum /tmp/public-capacity.js \
            > artifacts/h-earth-landward-entry-live-probe/public-capacity.sha256
          cmp "$source_path" /tmp/public-capacity.js

      - name: Set up browser runtime
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pinned Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Execute public route and verify landward camera contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { chromium } = require('playwright');

          const commit =
            '691346d3f0dbe8e16f46c705a78d26f63c733d1b';
          const capacityUrl =
            `https://diamondgatebridge.com/showroom/globe/h-earth/capacity.js?live-probe=${commit}`;
          const routeUrl =
            `https://diamondgatebridge.com/showroom/globe/h-earth/?live-probe=${commit}`;
          const profiles = [
            {
              id: 'mobile',
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 2,
              isMobile: true,
              hasTouch: true
            },
            {
              id: 'desktop',
              viewport: { width: 1440, height: 900 },
              deviceScaleFactor: 1,
              isMobile: false,
              hasTouch: false
            }
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const evidence = [];
            try {
              for (const profile of profiles) {
                const context = await browser.newContext({
                  viewport: profile.viewport,
                  deviceScaleFactor: profile.deviceScaleFactor,
                  isMobile: profile.isMobile,
                  hasTouch: profile.hasTouch,
                  extraHTTPHeaders: {
                    'Cache-Control': 'no-cache, no-store, max-age=0',
                    Pragma: 'no-cache'
                  }
                });
                const page = await context.newPage();

                await page.goto(
                  'https://diamondgatebridge.com/showroom/globe/h-earth/',
                  { waitUntil: 'domcontentloaded', timeout: 120000 }
                );

                const cameraContract = await page.evaluate(
                  async (moduleUrl) => {
                    const capacity = await import(moduleUrl);
                    return {
                      contractId:
                        capacity.H_EARTH_3D_CAPACITY_CONTRACT_ID,
                      schemaVersion:
                        capacity.H_EARTH_3D_CAPACITY_SCHEMA_VERSION,
                      pose:
                        capacity.H_EARTH_3D_CAMERA_CAPACITY
                          .initialProjectionCandidate,
                      envelopeId:
                        capacity.H_EARTH_3D_CAMERA_ENVELOPE_CORRECTION_ID,
                      intent:
                        capacity.H_EARTH_3D_CAMERA_COMPOSITION_INTENT
                    };
                  },
                  capacityUrl
                );

                const pose = cameraContract.pose;
                const forwardZ =
                  pose.target.z - pose.position.z;
                if (
                  cameraContract.contractId !==
                    'H_EARTH_3D_CAPACITY_FILE_RENEWAL_STEP_034O_3_FRAME_BASED_EXECUTION_CAPACITY_v4' ||
                  cameraContract.schemaVersion !== 4 ||
                  pose.position.x !== 28 ||
                  pose.position.y !== 10.5 ||
                  pose.position.z !== -82 ||
                  pose.target.x !== -34 ||
                  pose.target.y !== 5.5 ||
                  pose.target.z !== -214 ||
                  pose.verticalFovDegrees !== 56 ||
                  forwardZ >= 0 ||
                  cameraContract.intent
                    ?.shorelineBehindOrPeripheralRequired !== true ||
                  cameraContract.intent
                    ?.manorContextForwardReserved !== true
                ) {
                  throw new Error(
                    `PUBLIC_CAMERA_CONTRACT_MISMATCH:${JSON.stringify(cameraContract)}`
                  );
                }

                await page.goto(routeUrl, {
                  waitUntil: 'networkidle',
                  timeout: 120000
                });
                await page.waitForSelector(
                  '#h-earth-3d-renderer-mount .h-earth-3d-render-stage',
                  { state: 'attached', timeout: 120000 }
                );
                await page.waitForFunction(
                  () =>
                    document.querySelector('#h-earth-3d-status')
                      ?.textContent
                      ?.includes('PUBLIC_STAGE_RENDERER_MOUNTED'),
                  null,
                  { timeout: 120000 }
                );
                await page.waitForTimeout(1500);

                const routeState = await page.evaluate(() => {
                  const stage = document.querySelector(
                    '#h-earth-3d-renderer-mount .h-earth-3d-render-stage'
                  );
                  const mount = document.querySelector(
                    '#h-earth-3d-renderer-mount'
                  );
                  const rect = (element) => {
                    if (!element) return null;
                    const r = element.getBoundingClientRect();
                    return {
                      x: r.x,
                      y: r.y,
                      width: r.width,
                      height: r.height,
                      right: r.right,
                      bottom: r.bottom
                    };
                  };
                  const waterNodes = [...document.querySelectorAll(
                    '[data-material-reference="H_EARTH_MATERIAL_OPEN_WATER"], ' +
                    '[data-material-reference="H_EARTH_MATERIAL_NEARSHORE_WATER"]'
                  )];
                  const sandNodes = [...document.querySelectorAll(
                    '[data-material-reference="H_EARTH_MATERIAL_WET_SAND"]'
                  )];
                  return {
                    status:
                      document.querySelector('#h-earth-3d-status')
                        ?.textContent?.trim() ?? null,
                    stagePresent: Boolean(stage),
                    mountRect: rect(mount),
                    primitiveNodeCount:
                      document.querySelectorAll(
                        '.h-earth-3d-render-primitive'
                      ).length,
                    wetSandNodeCount: sandNodes.length,
                    waterNodeCount: waterNodes.length,
                    selectedObject:
                      document.querySelector('[data-selected-object-id]')
                        ?.getAttribute('data-selected-object-id') ?? null
                  };
                });

                if (
                  routeState.stagePresent !== true ||
                  !routeState.status?.includes(
                    'PUBLIC_STAGE_RENDERER_MOUNTED'
                  ) ||
                  routeState.primitiveNodeCount <= 0 ||
                  routeState.wetSandNodeCount <= 0
                ) {
                  throw new Error(
                    `PUBLIC_ROUTE_NOT_MOUNTED:${profile.id}:${JSON.stringify(routeState)}`
                  );
                }

                const fullPath =
                  `artifacts/h-earth-landward-entry-live-probe/${profile.id}-public-full.png`;
                const stagePath =
                  `artifacts/h-earth-landward-entry-live-probe/${profile.id}-public-stage.png`;
                await page.screenshot({ path: fullPath, fullPage: true });
                await page.locator('#h-earth-3d-renderer-mount')
                  .screenshot({ path: stagePath });

                evidence.push({
                  profile,
                  cameraContract,
                  forwardZ,
                  routeState,
                  fullPath,
                  stagePath
                });
                await context.close();
              }
            } finally {
              await browser.close();
            }

            fs.writeFileSync(
              'artifacts/h-earth-landward-entry-live-probe/live-probe.receipt.json',
              JSON.stringify(
                {
                  receiptId:
                    'H_EARTH_LANDWARD_ENTRY_PUBLIC_DEPLOYMENT_PROBE_v1',
                  result: 'PASS',
                  sourceCommit: commit,
                  sourceCapacityGitBlob:
                    'd8a6846251d9bb573b0647d0f72a04ccad20d906',
                  publicCapacityExactBytesVerified: true,
                  publicCameraContractVerified: true,
                  publicRouteExecuted: true,
                  profileCount: evidence.length,
                  manorGeometryClaim: false,
                  visualAcceptanceClaim: false,
                  evidence
                },
                null,
                2
              ) + '\n'
            );
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload live deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-landward-entry-live-probe-${{ github.sha }}
          path: artifacts/h-earth-landward-entry-live-probe/**
          if-no-files-found: error
          retention-days: 30
