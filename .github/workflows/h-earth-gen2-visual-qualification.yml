name: H-Earth Gen2 Visual Qualification
on:
  workflow_dispatch:
    inputs:
      target_sha:
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  visual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
      - name: Require exact candidate
        run: test "$(git rev-parse HEAD)" = "${{ inputs.target_sha }}"
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Materialize verifier from explicit control-plane commit
        shell: bash
        env:
          CONTROL_PLANE_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$CONTROL_PLANE_SHA"
          git show "$CONTROL_PLANE_SHA:tools/h-earth-gen2-visual-qualify.mjs" > .gen2-visual-qualify.control-plane.mjs
          test -s .gen2-visual-qualify.control-plane.mjs
      - name: Capture Gen2
        run: node .gen2-visual-qualify.control-plane.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h-earth-gen2-visual-${{ inputs.target_sha }}
          path: /tmp/gen2-evidence
          if-no-files-found: error
          retention-days: 30

  gen3210-single-owner:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'h-earth/gen3210-capacity-grass-visual-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          sparse-checkout: |
            tools
            .github/workflows
      - name: Require exact admitted inspection head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install established first-party Chromium tooling
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Matched real WebGL Gen3210 capacity-corrected single-owner capture
        run: |
          node --check tools/h-earth-gen2-visual-qualify.mjs
          node tools/h-earth-gen2-visual-qualify.mjs --gen3210-single-owner
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h-earth-gen3210-actual-single-owner-webgl
          path: /tmp/gen2-evidence/gen3210
          if-no-files-found: error
          retention-days: 30

  gen3211-ground-admission:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'h-earth/gen3211-ground-admission-census-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          sparse-checkout: |
            tools
            .github/workflows
      - name: Require exact admitted inspection head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install established first-party Chromium tooling
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Matched real WebGL Gen3211 existing-renderer ground-admission rejection census
        run: |
          node --check tools/h-earth-gen2-visual-qualify.mjs
          node tools/h-earth-gen2-visual-qualify.mjs --gen3211-admission-census
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h-earth-gen3211-ground-admission-census
          path: /tmp/gen2-evidence/gen3211
          if-no-files-found: error
          retention-days: 30
  
  gen3217-positive-x-grass-visual:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'h-earth/gen3217-positive-x-grass-visual-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          sparse-checkout: |
            tools
            .github/workflows
      - name: Require admitted exact Gen3217 inspection head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install established first-party Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Actual matched protected versus corrected positive-X grass WebGL
        run: |
          node --check tools/h-earth-gen2-visual-qualify.mjs
          node tools/h-earth-gen2-visual-qualify.mjs --gen3217-positive-x-comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h-earth-gen3217-positive-x-actual-webgl
          path: /tmp/gen2-evidence/gen3217
          if-no-files-found: error
          retention-days: 30
