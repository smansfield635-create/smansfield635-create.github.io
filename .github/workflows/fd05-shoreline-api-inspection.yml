name: FD05 shoreline API inspection

on:
  pull_request:
    branches:
      - agent/fd05-shoreline-api-inspection-001
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  inspect-apis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fd05-shoreline-api-inspection-001
          fetch-depth: 0
      - name: Extract exact source APIs
        run: node .fd05/inspect-shoreline-apis.mjs
      - name: Commit isolated inspection
        run: |
          git config user.name "OpenAI Engineering Agent"
          git config user.email "engineering-agent@users.noreply.github.com"
          git add .fd05/shoreline-api-inspection-output/api-inspection.json
          git commit -m "Record shoreline API inspection"
          git push origin HEAD:agent/fd05-shoreline-api-inspection-001
