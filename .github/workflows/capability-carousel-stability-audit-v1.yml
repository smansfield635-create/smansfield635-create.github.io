name: Capability Carousel Stability Audit v1
on:
  pull_request:
    paths:
      - '.github/workflows/capability-carousel-stability-audit-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/capability-carousel-stability-audit-v1.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Audit live capability orbit stability
        run: |
          cat > .capability-audit.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const sizes=[{name:'phone',w:390,h:844},{name:'tablet',w:960,h:1536},{name:'desktop',w:1440,h:1000}];
          const reports=[];
          for(const s of sizes){
            const page=await browser.newPage({viewport:{width:s.w,height:s.h}});
            await page.addInitScript(()=>{globalThis.__capEvents=[];document.addEventListener('compass:capability-change',e=>globalThis.__capEvents.push({...e.detail,t:performance.now()}));});
            await page.goto('https://diamondgatebridge.com/?capability-audit='+Date.now(),{waitUntil:'networkidle',timeout:120000});
            await page.waitForSelector('.compass-capability-orbit');await page.waitForTimeout(700);
            const snap=()=>page.evaluate(()=>{
              const orbit=document.querySelector('.compass-capability-orbit');const stage=orbit.querySelector('.compass-object-stage');const dock=orbit.querySelector('.compass-action-dock');
              const rect=o=>{const r=o.getBoundingClientRect();return {x:+r.x.toFixed(2),y:+r.y.toFixed(2),w:+r.width.toFixed(2),h:+r.height.toFixed(2),right:+r.right.toFixed(2),bottom:+r.bottom.toFixed(2)}};
              const css=o=>{const c=getComputedStyle(o);return {display:c.display,visibility:c.visibility,opacity:+c.opacity,transform:c.transform,transition:c.transitionDuration,pointer:c.pointerEvents,filter:c.filter}};
              const cards=[...orbit.querySelectorAll('.compass-orbit-plaque')].map(el=>({id:el.dataset.capability,active:el.dataset.active,arriving:el.dataset.arriving,rect:rect(el),style:css(el),portal:rect(el.querySelector('.compass-object-portal')),canvas:rect(el.querySelector('canvas')),caption:rect(el.querySelector('.compass-object-caption'))}));
              const active=cards.find(x=>x.active==='true');
              return {stage:rect(stage),orbit:rect(orbit),dock:rect(dock),dockText:(dock.innerText||'').trim(),active,cards,events:[...(globalThis.__capEvents||[])],overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};
            });
            const initial=await snap();
            const idle=[];for(const wait of [160,350,700]){await page.waitForTimeout(wait);idle.push(await snap())}
            const keyboard=[];await page.locator('.compass-capability-orbit').focus();for(let i=0;i<3;i++){await page.keyboard.press('ArrowRight');const sequence=[];for(const wait of [0,80,180,340]){if(wait)await page.waitForTimeout(wait);sequence.push({wait,state:await snap()})}keyboard.push(sequence)}
            await page.evaluate(()=>{globalThis.__capEvents=[]});
            const box=await page.locator('.compass-object-stage').boundingBox();let drag=null;if(box){await page.mouse.move(box.x+box.width*.72,box.y+box.height*.42);await page.mouse.down();await page.mouse.move(box.x+box.width*.20,box.y+box.height*.42,{steps:12});await page.mouse.up();const sequence=[];for(const wait of [0,80,180,340]){if(wait)await page.waitForTimeout(wait);sequence.push({wait,state:await snap()})}drag=sequence}
            reports.push({size:s.name,initial,idle,keyboard,drag});await page.close();
          }
          const weaknesses=[];
          for(const r of reports){
            const stable=[r.initial,...r.idle];const first=stable[0].active;for(const x of stable.slice(1)){if(x.active?.id!==first?.id)weaknesses.push([r.size,'idle-owner-drift',first?.id,x.active?.id]);if(Math.abs((x.active?.rect.x||0)-(first?.rect.x||0))>1.5||Math.abs((x.active?.rect.y||0)-(first?.rect.y||0))>1.5)weaknesses.push([r.size,'idle-geometry-drift']);}
            const settled=r.keyboard.map(seq=>seq.at(-1).state);const ids=settled.map(x=>x.active?.id);if(new Set(ids).size!==3)weaknesses.push([r.size,'keyboard-cycle-incomplete',ids]);
            const heights=settled.map(x=>x.active?.rect.h||0), canvasHeights=settled.map(x=>x.active?.canvas.h||0), dockYs=settled.map(x=>x.dock.y||0);if(Math.max(...heights)-Math.min(...heights)>34)weaknesses.push([r.size,'plaque-height-jump',heights]);if(Math.max(...canvasHeights)-Math.min(...canvasHeights)>34)weaknesses.push([r.size,'object-height-imbalance',canvasHeights]);if(Math.max(...dockYs)-Math.min(...dockYs)>16)weaknesses.push([r.size,'action-dock-jump',dockYs]);
            if(r.drag){const before=settled.at(-1)?.active?.id;const after=r.drag.at(-1).state.active?.id;const ev=r.drag.at(-1).state.events;if(after===before||!ev.some(e=>e.phase==='dragging')||!ev.some(e=>e.phase==='settled'))weaknesses.push([r.size,'drag-transition-not-proven',{before,after,events:ev}]);}
            if(r.initial.overflow>2)weaknesses.push([r.size,'horizontal-overflow',r.initial.overflow]);
          }
          console.log('CAPABILITY_TRANSITION_AUDIT '+JSON.stringify(reports));console.log('WEAKNESSES '+JSON.stringify(weaknesses));await browser.close();
          NODE
          node ./.capability-audit.mjs
