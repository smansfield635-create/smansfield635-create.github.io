name: H-Earth Gate B Route Adapter Probe

on:
  pull_request:
    branches:
      - agent/h-earth-gate-b-seven-file-verification-001
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'agent/h-earth-gate-b-seven-file-trigger-001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute bounded Gate B Packet 002 adapter
        shell: bash
        run: |
          set -euo pipefail
          node --check showroom/globe/h-earth/render/ground-view-gate-b-packet-002-adapter.js
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const adapter = await import('./showroom/globe/h-earth/render/ground-view-gate-b-packet-002-adapter.js');
          const result = adapter.buildHEarthGroundViewGateBPacket002Transfer({
            occurrenceToken: 'PROBE_001',
            requestId: 'H_EARTH_GATE_B_ROUTE_REQUEST:PROBE_001',
            frameId: 'H_EARTH_GATE_B_ROUTE_FRAME:PROBE_001'
          });
          const receipt = {
            adapterContractId: adapter.H_EARTH_GROUND_VIEW_GATE_B_PACKET_002_ADAPTER_CONTRACT_ID,
            adapterValid: result.valid,
            constructionValid: result.construction.valid,
            primitiveCount: result.construction.primitives.length,
            westValid: result.westBatchAdmissionResult.valid,
            westAdmissionCount: result.westBatchAdmissionResult.primitiveAdmissions.length,
            packet002Ok: result.packet002Transfer.ok,
            packet002Status: result.packet002Transfer.status,
            packet002IssueCount: result.packet002Transfer.issues?.length ?? null,
            packet002Issues: result.packet002Transfer.issues ?? [],
            sourceObjectIds: result.provenance.sourceObjectIds,
            sourceZoneIds: result.provenance.sourceZoneIds,
            latticeRegionIds: result.provenance.latticeRegionIds,
            routeIntegrated: result.routeIntegrated,
            validationClaim: result.validationClaim,
            productionClaim: result.productionClaim
          };
          fs.writeFileSync('H_EARTH_GATE_B_ROUTE_ADAPTER_PROBE_v2.json', JSON.stringify(receipt,null,2));
          console.log(JSON.stringify(receipt,null,2));
          if (receipt.adapterValid !== true || receipt.packet002Ok !== true || receipt.packet002IssueCount !== 0) process.exit(1);
          EOF
      - name: Upload probe receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-gate-b-route-adapter-probe-v2
          path: H_EARTH_GATE_B_ROUTE_ADAPTER_PROBE_v2.json
          if-no-files-found: error
