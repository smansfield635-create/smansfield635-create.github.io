name: FAP1 GC W5 Body Visual Qualification v1
on:
  pull_request:
    paths: ['.github/workflows/fap1-gc-w5-body-visual-qualification-v1.yml']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2651bcba5c1071153914e6abb722d19aa778a051
      - id: chrome
        uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --no-package-lock puppeteer-core@24.15.0
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          for a in $(seq 1 120); do curl -fsS http://127.0.0.1:4173/showroom/globe/audralia/ >/dev/null && exit 0; sleep .25; done; exit 1
      - name: Probe six runtime-synchronized W5 witnesses
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node <<'NODE'
          const puppeteer=require('puppeteer-core'),fs=require('fs');
          const delay=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:'new',args:['--no-sandbox','--ignore-gpu-blocklist','--enable-webgl','--use-gl=angle','--use-angle=swiftshader']});
            const page=await browser.newPage();await page.setViewport({width:900,height:900});const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/showroom/globe/audralia/',{waitUntil:'domcontentloaded',timeout:90000});await delay(12000);
            if(!(await page.evaluate(()=>!!window.__AUDRALIA_WEATHER_PRESENTATION_RECONCILIATION__?.renderer)))await page.evaluate(()=>import('./weather-presentation-reconciliation/app.mjs?qual=bounded-witness-v1'));
            await page.waitForFunction(()=>window.__AUDRALIA_WEATHER_PRESENTATION_RECONCILIATION__?.renderer,{timeout:180000});
            if(!(await page.evaluate(()=>window.__AUDRALIA_FAP1_GA_AUTHORITY__?.meteorologicalAuthority==='FAP1_ONLY')))await page.evaluate(()=>import('./weather-presentation-reconciliation/fap1-ga-authority-bootstrap.mjs?qual=bounded-witness-v1'));
            await page.waitForFunction(()=>window.__AUDRALIA_FAP1_GA_AUTHORITY__?.meteorologicalAuthority==='FAP1_ONLY',{timeout:60000});
            if(!(await page.evaluate(()=>window.__AUDRALIA_FAP1_W5_HANDOFF__?.authority==='BOUNDED_GB_HANDOFF_ACTIVE')))await page.evaluate(()=>import('./weather-presentation-reconciliation/fap1-w5-handoff-bootstrap.gb.mjs?qual=bounded-witness-v1'));
            await page.waitForFunction(()=>window.__AUDRALIA_FAP1_W5_HANDOFF__?.authority==='BOUNDED_GB_HANDOFF_ACTIVE',{timeout:60000});

            const result=await page.evaluate(async()=>{
              const S=await import('./weather-presentation-reconciliation/fap1-spatial-lod.gb.mjs?qual=bounded-witness-v1');
              const W=await import('./weather-presentation-reconciliation/fap1-w5-local-density.gb.mjs?qual=bounded-witness-v1');
              const p=window.__AUDRALIA_WEATHER_PRESENTATION_RECONCILIATION__,ga=window.__AUDRALIA_FAP1_GA_AUTHORITY__,handoff=window.__AUDRALIA_FAP1_W5_HANDOFF__;
              ga.renderNow();const packet=ga.descriptorPacket(),objects=S.buildFAP1SpatialWeatherObjects({packet}),o=objects.find(x=>x.ID_i==='SOUTHEAST_DEEP_CONVECTION');
              if(!o)throw new Error('DEEP_CONVECTION_RUNTIME_OBJECT_MISSING');
              const brick=W.buildW5DensityBrick(o),pc=S.PLANET_CENTER,c=o.V_i.center,r=[c[0]-pc[0],c[1]-pc[1],c[2]-pc[2]],len=Math.hypot(...r),dir=r.map(v=>v/len),angle=Math.acos(Math.max(-1,Math.min(1,dir[1]))),horiz=Math.hypot(dir[0],dir[2])||1,radius=angle*S.PLANET_RADIUS,baseU=radius*dir[0]/horiz,baseV=radius*dir[2]/horiz;
              const body=brick.mesoBodies.find(b=>b.role==='SUBSIDIARY_TOWER')||brick.mesoBodies[1]||brick.mesoBodies[0],du=body.center[0]*o.V_i.radii[0],dv=body.center[2]*o.V_i.radii[2];
              const probes=[
                {name:'dense-known',targetU:baseU-38.894966527656,targetV:baseV-38.604667543667,distance:100.5062902283,pitch:.46,yaw:2.4},
                {name:'dense-body',targetU:baseU+du,targetV:baseV+dv,distance:108,pitch:.46,yaw:2.4},
                {name:'gap-known',targetU:baseU,targetV:baseV,distance:160.6530107483,pitch:.46,yaw:-2.4},
                {name:'wall-near',targetU:baseU,targetV:baseV,distance:185,pitch:.46,yaw:-2.4},
                {name:'wall-far',targetU:baseU,targetV:baseV,distance:220,pitch:.46,yaw:-2.4},
                {name:'mixed-known',targetU:baseU-38.894966527656,targetV:baseV-38.604667543667,distance:178.6778492948,pitch:.46,yaw:2.4}
              ];
              const rows=[];
              for(const s of probes){
                p.setCameraStateForTest(s);ga.renderNow();const rec=handoff.renderNow(),cam=p.getCameraFrame(),q=S.localCoordinates(cam.eye,o),inside=q[0]*q[0]+q[1]*q[1]+q[2]*q[2]<=1,dEye=W.sampleW5LocalDensity(o,cam.eye);
                let max=0,occupied=0,empty=0,transitions=0,prev=null,firstOccupied=-1;
                for(let i=0;i<20;i++){const t=i*22,pt=[cam.eye[0]+cam.forward[0]*t,cam.eye[1]+cam.forward[1]*t,cam.eye[2]+cam.forward[2]*t],den=W.sampleW5LocalDensity(o,pt),occ=den>.0025;max=Math.max(max,den);if(occ){occupied++;if(firstOccupied<0)firstOccupied=i;}else empty++;if(prev!==null&&prev!==occ)transitions++;prev=occ;}
                rows.push({...s,inside,dEye,max,occupied,empty,transitions,firstOccupied,q,runtimeActive:!!rec?.active,runtimeWeatherId:rec?.weatherId||null,contributionSum:rec?.contributionSum??null});
              }
              const active=rows.filter(x=>x.runtimeActive&&x.runtimeWeatherId===o.ID_i),dense=active.find(x=>x.dEye>.05)||null,gap=active.find(x=>x.inside&&x.dEye<=.0025&&x.max>.025&&x.firstOccupied>=2&&x.transitions>=2)||null,wall=active.find(x=>x.dEye<=.0025&&x.max>.05&&x.firstOccupied>=1)||null;
              return{baseU,baseV,weatherId:o.ID_i,packetTimeHours:packet.timeHours,bodyCount:brick.mesoBodyCount,rows,dense,gap,wall};
            });

            fs.mkdirSync('w5-visual-evidence',{recursive:true});fs.writeFileSync('w5-visual-evidence/witnesses.json',JSON.stringify(result,null,2));console.log('WITNESSES',JSON.stringify(result,null,2));
            const stages=[['orbit',{targetU:result.baseU,targetV:result.baseV,distance:5200,pitch:.8,yaw:0}],['wall',result.wall],['dense',result.dense],['gap',result.gap]].filter(x=>x[1]),metrics=[];
            for(const[name,s]of stages){const out=await page.evaluate(s=>{const p=window.__AUDRALIA_WEATHER_PRESENTATION_RECONCILIATION__,ga=window.__AUDRALIA_FAP1_GA_AUTHORITY__,handoff=window.__AUDRALIA_FAP1_W5_HANDOFF__;p.setCameraStateForTest(s);ga.renderNow();const rec=handoff.renderNow(),canvas=[...document.querySelectorAll('canvas')].find(c=>c.dataset.fap1W5LocalRaymarch==='true');let fb={nonzero:0,low:0,mid:0,high:0,total:0,meanAlpha:0};if(canvas&&canvas.style.display!=='none'){const gl=canvas.getContext('webgl2',{preserveDrawingBuffer:true});if(gl){const w=canvas.width,h=canvas.height,pix=new Uint8Array(w*h*4);gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,pix);let sum=0;fb.total=w*h;for(let i=3;i<pix.length;i+=4){const a=pix[i];sum+=a;if(a>0)fb.nonzero++;if(a<=8)fb.low++;else if(a<=64)fb.mid++;else fb.high++;}fb.meanAlpha=sum/Math.max(1,fb.total);}}return{receipt:rec,fb};},s);await page.screenshot({path:`w5-visual-evidence/${name}.png`});metrics.push({name,state:s,...out});}
            const orbit=metrics.find(x=>x.name==='orbit'),active=metrics.filter(x=>x.name!=='orbit'),checks={witnessesExist:!!result.wall&&!!result.dense&&!!result.gap,macroOrbit:orbit?.receipt?.active===false&&orbit?.receipt?.macroContribution===1,persistentIdentity:active.every(x=>x.receipt?.weatherId==='SOUTHEAST_DEEP_CONVECTION'),handoffConserved:active.every(x=>Math.abs((x.receipt?.contributionSum??0)-1)<1e-6),localPixels:active.every(x=>x.fb.nonzero>0),visualContrast:active.some(x=>x.fb.high>0)&&active.some(x=>x.fb.low>0),noRuntimeErrors:errors.length===0};const pass=Object.values(checks).every(Boolean);
            fs.writeFileSync('w5-visual-evidence/metrics.json',JSON.stringify({metrics,checks,errors,pass},null,2));console.log('CHECKS',JSON.stringify({checks,pass,errors},null,2));await browser.close();if(!pass)process.exit(2);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w5-body-visual-evidence
          path: w5-visual-evidence/*
          if-no-files-found: warn
