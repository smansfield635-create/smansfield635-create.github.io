name: Characters Cloud Traversal Materiality v1
on:
  pull_request:
    paths:
      - 'characters/app.mjs'
      - 'characters/cloud-traversal.mjs'
      - 'characters/cloud-system.mjs'
      - 'control-plane/whole-estate/characters-reconstruction-v1/cloud-traversal-materiality-contract.v1.json'
      - 'control-plane/whole-estate/characters-reconstruction-v1/verify-cloud-traversal-materiality.v1.mjs'
      - '.github/workflows/characters-cloud-traversal-materiality-v1.yml'
permissions:
  contents: read
jobs:
  verify-cloud-traversal-materiality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Materialize exact Sequence 3 comparison with sparse index
        shell: bash
        env:
          CLOUD_BASE: ${{ github.event.pull_request.base.sha }}
          CLOUD_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --filter=blob:none origin "$CLOUD_BASE"
          git update-ref refs/remotes/origin/cloud-base FETCH_HEAD
          git -c protocol.version=2 fetch --no-tags --filter=blob:none origin "$CLOUD_HEAD"
          git update-ref refs/remotes/origin/cloud-head FETCH_HEAD
          git sparse-checkout init --cone --sparse-index
          git sparse-checkout set characters h-earth-3d showroom/globe/h-earth control-plane/whole-estate/characters-reconstruction-v1 .github/workflows
          git checkout --detach refs/remotes/origin/cloud-head
          test "$(git config --bool index.sparse)" = "true"
          test "$(git rev-parse refs/remotes/origin/cloud-base^{commit})" = "$CLOUD_BASE"
          test "$(git rev-parse HEAD^{commit})" = "$CLOUD_HEAD"
          git merge-base "$CLOUD_BASE" "$CLOUD_HEAD" >/dev/null
          materialized_files="$(find . -type f -not -path './.git/*' | wc -l | tr -d '[:space:]')"
          test "$materialized_files" -lt 10000
          echo "CLOUD_GATE_MATERIALIZED_FILES=$materialized_files"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify admitted path scope and protected identities
        shell: bash
        env:
          CLOUD_BASE: ${{ github.event.pull_request.base.sha }}
          CLOUD_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$CLOUD_BASE...$CLOUD_HEAD" > /tmp/cloud-changed.txt
          while IFS= read -r p; do
            case "$p" in
              characters/app.mjs|characters/cloud-traversal.mjs|characters/cloud-system.mjs|control-plane/whole-estate/characters-reconstruction-v1/cloud-traversal-materiality-contract.v1.json|control-plane/whole-estate/characters-reconstruction-v1/verify-cloud-traversal-materiality.v1.mjs|.github/workflows/characters-cloud-traversal-materiality-v1.yml) ;;
              *) echo "PATH_SCOPE_VIOLATION:$p" >&2; exit 1 ;;
            esac
          done < /tmp/cloud-changed.txt
          for protected in characters/gratitude-geography.adapter.mjs characters/step9-regional-geography.mjs characters/coast-map.mjs characters/forest-system.mjs; do
            if grep -Fxq "$protected" /tmp/cloud-changed.txt; then echo "PROTECTED_IDENTITY_MUTATED:$protected" >&2; exit 1; fi
          done
      - name: Verify cloud traversal materiality contract
        run: node control-plane/whole-estate/characters-reconstruction-v1/verify-cloud-traversal-materiality.v1.mjs
      - name: Install browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start exact candidate server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/cloud-material-server.log 2>&1 &
          echo $! >/tmp/cloud-material-server.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/characters/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/cloud-material-server.log
          exit 1
      - name: Prove desktop mobile and reduced-motion cloud traversal
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          mkdir -p cloud-traversal-materiality-evidence
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const receipt={schema:'MIRRORLAND_CLOUD_TRAVERSAL_BROWSER_RECEIPT_v1',result:'PASS',cases:[]};
          const requiredNormal=['ASCENT','CLOUD_ENTRY','CLOUD_TRANSIT','DESCENT','ARRIVAL'];
          const requiredReduced=['CLOUD_TRANSIT','ARRIVAL'];
          const ordered=(observed,required)=>{
            let cursor=-1;
            for(const state of required){cursor=observed.indexOf(state,cursor+1);if(cursor<0)return false;}
            return true;
          };
          const runCase=async({id,viewport,reducedMotion='no-preference'})=>{
            const page=await browser.newPage({viewport,reducedMotion});
            const pageErrors=[],consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            const caseReceipt={id,ok:false,webgl2:false,fatal:false,bodyWidth:null,viewportWidth:viewport.width,orbit:null,states:{},observed:[],pageErrors,consoleErrors,error:null};
            try{
              await page.goto('http://127.0.0.1:4173/characters/',{waitUntil:'domcontentloaded'});
              const skip=page.getByRole('button',{name:/skip to the coast/i});
              if(await skip.count())await skip.first().click();
              await page.waitForTimeout(reducedMotion==='reduce'?120:900);
              caseReceipt.webgl2=await page.evaluate(()=>!!document.querySelector('#scene')?.getContext('webgl2'));
              caseReceipt.fatal=await page.locator('#fatal.show').count()>0;
              caseReceipt.orbit=await page.evaluate(()=>globalThis.__MIRRORLAND_CLOUD_SYSTEM__?.snapshot?.());
              if(!caseReceipt.orbit)throw new Error('CLOUD_RUNTIME_EVIDENCE_MISSING');
              await page.screenshot({path:`cloud-traversal-materiality-evidence/${id}-orbit.png`,fullPage:true});
              const signal=page.locator('.signal:not([hidden])').first();
              if(await signal.count()===0)throw new Error('VISIBLE_DESTINATION_SIGNAL_MISSING');
              await page.evaluate(()=>{
                const root=document.documentElement;
                const records=[];
                globalThis.__MIRRORLAND_CLOUD_OBSERVED__=records;
                const record=state=>requestAnimationFrame(()=>records.push({state,snapshot:globalThis.__MIRRORLAND_CLOUD_SYSTEM__?.snapshot?.()||null,time:performance.now()}));
                record(root.dataset.cloudTravel||'ORBIT');
                const observer=new MutationObserver(mutations=>{
                  if(mutations.some(m=>m.attributeName==='data-cloud-travel'))record(root.dataset.cloudTravel||'ORBIT');
                });
                observer.observe(root,{attributes:true,attributeFilter:['data-cloud-travel']});
                globalThis.__MIRRORLAND_CLOUD_OBSERVER__=observer;
              });
              await signal.click();
              await page.waitForFunction(()=>document.documentElement.dataset.cloudTravel==='ARRIVAL',null,{timeout:6000});
              await page.waitForTimeout(120);
              const records=await page.evaluate(()=>globalThis.__MIRRORLAND_CLOUD_OBSERVED__||[]);
              caseReceipt.observed=records.map(r=>r.state);
              for(const record of records){if(record.snapshot)caseReceipt.states[record.state]=record.snapshot;}
              const required=reducedMotion==='reduce'?requiredReduced:requiredNormal;
              if(!ordered(caseReceipt.observed,required))throw new Error(`CLOUD_STATE_SEQUENCE_MISSING:${required.join('>')}:${caseReceipt.observed.join('>')}`);
              const transit=caseReceipt.states.CLOUD_TRANSIT;
              const arrival=caseReceipt.states.ARRIVAL;
              if(!transit||!arrival)throw new Error('CLOUD_RUNTIME_STATE_SNAPSHOT_MISSING');
              await page.screenshot({path:`cloud-traversal-materiality-evidence/${id}-arrival.png`,fullPage:true});
              caseReceipt.bodyWidth=await page.evaluate(()=>document.body.scrollWidth);
              const stateOk=caseReceipt.orbit.state==='ORBIT'&&caseReceipt.orbit.bankCount>0&&caseReceipt.orbit.opacity>0&&transit.state==='CLOUD_TRANSIT'&&transit.veil>=.6&&transit.opticalDepth>=.75&&arrival.state==='ARRIVAL'&&arrival.veil===0&&arrival.opticalDepth<transit.opticalDepth;
              caseReceipt.ok=caseReceipt.webgl2&&!caseReceipt.fatal&&!pageErrors.length&&!consoleErrors.length&&caseReceipt.bodyWidth<=viewport.width+1&&stateOk;
              if(!caseReceipt.ok)receipt.result='FAIL';
            }catch(error){
              caseReceipt.error=String(error?.stack||error);
              receipt.result='FAIL';
              try{await page.screenshot({path:`cloud-traversal-materiality-evidence/${id}-failure.png`,fullPage:true});}catch(_){ }
            }finally{
              receipt.cases.push(caseReceipt);
              await page.close();
            }
          };
          await runCase({id:'desktop',viewport:{width:1440,height:900}});
          await runCase({id:'mobile',viewport:{width:390,height:844}});
          await runCase({id:'reduced-motion',viewport:{width:390,height:844},reducedMotion:'reduce'});
          await browser.close();
          fs.writeFileSync('cloud-traversal-materiality-evidence/browser-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          if(receipt.result!=='PASS')process.exit(1);
          NODE
      - name: Upload cloud traversal receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-traversal-materiality-receipt-${{ github.event.pull_request.head.sha }}
          path: cloud-traversal-materiality-receipt.json
          if-no-files-found: warn
          retention-days: 90
      - name: Upload cloud traversal material evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-traversal-materiality-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            cloud-traversal-materiality-evidence/
            /tmp/cloud-material-server.log
          if-no-files-found: warn
          retention-days: 90
