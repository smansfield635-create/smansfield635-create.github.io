name: H-Earth B2 Isolated Visual Capture
on: workflow_dispatch
permissions: {contents: read}
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require B2 candidate branch
        run: |
          test "${GITHUB_REF_NAME}" = "h-earth/b2-meso-morphology-v1"
          test -f h-earth-3d/terrain/h-earth.terrain-field.js
          grep -Fq "B2_RIDGE_SPUR_DRAINAGE_SADDLE_SYSTEM_v1" h-earth-3d/terrain/h-earth.terrain-field.js
      - name: Install isolated browser
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Serve candidate locally only
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/h-earth-b2-server.log 2>&1 &
          echo $! >/tmp/h-earth-b2-server.pid
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/showroom/globe/h-earth/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Capture fixed-observer B2 evidence
        run: |
          mkdir -p /tmp/h-earth-b2-evidence
          cat > /tmp/h-earth-b2-capture.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:800},deviceScaleFactor:1});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          await page.goto('http://127.0.0.1:4173/showroom/globe/h-earth/',{waitUntil:'networkidle',timeout:120000});
          await page.waitForTimeout(5000);
          const body=(await page.locator('body').innerText()).slice(0,4000);
          if(/Initialization failed|RENDERER_CONSTRUCTION_EXCEPTION/i.test(body)) throw Error('H-Earth initialization failed');
          await page.screenshot({path:'/tmp/h-earth-b2-evidence/B2_FIXED_OBSERVER.png',fullPage:true});
          await fs.writeFile('/tmp/h-earth-b2-evidence/receipt.json',JSON.stringify({
            schema:'H_EARTH_B2_ISOLATED_VISUAL_CAPTURE_v1',
            ref:process.env.GITHUB_REF_NAME,
            sha:process.env.GITHUB_SHA,
            route:'/showroom/globe/h-earth/',
            viewport:[1280,800],
            productionPublicationPerformed:false,
            pagesDeploymentPerformed:false,
            errors,
            bodyText:body
          },null,2)+'\n');
          await browser.close();
          if(errors.length) process.exitCode=1;
          NODE
          node /tmp/h-earth-b2-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h-earth-b2-isolated-visual-${{ github.sha }}
          path: |
            /tmp/h-earth-b2-evidence
            /tmp/h-earth-b2-server.log
          if-no-files-found: error
          retention-days: 30
