name: Publish H-Earth Cloud Density Inspection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/h-earth-cloud-density-inspection-publish.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build bounded Pages payload with exact cloud candidate
        shell: bash
        env:
          PAGES_STAGE: ${{ runner.temp }}/pages-site
          CLOUD_SHA: 50e663986c957b6a11268e13176a0a42de9b2daa
          CLOUD_ROOT: ${{ runner.temp }}/pages-site/inspection/h-earth/cloud-density-50e66398
          LEGACY_INSPECTION_SHA: 1d45379f81ea4089e9c5f3d7d9688e702be9add3
          LEGACY_INSPECTION_ROOT: ${{ runner.temp }}/pages-site/inspection/h-earth/24056
        run: |
          set -euo pipefail
          rm -rf "$PAGES_STAGE"
          mkdir -p "$PAGES_STAGE"
          rsync -a --prune-empty-dirs \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='preview/' \
            --exclude='h-earth-live-6d18e158/' \
            ./ "$PAGES_STAGE/"

          rm -rf "$PAGES_STAGE/showroom/globe/h-earth"
          mkdir -p "$PAGES_STAGE/showroom/globe/h-earth"
          rsync -a --delete \
            h-earth-live-6d18e158/showroom/globe/h-earth/ \
            "$PAGES_STAGE/showroom/globe/h-earth/"

          git fetch --no-tags --depth=1 origin "$CLOUD_SHA" "$LEGACY_INSPECTION_SHA"

          rm -rf "$CLOUD_ROOT"
          mkdir -p "$CLOUD_ROOT"
          git archive "$CLOUD_SHA" \
            showroom/globe/audralia \
            showroom/globe/h-earth \
            h-earth-3d \
            | tar -x -C "$CLOUD_ROOT"

          rm -rf "$LEGACY_INSPECTION_ROOT"
          mkdir -p "$LEGACY_INSPECTION_ROOT"
          git archive "$LEGACY_INSPECTION_SHA" \
            showroom/globe/audralia \
            showroom/globe/h-earth \
            h-earth-3d \
            | tar -x -C "$LEGACY_INSPECTION_ROOT"

          mkdir -p "$PAGES_STAGE/.well-known"
          printf '{"schema":"DGB_PUBLIC_RELEASE_MARKER_v1","commit":"%s","cloudInspection":"%s"}\n' "$GITHUB_SHA" "$CLOUD_SHA" > "$PAGES_STAGE/.well-known/dgb-release.json"

          test -f "$CLOUD_ROOT/showroom/globe/audralia/index.html"
          test -f "$CLOUD_ROOT/showroom/globe/audralia/fap1-orbital-support-tuning-v1.mjs"
          grep -q 'AUDRALIA_FAP1_ORBITAL_SUPPORT_DIRECT_DENSITY_v4' "$CLOUD_ROOT/showroom/globe/audralia/fap1-orbital-support-tuning-v1.mjs"
          grep -q "targetVisibleOrbitalCoverage:.72" "$CLOUD_ROOT/showroom/globe/audralia/fap1-orbital-support-tuning-v1.mjs"
          test -f "$PAGES_STAGE/showroom/globe/h-earth/index.html"
          test -f "$LEGACY_INSPECTION_ROOT/showroom/globe/audralia/weather-presentation-reconciliation/index.html"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify exact cloud candidate is public
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          CLOUD_SHA: 50e663986c957b6a11268e13176a0a42de9b2daa
        run: |
          set -euo pipefail
          root="${PAGE_URL%/}/inspection/h-earth/cloud-density-50e66398/showroom/globe/audralia"
          html_url="$root/"
          tuning_url="$root/fap1-orbital-support-tuning-v1.mjs"
          marker_url="${PAGE_URL%/}/.well-known/dgb-release.json"
          for attempt in $(seq 1 30); do
            marker="$(curl --fail --silent --show-error -L --max-time 20 "$marker_url" 2>/dev/null || true)"
            html="$(curl --fail --silent --show-error -L --max-time 20 "$html_url" 2>/dev/null || true)"
            tuning="$(curl --fail --silent --show-error -L --max-time 20 "$tuning_url" 2>/dev/null || true)"
            if printf '%s' "$marker" | grep -q "$CLOUD_SHA" && \
               printf '%s' "$html" | grep -q 'Audralia · Planetary World' && \
               printf '%s' "$tuning" | grep -q 'AUDRALIA_FAP1_ORBITAL_SUPPORT_DIRECT_DENSITY_v4' && \
               printf '%s' "$tuning" | grep -q 'targetVisibleOrbitalCoverage:.72'; then
              echo "CLOUD_INSPECTION_PUBLIC_VERIFIED url=$html_url sha=$CLOUD_SHA"
              exit 0
            fi
            echo "Attempt $attempt: waiting for exact cloud candidate publication"
            sleep 10
          done
          echo "CLOUD_INSPECTION_PUBLICATION_NOT_VERIFIED url=$html_url sha=$CLOUD_SHA" >&2
          exit 1
