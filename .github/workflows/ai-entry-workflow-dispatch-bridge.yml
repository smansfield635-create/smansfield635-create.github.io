name: AI Entry Workflow Dispatch Bridge

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - .github/ai-entry/workflow-dispatch-request.json

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: ai-entry-workflow-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'ai-dispatch-request-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative bridge runtime from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Execute bounded native workflow dispatch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUEST_COMMIT: ${{ github.event.pull_request.head.sha }}
          REQUEST_BRANCH: ${{ github.event.pull_request.head.ref }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: node tools/ai-entry-workflow-dispatch-bridge.mjs
