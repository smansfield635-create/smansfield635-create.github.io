name: Shared Current-Head Pages Publisher

on:
  workflow_run:
    workflows: ['Cloudflare Analytics Read-Only Bridge']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      surface_id:
        description: Registered surface to verify after publishing current main
        required: true
        default: analytics
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: pages-publication-coordinator
  queue: max
  cancel-in-progress: false

jobs:
  dispatch-current-head:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch sole normal production authority
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SURFACE_ID: ${{ inputs.surface_id || 'analytics' }}
        run: |
          set -euo pipefail
          head="$(gh api "/repos/$REPO/commits/main" --jq .sha)"
          gh api --method POST             "/repos/$REPO/actions/workflows/pages-exact-head-deploy-v3.yml/dispatches"             -f ref=main             -f inputs[target_sha]="$head"             -f inputs[surface_id]="$SURFACE_ID"
          echo "CURRENT_HEAD_PUBLICATION_DISPATCHED=$head:$SURFACE_ID"
