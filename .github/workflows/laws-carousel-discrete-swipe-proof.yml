name: Laws Carousel Continuous Pointer Proof

on:
  pull_request:
    paths:
      - 'laws/index.destination-carousel.js'
      - 'laws/index.destination-carousel.css'
      - 'laws/index.mobile-background-tabs.js'
      - '.github/workflows/laws-carousel-discrete-swipe-proof.yml'

permissions:
  contents: read

jobs:
  continuous-pointer-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve exact candidate
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/laws-pointer-http.log 2>&1 &
      - name: Prove frozen pointer contract Q1-Q7
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          const assert = (ok, msg) => { if (!ok) throw new Error(msg); };
          (async () => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({viewport:{width:960,height:1536}, hasTouch:true, isMobile:true, deviceScaleFactor:1});
            const page = await context.newPage();
            const errors=[];
            page.on('pageerror', e => errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/laws/', {waitUntil:'networkidle'});
            await page.waitForSelector('html[data-laws-destination-carousel-runtime="active"]', {timeout:15000});
            const runtime = await page.evaluate(() => globalThis.DGB_LAWS_DESTINATION_CAROUSEL);
            assert(runtime?.contract === 'LAWS_DESTINATION_CAROUSEL_RUNTIME_v6', `wrong runtime ${runtime?.contract}`);
            for (const [k,v] of Object.entries({continuousPointerGeometry:true,fractionalOrbitPosition:true,selectionDuringDrag:false,settleToNearestDetent:true,verticalGesturePassthrough:true,directionOnlyGesture:false,liveGestureGeometry:true,atomicRotation:false})) assert(runtime[k]===v, `telemetry ${k}=${runtime[k]}`);

            const field = page.locator('[data-laws-root-rolodex-section] .laws-rolodex-field[data-destination-stage-state="active"]').first();
            const viewport = field.locator('.laws-rolodex-viewport');
            await viewport.scrollIntoViewIfNeeded();
            await page.waitForTimeout(100);
            const box = await viewport.boundingBox();
            assert(box && box.width > 400, 'carousel viewport unavailable');
            const S = box.width * .72;
            const startX = box.x + box.width * .86;
            const y = box.y + box.height * .52;
            const cdp = await context.newCDPSession(page);
            let touchId = 1;
            const touch = async (type,x,y) => cdp.send('Input.dispatchTouchEvent',{type,touchPoints:type==='touchEnd'||type==='touchCancel'?[]:[{x,y,id:touchId,radiusX:2,radiusY:2,force:1}],modifiers:0});
            const startTouch = async () => { touchId++; await touch('touchStart',startX,y); await page.waitForTimeout(35); };
            const moveFrac = async f => { await touch('touchMove',startX-S*f,y); await page.waitForTimeout(45); };
            const endTouch = async () => { await touch('touchEnd',startX,y); await page.waitForTimeout(650); };
            const cancelTouch = async () => { await touch('touchCancel',startX,y); await page.waitForTimeout(650); };
            const snap = async () => field.evaluate(el => ({
              index:Number(el.dataset.carouselIndex), orbit:Number(el.dataset.carouselOrbitPosition), state:el.dataset.carouselGestureState,
              label:el.querySelector('.laws-rolodex-position')?.textContent?.trim(),
              cards:Array.from(el.querySelectorAll('.laws-rolodex-card')).map(c=>({active:c.dataset.active,relative:Number(c.dataset.carouselRelative),x:parseFloat(c.style.getPropertyValue('--laws-carousel-x')),z:parseFloat(c.style.getPropertyValue('--laws-carousel-z')),rotate:parseFloat(c.style.getPropertyValue('--laws-carousel-rotate')),scale:parseFloat(c.style.getPropertyValue('--laws-carousel-scale')),opacity:parseFloat(c.style.getPropertyValue('--laws-carousel-opacity')),blur:parseFloat(c.style.getPropertyValue('--laws-carousel-blur'))}))
            }));
            const restore = async index => {
              await page.evaluate(({id,index}) => globalThis.DGB_LAWS_DESTINATION_CAROUSEL.restoreOrbitState({rolodexId:id,index}), {id:await field.getAttribute('data-rolodex-id'),index});
              await page.waitForTimeout(80);
            };
            const frame = async name => page.screenshot({path:name,fullPage:false});
            const vector = (s,i) => [s.cards[i].x,s.cards[i].z,s.cards[i].rotate,s.cards[i].scale,s.cards[i].opacity,s.cards[i].blur];

            // Q1: pointer-down -> 25/50/75% live geometry, semantic index unchanged.
            await restore(0);
            const q10=await snap(); await frame('q1-00.png');
            await startTouch();
            await moveFrac(.25); const q125=await snap(); await frame('q1-25.png');
            await moveFrac(.50); const q150=await snap(); await frame('q1-50.png');
            await moveFrac(.75); const q175=await snap(); await frame('q1-75.png');
            assert([q125,q150,q175].every(s=>s.index===q10.index && s.label===q10.label), 'Q1 semantic selection changed during drag');
            const vecs=[q10,q125,q150,q175].map(s=>JSON.stringify(vector(s,0)));
            assert(new Set(vecs).size===4,'Q1 active geometry did not change at every sample');
            assert(q125.cards[0].x > q150.cards[0].x && q150.cards[0].x > q175.cards[0].x,'Q1 active card not moving monotonically out');
            assert(q125.cards[1].x > q150.cards[1].x && q150.cards[1].x > q175.cards[1].x,'Q1 incoming neighbor not moving monotonically toward center');
            assert(q125.state==='dragging' && q150.state==='dragging' && q175.state==='dragging','Q1 pointer custody not DRAGGING');
            await endTouch(); const q1end=await snap(); assert(q1end.index===1 && Math.abs(q1end.orbit-1)<.001,'Q1 release did not commit nearest neighbor detent');

            // Q2: 30% visibly moves, then returns to origin.
            await restore(0); const q2base=await snap(); await startTouch(); await moveFrac(.30); const q230=await snap(); await frame('q2-30.png');
            assert(Math.abs(q230.cards[0].x-q2base.cards[0].x)>10 && q230.index===0,'Q2 missing visible sub-detent motion');
            await endTouch(); const q2end=await snap(); await frame('q2-settled.png'); assert(q2end.index===0 && Math.abs(q2end.orbit)<.001,'Q2 did not return to original detent');

            // Q3: 70% visibly moves and commits neighbor.
            await restore(0); await startTouch(); await moveFrac(.70); const q370=await snap(); await frame('q3-70.png'); assert(q370.index===0 && q370.orbit>.6 && q370.orbit<.8,'Q3 fractional position incorrect before release');
            await endTouch(); const q3end=await snap(); await frame('q3-settled.png'); assert(q3end.index===1 && Math.abs(q3end.orbit-1)<.001,'Q3 did not commit neighbor');

            // Q4: circular seam 4/4 -> 1/4 stays continuous through virtual position N.
            const count=(await snap()).cards.length; await restore(count-1); await startTouch();
            await moveFrac(.25); const q425=await snap(); await frame('q4-25.png');
            await moveFrac(.50); const q450=await snap(); await frame('q4-50.png');
            await moveFrac(.70); const q470=await snap(); await frame('q4-70.png');
            assert(q425.index===count-1 && q450.index===count-1 && q470.index===count-1,'Q4 semantic index crossed seam before release');
            assert(q425.cards[0].x > q450.cards[0].x && q450.cards[0].x > q470.cards[0].x,'Q4 virtual card 1 is discontinuous at seam');
            await endTouch(); const q4end=await snap(); await frame('q4-settled.png'); assert(q4end.index===0,'Q4 seam did not commit 4/4 -> 1/4');

            // Q5: predominant vertical touch does not rotate and native page travel remains available.
            await restore(0); await viewport.scrollIntoViewIfNeeded(); const q5before=await snap(); const sy=await page.evaluate(()=>scrollY); await frame('q5-before.png');
            touchId++; const vx=box.x+box.width*.5, vy=box.y+box.height*.55;
            await touch('touchStart',vx,vy); await page.waitForTimeout(30); await touch('touchMove',vx+4,vy-220); await page.waitForTimeout(200); await touch('touchEnd',vx+4,vy-220); await page.waitForTimeout(150);
            const q5after=await snap(); const ey=await page.evaluate(()=>scrollY); await frame('q5-after.png');
            assert(q5after.index===q5before.index,'Q5 vertical gesture rotated carousel');
            assert(Math.abs(ey-sy)>20,`Q5 vertical page traversal unavailable: ${sy}->${ey}`);

            // Q6: pointer cancellation returns visible fractional drag to origin with semantic index unchanged.
            await viewport.scrollIntoViewIfNeeded(); await restore(0); const q6base=await snap(); await startTouch(); await moveFrac(.42); const q6drag=await snap(); await frame('q6-drag.png');
            assert(q6drag.index===0 && Math.abs(q6drag.cards[0].x-q6base.cards[0].x)>10,'Q6 cancellation setup lacked visible fractional drag');
            await cancelTouch(); const q6end=await snap(); await frame('q6-cancelled.png'); assert(q6end.index===0 && Math.abs(q6end.orbit)<.001,'Q6 cancellation did not restore original detent');

            assert(!errors.length,'page errors: '+errors.join(' | '));
            const receipt={contract:runtime.contract,Q1:{q10,q125,q150,q175,q1end},Q2:{q230,q2end},Q3:{q370,q3end},Q4:{q425,q450,q470,q4end},Q5:{scrollBefore:sy,scrollAfter:ey,q5after},Q6:{q6drag,q6end},result:'PASS'};
            fs.writeFileSync('laws-continuous-pointer-proof.json',JSON.stringify(receipt,null,2));
            console.log('LAWS_CONTINUOUS_POINTER_Q1_Q7_PASS');
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1);});
          NODE
      - name: Upload intermediate proof frames and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laws-continuous-pointer-proof
          path: |
            q*.png
            laws-continuous-pointer-proof.json
          if-no-files-found: warn
