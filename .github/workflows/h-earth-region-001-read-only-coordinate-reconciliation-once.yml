name: H-Earth Region 001 read-only coordinate reconciliation amendment

on:
  push:
    branches:
      - agent/h-earth-region-001-read-only-coordinate-reconciliation-001

permissions:
  contents: write

jobs:
  amend-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/h-earth-region-001-read-only-coordinate-reconciliation-001
          fetch-depth: 0

      - name: Patch controlling manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest_path = Path('h-earth-3d/control-plane/region-001-reconciliation/h-earth.region-001.mirrorland-narrative-character-temporal-reconciliation.manifest.v1.json')
          spatial_path = Path('h-earth-3d/control-plane/region-001-reconciliation/h-earth.region-001.gratitude-region-spatial-interaction-area-development.v1.json')
          spatial_blob = 'ee5ca94f5ae55ce8f11b460428b800ad4e9a2a9d'

          actual_blob = subprocess.check_output(['git', 'hash-object', str(spatial_path)], text=True).strip()
          if actual_blob != spatial_blob:
              raise SystemExit(f'spatial artifact blob mismatch: {actual_blob}')

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          source_entry = {
              'type': 'REPOSITORY_SPATIAL_DEVELOPMENT_ARTIFACT',
              'path': str(spatial_path),
              'gitBlob': spatial_blob,
              'role': 'READ_ONLY_EXISTING_WORLD_COORDINATE_RECONCILIATION_AND_NONFINAL_CANDIDATE_ENVELOPE_DEVELOPMENT'
          }
          if not any(item.get('gitBlob') == spatial_blob for item in manifest['sourceBasis']):
              manifest['sourceBasis'].append(source_entry)

          manifest['spatialDevelopmentArtifactReference'] = {
              'artifactId': 'H_EARTH_REGION_001_GRATITUDE_REGION_SPATIAL_INTERACTION_AREA_DEVELOPMENT_v1',
              'path': str(spatial_path),
              'mainBlob': spatial_blob,
              'sourcePr': 307,
              'sourceHead': 'f61489ad0a164351a492d30a778608b3839bf6f8',
              'mergeCommit': 'd9acee6949be468fa1df3ac92a8c8406b7454f05',
              'relationship': 'NEIGHBORING_DETAILED_SPATIAL_DEVELOPMENT_ARTIFACT',
              'worldFacingIdentity': 'GRATITUDE_REGION',
              'technicalIdentity': 'REGION_001',
              'manifestRemainsAuthorizationAndDispositionControl': True,
              'spatialArtifactOwnsInventoryMeasurementsCandidatesSightlinesRoutesNoBuildAndCandidateHistory': True,
              'spatialArtifactMayAssignFinalCoordinates': False,
              'spatialArtifactMayAuthorizeGeometry': False
          }

          manifest['coordinateReconciliationAuthorization'] = {
              'status': 'AUTHORIZED_BOUNDED_READ_ONLY',
              'authority': 'CONTROLLING_MANIFEST_AMENDMENT',
              'referenceArtifactPath': str(spatial_path),
              'referenceArtifactBlob': spatial_blob,
              'authorizedPurpose': 'RECONCILE_EXISTING_WORLD_COORDINATES_AND_DERIVE_NONFINAL_CANDIDATE_ENVELOPES_FOR_THE_FOUR_GRATITUDE_REGION_INTERACTION_AREAS',
              'authorizedOperations': [
                  'READ_ONLY_EXISTING_WORLD_SOURCE_INTAKE',
                  'READ_ONLY_TERRAIN_SAMPLING',
                  'EXISTING_ANCHOR_AND_FACING_CAPTURE',
                  'ELEVATION_AND_SLOPE_DERIVATION',
                  'FORMATION_ZONE_LATTICE_AND_OBJECT_CORRESPONDENCE',
                  'CONNECTIVITY_ANALYSIS',
                  'SIGHTLINE_ANALYSIS',
                  'CANDIDATE_AREA_ENVELOPE_DERIVATION',
                  'ROUTE_CANDIDATE_DERIVATION',
                  'NO_BUILD_AND_PRESERVATION_ENVELOPE_DERIVATION',
                  'REJECTED_AND_RETAINED_CANDIDATE_RECORDING'
              ],
              'targetAreas': [
                  'GRATITUDE_REGION_ENTRY_ZONE',
                  'GRATITUDE_REGION_MIRROR_MANOR_PRECINCT',
                  'GRATITUDE_REGION_CAVERN_PRECINCT',
                  'GRATITUDE_REGION_FRONTIER_PLAINS'
              ],
              'resultsClassification': 'MEASURED_OR_DERIVED_CANDIDATES_PENDING_LATER_MANIFEST_ACCEPTANCE',
              'finalCoordinatesAssigned': False,
              'fourAreaEnvelopesAccepted': False,
              'terrainMutationAuthorized': False,
              'finalPlacementAuthorized': False,
              'geometryConstructionAuthorized': False,
              'gameplayChangeAuthorized': False,
              'runtimeChangeAuthorized': False,
              'publicRouteChangeAuthorized': False,
              'productionChangeAuthorized': False,
              'futureRegionConstructionAuthorized': False,
              'authorizationDoesNotResolveExistingNarrativeOrPlacementBlockers': True,
              'stoppingBoundary': 'STOP_AFTER_READ_ONLY_EVIDENCE_CANDIDATE_ENVELOPE_AND_INTEGRATED_REVIEW_PACKAGE_BEFORE_ACCEPTANCE_PLACEMENT_OR_CONSTRUCTION'
          }

          gate = manifest['measurementGate']
          gate.update({
              'readOnlyExistingWorldCoordinateReconciliationAuthorized': True,
              'readOnlyCoordinateReconciliationReferenceBlob': spatial_blob,
              'broadTerrainMeasurementProgramAuthorized': False,
              'terrainMeasurementAuthorized': False,
              'finalCoordinateAssignmentAuthorized': False,
              'terrainMutationAuthorized': False,
              'finalPlacementAuthorized': False,
              'geometryConstructionAuthorized': False,
              'gameplayChangeAuthorized': False,
              'runtimeChangeAuthorized': False,
              'publicRouteChangeAuthorized': False,
              'productionChangeAuthorized': False,
              'existingBlockingReasonsRemainActive': True,
              'existingBlockingReasonsDoNotProhibitBoundedReadOnlyCoordinateReconciliation': True
          })

          decision_id = 'GRATITUDE_REGION_SPATIAL_ARTIFACT_AND_READ_ONLY_COORDINATE_RECONCILIATION'
          if not any(item.get('decisionId') == decision_id for item in manifest['decisionLedger']):
              manifest['decisionLedger'].append({
                  'decisionId': decision_id,
                  'authorityQuestion': 'MAY_THE_REGION_001_SPATIAL_ARTIFACT_BE_USED_TO_RECONCILE_EXISTING_WORLD_COORDINATES_BEFORE_FINAL_PLACEMENT_OR_CONSTRUCTION?',
                  'status': 'AUTHORIZED_BOUNDED_READ_ONLY',
                  'disposition': 'REFERENCE_BLOB_EE5CA94F_AND_AUTHORIZE_EXISTING_WORLD_COORDINATE_RECONCILIATION_ONLY',
                  'basis': [
                      'USER_AUTHORIZATION',
                      'MERGED_PR_307',
                      'MAIN_ARTIFACT_BLOB_EE5CA94F5AE55CE8F11B460428B800AD4E9A2A9D',
                      'EXISTING_THINGS_GOVERN_MAP_REPRESENTATION',
                      'COORDINATE_RECONCILIATION_PRECEDES_NEW_AUTHORED_GEOMETRY'
                  ],
                  'placementEffect': 'MAY_DERIVE_MEASURED_CANDIDATES_ENVELOPES_ROUTES_SIGHTLINES_AND_NO_BUILD_AREAS_BUT_MAY_NOT_ASSIGN_FINAL_COORDINATES_MUTATE_TERRAIN_OR_CONSTRUCT_GEOMETRY',
                  'unresolvedFields': [
                      'FINAL_ENTRY_ZONE_ENVELOPE',
                      'FINAL_MIRROR_MANOR_PRECINCT_ENVELOPE',
                      'FINAL_CAVERN_PRECINCT_ENVELOPE',
                      'FINAL_FRONTIER_PLAINS_ENVELOPE',
                      'FINAL_MANOR_ANCHOR',
                      'FINAL_CAVE_ENTRANCE_ANCHOR',
                      'FINAL_ROUTES',
                      'FINAL_COORDINATES'
                  ],
                  'supersedes': []
              })

          expected_blockers = [
              'SPIRIT_FORM_TRAVERSAL_LAW_UNRESOLVED',
              'MIRROR_ME_IDENTITY_CLASS_INCOMPLETE',
              'CAVERN_NARRATIVE_FUNCTION_UNRESOLVED',
              'FRONTIER_RESERVE_FAMILIES_NOT_FINALIZED'
          ]
          if gate['blockingReasons'] != expected_blockers:
              raise SystemExit('existing measurement blockers changed unexpectedly')
          if any([
              gate['terrainMeasurementAuthorized'],
              gate['finalCoordinateAssignmentAuthorized'],
              gate['terrainMutationAuthorized'],
              gate['finalPlacementAuthorized'],
              gate['geometryConstructionAuthorized'],
              gate['gameplayChangeAuthorized'],
              gate['runtimeChangeAuthorized'],
              gate['publicRouteChangeAuthorized'],
              gate['productionChangeAuthorized']
          ]):
              raise SystemExit('prohibited authorization became true')

          manifest_path.write_text(json.dumps(manifest, separators=(',', ':')), encoding='utf-8')
          json.loads(manifest_path.read_text(encoding='utf-8'))
          PY

      - name: Commit manifest and remove one-use workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add h-earth-3d/control-plane/region-001-reconciliation/h-earth.region-001.mirrorland-narrative-character-temporal-reconciliation.manifest.v1.json
          git rm .github/workflows/h-earth-region-001-read-only-coordinate-reconciliation-once.yml
          git commit -m 'Authorize read-only Gratitude Region coordinate reconciliation'
          git push origin HEAD:agent/h-earth-region-001-read-only-coordinate-reconciliation-001
