name: Estate Laboratory Successor 006 Compass Repair

on:
  push:
    branches:
      - ESTATE_LABORATORY_NAVIGATION_RECONCILIATION_20260824_006
    paths:
      - '.github/workflows/estate-laboratory-gen1.yml'

permissions:
  contents: write

jobs:
  repair-compass:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out bounded successor
        uses: actions/checkout@v4
        with:
          fetch-depth: 8
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /.github/workflows/estate-laboratory-gen1.yml

      - name: Rebuild Compass navigation from exact current-main bytes
        shell: bash
        run: |
          set -euo pipefail
          BASE='af46884873acf993400ab51915fc8044bd022e93'
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main^{commit})" = "$BASE"
          git show "$BASE:index.html" > index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          replacements=[
            (
              'data-coordinate-label="Instruments" data-coordinate-function="Measurement, standards, governance, diagnostics, and operational control." data-title="Instruments" data-route="/gauges/" data-cardinal-route="/gauges/" data-panel-title="Instruments" data-panel-body="Go here for measurement tools, laws, governance, diagnostics, and operational control." data-panel-why="Open South when you need to measure, verify, govern, or decide what may happen next."',
              'data-coordinate-label="Instruments" data-coordinate-function="Measurement, observability, diagnostics, standards, governance, and operational control." data-title="Instruments" data-route="/instruments/" data-cardinal-route="/instruments/" data-panel-title="Instruments" data-panel-body="Open the Estate Laboratory for governed observability, or choose a specialized room for measurement, law, governance, or diagnostics." data-panel-why="Open South when you need to observe, measure, verify, govern, or decide what may happen next."'
            ),
            (
              'data-room-id="south-4" data-label="Control Cockpit" data-route="/showroom/globe/audralia/disposition/" data-local-coordinate="Operational Control" data-local-function="Turn findings into a bounded next action." data-preview="Turn findings into a bounded next action." data-why-enter="Use the cockpit when evidence and authority support a controlled next step." href="/showroom/globe/audralia/disposition/">Control Cockpit</a>',
              'data-room-id="south-4" data-label="Estate Laboratory" data-route="/instruments/" data-local-coordinate="Governed Observability" data-local-function="Query estate systems lightly, escalate deliberately, inspect deeply, and preserve machine-readable evidence." data-preview="Query estate systems lightly, escalate deliberately, inspect deeply, and preserve machine-readable evidence." data-why-enter="Use the Estate Laboratory when you need estate-wide observation and diagnostic escalation without granting mutation authority." href="/instruments/">Estate Laboratory</a>'
            ),
            (
              '<a href="/gauges/">Instruments</a>',
              '<a href="/instruments/">Instruments</a>'
            )
          ]
          for old,new in replacements:
            count=s.count(old)
            if count != 1:
              raise SystemExit(f'COMPASS_REPAIR_MATCH_COUNT:{count}:{old[:80]}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          grep -Fq 'data-panel-body="Explore prototypes, energy, water, infrastructure, and long-range construction."' index.html
          grep -Fq 'data-route="/instruments/" data-cardinal-route="/instruments/"' index.html
          grep -Fq 'data-room-id="south-4" data-label="Estate Laboratory" data-route="/instruments/"' index.html
          grep -Fq '<a href="/instruments/">Instruments</a>' index.html
          git diff --check -- index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'Estate Laboratory: preserve current Compass copy while reconciling navigation'
          git push origin "HEAD:$GITHUB_REF_NAME"
