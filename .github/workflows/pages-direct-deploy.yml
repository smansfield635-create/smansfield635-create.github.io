name: Direct GitHub Pages Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact deployment head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify exact head and successor contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "$GITHUB_SHA"
          node .github/ai-router/projects/compass/verify-performance-successor.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare byte-identical site artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a --exclude '.git' --exclude '_site' ./ _site/
          product=(
            index.html
            assets/compass/compass.orbit-input.js
            assets/compass/compass.statement-carousel.js
            assets/compass/compass.statement-carousel.css
            assets/compass/compass.brain-scene.js
            assets/compass/compass.capability-carousel.js
            assets/compass/compass.capability-carousel.css
          )
          sha256sum "${product[@]}" > /tmp/compass-source.sha256
          (cd _site && sha256sum "${product[@]}") > /tmp/compass-site.sha256
          diff -u /tmp/compass-source.sha256 /tmp/compass-site.sha256
          mapfile -t parents < <(git show -s --format='%P' HEAD | tr ' ' '\n')
          if [ "${#parents[@]}" -eq 2 ]; then
            candidate="${parents[1]}"
            git diff --quiet "$candidate" HEAD -- "${product[@]}"
          else
            candidate="$GITHUB_SHA"
          fi
          COMPASS_DEPLOY_CANDIDATE="$candidate" node --input-type=module <<'NODE'
          import fs from 'node:fs';import crypto from 'node:crypto';
          const version='compass-awards-trl-brain-successor-v1',html=fs.readFileSync('index.html','utf8');
          if((html.match(new RegExp(version,'g'))||[]).length!==6)throw new Error('SUCCESSOR_REFERENCE_COUNT');
          if(html.includes('compass.carousel.js')||html.includes('compass.carousel.css'))throw new Error('LEGACY_REFERENCE');
          const lines=fs.readFileSync('/tmp/compass-source.sha256','utf8').trim().split('\n');
          const files=Object.fromEntries(lines.map(line=>{const [sha,...name]=line.trim().split(/\s+/);return[name.join(' '),sha]}));
          const receipt={schema:'COMPASS_BYTE_IDENTICAL_PAGES_ARTIFACT_v1',operationId:'COMPASS_AWARDS_TRL_BRAIN_FULL_CYCLE_SUCCESSOR_20260816_v1',lockGeneration:1509,mergeHead:process.env.GITHUB_SHA,candidateHead:process.env.COMPASS_DEPLOY_CANDIDATE,productIdentity:version,files,manifestSha256:crypto.createHash('sha256').update(JSON.stringify(files)).digest('hex'),result:'PASS_CLOSED'};
          fs.writeFileSync('/tmp/compass-pages-byte-identity.json',JSON.stringify(receipt,null,2)+'\n');
          NODE
      - name: Upload deployment identity
        uses: actions/upload-artifact@v4
        with:
          name: compass-pages-byte-identity
          path: |
            /tmp/compass-source.sha256
            /tmp/compass-site.sha256
            /tmp/compass-pages-byte-identity.json
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
