<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Compass Brain Gen1 · HRA Anatomical Object</title>
<style>
:root{color-scheme:dark;--bg:#05090d;--text:#eef1ed;--muted:rgba(238,241,237,.58);--gold:#e4c66f}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 46%,rgba(110,128,138,.13),transparent 33rem),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.stage{position:absolute;inset:0}
.stage canvas{width:100%;height:100%;display:block;touch-action:none;filter:sepia(.22) saturate(1.72) hue-rotate(292deg) brightness(1.08) contrast(1.02)}
.badge{position:absolute;left:clamp(.75rem,2vw,1.25rem);top:clamp(.75rem,2vw,1.25rem);z-index:3;padding:.5rem .7rem;border:1px solid rgba(220,232,236,.12);border-radius:.75rem;background:rgba(8,15,22,.68);backdrop-filter:blur(10px);pointer-events:none}
.badge strong{display:block;color:var(--gold);font-size:.62rem;letter-spacing:.13em;text-transform:uppercase}.badge span{display:block;margin-top:.16rem;color:var(--muted);font:600 .58rem/1.3 ui-monospace,SFMono-Regular,Menlo,monospace}
.status{position:absolute;right:clamp(.75rem,2vw,1.25rem);bottom:clamp(.75rem,2vw,1.25rem);z-index:3;max-width:min(32rem,calc(100vw - 1.5rem));padding:.52rem .68rem;border:1px solid rgba(220,232,236,.12);border-radius:.7rem;background:rgba(8,15,22,.72);color:var(--muted);font:650 .62rem/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;backdrop-filter:blur(10px)}
.hint{position:absolute;left:50%;bottom:1.05rem;transform:translateX(-50%);z-index:2;color:rgba(238,241,237,.34);font-size:.58rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;pointer-events:none;white-space:nowrap}
html[data-carousel-embed="true"] .badge,html[data-carousel-embed="true"] .status,html[data-carousel-embed="true"] .hint{display:none!important}
html[data-carousel-embed="true"],html[data-carousel-embed="true"] body{background:#05090d}
@media(max-width:640px){.badge{padding:.42rem .56rem}.badge span{display:none}.hint{bottom:3.2rem}}
</style>
<script>if(new URLSearchParams(location.search).get('carousel')==='1')document.documentElement.dataset.carouselEmbed='true';</script>
</head>
<body>
<div class="stage"><canvas id="brain" aria-label="Interactive NIH Human Reference Atlas brain"></canvas></div>
<div class="badge"><strong>Diamond Gate · Brain Gen1</strong><span>NIH Human Reference Atlas · geometry frozen · rose material</span></div>
<div class="hint">drag to rotate · pinch or wheel to scale</div>
<div class="status" id="status">Loading qualified HRA brain…</div>
<script src="./inspector.js?v=2" defer></script>
</body>
</html>
