name: Bounded Exact-Head Execution Carrier v1

on:
  push:
    branches:
      - agent/bounded-exact-head-execution-carrier-v1-002
    paths:
      - '.github/ai-router/router.v1.json'

permissions:
  contents: read

env:
  EXPECTED_HEAD: ${{ github.sha }}
  ADMISSION_RECEIPT_B64: 

jobs:
  bootstrap-router-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact candidate identity and cleanliness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Restore canonical generation-832 admission receipt
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ADMISSION_RECEIPT_B64" | base64 --decode > "$RUNNER_TEMP/gen832-admission.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/gen832-admission.json'); if(r.schema!=='REPOSITORY_OPERATION_ADMISSION_RECEIPT_v1'||r.result!=='ADMITTED_AND_LOCKED'||r.operationId!=='BOUNDED_EXACT_HEAD_EXECUTION_CARRIER_V1_INSTALLATION_20260809_002'||r.lock?.lockGeneration!==832||r.requestDigest!=='3d3a526ceebd155eba1609e6630e7cd11d56fc4b0690fc73f4bad9f897bfcf42'||r.procedureLocatorDigest!=='7baa7699e2468c3aafa72cd44d283c4a735d7c1b94f418fe8502982afaa5a83a')process.exit(1)"

      - name: Run command-emitted Router gate for exact eight admitted paths
        shell: bash
        env:
          INTAKE_ADMISSION_RECEIPT: ${{ runner.temp }}/gen832-admission.json
        run: |
          set -euo pipefail
          node tools/repository-ai-entry-router.mjs \
            --mutation-intent \
            --path .github/ai-router/router.v1.json \
            --path .github/ai-router/execution-backends.v1.json \
            --path .github/ai-router/system-continuity/gap-registry.v1.json \
            --path .github/ai-router/bounded-exact-head-execution-carrier/protocol.v1.json \
            --path .github/ai-router/bounded-exact-head-execution-carrier/registry.v1.json \
            --path .github/ai-router/bounded-exact-head-execution-carrier/carrier.v1.mjs \
            --path .github/ai-router/bounded-exact-head-execution-carrier/self-test.v1.mjs \
            --path .github/workflows/bounded-exact-head-execution-carrier-v1.yml \
            --task BOUNDED_EXACT_HEAD_EXECUTION_CARRIER_V1_INSTALLATION_20260809_002 \
            --output "$RUNNER_TEMP/bounded-exact-head-execution-carrier-router-receipt.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/bounded-exact-head-execution-carrier-router-receipt.json'); if(r.disposition!=='PASS'||r.routes?.length!==8||!r.routes.every(x=>x.projectId==='REPOSITORY_AI_ROUTER_INFRASTRUCTURE'&&x.disposition==='PASS'))process.exit(1)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload bootstrap Router receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-exact-head-execution-carrier-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gen832-admission.json
            ${{ runner.temp }}/bounded-exact-head-execution-carrier-router-receipt.json
          if-no-files-found: error
          retention-days: 90
