name: Laws Carousel Gen267 Awards Evaluate
on:
  push:
    branches: ['agent/laws-carousel-gen267-continuity-intake']
    paths: ['.github/workflows/laws-carousel-gen267-awards-evaluate.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  PRIVATE_HEAD: 496be26a2214886e93727f6bec0da05cf9fa7505
  CANDIDATE: 063f49ba788388f0a9075e6624792b8cf761e5bf
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Mint private token
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.PRIVATE_EXECUTION_APP_ID }}
          private-key: ${{ secrets.PRIVATE_EXECUTION_APP_PRIVATE_KEY }}
          owner: smansfield635-create
          repositories: geodiametrics1
          permission-contents: read
      - uses: actions/checkout@v4
        with:
          repository: smansfield635-create/geodiametrics1
          ref: ${{ env.PRIVATE_HEAD }}
          token: ${{ steps.token.outputs.token }}
          path: private-control-plane
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bound evidence and execute active evaluator
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/evaluate.mjs" <<'JS'
          import fs from 'node:fs'; import {withEvidenceDigest,evaluate} from './private-control-plane/.github/ai-router/reference-class-awards-admission/evaluator/evaluator.v1.mjs';
          const rendered=[
          ['GEN267_PHONE_INITIAL','INITIAL_RENDERED_STATE','PHONE','bce04ae4a03d8e88763b353532ca3bcbfebfc8ba639b7fd2c48ac6c36d5f4e44'],['GEN267_PHONE_SELECTED','MEANINGFUL_INTERACTION_STATE','PHONE','6afe419ae664d8408996bbe33398094abd6ccab83be03b5b69853f09ec9b7cc6'],['GEN267_PHONE_INSPECTION','RESULT_OR_NAVIGATION_STATE','PHONE','46e280536d6fd9b390d88b5b5eae5ff0cfaa6597efb16c1e016bc26d63ec47db'],
          ['GEN267_TABLET_INITIAL','INITIAL_RENDERED_STATE','TABLET','f0cdc76c309d02cda37ad6dc7d5f2dfd0577244544a84675a80b331f26a155b4'],['GEN267_TABLET_SELECTED','MEANINGFUL_INTERACTION_STATE','TABLET','43e068a149e02f25a969a0c68f30be007878a3386cb48211b9267b5b3d054345'],['GEN267_TABLET_INSPECTION','RESULT_OR_NAVIGATION_STATE','TABLET','ca8c898126c10628dec010eb67e83c2c3daa699e49b09f6a9740a23e5ebe2861'],
          ['GEN267_DESKTOP_INITIAL','INITIAL_RENDERED_STATE','DESKTOP','6eef38b7574f555f1f1202a07352cb9ac5fdfa39231ccfdeaac9e9d1edbd0091'],['GEN267_DESKTOP_SELECTED','MEANINGFUL_INTERACTION_STATE','DESKTOP','d5fa3ed57ed9cfced43f1dd722d9ba7c4b83841024a00b0e545d4bc4c66be7e9'],['GEN267_DESKTOP_INSPECTION','RESULT_OR_NAVIGATION_STATE','DESKTOP','35ba94e9980d46b5bae5d119d645201a8dea37e0554c02cc79c171443ed1945e']].map(([artifactId,stateClass,deviceClass,sha256])=>({artifactId,kind:'SCREENSHOT',stateClass,deviceClass,sha256}));
          const bundle=withEvidenceDigest({schema:'REFERENCE_CLASS_AWARDS_ADMISSION_EVIDENCE_BUNDLE_v1',candidate:{candidateId:'LAWS_CAROUSEL_GEN267',commitSha:process.env.CANDIDATE,manifestationClass:'SPATIAL_INSTRUMENT_AND_NAVIGATION_MODEL'},reference:{referenceId:'R_C_LAWS_COMPASS_SIX_AUTHORITY',commitSha:'eb9a1730f201ba8a8c3822b65ecb984592de38bd'},pageExcellence:{result:'PASS',receiptDigest:'08d6544ebb7a6fc98507fbe7071795ec251fe12b334c69879026c91485d0e102'},applicableDevices:['PHONE','TABLET','DESKTOP'],renderedEvidence:rendered,interactionTrace:{required:true,meaningfulConsequenceObserved:true,traceDigest:'53af7b84f9def4abb504e8df32b1405123a6a1d3c55a50d04fb281ac01f64f37'},evidenceProvenance:{technicalReceiptArtifactDigest:'7f467db359543a91f5a8d4f76490aefd82bbfaaaf008828c13bf54e8bf572d32',renderCaptureArtifactDigest:'aed28a20cc67d75c77320f8863118de4735d21637021230ac605b129948aeb7a',renderCaptureRun:31910005352}});
          const dims={RESOLVED_AUTHORSHIP:'PARITY_OR_ABOVE',VISUAL_SPATIAL_COHERENCE:'BELOW_PARITY',COMPOSITIONAL_INTEGRITY:'BELOW_PARITY',INTENTIONAL_HIERARCHY:'BELOW_PARITY',INTERACTION_INTEGRATION:'PARITY_OR_ABOVE',FINISH_AND_REFINEMENT:'BELOW_PARITY',PURPOSE_FORM_FIT:'PARITY_OR_ABOVE',RESPONSIVE_INTEGRITY:'BELOW_PARITY',CLASS_SPECIFIC_SOPHISTICATION:'PARITY_OR_ABOVE',ABSENCE_OF_PROTOTYPE_OR_DEBUG_RESIDUE:'PARITY_OR_ABOVE'};
          const adjudication={schema:'REFERENCE_CLASS_AWARDS_ADMISSION_PERCEPTUAL_ADJUDICATION_v1',candidateCommitSha:process.env.CANDIDATE,evidenceBundleDigest:bundle.evidenceDigest,referenceId:'R_C_LAWS_COMPASS_SIX_AUTHORITY',referenceCommitSha:'eb9a1730f201ba8a8c3822b65ecb984592de38bd',adjudicator:{kind:'INDEPENDENT_MULTIMODAL_EVALUATOR',id:'OPENAI_GPT_5_6_SOL_GEN283_PERCEPTUAL_20260815',independentOfCandidateConstruction:true},styleSimilarityUsedAsRequirement:false,featureInventoryUsedAsPassBasis:false,dimensionVerdicts:dims,wholeArtifactDisposition:{sameProfessionalConversation:false,reason:'PHONE_ORBIT_TEXT_LAYERS_COLLIDE_AND_BECOME_UNREADABLE_IN_INITIAL_AND_ROTATED_STATES'},catastrophicFailures:['PRIMARY_RESPONSIVE_INTEGRITY_COLLAPSE','VISUAL_HIERARCHY_OR_LEGIBILITY_COLLAPSE']};
          const receipt=evaluate(bundle,adjudication); fs.writeFileSync('/tmp/gen267-awards-evidence-bundle.json',JSON.stringify(bundle,null,2)+'\n'); fs.writeFileSync('/tmp/gen267-awards-perceptual-adjudication.json',JSON.stringify(adjudication,null,2)+'\n'); fs.writeFileSync('/tmp/gen267-awards-evaluation-receipt.json',JSON.stringify(receipt,null,2)+'\n'); console.log(JSON.stringify(receipt)); if(receipt.result!=='BELOW_AWARDS_CONVERSATION') process.exitCode=1;
          JS
          node "$RUNNER_TEMP/evaluate.mjs"
      - uses: actions/upload-artifact@v4
        with:
          name: gen267-awards-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/gen267-awards-evidence-bundle.json
            /tmp/gen267-awards-perceptual-adjudication.json
            /tmp/gen267-awards-evaluation-receipt.json
          if-no-files-found: error
          retention-days: 90
