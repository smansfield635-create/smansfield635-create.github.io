name: Temporary Final Program F3 Resolution And Validity Verify

on:
  push:
    branches:
      - construction/methods-models-integrated-environment-v1
    paths:
      - 'control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/f3-resolution-and-validity-engine/**'
      - '.github/workflows/temporary-methods-models-final-f3-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-f3-resolution-and-validity-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify F3 resolution and validity engine fail-closed
        shell: bash
        run: |
          set -euo pipefail
          node control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/f3-resolution-and-validity-engine/verify.v1.mjs | tee /tmp/f3-verification.log
      - name: Require terminal F3 contract
        shell: bash
        run: grep -F 'PASS_F3_RESOLUTION_AND_VALIDITY_ENGINE_v1' /tmp/f3-verification.log
      - name: Preserve F3 verification log
        uses: actions/upload-artifact@v4
        with:
          name: methods-models-final-program-f3-resolution-and-validity-verification
          if-no-files-found: error
          retention-days: 90
          path: /tmp/f3-verification.log
