name: H-Earth Compositor Registry Verification

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - ".github/workflows/h-earth-compositor-registry-verification.yml"
      - ".github/scripts/h-earth-compositor-registry-patch.mjs"
      - "h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.compositor-camera-authority-scope-reconciliation.js"
      - "h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js"
      - "tools/h-earth-post-merge-scope-disposition-audit.mjs"

permissions:
  contents: write

jobs:
  verify-and-close-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact registry branch
        uses: actions/checkout@v4
        with:
          ref: agent/h-earth-compositor-registry-scope-reconciliation-001
          fetch-depth: 0

      - name: Verify source boundaries and apply overlay
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          test "$(git merge-base HEAD origin/main)" = "27256abbbd508ff33b05966104eb26c3e73dfe97"
          test "$(git rev-parse HEAD:showroom/globe/h-earth/compositor.js)" = "480cd4519a4d3cc364be4b16acc7791aadb5071c"
          test "$(git rev-parse HEAD:h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js)" = "f8935f73d6e1ce97248a936052e306569bf3326c"
          test "$(git rev-parse HEAD:tools/h-earth-post-merge-scope-disposition-audit.mjs)" = "6b415167b9e8610324ba2217a8f6ebdd332107de"
          node .github/scripts/h-earth-compositor-registry-patch.mjs
          node --check h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.compositor-camera-authority-scope-reconciliation.js
          node --check h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js
          node --check tools/h-earth-post-merge-scope-disposition-audit.mjs

      - name: Execute exact compositor path preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/h-earth-compositor-registry
          node --experimental-default-type=module \
            tools/h-earth-repository-registry-auto-preflight.mjs \
            --path /showroom/globe/h-earth/compositor.js \
            --task "Read-only registration verification for the active H-Earth compositor camera-authority source before the separately authorized ground-observer camera mutation." \
            --output artifacts/h-earth-compositor-registry/preflight.json \
            > artifacts/h-earth-compositor-registry/preflight.stdout.json
          node <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync(
            'artifacts/h-earth-compositor-registry/preflight.json',
            'utf8'
          ));
          const entry = receipt.pathClassification?.classifications?.find(
            (candidate) => candidate.repositoryPath === '/showroom/globe/h-earth/compositor.js'
          );
          const failureCodes = receipt.validatorReceipt?.failureCodes ?? [];
          if (
            receipt.dependenciesVerified !== true ||
            receipt.finalDisposition !== 'PASS' ||
            entry?.classification !== 'REGISTERED_H_EARTH_PATH' ||
            entry?.resolvedNodeIds?.includes('H_EARTH_COMPOSITOR_CAMERA_AUTHORITY_SCOPE_PACKAGE') !== true ||
            failureCodes.length !== 0
          ) {
            throw new Error(`COMPOSITOR_PREFLIGHT_NOT_PASS:${JSON.stringify({
              dependenciesVerified: receipt.dependenciesVerified,
              finalDisposition: receipt.finalDisposition,
              entry,
              failureCodes
            })}`);
          }
          NODE

      - name: Execute retained-state continuity audit
        shell: bash
        run: |
          set -euo pipefail
          node tools/h-earth-post-merge-scope-disposition-audit.mjs \
            > artifacts/h-earth-compositor-registry/retained-state-audit.json
          node <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync(
            'artifacts/h-earth-compositor-registry/retained-state-audit.json',
            'utf8'
          ));
          if (
            receipt.result !== 'PASS' ||
            (receipt.failedChecks ?? []).length !== 0 ||
            receipt.loaderContinuityRenewal?.renewalId !==
              'H_EARTH_RETAINED_STATE_LOADER_CONTINUITY_RENEWAL_v4'
          ) {
            throw new Error(`RETAINED_STATE_AUDIT_NOT_PASS:${JSON.stringify({
              result: receipt.result,
              failedChecks: receipt.failedChecks,
              renewal: receipt.loaderContinuityRenewal
            })}`);
          }
          NODE

      - name: Remove verification transport and commit registry delta
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/h-earth-compositor-registry-verification.yml
          rm -f .github/scripts/h-earth-compositor-registry-patch.mjs
          git add \
            h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.compositor-camera-authority-scope-reconciliation.js \
            h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js \
            tools/h-earth-post-merge-scope-disposition-audit.mjs
          git add -u \
            .github/workflows/h-earth-compositor-registry-verification.yml \
            .github/scripts/h-earth-compositor-registry-patch.mjs
          changed="$(git diff --cached --name-only)"
          expected=$'.github/scripts/h-earth-compositor-registry-patch.mjs\n.github/workflows/h-earth-compositor-registry-verification.yml\nh-earth-3d/registry/accepted-amendments/h-earth.repository-registry.compositor-camera-authority-scope-reconciliation.js\nh-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js\ntools/h-earth-post-merge-scope-disposition-audit.mjs'
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Register H-Earth compositor camera authority scope"
          git push origin HEAD:agent/h-earth-compositor-registry-scope-reconciliation-001

      - name: Upload registry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-compositor-registry-${{ github.sha }}
          path: artifacts/h-earth-compositor-registry/**
          if-no-files-found: warn
          retention-days: 30
