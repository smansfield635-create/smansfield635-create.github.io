name: H-Earth CP7G Candidate Construction Closure

on:
  pull_request:
    paths:
      - '.github/workflows/h-earth-cp7g-candidate-construction-closure.yml'
      - 'h-earth-3d/control-plane/post-cp2-round2/cp7/h-earth.cp7g-candidate-construction-closure.v1.mjs'
      - 'h-earth-3d/validation/cp7/h-earth.cp7g-candidate-construction-closure.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-construction-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact CP7G closure
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute deterministic CP7G verifier first pass
        run: node h-earth-3d/validation/cp7/h-earth.cp7g-candidate-construction-closure.mjs h-earth-3d/validation/cp7/cp7g-evidence/receipt-first.json
      - name: Execute deterministic CP7G verifier second pass
        run: node h-earth-3d/validation/cp7/h-earth.cp7g-candidate-construction-closure.mjs h-earth-3d/validation/cp7/cp7g-evidence/receipt-second.json
      - name: Require identical receipts
        run: cmp h-earth-3d/validation/cp7/cp7g-evidence/receipt-first.json h-earth-3d/validation/cp7/cp7g-evidence/receipt-second.json
      - name: Upload CP7G evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-cp7g-candidate-construction-closure
          path: h-earth-3d/validation/cp7/cp7g-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce CP7G pass
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipt = JSON.parse(fs.readFileSync('h-earth-3d/validation/cp7/cp7g-evidence/receipt-first.json', 'utf8'));
          if (receipt.result !== 'CP7G_CANDIDATE_CONSTRUCTION_CLOSURE_PASS_CLOSED' || receipt.pass !== true || receipt.checkpoint7Status !== 'PASS_CLOSED' || receipt.checkpoint8Authorized !== true) {
            console.error(JSON.stringify(receipt, null, 2));
            process.exit(1);
          }
          console.log(`CP7G_PASS:${receipt.candidateSourceSha256}:${receipt.canonicalReceiptSha256}`);
          NODE
