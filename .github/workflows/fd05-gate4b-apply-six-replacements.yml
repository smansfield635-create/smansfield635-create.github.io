name: H-Earth Gate 4B apply six replacements

on:
  push:
    branches:
      - agent/h-earth-gate4b-helper

permissions:
  contents: write

jobs:
  apply-six-replacements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/h-earth-gate4b-helper
          fetch-depth: 0

      - name: Recover the accepted six-file replacement constructor
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://raw.githubusercontent.com/smansfield635-create/smansfield635-create.github.io/b1fc49f962e2f727cd9dd69c7a9add6cf3828f58/.github/workflows/fd05-shoreline-gate4.yml \
            -o /tmp/gate4-source.yml
          python3 - <<'PY'
          import base64
          import gzip
          import pathlib
          import re

          source = pathlib.Path('/tmp/gate4-source.yml').read_text(encoding='utf-8')
          match = re.search(
              r"printf '%s' '([^']+)' \| base64 -d \| gzip -d > /tmp/gate4-patch.py",
              source,
          )
          if match is None:
              raise SystemExit('accepted Gate 4 replacement payload not found')
          payload = gzip.decompress(base64.b64decode(match.group(1)))
          pathlib.Path('/tmp/gate4-patch.py').write_bytes(payload)
          PY

      - name: Apply only the six authorized complete-file replacements
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/h-earth-native-shoreline-contact-repair
          git checkout -B agent/h-earth-native-shoreline-contact-repair origin/agent/h-earth-native-shoreline-contact-repair
          test "$(git rev-parse HEAD)" = "2764c3726c1b6591877d9257a125a70a2536d90d"

          python3 /tmp/gate4-patch.py

          actual="$(git diff --name-only | sort | tr '\n' ' ')"
          expected="showroom/globe/h-earth/environment.js showroom/globe/h-earth/render/geometry-foam.js showroom/globe/h-earth/render/geometry-ground.js showroom/globe/h-earth/render/geometry-preview.js showroom/globe/h-earth/render/geometry-water.js showroom/globe/h-earth/render/shoreline-preview.js "
          test "$actual" = "$expected"
          test -z "$(git diff --diff-filter=AD --name-only)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            showroom/globe/h-earth/environment.js \
            showroom/globe/h-earth/render/geometry-preview.js \
            showroom/globe/h-earth/render/geometry-ground.js \
            showroom/globe/h-earth/render/geometry-foam.js \
            showroom/globe/h-earth/render/geometry-water.js \
            showroom/globe/h-earth/render/shoreline-preview.js
          git commit -m "Apply shared shoreline boundary replacements" \
            -m "Gate 4B only: replace the six authorized existing production paths. Tests remain deferred to Gate 4C."
          git push origin HEAD:agent/h-earth-native-shoreline-contact-repair

# Trigger commit after workflow registration, sequence 2.
