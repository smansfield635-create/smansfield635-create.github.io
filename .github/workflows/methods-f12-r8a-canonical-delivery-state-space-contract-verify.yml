name: Methods F12 R8A Canonical Delivery State Space Contract Verify

on:
  push:
    branches:
      - agent/methods-f12-r8a-canonical-delivery-state-space-contract-v1

permissions:
  contents: read

jobs:
  verify-r8a-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact corridor-freeze parent and frozen boundaries
        shell: bash
        run: |
          set -euo pipefail
          ROOT="control-plane/methods-information-benchmark/f12-recursive-spatial-information-architecture-remediation-v1"
          test "$(git rev-parse HEAD^)" = "b0efa41c13fa061828bf7674a97b35aacaa34071"
          test "$(git rev-parse b0efa41c13fa061828bf7674a97b35aacaa34071^{tree})" = "321feeacdad97388eca6c329225e057ecd2e8272"
          test "$(git rev-parse HEAD:$ROOT/f12-r8-r12-continuation-corridor-freeze.v1.json)" = "86ea28520cc4954ab533142fc22abd0cac5a9d9e"
          test "$(git rev-parse HEAD:$ROOT/r1-authority-boundary-contract.v1.json)" = "a369bfd8990b5ef8244b575dd392d4b1f51c477f"
          test "$(git rev-parse HEAD:$ROOT/r6-spatial-transformation-grammar-contract.v1.json)" = "6abb8d6b30fc92aa1eaff44ca7f8ec4e567b5938"
          test "$(git rev-parse HEAD:$ROOT/r7-continuity-and-accessibility-contract.v1.json)" = "475aa283c3feb2fb6520f953c0a96d94285bc214"

      - name: Verify exact terminal R8A payload blobs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="control-plane/methods-information-benchmark/f12-recursive-spatial-information-architecture-remediation-v1"
          test "$(git rev-parse HEAD:$ROOT/r8a-canonical-delivery-state-space-contract.v1.json)" = "3f593061fa3d4906c769707904108249943e3826"
          test "$(git rev-parse HEAD:$ROOT/r8a-canonical-delivery-state-space-contract.verify.v1.mjs)" = "17d72ecf489adbc2d83bc0791cf2d36c1f7d6200"
          node -e "JSON.parse(require('fs').readFileSync('$ROOT/r8a-canonical-delivery-state-space-contract.v1.json','utf8'))"
          node --check "$ROOT/r8a-canonical-delivery-state-space-contract.verify.v1.mjs"

      - name: Verify terminal R8A canonical delivery state-space contract
        shell: bash
        run: |
          set -euo pipefail
          ROOT="control-plane/methods-information-benchmark/f12-recursive-spatial-information-architecture-remediation-v1"
          node "$ROOT/r8a-canonical-delivery-state-space-contract.verify.v1.mjs" | tee r8a-canonical-delivery-state-space-verification.json
          grep -Fq '"status": "PASS_CLOSED"' r8a-canonical-delivery-state-space-verification.json
          grep -Fq '"manifoldStatus": "NOT_ASSUMED"' r8a-canonical-delivery-state-space-verification.json
          grep -Fq '"r8aPassClosed": true' r8a-canonical-delivery-state-space-verification.json
          grep -Fq '"r8PassClosed": false' r8a-canonical-delivery-state-space-verification.json
          grep -Fq '"r9Unlock": false' r8a-canonical-delivery-state-space-verification.json
          grep -Fq '"nextSubcheckpointOnPass": "R8B_SYSTEM_COORDINATE_ATLAS_CONTRACT"' r8a-canonical-delivery-state-space-verification.json

      - name: Prove exact additive R8A terminal diff scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only b0efa41c13fa061828bf7674a97b35aacaa34071..HEAD | tee r8a-canonical-delivery-state-space-changed-paths.txt
          test "$(wc -l < r8a-canonical-delivery-state-space-changed-paths.txt)" -eq 3
          expected="$(mktemp)"
          cat > "$expected" <<'EOF'
          .github/workflows/methods-f12-r8a-canonical-delivery-state-space-contract-verify.yml
          control-plane/methods-information-benchmark/f12-recursive-spatial-information-architecture-remediation-v1/r8a-canonical-delivery-state-space-contract.v1.json
          control-plane/methods-information-benchmark/f12-recursive-spatial-information-architecture-remediation-v1/r8a-canonical-delivery-state-space-contract.verify.v1.mjs
          EOF
          sort r8a-canonical-delivery-state-space-changed-paths.txt > actual.sorted
          sort "$expected" > expected.sorted
          diff -u expected.sorted actual.sorted
          test -z "$(git diff --diff-filter=MDR --name-only b0efa41c13fa061828bf7674a97b35aacaa34071..HEAD)"

      - name: Preserve terminal R8A contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: methods-f12-r8a-canonical-delivery-state-space-contract-evidence
          path: |
            control-plane/methods-information-benchmark/f12-recursive-spatial-information-architecture-remediation-v1/r8a-canonical-delivery-state-space-contract.v1.json
            r8a-canonical-delivery-state-space-verification.json
            r8a-canonical-delivery-state-space-changed-paths.txt
