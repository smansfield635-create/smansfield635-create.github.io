name: GR-CR-03 Expand Manor Search One Use

on:
  push:
    branches:
      - agent/h-earth-gratitude-region-coordinate-reconciliation-001

permissions:
  contents: write

jobs:
  patch-and-remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/h-earth-gratitude-region-coordinate-reconciliation-001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded search correction
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'h-earth-3d/validation/h-earth.gratitude-region.mirror-manor-reconciliation.mjs';
          let text = fs.readFileSync(path, 'utf8');
          const replacements = [
            [
              "const SEARCH = freeze({ xMinimum: 24, xMaximum: 132, zMinimum: -212, zMaximum: -132, step: 4 });",
              "const SEARCH = freeze({ xMinimum: 24, xMaximum: 176, zMinimum: -236, zMaximum: -132, step: 4 });"
            ],
            [
              "    const left = [...frame.samples].filter((sample) => sample.world.x <= 76).sort((a, b) => b.elevation - a.elevation || a.world.x - b.world.x)[0] ?? null;\n    const right = [...frame.samples].filter((sample) => sample.world.x > 76).sort((a, b) => b.elevation - a.elevation || a.world.x - b.world.x)[0] ?? null;",
              "    const interiorSamples = frame.samples.filter((sample) => sample.world.x > SEARCH.xMinimum && sample.world.x < SEARCH.xMaximum && sample.world.z > SEARCH.zMinimum && sample.world.z < SEARCH.zMaximum);\n    const left = [...interiorSamples].filter((sample) => sample.world.x <= 96).sort((a, b) => b.elevation - a.elevation || a.world.x - b.world.x)[0] ?? null;\n    const right = [...interiorSamples].filter((sample) => sample.world.x > 96).sort((a, b) => b.elevation - a.elevation || a.world.x - b.world.x)[0] ?? null;"
            ],
            [
              "  for (const sample of frame.samples) {\n    const local = projectLocal(corridor, sample.world);",
              "  for (const sample of frame.samples) {\n    if (sample.world.z < -220) continue;\n    const local = projectLocal(corridor, sample.world);"
            ]
          ];
          for (const [from, to] of replacements) {
            if (!text.includes(from)) throw new Error(`Expected source text missing: ${from.slice(0, 80)}`);
            text = text.replace(from, to);
          }
          fs.writeFileSync(path, text);
          NODE
          rm .github/workflows/gr-cr-03-expand-manor-search-one-use.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add h-earth-3d/validation/h-earth.gratitude-region.mirror-manor-reconciliation.mjs .github/workflows/gr-cr-03-expand-manor-search-one-use.yml
          git commit -m "GR-CR-03 exclude clipped boundary peaks"
          git push origin HEAD:agent/h-earth-gratitude-region-coordinate-reconciliation-001
