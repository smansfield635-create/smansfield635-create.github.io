name: BT4 World + Diagnostic Entitlement v1

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'research/bt4/**'
      - 'preview/bt4/entitlement-v1/**'
      - '.github/ai-router/publication-surfaces/audralia.json'
      - 'showroom/globe/audralia/index.html'
      - 'showroom/globe/audralia/fap1-orbital-support-tuning-v1.mjs'
      - 'showroom/globe/audralia/loading-continuity-v3.css'
      - 'showroom/globe/audralia/diagnostic/index.inspection.authority.js'
      - '.github/workflows/bt4-world-diagnostic-entitlement-v1.yml'
      - 'showroom/globe/audralia/fap1-weather-presentation-v1.mjs'
      - 'showroom/globe/audralia/startup-bootstrap-v2.mjs'
      - 'showroom/globe/h-earth/terrain-estate-construction-v1/audralia-tablet-cloud-pass.mjs'
      - 'showroom/globe/h-earth/terrain-estate-construction-v1/audralia-tablet-single-context-clouds-runtime.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/bt4/verify-world-diagnostic-entitlement.v1.mjs
            /preview/bt4/entitlement-v1/entitlement-engine.v1.mjs
            /.github/ai-router/publication-surfaces/audralia.json
            /showroom/globe/audralia/index.html
            /showroom/globe/audralia/fap1-orbital-support-tuning-v1.mjs
            /showroom/globe/audralia/loading-continuity-v3.css
            /showroom/globe/audralia/diagnostic/index.inspection.authority.js
            /showroom/globe/audralia/fap1-weather-presentation-v1.mjs
            /showroom/globe/audralia/startup-bootstrap-v2.mjs
            /showroom/globe/h-earth/terrain-estate-construction-v1/audralia-tablet-cloud-pass.mjs
            /showroom/globe/h-earth/terrain-estate-construction-v1/audralia-tablet-single-context-clouds-runtime.mjs
      - name: Verify real-object world/runtime and diagnostic entitlement invariants
        run: node research/bt4/verify-world-diagnostic-entitlement.v1.mjs
