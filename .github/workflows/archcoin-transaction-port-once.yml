name: ARCHCOIN transaction port once

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-port:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/archcoin-transactional-preservation-001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/archcoin-transactional-preservation-001
          fetch-depth: 0

      - name: Verify exact source identities
        run: |
          set -euo pipefail
          test "$(git hash-object products/archcoin/index.controller.js)" = "fbe137abe15780d61e5fab37f7b381b076c70d51"

      - name: Apply guarded patch
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          target = Path('products/archcoin/index.controller.js')
          patch = Path('products/archcoin/index.controller.transaction-port.patch')
          source = target.read_text(encoding='utf-8')
          lines = patch.read_text(encoding='utf-8').splitlines()
          hunks = []
          current = None
          for line in lines:
              if line == '@@':
                  if current is not None:
                      hunks.append(current)
                  current = []
              elif current is not None and not line.startswith('*** '):
                  current.append(line)
          if current is not None:
              hunks.append(current)
          cursor = 0
          for index, hunk in enumerate(hunks, 1):
              old_lines, new_lines = [], []
              for line in hunk:
                  if line.startswith(' '):
                      old_lines.append(line[1:]); new_lines.append(line[1:])
                  elif line.startswith('+'):
                      new_lines.append(line[1:])
                  elif line.startswith('-'):
                      old_lines.append(line[1:])
                  elif line == '':
                      old_lines.append(''); new_lines.append('')
                  else:
                      raise SystemExit(f'INVALID_PATCH_LINE:{index}:{line!r}')
              old = '\n'.join(old_lines)
              new = '\n'.join(new_lines)
              location = source.find(old, cursor)
              if location < 0:
                  location = source.find(old)
              if location < 0:
                  raise SystemExit(f'PATCH_CONTEXT_NOT_FOUND:{index}')
              source = source[:location] + new + source[location + len(old):]
              cursor = location + len(new)
          target.write_text(source, encoding='utf-8')
          PY

      - name: Capture syntax diagnostic
        id: syntax
        continue-on-error: true
        run: |
          set +e
          node --check products/archcoin/index.controller.js > archcoin-controller-syntax.log 2>&1
          status=$?
          cat archcoin-controller-syntax.log
          exit $status

      - name: Upload reconstructed controller diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archcoin-reconstructed-controller-diagnostic
          path: |
            products/archcoin/index.controller.js
            archcoin-controller-syntax.log
          if-no-files-found: error

      - name: Fail on syntax error
        if: steps.syntax.outcome == 'failure'
        run: exit 1
