name: H-Earth Current-Live Microrelief Exact-Head Validation v2

on:
  push:
    branches:
      - agent/h-earth-current-live-additive-terrain-microrelief-001
    paths:
      - .github/workflows/h-earth-current-live-microrelief-exact-head-validation-v2.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-microrelief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse exact product files as browser ES modules
        run: |
          node --input-type=module --check < showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-microrelief-v1.js
          node --input-type=module --check < showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js
          printf '%s\n' '{"javascriptSyntax":"PASS"}' > microrelief-validation-receipt.json

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Start exact-head server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/h-earth-microrelief-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/showroom/globe/h-earth/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/h-earth-microrelief-server.log
          exit 1

      - name: Compile shaders, link programs, render, and verify selection
        run: |
          cat > /tmp/verify-microrelief.cjs <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          const expected = {
            additive: '../../render/persistent-live-renderer.run8e-r3c.cp2-additive-microrelief-v1.js',
            cp2: '../../render/persistent-live-renderer.run8e-r3c.cp2-round1-1f520809.js',
            baseline: '../../render/persistent-live-renderer.run8e-r3c.js'
          };

          async function execute(browser, label, query, selectedPath, additiveRequested, cp2Requested) {
            const context = await browser.newContext({ viewport: { width: 1280, height: 720 } });
            const page = await context.newPage();
            const consoleErrors = [];
            const pageErrors = [];
            const requestFailures = [];
            page.on('console', message => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });
            page.on('pageerror', error => pageErrors.push(error.stack || error.message));
            page.on('requestfailed', request => requestFailures.push({
              url: request.url(),
              errorText: request.failure()?.errorText ?? null
            }));
            const url = `http://127.0.0.1:4173/showroom/globe/h-earth/${query}`;
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => {
              const root = document.getElementById('h-earth-functional-landscape-route');
              return root?.dataset?.run8eReady === 'true' &&
                typeof window.H_EARTH_RUN8E_PUBLIC_ROUTE?.getLiveGpuReceipt === 'function';
            }, null, { timeout: 120000 });
            const snapshot = await page.evaluate(() => {
              const root = document.getElementById('h-earth-functional-landscape-route');
              const canvas = document.getElementById('h-earth-functional-landscape-canvas');
              const receipt = window.H_EARTH_RUN8E_PUBLIC_ROUTE.getLiveGpuReceipt();
              const gl = canvas?.getContext?.('webgl2') ?? null;
              return {
                rootReady: root?.dataset?.run8eReady ?? null,
                rootError: root?.dataset?.run8eError ?? null,
                canvasPresent: canvas instanceof HTMLCanvasElement,
                webgl2ContextPresent: Boolean(gl),
                contextLost: gl?.isContextLost?.() ?? null,
                receipt
              };
            });
            const receipt = snapshot.receipt;
            const failures = [];
            if (response?.status() !== 200) failures.push(`HTTP_${response?.status()}`);
            if (snapshot.rootReady !== 'true' || snapshot.rootError === 'true') failures.push('RUNTIME_NOT_READY');
            if (!snapshot.canvasPresent || !snapshot.webgl2ContextPresent || snapshot.contextLost !== false) failures.push('WEBGL2_CONTEXT_INVALID');
            if (receipt?.selectedRendererPath !== selectedPath) failures.push('SELECTED_RENDERER_PATH_MISMATCH');
            if (receipt?.additiveVisualRequested !== additiveRequested) failures.push('ADDITIVE_REQUEST_STATE_MISMATCH');
            if (receipt?.liveDifferential?.requested !== cp2Requested) failures.push('CP2_REQUEST_STATE_MISMATCH');
            if (receipt?.resources?.counters?.shaderCompileCount !== 4) failures.push('SHADER_COMPILE_COUNT_MISMATCH');
            if (receipt?.resources?.counters?.programLinkCount !== 2) failures.push('PROGRAM_LINK_COUNT_MISMATCH');
            if (receipt?.resources?.counters?.contextCreationCount !== 1) failures.push('CONTEXT_COUNT_MISMATCH');
            if (receipt?.counters?.rendererInitializationCount !== 1) failures.push('RENDERER_INITIALIZATION_COUNT_MISMATCH');
            if ((receipt?.counters?.gpuFramebufferPresentationCount ?? 0) < 1) failures.push('NO_VISIBLE_FRAME');
            if (receipt?.resources?.packageUploadedOnce !== true) failures.push('PACKAGE_UPLOAD_INVARIANT_FAILED');
            if (receipt?.resources?.resourceIdentityStable !== true) failures.push('RESOURCE_IDENTITY_UNSTABLE');
            if (receipt?.resources?.noPostInitializationResourceCreation !== true) failures.push('POST_INIT_RESOURCE_CREATION');
            if (receipt?.resources?.noPostInitializationBufferUpload !== true) failures.push('POST_INIT_BUFFER_UPLOAD');
            const blockingConsoleErrors = consoleErrors.filter(text => !/favicon|404 \(File not found\)/i.test(text));
            const blockingRequestFailures = requestFailures.filter(item => !/favicon/i.test(item.url));
            if (pageErrors.length) failures.push(`PAGE_ERRORS:${JSON.stringify(pageErrors)}`);
            if (blockingConsoleErrors.length) failures.push(`CONSOLE_ERRORS:${JSON.stringify(blockingConsoleErrors)}`);
            if (blockingRequestFailures.length) failures.push(`REQUEST_FAILURES:${JSON.stringify(blockingRequestFailures)}`);
            const result = {
              label,
              url,
              httpStatus: response?.status() ?? null,
              selectedRendererPath: receipt?.selectedRendererPath ?? null,
              additiveVisualRequested: receipt?.additiveVisualRequested ?? null,
              cp2LiveDifferentialRequested: receipt?.liveDifferential?.requested ?? null,
              shaderCompileCount: receipt?.resources?.counters?.shaderCompileCount ?? null,
              programLinkCount: receipt?.resources?.counters?.programLinkCount ?? null,
              visibleFrames: receipt?.counters?.gpuFramebufferPresentationCount ?? null,
              context: receipt?.resources?.context ?? null,
              failures
            };
            await context.close();
            if (failures.length) throw new Error(`${label}:${failures.join('|')}`);
            return result;
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist', '--disable-dev-shm-usage']
            });
            const results = [];
            try {
              results.push(await execute(browser, 'DEFAULT_BASELINE', '', expected.baseline, false, false));
              results.push(await execute(browser, 'CP2_DIFFERENTIAL', '?cp2=round1-1f520809', expected.cp2, false, true));
              results.push(await execute(browser, 'ADDITIVE_MICRORELIEF', '?visual=terrain-microrelief-v1', expected.additive, true, false));
              results.push(await execute(browser, 'ADDITIVE_PRECEDENCE', '?cp2=round1-1f520809&visual=terrain-microrelief-v1', expected.additive, true, true));
            } finally {
              await browser.close();
            }
            const receipt = {
              receiptType: 'H_EARTH_CURRENT_LIVE_ADDITIVE_TERRAIN_MICRORELIEF_EXACT_HEAD_VALIDATION_v1',
              result: 'PASS',
              workflowRunId: process.env.GITHUB_RUN_ID,
              validationHead: process.env.GITHUB_SHA,
              javascriptSyntax: 'PASS',
              shaderCompile: 'PASS',
              shaderLink: 'PASS',
              selectorPrecedence: 'PASS',
              defaultSelectionPreserved: 'PASS',
              results,
              timestamp: new Date().toISOString()
            };
            fs.writeFileSync('microrelief-validation-receipt.json', JSON.stringify(receipt, null, 2) + '\n');
            console.log(JSON.stringify(receipt, null, 2));
          })().catch(error => {
            const receipt = {
              receiptType: 'H_EARTH_CURRENT_LIVE_ADDITIVE_TERRAIN_MICRORELIEF_EXACT_HEAD_VALIDATION_v1',
              result: 'FAIL',
              workflowRunId: process.env.GITHUB_RUN_ID,
              validationHead: process.env.GITHUB_SHA,
              javascriptSyntax: 'PASS',
              error: error.stack || error.message || String(error),
              timestamp: new Date().toISOString()
            };
            fs.writeFileSync('microrelief-validation-receipt.json', JSON.stringify(receipt, null, 2) + '\n');
            console.error(JSON.stringify(receipt, null, 2));
            process.exit(1);
          });
          NODE
          node /tmp/verify-microrelief.cjs

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-current-live-microrelief-exact-head-validation-v2
          path: |
            microrelief-validation-receipt.json
            /tmp/h-earth-microrelief-server.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish receipt to PR 524
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Exact-head terrain microrelief validation v2'
            echo
            echo "Workflow run: \`${GITHUB_RUN_ID}\`"
            echo
            echo "Validation head: \`${GITHUB_SHA}\`"
            echo
            echo '```json'
            cat microrelief-validation-receipt.json 2>/dev/null || printf '%s\n' '{"result":"FAIL","error":"VALIDATION_RECEIPT_MISSING"}'
            echo '```'
          } > /tmp/microrelief-comment.md
          gh pr comment 524 --body-file /tmp/microrelief-comment.md
