name: Characters Vegetation V4 Ground Understory Qualification v1

on:
  push:
    branches:
      - 'characters/ground-understory-continuity-20260905-009'
    paths:
      - 'characters/forest-system.mjs'
      - 'control-plane/whole-estate/characters-reconstruction-v1/vegetation-v4-ground-understory-contract.v1.json'
      - 'control-plane/whole-estate/characters-reconstruction-v1/verify-vegetation-v4-ground-understory.v1.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'characters/forest-system.mjs'
      - 'control-plane/whole-estate/characters-reconstruction-v1/vegetation-v4-ground-understory-contract.v1.json'
      - 'control-plane/whole-estate/characters-reconstruction-v1/verify-vegetation-v4-ground-understory.v1.mjs'

permissions:
  contents: read

jobs:
  qualify-mechanical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify V4 ground and understory mechanical boundary
        run: node control-plane/whole-estate/characters-reconstruction-v1/verify-vegetation-v4-ground-understory.v1.mjs --output "$RUNNER_TEMP/vegetation-v4-ground-understory-receipt.json"
      - name: Require mechanical pass without false material closure
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.mechanicalFailCount == 0 and .canonicalPopulationCount == 818 and .groundPopulationCount > 0 and .materialEvidenceRequired == true and .mergeDeploymentPublicationAuthorized == false and .v5PlusAuthorized == false and (.result == "V4_MECHANICAL_PASS_MATERIAL_PENDING" or .result == "GROUND_AND_UNDERSTORY_CONTINUITY_PASS")' "$RUNNER_TEMP/vegetation-v4-ground-understory-receipt.json" >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vegetation-v4-ground-understory-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vegetation-v4-ground-understory-receipt.json
          if-no-files-found: error
          retention-days: 90
