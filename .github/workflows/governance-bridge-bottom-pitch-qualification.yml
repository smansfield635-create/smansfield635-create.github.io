name: Governance Bridge Bottom Pitch Qualification
on:
  workflow_dispatch:
    inputs:
      candidate_sha: {description: Exact candidate SHA, required: true, type: string}
      base_sha: {description: Exact comparison base SHA, required: true, type: string}
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.candidate_sha }}', fetch-depth: 1}
      - name: Prove one product path
        env: {BASE_SHA: '${{ inputs.base_sha }}'}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" HEAD >/tmp/files
          test "$(wc -l </tmp/files)" -eq 1
          grep -Fxq governance-bridge/index.html /tmp/files
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/gb-pitch-http.log 2>&1 &
      - name: Render and qualify lower carousel
        run: |
          mkdir -p .qualification/governance-bridge-bottom-pitch
          cat >.qualification/governance-bridge-bottom-pitch/inspect.mjs <<'NODE'
          import{chromium}from'playwright';import fs from'node:fs';
          const browser=await chromium.launch({headless:true}),vps={desktop:{width:1440,height:1100},tablet:{width:900,height:1000},phone:{width:390,height:844}},receipt={};
          for(const[name,viewport]of Object.entries(vps)){const page=await browser.newPage({viewport}),errs=[];page.on('pageerror',e=>errs.push(String(e)));await page.goto('http://127.0.0.1:4173/governance-bridge/',{waitUntil:'networkidle'});const cards=page.locator('#pitchRail .pitchCard');if(await cards.count()!=6)throw Error(name+': six pitch cards required');receipt[name]=[];
          for(let i=0;i<6;i++){if(i){await page.locator('#pitchRail').focus();await page.keyboard.press('ArrowRight');await page.waitForTimeout(450)}const active=page.locator('#pitchRail .pitchCard[aria-current=true]');if(await active.count()!=1)throw Error(name+' '+i+': one active pitch card required');const geometry=[];for(let n=0;n<6;n++){geometry.push(await cards.nth(n).evaluate(el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return{index:n,active:el.getAttribute('aria-current')==='true',offsetHeight:el.offsetHeight,computedHeight:s.height,transform:s.transform,renderedWidth:Math.round(r.width),renderedHeight:Math.round(r.height),visible:r.width>0&&r.height>0&&s.visibility!=='hidden'&&s.display!=='none'}}))}console.log('PITCH_CARD_GEOMETRY',name,i,JSON.stringify(geometry));const layoutHeights=geometry.map(x=>x.offsetHeight);if(new Set(layoutHeights).size>1)throw Error(name+' '+i+': inconsistent layout card heights '+layoutHeights);if(geometry.filter(x=>x.active).length!==1)throw Error(name+' '+i+': geometry active cardinality');const activeGeometry=geometry.find(x=>x.active);if(!activeGeometry.visible)throw Error(name+' '+i+': active card not visible');const neighbors=geometry.filter(x=>Math.abs(x.index-i)===1);if(neighbors.some(x=>!x.visible))throw Error(name+' '+i+': adjacent neighbor not visible');const h=active.locator('h3'),cta=active.locator('.pitchOpen'),setup=active.locator('.pitchSetup');if(await cta.isHidden())throw Error(name+' '+i+': OPEN PITCH hidden');for(const el of[h,cta,setup]){const b=await el.boundingBox(),p=await active.boundingBox();if(!b||!p||b.y<p.y-1||b.y+b.height>p.y+p.height+1)throw Error(name+' '+i+': card content clipped')}const ov=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(ov>2)throw Error(name+' '+i+': horizontal overflow '+ov);await active.screenshot({path:'.qualification/governance-bridge-bottom-pitch/'+name+'-'+i+'-card.png'});await active.click();await page.waitForTimeout(120);const r=page.locator('#pitchReader');if(await r.isHidden())throw Error(name+' '+i+': pitch reader did not open');for(const key of['problem','what','why','outcome'])if(await r.locator('[data-pitch-region='+key+']').count()!=1)throw Error(name+' '+i+': missing '+key);if(await r.locator('[data-pitch-region]').count()!=4)throw Error(name+' '+i+': exactly four pitch regions required');await r.screenshot({path:'.qualification/governance-bridge-bottom-pitch/'+name+'-'+i+'-reader.png'});await page.locator('#closePitchReader').click();await page.waitForTimeout(60);if(!(await active.evaluate(el=>el===document.activeElement)))throw Error(name+' '+i+': Return did not restore source focus');await active.click();await page.keyboard.press('Escape');await page.waitForTimeout(60);if(!(await active.evaluate(el=>el===document.activeElement)))throw Error(name+' '+i+': Escape did not restore source focus');receipt[name].push({industry:i,layoutHeight:activeGeometry.offsetHeight,renderedHeight:activeGeometry.renderedHeight,overflow:ov,geometry})}
          const upper=page.locator('#topRail .card[aria-current=true]');await upper.click();if(await page.locator('.readerFace.practical .infoTabs [role=tab]').count()!=5)throw Error(name+': upper reader regression');await page.locator('.readerFace.practical .closeReader').click();if(errs.length)throw Error(name+': '+errs.join('|'));await page.close()}await browser.close();fs.writeFileSync('.qualification/governance-bridge-bottom-pitch/receipt.json',JSON.stringify({result:'PASS',contract:'#4721',receipt},null,2));
          NODE
          node .qualification/governance-bridge-bottom-pitch/inspect.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'governance-bridge-bottom-pitch-${{ github.run_id }}-${{ github.run_attempt }}', path: .qualification/governance-bridge-bottom-pitch, retention-days: 30}
