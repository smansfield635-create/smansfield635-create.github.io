name: Compass Award Presentation + Gen1538 Continuity

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/compass/compass.css'
      - 'assets/compass/compass.statement-carousel.js'
      - 'assets/compass/compass.statement-carousel.css'
      - 'assets/compass/compass.capability-carousel.js'
      - 'assets/compass/compass.capability-carousel.css'
      - 'assets/compass/compass.controller.js'
      - 'assets/compass/compass.crystals.js'
      - 'assets/compass/compass.laws-spacecraft.js'
      - 'assets/compass/compass.cosmos.js'
      - '.github/ai-router/projects/compass/verify-award-presentation-successor.v1.mjs'
      - '.github/workflows/compass-display-continuity-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPASS_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  COMPASS_AWARD_BASE_SHA: 4e2ab91a18ab6a36fd47b83f794267a896d86fde
  COMPASS_AWARD_STATIC_OUTPUT: /tmp/compass-award-presentation-static-receipt.json

jobs:
  exact-candidate-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMPASS_CANDIDATE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact award candidate and permanent Gen1538 invariants
        run: |
          test "$(git rev-parse HEAD^{commit})" = "$COMPASS_CANDIDATE_HEAD"
          node --check assets/compass/compass.statement-carousel.js
          node --check assets/compass/compass.capability-carousel.js
          node --check assets/compass/compass.controller.js
          node --check assets/compass/compass.crystals.js
          node --check assets/compass/compass.laws-spacecraft.js
          node --check .github/ai-router/projects/compass/verify-award-presentation-successor.v1.mjs
          node .github/ai-router/projects/compass/verify-award-presentation-successor.v1.mjs
          jq -e '.result == "PASS_CLOSED" and .lockGeneration == 1549 and .candidateHead == env.COMPASS_CANDIDATE_HEAD' "$COMPASS_AWARD_STATIC_OUTPUT" >/dev/null
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const controller=fs.readFileSync('assets/compass/compass.controller.js','utf8');
          const crystals=fs.readFileSync('assets/compass/compass.crystals.js','utf8');
          const spacecraft=fs.readFileSync('assets/compass/compass.laws-spacecraft.js','utf8');
          const statement=fs.readFileSync('assets/compass/compass.statement-carousel.js','utf8');
          const checks=[];
          const check=(id,pass,evidence)=>checks.push({id,pass:Boolean(pass),evidence});
          check('GEN1538_ROOM_SELECTED_STATE_PRESENT',controller.includes('ROOM_SELECTED'),controller.includes('ROOM_SELECTED'));
          check('GEN1538_ROOM_SELECTED_MANIPULABLE',/manipulationStates\s*:\s*Object\.freeze\(\[\s*STATES\.CLUSTER_OPEN,\s*STATES\.ROOM_SELECTED/s.test(controller),'CLUSTER_ORBIT includes ROOM_SELECTED');
          check('GEN1538_DRAG_DOES_NOT_DESCEND_PANEL',/dragCommitDescendsPanel\s*:\s*false/.test(controller),'dragCommitDescendsPanel=false');
          check('GEN1538_CRYSTALS_ROOM_SELECTED_AWARE',crystals.includes('ROOM_SELECTED'),'crystals contains ROOM_SELECTED');
          check('GEN1538_LOCAL_SPACECRAFT_DISABLED',spacecraft.includes('DGB_COMPASS_DISABLE_LOCAL_SPACECRAFT=true'),'local spacecraft disabled');
          check('GEN1538_LAWS_SPACECRAFT_SOURCE',spacecraft.includes("import('/laws/index.spacecraft.background.js"),'Laws spacecraft imported');
          check('GEN1538_LAWS_SPACECRAFT_STARTED',spacecraft.includes('api?.start?.()'),'Laws spacecraft start invoked');
          check('GEN1538_SOLE_PRESENTATION_AUTHORITY',statement.includes("spacecraftPresentationAuthority='LAWS_SPACECRAFT_ONLY'"),'statement owner delegates to Laws adapter');
          check('GEN1538_OBSOLETE_WORLD_INTERACTION_ABSENT',!statement.includes('mountWorldInteraction'),'obsolete statement scene interaction absent');
          const failures=checks.filter(x=>!x.pass);
          const receipt={schema:'COMPASS_GEN1538_PERMANENT_INVARIANT_RECEIPT_v1',candidateHead:process.env.COMPASS_CANDIDATE_HEAD,result:failures.length?'FAIL_CLOSED':'PASS_CLOSED',checks,failures:failures.map(x=>x.id)};
          fs.writeFileSync('/tmp/compass-gen1538-permanent-invariants.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          if(failures.length)process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-award-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/compass-award-presentation-static-receipt.json
            /tmp/compass-gen1538-permanent-invariants.json
          retention-days: 90

  runtime-and-visual:
    runs-on: ubuntu-latest
    needs: exact-candidate-static
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMPASS_CANDIDATE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Host exact candidate
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/compass-award-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Qualify award presentation and permanent Gen1538 continuity
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const checks=[];
          const check=(id,pass,evidence)=>checks.push({id,pass:Boolean(pass),evidence});
          const cases=[['desktop',1440,1000,false],['tablet',820,1180,false],['phone',390,844,false],['reduced',390,844,true]];
          try {
            for(const [name,width,height,reduced] of cases){
              const context=await browser.newContext({viewport:{width,height},reducedMotion:reduced?'reduce':'no-preference'});
              const page=await context.newPage();
              const errors=[];page.on('pageerror',e=>errors.push(String(e)));
              await page.goto(`http://127.0.0.1:4173/?candidate=${process.env.COMPASS_CANDIDATE_HEAD}&lawsSpacecraftTest=1`,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForFunction(()=>Boolean(globalThis.CompassStatementCarousel&&globalThis.DGB_COMPASS_CONTROLLER&&globalThis.DGB_COMPASS_CRYSTALS_RECEIPT&&globalThis.DGB_LAWS_SPACECRAFT),null,{timeout:30000});
              await page.waitForTimeout(1000);
              const presentation=await page.evaluate(()=>{
                const root=document.querySelector('[data-compass-root]');
                const instrument=document.querySelector('.compass-instrument');
                const purpose=document.querySelector('.compass-purpose-stage');
                const capability=document.querySelector('[data-capability-orbit], [data-compass-capability-switcher]');
                const readiness=document.querySelector('[data-readiness-stage="trl-tra"]');
                const evidence=document.querySelector('[data-evidence-registry-exit]');
                const tra=document.querySelector('[data-tra-boundary="assessment-not-level"]');
                const all=[instrument,purpose,capability,readiness].map(el=>el?{top:el.getBoundingClientRect().top+scrollY,tag:el.className}:null);
                return {
                  narrative:root?.dataset.awardNarrative||'',
                  readinessModel:root?.dataset.readinessModel||'',
                  spacecraftAuthority:root?.dataset.spacecraftPresentationAuthority||'',
                  purposeOpen:Boolean(purpose?.open),
                  order:all,
                  tra:tra?.textContent.trim()||'',
                  evidenceHref:evidence?.getAttribute('href')||'',
                  overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                  capabilityCards:document.querySelectorAll('[data-capability-orbit] .compass-orbit-plaque').length,
                  proofCards:document.querySelectorAll('[data-proof-orbit] [data-proof-card]').length
                };
              });
              const tops=presentation.order.map(x=>x?.top??Infinity);
              check(`${name}_NARRATIVE_ORDER`,presentation.narrative==='identity-experience-purpose-system-readiness-evidence'&&tops[0]<tops[1]&&tops[1]<tops[2]&&tops[2]<tops[3],presentation);
              check(`${name}_PURPOSE_FIRST_READ`,presentation.purposeOpen,presentation);
              check(`${name}_TRL_TRA_BOUNDARY`,presentation.readinessModel==='TRL7_PLUS_TRA_ASSESSMENT_NO_SCORE'&&presentation.tra.includes('not a second maturity score')&&presentation.tra.includes('does not raise Software TRL 7'),presentation);
              check(`${name}_EVIDENCE_EXIT`,presentation.evidenceHref==='/evidence/',presentation);
              check(`${name}_NO_HORIZONTAL_OVERFLOW`,presentation.overflow<=1,presentation);
              check(`${name}_DIMENSIONAL_STAGE_PRESENT`,presentation.capabilityCards===3&&presentation.proofCards===3,presentation);
              check(`${name}_SOLE_SPACECRAFT_PRESENTATION_AUTHORITY`,presentation.spacecraftAuthority==='LAWS_SPACECRAFT_ONLY',presentation);

              const selected=await page.evaluate(()=>{
                const api=globalThis.DGB_COMPASS_CONTROLLER;
                const root=document.querySelector('[data-compass-root]');
                const beforeScroll=scrollY;
                const cardinal=api.requestCardinalSelection('east');
                const roomSelected=api.requestRoomSelection('east-1');
                return {cardinal,roomSelected,beforeScroll,mode:root?.dataset.compassMode,quat:root?.dataset.clusterQuaternion||'',revision:Number(root?.dataset.clusterRevision||0)};
              });
              await page.waitForTimeout(reduced?250:750);
              const selectedAfter=await page.evaluate(()=>{const root=document.querySelector('[data-compass-root]');return{mode:root?.dataset.compassMode,quat:root?.dataset.clusterQuaternion||'',revision:Number(root?.dataset.clusterRevision||0),scrollY}});
              check(`${name}_ROOM_SELECTED_REACHED`,selected.cardinal&&selected.roomSelected&&selectedAfter.mode==='ROOM_SELECTED',{selected,selectedAfter});
              check(`${name}_NO_FORCED_PANEL_DESCENT`,Math.abs(selectedAfter.scrollY-selected.beforeScroll)<40,{selected,selectedAfter});

              const proxy=await page.locator('[data-compass-room-proxy][data-room-id="east-1"]').first().boundingBox();
              if(proxy){
                const sx=proxy.x+proxy.width/2,sy=proxy.y+proxy.height/2;
                await page.mouse.move(sx,sy);await page.mouse.down();
                await page.waitForTimeout(120);
                await page.mouse.move(sx+70,sy+28,{steps:12});
                await page.waitForTimeout(180);
                await page.mouse.up();
                await page.waitForTimeout(reduced?180:650);
              }
              const dragged=await page.evaluate(()=>{const root=document.querySelector('[data-compass-root]');return{mode:root?.dataset.compassMode,quat:root?.dataset.clusterQuaternion||'',revision:Number(root?.dataset.clusterRevision||0),gesture:globalThis.DGB_COMPASS_CRYSTALS_RECEIPT?.lastGestureType||''}});
              check(`${name}_POST_SELECTION_DRAG`,Boolean(proxy)&&dragged.mode==='ROOM_SELECTED'&&(reduced||dragged.quat!==selectedAfter.quat),{proxy,selectedAfter,dragged});
              if(!reduced)check(`${name}_POINTER_GESTURE_RECOGNIZED`,['cluster-drag','cluster-settle'].includes(dragged.gesture),dragged);

              const spacecraft=await page.evaluate(async reduced=>{
                const api=globalThis.DGB_LAWS_SPACECRAFT;
                if(!api)return{present:false};
                const receipt=api.receipt?.();
                const a=api.snapshot?.();
                if(!reduced)await new Promise(r=>setTimeout(r,420));
                const b=api.snapshot?.();
                return{present:true,receipt,a,b};
              },reduced);
              check(`${name}_SPACECRAFT_AUTHORITY`,spacecraft.present&&spacecraft.receipt?.ownsNavigation===false&&spacecraft.receipt?.ownsControllerState===false&&spacecraft.receipt?.ownsRoutes===false&&spacecraft.receipt?.ownsCompassInteraction===false,spacecraft.receipt);
              if(reduced)check(`${name}_SPACECRAFT_REDUCED_MOTION`,spacecraft.receipt?.reducedMotion===true&&spacecraft.receipt?.running===false,spacecraft.receipt);
              else check(`${name}_SPACECRAFT_FLIGHT`,spacecraft.receipt?.running===true&&JSON.stringify(spacecraft.a?.craft?.position||[])!==JSON.stringify(spacecraft.b?.craft?.position||[]),spacecraft);
              check(`${name}_NO_PAGE_ERRORS`,errors.length===0,errors);
              await page.screenshot({path:`/tmp/compass-award-${name}.png`,fullPage:true});
              await context.close();
            }
          } finally {await browser.close();}
          const failures=checks.filter(x=>!x.pass);
          const runtime={schema:'COMPASS_AWARD_PRESENTATION_RUNTIME_RECEIPT_v1',operationId:'COMPASS_AWARD_PRESENTATION_SUCCESSOR_20260818_v3',lockGeneration:1549,candidateHead:process.env.COMPASS_CANDIDATE_HEAD,result:failures.length?'FAIL_CLOSED':'PASS_CLOSED',checks,failures:failures.map(x=>x.id)};
          const visualChecks=checks.filter(x=>/NARRATIVE_ORDER|PURPOSE_FIRST_READ|TRL_TRA_BOUNDARY|EVIDENCE_EXIT|NO_HORIZONTAL_OVERFLOW|DIMENSIONAL_STAGE_PRESENT|SOLE_SPACECRAFT_PRESENTATION_AUTHORITY|NO_PAGE_ERRORS/.test(x.id));
          const visualFailures=visualChecks.filter(x=>!x.pass);
          const visual={schema:'COMPASS_AWARD_PRESENTATION_VISUAL_RECEIPT_v1',operationId:runtime.operationId,lockGeneration:1549,candidateHead:runtime.candidateHead,result:visualFailures.length?'FAIL_CLOSED':'PASS_CLOSED',checks:visualChecks,failures:visualFailures.map(x=>x.id),captures:cases.map(([name])=>`/tmp/compass-award-${name}.png`)};
          fs.writeFileSync('/tmp/compass-award-presentation-runtime-receipt.json',JSON.stringify(runtime,null,2)+'\n');
          fs.writeFileSync('/tmp/compass-award-presentation-visual-receipt.json',JSON.stringify(visual,null,2)+'\n');
          console.log(JSON.stringify({runtime:runtime.result,visual:visual.result,failures},null,2));
          if(failures.length)process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-award-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/compass-award-presentation-runtime-receipt.json
            /tmp/compass-award-presentation-visual-receipt.json
            /tmp/compass-award-*.png
            /tmp/compass-award-http.log
          retention-days: 90
