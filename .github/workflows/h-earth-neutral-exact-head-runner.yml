name: H-Earth Neutral Exact Head Runner

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact candidate SHA to execute unchanged
        required: true
        type: string
      route_query:
        description: Optional query string without leading question mark
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1

      - name: Require exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.target_sha }}"

      - name: Install bounded Chromium
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Execute actual H-Earth route unchanged
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          ROUTE_QUERY: ${{ inputs.route_query }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . >/tmp/h-earth-exact-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            curl --fail --silent "http://127.0.0.1:4173/showroom/globe/h-earth/" >/dev/null && break
            sleep 1
          done
          mkdir -p /tmp/h-earth-exact-evidence
          cat > h-earth-exact-run.mjs <<'NODE'
          import fs from 'node:fs/promises';
          import crypto from 'node:crypto';
          import { chromium } from 'playwright';

          const out='/tmp/h-earth-exact-evidence';
          const targetSha=process.env.TARGET_SHA;
          const query=String(process.env.ROUTE_QUERY||'').replace(/^\?/, '');
          const route='/showroom/globe/h-earth/'+(query?'?'+query:'');
          const url='http://127.0.0.1:4173'+route;
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1280,height:800},deviceScaleFactor:1});
          const page=await context.newPage();
          await page.addInitScript(() => {
            const proto=WebGL2RenderingContext.prototype;
            const originalGetUniformLocation=proto.getUniformLocation;
            const originalUniform1f=proto.uniform1f;
            const oceanLocations=new WeakSet();
            window.__H_EARTH_OCEAN_PHASE_WRITES=[];
            window.__H_EARTH_LAST_NON_NULL_FRAMEBUFFER=null;
            const originalBindFramebuffer=proto.bindFramebuffer;
            proto.bindFramebuffer=function(target,framebuffer){
              if(framebuffer&&target===this.FRAMEBUFFER) window.__H_EARTH_LAST_NON_NULL_FRAMEBUFFER=framebuffer;
              return originalBindFramebuffer.call(this,target,framebuffer);
            };
            proto.getUniformLocation=function(program,name){
              const location=originalGetUniformLocation.call(this,program,name);
              if(name==='uOceanPresentationPhase'&&location) oceanLocations.add(location);
              return location;
            };
            proto.uniform1f=function(location,value){
              if(location&&oceanLocations.has(location)){
                window.__H_EARTH_OCEAN_PHASE_WRITES.push(Number(value));
                if(window.__H_EARTH_OCEAN_PHASE_WRITES.length>256) window.__H_EARTH_OCEAN_PHASE_WRITES.shift();
              }
              return originalUniform1f.call(this,location,value);
            };
          });
          const pageErrors=[];
          const consoleErrors=[];
          const requestsFailed=[];
          const responses=[];
          page.on('pageerror',e=>pageErrors.push(e.message));
          page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
          page.on('requestfailed',r=>requestsFailed.push({url:r.url(),failure:r.failure()}));
          page.on('response',r=>responses.push({url:r.url(),status:r.status(),contentType:r.headers()['content-type']||null}));

          const sample=async label => {
            const state=await page.evaluate(() => {
              const text=document.body?.innerText||'';
              const renderer=window.H_EARTH_3D_RENDERER??null;
              const contract=window.H_EARTH_3D_RENDERER_CONTRACT??null;
              const globals={};
              for(const key of Object.keys(window)){
                if(/H_EARTH/i.test(key)&&/(FRAME|ANIM|REBUILD|RENDERER|WORLD)/i.test(key)){
                  const value=window[key];
                  if(['string','number','boolean'].includes(typeof value)||value===null) globals[key]=value;
                }
              }
              const liveGpuReceipt=window.H_EARTH_RUN8E_PUBLIC_ROUTE?.getLiveGpuReceipt?.()??null;
              return {
                title:document.title,
                bodyText:text.slice(0,3000),
                finalUrl:location.href,
                canvasPresent:document.getElementById('h-earth-functional-landscape-canvas') instanceof HTMLCanvasElement,
                canvasPresentation:(() => {
                  const canvas=document.getElementById('h-earth-functional-landscape-canvas');
                  if(!(canvas instanceof HTMLCanvasElement)) return null;
                  const style=getComputedStyle(canvas);
                  const rect=canvas.getBoundingClientRect();
                  const gl=canvas.getContext('webgl2');
                  let framebufferPixelHash=null;
                  if(gl&&canvas.width>0&&canvas.height>0){
                    const width=Math.min(canvas.width,256),height=Math.min(canvas.height,256);
                    const pixels=new Uint8Array(width*height*4);
                    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
                    gl.readPixels(0,0,width,height,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
                    let hash=2166136261;
                    for(const byte of pixels){hash^=byte;hash=Math.imul(hash,16777619)>>>0;}
                    framebufferPixelHash='fnv1a32:'+hash.toString(16).padStart(8,'0');
                  }
                  let rendererFramebufferPixelHash=null;
                  const owned=window.__H_EARTH_LAST_NON_NULL_FRAMEBUFFER;
                  if(gl&&owned&&canvas.width>0&&canvas.height>0){
                    const width=Math.min(canvas.width,256),height=Math.min(canvas.height,256);
                    const pixels=new Uint8Array(width*height*4);
                    gl.bindFramebuffer(gl.FRAMEBUFFER,owned);
                    gl.finish();
                    gl.readPixels(0,0,width,height,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
                    let hash=2166136261;
                    for(const byte of pixels){hash^=byte;hash=Math.imul(hash,16777619)>>>0;}
                    rendererFramebufferPixelHash='fnv1a32:'+hash.toString(16).padStart(8,'0');
                    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
                  }
                  return {display:style.display,visibility:style.visibility,opacity:style.opacity,zIndex:style.zIndex,width:rect.width,height:rect.height,top:rect.top,left:rect.left,connected:canvas.isConnected,framebufferPixelHash,rendererFramebufferPixelHash};
                })(),
                routeReady:document.getElementById('h-earth-functional-landscape-route')?.dataset.run8eReady??null,
                startupReceipt:window.H_EARTH_RENDERER_STARTUP_DIAGNOSTICS?.getReceipt?.()??null,
                oceanPhaseWrites:(window.__H_EARTH_OCEAN_PHASE_WRITES??[]).slice(-32),
                rendererModel:renderer?.outputModel??contract?.outputModel??null,
                rendererVariant:renderer?.variant??renderer?.rendererVariant??contract?.variant??contract?.rendererVariant??null,
                selectedRendererPath:liveGpuReceipt?.selectedRendererPath??null,
                oceanPresentationRequested:liveGpuReceipt?.oceanPresentationRequested??null,
                animationRunning:liveGpuReceipt?.animation?.running??null,
                animationFrame:liveGpuReceipt?.counters?.animationFrameCount ?? renderer?.animationFrame ?? renderer?.frameCount ?? contract?.animationFrame ?? contract?.frameCount ?? globals.H_EARTH_ANIMATION_FRAME ?? globals.H_EARTH_FRAME_COUNT ?? null,
                renderFrameCallCount:liveGpuReceipt?.counters?.renderFrameCallCount??null,
                gpuFramebufferPresentationCount:liveGpuReceipt?.counters?.gpuFramebufferPresentationCount??null,
                worldRebuildCount:liveGpuReceipt?.counters?.worldRebuildCount ?? renderer?.worldRebuildCount ?? contract?.worldRebuildCount ?? globals.H_EARTH_WORLD_REBUILD_COUNT ?? null,
                liveGpuReceipt,
                globals
              };
            });
            const screenshot=label+'.png';
            await page.screenshot({path:out+'/'+screenshot,fullPage:true});
            const bytes=await fs.readFile(out+'/'+screenshot);
            const canvas=page.locator('#h-earth-functional-landscape-canvas');
            const canvasScreenshot=label+'-canvas.png';
            let canvasScreenshotSha256=null;
            let canvasBox=null;
            if(await canvas.count()){
              canvasBox=await canvas.boundingBox();
              await canvas.screenshot({path:out+'/'+canvasScreenshot});
              const canvasBytes=await fs.readFile(out+'/'+canvasScreenshot);
              canvasScreenshotSha256=crypto.createHash('sha256').update(canvasBytes).digest('hex');
            }
            return {...state,screenshot,screenshotSha256:crypto.createHash('sha256').update(bytes).digest('hex'),canvasScreenshot,canvasScreenshotSha256,canvasBox};
          };

          let readiness='TIMEOUT';
          let initial=null;
          let later=null;
          try {
            await page.goto(url,{waitUntil:'networkidle',timeout:180000});
            readiness=await page.waitForFunction(() => {
              const text=document.body?.innerText||'';
              const liveGpuReceipt=window.H_EARTH_RUN8E_PUBLIC_ROUTE?.getLiveGpuReceipt?.()??null;
              const activeLiveGpu=Boolean(
                liveGpuReceipt?.selectedRendererPath &&
                liveGpuReceipt?.animation?.running===true &&
                Number(liveGpuReceipt?.counters?.gpuFramebufferPresentationCount)>0
              );
              if(activeLiveGpu) return 'READY';
              if(/Initialization failed\.|RENDERER_CONSTRUCTION_EXCEPTION/.test(text)) return 'FAILED';
              const initializing=/H-EARTH · LIVE WORLD INITIALIZATION|Constructing world renderer|Entering the coast\./i.test(text);
              const live=/LIVE ENVIRONMENT/i.test(text)&&/H_EARTH_GROUND_CELL_001:[A-Z0-9:]+/i.test(text);
              const mounted=window.H_EARTH_3D_RENDERER!=null||window.H_EARTH_3D_RENDERER_CONTRACT!=null||/RENDERER_MOUNTED|Entering complete|World ready|Initialization complete/i.test(text)||(!initializing&&live);
              return mounted?'READY':false;
            },null,{timeout:120000}).then(h=>h.jsonValue()).catch(()=> 'TIMEOUT');
            initial=await sample('initial');
            await page.waitForTimeout(3000);
            later=await sample('later');
          } finally {
            await context.close();
            await browser.close();
          }
          const receipt={
            schema:'H_EARTH_NEUTRAL_EXACT_HEAD_RUNNER_v1',
            targetSha,
            route,
            url,
            exactHeadRequired:true,
            productMaterialization:['EXACT_CHECKED_OUT_REPOSITORY_ROOT'],
            substitutionsPerformed:false,
            actualBrowserExecution:true,
            readinessDiagnostic:readiness,
            materialized:Boolean(initial?.canvasPresent&&later?.canvasPresent),
            pageErrors,
            consoleErrors,
            requestsFailed,
            responses,
            initial,
            later,
            screenshotChanged:Boolean(initial&&later&&initial.screenshotSha256!==later.screenshotSha256),
            canvasScreenshotChanged:Boolean(initial?.canvasScreenshotSha256&&later?.canvasScreenshotSha256&&initial.canvasScreenshotSha256!==later.canvasScreenshotSha256),
            framebufferPixelChanged:Boolean(initial?.canvasPresentation?.framebufferPixelHash&&later?.canvasPresentation?.framebufferPixelHash&&initial.canvasPresentation.framebufferPixelHash!==later.canvasPresentation.framebufferPixelHash),
            rendererFramebufferPixelChanged:Boolean(initial?.canvasPresentation?.rendererFramebufferPixelHash&&later?.canvasPresentation?.rendererFramebufferPixelHash&&initial.canvasPresentation.rendererFramebufferPixelHash!==later.canvasPresentation.rendererFramebufferPixelHash),
            animationFrameAdvanced:Number.isFinite(initial?.animationFrame)&&Number.isFinite(later?.animationFrame)?later.animationFrame>initial.animationFrame:null,
            worldRebuildStayedZero:initial?.worldRebuildCount===0&&later?.worldRebuildCount===0?true:(initial?.worldRebuildCount==null&&later?.worldRebuildCount==null?null:false)
          };
          await fs.writeFile(out+'/receipt.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          if(!receipt.materialized||pageErrors.length||consoleErrors.length||requestsFailed.length) process.exitCode=1;
          NODE
          node h-earth-exact-run.mjs

      - name: Upload exact-head runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-neutral-exact-head-${{ inputs.target_sha }}
          path: |
            /tmp/h-earth-exact-evidence
            /tmp/h-earth-exact-server.log
          if-no-files-found: error
          retention-days: 30
