name: H-Earth Repository Registry User Acceptance Recording

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  record-user-acceptance:
    if: github.head_ref == 'agent/h-earth-repository-registry-user-acceptance-001'
    runs-on: ubuntu-latest
    steps:
      - name: Check out installation branch
        uses: actions/checkout@v4
        with:
          ref: agent/h-earth-repository-registry-installation-001
          fetch-depth: 0

      - name: Record explicit user acceptance
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');

          const bootstrapPath = 'h-earth-3d/registry/h-earth.repository-registry.bootstrap.json';
          const completionPath = 'h-earth-3d/registry/h-earth.repository-registry.target-4f-completion-receipt.json';
          const declarationPath = 'h-earth-3d/registry/finalization/h-earth.repository-registry.user-acceptance-declaration.json';
          const custodyPath = 'h-earth-3d/registry/h-earth.repository-registry.user-acceptance-custody-receipt.json';
          const expectedMain = '3890dfc7165ae3481cd119d1f9c935e93c336f17';
          const acceptedPackageHead = '3808b79e2743128ab25e6200a5c636d72451262f';
          const expectedCompletionBlob = '22a997a1082ecc4b7c9c9b35d1675516c68e4efc';

          const hashObject = (path) => execFileSync('git', ['hash-object', path], { encoding: 'utf8' }).trim();
          const observedMain = execFileSync('git', ['rev-parse', 'origin/main'], { encoding: 'utf8' }).trim();
          execFileSync('git', ['merge-base', '--is-ancestor', acceptedPackageHead, 'HEAD']);

          const bootstrap = JSON.parse(fs.readFileSync(bootstrapPath, 'utf8'));
          const completion = JSON.parse(fs.readFileSync(completionPath, 'utf8'));

          assert.equal(observedMain, expectedMain);
          assert.equal(hashObject(completionPath), expectedCompletionBlob);
          assert.equal(completion.result, 'PASS');
          assert.equal(completion.targetStatus.candidatePackageComplete, true);
          assert.equal(bootstrap.status, 'COMPLETE_VERIFIED_CANDIDATE_NOT_ACCEPTED');
          assert.equal(bootstrap.accepted, false);
          assert.equal(bootstrap.canonical, false);
          assert.equal(bootstrap.finalization.target4FComplete, true);
          assert.equal(bootstrap.finalization.candidatePackageComplete, true);
          assert.equal(bootstrap.finalization.userAcceptanceEstablished, false);

          const declaration = {
            declarationId: 'H_EARTH_REPOSITORY_REGISTRY_USER_ACCEPTANCE_DECLARATION_v1',
            status: 'ACCEPTED_NONCANONICAL',
            accepted: true,
            canonical: false,
            acceptanceStatement: 'I accept.',
            acceptanceScope: 'COMPLETE_VERIFIED_H_EARTH_REPOSITORY_REGISTRY_AND_GOVERNED_PREFLIGHT_PACKAGE',
            acceptedPackage: {
              branch: 'agent/h-earth-repository-registry-installation-001',
              headBeforeAcceptanceRecording: acceptedPackageHead,
              completionReceiptPath: `/${completionPath}`,
              completionReceiptGitBlobSha: expectedCompletionBlob,
              completionResult: completion.result,
              finalAuditPassedChecks: completion.finalAudit.passedChecks,
              candidatePackageComplete: completion.targetStatus.candidatePackageComplete
            },
            transition: {
              priorStatus: 'COMPLETE_VERIFIED_CANDIDATE_NOT_ACCEPTED',
              resultingStatus: 'COMPLETE_VERIFIED_ACCEPTED_NONCANONICAL',
              componentArtifactIdentitiesChanged: false,
              componentArtifactStatusesRemainHistorical: true
            },
            boundaries: {
              mergeAuthorityEstablished: false,
              canonicalizationAuthorityEstablished: false,
              activeOnMain: false,
              mainChanged: false,
              branchProtectionCreated: false,
              sourceAuthorityCreated: false,
              mutationAuthorityCreated: false,
              runtimeAuthorityCreated: false,
              rendererAuthorityCreated: false,
              deploymentAuthorityCreated: false,
              productionAuthorityCreated: false
            },
            stoppingCondition: {
              userAcceptanceEstablished: true,
              mergeAuthorityEstablished: false,
              nextAuthorizedSubtarget: 'MERGE_AUTHORIZATION_BOUNDARY'
            }
          };

          fs.writeFileSync(declarationPath, `${JSON.stringify(declaration, null, 2)}\n`);
          const declarationBlob = hashObject(declarationPath);

          bootstrap.status = 'COMPLETE_VERIFIED_ACCEPTED_NONCANONICAL';
          bootstrap.accepted = true;
          bootstrap.canonical = false;
          bootstrap.userAcceptance = {
            acceptanceId: declaration.declarationId,
            status: declaration.status,
            accepted: true,
            canonical: false,
            acceptanceStatement: declaration.acceptanceStatement,
            acceptanceScope: declaration.acceptanceScope,
            acceptedPackageHead,
            declarationPath: `/${declarationPath}`,
            declarationGitBlobSha: declarationBlob,
            completionReceiptPath: `/${completionPath}`,
            completionReceiptGitBlobSha: expectedCompletionBlob,
            componentArtifactIdentitiesChanged: false,
            mergeAuthorityEstablished: false,
            mainActivationEstablished: false,
            nextAuthorizedSubtarget: 'MERGE_AUTHORIZATION_BOUNDARY'
          };
          bootstrap.finalization.status = 'COMPLETE_VERIFIED_ACCEPTED_NONCANONICAL';
          bootstrap.finalization.userAcceptanceEstablished = true;
          bootstrap.finalization.mergeAuthorityEstablished = false;
          bootstrap.finalization.mainActivationEstablished = false;
          bootstrap.finalization.nextAuthorizedSubtarget = 'MERGE_AUTHORIZATION_BOUNDARY';
          bootstrap.boundaries.userAcceptanceCreated = true;
          bootstrap.boundaries.canonicalizationAuthorityCreated = false;
          bootstrap.boundaries.mergeAuthorityCreated = false;
          bootstrap.boundaries.mainChanged = false;
          bootstrap.stoppingCondition.userAcceptanceEstablished = true;
          bootstrap.stoppingCondition.mergeAuthorityEstablished = false;
          bootstrap.stoppingCondition.mainActivationEstablished = false;
          bootstrap.stoppingCondition.advanceBeyondTarget4F = false;
          bootstrap.stoppingCondition.nextAuthorizedSubtarget = 'MERGE_AUTHORIZATION_BOUNDARY';

          fs.writeFileSync(bootstrapPath, `${JSON.stringify(bootstrap, null, 2)}\n`);
          const bootstrapBlob = hashObject(bootstrapPath);

          const custody = {
            receiptId: 'H_EARTH_REPOSITORY_REGISTRY_USER_ACCEPTANCE_CUSTODY_RECEIPT_v1',
            result: 'PASS',
            status: 'COMPLETE_VERIFIED_ACCEPTED_NONCANONICAL',
            acceptance: {
              declarationPath: `/${declarationPath}`,
              declarationGitBlobSha: declarationBlob,
              statement: declaration.acceptanceStatement,
              accepted: true,
              canonical: false,
              acceptedPackageHead,
              completionReceiptGitBlobSha: expectedCompletionBlob
            },
            renewedBootstrap: {
              path: `/${bootstrapPath}`,
              gitBlobSha: bootstrapBlob,
              status: bootstrap.status,
              accepted: bootstrap.accepted,
              canonical: bootstrap.canonical
            },
            repositoryState: {
              branch: 'agent/h-earth-repository-registry-installation-001',
              expectedMainCommit: expectedMain,
              observedMainCommit: observedMain,
              mainChanged: false
            },
            boundaries: declaration.boundaries,
            stoppingCondition: {
              userAcceptanceEstablished: true,
              mergeAuthorityEstablished: false,
              canonicalizationAuthorityEstablished: false,
              activeOnMain: false,
              nextAuthorizedSubtarget: 'MERGE_AUTHORIZATION_BOUNDARY'
            },
            recordingCommitIdentity: 'THE_COMMIT_CONTAINING_THIS_RECEIPT'
          };

          fs.writeFileSync(custodyPath, `${JSON.stringify(custody, null, 2)}\n`);
          NODE

          rm .github/workflows/h-earth-repository-registry-user-acceptance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            h-earth-3d/registry/finalization/h-earth.repository-registry.user-acceptance-declaration.json \
            h-earth-3d/registry/h-earth.repository-registry.bootstrap.json \
            h-earth-3d/registry/h-earth.repository-registry.user-acceptance-custody-receipt.json \
            .github/workflows/h-earth-repository-registry-user-acceptance.yml
          git commit -m 'Record explicit user acceptance of H-Earth registry package'
          git push origin HEAD:agent/h-earth-repository-registry-installation-001
