name: Bounded Exact-Head Execution Carrier v1

on:
  push:
    branches:
      - agent/bounded-exact-head-execution-carrier-v1-003
    paths:
      - '.github/ai-router/router.v1.json'
      - '.github/ai-router/execution-backends.v1.json'
      - '.github/ai-router/system-continuity/gap-registry.v1.json'
      - '.github/ai-router/bounded-exact-head-execution-carrier/**'
      - '.github/workflows/bounded-exact-head-execution-carrier-v1.yml'
  pull_request:
    paths:
      - '.github/ai-router/router.v1.json'
      - '.github/ai-router/execution-backends.v1.json'
      - '.github/ai-router/system-continuity/gap-registry.v1.json'
      - '.github/ai-router/bounded-exact-head-execution-carrier/**'
      - '.github/workflows/bounded-exact-head-execution-carrier-v1.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  GEN839_SUCCESSOR_RECEIPT_B64: 

jobs:
  verify-candidate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact head and clean worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "${{ github.sha }}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Verify canonical generation-839 successor identity
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GEN839_SUCCESSOR_RECEIPT_B64" | base64 --decode > "$RUNNER_TEMP/gen839-successor.json"
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/gen839-successor.json','utf8'));
          const s=r.successor||{};
          if(r.schema!=='REPOSITORY_OPERATION_SUCCESSOR_TRANSITION_RECEIPT_v1'||r.result!=='SUCCESSOR_ADMITTED_PREDECESSOR_SUPERSEDED'||r.authorityInherited!==false||r.exactHeadRevalidationRequired!==true||s.operationId!=='BOUNDED_EXACT_HEAD_EXECUTION_CARRIER_V1_INSTALLATION_20260809_002_SUCCESSOR_001'||s.lockGeneration!==839||s.governingHead!=='f624b55096c69c63909d4ee260fcd5615f8d9aa6'||s.requestDigest!=='147496c09cdac2c86a4ae6400598114df1dc62b48b9cbfaeda1bdab607763b6e'||s.procedureLocatorDigest!=='83ade0e650837b57753d1437193dfd6dba8fd265469b5ac35ab845d7bd91972c')process.exit(1);
          NODE

      - name: Recompute exact eight-path repository Router gate
        shell: bash
        run: |
          set -euo pipefail
          node tools/repository-ai-entry-router.mjs \
            --mutation-intent \
            --path .github/ai-router/router.v1.json \
            --path .github/ai-router/execution-backends.v1.json \
            --path .github/ai-router/system-continuity/gap-registry.v1.json \
            --path .github/ai-router/bounded-exact-head-execution-carrier/protocol.v1.json \
            --path .github/ai-router/bounded-exact-head-execution-carrier/registry.v1.json \
            --path .github/ai-router/bounded-exact-head-execution-carrier/carrier.v1.mjs \
            --path .github/ai-router/bounded-exact-head-execution-carrier/self-test.v1.mjs \
            --path .github/workflows/bounded-exact-head-execution-carrier-v1.yml \
            --task BOUNDED_EXACT_HEAD_EXECUTION_CARRIER_V1_INSTALLATION_20260809_002_SUCCESSOR_001 \
            --output "$RUNNER_TEMP/router-receipt.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/router-receipt.json'); if(r.disposition!=='PASS'||r.routes?.length!==8||!r.routes.every(x=>x.projectId==='REPOSITORY_AI_ROUTER_INFRASTRUCTURE'&&x.disposition==='PASS'))process.exit(1)"

      - name: Run adversarial carrier self-test
        shell: bash
        run: |
          set -euo pipefail
          node .github/ai-router/bounded-exact-head-execution-carrier/self-test.v1.mjs --output "$RUNNER_TEMP/self-test.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/self-test.json'); if(r.result!=='PASS'||r.passed!==r.total||r.total<18||r.authorityInflationObserved!==false||r.arbitraryCommandAccepted!==false)process.exit(1)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Emit fresh generation-839 verification receipt
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'); const p=process.env.RUNNER_TEMP;
          const router=JSON.parse(fs.readFileSync(p+'/router-receipt.json','utf8'));
          const self=JSON.parse(fs.readFileSync(p+'/self-test.json','utf8'));
          const out={schema:'BOUNDED_EXACT_HEAD_EXECUTION_CARRIER_VERIFICATION_RECEIPT_v1',result:'PASS',generation:839,operationId:'BOUNDED_EXACT_HEAD_EXECUTION_CARRIER_V1_INSTALLATION_20260809_002_SUCCESSOR_001',head:process.env.GITHUB_SHA,governingHead:'f624b55096c69c63909d4ee260fcd5615f8d9aa6',routerDisposition:router.disposition,routerRouteCount:router.routes.length,selfTestResult:self.result,selfTestPassed:self.passed,selfTestTotal:self.total,authorityInherited:false,arbitraryCommandAuthority:false,repositoryWriteAuthority:false,semanticAuthority:false};
          fs.writeFileSync(p+'/verification.json',JSON.stringify(out,null,2)+'\n');
          NODE

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-exact-head-carrier-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gen839-successor.json
            ${{ runner.temp }}/router-receipt.json
            ${{ runner.temp }}/self-test.json
            ${{ runner.temp }}/verification.json
          if-no-files-found: warn
          retention-days: 90

  execute-registered-command:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 578 &&
      github.actor == 'smansfield635-create' &&
      startsWith(github.event.comment.body, 'BOUNDED_EXACT_HEAD_EXECUTION_REQUEST_V1')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out ratified default branch carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse bounded request without shell evaluation
        shell: bash
        env:
          REQUEST_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const marker='BOUNDED_EXACT_HEAD_EXECUTION_REQUEST_V1';
          const body=process.env.REQUEST_BODY ?? '';
          if(!body.startsWith(marker)) process.exit(2);
          const raw=body.slice(marker.length).trim();
          fs.writeFileSync(process.env.RUNNER_TEMP+'/request.json',JSON.stringify(JSON.parse(raw),null,2)+'\n');
          NODE

      - name: Execute registered command through bounded carrier
        id: carrier
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node .github/ai-router/bounded-exact-head-execution-carrier/carrier.v1.mjs \
            --input "$RUNNER_TEMP/request.json" \
            --output "$RUNNER_TEMP/execution-receipt.json"

      - name: Upload bounded execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-exact-head-carrier-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/request.json
            ${{ runner.temp }}/execution-receipt.json
          if-no-files-found: warn
          retention-days: 90

      - name: Return bounded execution receipt
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const p=process.env.RUNNER_TEMP+'/execution-receipt.json';
            let r={schema:'BOUNDED_EXACT_HEAD_EXECUTION_FAILURE_v1',result:'FAIL_CLOSED',errorCode:'EXECUTION_RECEIPT_MISSING'};
            if(fs.existsSync(p)) r=JSON.parse(fs.readFileSync(p,'utf8'));
            const n=r.nativeReceipt??null;
            const projection={schema:r.schema,result:r.result,errorCode:r.errorCode??null,descriptorId:r.descriptorId??null,operationId:r.operationId??null,lockGeneration:r.lockGeneration??null,targetHead:r.targetHead??null,exactHeadVerified:r.exactHeadVerified??false,workingTreeCleanBeforeAndAfter:r.workingTreeCleanBeforeAndAfter??false,nativeReceiptSchema:r.nativeReceiptSchema??n?.schema??null,nativeReceiptDisposition:n?.disposition??null,nativeReceiptDigest:r.nativeReceiptDigest??null,nativeReceiptRewritten:r.nativeReceiptRewritten??null,repositoryWritesPerformed:r.repositoryWritesPerformed??false,arbitraryCommandAuthority:r.arbitraryCommandAuthority??false,semanticAuthorityCreated:r.semanticAuthorityCreated??false};
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:578,body:'BOUNDED_EXACT_HEAD_EXECUTION_RETURN_V1\n```json\n'+JSON.stringify(projection,null,2)+'\n```'});

      - name: Fail closed if carrier execution was nonpass
        if: steps.carrier.outcome != 'success'
        shell: bash
        run: exit 1
