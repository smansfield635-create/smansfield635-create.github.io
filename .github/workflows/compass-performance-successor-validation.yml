name: Compass Performance Successor Validation

on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/compass/compass.orbit-input.js'
      - 'assets/compass/compass.statement-carousel.js'
      - 'assets/compass/compass.statement-carousel.css'
      - 'assets/compass/compass.brain-scene.js'
      - 'assets/compass/compass.capability-carousel.js'
      - 'assets/compass/compass.capability-carousel.css'
      - '.github/ai-router/router.v1.json'
      - '.github/ai-router/projects/compass/entrypoint.v1.json'
      - '.github/ai-router/projects/compass/verify-performance-successor.mjs'
      - '.github/workflows/compass-performance-successor-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPASS_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  qualify:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact checkout and static contract
        env:
          COMPASS_PERFORMANCE_OUTPUT: /tmp/compass-root-award-finish-performance.json
        run: |
          test "$(git rev-parse HEAD^{commit})" = "$COMPASS_CANDIDATE_HEAD"
          node .github/ai-router/projects/compass/verify-performance-successor.mjs
          node --check assets/compass/compass.orbit-input.js
          node --check assets/compass/compass.statement-carousel.js
          node --check assets/compass/compass.brain-scene.js
          node --check assets/compass/compass.capability-carousel.js
      - name: Install Playwright outside repository contract
        env:
          npm_config_package_lock: 'false'
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Start candidate host
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/compass-performance-host.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/compass-performance-host.log
          exit 1
