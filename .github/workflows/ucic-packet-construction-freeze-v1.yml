name: UCIC Packet Construction and Freeze v1
on:
  pull_request:
    paths:
      - 'research/route-operator-platform-v1/registered-challenges/independent-constitutive-route-identification-challenge-v1/ucic-prospective-final-report-packets-v1/**'
      - '.github/workflows/ucic-packet-construction-freeze-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python research/route-operator-platform-v1/registered-challenges/independent-constitutive-route-identification-challenge-v1/ucic-prospective-final-report-packets-v1/verify-packets-v1.py
