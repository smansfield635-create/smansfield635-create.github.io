name: H-Earth Terrain Relief V2 Live Default Browser Verification

on:
  workflow_dispatch:
  push:
    branches:
      - control/h-earth-c2-r1-ratified-candidate-browser-verification-001
    paths:
      - '.github/workflows/h-earth-c2-r1-ratified-candidate-browser-verification.yml'

permissions:
  contents: read

concurrency:
  group: h-earth-terrain-relief-v2-live-default-browser-verification
  cancel-in-progress: false

env:
  OPERATION_ID: H_EARTH_TERRAIN_RELIEF_V2_POSTMERGE_PUBLIC_BROWSER_VERIFICATION_001
  PUBLIC_URL: https://diamondgatebridge.com/showroom/globe/h-earth/
  PROMOTION_MERGE_COMMIT: 6836288462bbbc7ab7c03d5f12fafaab119f9e36
  REVIEWED_CANDIDATE_HEAD: 97003e9de386a8962fb46d0b370005b900a167d6
  EXPECTED_V2_RENDERER_PATH: ../../render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js
  EXPECTED_CP2_RENDERER_PATH: ../../render/persistent-live-renderer.run8e-r3c.cp2-round1-1f520809.js
  ARTIFACT_NAME: h-earth-terrain-relief-v2-live-default-browser-verification
  PLAYWRIGHT_VERSION: 1.55.0

jobs:
  public-browser-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout verification carrier read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Execute public route cases in Chromium
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/h-earth-v2-live-browser-runtime"
          evidence="$RUNNER_TEMP/h-earth-v2-live-browser-evidence"
          mkdir -p "$runtime" "$evidence/screenshots"
          cd "$runtime"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
          cat > runner.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';

          const publicUrl = process.env.PUBLIC_URL;
          const operationId = process.env.OPERATION_ID;
          const reviewedCandidateHead = process.env.REVIEWED_CANDIDATE_HEAD;
          const promotionMergeCommit = process.env.PROMOTION_MERGE_COMMIT;
          const expectedV2RendererPath = process.env.EXPECTED_V2_RENDERER_PATH;
          const expectedCp2RendererPath = process.env.EXPECTED_CP2_RENDERER_PATH;
          const evidenceRoot = path.join(process.env.RUNNER_TEMP, 'h-earth-v2-live-browser-evidence');
          const screenshotsRoot = path.join(evidenceRoot, 'screenshots');
          const sha256 = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
          const writeJson = (name, value) => fs.writeFileSync(path.join(evidenceRoot, name), `${JSON.stringify(value, null, 2)}\n`);

          const viewports = [
            { id: 'DESKTOP_1440_X_900', width: 1440, height: 900, isMobile: false, hasTouch: false },
            { id: 'MOBILE_390_X_844', width: 390, height: 844, isMobile: true, hasTouch: true },
            { id: 'MOBILE_412_X_915', width: 412, height: 915, isMobile: true, hasTouch: true }
          ];
          const cases = [
            {
              id: 'NO_QUERY_LIVE_DEFAULT',
              url: publicUrl,
              expectedVisual: true,
              expectedCp2: false,
              expectedRendererPath: expectedV2RendererPath,
              requireInsertedVisualParameter: true
            },
            {
              id: 'EXPLICIT_VISUAL_V2',
              url: `${publicUrl}?visual=terrain-relief-v2`,
              expectedVisual: true,
              expectedCp2: false,
              expectedRendererPath: expectedV2RendererPath,
              requireInsertedVisualParameter: false
            },
            {
              id: 'EXPLICIT_CP2_REFERENCE',
              url: `${publicUrl}?cp2=round1-1f520809`,
              expectedVisual: false,
              expectedCp2: true,
              expectedRendererPath: expectedCp2RendererPath,
              requireInsertedVisualParameter: false
            }
          ];

          const browser = await chromium.launch({ headless: true });
          const results = [];
          let terminalError = null;

          try {
            for (const testCase of cases) {
              for (const viewport of viewports) {
                const context = await browser.newContext({
                  viewport: { width: viewport.width, height: viewport.height },
                  isMobile: viewport.isMobile,
                  hasTouch: viewport.hasTouch,
                  deviceScaleFactor: 1,
                  ignoreHTTPSErrors: false
                });
                const page = await context.newPage();
                const consoleErrors = [];
                const pageErrors = [];
                const requestFailures = [];
                const httpFailures = [];
                page.on('console', message => {
                  if (message.type() === 'error') consoleErrors.push(message.text());
                });
                page.on('pageerror', error => pageErrors.push({ message: error.message, stack: error.stack ?? null }));
                page.on('requestfailed', request => requestFailures.push({ url: request.url(), errorText: request.failure()?.errorText ?? null }));
                page.on('response', response => {
                  if (response.status() >= 400) httpFailures.push({ url: response.url(), status: response.status() });
                });

                const startedAt = Date.now();
                let navigationResponse = null;
                let navigationError = null;
                try {
                  navigationResponse = await page.goto(testCase.url, { waitUntil: 'domcontentloaded', timeout: 90000 });
                } catch (error) {
                  navigationError = { message: error.message, stack: error.stack ?? null };
                }

                try {
                  await page.waitForFunction(() => {
                    const route = document.getElementById('h-earth-functional-landscape-route');
                    const startup = window.H_EARTH_RENDERER_STARTUP_DIAGNOSTICS?.getReceipt?.();
                    return route?.dataset.run8eReady === 'true'
                      || route?.dataset.run8eError === 'true'
                      || Boolean(startup?.firstFailureStage)
                      || startup?.stages?.READY_PUBLISHED === 'PASS';
                  }, { timeout: 150000 });
                } catch {}
                await page.waitForTimeout(1800);

                const headers = navigationResponse ? await navigationResponse.allHeaders() : {};
                const status = navigationResponse?.status() ?? null;
                const contentType = headers['content-type'] ?? null;
                const runtime = await page.evaluate(() => {
                  const route = document.getElementById('h-earth-functional-landscape-route');
                  const canvas = document.getElementById('h-earth-functional-landscape-canvas');
                  const startup = window.H_EARTH_RENDERER_STARTUP_DIAGNOSTICS?.getReceipt?.() ?? null;
                  const publicReceipt = window.H_EARTH_RUN8E_PUBLIC_ROUTE?.getReceipt?.() ?? null;
                  const resourceUrls = performance.getEntriesByType('resource').map(entry => entry.name);
                  return {
                    href: location.href,
                    title: document.title,
                    search: location.search,
                    visual: new URLSearchParams(location.search).get('visual'),
                    cp2: new URLSearchParams(location.search).get('cp2'),
                    routeReady: route?.dataset.run8eReady ?? null,
                    routeError: route?.dataset.run8eError ?? null,
                    canvasPresent: canvas instanceof HTMLCanvasElement,
                    canvasWidth: canvas?.width ?? null,
                    canvasHeight: canvas?.height ?? null,
                    startup,
                    publicReceipt,
                    resourceUrls
                  };
                });

                const prefix = `${testCase.id}__${viewport.id}`;
                const beforePath = path.join(screenshotsRoot, `${prefix}__BEFORE.png`);
                const afterPath = path.join(screenshotsRoot, `${prefix}__AFTER.png`);
                await page.screenshot({ path: beforePath, fullPage: false });
                let interaction = { attempted: false, changed: false, error: null };
                const canvas = page.locator('#h-earth-functional-landscape-canvas');
                if (runtime.canvasPresent && await canvas.isVisible().catch(() => false)) {
                  interaction.attempted = true;
                  try {
                    await canvas.scrollIntoViewIfNeeded();
                    const box = await canvas.boundingBox();
                    if (!box) throw new Error('CANVAS_BOUNDING_BOX_UNAVAILABLE');
                    const x = box.x + box.width * 0.55;
                    const y = box.y + box.height * 0.52;
                    await page.mouse.move(x, y);
                    await page.mouse.down();
                    await page.mouse.move(x - Math.min(120, box.width * 0.18), y + Math.min(50, box.height * 0.08), { steps: 12 });
                    await page.mouse.up();
                    await page.mouse.wheel(0, -360);
                    await page.waitForTimeout(1000);
                  } catch (error) {
                    interaction.error = { message: error.message, stack: error.stack ?? null };
                  }
                }
                await page.screenshot({ path: afterPath, fullPage: false });
                const beforeSha256 = sha256(fs.readFileSync(beforePath));
                const afterSha256 = sha256(fs.readFileSync(afterPath));
                interaction.changed = beforeSha256 !== afterSha256;
                interaction.beforeSha256 = beforeSha256;
                interaction.afterSha256 = afterSha256;

                const liveGpu = runtime.publicReceipt?.liveGpu ?? null;
                const exclusivity = runtime.publicReceipt?.runtimeExclusivity ?? null;
                const correspondence = liveGpu?.correspondence ?? null;
                const expectedRendererResourceName = testCase.expectedRendererPath.split('/').at(-1);
                const selectedResourceLoaded = runtime.resourceUrls.some(url => url.includes(expectedRendererResourceName));
                const v2ResourceLoaded = runtime.resourceUrls.some(url => url.includes('persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js'));
                const cp2ResourceLoaded = runtime.resourceUrls.some(url => url.includes('persistent-live-renderer.run8e-r3c.cp2-round1-1f520809.js'));
                const baselineResourceLoaded = runtime.resourceUrls.some(url => /persistent-live-renderer\.run8e-r3c\.js(?:\?|$)/.test(url));
                const finalParams = new URL(runtime.href).searchParams;
                const selectorPass = testCase.expectedVisual
                  ? finalParams.get('visual') === 'terrain-relief-v2' && !finalParams.has('cp2')
                  : finalParams.get('cp2') === 'round1-1f520809' && !finalParams.has('visual');
                const defaultInsertionPass = !testCase.requireInsertedVisualParameter || finalParams.get('visual') === 'terrain-relief-v2';
                const receiptSelectionPass = liveGpu?.selectedRendererPath === testCase.expectedRendererPath
                  && liveGpu?.additiveVisualRequested === testCase.expectedVisual
                  && liveGpu?.liveDifferential?.requested === testCase.expectedCp2;
                const exclusivityPass = exclusivity?.activePublicModuleScriptCount === 1
                  && exclusivity?.legacyModuleScriptCount === 0
                  && exclusivity?.activeWebGL2ContextCount === 1
                  && exclusivity?.activePersistentRendererCount === 1
                  && exclusivity?.activeNavigationStateStreamCount === 1
                  && exclusivity?.activePointerTouchIntakeCount === 1
                  && exclusivity?.activeFramePresentationAuthorityCount === 1
                  && exclusivity?.legacyCpuRouteControllerLoaded === false
                  && exclusivity?.legacyCpuEnvironmentIntegrationLoaded === false
                  && exclusivity?.legacyPublicDirectManipulationLoaded === false
                  && exclusivity?.cpuWorldRebuildPerCameraChange === false
                  && exclusivity?.cssBitmapPreview === false
                  && exclusivity?.duplicatePointerListeners === false
                  && exclusivity?.packageUploadedOnce === true
                  && exclusivity?.resourceIdentityStable === true;
                const lifecyclePass = correspondence?.packageUploadedOnce === true
                  && correspondence?.resourceIdentityStable === true
                  && correspondence?.noPostInitializationResourceCreation === true
                  && correspondence?.noPostInitializationBufferUpload === true;
                const resourceSelectionPass = selectedResourceLoaded
                  && (testCase.expectedVisual ? v2ResourceLoaded && !cp2ResourceLoaded && !baselineResourceLoaded : cp2ResourceLoaded && !v2ResourceLoaded && !baselineResourceLoaded);
                const visibleFramePass = Number(liveGpu?.counters?.gpuFramebufferPresentationCount ?? 0) > 0;
                const startupPass = runtime.routeReady === 'true'
                  && runtime.routeError === 'false'
                  && !runtime.startup?.firstFailureStage;

                const pass = status === 200
                  && contentType?.toLowerCase().includes('text/html')
                  && navigationError === null
                  && runtime.title === 'H-Earth · Live Interactive World'
                  && runtime.canvasPresent
                  && startupPass
                  && selectorPass
                  && defaultInsertionPass
                  && receiptSelectionPass
                  && resourceSelectionPass
                  && exclusivityPass
                  && lifecyclePass
                  && visibleFramePass
                  && consoleErrors.length === 0
                  && pageErrors.length === 0
                  && requestFailures.length === 0
                  && httpFailures.length === 0
                  && interaction.attempted
                  && interaction.changed
                  && interaction.error === null;

                results.push({
                  caseId: testCase.id,
                  viewport,
                  pass,
                  elapsedMs: Date.now() - startedAt,
                  navigation: { status, contentType, navigationError, finalUrl: runtime.href, title: runtime.title },
                  checks: {
                    selectorPass,
                    defaultInsertionPass,
                    receiptSelectionPass,
                    resourceSelectionPass,
                    exclusivityPass,
                    lifecyclePass,
                    visibleFramePass,
                    startupPass,
                    selectedResourceLoaded,
                    v2ResourceLoaded,
                    cp2ResourceLoaded,
                    baselineResourceLoaded
                  },
                  runtime,
                  interaction,
                  failures: { consoleErrors, pageErrors, requestFailures, httpFailures },
                  screenshots: {
                    before: { path: `screenshots/${prefix}__BEFORE.png`, sha256: beforeSha256 },
                    after: { path: `screenshots/${prefix}__AFTER.png`, sha256: afterSha256 }
                  }
                });
                await context.close();
              }
            }
          } catch (error) {
            terminalError = { message: error.message, stack: error.stack ?? null };
          } finally {
            await browser.close();
          }

          const overallPass = terminalError === null && results.length === 9 && results.every(result => result.pass);
          const receipt = {
            receiptId: 'ROLE_3_H_EARTH_TERRAIN_RELIEF_V2_POSTMERGE_PUBLIC_BROWSER_RECEIPT_v1',
            operationId,
            result: overallPass ? 'PASS' : 'BLOCKED',
            publicUrl,
            reviewedCandidateHead,
            promotionMergeCommit,
            expectedV2RendererPath,
            expectedCp2RendererPath,
            scenarioCount: results.length,
            results,
            terminalError,
            unauthorizedMutationCount: 0,
            productMutation: false,
            liveRouteMutation: false,
            generatedAt: new Date().toISOString()
          };
          writeJson('browser-verification-receipt.json', receipt);
          const files = fs.readdirSync(evidenceRoot, { recursive: true })
            .filter(name => fs.statSync(path.join(evidenceRoot, name)).isFile())
            .sort();
          const manifest = files.map(name => ({ path: name, sha256: sha256(fs.readFileSync(path.join(evidenceRoot, name))) }));
          writeJson('artifact-manifest-sha256.json', { files: manifest });
          console.log(JSON.stringify({
            result: receipt.result,
            scenarios: results.map(result => ({ caseId: result.caseId, viewport: result.viewport.id, pass: result.pass, checks: result.checks }))
          }, null, 2));
          if (!overallPass) process.exitCode = 1;
          NODE
          node runner.mjs

      - name: Upload immutable browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/h-earth-v2-live-browser-evidence
          if-no-files-found: error
          retention-days: 90
