name: Compass Rebuild Browser Qualification
on:
  push:
    branches:
      - compass-static-single-runtime-20260821
    paths:
      - 'compass-inspect-v2/**'
      - '.github/workflows/compass-rebuild-browser-qualification.yml'
  pull_request:
    branches: [main]
    paths:
      - 'compass-inspect-v2/**'
      - '.github/workflows/compass-rebuild-browser-qualification.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Serve exact candidate tree
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/compass-http.log 2>&1 &
          echo $! >/tmp/compass-http.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/compass-inspect-v2/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/compass-http.log
          exit 1
      - name: Browser qualify Compass core
        run: |
          cat >.compass-rebuild-qualify.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1024,height:900},deviceScaleFactor:1});
          const consoleErrors=[]; const pageErrors=[]; const failed=[];
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
          page.on('pageerror',e=>pageErrors.push(String(e)));
          page.on('requestfailed',r=>failed.push({url:r.url(),failure:r.failure()?.errorText||''}));
          const response=await page.goto('http://127.0.0.1:8080/compass-inspect-v2/',{waitUntil:'domcontentloaded',timeout:120000});
          await page.waitForFunction(()=>['PASS','FAIL'].includes(document.querySelector('[data-compass-root]')?.dataset.runtimeGate||''),{timeout:30000});
          await page.waitForTimeout(1200);
          const snap=async()=>page.evaluate(()=>{
            const box=el=>{const r=el?.getBoundingClientRect();const s=el?getComputedStyle(el):null;return {w:r?.width||0,h:r?.height||0,x:r?.x||0,y:r?.y||0,display:s?.display||'',position:s?.position||'',visibility:s?.visibility||'',opacity:s?.opacity||'',minHeight:s?.minHeight||'',height:s?.height||'',width:s?.width||'',zIndex:s?.zIndex||'',overflow:s?.overflow||''}};
            const root=document.querySelector('[data-compass-root]');
            const scene=document.querySelector('[data-compass-scene]');
            const grid=document.querySelector('.compass-instrument__grid');
            const hall=document.querySelector('.compass-estate__hall');
            const panel=document.querySelector('[data-compass-panel]');
            const cosmos=document.querySelector('#dgb-compass-cosmos-layer');
            const sheets=[...document.styleSheets].map(s=>{let rules='blocked';try{rules=s.cssRules.length}catch{}return {href:s.href||'inline',disabled:s.disabled,rules}});
            const top=[...document.elementsFromPoint(innerWidth/2,innerHeight/2)].slice(0,12).map(e=>({tag:e.tagName,id:e.id||'',className:typeof e.className==='string'?e.className:'',z:getComputedStyle(e).zIndex,position:getComputedStyle(e).position}));
            return {runtime:root?.dataset.runtimeGate||'',mode:root?.dataset.compassMode||'',root:box(root),hall:box(hall),grid:box(grid),scene:box(scene),panel:box(panel),cosmos:box(cosmos),controllerReceipt:globalThis.DGB_COMPASS_CONTROLLER_RECEIPT||{},crystalsReceipt:globalThis.DGB_COMPASS_CRYSTALS_RECEIPT||{},canvases:[...document.querySelectorAll('canvas')].map((c,i)=>({i,id:c.id||'',attrs:[...c.attributes].reduce((o,a)=>(o[a.name]=a.value,o),{}),box:box(c),buffer:{w:c.width,h:c.height}})),sheets,top,cardinals:document.querySelectorAll('[data-compass-cardinal]').length,rooms:document.querySelectorAll('[data-compass-room-declarations] [data-compass-room]').length};
          });
          const before=await snap();
          await page.screenshot({path:'compass-rebuild-browser-qualification-before.png',fullPage:false});
          let opened=null,selectionError='';
          try{opened=await page.evaluate(()=>globalThis.DGB_COMPASS_CONTROLLER?.requestCardinalSelection('north'))}catch(e){selectionError=String(e)}
          const immediate=await snap();
          await page.waitForTimeout(1000);
          const after=await snap();
          await page.screenshot({path:'compass-rebuild-browser-qualification-after.png',fullPage:false});
          const result={httpStatus:response?.status()||0,before,opened,selectionError,immediate,after,consoleErrors,pageErrors,failed};
          fs.writeFileSync('compass-rebuild-browser-qualification.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));
          const cr=before.crystalsReceipt||{}, ctrl=before.controllerReceipt||{};
          if(before.runtime!=='PASS') throw new Error('RUNTIME_NOT_PASS:'+before.runtime);
          if(ctrl.status!=='available') throw new Error('CONTROLLER_NOT_AVAILABLE:'+JSON.stringify(ctrl));
          if(cr.status!=='available'||cr.rendererInitialized!==true||cr.registryCardinalCount!==4||cr.registryRoomCount!==19||cr.roomProxyCount!==19||(cr.drawCallsLastFrame||0)<4) throw new Error('CRYSTALS_INVALID:'+JSON.stringify(cr));
          if(opened!==true) throw new Error('CARDINAL_SELECTION_REJECTED:'+opened+':'+selectionError);
          if(after.mode!=='CLUSTER_OPEN') throw new Error('CLUSTER_NOT_PERSISTENT:'+JSON.stringify({immediate:immediate.mode,after:after.mode,receipt:after.controllerReceipt}));
          if(before.scene.w<300||before.scene.h<300) throw new Error('SCENE_LAYOUT_INVALID:'+JSON.stringify(before.scene));
          await browser.close();
          NODE
          node .compass-rebuild-qualify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-rebuild-browser-qualification
          path: |
            compass-rebuild-browser-qualification.json
            compass-rebuild-browser-qualification-before.png
            compass-rebuild-browser-qualification-after.png
          if-no-files-found: ignore
