name: FD05 wet-sand material presentation prework

on:
  pull_request:
    branches:
      - agent/fd05-wet-sand-material-prework-001
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  capture-runtime-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fd05-wet-sand-material-prework-001
          fetch-depth: 0
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture runtime-only wet-sand candidates
        run: node .fd05/wet-sand-prework.mjs
      - name: Commit read-only report on isolated branch
        run: |
          git config user.name "OpenAI Engineering Agent"
          git config user.email "engineering-agent@users.noreply.github.com"
          git add .fd05/wet-sand-prework-output/report.json
          git commit -m "Record wet-sand material prework capture"
          git push origin HEAD:agent/fd05-wet-sand-material-prework-001
      - uses: actions/upload-artifact@v4
        with:
          name: fd05-wet-sand-material-prework
          path: .fd05/wet-sand-prework-output/
          if-no-files-found: error
          retention-days: 14
