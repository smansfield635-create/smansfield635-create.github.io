name: Estate Laboratory Successor 006 Phone Overflow Repair

on:
  push:
    branches:
      - ESTATE_LABORATORY_NAVIGATION_RECONCILIATION_20260824_006
    paths:
      - '.github/workflows/estate-laboratory-gen1.yml'

permissions:
  contents: write

jobs:
  repair-phone-overflow:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out bounded successor
        uses: actions/checkout@v4
        with:
          fetch-depth: 32
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /instruments/index.html
            /.github/workflows/estate-laboratory-gen1.yml

      - name: Wrap dynamic result code without changing laboratory behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('instruments/index.html')
          s=p.read_text()
          old='.result-stack>strong{font-size:1.02rem}'
          new='.result-stack>strong{font-size:1.02rem;overflow-wrap:anywhere}'
          count=s.count(old)
          if count != 1:
            raise SystemExit(f'RESULT_CODE_WRAP_MATCH_COUNT:{count}')
          p.write_text(s.replace(old,new,1))
          PY
          grep -Fq '.result-stack>strong{font-size:1.02rem;overflow-wrap:anywhere}' instruments/index.html
          git diff --check -- instruments/index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- instruments/index.html
          git commit -m 'Estate Laboratory: wrap dynamic result code on phone'
          git push origin "HEAD:$GITHUB_REF_NAME"
