name: Build Awards live media windowing

on:
  push:
    branches:
      - agent/awards-live-media-windowing-20260815
    paths:
      - '.github/workflows/build-awards-live-media-windowing.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/awards-live-media-windowing-20260815
          fetch-depth: 0

      - name: Apply presentation-layer media windowing only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          path = Path('showroom/globe/h-earth/awards/index.html')
          text = path.read_text()
          old = '.lens-media{max-width:880px;margin:22px 0 18px}.lens-media[hidden]{display:none}.lens-media-frame{position:relative;aspect-ratio:16/9;overflow:hidden;border:1px solid rgba(173,151,236,.34);border-radius:20px;background:#000;box-shadow:0 18px 55px rgba(0,0,0,.35)}.lens-media iframe,.lens-media video{position:absolute;inset:0;width:100%;height:100%;border:0}.lens-media video{display:block;object-fit:cover;object-position:center center;background:#000;cursor:pointer}'
          new = '.lens-media{width:min(560px,100%);max-width:100%;margin:22px auto 18px}.lens-media[hidden]{display:none}.lens-media-frame{position:relative;aspect-ratio:4/5;overflow:hidden;border:1px solid rgba(173,151,236,.34);border-radius:20px;background:#000;box-shadow:0 18px 55px rgba(0,0,0,.35)}.lens-media iframe,.lens-media video{position:absolute;inset:0;width:100%;height:100%;border:0}.lens-media video{display:block;object-fit:cover;object-position:center 52%;background:#000;cursor:pointer;transform:scale(1.12);transform-origin:center center}'
          if old not in text:
              raise SystemExit('target media CSS contract not found; refusing mutation')
          if text.count(old) != 1:
              raise SystemExit('target media CSS contract not unique; refusing mutation')
          text = text.replace(old, new)
          path.write_text(text)

          evidence = {
            'schema': 'AWARDS_LIVE_MEDIA_WINDOWING_EVIDENCE_v1',
            'route': 'showroom/globe/h-earth/awards/',
            'page': str(path),
            'presentationOnly': True,
            'videoAssetsMutated': False,
            'compassAsset': '/showroom/globe/h-earth/awards/media/diamond-gate-compass-mirrorland-36s.mp4',
            'worldAsset': '/showroom/globe/h-earth/awards/media/diamond-gate-h-earth-audralia-30s-vivaldi.mp4',
            'mediaWindow': {
              'maxWidthPx': 560,
              'aspectRatio': '4/5',
              'objectFit': 'cover',
              'objectPosition': 'center 52%',
              'overscanScale': 1.12
            },
            'law': {
              'existingEditedVideosRemainImmutable': True,
              'existingAudioRemainsImmutable': True,
              'noNewFootage': True,
              'noVideoReencoding': True,
              'cropOccursAtLivePagePresentationLayer': True,
              'publicPageSwitchRequiresExperienceReview': True
            },
            'pageSha256': hashlib.sha256(path.read_bytes()).hexdigest(),
            'status': 'CONSTRUCTED_PENDING_EXPERIENCE_REVIEW'
          }
          ev = Path('h-earth-3d/experience-anchor/evidence/AWARDS_LIVE_MEDIA_WINDOWING_20260815_001.json')
          ev.parent.mkdir(parents=True, exist_ok=True)
          ev.write_text(json.dumps(evidence, indent=2) + '\n')
          print(json.dumps(evidence, indent=2))
          PY

      - name: Verify videos remain referenced unchanged
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'diamond-gate-compass-mirrorland-36s.mp4' showroom/globe/h-earth/awards/index.html
          grep -F 'diamond-gate-h-earth-audralia-30s-vivaldi.mp4' showroom/globe/h-earth/awards/index.html
          git diff --exit-code -- showroom/globe/h-earth/awards/media/

      - name: Commit bounded page candidate and retire builder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add showroom/globe/h-earth/awards/index.html h-earth-3d/experience-anchor/evidence/AWARDS_LIVE_MEDIA_WINDOWING_20260815_001.json
          git rm .github/workflows/build-awards-live-media-windowing.yml
          git commit -m 'Construct Awards live media windowing candidate'
          git push origin HEAD:agent/awards-live-media-windowing-20260815
