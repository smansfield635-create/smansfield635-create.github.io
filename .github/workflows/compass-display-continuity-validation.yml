              check(`${name}_CARDINALS`,JSON.stringify(result.cardinals)===JSON.stringify(['north','east','south','west']),result);check(`${name}_ROOMS`,result.rooms===19,result);check(`${name}_MIRRORLAND`,result.mirrorRoutes===3,result);check(`${name}_SUCCESSOR_SURFACES`,result.capabilities===3&&result.capabilityFront===1&&result.proofs===3&&result.proofFront===1,result);check(`${name}_LEGACY_BOOTSTRAP_BLOCKED`,result.guard.version==='v1'&&result.guard.blocked.length===2&&requests.every(url=>!url.includes('/assets/compass/compass.carousel.')),{guard:result.guard,legacyRequests:requests.filter(url=>url.includes('/assets/compass/compass.carousel.'))});check(`${name}_LOWER_HIERARCHY`,result.buildSeparated,result);check(`${name}_D1_NEURAL_GLASS`,result.brain.material==='PEARL_SMOKED_NEURAL_GLASS_V1'&&result.brain.palette==='#D8E3E2,#756982,#66CDE0,#F4D680,#14212B',result.brain);check(`${name}_D2_TROPHY_SUPERSESSION`,result.trophy.root===1&&result.trophy.bowl===1&&result.trophy.handles===2&&result.trophy.stem===1&&result.trophy.base===1&&result.trophy.gleam===1&&result.trophy.legacy===0,result.trophy);check(`${name}_D3_ATOMIC_DEPTH`,result.rearBodiesHidden&&result.noBlur,{rearBodiesHidden:result.rearBodiesHidden,noBlur:result.noBlur});check(`${name}_D4_HOUSE_BALANCE`,result.houseCentered,result.houseCentered);check(`${name}_D5_ENTRANCE_CUE`,JSON.stringify(result.cue)===JSON.stringify(['Three ways to engage.']),result.cue);check(`${name}_D6_STATUS_RAILS`,JSON.stringify(result.rails.map(value=>value.kind))===JSON.stringify(['capability','proof'])&&result.rails.every(value=>value.hidden==='true'&&value.interactive===0&&JSON.stringify(value.states)===JSON.stringify(['current','unseen','unseen']))&&JSON.stringify(result.rails[0].labels)===JSON.stringify(['Diagnostic','Awards','House'])&&JSON.stringify(result.rails[1].labels)===JSON.stringify(['TRL 7','Bounded','Checked']),result.rails);check(`${name}_GUIDANCE_VISIBLE`,result.guidance,result);check(`${name}_TARGET_SIZES`,result.targets.every(target=>target.width>=44&&target.height>=44),result.targets);check(`${name}_NO_OVERFLOW`,result.overflow<=2,result);check(`${name}_INTRO_COLLAPSED`,result.introOpen===false,result);check(`${name}_NO_ERRORS`,errors.length===0,errors);await page.screenshot({path:`/tmp/compass-display-${name}.png`,fullPage:true});await context.close();
            }
            const context=await browser.newContext({viewport:{width:1280,height:900}}),page=await context.newPage();await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});await page.waitForTimeout(500);const north=page.locator('[data-cardinal-id="north"]');await north.focus();check('CARDINAL_KEYBOARD_FOCUS',await north.evaluate(element=>document.activeElement===element),true);await north.press('Enter');await page.waitForTimeout(500);const opened=await page.locator('[data-compass-root]').evaluate(element=>({mode:element.dataset.compassMode,selected:element.dataset.selectedCardinal,preview:element.dataset.clusterPreviewPrimaryRoom||'',enterDisabled:document.querySelector('[data-compass-enter]')?.disabled,guidance:document.querySelector('[data-compass-guidance]')?.textContent.trim()}));check('CARDINAL_CLUSTER_CONTINUITY',opened.mode==='CLUSTER_OPEN'&&opened.selected==='north'&&opened.preview&&opened.enterDisabled===false,opened);const roomSelected=await page.evaluate(()=>globalThis.DGB_COMPASS_CONTROLLER?.requestRoomSelection('north-1')===true);await page.waitForTimeout(300);const selected=await page.locator('[data-compass-root]').evaluate(element=>({mode:element.dataset.compassMode,room:element.dataset.selectedRoom,returnVisible:Boolean(document.querySelector('[data-compass-return-to-orbit]')?.offsetParent)}));check('ROOM_SELECTION_CONTINUITY',roomSelected&&selected.mode==='ROOM_SELECTED'&&selected.room==='north-1'&&selected.returnVisible,selected);await page.locator('[data-compass-return-to-orbit]').click();await page.waitForTimeout(300);check('EXPLICIT_RETURN_CONTINUITY',(await page.locator('[data-compass-root]').getAttribute('data-compass-mode'))==='CLUSTER_OPEN',await page.locator('[data-compass-root]').getAttribute('data-compass-mode'));await context.close();
            const reducedContext=await browser.newContext({viewport:{width:390,height:844},reducedMotion:'reduce'}),reduced=await reducedContext.newPage();await reduced.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});await reduced.waitForFunction(()=>globalThis.CompassEditorialCarousel?.version==='root-award-finish-successor-v1');await reduced.waitForTimeout(500);check('REDUCED_MOTION_SEMANTIC_EQUIVALENCE',await reduced.locator('[data-compass-cardinal]').count()===4&&await reduced.locator('[data-capability-orbit] > [data-capability]').count()===3&&await reduced.locator('[data-proof-card]').count()===3,{cardinals:await reduced.locator('[data-compass-cardinal]').count(),capabilities:await reduced.locator('[data-capability-orbit] > [data-capability]').count(),proofs:await reduced.locator('[data-proof-card]').count()});const reducedStage=reduced.locator('[data-capability-orbit]');await reducedStage.focus();await reducedStage.press('ArrowRight');const reducedCapability=await reduced.evaluate(()=>({front:document.querySelector('[data-capability][data-slot="front"]')?.dataset.capability,rail:[...document.querySelectorAll('[data-status-rail="capability"] li')].map(item=>item.dataset.state),animations:document.querySelector('.compass-award-trophy')?.getAnimations({subtree:true}).filter(animation=>animation.playState==='running').length}));check('REDUCED_TROPHY_STATIC_EQUIVALENCE',reducedCapability.front==='awards'&&JSON.stringify(reducedCapability.rail)===JSON.stringify(['visited','current','unseen'])&&reducedCapability.animations===0,reducedCapability);const reducedProof=reduced.locator('[data-proof-orbit]');await reducedProof.focus();await reducedProof.press('ArrowRight');const reducedProofState=await reduced.evaluate(()=>({front:document.querySelector('[data-proof-card][data-slot="front"]')?.dataset.proofCard,rail:[...document.querySelectorAll('[data-status-rail="proof"] li')].map(item=>item.dataset.state)}));check('REDUCED_PROOF_SETTLEMENT',reducedProofStat