name: H-Earth C2-R1 Camera Height Visual Lab Delivery Check

on:
  push:
    branches:
      - experiment/h-earth-c2-r1-camera-height-visual-lab-001
    paths:
      - .github/workflows/h-earth-c2-r1-camera-height-visual-lab-delivery-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Execute immutable preview candidates in Chromium
        env:
          EXACT_PREVIEW_HEAD: 8e404ec2580d4a1f99e7997e580f71d92a8c4fd6
          EXACT_PREVIEW_PATH: preview/h-earth/c2-r1/camera-height-visual-lab-001/index.html
        run: |
          cat > /tmp/verify-camera-height-lab.cjs <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          const owner = 'smansfield635-create';
          const repo = 'smansfield635-create.github.io';
          const head = process.env.EXACT_PREVIEW_HEAD;
          const path = process.env.EXACT_PREVIEW_PATH;
          const baseCandidates = [
            {
              method: 'RAWCDN_GITHACK_IMMUTABLE_COMMIT',
              base: `https://rawcdn.githack.com/${owner}/${repo}/${head}/${path}`
            },
            {
              method: 'JSDELIVR_GITHUB_IMMUTABLE_COMMIT',
              base: `https://cdn.jsdelivr.net/gh/${owner}/${repo}@${head}/${path}`
            },
            {
              method: 'STATICALY_GITHUB_IMMUTABLE_COMMIT',
              base: `https://cdn.statically.io/gh/${owner}/${repo}/${head}/${path}`
            }
          ];

          const waitForLab = async (page, timeout = 150000) => {
            await page.waitForFunction(() => {
              const lab = window.H_EARTH_CAMERA_HEIGHT_VISUAL_LAB;
              const root = document.getElementById('h-earth-functional-landscape-route');
              const panel = document.querySelector('.h-earth-camera-height-lab');
              const canvas = document.getElementById('h-earth-functional-landscape-canvas');
              return Boolean(
                lab &&
                root?.dataset?.run8eReady === 'true' &&
                panel &&
                canvas instanceof HTMLCanvasElement
              );
            }, null, { timeout });
          };

          const snapshot = async page => page.evaluate(() => {
            const lab = window.H_EARTH_CAMERA_HEIGHT_VISUAL_LAB;
            const api = window.H_EARTH_RUN8E_PUBLIC_ROUTE;
            const state = api?.getIntakeReceipt?.()?.currentNavigationState ?? null;
            const canvas = document.getElementById('h-earth-functional-landscape-canvas');
            const gl = canvas?.getContext?.('webgl2') ?? null;
            const panel = document.querySelector('.h-earth-camera-height-lab');
            const range = document.getElementById('h-earth-camera-height-range');
            const presetButtons = [...document.querySelectorAll('#h-earth-camera-height-presets button')];
            return {
              href: location.href,
              title: document.title,
              lab,
              state,
              rootReady: document.getElementById('h-earth-functional-landscape-route')?.dataset?.run8eReady ?? null,
              rootError: document.getElementById('h-earth-functional-landscape-route')?.dataset?.run8eError ?? null,
              panelPresent: Boolean(panel),
              range: range ? {
                min: Number(range.min),
                max: Number(range.max),
                step: Number(range.step),
                value: Number(range.value)
              } : null,
              presets: presetButtons.map(button => Number(button.textContent)),
              observedStatus: document.getElementById('h-earth-camera-height-status')?.textContent ?? null,
              webgl2ContextPresent: Boolean(gl),
              canvasSize: canvas ? { width: canvas.width, height: canvas.height } : null
            };
          });

          const validateSnapshot = (record, expectedHeight) => {
            const state = record.state;
            const lab = record.lab;
            const failures = [];
            const close = (left, right, epsilon = 1e-6) => Math.abs(Number(left) - Number(right)) <= epsilon;
            if (!record.panelPresent) failures.push('CAMERA_HEIGHT_PANEL_MISSING');
            if (!record.webgl2ContextPresent) failures.push('WEBGL2_CONTEXT_MISSING');
            if (record.rootReady !== 'true' || record.rootError === 'true') failures.push('RUN8E_RUNTIME_NOT_HEALTHY');
            if (!lab || lab.previewOnly !== true) failures.push('LAB_API_MISSING');
            if (!state) failures.push('NAVIGATION_STATE_MISSING');
            if (!close(lab?.selectedEyeHeight, expectedHeight)) failures.push('SELECTED_HEIGHT_MISMATCH');
            if (!close(state?.clearance, expectedHeight)) failures.push('OBSERVED_CLEARANCE_MISMATCH');
            if (!close(state?.position?.x, 0)) failures.push('CAMERA_X_CHANGED');
            if (!close(state?.position?.z, -96)) failures.push('CAMERA_Z_CHANGED');
            if (!close(state?.yawDegrees, 0)) failures.push('YAW_CHANGED');
            if (!close(state?.pitchDegrees, 8)) failures.push('PITCH_CHANGED');
            if (!close(state?.verticalFovDegrees, 56)) failures.push('VERTICAL_FOV_CHANGED');
            if (!close(lab?.currentNavigationState?.position?.y, state?.position?.y)) failures.push('OBSERVED_CAMERA_Y_NOT_EXTERNALIZED');
            if (lab?.defaultProductStateMutated !== false) failures.push('DEFAULT_PRODUCT_STATE_MUTATION_CLAIM');
            if (!record.range || !close(record.range.min, 2.25) || !close(record.range.max, 8.25) || !close(record.range.step, 0.25)) {
              failures.push('HEIGHT_RANGE_CONTROL_INVALID');
            }
            const expectedPresets = [2.25, 3.75, 5.25, 6.75, 8.25];
            if (JSON.stringify(record.presets) !== JSON.stringify(expectedPresets)) failures.push('PRESET_SET_INVALID');
            return failures;
          };

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: [
                '--use-gl=swiftshader',
                '--enable-webgl',
                '--ignore-gpu-blocklist',
                '--disable-dev-shm-usage'
              ]
            });
            const results = [];
            let ready = null;

            for (const candidate of baseCandidates) {
              const context = await browser.newContext({
                viewport: { width: 1440, height: 900 },
                deviceScaleFactor: 1,
                ignoreHTTPSErrors: false
              });
              const page = await context.newPage();
              const consoleErrors = [];
              const pageErrors = [];
              const requestFailures = [];
              page.on('console', message => {
                if (message.type() === 'error') consoleErrors.push(message.text());
              });
              page.on('pageerror', error => pageErrors.push(error.stack || error.message));
              page.on('requestfailed', request => requestFailures.push({
                url: request.url(),
                errorText: request.failure()?.errorText ?? null
              }));

              const candidateResult = {
                method: candidate.method,
                base: candidate.base,
                attempts: [],
                consoleErrors,
                pageErrors,
                requestFailures
              };

              try {
                const baselineUrl = `${candidate.base}?cameraHeight=2.25`;
                const baselineResponse = await page.goto(baselineUrl, {
                  waitUntil: 'domcontentloaded',
                  timeout: 60000
                });
                await waitForLab(page);
                const baseline = await snapshot(page);
                const baselineFailures = validateSnapshot(baseline, 2.25);
                candidateResult.attempts.push({
                  type: 'BASELINE_QUERY',
                  url: baselineUrl,
                  httpStatus: baselineResponse?.status() ?? null,
                  snapshot: baseline,
                  failures: baselineFailures
                });
                if (baselineFailures.length) throw new Error(`BASELINE_VALIDATION_FAILED:${baselineFailures.join(',')}`);

                const queryUrl = `${candidate.base}?cameraHeight=5.25`;
                const queryResponse = await page.goto(queryUrl, {
                  waitUntil: 'domcontentloaded',
                  timeout: 60000
                });
                await waitForLab(page);
                const querySnapshot = await snapshot(page);
                const queryFailures = validateSnapshot(querySnapshot, 5.25);
                candidateResult.attempts.push({
                  type: 'QUERY_PARAMETER',
                  url: queryUrl,
                  httpStatus: queryResponse?.status() ?? null,
                  snapshot: querySnapshot,
                  failures: queryFailures
                });
                if (queryFailures.length) throw new Error(`QUERY_VALIDATION_FAILED:${queryFailures.join(',')}`);

                await page.locator('#h-earth-camera-height-presets button', { hasText: '8.25' }).click();
                await page.waitForURL(url => url.searchParams.get('cameraHeight') === '8.25', { timeout: 30000 });
                await waitForLab(page);
                const presetSnapshot = await snapshot(page);
                const presetFailures = validateSnapshot(presetSnapshot, 8.25);
                candidateResult.attempts.push({
                  type: 'PRESET_BUTTON',
                  url: page.url(),
                  snapshot: presetSnapshot,
                  failures: presetFailures
                });
                if (presetFailures.length) throw new Error(`PRESET_VALIDATION_FAILED:${presetFailures.join(',')}`);

                await page.locator('#h-earth-camera-height-range').evaluate((element) => {
                  element.value = '6.75';
                  element.dispatchEvent(new Event('input', { bubbles: true }));
                  element.dispatchEvent(new Event('change', { bubbles: true }));
                });
                await page.waitForURL(url => url.searchParams.get('cameraHeight') === '6.75', { timeout: 30000 });
                await waitForLab(page);
                const rangeSnapshot = await snapshot(page);
                const rangeFailures = validateSnapshot(rangeSnapshot, 6.75);
                candidateResult.attempts.push({
                  type: 'RANGE_CONTROL',
                  url: page.url(),
                  snapshot: rangeSnapshot,
                  failures: rangeFailures
                });
                if (rangeFailures.length) throw new Error(`RANGE_VALIDATION_FAILED:${rangeFailures.join(',')}`);

                const blockingConsoleErrors = consoleErrors.filter(text =>
                  !/favicon/i.test(text) &&
                  !/Failed to load resource.*404/i.test(text)
                );
                const blockingRequestFailures = requestFailures.filter(entry => !/favicon/i.test(entry.url));
                if (pageErrors.length || blockingConsoleErrors.length || blockingRequestFailures.length) {
                  throw new Error(`RUNTIME_FAILURES:${JSON.stringify({ pageErrors, blockingConsoleErrors, blockingRequestFailures })}`);
                }

                await page.screenshot({
                  path: 'camera-height-visual-lab-browser.png',
                  fullPage: true
                });
                candidateResult.result = 'PASS';
                candidateResult.verifiedUserAccessUrl = queryUrl;
                ready = candidateResult;
                results.push(candidateResult);
                await context.close();
                break;
              } catch (error) {
                candidateResult.result = 'FAIL';
                candidateResult.error = error.stack || error.message || String(error);
                results.push(candidateResult);
                await context.close();
              }
            }

            await browser.close();

            const receipt = {
              receiptType: 'H_EARTH_C2_R1_CAMERA_HEIGHT_VISUAL_LAB_BROWSER_DELIVERY_RECEIPT_v1',
              operationId: 'H_EARTH_C2_R1_CAMERA_HEIGHT_VISUAL_LAB_DELIVERY_CORRECTION_001',
              exactPreviewHead: head,
              exactPreviewPath: path,
              browser: 'PLAYWRIGHT_CHROMIUM_HEADLESS_1440x900_SWIFTSHADER_WEBGL',
              result: ready ? 'CAMERA_HEIGHT_VISUAL_LAB_USER_ACCESS_READY' : 'BLOCKED_WITH_ONE_EXACT_VISUAL_LAB_DELIVERY_CONTRADICTION',
              verifiedUserAccessUrl: ready?.verifiedUserAccessUrl ?? null,
              deliveryMethod: ready?.method ?? null,
              candidates: results,
              unauthorizedMutationCount: 0,
              timestamp: new Date().toISOString()
            };
            fs.writeFileSync('camera-height-visual-lab-delivery-receipt.json', JSON.stringify(receipt, null, 2) + '\n');
            console.log(JSON.stringify(receipt, null, 2));
            if (!ready) process.exit(1);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node /tmp/verify-camera-height-lab.cjs

      - name: Upload browser execution receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-camera-height-visual-lab-delivery-receipt
          path: |
            camera-height-visual-lab-delivery-receipt.json
            camera-height-visual-lab-browser.png
          if-no-files-found: warn
          retention-days: 30
