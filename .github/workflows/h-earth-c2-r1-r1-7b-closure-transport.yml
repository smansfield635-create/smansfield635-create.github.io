name: H-Earth C2-R1 R1.7B Closure Transport

on:
  pull_request:
    branches:
      - closure/h-earth-c2-r1-r1-7b-durable-001
    paths:
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/transport/r1-7b-closure-trigger.txt'

permissions:
  contents: write

concurrency:
  group: h-earth-c2-r1-r1-7b-closure-transport
  cancel-in-progress: false

jobs:
  close-r1-7b:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_HEAD: f1ba63b088f89c6539d92d5293ba1eb651644480
      TARGET_BRANCH: closure/h-earth-c2-r1-r1-7b-durable-001
      ARTIFACT_ID: '8811649872'
      ARTIFACT_DIGEST: 6516110abe68a14160b64b4dbc0ed5dd3996128260806d4c21f773edb82b9ae4
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: closure/h-earth-c2-r1-r1-7b-durable-001
          fetch-depth: 0

      - name: Verify isolated target state
        run: |
          test "$(git rev-parse "$BASE_HEAD")" = "$BASE_HEAD"
          git merge-base --is-ancestor "$BASE_HEAD" HEAD
          test "$(git diff --name-only "$BASE_HEAD" HEAD)" = ".github/workflows/h-earth-c2-r1-r1-7b-closure-transport.yml"

      - name: Download and verify exact passing artifact
        run: |
          mkdir -p /tmp/r17b
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/r17b/artifact.zip
          echo "${ARTIFACT_DIGEST}  /tmp/r17b/artifact.zip" | sha256sum -c -
          unzip -q /tmp/r17b/artifact.zip -d /tmp/r17b/exact
          echo '0927022ab382e046a7d5fa32e81e7ebe64b6876bf22576b1b5916f024222d003  /tmp/r17b/exact/h-earth.c2-r1.r1-7b-verification.json' | sha256sum -c -
          echo '78a1915a82415b29ca9ae844f5ce1ef3871a518a071fc0b597498eaa913ee615  /tmp/r17b/exact/r1-7b-engineering-captures/h-earth.c2-r1.r1-7b-albedo-roughness.svg' | sha256sum -c -
          echo '4fb1c6379500d1ea81c68fbf3896e82f9faf49005dbcc9052461940638ca8bee  /tmp/r17b/exact/r1-7b-engineering-captures/h-earth.c2-r1.r1-7b-cavity-normal.svg' | sha256sum -c -
          echo '018fac4b0f6f6038444116d01fdd6b760000063e620290491a18ec45589b2938  /tmp/r17b/exact/r1-7b-engineering-captures/h-earth.c2-r1.r1-7b-coastal-preservation.svg' | sha256sum -c -

      - name: Materialize bounded durable closure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, shutil

          root=Path('.')
          exact=Path('/tmp/r17b/exact')
          base='f1ba63b088f89c6539d92d5293ba1eb651644480'
          ev=root/'h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence'
          proj=ev/'r1-7b-engineering-captures'
          proj.mkdir(parents=True,exist_ok=True)
          receipt_text=(exact/'h-earth.c2-r1.r1-7b-verification.json').read_text()
          receipt=json.loads(receipt_text)
          (ev/'h-earth.c2-r1.r1-7b-verification.json').write_text(receipt_text)

          def git_blob(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()

          def project(src,dst):
              text=src.read_text()
              labels=re.findall(r'<text[^>]*>(.*?)</text>',text)
              rects=re.findall(r'<rect x="([^"]+)" y="([^"]+)" width="([^"]+)" height="([^"]+)" fill="([^"]+)"',text)
              mapping={(float(x),float(y)):fill for x,y,w,h,fill in rects}
              xs=sorted({x for x,y in mapping}); ys=sorted({y for x,y in mapping})
              panels=(xs[:17],xs[17:]); xidx=(0,4,8,12,16); yidx=(0,6,12,17,23,29,35,40,46,52)
              cell=28; gap=18; margin=18; title_h=62; label_h=28; panel_w=5*cell
              width=margin*2+panel_w*2+gap; height=title_h+label_h+10*cell+44
              source_sha=hashlib.sha256(text.encode()).hexdigest()
              out=[f'<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="{height}" viewBox="0 0 {width} {height}">',
                   '<rect width="100%" height="100%" fill="#11151b"/>',
                   f'<text x="{margin}" y="24" fill="#f0f3f7" font-family="monospace" font-size="14">{labels[0]} — bounded 5×10 projection</text>',
                   f'<text x="{margin}" y="44" fill="#9ca7b5" font-family="monospace" font-size="10">Source SHA-256: {source_sha}</text>']
              for pidx,(panel_xs,label) in enumerate(zip(panels,labels[1:3])):
                  x0=margin+pidx*(panel_w+gap)
                  out.append(f'<text x="{x0}" y="{title_h+16}" fill="#dce3ea" font-family="monospace" font-size="11">{label}</text>')
                  for ry,yi in enumerate(yidx):
                      for cx,xi in enumerate(xidx):
                          fill=mapping[(panel_xs[xi],ys[yi])]
                          out.append(f'<rect x="{x0+cx*cell}" y="{title_h+label_h+ry*cell}" width="{cell-1}" height="{cell-1}" fill="{fill}"/>')
              out.append(f'<text x="{margin}" y="{title_h+label_h+10*cell+20}" fill="#9ca7b5" font-family="monospace" font-size="10">Documented downsampled projection of exact workflow capture; engineering evidence only.</text>')
              out.append('</svg>')
              projection=''.join(out)+'\n'
              dst.write_text(projection)
              return {'sourceSha256':source_sha,'sha256':hashlib.sha256(projection.encode()).hexdigest(),'gitBlobSha':git_blob(projection.encode())}

          projections={}
          for src in sorted((exact/'r1-7b-engineering-captures').glob('*.svg')):
              projections[src.name]=project(src,proj/src.name)

          workflow='''name: H-Earth C2-R1 R1.7B Baked Macro Control Field

on:
  workflow_dispatch:

concurrency:
  group: h-earth-c2-r1-r1-7b-${{ github.ref }}
  cancel-in-progress: true

