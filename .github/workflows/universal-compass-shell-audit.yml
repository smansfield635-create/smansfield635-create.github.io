name: Universal Compass Shell Audit

on:
  pull_request:
    branches:
      - agent/universal-compass-shell-audit-base-001

permissions:
  contents: read

jobs:
  audit-universal-compass-shell:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out audit merge
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify static route boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 > /tmp/universal-compass-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          sleep 1

          page_status=$(curl -sS -o /tmp/universal-compass-index.html -w '%{http_code}' \
            http://127.0.0.1:8765/prototypes/universal-compass/index.html)
          bootstrap_status=$(curl -sS -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8765/prototypes/universal-compass/index.js)
          contracts_status=$(curl -sS -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8765/prototypes/universal-compass/compass.contracts.js)
          math_status=$(curl -sS -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8765/prototypes/universal-compass/compass.math.js)

          test "$page_status" = "200"
          test "$bootstrap_status" = "404"
          test "$contracts_status" = "404"
          test "$math_status" = "404"

          printf '%s\n' \
            "ROUTE_HTML_STATUS=$page_status" \
            "ROUTE_BOOTSTRAP_STATUS=$bootstrap_status" \
            "ROUTE_CONTRACTS_STATUS=$contracts_status" \
            "ROUTE_MATH_STATUS=$math_status"

      - name: Execute seven-file shell audit
        run: node .audit/universal-compass-shell-audit.mjs
