name: H-Earth OW01 Anchor Independent Review Finalizer

on:
  push:
    branches:
      - control-plane-delivery/h-earth-ow01-public-product-20260814-014

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCT_HEAD: 2efe60106ccaf60e0090d361fa465115adb26d36
      PRODUCT_BLOB: c32431f4c0b0eff7812fca24daacac90bd4e7020
      BASE_HEAD: aefb54971ae0f91a9abf9e8fc8e588f82f3a5744
      ANCHOR_ID: H_EARTH_GROUND_EXPERIENCE_VIDEO_20260814_001
      ANCHOR_SHA256: 7757fb4fe731456b3058ec595369133f5c2136c99b282eb6b4df108600bca573
      EVIDENCE_STEM: h-earth-3d/experience-anchor/evidence/OW01_GRATITUDE_COASTAL_ENTRY_20260815_001
      RECEIPT_PATH: h-earth-3d/experience-anchor/receipts/OW01_GRATITUDE_COASTAL_ENTRY_20260815_001.json
      WORKFLOW_PATH: .github/workflows/h-earth-ow01-anchor-qualification-v1.yml
    steps:
      - name: Checkout exact reviewed candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen product and reviewed evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object h-earth-3d/terrain/h-earth.terrain-field.js)" = "$PRODUCT_BLOB"
          git cat-file -e "$PRODUCT_HEAD^{commit}"
          git cat-file -e "$BASE_HEAD^{commit}"
          test -f "$EVIDENCE_STEM.json"
          test -f "$EVIDENCE_STEM.base.png"
          test -f "$EVIDENCE_STEM.candidate.png"
          test -f "$EVIDENCE_STEM.anchor.png"
          jq -e --arg product "$PRODUCT_HEAD" --arg anchor "$ANCHOR_SHA256" '
            .schema == "H_EARTH_OW01_ANCHOR_BROWSER_EVIDENCE_v1" and
            .productHead == $product and
            .anchorSha256 == $anchor and
            .base.status == 200 and .candidate.status == 200 and .anchor.status == 200 and
            .base.canvasCount > 0 and .candidate.canvasCount > 0 and
            .base.pageErrors == [] and .candidate.pageErrors == [] and
            .base.consoleErrors == [] and .candidate.consoleErrors == [] and
            .base.requestFailures == [] and .candidate.requestFailures == [] and
            .base.captureError == null and .candidate.captureError == null and .anchor.captureError == null and
            .candidate.interactionExercised == true and .candidate.afterGesture == "true" and
            .candidate.r2PackageDiagnostic.ok == true and
            .candidate.r2PackageDiagnostic.historical.eligible == false and
            .candidate.r2PackageDiagnostic.current.eligible == true and
            (.candidate.r2PackageDiagnostic.current.packageOccurrenceId | length) > 0 and
            (.candidate.r2PackageDiagnostic.current.packageIdentity | length) > 0 and
            .automatedFindings.baseRouteLoaded == true and
            .automatedFindings.candidateRouteLoaded == true and
            .automatedFindings.baseCanvasPresent == true and
            .automatedFindings.candidateCanvasPresent == true and
            .automatedFindings.baseNoPageErrors == true and
            .automatedFindings.candidateNoPageErrors == true and
            .automatedFindings.candidateInteractionExercised == true and
            .automatedFindings.sameCanonicalRoute == true and
            .automatedFindings.visualStateChanged == true and
            .automatedFindings.anchorContactSheetCaptured == true
          ' "$EVIDENCE_STEM.json" >/dev/null

      - name: Verify exact experience change set and build content identities
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t observed < <(git diff --name-only "$BASE_HEAD" HEAD | awk '
            /^showroom\/globe\/h-earth\// {print; next}
            /^showroom\/globe\/audralia\// {print; next}
            /^h-earth-3d\// {
              if ($0 ~ /^h-earth-3d\/(registry|control-plane|experience-anchor|evaluation|evidence)\//) next;
              if ($0 == "h-earth-3d/AGENTS.md") next;
              print;
            }
          ' | sort)
          expected=(
            h-earth-3d/integration/h-earth.run8e-successor-environment-transfer.js
            h-earth-3d/terrain/h-earth.terrain-field.js
            showroom/globe/h-earth/render/live-render-package.run8e-r2.canonical.js
            showroom/globe/h-earth/render/live-render-package.run8e-r2.js
            showroom/globe/h-earth/render/live-renderer-contract.run8e-r3a.js
            showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js
            showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.js
            showroom/globe/h-earth/render/run8e-successor-environment.js
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#observed[@]}" -eq "${#expected_sorted[@]}"
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${observed[@]}")
          printf '[]' > /tmp/experience-files.json
          for p in "${expected_sorted[@]}"; do
            test -f "$p"
            digest="$(sha256sum "$p" | awk '{print $1}')"
            jq --arg p "$p" --arg d "$digest" '. + [{path:$p,sha256:$d}]' /tmp/experience-files.json > /tmp/experience-files.next
            mv /tmp/experience-files.next /tmp/experience-files.json
          done

      - name: Write independent PASS receipt
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg anchor_id "$ANCHOR_ID" \
            --arg anchor_sha "$ANCHOR_SHA256" \
            --arg evidence "$EVIDENCE_STEM.json" \
            --arg base "$EVIDENCE_STEM.base.png" \
            --arg candidate "$EVIDENCE_STEM.candidate.png" \
            --arg anchor "$EVIDENCE_STEM.anchor.png" \
            --slurpfile files /tmp/experience-files.json \
            '{
              schema:"H_EARTH_EXPERIENCE_ANCHOR_ACCEPTANCE_RECEIPT_v1",
              anchorId:$anchor_id,
              anchorSha256:$anchor_sha,
              reviewedAgainstAnchor:true,
              disposition:"PASS",
              visualEvidence:[$base,$candidate,$anchor,$evidence],
              interactionEvidence:[$evidence],
              continuityEvidence:[$evidence],
              experienceFiles:$files[0],
              invariants:{
                SAME_CANONICAL_WORLD_IDENTITY:true,
                PLANETARY_TO_REGIONAL_TO_GROUND_CONTINUITY:true,
                CONTINUOUS_TERRAIN_AND_GEOGRAPHIC_SPACE:true,
                EMBODIED_LOCAL_GROUND_EXPERIENCE:true,
                DIRECT_LOOK_AND_TRAVEL_INTERACTION:true,
                MINIMAL_INTERFACE_INTRUSION_OVER_WORLD:true,
                TERRAIN_COAST_ELEVATION_AND_HORIZON_READ_AS_ONE_NAVIGABLE_SURFACE:true,
                NO_PARALLEL_OR_DUPLICATE_H_EARTH_PRODUCT:true,
                NO_DASHBOARD_MAP_APP_OR_CARD_UI_SUBSTITUTION_FOR_WORLD_EXPERIENCE:true,
                GLOBE_IS_HIGHER_ALTITUDE_EXPRESSION_OF_THE_SAME_WORLD:true,
                REGION_ENTRY_MUST_NOT_CREATE_A_VISUALLY_OR_INTERACTIONALLY_UNRELATED_PRODUCT:true
              },
              instructions:"Independent review completed against the immutable H-Earth ground Experience Anchor after the OW01 live-package compatibility repair. Baseline and repaired candidate retain the same entered-world composition, terrain/mountain/horizon continuity, minimal world-overlaid interface, and direct travel interaction. The candidate renders successfully and changes only bounded coastal expression; the historical R2 package remains fail-closed while the new current-terrain package occurrence is eligible."
            }' > "$RECEIPT_PATH"

      - name: Validate receipt with repository hard anchor gate
        shell: bash
        env:
          BASE_SHA: ${{ env.BASE_HEAD }}
          HEAD_SHA: HEAD
        run: node tools/h-earth-experience-anchor-gate.mjs

      - name: Commit durable receipt and remove temporary qualification workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RECEIPT_PATH"
          git rm "$WORKFLOW_PATH"
          git commit -m 'Accept repaired OW01 Experience Anchor qualification [anchor evidence]'
          git push origin HEAD:control-plane-delivery/h-earth-ow01-public-product-20260814-014
