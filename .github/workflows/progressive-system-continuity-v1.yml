name: Progressive System Continuity v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'AI_ENTRYPOINT.json'
      - '.github/ai-router/router.v1.json'
      - '.github/ai-router/system-continuity/**'
      - '.github/workflows/progressive-system-continuity-v1.yml'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'AI_ENTRYPOINT.json'
      - '.github/ai-router/router.v1.json'
      - '.github/ai-router/system-continuity/**'
      - '.github/workflows/progressive-system-continuity-v1.yml'
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: progressive-system-continuity-${{ github.event_name }}-${{ github.ref || github.event.issue.number }}
  cancel-in-progress: false

env:
  PROTOCOL_PATH: .github/ai-router/system-continuity/progressive-system-continuity-protocol.v1.json
  GATE_PATH: .github/ai-router/system-continuity/progressive-system-continuity-gate.v1.mjs
  SELF_TEST_PATH: .github/ai-router/system-continuity/progressive-system-continuity-self-test.v1.mjs
  GAP_REGISTRY_PATH: .github/ai-router/system-continuity/gap-registry.v1.json
  WORKFLOW_PATH: .github/workflows/progressive-system-continuity-v1.yml
  REMOTE_MARKER: PROGRESSIVE_SYSTEM_CONTINUITY_REQUEST_V1

jobs:
  validate:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify continuity package and router ownership
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROTOCOL_PATH"
          test -f "$GATE_PATH"
          test -f "$SELF_TEST_PATH"
          test -f "$GAP_REGISTRY_PATH"
          test -f "$WORKFLOW_PATH"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync(process.env.PROTOCOL_PATH,'utf8'));
          const g=JSON.parse(fs.readFileSync(process.env.GAP_REGISTRY_PATH,'utf8'));
          const e=JSON.parse(fs.readFileSync('AI_ENTRYPOINT.json','utf8'));
          const r=JSON.parse(fs.readFileSync('.github/ai-router/router.v1.json','utf8'));
          if(p.protocolId!=='REPOSITORY_PROGRESSIVE_SYSTEM_CONTINUITY_TRACK_v1') throw new Error('PROGRESSIVE_PROTOCOL_IDENTITY_INVALID');
          if(g.status!=='ACTIVE_FAIL_CLOSED') throw new Error('GAP_REGISTRY_STATUS_INVALID');
          if(e.systemContinuityTrack?.protocol!==process.env.PROTOCOL_PATH) throw new Error('ROOT_CONTINUITY_BINDING_INVALID');
          if(e.executionBackendRegistry!==r.executionBackendRegistry) throw new Error('EXECUTION_BACKEND_POINTER_DIVERGENCE');
          const paths=['AGENTS.md','AI_ENTRYPOINT.json','.github/ai-router/router.v1.json',process.env.PROTOCOL_PATH,process.env.GATE_PATH,process.env.SELF_TEST_PATH,process.env.GAP_REGISTRY_PATH,process.env.WORKFLOW_PATH];
          const infra=r.routerInfrastructure;
          const owned=path=>infra.ownedExactPaths.includes(path)||(infra.ownedPathPrefixes??[]).some(prefix=>path.startsWith(prefix));
          if(paths.some(path=>!owned(path))) throw new Error('ROUTER_INFRASTRUCTURE_STATIC_OWNERSHIP_INVALID');
          const backend=JSON.parse(fs.readFileSync(e.executionBackendRegistry,'utf8'));
          const activeLegacy=backend.schema==='REPOSITORY_AI_EXECUTION_BACKEND_REGISTRY_v1'&&backend.status==='ACTIVE';
          const retired=backend.schema==='PUBLIC_GOVERNANCE_RETIREMENT_HANDOFF_v1'&&
            backend.result==='PUBLIC_GOVERNANCE_IMPLEMENTATION_RETIRED'&&
            backend.authorityCreated===false&&backend.executionAuthorized===false&&
            backend.mutationAuthorized===false&&backend.mergeAuthorized===false&&
            backend.forwardingPerformed===false;
          if(!activeLegacy&&!retired) throw new Error('EXECUTION_BACKEND_STATE_UNRECOGNIZED_FAIL_CLOSED');
          const receipt={schema:'PROGRESSIVE_SYSTEM_CONTINUITY_ROUTER_PREREQUISITE_RECEIPT_v1',result:'PASS',mode:activeLegacy?'ACTIVE_LEGACY_ROUTER':'PUBLIC_GOVERNANCE_RETIREMENT_HANDOFF',routerDisposition:'PASS',routerPathCount:paths.length,staticOwnershipVerified:true,retirementHandoffVerified:retired,legacyRouterExecutionRequired:activeLegacy,retiredRouterExecutionProhibited:retired};
          fs.writeFileSync(process.env.RUNNER_TEMP+'/router-validation.json',JSON.stringify(receipt,null,2)+'\n');
          NODE
          MODE="$(node -p "require(process.env.RUNNER_TEMP+'/router-validation.json').mode")"
          if [ "$MODE" = "ACTIVE_LEGACY_ROUTER" ]; then
            node tools/repository-ai-entry-router.mjs --self-test --output "$RUNNER_TEMP/router-self-test.json"
            node tools/repository-ai-entry-router.mjs --mutation-intent --task "Progressive system continuity route verification" \
              --path AGENTS.md \
              --path AI_ENTRYPOINT.json \
              --path .github/ai-router/router.v1.json \
              --path "$PROTOCOL_PATH" \
              --path "$GATE_PATH" \
              --path "$SELF_TEST_PATH" \
              --path "$GAP_REGISTRY_PATH" \
              --path "$WORKFLOW_PATH" \
              --output "$RUNNER_TEMP/router-eight-path.json"
            node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/router-eight-path.json','utf8'));if(x.disposition!=='PASS'||x.routes.length!==8||x.routes.some(r=>r.disposition!=='PASS'||r.projectId!=='REPOSITORY_AI_ROUTER_INFRASTRUCTURE'))process.exit(1);const out=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/router-validation.json','utf8'));out.legacyRouterSelfTestResult='PASS';out.legacyMutationRouteResult='PASS';fs.writeFileSync(process.env.RUNNER_TEMP+'/router-validation.json',JSON.stringify(out,null,2)+'\\n')"
          elif [ "$MODE" = "PUBLIC_GOVERNANCE_RETIREMENT_HANDOFF" ]; then
            test ! -f "$RUNNER_TEMP/router-self-test.json"
            test ! -f "$RUNNER_TEMP/router-eight-path.json"
          else
            echo "ROUTER_PREREQUISITE_MODE_INVALID:$MODE" >&2
            exit 1
          fi

      - name: Verify no parallel terminal-closure repair path overlap
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE="HEAD^"
          fi
          git diff --name-only "$BASE" HEAD | sort > "$RUNNER_TEMP/changed.txt"
          prohibited=(
            tools/operation-intake/repository-operation-lock-manager.v1.mjs
            tools/operation-intake/remote-operation-terminal-closure-bridge.v1.mjs
            tools/operation-intake/repository-operation-lock-manager.v1.remote-receipt.test.mjs
            .github/workflows/remote-operation-terminal-closure-v1.yml
          )
          for p in "${prohibited[@]}"; do
            if grep -Fxq "$p" "$RUNNER_TEMP/changed.txt"; then
              echo "PARALLEL_REPAIR_PATH_OVERLAP:$p" >&2
              exit 1
            fi
          done
          if [ "${GITHUB_HEAD_REF:-}" = "agent/progressive-system-continuity-track-v1" ]; then
            allowed=(
              AGENTS.md
              AI_ENTRYPOINT.json
              .github/ai-router/router.v1.json
              .github/ai-router/system-continuity/progressive-system-continuity-protocol.v1.json
              .github/ai-router/system-continuity/progressive-system-continuity-gate.v1.mjs
              .github/ai-router/system-continuity/progressive-system-continuity-self-test.v1.mjs
              .github/ai-router/system-continuity/gap-registry.v1.json
              .github/workflows/progressive-system-continuity-v1.yml
            )
            printf '%s\n' "${allowed[@]}" | sort > "$RUNNER_TEMP/allowed.txt"
            if comm -23 "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/allowed.txt" | grep -q .; then
              echo "PATH_OUTSIDE_ADMITTED_INSTALLATION_SCOPE" >&2
              comm -23 "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/allowed.txt" >&2
              exit 1
            fi
          fi

      - name: Run exact progressive continuity self-test
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node "$SELF_TEST_PATH" --output "$RUNNER_TEMP/self-test.json"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node -e "const r=require(process.env.RUNNER_TEMP+'/self-test.json'); if(r.result!=='PASS'||r.failedCount!==0||r.productMutationPerformed!==false||r.repositoryMutationPerformedBySelfTest!==false||r.lifecycleMutationPerformed!==false||r.genericCommandAuthority!==false) process.exit(1)"

      - name: Build validation receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/progressive-system-continuity
          cp "$RUNNER_TEMP/self-test.json" artifacts/progressive-system-continuity/self-test.json
          cp "$RUNNER_TEMP/router-validation.json" artifacts/progressive-system-continuity/router-prerequisite.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import crypto from 'node:crypto'; import cp from 'node:child_process';
          const head=cp.execFileSync('git',['rev-parse','HEAD^{commit}'],{encoding:'utf8'}).trim();
          const self=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/self-test.json','utf8'));
          const router=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/router-validation.json','utf8'));
          const digest=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const receipt={schema:'PROGRESSIVE_SYSTEM_CONTINUITY_VALIDATION_RECEIPT_v1',result:'PASS',head,event:process.env.GITHUB_EVENT_NAME,routerDisposition:router.routerDisposition,routerPathCount:router.routerPathCount,routerValidationMode:router.mode,retirementHandoffVerified:router.retirementHandoffVerified,legacyRouterExecutionRequired:router.legacyRouterExecutionRequired,retiredRouterExecutionProhibited:router.retiredRouterExecutionProhibited,selfTestResult:self.result,selfTestScenarioCount:self.scenarioCount,protocolSha256:digest(process.env.PROTOCOL_PATH),gateSha256:digest(process.env.GATE_PATH),gapRegistrySha256:digest(process.env.GAP_REGISTRY_PATH),parallelRepairPathOverlap:false,productMutationPerformed:false,lifecycleMutationPerformed:false,genericCommandAuthority:false};
          fs.writeFileSync('artifacts/progressive-system-continuity/validation.json',JSON.stringify(receipt,null,2)+'\n');
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: progressive-system-continuity-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/progressive-system-continuity/
          if-no-files-found: error
          retention-days: 90

  remote-assessment:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR') &&
      startsWith(github.event.comment.body, 'PROGRESSIVE_SYSTEM_CONTINUITY_REQUEST_V1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse exact read-only continuity request
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          ACTIVE_HEAD="$(git rev-parse HEAD^{commit})"
          export ACTIVE_HEAD
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const marker=process.env.REMOTE_MARKER;
          const body=process.env.COMMENT_BODY ?? '';
          if(!body.startsWith(marker)) throw new Error('REMOTE_MARKER_MISMATCH');
          const raw=body.slice(marker.length).trim();
          if(!raw || raw.length>131072) throw new Error('REMOTE_REQUEST_SIZE_INVALID');
          const request=JSON.parse(raw);
          if(request.schema!=='PROGRESSIVE_SYSTEM_CONTINUITY_ASSESSMENT_REQUEST_v1') throw new Error('REMOTE_REQUEST_SCHEMA_MISMATCH');
          if(request.subjectHead!==process.env.ACTIVE_HEAD) throw new Error(`REMOTE_SUBJECT_HEAD_MISMATCH:${request.subjectHead}:${process.env.ACTIVE_HEAD}`);
          fs.writeFileSync(process.env.RUNNER_TEMP+'/assessment-request.json',JSON.stringify(request,null,2)+'\n');
          NODE

      - name: Execute read-only continuity gate
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          set +e
          node "$GATE_PATH" --input "$RUNNER_TEMP/assessment-request.json" --registry "$GAP_REGISTRY_PATH" --output "$RUNNER_TEMP/remote-assessment.json"
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then exit "$status"; fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node -e "const r=require(process.env.RUNNER_TEMP+'/remote-assessment.json'); if(!['PASS','BLOCK'].includes(r.result)||r.repositoryWritesAuthorized!==false||r.lifecycleAuthorityGranted!==false||r.terminalClosureAuthorityGranted!==false||r.successorAuthorityGranted!==false||r.mergeAuthorityGranted!==false||r.productMutationAuthorityGranted!==false||r.genericCommandAuthority!==false) process.exit(1)"
          mkdir -p artifacts/progressive-system-continuity
          cp "$RUNNER_TEMP/remote-assessment.json" artifacts/progressive-system-continuity/remote-assessment.json

      - uses: actions/upload-artifact@v4
        with:
          name: progressive-system-continuity-remote-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/progressive-system-continuity/remote-assessment.json
          if-no-files-found: error
          retention-days: 90

      - name: Return compact continuity receipt to issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/remote-assessment.json','utf8'));
            const compact = {schema:r.schema,result:r.result,classification:r.classification,errorCode:r.errorCode,subjectHead:r.subjectHead,systemId:r.systemId,systemClosureGranted:r.systemClosureGranted,repositoryWritesAuthorized:r.repositoryWritesAuthorized,lifecycleAuthorityGranted:r.lifecycleAuthorityGranted,genericCommandAuthority:r.genericCommandAuthority,workflowRunId:Number(process.env.GITHUB_RUN_ID)};
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'PROGRESSIVE_SYSTEM_CONTINUITY_RECEIPT_V1\n```json\n'+JSON.stringify(compact,null,2)+'\n```'});
