name: AI Entry — Automatic Exact-Head Release

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify BT4 entitlement engine before publication
        shell: bash
        run: |
          set -euo pipefail
          node preview/bt4/entitlement-v1/verify-entitlement-preview.v1.mjs

      - name: Stage exact-head Pages payload
        env:
          TARGET_SHA: ${{ github.sha }}
          PAGES_STAGE: ${{ runner.temp }}/pages-site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .well-known
          printf '{"schema":"DGB_PUBLIC_RELEASE_MARKER_v1","commit":"%s"}\n' "$TARGET_SHA" > .well-known/dgb-release.json
          rm -rf "$PAGES_STAGE"
          mkdir -p "$PAGES_STAGE"
          rsync -a --prune-empty-dirs \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='preview/' \
            --exclude='h-earth-live-6d18e158/' \
            ./ "$PAGES_STAGE/"

          # The global preview tree remains excluded. BT4 is the sole bounded
          # nonproduction exception because this experiment must be verified on
          # the same public serving path that would ultimately enforce claim
          # entitlement. No other preview bytes are admitted by this exception.
          bt4_src='preview/bt4/entitlement-v1'
          bt4_dst="$PAGES_STAGE/preview/bt4/entitlement-v1"
          test -f "$bt4_src/index.html"
          test -f "$bt4_src/entitlement-engine.v1.mjs"
          test -f "$bt4_src/verify-entitlement-preview.v1.mjs"
          mkdir -p "$bt4_dst"
          rsync -a --delete "$bt4_src/" "$bt4_dst/"
          test -f "$bt4_dst/index.html"
          test -f "$bt4_dst/entitlement-engine.v1.mjs"
          grep -Fq 'NONPRODUCTION · BT4 SERVED-STATE EXPERIMENT' "$bt4_dst/index.html"
          grep -Fq 'entitlement-engine.v1.mjs' "$bt4_dst/index.html"
          echo 'BT4_BOUNDED_PREVIEW_STAGED=PASS'

          rm -rf "$PAGES_STAGE/showroom/globe/h-earth"
          mkdir -p "$PAGES_STAGE/showroom/globe/h-earth"
          rsync -a --delete h-earth-live-6d18e158/showroom/globe/h-earth/ "$PAGES_STAGE/showroom/globe/h-earth/"
          test -f "$PAGES_STAGE/.well-known/dgb-release.json"
          test -f "$PAGES_STAGE/index.html"
          staged_bytes="$(du -sb "$PAGES_STAGE" | awk '{print $1}')"
          echo "AI_ENTRY_PAGES_STAGE_BYTES=$staged_bytes"
          test "$staged_bytes" -lt 1073741824

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload exact-head Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact-head artifact
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live-exact-head:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Require public exact-head marker and BT4 served surface
        env:
          TARGET_SHA: ${{ github.sha }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          marker_url="${PAGE_URL%/}/.well-known/dgb-release.json"
          bt4_url="${PAGE_URL%/}/preview/bt4/entitlement-v1/"
          bt4_engine_url="${PAGE_URL%/}/preview/bt4/entitlement-v1/entitlement-engine.v1.mjs"
          observed=""
          for attempt in $(seq 1 24); do
            marker="$(curl --fail --silent --show-error -L --max-time 20 "$marker_url" 2>/dev/null || true)"
            observed="$(printf '%s' "$marker" | jq -r '.commit // empty' 2>/dev/null || true)"
            bt4_html="$(curl --fail --silent --show-error -L --max-time 20 "$bt4_url" 2>/dev/null || true)"
            bt4_engine="$(curl --fail --silent --show-error -L --max-time 20 "$bt4_engine_url" 2>/dev/null || true)"
            if [ "$observed" = "$TARGET_SHA" ] \
              && grep -Fq 'NONPRODUCTION · BT4 SERVED-STATE EXPERIMENT' <<<"$bt4_html" \
              && grep -Fq 'entitlement-engine.v1.mjs' <<<"$bt4_html" \
              && grep -Fq 'computeEntitlement' <<<"$bt4_engine"; then
              echo "LIVE_EXACT_HEAD_VERIFIED target=$TARGET_SHA"
              echo "BT4_PUBLIC_SERVED_SURFACE=PASS url=$bt4_url"
              exit 0
            fi
            echo "Attempt $attempt: observed=${observed:-none}; waiting for target=$TARGET_SHA and BT4 served surface"
            sleep 10
          done
          echo "DEPLOYMENT_NOT_PROVEN expected=$TARGET_SHA observed=${observed:-none}" >&2
          echo "BT4_PUBLIC_SERVED_SURFACE=FAIL url=$bt4_url" >&2
          exit 1
