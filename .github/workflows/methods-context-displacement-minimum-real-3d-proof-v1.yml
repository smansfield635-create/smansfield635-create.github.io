name: Methods Minimum Real 3D Proof v1
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/methods-context-displacement-minimum-real-3d-proof-v1.yml'
      - 'control-plane/methods-information-benchmark/context-displacement-minimum-real-3d-proof-v1/**'
permissions:
  contents: write
env:
  C: control-plane/methods-information-benchmark/context-displacement-minimum-real-3d-proof-v1
  OP: METHODS_CONTEXT_DISPLACEMENT_EXISTING_SPATIAL_CONSTRUCT_MINIMUM_REAL_3D_PROOF_v1
  SCOPE: METHODS_INFORMATION_BENCHMARK:CONTEXT_DISPLACEMENT:MINIMUM_REAL_3D_PROOF:CONSTRUCTION:V1
  LOCK_GENERATION: '316'
  LOCK_REF: refs/heads/operation-locks/repository-operation-intake-v1
  H: ${{ github.event.pull_request.head.sha }}
jobs:
  builder:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.H }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact candidate and stable fingerprint domain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$H"
          node "$C/verify.v1.mjs" --repository . --output /tmp/builder.json
      - name: Confirm permanent receipt correspondence when finalized
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base = process.env.C;
          const closure = JSON.parse(fs.readFileSync(`${base}/receipts/operation-closure.receipt.v1.json`));
          if (closure.status !== 'PASS_CLOSED') process.exit(0);
          const runtime = JSON.parse(fs.readFileSync('/tmp/builder.json'));
          const builder = JSON.parse(fs.readFileSync(`${base}/receipts/builder.receipt.v1.json`));
          const fresh = JSON.parse(fs.readFileSync(`${base}/receipts/fresh-verifier.receipt.v1.json`));
          const equality = JSON.parse(fs.readFileSync(`${base}/receipts/independent-equality.receipt.v1.json`));
          if (runtime.result !== 'PASS' || builder.fingerprint !== runtime.fingerprint || fresh.fingerprint !== runtime.fingerprint || equality.fingerprint !== runtime.fingerprint || equality.exactNormalizedEquality !== true || closure.fingerprint !== runtime.fingerprint) {
            throw new Error('PERMANENT_RECEIPT_CORRESPONDENCE_FAILURE');
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: methods-minimum-real-3d-proof-builder-v1
          path: /tmp/builder.json
          if-no-files-found: error

  fresh-verifier:
    needs: builder
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.H }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: methods-minimum-real-3d-proof-builder-v1
          path: /tmp/builder
      - name: Reproduce independently and compare exact fingerprint
        run: |
          set -euo pipefail
          node "$C/verify.v1.mjs" --repository . --output /tmp/fresh.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const b = JSON.parse(fs.readFileSync('/tmp/builder/builder.json'));
          const f = JSON.parse(fs.readFileSync('/tmp/fresh.json'));
          if (b.result !== 'PASS' || f.result !== 'PASS' || b.fingerprint !== f.fingerprint) throw new Error('INDEPENDENT_REPRODUCTION_MISMATCH');
          fs.writeFileSync('/tmp/equality.json', `${JSON.stringify({ schema: 'METHODS_MINIMUM_REAL_3D_PROOF_RUNTIME_EQUALITY_RECEIPT_v1', result: 'PASS', fingerprint: b.fingerprint, exactNormalizedEquality: true, head: process.env.H }, null, 2)}\n`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: methods-minimum-real-3d-proof-fresh-verifier-v1
          path: |
            /tmp/fresh.json
            /tmp/equality.json
          if-no-files-found: error

  close-or-confirm-lock:
    needs: fresh-verifier
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.H }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Close admitted lock once or confirm terminal history
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin operation-locks/repository-operation-intake-v1
          git show origin/operation-locks/repository-operation-intake-v1:.github/operation-intake/active-operation-ledger.v1.json > /tmp/ledger.json
          if node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ledger = JSON.parse(fs.readFileSync('/tmp/ledger.json'));
          const entry = ledger.terminalHistory.find((item) => item.operationId === process.env.OP && item.lockGeneration === Number(process.env.LOCK_GENERATION));
          if (!entry || entry.released !== true || entry.terminalDisposition !== 'PASS_CLOSED') process.exit(1);
          fs.writeFileSync('/tmp/closure.json', `${JSON.stringify({ schema: 'METHODS_MINIMUM_REAL_3D_PROOF_LOCK_CONFIRMATION_RECEIPT_v1', result: 'PASS_ALREADY_CLOSED', lockGeneration: Number(process.env.LOCK_GENERATION), terminalDisposition: entry.terminalDisposition, lockReleased: entry.released }, null, 2)}\n`);
          NODE
          then
            true
          else
            node tools/operation-intake/repository-operation-lock-manager.v1.mjs --action close --repository "$REPOSITORY" --lock-ref "$LOCK_REF" --operation-id "$OP" --lock-scope "$SCOPE" --lock-generation "$LOCK_GENERATION" --terminal-disposition PASS_CLOSED --output /tmp/closure.json
            node -e "const r=require('/tmp/closure.json');if(r.result!=='TERMINAL_CLOSURE_COMMITTED'||r.lockReleased!==true)throw Error('LOCK_CLOSURE_FAILED')"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: methods-minimum-real-3d-proof-operation-closure-v1
          path: /tmp/closure.json
          if-no-files-found: error
