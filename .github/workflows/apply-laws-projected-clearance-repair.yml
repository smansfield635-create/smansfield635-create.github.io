          import hashlib
          import json

          def git_blob(path):
              data = Path(path).read_bytes()
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()

          receipt = json.loads(Path('laws/validation/laws.orbit-direct-manipulation.receipt.json').read_text())
