name: H-Earth Camera Clearance Void Gen319

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write

jobs:
  void-malformed-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Mint private repository token
        id: private-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.PRIVATE_EXECUTION_APP_ID }}
          private-key: ${{ secrets.PRIVATE_EXECUTION_APP_PRIVATE_KEY }}
          owner: smansfield635-create
          repositories: geodiametrics1
          permission-contents: write

      - name: Check out exact private control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: smansfield635-create/geodiametrics1
          ref: 367f9f77c264c2eabe7398bfa1fdd0edcdbbb6ab
          token: ${{ steps.private-token.outputs.token }}
          path: private-control-plane
          fetch-depth: 1
          persist-credentials: false

      - name: Close malformed generation 319 as VOIDED
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.private-token.outputs.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/gen319-closure.json"
          node private-control-plane/tools/operation-intake/repository-operation-lock-manager.v1.mjs \
            --action close \
            --repository smansfield635-create/geodiametrics1 \
            --lock-ref refs/heads/operation-locks/repository-operation-intake-v1 \
            --operation-id H_EARTH_TERRAIN_RELATIVE_CAMERA_CLEARANCE_SUCCESSOR_20260818_001 \
            --lock-scope H_EARTH:GRATITUDE:TERRAIN_RELATIVE_CAMERA_CLEARANCE:SUCCESSOR:V1 \
            --lock-generation 319 \
            --terminal-disposition VOIDED \
            --output "$out"
          jq -e '.result=="TERMINAL_CLOSURE_COMMITTED" and .terminalDisposition=="VOIDED" and .lockReleased==true' "$out"

      - name: Verify lock released from private ledger
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ steps.private-token.outputs.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/verify"
          mkdir -p "$work"
          curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $PRIVATE_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/smansfield635-create/geodiametrics1/contents/.github/operation-intake/active-operation-ledger.v1.json?ref=operation-locks%2Frepository-operation-intake-v1' > "$work/ledger.json"
          python - <<'PY'
          import base64,json,os
          api=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'verify','ledger.json')))
          l=json.loads(base64.b64decode(api['content']).decode())
          op='H_EARTH_TERRAIN_RELATIVE_CAMERA_CLEARANCE_SUCCESSOR_20260818_001'
          if any(x.get('operationId')==op for x in l['activeScopes'].values()): raise SystemExit('GEN319_STILL_ACTIVE')
          matches=[x for x in l['terminalHistory'] if x.get('operationId')==op and x.get('lockGeneration')==319]
          if len(matches)!=1 or matches[0].get('terminalDisposition')!='VOIDED' or matches[0].get('released') is not True: raise SystemExit('GEN319_VOID_READBACK_FAILED')
          print('GEN319_VOID_READBACK_PASS')
          PY
