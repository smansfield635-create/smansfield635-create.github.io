name: Compass canonical settlement repair

on:
  push:
    branches:
      - compass-a2f838-exact-qualification-temp

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compass-renewal-corrected-gen1772
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            assets/compass
          sparse-checkout-cone-mode: true
      - name: Prove expected Compass head
        run: test "$(git rev-parse HEAD)" = "aee18d9eb7f72e75f78e2fbb1c8cdaacbe9bdd5d"
      - name: Align canonical east-west settlement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/compass/compass.controller.js')
          s = p.read_text()
          old = '''    east:\n      Object.freeze({\n        yaw: -Math.PI / 2,\n        pitch: 0,\n        roll: 0\n      }),\n\n    south:\n      Object.freeze({\n        yaw: Math.PI,\n        pitch: 0,\n        roll: 0\n      }),\n\n    west:\n      Object.freeze({\n        yaw: Math.PI / 2,\n        pitch: 0,\n        roll: 0\n      })'''
          new = '''    east:\n      Object.freeze({\n        yaw: Math.PI / 2,\n        pitch: 0,\n        roll: 0\n      }),\n\n    south:\n      Object.freeze({\n        yaw: Math.PI,\n        pitch: 0,\n        roll: 0\n      }),\n\n    west:\n      Object.freeze({\n        yaw: -Math.PI / 2,\n        pitch: 0,\n        roll: 0\n      })'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one canonical block, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          git diff --check
      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "smansfield635-create"
          git config user.email "smansfield635@gmail.com"
          git add assets/compass/compass.controller.js
          test "$(git diff --cached --name-only)" = "assets/compass/compass.controller.js"
          git commit -m "Compass: align canonical east-west settlement"
          git push origin HEAD:compass-renewal-corrected-gen1772
