name: Laws Euclidean Orbit Correction

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/laws-euclidean-orbit-direct-manipulation.yml
      - scripts/laws/apply-euclidean-orbit-direct-manipulation.mjs
      - laws/validation/laws.orbit-direct-manipulation.harness.mjs

permissions:
  contents: write

concurrency:
  group: laws-euclidean-orbit-direct-manipulation-001
  cancel-in-progress: false

jobs:
  transform-validate-and-commit:
    if: github.head_ref == 'agent/laws-euclidean-orbit-direct-manipulation-001'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Quiet exact-branch checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags origin refs/heads/agent/laws-euclidean-orbit-direct-manipulation-001
          git checkout -q -B agent/laws-euclidean-orbit-direct-manipulation-001 FETCH_HEAD
          git merge-base --is-ancestor dedc73841de2b41f5905fd842e9a593116caf300 HEAD
          test "$(git branch --show-current)" = "agent/laws-euclidean-orbit-direct-manipulation-001"

      - name: Correct transformer executor and validate transformer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/laws/apply-euclidean-orbit-direct-manipulation.mjs")
          source = path.read_text(encoding="utf-8")
          replacements = {
              "`LAWS_CRYSTALS_CLUSTER_UNIT_RADIUS_INVALID:${index}`": '"LAWS_CRYSTALS_CLUSTER_UNIT_RADIUS_INVALID:" + index',
              "`LAWS_CRYSTALS_CLUSTER_COPLANARITY_INVALID:${index}`": '"LAWS_CRYSTALS_CLUSTER_COPLANARITY_INVALID:" + index',
              "`LAWS_CRYSTALS_CLUSTER_90_DEGREE_SPACING_INVALID:${index}`": '"LAWS_CRYSTALS_CLUSTER_90_DEGREE_SPACING_INVALID:" + index',
              "`LAWS_CRYSTALS_CLUSTER_180_DEGREE_SPACING_INVALID:${index}`": '"LAWS_CRYSTALS_CLUSTER_180_DEGREE_SPACING_INVALID:" + index',
          }
          for before, after in replacements.items():
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f"TRANSFORMER_QUOTING_ANCHOR_INVALID:{before}:{count}")
              source = source.replace(before, after)

          before = '''function replaceRegex(source, pattern, replacement, label) {
            const matches = source.match(pattern);
            if (!matches || matches.length !== 1) {
              throw new Error(
                `TRANSFORM_REGEX_ANCHOR_INVALID:${label}:${matches ? matches.length : 0}`
              );
            }
            return source.replace(pattern, replacement);
          }'''
          after = '''function replaceRegex(source, pattern, replacement, label) {
            const flags =
              pattern.flags.includes("g")
                ? pattern.flags
                : `${pattern.flags}g`;
            const matches =
              Array.from(
                source.matchAll(
                  new RegExp(
                    pattern.source,
                    flags
                  )
                )
              );
            if (matches.length !== 1) {
              throw new Error(
                `TRANSFORM_REGEX_ANCHOR_INVALID:${label}:${matches.length}`
              );
            }
            return source.replace(pattern, replacement);
          }'''
          count = source.count(before)
          if count != 1:
              raise SystemExit(f"TRANSFORMER_REGEX_HELPER_ANCHOR_INVALID:{count}")
          source = source.replace(before, after)
          path.write_text(source, encoding="utf-8")
          PY
          node --check scripts/laws/apply-euclidean-orbit-direct-manipulation.mjs

      - name: Apply fail-closed source transformation
        shell: bash
        run: |
          set +e
          node scripts/laws/apply-euclidean-orbit-direct-manipulation.mjs > /tmp/laws-transform.log 2>&1
          status=$?
          tail -n 80 /tmp/laws-transform.log
          exit "$status"

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check laws/index.crystals.js
          node --check laws/index.interactions.source.round4.js
          node --check laws/index.interactions.js
          node --check laws/validation/laws.orbit-direct-manipulation.harness.mjs

      - name: Execute geometry and interaction harness
        shell: bash
        run: |
          set +e
          node laws/validation/laws.orbit-direct-manipulation.harness.mjs > /tmp/laws-harness.log 2>&1
          status=$?
          tail -n 100 /tmp/laws-harness.log
          exit "$status"

      - name: Verify transformed working paths
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )
          expected=(
            laws/index.crystals.js
            laws/index.css
            laws/index.html
            laws/index.interactions.js
            laws/index.interactions.source.round4.js
            laws/validation/laws.orbit-direct-manipulation.receipt.json
            scripts/laws/apply-euclidean-orbit-direct-manipulation.mjs
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Remove temporary execution authorities
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/laws/apply-euclidean-orbit-direct-manipulation.mjs
          rmdir scripts/laws 2>/dev/null || true
          rmdir scripts 2>/dev/null || true
          rm -f .github/workflows/laws-euclidean-orbit-direct-manipulation.yml

      - name: Verify final bounded path set
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            laws/index.crystals.js
            laws/index.css
            laws/index.html
            laws/index.interactions.js
            laws/index.interactions.source.round4.js
            laws/validation/laws.orbit-direct-manipulation.harness.mjs
            laws/validation/laws.orbit-direct-manipulation.receipt.json
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          mapfile -t actual < <(
            {
              git diff --name-only dedc73841de2b41f5905fd842e9a593116caf300 -- . ':!.github/workflows/laws-euclidean-orbit-direct-manipulation.yml' ':!scripts/laws/apply-euclidean-orbit-direct-manipulation.mjs'
              git ls-files --others --exclude-standard
            } | sort -u
          )
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")
          test -z "$(git diff --name-only dedc73841de2b41f5905fd842e9a593116caf300 -- laws/index.controller.js laws/index.compositor.js laws/index.planet.js)"

      - name: Commit bounded correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Establish Laws Euclidean orbit and direct manipulation"
          git push -q origin HEAD:agent/laws-euclidean-orbit-direct-manipulation-001
