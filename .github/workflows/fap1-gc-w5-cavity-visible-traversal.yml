name: FAP1 G_C W5 Cavity Visible Traversal
on:
  pull_request:
    paths: ['.github/workflows/fap1-gc-w5-cavity-visible-traversal.yml']
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 42db1d871a9140d997e023501c839d3aa13a3dd1
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with: {chrome-version: stable}
      - run: npm install --no-save --no-package-lock puppeteer-core@24.15.0
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          for a in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/showroom/globe/audralia/weather-presentation-reconciliation/ >/dev/null && exit 0; sleep .25; done; exit 1
      - name: Traverse cavity-capable W5 exact head
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const fs=require('fs'),puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:'new',args:['--no-sandbox','--ignore-gpu-blocklist','--enable-webgl','--use-gl=angle','--use-angle=swiftshader']});
            const page=await browser.newPage();await page.setViewport({width:720,height:1280,deviceScaleFactor:1});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));page.on('console',m=>{const t=m.text();if(m.type()==='error'&&!t.includes('favicon.ico')&&!t.includes('404 (File not found)'))errors.push(t);});
            await page.goto('http://127.0.0.1:4173/showroom/globe/audralia/weather-presentation-reconciliation/',{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForFunction(()=>window.__AUDRALIA_FAP1_W5_HANDOFF__?.l5LightingActive===true,{timeout:90000});
            const setup=await page.evaluate(()=>{const ga=window.__AUDRALIA_FAP1_GA_AUTHORITY__,s=ga.descriptorPacket().systems.find(x=>x.weatherClass==='LOW_CUMULIFORM')||ga.descriptorPacket().systems[0];const R=6200,D=Math.PI/180,N=[0,.5,-.8660254037844386],M=[0,.8660254037844386,.5],E=[1,0,0],lat=s.latitudeDeg*D,lon=s.longitudeDeg*D,cl=Math.cos(lat),sl=Math.sin(lat),co=Math.cos(lon),si=Math.sin(lon),r=[N[0]*sl+(M[0]*co+E[0]*si)*cl,N[1]*sl+(M[1]*co+E[1]*si)*cl,N[2]*sl+(M[2]*co+E[2]*si)*cl],angle=Math.acos(Math.max(-1,Math.min(1,r[1]))),sn=Math.sin(angle),arc=angle*R;return{systemId:s.id,targetU:Math.abs(sn)<1e-7?0:arc*r[0]/sn,targetV:Math.abs(sn)<1e-7?0:arc*r[2]/sn};});
            const stages=[['approach',1200],['wall',800],['interiorA',520],['interiorB',260],['deep',120],['exitA',520],['exitB',1200]],samples=[];
            for(const [name,distance] of stages){const x=await page.evaluate(async({distance,targetU,targetV})=>{const sleep=ms=>new Promise(r=>setTimeout(r,ms)),proof=window.__AUDRALIA_WEATHER_PRESENTATION_RECONCILIATION__,h=window.__AUDRALIA_FAP1_W5_HANDOFF__;proof.setCameraStateForTest({targetU,targetV,distance,pitch:1.25,yaw:0});await sleep(550);h.setQuality('REST');const receipt=h.renderNow();await sleep(120);const local=document.querySelector('[data-fap1-w5-local-raymarch="true"]');if(!local||getComputedStyle(local).display==='none')return{receipt,pixels:null};const gl=local.getContext('webgl2'),buf=new Uint8Array(local.width*local.height*4);gl.readPixels(0,0,local.width,local.height,gl.RGBA,gl.UNSIGNED_BYTE,buf);let nz=0,sumA=0,minA=255,maxA=0,sumLum=0,minLum=255,maxLum=0;for(let i=0;i<buf.length;i+=4){const a=buf[i+3];if(a){nz++;sumA+=a;minA=Math.min(minA,a);maxA=Math.max(maxA,a);const lum=(buf[i]+buf[i+1]+buf[i+2])/3;sumLum+=lum;minLum=Math.min(minLum,lum);maxLum=Math.max(maxLum,lum);}}return{receipt,pixels:{nonzero:nz,coverage:nz/(local.width*local.height),meanAlpha:nz?sumA/nz:0,minAlpha:nz?minA:0,maxAlpha:nz?maxA:0,alphaRange:nz?maxA-minA:0,meanLum:nz?sumLum/nz:0,lumaRange:nz?maxLum-minLum:0}};},{distance,targetU:setup.targetU,targetV:setup.targetV});samples.push({name,distance,...x});await page.screenshot({path:`artifacts/${name}.png`});}
            const active=samples.filter(x=>x.receipt?.active),ids=new Set(active.map(x=>x.receipt.weatherId)),interiors=samples.filter(x=>['interiorA','interiorB','deep'].includes(x.name)&&x.pixels),coverages=interiors.map(x=>x.pixels.coverage),alphas=interiors.map(x=>x.pixels.meanAlpha);const variability=(Math.max(...coverages)-Math.min(...coverages))>0.03||(Math.max(...alphas)-Math.min(...alphas))>1.0;const checks={identity:ids.size===1&&ids.has(setup.systemId),handoff:samples.every(x=>Math.abs((x.receipt?.contributionSum??1)-1)<1e-6),visibleWall:(samples.find(x=>x.name==='wall')?.pixels?.nonzero||0)>0,interiorVisible:interiors.every(x=>(x.pixels?.nonzero||0)>0),interiorVariability:variability,exitSymmetry:Math.abs((samples[0].receipt?.localContribution??0)-(samples.at(-1).receipt?.localContribution??0))<.03,noRuntimeErrors:errors.length===0};const result={schema:'FAP1_GC_W5_CAVITY_VISIBLE_TRAVERSAL_v1',candidateHead:'42db1d871a9140d997e023501c839d3aa13a3dd1',systemId:setup.systemId,checks,samples,errors,pass:Object.values(checks).every(Boolean)};fs.writeFileSync('artifacts/qualification.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result,null,2));await browser.close();if(!result.pass)process.exit(2);
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fap1-gc-w5-cavity-visible-evidence
          path: artifacts/
          if-no-files-found: error