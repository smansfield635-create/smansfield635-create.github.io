          )

          crystals = replace_exact(
              crystals,
              '''    const primaryLaw =
      nearestPrimaryLaw(
        direction,
        localQuaternion
      );''',
              '''    const resolution =
      publishClusterPresentationResolution(
        resolveClusterPresentation(
          direction,
          localQuaternion
        )
      );
    const primaryLaw =
      nearestPrimaryLaw(
        direction,
        localQuaternion
      );''',
              'CLUSTER_PRESENTATION_RESOLUTION_EXECUTION'
          )

          crystals = replace_exact(
              crystals,
              '''          const sphere =
          euclideanLawPosition(
            node,
            localQuaternion
          );''',
              '''          const sphere =
          euclideanLawPosition(
            node,
            localQuaternion,
            resolution.radius
          );''',
              'SHARED_RUNTIME_RADIUS_CONSUMPTION'
          )

          crystals = replace_exact(
              crystals,
              '''        const scale =
          selected
            ? QUALITY.selectedLawScale
            : primary
              ? QUALITY.primaryLawScale
              : QUALITY.lawScale;''',
              '''        const scale =
          (
            selected
              ? QUALITY.selectedLawScale
              : primary
                ? QUALITY.primaryLawScale
                : QUALITY.lawScale
          ) *
          resolution.scaleFactor;''',
              'UNIFORM_CLUSTER_SCALE_CONSUMPTION'
          )

          old_transform = '''    state.registry.forEach(
      node => {
        [
          "x",
          "y",
          "z",
          "sx",
          "sy",
          "sz",
          "prominence",
          "halo",
