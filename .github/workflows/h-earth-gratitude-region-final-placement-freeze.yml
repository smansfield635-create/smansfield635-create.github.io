          const distance=(a,b)=>Math.hypot(a.xMaximum<b.xMinimum?b.xMinimum-a.xMaximum:b.xMaximum<a.xMinimum?a.xMinimum-b.xMaximum:0,a.zMaximum<b.zMinimum?b.zMinimum-a.zMaximum:b.zMaximum<a.zMinimum?a.zMinimum-b.zMaximum:0);
          const pass=(id,ok,basis)=>({id,status:ok?'PASS':'FAIL',passed:ok,basis});

          function execute(){
            const issues=[];
            const d=read(P.disposition),o=read(P.original),e=read(P.entry),m=read(P.manor),c=read(P.cavern),f=read(P.frontier),b=baselineRun(),r=registryLoad();
            const head=git('rev-parse','HEAD'),mergeBase=git('merge-base','HEAD',BASE),changed=git('diff','--name-only',`${BASE}..HEAD`).split('\n').filter(Boolean).sort();
            if(mergeBase!==BASE)issues.push(`AUTHORIZED_BASE_MISMATCH:${mergeBase}`);
            if(!eq(changed,[WF]))issues.push(`UNAUTHORIZED_CHANGED_PATHS:${changed.join(',')}`);
            if(!b.eligible||!b.fp00.eligible||!b.fp01.eligible||!b.fp02.eligible)issues.push('FP_00_THROUGH_FP_02_REGRESSION_FAILURE');
            if(b.fp00.frozenInputCount!==24||b.fp00.exactFrozenInputMatchCount!==24||b.fp00.protectedMutationPaths.length)issues.push('FROZEN_INPUT_OR_PROTECTED_MUTATION_FAILURE');

            const t=Object.fromEntries(d.targetDispositionMatrix.map(v=>[v.areaId,v]));
            const eb=bnd(e.entryZoneCandidate.bounds),mb=bnd(m.mirrorManorCandidate.bounds),cb=bnd(c.cavernCandidate.precinctEnvelope.bounds),fb=bnd(f.primaryNonfinalCandidate.bounds);
            const fp03=FP03.status==='PASS_CLOSED_DO_NOT_REOPEN'&&FP03.disposition==='ACCEPT_CURRENT_RELATION'&&eq(FP03.exteriorFace,xz(c.cavernCandidate.exteriorFace))&&eq(FP03.apron,xz(c.cavernCandidate.exteriorApron))&&eq(FP03.precinctCenter,xz(c.cavernCandidate.precinctCenter))&&eq(FP03.exteriorFace,t.GRATITUDE_REGION_CAVERN_PRECINCT.currentExteriorFace)&&eq(FP03.precinctCenter,t.GRATITUDE_REGION_CAVERN_PRECINCT.currentPrecinctCenter)&&FP03.userIntentMateriallySatisfied&&c.cavernCandidate.eligible&&c.cavernCandidate.surfaceCorrespondence.existingMountainExteriorAttachmentSatisfied&&c.cavernCandidate.lawfulApproachCandidate.eligible&&c.cavernCandidate.interiorTransitionRelation.separateBoundedInteriorOccurrenceRequired;
            if(!fp03)issues.push('FP_03_CLOSED_AUTHORITY_MISMATCH');
            const ft=t.GRATITUDE_REGION_FRONTIER_PLAINS;
            const fp04=FP04.status==='PASS_CLOSED_DO_NOT_REOPEN'&&FP04.disposition==='RETAIN_ELIGIBLE_NONFINAL_AS_SEPARATE_FUTURE_PROJECT'&&FP04.preservedRole==='LARGE_REGIONAL_CAPACITY_RESERVE'&&!FP04.finalEnvelopeAccepted&&!FP04.finalAnchorAssigned&&!FP04.allElevenSystemsAssigned&&!FP04.exactFunctionalCellsAssigned&&FP04.distributedTopology==='DEFERRED'&&!FP04.constructionAuthority&&ft.targetDisposition==='RETAIN_ELIGIBLE_NONFINAL'&&ft.preservedRole===FP04.preservedRole&&ft.separateFutureProject&&!ft.allElevenSystemsAssignedToFrontier&&!ft.exactFunctionalCellsAssigned&&!ft.constructionAuthority&&f.primaryNonfinalCandidate.eligible&&!f.primaryNonfinalCandidate.accepted&&!f.primaryNonfinalCandidate.finalPlacement&&f.integratedCapacityModel.capacitySupported&&!f.integratedCapacityModel.elevenFunctionalCellsAssigned&&!f.authorityBoundary.frontierPlainsCandidateAccepted&&!f.authorityBoundary.productConstructionAuthorized;
            if(!fp04)issues.push('FP_04_CLOSED_AUTHORITY_MISMATCH');

            const areas=[
              {areaId:'GRATITUDE_REGION_ENTRY_ZONE',lifecycleDisposition:'ACCEPTED',placementDisposition:'ACCEPT_EXISTING_INITIAL_CAMERA_BOUND_ARRIVAL',sourceCandidateId:e.entryZoneCandidate.candidateId,finalBounds:eb,activeInitialState:t.GRATITUDE_REGION_ENTRY_ZONE.activeInitialState,deferred:['ALARIC_STAR_GEOMETRY','MAP_PROJECTION_GEOMETRY'],requiredPlacementFieldsResolved:true},
              {areaId:'GRATITUDE_REGION_MIRROR_MANOR_PRECINCT',lifecycleDisposition:'ACCEPTED',placementDisposition:'ACCEPT_UPPER_CONNECTED_HILL_SITE_ENVELOPE_ONLY',sourceCandidateId:m.mirrorManorCandidate.candidateId,finalSiteCenter:m.mirrorManorCandidate.center,finalSiteBounds:mb,deferred:['EXACT_BUILDING_FOOTPRINT','BUILDING_ORIENTATION','ATRIUM_GEOMETRY','ENTRANCE_COORDINATES','GARDEN_LAYOUT','SCULPTURE_POSITIONS'],requiredPlacementFieldsResolved:true},
              {areaId:'GRATITUDE_REGION_CAVERN_PRECINCT',lifecycleDisposition:'ACCEPTED',placementDisposition:FP03.disposition,sourceCandidateId:c.cavernCandidate.candidateId,exteriorFace:FP03.exteriorFace,apron:FP03.apron,precinctCenter:FP03.precinctCenter,deferred:['CAVERN_INTERIOR_OCCURRENCE','ENTRANCE_OPENING_GEOMETRY','INTERIOR_TRANSITION_ANCHOR','CAVERN_SHAPE','CAVERN_SIZE','CAVERN_CONTENTS'],requiredPlacementFieldsResolved:true},
              {areaId:'GRATITUDE_REGION_FRONTIER_PLAINS',lifecycleDisposition:'RETAINED_ELIGIBLE_NONFINAL',placementDisposition:FP04.disposition,sourceCandidateId:f.primaryNonfinalCandidate.candidateId,preservedRole:FP04.preservedRole,finalEnvelope:null,finalAnchor:null,deferred:['DISTRIBUTED_FUNCTIONAL_SYSTEMS_TOPOLOGY','EXACT_FUNCTIONAL_CELLS','INFRASTRUCTURE_LAYOUT','FRONTIER_CONSTRUCTION'],requiredPlacementFieldsResolved:true}
            ];
            if(t.GRATITUDE_REGION_ENTRY_ZONE.targetDisposition!=='ACCEPT'||e.entryZoneCandidate.candidateId!==t.GRATITUDE_REGION_ENTRY_ZONE.sourceCandidateId||!eq(eb,bnd(t.GRATITUDE_REGION_ENTRY_ZONE.sourceCandidateBounds))||b.fp01.disposition!=='ACCEPT_EXISTING_INITIAL_CAMERA_BOUND_ARRIVAL')issues.push('ENTRY_ZONE_COMPOSITE_DISPOSITION_MISMATCH');
            if(t.GRATITUDE_REGION_MIRROR_MANOR_PRECINCT.targetDisposition!=='ACCEPT'||t.GRATITUDE_REGION_MIRROR_MANOR_PRECINCT.acceptedScope!=='UPPER_CONNECTED_HILL_SITE_ENVELOPE_ONLY'||m.mirrorManorCandidate.candidateId!==t.GRATITUDE_REGION_MIRROR_MANOR_PRECINCT.sourceCandidateId||!eq(mb,bnd(t.GRATITUDE_REGION_MIRROR_MANOR_PRECINCT.bounds))||b.fp02.disposition!=='ACCEPT_UPPER_CONNECTED_HILL_SITE_ENVELOPE_ONLY')issues.push('MIRROR_MANOR_COMPOSITE_DISPOSITION_MISMATCH');

            const s=f.accessAndRelationshipEvidence.separation;
            const pairs=[
              pass('ENTRY_ZONE__MIRROR_MANOR',!overlap(eb,mb)&&distance(eb,mb)>0,{relationship:'SEPARATE_CONNECTED_REGIONAL_AREAS',boundsDistance:distance(eb,mb)}),
              pass('ENTRY_ZONE__CAVERN_PRECINCT',!overlap(eb,cb)&&c.cavernCandidate.distanceEvidence.entryZoneStraightLineDistance>0&&c.cavernCandidate.visibilityEvidence.entryZone==='TERRAIN_CONCEALED_FROM_ENTRY_ZONE_NONFINAL',{relationship:'DISTINCT_CONCEALED_MOUNTAIN_EXTERIOR_DESTINATION',boundsDistance:distance(eb,cb),straightLineDistance:c.cavernCandidate.distanceEvidence.entryZoneStraightLineDistance}),
              pass('ENTRY_ZONE__FRONTIER_PLAINS',!overlap(eb,fb)&&f.accessAndRelationshipEvidence.entryZoneRoute.eligible&&s.entryZoneEnvelopeDistance>0,{relationship:'CONNECTED_ROUTE_CANDIDATE_TO_SEPARATE_CAPACITY_RESERVE',envelopeDistance:s.entryZoneEnvelopeDistance,routeAccepted:false}),
              pass('MIRROR_MANOR__CAVERN_PRECINCT',!overlap(mb,cb)&&c.cavernCandidate.lawfulApproachCandidate.eligible&&c.cavernCandidate.visibilityEvidence.mirrorManor==='TERRAIN_CONCEALED_FROM_MIRROR_MANOR_NONFINAL'&&c.cavernCandidate.distanceEvidence.mirrorManorStraightLineDistance>0,{relationship:'LAWFUL_APPROACH_TO_CONCEALED_MOUNTAIN_EXTERIOR',boundsDistance:distance(mb,cb),approachPathDistance:c.cavernCandidate.distanceEvidence.mirrorManorApproachPathDistance}),
              pass('MIRROR_MANOR__FRONTIER_PLAINS',!overlap(mb,fb)&&f.accessAndRelationshipEvidence.mirrorManorRoute.eligible&&s.mirrorManorEnvelopeDistance>0,{relationship:'CONNECTED_ROUTE_CANDIDATE_TO_SEPARATE_CAPACITY_RESERVE',envelopeDistance:s.mirrorManorEnvelopeDistance,routeAccepted:false}),
              pass('CAVERN_PRECINCT__FRONTIER_PLAINS',!overlap(cb,fb)&&s.cavernPrecinctEnvelopeDistance>0&&s.cavernApproachMinimumDistance>16,{relationship:'SEPARATE_CAPACITY_RESERVE_CLEAR_OF_CAVERN_PRECINCT_AND_APPROACH',envelopeDistance:s.cavernPrecinctEnvelopeDistance,cavernApproachMinimumDistance:s.cavernApproachMinimumDistance})
            ];
            if(pairs.length!==6||pairs.some(v=>!v.passed))issues.push('SIX_PAIR_RELATIONSHIP_MATRIX_FAILURE');

            const source=Object.fromEntries(o.interactionAreaProgram.areas.map(v=>[v.areaId,v]));
            const laws=[
              pass('ENTRY_WATER_REMAINS_HARD_BOUNDARY',source.GRATITUDE_REGION_ENTRY_ZONE.preservationRules.includes('WATER_REMAINS_HARD_BOUNDARY')&&!b.fp01.cameraStartRelocation&&!b.fp01.cameraAuthorityMutation,'SOURCE_LAW_PLUS_UNCHANGED_CAMERA_BOUND_ARRIVAL'),
              pass('ENTRY_CURRENT_NAVIGATION_MODEL_REMAINS_BASELINE',o.workingRegionalDecisions.movementLaw.preserveCurrentHEarthNavigationBehavior&&b.fp01.eligible,'ACTIVE_NAVIGATION_EXECUTED_UNCHANGED'),
              pass('ENTRY_MUST_NOT_COLLAPSE_INTO_MANOR',pairs[0].passed,pairs[0].basis),
              pass('MANOR_LOW_CORRIDOR_REMAINS_OPEN',b.fp02.lowerNaturalApproachPreserved&&!b.fp02.gullyOrLowCorridorBlocked,'FP_02_PROTECTED_LOW_CORRIDOR'),
              pass('MANOR_TWO_HILL_RELATION_REMAINS_LEGIBLE',b.fp02.twoHillRelationPreserved,'FP_02_TWO_HILL_RELATION'),
              pass('MANOR_BOTH_VIEWS_REMAIN_CLEAR',b.fp02.beachwardViewPreserved&&b.fp02.mountainwardViewPreserved,'FP_02_VIEW_PRESERVATION'),
              pass('MANOR_ARCHITECTURE_REMAINS_UNASSIGNED',b.fp02.selectedFootprintClass===null&&!b.fp02.downstreamConstructionRequirements.exactEntranceCoordinatesAssigned&&!b.fp02.downstreamConstructionRequirements.exactBuildingOrientationAssigned&&!b.fp02.downstreamConstructionRequirements.atriumGeometryAssigned,'FP_02_STOP_BEFORE_ARCHITECTURE'),
              pass('CAVERN_MOUNTAIN_EXTERIOR_ATTACHMENT_PRESERVED',c.cavernCandidate.surfaceCorrespondence.existingMountainExteriorAttachmentSatisfied&&FP03.disposition==='ACCEPT_CURRENT_RELATION','FP_03_CURRENT_RELATION'),
              pass('CAVERN_INTERIOR_REMAINS_SEPARATE',c.cavernCandidate.interiorTransitionRelation.separateBoundedInteriorOccurrenceRequired&&!c.cavernCandidate.interiorTransitionRelation.interiorTransitionAnchorAssigned,'SEPARATE_UNASSIGNED_INTERIOR'),
              pass('FRONTIER_NAME_DOES_NOT_PREASSIGN_FINAL_COORDINATES',source.GRATITUDE_REGION_FRONTIER_PLAINS.preservationRules.includes('PLAINS_NAME_DOES_NOT_PREASSIGN_LOWLAND_COORDINATES')&&!FP04.finalEnvelopeAccepted&&!FP04.finalAnchorAssigned,'FP_04_FORMAL_DEFERRAL'),
              pass('FRONTIER_CAPACITY_EVIDENCE_PRESERVED_NONFINAL',f.primaryNonfinalCandidate.eligible&&!f.primaryNonfinalCandidate.accepted&&f.integratedCapacityModel.capacitySupported,'EXISTING_ANALYTICAL_CANDIDATE_RETAINED'),
              pass('FRONTIER_NO_OBJECTS_FLATTENING_OR_SYSTEM_PLACEMENT',!f.authorityBoundary.frontierObjectsOrFacilitiesAuthorized&&!f.authorityBoundary.terrainFlatteningAuthorized&&!f.integratedCapacityModel.elevenFunctionalCellsAssigned&&!FP04.constructionAuthority,'FP_04_NONCONSTRUCTION'),
              pass('GLOBAL_NO_AUTHORITY_OVERREACH',Object.values(d.authorityBoundary).every(v=>v===false),d.authorityBoundary)
            ];
            if(laws.some(v=>!v.passed))issues.push('PRESERVATION_LAW_FAILURE');

            const registry={status:r.identityVerified&&r.boundary.readOnly&&!r.boundary.mutationAuthorityCreated?'PASS':'FAIL',identityVerified:r.identityVerified,identityChecks:r.identityChecks,readOnly:r.boundary.readOnly,mutationAuthorityCreated:r.boundary.mutationAuthorityCreated,networkDependencyRequired:r.boundary.networkDependencyRequired};
            if(registry.status!=='PASS')issues.push('REGISTRY_PREFLIGHT_FAILURE');
            const unresolved=areas.filter(v=>!v.requiredPlacementFieldsResolved).map(v=>v.areaId);
            if(unresolved.length)issues.push('UNRESOLVED_REQUIRED_PLACEMENT_FIELDS');
            const boundary={priorAuthorityMutation:false,grCr01To04Mutation:false,terrainMutation:false,cameraAuthorityMutation:false,buildingGeometry:false,cavernExcavation:false,roadOrCorridorGeometry:false,infrastructureGeometry:false,functionalSystemDistributionDesign:false,elevenCellMapping:false,runtimeIntegration:false,publicRouteMutation:false,livePageChange:false,productConstruction:false,finalPlacementPrMergeAuthorized:false,mergeAuthorityCreated:false,canonicalizationAuthority:false};

            return {
