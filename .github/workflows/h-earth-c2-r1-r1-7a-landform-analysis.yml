name: H-Earth C2-R1 R1.7A Landform Analysis

on:
  workflow_dispatch:

concurrency:
  group: h-earth-c2-r1-r1-7a-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-r1-7a:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute bounded landform-analysis verification
        env:
          C2_R1_HEAD: ${{ github.sha }}
        run: |
          node h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.r1-7a-landform-analysis.mjs

      - name: Upload R1.7A receipt and engineering captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-c2-r1-r1-7a-engineering-evidence
          path: |
            h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/h-earth.c2-r1.r1-7a-verification.json
            h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/r1-7a-engineering-captures/*.svg
          if-no-files-found: error
          retention-days: 30
