name: Laws Carousel Gen267 Return Event Repair Carrier
on:
  push:
    branches: ['agent/laws-carousel-gen267-mobile-legibility-repair']
    paths: ['.github/workflows/laws-carousel-gen267-return-event-repair-carrier.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/laws-carousel-gen267-mobile-legibility-repair
      - name: Harden Return to Orbit event sequence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('laws/research/methods-and-models/carousel.js')
          s=p.read_text()
          old='''    returnControl?.addEventListener("pointerdown", event => {\n      event.preventDefault();\n      event.stopPropagation();\n      closeInspection("return-to-orbit-pointer");\n    });'''
          new='''    returnControl?.addEventListener("pointerdown", event => {\n      event.stopPropagation();\n    });'''
          if old not in s: raise SystemExit('RETURN_POINTER_HANDLER_NOT_FOUND')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add laws/research/methods-and-models/carousel.js
          git commit -m 'harden Gen267 Return to Orbit event sequence'
          git push origin HEAD:agent/laws-carousel-gen267-mobile-legibility-repair
