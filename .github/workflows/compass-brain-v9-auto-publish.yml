name: Compass Brain V9 Auto Publish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compass-brain-v9-auto-publish.yml'
      - 'assets/compass/capability-object-stage.js'
      - 'assets/compass/capability-object-brain-v9.js'
      - 'inspection/compass/brain-v9/**'
      - '.github/ai-router/publication-surfaces/compass-brain-v9.json'
      - 'tools/publication-live-verify.mjs'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  publish-brain-v9:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout exact merge SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate Brain V9 publication contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          manifest='.github/ai-router/publication-surfaces/compass-brain-v9.json'
          test -f "$manifest"
          jq -e '.schema=="PUBLICATION_SURFACE_VERIFICATION_v1" and .surfaceId=="compass-brain-v9" and (.checks|type=="array") and (.checks|length>0)' "$manifest" >/dev/null
          test -f inspection/compass/brain-v9/index.html
          test -f assets/compass/capability-object-stage.js
          test -f assets/compass/capability-object-brain-v9.js
          grep -q 'COMPASS_BRAIN_V9_REFERENCE_REBUILD_v2' assets/compass/capability-object-brain-v9.js
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "runtime=$(jq -r 'if .runtime?.enabled == true then "true" else "false" end' "$manifest")" >> "$GITHUB_OUTPUT"

      - name: Build bounded Pages payload with existing live continuity
        env:
          TARGET_SHA: ${{ github.sha }}
          MANIFEST: ${{ steps.contract.outputs.manifest }}
          STAGE: ${{ runner.temp }}/pages-site
          INSPECTION_SHA: 1d45379f81ea4089e9c5f3d7d9688e702be9add3
          INSPECTION_ROOT: ${{ runner.temp }}/pages-site/inspection/h-earth/24056
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          rsync -a --prune-empty-dirs --exclude='.git/' --exclude='.github/' --exclude='preview/' --exclude='h-earth-live-6d18e158/' ./ "$STAGE/"

          rm -rf "$STAGE/showroom/globe/h-earth"
          mkdir -p "$STAGE/showroom/globe/h-earth"
          rsync -a --delete h-earth-live-6d18e158/showroom/globe/h-earth/ "$STAGE/showroom/globe/h-earth/"

          audralia_renderer_src='showroom/globe/h-earth/terrain-estate-construction-v1/renderer.mjs'
          audralia_runtime_dir="$STAGE/showroom/globe/audralia/runtime-dependencies"
          audralia_app="$STAGE/showroom/globe/audralia/weather-presentation-reconciliation/app.mjs"
          test -f "$audralia_renderer_src"
          test -f "$audralia_app"
          mkdir -p "$audralia_runtime_dir"
          cp "$audralia_renderer_src" "$audralia_runtime_dir/renderer.mjs"
          python3 - "$audralia_app" <<'PY'
from pathlib import Path
import sys
p=Path(sys.argv[1]); t=p.read_text()
old='../../h-earth/terrain-estate-construction-v1/renderer.mjs'
new='../runtime-dependencies/renderer.mjs'
if old in t:
    p.write_text(t.replace(old,new))
PY

          git fetch --no-tags --depth=1 origin "$INSPECTION_SHA"
          rm -rf "$INSPECTION_ROOT"
          mkdir -p "$INSPECTION_ROOT"
          git archive "$INSPECTION_SHA" showroom/globe/audralia showroom/globe/h-earth h-earth-3d | tar -x -C "$INSPECTION_ROOT"

          mkdir -p "$STAGE/.well-known"
          manifest_sha="$(sha256sum "$MANIFEST" | awk '{print $1}')"
          jq -n --arg schema DGB_OBJECT_INSPECTION_RELEASE_v1 --arg commit "$TARGET_SHA" --arg surface compass-brain-v9 --arg manifest "$MANIFEST" --arg manifestSha256 "$manifest_sha" '{schema:$schema,commit:$commit,surface:$surface,verificationManifest:$manifest,verificationManifestSha256:$manifestSha256}' > "$STAGE/.well-known/dgb-release.json"
          test -f "$STAGE/inspection/compass/brain-v9/index.html"
          test "$(du -sb "$STAGE" | awk '{print $1}')" -lt 1073741824

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy exact merge artifact
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Verify exact public Brain V9 bytes
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
          MANIFEST: ${{ steps.contract.outputs.manifest }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            marker="$(curl --fail --silent --show-error -L --max-time 20 "${PAGE_URL%/}/.well-known/dgb-release.json" 2>/dev/null || true)"
            observed="$(printf '%s' "$marker" | jq -r '.commit // empty' 2>/dev/null || true)"
            surface="$(printf '%s' "$marker" | jq -r '.surface // empty' 2>/dev/null || true)"
            if [ "$observed" = "$TARGET_SHA" ] && [ "$surface" = 'compass-brain-v9' ]; then
              node tools/publication-live-verify.mjs static "$PAGE_URL" "$MANIFEST"
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Set up Chrome for runtime verification
        if: ${{ steps.contract.outputs.runtime == 'true' }}
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install runtime verifier dependency
        if: ${{ steps.contract.outputs.runtime == 'true' }}
        run: npm install --no-save --no-package-lock puppeteer-core@24.15.0

      - name: Verify live Brain V9 runtime
        if: ${{ steps.contract.outputs.runtime == 'true' }}
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
          MANIFEST: ${{ steps.contract.outputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_PATH="$(command -v google-chrome || command -v chrome || command -v chromium || find /opt/hostedtoolcache/setup-chrome -type f -name chrome 2>/dev/null | head -1)"
          test -x "$CHROME_PATH"
          node tools/publication-live-verify.mjs runtime "$PAGE_URL" "$MANIFEST"
