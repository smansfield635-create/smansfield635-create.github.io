name: H-Earth C2-R1 Role 6 IMI v4 Plus 8 Remedy Packet v1 Conformance

on:
  pull_request:
    paths:
      - '.github/workflows/h-earth-c2-r1-role6-imi-v4-plus8-remedy-packet-v1-conformance.yml'
      - 'research/route-operator-platform-v1/remedy-authority/h-earth-c2-r1-coast-entry-to-gratitude-v4-plus8/**'

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Role 6 packet records
        shell: bash
        run: |
          set -euo pipefail
          python research/route-operator-platform-v1/remedy-authority/h-earth-c2-r1-coast-entry-to-gratitude-v4-plus8/verify_role6_records_v1.py | tee role6-conformance-receipt.json
      - name: Validate JSON records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          for p in pathlib.Path('research/route-operator-platform-v1/remedy-authority/h-earth-c2-r1-coast-entry-to-gratitude-v4-plus8').glob('*.json'):
              json.loads(p.read_text())
          json.loads(pathlib.Path('role6-conformance-receipt.json').read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: h-earth-c2-r1-role6-imi-v4-plus8-${{ github.sha }}
          path: role6-conformance-receipt.json
          if-no-files-found: error
          retention-days: 90
