name: Awards H-Earth 30s native final

on:
  push:
    branches:
      - agent/awards-h-earth-30s-native-final-20260815
    paths:
      - .github/workflows/awards-h-earth-30s-native-final.yml

permissions:
  contents: write

jobs:
  build-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/awards-h-earth-30s-native-final-20260815
          fetch-depth: 0

      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Recover exact approved 30-second picture master
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/awards showroom/globe/h-earth/awards/media
          curl -fL --retry 4 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1C4bnM7USwBITlHHNbphl22de15YC8shO&export=download&confirm=t' \
            -o /tmp/awards/h-earth-30s-visual.mp4
          test "$(stat -c%s /tmp/awards/h-earth-30s-visual.mp4)" -eq 5483909
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration -of default=nw=1 /tmp/awards/h-earth-30s-visual.mp4

      - name: Fetch approved Vivaldi Summer recording
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            'https://upload.wikimedia.org/wikipedia/commons/a/a5/Vivaldi_-_Four_Seasons_2_Summer_mvt_1_Allegro_non_molto_-_John_Harrison_violin.oga' \
            -o /tmp/awards/vivaldi-summer.oga
          test "$(stat -c%s /tmp/awards/vivaldi-summer.oga)" -gt 5000000
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,channels -show_entries format=duration -of default=nw=1 /tmp/awards/vivaldi-summer.oga

      - name: Mux score without altering approved picture frames
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y \
            -i /tmp/awards/h-earth-30s-visual.mp4 \
            -ss 167 -i /tmp/awards/vivaldi-summer.oga \
            -t 30 \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy -c:a aac -b:a 192k \
            -movflags +faststart -shortest \
            showroom/globe/h-earth/awards/media/diamond-gate-h-earth-audralia-30s-vivaldi.mp4
          test "$(stat -c%s showroom/globe/h-earth/awards/media/diamond-gate-h-earth-audralia-30s-vivaldi.mp4)" -gt 5500000
          ffprobe -v error -show_entries format=duration -show_entries stream=index,codec_type,codec_name,width,height -of default=nw=1 showroom/globe/h-earth/awards/media/diamond-gate-h-earth-audralia-30s-vivaldi.mp4

      - name: Bind self-contained 30-second final into Awards page
        shell: python
        run: |
          from pathlib import Path
          p = Path('showroom/globe/h-earth/awards/index.html')
          s = p.read_text()
          old_video = '<video id="world-reel" playsinline controls preload="metadata" aria-label="18-second edited H-Earth browser-native world environment excerpt with embedded Vivaldi score" src="/showroom/globe/h-earth/awards/media/diamond-gate-h-earth-awards-18s-vivaldi.mp4"></video>'
          new_video = '<video id="world-reel" playsinline controls preload="metadata" aria-label="30-second H-Earth and Audralia world-navigation presentation with embedded Vivaldi score" src="/showroom/globe/h-earth/awards/media/diamond-gate-h-earth-audralia-30s-vivaldi.mp4"></video>'
          if old_video not in s:
              raise SystemExit('expected 18-second recovery binding not found')
          s = s.replace(old_video, new_video)
          s = s.replace('18-second H-Earth environment excerpt · finished four-shot 16:9 presentation with embedded score', '30-second H-Earth + Audralia world-navigation presentation · approved picture edit with continuous embedded Vivaldi score')
          s = s.replace('Music: Antonio Vivaldi, <em>Summer</em>, I. Allegro non molto · embedded in the self-contained presentation asset.', 'Music: Antonio Vivaldi, <em>Summer</em>, I. Allegro non molto · John Harrison, violin · Robert Turizziani, conductor · Wichita State University Chamber Players · soundtrack excerpt begins at 2:47 elapsed · recording licensed CC BY-SA 4.0 via Wikimedia Commons.')
          p.write_text(s)

      - name: Verify final native media architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -F '/showroom/globe/h-earth/awards/media/diamond-gate-compass-mirrorland-36s.mp4' showroom/globe/h-earth/awards/index.html
          grep -F '/showroom/globe/h-earth/awards/media/diamond-gate-h-earth-audralia-30s-vivaldi.mp4' showroom/globe/h-earth/awards/index.html
          ! grep -F 'drive.google.com' showroom/globe/h-earth/awards/index.html
          ! grep -F 'upload.wikimedia.org' showroom/globe/h-earth/awards/index.html

      - name: Commit final self-contained H-Earth asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add showroom/globe/h-earth/awards/index.html showroom/globe/h-earth/awards/media/diamond-gate-h-earth-audralia-30s-vivaldi.mp4
          git diff --cached --quiet && exit 0
          git commit -m 'Install approved 30-second H-Earth reel with embedded Vivaldi score'
          git push origin HEAD:agent/awards-h-earth-30s-native-final-20260815
