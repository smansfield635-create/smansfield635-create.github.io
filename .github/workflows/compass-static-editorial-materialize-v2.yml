name: Compass Static Editorial Materialize V2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/compass-static-editorial-materialize-v2.yml'
      - 'tools/compass-static-editorial-materialize.py'
      - 'tools/compass-static-editorial-qualification.mjs'
  push:
    branches: [recovery/compass-static-editorial-successor]
    paths:
      - '.github/workflows/compass-static-editorial-materialize-v2.yml'

permissions:
  contents: write

concurrency:
  group: compass-static-editorial-materialize-v2
  cancel-in-progress: true

jobs:
  materialize:
    if: github.head_ref == 'recovery/compass-static-editorial-successor' || github.ref_name == 'recovery/compass-static-editorial-successor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/compass-static-editorial-successor
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            index.html
            assets/compass/compass.crystals.js
            assets/compass/compass.gen1537.recovery.js
            assets/compass/compass.capability-carousel.js
            tools/ai-room-transport/ai-media-source-registry.v1.json
            tools/compass-static-editorial-materialize.py
            tools/compass-static-editorial-qualification.mjs
            .github/workflows/compass-static-editorial-successor-materialize.yml
            .github/workflows/compass-static-editorial-materialize-v2.yml
      - name: Generate candidate without committing
        run: python -O tools/compass-static-editorial-materialize.py
      - name: Reconcile duplicate hidden room declarations if present
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          marker='<section class="compass-rooms" data-compass-room-declarations hidden>'
          starts=[]
          pos=0
          while True:
              i=s.find(marker,pos)
              if i<0: break
              starts.append(i); pos=i+1
          if len(starts)==1:
              print('ONE_CANONICAL_ROOM_DECLARATION_PRESENT')
              raise SystemExit(0)
          if len(starts)!=2:
              raise SystemExit(f'ROOM_DECLARATION_COUNT_INVALID:{len(starts)}')
          token=re.compile(r'<section(?:\s|>)|</section>',re.I)
          def section_at(start):
              depth=0
              for m in token.finditer(s,start):
                  if m.group(0).lower().startswith('<section'):
                      depth+=1
                  else:
                      depth-=1
                      if depth==0:
                          return start,m.end(),s[start:m.end()]
              raise SystemExit('UNBALANCED_ROOM_DECLARATION_SECTION')
          a0,a1,a=section_at(starts[0])
          b0,b1,b=section_at(starts[1])
          if a!=b:
              raise SystemExit('ROOM_DECLARATION_COPIES_DIFFER_FAIL_CLOSED')
          s=s[:b0]+s[b1:]
          p.write_text(s)
          print('IDENTICAL_ROOM_DECLARATION_DUPLICATE_REMOVED')
          PY
      - name: Verify structural authority counts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          checks={
            'roomDeclarations':s.count('<section class="compass-rooms" data-compass-room-declarations hidden>'),
            'capabilitySwitcher':s.count('data-compass-capability-switcher'),
            'builtSections':s.count('<section class="compass-built"'),
            'ctaSections':s.count('<section class="compass-build-cta"'),
            'accessibilityFallback':s.count('data-editorial-fallback="true"'),
          }
          print('STRUCTURE_COUNTS',checks)
          expected={'roomDeclarations':1,'capabilitySwitcher':1,'builtSections':1,'ctaSections':1,'accessibilityFallback':1}
          if checks != expected:
              raise SystemExit('STRUCTURE_COUNT_MISMATCH')
          PY
      - run: node tools/compass-static-editorial-qualification.mjs
      - name: Commit generated candidate and remove temporary construction carriers
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/compass-static-editorial-successor-materialize.yml
          rm -f .github/workflows/compass-static-editorial-materialize-v2.yml
          rm -f tools/compass-static-editorial-materialize.py
          git add -A index.html assets/compass/compass.crystals.js .github/workflows/compass-static-editorial-successor-materialize.yml .github/workflows/compass-static-editorial-materialize-v2.yml tools/compass-static-editorial-materialize.py
          git commit -m 'feat(compass): materialize static successor and sustain star motion'
          git push origin HEAD:recovery/compass-static-editorial-successor
