name: H-Earth IMI Empirical Platform

on:
  pull_request:
    paths:
      - '.github/workflows/h-earth-imi-empirical-platform.yml'
      - 'h-earth-3d/control-plane/imi-empirical-platform/**'
      - 'h-earth-3d/tools/imi-empirical-platform/**'
      - 'h-earth-3d/validation/imi-empirical-platform/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-imi-empirical-platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact IMI empirical platform candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Execute IMI empirical operational suite
        shell: bash
        run: |
          set -euo pipefail
          node h-earth-3d/validation/imi-empirical-platform/imi.empirical-operational-suite.runner.mjs --output-dir /tmp/imi-empirical-platform-operational-suite 2>&1 | tee /tmp/imi-empirical-platform-operational-suite.log

      - name: Execute CMS hospital refresh 2026 run
        shell: bash
        run: |
          set -euo pipefail
          node h-earth-3d/validation/imi-empirical-platform/imi.cms-hospital-refresh-2026.runner.mjs --output-dir /tmp/imi-cms-hospital-refresh-2026 2>&1 | tee /tmp/imi-cms-hospital-refresh-2026.log

      - name: Execute USDA honey bee refresh 2026 run
        shell: bash
        run: |
          set -euo pipefail
          node h-earth-3d/validation/imi-empirical-platform/imi.usda-honey-bee-refresh-2026.runner.mjs --output-dir /tmp/imi-usda-honey-bee-refresh-2026 2>&1 | tee /tmp/imi-usda-honey-bee-refresh-2026.log

      - name: Execute DSSI sovereign debt-service expansion 2026 run
        shell: bash
        run: |
          set -euo pipefail
          node h-earth-3d/validation/imi-empirical-platform/imi.dssi-sovereign-debt-service-expansion-2026.runner.mjs --output-dir /tmp/imi-dssi-sovereign-debt-service-expansion-2026 2>&1 | tee /tmp/imi-dssi-sovereign-debt-service-expansion-2026.log

      - name: Bind exact spontaneous speech source into evidence artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/imi-spontaneous-speech-rerun-2026
          curl --location --fail --silent --show-error \
            'https://journals.plos.org/plosone/article/file?type=supplementary&id=10.1371/journal.pone.0324270.s003' \
            --output /tmp/imi-spontaneous-speech-rerun-2026/pone.0324270.s003.csv
          printf '%s  %s\n' \
            '8aeea454a7e52ce072fa19289976cb1a06adac0ea8103c7537ec5677b72b4e2d' \
            '/tmp/imi-spontaneous-speech-rerun-2026/pone.0324270.s003.csv' \
            | sha256sum --check

      - name: Execute spontaneous speech repository rerun 2026
        shell: bash
        run: |
          set -euo pipefail
          node h-earth-3d/validation/imi-empirical-platform/imi.spontaneous-speech-rerun-2026.runner.mjs --output-dir /tmp/imi-spontaneous-speech-rerun-2026 2>&1 | tee /tmp/imi-spontaneous-speech-rerun-2026.log

      - name: Verify existing four-domain empirical portfolio completion
        shell: bash
        run: |
          set -euo pipefail
          node h-earth-3d/validation/imi-empirical-platform/imi.existing-four-domain-portfolio-completion.runner.mjs \
            --bee-dir /tmp/imi-usda-honey-bee-refresh-2026 \
            --speech-dir /tmp/imi-spontaneous-speech-rerun-2026 \
            --output-dir /tmp/imi-existing-four-domain-portfolio-completion \
            2>&1 | tee /tmp/imi-existing-four-domain-portfolio-completion.log

      - name: Execute Phase 1 multi-domain empirical portfolio synthesis
        shell: bash
        run: |
          set -euo pipefail
          node h-earth-3d/validation/imi-empirical-platform/imi.multi-domain-portfolio-synthesis.phase-progression-adapter.mjs \
            --hospital-dir /tmp/imi-cms-hospital-refresh-2026 \
            --bee-dir /tmp/imi-usda-honey-bee-refresh-2026 \
            --dssi-dir /tmp/imi-dssi-sovereign-debt-service-expansion-2026 \
            --speech-dir /tmp/imi-spontaneous-speech-rerun-2026 \
            --output-dir /tmp/imi-multi-domain-portfolio-synthesis \
            2>&1 | tee /tmp/imi-multi-domain-portfolio-synthesis.log

      - name: Verify Phase 2 generalizability protocol closure
        shell: bash
        run: |
          set -euo pipefail
          node h-earth-3d/validation/imi-empirical-platform/imi.generalizability-protocol.runner.mjs \
            --output-dir /tmp/imi-generalizability-protocol \
            2>&1 | tee /tmp/imi-generalizability-protocol.log

      - name: Upload IMI empirical platform operational evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imi-empirical-platform-operational-evidence
          path: |
            /tmp/imi-empirical-platform-operational-suite.log
            /tmp/imi-empirical-platform-operational-suite/**
            /tmp/imi-cms-hospital-refresh-2026.log
            /tmp/imi-cms-hospital-refresh-2026/**
            /tmp/imi-usda-honey-bee-refresh-2026.log
            /tmp/imi-usda-honey-bee-refresh-2026/**
            /tmp/imi-dssi-sovereign-debt-service-expansion-2026.log
            /tmp/imi-dssi-sovereign-debt-service-expansion-2026/**
            /tmp/imi-spontaneous-speech-rerun-2026.log
            /tmp/imi-spontaneous-speech-rerun-2026/**
            /tmp/imi-existing-four-domain-portfolio-completion.log
            /tmp/imi-existing-four-domain-portfolio-completion/**
            /tmp/imi-multi-domain-portfolio-synthesis.log
            /tmp/imi-multi-domain-portfolio-synthesis/**
            /tmp/imi-generalizability-protocol.log
            /tmp/imi-generalizability-protocol/**
          retention-days: 90

  phase3-hospital-external-replication:
    needs: verify-imi-empirical-platform
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen PySUS DuckLake access dependency
        run: python -m pip install --disable-pip-version-check pysus==2.7.0
      - name: Execute hospital external or next-release track
        env:
          PYTHON: python
        shell: bash
        run: |
          set -euo pipefail
          node h-earth-3d/validation/imi-empirical-platform/imi.phase3.hospital-external-or-next-release.runner.mjs \
            --output-dir /tmp/imi-phase3-hospital \
            2>&1 | tee /tmp/imi-phase3-hospital.log
      - name: Upload hospital Phase 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imi-phase3-hospital-evidence
          path: |
            /tmp/imi-phase3-hospital.log
            /tmp/imi-phase3-hospital/**
          retention-days: 90

  phase3-speech-heldout-reproduction:
    needs: verify-imi-empirical-platform
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded CLAC extraction dependencies
        run: python -m pip install --disable-pip-version-check remotezip==0.12.3 openpyxl==3.1.5
      - name: Execute speech held-out source and reproduction gate
        env:
          PYTHON: python
        shell: bash
        run: |
          set -euo pipefail
          node h-earth-3d/validation/imi-empirical-platform/imi.phase3.speech-heldout-dataset.runner.mjs \
            --output-dir /tmp/imi-phase3-speech \
            2>&1 | tee /tmp/imi-phase3-speech.log
      - name: Upload speech Phase 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imi-phase3-speech-evidence
          path: |
            /tmp/imi-phase3-speech.log
            /tmp/imi-phase3-speech/**
          retention-days: 90

  phase3-bee-longer-panel:
    needs: verify-imi-empirical-platform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute bee longer-panel and route-discrimination track
        shell: bash
        run: |
          set -euo pipefail
          node h-earth-3d/validation/imi-empirical-platform/imi.phase3.bee-longer-panel.runner.mjs \
            --output-dir /tmp/imi-phase3-bee \
            2>&1 | tee /tmp/imi-phase3-bee.log
      - name: Upload bee Phase 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imi-phase3-bee-evidence
          path: |
            /tmp/imi-phase3-bee.log
            /tmp/imi-phase3-bee/**
          retention-days: 90

  phase3-dssi-remaining-country-continuation:
    needs: verify-imi-empirical-platform
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute DSSI remaining-country continuation track
        shell: bash
        run: |
          set -euo pipefail
          node h-earth-3d/validation/imi-empirical-platform/imi.phase3.dssi-remaining-country-continuation.runner.mjs \
            --output-dir /tmp/imi-phase3-dssi \
            2>&1 | tee /tmp/imi-phase3-dssi.log
      - name: Upload DSSI Phase 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imi-phase3-dssi-evidence
          path: |
            /tmp/imi-phase3-dssi.log
            /tmp/imi-phase3-dssi/**
          retention-days: 90

  phase3-parallel-external-tests-collective:
    needs:
      - phase3-hospital-external-replication
      - phase3-speech-heldout-reproduction
      - phase3-bee-longer-panel
      - phase3-dssi-remaining-country-continuation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: imi-phase3-hospital-evidence
          path: /tmp/downloaded-phase3-hospital
      - uses: actions/download-artifact@v4
        with:
          name: imi-phase3-speech-evidence
          path: /tmp/downloaded-phase3-speech
      - uses: actions/download-artifact@v4
        with:
          name: imi-phase3-bee-evidence
          path: /tmp/downloaded-phase3-bee
      - uses: actions/download-artifact@v4
        with:
          name: imi-phase3-dssi-evidence
          path: /tmp/downloaded-phase3-dssi
      - name: Verify collective Phase 3 disposition
        shell: bash
        run: |
          set -euo pipefail
          node h-earth-3d/validation/imi-empirical-platform/imi.phase3.parallel-external-tests.collective.runner.mjs \
            --hospital-dir /tmp/downloaded-phase3-hospital/imi-phase3-hospital \
            --speech-dir /tmp/downloaded-phase3-speech/imi-phase3-speech \
            --bee-dir /tmp/downloaded-phase3-bee/imi-phase3-bee \
            --dssi-dir /tmp/downloaded-phase3-dssi/imi-phase3-dssi \
            --output-dir /tmp/imi-phase3-collective \
            2>&1 | tee /tmp/imi-phase3-collective.log
      - name: Upload collective Phase 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imi-phase3-collective-evidence
          path: |
            /tmp/imi-phase3-collective.log
            /tmp/imi-phase3-collective/**
          retention-days: 90
