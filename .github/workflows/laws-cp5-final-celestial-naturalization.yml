name: Laws CP5 Final Celestial Naturalization

on:
  pull_request:
    branches:
      - main
    types: [synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: laws-cp5-final-celestial-naturalization
  cancel-in-progress: false

jobs:
  execute-candidate:
    if: github.head_ref == 'agent/laws-cp5-final-celestial-naturalization-001'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/laws-cp5-final-celestial-naturalization-001
          fetch-depth: 0

      - name: Apply bounded settled-motion sampler correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('verification/laws-cp5-final-celestial-naturalization.py')
          text = path.read_text()

          module_old = '        verifier = pathlib.Path("/tmp/laws-cp5-final-verifier.mjs")'
          module_new = '        verifier = REPO / "verification/.laws-cp5-final-verifier.mjs"'
          if module_old in text:
              text = text.replace(module_old, module_new, 1)
          elif module_new not in text:
              raise SystemExit('VERIFIER_MODULE_RESOLUTION_TARGET_NOT_FOUND')

          visible_old = '''    await setPrimary(page,'test');
    await page.screenshot({path:path.join(SHOTS,`${profile.id.toLowerCase()}-test-primary.png`),fullPage:false});
    await cropAuthority(page,'test',`${profile.id.toLowerCase()}-sun-crop.png`);
'''
          visible_new = '''    await setPrimary(page,'test');
    const settledScrollY=await page.evaluate(()=>{
      const target=document.querySelector('[data-laws-category][data-direction="test"]');
      target?.scrollIntoView({block:'center',inline:'center',behavior:'instant'});
      return scrollY;
    });
    await sleep(500);
    await page.screenshot({path:path.join(SHOTS,`${profile.id.toLowerCase()}-test-primary.png`),fullPage:false});
    await cropAuthority(page,'test',`${profile.id.toLowerCase()}-sun-crop.png`);
'''
          if visible_old in text:
              text = text.replace(visible_old, visible_new, 1)
          elif visible_new not in text:
              raise SystemExit('MOTION_VISIBILITY_TARGET_NOT_FOUND')

          arrays_old = '''      const buffers=[];
      const centers=[];
      const frames=[];
'''
          arrays_new = '''      const buffers=[];
      const centers=[];
      const scrollPositions=[];
      const frames=[];
'''
          if arrays_old in text:
              text = text.replace(arrays_old, arrays_new, 1)
          elif arrays_new not in text:
              raise SystemExit('MOTION_SCROLL_ARRAY_TARGET_NOT_FOUND')

          sample_old = '''        buffers.push(buffer);
        centers.push(box?{x:box.x+box.width/2,y:box.y+box.height/2}:null);
        frames.push({frame,elapsedMs:frame*700});
'''
          sample_new = '''        buffers.push(buffer);
        centers.push(box?{x:box.x+box.width/2,y:box.y+box.height/2}:null);
        scrollPositions.push(await page.evaluate(()=>scrollY));
        frames.push({frame,elapsedMs:frame*700});
'''
          if sample_old in text:
              text = text.replace(sample_old, sample_new, 1)
          elif sample_new not in text:
              raise SystemExit('MOTION_SCROLL_SAMPLE_TARGET_NOT_FOUND')

          assertion_old = '''      const validCenters=centers.filter(Boolean);
      const centerDrift=validCenters.length?Math.max(...validCenters.map(center=>Math.hypot(center.x-validCenters[0].x,center.y-validCenters[0].y))):null;
      motionEvidence.push({profile:profile.id,frames,deltas,meanMotion,centers,centerDrift,settledCamera:true,sourceLocalRigidSpinDisabled:true});
      assert(meanMotion>0.45,'SOLAR_INTERNAL_EVOLUTION_NOT_MEASURABLE',profile.id,{deltas,meanMotion});
      assert(Number.isFinite(centerDrift)&&centerDrift<=4.0,'SOLAR_SETTLED_VIEW_DRIFT_EXCESSIVE',profile.id,{centerDrift,centers});
'''
          assertion_new = '''      const validCenters=centers.filter(Boolean);
      const centerDrift=validCenters.length?Math.max(...validCenters.map(center=>Math.hypot(center.x-validCenters[0].x,center.y-validCenters[0].y))):null;
      const pageScrollDrift=scrollPositions.length?Math.max(...scrollPositions.map(value=>Math.abs(value-settledScrollY))):null;
      const viewport=page.viewport();
      const targetVisible=centers.every(center=>center&&center.x>=0&&center.x<=viewport.width&&center.y>=0&&center.y<=viewport.height);
      motionEvidence.push({profile:profile.id,frames,deltas,meanMotion,centers,centerDrift,scrollPositions,pageScrollDrift,settledCamera:true,sharedCompassRepositioningAllowed:true,sourceLocalRigidSpinDisabled:true});
      assert(meanMotion>0.45,'SOLAR_INTERNAL_EVOLUTION_NOT_MEASURABLE',profile.id,{deltas,meanMotion});
      assert(Number.isFinite(pageScrollDrift)&&pageScrollDrift<=1.0,'SETTLED_PAGE_SCROLL_DRIFT_EXCESSIVE',profile.id,{settledScrollY,scrollPositions,pageScrollDrift});
      assert(targetVisible,'SOLAR_TARGET_NOT_VISIBLE_DURING_MOTION',profile.id,{centers,viewport});
'''
          if assertion_old in text:
              text = text.replace(assertion_old, assertion_new, 1)
          elif assertion_new not in text:
              raise SystemExit('MOTION_ASSERTION_TARGET_NOT_FOUND')

          path.write_text(text)
          PY
          if ! git diff --quiet -- verification/laws-cp5-final-celestial-naturalization.py; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add verification/laws-cp5-final-celestial-naturalization.py
            git commit -m 'Correct CP5 settled motion sampler [skip ci]'
            git push origin HEAD:agent/laws-cp5-final-celestial-naturalization-001
          fi

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Install pinned browser dependencies
        run: npm install --no-save --no-package-lock puppeteer-core@24.15.0 pngjs@7.0.0

      - name: Verify exact bounded candidate
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: python3 verification/laws-cp5-final-celestial-naturalization.py

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laws-cp5-final-celestial-naturalization
          path: |
            laws-cp5-final-celestial-receipt.json
            laws-cp5-final-celestial-summary.json
            laws-cp5-final-celestial-failure.json
            laws-cp5-final-celestial-evidence/**
            /tmp/laws-cp5-final-server.log
          if-no-files-found: ignore
          retention-days: 30
