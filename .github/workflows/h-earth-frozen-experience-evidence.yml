name: H-Earth Frozen Head Experience Evidence

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact frozen candidate SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
      - name: Verify frozen head
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Capture exact visual and interaction evidence
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . >/tmp/h-earth-anchor-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            curl --fail --silent http://127.0.0.1:4173/showroom/globe/h-earth/ >/dev/null && break
            sleep 1
          done
          mkdir -p /tmp/h-earth-anchor-evidence
          cat > h-earth-anchor-capture.mjs <<'NODE'
          import fs from 'node:fs/promises';
          import crypto from 'node:crypto';
          import {chromium} from 'playwright';

          const targetSha=process.env.TARGET_SHA;
          const route='/showroom/globe/h-earth/?ocean-presentation=v1&t4=additive-v1';
          const out='/tmp/h-earth-anchor-evidence';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({
            viewport:{width:694,height:747},deviceScaleFactor:1.5,
            isMobile:true,hasTouch:true,
            userAgent:'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36'
          });
          const page=await context.newPage();
          const pageErrors=[],consoleErrors=[],requestFailures=[];
          page.on('pageerror',e=>pageErrors.push(e.message));
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
          page.on('requestfailed',r=>requestFailures.push(r.url()));
          const observe=async(label)=>{
            const state=await page.evaluate(()=>{
              const r=window.H_EARTH_RUN8E_PUBLIC_ROUTE?.getLiveGpuReceipt?.()??null;
              const canvas=document.getElementById('h-earth-functional-landscape-canvas');
              return {
                ready:document.getElementById('h-earth-functional-landscape-route')?.dataset.run8eReady??null,
                selectedRendererPath:r?.selectedRendererPath??null,
                animationFrame:r?.counters?.animationFrameCount??null,
                presentations:r?.counters?.gpuFramebufferPresentationCount??null,
                worldRebuildCount:r?.counters?.worldRebuildCount??null,
                navigationState:r?.latestNavigationState??null,
                lastFrame:r?.frameRecords?.at(-1)??null,
                packageIdentity:r?.resources?.package?.runtimeIdentity??null,
                canvasSize:canvas?{width:canvas.width,height:canvas.height}:null,
                bodyText:document.body?.innerText?.slice(0,1000)??null
              };
            });
            const path=out+'/'+label+'.png';
            await page.screenshot({path,fullPage:true});
            const bytes=await fs.readFile(path);
            return {...state,screenshot:label+'.png',screenshotSha256:crypto.createHash('sha256').update(bytes).digest('hex')};
          };
          let before,after,gesture=null;
          try{
            await page.goto('http://127.0.0.1:4173'+route,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>document.getElementById('h-earth-functional-landscape-route')?.dataset.run8eReady==='true',null,{timeout:120000});
            before=await observe('before-touch');
            const canvas=page.locator('#h-earth-functional-landscape-canvas');
            const box=await canvas.boundingBox();
            if(!box)throw Error('CANVAS_BOX_MISSING');
            const x=Math.round(box.x+box.width*0.55);
            const y=Math.round(box.y+box.height*0.57);
            const cdp=await context.newCDPSession(page);
            await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x,y,id:1}]});
            for(let i=1;i<=12;i++){
              await cdp.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:x+Math.round(i*9),y:y+Math.round(i*2),id:1}]});
            }
            await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});
            gesture={kind:'CDP_TOUCH_SWIPE',start:{x,y},end:{x:x+108,y:y+24},steps:12};
            await page.waitForTimeout(500);
            after=await observe('after-touch');
          } finally {
            await context.close(); await browser.close();
          }
          const receipt={
            schema:'H_EARTH_FROZEN_HEAD_EXPERIENCE_OBSERVATION_v1',
            targetSha,route,exactHead:true,productMutation:false,
            viewport:{width:694,height:747,deviceScaleFactor:1.5,isMobile:true,hasTouch:true},
            gesture,before,after,pageErrors,consoleErrors,requestFailures,
            screenshotChanged:before?.screenshotSha256!==after?.screenshotSha256,
            navigationStateChanged:before?.navigationState?.stateId!==after?.navigationState?.stateId,
            packageIdentityStable:before?.packageIdentity===after?.packageIdentity,
            worldRebuildStayedZero:before?.worldRebuildCount===0&&after?.worldRebuildCount===0
          };
          await fs.writeFile(out+'/receipt.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          if(before?.ready!=='true'||after?.ready!=='true'||pageErrors.length||consoleErrors.length||requestFailures.length)process.exitCode=1;
          NODE
          node h-earth-anchor-capture.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-frozen-experience-${{ inputs.target_sha }}
          path: |
            /tmp/h-earth-anchor-evidence
            /tmp/h-earth-anchor-server.log
          retention-days: 30
