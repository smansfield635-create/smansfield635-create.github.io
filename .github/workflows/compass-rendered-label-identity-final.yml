name: Compass Rendered Label Identity Final
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/compass-rendered-label-identity-final.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Identify cardinal label owners and pseudo layers before and after real drag
        run: |
          cat > audit.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:960,height:1500},deviceScaleFactor:1});
          await page.goto('https://diamondgatebridge.com/compass-composite/?identity='+Date.now(),{waitUntil:'networkidle',timeout:120000});
          await page.waitForTimeout(5000);
          const report=async(label)=>{
            const out=await page.evaluate(()=>{
              const root=document.querySelector('[data-compass-root]');
              const scene=document.querySelector('[data-compass-scene]');
              const snap=(wing)=>{
                const c=getComputedStyle(wing),b=getComputedStyle(wing,'::before'),a=getComputedStyle(wing,'::after'),r=wing.getBoundingClientRect();
                return {
                  id:wing.dataset.cardinalId||wing.dataset.wing||'',
                  cls:wing.className,
                  text:(wing.textContent||'').replace(/\s+/g,' ').trim(),
                  readable:wing.dataset.gen1596Readable||'',
                  selected:wing.dataset.selected||'',
                  depth:wing.dataset.depth||'',
                  rect:{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)},
                  style:{display:c.display,visibility:c.visibility,opacity:c.opacity,bg:c.backgroundColor,border:c.borderTopColor,shadow:c.boxShadow,z:c.zIndex,transform:c.transform},
                  before:{content:b.content,display:b.display,visibility:b.visibility,opacity:b.opacity,bg:b.backgroundColor,border:b.borderTopColor,shadow:b.boxShadow,transform:b.transform},
                  after:{content:a.content,display:a.display,visibility:a.visibility,opacity:a.opacity,bg:a.backgroundColor,border:a.borderTopColor,shadow:a.boxShadow,transform:a.transform},
                  spans:[...wing.querySelectorAll('span')].map(s=>{const sc=getComputedStyle(s),sr=s.getBoundingClientRect();return {text:(s.textContent||'').trim(),display:sc.display,visibility:sc.visibility,opacity:sc.opacity,bg:sc.backgroundColor,rect:{x:Math.round(sr.x),y:Math.round(sr.y),w:Math.round(sr.width),h:Math.round(sr.height)}}})
                };
              };
              return {mode:root?.dataset.compassMode||'',foreground:root?.dataset.renderedForegroundCardinal||'',readable:root?.dataset.readableCardinal||'',orbitFocus:root?.dataset.orbitFocus||'',scene:scene?(()=>{const r=scene.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height}})():null,wings:[...document.querySelectorAll('[data-compass-cardinal]')].map(snap)};
            });
            console.log(label+' '+JSON.stringify(out));
          };
          await report('BEFORE');
          const scene=page.locator('[data-compass-scene]');
          const box=await scene.boundingBox();
          if(!box) throw new Error('NO_SCENE_BOX');
          await page.mouse.move(box.x+box.width*0.72,box.y+box.height*0.52);
          await page.mouse.down();
          await page.mouse.move(box.x+box.width*0.28,box.y+box.height*0.52,{steps:18});
          await page.mouse.up();
          await page.waitForTimeout(2200);
          await report('AFTER_DRAG');
          await browser.close();
          NODE
          node audit.mjs
