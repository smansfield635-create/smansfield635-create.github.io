name: H-Earth C3C2 Frozen Preview Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h-earth-c3c2-preview-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Diagnose exact frozen candidate transport
        env:
          CANDIDATE_URL: https://cdn.jsdelivr.net/gh/smansfield635-create/smansfield635-create.github.io@4fdbbffb95018cec50372678d7631843249f52bd/showroom/globe/h-earth/index.html
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--use-gl=swiftshader','--disable-dev-shm-usage']});
          const page = await browser.newPage({viewport:{width:694,height:747},deviceScaleFactor:1.5,isMobile:true,hasTouch:true});
          const consoleErrors=[]; const pageErrors=[]; const failures=[];
          page.on('console',m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
          page.on('pageerror',e=>pageErrors.push(String(e?.stack||e)));
          page.on('requestfailed',r=>failures.push({url:r.url(),failure:r.failure()}));
          const response=await page.goto(process.env.CANDIDATE_URL,{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(20000);
          const facts=await page.evaluate(()=>({
            href:location.href,
            ready:globalThis.H_EARTH_RUN8E_PUBLIC_ROUTE?.ready===true,
            snapshot:globalThis.H_EARTH_RUN8E_PUBLIC_ROUTE?.getSnapshot?.()??null,
            startup:globalThis.H_EARTH_RENDERER_STARTUP_DIAGNOSTICS?.getReceipt?.()??null,
            runtime:globalThis.H_EARTH_RUNTIME_DIAGNOSTICS?.getSnapshot?.()??null,
            moduleSrc:document.getElementById('h-earth-current-run8e-module')?.src??null
          }));
          console.log(JSON.stringify({http:response?.status()??null,facts,consoleErrors,pageErrors,failures},null,2));
          await browser.close();
          if(response?.status()!==200) process.exit(2);
          NODE
