name: H-Earth Run 8A Continuity Correction

on:
  push:
    branches:
      - agent/h-earth-run8a-dimensional-reconciliation-001

permissions:
  contents: write

jobs:
  correct-run8a-continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/h-earth-run8a-dimensional-reconciliation-001
          fetch-depth: 0

      - name: Correct successor former-boundary continuity evaluation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('h-earth-3d/control-plane/run-8/h-earth.run8a.dimensional-reconciliation.js')
          text = path.read_text(encoding='utf-8')
          old_derivative = """const STEP = 0.5;
const baselineBoundaryDerivativeZ = (x) =>
  (sampleHEarthTerrainElevation(x, FORMER_BOUNDARY_Z + STEP) -
    sampleHEarthTerrainElevation(x, FORMER_BOUNDARY_Z)) / STEP;"""
          new_derivative = """const STEP = 0.5;
const BOUNDARY_DERIVATIVE_EPSILON = 0.01;
const baselineBoundaryDerivativeZ = (x) =>
  (sampleHEarthTerrainElevation(
    x,
    FORMER_BOUNDARY_Z + BOUNDARY_DERIVATIVE_EPSILON
  ) - sampleHEarthTerrainElevation(x, FORMER_BOUNDARY_Z)) /
  BOUNDARY_DERIVATIVE_EPSILON;"""
          old_height = "heightDiscontinuity: Math.abs(north - south),"
          new_height = "heightDiscontinuity: Math.abs((north + south) / 2 - center),"
          if old_derivative not in text:
            raise SystemExit('RUN8A_DERIVATIVE_ANCHOR_NOT_FOUND')
          if old_height not in text:
            raise SystemExit('RUN8A_HEIGHT_CONTINUITY_ANCHOR_NOT_FOUND')
          text = text.replace(old_derivative, new_derivative, 1)
          text = text.replace(old_height, new_height, 1)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/h-earth-run8a-continuity-correction.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add h-earth-3d/control-plane/run-8/h-earth.run8a.dimensional-reconciliation.js
          git add -u .github/workflows/h-earth-run8a-continuity-correction.yml
          git commit -m 'Correct Run 8A former-boundary continuity law'
          git push origin HEAD:agent/h-earth-run8a-dimensional-reconciliation-001
