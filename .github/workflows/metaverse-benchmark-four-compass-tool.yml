name: Metaverse Four-Compass Benchmark Tool

on:
  pull_request:
    branches:
      - main
    paths:
      - "laws/**"
      - "verification/benchmark-tools/four-compass-benchmark-v1/four-compass-benchmark.config.mjs"
      - "verification/benchmark-tools/four-compass-benchmark-v1/four-compass-browser-baseline.mjs"
      - "verification/benchmark-tools/four-compass-benchmark-v1/four-compass-smoke-capture.mjs"
      - ".github/workflows/metaverse-benchmark-four-compass-tool.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metaverse-four-compass-tool-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXECUTION_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
  EXECUTION_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  baseline:
    name: Execute separated Compass and auxiliary baselines
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact execution head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXECUTION_COMMIT }}

      - name: Verify exact checkout identity
        run: test "$(git rev-parse HEAD)" = "$EXECUTION_COMMIT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install pinned browser driver
        run: npm install --no-save --no-package-lock puppeteer-core@24.15.0

      - name: Validate source syntax
        run: |
          node --check verification/benchmark-tools/four-compass-benchmark-v1/four-compass-benchmark.config.mjs
          node --check verification/benchmark-tools/four-compass-benchmark-v1/four-compass-browser-baseline.mjs

      - name: Execute separated browser baselines
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node verification/benchmark-tools/four-compass-benchmark-v1/four-compass-browser-baseline.mjs

      - name: Validate lane separation and evidence
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const compass = JSON.parse(fs.readFileSync('four-compass-benchmark-tool-baseline.json', 'utf8'));
          const auxiliary = JSON.parse(fs.readFileSync('website-home-receiver-control-baseline.json', 'utf8'));
          const failures = [];
          if (compass.lane !== 'FOUR_COMPASS_CORPUS') failures.push('compass_lane');
          if (auxiliary.lane !== 'AUXILIARY_CONTROL') failures.push('auxiliary_lane');
          if (compass.assertions.memberCountExact !== true || compass.summaries.length !== 4) failures.push('compass_count');
          if (auxiliary.assertions.memberCountExact !== true || auxiliary.summaries.length !== 1) failures.push('auxiliary_count');
          if (!compass.assertions.prohibitedAuthoritiesExcluded) failures.push('home_in_compass');
          if (!auxiliary.assertions.prohibitedAuthoritiesExcluded) failures.push('compass_in_home');
          if (compass.status !== 'PASS_BOUNDED_LANE_BASELINE') failures.push('compass_status');
          if (auxiliary.status !== 'PASS_BOUNDED_LANE_BASELINE') failures.push('auxiliary_status');
          if (failures.length) throw new Error(`FOUR_COMPASS_TOOL_VALIDATION_FAILED:${failures.join(',')}`);
          console.log(JSON.stringify({ compassDigest: compass.laneBaselineDigest, auxiliaryDigest: auxiliary.laneBaselineDigest }));
          NODE

      - name: Upload separated evidence
        uses: actions/upload-artifact@v4
        with:
          name: metaverse-benchmark-four-compass-tool-evidence
          path: |
            four-compass-benchmark-tool-baseline.json
            website-home-receiver-control-baseline.json
            four-compass-benchmark-tool-screenshots/
            website-home-receiver-control-screenshots/
          if-no-files-found: error
          retention-days: 30

      - name: Write checkpoint summary
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const compass = JSON.parse(fs.readFileSync('four-compass-benchmark-tool-baseline.json', 'utf8'));
          const auxiliary = JSON.parse(fs.readFileSync('website-home-receiver-control-baseline.json', 'utf8'));
          console.log('# Four-Compass Benchmark Tool');
          console.log('');
          console.log(`- Compass lane: **${compass.status}**`);
          console.log(`- Compass digest: \`${compass.laneBaselineDigest}\``);
          console.log(`- Auxiliary lane: **${auxiliary.status}**`);
          console.log(`- Auxiliary digest: \`${auxiliary.laneBaselineDigest}\``);
          console.log('- Cross-lane aggregate: `NONE`');
          NODE
