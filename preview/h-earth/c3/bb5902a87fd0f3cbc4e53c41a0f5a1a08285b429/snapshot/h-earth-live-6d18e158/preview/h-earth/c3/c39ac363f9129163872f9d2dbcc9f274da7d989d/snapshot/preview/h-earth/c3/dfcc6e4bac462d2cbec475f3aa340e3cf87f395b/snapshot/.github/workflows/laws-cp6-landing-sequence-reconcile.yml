name: Laws CP6 landing sequence reconcile

on:
  push:
    branches:
      - agent/laws-cp6-context-authority-records-001
    paths:
      - .github/workflows/laws-cp6-landing-sequence-reconcile.yml
      - scripts/laws_cp6_landing_sequence_reconcile.py

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/laws-cp6-context-authority-records-001
          fetch-depth: 0
      - run: python3 scripts/laws_cp6_landing_sequence_reconcile.py
      - name: Verify one-file product scope
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "laws/index.html"
          git diff -- laws/index.html | grep 'cp6-work-behind-laws'
          git diff -- laws/index.html | grep 'Laws supporting orientation'
      - name: Commit corrected landing order
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add laws/index.html
          git commit -m 'Reconcile Laws CP6 landing contextual sequence'
          git push origin HEAD:agent/laws-cp6-context-authority-records-001
