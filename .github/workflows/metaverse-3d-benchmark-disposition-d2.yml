name: Metaverse 3D Benchmark Disposition D2 Canonical Fact Normalization

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/metaverse-3d-benchmark-disposition-d2.yml"
      - "tools/metaverse-3d-benchmark-disposition-d2-*"
      - "tools/metaverse-3d-benchmark-disposition-d1-*"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: metaverse-3d-benchmark-disposition-d2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canonical-evidence-fact-normalization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      D2_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      D1_PARENT_SHA: 15ae6cfdd2b6929c06c4fac8905d5b201548b5a0
      D1_ARTIFACT_ID: "8620403379"
      D1_ARTIFACT_SIZE: "10733"
      D1_ARTIFACT_SHA256: 4ea337358b5d9f9b1c5a3b11e492fe1930f8563b00df796266d5032bf2769b71
      D1_ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/metaverse-3d-benchmark-disposition-d1-input
      D2_ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/metaverse-3d-benchmark-disposition-d2

    steps:
      - name: Checkout exact D2 occurrence
        uses: actions/checkout@v4
        with:
          ref: ${{ env.D2_HEAD_SHA }}
          fetch-depth: 0

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact D2 head and D1 ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$D2_HEAD_SHA"
          git merge-base --is-ancestor "$D1_PARENT_SHA" HEAD
          test "$(git hash-object tools/metaverse-3d-benchmark-disposition-d1-contract.json)" = "b83228120ccea9241ad20e5d224c091f4a548f1f"
          test "$(git hash-object tools/metaverse-3d-benchmark-disposition-d1-intake.mjs)" = "13fb6c992dc9d89b337766a5c5a91f98ca281c44"
          test "$(git hash-object tools/metaverse-3d-benchmark-disposition-d1-controls.mjs)" = "e64d0205922c43f1a47fc16e957073660b5082fb"
          test "$(git hash-object .github/workflows/metaverse-3d-benchmark-disposition-d1.yml)" = "b1f02c9d1ab7db34459965dd3e8b4e5ad4c82ec7"

      - name: Verify exact four-path D2 scope
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git diff --name-only "$D1_PARENT_SHA"..HEAD | sort)"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/metaverse-3d-benchmark-disposition-d2.yml' \
            'tools/metaverse-3d-benchmark-disposition-d2-contract.json' \
            'tools/metaverse-3d-benchmark-disposition-d2-controls.mjs' \
            'tools/metaverse-3d-benchmark-disposition-d2-normalize.mjs' | sort)"
          test "$ACTUAL" = "$EXPECTED"
          test "$(git diff --name-only "$D1_PARENT_SHA"..HEAD | wc -l)" -eq 4

      - name: Download and verify exact closed D1 package
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$D1_ARTIFACT_ROOT"
          mkdir -p "$D1_ARTIFACT_ROOT"
          curl --fail --location --retry 3 \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$D1_ARTIFACT_ID/zip" \
            --output /tmp/metaverse-3d-benchmark-disposition-d1.zip
          test "$(stat -c '%s' /tmp/metaverse-3d-benchmark-disposition-d1.zip)" = "$D1_ARTIFACT_SIZE"
          echo "$D1_ARTIFACT_SHA256  /tmp/metaverse-3d-benchmark-disposition-d1.zip" | sha256sum --check --strict
          unzip -q /tmp/metaverse-3d-benchmark-disposition-d1.zip -d "$D1_ARTIFACT_ROOT"
          test "$(find "$D1_ARTIFACT_ROOT" -maxdepth 1 -type f | wc -l)" -eq 5
          test -f "$D1_ARTIFACT_ROOT/source-manifest.json"
          test -f "$D1_ARTIFACT_ROOT/native-evidence-inventory.json"
          test -f "$D1_ARTIFACT_ROOT/intake.receipt.json"
          test -f "$D1_ARTIFACT_ROOT/aggregate.receipt.json"
          test -f "$D1_ARTIFACT_ROOT/execution.log"

      - name: Validate D2 source syntax
        run: |
          node --check tools/metaverse-3d-benchmark-disposition-d2-normalize.mjs
          node --check tools/metaverse-3d-benchmark-disposition-d2-controls.mjs
          node -e "JSON.parse(require('fs').readFileSync('tools/metaverse-3d-benchmark-disposition-d2-contract.json','utf8'))"

      - name: Execute D2 normalization controls
        run: |
          rm -rf "$D2_ARTIFACT_ROOT"
          mkdir -p "$D2_ARTIFACT_ROOT"
          node tools/metaverse-3d-benchmark-disposition-d2-controls.mjs \
            > "$D2_ARTIFACT_ROOT/execution.log"

      - name: Verify deterministic D2 receipts and stopping boundary
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile } from 'node:fs/promises';
          const stable = value => Array.isArray(value)
            ? value.map(stable)
            : value && typeof value === 'object'
              ? Object.fromEntries(Object.keys(value).sort().map(key => [key.normalize('NFC'), stable(value[key])]))
              : typeof value === 'string'
                ? value.normalize('NFC')
                : value;
          const digest = value => createHash('sha256')
            .update(JSON.stringify(stable(value)))
            .digest('hex');
          const root = process.env.D2_ARTIFACT_ROOT;
          const manifest = JSON.parse(await readFile(`${root}/canonical-fact-manifest.json`, 'utf8'));
          const coexistence = JSON.parse(await readFile(`${root}/fact-coexistence-index.json`, 'utf8'));
          const normalization = JSON.parse(await readFile(`${root}/normalization.receipt.json`, 'utf8'));
          const aggregate = JSON.parse(await readFile(`${root}/aggregate.receipt.json`, 'utf8'));

          if (manifest.canonicalFactCount !== 47 ||
              manifest.factManifestSha256 !== 'c88e3afa3327eefe6aca7fff544cd4ebe922c63ac47d53a2f5c842b1d718ddb4' ||
              digest(manifest.records) !== manifest.factManifestSha256) {
            throw new Error('D2_CANONICAL_FACT_MANIFEST_VERIFICATION_FAILED');
          }
          if (coexistence.relationCount !== 3 ||
              coexistence.coexistenceIndexSha256 !== '3ee791df987a6894b923e5d137f66b86abfcef89b0467b230288b7ab4b6c52e6' ||
              digest(coexistence.relations) !== coexistence.coexistenceIndexSha256) {
            throw new Error('D2_COEXISTENCE_INDEX_VERIFICATION_FAILED');
          }
          const { deterministicReceiptSha256: normalizationDigest, ...normalizationBody } = normalization;
          if (normalization.status !== 'PASS' ||
              normalizationDigest !== '0387c1bf54b7568ff58d0bddbef8150c61f57bcd153c3da41df4f20981e2c6b3' ||
              digest(normalizationBody) !== normalizationDigest) {
            throw new Error('D2_NORMALIZATION_RECEIPT_VERIFICATION_FAILED');
          }
          const { deterministicReceiptSha256: aggregateDigest, ...aggregateBody } = aggregate;
          if (aggregate.status !== 'PASS' ||
              aggregate.controlCount !== 28 ||
              aggregate.passedControlCount !== 28 ||
              aggregateDigest !== 'a314560be0afc58f5facd669b5c317994346e75c9a7ed8552b427afc361e5c79' ||
              digest(aggregateBody) !== aggregateDigest) {
            throw new Error('D2_AGGREGATE_RECEIPT_VERIFICATION_FAILED');
          }
          const claims = normalization.claims ?? {};
          if (claims.canonicalEvidenceFactNormalizationEstablished !== true ||
              claims.all21SourceRecordsAccountedFor !== true ||
              claims.all7NativeEvidenceRecordsAccountedFor !== true ||
              claims.currentPrototypeBrowserPassEstablished !== false ||
              claims.projectAwarenessV1HistoricalOnly !== true ||
              claims.crossLaneEvidenceTransferPerformed !== false ||
              claims.factWinnerSelectionPerformed !== false ||
              claims.contradictionResolutionPerformed !== false ||
              claims.dimensionClassificationPerformed !== false ||
              claims.evidenceWeightingPerformed !== false ||
              claims.dispositionCompilationPerformed !== false ||
              claims.productFilesChanged !== 0 ||
              claims.mergePerformed !== false ||
              claims.userAcceptanceGranted !== false) {
            throw new Error('D2_STOPPING_BOUNDARY_VIOLATED');
          }
          NODE

      - name: Upload deterministic D2 package
        uses: actions/upload-artifact@v4
        with:
          name: metaverse-3d-benchmark-disposition-d2-${{ env.D2_HEAD_SHA }}
          path: artifacts/metaverse-3d-benchmark-disposition-d2/**
          if-no-files-found: error
          retention-days: 30
