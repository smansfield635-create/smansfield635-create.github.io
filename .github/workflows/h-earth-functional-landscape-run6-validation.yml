name: H-Earth Functional Landscape Run 6 Validation

on:
  push:
    branches:
      - agent/h-earth-functional-landscape-run6-001
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-run6:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run checkpoint 6A contract
        run: |
          node --experimental-default-type=module --input-type=module <<'NODE'
          import {
            evaluateHEarthFunctionalLandscapeRun6Program
          } from './h-earth-3d/control-plane/run-6/h-earth.functional-landscape-run-6.program.js';
          const result = evaluateHEarthFunctionalLandscapeRun6Program();
          console.log(JSON.stringify(result, null, 2));
          if (!result.eligible) process.exit(1);
          NODE

      - name: Run checkpoint 6B
        run: node --experimental-default-type=module h-earth-3d/validation/h-earth.functional-landscape.run6b.harness.mjs

      - name: Run checkpoint 6C with captured diagnostics
        id: run6c
        continue-on-error: true
        run: |
          set +e
          node --experimental-default-type=module h-earth-3d/validation/h-earth.functional-landscape.run6c.harness.mjs > run6c-diagnostic.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat run6c-diagnostic.log
          exit $code

      - name: Upload checkpoint 6C diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-run6c-diagnostic
          path: run6c-diagnostic.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce checkpoint 6C pass
        if: steps.run6c.outcome == 'failure'
        run: exit 1

      - name: Run checkpoint 6D
        run: node --experimental-default-type=module h-earth-3d/validation/h-earth.functional-landscape.run6d.harness.mjs

      - name: Run checkpoint 6E
        run: node --experimental-default-type=module h-earth-3d/validation/h-earth.functional-landscape.run6e.harness.mjs
