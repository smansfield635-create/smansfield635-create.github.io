name: H-Earth Run 8E R3F2 Cloudflare Auth Observation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/h-earth-run8e-r3f2-cloudflare-auth-observation.yml'

permissions:
  contents: read
  actions: read

jobs:
  observe-cloudflare-failure:
    runs-on: ubuntu-latest
    env:
      TARGET_JOB: '90162968752'
    steps:
      - name: Fetch exact Cloudflare publication failure lines
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r3f2-cloudflare-observation
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/jobs/$TARGET_JOB/logs" \
            -o /tmp/r3f2-cloudflare-observation/job.log
          grep -aiE 'cloudflare|wrangler|api token|account|authentication|unauthorized|forbidden|error|missing' \
            /tmp/r3f2-cloudflare-observation/job.log \
            | tail -n 160 \
            > /tmp/r3f2-cloudflare-observation/failure-lines.txt || true
          tail -n 220 /tmp/r3f2-cloudflare-observation/job.log \
            > /tmp/r3f2-cloudflare-observation/job-tail.txt
          test -s /tmp/r3f2-cloudflare-observation/failure-lines.txt
          cat /tmp/r3f2-cloudflare-observation/failure-lines.txt

      - name: Upload Cloudflare auth observation
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-run8e-r3f2-cloudflare-auth-observation
          path: |
            /tmp/r3f2-cloudflare-observation/failure-lines.txt
            /tmp/r3f2-cloudflare-observation/job-tail.txt
          if-no-files-found: error
          retention-days: 30
