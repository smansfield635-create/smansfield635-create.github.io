name: Capability Carousel Stability Audit v1
on:
  pull_request:
    paths:
      - '.github/workflows/capability-carousel-stability-audit-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Audit live capability orbit stability
        run: |
          cat > .capability-audit.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const sizes=[
            {name:'phone',w:390,h:844},
            {name:'tablet',w:960,h:1536},
            {name:'desktop',w:1440,h:1000}
          ];
          const reports=[];
          for(const s of sizes){
            const page=await browser.newPage({viewport:{width:s.w,height:s.h}});
            await page.goto('https://diamondgatebridge.com/?capability-audit='+Date.now(),{waitUntil:'networkidle',timeout:120000});
            await page.waitForTimeout(1200);
            const snapshot=()=>page.evaluate(()=>{
              const all=[...document.querySelectorAll('button,a,article,section,div')];
              const matches=all.filter(el=>/Understand|Coherence Diagnostic|Awards|Recognition|Talk to the House|House|Explore/.test((el.innerText||'').trim()));
              const candidates=[...new Set(matches.flatMap(el=>{
                let n=el; const out=[]; for(let i=0;i<4&&n;i++,n=n.parentElement){if(n.matches?.('button,[role="tab"],[data-capability],[data-capability-orbit],.capability,.compass-monument'))out.push(n)} return out;
              }))];
              const cards=candidates.filter(el=>el.matches('button,[role="tab"],[data-capability],.capability,.compass-monument'));
              const orbit=document.querySelector('[data-capability-orbit],.capability-orbit,.compass-monuments') || cards[0]?.parentElement;
              const rect=o=>{const r=o.getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom}};
              const style=o=>{const c=getComputedStyle(o);return {opacity:+c.opacity,transform:c.transform,transition:c.transitionDuration,z:c.zIndex,position:c.position,display:c.display,visibility:c.visibility}};
              const items=cards.map((el,i)=>({i,text:(el.innerText||'').trim().replace(/\s+/g,' ').slice(0,120),rect:rect(el),style:style(el),selected:el.getAttribute('aria-selected'),pressed:el.getAttribute('aria-pressed'),cls:el.className}));
              const icons=cards.map((el,i)=>{const icon=el.querySelector('.cap-icon,img,svg,[aria-hidden="true"]');if(!icon)return {i,missing:true}; const r=rect(icon); const cs=getComputedStyle(icon); return {i,missing:false,tag:icon.tagName,text:(icon.textContent||'').trim(),rect:r,opacity:+cs.opacity,filter:cs.filter,transform:cs.transform};});
              const overlap=[];for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){const a=items[i].rect,b=items[j].rect;const x=Math.max(0,Math.min(a.right,b.right)-Math.max(a.x,b.x));const y=Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.y,b.y));const area=x*y;const denom=Math.max(1,Math.min(a.w*a.h,b.w*b.h));if(area/denom>.12)overlap.push({a:i,b:j,ratio:+(area/denom).toFixed(3)});}
              return {orbit:orbit?{rect:rect(orbit),style:style(orbit),cls:orbit.className}:null,items,icons,overlap,docOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};
            });
            const base=await snapshot();
            if(base.items.length<3)throw new Error(s.name+' CAPABILITY_DISCOVERY_FAILED '+JSON.stringify(base));
            const sampleRects=[];
            for(const t of [0,120,300,700,1300]){await page.waitForTimeout(t? t-(sampleRects.at(-1)?.t||0):0);const snap=await snapshot();sampleRects.push({t,items:snap.items.map(x=>({text:x.text,rect:x.rect,selected:x.selected,cls:x.cls}))});}
            const drift=[];
            for(let k=1;k<sampleRects.length;k++){
              const p=sampleRects[k-1],q=sampleRects[k];
              p.items.forEach((a,i)=>{const b=q.items[i]; if(!b)return; const d=Math.hypot(a.rect.x-b.rect.x,a.rect.y-b.rect.y); if(d>1.5)drift.push({from:p.t,to:q.t,i,d:+d.toFixed(2),a:a.text,b:b.text});});
            }
            const orbitLoc=page.locator('[data-capability-orbit],.capability-orbit,.compass-monuments').first();
            if(await orbitLoc.count()){
              const box=await orbitLoc.boundingBox();
              if(box){await page.mouse.move(box.x+box.width*.72,box.y+box.height*.55);await page.mouse.down();await page.mouse.move(box.x+box.width*.25,box.y+box.height*.55,{steps:8});await page.mouse.up();await page.waitForTimeout(900);}
            }
            const afterDrag=await snapshot();
            const active=afterDrag.items.filter(x=>x.selected==='true'||/is-active|selected/.test(String(x.cls)));
            const target=page.locator('button,[role="tab"],[data-capability],.capability,.compass-monument').filter({hasText:/Awards|Recognition|Explore/}).first();
            let afterClick=null;
            if(await target.count()){await target.click({timeout:10000}).catch(()=>{});await page.waitForTimeout(700);afterClick=await snapshot();}
            reports.push({size:s.name,base,drift,afterDrag,afterClick,activeCount:active.length});
            await page.close();
          }
          console.log('CAPABILITY_AUDIT',JSON.stringify(reports));
          const weaknesses=[];
          for(const r of reports){
            if(r.base.docOverflow>2)weaknesses.push([r.size,'horizontal-overflow',r.base.docOverflow]);
            if(r.base.overlap.length)weaknesses.push([r.size,'card-overlap',r.base.overlap]);
            if(r.drift.length)weaknesses.push([r.size,'idle-drift',r.drift]);
            const iconSizes=r.base.icons.filter(x=>!x.missing).map(x=>Math.min(x.rect.w,x.rect.h));
            if(iconSizes.length>=3 && Math.max(...iconSizes)-Math.min(...iconSizes)>18)weaknesses.push([r.size,'icon-size-imbalance',iconSizes]);
            if(r.activeCount>1)weaknesses.push([r.size,'multiple-active',r.activeCount]);
          }
          console.log('WEAKNESSES',JSON.stringify(weaknesses));
          await browser.close();
          NODE
          node ./.capability-audit.mjs
