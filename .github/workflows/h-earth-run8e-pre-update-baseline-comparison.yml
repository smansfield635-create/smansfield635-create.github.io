name: H-Earth Run 8E Baseline Workflow Reconciliation

on:
  push:
    branches:
      - agent/h-earth-run8e-public-integration-001
  pull_request:
    branches:
      - agent/h-earth-run8d-grounded-vegetation-001
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile-baseline-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Check out Run 8E source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Restore replay-stable comparison workflow and registry scope
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow_path = Path('.github/workflows/h-earth-run8e-pre-update-baseline-comparison.yml')
          registry_path = Path('h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.run8e-integration-engineering-scope.js')

          original = subprocess.check_output([
              'git', 'show',
              '59bf8b1b3dadef23c2636a1201f62c29f6a12f4d:.github/workflows/h-earth-run8e-pre-update-baseline-comparison.yml'
          ], text=True)

          original = original.replace(
              '      RUN8E_CANDIDATE_HEAD: $' + '{{ github.event.pull_request.head.sha || github.sha }}\n',
              ''
          )

          marker = """            const signature = await canvasSignature(page);\n            const shell = await page.evaluate(() => ({\n"""
          replacement = """            const stableReceipt = mode === 'RUN_7I_BASELINE'\n              ? {\n                  receiptType: receipt.receiptType,\n                  eligible: receipt.eligible,\n                  status: receipt.status,\n                  semanticAddressId: receipt.semanticAddressId,\n                  chunkId: receipt.chunkId,\n                  surfaceClass: receipt.surfaceClass,\n                  waterClass: receipt.waterClass,\n                  biomeClass: receipt.biomeClass,\n                  traversalClass: receipt.traversalClass,\n                  lifecycleState: receipt.lifecycleState,\n                  populationInstanceCount: receipt.populationInstanceCount,\n                  populationMarkerCount: receipt.populationMarkerCount,\n                  atmosphereVisible: receipt.atmosphereVisible,\n                  waterPresentationApplied: receipt.waterPresentationApplied,\n                  surfacePresentationApplied: receipt.surfacePresentationApplied,\n                  skyAlphaClosed: receipt.skyAlphaClosed,\n                  grayFallbackPixelCount: receipt.grayFallbackPixelCount,\n                  authorityCollapse: receipt.authorityCollapse,\n                  rendererAuthorityReplaced: receipt.rendererAuthorityReplaced,\n                  cameraAuthorityReplaced: receipt.cameraAuthorityReplaced,\n                  navigationAuthorityReplaced: receipt.navigationAuthorityReplaced,\n                  issues: receipt.issues\n                }\n              : {\n                  receiptType: receipt.receiptType,\n                  eligible: receipt.eligible,\n                  status: receipt.status,\n                  cameraReconciledToSuccessorTerrain:\n                    receipt.cameraReconciledToSuccessorTerrain,\n                  admittedPrimitiveCount: receipt.admittedPrimitiveCount,\n                  terrainPrimitiveCount: receipt.terrainPrimitiveCount,\n                  shorelinePrimitiveCount: receipt.shorelinePrimitiveCount,\n                  vegetationPrimitiveCount: receipt.vegetationPrimitiveCount,\n                  projectedTriangleCount: receipt.projectedTriangleCount,\n                  rejectedFragmentCount: receipt.rejectedFragmentCount,\n                  writtenPixelCount: receipt.writtenPixelCount,\n                  skyPixelCount: receipt.skyPixelCount,\n                  sunPixelCount: receipt.sunPixelCount,\n                  terrainVisiblePixelCount: receipt.terrainVisiblePixelCount,\n                  vegetationVisiblePixelCount: receipt.vegetationVisiblePixelCount,\n                  vegetationTerrainDepthInteractionCount:\n                    receipt.vegetationTerrainDepthInteractionCount,\n                  actualTerrainVegetationDepthInteractionExecuted:\n                    receipt.actualTerrainVegetationDepthInteractionExecuted,\n                  sameWorldToCameraTransformForTerrainAndVegetation:\n                    receipt.sameWorldToCameraTransformForTerrainAndVegetation,\n                  singlePhysicalDepthDomainExecuted:\n                    receipt.singlePhysicalDepthDomainExecuted,\n                  singleSkyAuthorityMaterialized:\n                    receipt.singleSkyAuthorityMaterialized,\n                  sunDiscIntegrationActive: receipt.sunDiscIntegrationActive,\n                  sunDiscMaterialized: receipt.sunDiscMaterialized,\n                  alphaClosed: receipt.alphaClosed,\n                  publicRouteBranchExecution: receipt.publicRouteBranchExecution,\n                  physicalSamsungExecution: receipt.physicalSamsungExecution,\n                  deployment: receipt.deployment,\n                  liveIdentityProof: receipt.liveIdentityProof,\n                  run8EPassClosed: receipt.run8EPassClosed,\n                  issues: receipt.issues\n                };\n            const signature = await canvasSignature(page);\n            const shell = await page.evaluate(() => ({\n"""
          if marker not in original:
              raise SystemExit('BASELINE_WORKFLOW_SIGNATURE_MARKER_NOT_FOUND')
          original = original.replace(marker, replacement)
          original = original.replace(
              '            assert.equal(receipt?.eligible, true);\n',
              '            assert.equal(stableReceipt?.eligible, true);\n'
          )
          original = original.replace(
              '              receipt,\n              signature,\n',
              '              receipt: stableReceipt,\n              signature,\n'
          )
          original = original.replace(
              '            candidateHead: process.env.RUN8E_CANDIDATE_HEAD,\n',
              "            candidateHeadBinding: 'WORKFLOW_RUN_HEAD_METADATA',\n"
          )
          workflow_path.write_text(original)

          registry = registry_path.read_text()
          registry = registry.replace(
              "  '/h-earth-3d/validation/h-earth.run8e.public-route.receipt.json'\n]);",
              "  '/h-earth-3d/validation/h-earth.run8e.public-route.receipt.json',\n  '/.github/workflows/h-earth-run8e-pre-update-baseline-comparison.yml',\n  '/h-earth-3d/validation/h-earth.run8e.pre-update-baseline-comparison.receipt.json'\n]);"
          )
          registry = registry.replace(
              "    'DETERMINISTIC_BRANCH_NATIVE_ENGINEERING_EXECUTION'\n",
              "    'DETERMINISTIC_BRANCH_NATIVE_ENGINEERING_EXECUTION',\n    'RUN_7I_TO_RUN_8E_PRE_UPDATE_BASELINE_COMPARISON'\n"
          )
          registry = registry.replace(
              "    'PUBLIC_ROUTE_BRANCH_EXECUTION_IS_A_SEPARATE_RUN_8E_OCCURRENCE',\n",
              "    'PUBLIC_ROUTE_BRANCH_EXECUTION_IS_A_SEPARATE_RUN_8E_OCCURRENCE',\n    'PRE_UPDATE_BASELINE_COMPARISON_DOES_NOT_ASSERT_VISUAL_QUALITY_SUPERIORITY',\n"
          )
          registry = registry.replace(
              "and public-route branch execution paths.'",
              "public-route branch execution, and pre-update Run 7I comparison paths.'"
          )
          registry = registry.replace(
              "    'RUN_8E_BRANCH_NATIVE_ENGINEERING_EXECUTION_PASS'\n",
              "    'RUN_8E_BRANCH_NATIVE_ENGINEERING_EXECUTION_PASS',\n    'RUN_8E_PRE_UPDATE_BASELINE_COMPARISON_PASS'\n"
          )
          registry = registry.replace(
              "    'STOP_IF_ENGINEERING_RECEIPT_OVERCLAIMS_ROUTE_SAMSUNG_DEPLOYMENT_OR_LIVE_PROOF'\n",
              "    'STOP_IF_ENGINEERING_RECEIPT_OVERCLAIMS_ROUTE_SAMSUNG_DEPLOYMENT_OR_LIVE_PROOF',\n    'STOP_IF_BASELINE_COMPARISON_CLAIMS_VISUAL_QUALITY_SUPERIORITY'\n"
          )
          registry_path.write_text(registry)
          PY

          grep -q "candidateHeadBinding: 'WORKFLOW_RUN_HEAD_METADATA'" \
            .github/workflows/h-earth-run8e-pre-update-baseline-comparison.yml
          grep -q 'RUN_7I_TO_RUN_8E_PRE_UPDATE_BASELINE_COMPARISON' \
            h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.run8e-integration-engineering-scope.js
          grep -q 'h-earth.run8e.pre-update-baseline-comparison.receipt.json' \
            h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.run8e-integration-engineering-scope.js

      - name: Commit reconciled workflow and registry scope
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/h-earth-run8e-pre-update-baseline-comparison.yml \
            h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.run8e-integration-engineering-scope.js
          git diff --cached --quiet && exit 0
          git commit -m 'Reconcile Run 8E baseline comparison workflow'
          git push origin "HEAD:${TARGET_BRANCH}"
