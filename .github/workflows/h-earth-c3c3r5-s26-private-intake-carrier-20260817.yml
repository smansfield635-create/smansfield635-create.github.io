name: H-Earth C3C3R5 S26 Private Mutation Routing Carrier

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: read

jobs:
  route:
    if: github.event.pull_request.head.ref == 'handoff/h-earth-c3c3r5-s26-intake-carrier-20260817'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Mint private read token
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.PRIVATE_EXECUTION_APP_ID }}
          private-key: ${{ secrets.PRIVATE_EXECUTION_APP_PRIVATE_KEY }}
          owner: smansfield635-create
          repositories: geodiametrics1
          permission-contents: read
      - name: Check out exact private head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: smansfield635-create/geodiametrics1
          ref: 4c19e9ba783767f9324ab10df8a8541479f26c86
          token: ${{ steps.token.outputs.token }}
          path: private-control-plane
          fetch-depth: 1
          persist-credentials: false
      - name: Run canonical mutation router
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/router"
          mkdir -p "$work"
          cd "$GITHUB_WORKSPACE/private-control-plane"
          test "$(git rev-parse HEAD^{commit})" = '4c19e9ba783767f9324ab10df8a8541479f26c86'
          cat > "$work/availability.json" <<'JSON'
          {"schema":"REPOSITORY_AI_INTAKE_EXECUTION_AVAILABILITY_RECEIPT_v1","result":"HOST_CAPABILITIES_OBSERVED","evidenceSource":"GEN305_ALREADY_ADMITTED_ROUTING_ONLY","localAuthenticatedExecutionAvailable":false,"localNodeRuntimeAvailable":true,"connectedGithubReadAvailable":true,"connectedGithubShaGuardedContentsWriteAvailable":false,"githubActionsExecutionAvailable":false}
          JSON
          cat > "$work/paths.txt" <<'PATHS'
          h-earth-3d/docs/H_EARTH_C3C3R5_S26_PERFORMANCE_WORLD_ENVELOPE_SUCCESSOR_CONTRACT_v1.md
          h-earth-3d/validation/h-earth.c3c3r5.s26-performance-world-envelope.browser.harness.mjs
          showroom/globe/h-earth/render/functional-landscape-frame.js
          showroom/globe/h-earth/render/geometry-distant-context.js
          showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.js
          showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js
          showroom/globe/h-earth/render/run8e-successor-environment.js
          PATHS
          node tools/repository-ai-entry-router.mjs --paths-file "$work/paths.txt" --mutation-intent --intake-availability-receipt "$work/availability.json" --task H_EARTH_C3C3R5_S26_PERFORMANCE_WORLD_ENVELOPE_SUCCESSOR --output "$work/router.json"
          cat "$work/router.json"
          node --input-type=module - "$work/router.json" <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.disposition!=='PASS') throw new Error(`ROUTER_NONPASS:${r.disposition}`);
          if(!Array.isArray(r.routes)||r.routes.length!==7) throw new Error('ROUTE_COUNT_MISMATCH');
          if(r.routes.some(x=>x.projectId!=='H_EARTH'||x.disposition!=='PASS')) throw new Error('ROUTE_NOT_H_EARTH_PASS');
          NODE
