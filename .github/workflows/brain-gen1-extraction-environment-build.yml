name: Brain Gen1 Extraction Environment Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/compass/brain-anatomical-basis/extraction-environment/Dockerfile'
      - '.github/workflows/brain-gen1-extraction-environment-build.yml'

permissions:
  contents: read
  packages: write

env:
  FREESURFER_IMAGE: freesurfer/freesurfer:7.4.1@sha256:10b6468cbd9fcd2db3708f4651d59ad75d4da849a2c5d8bb6dba217f08b8c46b
  FREESURFER_QUALIFIED_RUN: '32675716427'
  FREESURFER_VERSION_RECEIPT: 'freesurfer-linux-centos8_x86_64-7.4.1-20230613-7eb8460'
  FREESURFER_RECON_ALL: '/usr/local/freesurfer/bin/recon-all'
  FREESURFER_SEGMENT_BS: '/usr/local/freesurfer/bin/segmentBS.sh'

jobs:
  build-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify frozen FreeSurfer dependency receipt
        run: |
          set -euo pipefail
          test "$FREESURFER_IMAGE" = 'freesurfer/freesurfer:7.4.1@sha256:10b6468cbd9fcd2db3708f4651d59ad75d4da849a2c5d8bb6dba217f08b8c46b'
          test "$FREESURFER_QUALIFIED_RUN" = '32675716427'
          test "$FREESURFER_VERSION_RECEIPT" = 'freesurfer-linux-centos8_x86_64-7.4.1-20230613-7eb8460'
          test "$FREESURFER_RECON_ALL" = '/usr/local/freesurfer/bin/recon-all'
          test "$FREESURFER_SEGMENT_BS" = '/usr/local/freesurfer/bin/segmentBS.sh'
          printf 'FREESURFER_DEPENDENCY_RECEIPT=PASS\n'
      - name: Build immutable VTK stage
        run: |
          set -euo pipefail
          docker build --pull=false -t brain-gen1-vtk:${GITHUB_SHA} research/compass/brain-anatomical-basis/extraction-environment
      - name: Probe immutable VTK stage
        run: |
          set -euo pipefail
          IMAGE=brain-gen1-vtk:${GITHUB_SHA}
          docker run --rm "$IMAGE" python - <<'PY'
          import vtk
          assert vtk.vtkVersion.GetVTKVersion() == '9.3.0', vtk.vtkVersion.GetVTKVersion()
          assert hasattr(vtk, 'vtkFlyingEdges3D')
          print('VTK_VERSION=9.3.0')
          print('VTK_FLYING_EDGES_3D=PASS')
          PY
      - name: Push VTK stage and bind two-stage identities on main dispatch only
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/brain-gen1-vtk
        run: |
          set -euo pipefail
          LOWER_IMAGE=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker tag brain-gen1-vtk:${GITHUB_SHA} "$LOWER_IMAGE:${GITHUB_SHA}"
          docker push "$LOWER_IMAGE:${GITHUB_SHA}"
          docker pull "$LOWER_IMAGE:${GITHUB_SHA}"
          VTK_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$LOWER_IMAGE:${GITHUB_SHA}")
          {
            printf 'FREESURFER=%s\n' "$FREESURFER_IMAGE"
            printf 'FREESURFER_QUALIFIED_RUN=%s\n' "$FREESURFER_QUALIFIED_RUN"
            printf 'VTK=%s\n' "$VTK_DIGEST"
          } | tee extraction-chain-digests.txt
          test -n "$VTK_DIGEST"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        with:
          name: brain-gen1-extraction-chain-${{ github.run_id }}
          path: extraction-chain-digests.txt
          if-no-files-found: error
