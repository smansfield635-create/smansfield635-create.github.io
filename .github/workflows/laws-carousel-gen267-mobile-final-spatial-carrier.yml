name: Laws Carousel Gen267 Mobile Final Spatial Carrier
on:
  push:
    branches: ['agent/laws-carousel-gen267-mobile-legibility-repair']
    paths: ['.github/workflows/laws-carousel-gen267-mobile-final-spatial-carrier.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/laws-carousel-gen267-mobile-legibility-repair
      - name: Apply final bounded phone spatial separation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('laws/research/methods-and-models/carousel.css')
          s=p.read_text()
          old='''    .mm-carousel { --card-width: min(78vw, 19.5rem); min-height: 760px; }\n    .mm-viewport { inset: 18.5rem 0 0; }\n    .mm-card:not([data-active="true"]) .mm-card__top,\n    .mm-card:not([data-active="true"]) .mm-card__body { opacity: 0; }\n    .mm-card:not([data-active="true"]) .mm-card__surface { opacity: .24; filter: saturate(.58); }'''
          new='''    .mm-carousel { --card-width: min(78vw, 19.5rem); min-height: 900px; }\n    .mm-viewport { inset: 26rem 0 0; }'''
          if old not in s: raise SystemExit('COMBINED_PHONE_BLOCK_NOT_FOUND')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add laws/research/methods-and-models/carousel.css
          git commit -m 'separate Gen267 phone header and orbit geometry'
          git push origin HEAD:agent/laws-carousel-gen267-mobile-legibility-repair
