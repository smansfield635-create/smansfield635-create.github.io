name: Main Compass Bounded Product Builder

on:
  push:
    branches:
      - agent/main-compass-execution-helper-001
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-product-only-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out bounded task branch
        uses: actions/checkout@v4
        with:
          ref: agent/main-compass-secondary-labels-luminous-cosmos-001
          fetch-depth: 0

      - name: Construct exact two-file candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html_path = Path('index.html')
          html = html_path.read_text()

          old_cosmos = '/assets/compass/compass.cosmos.js?v=dgb-compass-cosmos-performance-context-v4'
          new_cosmos = '/assets/compass/compass.cosmos.js?v=dgb-main-compass-luminous-cosmos-labels-v1'
          assert html.count(old_cosmos) == 1
          assert 'DGB_COMPASS_ROOM_LABELS_PROJECTED_PROXY_v1' not in html
          assert 'data-compass-cosmic-field' not in html

          style = r'''
  <style id="dgb-main-compass-label-cosmos-v1">
    .compass-scene {
      background:
        radial-gradient(ellipse at 50% 43%, rgba(124, 220, 255, 0.13), transparent 38%),
        radial-gradient(ellipse at 18% 76%, rgba(84, 151, 173, 0.09), transparent 36%),
        radial-gradient(ellipse at 82% 72%, rgba(216, 184, 106, 0.075), transparent 34%),
        radial-gradient(ellipse at 78% 18%, rgba(159, 137, 255, 0.055), transparent 31%),
        linear-gradient(180deg, rgba(13, 20, 39, 0.56), rgba(3, 6, 13, 0.94) 62%, rgba(1, 3, 8, 0.98)),
        #02040a;
    }

    .compass-scene::before {
      inset: 8%;
      background:
        radial-gradient(circle, transparent 0 31%, rgba(124, 220, 255, 0.055) 31.4%, transparent 31.9%),
        radial-gradient(circle, transparent 0 43%, rgba(216, 184, 106, 0.045) 43.4%, transparent 43.9%),
        radial-gradient(circle, transparent 0 56%, rgba(124, 220, 255, 0.04) 56.4%, transparent 56.9%),
        conic-gradient(from 45deg, transparent 0 23%, rgba(124, 220, 255, 0.065) 24%, transparent 25% 49%, rgba(216, 184, 106, 0.052) 50%, transparent 51% 74%, rgba(124, 220, 255, 0.055) 75%, transparent 76%);
      background-size: auto;
      opacity: 0.48;
      animation: none;
    }

    .compass-scene__cosmos,
    [data-compass-cosmic-field] {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      contain: strict;
      isolation: isolate;
    }

    [data-compass-cosmic-field] canvas[data-compass-cosmos-canvas] {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    [data-compass-cosmos-canvas="base"] { z-index: 1; opacity: 0.96; }
    [data-compass-cosmos-canvas="sparkle"] { z-index: 2; }

    [data-compass-crystals-mount] canvas[data-compass-atmosphere-canvas] {
      display: none !important;
    }

    [data-compass-room-proxy] {
      overflow: visible !important;
    }

    [data-compass-room-proxy]::after {
      content: attr(data-label);
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 1;
      display: grid;
      place-items: center;
      width: max-content;
      max-width: 9.4rem;
      min-height: 1.7rem;
      padding: 0.32rem 0.52rem;
      border: 1px solid rgba(225, 218, 198, 0.13);
      border-radius: 999px;
      color: rgba(244, 240, 226, 0.86);
      background: linear-gradient(135deg, rgba(5, 8, 15, 0.76), rgba(15, 26, 40, 0.68));
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3), 0 0 16px rgba(124, 220, 255, 0.055), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.7rem;
      font-weight: 850;
      line-height: 1.08;
      letter-spacing: 0.055em;
      text-align: center;
      text-indent: 0;
      text-transform: uppercase;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.95);
      white-space: normal;
      overflow-wrap: anywhere;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transform-origin: center;
      opacity: 0.8;
      filter: brightness(0.92) saturate(0.9);
      transition: opacity 180ms ease, filter 180ms ease, border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    [data-compass-room-proxy][data-depth^="0.0"]::after,
    [data-compass-room-proxy][data-depth^="0.1"]::after { opacity: 0.48; filter: brightness(0.68) saturate(0.72); }
    [data-compass-room-proxy][data-depth^="0.2"]::after,
    [data-compass-room-proxy][data-depth^="0.3"]::after { opacity: 0.58; filter: brightness(0.76) saturate(0.78); }
    [data-compass-room-proxy][data-depth^="0.4"]::after,
    [data-compass-room-proxy][data-depth^="0.5"]::after { opacity: 0.70; filter: brightness(0.84) saturate(0.84); }
    [data-compass-room-proxy][data-depth^="0.8"]::after,
    [data-compass-room-proxy][data-depth^="0.9"]::after,
    [data-compass-room-proxy][data-depth="1.0000"]::after { opacity: 0.94; filter: brightness(1.04) saturate(1); }

    [data-compass-room-proxy][data-primary="true"]::after {
      opacity: 1;
      color: rgba(255, 248, 224, 0.98);
      border-color: rgba(243, 217, 139, 0.42);
      background: linear-gradient(135deg, rgba(71, 56, 29, 0.9), rgba(11, 31, 43, 0.86));
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.34), 0 0 20px rgba(243, 217, 139, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      filter: brightness(1.08) saturate(1.04);
    }

    [data-compass-room-proxy][data-selected="true"]::after,
    [data-compass-room-proxy][data-keyboard-focused="true"]::after {
      color: #120f08;
      border-color: rgba(243, 217, 139, 0.72);
      background: linear-gradient(135deg, #f6df97, #b98d3e);
      text-shadow: none;
      filter: none;
    }

    @media (max-width: 820px) {
      [data-compass-cosmos-canvas="base"] { opacity: 0.90; }
      [data-compass-room-proxy]::after { max-width: 7.6rem; min-height: 1.55rem; padding: 0.27rem 0.42rem; font-size: 0.64rem; letter-spacing: 0.045em; }
    }

    @media (max-width: 560px) {
      [data-compass-cosmos-canvas="base"] { opacity: 0.84; }
      [data-compass-room-proxy]::after { max-width: 6.8rem; padding: 0.25rem 0.38rem; font-size: 0.60rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      [data-compass-cosmos-canvas="sparkle"] { display: none !important; }
      [data-compass-room-proxy]::after { transition: none; }
    }
  </style>
'''
          html = html.replace('</head>', style + '</head>', 1)

          root_needle = '    data-mirrorland-transition-id="0"\n  >'
          root_replacement = '''    data-mirrorland-transition-id="0"
    data-compass-room-label-contract="DGB_COMPASS_ROOM_LABELS_PROJECTED_PROXY_v1"
    data-compass-room-label-count="19"
    data-compass-cosmos-contract="DGB_COMPASS_COSMOS_ARCHCOIN_SCENE_FIELD_v1"
  >'''
          assert html.count(root_needle) == 1
          html = html.replace(root_needle, root_replacement, 1)

          scene_needle = '        data-compass-scene\n      >'
          assert html.count(scene_needle) == 1
          html = html.replace(scene_needle, '        data-compass-scene\n        data-compass-scene-field\n      >', 1)

          mount_needle = '''        <div
          class="compass-scene__visual"
          data-compass-crystals-mount
          aria-hidden="true"
        ></div>'''
          mount_replacement = '''        <div
          class="compass-scene__cosmos"
          data-compass-cosmic-field
          aria-hidden="true"
        ></div>

''' + mount_needle
          assert html.count(mount_needle) == 1
          html = html.replace(mount_needle, mount_replacement, 1)
          html = html.replace(old_cosmos, new_cosmos, 1)
          html_path.write_text(html)

          source = Path('laws/index.cosmos.js').read_text()
          cosmos = source
          replacements = [
              ('/* /laws/index.cosmos.js', '/* /assets/compass/compass.cosmos.js'),
              ('DGB_LAWS_COSMOS', 'DGB_COMPASS_COSMOS'),
              ('LAWS_COSMOS_ARCHCOIN_SCENE_FIELD_v5', 'DGB_COMPASS_COSMOS_ARCHCOIN_SCENE_FIELD_v1'),
              ('LAWS_ARCHCOIN_STARFIELD', 'COMPASS_ARCHCOIN_STARFIELD'),
              ('laws-archcoin-starfield-runtime-style', 'compass-archcoin-starfield-runtime-style'),
              ('data-laws-cosmos-canvas', 'data-compass-cosmos-canvas'),
              ('data-laws-cosmic-field', 'data-compass-cosmic-field'),
              ('data-laws-scene-field', 'data-compass-scene'),
              ('data-laws-root', 'data-compass-root'),
              ('lawsIdentityPreserved', 'compassIdentityPreserved'),
              ('ownsLawContent', 'ownsCompassContent'),
              ('lawsCosmos', 'compassCosmos'),
              ('lawsReducedMotion', 'reducedMotion'),
              ('0x4c415753', '0x4d41494e'),
              ('Laws', 'Main Compass'),
              ('laws', 'compass')
          ]
          for old, new in replacements:
              cosmos = cosmos.replace(old, new)
          cosmos = cosmos.replace('COMPASS_COSMOS_ARCHCOIN_SCENE_FIELD_v5', 'DGB_COMPASS_COSMOS_ARCHCOIN_SCENE_FIELD_v1')
          cosmos = cosmos.replace('DGB_COMPASS_COSMOS_ARCHCOIN_SCENE_FIELD_v5', 'DGB_COMPASS_COSMOS_ARCHCOIN_SCENE_FIELD_v1')
          Path('assets/compass/compass.cosmos.js').write_text(cosmos)

          assert len(re.findall(r'data-room-id="(?:north|east|south|west)-\d+"', html)) == 19
          assert html.count('data-compass-cardinal-id=') == 0
          assert html.count('data-cardinal-id=') == 4
          assert html.count('data-compass-cosmic-field') == 1
          assert html.count('DGB_COMPASS_ROOM_LABELS_PROJECTED_PROXY_v1') == 1
          assert html.count(new_cosmos) == 1
          assert old_cosmos not in html
          assert 'ARCHCOIN_FIBONACCI_PHYLLOTAXIS_FIELD_v1' in cosmos
          assert 'DGB_COMPASS_COSMOS_ARCHCOIN_SCENE_FIELD_v1' in cosmos
          assert 'requestAnimationFrame(' not in cosmos
          assert '[data-compass-cosmic-field]' in cosmos
          assert '[data-compass-scene]' in cosmos
          assert '[data-compass-root]' in cosmos
          PY

          node --check assets/compass/compass.cosmos.js
          git diff --check

          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          expected = ['assets/compass/compass.cosmos.js', 'index.html']
          if sorted(changed) != expected:
              raise SystemExit(f'BOUNDED_PATH_SET_FAIL:{changed}')
          print('BOUNDED_PATH_SET=PASS')
          PY

      - name: Commit atomic product candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/compass/compass.cosmos.js
          git commit -m "Add Main Compass room labels and luminous Cosmos"
          git push origin HEAD:agent/main-compass-secondary-labels-luminous-cosmos-001
