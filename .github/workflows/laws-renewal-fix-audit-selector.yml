name: Laws Renewal Fix Audit Selector

on:
  push:
    branches:
      - agent/laws-renewal-public-audit-translation-001
    paths:
      - scripts/laws-renewal-fix-audit-selector.mjs
      - .github/workflows/laws-renewal-fix-audit-selector.yml
  pull_request:
    paths:
      - scripts/laws-renewal-fix-audit-selector.mjs
      - .github/workflows/laws-renewal-fix-audit-selector.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/laws-renewal-public-audit-translation-001
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Correct audit selector
        run: node scripts/laws-renewal-fix-audit-selector.mjs

      - name: Validate patch integrity
        run: git diff --check

      - name: Commit selector correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No selector correction required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/laws_cp6_contextual_browser_verify.mjs
          git commit -m "Narrow Laws canonical-audit browser selector"
          git push origin HEAD:agent/laws-renewal-public-audit-translation-001
