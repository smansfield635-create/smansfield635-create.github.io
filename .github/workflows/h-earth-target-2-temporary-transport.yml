name: H-Earth Target 2 Temporary Transport

on:
  push:
    branches:
      - agent/h-earth-repository-registry-target-2-transport-001
    paths:
      - .transport/h-earth-target-2/H_EARTH_REPOSITORY_REGISTRY_CANDIDATE_SCHEMA_AND_INSTANCE_v1.xz.b64
      - .github/workflows/h-earth-target-2-temporary-transport.yml

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out transport branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify exact artifact
        shell: bash
        run: |
          set -euo pipefail
          dir='.transport/h-earth-target-2'
          source="$dir/H_EARTH_REPOSITORY_REGISTRY_CANDIDATE_SCHEMA_AND_INSTANCE_v1.xz.b64"
          output="$dir/H_EARTH_REPOSITORY_REGISTRY_CANDIDATE_SCHEMA_AND_INSTANCE_v1.reconstructed.js"
          receipt="$dir/H_EARTH_REPOSITORY_REGISTRY_CANDIDATE_SCHEMA_AND_INSTANCE_v1.transport-receipt.txt"

          base64 --decode "$source" | xz --decompress --stdout > "$output"

          actual_bytes="$(wc -c < "$output" | tr -d ' ')"
          actual_sha256="$(sha256sum "$output" | awk '{print $1}')"
          actual_git_blob="$(git hash-object "$output")"

          test "$actual_bytes" = '140320'
          test "$actual_sha256" = '5c71aba5ff60f7d8838fa4571ec18e72eafe04f01130ad146de4376279735dfe'
          test "$actual_git_blob" = '10ab7b203e03fde419e526d0cce2c0af42860911'

          cat > "$receipt" <<EOF
          ARTIFACT=H_EARTH_REPOSITORY_REGISTRY_CANDIDATE_SCHEMA_AND_INSTANCE_v1
          TRANSPORT_CLASS=TEMPORARY_BOUNDED_EXACT_BYTE_TRANSPORT
          BYTE_COUNT=$actual_bytes
          SHA256=$actual_sha256
          GIT_BLOB=$actual_git_blob
          RECONSTRUCTION=PASS
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$output" "$receipt"
          if ! git diff --cached --quiet; then
            git commit -m 'Reconstruct verified H-Earth Target 2 artifact'
            git push origin HEAD:agent/h-earth-repository-registry-target-2-transport-001
          fi
