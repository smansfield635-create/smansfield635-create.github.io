<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H-Earth Functional Inspection</title></head><body style="margin:0;background:#061014;color:#eef8f6;font-family:system-ui"><p id="loading" style="padding:24px">Loading approved H-Earth environment…</p><script>
(async()=>{
  const owner='smansfield635-create';
  const repo='smansfield635-create.github.io';
  const sourceCommit='0c6069f30e494be2f84d2653f40e374178251c77';
  const sourceRoot=`https://raw.githack.com/${owner}/${repo}/${sourceCommit}`;
  const sourceDir=`${sourceRoot}/showroom/globe/h-earth/`;
  const raw=`https://raw.githubusercontent.com/${owner}/${repo}/${sourceCommit}/showroom/globe/h-earth/index.html`;
  try{
    const response=await fetch(raw,{cache:'no-store'});
    if(!response.ok)throw new Error(`H-Earth fetch ${response.status}`);
    let html=await response.text();
    html=html
      .replace('<head>','<head><base href="'+sourceDir+'">')
      .replaceAll('href="/','href="'+sourceRoot+'/')
      .replaceAll("href='/","href='"+sourceRoot+"/")
      .replaceAll('src="/','src="'+sourceRoot+'/')
      .replaceAll("src='/","src='"+sourceRoot+"/")
      .replace('</body>',`<script>(()=>{const back=(event)=>{event.preventDefault();if(history.length>1)history.back();else location.href='https://diamondgatebridge.com/';};const bind=()=>{document.querySelector('#h-earth-return-to-compass')?.addEventListener('click',back,true);document.querySelector('.h-earth-3d-brand')?.addEventListener('click',back,true);};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind,{once:true});else bind();})();<\/script></body>`);
    document.open();document.write(html);document.close();
  }catch(error){document.getElementById('loading').textContent='H-Earth inspection launcher failed: '+error;}
})();
</script></body></html>
