name: Execute canonical crystal clone

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/laws-showroom-crystal-corridor-clone-001
          fetch-depth: 0

      - name: Execute embedded deterministic generator
        shell: python
        run: |
          from pathlib import Path
          import traceback

          error_path = Path(".laws-showroom-clone-generation-error.txt")
          if error_path.exists():
              error_path.unlink()

          try:
              workflow = Path(
                  ".github/workflows/laws-showroom-canonical-crystal-clone.yml"
              ).read_text(encoding="utf-8").splitlines()

              start_marker = "      - name: Duplicate canonical crystal corridor"
              end_marker = "      - name: Validate generated executables"
              start = workflow.index(start_marker)
              end = workflow.index(end_marker)

              run_line = None
              for index in range(start + 1, end):
                  if workflow[index] == "        run: |":
                      run_line = index
                      break

              if run_line is None:
                  raise RuntimeError("Embedded generator run block not found")

              code_lines = []
              for line in workflow[run_line + 1:end]:
                  if line.startswith("          "):
                      code_lines.append(line[10:])
                  elif line.strip():
                      raise RuntimeError(
                          f"Unexpected generator indentation: {line!r}"
                      )
                  else:
                      code_lines.append("")

              code = "\n".join(code_lines)

              code = code.replace(
                  '"\\n\\n  function buildGpuMesh("',
                  '"\\n\\n  function lawColorForDirection("',
                  1,
              )

              corrected_laws_mesh_builder = r"""laws_build_meshes = '''  function createCpuMeshes() {
            const meshes = new Map();

            DIRECTIONS.forEach(direction => {
              const warm =
                direction === "reality" ||
                direction === "structure";

              meshes.set(
                `category-${direction}`,
                createDiamondStarMesh({
                  points: QUALITY.categorySegments,
                  radius: 0.72,
                  inner: 0.30,
                  depth: 0.42,
                  crown: 0.20,
                  color: PALETTE[direction],
                  warmth: warm ? 0.10 : 0.02
                })
              );

              const lawColor =
                direction === "flow"
                  ? PALETTE.lawFlow
                  : direction === "integrity"
                    ? PALETTE.lawIntegrity
                    : direction === "reality"
                      ? PALETTE.lawReality
                      : PALETTE.lawStructure;

              meshes.set(
                `law-${direction}`,
                createDiamondStarMesh({
                  points: QUALITY.lawSegments,
                  radius: 0.42,
                  inner: 0.20,
                  depth: 0.25,
                  crown: 0.10,
                  color: lawColor,
                  warmth: warm ? 0.08 : 0.02
                })
              );
            });

            return meshes;
          }'''
          laws = section(
              laws,
              "  function createCpuMeshes() {",
              "\n\n  function createRenderer(",
              laws_build_meshes,
              "laws-build-meshes",
          )"""

              builder_start = code.index("laws_build_meshes =")
              builder_end = code.index("laws_cluster =", builder_start)
              code = (
                  code[:builder_start]
                  + corrected_laws_mesh_builder
                  + "\n\n"
                  + code[builder_end:]
              )

              exec(compile(code, "canonical-crystal-generator", "exec"), {})
          except BaseException:
              error_path.write_text(traceback.format_exc(), encoding="utf-8")

      - name: Validate generated executables
        run: |
          if [ -f .laws-showroom-clone-generation-error.txt ]; then
            cat .laws-showroom-clone-generation-error.txt
            exit 0
          fi
          node --check laws/index.crystals.js
          node --check showroom/index.crystals.js
          cmp -s laws/index.crystals.js laws/index.crystals.source.js
          cmp -s showroom/index.crystals.js showroom/index.crystals.source.js
          git diff --check

      - name: Commit generated candidate or diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .laws-showroom-clone-generation-error.txt ]; then
            git add .laws-showroom-clone-generation-error.txt
            git commit -m "Record canonical crystal generator diagnostic"
          else
            git add -A .laws-showroom-clone-generation-error.txt
            git add laws/index.crystals.js laws/index.crystals.source.js laws/index.html \
                    showroom/index.crystals.js showroom/index.crystals.source.js showroom/index.html
            git commit -m "Clone canonical crystal corridor into Laws and Showroom"
          fi
          git push origin HEAD:agent/laws-showroom-crystal-corridor-clone-001
