name: H-Earth C0 Exact Live Coastal Baseline Freeze

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h-earth-c0-exact-live-coastal-baseline-freeze.yml'

permissions:
  contents: write

concurrency:
  group: h-earth-c0-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXACT_MAIN_HEAD: 59df682501f63aec8a263cef8e1a5adacbc2a1a2
  C0_BRANCH: agent/h-earth-c0-exact-live-coastal-baseline-freeze-001
  C0_ROOT: h-earth-3d/control-plane/coastal-morphology/c0
  C0_EVIDENCE: h-earth-3d/control-plane/coastal-morphology/c0/evidence
  PUBLIC_ORIGIN: https://diamondgatebridge.com

jobs:
  c0-d-runtime-and-mobile-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify bounded C0-D state
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.ref }}" = "$C0_BRANCH"
          test "$(git merge-base "$EXACT_MAIN_HEAD" HEAD)" = "$EXACT_MAIN_HEAD"
          test "$(node -p "require('./$C0_EVIDENCE/h-earth.c0.public-occurrence.json').sourceOccurrenceLinkage")" = "VERIFIED_BY_CONTENT_IDENTITY"
          test "$(node -p "require('./$C0_EVIDENCE/h-earth.c0.source-custody.json').result")" = "PASS_CLOSED"
          test "$(node -p "require('./$C0_EVIDENCE/h-earth.c0.fixed-scenes-receipt.json').result")" = "PASS_CLOSED"
          test ! -e "$C0_EVIDENCE/h-earth.c0.performance-baseline.json"
          test ! -e "$C0_EVIDENCE/h-earth.c0.runtime-receipts.json"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Install bounded browser driver
        run: npm install --no-save --no-package-lock puppeteer-core@24.15.0

      - name: Execute C0-D observability and desktop baseline
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/c0-d.mjs <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import puppeteer from 'puppeteer-core';

          const exactMain=process.env.EXACT_MAIN_HEAD;
          const evidence=process.env.C0_EVIDENCE;
          const origin=process.env.PUBLIC_ORIGIN;
          const fixed=JSON.parse(fs.readFileSync(`${process.env.C0_ROOT}/h-earth.c0.fixed-scenes.json`,'utf8'));
          const sha=buffer=>crypto.createHash('sha256').update(buffer).digest('hex');
          const round=(n,p=3)=>Number(Number(n).toFixed(p));
          const percentile=(values,q)=>{const a=[...values].sort((x,y)=>x-y);if(!a.length)return null;const i=Math.min(a.length-1,Math.max(0,Math.ceil(q*a.length)-1));return round(a[i]);};
          const stats=values=>({minimum:values.length?round(Math.min(...values)):null,median:percentile(values,.5),p95:percentile(values,.95),p99:percentile(values,.99),maximum:values.length?round(Math.max(...values)):null,longFrameCount:values.filter(v=>v>33.334).length,frameSampleCount:values.length});
          const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--enable-precise-memory-info']});

          async function ready(page){
            await page.waitForFunction(()=>window.H_EARTH_RUN8E_PUBLIC_ROUTE?.ready===true&&document.querySelector('#h-earth-functional-landscape-route')?.dataset.run8eReady==='true',{timeout:240000});
            await page.waitForFunction(()=>(window.H_EARTH_RUN8E_PUBLIC_ROUTE?.getLiveGpuReceipt?.().counters?.gpuFramebufferPresentationCount??0)>0,{timeout:240000});
          }
          async function dispatchWheel(page,deltaY){
            const before=await page.evaluate(()=>({seq:window.H_EARTH_RUN8E_PUBLIC_ROUTE.getIntakeReceipt().currentNavigationState.sequence,frames:window.H_EARTH_RUN8E_PUBLIC_ROUTE.getLiveGpuReceipt().counters.gpuFramebufferPresentationCount}));
            await page.evaluate(d=>document.querySelector('#h-earth-functional-landscape-canvas').dispatchEvent(new WheelEvent('wheel',{bubbles:true,cancelable:true,deltaY:d,deltaMode:0})),deltaY);
            await page.waitForFunction(b=>{const api=window.H_EARTH_RUN8E_PUBLIC_ROUTE;return api.getIntakeReceipt().currentNavigationState.sequence>b.seq&&api.getLiveGpuReceipt().counters.gpuFramebufferPresentationCount>b.frames;},{timeout:240000},before);
          }
          async function applyScene(page,scene){
            const id=scene.sceneId;
            if(id==='TRAVERSAL_THROUGH_COAST_VIEW'){
              for(let i=0;i<3;i++) await dispatchWheel(page,-700);
              for(let i=0;i<4;i++) await dispatchWheel(page,700);
              return;
            }
            const target=scene.primaryCapture.cameraPosition.z;
            const delta=target-(-96);
            const direction=delta>0?700:-700;
            for(let i=0;i<Math.round(Math.abs(delta)/10);i++) await dispatchWheel(page,direction);
          }
          async function sceneObservation(scene){
            const page=await browser.newPage();
            await page.setViewport({width:390,height:844,deviceScaleFactor:2,isMobile:true,hasTouch:true});
            const pageErrors=[],consoleErrors=[],requestFailures=[],ownedHttpErrors=[];
            page.on('pageerror',e=>pageErrors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text());});
            page.on('requestfailed',r=>requestFailures.push({url:r.url(),reason:r.failure()?.errorText??'UNKNOWN'}));
            page.on('response',r=>{if(r.status()>=400&&new URL(r.url()).origin===origin)ownedHttpErrors.push({url:r.url(),status:r.status()});});
            const url=`${origin}/showroom/globe/h-earth/?c0d=${exactMain}&scene=${scene.sceneId}`;
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:240000});
            await ready(page);
            const before=await page.evaluate(()=>window.H_EARTH_RUN8E_PUBLIC_ROUTE.getLiveGpuReceipt().counters.gpuFramebufferPresentationCount);
            await applyScene(page,scene);
            await new Promise(r=>setTimeout(r,250));
            const facts=await page.evaluate(()=>{
              const api=window.H_EARTH_RUN8E_PUBLIC_ROUTE,canvas=document.querySelector('#h-earth-functional-landscape-canvas'),gl=canvas.getContext('webgl2'),rect=canvas.getBoundingClientRect(),live=api.getLiveGpuReceipt(),nav=api.getIntakeReceipt().currentNavigationState;
              let framebufferHashInput=null;
              try{const bytes=new Uint8Array(gl.drawingBufferWidth*gl.drawingBufferHeight*4);gl.readPixels(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight,gl.RGBA,gl.UNSIGNED_BYTE,bytes);framebufferHashInput=Array.from(bytes.slice(0,Math.min(bytes.length,262144)));}catch{}
              return {cameraPosition:nav.position,cameraOrientation:{yawDegrees:nav.yawDegrees,pitchDegrees:nav.pitchDegrees,verticalFovDegrees:nav.verticalFovDegrees},rendererFrameCounter:live.counters.gpuFramebufferPresentationCount,canvas:{width:canvas.width,height:canvas.height},drawingBuffer:{width:gl.drawingBufferWidth,height:gl.drawingBufferHeight},visibleCanvasBoundingRect:{x:rect.x,y:rect.y,width:rect.width,height:rect.height},run8eReadyState:document.querySelector('#h-earth-functional-landscape-route')?.dataset.run8eReady==='true',liveGpuPresentingState:live.status,framebufferHashInput};
            });
            const canvas=await page.$('#h-earth-functional-landscape-canvas');
            const canvasPng=await canvas.screenshot({type:'png'});
            const fullPng=await page.screenshot({type:'png',fullPage:true});
            const out={sceneId:scene.sceneId,cameraPosition:facts.cameraPosition,cameraOrientation:facts.cameraOrientation,rendererFrameCounterBefore:before,rendererFrameCounterAfter:facts.rendererFrameCounter,canvasWidthAndHeight:facts.canvas,webglDrawingBufferWidthAndHeight:facts.drawingBuffer,canvasPixelOrFramebufferHash:sha(canvasPng),framebufferSampleHash:facts.framebufferHashInput?sha(Buffer.from(facts.framebufferHashInput)):null,fullPageScreenshotHash:sha(fullPng),visibleCanvasBoundingRect:facts.visibleCanvasBoundingRect,run8eReadyState:facts.run8eReadyState,liveGpuPresentingState:facts.liveGpuPresentingState,pageErrors,consoleErrors,requestFailures,ownedHttpErrors};
            await page.close();
            return out;
          }

          const sceneObservations=[];
          for(const scene of fixed.scenes) sceneObservations.push(await sceneObservation(scene));
          const cameraSignature=o=>JSON.stringify({p:o.cameraPosition,o:o.cameraOrientation});
          const distinctCameraStateCount=new Set(sceneObservations.map(cameraSignature)).size;
          const distinctCanvasHashCount=new Set(sceneObservations.map(o=>o.canvasPixelOrFramebufferHash)).size;
          const distinctFullPageHashCount=new Set(sceneObservations.map(o=>o.fullPageScreenshotHash)).size;

          const causalPage=await browser.newPage();
          await causalPage.setViewport({width:390,height:844,deviceScaleFactor:2,isMobile:true,hasTouch:true});
          await causalPage.goto(`${origin}/showroom/globe/h-earth/?c0d=${exactMain}&causality=1`,{waitUntil:'domcontentloaded',timeout:240000});
          await ready(causalPage);
          const causalCanvas=await causalPage.$('#h-earth-functional-landscape-canvas');
          const startState=await causalPage.evaluate(()=>window.H_EARTH_RUN8E_PUBLIC_ROUTE.getIntakeReceipt().currentNavigationState);
          const startCanvasHash=sha(await causalCanvas.screenshot({type:'png'}));
          const startPageHash=sha(await causalPage.screenshot({type:'png',fullPage:true}));
          await dispatchWheel(causalPage,700);
          await new Promise(r=>setTimeout(r,250));
          const finalState=await causalPage.evaluate(()=>window.H_EARTH_RUN8E_PUBLIC_ROUTE.getIntakeReceipt().currentNavigationState);
          const finalCanvasHash=sha(await causalCanvas.screenshot({type:'png'}));
          const finalPageHash=sha(await causalPage.screenshot({type:'png',fullPage:true}));
          await causalPage.close();
          const cameraChanged=JSON.stringify(startState.position)!==JSON.stringify(finalState.position)||startState.yawDegrees!==finalState.yawDegrees||startState.pitchDegrees!==finalState.pitchDegrees;
          const canvasChanged=startCanvasHash!==finalCanvasHash;
          const presentedRegionChanged=startPageHash!==finalPageHash;
          let captureObservability='VERIFIED',causality='VERIFIED',firstBlocker=null;
          if(cameraChanged&&!canvasChanged){captureObservability='LIVE_PRESENTATION_FAILURE';causality='FAILED';firstBlocker='CAMERA_CHANGE_NOT_REFLECTED_IN_PRESENTED_FRAME';}
          else if(canvasChanged&&!presentedRegionChanged){captureObservability='CAPTURE_HARNESS_FAILURE';causality='FAILED';firstBlocker='SCREENSHOT_CAPTURE_HARNESS_NOT_OBSERVING_LIVE_CANVAS';}
          else if(distinctCameraStateCount!==6){captureObservability='UNRESOLVED';causality='UNRESOLVED';firstBlocker='FROZEN_SCENE_DEFINITIONS_NOT_SIX_DISTINCT_CAMERA_STATES';}
          else if(distinctCanvasHashCount!==6){captureObservability='UNRESOLVED';causality='UNRESOLVED';firstBlocker='DISTINCT_SCENE_CANVAS_HASH_COUNT_NOT_SIX';}

          async function runtimeState(id,mode){
            const page=await browser.newPage();
            await page.setViewport({width:1365,height:768,deviceScaleFactor:1});
            const errors={pageErrors:[],consoleErrors:[],requestFailures:[],ownedHttpErrors:[]};
            page.on('pageerror',e=>errors.pageErrors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')errors.consoleErrors.push(m.text());});
            page.on('requestfailed',r=>errors.requestFailures.push({url:r.url(),reason:r.failure()?.errorText??'UNKNOWN'}));
            page.on('response',r=>{if(r.status()>=400&&new URL(r.url()).origin===origin)errors.ownedHttpErrors.push({url:r.url(),status:r.status()});});
            const started=Date.now();
            await page.goto(`${origin}/showroom/globe/h-earth/?c0d=${exactMain}&runtime=${id}`,{waitUntil:'domcontentloaded',timeout:240000});
            await ready(page);
            const startupDuration=Date.now()-started;
            const before=await page.evaluate(()=>({nav:window.H_EARTH_RUN8E_PUBLIC_ROUTE.getIntakeReceipt().counters.acceptedNavigationProposalCount,present:window.H_EARTH_RUN8E_PUBLIC_ROUTE.getLiveGpuReceipt().counters.gpuFramebufferPresentationCount}));
            const measurement=await page.evaluate(async mode=>{
              const intervals=[];let last=null;const start=performance.now();
              let timer=null;
              if(mode==='CONTINUOUS_COASTAL_TRAVERSAL') timer=setInterval(()=>document.querySelector('#h-earth-functional-landscape-canvas').dispatchEvent(new WheelEvent('wheel',{bubbles:true,cancelable:true,deltaY:-140})),180);
              await new Promise(resolve=>{function step(t){if(last!==null)intervals.push(t-last);last=t;if(t-start<5000)requestAnimationFrame(step);else resolve();}requestAnimationFrame(step);});
              if(timer)clearInterval(timer);
              const resources=performance.getEntriesByType('resource');
              return {intervals,duration:performance.now()-start,resource:{requestCount:resources.length,transferBytes:resources.reduce((s,r)=>s+(r.transferSize||0),0),decodedBytes:resources.reduce((s,r)=>s+(r.decodedBodySize||0),0)},systemMemory:navigator.deviceMemory??null,jsHeap:performance.memory?{usedJSHeapSize:performance.memory.usedJSHeapSize,totalJSHeapSize:performance.memory.totalJSHeapSize,jsHeapSizeLimit:performance.memory.jsHeapSizeLimit}:null};
            },mode);
            const after=await page.evaluate(()=>({nav:window.H_EARTH_RUN8E_PUBLIC_ROUTE.getIntakeReceipt().counters.acceptedNavigationProposalCount,present:window.H_EARTH_RUN8E_PUBLIC_ROUTE.getLiveGpuReceipt().counters.gpuFramebufferPresentationCount}));
            await page.close();
            return {stateId:id,measurementDurationMilliseconds:round(measurement.duration),frameTime:stats(measurement.intervals),cameraUpdateCount:after.nav-before.nav,rendererPresentCount:after.present-before.present,startupDurationMilliseconds:startupDuration,downloadTransferBytes:measurement.resource.transferBytes,decodedOrResourceBytes:measurement.resource.decodedBytes,requestCount:measurement.resource.requestCount,gpuMemoryBaseline:{status:'UNAVAILABLE',method:'WEB_PLATFORM_RUNTIME',reason:'NO_STANDARD_WEB_API_EXPOSES_GPU_MEMORY'},systemMemoryBaseline:measurement.systemMemory===null?{status:'UNAVAILABLE',method:'navigator.deviceMemory',reason:'NOT_EXPOSED_BY_BROWSER'}:{status:'AVAILABLE_APPROXIMATE_DEVICE_GIB',value:measurement.systemMemory,method:'navigator.deviceMemory'},jsHeapMemory:measurement.jsHeap,errors};
          }
          const runtimeStates=[];
          if(firstBlocker===null){
            runtimeStates.push(await runtimeState('STATIONARY_COASTAL_VIEW','STATIONARY_COASTAL_VIEW'));
            runtimeStates.push(await runtimeState('CONTINUOUS_COASTAL_TRAVERSAL','CONTINUOUS_COASTAL_TRAVERSAL'));
            runtimeStates.push(await runtimeState('OCEAN_VISIBLE_WITH_LIVE_MOTION','OCEAN_VISIBLE_WITH_LIVE_MOTION'));
          }
          await browser.close();

          const physicalMobile={deviceModel:'DESIGNATED_SAMSUNG_REFERENCE_DEVICE',physicalOrEmulated:'PHYSICAL_REQUIRED',executed:false,status:'NOT_EXECUTED',reason:'NO_PHYSICAL_DEVICE_EXECUTION_CHANNEL_AVAILABLE_TO_GITHUB_ACTIONS; PRIOR_SIGNED_OFFLINE_PACKAGE_HAS physicalAcceptanceEmbedded=false AND DOES_NOT_BIND_TO_EXACT_MAIN_HEAD',officialBaseline:false};
          if(firstBlocker===null) firstBlocker='PHYSICAL_MOBILE_BASELINE_NOT_EXECUTED';
          const result='OPEN_BLOCKED';
          const performance={receiptType:'H_EARTH_C0_D_PERFORMANCE_BASELINE_v1',operation:'C0_D_RUNTIME_AND_MOBILE_BASELINE',result,c0Overall:'OPEN_IN_PROGRESS',exactMainHead:exactMain,desktopEnvironment:{deviceModel:'GITHUB_HOSTED_UBUNTU_RUNNER',operatingSystem:'Ubuntu 24.04',browserAndVersion:'GOOGLE_CHROME_STABLE',physicalOrEmulated:'HOSTED_DESKTOP_RUNTIME',orientation:'LANDSCAPE',viewport:{width:1365,height:768},devicePixelRatio:1,networkProfile:'RUNNER_DEFAULT',cacheState:'CLEAN_CONTEXT_PER_STATE',batteryOrPowerState:'EXTERNAL_RUNNER_POWER',thermalState:{status:'UNAVAILABLE',reason:'NOT_EXPOSED'}},physicalMobile,runtimeStates};
          const receipt={receiptType:'H_EARTH_C0_D_RUNTIME_RECEIPTS_v1',operation:'C0_D_RUNTIME_AND_MOBILE_BASELINE',result,c0Overall:'OPEN_IN_PROGRESS',exactMainHead:exactMain,captureObservability,distinctSceneCameraStateCount:distinctCameraStateCount,distinctSceneCanvasHashCount:distinctCanvasHashCount,distinctFullPageScreenshotHashCount:distinctFullPageHashCount,cameraToPresentedFrameCausality:causality,causalityTest:{startCamera:startState,finalCamera:finalState,cameraStateChanged:cameraChanged,renderedCanvasBodyChanged:canvasChanged,presentedScreenRegionChanged:presentedRegionChanged,startCanvasHash,finalCanvasHash,startFullPageHash:startPageHash,finalFullPageHash:finalPageHash},sceneObservations,physicalMobileBaselineExecuted:false,allThreeRuntimeStatesMeasured:runtimeStates.length===3,frameTimePercentilesRecorded:runtimeStates.length===3,memoryFieldsRecordedOrExplicitlyUnavailable:runtimeStates.length===3,downloadCostRecorded:runtimeStates.length===3,errorBaselineRecorded:runtimeStates.length===3,productMutation:false,unauthorizedChangedPaths:0,firstBlocker,nextAuthorizedC0Block:null,c0EAuthorized:false,c1Authorized:false,phaseT:'INACCESSIBLE'};
          fs.writeFileSync(`${evidence}/h-earth.c0.performance-baseline.json`,JSON.stringify(performance,null,2)+'\n');
          fs.writeFileSync(`${evidence}/h-earth.c0.runtime-receipts.json`,JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify({result,captureObservability,distinctCameraStateCount,distinctCanvasHashCount,distinctFullPageHashCount,causality,physicalMobileExecuted:false,runtimeStateCount:runtimeStates.length,firstBlocker},null,2));
          NODE
          node /tmp/c0-d.mjs

      - name: Verify mutation boundary and commit C0-D receipts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process');
          const root=process.env.C0_ROOT,e=process.env.C0_EVIDENCE;
          for(const f of [`${e}/h-earth.c0.performance-baseline.json`,`${e}/h-earth.c0.runtime-receipts.json`]) if(!fs.existsSync(f)) throw new Error(`C0_D_OUTPUT_MISSING:${f}`);
          const allowed=new Set(require(`./${root}/h-earth.c0.allowed-path-manifest.json`).exactAllowedPaths);
          const changed=cp.execFileSync('git',['diff','--name-only',process.env.EXACT_MAIN_HEAD],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const unauthorized=changed.filter(f=>!allowed.has(f));
          const product=changed.filter(f=>f.startsWith('showroom/globe/h-earth/')||f.startsWith('h-earth-3d/terrain/')||f.startsWith('h-earth-3d/environment/'));
          if(unauthorized.length) throw new Error(`C0_UNAUTHORIZED_CHANGED_PATHS:${unauthorized.join(',')}`);
          if(product.length) throw new Error(`C0_PRODUCT_MUTATION:${product.join(',')}`);
          console.log(JSON.stringify({changedPathCount:changed.length,unauthorizedChangedPaths:0,productMutation:false},null,2));
          NODE
          sha256sum "$C0_EVIDENCE/h-earth.c0.performance-baseline.json" "$C0_EVIDENCE/h-earth.c0.runtime-receipts.json"
          git config user.name "h-earth-c0-evidence"
          git config user.email "actions@users.noreply.github.com"
          git add "$C0_EVIDENCE/h-earth.c0.performance-baseline.json" "$C0_EVIDENCE/h-earth.c0.runtime-receipts.json"
          git commit -m "C0-D: record capture observability and runtime baseline"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
