name: Compass bounded settlement repair temp

on:
  push:
    branches:
      - compass-renewal-corrected-gen1772

permissions:
  contents: write

concurrency:
  group: compass-bounded-settlement-repair-temp
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: compass-renewal-corrected-gen1772
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            assets/compass/compass.crystals.js
            .github/workflows/compass-bounded-settlement-repair-temp.yml
          sparse-checkout-cone-mode: false

      - name: Apply bounded renderer-owned settlement repair
        shell: python
        run: |
          from pathlib import Path

          path = Path('assets/compass/compass.crystals.js')
          source = path.read_text(encoding='utf-8')
          marker = 'COMPASS_PHYSICAL_SETTLEMENT_BEFORE_COMMIT_v1'

          if marker in source:
              print('bounded settlement repair already present')
              raise SystemExit(0)

          helper = '''  // COMPASS_PHYSICAL_SETTLEMENT_BEFORE_COMMIT_v1
          const SETTLEMENT_TRANSFORM_KEYS = Object.freeze([
            "x",
            "y",
            "z",
            "sx",
            "sy",
            "sz",
            "prominence",
            "halo",
            "rotationSpeed",
            "float"
          ]);

          function completeConstellationSettlementGeometry() {
            /*
             * A cardinal release is a discrete settlement boundary. The renderer
             * owns the physical node and camera interpolation, so complete those
             * renderer-owned targets before the controller is allowed to publish
             * COMMITTED. This preserves the controller state machine while making
             * foreground-star geometry and controller commitment the same event.
             */
            updateTargets();

            state.registry.forEach(
              node => {
                if (
                  !node.transform ||
                  !node.target
                ) {
                  return;
                }

                SETTLEMENT_TRANSFORM_KEYS.forEach(
                  key => {
                    node.transform[key] =
                      node.target[key];
                  }
                );
              }
            );

            for (
              let index = 0;
              index < 3;
              index += 1
            ) {
              state.camera.eye[index] =
                state.camera.nextEye[index];

              state.camera.target[index] =
                state.camera.nextTarget[index];
            }

            state.view =
              lookAt4(
                state.camera.eye,
                state.camera.target,
                [0, 1, 0]
              );

            syncSemanticObjects();
          }

'''

          helper_index = source.find('  function lerp(')
          if helper_index < 0:
              raise SystemExit('helper anchor not found')
          source = source[:helper_index] + helper + source[helper_index:]

          commit_anchor = '''    const committed =
              requestControllerOrbitCommit('''
          commit_index = source.find(commit_anchor)
          if commit_index < 0:
              raise SystemExit('orbit commit anchor not found')
          source = (
              source[:commit_index]
              + '    completeConstellationSettlementGeometry();\n\n'
              + source[commit_index:]
          )

          path.write_text(source, encoding='utf-8')

      - name: Mechanical source sanity
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/compass/compass.crystals.js
          git diff --check
          grep -Fq 'COMPASS_PHYSICAL_SETTLEMENT_BEFORE_COMMIT_v1' assets/compass/compass.crystals.js
          test "$(grep -Fc 'completeConstellationSettlementGeometry();' assets/compass/compass.crystals.js)" -eq 1

      - name: Commit bounded repair if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/compass/compass.crystals.js; then
            echo 'No repair commit required.'
            exit 0
          fi
          git config user.name 'smansfield635-create'
          git config user.email 'smansfield635@gmail.com'
          git add assets/compass/compass.crystals.js
          git commit -m 'Compass: complete renderer settlement before commit'
          git push origin HEAD:compass-renewal-corrected-gen1772
