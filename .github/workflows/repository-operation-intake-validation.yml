name: Methods Minimum Real 3D Proof Router Ratification

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/repository-operation-intake-validation.yml']

permissions:
  contents: read

env:
  GOVERNING_MAIN: b9937e4f732751b4f1108ecbc08dcef0df92b692
  SOURCE_PR: '642'
  SOURCE_CANDIDATE: 181d2fa77354512249f3281e5bf6c84227acf642
  SOURCE_MERGE: b9937e4f732751b4f1108ecbc08dcef0df92b692
  ARCHITECTURE_FINGERPRINT: 59da453bc620ff7992d71d6db4f075d28db9f35530c570961a6a0a14a2ef7252
  REJECTED_VISUAL: 2044e7ab5d27af7bcfbd477a6c3ee046549744ed
  EXPECTED_PATHS_JSON: '[".github/workflows/methods-context-displacement-minimum-real-3d-proof-v1.yml","control-plane/methods-information-benchmark/context-displacement-minimum-real-3d-proof-v1/README.md","control-plane/methods-information-benchmark/context-displacement-minimum-real-3d-proof-v1/index.html","control-plane/methods-information-benchmark/context-displacement-minimum-real-3d-proof-v1/styles.css","control-plane/methods-information-benchmark/context-displacement-minimum-real-3d-proof-v1/data.mjs","control-plane/methods-information-benchmark/context-displacement-minimum-real-3d-proof-v1/math.mjs","control-plane/methods-information-benchmark/context-displacement-minimum-real-3d-proof-v1/state.mjs","control-plane/methods-information-benchmark/context-displacement-minimum-real-3d-proof-v1/renderer.mjs","control-plane/methods-information-benchmark/context-displacement-minimum-real-3d-proof-v1/navigation.mjs","control-plane/methods-information-benchmark/context-displacement-minimum-real-3d-proof-v1/app.mjs","control-plane/methods-information-benchmark/context-displacement-minimum-real-3d-proof-v1/proof-contract.v1.json","control-plane/methods-information-benchmark/context-displacement-minimum-real-3d-proof-v1/smaller-corpus.fixture.v1.json","control-plane/methods-information-benchmark/context-displacement-minimum-real-3d-proof-v1/verify.v1.mjs","control-plane/methods-information-benchmark/context-displacement-minimum-real-3d-proof-v1/receipts/builder.receipt.v1.json","control-plane/methods-information-benchmark/context-displacement-minimum-real-3d-proof-v1/receipts/fresh-verifier.receipt.v1.json","control-plane/methods-information-benchmark/context-displacement-minimum-real-3d-proof-v1/receipts/independent-equality.receipt.v1.json","control-plane/methods-information-benchmark/context-displacement-minimum-real-3d-proof-v1/receipts/operation-closure.receipt.v1.json"]'
  PREDECESSOR_OPERATION: METHODS_CONTEXT_DISPLACEMENT_MINIMUM_REAL_3D_PROOF_ROUTER_OWNERSHIP_PREREQUISITE_v1
  PREDECESSOR_SCOPE: METHODS_INFORMATION_BENCHMARK:CONTEXT_DISPLACEMENT:MINIMUM_REAL_3D_PROOF:ROUTER_OWNERSHIP:V1
  PREDECESSOR_GENERATION: '307'
  PREDECESSOR_SCOPE_HASH: 0585d3986d5af6b435b94cfcb57397d63f9698f438ae8dd581f260b32fe92710
  CURRENT_OPERATION: METHODS_CONTEXT_DISPLACEMENT_MINIMUM_REAL_3D_PROOF_ROUTER_PREREQUISITE_POST_MERGE_VALIDATION_LOCK_CLOSURE_AND_PERMANENT_RATIFICATION_v1
  CURRENT_SCOPE: METHODS_INFORMATION_BENCHMARK:CONTEXT_DISPLACEMENT:MINIMUM_REAL_3D_PROOF:ROUTER_OWNERSHIP:POST_MERGE_RATIFICATION:V1
  CURRENT_GENERATION: '312'
  CURRENT_SCOPE_HASH: 865ce45338ade463ee79382a757459005364be15cd2e135d7343798bfa12beb8
  LOCK_REF: refs/heads/operation-locks/repository-operation-intake-v1
  BASE_WORKFLOW_BLOB: 5f5b6317d520ef072c4347b62a179870491d5448
  RECEIPT_PATH: .github/ai-router/projects/methods-information-benchmark/minimum-real-3d-proof-router-prerequisite-permanent-ratification.v1.json
  EXPECTED_BRANCH: ratification/methods-minimum-real-3d-proof-router-prerequisite-v1-001

jobs:
  builder:
    if: github.head_ref == 'ratification/methods-minimum-real-3d-proof-router-prerequisite-v1-001'
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify routes and close predecessor lock
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$BASE_SHA" = "$GOVERNING_MAIN"
          git merge-base --is-ancestor "$SOURCE_MERGE" "$BASE_SHA"
          mkdir -p /tmp/builder
          node tools/repository-ai-entry-router.mjs --self-test --output /tmp/builder/router.json
          node --input-type=module <<'NODE'
          import fs from'node:fs';import crypto from'node:crypto';
          const expected=JSON.parse(process.env.EXPECTED_PATHS_JSON).sort();
          const entry=JSON.parse(fs.readFileSync('.github/ai-router/projects/methods-information-benchmark/entrypoint.v1.json'));
          const p=entry.procedures?.contextDisplacementMinimumReal3DProof,a=[...(p?.exactDestinationPaths??[])].sort();
          if(expected.length!==17||JSON.stringify(a)!==JSON.stringify(expected)||(entry.ownedPathPrefixes??[]).length)throw Error('ROUTE_STATE_MISMATCH');
          if(p.architectureFingerprint!==process.env.ARCHITECTURE_FINGERPRINT||p.rejectedVisualSubject!==process.env.REJECTED_VISUAL)throw Error('BOUND_IDENTITY_MISMATCH');
          if(![p.persistentWebGL2Required,p.directManipulationRequired,p.lawfulCameraAndSettlementRequired,p.exactReturnRequired,p.threePersistentLensExpressionsRequired].every(Boolean))throw Error('RUNTIME_CONTRACT_INCOMPLETE');
          const r=JSON.parse(fs.readFileSync('/tmp/builder/router.json'));if(!String(r.result??'').startsWith('PASS'))throw Error('ROUTER_SELF_TEST_FAILED');
          fs.writeFileSync('/tmp/builder/route.json',JSON.stringify({result:'PASS',paths:expected},null,2)+'\n');
          NODE
          node tools/operation-intake/repository-operation-lock-manager.v1.mjs --action close --repository "$REPOSITORY" --lock-ref "$LOCK_REF" --operation-id "$PREDECESSOR_OPERATION" --lock-scope "$PREDECESSOR_SCOPE" --lock-generation "$PREDECESSOR_GENERATION" --terminal-disposition PASS_CLOSED --output /tmp/builder/closure.json
          node --input-type=module <<'NODE'
          import fs from'node:fs';import crypto from'node:crypto';
          const stable=v=>Array.isArray(v)?v.map(stable):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,stable(v[k])])):v;
          const c=JSON.parse(fs.readFileSync('/tmp/builder/closure.json'));if(c.result!=='TERMINAL_CLOSURE_COMMITTED'||!c.lockReleased||c.lockGeneration!==307||c.scopeHash!==process.env.PREDECESSOR_SCOPE_HASH||c.terminalDisposition!=='PASS_CLOSED')throw Error('LOCK_307_CLOSURE_INVALID');
          const paths=JSON.parse(fs.readFileSync('/tmp/builder/route.json')).paths;
          const domain=stable({governingMainHead:process.env.GOVERNING_MAIN,sourcePr:642,sourceCandidateHead:process.env.SOURCE_CANDIDATE,mergeCommit:process.env.SOURCE_MERGE,architectureFingerprint:process.env.ARCHITECTURE_FINGERPRINT,registeredExactPaths:paths,predecessorLockClosure:{operationId:process.env.PREDECESSOR_OPERATION,lockScope:process.env.PREDECESSOR_SCOPE,scopeHash:process.env.PREDECESSOR_SCOPE_HASH,lockGeneration:307,terminalDisposition:'PASS_CLOSED',lockReleased:true},validation:{routerSelfTest:'PASS',routeCount:17,prefixWideOwnership:false,rejectedVisualFoundationExcluded:true,persistentWebGL2Bound:true,directManipulationBound:true,exactReturnBound:true,threePersistentLensesBound:true},authority:{targetProofExecuted:false,methodsPageMutation:false,compassMutation:false,hEarthMutation:false,publicMutation:false,mergeAuthorized:false}});
          const fingerprint=crypto.createHash('sha256').update(JSON.stringify(domain)).digest('hex');
          fs.writeFileSync('/tmp/builder/builder.json',JSON.stringify({schema:'METHODS_MINIMUM_REAL_3D_PROOF_ROUTER_RATIFICATION_BUILDER_RECEIPT_v1',result:'PASS',domain,fingerprint,predecessorClosureCommitSha:c.closureCommitSha},null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with: {name: methods-proof-router-ratification-builder-v1, path: /tmp/builder/, if-no-files-found: error, retention-days: 90}

  verifier-finalize:
    needs: builder
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BRANCH_NAME: ${{ github.head_ref }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with: {name: methods-proof-router-ratification-builder-v1, path: /tmp/final/builder}
      - name: Independently reproduce and materialize final candidate
        run: |
          set -euo pipefail
          test "$BRANCH_NAME" = "$EXPECTED_BRANCH"
          test "$BASE_SHA" = "$GOVERNING_MAIN"
          mkdir -p /tmp/final/output
          node tools/repository-ai-entry-router.mjs --self-test --output /tmp/final/router.json
          git fetch origin operation-locks/repository-operation-intake-v1
          git show origin/operation-locks/repository-operation-intake-v1:.github/operation-intake/active-operation-ledger.v1.json > /tmp/final/ledger.json
          node --input-type=module <<'NODE'
          import fs from'node:fs';import crypto from'node:crypto';
          const stable=v=>Array.isArray(v)?v.map(stable):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,stable(v[k])])):v;
          const expected=JSON.parse(process.env.EXPECTED_PATHS_JSON).sort(),entry=JSON.parse(fs.readFileSync('.github/ai-router/projects/methods-information-benchmark/entrypoint.v1.json')),p=entry.procedures?.contextDisplacementMinimumReal3DProof,a=[...(p?.exactDestinationPaths??[])].sort();
          if(expected.length!==17||JSON.stringify(a)!==JSON.stringify(expected)||(entry.ownedPathPrefixes??[]).length)throw Error('FRESH_ROUTE_STATE_MISMATCH');
          if(p.architectureFingerprint!==process.env.ARCHITECTURE_FINGERPRINT||p.rejectedVisualSubject!==process.env.REJECTED_VISUAL)throw Error('FRESH_IDENTITY_MISMATCH');
          const r=JSON.parse(fs.readFileSync('/tmp/final/router.json'));if(!String(r.result??'').startsWith('PASS'))throw Error('FRESH_ROUTER_SELF_TEST_FAILED');
          const ledger=JSON.parse(fs.readFileSync('/tmp/final/ledger.json')),t=(ledger.terminalHistory??[]).find(x=>x.operationId===process.env.PREDECESSOR_OPERATION&&x.lockGeneration===307);
          if(!t||!t.released||t.terminalDisposition!=='PASS_CLOSED'||t.scopeHash!==process.env.PREDECESSOR_SCOPE_HASH)throw Error('FRESH_LOCK_307_CLOSURE_MISSING');
          const domain=stable({governingMainHead:process.env.GOVERNING_MAIN,sourcePr:642,sourceCandidateHead:process.env.SOURCE_CANDIDATE,mergeCommit:process.env.SOURCE_MERGE,architectureFingerprint:process.env.ARCHITECTURE_FINGERPRINT,registeredExactPaths:expected,predecessorLockClosure:{operationId:process.env.PREDECESSOR_OPERATION,lockScope:process.env.PREDECESSOR_SCOPE,scopeHash:process.env.PREDECESSOR_SCOPE_HASH,lockGeneration:307,terminalDisposition:'PASS_CLOSED',lockReleased:true},validation:{routerSelfTest:'PASS',routeCount:17,prefixWideOwnership:false,rejectedVisualFoundationExcluded:true,persistentWebGL2Bound:true,directManipulationBound:true,exactReturnBound:true,threePersistentLensesBound:true},authority:{targetProofExecuted:false,methodsPageMutation:false,compassMutation:false,hEarthMutation:false,publicMutation:false,mergeAuthorized:false}});
          const fingerprint=crypto.createHash('sha256').update(JSON.stringify(domain)).digest('hex'),b=JSON.parse(fs.readFileSync('/tmp/final/builder/builder.json'));
          if(b.result!=='PASS'||b.fingerprint!==fingerprint||JSON.stringify(b.domain)!==JSON.stringify(domain))throw Error('BUILDER_FRESH_MISMATCH');
          const receipt={schema:'METHODS_MINIMUM_REAL_3D_PROOF_ROUTER_PREREQUISITE_PERMANENT_RATIFICATION_RECEIPT_v1',status:'RATIFICATION_CANDIDATE_VERIFIED_PASS_CLOSED',governingMainHead:process.env.GOVERNING_MAIN,sourceIssue:641,sourcePr:642,sourceCandidateHead:process.env.SOURCE_CANDIDATE,sourceMergeCommit:process.env.SOURCE_MERGE,architectureFingerprint:process.env.ARCHITECTURE_FINGERPRINT,registeredExactPathCount:17,prefixWideOwnership:false,rejectedVisualSubject:process.env.REJECTED_VISUAL,rejectedVisualFoundationExcluded:true,predecessorLock:{operationId:process.env.PREDECESSOR_OPERATION,lockScope:process.env.PREDECESSOR_SCOPE,scopeHash:process.env.PREDECESSOR_SCOPE_HASH,lockGeneration:307,terminalDisposition:'PASS_CLOSED',lockReleased:true,closureCommitSha:b.predecessorClosureCommitSha},ratificationOperation:{operationId:process.env.CURRENT_OPERATION,lockScope:process.env.CURRENT_SCOPE,scopeHash:process.env.CURRENT_SCOPE_HASH,lockGeneration:312,terminalClosureRequiredAfterCandidateCommit:true},builderFingerprint:fingerprint,freshVerifierFingerprint:fingerprint,exactNormalizedEquality:true,validationWorkflowRun:Number(process.env.RUN_ID),finalCandidateScope:{changedPathCount:1,changedPath:process.env.RECEIPT_PATH,workflowRestoredToBlob:process.env.BASE_WORKFLOW_BLOB},authorityBoundaries:{targetMinimumReal3DProofExecuted:false,methodsPageMutation:false,compassMutation:false,hEarthMutation:false,publicOrVisualMutation:false,deploymentOrRelease:false,mergeAuthorized:false,namedAwardReadinessClaim:false},permanentEffectCondition:'EFFECTIVE_ONLY_AFTER_THIS_CANDIDATE_IS_MERGED_AND_MAIN_VALIDATION_PASSES'};
          const text=JSON.stringify(receipt,null,2)+'\n',h={Accept:'application/vnd.github+json',Authorization:`Bearer ${process.env.GITHUB_TOKEN}`,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},api=`https://api.github.com/repos/${process.env.REPOSITORY}`,req=async(url,opts={},ok=[200])=>{const x=await fetch(url,{...opts,headers:{...h,...opts.headers}}),s=await x.text();let y;try{y=s?JSON.parse(s):null}catch{y={raw:s}}if(!ok.includes(x.status))throw Error(`API_${x.status}:${JSON.stringify(y)}`);return y};
          const blob=await req(`${api}/git/blobs`,{method:'POST',body:JSON.stringify({content:text,encoding:'utf-8'})},[201]),base=await req(`${api}/git/commits/${process.env.HEAD_SHA}`),tree=await req(`${api}/git/trees`,{method:'POST',body:JSON.stringify({base_tree:base.tree.sha,tree:[{path:process.env.RECEIPT_PATH,mode:'100644',type:'blob',sha:blob.sha},{path:'.github/workflows/repository-operation-intake-validation.yml',mode:'100644',type:'blob',sha:process.env.BASE_WORKFLOW_BLOB}]})},[201]),commit=await req(`${api}/git/commits`,{method:'POST',body:JSON.stringify({message:'Ratify Methods minimum real 3D proof router prerequisite',tree:tree.sha,parents:[process.env.HEAD_SHA]})},[201]);
          await req(`${api}/git/refs/heads/${encodeURIComponent(process.env.BRANCH_NAME)}`,{method:'PATCH',body:JSON.stringify({sha:commit.sha,force:false})});
          fs.writeFileSync('/tmp/final/output/permanent-ratification-receipt.json',text);fs.writeFileSync('/tmp/final/output/final-candidate.json',JSON.stringify({result:'PASS',candidateHead:commit.sha,receiptBlob:blob.sha,tree:tree.sha,workflowRestoredBlob:process.env.BASE_WORKFLOW_BLOB},null,2)+'\n');
          NODE
          node tools/operation-intake/repository-operation-lock-manager.v1.mjs --action close --repository "$REPOSITORY" --lock-ref "$LOCK_REF" --operation-id "$CURRENT_OPERATION" --lock-scope "$CURRENT_SCOPE" --lock-generation "$CURRENT_GENERATION" --terminal-disposition PASS_CLOSED --output /tmp/final/output/current-operation-closure.json
          node --input-type=module <<'NODE'
          import fs from'node:fs';const c=JSON.parse(fs.readFileSync('/tmp/final/output/current-operation-closure.json'));if(c.result!=='TERMINAL_CLOSURE_COMMITTED'||!c.lockReleased||c.lockGeneration!==312||c.scopeHash!==process.env.CURRENT_SCOPE_HASH||c.terminalDisposition!=='PASS_CLOSED')throw Error('LOCK_312_CLOSURE_INVALID');
          NODE
      - uses: actions/upload-artifact@v4
        with: {name: methods-proof-router-ratification-final-v1, path: /tmp/final/output/, if-no-files-found: error, retention-days: 90}
