name: FAP1 GC Reconciliation Bootstrap Diagnostic v3
on:
  pull_request:
    paths: ['.github/workflows/fap1-gc-w5-body-visual-qualification-v1.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2651bcba5c1071153914e6abb722d19aa778a051
      - id: chrome
        uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --no-package-lock puppeteer-core@24.15.0
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          for a in $(seq 1 120); do curl -fsS http://127.0.0.1:4173/showroom/globe/audralia/ >/dev/null && exit 0; sleep .25; done; exit 1
      - name: Trace reconciliation bootstrap without readiness wait
        timeout-minutes: 2
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          timeout 105s node <<'NODE'
          const puppeteer=require('puppeteer-core'),fs=require('fs');
          const events=[];
          const mark=(name,data={})=>{const row={t:Date.now(),name,data};events.push(row);console.log('BOOT',JSON.stringify(row));};
          const snapshot=async page=>page.evaluate(()=>{
            const g=window.__AUDRALIA_WEATHER_PRESENTATION_RECONCILIATION__;
            const e=window.__AUDRALIA_WEATHER_PRESENTATION_RECONCILIATION_ERROR__;
            return {
              globalExists:!!g,
              globalKeys:g?Object.keys(g):[],
              rendererExists:!!g?.renderer,
              error:e||null,
              status:document.querySelector('[data-h-earth-status]')?.dataset?.status||null,
              statusText:document.querySelector('[data-h-earth-status]')?.textContent||null,
              loaderStage:document.querySelector('[data-audralia-loader-stage]')?.textContent||null,
              mapCanvas:!!document.querySelector('[data-h-earth-map-wide-canvas]')
            };
          });
          (async()=>{
            mark('BROWSER_LAUNCH_BEGIN');
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:'new',args:['--no-sandbox','--ignore-gpu-blocklist','--enable-webgl','--use-gl=angle','--use-angle=swiftshader']});
            mark('BROWSER_LAUNCH_RETURN');
            const page=await browser.newPage();await page.setViewport({width:900,height:900});
            const consoleRows=[],pageErrors=[];
            page.on('console',m=>{const row={type:m.type(),text:m.text()};consoleRows.push(row);console.log('PAGE_CONSOLE',JSON.stringify(row));});
            page.on('pageerror',e=>{const row={message:String(e),stack:e?.stack||null};pageErrors.push(row);console.log('PAGE_ERROR',JSON.stringify(row));});
            page.on('requestfailed',r=>console.log('REQUEST_FAILED',JSON.stringify({url:r.url(),failure:r.failure()})));

            mark('PAGE_LOAD_BEGIN');
            await page.goto('http://127.0.0.1:4173/showroom/globe/audralia/',{waitUntil:'domcontentloaded',timeout:45000});
            mark('PAGE_LOAD_RETURN',await snapshot(page));

            mark('APP_IMPORT_BEGIN');
            const importResult=await page.evaluate(async()=>{
              try{
                const m=await import('./weather-presentation-reconciliation/app.mjs?diag=bootstrap-v3');
                return {ok:true,exports:Object.keys(m)};
              }catch(e){return {ok:false,message:e instanceof Error?e.message:String(e),stack:e instanceof Error?e.stack:null};}
            });
            mark('APP_IMPORT_RETURN',importResult);
            mark('POST_IMPORT_IMMEDIATE',await snapshot(page));

            await new Promise(r=>setTimeout(r,1000));
            mark('POST_IMPORT_1S',await snapshot(page));
            await new Promise(r=>setTimeout(r,4000));
            mark('POST_IMPORT_5S',await snapshot(page));

            const moduleProbe=await page.evaluate(async()=>{
              const out={};
              try{const r=await import('../../h-earth/terrain-estate-construction-v1/renderer.mjs?diag=bootstrap-v3');out.rendererModule={ok:true,exports:Object.keys(r)};}catch(e){out.rendererModule={ok:false,message:e instanceof Error?e.message:String(e),stack:e instanceof Error?e.stack:null};}
              try{const w=await import('./weather-presentation-reconciliation/fap1-gpu-weather-descriptors.mjs?diag=bootstrap-v3');out.fap1DescriptorModule={ok:true,exports:Object.keys(w)};}catch(e){out.fap1DescriptorModule={ok:false,message:e instanceof Error?e.message:String(e),stack:e instanceof Error?e.stack:null};}
              return out;
            });
            mark('DEPENDENCY_IMPORT_PROBE',moduleProbe);

            const finalState=await snapshot(page);mark('FINAL_STATE',finalState);
            fs.writeFileSync('reconciliation-bootstrap-diagnostic.json',JSON.stringify({events,consoleRows,pageErrors,finalState,moduleProbe},null,2));
            await browser.close();mark('DONE');
          })().catch(e=>{console.error('BOOT_DIAG_ERROR',e);try{fs.writeFileSync('reconciliation-bootstrap-diagnostic.json',JSON.stringify({events,fatal:{message:String(e),stack:e?.stack||null}},null,2));}catch{}process.exit(1);});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reconciliation-bootstrap-diagnostic
          path: reconciliation-bootstrap-diagnostic.json
          if-no-files-found: warn
