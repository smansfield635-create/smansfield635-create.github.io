name: H-Earth Automatic Repository Registry Preflight

on:
  pull_request:
    paths:
      - 'h-earth-3d/**'
      - '!h-earth-3d/registry/**'
      - '!h-earth-3d/AGENTS.md'
      - 'showroom/globe/h-earth/**'
      - '!showroom/globe/h-earth/AGENTS.md'
  push:
    paths:
      - 'h-earth-3d/**'
      - '!h-earth-3d/registry/**'
      - '!h-earth-3d/AGENTS.md'
      - 'showroom/globe/h-earth/**'
      - '!showroom/globe/h-earth/AGENTS.md'
      - '.github/workflows/h-earth-repository-registry-preflight.yml'

permissions:
  contents: read

jobs:
  automatic-h-earth-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover changed governed H-Earth paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          CARRIER_BRANCH: verification/h-earth-hc00-accepted-occurrence-closure-v1-001
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "$CARRIER_BRANCH" ]]; then
            cat > /tmp/h-earth-changed-paths.txt <<'PATHS'
          h-earth-3d/control-plane/live-experience-maturity-convergence/AGENTS.md
          h-earth-3d/control-plane/live-experience-maturity-convergence/authority-and-lineage.v1.json
          h-earth-3d/control-plane/live-experience-maturity-convergence/changed-path-manifest.v1.json
          h-earth-3d/control-plane/live-experience-maturity-convergence/checkpoint-registry.v1.json
          h-earth-3d/control-plane/live-experience-maturity-convergence/construction-procedure.v1.json
          h-earth-3d/control-plane/live-experience-maturity-convergence/current-state.v1.json
          h-earth-3d/control-plane/live-experience-maturity-convergence/operation-request.v1.json
          h-earth-3d/control-plane/live-experience-maturity-convergence/page-excellence-binding.v1.json
          h-earth-3d/control-plane/live-experience-maturity-convergence/program.locator.v1.json
          h-earth-3d/control-plane/live-experience-maturity-convergence/protected-runtime-manifest.v1.json
          h-earth-3d/control-plane/live-experience-maturity-convergence/shell-runtime-classification.schema.v1.json
          h-earth-3d/control-plane/live-experience-maturity-convergence/strategy-contract.v1.json
          h-earth-3d/control-plane/live-experience-maturity-convergence/successor-room-recovery.v1.json
          h-earth-3d/control-plane/live-experience-maturity-convergence/verification-contract.v1.json
          h-earth-3d/control-plane/live-experience-maturity-convergence/verify.v1.mjs
          PATHS
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/all-changed-paths.txt
            grep -E '^(h-earth-3d/|showroom/globe/h-earth/)' /tmp/all-changed-paths.txt \
              | grep -Ev '^(h-earth-3d/registry/|h-earth-3d/AGENTS\.md$|showroom/globe/h-earth/AGENTS\.md$)' \
              | sort -u > /tmp/h-earth-changed-paths.txt || true
          elif [[ -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" > /tmp/all-changed-paths.txt
            grep -E '^(h-earth-3d/|showroom/globe/h-earth/)' /tmp/all-changed-paths.txt \
              | grep -Ev '^(h-earth-3d/registry/|h-earth-3d/AGENTS\.md$|showroom/globe/h-earth/AGENTS\.md$)' \
              | sort -u > /tmp/h-earth-changed-paths.txt || true
          else
            git show --pretty='' --name-only "$CURRENT_SHA" > /tmp/all-changed-paths.txt
            grep -E '^(h-earth-3d/|showroom/globe/h-earth/)' /tmp/all-changed-paths.txt \
              | grep -Ev '^(h-earth-3d/registry/|h-earth-3d/AGENTS\.md$|showroom/globe/h-earth/AGENTS\.md$)' \
              | sort -u > /tmp/h-earth-changed-paths.txt || true
          fi
          cat /tmp/h-earth-changed-paths.txt

      - name: Execute automatic H-Earth registry preflight
        run: |
          node --experimental-default-type=module \
            tools/h-earth-repository-registry-auto-preflight.mjs \
            --paths-file /tmp/h-earth-changed-paths.txt \
            --task "HC00 authoritative accepted-occurrence fresh execution carrier" \
            --mutation-intent \
            --output /tmp/h-earth-automatic-preflight-receipt.json

      - name: Verify exact closure blobs and accepted occurrences
        if: github.event_name == 'push' && github.ref_name == 'verification/h-earth-hc00-accepted-occurrence-closure-v1-001'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.live-experience-maturity-convergence-accepted-occurrences.js)" = "975cd4b4d3689c74cccdadd10be2b53b3d3ed6c2"
          test "$(git rev-parse HEAD:h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.pre-live-experience-maturity-convergence-accepted-occurrences.js)" = "fed80a221d03d6d18be29153391e3f46c07ebb11"
          test "$(git rev-parse HEAD:h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js)" = "471e8edbe0b498d4e458e7c75bbf1006be94af21"
          node --experimental-default-type=module --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            H_EARTH_LIVE_EXPERIENCE_MATURITY_CONVERGENCE_ACCEPTED_PATHS as paths,
            H_EARTH_LIVE_EXPERIENCE_MATURITY_CONVERGENCE_ACCEPTED_OCCURRENCES as occurrences,
            verifyHEarthLiveExperienceMaturityConvergenceAcceptedOccurrences as verify
          } from './h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.live-experience-maturity-convergence-accepted-occurrences.js';
          import {loadHEarthRepositoryRegistryValidatorDependencies as load} from './h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js';
          const v=verify();
          const d=load();
          const preflight=JSON.parse(fs.readFileSync('/tmp/h-earth-automatic-preflight-receipt.json','utf8'));
          const acceptedNode='H_EARTH_LIVE_EXPERIENCE_MATURITY_CONVERGENCE_ACCEPTED_OCCURRENCES';
          const classifications=preflight?.pathClassification?.classifications ?? [];
          const pass =
            v.eligible === true &&
            d.identityVerified === true &&
            paths.length === 15 &&
            occurrences.length === 15 &&
            occurrences.every(o => o.commitSha === '38da390a802c25a615366c6f896d7501558c0811' && o.refName === '38da390a802c25a615366c6f896d7501558c0811' && o.existenceStatus === 'PRESENT' && /^[0-9a-f]{40}$/.test(o.gitBlobSha)) &&
            v.pathChecks.every(x => x.acceptedOccurrenceExact === true && x.historicalReservationPreserved === true && x.pass === true) &&
            v.checks.historicalCandidateReservationEligible === true &&
            classifications.length === 15 &&
            classifications.every(x => x.registered === true && x.resolvedNodeIds.includes(acceptedNode)) &&
            (preflight?.validatorReceipt?.failureCodes ?? []).length === 0 &&
            !['BLOCK','STOP'].includes(preflight.finalDisposition);
          const summary={
            schema:'H_EARTH_LIVE_EXPERIENCE_ACCEPTED_OCCURRENCE_FRESH_EXECUTION_RECEIPT_v1',
            result:pass?'PASS':'FAIL_CLOSED',
            candidateRegistryBlobs:{
              acceptedOccurrenceFacade:'975cd4b4d3689c74cccdadd10be2b53b3d3ed6c2',
              delegatedBaseLoader:'fed80a221d03d6d18be29153391e3f46c07ebb11',
              successorLoader:'471e8edbe0b498d4e458e7c75bbf1006be94af21'
            },
            pathCount:paths.length,
            acceptedOccurrenceCount:occurrences.length,
            allPresentAtAuthoritativeMain:occurrences.every(o=>o.commitSha==='38da390a802c25a615366c6f896d7501558c0811'&&o.existenceStatus==='PRESENT'),
            exactBlobIdentities:v.checks.exactBlobIdentities,
            historicalCandidateReservationEligible:v.checks.historicalCandidateReservationEligible,
            historicalReservationPreserved:v.pathChecks.every(x=>x.historicalReservationPreserved===true),
            allPathsResolveToAcceptedNode:classifications.length===15&&classifications.every(x=>x.resolvedNodeIds.includes(acceptedNode)),
            loaderIdentityVerified:d.identityVerified,
            preflightFinalDisposition:preflight.finalDisposition,
            preflightFailureCodes:preflight?.validatorReceipt?.failureCodes ?? [],
            mutationMayProceed:preflight.mutationMayProceed,
            productMutationAuthorityCreated:false,
            mergeAuthorityCreated:false,
            g1g2AuthorityCreated:false
          };
          fs.writeFileSync('/tmp/h-earth-live-experience-accepted-occurrence-verification.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify(summary,null,2));
          if(!pass) process.exit(1);
          NODE

      - name: Upload deterministic preflight receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-automatic-preflight-receipt
          path: |
            /tmp/h-earth-automatic-preflight-receipt.json
            /tmp/h-earth-live-experience-accepted-occurrence-verification.json
          if-no-files-found: error
          retention-days: 30
