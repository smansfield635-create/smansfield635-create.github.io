name: H-Earth Run 8E R3E3 Public Runtime Authority Exclusivity

on:
  push:
    branches:
      - agent/h-earth-run8e-r3e3-public-runtime-authority-exclusivity-001
  pull_request:
    branches:
      - agent/h-earth-run8e-r3e2-public-live-gpu-composition-001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-run8e-r3e3-public-runtime-authority-exclusivity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      H_EARTH_RUN8E_R3E3_URL: http://127.0.0.1:4173/showroom/globe/h-earth/
      H_EARTH_RUN8E_R3E3_OUTPUT: /tmp/h-earth-run8e-r3e3
    steps:
      - name: Check out exact R3E3 event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact R3E2 base and protected runtime identities
        run: |
          set -euo pipefail
          git fetch origin agent/h-earth-run8e-r3e2-public-live-gpu-composition-001
          test "$(git merge-base HEAD origin/agent/h-earth-run8e-r3e2-public-live-gpu-composition-001)" = "2017755b4c0186ef546774c3cfefe57b0e9c3199"
          test "$(git hash-object showroom/globe/h-earth/index.html)" = "0daedf61f7e19af095f4db5fc47563a9cd786837"
          test "$(git hash-object showroom/globe/h-earth/functional-landscape/public-live-gpu-integration.run8e-r3e.js)" = "2b0a916b3a6d11da84316925f8abd8a3a1447445"
          test "$(git hash-object showroom/globe/h-earth/functional-landscape/index.js)" = "83e85df2f4440c2825672f46fb16e28c73992db2"
          test "$(git hash-object showroom/globe/h-earth/functional-landscape/environment-integration.js)" = "6c047d61544fcbc4fad8673abfbacb7c827fdb22"
          test "$(git hash-object showroom/globe/h-earth/functional-landscape/direct-manipulation.js)" = "322ee2bfed5184acd8eac600f19abd72380b6c2b"
          test "$(git hash-object showroom/globe/h-earth/functional-landscape/navigation.js)" = "8ab3446c536fc24423d5601acce232b19fa71c91"
          test "$(git hash-object showroom/globe/h-earth/render/live-renderer-contract.run8e-r3a.js)" = "4e187fc38780dfb2020482b674ac331f5a65b2c1"
          test "$(git hash-object showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.js)" = "b8b3c713d5f0b7c79808e8942ce385887589d880"
          test "$(git hash-object showroom/globe/h-earth/diagnostic/run8e-r3d/pointer-touch-intake.js)" = "bb96858fec09d14bbe10aa9ffa8a7f07af3621e6"
          test "$(git hash-object showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js)" = "5017bbaf857a644287cb829037b0fde4646f270d"
          test "$(git hash-object h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3e2.pass-closed.receipt.json)" = "e33405c5e7f600e59a6b1103fd856a1d37ca51c5"

      - name: Verify R3E3 syntax and zero public-source delta
        run: |
          set -euo pipefail
          node --check h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3.live-gpu-presentation-recovery.js
          node --check h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3e3.public-runtime-authority-exclusivity.js
          node --check h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.run8e-r3e3-public-runtime-authority-exclusivity.js
          node --check h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js
          node --check h-earth-3d/validation/h-earth.run8e-r3e3.public-runtime-authority-exclusivity.harness.mjs
          if test -f h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3e3.pass-closed.receipt.json; then
            node -e "JSON.parse(require('fs').readFileSync('h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3e3.pass-closed.receipt.json','utf8'))"
          fi
          ! git diff --name-only 2017755b4c0186ef546774c3cfefe57b0e9c3199...HEAD | grep -q '^showroom/'

      - name: Install bounded Chromium dependency
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Start branch-local public route server
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/h-earth-run8e-r3e3-server.log 2>&1 &
          echo $! >/tmp/h-earth-run8e-r3e3-server.pid
          for attempt in $(seq 1 30); do
            if curl --silent --fail "$H_EARTH_RUN8E_R3E3_URL" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/h-earth-run8e-r3e3-server.log
          exit 1

      - name: Execute public runtime authority-exclusivity browser audit
        run: |
          set -o pipefail
          mkdir -p "$H_EARTH_RUN8E_R3E3_OUTPUT"
          node h-earth-3d/validation/h-earth.run8e-r3e3.public-runtime-authority-exclusivity.harness.mjs \
            2>&1 | tee "$H_EARTH_RUN8E_R3E3_OUTPUT/h-earth.run8e-r3e3.browser-execution.log"

      - name: Execute automatic repository-registry preflight
        run: |
          set -euo pipefail
          git diff --name-only 2017755b4c0186ef546774c3cfefe57b0e9c3199...HEAD \
            | grep -E '^(h-earth-3d/|showroom/globe/h-earth/)' \
            | sort -u > /tmp/h-earth-run8e-r3e3-governed-paths.txt || true
          node --experimental-default-type=module \
            tools/h-earth-repository-registry-auto-preflight.mjs \
            --paths-file /tmp/h-earth-run8e-r3e3-governed-paths.txt \
            --task "Run 8E R3E3 public runtime authority exclusivity execution" \
            --mutation-intent \
            --output "$H_EARTH_RUN8E_R3E3_OUTPUT/h-earth.run8e-r3e3.automatic-preflight.receipt.json"
          node - <<'NODE'
          const receipt = require('/tmp/h-earth-run8e-r3e3/h-earth.run8e-r3e3.automatic-preflight.receipt.json');
          if (receipt.finalDisposition !== 'PASS') throw new Error(`R3E3_AUTOMATIC_PREFLIGHT_NOT_PASS:${receipt.finalDisposition}`);
          NODE

      - name: Verify exact scope and R3E4 stopping boundary
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only 2017755b4c0186ef546774c3cfefe57b0e9c3199...HEAD | sort > "$H_EARTH_RUN8E_R3E3_OUTPUT/r3e3-changed-paths.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = {line.strip() for line in Path('/tmp/h-earth-run8e-r3e3/r3e3-changed-paths.txt').read_text().splitlines() if line.strip()}
          required = {
            '.github/workflows/h-earth-run8e-r3e3-public-runtime-authority-exclusivity.yml',
            'h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3.live-gpu-presentation-recovery.js',
            'h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3e3.public-runtime-authority-exclusivity.js',
            'h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.run8e-r3e3-public-runtime-authority-exclusivity.js',
            'h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js',
            'h-earth-3d/validation/h-earth.run8e-r3e3.public-runtime-authority-exclusivity.harness.mjs'
          }
          optional = {'h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3e3.pass-closed.receipt.json'}
          missing = sorted(required - paths)
          unexpected = sorted(paths - required - optional)
          if missing: raise SystemExit(f'R3E3_REQUIRED_PATHS_MISSING:{missing}')
          if unexpected: raise SystemExit(f'R3E3_UNEXPECTED_PATHS:{unexpected}')
          if any(path.startswith('showroom/') for path in paths): raise SystemExit('R3E3_SHOWROOM_MUTATION_OBSERVED')
          receipt = json.loads(Path('/tmp/h-earth-run8e-r3e3/h-earth.run8e-r3e3.public-runtime-authority-exclusivity.execution.receipt.json').read_text())
          if receipt['eligible'] is not True or receipt['status'] != 'RUN_8E_R3E3_EXECUTION_PASS': raise SystemExit('R3E3_EXECUTION_RECEIPT_INVALID')
          if receipt['totals']['documentLoadCount'] != 2: raise SystemExit('R3E3_DOCUMENT_LOAD_COUNT_INVALID')
          if receipt['totals']['totalWebGL2ContextCount'] != 2 or receipt['totals']['totalCanvas2DContextCount'] != 0: raise SystemExit('R3E3_CONTEXT_TOTALS_INVALID')
          if receipt['totals']['totalCanvasInputListenerCount'] != 12: raise SystemExit('R3E3_LISTENER_TOTAL_INVALID')
          if receipt['totals']['totalLegacyModuleRequestCount'] != 0 or receipt['totals']['totalAppOwnedDeferredExecutionCount'] != 0: raise SystemExit('R3E3_OBSOLETE_OWNER_ACTIVITY')
          if receipt['stoppingBoundary'] != 'STOP_BEFORE_PUBLIC_DIRECT_MANIPULATION_ACCEPTANCE_R3E4': raise SystemExit('R3E3_STOPPING_BOUNDARY_MISMATCH')
          if any(receipt['boundaries'].values()): raise SystemExit('R3E3_BOUNDARY_VIOLATION')
          PY

      - name: Upload R3E3 authority-exclusivity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-run8e-r3e3-public-runtime-authority-exclusivity-evidence
          path: |
            /tmp/h-earth-run8e-r3e3
            /tmp/h-earth-run8e-r3e3-server.log
            /tmp/h-earth-run8e-r3e3-governed-paths.txt
          if-no-files-found: warn
          retention-days: 90
