name: Compass Engineering + Experience Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/compass/**'
      - '.github/ai-router/projects/compass/**'
      - '.github/workflows/compass-display-continuity-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPASS_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  COMPASS_GOVERNING_HEAD: cfd1924c485893dedeeb2fd1fefcb91c521d7c2a
  COMPASS_EXPERIENCE_OUTPUT: /tmp/compass-experience-consolidation-receipt.json
  COMPASS_EXPERIENCE_CAPTURE_INPUT: /tmp/compass-experience-capture-receipt.json

jobs:
  engineering-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMPASS_CANDIDATE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact candidate and protected engineering floor
        run: |
          test "$(git rev-parse HEAD^{commit})" = "$COMPASS_CANDIDATE_HEAD"
          node --check assets/compass/compass.controller.js
          node --check assets/compass/compass.crystals.js
          node --check assets/compass/compass.cosmos.js
          node --check assets/compass/compass.mirrorland-window.js
          node --check assets/compass/compass.laws-spacecraft.js
          node --check assets/compass/compass.identity-3d.js
          node --check assets/compass/compass.statement-carousel.js
          node --check assets/compass/compass.capability-carousel.js
          node --check assets/compass/compass.brain-scene.js
          node --check .github/ai-router/projects/compass/verify-experience-consolidation.v1.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import cp from 'node:child_process';
          const base=process.env.COMPASS_GOVERNING_HEAD;
          const protectedPaths=[
            'assets/compass/compass.controller.js','assets/compass/compass.crystals.js','assets/compass/compass.cosmos.js',
            'assets/compass/compass.mirrorland-window.js','assets/compass/compass.laws-spacecraft.js','assets/compass/compass.identity-3d.js',
            'assets/compass/compass.statement-carousel.js','assets/compass/compass.capability-carousel.js','assets/compass/compass.brain.js','assets/compass/compass.brain-scene.js'
          ];
          const changed=cp.execFileSync('git',['diff','--name-only',`${base}...HEAD`],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const mutatedProtected=protectedPaths.filter(p=>changed.includes(p));
          const c=fs.readFileSync('assets/compass/compass.controller.js','utf8');
          const x=fs.readFileSync('assets/compass/compass.crystals.js','utf8');
          const s=fs.readFileSync('assets/compass/compass.laws-spacecraft.js','utf8');
          const i=fs.readFileSync('assets/compass/compass.identity-3d.js','utf8');
          const p=fs.readFileSync('assets/compass/compass.statement-carousel.js','utf8');
          const checks={
            exactHead:cp.execFileSync('git',['rev-parse','HEAD^{commit}'],{encoding:'utf8'}).trim()===process.env.COMPASS_CANDIDATE_HEAD,
            protectedRuntimeUnchanged:mutatedProtected.length===0,
            roomSelectedDeclared:c.includes('ROOM_SELECTED'),
            roomSelectedManipulable:/manipulationStates\s*:\s*Object\.freeze\(\[\s*STATES\.CLUSTER_OPEN,\s*STATES\.ROOM_SELECTED/s.test(c),
            crystalsRoomSelected:x.includes('ROOM_SELECTED'),
            lawsSpacecraftOnly:s.includes('DGB_COMPASS_DISABLE_LOCAL_SPACECRAFT=true')&&s.includes("import('/laws/index.spacecraft.background.js"),
            identitySpacecraftRemoved:!i.includes('mountLawsCraft')&&!i.includes('createCraftCanvas')&&i.includes('spacecraftMounted:false'),
            identityPreserved:i.includes('DIAMOND GATE BRIDGE')&&i.includes('THE COMPASS')&&i.includes("h.textContent='Coheriscope'"),
            awardNarrativePreserved:p.includes("root.dataset.awardNarrative='identity-experience-purpose-system-readiness-evidence'")
          };
          const failures=Object.entries(checks).filter(([,v])=>!v).map(([k])=>k);
          const receipt={schema:'COMPASS_ENGINEERING_FLOOR_RECEIPT_v1',candidateHead:process.env.COMPASS_CANDIDATE_HEAD,governingHead:base,changedPaths:changed,mutatedProtected,checks,failures,result:failures.length?'FAIL_CLOSED':'PASS_CLOSED'};
          fs.writeFileSync('/tmp/compass-engineering-floor-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          if(failures.length)process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-engineering-floor-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/compass-engineering-floor-receipt.json
          retention-days: 90

  experience:
    runs-on: ubuntu-latest
    needs: engineering-floor
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMPASS_CANDIDATE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Host exact candidate and governing baseline
        run: |
          git worktree add --detach /tmp/compass-governing "$COMPASS_GOVERNING_HEAD"
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/compass-candidate-http.log 2>&1 &
          (cd /tmp/compass-governing && python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/compass-governing-http.log 2>&1) &
          for port in 4173 4174; do
            for i in $(seq 1 30); do curl -fsS "http://127.0.0.1:${port}/" >/dev/null && break; sleep 1; done
            curl -fsS "http://127.0.0.1:${port}/" >/dev/null
          done
      - name: Capture and qualify experience
        run: |
          mkdir -p /tmp/compass-experience-captures
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const candidateHead=process.env.COMPASS_CANDIDATE_HEAD,governingHead=process.env.COMPASS_GOVERNING_HEAD;
          const viewports=[['desktop',1440,1000],['tablet',1024,1366],['phone',390,844]];
          const overflow=[];const composition={};const errors=[];const artifacts=[];
          const shot=async(page,name,locator=null)=>{const path=`/tmp/compass-experience-captures/${name}.png`;if(locator){const l=page.locator(locator).first();if(await l.count()){await l.scrollIntoViewIfNeeded();await page.waitForTimeout(140);await l.screenshot({path});artifacts.push(path);return true}}await page.screenshot({path,fullPage:true});artifacts.push(path);return true};
          const inspect=async(page)=>page.evaluate(()=>{
            const style=s=>s?getComputedStyle(s):null;
            const intro=document.querySelector('.compass-introduction__body'),panel=document.querySelector('.compass-panel'),monument=document.querySelector('.compass-monument'),plaque=document.querySelector('.compass-orbit-plaque'),built=document.querySelector('.compass-built');
            const purpose=document.querySelector('.compass-purpose-stage')||document.querySelector('.compass-introduction');
            const instrument=document.querySelector('.compass-instrument');
            const capabilities=document.querySelector('[data-capability-orbit],.compass-capability-orbit');
            const readiness=document.querySelector('[data-readiness-stage="trl-tra"],.compass-built');
            const order=[document.querySelector('.compass-estate__header'),instrument,purpose,capabilities,readiness].map(el=>el?el.getBoundingClientRect().top+scrollY:null);
            const noFurniture=el=>{const s=style(el);return !s||((parseFloat(s.borderTopWidth)||0)+(parseFloat(s.borderRightWidth)||0)+(parseFloat(s.borderBottomWidth)||0)+(parseFloat(s.borderLeftWidth)||0)<=1&&s.boxShadow==='none'&&(s.backgroundImage==='none'||s.backgroundImage.includes('none')))};
            return {
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
              panelColumns:panel?style(panel).gridTemplateColumns:'',
              capabilityColumns:document.querySelector('.compass-capability-choices')?style(document.querySelector('.compass-capability-choices')).gridTemplateColumns:'',
              introFurniture:noFurniture(intro),panelFurniture:noFurniture(panel),monumentFurniture:noFurniture(monument),plaqueFurniture:noFurniture(plaque),builtFurniture:noFurniture(built),
              order,
              narrative:document.querySelector('[data-compass-root]')?.dataset.awardNarrative||'',
              evidenceHref:document.querySelector('[data-evidence-registry-exit]')?.getAttribute('href')||'',
              readinessModel:document.querySelector('[data-compass-root]')?.dataset.readinessModel||'',
              genericServiceLanguage:/web services|web agency|full-service agency/i.test(document.body.innerText),
              guidanceVisible:Boolean(document.querySelector('[data-compass-guidance]')),
              hiddenPreInstruction:Boolean(document.querySelector('.compass-orbit-intro h2'))&&style(document.querySelector('.compass-orbit-intro h2'))?.position==='absolute'
            };
          });
          try{
            for(const [id,width,height] of viewports){
              const context=await browser.newContext({viewport:{width,height},reducedMotion:'no-preference'});const page=await context.newPage();page.on('pageerror',e=>errors.push(`${id}:${e}`));
              await page.goto(`http://127.0.0.1:4173/?candidate=${candidateHead}&lawsSpacecraftTest=1`,{waitUntil:'domcontentloaded',timeout:30000});await page.waitForTimeout(1100);
              composition[id]=await inspect(page);overflow.push({id,delta:composition[id].overflow});await shot(page,`${id}-full`);
              if(id==='desktop'){
                await shot(page,'desktop-opening','.compass-estate__header');await shot(page,'desktop-compass-constellation','.compass-instrument');
                const mirror=page.locator('[data-compass-object="mirrorland"]').first();if(await mirror.count()){await mirror.click({force:true});await page.waitForTimeout(600);await shot(page,'desktop-mirrorland-threshold','[data-compass-scene]');const back=page.locator('[data-compass-mirrorland-back]').first();if(await back.count()&&await back.isVisible())await back.click({force:true});}
                await page.evaluate(()=>{const api=globalThis.DGB_COMPASS_CONTROLLER;api?.requestCardinalSelection?.('east');api?.requestRoomSelection?.('east-1')});await page.waitForTimeout(650);await shot(page,'desktop-selected-room','[data-compass-scene]');
                await shot(page,'desktop-purpose-engagement','.compass-monuments');
                const orbit=page.locator('.compass-capability-orbit').first();if(await orbit.count()){await orbit.scrollIntoViewIfNeeded();await page.waitForTimeout(250);await orbit.screenshot({path:'/tmp/compass-experience-captures/desktop-brain.png'});artifacts.push('/tmp/compass-experience-captures/desktop-brain.png');const next=page.locator('.compass-orbit-controls button').last();if(await next.count()){await next.click();await page.waitForTimeout(500);await orbit.screenshot({path:'/tmp/compass-experience-captures/desktop-trophy.png'});artifacts.push('/tmp/compass-experience-captures/desktop-trophy.png');await next.click();await page.waitForTimeout(500);await orbit.screenshot({path:'/tmp/compass-experience-captures/desktop-house.png'});artifacts.push('/tmp/compass-experience-captures/desktop-house.png')}}
                await shot(page,'desktop-readiness-evidence','.compass-built');await shot(page,'desktop-conclusion','.compass-build-cta');
              }
              if(id==='phone'){await shot(page,'phone-compass-constellation','.compass-instrument');await shot(page,'phone-dimensional-capability','.compass-capability-orbit');await shot(page,'phone-readiness-evidence','.compass-built');await shot(page,'phone-conclusion','.compass-build-cta')}
              await context.close();
            }
            for(const [id,width,height] of [['desktop',1440,1000],['phone',390,844]]){const context=await browser.newContext({viewport:{width,height},reducedMotion:'reduce'});const page=await context.newPage();await page.goto(`http://127.0.0.1:4173/?candidate=${candidateHead}`,{waitUntil:'domcontentloaded'});await page.waitForTimeout(650);await shot(page,`reduced-${id}-opening`,'.compass-estate__header');await shot(page,`reduced-${id}-compass`,'.compass-instrument');if(id==='desktop')await shot(page,'reduced-desktop-dimensional-capability','.compass-capability-orbit');await shot(page,`reduced-${id}-conclusion`,'.compass-build-cta');await context.close()}
          } finally {await browser.close()}
          const desktop=composition.desktop,tablet=composition.tablet,phone=composition.phone;
          const allFurniture=[desktop,tablet,phone].every(x=>x.introFurniture&&x.panelFurniture&&x.monumentFurniture&&x.plaqueFurniture&&x.builtFurniture);
          const narrative=[desktop,tablet,phone].every(x=>x.narrative==='identity-experience-purpose-system-readiness-evidence'&&x.order.filter(Number.isFinite).every((v,i,a)=>i===0||v>=a[i-1]));
          const responsive=desktop.panelColumns.split(' ').filter(Boolean).length>=2&&tablet.panelColumns.split(' ').filter(Boolean).length===1&&phone.panelColumns.split(' ').filter(Boolean).length===1&&phone.capabilityColumns.split(' ').filter(Boolean).length===1;
          const legible=[desktop,tablet,phone].every(x=>x.guidanceVisible&&x.hiddenPreInstruction);
          const evidence=[desktop,tablet,phone].every(x=>x.evidenceHref==='/evidence/'&&x.readinessModel==='TRL7_PLUS_TRA_ASSESSMENT_NO_SCORE');
          const category=[desktop,tablet,phone].every(x=>!x.genericServiceLanguage);
          const hardZero={visualSystemCoherence:allFurniture,narrativeContinuity:narrative,interactionLegibility:legible,responsiveRecomposition:responsive,evidenceHierarchy:evidence,categoryPreservation:category};
          const receipt={schema:'COMPASS_EXPERIENCE_CAPTURE_RECEIPT_v1',candidateHead,governingHead,viewports:viewports.map(([id,width,height])=>({id,width,height})),beats:{desktop:['opening','compass-constellation','mirrorland-threshold','selected-room','brain','trophy','house','purpose-engagement','readiness-evidence','conclusion'],phone:['compass-constellation','dimensional-capability','readiness-evidence','conclusion']},reducedMotionBeats:{desktop:['opening','compass','dimensional-capability','conclusion'],phone:['opening','compass','conclusion']},overflow,composition,protectedCapabilityNonregression:errors.length===0,publicClaimEvidenceSeparation:evidence,categoryPreservationText:'Independent Studio for Interactive Worlds, Creative Technology & Original Systems',hardZero,artifacts,errors};
          fs.writeFileSync(process.env.COMPASS_EXPERIENCE_CAPTURE_INPUT,JSON.stringify(receipt,null,2)+'\n');console.log(JSON.stringify(receipt,null,2));
          NODE
          node .github/ai-router/projects/compass/verify-experience-consolidation.v1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-experience-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/compass-experience-capture-receipt.json
            /tmp/compass-experience-consolidation-receipt.json
            /tmp/compass-experience-captures/
          retention-days: 90
