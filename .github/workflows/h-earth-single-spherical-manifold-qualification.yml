name: H-Earth Gen329 Reanchor Exact Head Qualification
on:
  pull_request:
    types: [opened, reopened]
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact reanchored candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: smansfield635-create/smansfield635-create.github.io
          ref: 95fa77e142889763345695c9da5cd2ae2b667f2e
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact parent and bounded adoption closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "95fa77e142889763345695c9da5cd2ae2b667f2e"
          test "$(git rev-parse HEAD^)" = "fe39febded099960ad7b43f631014c062ef8beff"
          git diff --name-only HEAD^ HEAD | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          h-earth-3d/docs/H_EARTH_SINGLE_SPHERICAL_WORLD_MANIFOLD_SUCCESSOR_CONTRACT_v1.md
          h-earth-3d/environment/h-earth.successor-surface-material.run8c.js
          h-earth-3d/environment/h-earth.successor-vegetation.run8d.js
          h-earth-3d/integration/h-earth.run8e-successor-environment-transfer.js
          h-earth-3d/integration/h-earth.world-manifold-union-admission.js
          h-earth-3d/integration/h-earth.world-representation-plan.js
          h-earth-3d/terrain/h-earth.successor-terrain-field.run8b.js
          h-earth-3d/terrain/h-earth.world-manifold-domain.js
          h-earth-3d/validation/h-earth.single-spherical-world-manifold.harness.mjs
          showroom/globe/h-earth/functional-landscape/navigation.js
          showroom/globe/h-earth/functional-landscape/visible-terrain-clearance.js
          showroom/globe/h-earth/render/geometry-distant-context.js
          showroom/globe/h-earth/render/geometry-shoreline.js
          showroom/globe/h-earth/render/geometry-successor-terrain.run8b.js
          showroom/globe/h-earth/render/landscape-preview.js
          showroom/globe/h-earth/render/live-renderer-contract.run8e-r3a.js
          showroom/globe/h-earth/render/planetary-world-frame.js
          showroom/globe/h-earth/render/run8e-successor-environment.js
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
      - name: Execute native single-spherical-manifold harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proof"
          node h-earth-3d/validation/h-earth.single-spherical-world-manifold.harness.mjs | tee "$RUNNER_TEMP/proof/receipt.json"
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/proof/receipt.json','utf8'));if(r.result!=='PASS')process.exit(1);console.log(r.receiptSha256)"
      - name: Upload receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h-earth-gen329-reanchor-${{ github.run_id }}
          path: ${{ runner.temp }}/proof/receipt.json
          if-no-files-found: error
          retention-days: 90
