name: FD05 deployed native shoreline capture

on:
  pull_request:
    branches:
      - agent/fd05-native-shoreline-work-001
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  capture-deployed-shoreline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify merged occurrence and preserve browser harness
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse HEAD)" = "2764c3726c1b6591877d9257a125a70a2536d90d"
          git show origin/agent/fd05-native-shoreline-work-001:.fd05/test-native-shoreline-browser.mjs > .fd05-test-native-shoreline-browser.mjs
          mkdir -p .fd05/deployed-shoreline .fd05/native-shoreline-output

      - name: Wait for exact public byte correspondence
        run: |
          FILES=(
            'h-earth-3d/integration/h-earth.post-west-admitted-geometry-transfer.js'
            'showroom/globe/h-earth/admitted-geometry-frame.js'
            'showroom/globe/h-earth/compositor.js'
            'showroom/globe/h-earth/index.html'
            'showroom/globe/h-earth/render/geometry-foam.js'
            'showroom/globe/h-earth/render/geometry-water.js'
            'showroom/globe/h-earth/render/shoreline-preview.js'
            'showroom/globe/h-earth/renderer.js'
          )
          URLS=(
            'https://diamondgatebridge.com/h-earth-3d/integration/h-earth.post-west-admitted-geometry-transfer.js'
            'https://diamondgatebridge.com/showroom/globe/h-earth/admitted-geometry-frame.js'
            'https://diamondgatebridge.com/showroom/globe/h-earth/compositor.js'
            'https://diamondgatebridge.com/showroom/globe/h-earth/'
            'https://diamondgatebridge.com/showroom/globe/h-earth/render/geometry-foam.js'
            'https://diamondgatebridge.com/showroom/globe/h-earth/render/geometry-water.js'
            'https://diamondgatebridge.com/showroom/globe/h-earth/render/shoreline-preview.js'
            'https://diamondgatebridge.com/showroom/globe/h-earth/renderer.js'
          )
          : > .fd05/deployed-shoreline/correspondence.tsv
          MATCHED=0
          for ATTEMPT in $(seq 1 30)
          do
            ALL=1
            : > .fd05/deployed-shoreline/correspondence-current.tsv
            for INDEX in $(seq 0 7)
            do
              FILE="${FILES[$INDEX]}"
              URL="${URLS[$INDEX]}"
              PUBLIC="/tmp/fd05-public-$INDEX"
              CACHE_TOKEN="${GITHUB_RUN_ID}-${ATTEMPT}-${INDEX}"
              if curl --fail --silent --show-error --location \
                --retry 2 \
                -H 'Cache-Control: no-cache' \
                -H 'Pragma: no-cache' \
                "${URL}?fd05Deploy=${CACHE_TOKEN}" \
                --output "$PUBLIC"
              then
                LOCAL_SHA="$(sha256sum "$FILE" | awk '{print $1}')"
                PUBLIC_SHA="$(sha256sum "$PUBLIC" | awk '{print $1}')"
                LOCAL_BYTES="$(wc -c < "$FILE" | tr -d ' ')"
                PUBLIC_BYTES="$(wc -c < "$PUBLIC" | tr -d ' ')"
                EXACT=false
                if [ "$LOCAL_SHA" = "$PUBLIC_SHA" ] && [ "$LOCAL_BYTES" = "$PUBLIC_BYTES" ]; then
                  EXACT=true
                else
                  ALL=0
                fi
                printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
                  "$FILE" "$LOCAL_BYTES" "$PUBLIC_BYTES" "$LOCAL_SHA" "$PUBLIC_SHA" "$EXACT" \
                  >> .fd05/deployed-shoreline/correspondence-current.tsv
              else
                ALL=0
                printf '%s\t0\t0\tFETCH_FAILED\tFETCH_FAILED\tfalse\n' "$FILE" \
                  >> .fd05/deployed-shoreline/correspondence-current.tsv
              fi
            done
            cp .fd05/deployed-shoreline/correspondence-current.tsv \
              .fd05/deployed-shoreline/correspondence.tsv
            if [ "$ALL" -eq 1 ]; then
              MATCHED=1
              echo "$ATTEMPT" > .fd05/deployed-shoreline/correspondence-attempt.txt
              break
            fi
            sleep 20
          done
          test "$MATCHED" -eq 1
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path
          rows = []
          with Path('.fd05/deployed-shoreline/correspondence.tsv').open() as handle:
              for row in csv.reader(handle, delimiter='\t'):
                  rows.append({
                      'path': row[0],
                      'localByteLength': int(row[1]),
                      'publicByteLength': int(row[2]),
                      'localSha256': row[3],
                      'publicSha256': row[4],
                      'exactMatch': row[5] == 'true',
                  })
          report = {
              'reportId': 'H_EARTH_FD05_DEPLOYED_NATIVE_SHORELINE_CORRESPONDENCE_001',
              'repositoryCommit': '2764c3726c1b6591877d9257a125a70a2536d90d',
              'attempt': int(Path('.fd05/deployed-shoreline/correspondence-attempt.txt').read_text().strip()),
              'allExact': all(row['exactMatch'] for row in rows),
              'resources': rows,
          }
          Path('.fd05/deployed-shoreline/correspondence.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture custom-domain mobile and desktop shoreline
        run: |
          H_EARTH_TEST_BASE_URL='https://diamondgatebridge.com/showroom/globe/h-earth/' \
            node .fd05-test-native-shoreline-browser.mjs

      - name: Upload deployed shoreline evidence
        uses: actions/upload-artifact@v4
        with:
          name: fd05-deployed-native-shoreline-evidence
          path: |
            .fd05/deployed-shoreline/correspondence.json
            .fd05/native-shoreline-output/browser-validation.json
            .fd05/native-shoreline-output/*.png
          if-no-files-found: error
          retention-days: 14
