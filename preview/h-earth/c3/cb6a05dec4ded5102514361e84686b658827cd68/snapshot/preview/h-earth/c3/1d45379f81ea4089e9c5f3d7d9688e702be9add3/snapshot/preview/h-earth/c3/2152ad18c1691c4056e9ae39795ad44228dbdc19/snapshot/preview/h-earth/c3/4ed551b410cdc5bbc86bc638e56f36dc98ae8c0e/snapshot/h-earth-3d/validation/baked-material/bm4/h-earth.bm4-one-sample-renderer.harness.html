<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>H-Earth BM4 One-Sample Renderer</title>
  <style>
    html,body{margin:0;background:#111;color:#eee;font-family:monospace}main{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}canvas{width:100%;height:auto;background:#000}pre{grid-column:1/-1;white-space:pre-wrap}
  </style>
</head>
<body>
<main>
  <canvas id="accepted"></canvas>
  <canvas id="candidate"></canvas>
  <pre id="status">BM4_RUNNING</pre>
</main>
<script type="module">
  const status = document.querySelector('#status');
  try {
    const [{ default: authority }, { createBM4OneSampleRendererSuite }] = await Promise.all([
      import('../../../control-plane/post-cp2-round2/baked-material/h-earth.bm4-one-sample-renderer-authority.v1.mjs'),
      import('./h-earth.bm4-one-sample-renderer.browser.mjs')
    ]);
    const result = await createBM4OneSampleRendererSuite({
      acceptedCanvas: document.querySelector('#accepted'),
      candidateCanvas: document.querySelector('#candidate'),
      authority
    });
    window.H_EARTH_BM4_RESULT = result;
    status.textContent = JSON.stringify(result, null, 2);
    document.documentElement.dataset.bm4Ready = 'true';
  } catch (error) {
    status.textContent = error?.stack || String(error);
    document.documentElement.dataset.bm4Error = 'true';
  }
</script>
</body>
</html>
