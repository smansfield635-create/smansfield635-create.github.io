      - name: Verify bounded changed path set
        shell: bash
        run: |
          python - <<'PY'
          import subprocess

          allowed = {
              '.github/workflows/apply-laws-projected-clearance-repair.yml',
              'laws/index.crystals.js',
              'laws/index.html',
              'laws/validation/laws.orbit-direct-manipulation.harness.mjs',
              'laws/validation/laws.orbit-direct-manipulation.receipt.json',
              'verification/benchmark-tools/four-compass-benchmark-v1/checkpoints/l2-laws-bounded-product-implementation.json',
              'verification/benchmark-tools/four-compass-benchmark-v1/checkpoints/l3-laws-static-and-geometry-validation.json'
          }
          changed = set(subprocess.check_output(['git', 'status', '--short']).decode().splitlines())
          paths = {line[3:] for line in changed}
          unexpected = sorted(paths - allowed)
          required = allowed - {'.github/workflows/apply-laws-projected-clearance-repair.yml'}
          missing = sorted(required - paths)
          if unexpected or missing:
              raise SystemExit(f'BOUNDED_PATH_SET_FAILED unexpected={unexpected} missing={missing}')
          print('BOUNDED_PATH_SET=PASS')
          PY

