name: FD05 deployed browser trace summary

on:
  pull_request:
    branches:
      - agent/fd05-deployed-browser-trace-001
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  summarize-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fd05-deployed-browser-trace-001
          fetch-depth: 0
      - name: Summarize committed trace
        run: node .fd05/summarize-deployed-browser-trace.mjs
      - name: Commit compact read-only disposition
        run: |
          git config user.name "OpenAI Engineering Agent"
          git config user.email "engineering-agent@users.noreply.github.com"
          git add .fd05/generated-deployed-browser-summary.json
          git commit -m "Summarize deployed browser correspondence trace"
          git push origin HEAD:agent/fd05-deployed-browser-trace-001
