name: FD05 index compositor viewport initialization

on:
  pull_request:
    branches:
      - agent/fd05-index-compositor-viewport-work-001
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fd05-index-compositor-viewport-work-001
          fetch-depth: 0
      - name: Record base identity
        run: |
          echo "BASE_COMMIT=$(git rev-parse HEAD)"
          echo "BASE_BYTES=$(wc -c < showroom/globe/h-earth/index.js | tr -d ' ')"
          echo "BASE_SHA256=$(sha256sum showroom/globe/h-earth/index.js | awk '{print $1}')"
          echo "BASE_GIT_BLOB=$(git hash-object showroom/globe/h-earth/index.js)"
      - name: Apply bounded transformation
        run: python3 .fd05/apply-index-viewport.py
      - name: Verify static gates
        run: |
          node --check showroom/globe/h-earth/index.js
          grep -q "exactViewportExportPresent" showroom/globe/h-earth/index.js
          grep -q "resolveRendererMountViewport" showroom/globe/h-earth/index.js
          grep -q "compositorViewportInitializedBeforeHandoff" showroom/globe/h-earth/index.js
          echo "CANDIDATE_BYTES=$(wc -c < showroom/globe/h-earth/index.js | tr -d ' ')"
          echo "CANDIDATE_SHA256=$(sha256sum showroom/globe/h-earth/index.js | awk '{print $1}')"
          echo "CANDIDATE_GIT_BLOB=$(git hash-object showroom/globe/h-earth/index.js)"
      - name: Run governed imports and route gates
        run: node --experimental-default-type=module .fd05/test-index-viewport.mjs
      - name: Commit exact replacement
        run: |
          git config user.name "OpenAI Engineering Agent"
          git config user.email "engineering-agent@users.noreply.github.com"
          git add showroom/globe/h-earth/index.js
          git commit -m "Initialize compositor viewport before renderer handoff"
          git push origin HEAD:agent/fd05-index-compositor-viewport-work-001
