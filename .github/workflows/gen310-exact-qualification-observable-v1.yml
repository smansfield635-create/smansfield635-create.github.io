name: Gen310 Exact Qualification Observable v1

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  qualify-gen310:
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable Gen310 subject
        uses: actions/checkout@v4
        with:
          ref: 87b982314a149b6fd88d3552360697d798af3e08
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact subject and harness identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "87b982314a149b6fd88d3552360697d798af3e08"
          test "$(git hash-object h-earth-3d/validation/h-earth.gratitude-audralia-final-expression.harness.mjs)" = "8ec203fd16f07f710c80b4206e57cc8289153baf"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Verify Run8E reciprocal frame
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { constructHEarthRun8ESuccessorEnvironmentFrame } from './showroom/globe/h-earth/render/run8e-successor-environment.js';
          const camera={position:{x:0,y:26,z:48},target:{x:0,y:8,z:-96},up:{x:0,y:1,z:0},fieldOfViewDegrees:58,nearPlane:0.1,farPlane:3328};
          const viewport={width:320,height:180,pixelRatio:1};
          const frame=constructHEarthRun8ESuccessorEnvironmentFrame({camera,viewport});
          if(frame?.ok!==true) throw new Error('RUN8E_FRAME_NONPASS:'+JSON.stringify(frame?.issues??[]));
          console.log(JSON.stringify({ok:frame.ok,status:frame.status,primitiveCount:frame.primitiveCount,farOceanPrimitiveCount:frame.farOceanPrimitiveCount,farLandPrimitiveCount:frame.farLandPrimitiveCount,worldFarPlane:frame.worldFarPlane,run8CPresentationFarPlane:frame.run8CPresentationFarPlane},null,2));
          NODE
      - name: Execute registered Gen310 harness and preserve native receipt
        id: harness
        shell: bash
        run: |
          set +e
          node h-earth-3d/validation/h-earth.gratitude-audralia-final-expression.harness.mjs > "$RUNNER_TEMP/gen310-native-receipt.json"
          STATUS=$?
          set -e
          test -s "$RUNNER_TEMP/gen310-native-receipt.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=process.env.RUNNER_TEMP+'/gen310-native-receipt.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          if(r.schema!=='H_EARTH_GRATITUDE_AUDRALIA_RECIPROCAL_REGIONAL_REPAIR_QUALIFICATION_RECEIPT_v1') throw new Error('GEN310_RECEIPT_SCHEMA_INVALID');
          console.log(JSON.stringify({result:r.result,issues:r.issues,checks:r.checks,deficiencyDisposition:r.deficiencyDisposition,diagnostics:r.diagnostics},null,2));
          NODE
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
      - name: Probe immutable owner-inspection URL
        shell: bash
        run: |
          set -euo pipefail
          URL='https://raw.githack.com/smansfield635-create/smansfield635-create.github.io/87b982314a149b6fd88d3552360697d798af3e08/showroom/globe/h-earth/index.html'
          CODE="$(curl -L --silent --show-error --output "$RUNNER_TEMP/inspection.html" --write-out '%{http_code}' "$URL")"
          test "$CODE" = '200'
          test -s "$RUNNER_TEMP/inspection.html"
          printf 'INSPECTION_URL=%s\nHTTP_STATUS=%s\n' "$URL" "$CODE"
      - name: Upload native Gen310 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gen310-native-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gen310-native-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce native Gen310 pass
        if: always()
        env:
          STATUS: ${{ steps.harness.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=process.env.RUNNER_TEMP+'/gen310-native-receipt.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          if(r.result!=='PASS') throw new Error('GEN310_NONPASS:'+JSON.stringify(r.issues??[]));
          NODE
          test "$STATUS" = "0"
