name: Tests L0 L1 M1 Accessibility Responsive Equivalence Evidence

on:
  push:
    branches:
      - agent/tests-l0-l1-bounded-manifestation-m1-accessibility-responsive-evidence-v1
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    paths:
      - control-plane/whole-estate/tests-l0-l1-bounded-manifestation-m1-accessibility-responsive-evidence-v1/**

permissions:
  contents: read

concurrency:
  group: tests-l0-l1-m1-a11y-responsive-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  RUNTIME_ADMISSION: 051268bfacbfc5671c68f4f24a5601b807412d86
  M1_PROMOTION: 391c3543fd048bac90493232f04973911468d3eb
  M1_CANDIDATE: 9370bba7841b8a831f7f1c034d0b74fb83dab2e0
  M1_PACKAGE: control-plane/whole-estate/tests-l0-l1-bounded-manifestation-m1-v1
  RUNTIME_PACKAGE: control-plane/whole-estate/tests-l0-l1-bounded-manifestation-m1-runtime-evidence-v1
  A11Y_PACKAGE: control-plane/whole-estate/tests-l0-l1-bounded-manifestation-m1-accessibility-responsive-evidence-v1
  REGISTRY_PATH: control-plane/whole-estate/tests-l0-l1-object-projection-registry-v1/object-projection-registry.v1.json

jobs:
  exact-scope-and-admitted-source-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact accessibility evidence candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify additive evidence scope and admitted source identity
        shell: bash
        env:
          REVIEW_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '051268bfacbfc5671c68f4f24a5601b807412d86' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/m1-a11y-evidence
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$(git merge-base HEAD "$RUNTIME_ADMISSION")" = "$RUNTIME_ADMISSION"

          mapfile -t CHANGED < <(git diff --name-only "$RUNTIME_ADMISSION"...HEAD | sort)
          EXPECTED=(
            ".github/workflows/tests-l0-l1-bounded-manifestation-m1-accessibility-responsive-evidence.yml"
            "$A11Y_PACKAGE/README.md"
            "$A11Y_PACKAGE/accessibility-responsive-manifest.v1.json"
            "$A11Y_PACKAGE/verify.accessibility-responsive.mjs"
          )
          mapfile -t EXPECTED_SORTED < <(printf '%s\n' "${EXPECTED[@]}" | sort)
          test "${#CHANGED[@]}" -eq 4
          test "$(printf '%s\n' "${CHANGED[@]}")" = "$(printf '%s\n' "${EXPECTED_SORTED[@]}")"
          test "$(git diff --diff-filter=AMD --name-status "$RUNTIME_ADMISSION"...HEAD | awk '$1 != "A" {count++} END {print count+0}')" -eq 0

          git diff --quiet "$RUNTIME_ADMISSION" -- "$M1_PACKAGE" "$RUNTIME_PACKAGE" "$REGISTRY_PATH"
          test "$(git rev-parse HEAD:$M1_PACKAGE/index.html)" = "1dab5d948af7326db1213f6b0ff3c92acdce6246"
          test "$(git rev-parse HEAD:$M1_PACKAGE/candidate-manifest.v1.json)" = "e18c382c7f82bd3335f69bcf752198c0c10e66a9"
          test "$(git rev-parse HEAD:$M1_PACKAGE/manifestation.mjs)" = "93773f7ecff4036e531f6db1a672850919cee7c5"
          test "$(git rev-parse HEAD:$M1_PACKAGE/manifestation.css)" = "3f77c2a8559293e29b6ba5ac22a69e4cec658031"
          test "$(git rev-parse HEAD:$REGISTRY_PATH)" = "b801a11e342051a6b00e6f7098b1d691685ad0b6"
          test "$(git rev-parse HEAD:$RUNTIME_PACKAGE/runtime-evidence-manifest.v1.json)" = "ea817db12cc70b306518f2ba6d906619f6bd1bab"

          git fetch origin main --quiet
          CURRENT_MAIN="$(git rev-parse origin/main)"
          PROTECTED_OVERLAP=0
          if git merge-base --is-ancestor "$RUNTIME_ADMISSION" "$CURRENT_MAIN"; then
            PROTECTED_OVERLAP="$(git diff --name-only "$RUNTIME_ADMISSION".."$CURRENT_MAIN" -- "$M1_PACKAGE" "$RUNTIME_PACKAGE" "$REGISTRY_PATH" | wc -l | xargs)"
          fi
          test "$PROTECTED_OVERLAP" -eq 0

          export HEAD_SHA CURRENT_MAIN PROTECTED_OVERLAP REVIEW_BASE
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipt = {
            schema: 'WHOLE_ESTATE_TESTS_L0_L1_M1_ACCESSIBILITY_RESPONSIVE_SCOPE_RECEIPT_v1',
            operation: 'M1_ACCESSIBILITY_RESPONSIVE_EQUIVALENCE_EVIDENCE_v1',
            constructionBase: process.env.RUNTIME_ADMISSION,
            governingM1Candidate: process.env.M1_CANDIDATE,
            governingM1PromotionMerge: process.env.M1_PROMOTION,
            evidenceCandidateHead: process.env.HEAD_SHA,
            eventReviewBase: process.env.REVIEW_BASE,
            observedCurrentMain: process.env.CURRENT_MAIN,
            candidateChangedPathCount: 4,
            protectedSources: {
              m1IndexBlob: '1dab5d948af7326db1213f6b0ff3c92acdce6246',
              m1ManifestBlob: 'e18c382c7f82bd3335f69bcf752198c0c10e66a9',
              m1RuntimeBlob: '93773f7ecff4036e531f6db1a672850919cee7c5',
              m1CssBlob: '3f77c2a8559293e29b6ba5ac22a69e4cec658031',
              registryBlob: 'b801a11e342051a6b00e6f7098b1d691685ad0b6',
              runtimeEvidenceManifestBlob: 'ea817db12cc70b306518f2ba6d906619f6bd1bab',
              currentMainProtectedOverlapCount: Number(process.env.PROTECTED_OVERLAP),
            },
            mutationBoundary: {
              publicMutation: false,
              publicRouteCreation: false,
              m1SourceMutation: false,
              registryMutation: false,
              runtimeEvidenceMutation: false,
              m1r2Mutation: false,
              scientificClaimUpgrade: false,
            },
            result: 'PASS_EXACT_SCOPE_AND_ADMITTED_SOURCE_IDENTITY',
          };
          fs.writeFileSync('/tmp/m1-a11y-evidence/scope-source-receipt.v1.json', JSON.stringify(receipt, null, 2) + '\n');
          NODE

      - name: Upload scope and source receipt
        uses: actions/upload-artifact@v4
        with:
          name: m1-a11y-scope-source-${{ github.run_id }}
          path: /tmp/m1-a11y-evidence/scope-source-receipt.v1.json
          if-no-files-found: error
          retention-days: 30

  accessibility-responsive-equivalence:
    needs: exact-scope-and-admitted-source-identity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact accessibility evidence candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify accessibility evidence source syntax
        run: node --check "$A11Y_PACKAGE/verify.accessibility-responsive.mjs"

      - name: Install Chromium runtime authority
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Start bounded local repository server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" >/tmp/m1-a11y-server.log 2>&1 &
          echo $! >/tmp/m1-a11y-server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:4173/$M1_PACKAGE/" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/m1-a11y-server.log || true
          exit 1

      - name: Execute bounded M1 accessibility and responsive equivalence verifier
        shell: bash
        env:
          M1_BASE_URL: http://127.0.0.1:4173
          M1_A11Y_EVIDENCE_DIR: /tmp/m1-a11y-evidence
        run: |
          set -euo pipefail
          node "$A11Y_PACKAGE/verify.accessibility-responsive.mjs"

      - name: Upload accessibility responsive evidence receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-accessibility-responsive-evidence-${{ github.run_id }}
          path: /tmp/m1-a11y-evidence
          if-no-files-found: error
          retention-days: 30
