name: Gen655 private selective-exact qualification

on:
  push:
    branches:
      - gen655-private-qualification-20261012
    paths:
      - .github/workflows/gen655-private-qualification-20261012.yml

permissions: {}

concurrency:
  group: gen655-private-qualification-20261012
  cancel-in-progress: false

jobs:
  qualify:
    if: github.repository == 'smansfield635-create/smansfield635-create.github.io' && github.ref == 'refs/heads/gen655-private-qualification-20261012' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions: {}
    steps:
      - name: Mint short-lived private read-only token
        id: private
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.PRIVATE_EXECUTION_APP_ID }}
          private-key: ${{ secrets.PRIVATE_EXECUTION_APP_PRIVATE_KEY }}
          owner: smansfield635-create
          repositories: geodiametrics1
          permission-contents: read

      - name: Check out immutable private candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: smansfield635-create/geodiametrics1
          ref: a8a28e30020c463097ace9668863d889c8ec07c5
          token: ${{ steps.private.outputs.token }}
          persist-credentials: false
          path: private-source

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact Git identity and execute fixed 18-test suite
        env:
          EXPECTED_COMMIT: a8a28e30020c463097ace9668863d889c8ec07c5
          EXPECTED_TREE: 7c60122cd6139f97df3995fbc94d9e28bf4f5a62
        run: |
          set -euo pipefail
          test "$(git -C private-source rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git -C private-source rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git -C private-source status --porcelain)"
          set +e
          node --test --test-reporter=tap \
            private-source/.github/ai-router/canonical-execution-substrate/router-selective-exact-compat.test.mjs \
            > "$RUNNER_TEMP/gen655-private.tap" 2>&1
          status=$?
          set -e
          export TEST_EXIT_CODE="$status"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const tap=fs.readFileSync(process.env.RUNNER_TEMP+'/gen655-private.tap','utf8');
          const counts={};
          for (const name of ['tests','pass','fail','cancelled','skipped']) {
            const matches=[...tap.matchAll(new RegExp('^# '+name+' (\\d+)\\r?$','gm'))];
            counts[name]=matches.length===1?Number(matches[0][1]):null;
          }
          const ok=process.env.TEST_EXIT_CODE==='0' && counts.tests===18 &&
            counts.pass===18 && counts.fail===0 && counts.cancelled===0 && counts.skipped===0;
          const receipt={
            schema:'DGB_GEN655_PUBLIC_RUNNER_QUALIFICATION_RECEIPT_v1',
            result:ok?'PASS':'FAIL_CLOSED',
            operation:'DGB_GEN653_SELECTIVE_EXACT_ROUTER_COMPAT_20261012_001_R1',
            candidateCommit:'a8a28e30020c463097ace9668863d889c8ec07c5',
            candidateTree:'7c60122cd6139f97df3995fbc94d9e28bf4f5a62',
            executionPlane:'PUBLIC_GITHUB_HOSTED_RUNNER',
            testedWith:'NODE22_BUILTIN_TEST_RUNNER',
            counts,
            testExitCode:Number(process.env.TEST_EXIT_CODE),
            evidenceDigestSha256:crypto.createHash('sha256').update(tap).digest('hex'),
            privateSourcePublished:false,
            privateTestLogPublished:false,
            privateRepositoryWriteAuthorized:false,
            mergeAuthorized:false,
            publicationAuthorized:false
          };
          fs.writeFileSync(process.env.RUNNER_TEMP+'/gen655-qualification-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## Gen655 fixed-source qualification\n\n'+
            'Result: **'+receipt.result+'**\n\n'+
            'Commit: '+receipt.candidateCommit+'\n\n'+
            'Tests: '+counts.pass+'/'+counts.tests+'; failed: '+counts.fail+'\n\n'+
            'SHA-256 of retained-in-runner-only TAP: '+receipt.evidenceDigestSha256+'\n\n'+
            'This is test qualification only; no private write or adoption authority.\n');
          console.log(JSON.stringify(receipt));
          if (!ok) process.exit(1);
          NODE

      - name: Retain sanitized qualification receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gen655-public-runner-receipt
          path: ${{ runner.temp }}/gen655-qualification-receipt.json
          if-no-files-found: ignore
          retention-days: 1
