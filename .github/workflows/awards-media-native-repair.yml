name: Awards media native repair

on:
  push:
    branches:
      - agent/awards-media-native-repair-20260815
    paths:
      - .github/workflows/awards-media-native-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/awards-media-native-repair-20260815
          fetch-depth: 0

      - name: Download approved Compass master
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p showroom/globe/h-earth/awards/media
          curl -fL --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1C4bnM7USwBITlHHNbphl22de15YC8shO&export=download&confirm=t' \
            -o showroom/globe/h-earth/awards/media/diamond-gate-compass-mirrorland-36s.mp4
          test "$(stat -c%s showroom/globe/h-earth/awards/media/diamond-gate-compass-mirrorland-36s.mp4)" -gt 4000000
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=nw=1 showroom/globe/h-earth/awards/media/diamond-gate-compass-mirrorland-36s.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,channels -of default=nw=1 showroom/globe/h-earth/awards/media/diamond-gate-compass-mirrorland-36s.mp4

      - name: Replace fragile remote playback with native site assets
        shell: python
        run: |
          from pathlib import Path
          p = Path('showroom/globe/h-earth/awards/index.html')
          s = p.read_text()
          old_compass = '<iframe src="https://drive.google.com/file/d/1C4bnM7USwBITlHHNbphl22de15YC8shO/preview" title="Diamond Gate Bridge Compass and Mirrorland presentation" allow="autoplay" loading="lazy"></iframe>'
          new_compass = '<video id="compass-reel" playsinline controls preload="metadata" aria-label="36-second Compass and Mirrorland presentation with continuous embedded audio" src="/showroom/globe/h-earth/awards/media/diamond-gate-compass-mirrorland-36s.mp4"></video>'
          if old_compass not in s:
              raise SystemExit('expected Compass Drive iframe not found')
          s = s.replace(old_compass, new_compass)
          old_world = '<video id="world-reel" playsinline controls preload="metadata" aria-label="30-second edited H-Earth and Audralia world-navigation excerpt with Vivaldi score" src="https://drive.google.com/uc?export=download&amp;id=1SQXPKeI7uPdAF2DpZavcezYibVhgLDlG"></video><audio id="world-score" preload="auto" src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Vivaldi_-_Four_Seasons_2_Summer_mvt_1_Allegro_non_molto_-_John_Harrison_violin.oga"></audio>'
          new_world = '<video id="world-reel" playsinline controls preload="metadata" aria-label="18-second edited H-Earth browser-native world environment excerpt with embedded Vivaldi score" src="/showroom/globe/h-earth/awards/media/diamond-gate-h-earth-awards-18s-vivaldi.mp4"></video>'
          if old_world not in s:
              raise SystemExit('expected broken H-Earth remote media pair not found')
          s = s.replace(old_world, new_world)
          s = s.replace('30-second H-Earth + Audralia world-navigation presentation · approved picture edit with continuous Vivaldi score', '18-second H-Earth environment excerpt · finished four-shot 16:9 presentation with embedded score')
          s = s.replace('Music: Antonio Vivaldi, <em>Summer</em>, I. Allegro non molto · John Harrison, violin · Robert Turizziani, conductor · Wichita State University Chamber Players · soundtrack excerpt begins at 2:47 elapsed · recording licensed CC BY-SA 4.0 via Wikimedia Commons.', 'Music: Antonio Vivaldi, <em>Summer</em>, I. Allegro non molto · embedded in the self-contained presentation asset.')
          p.write_text(s)

      - name: Verify native playback bindings
        shell: bash
        run: |
          set -euo pipefail
          grep -F '/showroom/globe/h-earth/awards/media/diamond-gate-compass-mirrorland-36s.mp4' showroom/globe/h-earth/awards/index.html
          grep -F '/showroom/globe/h-earth/awards/media/diamond-gate-h-earth-awards-18s-vivaldi.mp4' showroom/globe/h-earth/awards/index.html
          ! grep -F 'drive.google.com/file/d/1C4bnM7USwBITlHHNbphl22de15YC8shO/preview' showroom/globe/h-earth/awards/index.html
          ! grep -F '1SQXPKeI7uPdAF2DpZavcezYibVhgLDlG' showroom/globe/h-earth/awards/index.html
          ! grep -F 'upload.wikimedia.org/wikipedia/commons/a/a5/Vivaldi_' showroom/globe/h-earth/awards/index.html

      - name: Commit repair bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add showroom/globe/h-earth/awards/index.html showroom/globe/h-earth/awards/media/diamond-gate-compass-mirrorland-36s.mp4
          git diff --cached --quiet && exit 0
          git commit -m 'Repair Awards media delivery with native site assets'
          git push origin HEAD:agent/awards-media-native-repair-20260815
