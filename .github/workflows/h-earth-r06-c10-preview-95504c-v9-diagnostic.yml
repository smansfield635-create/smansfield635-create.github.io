name: H-Earth R06-C10 Candidate Preview 95504c V9 Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h-earth-r06-c10-preview-95504c-v9-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose-post-compatibility:
    if: github.head_ref == 'publication/h-earth-r06-c10-preview-95504c-001'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_HEAD: 95504c9927922318225da1d61fa303cec70497f9
      PREVIEW_ROOT: preview/h-earth/r06-c10/95504c9927922318225da1d61fa303cec70497f9
      SOURCE_ENTRY: showroom/globe/h-earth/index.html
      V1_WORKFLOW: .github/workflows/h-earth-r06-c10-preview-95504c.yml
      V8_WORKFLOW: .github/workflows/h-earth-r06-c10-preview-95504c-v8-boundary-compat.yml
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: publication/h-earth-r06-c10-preview-95504c-001
          fetch-depth: 0
          path: publication

      - name: Check out exact terrain candidate
        uses: actions/checkout@v4
        with:
          ref: 95504c9927922318225da1d61fa303cec70497f9
          fetch-depth: 1
          path: source

      - name: Materialize and apply V8 preview compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,textwrap
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])/'publication'
          v1=(root/os.environ['V1_WORKFLOW']).read_text()
          m=re.search(r"- name: Materialize exact self-contained environment preview.*?python3 - <<'PY'\n(.*?)\n          PY",v1,re.S)
          if not m: raise RuntimeError('V1_MATERIALIZER_BLOCK_NOT_FOUND')
          code=textwrap.dedent(m.group(1))
          old='queue = [entry]'
          new="""queue = [
              entry,
              PurePosixPath('showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js'),
              PurePosixPath('showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-round1-1f520809.js'),
              PurePosixPath('showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.js')
          ]"""
          if old not in code: raise RuntimeError('V1_QUEUE_PATCH_TARGET_NOT_FOUND')
          exec(compile(code.replace(old,new,1),'v9-materializer.py','exec'),{'__name__':'__main__'})

          v8=(root/os.environ['V8_WORKFLOW']).read_text()
          p=re.search(r"- name: Install preview-only outer-domain derivative compatibility.*?python3 - <<'PY'\n(.*?)\n          PY",v8,re.S)
          if not p: raise RuntimeError('V8_COMPATIBILITY_BLOCK_NOT_FOUND')
          exec(compile(textwrap.dedent(p.group(1)),'v9-compatibility.py','exec'),{'__name__':'__main__'})
          PY

      - name: Inspect exact post-compatibility package and all terrain materials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proof"
          cat > "$RUNNER_TEMP/diagnose.mjs" <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import process from 'node:process';
          import { pathToFileURL } from 'node:url';
          const preview=path.join(process.env.GITHUB_WORKSPACE,'publication',process.env.PREVIEW_ROOT,'_source');
          const url=relative=>pathToFileURL(path.join(preview,relative)).href;
          const terrain=await import(url('h-earth-3d/terrain/h-earth.successor-terrain-field.run8b.js'));
          const geometry=await import(url('showroom/globe/h-earth/render/geometry-successor-terrain.run8b.js'));
          const material=await import(url('h-earth-3d/environment/h-earth.successor-surface-material.run8c.js'));
          const packageModule=await import(url('showroom/globe/h-earth/render/live-render-package.run8e-r2.js'));
          const axes=geometry.getHEarthRun8BSuccessorSamplingAxes();
          const invalidTerrain=[];
          const invalidMaterial=[];
          let terrainCount=0,materialCount=0,candidateDeltaCount=0;
          for(const z of axes.zValues){
            for(const x of axes.xValues){
              terrainCount++;
              let sample;
              try{sample=terrain.sampleHEarthRun8BSuccessorTerrainField(x,z);}catch(error){invalidTerrain.push({x,z,throw:{name:error.name,message:error.message,stack:error.stack}});continue;}
              if(Math.abs(sample?.appliedCandidateDelta??0)>1e-9)candidateDeltaCount++;
              const finite=v=>typeof v==='number'&&Number.isFinite(v);
              const terrainOk=sample?.valid===true&&finite(sample.elevation)&&finite(sample.gradient?.x)&&finite(sample.gradient?.z)&&finite(sample.normal?.x)&&finite(sample.normal?.y)&&finite(sample.normal?.z)&&finite(sample.slope)&&finite(sample.curvature);
              if(!terrainOk)invalidTerrain.push({x,z,sample});
              let evaluated;
              try{evaluated=material.evaluateHEarthRun8CSuccessorSurfaceMaterial(x,z);}catch(error){invalidMaterial.push({x,z,throw:{name:error.name,message:error.message,stack:error.stack}});continue;}
              materialCount++;
              if(evaluated?.eligible!==true)invalidMaterial.push({x,z,status:evaluated?.status,issues:evaluated?.issues,terrain:evaluated?.terrain,material:evaluated?.material});
            }
          }
          let packageRecord=null,packageError=null;
          try{packageRecord=packageModule.getHEarthRun8ER2ImmutableLiveRenderPackage();}catch(error){packageError={name:error.name,message:error.message,stack:error.stack};}
          const witnessPoints=[[44,-168],[44,-180],[44,-192],[28,-200],[32,-192],[64,-164],[-224,-320],[224,-320],[-224,64],[224,64]];
          const witnesses=witnessPoints.map(([x,z])=>{
            let sample=null,evaluated=null,sampleError=null,materialError=null;
            try{sample=terrain.sampleHEarthRun8BSuccessorTerrainField(x,z);}catch(error){sampleError={name:error.name,message:error.message,stack:error.stack};}
            try{evaluated=material.evaluateHEarthRun8CSuccessorSurfaceMaterial(x,z);}catch(error){materialError={name:error.name,message:error.message,stack:error.stack};}
            return{x,z,sample,evaluated,sampleError,materialError};
          });
          const result={
            sourceHead:process.env.SOURCE_HEAD,
            axes:{xCount:axes.xValues.length,zCount:axes.zValues.length,total:axes.xValues.length*axes.zValues.length,xMinimum:axes.xValues[0],xMaximum:axes.xValues.at(-1),zMinimum:axes.zValues[0],zMaximum:axes.zValues.at(-1)},
            terrainCount,materialCount,candidateDeltaCount,
            invalidTerrainCount:invalidTerrain.length,
            invalidMaterialCount:invalidMaterial.length,
            invalidTerrain:invalidTerrain.slice(0,100),
            invalidMaterial:invalidMaterial.slice(0,100),
            packageRecord,packageError,witnesses
          };
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'proof','post-compatibility-diagnostic.json'),JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify({axes:result.axes,candidateDeltaCount,invalidTerrainCount:invalidTerrain.length,invalidMaterialCount:invalidMaterial.length,packageStatus:packageRecord?.status,packageIssueCount:packageRecord?.issues?.length,packageIssues:packageRecord?.issues?.slice?.(0,30),packageError,witnesses:witnesses.map(w=>({x:w.x,z:w.z,sampleValid:w.sample?.valid,elevation:w.sample?.elevation,delta:w.sample?.appliedCandidateDelta,slope:w.sample?.slope,curvature:w.sample?.curvature,materialEligible:w.evaluated?.eligible,materialStatus:w.evaluated?.status,materialIssues:w.evaluated?.issues,sampleError:w.sampleError,materialError:w.materialError}))},null,2));
          if(invalidTerrain.length||invalidMaterial.length||packageError||packageRecord?.status!=='RUN_8E_R2_IMMUTABLE_LIVE_RENDER_PACKAGE_COMPLETE')process.exit(1);
          JS
          node "$RUNNER_TEMP/diagnose.mjs"

      - name: Upload post-compatibility diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-r06-c10-preview-95504c-v9-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/proof
            publication/${{ env.PREVIEW_ROOT }}/byte-manifest.json
            publication/${{ env.PREVIEW_ROOT }}/publication-receipt.json
          if-no-files-found: warn
          retention-days: 30
