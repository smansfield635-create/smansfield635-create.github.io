name: OSF Laws Source Registry

on:
  push:
    branches:
      - agent/osf-laws-source-registry-001
    paths:
      - .github/workflows/osf-laws-source-registry.yml
      - tools/osf-laws-corpus/build_source_registry.py
      - research/osf-laws-corpus/manifest.json
      - research/osf-laws-corpus/projects/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osf-laws-source-registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-source-registry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact source-registry head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install live-review dependency
        run: python -m pip install 'requests==2.32.3'

      - name: Build controlled source registry
        run: |
          python tools/osf-laws-corpus/build_source_registry.py \
            --corpus-root research/osf-laws-corpus \
            --output research/osf-laws-corpus/source-registry \
            --live-osf-review

      - name: Validate Lane 2 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('research/osf-laws-corpus')
          registry = json.loads((root / 'source-registry/registry.json').read_text(encoding='utf-8'))
          receipt = json.loads((root / 'source-registry/LANE_2_COMPLETION_RECEIPT.json').read_text(encoding='utf-8'))
          assessment = json.loads((root / 'laws-chamber-assessment.json').read_text(encoding='utf-8'))
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))

          ids = [r['OSF_ID'] for r in registry['resources']]
          assert registry['registry_id'] == 'OSF_LAWS_CHAMBER_SOURCE_REGISTRY_v1'
          assert len(ids) == len(set(ids)) == 31
          assert set(ids) == {p['id'] for p in manifest['projects']}
          assert registry['summary']['resource_count'] == 31
          assert registry['summary']['registration_count'] == 1
          assert registry['summary']['public_file_count'] == 10
          assert registry['summary']['datasets_detected'] == 0
          assert registry['summary']['analytic_code_detected'] == 0
          assert registry['summary']['result_tables_detected'] == 0
          assert registry['summary']['unclassified_count'] == 0
          assert assessment['resource_count'] == 31
          assert len(assessment['projects']) == 31
          assert receipt['classified_resource_count'] == 31
          assert receipt['source_to_destination_complete'] is True
          assert receipt['product_files_changed'] is False
          assert all(r['CLAIM_BOUNDARY'] for r in registry['resources'])
          assert all(r['CANONICAL_DESTINATION'] for r in registry['resources'])
          assert all(r['ADMISSION_STATUS'] not in {'', None, 'DISCOVERED'} for r in registry['resources'])
          print(json.dumps({
              'status': 'PASS',
              'resources': 31,
              'files': 10,
              'wiki_status_counts': registry['summary']['wiki_status_counts'],
              'admission_counts': registry['summary']['admission_counts'],
          }, indent=2))
          PY

      - name: Commit source-authority outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/osf-laws-corpus/source-registry \
            research/osf-laws-corpus/laws-chamber-assessment.json \
            research/osf-laws-corpus/LAWS_CHAMBER_VALUE_ASSESSMENT.md \
            research/osf-laws-corpus/HARVEST_COMPLETION_RECEIPT.json \
            research/osf-laws-corpus/OTHER_ROOMS_HANDOFF.md
          if git diff --cached --quiet; then
            echo "No source-registry changes detected."
            exit 0
          fi
          git commit -m "Build controlled OSF Laws source registry"
          git push origin HEAD:${GITHUB_REF_NAME}
