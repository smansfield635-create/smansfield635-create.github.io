name: Laws Carousel Gen282 Terminal Closure

on:
  push:
    branches:
      - 'agent/laws-carousel-gen267-continuity-intake'
    paths:
      - '.github/workflows/laws-carousel-gen267-continuity-intake.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIVATE_REPOSITORY: smansfield635-create/geodiametrics1
  PRIVATE_HEAD: 496be26a2214886e93727f6bec0da05cf9fa7505
  OPERATION_ID: LAWS_CAROUSEL_GEN267_INSTALLED_CONTINUITY_RECONCILIATION_20260815_001
  LOCK_SCOPE: LAWS:CAROUSEL:GEN267:INSTALLED_CONTINUITY_RECONCILIATION:V1
  LOCK_GENERATION: '282'

jobs:
  terminal-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Mint private-repository installation token
        id: private-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.PRIVATE_EXECUTION_APP_ID }}
          private-key: ${{ secrets.PRIVATE_EXECUTION_APP_PRIVATE_KEY }}
          owner: smansfield635-create
          repositories: geodiametrics1
          permission-contents: write

      - name: Check out installed Gen282 merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: smansfield635-create/geodiametrics1
          ref: ${{ env.PRIVATE_HEAD }}
          token: ${{ steps.private-token.outputs.token }}
          path: private-control-plane
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify installed continuity state
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/private-control-plane"
          test "$(git rev-parse HEAD^{commit})" = "$PRIVATE_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          jq -e '.mandatoryConstructionContext.acceptedCarouselPredecessorExists==true and .mandatoryConstructionContext.acceptedCarouselPredecessor.generation==267 and .mandatoryConstructionContext.acceptedCarouselPredecessor.qualifiedCandidate=="063f49ba788388f0a9075e6624792b8cf761e5bf" and .mandatoryConstructionContext.acceptedCarouselPredecessor.installedMerge=="694de80c43a92eb9fbd1a14dbfa8e8132fad99a5" and .mandatoryConstructionContext.freshConstructionAuthorityRequired==false and .mandatoryConstructionContext.successorMustBeDerivedFromLiveState==true' .github/ai-router/projects/laws/entrypoint.v1.json >/dev/null
          jq -e '.lawsCarouselFrontier.functioningAcceptedCarouselPredecessor=="GEN267_INSTALLED" and .lawsCarouselFrontier.freshConstructionCompleted==true and .lawsCarouselFrontier.nextProductSuccessorPredeclared==false' .github/ai-router/project-continuation/laws-contextual-3d.continuation.v1.json >/dev/null
          grep -Fq 'Functioning Laws Carousel: **Gen267 installed**.' .github/ai-router/projects/laws/LAWS_CAROUSEL_CONSTRUCTION_PLAN.v1.md
          grep -Fq 'qualified candidate `063f49ba788388f0a9075e6624792b8cf761e5bf`' .github/ai-router/projects/laws/LAWS_CAROUSEL_CONSTRUCTION_PLAN.v1.md
          grep -Fq 'installed public merge: `694de80c43a92eb9fbd1a14dbfa8e8132fad99a5`' .github/ai-router/projects/laws/LAWS_CAROUSEL_CONSTRUCTION_PLAN.v1.md

      - name: Close canonical Gen282 lock PASS_CLOSED
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.private-token.outputs.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/private-control-plane"
          node tools/operation-intake/repository-operation-lock-manager.v1.mjs \
            --action close \
            --repository "$PRIVATE_REPOSITORY" \
            --lock-ref refs/heads/operation-locks/repository-operation-intake-v1 \
            --operation-id "$OPERATION_ID" \
            --lock-scope "$LOCK_SCOPE" \
            --lock-generation "$LOCK_GENERATION" \
            --terminal-disposition PASS_CLOSED \
            --output "$RUNNER_TEMP/gen282-terminal-closure.json"
          jq -e '.result=="TERMINAL_CLOSURE_COMMITTED" and .terminalDisposition=="PASS_CLOSED" and .lockReleased==true and .lockGeneration==282' "$RUNNER_TEMP/gen282-terminal-closure.json" >/dev/null

      - name: Verify checkout remains clean
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/private-control-plane"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload closure evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laws-carousel-gen282-terminal-closure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gen282-terminal-closure.json
          if-no-files-found: error
          retention-days: 90
