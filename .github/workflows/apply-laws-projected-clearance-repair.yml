          }

          (checkpoint_root / 'l2-laws-bounded-product-implementation.json').write_text(json.dumps(l2, indent=2) + '\n')
          (checkpoint_root / 'l3-laws-static-and-geometry-validation.json').write_text(json.dumps(l3, indent=2) + '\n')
