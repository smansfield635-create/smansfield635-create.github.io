name: H-Earth Terrain Estate Construction Registry Prerequisite Terminal Closure

on:
  push:
    branches:
      - closure/h-earth-terrain-estate-construction-v1-registry-prerequisite-terminal-001
    paths:
      - tools/h-earth-terrain-estate-construction-registry-prerequisite-terminal-closure.v1.mjs
      - .github/workflows/h-earth-terrain-estate-construction-registry-prerequisite-terminal-closure.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: h-earth-terrain-estate-construction-registry-prerequisite-terminal-closure-v1
  cancel-in-progress: false

env:
  REPOSITORY: smansfield635-create/smansfield635-create.github.io
  EXACT_MAIN: 3f51f0cd159df33571905c6cb14253ebdd137e3b
  CARRIER_BRANCH: closure/h-earth-terrain-estate-construction-v1-registry-prerequisite-terminal-001
  EXECUTOR: tools/h-earth-terrain-estate-construction-registry-prerequisite-terminal-closure.v1.mjs

jobs:
  terminal-closure-builder:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact closure carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind exact carrier and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$CARRIER_BRANCH"
          git fetch --no-tags origin main
          test "$(git merge-base "$EXACT_MAIN" "$GITHUB_SHA")" = "$EXACT_MAIN"
          test "$(git rev-parse origin/main)" = "$EXACT_MAIN"

      - name: Execute static merged-registry verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/h-earth-terrain-estate-construction-registry-prerequisite-terminal-closure
          node "$EXECUTOR" --verify-static > /tmp/h-earth-terrain-estate-construction-registry-prerequisite-terminal-closure/static-verification.v1.json

      - name: Close generation 413 and self generation 419 through canonical CAS manager
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OUTPUT_PATH: /tmp/h-earth-terrain-estate-construction-registry-prerequisite-terminal-closure/terminal-closure-return.v1.json
        run: |
          set -euo pipefail
          node "$EXECUTOR" --execute

      - name: Upload exact builder closure return
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-terrain-estate-construction-registry-prerequisite-terminal-closure-builder
          path: /tmp/h-earth-terrain-estate-construction-registry-prerequisite-terminal-closure/
          if-no-files-found: error
          retention-days: 90

  fresh-role3-verification:
    needs: terminal-closure-builder
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Fresh checkout of exact closure carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebind exact main and carrier ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$CARRIER_BRANCH"
          git fetch --no-tags origin main
          test "$(git merge-base "$EXACT_MAIN" "$GITHUB_SHA")" = "$EXACT_MAIN"
          test "$(git rev-parse origin/main)" = "$EXACT_MAIN"

      - name: Independently reproduce terminal state and construction lock preservation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OUTPUT_PATH: /tmp/h-earth-terrain-estate-construction-registry-prerequisite-terminal-closure/role3-terminal-verification.v1.json
        run: |
          set -euo pipefail
          mkdir -p /tmp/h-earth-terrain-estate-construction-registry-prerequisite-terminal-closure
          node "$EXECUTOR" --verify-terminal

      - name: Upload fresh Role 3 receipt
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-terrain-estate-construction-registry-prerequisite-terminal-closure-role3
          path: /tmp/h-earth-terrain-estate-construction-registry-prerequisite-terminal-closure/
          if-no-files-found: error
          retention-days: 90
