name: Characters Environment V2 Qualification

on:
  pull_request:
    paths:
      - 'characters/**'
      - 'control-plane/whole-estate/characters-reconstruction-v1/**'
      - '.github/workflows/characters-environment-v2-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/characters-environment-v2-qualification.yml
            /characters/
            /h-earth-3d/
            /showroom/globe/h-earth/render/
            /control-plane/whole-estate/characters-reconstruction-v1/verify-gratitude-environment-v2.v1.mjs
      - name: Fetch exact main comparison ref
        run: git fetch origin '+refs/heads/main:refs/remotes/origin/main' --no-tags
      - name: Run environment-only qualification
        run: node control-plane/whole-estate/characters-reconstruction-v1/verify-gratitude-environment-v2.v1.mjs
