            completeLifecycleDispositionCount:a.completeLifecycleDispositionCount,
            pairRelationshipCount:a.pairRelationshipCount,
            allPairRelationshipsPass:a.pairRelationshipMatrix.every(v=>v.passed),
            preservationLawCount:a.preservationLawCount,
            allPreservationLawsPass:a.allPreservationLawsPass,
            registryPreflightStatus:a.registryPreflight.status,
            unresolvedRequiredPlacementFieldCount:a.unresolvedRequiredPlacementFieldCount,
            regionalComposite:a.regionalComposite,
            finalPlacementPrMergeAuthorized:a.authorityBoundary.finalPlacementPrMergeAuthorized,
            constructionAuthorized:a.authorityBoundary.productConstruction,
            issues
          };
          const ct=`${JSON.stringify(custody,null,2)}\n`;
          const authority={schemaVersion:'H_EARTH_GRATITUDE_REGION_FP05_AUTHORITY_INPUT_v1',authorizedBaseHead:BASE,sourcePaths:P,fp03DurableCustody:FP03,fp04DurableCustody:FP04,authorityQuestion:'DO_ALL_FOUR_AREAS_HAVE_COMPLETE_LIFECYCLE_DISPOSITIONS_WITH_THE_SIX_PAIR_RELATIONSHIP_MATRIX_AND_ALL_PRESERVATION_LAWS_PASSING?',requiredResult:'FINAL_PLACEMENT_DISPOSITION_RESOLVED_PASS_CLOSED',stoppingBoundary:'STOP_BEFORE_FINAL_PLACEMENT_PR_MERGE'};
          const it=`${JSON.stringify(authority,null,2)}\n`;
          fs.writeFileSync('fp05-evidence/fp05-authority-input.json',it);
          fs.writeFileSync('fp05-evidence/fp05-regional-composite-receipt-first.json',at);
          fs.writeFileSync('fp05-evidence/fp05-regional-composite-receipt-second.json',bt);
          fs.writeFileSync('fp05-evidence/fp05-execution-custody.json',ct);
          fs.writeFileSync('fp05-evidence/fp05-artifact-manifest.json',`${JSON.stringify({'fp05-authority-input.json':sh(it),'fp05-regional-composite-receipt-first.json':ash,'fp05-regional-composite-receipt-second.json':bsh,'fp05-execution-custody.json':sh(ct)},null,2)}\n`);
          console.log(ct);
          if(!custody.eligible)process.exitCode=1;
          NODE
      - name: Upload FP-05 evidence
        if: always()
