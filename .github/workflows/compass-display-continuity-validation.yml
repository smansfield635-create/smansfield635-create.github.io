name: Compass Display Continuity Validation

on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/compass/**'
      - '.github/ai-router/router.v1.json'
      - '.github/ai-router/projects/compass/entrypoint.v1.json'
      - '.github/ai-router/projects/compass/verify-display-continuity.v1.mjs'
      - '.github/ai-router/projects/compass/verify-performance-successor.mjs'
      - '.github/workflows/compass-display-continuity-validation.yml'
      - '.github/workflows/compass-performance-successor-validation.yml'
      - '.github/workflows/compass-carousel-successor-live-qualification.yml'
      - '.github/workflows/pages-direct-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPASS_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify-static-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run fresh fail-closed Compass verifier
        env:
          COMPASS_VERIFICATION_OUTPUT: /tmp/compass-display-continuity-verification-receipt.json
        run: |
          test "$(git rev-parse HEAD^{commit})" = "$COMPASS_CANDIDATE_HEAD"
          node .github/ai-router/projects/compass/verify-display-continuity.v1.mjs --binding > /tmp/compass-operation-binding.json
          node .github/ai-router/projects/compass/verify-display-continuity.v1.mjs
      - name: Upload static verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compass-display-continuity-verification-receipt
          path: |
            /tmp/compass-operation-binding.json
            /tmp/compass-display-continuity-verification-receipt.json

  qualify-runtime:
    runs-on: ubuntu-latest
    needs: verify-static-contract
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve fresh operation binding
        run: node .github/ai-router/projects/compass/verify-display-continuity.v1.mjs --binding > /tmp/compass-operation-binding.json
      - name: Install Playwright outside repository contract
        env:
          npm_config_package_lock: 'false'
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Start local static host
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/compass-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/compass-http.log
          exit 1
      - name: Qualify estate continuity and accessible composition
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {chromium} from 'playwright';const binding=JSON.parse(fs.readFileSync('/tmp/compass-operation-binding.json','utf8')),browser=await chromium.launch({headless:true}),checks=[];const check=(id,pass,evidence)=>checks.push({id,pass:Boolean(pass),evidence});let fatal=null;
          try{
            for(const [name,width,height] of [['desktop',1440,900],['tablet',1024,768],['phone',390,844]]){
              const context=await browser.newContext({viewport:{width,height}}),page=await context.newPage(),errors=[];page.on('pageerror',error=>errors.push(String(error)));await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});await page.waitForFunction(()=>globalThis.CompassEditorialCarousel?.version==='awards-trl-brain-successor-v1');await page.waitForTimeout(600);
              const result=await page.evaluate(()=>{const visible=element=>{const rect=element.getBoundingClientRect(),style=getComputedStyle(element);return rect.width>0&&rect.height>0&&style.visibility!=='hidden'&&style.display!=='none'};return{cardinals:[...document.querySelectorAll('[data-compass-cardinal]')].map(element=>element.dataset.cardinalId),rooms:document.querySelectorAll('[data-compass-room-declarations] [data-compass-room]').length,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,introOpen:document.querySelector('[data-compass-full-introduction]')?.open,mirrorRoutes:document.querySelectorAll('[data-compass-mirrorland-routes] a:not([data-compass-mirrorland-inline-back])').length,capabilities:document.querySelectorAll('[data-capability-orbit] > [data-capability]').length,capabilityFront:document.querySelectorAll('[data-capability-orbit] > [data-slot="front"]').length,proofs:document.querySelectorAll('[data-proof-card]').length,proofFront:document.querySelectorAll('[data-proof-card][data-slot="front"]').length,buildSeparated:document.querySelector('.compass-built .compass-build-cta')===null,targets:[...document.querySelectorAll('[data-capability-orbit] button,[data-capability-orbit] a,[data-proof-orbit] button,[data-proof-orbit] a')].filter(visible).map(element=>{const rect=element.getBoundingClientRect();return{label:element.getAttribute('aria-label')||element.textContent.trim(),width:rect.width,height:rect.height}}),guidance:visible(document.querySelector('[data-capability-guidance]'))&&visible(document.querySelector('[data-proof-orbit] .compass-proof-guidance'))}});
              check(`${name}_CARDINALS`,JSON.stringify(result.cardinals)===JSON.stringify(['north','east','south','west']),result);check(`${name}_ROOMS`,result.rooms===19,result);check(`${name}_MIRRORLAND`,result.mirrorRoutes===3,result);check(`${name}_SUCCESSOR_SURFACES`,result.capabilities===3&&result.capabilityFront===1&&result.proofs===3&&result.proofFront===1,result);check(`${name}_LOWER_HIERARCHY`,result.buildSeparated,result);check(`${name}_GUIDANCE_VISIBLE`,result.guidance,result);check(`${name}_TARGET_SIZES`,result.targets.every(target=>target.width>=34&&target.height>=34),result.targets);check(`${name}_NO_OVERFLOW`,result.overflow<=2,result);check(`${name}_INTRO_COLLAPSED`,result.introOpen===false,result);check(`${name}_NO_ERRORS`,errors.length===0,errors);await page.screenshot({path:`/tmp/compass-display-${name}.png`,fullPage:true});await context.close();
            }
            const context=await browser.newContext({viewport:{width:1280,height:900}}),page=await context.newPage();await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});await page.waitForTimeout(500);const north=page.locator('[data-cardinal-id="north"]');await north.focus();check('CARDINAL_KEYBOARD_FOCUS',await north.evaluate(element=>document.activeElement===element),true);await north.press('Enter');await page.waitForTimeout(500);const opened=await page.locator('[data-compass-root]').evaluate(element=>({mode:element.dataset.compassMode,selected:element.dataset.selectedCardinal,preview:element.dataset.clusterPreviewPrimaryRoom||'',enterDisabled:document.querySelector('[data-compass-enter]')?.disabled,guidance:document.querySelector('[data-compass-guidance]')?.textContent.trim()}));check('CARDINAL_CLUSTER_CONTINUITY',opened.mode==='CLUSTER_OPEN'&&opened.selected==='north'&&opened.preview&&opened.enterDisabled===false,opened);const roomSelected=await page.evaluate(()=>globalThis.DGB_COMPASS_CONTROLLER?.requestRoomSelection('north-1')===true);await page.waitForTimeout(300);const selected=await page.locator('[data-compass-root]').evaluate(element=>({mode:element.dataset.compassMode,room:element.dataset.selectedRoom,returnVisible:Boolean(document.querySelector('[data-compass-return-to-orbit]')?.offsetParent)}));check('ROOM_SELECTION_CONTINUITY',roomSelected&&selected.mode==='ROOM_SELECTED'&&selected.room==='north-1'&&selected.returnVisible,selected);await page.locator('[data-compass-return-to-orbit]').click();await page.waitForTimeout(300);check('EXPLICIT_RETURN_CONTINUITY',(await page.locator('[data-compass-root]').getAttribute('data-compass-mode'))==='CLUSTER_OPEN',await page.locator('[data-compass-root]').getAttribute('data-compass-mode'));await context.close();
            const reducedContext=await browser.newContext({viewport:{width:390,height:844},reducedMotion:'reduce'}),reduced=await reducedContext.newPage();await reduced.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});await reduced.waitForTimeout(500);check('REDUCED_MOTION_SEMANTIC_EQUIVALENCE',await reduced.locator('[data-compass-cardinal]').count()===4&&await reduced.locator('[data-capability-orbit] > [data-capability]').count()===3&&await reduced.locator('[data-proof-card]').count()===3,{cardinals:await reduced.locator('[data-compass-cardinal]').count(),capabilities:await reduced.locator('[data-capability-orbit] > [data-capability]').count(),proofs:await reduced.locator('[data-proof-card]').count()});await reducedContext.close();
          }catch(error){fatal=String(error?.stack||error);check('DISPLAY_RUNTIME_EXECUTION',false,fatal)}finally{await browser.close()}
          const failures=checks.filter(item=>!item.pass),receipt={schema:'COMPASS_AWARDS_TRL_BRAIN_DISPLAY_RUNTIME_v1',...binding,candidateHead:process.env.COMPASS_CANDIDATE_HEAD,result:failures.length?'FAIL_CLOSED':'PASS_CLOSED',checks,failures:failures.map(item=>item.id),fatal};fs.writeFileSync('/tmp/compass-display-runtime.json',JSON.stringify(receipt,null,2)+'\n');console.log(JSON.stringify(receipt,null,2));if(failures.length)process.exit(1);
          NODE
      - name: Upload display evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compass-display-continuity-runtime-evidence
          path: |
            /tmp/compass-operation-binding.json
            /tmp/compass-display-runtime.json
            /tmp/compass-display-*.png
