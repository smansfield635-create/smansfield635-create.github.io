name: Pages Emergency Latest-Head Flush

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-emergency-latest-head-flush.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  flush-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch authoritative latest-head deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages-direct-deploy.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Dispatched Direct GitHub Pages Deploy against latest main after cancelling stale pages-group work."
