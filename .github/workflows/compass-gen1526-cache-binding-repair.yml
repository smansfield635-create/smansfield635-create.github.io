name: Compass Gen1526 Release Cache Binding Repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'restore/compass-gen1526-exact-release-v1-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Give Gen1526 identity support a unique publication key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/compass/compass.brain-scene.js')
          s=p.read_text()
          old='/assets/compass/compass.identity-3d.css?v=compass-gen1524-frontpage-corrective'
          new='/assets/compass/compass.identity-3d.css?v=gen1526-atomic-release-v1'
          oldjs='/assets/compass/compass.identity-3d.js?v=compass-gen1524-frontpage-corrective'
          newjs='/assets/compass/compass.identity-3d.js?v=gen1526-atomic-release-v1'
          if old not in s or oldjs not in s:
              raise SystemExit('expected identity support bindings not found')
          s=s.replace(old,new,1).replace(oldjs,newjs,1)
          p.write_text(s)
          PY
          grep -Fq 'compass.identity-3d.js?v=gen1526-atomic-release-v1' assets/compass/compass.brain-scene.js
          grep -Fq 'compass.identity-3d.css?v=gen1526-atomic-release-v1' assets/compass/compass.brain-scene.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/compass/compass.brain-scene.js
          git commit -m 'Bind Gen1526 identity support to unique release cache key'
          git push origin HEAD:${{ github.head_ref }}
