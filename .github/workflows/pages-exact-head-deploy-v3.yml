name: Exact Head Pages Deploy v3

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact approved current-main commit SHA to publish
        required: true
        type: string
      surface_id:
        description: Registered public surface verification id
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Require exact current main
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          requested="$(printf '%s' "$REQUESTED_SHA" | tr -d '[:space:]')"
          main_sha="$(curl --fail-with-body --silent --show-error -L -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test -n "$requested"
          test "$requested" = "$main_sha"
          echo "target_sha=$requested" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.target_sha }}
          fetch-depth: 1

      - name: Validate registered surface
        id: surface
        env:
          SURFACE_ID: ${{ inputs.surface_id }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SURFACE_ID" | grep -Eq '^[a-z0-9][a-z0-9._-]{0,79}$'
          manifest=".github/ai-router/publication-surfaces/${SURFACE_ID}.json"
          test -f "$manifest"
          jq -e --arg id "$SURFACE_ID" '.schema=="PUBLICATION_SURFACE_VERIFICATION_v1" and .surfaceId==$id and (.checks|type=="array") and (.checks|length>0)' "$manifest" >/dev/null
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "runtime=$(jq -r 'if .runtime?.enabled == true then "true" else "false" end' "$manifest")" >> "$GITHUB_OUTPUT"

      - name: Build bounded Pages payload
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
          SURFACE_ID: ${{ inputs.surface_id }}
          MANIFEST: ${{ steps.surface.outputs.manifest }}
          STAGE: ${{ runner.temp }}/pages-site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          rsync -a --prune-empty-dirs --exclude='.git/' --exclude='.github/' --exclude='preview/' ./ "$STAGE/"
          mkdir -p "$STAGE/.well-known"
          manifest_sha="$(sha256sum "$MANIFEST" | awk '{print $1}')"
          jq -n --arg schema DGB_PUBLIC_RELEASE_MARKER_v3 --arg commit "$TARGET_SHA" --arg surface "$SURFACE_ID" --arg manifest "$MANIFEST" --arg manifestSha256 "$manifest_sha" '{schema:$schema,commit:$commit,surface:$surface,verificationManifest:$manifest,verificationManifestSha256:$manifestSha256}' > "$STAGE/.well-known/dgb-release.json"

          if [ "$SURFACE_ID" = "audralia" ]; then
            audralia_index="$STAGE/showroom/globe/audralia/index.html"
            test -f "$audralia_index"
            short_sha="$(printf '%s' "$TARGET_SHA" | cut -c1-8 | tr '[:lower:]' '[:upper:]')"
            python3 - "$audralia_index" "$short_sha" "$TARGET_SHA" <<'PY'
          from pathlib import Path
          import re
          import sys
          path = Path(sys.argv[1])
          short_sha = sys.argv[2]
          full_sha = sys.argv[3]
          text = path.read_text()
          pattern = re.compile(r'<div class="audralia-loading-version"(?: data-audralia-build-sha="[^"]*")?>([^<]*)</div>')
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'AUDRALIA_BUILD_FINGERPRINT_STAMP_CARDINALITY:{len(matches)}')
          label = re.sub(r'\s*·\s*BUILD\s+[A-Fa-f0-9]{8}\s*$', '', matches[0].group(1)).strip()
          new = f'<div class="audralia-loading-version" data-audralia-build-sha="{full_sha}">{label} · BUILD {short_sha}</div>'
          text = text[:matches[0].start()] + new + text[matches[0].end():]
          path.write_text(text)
          PY
            grep -Fq "data-audralia-build-sha=\"$TARGET_SHA\"" "$audralia_index"
            grep -Fq "BUILD $short_sha" "$audralia_index"
            echo "AUDRALIA_VISIBLE_BUILD_FINGERPRINT=$short_sha"
          fi

          if [ "$SURFACE_ID" = "brain-gen1-hra" ]; then
            brain_root="$STAGE/inspection/compass/brain-gen1-hra"
            brain_asset="$brain_root/Allen_M_Brain.glb"
            brain_runtime="$brain_root/inspector.js"
            source_url='https://ccf-ontology.hubmapconsortium.org/objects/v1.2/Allen_M_Brain.glb'
            expected_sha='2b9ad5b53e40e9f0936da74f7be38d2eed15604e26358c3870a0ea13499b9a35'
            expected_bytes='11977312'
            test -f "$brain_runtime"
            curl --fail --location --retry 3 "$source_url" -o "$brain_asset"
            observed_sha="$(sha256sum "$brain_asset" | awk '{print $1}')"
            observed_bytes="$(stat -c '%s' "$brain_asset")"
            test "$observed_sha" = "$expected_sha"
            test "$observed_bytes" = "$expected_bytes"
            python3 - "$brain_runtime" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          old = "const SOURCE='https://ccf-ontology.hubmapconsortium.org/objects/v1.2/Allen_M_Brain.glb';"
          new = "const SOURCE='./Allen_M_Brain.glb';"
          if text.count(old) != 1:
              raise SystemExit(f'BRAIN_GEN1_SOURCE_REWRITE_CARDINALITY:{text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
            grep -Fq "const SOURCE='./Allen_M_Brain.glb';" "$brain_runtime"
            echo "BRAIN_GEN1_HRA_SAME_ORIGIN_ASSET_BOUND sha256=$observed_sha bytes=$observed_bytes"
          fi

          test "$(du -sb "$STAGE" | awk '{print $1}')" -lt 1073741824

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site
      - name: Deploy exact-head artifact
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Verify static public surface
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
          MANIFEST: ${{ steps.surface.outputs.manifest }}
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
          SURFACE_ID: ${{ inputs.surface_id }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            marker="$(curl --fail --silent --show-error -L --max-time 20 "${PAGE_URL%/}/.well-known/dgb-release.json" 2>/dev/null || true)"
            observed="$(printf '%s' "$marker" | jq -r '.commit // empty' 2>/dev/null || true)"
            observed_surface="$(printf '%s' "$marker" | jq -r '.surface // empty' 2>/dev/null || true)"
            if [ "$observed" = "$TARGET_SHA" ] && [ "$observed_surface" = "$SURFACE_ID" ]; then
              if [ "$SURFACE_ID" = "audralia" ]; then
                short_sha="$(printf '%s' "$TARGET_SHA" | cut -c1-8 | tr '[:lower:]' '[:upper:]')"
                audralia_url="${PAGE_URL%/}/showroom/globe/audralia/"
                public_html="$(curl --fail --silent --show-error -L --max-time 20 "$audralia_url")"
                if ! printf '%s' "$public_html" | grep -Fq "data-audralia-build-sha=\"$TARGET_SHA\"" || ! printf '%s' "$public_html" | grep -Fq "BUILD $short_sha"; then
                  echo "PUBLIC_BUILD_FINGERPRINT_MISMATCH expected=$short_sha observed=NONE" >&2
                  exit 1
                fi
                echo "PUBLIC_BUILD_FINGERPRINT_VERIFIED=$short_sha"
              fi
              if [ "$SURFACE_ID" = "brain-gen1-hra" ]; then
                brain_url="${PAGE_URL%/}/inspection/compass/brain-gen1-hra/Allen_M_Brain.glb"
                brain_tmp="$(mktemp)"
                curl --fail --silent --show-error -L --max-time 30 "$brain_url" -o "$brain_tmp"
                test "$(sha256sum "$brain_tmp" | awk '{print $1}')" = '2b9ad5b53e40e9f0936da74f7be38d2eed15604e26358c3870a0ea13499b9a35'
                test "$(stat -c '%s' "$brain_tmp")" = '11977312'
                rm -f "$brain_tmp"
                echo 'BRAIN_GEN1_HRA_PUBLIC_ASSET_IDENTITY_VERIFIED'
              fi
              node tools/publication-live-verify.mjs static "$PAGE_URL" "$MANIFEST"
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Set up Chrome
        if: ${{ steps.surface.outputs.runtime == 'true' }}
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Install runtime verifier
        if: ${{ steps.surface.outputs.runtime == 'true' }}
        run: npm install --no-save --no-package-lock puppeteer-core@24.15.0
      - name: Verify runtime public surface
        if: ${{ steps.surface.outputs.runtime == 'true' }}
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
          MANIFEST: ${{ steps.surface.outputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_PATH="$(command -v google-chrome || command -v chrome || command -v chromium || find /opt/hostedtoolcache/setup-chrome -type f -name chrome 2>/dev/null | head -1)"
          node tools/publication-live-verify.mjs runtime "$PAGE_URL" "$MANIFEST"
