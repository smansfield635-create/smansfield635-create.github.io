name: H-Earth Run 8A Bootstrap

on:
  push:
    branches:
      - agent/h-earth-run8a-dimensional-reconciliation-001

permissions:
  contents: write

jobs:
  construct-run8a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Run 8A workspace
        uses: actions/checkout@v4
        with:
          ref: agent/h-earth-run8a-dimensional-reconciliation-001
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Construct Run 8A contract package
        run: |
          set -euo pipefail
          mkdir -p h-earth-3d/control-plane/run-8
          mkdir -p h-earth-3d/validation
          mkdir -p h-earth-3d/registry/accepted-amendments

          cat > h-earth-3d/control-plane/run-8/h-earth.run8a.dimensional-reconciliation.js <<'JS'
          /**
           * H_EARTH_EXISTING_MATHEMATICAL_BASELINE_PACKET_CORRIDOR_AND_DIMENSIONAL_GEOMETRY_RECONCILIATION_RUN_8A_v1
           *
           * Contract-only Run 8A package. It preserves the existing NEWS geometry
           * kernel, Run 6 terrain field, Run 6 proxy occurrence, Packet 001 and
           * Packet 002 boundaries, South construction and West admission. It
           * defines the missing environment-specific dimensional, sampling,
           * attachment and presentation interfaces required before Run 8B.
           *
           * This file creates no neutral geometry, admission, transfer, frame,
           * renderer resource, route mutation, deployment or public visual claim.
           */

          import {
            H_EARTH_3D_GEOMETRY_KERNEL_PUBLIC_FACADE_CONTRACT_ID,
            H_EARTH_3D_GEOMETRY_MATHEMATICS_PACKET_ID,
            H_EARTH_3D_GEOMETRY_OWNERSHIP_CONTRACT_ID,
            H_EARTH_3D_GEOMETRY_KERNEL_NORTH_CONTRACT_ID,
            H_EARTH_3D_GEOMETRY_KERNEL_EAST_CONTRACT_ID,
            H_EARTH_3D_GEOMETRY_KERNEL_SOUTH_CONTRACT_ID,
            H_EARTH_3D_GEOMETRY_KERNEL_WEST_CONTRACT_ID
          } from '../../../showroom/globe/h-earth/render/geometry-kernel.js';

          import {
            H_EARTH_TERRAIN_FIELD,
            H_EARTH_TERRAIN_FIELD_CONTRACT_ID,
            sampleHEarthTerrainElevation
          } from '../../terrain/h-earth.terrain-field.js';

          import {
            H_EARTH_TERRAIN_FORMATIONS,
            H_EARTH_TERRAIN_FORMATIONS_CONTRACT_ID
          } from '../../terrain/h-earth.terrain-formations.js';

          import {
            H_EARTH_LANDSCAPE_REALIZATION_PLANNER_CONTRACT_ID,
            H_EARTH_FUNCTIONAL_LANDSCAPE_REALIZATION_PLAN
          } from '../../integration/h-earth.landscape-realization-planner.js';

          import {
            H_EARTH_SOURCE_OBJECT_GEOMETRY_RESOLUTION_CONTRACT_ID,
            H_EARTH_SOURCE_OBJECT_GEOMETRY_RESOLUTION_CONTRACT
          } from '../../integration/h-earth.source-object-geometry-resolution.js';

          import {
            H_EARTH_POST_WEST_ADMITTED_GEOMETRY_TRANSFER_CONTRACT_ID
          } from '../../integration/h-earth.post-west-admitted-geometry-transfer.js';

          import {
            H_EARTH_GEOMETRY_LANDSCAPE_CONTRACT_ID,
            H_EARTH_GEOMETRY_LANDSCAPE_PROFILE
          } from '../../../showroom/globe/h-earth/render/geometry-landscape.js';

          import {
            H_EARTH_GEOMETRY_DISTANT_CONTEXT_CONTRACT_ID
          } from '../../../showroom/globe/h-earth/render/geometry-distant-context.js';

          const freeze = (value, seen = new WeakSet()) => {
            if (value === null || typeof value !== 'object' || seen.has(value)) return value;
            seen.add(value);
            Object.values(value).forEach((nested) => freeze(nested, seen));
            return Object.isFrozen(value) ? value : Object.freeze(value);
          };

          const finite = (value) => typeof value === 'number' && Number.isFinite(value);
          const clamp = (value, minimum, maximum) =>
            Math.min(maximum, Math.max(minimum, value));
          const smoothstep = (edge0, edge1, value) => {
            if (edge0 === edge1) return value < edge0 ? 0 : 1;
            const t = clamp((value - edge0) / (edge1 - edge0), 0, 1);
            return t * t * (3 - 2 * t);
          };
          const smootherstep01 = (value) => {
            const t = clamp(value, 0, 1);
            return t * t * t * (t * (t * 6 - 15) + 10);
          };
          const gaussian = (value, center, radius) => {
            const d = (value - center) / radius;
            return Math.exp(-(d * d));
          };
          const intervalEnvelope = (value, minimum, maximum, feather) =>
            smoothstep(minimum, minimum + feather, value) *
            (1 - smoothstep(maximum - feather, maximum, value));

          export const H_EARTH_RUN_8A_CONTRACT_ID =
            'H_EARTH_EXISTING_MATHEMATICAL_BASELINE_PACKET_CORRIDOR_AND_DIMENSIONAL_GEOMETRY_RECONCILIATION_RUN_8A_v1';

          export const H_EARTH_RUN_8A_SOURCE_FILE =
            '/h-earth-3d/control-plane/run-8/h-earth.run8a.dimensional-reconciliation.js';

          export const H_EARTH_RUN_8A_BASELINE_INTAKE_AND_PRESERVATION_LEDGER = freeze({
            outputId: 'RUN_8A_OUTPUT_1_EXISTING_MATHEMATICAL_BASELINE_INTAKE_AND_PRESERVATION_LEDGER',
            controllingRepositoryCommit: 'bb1273ecad6ad1441555e035a58d2ae7a1c3dc91',
            records: [
              {
                authority: 'GEOMETRY_MATHEMATICS_CONSTITUTION',
                source: '/showroom/globe/h-earth/render/geometry-kernel.js',
                identity: H_EARTH_3D_GEOMETRY_MATHEMATICS_PACKET_ID,
                disposition: 'PRESERVE'
              },
              {
                authority: 'NEWS_GEOMETRY_PUBLIC_FACADE',
                source: '/showroom/globe/h-earth/render/geometry-kernel.js',
                identity: H_EARTH_3D_GEOMETRY_KERNEL_PUBLIC_FACADE_CONTRACT_ID,
                disposition: 'PRESERVE'
              },
              {
                authority: 'NEWS_GEOMETRY_OWNERSHIP',
                source: '/showroom/globe/h-earth/render/geometry-kernel.js',
                identity: H_EARTH_3D_GEOMETRY_OWNERSHIP_CONTRACT_ID,
                disposition: 'PRESERVE'
              },
              {
                authority: 'NORTH_FOUNDATIONAL_MATHEMATICS',
                identity: H_EARTH_3D_GEOMETRY_KERNEL_NORTH_CONTRACT_ID,
                disposition: 'PRESERVE'
              },
              {
                authority: 'EAST_DESCRIPTION_TOPOLOGY_AND_NORMALS',
                identity: H_EARTH_3D_GEOMETRY_KERNEL_EAST_CONTRACT_ID,
                disposition: 'PRESERVE'
              },
              {
                authority: 'SOUTH_NEUTRAL_GEOMETRY_CONSTRUCTION',
                identity: H_EARTH_3D_GEOMETRY_KERNEL_SOUTH_CONTRACT_ID,
                disposition: 'PRESERVE'
              },
              {
                authority: 'WEST_ADMISSION_AND_AGGREGATE_FRAME',
                identity: H_EARTH_3D_GEOMETRY_KERNEL_WEST_CONTRACT_ID,
                disposition: 'PRESERVE'
              },
              {
                authority: 'RUN_6_CANONICAL_TERRAIN_FIELD',
                source: '/h-earth-3d/terrain/h-earth.terrain-field.js',
                identity: H_EARTH_TERRAIN_FIELD_CONTRACT_ID,
                disposition: 'PRESERVE_AS_BASELINE_OCCURRENCE'
              },
              {
                authority: 'RUN_6_TERRAIN_FORMATIONS',
                source: '/h-earth-3d/terrain/h-earth.terrain-formations.js',
                identity: H_EARTH_TERRAIN_FORMATIONS_CONTRACT_ID,
                disposition: 'PRESERVE_AS_BASELINE_OCCURRENCE'
              },
              {
                authority: 'RUN_6_REALIZATION_PLANNER',
                source: '/h-earth-3d/integration/h-earth.landscape-realization-planner.js',
                identity: H_EARTH_LANDSCAPE_REALIZATION_PLANNER_CONTRACT_ID,
                disposition: 'PRESERVE_PENDING_SUCCESSOR_PLANNER'
              },
              {
                authority: 'RUN_6_TERRAIN_GEOMETRY_PROVIDER',
                source: '/showroom/globe/h-earth/render/geometry-landscape.js',
                identity: H_EARTH_GEOMETRY_LANDSCAPE_CONTRACT_ID,
                disposition: 'PRESERVE_AS_9_BY_9_BASELINE'
              },
              {
                authority: 'RUN_6_DISTANT_PROXY_PROVIDER',
                source: '/showroom/globe/h-earth/render/geometry-distant-context.js',
                identity: H_EARTH_GEOMETRY_DISTANT_CONTEXT_CONTRACT_ID,
                disposition: 'PRESERVE_AS_LEGACY_PROXY_OCCURRENCE'
              },
              {
                authority: 'PACKET_001_WET_SAND_SOURCE_RESOLUTION',
                source: '/h-earth-3d/integration/h-earth.source-object-geometry-resolution.js',
                identity: H_EARTH_SOURCE_OBJECT_GEOMETRY_RESOLUTION_CONTRACT_ID,
                disposition: 'PRESERVE_AS_REQUIRED_PRECEDENT'
              },
              {
                authority: 'PACKET_002_POST_WEST_TRANSFER',
                source: '/h-earth-3d/integration/h-earth.post-west-admitted-geometry-transfer.js',
                identity: H_EARTH_POST_WEST_ADMITTED_GEOMETRY_TRANSFER_CONTRACT_ID,
                disposition: 'PRESERVE_AS_REQUIRED_DOWNSTREAM_PRECEDENT'
              }
            ],
            forbiddenReinvention: [
              'VECTOR_MATHEMATICS',
              'MATRIX_MATHEMATICS',
              'FINITE_NUMBER_LAWS',
              'BOUNDS',
              'TOLERANCES',
              'HEIGHT_FIELD_SAMPLING_FOUNDATIONS',
              'FACE_AND_VERTEX_NORMAL_FOUNDATIONS',
              'INDEXED_MESH_VALIDATION',
              'NEUTRAL_PRIMITIVE_CONSTRUCTION',
              'WEST_ADMISSION'
            ]
          });

          export const H_EARTH_RUN_8A_PACKET_APPLICABILITY_DISPOSITION = freeze({
            outputId: 'RUN_8A_OUTPUT_2_PACKET_001_AND_PACKET_002_APPLICABILITY_DISPOSITION',
            packet001: {
              currentContractId: H_EARTH_SOURCE_OBJECT_GEOMETRY_RESOLUTION_CONTRACT_ID,
              currentScope: H_EARTH_SOURCE_OBJECT_GEOMETRY_RESOLUTION_CONTRACT.packetName,
              disposition: 'PRESERVE_UNMODIFIED',
              universalResolver: false,
              successorMountainDisposition:
                'NEW_PACKET_001_STYLE_FORMATION_RESOLUTION_LANE_REQUIRED',
              vegetationDisposition:
                'NEW_OBJECT_ARCHETYPE_AND_INSTANCE_RESOLUTION_LANE_REQUIRED',
              reason: [
                'CURRENT_PACKET_IS_HARD_BOUND_TO_WET_SAND',
                'CURRENT_PACKET_ACCEPTS_ONLY_OBJ_002_FOREGROUND_WET_SAND',
                'SILENT_GENERALIZATION_WOULD_CHANGE_PACKET_AUTHORITY'
              ]
            },
            packet002: {
              currentContractId: H_EARTH_POST_WEST_ADMITTED_GEOMETRY_TRANSFER_CONTRACT_ID,
              disposition: 'PRESERVE_UNMODIFIED',
              shapeDefinitionAuthority: false,
              successorDisposition:
                'NEW_NARROW_SUCCESSOR_POST_WEST_TRANSFER_LANE_REQUIRED',
              renewalTiming: 'RUN_8E_AFTER_RUN_8B_TO_8D_EXECUTED_IDENTITIES_EXIST',
              reason: [
                'CURRENT_PACKET_ACCEPTS_BOUNDED_WET_SAND_AND_SHORELINE_PREVIEW_IDENTITIES',
                'RUN_8_SUCCESSOR_PROVENANCE_EXCEEDS_CURRENT_TRANSFER_SCHEMA',
                'PREEMPTIVE_MUTATION_IS_PROHIBITED'
              ]
            }
          });

          export const H_EARTH_RUN_8A_MOUNTAIN_REALIZATION_CLASS_DECISION = freeze({
            outputId: 'RUN_8A_OUTPUT_3_MOUNTAIN_REALIZATION_CLASS_DECISION',
            predecessorFormationId: 'H_EARTH_DISTANT_HIGHLAND_001',
            predecessorDisposition: 'PRESERVE_CURRENT_BASELINE_AND_HISTORY',
            predecessorProviderRealization: 'LEGACY_RUN_6_17_SAMPLE_OPEN_CREST_STRIP',
            inPlaceReclassification: 'PROHIBITED',
            successorFormationId: 'H_EARTH_CONTINUOUS_HIGHLAND_MOUNTAIN_001',
            successorFormationClass: 'CONTINUOUS_HIGHLAND_OR_MOUNTAIN',
            supersedesForFullRealization: 'H_EARTH_DISTANT_HIGHLAND_001',
            fullRealizationEligibility: true,
            proxyRealizationEligibility: true,
            geometricConnectionToTerrain: 'REQUIRED',
            detachedCurtainRealization: 'PROHIBITED',
            navigationClass: 'CONTINUOUS_TERRAIN_WITH_BOUNDED_TRAVERSAL',
            traversalPartitions: {
              foothills: 'POTENTIALLY_NAVIGABLE',
              moderateSlopes: 'TRAVERSAL_PROJECTION_REQUIRED',
              steepRidgesAndCliffs: 'POTENTIALLY_NON_NAVIGABLE',
              summitAccess: 'NOT_PREDECLARED'
            },
            continuousGeometryImpliesUniversalNavigability: false,
            legacyProxyFutureRole:
              'DISTANT_LOD_CANDIDATE_AFTER_SUCCESSOR_CORRESPONDENCE_VALIDATION'
          });

          export const H_EARTH_RUN_8A_WORLD_DOMAIN_RECONCILIATION = freeze({
            outputId: 'RUN_8A_OUTPUT_4_WORLD_DOMAIN_RECONCILIATION',
            currentTerrainFieldContractId: H_EARTH_TERRAIN_FIELD_CONTRACT_ID,
            currentTerrainFieldDisposition: 'PRESERVE_AS_RUN_6_BASELINE',
            terrainFieldMutationInPlace: 'PROHIBITED',
            successorTerrainFieldContractId:
              'H_EARTH_CANONICAL_TERRAIN_FIELD_RUN_8_SUCCESSOR_v1',
            successorWorldDomain: {
              xMinimum: -256,
              xMaximum: 256,
              zMinimum: -320,
              zMaximum: 64,
              seaLevelY: 0
            },
            newlyAuthorizedFieldRegion: { zMinimum: -320, zMaximum: -256 },
            successorMountainCoreBounds: {
              xMinimum: -224,
              xMaximum: 32,
              zMinimum: -292,
              zMaximum: -236
            },
            successorMountainTransitionBounds: {
              xMinimum: -240,
              xMaximum: 56,
              zMinimum: -312,
              zMaximum: -220
            },
            rearWorldBuffer: 28,
            formerBoundaryZ: -256,
            continuityLaw: {
              c0HeightContinuity: 'REQUIRED',
              c1GradientContinuity: 'REQUIRED_WHERE_PRACTICABLE',
              normalContinuity: 'REQUIRED',
              visibleSeam: 'PROHIBITED',
              verticalSkirtAsPrimaryConnection: 'PROHIBITED'
            },
            mereDomainConstantChangeWithoutSurfaceLaw: 'PROHIBITED',
            run8BConstructionBeforeSuccessorFieldLaw: 'PROHIBITED'
          });

          const SUCCESSOR_DOMAIN =
            H_EARTH_RUN_8A_WORLD_DOMAIN_RECONCILIATION.successorWorldDomain;
          const FORMER_BOUNDARY_Z = -256;
          const DERIVATIVE_STEP = 0.5;

          const baselineBoundaryDerivativeZ = (worldX) =>
            (sampleHEarthTerrainElevation(worldX, FORMER_BOUNDARY_Z + DERIVATIVE_STEP) -
              sampleHEarthTerrainElevation(worldX, FORMER_BOUNDARY_Z)) /
            DERIVATIVE_STEP;

          const rearTerrainLevel = (worldX) =>
            16 + 3.5 * Math.sin((worldX + 40) / 76) +
            1.5 * Math.sin((worldX - 18) / 31);

          const successorBaseElevation = (worldX, worldZ) => {
            if (worldZ >= FORMER_BOUNDARY_Z) {
              return sampleHEarthTerrainElevation(worldX, worldZ);
            }
            const boundaryHeight =
              sampleHEarthTerrainElevation(worldX, FORMER_BOUNDARY_Z);
            const boundaryDerivative = baselineBoundaryDerivativeZ(worldX);
            const deltaZ = worldZ - FORMER_BOUNDARY_Z;
            const tangentContinuation =
              boundaryHeight + boundaryDerivative * deltaZ;
            const progress =
              (FORMER_BOUNDARY_Z - worldZ) /
              (FORMER_BOUNDARY_Z - SUCCESSOR_DOMAIN.zMinimum);
            const blend = smootherstep01(progress);
            return tangentContinuation * (1 - blend) +
              rearTerrainLevel(worldX) * blend;
          };

          export const H_EARTH_RUN_8A_MOUNTAIN_DIMENSIONAL_SURFACE_CONTRACT = freeze({
            outputId: 'RUN_8A_OUTPUT_5_MOUNTAIN_DIMENSIONAL_SURFACE_CONTRACT',
            contractId: 'H_EARTH_CONTINUOUS_HIGHLAND_MOUNTAIN_DIMENSIONAL_SURFACE_RUN_8A_v1',
            formationId: 'H_EARTH_CONTINUOUS_HIGHLAND_MOUNTAIN_001',
            coordinateFrame: 'H_EARTH_REGION_SPACE_XYZ_WORLD_UNITS',
            surfaceLaw: 'Y = SUCCESSOR_BASE_TERRAIN(X,Z) + MOUNTAIN_CONTRIBUTION(X,Z)',
            dimensionality: 'XZ_FOOTPRINT_WITH_Y_ELEVATION',
            coreBounds:
              H_EARTH_RUN_8A_WORLD_DOMAIN_RECONCILIATION.successorMountainCoreBounds,
            transitionBounds:
              H_EARTH_RUN_8A_WORLD_DOMAIN_RECONCILIATION.successorMountainTransitionBounds,
            elevationEnvelope: { minimum: 8, maximum: 124 },
            primaryRidgePathLaw:
              'Z=-266+7*sin((X+104)/54)+3*sin((X-12)/21)',
            constituentLaws: [
              'PRIMARY_RIDGE_MASS',
              'SUMMIT_MASS',
              'SECONDARY_RIDGE_MASS',
              'FOOTHILL_CONNECTION',
              'VALLEY_CUT',
              'REAR_FALLOFF'
            ],
            requiresMultipleZBands: true,
            requiresGroundConnection: true,
            requiresSharedTerrainTruth: true,
            independentProxyShapeInvention: 'PROHIBITED',
            derivationChain: [
              'SUCCESSOR_MOUNTAIN_DIMENSIONAL_TRUTH',
              'FULL_DETAIL_TERRAIN_MESH',
              'REDUCED_DETAIL_TERRAIN_MESH',
              'DISTANT_PROXY_MESH'
            ]
          });

          export function evaluateHEarthRun8AMountainContribution(worldX, worldZ) {
            if (!finite(worldX) || !finite(worldZ)) return Number.NaN;
            const transition =
              H_EARTH_RUN_8A_MOUNTAIN_DIMENSIONAL_SURFACE_CONTRACT.transitionBounds;
            if (
              worldX < transition.xMinimum || worldX > transition.xMaximum ||
              worldZ < transition.zMinimum || worldZ > transition.zMaximum
            ) return 0;

            const xEnvelope =
              intervalEnvelope(worldX, transition.xMinimum, transition.xMaximum, 24);
            const zEnvelope =
              intervalEnvelope(worldZ, transition.zMinimum, transition.zMaximum, 20);
            const ridgeZ = -266 +
              7 * Math.sin((worldX + 104) / 54) +
              3 * Math.sin((worldX - 12) / 21);
            const primaryRidge =
              62 * xEnvelope * gaussian(worldZ, ridgeZ, 22);
            const summit =
              27 * gaussian(worldX, -92, 38) * gaussian(worldZ, -271, 17);
            const secondaryRidge =
              24 * gaussian(worldX, -6, 52) * gaussian(worldZ, -250, 20);
            const foothill = 13 * xEnvelope * zEnvelope;
            const valleyCut =
              15 * gaussian(worldX, -48, 26) * gaussian(worldZ, -256, 13);
            return zEnvelope * Math.max(
              0,
              primaryRidge + summit + secondaryRidge + foothill - valleyCut
            );
          }

          export function sampleHEarthRun8ASuccessorTerrainElevation(worldX, worldZ) {
            if (!finite(worldX) || !finite(worldZ)) return Number.NaN;
            if (
              worldX < SUCCESSOR_DOMAIN.xMinimum ||
              worldX > SUCCESSOR_DOMAIN.xMaximum ||
              worldZ < SUCCESSOR_DOMAIN.zMinimum ||
              worldZ > SUCCESSOR_DOMAIN.zMaximum
            ) return Number.NaN;
            return successorBaseElevation(worldX, worldZ) +
              evaluateHEarthRun8AMountainContribution(worldX, worldZ);
          }

          export function sampleHEarthRun8ASuccessorTerrainField(worldX, worldZ) {
            const elevation =
              sampleHEarthRun8ASuccessorTerrainElevation(worldX, worldZ);
            if (!finite(elevation)) {
              return freeze({
                valid: false,
                status: 'RUN_8A_SUCCESSOR_TERRAIN_SAMPLE_REJECTED',
                worldX,
                worldZ
              });
            }
            const xLeft = Math.max(SUCCESSOR_DOMAIN.xMinimum, worldX - DERIVATIVE_STEP);
            const xRight = Math.min(SUCCESSOR_DOMAIN.xMaximum, worldX + DERIVATIVE_STEP);
            const zBack = Math.max(SUCCESSOR_DOMAIN.zMinimum, worldZ - DERIVATIVE_STEP);
            const zFront = Math.min(SUCCESSOR_DOMAIN.zMaximum, worldZ + DERIVATIVE_STEP);
            const dx =
              (sampleHEarthRun8ASuccessorTerrainElevation(xRight, worldZ) -
                sampleHEarthRun8ASuccessorTerrainElevation(xLeft, worldZ)) /
              Math.max(Number.EPSILON, xRight - xLeft);
            const dz =
              (sampleHEarthRun8ASuccessorTerrainElevation(worldX, zFront) -
                sampleHEarthRun8ASuccessorTerrainElevation(worldX, zBack)) /
              Math.max(Number.EPSILON, zFront - zBack);
            const normalLength = Math.hypot(-dx, 1, -dz);
            const curvatureX =
              sampleHEarthRun8ASuccessorTerrainElevation(xLeft, worldZ) -
              2 * elevation +
              sampleHEarthRun8ASuccessorTerrainElevation(xRight, worldZ);
            const curvatureZ =
              sampleHEarthRun8ASuccessorTerrainElevation(worldX, zBack) -
              2 * elevation +
              sampleHEarthRun8ASuccessorTerrainElevation(worldX, zFront);
            return freeze({
              valid: true,
              status: 'RUN_8A_SUCCESSOR_TERRAIN_SAMPLE_COMPLETE',
              contractId:
                H_EARTH_RUN_8A_MOUNTAIN_DIMENSIONAL_SURFACE_CONTRACT.contractId,
              world: { x: worldX, y: elevation, z: worldZ },
              elevation,
              gradient: { x: dx, z: dz },
              normal: { x: -dx / normalLength, y: 1 / normalLength, z: -dz / normalLength },
              slope: Math.hypot(dx, dz),
              curvature: curvatureX + curvatureZ,
              mountainContribution:
                evaluateHEarthRun8AMountainContribution(worldX, worldZ),
              domainRegion: worldZ < FORMER_BOUNDARY_Z
                ? 'SUCCESSOR_EXTENSION_REGION'
                : 'LEGACY_DOMAIN_WITH_SUCCESSOR_FORMATION_SPECIALIZATION'
            });
          }

          export function evaluateHEarthRun8AFormerBoundaryContinuity({
            xSamples = [-224, -192, -160, -128, -96, -64, -32, 0, 32],
            epsilon = 0.01
          } = {}) {
            const samples = xSamples.map((worldX) => {
              const center =
                sampleHEarthRun8ASuccessorTerrainElevation(worldX, FORMER_BOUNDARY_Z);
              const north =
                sampleHEarthRun8ASuccessorTerrainElevation(worldX, FORMER_BOUNDARY_Z + epsilon);
              const south =
                sampleHEarthRun8ASuccessorTerrainElevation(worldX, FORMER_BOUNDARY_Z - epsilon);
              const northGradient = (north - center) / epsilon;
              const southGradient = (center - south) / epsilon;
              return freeze({
                worldX,
                center,
                north,
                south,
                heightDiscontinuity: Math.abs(north - south),
                gradientDiscontinuity: Math.abs(northGradient - southGradient)
              });
            });
            const maximumHeightDiscontinuity =
              Math.max(...samples.map((sample) => sample.heightDiscontinuity));
            const maximumGradientDiscontinuity =
              Math.max(...samples.map((sample) => sample.gradientDiscontinuity));
            return freeze({
              eligible:
                maximumHeightDiscontinuity <= 0.05 &&
                maximumGradientDiscontinuity <= 0.5,
              status: 'RUN_8A_FORMER_BOUNDARY_CONTINUITY_EVALUATED',
              formerBoundaryZ: FORMER_BOUNDARY_Z,
              c0Tolerance: 0.05,
              c1Tolerance: 0.5,
              maximumHeightDiscontinuity,
              maximumGradientDiscontinuity,
              samples
            });
          }

          export const H_EARTH_RUN_8A_TERRAIN_SAMPLING_AND_REFINEMENT_CONTRACT = freeze({
            outputId: 'RUN_8A_OUTPUT_6_TERRAIN_SAMPLING_AND_REFINEMENT_CONTRACT',
            contractId: 'H_EARTH_TERRAIN_SAMPLING_AND_REFINEMENT_RUN_8A_v1',
            currentBaseline: {
              providerContractId: H_EARTH_GEOMETRY_LANDSCAPE_CONTRACT_ID,
              samplesPerAxis: H_EARTH_GEOMETRY_LANDSCAPE_PROFILE.samplesPerAxis,
              disposition: 'PRESERVE_AS_RUN_6_BASELINE'
            },
            profiles: {
              FULL_DETAIL: {
                baseSpacingWorldUnits: 4,
                refinementSpacingWorldUnits: 2,
                refinementTriggers: [
                  'ABS_CURVATURE_GREATER_THAN_0_04',
                  'SLOPE_GREATER_THAN_0_22',
                  'MOUNTAIN_CONTRIBUTION_GREATER_THAN_8',
                  'FORMATION_BOUNDARY_WITHIN_8_WORLD_UNITS'
                ],
                maximumVerticalApproximationError: 0.75,
                maximumNormalAngularErrorDegrees: 6
              },
              REDUCED_DETAIL: {
