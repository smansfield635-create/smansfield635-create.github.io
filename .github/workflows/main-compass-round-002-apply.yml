name: Apply Main Compass Round 002

on:
  push:
    branches:
      - agent/main-compass-architecture-context-round-002

permissions:
  contents: write

jobs:
  apply-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/main-compass-architecture-context-round-002
          fetch-depth: 0

      - name: Apply exact validated two-file patch
        env:
          PATCH_1: ''
          PATCH_2: ''
          PATCH_3: ''
          PATCH_4: ''
          PATCH_5: ''
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess
          encoded = ''.join(os.environ[f'PATCH_{i}'] for i in range(1, 6))
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '058039933ba05aa96bb1f1e825c64b1065491719d3e8ea9186819aabcc4ee004'
          patch_path = pathlib.Path('/tmp/main-compass-round-002.patch')
          patch_path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(patch_path)], check=True)
          subprocess.run(['git', 'apply', str(patch_path)], check=True)

          def blob_sha(path):
              data = pathlib.Path(path).read_bytes()
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          assert blob_sha('index.html') == '1cc9a1de90bb58de6463bafe52a1b1f91c5bef4a'
          assert blob_sha('assets/compass/compass.css') == 'd882b875b616e7da41f31baa70e3dad5007a786a'
          assert blob_sha('assets/compass/compass.controller.js') == '83ff2b714c9c36a9c096cf5ab2fd7b3875fe3e46'
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/compass/compass.css
          git commit -m "Apply Main Compass architecture and context round 002"
          git push origin HEAD:agent/main-compass-architecture-context-round-002
