name: Material Work Audit v1 Blinded Classifier Carrier v2

on:
  push:
    branches:
      - agent/material-work-audit-v1-classifier-carrier-ddbe792
    paths:
      - research/material-work-audit/classify-v1-carrier-v2.mjs
      - .github/workflows/material-work-audit-v1-classifier-carrier-v2.yml

permissions:
  contents: write

concurrency:
  group: material-work-audit-v1-blinded-classifier-v2
  cancel-in-progress: false

jobs:
  classify-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Wait for bounded REST quota
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while true; do
            headers="$(curl -sS -D - -o /dev/null -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/rate_limit | tr -d '\r')"
            remaining="$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1}/^x-ratelimit-remaining:/{print $2; exit}')"
            reset="$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1}/^x-ratelimit-reset:/{print $2; exit}')"
            remaining="${remaining:-0}"
            reset="${reset:-0}"
            echo "core remaining=${remaining} reset=${reset}"
            if [ "$remaining" -ge 2500 ]; then
              break
            fi
            now="$(date +%s)"
            wait=$(( reset > now ? reset - now + 10 : 60 ))
            if [ "$wait" -gt 900 ]; then wait=900; fi
            echo "REST quota below safe Gen1710 floor; waiting ${wait}s"
            sleep "$wait"
          done
      - name: Materialize bounded carrier source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir work
          cd work
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 --filter=blob:none origin "${GITHUB_SHA}"
          git sparse-checkout init --cone
          git sparse-checkout set research/material-work-audit
          git checkout --detach FETCH_HEAD
          test -f research/material-work-audit/classify-v1-carrier-v2.mjs
      - name: Execute Gen1710 conformance closure
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd work
          node research/material-work-audit/classify-v1-carrier-v2.mjs
