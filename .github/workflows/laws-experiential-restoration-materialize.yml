name: Laws Root Finalization

on:
  push:
    branches:
      - agent/laws-experiential-architecture-restoration-001
    paths:
      - '.github/workflows/laws-experiential-restoration-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: laws-root-finalization
  cancel-in-progress: false

jobs:
  finalize-root-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact restoration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Confirm unrelated main drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fork_base="ef2ffdb1da7911238652f076a6b44326061493ef"
          git fetch origin main
          test "$(git merge-base origin/main HEAD)" = "$fork_base"
          if git diff --name-only "$fork_base" origin/main | grep -E '^laws/(index\.|index/|research/|test/|categories/|scientific-law/)'; then
            echo 'Main advanced through overlapping Laws paths; rebase review required.' >&2
            exit 1
          fi

      - name: Finalize foundation-first root candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/materialize-laws-root-restoration.py
          git diff --check
          node --check laws/index.experience.js
          node --check tools/laws-experiential-restoration-root-matrix.mjs
          python3 - <<'PY'
          from pathlib import Path
          html = Path('laws/index.html').read_text(encoding='utf-8')
          assert html.count('data-laws-applied-study-disclosure="battery-health"') == 1
          assert html.count('data-battery-study="BATTERY_COHERENCE_HELDOUT_STUDY_v1"') == 1
          assert html.index('data-laws-supporting-panel="evidence-applied"') < html.index('data-laws-applied-study-disclosure="battery-health"')
          PY
          for protected in laws/index.controller.js laws/index.interactions.js laws/index.compositor.js laws/index.crystals.js laws/index.cosmos.js laws/index.planet.js; do
            git diff --quiet ef2ffdb1da7911238652f076a6b44326061493ef -- "$protected"
          done
          git rm -f tools/materialize-laws-root-restoration.py
          git rm -f .github/workflows/laws-experiential-restoration-materialize.yml

      - name: Commit finalized merge candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add laws/index.html laws/index.experience.polish.css tools/laws-experiential-restoration-root-matrix.mjs .github/workflows/laws-experiential-restoration-root-matrix.yml .github/workflows/laws-experiential-restoration-cta-regression.yml
          git commit -m "Finalize Laws root foundation-first restoration"
          git push origin HEAD:agent/laws-experiential-architecture-restoration-001
