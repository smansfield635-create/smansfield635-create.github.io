name: Apply Laws Projected Clearance Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-bounded-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact correction branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify exact parent and protected source custody
        shell: bash
        run: |
          test "$(git merge-base HEAD origin/main)" = "8d8199e147c944bceed021c9a7f5585ec146e7a6"
          test "$(git hash-object laws/index.crystals.js)" = "cd06f18bf8384efc97fcabeec5a4de94210c87a8"
          test "$(git hash-object laws/index.compositor.js)" = "66ca5b4f1fd25c591e74b109ba9ab6368b2c64aa"
          test "$(git hash-object laws/index.html)" = "e37f03bb195ff8cb5fe5bea60b0b4e45d5df3260"
          test "$(git hash-object laws/index.css)" = "9c2ef3e9636e134795102e48ea63553d2f3b9778"
          test "$(git hash-object laws/index.interactions.js)" = "a6563d2e2e7064136925299a79731147f4a8580b"
          test "$(git hash-object laws/index.interactions.source.round4.js)" = "24fc3e216f3526e9c6d30939454a73bdcf13cd7d"
          test "$(git hash-object laws/validation/laws.orbit-direct-manipulation.harness.mjs)" = "9339b8cfce13fb73805f1b4515bb7e9cc303e9d6"
          test "$(git hash-object laws/validation/laws.orbit-direct-manipulation.receipt.json)" = "9ac18b0e2da3b24331958bf5caa583129d5f1f95"

      - name: Apply fail-closed current-main transformation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          crystals_path = Path('laws/index.crystals.js')
          html_path = Path('laws/index.html')
          harness_path = Path('laws/validation/laws.orbit-direct-manipulation.harness.mjs')

          crystals = crystals_path.read_text(encoding='utf-8')
          html = html_path.read_text(encoding='utf-8')
          harness = harness_path.read_text(encoding='utf-8')

          def replace_exact(text, old, new, label, expected=1):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} source occurrence(s), found {count}')
              return text.replace(old, new, expected)

          crystals = replace_exact(
              crystals,
              '''        projectedClearanceMarginPx:
          8,

        primaryAnchor:''',
              '''        projectedClearanceMarginPx:
          8,

        maximumCommonRadius:
          1.82,

        radiusSearchStep:
          0.02,

        minimumUniformScaleFactor:
          0.72,

        uniformScaleSearchStep:
          0.02,

        viewportClearanceMarginPx:
          6,

        primaryAnchor:''',
              'CLUSTER_RUNTIME_ENVELOPE_CONFIGURATION'
          )

          crystals = replace_exact(
              crystals,
              '''    reducedMotion:
      false,

    generatedLawProxyCount:''',
              '''    reducedMotion:
      false,

    runtimeClusterRadius:
      SPHERE.cluster.commonRadius,

    runtimeClusterUniformScaleFactor:
      1,

    runtimeClusterProjectedClearancePassed:
      false,

    runtimeClusterClearanceResolutionAttempts:
      0,

    runtimeClusterClearanceWorstResidualPx:
      null,

    runtimeClusterClearanceSource:
      "DGB_LAWS_COMPOSITOR.getCompassFieldBounds+projectWorldPoint",

    rigidClusterPositionInterpolation:
      true,

    clusterMemberFloatingTranslation:
      false,

    generatedLawProxyCount:''',
              'RECEIPT_RUNTIME_CLEARANCE_FIELDS'
          )

          crystals = replace_exact(
              crystals,
              '''    visualPrimaryLaws:
      new Map(),

    reducedMotion:''',
              '''    visualPrimaryLaws:
      new Map(),

    resolvedClusterRadius:
      SPHERE.cluster.commonRadius,

    resolvedClusterScaleFactor:
      1,

    clusterProjectedClearancePassed:
      false,

    clusterClearanceResolutionAttempts:
      0,

    clusterClearanceWorstResidualPx:
      null,

    reducedMotion:''',
              'STATE_RUNTIME_CLEARANCE_FIELDS'
          )

          crystals = replace_exact(
              crystals,
              '''      "getProjectionMatrix",
      "projectWorldPoint",''',
              '''      "getProjectionMatrix",
      "getCompassFieldBounds",
      "projectWorldPoint",''',
              'COMPOSITOR_BOUNDS_METHOD_REQUIRED'
          )

          crystals = replace_exact(
              crystals,
              '''  function euclideanLawPosition(
    node,
    localQuaternion
  ) {''',
              '''  function euclideanLawPosition(
    node,
    localQuaternion,
    commonRadius =
      SPHERE.cluster.commonRadius
  ) {''',
              'EUCLIDEAN_POSITION_SHARED_RADIUS_SIGNATURE'
          )

          crystals = replace_exact(
              crystals,
              '''    const radius =
      SPHERE.cluster.commonRadius;

    return {''',
              '''    const radius =
      clamp(
        finiteNumber(
          commonRadius,
          SPHERE.cluster.commonRadius
        ),
        SPHERE.cluster.commonRadius,
        SPHERE.cluster.maximumCommonRadius
      );

    return {''',
              'EUCLIDEAN_POSITION_SHARED_RADIUS_CONSUMPTION'
          )

          helper_block = '''
  function clusterCandidateFacts(
    direction,
    localQuaternion,
    commonRadius,
    uniformScaleFactor
  ) {
    const viewport =
      state.compositorFrame &&
      state.compositorFrame.viewport
        ? state.compositorFrame.viewport
        : null;
    const laws =
      activeLawNodes(direction);
    let bounds =
      null;

    try {
      bounds =
        state.compositor
          .getCompassFieldBounds();
    } catch (_) {
      bounds = null;
    }

    if (
      !viewport ||
      !bounds ||
      !Number.isFinite(bounds.width) ||
      !Number.isFinite(bounds.height) ||
      bounds.width <= 0 ||
      bounds.height <= 0 ||
      laws.length !==
        SPHERE.cluster.memberCount
    ) {
      return Object.freeze({
        pass:
          false,
        reason:
          "RUNTIME_PROJECTION_FACTS_UNAVAILABLE",
        worstResidualClearancePx:
          null,
        projectedRadiusPx:
          null
      });
    }

    const projectedRadius =
      Math.max(
        18,
        48 *
          QUALITY.selectedLawScale *
          uniformScaleFactor
      );
    const viewportMargin =
      SPHERE.cluster
        .viewportClearanceMarginPx;
    let worstResidualClearancePx =
      Infinity;

    for (const node of laws) {
      const position =
        euclideanLawPosition(
          node,
          localQuaternion,
          commonRadius
        );
      const projected =
        state.compositor
          .projectWorldPoint(
            [
              position.x,
              position.y,
              position.z
            ],
            {
              projectedRadius,
              compassOverlapPadding:
                SPHERE.cluster
                  .projectedClearanceMarginPx,
              rejectionMargin:
                0.80,
              nodeId:
                node.id,
              nodeType:
                node.type
            }
          );

      if (
        !projected ||
        projected.visible === false ||
        projected.compassOverlap === true
      ) {
        return Object.freeze({
          pass:
            false,
          reason:
            "PROJECTED_COMPASS_CLEARANCE_FAILED",
          worstResidualClearancePx:
            Number.isFinite(
              worstResidualClearancePx
            )
              ? worstResidualClearancePx
              : null,
          projectedRadiusPx:
            projectedRadius
        });
      }

      const fullCircleInsideViewport =
        projected.x - projectedRadius >=
          viewportMargin &&
        projected.x + projectedRadius <=
          viewport.cssWidth -
          viewportMargin &&
        projected.y - projectedRadius >=
          viewportMargin &&
        projected.y + projectedRadius <=
          viewport.cssHeight -
          viewportMargin;

      if (!fullCircleInsideViewport) {
        return Object.freeze({
          pass:
            false,
          reason:
            "PROJECTED_VIEWPORT_CLEARANCE_FAILED",
          worstResidualClearancePx:
            Number.isFinite(
              worstResidualClearancePx
            )
              ? worstResidualClearancePx
              : null,
          projectedRadiusPx:
            projectedRadius
        });
      }

      const closestX =
        clamp(
          projected.x,
          bounds.left,
          bounds.right
        );
      const closestY =
        clamp(
          projected.y,
          bounds.top,
          bounds.bottom
        );
      const residual =
        Math.hypot(
          projected.x - closestX,
          projected.y - closestY
        ) -
        projectedRadius -
        SPHERE.cluster
          .projectedClearanceMarginPx;

      worstResidualClearancePx =
        Math.min(
          worstResidualClearancePx,
          residual
        );
    }

    return Object.freeze({
      pass:
        true,
      reason:
        "PASS",
      worstResidualClearancePx:
        Number.isFinite(
          worstResidualClearancePx
        )
          ? worstResidualClearancePx
          : null,
      projectedRadiusPx:
        projectedRadius
    });
  }

  function resolveClusterPresentation(
    direction,
    localQuaternion
  ) {
    let attempts =
      0;
    let lastFacts =
      null;

    for (
      let scaleFactor = 1;
      scaleFactor >=
        SPHERE.cluster
          .minimumUniformScaleFactor -
        1e-12;
      scaleFactor -=
        SPHERE.cluster
          .uniformScaleSearchStep
    ) {
      const boundedScale =
        Math.max(
          SPHERE.cluster
            .minimumUniformScaleFactor,
          Number(scaleFactor.toFixed(6))
        );

      for (
        let radius =
          SPHERE.cluster.commonRadius;
        radius <=
          SPHERE.cluster.maximumCommonRadius +
          1e-12;
        radius +=
          SPHERE.cluster.radiusSearchStep
      ) {
        const boundedRadius =
          Math.min(
            SPHERE.cluster
              .maximumCommonRadius,
            Number(radius.toFixed(6))
          );
        const facts =
          clusterCandidateFacts(
            direction,
            localQuaternion,
            boundedRadius,
            boundedScale
          );

        attempts += 1;
        lastFacts = facts;

        if (facts.pass) {
          return Object.freeze({
            pass:
              true,
            radius:
              boundedRadius,
            scaleFactor:
              boundedScale,
            attempts,
            reason:
              facts.reason,
            worstResidualClearancePx:
              facts.worstResidualClearancePx,
            projectedRadiusPx:
              facts.projectedRadiusPx
          });
        }
      }
    }

    return Object.freeze({
      pass:
        false,
      radius:
        SPHERE.cluster
          .maximumCommonRadius,
      scaleFactor:
        SPHERE.cluster
          .minimumUniformScaleFactor,
      attempts,
      reason:
        lastFacts
          ? lastFacts.reason
          : "NO_RUNTIME_CLEARANCE_CANDIDATE",
      worstResidualClearancePx:
        lastFacts
          ? lastFacts
              .worstResidualClearancePx
          : null,
      projectedRadiusPx:
        lastFacts
          ? lastFacts.projectedRadiusPx
          : null
    });
  }

  function publishClusterPresentationResolution(
    resolution
  ) {
    state.resolvedClusterRadius =
      resolution.radius;
    state.resolvedClusterScaleFactor =
      resolution.scaleFactor;
    state.clusterProjectedClearancePassed =
      resolution.pass;
    state.clusterClearanceResolutionAttempts =
      resolution.attempts;
    state.clusterClearanceWorstResidualPx =
      resolution.worstResidualClearancePx;

    RECEIPT.runtimeClusterRadius =
      resolution.radius;
    RECEIPT.runtimeClusterUniformScaleFactor =
      resolution.scaleFactor;
    RECEIPT.runtimeClusterProjectedClearancePassed =
      resolution.pass;
    RECEIPT.runtimeClusterClearanceResolutionAttempts =
      resolution.attempts;
    RECEIPT.runtimeClusterClearanceWorstResidualPx =
      resolution.worstResidualClearancePx;
    RECEIPT.runtimeClusterClearanceReason =
      resolution.reason;
    RECEIPT.runtimeClusterProjectedRadiusPx =
      resolution.projectedRadiusPx;

    if (state.root) {
      state.root.dataset
        .lawsClusterRuntimeCommonRadius =
        String(resolution.radius);
      state.root.dataset
        .lawsClusterRuntimeUniformScaleFactor =
        String(resolution.scaleFactor);
      state.root.dataset
        .lawsClusterRuntimeProjectedClearancePassed =
        String(resolution.pass);
      state.root.dataset
        .lawsClusterRuntimeClearanceResolutionAttempts =
        String(resolution.attempts);
      state.root.dataset
        .lawsClusterRuntimeClearanceWorstResidualPx =
        resolution.worstResidualClearancePx === null
          ? ""
          : String(
              resolution
                .worstResidualClearancePx
            );
      state.root.dataset
        .lawsClusterRuntimeClearanceSource =
        "compositor-bounds-and-projection";
    }

    return resolution;
  }

'''

          crystals = replace_exact(
              crystals,
              '''  function setUniformScale(
    target,
    scale
  ) {''',
