name: H-Earth Run 8E R3F2-P4 Publication Observation

on:
  pull_request:
    branches:
      - agent/h-earth-run8e-r3f2-p4-immutable-preview-publication-001
    paths:
      - '.github/workflows/h-earth-run8e-r3f2-p4-publication-observation.yml'

permissions:
  contents: read
  actions: read

jobs:
  observe-p4-publication:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 7a57befe4d8c2702cce2119fcf5c7d52cc627de9
      TARGET_WORKFLOW_NAME: H-Earth Run 8E R3F2-P4 Immutable Preview Publication
      TARGET_ARTIFACT_NAME: h-earth-run8e-r3f2-p4-immutable-preview-publication-occurrence
    steps:
      - name: Query exact P4 push run and artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/h-earth-run8e-r3f2-p4-observation
          node <<'NODE'
          const fs = require('fs');
          const https = require('https');
          const repo = process.env.REPOSITORY;
          const token = process.env.GH_TOKEN;
          const targetSha = process.env.TARGET_SHA;
          const targetWorkflowName = process.env.TARGET_WORKFLOW_NAME;
          const targetArtifactName = process.env.TARGET_ARTIFACT_NAME;
          function get(path) {
            return new Promise((resolve, reject) => {
              const request = https.get({
                hostname: 'api.github.com',
                path,
                headers: {
                  Accept: 'application/vnd.github+json',
                  Authorization: `Bearer ${token}`,
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'h-earth-run8e-r3f2-p4-observer'
                }
              }, (response) => {
                let body = '';
                response.on('data', (chunk) => body += chunk);
                response.on('end', () => {
                  if (response.statusCode < 200 || response.statusCode >= 300) {
                    reject(new Error(`HTTP_${response.statusCode}:${body}`));
                    return;
                  }
                  resolve(JSON.parse(body));
                });
              });
              request.on('error', reject);
            });
          }
          (async () => {
            const runsPayload = await get(`/repos/${repo}/actions/runs?head_sha=${targetSha}&per_page=100`);
            const runs = (runsPayload.workflow_runs || []).filter((run) =>
              run.head_sha === targetSha && run.name === targetWorkflowName);
            const enriched = [];
            for (const run of runs) {
              const artifactsPayload = await get(`/repos/${repo}/actions/runs/${run.id}/artifacts?per_page=100`);
              enriched.push({
                id: run.id,
                name: run.name,
                event: run.event,
                status: run.status,
                conclusion: run.conclusion,
                headBranch: run.head_branch,
                headSha: run.head_sha,
                createdAt: run.created_at,
                updatedAt: run.updated_at,
                htmlUrl: run.html_url,
                artifacts: (artifactsPayload.artifacts || []).filter((artifact) => artifact.name === targetArtifactName).map((artifact) => ({
                  id: artifact.id,
                  name: artifact.name,
                  sizeInBytes: artifact.size_in_bytes,
                  expired: artifact.expired,
                  digest: artifact.digest,
                  createdAt: artifact.created_at
                }))
              });
            }
            const record = {
              observationType: 'H_EARTH_RUN_8E_R3F2_P4_PUBLICATION_OBSERVATION',
              targetSha,
              targetWorkflowName,
              matchingRunCount: enriched.length,
              runs: enriched,
              publicationRunObserved: enriched.length > 0,
              successfulPublicationRunObserved: enriched.some((run) => run.conclusion === 'success'),
              publicationArtifactObserved: enriched.some((run) => run.artifacts.length > 0)
            };
            fs.writeFileSync('/tmp/h-earth-run8e-r3f2-p4-observation/observation.json', `${JSON.stringify(record, null, 2)}\n`);
            console.log(JSON.stringify(record, null, 2));
          })().catch((error) => {
            console.error(error.stack || error.message);
            process.exit(1);
          });
          NODE

      - name: Upload P4 observation evidence
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-run8e-r3f2-p4-publication-observation
          path: /tmp/h-earth-run8e-r3f2-p4-observation/observation.json
          if-no-files-found: error
          retention-days: 30
