name: Laws Carousel Single-Trajectory Settlement Proof

on:
  pull_request:
    paths:
      - 'laws/index.destination-carousel.js'
      - 'laws/index.destination-carousel.css'
      - 'laws/index.mobile-background-tabs.js'
      - 'laws/index.html'
      - '.github/workflows/laws-carousel-discrete-swipe-proof.yml'
permissions: { contents: read }

jobs:
  single-trajectory-settlement-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 1 }
      - name: Syntax check runtime
        run: node --check laws/index.destination-carousel.js
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve exact candidate
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/laws-settlement-http.log 2>&1 &
      - name: Prove frozen v2 transaction contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          const A=(x,m)=>{if(!x)throw Error(m)};
          const close=(a,b,e=.001)=>Math.abs(a-b)<=e;
          const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:960,height:1536},hasTouch:true,isMobile:true,deviceScaleFactor:1});
            const page=await context.newPage(),errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/laws/',{waitUntil:'networkidle'});
            await page.waitForSelector('html[data-laws-destination-carousel-runtime="active"]',{timeout:15000});
            const runtime=await page.evaluate(()=>globalThis.DGB_LAWS_DESTINATION_CAROUSEL);
            A(runtime?.contract==='LAWS_DESTINATION_CAROUSEL_RUNTIME_v7','wrong runtime');
            for(const[k,v]of Object.entries({continuousPointerGeometry:true,fractionalOrbitPosition:true,singleAuthoritativeOrbitCoordinate:true,singleTrajectorySettlement:true,selectionDuringDrag:false,semanticIndexCommandsGeometry:false,settleToNearestDetent:true,geometryOwnedSettlementCompletion:true,timerOwnedSettlementCompletion:false,verticalGesturePassthrough:true,directionOnlyGesture:false,liveGestureGeometry:true,atomicRotation:false,postLandingGuardMs:1000}))A(runtime[k]===v,`telemetry ${k}`);

            const field=page.locator('[data-laws-root-rolodex-section] .laws-rolodex-field[data-destination-stage-state="active"]').first();
            const viewport=field.locator('.laws-rolodex-viewport');
            await viewport.scrollIntoViewIfNeeded();await page.waitForTimeout(100);
            const id=await field.getAttribute('data-rolodex-id');
            const box=await viewport.boundingBox();A(box&&box.width>400,'viewport unavailable');
            const S=box.width*.72,sx=box.x+box.width*.86,sy=box.y+box.height*.52,cdp=await context.newCDPSession(page);let tid=30;
            const touch=(type,x,y)=>cdp.send('Input.dispatchTouchEvent',{type,touchPoints:/End|Cancel/.test(type)?[]:[{x,y,id:tid,radiusX:2,radiusY:2,force:1}],modifiers:0});
            const down=async(x=sx,y=sy)=>{tid++;await touch('touchStart',x,y);await page.waitForTimeout(32)};
            const move=async(f,y=sy)=>{await touch('touchMove',sx-S*f,y);await page.waitForTimeout(44)};
            const up=async(x=sx,y=sy)=>{await touch('touchEnd',x,y)};
            const waitIdle=async()=>page.waitForFunction(el=>el.dataset.carouselGestureState==='idle'&&el.dataset.carouselSettled==='true'&&el.dataset.carouselCanonicalLanding==='true',await field.elementHandle(),{timeout:3000});
            const snap=()=>field.evaluate(el=>({index:+el.dataset.carouselIndex,orbit:+el.dataset.carouselOrbitPosition,target:+el.dataset.carouselTargetDetent,state:el.dataset.carouselGestureState,settled:el.dataset.carouselSettled,canonical:el.dataset.carouselCanonicalLanding,label:el.querySelector('.laws-rolodex-position')?.textContent?.trim(),cards:[...el.querySelectorAll('.laws-rolodex-card')].map(c=>({active:c.dataset.active,relative:+c.dataset.carouselRelative,x:parseFloat(c.style.getPropertyValue('--laws-carousel-x')),z:parseFloat(c.style.getPropertyValue('--laws-carousel-z')),rotate:parseFloat(c.style.getPropertyValue('--laws-carousel-rotate')),scale:parseFloat(c.style.getPropertyValue('--laws-carousel-scale')),opacity:parseFloat(c.style.getPropertyValue('--laws-carousel-opacity')),blur:parseFloat(c.style.getPropertyValue('--laws-carousel-blur'))}))}));
            const geometry=s=>s.cards.map(c=>[c.relative,c.x,c.z,c.rotate,c.scale,c.opacity,c.blur]);
            const restore=async index=>{A(await page.evaluate(({id,index})=>globalThis.DGB_LAWS_DESTINATION_CAROUSEL.restoreOrbitState({rolodexId:id,index}),{id,index}),'restore rejected');await waitIdle()};
            const trace=()=>page.evaluate(id=>globalThis.DGB_LAWS_DESTINATION_CAROUSEL.getTransactionTrace(id),id);
            const frame=n=>page.screenshot({path:n,fullPage:false});

            // Q1 direct manipulation + one transaction identity + semantic custody.
            await restore(0);const q10=await snap();await down();await move(.25);const q125=await snap();await frame('q1-25.png');await move(.50);const q150=await snap();await frame('q1-50.png');await move(.75);const q175=await snap();await frame('q1-75.png');
            A([q125,q150,q175].every(s=>s.index===q10.index&&s.label===q10.label),'Q1 semantic selection changed during drag');
            A(new Set([q10,q125,q150,q175].map(s=>JSON.stringify(geometry(s)))).size===4,'Q1 intermediate geometry absent');
            const q1trace=await trace(),q1ids=[...new Set(q1trace.filter(x=>x.type==='pointer-geometry'||x.type==='horizontal-custody'||x.type==='release-target').map(x=>x.transactionId).filter(Boolean))];
            A(q1ids.length<=1,'Q1 multiple transaction identities before release');
            await up();await page.waitForTimeout(90);const q1settling=await snap();await frame('q1-settling.png');A(q1settling.state==='settling','Q1 release did not enter settlement');A(q1settling.orbit>q175.orbit&&q1settling.orbit<1,'Q1 settlement did not continue from fractional release coordinate');await waitIdle();const q1end=await snap();A(q1end.index===1&&close(q1end.orbit,1)&&q1end.canonical==='true','Q1 canonical landing failure');

            // Q2 30% return.
            await restore(0);const q2base=await snap();await down();await move(.30);const q230=await snap();await frame('q2-30.png');A(q230.index===0&&!same(geometry(q230),geometry(q2base)),'Q2 direct manipulation missing');await up();await waitIdle();const q2end=await snap();A(q2end.index===0&&close(q2end.orbit,0),'Q2 did not return to origin detent');

            // Q3 70% neighbor commitment.
            await restore(0);await down();await move(.70);const q370=await snap();await frame('q3-70.png');A(q370.index===0&&q370.orbit>.6&&q370.orbit<.8,'Q3 fractional release position wrong');await up();await waitIdle();const q3end=await snap();A(q3end.index===1&&close(q3end.orbit,1),'Q3 neighbor commitment failed');

            // Q4 circular seam.
            const count=q3end.cards.length;await restore(count-1);await down();await move(.25);const q425=await snap();await move(.50);const q450=await snap();await move(.70);const q470=await snap();await frame('q4-seam.png');A([q425,q450,q470].every(s=>s.index===count-1),'Q4 semantic seam custody failed');A(q425.cards[0].x>q450.cards[0].x&&q450.cards[0].x>q470.cards[0].x,'Q4 seam geometry discontinuity');await up();await waitIdle();const q4end=await snap();A(q4end.index===0&&close(q4end.orbit,count),'Q4 seam canonical landing failed');

            // Q5 cancellation returns through same coordinate.
            await restore(0);const q5base=await snap();await viewport.evaluate(el=>el.addEventListener('pointerdown',e=>globalThis.__lawsCancelPid=e.pointerId,{capture:true,once:true}));await down();await move(.42);const q5drag=await snap();await frame('q5-cancel-drag.png');A(!same(geometry(q5drag),geometry(q5base)),'Q5 cancellation setup missing displacement');const pid=await page.evaluate(()=>globalThis.__lawsCancelPid);A(Number.isInteger(pid),'Q5 pointer id missing');await viewport.evaluate((el,pid)=>el.dispatchEvent(new PointerEvent('pointercancel',{bubbles:true,pointerId:pid,pointerType:'touch',isPrimary:true})),pid);await page.waitForTimeout(70);const q5settling=await snap();A(q5settling.state==='settling','Q5 cancellation did not settle from live coordinate');await touch('touchCancel',sx,sy).catch(()=>{});await waitIdle();const q5end=await snap();A(q5end.index===0&&close(q5end.orbit,0),'Q5 cancellation failed');

            // Q6 vertical passthrough.
            await restore(0);await viewport.scrollIntoViewIfNeeded();const q6before=await snap(),scrollBefore=await page.evaluate(()=>scrollY),b6=await viewport.boundingBox(),vx=b6.x+b6.width*.5,vy=b6.y+b6.height*.45;tid++;await touch('touchStart',vx,vy);await page.waitForTimeout(30);await touch('touchMove',vx+4,vy+220);await page.waitForTimeout(180);await touch('touchEnd',vx+4,vy+220);await page.waitForTimeout(160);const q6after=await snap(),scrollAfter=await page.evaluate(()=>scrollY);A(q6after.index===q6before.index,'Q6 vertical gesture rotated carousel');A(Math.abs(scrollAfter-scrollBefore)>20,`Q6 page traversal unavailable ${scrollBefore}->${scrollAfter}`);

            // Q7 repeated adjacent gestures remain one landing each.
            await viewport.scrollIntoViewIfNeeded();await restore(0);for(let n=1;n<=3;n++){await down();await move(.70);await up();await waitIdle();const s=await snap();A(s.index===n%count&&close(s.orbit,n),'Q7 repeated forward settlement failed at '+n)}for(let n=2;n>=0;n--){tid++;await touch('touchStart',sx-S*.75,sy);await page.waitForTimeout(30);await touch('touchMove',sx,sy);await page.waitForTimeout(45);await touch('touchEnd',sx,sy);await waitIdle();const s=await snap();A(s.index===n%count&&close(s.orbit,n),'Q7 repeated reverse settlement failed at '+n)}

            // Q8 competing focus/click/restore/keyboard events cannot reposition an active pointer transaction.
            await restore(0);await down();await move(.40);const q8before=await snap();const restoreDuring=await page.evaluate(id=>globalThis.DGB_LAWS_DESTINATION_CAROUSEL.restoreOrbitState({rolodexId:id,index:2}),id);A(restoreDuring===false,'Q8 restore competed with active transaction');await viewport.press('ArrowRight').catch(()=>{});await field.locator('.laws-rolodex-card').nth(2).focus().catch(()=>{});await field.locator('.laws-rolodex-card').nth(2).click({position:{x:5,y:5}}).catch(()=>{});const q8after=await snap();A(q8after.index===q8before.index&&close(q8after.orbit,q8before.orbit),'Q8 competing event moved orbit');await up();await waitIdle();

            // Q9 exact canonical landing + 1000 ms post-landing immutability.
            const q9land=await snap(),q9geom=geometry(q9land);A(q9land.canonical==='true'&&close(q9land.orbit,Math.round(q9land.orbit)),'Q9 landing not exact');await frame('q9-landed.png');await page.waitForTimeout(1100);const q9guard=await snap();await frame('q9-guard.png');A(q9guard.index===q9land.index&&close(q9guard.orbit,q9land.orbit)&&same(geometry(q9guard),q9geom),'Q9 post-landing geometry mutated');

            // Q10 trace must show immutable release target and monotonic settlement frames.
            const allTrace=await trace();const releases=allTrace.filter(x=>x.type==='release-target');A(releases.length>=1,'Q10 release trace missing');for(const rel of releases){const frames=allTrace.filter(x=>x.transactionId===rel.transactionId&&x.type==='settlement-frame');if(!frames.length)continue;A(frames.every(x=>x.q===rel.target),'Q10 release target changed during settlement');const dir=Math.sign(rel.target-rel.releasePosition);for(let i=1;i<frames.length;i++){if(dir>0)A(frames[i].p+1e-7>=frames[i-1].p,'Q10 non-monotonic positive settlement');if(dir<0)A(frames[i].p-1e-7<=frames[i-1].p,'Q10 non-monotonic negative settlement')}}

            A(!errors.length,'page errors '+errors.join(' | '));
            fs.writeFileSync('laws-single-trajectory-settlement-proof.json',JSON.stringify({contract:runtime.contract,Q1:{q10,q125,q150,q175,q1settling,q1end},Q2:{q2base,q230,q2end},Q3:{q370,q3end},Q4:{q425,q450,q470,q4end},Q5:{q5base,q5drag,q5settling,q5end},Q6:{scrollBefore,scrollAfter,q6after},Q7:'PASS',Q8:{q8before,q8after,restoreDuring},Q9:{q9land,q9guard},Q10:{releaseCount:releases.length,trace:allTrace},syntheticResult:'PASS',physicalDeviceEvidenceRequired:true},null,2));
            console.log('LAWS_SINGLE_TRAJECTORY_SETTLEMENT_V2_SYNTHETIC_PASS');await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload transaction trace and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laws-single-trajectory-settlement-proof
          path: |
            q*.png
            laws-single-trajectory-settlement-proof.json
          if-no-files-found: warn