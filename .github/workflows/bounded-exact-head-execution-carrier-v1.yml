name: Bounded Exact-Head Execution Carrier v1

on:
  push:
    branches:
      - agent/bounded-exact-head-execution-carrier-v1-003
    paths:
      - '.github/ai-router/router.v1.json'
      - '.github/ai-router/execution-backends.v1.json'
      - '.github/ai-router/system-continuity/gap-registry.v1.json'
      - '.github/ai-router/bounded-exact-head-execution-carrier/**'
      - '.github/workflows/bounded-exact-head-execution-carrier-v1.yml'
  pull_request:
    paths:
      - '.github/ai-router/router.v1.json'
      - '.github/ai-router/execution-backends.v1.json'
      - '.github/ai-router/system-continuity/gap-registry.v1.json'
      - '.github/ai-router/bounded-exact-head-execution-carrier/**'
      - '.github/workflows/bounded-exact-head-execution-carrier-v1.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  verify-candidate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact certification-repair candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact one-workflow repair and preserve generic execution route
        shell: bash
        run: |
          set -euo pipefail
          BASE=f99609e4540e5bdf9b2f0c519f631858706f0ba5
          test "$(git rev-parse HEAD^{commit})" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git diff --name-only "$BASE"...HEAD)" = ".github/workflows/bounded-exact-head-execution-carrier-v1.yml"
          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const p='.github/workflows/bounded-exact-head-execution-carrier-v1.yml';
          const current=fs.readFileSync(p,'utf8');
          const base=cp.execFileSync('git',['show','f99609e4540e5bdf9b2f0c519f631858706f0ba5:'+p],{encoding:'utf8'});
          const marker='\n  execute-registered-command:\n';
          const a=current.indexOf(marker),b=base.indexOf(marker);
          if(a<0||b<0||current.slice(a)!==base.slice(b))process.exit(1);
          if(/GEN839_SUCCESSOR_RECEIPT_B64|generation-839|generation:839|lockGeneration[^\n]*839/.test(current))process.exit(1);
          NODE

      - name: Verify terminal Gen1083 closure evidence
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const {data}=await github.rest.issues.getComment({owner:context.repo.owner,repo:context.repo.repo,comment_id:5256095416});
            const m=(data.body||'').match(/```json\n([\s\S]*?)\n```/);
            if(!m) core.setFailed('GEN1083_CLOSURE_JSON_MISSING');
            const r=JSON.parse(m[1]); const n=r.nativeReceiptJson||{};
            const ok=r.schema==='REMOTE_OPERATION_TERMINAL_CLOSURE_INVOCATION_RECEIPT_v1'&&r.result==='TERMINAL_CLOSURE_COMMITTED'&&r.operationId==='BOUNDED_EXACT_HEAD_BROWSER_SCENARIO_MATRIX_EXTENSION_V1_20260811_001'&&r.lockGeneration===1083&&r.lockScope==='REPOSITORY_CONTROL_PLANE:BOUNDED_EXACT_HEAD_EXECUTION_CARRIER:BROWSER_SCENARIO_MATRIX:V1'&&r.terminalDisposition==='PASS_CLOSED'&&r.semanticAuthorityCreated===false&&r.genericCommandAuthority===false&&n.schema==='REPOSITORY_OPERATION_REMOTE_CLOSURE_RECEIPT_v1'&&n.result==='TERMINAL_CLOSURE_COMMITTED'&&n.lockGeneration===1083&&n.lockReleased===true&&n.operationId===r.operationId&&n.scopeHash==='ab08a516f6c51f9d3afa86a7024eebc248e839e4744308a8315cb22824571f19'&&n.terminalDisposition==='PASS_CLOSED'&&n.terminalHistoryPreserved===true&&r.nativeReceiptSha256==='658130373f72b1aa1e9719db2e7865a510b88860b1612f3b423628935923f034';
            if(!ok) core.setFailed('GEN1083_TERMINAL_IDENTITY_MISMATCH');
            fs.writeFileSync(process.env.RUNNER_TEMP+'/gen1083-closure.json',JSON.stringify(r,null,2)+'\n');

      - name: Verify exact PR906 carrier head tree and four-path identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/pull/906/head:refs/remotes/origin/pr906-head
          HEAD906="$(git rev-parse refs/remotes/origin/pr906-head^{commit})"
          test "$HEAD906" = "cae14cd6ced51fca446ba050f049d475c564ee45"
          test "$(git show -s --format=%T "$HEAD906")" = "413ec09071986b72f31b24474204dd3402f8aea5"
          cat > "$RUNNER_TEMP/expected-paths.txt" <<'EOF'
          .github/ai-router/bounded-exact-head-execution-carrier/browser-verification.v1.mjs
          .github/ai-router/bounded-exact-head-execution-carrier/carrier.v1.mjs
          .github/ai-router/bounded-exact-head-execution-carrier/registry.v1.json
          .github/ai-router/bounded-exact-head-execution-carrier/self-test.v1.mjs
          EOF
          git diff --name-only ed2983e76d3896b13864d9251c42be225f8c5fb4..."$HEAD906" | sort > "$RUNNER_TEMP/observed-paths.txt"
          diff -u "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/observed-paths.txt"

      - name: Re-execute exact PR906 carrier self-test under Gen1083 identity
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/pr906-exact"
          git worktree add --detach "$W" cae14cd6ced51fca446ba050f049d475c564ee45
          trap 'git worktree remove --force "$W" >/dev/null 2>&1 || true' EXIT
          (
            cd "$W"
            test "$(git rev-parse HEAD^{commit})" = "cae14cd6ced51fca446ba050f049d475c564ee45"
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
            BROWSER_MATRIX_EXACT_HEAD_REEXEC=1 node .github/ai-router/bounded-exact-head-execution-carrier/self-test.v1.mjs --output "$RUNNER_TEMP/gen1083-self-test.json"
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
          )
          node - <<'NODE'
          const r=require(process.env.RUNNER_TEMP+'/gen1083-self-test.json');
          const p=r.preMatrixV1Regression||{},m=r.matrixRunnerSelfTest||{},s=r.realMatrixSmoke||{};
          if(r.schema!=='BOUNDED_BROWSER_SCENARIO_MATRIX_EXTENSION_SELF_TEST_RECEIPT_v1'||r.result!=='PASS'||r.executionHead!=='cae14cd6ced51fca446ba050f049d475c564ee45'||r.passed!==18||r.total!==18||p.result!=='PASS'||p.fixturePassCount!==54||p.fixtureCount!==54||p.nativeRegressionPassCount!==5||p.nativeRegressionCount!==5||p.realBrowserSmoke?.result!=='PASS'||m.result!=='PASS'||m.passCount!==7||m.testCount!==7||s.result!=='PASS'||s.skipped===true||r.authorityInflationObserved!==false||r.arbitraryCommandAccepted!==false||r.callerSuppliedJavascriptAccepted!==false||r.callerSuppliedPlaywrightAccepted!==false||r.callerSuppliedViewportAccepted!==false||r.productAuthorityCreated!==false||r.semanticAuthorityCreated!==false)process.exit(1);
          NODE

      - name: Emit fresh Gen1083-bound certification receipt
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process'),crypto=require('crypto');
          const closure=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/gen1083-closure.json','utf8'));
          const self=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/gen1083-self-test.json','utf8'));
          const workflow=fs.readFileSync('.github/workflows/bounded-exact-head-execution-carrier-v1.yml');
          const out={
            schema:'BOUNDED_EXACT_HEAD_BROWSER_SCENARIO_MATRIX_CERTIFICATION_RECEIPT_v1',
            result:'PASS',
            certificationRepairOperationId:'BROWSER_SCENARIO_MATRIX_CERTIFICATION_IDENTITY_REPAIR_V1_20260811_001',
            certificationRepairGeneration:1093,
            certificationWorkflowHead:cp.execFileSync('git',['rev-parse','HEAD^{commit}'],{encoding:'utf8'}).trim(),
            targetPullRequest:906,
            targetOperationId:'BOUNDED_EXACT_HEAD_BROWSER_SCENARIO_MATRIX_EXTENSION_V1_20260811_001',
            targetGeneration:1083,
            targetGoverningHead:'ed2983e76d3896b13864d9251c42be225f8c5fb4',
            targetCandidateHead:'cae14cd6ced51fca446ba050f049d475c564ee45',
            targetCandidateTree:'413ec09071986b72f31b24474204dd3402f8aea5',
            targetScopeHash:'ab08a516f6c51f9d3afa86a7024eebc248e839e4744308a8315cb22824571f19',
            targetTerminalDisposition:closure.terminalDisposition,
            targetClosureReceiptSha256:closure.nativeReceiptSha256,
            priorExactCandidateVerificationRunId:31513719423,
            priorExactCandidateArtifactId:9110181686,
            priorExactCandidateArtifactDigest:'sha256:ac3cb649c9a9222433b3e2c5688aac1cbc20f4f2c0b8a3e3a72b06ada76efe1a',
            exactCandidateSelfTest:{result:self.result,passed:self.passed,total:self.total,executionHead:self.executionHead},
            preMatrixV1Regression:{result:self.preMatrixV1Regression.result,fixturePassCount:self.preMatrixV1Regression.fixturePassCount,fixtureCount:self.preMatrixV1Regression.fixtureCount,nativeRegressionPassCount:self.preMatrixV1Regression.nativeRegressionPassCount,nativeRegressionCount:self.preMatrixV1Regression.nativeRegressionCount},
            matrixContractSelfTest:{result:self.matrixRunnerSelfTest.result,passCount:self.matrixRunnerSelfTest.passCount,testCount:self.matrixRunnerSelfTest.testCount},
            realMatrixSmoke:{result:self.realMatrixSmoke.result,skipped:self.realMatrixSmoke.skipped,scenarioCount:self.realMatrixSmoke.scenarioCount},
            historicalGen839AuthorityUsed:false,
            genericIssueCommentExecutionRoutePreserved:true,
            carrierFunctionalBytesMutatedByCertificationRepair:false,
            exactOneWorkflowPathRepair:true,
            arbitraryCommandAuthority:false,
            callerSuppliedUrlAuthority:false,
            callerSuppliedScriptAuthority:false,
            callerSuppliedViewportAuthority:false,
            environmentOverrideAuthority:false,
            productAuthorityCreated:false,
            semanticAuthorityCreated:false,
            mergeAuthorityCreated:false,
            workflowSha256:crypto.createHash('sha256').update(workflow).digest('hex')
          };
          fs.writeFileSync(process.env.RUNNER_TEMP+'/gen1083-certification.json',JSON.stringify(out,null,2)+'\n');
          NODE
          node -e "const r=require(process.env.RUNNER_TEMP+'/gen1083-certification.json'); if(r.result!=='PASS'||r.targetGeneration!==1083||r.historicalGen839AuthorityUsed!==false||r.genericIssueCommentExecutionRoutePreserved!==true||r.carrierFunctionalBytesMutatedByCertificationRepair!==false||r.exactOneWorkflowPathRepair!==true||r.productAuthorityCreated!==false||r.semanticAuthorityCreated!==false||r.mergeAuthorityCreated!==false)process.exit(1)"

      - name: Upload Gen1083-bound certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-matrix-gen1083-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gen1083-closure.json
            ${{ runner.temp }}/gen1083-self-test.json
            ${{ runner.temp }}/expected-paths.txt
            ${{ runner.temp }}/observed-paths.txt
            ${{ runner.temp }}/gen1083-certification.json
          if-no-files-found: warn
          retention-days: 90

  execute-registered-command:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 578 &&
      github.actor == 'smansfield635-create' &&
      startsWith(github.event.comment.body, 'BOUNDED_EXACT_HEAD_EXECUTION_REQUEST_V1')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out ratified default branch carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse bounded request without shell evaluation
        shell: bash
        env:
          REQUEST_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const marker='BOUNDED_EXACT_HEAD_EXECUTION_REQUEST_V1';
          const body=process.env.REQUEST_BODY ?? '';
          if(!body.startsWith(marker)) process.exit(2);
          const raw=body.slice(marker.length).trim();
          fs.writeFileSync(process.env.RUNNER_TEMP+'/request.json',JSON.stringify(JSON.parse(raw),null,2)+'\n');
          NODE

      - name: Execute registered command through bounded carrier
        id: carrier
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node .github/ai-router/bounded-exact-head-execution-carrier/carrier.v1.mjs \
            --input "$RUNNER_TEMP/request.json" \
            --output "$RUNNER_TEMP/execution-receipt.json"

      - name: Upload bounded execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-exact-head-carrier-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/request.json
            ${{ runner.temp }}/execution-receipt.json
          if-no-files-found: warn
          retention-days: 90

      - name: Return bounded execution receipt
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const p=process.env.RUNNER_TEMP+'/execution-receipt.json';
            let r={schema:'BOUNDED_EXACT_HEAD_EXECUTION_FAILURE_v1',result:'FAIL_CLOSED',errorCode:'EXECUTION_RECEIPT_MISSING'};
            if(fs.existsSync(p)) r=JSON.parse(fs.readFileSync(p,'utf8'));
            const n=r.nativeReceipt??null;
            const projection={schema:r.schema,result:r.result,errorCode:r.errorCode??null,descriptorId:r.descriptorId??null,operationId:r.operationId??null,lockGeneration:r.lockGeneration??null,targetHead:r.targetHead??null,exactHeadVerified:r.exactHeadVerified??false,workingTreeCleanBeforeAndAfter:r.workingTreeCleanBeforeAndAfter??false,nativeReceiptSchema:r.nativeReceiptSchema??n?.schema??null,nativeReceiptDisposition:n?.disposition??null,nativeReceiptDigest:r.nativeReceiptDigest??null,nativeReceiptRewritten:r.nativeReceiptRewritten??null,repositoryWritesPerformed:r.repositoryWritesPerformed??false,arbitraryCommandAuthority:r.arbitraryCommandAuthority??false,semanticAuthorityCreated:r.semanticAuthorityCreated??false};
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:578,body:'BOUNDED_EXACT_HEAD_EXECUTION_RETURN_V1\n```json\n'+JSON.stringify(projection,null,2)+'\n```'});

      - name: Fail closed if carrier execution was nonpass
        if: steps.carrier.outcome != 'success'
        shell: bash
        run: exit 1
