name: Temporary Final Program F2 Canonical State Kernel Verify

on:
  push:
    branches:
      - construction/methods-models-integrated-environment-v1
    paths:
      - 'control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/f2-canonical-state-kernel/**'
      - '.github/workflows/temporary-methods-models-final-f2-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-f2-canonical-state-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify F2 canonical state kernel fail-closed
        shell: bash
        run: |
          set -euo pipefail
          node control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/f2-canonical-state-kernel/verify.v1.mjs | tee /tmp/f2-verification.log
      - name: Require terminal F2 contract
        shell: bash
        run: grep -F 'PASS_F2_CANONICAL_STATE_KERNEL_v1' /tmp/f2-verification.log
      - name: Preserve F2 verification log
        uses: actions/upload-artifact@v4
        with:
          name: methods-models-final-program-f2-canonical-state-kernel-verification
          if-no-files-found: error
          retention-days: 90
          path: /tmp/f2-verification.log
