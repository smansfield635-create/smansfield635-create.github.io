name: H-Earth Gate B Admitted Frame Renewal

on:
  pull_request:
    branches:
      - agent/h-earth-gate-b-seven-file-verification-001
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  renew:
    if: github.head_ref == 'agent/h-earth-gate-b-seven-file-trigger-001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/h-earth-gate-b-seven-file-verification-001
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute committed Gate B route matrix
        shell: bash
        run: |
          set -euo pipefail
          node --check showroom/globe/h-earth/gate-b-route-input.js
          node --check showroom/globe/h-earth/render/ground-view-gate-b-packet-002-adapter.js
          node --check showroom/globe/h-earth/admitted-geometry-frame.js
          node --check showroom/globe/h-earth/compositor.js
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const html = fs.readFileSync('showroom/globe/h-earth/index.html','utf8');
          const route = await import('./showroom/globe/h-earth/gate-b-route-input.js');
          const frame = await import('./showroom/globe/h-earth/admitted-geometry-frame.js');
          const compositor = await import('./showroom/globe/h-earth/compositor.js');
          compositor.setHEarth3DCompositorViewport(Object.freeze({widthPx:1280,heightPx:720,pixelRatio:1}));
          const input = route.buildHEarthGateBRouteInput({occurrenceToken:'COMMITTED_HTML_ROUTE_PROBE_002'});
          const admittedFrame = compositor.composeHEarth3DCompositorAdmittedFrame({
            packet002Transfer: input.packet002Transfer,
            packet002TransferOccurrenceId: input.packet002TransferOccurrenceId,
            compositorFrameOccurrenceId: input.compositorFrameOccurrenceId,
            presentationMode: frame.H_EARTH_3D_GROUND_VIEW_GATE_B_PROOF_MODE
          });
          const checks = {
            htmlRouteContract: html.includes('H_EARTH_GROUND_VIEW_GATE_B_ROUTE_ENTRY_RENEWAL_CANDIDATE_v1'),
            htmlRouteInputModule: html.includes('./gate-b-route-input.js?v=gate-b-route-input-001'),
            htmlRouteInputFunction: html.includes('buildHEarthGateBRouteInput'),
            htmlGateBPresentationMode: html.includes('H_EARTH_3D_GROUND_VIEW_GATE_B_PROOF_MODE') && html.includes('GROUND_VIEW_GATE_B_PROOF'),
            legacyShorelineInvocationAbsent: !html.includes('previewHEarthMinimumShorelineGeometry'),
            routeInputValid: input.valid === true,
            packet002Ok: input.packet002Transfer.ok === true,
            admittedFrameValid: frame.isHEarth3DAdmittedGeometryFrame(admittedFrame) === true,
            admittedFrameGateBMode: admittedFrame.presentationMode === 'GROUND_VIEW_GATE_B_PROOF'
          };
          const receipt = {
            receiptId:'H_EARTH_GATE_B_HTML_ROUTE_RENEWAL_RECEIPT_v2',
            checks,
            passed:Object.values(checks).every(Boolean),
            admittedFrameStatus:admittedFrame.status ?? null,
            admittedFrameIssues:admittedFrame.issues ?? [],
            rendererImported:false,
            rendererMounted:false,
            visibleOutputConfirmed:false,
            mainChanged:false,
            finalAcceptance:'NOT_CONFERRED_BY_THIS_PROBE'
          };
          fs.writeFileSync('H_EARTH_GATE_B_HTML_ROUTE_RENEWAL_RECEIPT_v2.json',JSON.stringify(receipt,null,2));
          console.log(JSON.stringify(receipt,null,2));
          if(!receipt.passed) process.exit(1);
          EOF
      - name: Upload committed route receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-gate-b-html-route-renewal-v2
          path: H_EARTH_GATE_B_HTML_ROUTE_RENEWAL_RECEIPT_v2.json
          if-no-files-found: error
