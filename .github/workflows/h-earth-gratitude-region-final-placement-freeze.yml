name: H-Earth Gratitude Region Final Placement Freeze

on:
  push:
    branches:
      - agent/h-earth-gratitude-region-final-placement-disposition-001
  workflow_dispatch:

concurrency:
  group: h-earth-gratitude-region-final-placement-freeze-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-final-placement-freeze:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Check out exact final-placement branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Execute FP-00 input freeze and FP-01 entry correspondence
        env:
          H_EARTH_GRATITUDE_REGION_FINAL_PLACEMENT_BASELINE_RECEIPT: /tmp/h-earth-gratitude-region-final-placement-baseline.json
        run: |
          set -o pipefail
          node h-earth-3d/validation/h-earth.gratitude-region.final-spatial-placement-disposition.runner.mjs \
            2>&1 | tee /tmp/h-earth-gratitude-region-final-placement-baseline.log

      - name: Verify deterministic baseline receipt
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipt = JSON.parse(fs.readFileSync(
            '/tmp/h-earth-gratitude-region-final-placement-baseline.json',
            'utf8'
          ));
          const issues = [];
          if (receipt.status !== 'FP_00_AND_FP_01_PASS_CLOSED') {
            issues.push(`STATUS:${receipt.status}`);
          }
          if (receipt.eligible !== true) issues.push('RECEIPT_NOT_ELIGIBLE');
          if (receipt.deterministicRepeatExecution !== true) {
            issues.push('NONDETERMINISTIC');
          }
          if (receipt.firstExecutionDigest !== receipt.secondExecutionDigest) {
            issues.push('DIGEST_MISMATCH');
          }
          if (receipt.fp00?.frozenInputCount !== 24) {
            issues.push(`FROZEN_INPUT_COUNT:${receipt.fp00?.frozenInputCount}`);
          }
          if (receipt.fp00?.exactFrozenInputMatchCount !== 24) {
            issues.push(
              `FROZEN_MATCH_COUNT:${receipt.fp00?.exactFrozenInputMatchCount}`
            );
          }
          if (receipt.fp00?.priorAuthorityMutation !== false) {
            issues.push('PRIOR_AUTHORITY_MUTATION');
          }
          if (receipt.fp01?.disposition !==
              'ACCEPT_EXISTING_INITIAL_CAMERA_BOUND_ARRIVAL') {
            issues.push(`ENTRY_DISPOSITION:${receipt.fp01?.disposition}`);
          }
          if (receipt.fp01?.initialStateWithinEntryBounds !== true) {
            issues.push('INITIAL_STATE_OUTSIDE_ENTRY');
          }
          if (receipt.fp01?.cameraStartRelocation !== false ||
              receipt.fp01?.cameraAuthorityMutation !== false) {
            issues.push('CAMERA_BOUNDARY_FAILURE');
          }
          if (Object.values(receipt.authorityBoundary ?? {}).some(Boolean)) {
            issues.push('AUTHORITY_BOUNDARY_OVERREACH');
          }
          if (issues.length > 0) {
            console.error(JSON.stringify({ status: 'FAIL_STOPPED', issues }, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({
            status: 'FP_00_AND_FP_01_PASS_CLOSED',
            firstExecutionDigest: receipt.firstExecutionDigest,
            secondExecutionDigest: receipt.secondExecutionDigest,
            frozenInputCount: receipt.fp00.frozenInputCount,
            exactFrozenInputMatchCount: receipt.fp00.exactFrozenInputMatchCount,
            initialState: receipt.fp01.activeInitialState,
            nextCheckpoint: receipt.nextCheckpoint
          }, null, 2));
          NODE

      - name: Upload freeze and entry evidence
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-gratitude-region-final-placement-freeze-evidence
          path: |
            /tmp/h-earth-gratitude-region-final-placement-baseline.json
            /tmp/h-earth-gratitude-region-final-placement-baseline.log
          if-no-files-found: error
          retention-days: 90
