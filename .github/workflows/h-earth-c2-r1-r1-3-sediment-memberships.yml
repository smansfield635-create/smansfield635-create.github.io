name: H-Earth C2-R1 R1.3 Sediment Memberships

on:
  pull_request:
    branches:
      - integration/h-earth-c2-r1-baseline-001
    paths:
      - 'h-earth-3d/terrain/h-earth.coastal-sediment-membership.c2-r1.js'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/**'
      - 'h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.c2-r1-candidate-path-disposition.js'
      - 'h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js'
      - '.github/workflows/h-earth-c2-r1-r1-3-sediment-memberships.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-r1-3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute continuous sediment-membership verification
        env:
          C2_R1_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.r1-3-sediment-memberships.mjs

      - name: Upload R1.3 receipt and engineering captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-c2-r1-r1-3-engineering-evidence
          path: |
            h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/h-earth.c2-r1.r1-3-verification.json
            h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/r1-3-engineering-captures/*.svg
          if-no-files-found: error
          retention-days: 30
