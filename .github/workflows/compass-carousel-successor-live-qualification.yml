name: Compass Gen1526 Atomic Release Browser Verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/compass/**'
      - 'index.html'
      - '.github/workflows/compass-carousel-successor-live-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  GEN1526_RELEASE_HEAD: 48132ad9f44b8b838bb7dffaf7638b9ca072d0fd
  GEN1526_COMPASS_TREE: 3b12603aeaf9476ea0bc3d4b1d794984b74b735e
  GEN1526_INDEX_BLOB: acf63ba59b4248966a1e337c98ad7e28640cf331

jobs:
  verify-atomic-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable Gen1526 release manifest
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "$CANDIDATE_HEAD"
          test "$(git rev-parse HEAD:assets/compass)" = "$GEN1526_COMPASS_TREE"
          test "$(git rev-parse HEAD:index.html)" = "$GEN1526_INDEX_BLOB"
          test ! -e assets/compass/compass.laws-spacecraft.js
          printf '{"schema":"COMPASS_GEN1526_ATOMIC_RELEASE_MANIFEST_v1","candidateHead":"%s","sourceHead":"%s","compassTree":"%s","indexBlob":"%s","result":"PASS_CLOSED"}\n' "$CANDIDATE_HEAD" "$GEN1526_RELEASE_HEAD" "$GEN1526_COMPASS_TREE" "$GEN1526_INDEX_BLOB" > /tmp/compass-gen1526-atomic-manifest.json
      - name: Install browser runtime
        env:
          npm_config_package_lock: 'false'
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Start isolated exact candidate server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/compass-gen1526-atomic-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
      - name: Verify served release on desktop tablet phone and reduced motion
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const head=process.env.CANDIDATE_HEAD;
          const base=`http://127.0.0.1:4173/?candidate=${head}&verification=gen1526-atomic`;
          const checks=[]; const metrics={}; const surfaces={};
          const check=(id,pass,evidence)=>checks.push({id,pass:Boolean(pass),evidence});
          const measure=async page=>page.evaluate(async()=>{const a=[];let last=performance.now();for(let i=0;i<120;i++)await new Promise(r=>requestAnimationFrame(now=>{a.push(now-last);last=now;r()}));const s=a.slice(8).sort((x,y)=>x-y);return{median:Number((s[Math.floor(s.length*.5)]||999).toFixed(2)),p95:Number((s[Math.floor(s.length*.95)]||999).toFixed(2)),samples:s.length}});
          const browser=await chromium.launch({headless:true});
          try {
            for(const [name,width,height,reduced] of [['desktop',1440,900,false],['tablet',820,1180,false],['phone',390,844,false],['reduced',820,1180,true]]){
              const context=await browser.newContext({viewport:{width,height},reducedMotion:reduced?'reduce':'no-preference'});
              const page=await context.newPage(); const errors=[]; const consoleErrors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
              await page.goto(`${base}&surface=${name}`,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(2200);
              const state=await page.evaluate(()=>({
                identityMounted:Boolean(globalThis.DGB_COMPASS_IDENTITY_3D_GEN1524?.mounted),
                identityReceipt:globalThis.DGB_COMPASS_IDENTITY_3D_GEN1524||null,
                crystals:globalThis.DGB_COMPASS_CRYSTALS_RECEIPT||null,
                mirror:globalThis.DGB_COMPASS_MIRRORLAND_WINDOW_RECEIPT||null,
                cardinals:document.querySelectorAll('[data-cardinal-id]').length,
                rooms:document.querySelectorAll('[data-compass-room-declarations] [data-compass-room]').length,
                overflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth,
                identityScript:[...document.scripts].map(s=>s.src).find(x=>x.includes('compass.identity-3d.js'))||null,
                brainScript:[...document.scripts].map(s=>s.src).find(x=>x.includes('compass.brain-scene.js'))||null,
                standaloneLaws:[...document.scripts].map(s=>s.src).find(x=>x.includes('compass.laws-spacecraft.js'))||null
              }));
              const frame=await measure(page); metrics[name]=frame; surfaces[name]=state;
              check(`${name}_NO_PAGE_ERRORS`,errors.length===0,{errors,consoleErrors});
              check(`${name}_FOUR_CARDINALS`,state.cardinals===4,state.cardinals);
              check(`${name}_NINETEEN_ROOMS`,state.rooms===19,state.rooms);
              check(`${name}_NO_HORIZONTAL_OVERFLOW`,state.overflow<=2,state.overflow);
              check(`${name}_CRYSTALS_AVAILABLE`,state.crystals?.status==='available',state.crystals);
              check(`${name}_MIRRORLAND_AVAILABLE`,state.mirror?.status==='available',state.mirror);
              check(`${name}_IDENTITY_RUNTIME_MOUNTED`,state.identityMounted,state.identityReceipt);
              check(`${name}_NO_STANDALONE_LAWS_ADAPTER`,state.standaloneLaws===null,state.standaloneLaws);
              check(`${name}_FRAME_CADENCE`,frame.median<=18.5&&frame.p95<=26,{target:16.7,...frame});
              await page.screenshot({path:`/tmp/compass-gen1526-atomic-${name}.png`,fullPage:true});
              await context.close();
            }
          } catch(error) {
            check('HARNESS_EXCEPTION',false,String(error?.stack||error));
          } finally { await browser.close(); }
          const failures=checks.filter(x=>!x.pass);
          const receipt={schema:'COMPASS_GEN1526_ATOMIC_RELEASE_BROWSER_RECEIPT_v1',candidateHead:head,sourceHead:process.env.GEN1526_RELEASE_HEAD,compassTree:process.env.GEN1526_COMPASS_TREE,indexBlob:process.env.GEN1526_INDEX_BLOB,result:failures.length?'FAIL_CLOSED':'PASS_CLOSED',metrics,surfaces,checks,failures:failures.map(x=>x.id)};
          fs.writeFileSync('/tmp/compass-gen1526-atomic-browser.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          if(failures.length) process.exitCode=1;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-gen1526-atomic-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/compass-gen1526-atomic-manifest.json
            /tmp/compass-gen1526-atomic-browser.json
            /tmp/compass-gen1526-atomic-*.png
            /tmp/compass-gen1526-atomic-server.log
          retention-days: 90
