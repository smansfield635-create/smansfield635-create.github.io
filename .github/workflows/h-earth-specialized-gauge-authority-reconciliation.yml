name: H-Earth Specialized Gauge Authority Reconciliation

on:
  pull_request:
    paths:
      - '.github/workflows/h-earth-instrument-platform.yml'
      - '.github/workflows/h-earth-specialized-gauge-authority-reconciliation.yml'
      - 'gauges/h-earth/**'
      - 'h-earth-3d/control-plane/instrument-platform/H_EARTH_SPECIALIZED_GAUGE_AUTHORITY_RECONCILIATION_001.v1.mjs'
      - 'h-earth-3d/tools/instrument-platform/tool-registry.mjs'
      - 'h-earth-3d/tools/instrument-platform/instrument-adapters.mjs'
      - 'h-earth-3d/validation/instrument-platform/h-earth.specialized-gauge-authority-reconciliation.*.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/h-earth-specialized-gauge-authority-reconciliation.yml'
      - 'gauges/h-earth/**'
      - 'h-earth-3d/control-plane/instrument-platform/H_EARTH_SPECIALIZED_GAUGE_AUTHORITY_RECONCILIATION_001.v1.mjs'
      - 'h-earth-3d/tools/instrument-platform/tool-registry.mjs'
      - 'h-earth-3d/tools/instrument-platform/instrument-adapters.mjs'
      - 'h-earth-3d/validation/instrument-platform/h-earth.specialized-gauge-authority-reconciliation.*.mjs'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify-specialized-gauge-reconciliation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact gauge reconciliation candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install bounded Chromium dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start exact-source gauge server
        run: |
          python3 -m http.server 4185 --bind 127.0.0.1 > /tmp/h-earth-specialized-gauge-server.log 2>&1 &
          for attempt in $(seq 1 90); do
            curl -fsS http://127.0.0.1:4185/gauges/h-earth/index.html >/dev/null \
              && curl -fsS http://127.0.0.1:4185/h-earth-3d/tools/instrument-platform/index.html >/dev/null \
              && exit 0
            sleep 1
          done
          cat /tmp/h-earth-specialized-gauge-server.log
          exit 1

      - name: Execute deterministic gauge kernel
        run: |
          node h-earth-3d/validation/instrument-platform/h-earth.specialized-gauge-authority-reconciliation.runner.mjs \
            | tee /tmp/h-earth-specialized-gauge-kernel.log

      - name: Execute exact browser and unified-platform adapter verification
        env:
          H_EARTH_GAUGE_ORIGIN: ${{ github.event_name == 'push' && 'https://smansfield635-create.github.io' || 'http://127.0.0.1:4185' }}
          H_EARTH_GAUGE_PUBLIC_VERIFY: ${{ github.event_name == 'push' && 'true' || 'false' }}
        run: |
          node h-earth-3d/validation/instrument-platform/h-earth.specialized-gauge-authority-reconciliation.browser.mjs \
            | tee /tmp/h-earth-specialized-gauge-browser.log

      - name: Enforce checkpoint boundary
        env:
          EXPECT_PUBLIC: ${{ github.event_name == 'push' && 'true' || 'false' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'h-earth-3d/validation/instrument-platform/h-earth.specialized-gauge-authority-reconciliation.browser.receipt.v1.json';
          const receipt = JSON.parse(fs.readFileSync(path, 'utf8'));
          const readiness = receipt.directGauge?.readiness ?? {};
          const expectPublic = process.env.EXPECT_PUBLIC === 'true';
          const valid =
            receipt.status === 'PASS_CLOSED' &&
            receipt.failureCount === 0 &&
            receipt.deployedSourceVerification?.verified === true &&
            receipt.publicVerificationPerformed === expectPublic &&
            readiness.requiredApplicableChecks === 11 &&
            readiness.requiredApplicablePasses === 11 &&
            readiness.requiredApplicableFailures === 0 &&
            readiness.requiredApplicableUnresolved === 0 &&
            readiness.readinessPercent === 100 &&
            readiness.mergeEligible === true &&
            receipt.boundaries?.liveHEarthMutationPerformed === false &&
            receipt.boundaries?.showroomProductMutationPerformed === false;
          if (!valid) {
            console.error(JSON.stringify(receipt, null, 2));
            process.exit(1);
          }
          const checkpoint = expectPublic ? 'A7_PUBLIC_PASS' : 'A5_BROWSER_PASS';
          console.log(`H_EARTH_SPECIALIZED_GAUGE_${checkpoint}:${receipt.executedHead}:${receipt.canonicalReceiptSha256}`);
          NODE

      - name: Publish A7 public execution receipt to PR 401
        if: ${{ github.event_name == 'push' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const receiptPath = 'h-earth-3d/validation/instrument-platform/h-earth.specialized-gauge-authority-reconciliation.browser.receipt.v1.json';
            const receipt = JSON.parse(fs.readFileSync(receiptPath, 'utf8'));
            const readiness = receipt.directGauge?.readiness ?? {};
            const observed = receipt.unifiedPlatformAdapter?.observation?.payload ?? {};
            const executed = receipt.unifiedPlatformAdapter?.execution?.result ?? {};
            const browserEvidence = receipt.browserEvidence ?? {};
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## Operation A · A7 public execution receipt',
              '',
              '```text',
              'RECEIPT_TYPE = H_EARTH_A7_PUBLIC_EXECUTION_RECEIPT_v1',
              'OPERATION = H_EARTH_SPECIALIZED_GAUGE_AUTHORITY_RECONCILIATION_001',
              'CHECKPOINT = A7_MERGE_CANDIDATE_AND_POST_MERGE_EXECUTION',
              'STATUS = PASS_CLOSED',
              `PUBLIC_EXECUTED_HEAD = ${receipt.executedHead}`,
              `WORKFLOW_RUN_ID = ${context.runId}`,
              `WORKFLOW_RUN_URL = ${runUrl}`,
              `PUBLIC_RECEIPT_SHA256 = ${receipt.canonicalReceiptSha256}`,
              `PUBLIC_SOURCE_IDENTITY_ATTEMPT = ${receipt.deployedSourceVerification?.attempt ?? 'UNKNOWN'}`,
              `PUBLIC_SOURCE_IDENTITIES_MATCH = ${receipt.deployedSourceVerification?.verified === true}`,
              '```',
              '',
              '```text',
              `REQUIRED_APPLICABLE_CHECKS = ${readiness.requiredApplicableChecks}`,
              `REQUIRED_APPLICABLE_PASSES = ${readiness.requiredApplicablePasses}`,
              `REQUIRED_APPLICABLE_FAILURES = ${readiness.requiredApplicableFailures}`,
              `REQUIRED_APPLICABLE_UNRESOLVED = ${readiness.requiredApplicableUnresolved}`,
              `READINESS = ${readiness.readinessPercent}`,
              `MERGE_ELIGIBLE = ${readiness.mergeEligible}`,
              `DIRECT_GAUGE_RECEIPT_DIGEST = ${receipt.directGauge?.receiptDigest ?? 'NONE'}`,
              `REPEATED_GAUGE_RECEIPT_DIGEST = ${receipt.repeatedGaugeReceiptDigest ?? 'NONE'}`,
              `UNIFIED_PLATFORM_OBSERVATION_RECEIPT_DIGEST = ${observed.receiptDigest ?? 'NONE'}`,
              `UNIFIED_PLATFORM_EXECUTION_RECEIPT_DIGEST = ${executed.receiptDigest ?? 'NONE'}`,
              `ADAPTER_EXECUTED_SOURCE_HEAD = ${observed.executedSourceHead ?? 'NONE'}`,
              '```',
              '',
              '```text',
              `CONSOLE_ERRORS = ${(browserEvidence.consoleErrors ?? []).length}`,
              `PAGE_ERRORS = ${(browserEvidence.pageErrors ?? []).length}`,
              `HTTP_ERRORS = ${(browserEvidence.httpErrors ?? []).length}`,
              `SHOWROOM_PRODUCT_MUTATION = ${receipt.boundaries?.showroomProductMutationPerformed === true}`,
              `LIVE_H_EARTH_MUTATION = ${receipt.boundaries?.liveHEarthMutationPerformed === true}`,
              `NARRATIVE_PRESENTATION_MUTATION = ${receipt.boundaries?.narrativePresentationMutationPerformed === true}`,
              'USER_DIFFERENTIAL_REQUIRED = FALSE',
              'NEXT = A8_OPERATION_CLOSURE_PACKAGE',
              '```'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 401,
              body
            });

      - name: Upload specialized gauge reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-specialized-gauge-authority-reconciliation-001
          path: |
            h-earth-3d/validation/instrument-platform/h-earth.specialized-gauge-authority-reconciliation.browser.receipt.v1.json
            h-earth-3d/validation/instrument-platform/evidence/specialized-gauge-authority-reconciliation/
            /tmp/h-earth-specialized-gauge-kernel.log
            /tmp/h-earth-specialized-gauge-browser.log
            /tmp/h-earth-specialized-gauge-server.log
          retention-days: 90
