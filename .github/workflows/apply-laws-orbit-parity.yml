name: Apply Laws Orbit Parity

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-orbit-parity:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Transplant exact Main Compass cluster geometry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('laws/index.crystals.js')
          source = path.read_text(encoding='utf-8')

          def replace_exact(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one source block, found {count}')
              source = source.replace(old, new, 1)

          replace_exact(
          '''    cluster:
                Object.freeze({
                  horizontalRadius:
                    1.04,

                  verticalRadius:
                    0.90,

                  depthRadius:
                    0.84,

                  centerRadius:
                    0.26,

                  primaryAnchor:''',
          '''    cluster:
                Object.freeze({
                  horizontalRadius:
                    1.36,

                  verticalRadius:
                    1.18,

                  depthRadius:
                    1.04,

                  primaryAnchor:''',
          'MAIN_COMPASS_CLUSTER_RADII'
          )

          replace_exact(
          '''  function effectiveClusterQuaternion(
              localQuaternion
            ) {
              return quaternionMultiply(
                state.constellationQuaternion,
                localQuaternion
              );
            }

            function rotatedLawUnitVector(
              node,
              localQuaternion
            ) {
              return normalizeVector(
                quaternionRotateVector(
                  effectiveClusterQuaternion(
                    localQuaternion
                  ),
                  node.sphereVector
                )
              );
            }''',
          '''  function rotatedLawUnitVector(
              node,
              localQuaternion
            ) {
              return normalizeVector(
                quaternionRotateVector(
                  localQuaternion,
                  node.sphereVector
                )
              );
            }''',
          'INDEPENDENT_CLUSTER_QUATERNION'
          )

          replace_exact(
          '''  function sphericalLawPosition(
              node,
              localQuaternion
            ) {
              const unit =
                rotatedLawUnitVector(
                  node,
                  localQuaternion
                );

              const activeDirectionUnit =
                rotatedCategoryUnitVector(
                  node.direction
                );

              return {
                x:
                  activeDirectionUnit[0] *
                    SPHERE.cluster.centerRadius +
                  unit[0] *
                    SPHERE.cluster.horizontalRadius,

                y:
                  activeDirectionUnit[1] *
                    SPHERE.cluster.centerRadius +
                  unit[1] *
                    SPHERE.cluster.verticalRadius,

                z:
                  activeDirectionUnit[2] *
                    SPHERE.cluster.centerRadius +
                  unit[2] *
                    SPHERE.cluster.depthRadius,

                depth:
                  (unit[2] + 1) / 2,

                primary:
                  clamp(
                    (
                      dot(
                        unit,
                        clusterAnchorVector()
                      ) +
                      1
                    ) /
                      2,
                    0,
                    1
                  )
              };
            }''',
          '''  function sphericalLawPosition(
              node,
              localQuaternion
            ) {
              const unit =
                rotatedLawUnitVector(
                  node,
                  localQuaternion
                );

              return {
                x:
                  unit[0] *
                    SPHERE.cluster.horizontalRadius,

                y:
                  unit[1] *
                    SPHERE.cluster.verticalRadius,

                z:
                  unit[2] *
                    SPHERE.cluster.depthRadius,

                depth:
                  (unit[2] + 1) / 2,

                primary:
                  clamp(
                    (
                      dot(
                        unit,
                        clusterAnchorVector()
                      ) +
                      1
                    ) /
                      2,
                    0,
                    1
                  )
              };
            }''',
          'MAIN_COMPASS_SPHERICAL_POSITION'
          )

          replace_exact(
          '''              y:
                          sphere.y - 0.06,

                        z:
                          sphere.z + 0.14,''',
          '''              y:
                          sphere.y,

                        z:
                          sphere.z,''',
          'REMOVE_MANUAL_YZ_NUDGES'
          )

          forbidden = (
              'centerRadius:',
              'effectiveClusterQuaternion(',
              'sphere.y - 0.06',
              'sphere.z + 0.14'
          )
          for token in forbidden:
              if token in source:
                  raise SystemExit(f'FORBIDDEN_ORBIT_DISTORTION_REMAINS:{token}')

          path.write_text(source, encoding='utf-8')
          PY

      - name: Validate JavaScript syntax and Euclidean separation
        shell: bash
        run: |
          node --check laws/index.crystals.js
          python - <<'PY'
          import math

          radii = (1.36, 1.18, 1.04)
          latitude_amplitude = 0.48
          latitude_frequency = 1.73
          count = 4
          vectors = []

          for index in range(count):
              longitude = (math.tau * index) / count - math.pi / 2
              latitude = math.sin((index + 0.5) * latitude_frequency) * latitude_amplitude
              cosine_latitude = math.cos(latitude)
              vector = (
                  math.cos(longitude) * cosine_latitude,
                  math.sin(latitude),
                  math.sin(longitude) * cosine_latitude,
              )
              length = math.sqrt(sum(component * component for component in vector))
              vectors.append(tuple(component / length for component in vector))

          positions = [
              (
                  vector[0] * radii[0],
                  vector[1] * radii[1],
                  vector[2] * radii[2],
              )
              for vector in vectors
          ]

          minimum_center_distance = min(
              math.sqrt(sum(component * component for component in position))
              for position in positions
          )
          minimum_pair_distance = min(
              math.dist(positions[left], positions[right])
              for left in range(count)
              for right in range(left + 1, count)
          )

          assert minimum_center_distance > 1.0
          assert minimum_pair_distance > 1.25
          assert len({tuple(round(value, 9) for value in position) for position in positions}) == 4

          print('LAWS_ORBIT_PARITY_HARNESS=PASS')
          print(f'MINIMUM_CENTER_DISTANCE={minimum_center_distance:.6f}')
          print(f'MINIMUM_PAIR_DISTANCE={minimum_pair_distance:.6f}')
          PY

      - name: Commit one-file Laws orbital correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-laws-orbit-parity.yml
          git add laws/index.crystals.js
          git commit -m "Align Laws clusters with Main Compass orbit geometry"
          git push
