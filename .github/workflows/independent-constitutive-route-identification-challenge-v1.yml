name: Independent Constitutive Route Identification Challenge v1

on:
  pull_request:
    paths:
      - "research/route-operator-platform-v1/registered-challenges/independent-constitutive-route-identification-challenge-v1/**"
      - ".github/workflows/independent-constitutive-route-identification-challenge-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen protocol package
        run: >-
          python
          research/route-operator-platform-v1/registered-challenges/independent-constitutive-route-identification-challenge-v1/verify_independent_constitutive_route_identification_challenge_v1.py
