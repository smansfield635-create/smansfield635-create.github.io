name: Build Awards remove final side gaps

on:
  push:
    branches:
      - agent/awards-remove-final-side-gaps-20260815

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/awards-remove-final-side-gaps-20260815
          fetch-depth: 0

      - name: Remove final side gaps without changing vertical crop
        shell: bash
        run: |
          set -euo pipefail
          PAGE='showroom/globe/h-earth/awards/index.html'
          python - <<'PY'
          from pathlib import Path
          p=Path('showroom/globe/h-earth/awards/index.html')
          s=p.read_text()
          old='transform:scale(1.62);transform-origin:center center'
          new='transform:scale(1.74,1.62);transform-origin:center center'
          if old not in s:
              raise SystemExit('expected current media transform not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Verify bounded page-only mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff -- showroom/globe/h-earth/awards/index.html
          test "$(git diff --name-only | grep -v '^.github/workflows/build-awards-remove-final-side-gaps.yml$' | wc -l)" -eq 1
          grep -q 'transform:scale(1.74,1.62)' showroom/globe/h-earth/awards/index.html
          grep -q 'class="media-play"' showroom/globe/h-earth/awards/index.html
          test -z "$(git diff --name-only -- 'showroom/globe/h-earth/awards/media/*')"

      - name: Commit page-only correction and retire builder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'smansfield635-create'
          git config user.email 'smansfield635@gmail.com'
          git add showroom/globe/h-earth/awards/index.html
          git commit -m 'Awards: eliminate final media side gaps'
          git rm .github/workflows/build-awards-remove-final-side-gaps.yml
          git commit -m 'Retire Awards final side-gap builder'
          git push origin HEAD:agent/awards-remove-final-side-gaps-20260815
