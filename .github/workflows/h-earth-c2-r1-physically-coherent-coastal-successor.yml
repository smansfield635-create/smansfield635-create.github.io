name: H-Earth C2-R1 R1.8 Isolated Review Execution

on:
  pull_request:
    branches:
      - integration/h-earth-c2-r1-baseline-001
    paths:
      - '.github/workflows/h-earth-c2-r1-physically-coherent-coastal-successor.yml'
  workflow_dispatch:

concurrency:
  group: h-earth-c2-r1-r1-8-isolated-review
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  execute-r1-8-through-served-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Gate bounded launch commit
        id: gate
        run: |
          set -euo pipefail
          message="$(git log -1 --format=%s)"
          if [ "$message" = "R1.8: install isolated review and execution workflow" ]; then
            echo "execute=true" >> "$GITHUB_OUTPUT"
          else
            echo "execute=false" >> "$GITHUB_OUTPUT"
            echo "R1.8 execution skipped for non-launch commit: $message"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.execute == 'true'
        with:
          node-version: 22

      - name: Install bounded browser verifier
        if: steps.gate.outputs.execute == 'true'
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Execute R1.8A through R1.8D and stop for user differential
        if: steps.gate.outputs.execute == 'true'
        run: |
          node h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.r1-8-integrated-functional-publication.mjs

      - name: Upload bounded R1.8 evidence
        if: always() && steps.gate.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-c2-r1-r1-8-review-evidence
          path: h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/r1-8
          if-no-files-found: error
          retention-days: 30
