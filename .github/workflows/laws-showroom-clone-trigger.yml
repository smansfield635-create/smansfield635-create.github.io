name: Validate canonical crystal clone

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  validate-clone:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/laws-showroom-crystal-corridor-clone-001
          fetch-depth: 0

      - name: Repair target integration contracts
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(text, before, after, identity):
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"{identity}: expected 1, found {count}")
              return text.replace(before, after)

          laws_path = Path("laws/index.crystals.js")
          laws = laws_path.read_text(encoding="utf-8")

          replacements = {
              "uViewNormalMatrix": "uNormalMatrix",
              "viewNormalMatrix": "normalMatrix",
              "uKeyLightView": "uKeyLight",
              "keyLightView": "keyLight",
              "uFillLightView": "uFillLight",
              "fillLightView": "fillLight",
              "uRimLightView": "uRimLight",
              "rimLightView": "rimLight",
          }
          for before, after in replacements.items():
              if before not in laws:
                  raise SystemExit(f"laws uniform integration token missing: {before}")
              laws = laws.replace(before, after)

          laws_path.write_text(laws, encoding="utf-8")
          Path("laws/index.crystals.source.js").write_text(
              laws,
              encoding="utf-8",
          )

          showroom_path = Path("showroom/index.crystals.js")
          showroom = showroom_path.read_text(encoding="utf-8")
          showroom = replace_once(
              showroom,
              '''    const mesh =
              context.meshes.get(
                node.kind
              );''',
              '''    const meshKey =
              node.kind === NODE_KINDS.CARDINAL
                ? `cardinal-${node.cardinalId}`
                : `room-${node.cardinalId}`;

            const mesh =
              context.meshes.get(meshKey);''',
              "showroom-mesh-key",
          )
          showroom_path.write_text(showroom, encoding="utf-8")
          Path("showroom/index.crystals.source.js").write_text(
              showroom,
              encoding="utf-8",
          )

          diagnostic = Path(".laws-showroom-clone-generation-error.txt")
          if diagnostic.exists():
              diagnostic.unlink()

      - name: Validate syntax and cloned shader contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check laws/index.crystals.js
          node --check showroom/index.crystals.js
          cmp -s laws/index.crystals.js laws/index.crystals.source.js
          cmp -s showroom/index.crystals.js showroom/index.crystals.source.js
          git diff --check

      - name: Validate shader and renderer identities
        shell: python
        run: |
          from pathlib import Path
          import re

          required_common = [
              "function createDiamondStarMesh(",
              "attribute vec3 aColor;",
              "varying vec3 vWorldPosition;",
              "float rearSuppression =",
              "float facetBand =",
              "if (vHaloPass > 0.5)",
              "gl.CULL_FACE",
              "gl.LEQUAL",
              "gl.SRC_ALPHA",
              "gl.ONE_MINUS_SRC_ALPHA",
          ]

          for path in [
              "laws/index.crystals.js",
              "showroom/index.crystals.js",
          ]:
              text = Path(path).read_text(encoding="utf-8")
              for token in required_common:
                  if token not in text:
                      raise SystemExit(f"{path}: missing canonical token {token}")
              for retired in [
                  "loadSourceSynchronously",
                  "transformSource",
                  "uViewNormalMatrix",
                  "uKeyLightView",
                  "uFillLightView",
                  "uRimLightView",
              ]:
                  if retired in text:
                      raise SystemExit(f"{path}: retired token remains {retired}")

          laws = Path("laws/index.crystals.js").read_text(encoding="utf-8")
          for token in [
              '"uNormalMatrix"',
              '"uKeyLight"',
              '"uFillLight"',
              '"uRimLight"',
              "renderer.uniforms.normalMatrix",
              "renderer.uniforms.keyLight",
              "renderer.uniforms.fillLight",
              "renderer.uniforms.rimLight",
          ]:
              if token not in laws:
                  raise SystemExit(f"laws renderer contract missing {token}")

          showroom = Path("showroom/index.crystals.js").read_text(encoding="utf-8")
          for token in [
              "`cardinal-${node.cardinalId}`",
              "`room-${node.cardinalId}`",
              "context.meshes.get(meshKey)",
              "context.attributes.color",
              "context.uniforms.normalMatrix",
              "context.uniforms.keyLight",
              "context.uniforms.fillLight",
              "context.uniforms.rimLight",
          ]:
              if token not in showroom:
                  raise SystemExit(f"showroom renderer contract missing {token}")

          declared = set(re.findall(
              r"uniform\s+(?:float|vec[234]|mat[234])\s+(u[A-Za-z0-9_]+)\s*;",
              laws,
          ))
          looked_up = set(re.findall(
              r'getUniformLocation\(\s*program,\s*"(u[A-Za-z0-9_]+)"\s*\)',
              laws,
          ))
          missing = declared - looked_up
          if missing:
              raise SystemExit(f"laws declared uniforms not looked up: {sorted(missing)}")

      - name: Commit repaired candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .laws-showroom-clone-generation-error.txt
          git add laws/index.crystals.js laws/index.crystals.source.js \
                  showroom/index.crystals.js showroom/index.crystals.source.js
          git commit -m "Close cloned crystal renderer integration contracts"
          git push origin HEAD:agent/laws-showroom-crystal-corridor-clone-001
