name: L2 HC05 Gen957 Browser Navigation Evidence v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/l2-hc05-gen957-browser-navigation-evidence-v1.yml'

permissions:
  contents: read

env:
  L2_ADMISSION_HEAD: 8b253efb26a22e30c85c28d2666dcfbfb1fbc173
  L2_LOCK_GENERATION: '965'
  HC05_REJECTED_SHA: b440b95bc73d799578b12678944c0ad73e167d7e
  HC05_CANDIDATE_SHA: 5caeb864296174d7b2db58f023f1d0c5431b5306
  HC05_EXPECTED_PACKAGE_ID: H_EARTH_RUN_8E_R2_LIVE_RENDER_PACKAGE_263563C5
  EVIDENCE_DIR: /tmp/l2-hc05-gen957-browser-navigation-evidence

jobs:
  browser-navigation-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact carrier candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact one-file carrier scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$L2_ADMISSION_HEAD" HEAD | sort > /tmp/l2-paths.txt
          printf '%s\n' '.github/workflows/l2-hc05-gen957-browser-navigation-evidence-v1.yml' > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/l2-paths.txt
          mkdir -p "$EVIDENCE_DIR"
          cp /tmp/l2-paths.txt "$EVIDENCE_DIR/l2-exact-paths.txt"

      - name: Checkout rejected gen895 comparison
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HC05_REJECTED_SHA }}
          path: hc05-rejected
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact gen957 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HC05_CANDIDATE_SHA }}
          path: hc05-candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Verify subjects and exact gen957 product delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C hc05-rejected rev-parse HEAD)" = "$HC05_REJECTED_SHA"
          test "$(git -C hc05-candidate rev-parse HEAD)" = "$HC05_CANDIDATE_SHA"
          git -C hc05-candidate diff --name-only "$L2_ADMISSION_HEAD" "$HC05_CANDIDATE_SHA" | sort > "$EVIDENCE_DIR/hc05-gen957-paths.txt"
          cat > /tmp/expected-hc05.txt <<'EOF'
          h-earth-3d/environment/h-earth.successor-surface-material.run8c.js
          h-earth-3d/environment/h-earth.vegetation-resolution.run8d.js
          showroom/globe/h-earth/functional-landscape/navigation.js
          showroom/globe/h-earth/functional-landscape/public-live-gpu-integration.run8e-r3e.js
          showroom/globe/h-earth/render/geometry-shoreline.js
          showroom/globe/h-earth/render/geometry-successor-terrain.run8b.js
          showroom/globe/h-earth/render/live-renderer-contract.run8e-r3a.js
          showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js
          EOF
          sort -o /tmp/expected-hc05.txt /tmp/expected-hc05.txt
          diff -u /tmp/expected-hc05.txt "$EVIDENCE_DIR/hc05-gen957-paths.txt"
          test "$(git -C hc05-candidate rev-parse "$HC05_CANDIDATE_SHA:h-earth-3d/terrain/h-earth.terrain-estate-construction-v1.candidate.js")" = "4ec87cdd5ec1b73710da6dd686a96610a633d27a"
          test "$(git -C hc05-candidate rev-parse "$HC05_CANDIDATE_SHA:showroom/globe/h-earth/terrain-estate-construction-v1/renderer.mjs")" = "1f9f03cc10c687f6890ff3efed417018fd3496bf"

      - name: Install Chromium capability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/l2-hc05-gen957-playwright
          cd /tmp/l2-hc05-gen957-playwright
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false playwright pngjs
          npx playwright install --with-deps chromium

      - name: Start exact comparison servers
        shell: bash
        run: |
          set -euo pipefail
          (cd hc05-rejected && python3 -m http.server 4173 > "$EVIDENCE_DIR/rejected-server.log" 2>&1 &)
          (cd hc05-candidate && python3 -m http.server 4174 > "$EVIDENCE_DIR/candidate-server.log" 2>&1 &)
          for port in 4173 4174; do
            for attempt in $(seq 1 40); do
              curl --fail --silent "http://127.0.0.1:${port}/showroom/globe/h-earth/" >/dev/null && break
              test "$attempt" != 40
              sleep 1
            done
          done

      - name: Execute browser and navigation matrix
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/l2-hc05-gen957-playwright/run.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { chromium } from 'playwright';
          import { PNG } from 'pngjs';

          const out = process.env.EVIDENCE_DIR;
          const expectedPackage = process.env.HC05_EXPECTED_PACKAGE_ID;
          const subjects = [
            { id: 'rejected-gen895', sha: process.env.HC05_REJECTED_SHA, port: 4173 },
            { id: 'candidate-gen957', sha: process.env.HC05_CANDIDATE_SHA, port: 4174 }
          ];
          const configs = [
            { id: 'desktop-landscape', width: 1280, height: 800, isMobile: false, hasTouch: false, dsf: 1 },
            { id: 'samsung-mobile-portrait', width: 412, height: 915, isMobile: true, hasTouch: true, dsf: 3 },
            { id: 'samsung-mobile-landscape', width: 915, height: 412, isMobile: true, hasTouch: true, dsf: 3 }
          ];
          await fs.mkdir(out, { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const results = [];
          const digest = b => createHash('sha256').update(b).digest('hex');

          async function observe(page) {
            return page.evaluate(async () => {
              const startup = window.H_EARTH_RENDERER_STARTUP_DIAGNOSTICS?.getReceipt?.() ?? null;
              const publicReceipt = window.H_EARTH_RUN8E_PUBLIC_ROUTE?.getReceipt?.() ?? null;
              const intake = window.H_EARTH_RUN8E_PUBLIC_ROUTE?.getIntakeReceipt?.() ?? null;
              const liveGpu = window.H_EARTH_RUN8E_PUBLIC_ROUTE?.getLiveGpuReceipt?.() ?? null;
              const pkgModule = await import('/showroom/globe/h-earth/render/live-render-package.run8e-r2.canonical.js');
              const pkg = pkgModule.getHEarthRun8ER2CanonicalLiveRenderPackage();
              const canvas = document.getElementById('h-earth-functional-landscape-canvas');
              const r = canvas?.getBoundingClientRect?.();
              return {
                startup, publicReceipt, intake, liveGpu,
                packageIdentity: pkg.packageIdentity,
                packageContentDigest: pkg.contentDigest,
                devicePixelRatio: window.devicePixelRatio,
                canvas: canvas ? { backingWidth: canvas.width, backingHeight: canvas.height, cssWidth: r.width, cssHeight: r.height } : null,
                viewport: { width: innerWidth, height: innerHeight }
              };
            });
          }

          async function waitReady(page, label) {
            await page.waitForFunction(() => {
              const r = window.H_EARTH_RENDERER_STARTUP_DIAGNOSTICS?.getReceipt?.();
              return !!r && (r.firstFailureStage || (r.stages?.FIRST_FRAME_PRESENTED === 'PASS' && r.stages?.READY_PUBLISHED === 'PASS'));
            }, null, { timeout: 120000 });
            await page.waitForFunction(() => window.H_EARTH_RUN8E_PUBLIC_ROUTE?.ready === true, null, { timeout: 30000 });
            const o = await observe(page);
            assert.equal(o.startup.firstFailureStage, null, `${label}: startup failure ${o.startup.firstFailureStage}`);
            assert.equal(o.startup.stages.FIRST_FRAME_PRESENTED, 'PASS');
            assert.equal(o.startup.stages.READY_PUBLISHED, 'PASS');
            assert.equal(o.packageIdentity, expectedPackage, `${label}: package mismatch`);
            return o;
          }

          async function capture(page, stem) {
            const p = await page.screenshot({ path: path.join(out, `${stem}-page.png`), fullPage: false });
            const c = await page.locator('#h-earth-functional-landscape-canvas').screenshot({ path: path.join(out, `${stem}-canvas.png`) });
            return { pageSha256: digest(p), canvasSha256: digest(c) };
          }

          async function pointerLook(page) {
            const b = await page.locator('#h-earth-functional-landscape-canvas').boundingBox();
            assert.ok(b && b.width > 100 && b.height > 100);
            const x = b.x + b.width * 0.45, y = b.y + b.height * 0.5;
            await page.mouse.move(x, y);
            await page.mouse.down();
            await page.mouse.move(x + Math.min(150, b.width * 0.24), y, { steps: 12 });
            await page.waitForTimeout(550);
            await page.mouse.up();
            await page.waitForTimeout(350);
          }

          async function touchTravel(page) {
            const b = await page.locator('#h-earth-functional-landscape-canvas').boundingBox();
            assert.ok(b && b.width > 100 && b.height > 100);
            const cdp = await page.context().newCDPSession(page);
            const x1 = b.x + b.width * 0.42, x2 = b.x + b.width * 0.58, y = b.y + b.height * 0.58;
            const dy = Math.min(120, b.height * 0.22);
            const points = off => [
              { x: x1, y: y - off, radiusX: 7, radiusY: 7, force: 1, id: 1 },
              { x: x2, y: y - off, radiusX: 7, radiusY: 7, force: 1, id: 2 }
            ];
            await cdp.send('Input.dispatchTouchEvent', { type: 'touchStart', touchPoints: points(0) });
            await cdp.send('Input.dispatchTouchEvent', { type: 'touchMove', touchPoints: points(dy) });
            await page.waitForTimeout(650);
            await cdp.send('Input.dispatchTouchEvent', { type: 'touchEnd', touchPoints: [] });
            await page.waitForTimeout(400);
          }

          async function run(subject, config) {
            const context = await browser.newContext({
              viewport: { width: config.width, height: config.height },
              isMobile: config.isMobile,
              hasTouch: config.hasTouch,
              deviceScaleFactor: config.dsf
            });
            const page = await context.newPage();
            const consoleErrors = [], pageErrors = [];
            page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            page.on('pageerror', e => pageErrors.push(e.message));
            const url = `http://127.0.0.1:${subject.port}/showroom/globe/h-earth/?visual=terrain-relief-v2&gen957=${subject.id}-${config.id}`;
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 180000 });
            const initial = await waitReady(page, `${subject.id}/${config.id}`);
            assert.equal(pageErrors.length, 0, `${subject.id}/${config.id}: page errors ${JSON.stringify(pageErrors)}`);
            assert.equal(consoleErrors.length, 0, `${subject.id}/${config.id}: console errors ${JSON.stringify(consoleErrors)}`);
            const initialCapture = await capture(page, `${subject.id}-${config.id}-initial`);
            const result = { subject: subject.id, subjectSha: subject.sha, config, url, initial, initialCapture, states: [], consoleErrors, pageErrors };

            if (subject.id === 'candidate-gen957') {
              const sequence0 = initial.intake.currentNavigationState.sequence;
              const frames0 = initial.liveGpu.counters.gpuFramebufferPresentationCount;
              await pointerLook(page);
              const look = await observe(page);
              assert.ok(look.intake.currentNavigationState.sequence > sequence0, `${config.id}: pointer look did not navigate`);
              assert.ok(look.liveGpu.counters.gpuFramebufferPresentationCount > frames0, `${config.id}: pointer look did not present`);
              result.states.push({ id: 'after-look', observation: look, capture: await capture(page, `candidate-gen957-${config.id}-after-look`) });

              if (config.hasTouch) {
                const sequence1 = look.intake.currentNavigationState.sequence;
                const frames1 = look.liveGpu.counters.gpuFramebufferPresentationCount;
                await touchTravel(page);
                const travel = await observe(page);
                assert.ok(travel.intake.currentNavigationState.sequence > sequence1, `${config.id}: touch travel did not navigate`);
                assert.ok(travel.liveGpu.counters.gpuFramebufferPresentationCount > frames1, `${config.id}: touch travel did not present`);
                assert.ok(travel.intake.counters.touchPointerEventCount > 0, `${config.id}: no touch pointer events`);
                assert.ok(travel.intake.counters.twoFingerTravelProposalCount > 0, `${config.id}: no two-finger travel proposals`);
                result.states.push({ id: 'after-travel', observation: travel, capture: await capture(page, `candidate-gen957-${config.id}-after-travel`) });
              } else {
                await page.mouse.wheel(0, -420);
                await page.waitForTimeout(400);
                const travel = await observe(page);
                assert.ok(travel.intake.currentNavigationState.sequence > look.intake.currentNavigationState.sequence, `${config.id}: wheel travel did not navigate`);
                result.states.push({ id: 'after-travel', observation: travel, capture: await capture(page, `candidate-gen957-${config.id}-after-travel`) });
              }

              const final = result.states.at(-1).observation;
              const resources = final.liveGpu.resources;
              assert.equal(resources.presentationProfile?.cartographicContourBanding, false, `${config.id}: contour banding flag`);
              assert.equal(resources.presentationProfile?.naturalContinuousLandformTone, true, `${config.id}: continuous landform flag`);
              assert.equal(resources.presentationProfile?.antialiasRequested, true, `${config.id}: antialias request flag`);
              assert.equal(resources.context?.antialias, true, `${config.id}: WebGL antialias context`);
              assert.equal(final.liveGpu.correspondence?.resourceIdentityStable, true, `${config.id}: resource identity unstable`);
              assert.equal(final.liveGpu.correspondence?.packageUploadedOnce, true, `${config.id}: package not upload-once`);
              assert.equal(final.liveGpu.counters.worldRebuildCount, 0, `${config.id}: world rebuild on navigation`);
              if (config.dsf > 1) {
                assert.ok(initial.canvas.backingWidth > initial.canvas.cssWidth, `${config.id}: high-DPI backing width not increased`);
                assert.ok(initial.publicReceipt.viewport.pixelRatio > 1 && initial.publicReceipt.viewport.pixelRatio <= 2.0001, `${config.id}: bounded high-DPI ratio invalid`);
              }
            }
            results.push(result);
            await context.close();
          }

          try {
            for (const config of configs) for (const subject of subjects) await run(subject, config);
          } finally {
            await browser.close();
          }

          const differentials = [];
          for (const config of configs) {
            const a = PNG.sync.read(await fs.readFile(path.join(out, `rejected-gen895-${config.id}-initial-page.png`)));
            const b = PNG.sync.read(await fs.readFile(path.join(out, `candidate-gen957-${config.id}-initial-page.png`)));
            assert.equal(a.width, b.width); assert.equal(a.height, b.height);
            let changed = 0, sum = 0, maximum = 0;
            const pixels = a.width * a.height;
            for (let i = 0; i < a.data.length; i += 4) {
              const d = Math.abs(a.data[i]-b.data[i]) + Math.abs(a.data[i+1]-b.data[i+1]) + Math.abs(a.data[i+2]-b.data[i+2]);
              if (d >= 12) changed += 1; sum += d; maximum = Math.max(maximum, d);
            }
            differentials.push({ config: config.id, changedPixelFractionThreshold12: changed/pixels, meanAbsoluteRgbDelta: sum/pixels, maximumPixelRgbDelta: maximum });
          }

          const candidates = results.filter(r => r.subject === 'candidate-gen957');
          assert.ok(candidates.every(r => r.states.length >= 2));
          const receipt = {
            receiptType: 'L2_HC05_GEN957_BROWSER_NAVIGATION_EVIDENCE_RECEIPT_v1',
            rejectedComparisonSha: process.env.HC05_REJECTED_SHA,
            candidateSha: process.env.HC05_CANDIDATE_SHA,
            expectedPackageIdentity: expectedPackage,
            configs, results, differentials,
            candidateRuntimeHealthy: candidates.every(r => r.pageErrors.length === 0 && r.consoleErrors.length === 0),
            multipleNavigationStatesVerified: true,
            realTouchTravelVerified: candidates.filter(r => r.config.hasTouch).every(r => r.states.at(-1).observation.intake.counters.twoFingerTravelProposalCount > 0),
            highDpiBackingVerified: candidates.filter(r => r.config.dsf > 1).every(r => r.initial.publicReceipt.viewport.pixelRatio > 1),
            cartographicContourBandingDisabled: candidates.every(r => r.states.at(-1).observation.liveGpu.resources.presentationProfile.cartographicContourBanding === false),
            naturalContinuousLandformToneActive: candidates.every(r => r.states.at(-1).observation.liveGpu.resources.presentationProfile.naturalContinuousLandformTone === true),
            antialiasActive: candidates.every(r => r.states.at(-1).observation.liveGpu.resources.context.antialias === true),
            productMutationPerformed: false, mergePerformed: false, deploymentPerformed: false, visualAcceptancePerformed: false,
            status: 'PASS'
          };
          await fs.writeFile(path.join(out, 'receipt.json'), JSON.stringify(receipt, null, 2) + '\n');
          console.log(JSON.stringify({ status: receipt.status, candidateRuntimeHealthy: receipt.candidateRuntimeHealthy, multipleNavigationStatesVerified: receipt.multipleNavigationStatesVerified, realTouchTravelVerified: receipt.realTouchTravelVerified, highDpiBackingVerified: receipt.highDpiBackingVerified, cartographicContourBandingDisabled: receipt.cartographicContourBandingDisabled, antialiasActive: receipt.antialiasActive, differentials }, null, 2));
          NODE
          cd /tmp/l2-hc05-gen957-playwright
          NODE_PATH=/tmp/l2-hc05-gen957-playwright/node_modules node run.mjs | tee "$EVIDENCE_DIR/browser-execution.log"

      - name: Verify carrier remained non-mutating
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git -C hc05-rejected status --porcelain)"
          test -z "$(git -C hc05-candidate status --porcelain)"

      - name: Upload browser navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l2-hc05-gen957-browser-navigation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
