name: Laws secondary labels clean executor

on:
  push:
    branches:
      - agent/laws-compass-secondary-labels-clean-001

permissions:
  contents: write

jobs:
  construct-verify-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/laws-compass-secondary-labels-clean-001
          fetch-depth: 0

      - name: Construct bounded two-file candidate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          marker = "LAWS_ACTIVE_CLUSTER_SECONDARY_LABELS_20260727A"
          interactions_path = Path("laws/index.interactions.js")
          source = interactions_path.read_text()

          replacements = []

          replacements.append((
              'build:"LAWS_MAIN_COMPASS_GESTURE_AND_SETTLEMENT_TRANSPLANT_v8"',
              'build:"LAWS_ACTIVE_CLUSTER_SECONDARY_LABELS_20260727A"'
          ))

          replacements.append((
              'labels:new Map(),pointer:null',
              'labels:new Map(),lawLabels:new Map(),pointer:null'
          ))

          old_install = '''  function installLabels(){if(!document.getElementById("laws-direct-interactions-label-style")){const style=document.createElement("style");style.id="laws-direct-interactions-label-style";style.textContent=`[data-laws-projected-category-labels]{position:absolute;inset:0;z-index:22;pointer-events:none}[data-laws-projected-category-label]{position:absolute;min-width:4.4rem;padding:.34rem .52rem;border:0;background:transparent;color:rgba(246,238,223,.94);font:850 clamp(.62rem,1.35vw,.78rem)/1.05 Inter,system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;text-shadow:0 .1rem .18rem #000,0 0 .55rem #000;white-space:nowrap;cursor:pointer;pointer-events:auto;touch-action:manipulation;transform:translate(-50%,-50%)}[data-laws-projected-category-label][data-depth-layer="rear"]{opacity:.44;filter:saturate(.68) brightness(.68)}[data-laws-projected-category-label][data-primary="true"]{opacity:1;color:#fff3be;filter:brightness(1.16) drop-shadow(0 0 .52rem rgba(245,213,130,.38))}`;document.head.append(style);}let layer=S.field.querySelector("[data-laws-projected-category-labels]");if(!layer){layer=document.createElement("div");layer.dataset.lawsProjectedCategoryLabels="true";S.field.append(layer);}for(const id of D){let el=layer.querySelector(`[data-laws-projected-category-label="${id}"]`);if(!el){el=document.createElement("button");el.type="button";el.dataset.lawsProjectedCategoryLabel=id;el.dataset.direction=id;el.textContent=LABEL[id];el.setAttribute("aria-label",`Open ${LABEL[id]}`);layer.append(el);}S.labels.set(id,el);}}'''

          new_install = '''  function installLabels(){if(!document.getElementById("laws-direct-interactions-label-style")){const style=document.createElement("style");style.id="laws-direct-interactions-label-style";style.textContent=`[data-laws-projected-category-labels],[data-laws-projected-law-labels]{position:absolute;inset:0;pointer-events:none;overflow:hidden;contain:layout paint}[data-laws-projected-category-labels]{z-index:22}[data-laws-projected-law-labels]{z-index:23}[data-laws-projected-category-label]{position:absolute;min-width:4.4rem;padding:.34rem .52rem;border:0;background:transparent;color:rgba(246,238,223,.94);font:850 clamp(.62rem,1.35vw,.78rem)/1.05 Inter,system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;text-shadow:0 .1rem .18rem #000,0 0 .55rem #000;white-space:nowrap;cursor:pointer;pointer-events:auto;touch-action:manipulation;transform:translate(-50%,-50%)}[data-laws-projected-law-label]{position:absolute;max-width:min(10rem,44vw);padding:.24rem .42rem;border:0;border-radius:999px;background:rgba(3,6,13,.46);color:rgba(246,238,223,.94);font:850 clamp(.56rem,1.18vw,.72rem)/1.05 Inter,system-ui,sans-serif;letter-spacing:.075em;text-transform:uppercase;text-align:center;text-shadow:0 .1rem .18rem #000,0 0 .55rem #000;white-space:nowrap;pointer-events:none;touch-action:none;transform:translate(-50%,-50%);box-shadow:0 0 .72rem rgba(0,0,0,.42);backdrop-filter:blur(2px)}[data-laws-projected-category-label][data-depth-layer="rear"]{opacity:.44;filter:saturate(.68) brightness(.68)}[data-laws-projected-law-label][data-depth-layer="rear"]{opacity:.54;filter:saturate(.74) brightness(.74)}[data-laws-projected-category-label][data-primary="true"],[data-laws-projected-law-label][data-primary="true"]{opacity:1;color:#fff3be;filter:brightness(1.16) drop-shadow(0 0 .52rem rgba(245,213,130,.38))}`;document.head.append(style);}let layer=S.field.querySelector("[data-laws-projected-category-labels]");if(!layer){layer=document.createElement("div");layer.dataset.lawsProjectedCategoryLabels="true";S.field.append(layer);}for(const id of D){let el=layer.querySelector(`[data-laws-projected-category-label="${id}"]`);if(!el){el=document.createElement("button");el.type="button";el.dataset.lawsProjectedCategoryLabel=id;el.dataset.direction=id;el.textContent=LABEL[id];el.setAttribute("aria-label",`Open ${LABEL[id]}`);layer.append(el);}S.labels.set(id,el);}let lawLayer=S.field.querySelector("[data-laws-projected-law-labels]");if(!lawLayer){lawLayer=document.createElement("div");lawLayer.dataset.lawsProjectedLawLabels="active-cluster";lawLayer.setAttribute("aria-hidden","true");S.field.append(lawLayer);}for(const control of S.root.querySelectorAll("[data-laws-law][data-law-id]")){const id=text(control.dataset.lawId);if(!id)continue;let el=lawLayer.querySelector(`[data-laws-projected-law-label="${escapeCss(id)}"]`);if(!el){el=document.createElement("span");el.dataset.lawsProjectedLawLabel=id;el.hidden=true;lawLayer.append(el);}el.textContent=text(control.dataset.lawLabel||control.dataset.label||id);S.lawLabels.set(id,el);}}'''
          replacements.append((old_install, new_install))

          old_apply = '''  function applyProjection(){if(!S.root||S.disposed)return;const m=mode(),primary=m===MODE.CONSTELLATION?primaryDirection(orbitQ()):m===MODE.CLUSTER?primaryLaw(S.frame?.cluster?.lawIds,clusterQ()):"";S.root.dataset.lawsSpatialPrimaryKind=m===MODE.CLUSTER?"law":m===MODE.CONSTELLATION?"category":"";S.root.dataset.lawsSpatialPrimaryId=primary;S.root.dataset.lawsSpatialPrimarySelection=primary?"active":"inactive";for(const el of S.root.querySelectorAll("[data-laws-spatial-primary='true']"))el.removeAttribute("data-laws-spatial-primary");if(primary){const el=S.root.querySelector(m===MODE.CLUSTER?`[data-laws-law][data-law-id="${escapeCss(primary)}"]`:`[data-laws-category][data-direction="${escapeCss(primary)}"]`);if(el)el.dataset.lawsSpatialPrimary="true";}for(const r of S.projections){const el=controlFor(r);if(!el)continue;const p=priority(r),z=radius(r);Object.assign(el.style,{position:"absolute",left:`${r.x}px`,top:`${r.y}px`,width:`${z*2}px`,height:`${z*2}px`,margin:"0",transform:"translate(-50%, -50%)",pointerEvents:p>P.OFF?"auto":"none"});el.dataset.projectionVisible=String(r.visible);el.dataset.projectionDepthLayer=r.depthLayer;el.dataset.projectionInteractionPriority=String(p);if(p>P.OFF){el.removeAttribute("aria-hidden");if(el.dataset.active==="true")el.removeAttribute("tabindex");}else{el.setAttribute("aria-hidden","true");el.setAttribute("tabindex","-1");}}const rect=S.field.getBoundingClientRect(),cx=rect.width/2,cy=rect.height/2,byId=new Map(S.projections.filter(categoryRecord).map(r=>[r.id,r]));for(const id of D){const el=S.labels.get(id),r=byId.get(id);if(!el)continue;if(m!==MODE.CONSTELLATION||!r?.visible){el.hidden=true;continue;}const dx=r.x-cx,dy=r.y-cy,n=Math.hypot(dx,dy)||1,out=Math.min(66,Math.max(36,(finite(r.radiusPx,28)*.66)+10));el.hidden=false;el.style.left=`${r.x+dx/n*out}px`;el.style.top=`${r.y+dy/n*out}px`;el.style.zIndex=r.depthLayer==="rear"?"2":"9";el.dataset.depthLayer=r.depthLayer;el.dataset.primary=String(id===primary);}}'''

          new_apply = '''  function applyProjection(){if(!S.root||S.disposed)return;const m=mode(),primary=m===MODE.CONSTELLATION?primaryDirection(orbitQ()):m===MODE.CLUSTER?primaryLaw(S.frame?.cluster?.lawIds,clusterQ()):"";S.root.dataset.lawsSpatialPrimaryKind=m===MODE.CLUSTER?"law":m===MODE.CONSTELLATION?"category":"";S.root.dataset.lawsSpatialPrimaryId=primary;S.root.dataset.lawsSpatialPrimarySelection=primary?"active":"inactive";for(const el of S.root.querySelectorAll("[data-laws-spatial-primary='true']"))el.removeAttribute("data-laws-spatial-primary");if(primary){const el=S.root.querySelector(m===MODE.CLUSTER?`[data-laws-law][data-law-id="${escapeCss(primary)}"]`:`[data-laws-category][data-direction="${escapeCss(primary)}"]`);if(el)el.dataset.lawsSpatialPrimary="true";}for(const r of S.projections){const el=controlFor(r);if(!el)continue;const p=priority(r),z=radius(r);Object.assign(el.style,{position:"absolute",left:`${r.x}px`,top:`${r.y}px`,width:`${z*2}px`,height:`${z*2}px`,margin:"0",transform:"translate(-50%, -50%)",pointerEvents:p>P.OFF?"auto":"none"});el.dataset.projectionVisible=String(r.visible);el.dataset.projectionDepthLayer=r.depthLayer;el.dataset.projectionInteractionPriority=String(p);if(p>P.OFF){el.removeAttribute("aria-hidden");if(el.dataset.active==="true")el.removeAttribute("tabindex");}else{el.setAttribute("aria-hidden","true");el.setAttribute("tabindex","-1");}}const rect=S.field.getBoundingClientRect(),cx=rect.width/2,cy=rect.height/2,categoryById=new Map(S.projections.filter(categoryRecord).map(r=>[r.id,r]));for(const id of D){const el=S.labels.get(id),r=categoryById.get(id);if(!el)continue;if(m!==MODE.CONSTELLATION||!r?.visible){el.hidden=true;continue;}const dx=r.x-cx,dy=r.y-cy,n=Math.hypot(dx,dy)||1,out=Math.min(66,Math.max(36,(finite(r.radiusPx,28)*.66)+10));el.hidden=false;el.style.left=`${r.x+dx/n*out}px`;el.style.top=`${r.y+dy/n*out}px`;el.style.zIndex=r.depthLayer==="rear"?"2":"9";el.dataset.depthLayer=r.depthLayer;el.dataset.primary=String(id===primary);}const active=activeDirection(),lawById=new Map(S.projections.filter(lawRecord).map(r=>[r.id,r]));for(const [id,el] of S.lawLabels){const control=S.controls.get(controlKey(KIND.LAW,id)),r=lawById.get(id);if(m!==MODE.CLUSTER||!control||!r?.visible||direction(control.dataset.direction)!==active){el.hidden=true;continue;}const dx=r.x-cx,dy=r.y-cy,n=Math.hypot(dx,dy)||1,inward=Math.min(36,Math.max(20,finite(r.radiusPx,24)*.30+8)),candidateLeft=r.x-dx/n*inward,candidateTop=r.y-dy/n*inward;el.hidden=false;el.style.visibility="hidden";el.style.left="0px";el.style.top="0px";const measured=el.getBoundingClientRect(),width=Math.max(1,measured.width||el.offsetWidth||1),height=Math.max(1,measured.height||el.offsetHeight||1),inset=8,minLeft=inset+width/2,maxLeft=Math.max(minLeft,rect.width-inset-width/2),minTop=inset+height/2,maxTop=Math.max(minTop,rect.height-inset-height/2),left=Math.min(maxLeft,Math.max(minLeft,candidateLeft)),top=Math.min(maxTop,Math.max(minTop,candidateTop));el.style.left=`${left}px`;el.style.top=`${top}px`;el.style.zIndex=r.depthLayer==="rear"?"3":"10";el.style.visibility="visible";el.dataset.depthLayer=r.depthLayer;el.dataset.primary=String(id===primary);el.dataset.lawsProjectedPlacement="inward-edge-constrained";el.dataset.lawsProjectedClamped=String(Math.abs(left-candidateLeft)>.5||Math.abs(top-candidateTop)>.5);}}'''
          replacements.append((old_apply, new_apply))

          replacements.append((
              'projectedCategoryLabelsInstalled:S.labels.size===4,releaseSettlement:true',
              'projectedCategoryLabelsInstalled:S.labels.size===4,projectedLawLabelsInstalled:S.lawLabels.size===16,activeClusterSecondaryLabels:true,releaseSettlement:true'
          ))

          replacements.append((
              'S.root.dataset.lawsConstellationLabels="flow-integrity-reality-structure";',
              'S.root.dataset.lawsConstellationLabels="flow-integrity-reality-structure";S.root.dataset.lawsActiveClusterLabels="four-law-secondary-labels";S.root.dataset.lawsProjectedLawLabelCount=String(S.lawLabels.size);'
          ))

          replacements.append((
              'projectedConstellationLabels:true,releaseSettlement:true',
              'projectedConstellationLabels:true,projectedActiveClusterLabels:true,projectedLawLabelCount:S.lawLabels.size,releaseSettlement:true'
          ))

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"INTERACTIONS_REPLACEMENT_COUNT:{count}:{old[:80]}")
              source = source.replace(old, new, 1)

          if marker not in source:
              source = f"/* {marker} */\n" + source
          interactions_path.write_text(source)

          html_path = Path("laws/index.html")
          html = html_path.read_text()
          html_replacements = [
              (
                  'data-laws-bounded-round="LAWS_SHOWROOM_CANONICAL_CRYSTAL_CLONE_20260726H"',
                  'data-laws-bounded-round="LAWS_ACTIVE_CLUSTER_SECONDARY_LABELS_20260727A"'
              ),
              (
                  'data-laws-interaction-model="main-compass-gesture-continuity"',
                  'data-laws-interaction-model="main-compass-gesture-continuity"\n  data-laws-secondary-label-model="active-cluster-four-law-labels-inward-edge-constrained"\n  data-laws-secondary-label-pointer-authority="none"'
              ),
              (
                  '/laws/index.interactions.js?v=LAWS_MAIN_GESTURE_CONTINUITY_V8_20260726D',
                  '/laws/index.interactions.js?v=LAWS_ACTIVE_CLUSTER_SECONDARY_LABELS_20260727A'
              )
          ]
          for old, new in html_replacements:
              count = html.count(old)
              if count != 1:
                  raise SystemExit(f"HTML_REPLACEMENT_COUNT:{count}:{old}")
              html = html.replace(old, new, 1)
          html_path.write_text(html)
          PY

      - name: Verify syntax and bounded contract
        shell: bash
        run: |
          node --check laws/index.interactions.js
          python - <<'PY'
          from pathlib import Path
          js = Path("laws/index.interactions.js").read_text()
          html = Path("laws/index.html").read_text()
          checks = {
              "law_label_map": "lawLabels:new Map()" in js,
              "sixteen_registry": "S.lawLabels.size===16" in js,
              "cluster_only": "m!==MODE.CLUSTER" in js,
              "active_direction": "direction(control.dataset.direction)!==active" in js,
              "pointer_transparent": "[data-laws-projected-law-label]{" in js and "pointer-events:none" in js,
              "field_clamp": "lawsProjectedClamped" in js,
              "primary_prominence": "el.dataset.primary=String(id===primary)" in js,
              "category_labels_preserved": "projectedCategoryLabelsInstalled:S.labels.size===4" in js,
              "cache_identity": "/laws/index.interactions.js?v=LAWS_ACTIVE_CLUSTER_SECONDARY_LABELS_20260727A" in html,
              "html_contract": 'data-laws-secondary-label-model="active-cluster-four-law-labels-inward-edge-constrained"' in html,
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("FAILED_CHECKS:" + ",".join(failed))
          if js.count("function installLabels()") != 1 or js.count("function applyProjection()") != 1:
              raise SystemExit("DUPLICATED_LABEL_AUTHORITY")
          print("STATIC_CONTRACT_PASS")
          PY

      - name: Remove executor and confirm final path set
        shell: bash
        run: |
          git rm .github/workflows/laws-secondary-labels-clean-executor.yml
          mapfile -t paths < <(git diff --name-only origin/main | sort)
          printf '%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 2
          test "${paths[0]}" = "laws/index.html"
          test "${paths[1]}" = "laws/index.interactions.js"

      - name: Commit clean candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add laws/index.html laws/index.interactions.js
          git commit -m "Add Laws active-cluster secondary labels"
          git push origin HEAD:agent/laws-compass-secondary-labels-clean-001
