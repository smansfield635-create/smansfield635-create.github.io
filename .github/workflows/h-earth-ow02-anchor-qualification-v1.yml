name: H-Earth OW02 Anchor Qualification v1

on:
  push:
    branches:
      - control-plane-delivery/h-earth-ow02-anchor-qualification-20260815-001

permissions:
  contents: write

jobs:
  qualify:
    if: ${{ !contains(github.event.head_commit.message, '[anchor evidence]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_HEAD: ee88405c2296dc02661eaa998a7264ebf8adf5ce
      PRODUCT_FIELD_BLOB: 0dd386a101d8191dbf9bcbb63b3c16f6475713f4
      PRODUCT_FORMATIONS_BLOB: 5d851eab308b25a572eab6dc1f023bdd05a151b0
      BASE_HEAD: 8644b618ee8e9d64a7762e651a98bc86eb97d123
      ANCHOR_SHA256: 7757fb4fe731456b3058ec595369133f5c2136c99b282eb6b4df108600bca573
      ROUTE: /showroom/globe/h-earth/
      EVIDENCE_STEM: h-earth-3d/experience-anchor/evidence/OW02_INLAND_MOUNTAIN_WATERSHED_20260815_001
      RECEIPT_PATH: h-earth-3d/experience-anchor/receipts/OW02_INLAND_MOUNTAIN_WATERSHED_20260815_001.json
    steps:
      - name: Checkout exact qualification candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify product bytes remain frozen
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object h-earth-3d/terrain/h-earth.terrain-field.js)" = "$PRODUCT_FIELD_BLOB"
          test "$(git hash-object h-earth-3d/terrain/h-earth.terrain-formations.js)" = "$PRODUCT_FORMATIONS_BLOB"
          while IFS= read -r changed; do
            case "$changed" in
              .github/workflows/h-earth-ow02-anchor-qualification-v1.yml) ;;
              h-earth-3d/experience-anchor/evidence/OW02_INLAND_MOUNTAIN_WATERSHED_20260815_001.*) ;;
              h-earth-3d/experience-anchor/receipts/OW02_INLAND_MOUNTAIN_WATERSHED_20260815_001.json) ;;
              *) echo "UNAUTHORIZED_POST_PRODUCT_PATH:$changed" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$PRODUCT_HEAD"...HEAD | sort)
          git cat-file -e "$BASE_HEAD^{commit}"
          git cat-file -e "$PRODUCT_HEAD^{commit}"
      - name: Materialize exact baseline worktree
        run: git worktree add --detach /tmp/h-earth-ow02-base "$BASE_HEAD"
      - name: Install bounded browser harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/h-earth-ow02-browser
          npm --prefix /tmp/h-earth-ow02-browser init -y >/dev/null
          npm --prefix /tmp/h-earth-ow02-browser install playwright@1.55.0 >/dev/null
          /tmp/h-earth-ow02-browser/node_modules/.bin/playwright install --with-deps chromium >/dev/null
      - name: Serve base and candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" >/tmp/ow02-candidate-server.log 2>&1 &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/h-earth-ow02-base >/tmp/ow02-base-server.log 2>&1 &
          for port in 4173 4174; do
            for attempt in $(seq 1 60); do curl -fsS "http://127.0.0.1:$port$ROUTE" >/dev/null && break; sleep 1; done
            curl -fsS "http://127.0.0.1:$port$ROUTE" >/dev/null
          done
      - name: Capture exact base candidate and anchor
        id: capture
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/h-earth-ow02-browser/qualify.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs'; import crypto from 'node:crypto'; import path from 'node:path';
          const workspace=process.env.GITHUB_WORKSPACE; const stem=path.join(workspace,process.env.EVIDENCE_STEM);
          fs.mkdirSync(path.dirname(stem),{recursive:true});
          const digest=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          async function capture(label,port){
            const context=await browser.newContext({viewport:{width:1440,height:900},hasTouch:true,isMobile:false});
            const page=await context.newPage(); const pageErrors=[],consoleErrors=[],requestFailures=[];
            page.on('pageerror',e=>pageErrors.push(String(e))); page.on('console',m=>{if(m.type()==='error'&&!/favicon/i.test(m.text()))consoleErrors.push(m.text())}); page.on('requestfailed',r=>requestFailures.push(`${r.url()} :: ${r.failure()?.errorText??'unknown'}`));
            let response=null,interactionExercised=false,beforeGesture=null,afterGesture=null,captureError=null,terrainDiagnostic=null,vegetationDiagnostic=null;
            try{
              response=await page.goto(`http://127.0.0.1:${port}${process.env.ROUTE}`,{waitUntil:'commit',timeout:60000});
              await page.waitForLoadState('domcontentloaded',{timeout:30000}).catch(()=>{}); await page.waitForTimeout(5000);
              terrainDiagnostic=await page.evaluate(async()=>{try{const f=await import('/h-earth-3d/terrain/h-earth.terrain-field.js');const pts=[[148,-224],[86,-235],[18,-226],[-52,-208],[119,-226],[52,-230],[18,-192],[-12,-176]];return {ok:true,systemId:f.H_EARTH_INLAND_MOUNTAIN_WATERSHED_SYSTEM?.systemId??null,samples:pts.map(([x,z])=>({x,z,sample:f.sampleHEarthTerrainField(x,z)}))};}catch(error){return {ok:false,error:String(error?.stack||error)}}});
              vegetationDiagnostic=await page.evaluate(async()=>{try{const mod=await import('/h-earth-3d/environment/h-earth.vegetation-resolution.run8d.js');const r=mod.buildHEarthRun8DVegetationResolution();return {ok:true,eligible:r?.eligible??null,status:r?.status??null,instanceCount:r?.instanceCount??null,issues:r?.issues??null};}catch(error){return {ok:false,error:String(error?.stack||error)}}});
              const canvases=page.locator('canvas'); const count=await canvases.count(); beforeGesture=await page.evaluate(()=>document.querySelector('[data-gesture-used]')?.getAttribute('data-gesture-used')??null);
              let best=null; for(let i=0;i<count;i++){const box=await canvases.nth(i).boundingBox();if(box&&(!best||box.width*box.height>best.box.width*best.box.height))best={index:i,box};}
              if(best){const x=best.box.x+best.box.width*.52,y=best.box.y+best.box.height*.52;await page.mouse.move(x,y);await page.mouse.down();await page.mouse.move(x+80,y-20,{steps:6});await page.mouse.up();await page.mouse.wheel(0,-240);await page.waitForTimeout(700);interactionExercised=true;}
              afterGesture=await page.evaluate(()=>document.querySelector('[data-gesture-used]')?.getAttribute('data-gesture-used')??null);
            }catch(e){captureError=String(e?.stack||e);}
            const screenshot=`${stem}.${label}.png`; try{await page.screenshot({path:screenshot,fullPage:false,timeout:30000});}catch(e){captureError=(captureError?captureError+' | ':'')+String(e?.stack||e);}
            const out={label,status:response?.status()??null,title:await page.title().catch(()=>''),url:page.url(),canvasCount:await page.locator('canvas').count().catch(()=>0),interactionExercised,beforeGesture,afterGesture,pageErrors,consoleErrors,requestFailures,captureError,terrainDiagnostic,vegetationDiagnostic,screenshotSha256:fs.existsSync(screenshot)?digest(screenshot):null,screenshotBytes:fs.existsSync(screenshot)?fs.statSync(screenshot).size:0}; await context.close(); return out;
          }
          const base=await capture('base',4174); const candidate=await capture('candidate',4173);
          const context=await browser.newContext({viewport:{width:1440,height:900}}); const page=await context.newPage(); let anchorStatus=null,anchorError=null;
          try{const r=await page.goto('http://127.0.0.1:4173/h-earth-3d/experience-anchor/H_EARTH_EXPERIENCE_ANCHOR_v1.contact-sheet.svg',{waitUntil:'load',timeout:60000});anchorStatus=r?.status()??null;}catch(e){anchorError=String(e?.stack||e);}
          const anchorPath=`${stem}.anchor.png`; try{await page.screenshot({path:anchorPath,fullPage:false,timeout:30000});}catch(e){anchorError=(anchorError?anchorError+' | ':'')+String(e?.stack||e);}
          const anchor={status:anchorStatus,captureError:anchorError,screenshotSha256:fs.existsSync(anchorPath)?digest(anchorPath):null,screenshotBytes:fs.existsSync(anchorPath)?fs.statSync(anchorPath).size:0}; await context.close(); await browser.close();
          const evidence={schema:'H_EARTH_OW02_ANCHOR_BROWSER_EVIDENCE_v1',evidenceId:'OW02_INLAND_MOUNTAIN_WATERSHED_20260815_001',productHead:process.env.PRODUCT_HEAD,qualificationHead:process.env.GITHUB_SHA,baseHead:process.env.BASE_HEAD,anchorId:'H_EARTH_GROUND_EXPERIENCE_VIDEO_20260814_001',anchorSha256:process.env.ANCHOR_SHA256,route:process.env.ROUTE,terrainFieldSha256:digest(path.join(workspace,'h-earth-3d/terrain/h-earth.terrain-field.js')),terrainFormationsSha256:digest(path.join(workspace,'h-earth-3d/terrain/h-earth.terrain-formations.js')),base,candidate,anchor,automatedFindings:{baseRouteLoaded:base.status===200,candidateRouteLoaded:candidate.status===200,baseCanvasPresent:base.canvasCount>0,candidateCanvasPresent:candidate.canvasCount>0,baseNoPageErrors:base.pageErrors.length===0,candidateNoPageErrors:candidate.pageErrors.length===0,candidateNoConsoleErrors:candidate.consoleErrors.length===0,candidateNoRequestFailures:candidate.requestFailures.length===0,candidateInteractionExercised:candidate.interactionExercised,candidateGestureStateAdvanced:candidate.beforeGesture!==candidate.afterGesture,sameCanonicalRoute:base.title===candidate.title,visualStateChanged:base.screenshotSha256&&candidate.screenshotSha256&&base.screenshotSha256!==candidate.screenshotSha256,anchorContactSheetCaptured:anchor.status===200&&!!anchor.screenshotSha256,candidateTerrainSystemLoaded:candidate.terrainDiagnostic?.ok===true&&candidate.terrainDiagnostic?.systemId==='H_EARTH_GRATITUDE_INLAND_MOUNTAIN_WATERSHED_CONTINUATION_v1'},disposition:'PENDING_INDEPENDENT_VISUAL_REVIEW'};
          fs.writeFileSync(`${stem}.json`,JSON.stringify(evidence,null,2)+'\n'); if(!fs.existsSync(`${stem}.base.png`)||!fs.existsSync(`${stem}.candidate.png`)||!fs.existsSync(`${stem}.anchor.png`))process.exitCode=1;
          NODE
          cd /tmp/h-earth-ow02-browser && node qualify.mjs
      - name: Write fail-closed provisional anchor receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$EVIDENCE_STEM.json"
          FIELD_SHA="$(sha256sum h-earth-3d/terrain/h-earth.terrain-field.js | awk '{print $1}')"
          FORM_SHA="$(sha256sum h-earth-3d/terrain/h-earth.terrain-formations.js | awk '{print $1}')"
          mkdir -p "$(dirname "$RECEIPT_PATH")"
          jq -n --arg field_sha "$FIELD_SHA" --arg form_sha "$FORM_SHA" --arg evidence "$EVIDENCE_STEM.json" --arg base "$EVIDENCE_STEM.base.png" --arg visual "$EVIDENCE_STEM.candidate.png" --arg anchor "$EVIDENCE_STEM.anchor.png" '{schema:"H_EARTH_EXPERIENCE_ANCHOR_ACCEPTANCE_RECEIPT_v1",anchorId:"H_EARTH_GROUND_EXPERIENCE_VIDEO_20260814_001",anchorSha256:"7757fb4fe731456b3058ec595369133f5c2136c99b282eb6b4df108600bca573",reviewedAgainstAnchor:false,disposition:"BLOCK_PENDING_ANCHOR_REVIEW",visualEvidence:[$base,$visual,$anchor,$evidence],interactionEvidence:[$evidence],continuityEvidence:[$evidence],experienceFiles:[{path:"h-earth-3d/terrain/h-earth.terrain-field.js",sha256:$field_sha},{path:"h-earth-3d/terrain/h-earth.terrain-formations.js",sha256:$form_sha}],invariants:{SAME_CANONICAL_WORLD_IDENTITY:false,PLANETARY_TO_REGIONAL_TO_GROUND_CONTINUITY:false,CONTINUOUS_TERRAIN_AND_GEOGRAPHIC_SPACE:false,EMBODIED_LOCAL_GROUND_EXPERIENCE:false,DIRECT_LOOK_AND_TRAVEL_INTERACTION:false,MINIMAL_INTERFACE_INTRUSION_OVER_WORLD:false,TERRAIN_COAST_ELEVATION_AND_HORIZON_READ_AS_ONE_NAVIGABLE_SURFACE:false,NO_PARALLEL_OR_DUPLICATE_H_EARTH_PRODUCT:false,NO_DASHBOARD_MAP_APP_OR_CARD_UI_SUBSTITUTION_FOR_WORLD_EXPERIENCE:false,GLOBE_IS_HIGHER_ALTITUDE_EXPRESSION_OF_THE_SAME_WORLD:false,REGION_ENTRY_MUST_NOT_CREATE_A_VISUALLY_OR_INTERACTIONALLY_UNRELATED_PRODUCT:false}}' > "$RECEIPT_PATH"
      - name: Upload independent-review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ow02-inland-mountain-watershed-anchor-qualification
          path: |
            h-earth-3d/experience-anchor/evidence/OW02_INLAND_MOUNTAIN_WATERSHED_20260815_001.*
            h-earth-3d/experience-anchor/receipts/OW02_INLAND_MOUNTAIN_WATERSHED_20260815_001.json
            /tmp/ow02-candidate-server.log
            /tmp/ow02-base-server.log
          retention-days: 90
      - name: Commit qualification evidence only
        if: always() && steps.capture.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add h-earth-3d/experience-anchor/evidence/OW02_INLAND_MOUNTAIN_WATERSHED_20260815_001.* h-earth-3d/experience-anchor/receipts/OW02_INLAND_MOUNTAIN_WATERSHED_20260815_001.json
          git commit -m 'Record OW02 anchor qualification evidence [anchor evidence]'
          git push origin HEAD:control-plane-delivery/h-earth-ow02-anchor-qualification-20260815-001
      - name: Enforce capture completeness
        if: always()
        run: test '${{ steps.capture.outcome }}' = 'success'
