name: H-Earth C2-R1 Immutable Preview Builder V3

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h-earth-c2-r1-immutable-preview-builder-v3.yml'

permissions:
  contents: write

concurrency:
  group: h-earth-c2-r1-immutable-preview-builder-v3
  cancel-in-progress: true

jobs:
  materialize-verify-publish:
    if: github.head_ref == 'publication/h-earth-c2-r1-immutable-preview-a699c5a-001'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_HEAD: a699c5a64e2bf54d950a69c839c3d9ee41b6514f
      PUBLICATION_BRANCH: publication/h-earth-c2-r1-immutable-preview-a699c5a-001
      PREVIEW_ROOT: preview/h-earth/c2-r1/a699c5a64e2bf54d950a69c839c3d9ee41b6514f
      PREVIEW_URL_PATH: /preview/h-earth/c2-r1/a699c5a64e2bf54d950a69c839c3d9ee41b6514f/index.html
      PLAYWRIGHT_VERSION: 1.55.0
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: publication/h-earth-c2-r1-immutable-preview-a699c5a-001
          fetch-depth: 0
          path: publication

      - name: Check out exact verified source
        uses: actions/checkout@v4
        with:
          ref: a699c5a64e2bf54d950a69c839c3d9ee41b6514f
          fetch-depth: 1
          path: source

      - name: Materialize and verify exact dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/publication/.github/scripts/h-earth-c2-r1-immutable-preview-materializer-v4.py"

      - name: Install Chromium verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw" "$RUNNER_TEMP/proof"
          cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
          cp "$GITHUB_WORKSPACE/publication/.github/scripts/h-earth-c2-r1-immutable-preview-browser-v5.mjs" "$RUNNER_TEMP/pw/verify.mjs"

      - name: Execute desktop and touch-mobile local proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4188 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/publication" >"$RUNNER_TEMP/proof/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/proof/server.pid"
          local_ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:4188$PREVIEW_URL_PATH" >/dev/null; then
              local_ready=true
              break
            fi
            sleep 1
          done
          test "$local_ready" = true
          cd "$RUNNER_TEMP/pw"
          node verify.mjs
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          receipt_path=Path(os.environ['GITHUB_WORKSPACE'])/'publication'/os.environ['PREVIEW_ROOT']/'publication-receipt.json'
          receipt=json.loads(receipt_path.read_text())
          receipt.update({
              'status':'ROLE_1_PREMERGE_PROOF_PASS',
              'localPreviewResult':'PASS',
              'webgl2Result':'PASS_SINGLE_INITIALIZATION',
              'cameraNavigationAndTouchResult':'PASS',
              'consolePageRequestHttpResult':'PASS_ZERO_FAILURES'
          })
          receipt_path.write_text(json.dumps(receipt,indent=2)+'\n')
          PY

      - name: Commit immutable preview root only
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/publication"
          git config user.name h-earth-role1-preview-publisher
          git config user.email actions@users.noreply.github.com
          git add "$PREVIEW_ROOT"
          test -n "$(git status --porcelain -- "$PREVIEW_ROOT")"
          git commit -m 'H-Earth C2-R1: materialize immutable hash-bound preview'
          git push origin "HEAD:$PUBLICATION_BRANCH"

      - name: Upload premerge proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-c2-r1-immutable-preview-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/proof
            publication/${{ env.PREVIEW_ROOT }}/byte-manifest.json
            publication/${{ env.PREVIEW_ROOT }}/byte-manifest.sha256
            publication/${{ env.PREVIEW_ROOT }}/publication-receipt.json
          if-no-files-found: warn
          retention-days: 30
