name: H-Earth Gen2514 Placement Equivalence Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact qualified and current dependency trees
        run: |
          set -euo pipefail
          Q=preview/h-earth/corridor/38df744ba7402aabe7fd2eaee71b961a451350de/B
          C=/tmp/current-tree
          mkdir -p /tmp/qualified-tree /tmp/current-tree
          git archive 28bc466fe029b449ce4edd27843c0457bfa3349d "$Q/h-earth-3d" | tar -x -C /tmp/qualified-tree
          git archive 5bc913cad513b044c5b0de37d921102314460a3f h-earth-3d | tar -x -C /tmp/current-tree
          test "$(git rev-parse 28bc466fe029b449ce4edd27843c0457bfa3349d:$Q/h-earth-3d/environment/h-earth.successor-vegetation.run8d.js)" = "775f6b5a49266eebb0d06a0407e89c26e08134c9"
          test "$(git rev-parse 28bc466fe029b449ce4edd27843c0457bfa3349d:$Q/h-earth-3d/terrain/h-earth.successor-terrain-field.run8b.js)" = "4f929cd467edb447e2116de745d9b02c28daf219"
          test "$(git rev-parse 28bc466fe029b449ce4edd27843c0457bfa3349d:$Q/h-earth-3d/environment/h-earth.successor-surface-material.run8c.js)" = "9ea6056353453254a2c00e3ed9abf44b2fe7b275"
          test "$(git rev-parse 5bc913cad513b044c5b0de37d921102314460a3f:h-earth-3d/environment/h-earth.successor-vegetation.run8d.js)" = "51efeb2461dc025a76bc3df721e00ac89d79eb13"
      - name: Execute exact qualified versus current placement constructors
        run: |
          cat > /tmp/placement-equivalence.mjs <<'NODE'
          import { createHash } from 'node:crypto';
          import { writeFile } from 'node:fs/promises';
          const qualifiedPath='/tmp/qualified-tree/preview/h-earth/corridor/38df744ba7402aabe7fd2eaee71b961a451350de/B/h-earth-3d/environment/h-earth.successor-vegetation.run8d.js';
          const currentPath='/tmp/current-tree/h-earth-3d/environment/h-earth.successor-vegetation.run8d.js';
          const canonical=placements=>[...placements].map(p=>({id:p.placementId,x:p.world.x,y:p.world.y,z:p.world.z})).sort((a,b)=>a.id.localeCompare(b.id));
          const digest=rows=>createHash('sha256').update(JSON.stringify(rows)).digest('hex');
          async function execute(label,path){
            const mod=await import('file://'+path+'?probe='+label);
            if(typeof mod.buildHEarthGen311PlacementData!=='function') throw new Error(label.toUpperCase()+'_PLACEMENT_CONSTRUCTOR_EXPORT_MISSING');
            const result=mod.buildHEarthGen311PlacementData();
            const rows=canonical(result.placements??[]);
            return {label,eligible:result.eligible===true,placementCount:result.placementCount??rows.length,digest:digest(rows),rows};
          }
          const qualified=await execute('qualified',qualifiedPath);
          const current=await execute('current',currentPath);
          const q=new Map(qualified.rows.map(r=>[r.id,r])),c=new Map(current.rows.map(r=>[r.id,r]));
          const qualifiedOnlyIds=[...q.keys()].filter(id=>!c.has(id)).sort();
          const currentOnlyIds=[...c.keys()].filter(id=>!q.has(id)).sort();
          const sharedCoordinateMismatches=[...q.keys()].filter(id=>c.has(id)).filter(id=>{const a=q.get(id),b=c.get(id);return a.x!==b.x||a.y!==b.y||a.z!==b.z;}).sort().map(id=>({id,qualified:q.get(id),current:c.get(id)}));
          const receipt={schema:'H_EARTH_GEN2514_PLACEMENT_EQUIVALENCE_PROBE_v2',qualified:{eligible:qualified.eligible,placementCount:qualified.placementCount,digest:qualified.digest},current:{eligible:current.eligible,placementCount:current.placementCount,digest:current.digest},comparison:{countDelta:current.placementCount-qualified.placementCount,digestEquality:qualified.digest===current.digest,qualifiedOnlyIds,currentOnlyIds,sharedCoordinateMismatchCount:sharedCoordinateMismatches.length,sharedCoordinateMismatches}};
          await writeFile('/tmp/h-earth-gen2514-placement-equivalence.json',JSON.stringify(receipt,null,2));
          console.log(JSON.stringify(receipt,null,2));
          NODE
          node /tmp/placement-equivalence.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: h-earth-gen2514-placement-equivalence
          path: /tmp/h-earth-gen2514-placement-equivalence.json
          retention-days: 30
