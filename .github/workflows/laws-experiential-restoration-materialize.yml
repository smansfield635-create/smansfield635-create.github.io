name: Laws Experiential Restoration Verifier Telemetry

on:
  push:
    branches:
      - agent/laws-experiential-architecture-restoration-001
    paths:
      - '.github/workflows/laws-experiential-restoration-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: laws-experiential-restoration-verifier-telemetry
  cancel-in-progress: false

env:
  RESTORATION_BRANCH: agent/laws-experiential-architecture-restoration-001
  EXPECTED_MAIN_BASE: ef2ffdb1da7911238652f076a6b44326061493ef

jobs:
  instrument-verifier:
    if: github.ref_name == 'agent/laws-experiential-architecture-restoration-001'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out bounded restoration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RESTORATION_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lock current main and branch ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$RESTORATION_BRANCH"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_BASE"
          test "$(git merge-base origin/main HEAD)" = "$EXPECTED_MAIN_BASE"

      - name: Add route-by-route interaction telemetry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/laws-experiential-restoration-root-matrix.mjs")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'async function activateAuthority(page, direction, input) {\n  await returnToConstellation(page);',
                  'async function activateAuthority(page, direction, input) {\n  console.log(JSON.stringify({ stage: "authority-start", direction, input }));\n  await returnToConstellation(page);',
              ),
              (
                  '      assert.ok(hit, `No unblocked physical hit surface for ${direction} (${input}).`);\n      if (input === "touch") {',
                  '      assert.ok(hit, `No unblocked physical hit surface for ${direction} (${input}).`);\n      console.log(JSON.stringify({ stage: "authority-hit", direction, input, hit }));\n      if (input === "touch") {',
              ),
              (
                  '''  await page.waitForFunction(nextDirection => {
    const root = document.querySelector("[data-laws-root]");
    return root?.dataset.lawsControllerState === "CLUSTER_OPEN" &&
      document.documentElement.dataset.lawsExperienceDirection === nextDirection;
  }, direction, { timeout: 15000 });''',
                  '''  try {
    await page.waitForFunction(nextDirection => {
      const root = document.querySelector("[data-laws-root]");
      return root?.dataset.lawsControllerState === "CLUSTER_OPEN" &&
        document.documentElement.dataset.lawsExperienceDirection === nextDirection;
    }, direction, { timeout: 15000 });
  } catch (error) {
    const debug = await page.evaluate(nextDirection => {
      const root = document.querySelector("[data-laws-root]");
      const projected = document.querySelector(
        `[data-laws-projected-category-label="${nextDirection}"]`
      );
      const semantic = document.querySelector(
        `[data-laws-category][data-direction="${nextDirection}"]`
      );
      return {
        requestedDirection: nextDirection,
        controllerState: root?.dataset.lawsControllerState || "",
        activeDirection: root?.dataset.lawsActiveDirection || "",
        activeCategory: root?.dataset.lawsActiveCategory || "",
        experienceDirection: document.documentElement.dataset.lawsExperienceDirection || "",
        spatialPrimaryId: root?.dataset.lawsSpatialPrimaryId || "",
        visibleLabelId: root?.dataset.lawsVisibleOuterAuthorityLabelId || "",
        projectedHidden: projected?.hidden ?? null,
        projectedAriaHidden: projected?.getAttribute("aria-hidden") || "",
        projectedPointerEvents: projected ? getComputedStyle(projected).pointerEvents : "",
        semanticPointerEvents: semantic ? getComputedStyle(semantic).pointerEvents : "",
        interactionReceipt: globalThis.DGB_LAWS_INTERACTIONS?.getReceipt?.() || null,
        controllerFrame: globalThis.DGB_LAWS_CONTROLLER?.getFrame?.() || null
      };
    }, direction);
    console.error(JSON.stringify({ stage: "authority-timeout", direction, input, debug }, null, 2));
    throw error;
  }''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"TELEMETRY_ANCHOR_COUNT={count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify bounded verifier-only scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "tools/laws-experiential-restoration-root-matrix.mjs"
          node --check tools/laws-experiential-restoration-root-matrix.mjs
          git diff --check

      - name: Commit verifier telemetry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/laws-experiential-restoration-root-matrix.mjs
          git commit -m "Trace Laws physical authority selection"
          git push origin "HEAD:$RESTORATION_BRANCH"
