name: H-Earth Automatic Repository Registry Preflight

on:
  pull_request:
    paths:
      - 'h-earth-3d/**'
      - '!h-earth-3d/registry/**'
      - 'h-earth-3d/registry/validation/h-earth-audralia-final-cloud-compositor-path-recognition-verifier.v1.mjs'
      - '.github/workflows/h-earth-repository-registry-preflight.yml'
      - '.github/ai-router/page-mutation-proportionality-policy.v1.json'
      - 'tools/workflow-applicability-gate.v1.mjs'
      - '!h-earth-3d/experience-anchor/evidence/**'
      - '!h-earth-3d/experience-anchor/receipts/**'
      - '!h-earth-3d/AGENTS.md'
      - 'showroom/globe/h-earth/**'
      - '!showroom/globe/h-earth/AGENTS.md'
      - 'showroom/globe/audralia/diagnostic/index.html'
      - 'showroom/globe/audralia/diagnostic/index.controls.js'
      - 'showroom/globe/audralia/diagnostic/index.inspection.lane.js'
      - 'showroom/globe/audralia/final-cloud-shader-composition-v1.mjs'
  push:
    paths:
      - 'h-earth-3d/**'
      - '!h-earth-3d/registry/**'
      - 'h-earth-3d/registry/validation/h-earth-audralia-final-cloud-compositor-path-recognition-verifier.v1.mjs'
      - '.github/workflows/h-earth-repository-registry-preflight.yml'
      - '.github/ai-router/page-mutation-proportionality-policy.v1.json'
      - 'tools/workflow-applicability-gate.v1.mjs'
      - '!h-earth-3d/experience-anchor/evidence/**'
      - '!h-earth-3d/experience-anchor/receipts/**'
      - '!h-earth-3d/AGENTS.md'
      - 'showroom/globe/h-earth/**'
      - '!showroom/globe/h-earth/AGENTS.md'
      - 'showroom/globe/audralia/diagnostic/index.html'
      - 'showroom/globe/audralia/diagnostic/index.controls.js'
      - 'showroom/globe/audralia/diagnostic/index.inspection.lane.js'
      - 'showroom/globe/audralia/final-cloud-shader-composition-v1.mjs'
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  automatic-h-earth-preflight:
    if: ${{ github.event_name != 'issue_comment' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /h-earth-3d/registry/
            /tools/h-earth-repository-registry-auto-preflight.mjs
            /tools/workflow-applicability-gate.v1.mjs

      - name: Discover changed governed H-Earth paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/all-changed-paths.txt
          elif [[ -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" > /tmp/all-changed-paths.txt
          else
            git show --pretty='' --name-only "$CURRENT_SHA" > /tmp/all-changed-paths.txt
          fi

          grep -E '^(h-earth-3d/|showroom/globe/h-earth/|showroom/globe/audralia/diagnostic/(index\.html|index\.controls\.js|index\.inspection\.lane\.js)$|showroom/globe/audralia/final-cloud-shader-composition-v1\.mjs$)' /tmp/all-changed-paths.txt \
            | grep -Ev '^(h-earth-3d/registry/|h-earth-3d/experience-anchor/(evidence|receipts)/|h-earth-3d/AGENTS\.md$|h-earth-3d/validation/h-earth-audralia-diagnostic-path-recognition-verifier\.v1\.mjs$|showroom/globe/h-earth/AGENTS\.md$)' \
            | sort -u > /tmp/h-earth-changed-paths.txt || true

          cat /tmp/h-earth-changed-paths.txt

      - name: Decide whole-estate workflow applicability
        id: applicability
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tools/workflow-applicability-gate.v1.mjs \
            --workflow H_EARTH_REPOSITORY_REGISTRY_PREFLIGHT \
            --paths-file /tmp/all-changed-paths.txt \
            --output /tmp/workflow-applicability-receipt.json
          node <<'NODE'
          const fs = require('fs');
          const receipt = JSON.parse(fs.readFileSync('/tmp/workflow-applicability-receipt.json', 'utf8'));
          if (!['SELECTED', 'NOT_APPLICABLE'].includes(receipt.result)) throw new Error('WORKFLOW_APPLICABILITY_RESULT_INVALID');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `selected=${receipt.selectedByDecision ? 'true' : 'false'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `severity=${receipt.severity}\n`);
          NODE

      # Bounded read-only Gen3011 qualification; remove after evidence is captured.
      - name: Gen3011 exact Gen3010 canonical admission branch challenge
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/h-earth/gen3011-admitted-candidate-path-preflight-repair-20261030' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          readonly repo=smansfield635-create/smansfield635-create.github.io
          readonly gen3010_branch=h-earth/gen3010-natural-grass-support-fringe-20261030
          readonly expected=cb124b8784cf684754d17dcfa54bc0269145bd21
          observed="$(gh api "/repos/$repo/git/ref/heads/$gen3010_branch" --jq '.object.sha')"
          test "$observed" = "$expected"
          git cat-file -e "$observed^{commit}"
          git worktree add --detach --no-checkout "$RUNNER_TEMP/gen3010-readonly-worktree" "$observed" >/dev/null
          test "$(git -C "$RUNNER_TEMP/gen3010-readonly-worktree" rev-parse HEAD)" = "$expected"
          export GEN3010_SHA="$observed"
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const repo='smansfield635-create/smansfield635-create.github.io';
          const branch='h-earth/gen3010-natural-grass-support-fringe-20261030';
          const sha=process.env.GEN3010_SHA,dir=process.env.RUNNER_TEMP;
          const event={pull_request:{head:{ref:branch,sha,repo:{full_name:repo}},
            base:{repo:{full_name:repo}}}};
          fs.writeFileSync(path.join(dir,'gen3010-genuine-event.json'),JSON.stringify(event));
          event.pull_request.head.ref='h-earth/gen3010-foreign-grass-support-fringe-20261030';
          fs.writeFileSync(path.join(dir,'gen3010-foreign-event.json'),JSON.stringify(event));
          NODE
          selector="$GITHUB_WORKSPACE/tools/workflow-applicability-gate.v1.mjs"
          test -s "$selector"
          cd "$RUNNER_TEMP/gen3010-readonly-worktree"
          GITHUB_EVENT_NAME=pull_request GITHUB_EVENT_PATH="$RUNNER_TEMP/gen3010-genuine-event.json" \
            node "$selector" --path h-earth-3d/evidence/vegetation-support-fringe-20261030/dry-run.mjs \
            --output "$RUNNER_TEMP/gen3010-genuine-result.json" >/dev/null
          GITHUB_EVENT_NAME=pull_request GITHUB_EVENT_PATH="$RUNNER_TEMP/gen3010-foreign-event.json" \
            node "$selector" --path h-earth-3d/evidence/vegetation-support-fringe-20261030/dry-run.mjs \
            --output "$RUNNER_TEMP/gen3010-foreign-result.json" >/dev/null
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const root=process.env.RUNNER_TEMP;
          const a=JSON.parse(fs.readFileSync(path.join(root,'gen3010-genuine-result.json'),'utf8'));
          const b=JSON.parse(fs.readFileSync(path.join(root,'gen3010-foreign-result.json'),'utf8'));
          if(a.result!=='NOT_APPLICABLE'||a.verifiedAdmission?.lockGeneration!==3010||
             a.verifiedAdmission?.operationId!=='H_EARTH_NATURAL_GRASS_SUPPORT_FRINGE_20261030_001'||
             !a.admittedCandidatePaths?.includes('h-earth-3d/evidence/vegetation-support-fringe-20261030/dry-run.mjs'))
            throw Error('GEN3010_GENUINE_GITHUB_ADMISSION_POSITIVE_FAILED:'+JSON.stringify({result:a.result,verifiedAdmission:a.verifiedAdmission}));
          if(b.result!=='SELECTED'||b.severity!=='SELECTED_BLOCKER'||b.verifiedAdmission!==null||
             !b.ambiguousAuthorityPaths?.includes('h-earth-3d/evidence/vegetation-support-fringe-20261030/dry-run.mjs'))
            throw Error('GEN3010_FOREIGN_BRANCH_MUST_FAIL_CLOSED:'+JSON.stringify({result:b.result,severity:b.severity}));
          console.log('GEN3011_REAL_GITHUB_SOURCE_REPLAY_PASS genuine=NOT_APPLICABLE foreign=SELECTED_BLOCKER');
          NODE

      - name: Record neutral non-applicability
        if: ${{ steps.applicability.outputs.selected != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'H-Earth repository-registry preflight is NOT_APPLICABLE for this change set.'
          echo 'No expensive registry preflight is executed; this is a neutral-success disposition.'
          cat /tmp/workflow-applicability-receipt.json

      - name: Execute selected automatic H-Earth registry preflight
        if: ${{ steps.applicability.outputs.selected == 'true' }}
        run: |
          node --experimental-default-type=module \
            tools/h-earth-repository-registry-auto-preflight.mjs \
            --paths-file /tmp/h-earth-changed-paths.txt \
            --task "Automatic GitHub change preflight" \
            --mutation-intent \
            --output /tmp/h-earth-automatic-preflight-receipt.json

      - name: Upload deterministic applicability and preflight receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-automatic-preflight-receipt
          path: |
            /tmp/workflow-applicability-receipt.json
            /tmp/h-earth-automatic-preflight-receipt.json
          if-no-files-found: error
          retention-days: 30

  audralia-diagnostic-premutation-preflight:
    if: >-
      ${{
        github.event_name == 'issue_comment' &&
        github.event.comment.author_association == 'OWNER' &&
        startsWith(github.event.comment.body, 'H_EARTH_AUDRALIA_DIAGNOSTIC_PREMUTATION_PREFLIGHT_V1')
      }}
    runs-on: ubuntu-latest
    outputs:
      subject_head: ${{ steps.request.outputs.subject_head }}
    steps:
      - name: Parse fixed read-only pre-mutation request
        id: request
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const marker = 'H_EARTH_AUDRALIA_DIAGNOSTIC_PREMUTATION_PREFLIGHT_V1';
          const body = String(process.env.COMMENT_BODY || '');
          if (!body.startsWith(marker)) throw new Error('PREMUTATION_MARKER_MISMATCH');
          let payload = body.slice(marker.length).trim();
          if (payload.startsWith('```json')) payload = payload.slice(7);
          else if (payload.startsWith('```')) payload = payload.slice(3);
          if (payload.endsWith('```')) payload = payload.slice(0, -3);
          const request = JSON.parse(payload.trim());
          if (request.schema !== 'H_EARTH_AUDRALIA_DIAGNOSTIC_PREMUTATION_PREFLIGHT_REQUEST_v1') {
            throw new Error('PREMUTATION_SCHEMA_MISMATCH');
          }
          if (!/^[0-9a-f]{40}$/.test(String(request.subjectHead || ''))) {
            throw new Error('PREMUTATION_SUBJECT_HEAD_INVALID');
          }
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28'
          };
          (async () => {
            const response = await fetch('https://api.github.com/repos/smansfield635-create/smansfield635-create.github.io/git/ref/heads/main', {headers});
            const text = await response.text();
            if (!response.ok) throw new Error(`PREMUTATION_MAIN_FETCH_FAILED:${response.status}:${text}`);
            const ref = JSON.parse(text);
            if (ref.object.sha !== request.subjectHead) {
              throw new Error(`PREMUTATION_GOVERNING_HEAD_MISMATCH:${ref.object.sha}`);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `subject_head=${request.subjectHead}\n`);
          })().catch((error) => {
            console.error(error.stack || error.message);
            process.exit(1);
          });
          NODE

      - name: Check out exact subject head narrowly
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.subject_head }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            h-earth-3d/registry/
            tools/h-earth-repository-registry-auto-preflight.mjs
            showroom/globe/audralia/diagnostic/index.html
            showroom/globe/audralia/diagnostic/index.controls.js
            showroom/globe/audralia/diagnostic/index.inspection.lane.js

      - name: Run fixed exact-three-path read-only pre-mutation preflight
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/audralia-diagnostic-premutation-paths.txt <<'PATHS'
          showroom/globe/audralia/diagnostic/index.html
          showroom/globe/audralia/diagnostic/index.controls.js
          showroom/globe/audralia/diagnostic/index.inspection.lane.js
          PATHS
          node --experimental-default-type=module \
            tools/h-earth-repository-registry-auto-preflight.mjs \
            --paths-file /tmp/audralia-diagnostic-premutation-paths.txt \
            --task "Audralia diagnostic fixed read-only pre-mutation preflight" \
            --mutation-intent \
            --output /tmp/audralia-diagnostic-premutation-preflight-receipt.json

      - name: Upload read-only pre-mutation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audralia-diagnostic-premutation-preflight-receipt
          path: /tmp/audralia-diagnostic-premutation-preflight-receipt.json
          if-no-files-found: error
          retention-days: 30

  audralia-diagnostic-governance-builder:
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.ref == 'agent/audralia-diagnostic-governance-gen1656-20260824'
      }}
    needs: automatic-h-earth-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate for builder
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run exact candidate builder verifier
        run: |
          node h-earth-3d/validation/h-earth-audralia-diagnostic-path-recognition-verifier.v1.mjs \
            --verify \
            --role BUILDER \
            --output /tmp/audralia-diagnostic-path-builder.json

      - name: Upload builder receipt
        uses: actions/upload-artifact@v4
        with:
          name: audralia-diagnostic-path-governance-builder
          path: /tmp/audralia-diagnostic-path-builder.json
          if-no-files-found: error
          retention-days: 30

  audralia-diagnostic-governance-fresh-verifier:
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.ref == 'agent/audralia-diagnostic-governance-gen1656-20260824'
      }}
    needs: automatic-h-earth-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate for fresh verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up fresh Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run fresh independent verifier
        run: |
          node h-earth-3d/validation/h-earth-audralia-diagnostic-path-recognition-verifier.v1.mjs \
            --verify \
            --role ROLE_3 \
            --output /tmp/audralia-diagnostic-path-fresh-verifier.json

      - name: Upload fresh verifier receipt
        uses: actions/upload-artifact@v4
        with:
          name: audralia-diagnostic-path-governance-fresh-verifier
          path: /tmp/audralia-diagnostic-path-fresh-verifier.json
          if-no-files-found: error
          retention-days: 30

  audralia-diagnostic-governance-fingerprint-match:
    if: ${{ github.event_name == 'pull_request' }}
    needs:
      - audralia-diagnostic-governance-builder
      - audralia-diagnostic-governance-fresh-verifier
    runs-on: ubuntu-latest
    steps:
      - name: Download builder receipt
        uses: actions/download-artifact@v4
        with:
          name: audralia-diagnostic-path-governance-builder
          path: /tmp/builder

      - name: Download fresh verifier receipt
        uses: actions/download-artifact@v4
        with:
          name: audralia-diagnostic-path-governance-fresh-verifier
          path: /tmp/fresh

      - name: Require matching independent fingerprints
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const builder = JSON.parse(fs.readFileSync('/tmp/builder/audralia-diagnostic-path-builder.json', 'utf8'));
          const fresh = JSON.parse(fs.readFileSync('/tmp/fresh/audralia-diagnostic-path-fresh-verifier.json', 'utf8'));
          if (builder.result !== 'PASS' || fresh.result !== 'PASS') throw new Error('VERIFIER_RESULT_NOT_PASS');
          if (builder.role !== 'BUILDER' || fresh.role !== 'ROLE_3') throw new Error('VERIFIER_ROLE_MISMATCH');
          if (builder.candidateHead !== fresh.candidateHead) throw new Error('VERIFIER_CANDIDATE_HEAD_MISMATCH');
          if (builder.fingerprint !== fresh.fingerprint) throw new Error('FRESH_VERIFIER_MISMATCH');
          const receipt = {
            schema: 'H_EARTH_AUDRALIA_DIAGNOSTIC_GOVERNANCE_FINGERPRINT_MATCH_RECEIPT_v1',
            result: 'PASS',
            candidateHead: builder.candidateHead,
            builderFingerprint: builder.fingerprint,
            freshVerifierFingerprint: fresh.fingerprint,
            fingerprintsMatch: true
          };
          fs.writeFileSync('/tmp/audralia-diagnostic-governance-fingerprint-match.json', JSON.stringify(receipt, null, 2) + '\n');
          NODE

      - name: Upload fingerprint match receipt
        uses: actions/upload-artifact@v4
        with:
          name: audralia-diagnostic-path-governance-fingerprint-match
          path: /tmp/audralia-diagnostic-governance-fingerprint-match.json
          if-no-files-found: error
          retention-days: 30

  audralia-final-cloud-compositor-anchor-recovery-builder:
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.ref == 'agent/audralia-final-cloud-compositor-anchor-recovery-gen1716-20260825'
      }}
    needs: automatic-h-earth-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact registration candidate for builder
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AI_ENTRYPOINT.json
            /.github/ai-router/
            /.github/operation-intake/locator.v1.json
            /.github/workflows/h-earth-repository-registry-preflight.yml
            /.github/workflows/h-earth-experience-anchor-gate.yml
            /tools/repository-ai-entry-router.mjs
            /tools/repository-ai-entry-router.v3-legacy.mjs
            /tools/h-earth-repository-registry-auto-preflight.mjs
            /tools/h-earth-experience-anchor-gate.mjs
            /h-earth-3d/registry/
            /h-earth-3d/experience-anchor/
            /showroom/globe/audralia/final-cloud-shader-composition-v1.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run exact registration candidate builder verifier
        run: |
          node h-earth-3d/registry/validation/h-earth-audralia-final-cloud-compositor-path-recognition-verifier.v1.mjs \
            --verify \
            --role BUILDER \
            --output /tmp/audralia-final-cloud-compositor-anchor-recovery-builder.json

      - uses: actions/upload-artifact@v4
        with:
          name: audralia-final-cloud-compositor-anchor-recovery-builder
          path: /tmp/audralia-final-cloud-compositor-anchor-recovery-builder.json
          if-no-files-found: error
          retention-days: 30

  audralia-final-cloud-compositor-anchor-recovery-fresh-verifier:
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.ref == 'agent/audralia-final-cloud-compositor-anchor-recovery-gen1716-20260825'
      }}
    needs: automatic-h-earth-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact registration candidate for fresh verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AI_ENTRYPOINT.json
            /.github/ai-router/
            /.github/operation-intake/locator.v1.json
            /.github/workflows/h-earth-repository-registry-preflight.yml
            /.github/workflows/h-earth-experience-anchor-gate.yml
            /tools/repository-ai-entry-router.mjs
            /tools/repository-ai-entry-router.v3-legacy.mjs
            /tools/h-earth-repository-registry-auto-preflight.mjs
            /tools/h-earth-experience-anchor-gate.mjs
            /h-earth-3d/registry/
            /h-earth-3d/experience-anchor/
            /showroom/globe/audralia/final-cloud-shader-composition-v1.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run fresh independent registration verifier
        run: |
          node h-earth-3d/registry/validation/h-earth-audralia-final-cloud-compositor-path-recognition-verifier.v1.mjs \
            --verify \
            --role ROLE_3 \
            --output /tmp/audralia-final-cloud-compositor-anchor-recovery-fresh.json

      - uses: actions/upload-artifact@v4
        with:
          name: audralia-final-cloud-compositor-anchor-recovery-fresh
          path: /tmp/audralia-final-cloud-compositor-anchor-recovery-fresh.json
          if-no-files-found: error
          retention-days: 30

  audralia-final-cloud-compositor-anchor-recovery-fingerprint-match:
    if: ${{ github.event_name == 'pull_request' }}
    needs:
      - audralia-final-cloud-compositor-anchor-recovery-builder
      - audralia-final-cloud-compositor-anchor-recovery-fresh-verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: audralia-final-cloud-compositor-anchor-recovery-builder
          path: /tmp/builder

      - uses: actions/download-artifact@v4
        with:
          name: audralia-final-cloud-compositor-anchor-recovery-fresh
          path: /tmp/fresh

      - name: Require matching independent registration fingerprints
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const builder = JSON.parse(fs.readFileSync('/tmp/builder/audralia-final-cloud-compositor-anchor-recovery-builder.json', 'utf8'));
          const fresh = JSON.parse(fs.readFileSync('/tmp/fresh/audralia-final-cloud-compositor-anchor-recovery-fresh.json', 'utf8'));
          if (builder.result !== 'PASS' || fresh.result !== 'PASS') throw new Error('VERIFIER_RESULT_NOT_PASS');
          if (builder.role !== 'BUILDER' || fresh.role !== 'ROLE_3') throw new Error('VERIFIER_ROLE_MISMATCH');
          if (builder.candidateHead !== fresh.candidateHead) throw new Error('VERIFIER_CANDIDATE_HEAD_MISMATCH');
