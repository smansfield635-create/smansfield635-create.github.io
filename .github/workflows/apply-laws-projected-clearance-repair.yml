  data-laws-cluster-orbit-common-radius-role="minimum-runtime-radius"
  data-laws-cluster-orbit-maximum-common-radius="1.82"
  data-laws-cluster-orbit-runtime-radius-source="compositor-bounds-and-projection"
  data-laws-cluster-orbit-uniform-scale-range="1.00-to-0.72"
  data-laws-cluster-orbit-projected-clearance-margin-px="8"
  data-laws-cluster-orbit-rigid-position-interpolation="true"
  data-laws-cluster-orbit-member-floating-translation="false"
  data-laws-cluster-orbit-maximum-tilt-radians="0.30"''',
