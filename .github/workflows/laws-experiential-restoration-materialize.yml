name: Laws Experiential Restoration Interaction Diagnostic

on:
  push:
    branches:
      - agent/laws-experiential-architecture-restoration-001
    paths:
      - '.github/workflows/laws-experiential-restoration-materialize.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/laws-experiential-restoration-materialize.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laws-experiential-restoration-interaction-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXECUTION_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  EXPECTED_MAIN_BASE: ef2ffdb1da7911238652f076a6b44326061493ef
  BASE_URL: http://127.0.0.1:4173
  EVIDENCE_DIR: artifacts/laws-experiential-restoration/interaction-diagnostic

jobs:
  interaction-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact restoration head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXECUTION_COMMIT }}
          fetch-depth: 0

      - name: Lock exact checkout and product hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXECUTION_COMMIT"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_BASE"
          test "$(git merge-base origin/main HEAD)" = "$EXPECTED_MAIN_BASE"
          echo '8fff5010933b90ffd396fddab393fb4044954b1b2838299b2a454f598c246854  laws/index.html' | sha256sum --check --strict
          echo '4a48242720d7f42dcf582ff910766882091c1b00a0ad3fad72807d5a5090d196  laws/index.experience.css' | sha256sum --check --strict
          echo 'e5a289b9e6792f7549be7797880ffe6911a6fea3e4f5e02b48ada1b71158a59f  laws/index.experience.polish.css' | sha256sum --check --strict
          echo '2722d0f4da22b07d40fb2ecd14eea0d07c9bb21181013352136800a4934a9062  laws/index.experience.js' | sha256sum --check --strict

      - name: Install pinned browser verifier
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start exact candidate server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/laws-interaction-diagnostic-server.log 2>&1 &
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:4173/laws/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/laws-interaction-diagnostic-server.log
          exit 1

      - name: Trace physical authority activation with partial receipts
        shell: bash
        run: |
          set -u
          mkdir -p "$EVIDENCE_DIR"
          cat > tools/.laws-interaction-diagnostic.mjs <<'JS'
          import fs from "node:fs/promises";
          import path from "node:path";
          import { chromium } from "playwright";

          const evidenceDir = process.env.EVIDENCE_DIR;
          const receiptPath = path.join(evidenceDir, "physical-authority-diagnostic.json");
          const receipt = {
            contract: "LAWS_EXPERIENTIAL_RESTORATION_PHYSICAL_AUTHORITY_DIAGNOSTIC_v2",
            head: process.env.EXECUTION_COMMIT,
            viewport: { width: 390, height: 844 },
            results: [],
            allActivated: false,
            disposition: "IN_PROGRESS"
          };

          async function persist() {
            await fs.mkdir(evidenceDir, { recursive: true });
            await fs.writeFile(receiptPath, `${JSON.stringify(receipt, null, 2)}\n`, "utf8");
          }

          async function state(page, label) {
            return page.evaluate(nextLabel => {
              const root = document.querySelector("[data-laws-root]");
              const scene = document.querySelector("[data-laws-scene-field]");
              const sceneRect = scene?.getBoundingClientRect();
              let frame = null;
              try { frame = globalThis.DGB_LAWS_CONTROLLER?.getFrame?.() || null; } catch (_) {}
              return {
                label: nextLabel,
                scrollY,
                sceneRect: sceneRect ? {
                  left: sceneRect.left, top: sceneRect.top,
                  width: sceneRect.width, height: sceneRect.height,
                  bottom: sceneRect.bottom
                } : null,
                controllerState: root?.dataset.lawsControllerState || "",
                activeDirection: root?.dataset.lawsActiveDirection || "",
                activeCategory: root?.dataset.lawsActiveCategory || "",
                experienceDirection: document.documentElement.dataset.lawsExperienceDirection || "",
                visibleLabelId: root?.dataset.lawsVisibleOuterAuthorityLabelId || "",
                interactionsStatus: root?.dataset.lawsInteractionsStatus || "",
                interactionReceipt: globalThis.DGB_LAWS_INTERACTIONS?.getReceipt?.() || null,
                frameState: frame?.state || "",
                frameDirection: frame?.compass?.selectedDirection || ""
              };
            }, label);
          }

          async function geometry(page) {
            return page.evaluate(() => {
              const root = document.querySelector("[data-laws-root]");
              const scene = document.querySelector("[data-laws-scene-field]");
              const visibleId = root?.dataset.lawsVisibleOuterAuthorityLabelId || "";
              const projected = document.querySelector(`[data-laws-projected-category-label="${visibleId}"]`);
              const sceneRect = scene?.getBoundingClientRect();
              const rect = projected?.getBoundingClientRect();
              const style = projected ? getComputedStyle(projected) : null;
              const samples = [];
              if (rect) {
                for (const [fx, fy] of [[.5,.5],[.35,.5],[.65,.5],[.5,.35],[.5,.65]]) {
                  const x = rect.left + rect.width * fx;
                  const y = rect.top + rect.height * fy;
                  const top = x >= 0 && y >= 0 && x < innerWidth && y < innerHeight
                    ? document.elementFromPoint(x, y) : null;
                  const owner = top?.closest?.(`[data-laws-projected-category-label="${visibleId}"]`) || null;
                  samples.push({
                    x, y,
                    inViewport: x >= 0 && y >= 0 && x < innerWidth && y < innerHeight,
                    topTag: top?.tagName || "",
                    topClass: typeof top?.className === "string" ? top.className : "",
                    owned: Boolean(owner)
                  });
                }
              }
              return {
                visibleId,
                scrollY,
                sceneRect: sceneRect ? {
                  left: sceneRect.left, top: sceneRect.top,
                  width: sceneRect.width, height: sceneRect.height,
                  bottom: sceneRect.bottom
                } : null,
                projectedRect: rect ? {
                  left: rect.left, top: rect.top,
                  width: rect.width, height: rect.height,
                  right: rect.right, bottom: rect.bottom
                } : null,
                projectedHidden: projected?.hidden ?? null,
                projectedAriaHidden: projected?.getAttribute("aria-hidden") || "",
                display: style?.display || "",
                visibility: style?.visibility || "",
                pointerEvents: style?.pointerEvents || "",
                samples
              };
            });
          }

          async function ownedPoint(page) {
            return page.evaluate(() => {
              const root = document.querySelector("[data-laws-root]");
              const visibleId = root?.dataset.lawsVisibleOuterAuthorityLabelId || "";
              const projected = document.querySelector(`[data-laws-projected-category-label="${visibleId}"]`);
              if (!(projected instanceof HTMLElement)) return null;
              const rect = projected.getBoundingClientRect();
              for (const [fx, fy] of [[.5,.5],[.35,.5],[.65,.5],[.5,.35],[.5,.65]]) {
                const x = rect.left + rect.width * fx;
                const y = rect.top + rect.height * fy;
                if (x < 0 || y < 0 || x >= innerWidth || y >= innerHeight) continue;
                const top = document.elementFromPoint(x, y);
                if (top?.closest?.(`[data-laws-projected-category-label="${visibleId}"]`)) {
                  return { visibleId, x, y };
                }
              }
              return null;
            });
          }

          const browser = await chromium.launch({ headless: true });
          for (const method of ["touchscreen-coordinate", "mouse-coordinate"]) {
            const result = { method, startedAt: new Date().toISOString() };
            let context = null;
            try {
              context = await browser.newContext({
                viewport: { width: 390, height: 844 },
                isMobile: true,
                hasTouch: true,
                deviceScaleFactor: 1
              });
              const page = await context.newPage();
              result.errors = [];
              page.on("pageerror", error => result.errors.push(`pageerror:${error.message}`));
              page.on("console", message => {
                if (message.type() === "error" && !message.text().includes("404")) {
                  result.errors.push(`console:${message.text()}`);
                }
              });

              await page.goto(`${process.env.BASE_URL}/laws/`, { waitUntil: "networkidle" });
              await page.waitForFunction(() => {
                const root = document.querySelector("[data-laws-root]");
                return Boolean(globalThis.DGB_LAWS_CONTROLLER && globalThis.DGB_LAWS_EXPERIENCE && globalThis.DGBLawsStagedLoader) &&
                  root?.dataset.lawsControllerStatus === "available";
              }, null, { timeout: 30000 });

              result.preload = await page.evaluate(() =>
                globalThis.DGB_LAWS_EXPERIENCE?.requestCompassRuntimePreload?.() ?? false
              );
              await page.waitForFunction(() => {
                const root = document.querySelector("[data-laws-root]");
                return Boolean(globalThis.DGB_LAWS_INTERACTIONS) && root?.dataset.lawsInteractionsStatus === "available";
              }, null, { timeout: 30000 });

              result.beforeInitial = await state(page, "before-initial-scroll");
              result.geometryInitial = await geometry(page);
              await page.evaluate(() => document.querySelector("[data-laws-scene-field]")?.scrollIntoView({
                block: "center", inline: "nearest", behavior: "instant"
              }));
              await page.waitForTimeout(350);
              result.before = await state(page, "before-input");
              result.geometryAfterSceneCenter = await geometry(page);

              let hit = null;
              for (let attempt = 0; attempt < 40; attempt += 1) {
                hit = await ownedPoint(page);
                if (hit) break;
                await page.waitForTimeout(25);
              }
              result.hit = hit;
              if (!hit) throw new Error("NO_OWNED_PROJECTED_LABEL_POINT");

              if (method === "touchscreen-coordinate") {
                await page.touchscreen.tap(hit.x, hit.y);
              } else {
                await page.mouse.click(hit.x, hit.y);
              }
              await page.waitForTimeout(1400);
              result.after = await state(page, "after-input");
              result.geometryAfter = await geometry(page);
              result.activated = result.after.controllerState === "CLUSTER_OPEN" &&
                result.after.activeDirection === hit.visibleId &&
                result.after.experienceDirection === hit.visibleId;
            } catch (error) {
              result.activated = false;
              result.error = { message: error.message, stack: error.stack || "" };
            } finally {
              result.completedAt = new Date().toISOString();
              receipt.results.push(result);
              receipt.allActivated = receipt.results.length === 2 && receipt.results.every(item => item.activated);
              receipt.disposition = receipt.results.length < 2
                ? "IN_PROGRESS"
                : receipt.allActivated ? "PASS" : "FAIL";
              await persist();
              if (context) await context.close();
            }
          }
          await browser.close();
          if (!receipt.allActivated) process.exitCode = 1;
          JS
          node tools/.laws-interaction-diagnostic.mjs
          status=$?
          rm -f tools/.laws-interaction-diagnostic.mjs
          exit $status

      - name: Upload exact interaction receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laws-interaction-diagnostic-${{ env.EXECUTION_COMMIT }}
          path: |
            artifacts/laws-experiential-restoration/interaction-diagnostic/**
            /tmp/laws-interaction-diagnostic-server.log
          if-no-files-found: warn
          retention-days: 30
