name: Compass physical-anchor settlement repair

on:
  push:
    branches:
      - compass-a2f838-exact-qualification-temp

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compass-renewal-corrected-gen1772
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            assets/compass
          sparse-checkout-cone-mode: true
      - name: Prove expected Compass head
        run: test "$(git rev-parse HEAD)" = "f07cf8f9e49a8fd9da54c1271147496b7aa179c9"
      - name: Repair physical settlement and restore controller precedent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # The controller's established canonical direct-focus mapping was not
          # the drag defect. Restore it; drag settlement will use the renderer's
          # physical anchor, exactly like cluster settlement already does.
          p=Path('assets/compass/compass.controller.js')
          s=p.read_text()
          changed='''    east:\n      Object.freeze({\n        yaw: Math.PI / 2,\n        pitch: 0,\n        roll: 0\n      }),\n\n    south:\n      Object.freeze({\n        yaw: Math.PI,\n        pitch: 0,\n        roll: 0\n      }),\n\n    west:\n      Object.freeze({\n        yaw: -Math.PI / 2,\n        pitch: 0,\n        roll: 0\n      })'''
          original='''    east:\n      Object.freeze({\n        yaw: -Math.PI / 2,\n        pitch: 0,\n        roll: 0\n      }),\n\n    south:\n      Object.freeze({\n        yaw: Math.PI,\n        pitch: 0,\n        roll: 0\n      }),\n\n    west:\n      Object.freeze({\n        yaw: Math.PI / 2,\n        pitch: 0,\n        roll: 0\n      })'''
          if s.count(changed)!=1:
              raise SystemExit(f'controller altered map count={s.count(changed)}')
          p.write_text(s.replace(changed, original))

          p=Path('assets/compass/compass.crystals.js')
          s=p.read_text()
          old='''  function settledConstellationQuaternion(\n    wing\n  ) {\n    const canonicalAngle =\n      wing === "east"\n        ? Math.PI / 2\n        : wing === "south"\n          ? Math.PI\n          : wing === "west"\n            ? -Math.PI / 2\n            : 0;\n\n    return quaternionFromAxisAngle(\n      [0, 0, 1],\n      canonicalAngle\n    );\n  }'''
          new='''  function settledConstellationQuaternion(\n    wing,\n    currentQuaternion\n  ) {\n    const currentVector =\n      rotatedCardinalUnitVector(\n        wing,\n        currentQuaternion\n      );\n\n    const alignment =\n      quaternionFromUnitVectors(\n        currentVector,\n        constellationAnchorVector()\n      );\n\n    return quaternionNormalize(\n      quaternionMultiply(\n        alignment,\n        currentQuaternion\n      )\n    );\n  }'''
          if s.count(old)!=1:
              raise SystemExit(f'renderer settled function count={s.count(old)}')
          s=s.replace(old,new)
          old_call='''      settledConstellationQuaternion(\n        primaryWing\n      );'''
          new_call='''      settledConstellationQuaternion(\n        primaryWing,\n        currentQuaternion\n      );'''
          if s.count(old_call)!=1:
              raise SystemExit(f'settled call count={s.count(old_call)}')
          p.write_text(s.replace(old_call,new_call))
          PY
          git diff --check
          git diff -- assets/compass/compass.controller.js assets/compass/compass.crystals.js
      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "smansfield635-create"
          git config user.email "smansfield635@gmail.com"
          git add assets/compass/compass.controller.js assets/compass/compass.crystals.js
          test "$(git diff --cached --name-only | sort | paste -sd, -)" = "assets/compass/compass.controller.js,assets/compass/compass.crystals.js"
          git commit -m "Compass: settle cardinal on physical anchor"
          git push origin HEAD:compass-renewal-corrected-gen1772
