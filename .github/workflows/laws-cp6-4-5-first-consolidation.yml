lay:flex;gap:8px;flex-wrap:wrap;margin:16px 0}}.sequence span{{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--accent);border-radius:50%;font-weight:950}}.gateway-grid{{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}.gateway-card{{scroll-margin-top:18px}}.gateway-card>a{{margin-top:8px;color:var(--cyan)}}@media(max-width:720px){{.gateway-grid{{grid-template-columns:1fr}}.shell{{width:min(100% - 16px,1120px)}}}}</style></head><body><div class="shell"><header class="top"><a href="/laws/">Laws Compass</a><nav><a href="{other}">{'Research' if is_test else 'Test'}</a><a href="/">Main Compass</a></nav></header><main><section class="hero"><p class="kicker">{kind} · {gateway}</p><h1>{kind}</h1><p>{role}</p><div class="sequence" aria-label="F.I.R.S.T. sequence"><span>F</span><span>I</span><span>R</span><span>S</span><span>T</span></div><div class="links"><a href="/laws/#research-comes-first">Research comes F.I.R.S.T.</a>{''.join(f'<a href="{href}">{name}</a>' for _,name,_,href in destinations)}</div></section><section class="relationship"><p class="kicker">Authority relationship</p><h2>{'Test receives admitted evidence and returns bounded result records.' if is_test else 'Research supplies evidence and boundaries across every F.I.R.S.T. authority.'}</h2><p>{'Research provides source and method custody; Test does not create evidence or validation merely by running.' if is_test else 'Research preserves source quality, method limits, applied context, negative and mixed findings, and claim ceilings without becoming a seventh authority.'}</p></section><div class="gateway-grid">{cards}</div></main></div><script data-cp6-anchor-forward="true">(() => {{"use strict";const routes={{{routes}}};const key=location.hash.slice(1);if(Object.prototype.hasOwnProperty.call(routes,key)){{location.replace(routes[key]);}}}})();</script></body></html>'''

