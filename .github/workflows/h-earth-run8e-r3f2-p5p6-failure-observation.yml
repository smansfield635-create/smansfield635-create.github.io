name: H-Earth Run 8E R3F2-P5P6 Failure Observation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/h-earth-run8e-r3f2-p5p6-failure-observation.yml'

permissions:
  contents: read
  actions: read

jobs:
  observe-exact-failure:
    runs-on: ubuntu-latest
    env:
      TARGET_JOB: '90170255316'
    steps:
      - name: Fetch exact job log and isolate browser assertion
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r3f2-p5p6-observation
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/jobs/$TARGET_JOB/logs" \
            -o /tmp/r3f2-p5p6-observation/job.log
          grep -aE 'P5P6_|AssertionError|ERR_ASSERTION|Error:' /tmp/r3f2-p5p6-observation/job.log \
            > /tmp/r3f2-p5p6-observation/failure-lines.txt || true
          tail -n 160 /tmp/r3f2-p5p6-observation/job.log \
            > /tmp/r3f2-p5p6-observation/job-tail.txt
          test -s /tmp/r3f2-p5p6-observation/failure-lines.txt
          cat /tmp/r3f2-p5p6-observation/failure-lines.txt

      - name: Upload exact failure observation
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-run8e-r3f2-p5p6-failure-observation
          path: |
            /tmp/r3f2-p5p6-observation/failure-lines.txt
            /tmp/r3f2-p5p6-observation/job-tail.txt
          if-no-files-found: error
          retention-days: 30
