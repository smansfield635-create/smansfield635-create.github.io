name: Complete Laws live repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/laws-live-repair-main.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and verify the complete Laws package
        shell: bash
        run: |
          set -euo pipefail

          git show 9960f3fe9b541d9b8088555f7e7ca540825941fb:laws/index.interactions.js > laws/index.interactions.js
          git show 38e279c56965ce32ba15e64f957d4cdf7e76e7f4:laws/index.cosmos.js > laws/index.cosmos.js
          rm -f laws/index.interactions.loader.source.js laws/index.interactions.source.round4.js

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("laws/index.html")
          text = path.read_text(encoding="utf-8")

          text, interaction_count = re.subn(
              r'(/laws/index\.interactions\.js\?v=)[^"\s]+',
              r'\1LAWS_DIRECT_49548d4a6d29c2169812dd61130b161d96351bec_20260726B',
              text,
              count=1,
          )
          text, cosmos_count = re.subn(
              r'(/laws/index\.cosmos\.js\?v=)[^"\s]+',
              r'\1LAWS_SCENE_76d71d7cbafe52421c9eb68e3604792cc6755cf3_20260726B',
              text,
              count=1,
          )

          if interaction_count != 1:
              raise SystemExit(f"Expected one interaction URL, found {interaction_count}")
          if cosmos_count != 1:
              raise SystemExit(f"Expected one Cosmos URL, found {cosmos_count}")

          path.write_text(text, encoding="utf-8")
          PY

          rm .github/workflows/laws-live-repair-main.yml

          node --check laws/index.interactions.js
          node --check laws/index.cosmos.js

          test ! -e laws/index.interactions.loader.source.js
          test ! -e laws/index.interactions.source.round4.js

          grep -q 'LAWS_CHECKPOINT_ZERO_DIRECT_INTERACTION_AUTHORITY_v1' laws/index.interactions.js
          grep -q 'centerCompassExclusiveHitZone:true' laws/index.interactions.js
          grep -q 'loaderRelayUsed:false' laws/index.interactions.js
          grep -q 'mountSelector: "\[data-laws-cosmic-field\]"' laws/index.cosmos.js
          grep -q 'sceneContained: true' laws/index.cosmos.js
          grep -q 'LAWS_DIRECT_49548d4a6d29c2169812dd61130b161d96351bec_20260726B' laws/index.html
          grep -q 'LAWS_SCENE_76d71d7cbafe52421c9eb68e3604792cc6755cf3_20260726B' laws/index.html

          if grep -R -n -E 'index\.interactions\.loader\.source\.js|index\.interactions\.source\.round4\.js' laws/index.html laws/index.interactions.js; then
            echo 'Retired interaction relay reference remains' >&2
            exit 1
          fi

          git diff --check

      - name: Publish verified package to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            laws/index.interactions.js \
            laws/index.cosmos.js \
            laws/index.html \
            laws/index.interactions.loader.source.js \
            laws/index.interactions.source.round4.js \
            .github/workflows/laws-live-repair-main.yml
          git commit -m "Complete Laws checkpoint zero live repair"
          git push origin HEAD:main
