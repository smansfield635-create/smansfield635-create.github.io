name: Bounded Showroom crystal cache key

on:
  push:
    paths:
      - ".github/workflows/bounded-showroom-crystal-cache-key.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded one-line correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path("showroom/index.html")
          old = "/showroom/index.crystals.js?v=SHOWROOM_FOUR_BY_FOUR_NARRATIVE_CONSTELLATION_CRYSTALS_TNT_v8"
          new = "/showroom/index.crystals.js?v=SHOWROOM_SPHERICAL_DEPTH_LABELS_GLOW_v1"

          text = html.read_text(encoding="utf-8")
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one cache-key target; found {count}.")

          html.write_text(text.replace(old, new), encoding="utf-8")
          Path(".github/workflows/bounded-showroom-crystal-cache-key.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add showroom/index.html .github/workflows/bounded-showroom-crystal-cache-key.yml
          git commit -m "Advance Showroom crystal cache key"
          git push origin HEAD:main
