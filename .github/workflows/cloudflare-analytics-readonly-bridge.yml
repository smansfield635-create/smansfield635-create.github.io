name: Cloudflare Analytics Read-Only Bridge

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cloudflare-analytics-readonly-bridge.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
    steps:
      - name: Require analytics token
        shell: bash
        run: |
          test -n "$CF_TOKEN" || { echo "CLOUDFLARE_ANALYTICS_TOKEN is missing"; exit 1; }

      - name: Collect read-only Cloudflare analytics
        shell: python
        run: |
          import json, os, urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          endpoint = "https://api.cloudflare.com/client/v4/graphql"
          token = os.environ["CF_TOKEN"]
          now = datetime.now(timezone.utc).replace(microsecond=0)
          start = now - timedelta(days=7)

          def gql(query, variables=None):
              body = json.dumps({"query": query, "variables": variables or {}}).encode()
              req = urllib.request.Request(
                  endpoint, data=body, method="POST",
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json", "Accept": "application/json"}
              )
              with urllib.request.urlopen(req, timeout=45) as r:
                  return json.load(r)

          # Discover the site's zone ID from Cloudflare's read-only zones endpoint.
          zone_url = "https://api.cloudflare.com/client/v4/zones?name=diamondgatebridge.com&status=active"
          zreq = urllib.request.Request(zone_url, headers={"Authorization": f"Bearer {token}", "Accept": "application/json"})
          try:
              with urllib.request.urlopen(zreq, timeout=45) as r:
                  zdoc = json.load(r)
          except Exception as e:
              raise SystemExit("Zone discovery endpoint was not admitted by the current token: " + str(e))
          zones = [{"zoneTag": z["id"]} for z in zdoc.get("result", []) if z.get("id")]
          if not zones:
              raise SystemExit("Cloudflare returned no active diamondgatebridge.com zone.")

          query = """
          query BridgeAnalytics($zoneTag: string, $filter: filter) {
            viewer {
              zones(filter: {zoneTag: $zoneTag}) {
                hourly: httpRequestsAdaptiveGroups(
                  limit: 1000
                  orderBy: [datetimeHour_ASC]
                  filter: $filter
                ) {
                  count
                  avg { sampleInterval }
                  sum { visits edgeResponseBytes }
                  dimensions { datetimeHour }
                }
                paths: httpRequestsAdaptiveGroups(
                  limit: 50
                  orderBy: [count_DESC]
                  filter: $filter
                ) {
                  count
                  avg { sampleInterval }
                  sum { visits edgeResponseBytes }
                  dimensions { clientRequestPath }
                }
                hosts: httpRequestsAdaptiveGroups(
                  limit: 25
                  orderBy: [count_DESC]
                  filter: $filter
                ) {
                  count
                  avg { sampleInterval }
                  sum { visits edgeResponseBytes }
                  dimensions { clientRequestHTTPHost }
                }
              }
            }
          }
          """
          filt = {
              "datetime_geq": start.isoformat().replace("+00:00", "Z"),
              "datetime_lt": now.isoformat().replace("+00:00", "Z"),
              "requestSource": "eyeball",
          }

          out = {
              "schema": "DGB_CLOUDFLARE_ANALYTICS_BRIDGE_V1",
              "generatedAt": now.isoformat().replace("+00:00", "Z"),
              "window": {"start": filt["datetime_geq"], "end": filt["datetime_lt"]},
              "zones": [],
          }
          for z in zones:
              zid = z["zoneTag"]
              res = gql(query, {"zoneTag": zid, "filter": filt})
              if res.get("errors"):
                  out["zones"].append({"zoneTag": zid, "errors": res["errors"]})
                  continue
              rows = res.get("data", {}).get("viewer", {}).get("zones", [])
              out["zones"].append({"zoneTag": zid, **(rows[0] if rows else {})})

          Path("analytics-bridge").mkdir()
          Path("analytics-bridge/latest.json").write_text(json.dumps(out, indent=2) + "\n")
          Path("analytics-bridge/status.txt").write_text(
              f"PASS\nschema={out['schema']}\ngeneratedAt={out['generatedAt']}\nzones={len(out['zones'])}\n"
          )
          print(f"Collected analytics for {len(out['zones'])} zone(s); token value was never printed.")

      - name: Upload private workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-analytics-latest
          path: analytics-bridge/
          retention-days: 30
          if-no-files-found: error
