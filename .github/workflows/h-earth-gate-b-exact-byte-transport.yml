name: H-Earth Gate B Environment Correction and Provider Install
on:
  pull_request:
permissions:
  contents: write
jobs:
  correct-and-install:
    if: github.head_ref == 'agent/h-earth-gate-b-phase-a-successor-001'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: agent/h-earth-gate-b-phase-a-successor-001
      ENVIRONMENT_PATH: showroom/globe/h-earth/environment.js
      PROVIDER_PATH: showroom/globe/h-earth/render/ground-view-gate-b.js
      PROVIDER_BLOB: 2a5b79a58ce411ed820df7ec2166f2e7b6e54b5b
      EXPECTED_ENVIRONMENT_BLOB: aa60accc453e66f84a11d27f25d946c2b33c1d83
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/h-earth-gate-b-phase-a-successor-001
          fetch-depth: 0
      - name: Correct, restore, validate, and commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$ENVIRONMENT_PATH")" = "$EXPECTED_ENVIRONMENT_BLOB"
          test ! -e "$PROVIDER_PATH"
          git cat-file -e "$PROVIDER_BLOB^{blob}"
          python - <<'PY'
          from pathlib import Path
          p=Path('showroom/globe/h-earth/environment.js')
          s=p.read_text()
          old="outputModel:\n      'DOM_CSS3D',"
          new="outputModel:\n      'DOM_CSS3D_PROJECTED_ENVIRONMENT',"
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1),newline='')
          PY
          mkdir -p "$(dirname "$PROVIDER_PATH")"
          git cat-file blob "$PROVIDER_BLOB" > "$PROVIDER_PATH"
          test "$(git hash-object "$PROVIDER_PATH")" = "$PROVIDER_BLOB"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import * as e from './showroom/globe/h-earth/environment.js';
          import * as c from './showroom/globe/h-earth/capacity.js';
          import * as p from './showroom/globe/h-earth/render/ground-view-gate-b.js';
          import * as k from './showroom/globe/h-earth/render/geometry-kernel.js';
          const m='DOM_CSS3D_PROJECTED_ENVIRONMENT';
          assert.equal(e.H_EARTH_3D_ENVIRONMENT_PRIMITIVE_PLAN.outputModel,m);
          assert.equal(c.H_EARTH_3D_RENDER_STAGE_LIMITS.permittedOutputModels.includes(m),true);
          assert.equal(e.evaluateHEarth3DEnvironmentCapacityAlignment().eligible,true);
          assert.equal(e.H_EARTH_3D_ENVIRONMENT_PREFLIGHT.eligible,true);
          assert.equal(e.H_EARTH_3D_ENVIRONMENT_RECEIPT.preflightEligible,true);
          const r=p.constructHEarthGroundViewGateBGeometry();
          assert.equal(r.valid,true); assert.equal(r.primitives.length,3);
          assert.equal(r.primitives.every(k.isHEarthNeutralPrimitiveRecord),true);
          assert.equal(r.receipt.physicalVertexCount,2334);
          assert.equal(r.receipt.physicalTriangleCount,4368);
          assert.equal(r.receipt.canonicalSeamUniqueVertexCount,25);
          assert.equal(r.receipt.canonicalSeamUniqueEdgeCount,24);
          assert.equal(r.receipt.vertexBudgetPassed,true);
          assert.equal(p.evaluateHEarthGroundViewGateBDeterminism().passed,true);
          assert.equal(p.H_EARTH_GROUND_VIEW_GATE_B_GEOMETRY_CONTRACT.admissionAuthority,false);
          assert.equal(p.H_EARTH_GROUND_VIEW_GATE_B_GEOMETRY_CONTRACT.frameAuthority,false);
          assert.equal(p.H_EARTH_GROUND_VIEW_GATE_B_GEOMETRY_CONTRACT.compositorAuthority,false);
          assert.equal(p.H_EARTH_GROUND_VIEW_GATE_B_GEOMETRY_CONTRACT.routeAuthority,false);
          assert.equal(p.H_EARTH_GROUND_VIEW_GATE_B_GEOMETRY_CONTRACT.rendererAuthority,false);
          assert.equal(p.H_EARTH_GROUND_VIEW_GATE_B_GEOMETRY_CONTRACT.productionClaim,false);
          NODE
          mapfile -t changed < <(git status --short | awk '{print $2}' | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "$ENVIRONMENT_PATH"
          test "${changed[1]}" = "$PROVIDER_PATH"
          mkdir -p "$RUNNER_TEMP/receipt"
          printf 'environment_sha256=%s\nenvironment_blob=%s\nprovider_sha256=%s\nprovider_blob=%s\nvalidation=PASS\n' \
            "$(sha256sum "$ENVIRONMENT_PATH"|awk '{print $1}')" \
            "$(git hash-object "$ENVIRONMENT_PATH")" \
            "$(sha256sum "$PROVIDER_PATH"|awk '{print $1}')" \
            "$PROVIDER_BLOB" > "$RUNNER_TEMP/receipt/receipt.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ENVIRONMENT_PATH" "$PROVIDER_PATH"
          git commit -m 'Install corrected Gate B environment and exact provider'
          git push origin "HEAD:$TARGET_BRANCH"
      - uses: actions/upload-artifact@v4
        with:
          name: h-earth-gate-b-environment-provider-install-receipt
          path: ${{ runner.temp }}/receipt/receipt.txt
          retention-days: 1
