name: Methods F12 R8C Transform Projection Presentation Separation Verify

on:
  push:
    branches:
      - agent/methods-f12-r8c-transform-projection-presentation-separation-v1

permissions:
  contents: read

jobs:
  verify-r8c-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact terminal R8B parent and frozen boundaries
        shell: bash
        run: |
          set -euo pipefail
          ROOT="control-plane/methods-information-benchmark/f12-recursive-spatial-information-architecture-remediation-v1"
          test "$(git rev-parse HEAD^)" = "d0003cacb20d5f478a3ad0fcb819477b8ca44409"
          test "$(git rev-parse d0003cacb20d5f478a3ad0fcb819477b8ca44409^{tree})" = "215a504d16c57c2ffd79fda96fc5cbe572d0bfe9"
          test "$(git rev-parse HEAD:$ROOT/r8b-system-coordinate-atlas-contract.v1.json)" = "ccbe92dc0f4bcee99a34f17ef9efdfcea4329ccf"
          test "$(git rev-parse HEAD:$ROOT/r8a-canonical-delivery-state-space-contract.v1.json)" = "3f593061fa3d4906c769707904108249943e3826"
          test "$(git rev-parse HEAD:$ROOT/r6-spatial-transformation-grammar-contract.v1.json)" = "6abb8d6b30fc92aa1eaff44ca7f8ec4e567b5938"
          test "$(git rev-parse HEAD:$ROOT/r7-continuity-and-accessibility-contract.v1.json)" = "475aa283c3feb2fb6520f953c0a96d94285bc214"
          test "$(git rev-parse HEAD:$ROOT/f12-r8-r12-continuation-corridor-freeze.v1.json)" = "86ea28520cc4954ab533142fc22abd0cac5a9d9e"

      - name: Verify exact terminal R8C payload blobs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="control-plane/methods-information-benchmark/f12-recursive-spatial-information-architecture-remediation-v1"
          test "$(git rev-parse HEAD:$ROOT/r8c-transform-projection-presentation-separation.v1.json)" = "d0c8441bb88b68b91282ff334270b739305ed97b"
          test "$(git rev-parse HEAD:$ROOT/r8c-transform-projection-presentation-separation.verify.v1.mjs)" = "8fb645b7e98a2bc5164d344ba6eeb6e81342db29"
          node -e "JSON.parse(require('fs').readFileSync('$ROOT/r8c-transform-projection-presentation-separation.v1.json','utf8'))"
          node --check "$ROOT/r8c-transform-projection-presentation-separation.verify.v1.mjs"

      - name: Verify terminal R8C separation contract
        shell: bash
        run: |
          set -euo pipefail
          ROOT="control-plane/methods-information-benchmark/f12-recursive-spatial-information-architecture-remediation-v1"
          node "$ROOT/r8c-transform-projection-presentation-separation.verify.v1.mjs" | tee r8c-transform-projection-presentation-verification.json
          grep -Fq '"status": "PASS_CLOSED"' r8c-transform-projection-presentation-verification.json
          grep -Fq '"separationLaw": "COORDINATE_TRANSITION_NE_PROJECTION_NE_PRESENTATION"' r8c-transform-projection-presentation-verification.json
          grep -Fq '"coordinateTransitionRuntimeConstructed": false' r8c-transform-projection-presentation-verification.json
          grep -Fq '"projectionRuntimeConstructed": false' r8c-transform-projection-presentation-verification.json
          grep -Fq '"presentationRuntimeConstructed": false' r8c-transform-projection-presentation-verification.json
          grep -Fq '"visiblePrototypeConstructed": false' r8c-transform-projection-presentation-verification.json
          grep -Fq '"r8cPassClosed": true' r8c-transform-projection-presentation-verification.json
          grep -Fq '"r8PassClosed": false' r8c-transform-projection-presentation-verification.json
          grep -Fq '"r9Unlock": false' r8c-transform-projection-presentation-verification.json
          grep -Fq '"nextSubcheckpointOnPass": "R8D_DETERMINISTIC_COORDINATE_EMBEDDING_ENGINE"' r8c-transform-projection-presentation-verification.json
          grep -Fq '"r8dEligibility": "ELIGIBLE_READY_FOR_EXECUTION"' r8c-transform-projection-presentation-verification.json

      - name: Prove exact additive R8C terminal diff scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only d0003cacb20d5f478a3ad0fcb819477b8ca44409..HEAD | tee r8c-transform-projection-presentation-changed-paths.txt
          test "$(wc -l < r8c-transform-projection-presentation-changed-paths.txt)" -eq 3
          expected="$(mktemp)"
          cat > "$expected" <<'EOF'
          .github/workflows/methods-f12-r8c-transform-projection-presentation-separation-verify.yml
          control-plane/methods-information-benchmark/f12-recursive-spatial-information-architecture-remediation-v1/r8c-transform-projection-presentation-separation.v1.json
          control-plane/methods-information-benchmark/f12-recursive-spatial-information-architecture-remediation-v1/r8c-transform-projection-presentation-separation.verify.v1.mjs
          EOF
          sed -i 's/^          //' "$expected"
          sort r8c-transform-projection-presentation-changed-paths.txt > actual.sorted
          sort "$expected" > expected.sorted
          diff -u expected.sorted actual.sorted
          test -z "$(git diff --diff-filter=MDR --name-only d0003cacb20d5f478a3ad0fcb819477b8ca44409..HEAD)"

      - name: Preserve terminal R8C contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: methods-f12-r8c-transform-projection-presentation-separation-evidence
          path: |
            control-plane/methods-information-benchmark/f12-recursive-spatial-information-architecture-remediation-v1/r8c-transform-projection-presentation-separation.v1.json
            r8c-transform-projection-presentation-verification.json
            r8c-transform-projection-presentation-changed-paths.txt
