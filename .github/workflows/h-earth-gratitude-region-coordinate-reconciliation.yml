name: H-Earth Gratitude Region Mirror Manor Reconciliation Validation

on:
  pull_request:
    branches:
      - validation/mirror-manor-repaired-harness-base
  workflow_dispatch:

concurrency:
  group: h-earth-gratitude-region-mirror-manor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-mirror-manor-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out H-Earth dependency surface
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            h-earth-3d
            showroom/globe/h-earth
          sparse-checkout-cone-mode: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Execute Mirror Manor reconciliation
        run: |
          set -o pipefail
          node --input-type=module <<'NODE' 2>&1 | tee /tmp/h-earth-gr-cr-mirror-manor.log
          import fs from 'node:fs';
          import { executeGRCRMirrorManorSection } from './h-earth-3d/validation/h-earth.gratitude-region.mirror-manor-reconciliation.mjs';
          const receipt = executeGRCRMirrorManorSection();
          fs.writeFileSync('/tmp/h-earth-gr-cr-mirror-manor-receipt.json', `${JSON.stringify(receipt, null, 2)}\n`);
          console.log(JSON.stringify(receipt));
          if (receipt.eligible !== true || receipt.sectionStatus !== 'PASS_CLOSED') process.exit(1);
          if (receipt.terrainMutation !== false) process.exit(1);
          if (receipt.geometryConstruction !== false) process.exit(1);
          if (receipt.runtimeMutation !== false) process.exit(1);
          if (receipt.gameplayMutation !== false) process.exit(1);
          if (receipt.publicRouteMutation !== false) process.exit(1);
          if (receipt.productionMutation !== false) process.exit(1);
          if (receipt.controllingManifestMutation !== false) process.exit(1);
          NODE

      - name: Upload Mirror Manor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-gratitude-region-mirror-manor-reconciliation-evidence
          path: |
            /tmp/h-earth-gr-cr-mirror-manor.log
            /tmp/h-earth-gr-cr-mirror-manor-receipt.json
          if-no-files-found: warn
          retention-days: 30
