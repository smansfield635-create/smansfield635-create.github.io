              controller,
              '      lawCount: registry.lawRecords.length,\n      lawsPerDirection: 4,',
              '      lawCount: registry.lawRecords.length,\n      nonLawMemberCount: registry.memberRecords.length,\n      totalChildRouteCount: registry.lawRoutes.length + registry.memberRoutes.length,\n      lawsPerDirection: 4,',
              "CONTROLLER_COMPATIBILITY_COUNTS"
          )
          write(path, controller)

          # Crystals: sixteen LAW nodes, eight MEMBER nodes, one equal-phase six-authority field.
          path = "laws/index.crystals.js"
          crystals = read(path)
          crystals = replace_once(
              crystals,
              '    LAW:\n      "law",\n\n    AUXILIARY:',
              '    LAW:\n      "law",\n\n    MEMBER:\n      "member",\n\n    AUXILIARY:',
              "CRYSTALS_MEMBER_NODE_TYPE"
          )
          crystals = sub_once(
              crystals,
              r'      vectors:\n        Object\.freeze\(\{.*?\n        \}\)\n    \}\),',
              '''      vectors:
        Object.freeze({
          flow: Object.freeze([0, 1, 0]),
          integrity: Object.freeze([0.8660254037844386, 0.5, 0]),
          reality: Object.freeze([0.8660254037844386, -0.5, 0]),
          structure: Object.freeze([0, -1, 0]),
          test: Object.freeze([-0.8660254037844386, -0.5, 0]),
          research: Object.freeze([-0.8660254037844386, 0.5, 0])
        })
    }),''',
              "CRYSTALS_EQUAL_PHASE_VECTORS"
          )
          crystals = replace_once(
              crystals,
              '    lawCount:\n      0,\n\n    canonicalSemanticLawCount:',
              '    lawCount:\n      0,\n\n    memberCount:\n      0,\n\n    canonicalSemanticLawCount:',
              "CRYSTALS_RECEIPT_MEMBER_COUNT"
          )
          crystals = replace_once(
              crystals,
              '    canonicalSemanticLawCount:\n      0,\n\n    relocatedCanonicalLawCount:',
              '    canonicalSemanticLawCount:\n      0,\n\n    canonicalSemanticMemberCount:\n      0,\n\n    relocatedCanonicalLawCount:',
              "CRYSTALS_RECEIPT_SEMANTIC_MEMBER_COUNT"
          )
          crystals = replace_once(
              crystals,
              '      "getCanonicalLawRecords",\n      "getCanonicalLawRoutes"',
              '      "getCanonicalLawRecords",\n      "getCanonicalLawRoutes",\n      "getCanonicalMemberRecords",\n      "getCanonicalMemberRoutes"',
              "CRYSTALS_CONTROLLER_MEMBER_SURFACES"
          )
          crystals = replace_once(
              crystals,
              '    invariant(\n      Array.isArray(records) &&\n        records.length === 16,\n      "LAWS_CRYSTALS_CONTROLLER_LAW_REGISTRY_INVALID"\n    );\n\n    return controller;',
              '    invariant(\n      Array.isArray(records) &&\n        records.length === 16,\n      "LAWS_CRYSTALS_CONTROLLER_LAW_REGISTRY_INVALID"\n    );\n\n    const members = controller.getCanonicalMemberRecords();\n    invariant(\n      Array.isArray(members) && members.length === 8,\n      "LAWS_CRYSTALS_CONTROLLER_MEMBER_REGISTRY_INVALID"\n    );\n\n    return controller;',
              "CRYSTALS_CONTROLLER_MEMBER_VALIDATION"
          )
          crystals = replace_once(
              crystals,
              '      "[data-laws-law]",',
              '      "[data-laws-law], [data-laws-member]",',
              "CRYSTALS_CANONICAL_CHILD_SELECTOR"
          )
          crystals = replace_once(
              crystals,
              '               normalizeLawId(\n                 element.dataset.lawId\n               );',
              '               normalizeLawId(\n                 element.dataset.lawId ||\n                 element.dataset.memberId\n               );',
              "CRYSTALS_CHILD_ID"
          )
          crystals = replace_once(
              crystals,
              '                 type:\n                   NODE_TYPES.LAW,',
              '                 type:\n                   element.matches("[data-laws-law]")\n                     ? NODE_TYPES.LAW\n                     : NODE_TYPES.MEMBER,',
              "CRYSTALS_CHILD_NODE_CLASS"
          )
          crystals = replace_once(
              crystals,
              '                   element.dataset.lawLabel ||\n                   element.dataset.label ||',
              '                   element.dataset.memberLabel ||\n                   element.dataset.lawLabel ||\n                   element.dataset.label ||',
              "CRYSTALS_CHILD_LABEL"
          )
          crystals = replace_once(
              crystals,
              '                 meshKey:\n                   `law-${direction}`,',
              '                 meshKey:\n                   element.matches("[data-laws-law]")\n                     ? `law-${direction}`\n                     : `member-${direction}`,',
              "CRYSTALS_CHILD_MESH_KEY"
          )
          crystals = replace_once(
              crystals,
              '    RECEIPT.canonicalSemanticLawCount =\n      lawElements.length;',
              '    RECEIPT.memberCount =\n      Array.from(registry.values())\n        .filter(node => node.type === NODE_TYPES.MEMBER).length;\n\n    RECEIPT.canonicalSemanticLawCount =\n      lawElements.filter(element => element.matches("[data-laws-law]")).length;\n\n    RECEIPT.canonicalSemanticMemberCount =\n      lawElements.filter(element => element.matches("[data-laws-member]")).length;',
              "CRYSTALS_SEMANTIC_COUNTS"
          )
          crystals = replace_once(
              crystals,
              '        node.type === NODE_TYPES.LAW &&\n        node.direction === direction',
              '        (node.type === NODE_TYPES.LAW ||\n         node.type === NODE_TYPES.MEMBER) &&\n        node.direction === direction',
              "CRYSTALS_ACTIVE_CHILD_NODES"
          )
          crystals = replace_once(
              crystals,
              '             node.type === NODE_TYPES.AUXILIARY ||\n             node.type === NODE_TYPES.LAW',
              '             node.type === NODE_TYPES.AUXILIARY ||\n             node.type === NODE_TYPES.LAW ||\n             node.type === NODE_TYPES.MEMBER',
              "CRYSTALS_PROJECT_MEMBER_NODES"
          )
          write(path, crystals)

          # Interactions: index, project, hit-test, and dispatch both child classes.
          path = "laws/index.interactions.js"
          interactions = read(path)
          interactions = replace_once(
              interactions,
              'const VECTOR=Object.freeze({flow:[0,1,0],integrity:[1,0,0],reality:[0,-1,0],structure:[-1,0,0],test:[0.76,0,0.65],research:[-0.76,0,0.65]});',
              'const VECTOR=Object.freeze({flow:[0,1,0],integrity:[0.8660254037844386,0.5,0],reality:[0.8660254037844386,-0.5,0],structure:[0,-1,0],test:[-0.8660254037844386,-0.5,0],research:[-0.8660254037844386,0.5,0]});',
              "INTERACTIONS_EQUAL_PHASE_VECTORS"
          )
          interactions = replace_once(
              interactions,
              'const KIND=Object.freeze({CATEGORY:"category",LAW:"law",AUXILIARY:"auxiliary",COMPASS:"compass",SPACE:"open-space"});',
              'const KIND=Object.freeze({CATEGORY:"category",LAW:"law",MEMBER:"member",AUXILIARY:"auxiliary",COMPASS:"compass",SPACE:"open-space"});',
              "INTERACTIONS_MEMBER_KIND"
          )
          interactions = replace_once(
              interactions,
              '"getCanonicalLawRecords","getCanonicalLawRoutes","subscribeFrameState"',
              '"getCanonicalLawRecords","getCanonicalLawRoutes","getCanonicalMemberRecords","getCanonicalMemberRoutes","subscribeFrameState"',
              "INTERACTIONS_MEMBER_REGISTRY_SURFACES"
          )
          interactions = replace_once(
              interactions,
              '"requestCategorySelection","requestLawSelection","requestAuxiliarySelection"',
              '"requestCategorySelection","requestLawSelection","requestMemberSelection","requestAuxiliarySelection"',
              "INTERACTIONS_MEMBER_SELECTION_SURFACE"
          )
          interactions = replace_once(
              interactions,
              'const lawRecord=r=>recordKind(r)==="law";\n  const auxiliaryRecord',
              'const lawRecord=r=>recordKind(r)===KIND.LAW;\n  const memberRecord=r=>recordKind(r)===KIND.MEMBER;\n  const auxiliaryRecord',
              "INTERACTIONS_MEMBER_RECORD"
          )
          interactions = replace_once(
              interactions,
              'S.controls.get(controlKey(KIND.CATEGORY,r.id))||S.controls.get(controlKey(KIND.AUXILIARY,r.id))',
              'S.controls.get(controlKey(KIND.CATEGORY,r.id))||S.controls.get(controlKey(KIND.MEMBER,r.id))||S.controls.get(controlKey(KIND.AUXILIARY,r.id))',
              "INTERACTIONS_MEMBER_CONTROL_LOOKUP"
          )
          interactions = replace_once(
              interactions,
              'r.id||r.lawId||r.direction',
              'r.id||r.memberId||r.lawId||r.direction',
              "INTERACTIONS_MEMBER_PROJECTION_ID"
          )
          interactions = replace_once(
              interactions,
              'S.root.querySelectorAll("[data-laws-category], [data-laws-law], [data-laws-auxiliary]")',
              'S.root.querySelectorAll("[data-laws-category], [data-laws-law], [data-laws-member], [data-laws-auxiliary]")',
              "INTERACTIONS_CONTROL_SELECTOR"
          )
          interactions = replace_once(
              interactions,
              'if(el.matches("[data-laws-law]")){const id=text(el.dataset.lawId);if(id)S.controls.set(controlKey(KIND.LAW,id),el);}else if(el.matches("[data-laws-auxiliary]"))',
              'if(el.matches("[data-laws-law]")){const id=text(el.dataset.lawId);if(id)S.controls.set(controlKey(KIND.LAW,id),el);}else if(el.matches("[data-laws-member]")){const id=text(el.dataset.memberId);if(id)S.controls.set(controlKey(KIND.MEMBER,id),el);}else if(el.matches("[data-laws-auxiliary]"))',
              "INTERACTIONS_MEMBER_CONTROL_INDEX"
          )
          interactions = replace_once(
              interactions,
              'S.root.querySelectorAll("[data-laws-law][data-law-id]")',
              'S.root.querySelectorAll("[data-laws-law][data-law-id], [data-laws-member][data-member-id]")',
              "INTERACTIONS_CHILD_LABEL_SELECTOR"
          )
          interactions = replace_once(
              interactions,
              'const id=text(control.dataset.lawId);',
              'const id=text(control.dataset.lawId||control.dataset.memberId);',
              "INTERACTIONS_CHILD_LABEL_ID"
          )
          interactions = replace_once(
              interactions,
              'control.dataset.lawLabel||control.dataset.label||id',
              'control.dataset.memberLabel||control.dataset.lawLabel||control.dataset.label||id',
              "INTERACTIONS_CHILD_LABEL_TEXT"
          )
          interactions = replace_once(
              interactions,
              'm===MODE.CLUSTER?`[data-laws-law][data-law-id="${escapeCss(primary)}"]`',
              'm===MODE.CLUSTER?`[data-laws-law][data-law-id="${escapeCss(primary)}"], [data-laws-member][data-member-id="${escapeCss(primary)}"]`',
              "INTERACTIONS_PRIMARY_CHILD_SELECTOR"
          )
          interactions = replace_once(
              interactions,
              'const active=activeDirection(),lawById=new Map(S.projections.filter(lawRecord).map(r=>[r.id,r]));',
              'const active=activeDirection(),lawById=new Map(S.projections.filter(r=>lawRecord(r)||memberRecord(r)).map(r=>[r.id,r]));',
              "INTERACTIONS_CHILD_PROJECTION_MAP"
          )
          interactions = replace_once(
              interactions,
              'const control=S.controls.get(controlKey(KIND.LAW,id)),r=lawById.get(id);',
              'const control=S.controls.get(controlKey(KIND.LAW,id))||S.controls.get(controlKey(KIND.MEMBER,id)),r=lawById.get(id);',
              "INTERACTIONS_CHILD_LABEL_CONTROL"
          )
          interactions = replace_once(
              interactions,
              'text(r?.lawId||r?.id)',
              'text(r?.memberId||r?.lawId||r?.id)',
              "INTERACTIONS_CHILD_CANONICAL_ID"
          )
          interactions = replace_once(
              interactions,
              'const cat=categoryRecord(r),law=lawRecord(r),aux=auxiliaryRecord(r);if(m===MODE.CONSTELLATION&&!(cat||aux))continue;if(m===MODE.CLUSTER&&!law)continue;if(law&&dir&&direction(lawCanonical(r.id)?.direction)!==dir)continue;const z=radius(r),d=dist(point.x,point.y,r.x,r.y),p=priority(r),kind=law?KIND.LAW:aux?KIND.AUXILIARY:KIND.CATEGORY;',
              'const cat=categoryRecord(r),law=lawRecord(r),member=memberRecord(r),child=law||member,aux=auxiliaryRecord(r);if(m===MODE.CONSTELLATION&&!(cat||aux))continue;if(m===MODE.CLUSTER&&!child)continue;if(child&&dir&&direction(lawCanonical(r.id)?.direction)!==dir)continue;const z=radius(r),d=dist(point.x,point.y,r.x,r.y),p=priority(r),kind=law?KIND.LAW:member?KIND.MEMBER:aux?KIND.AUXILIARY:KIND.CATEGORY;',
              "INTERACTIONS_MEMBER_CRYSTAL_HIT"
          )
          interactions = replace_once(
              interactions,
              'if(el?.matches("[data-laws-law]"))return{kind:KIND.LAW,id:text(el.dataset.lawId)};',
              'if(el?.matches("[data-laws-law]"))return{kind:KIND.LAW,id:text(el.dataset.lawId)};if(el?.matches("[data-laws-member]"))return{kind:KIND.MEMBER,id:text(el.dataset.memberId)};',
              "INTERACTIONS_MEMBER_IDENTITY"
          )
          interactions = interactions.replace(
              '[data-laws-projected-category-label], [data-laws-law], [data-laws-auxiliary], [data-laws-category], [data-upstream-compass-control]',
              '[data-laws-projected-category-label], [data-laws-law], [data-laws-member], [data-laws-auxiliary], [data-laws-category], [data-upstream-compass-control]'
          )
          interactions = replace_once(
              interactions,
              'x.kind===KIND.LAW?lawRecord(v)&&v.id===x.id:x.kind===KIND.AUXILIARY?',
              'x.kind===KIND.LAW?lawRecord(v)&&v.id===x.id:x.kind===KIND.MEMBER?memberRecord(v)&&v.id===x.id:x.kind===KIND.AUXILIARY?',
              "INTERACTIONS_MEMBER_SEMANTIC_RECORD"
          )
          interactions = replace_once(
              interactions,
              'if(t.kind===KIND.LAW)return S.controller.requestLawSelection(t.id)!==false;if(t.kind===KIND.AUXILIARY)',
              'if(t.kind===KIND.LAW)return S.controller.requestLawSelection(t.id)!==false;if(t.kind===KIND.MEMBER)return S.controller.requestMemberSelection(t.id)!==false;if(t.kind===KIND.AUXILIARY)',
              "INTERACTIONS_MEMBER_DISPATCH"
          )
          interactions = replace_once(
              interactions,
              'if(c.getCanonicalLawRecords().length!==24||c.getCanonicalLawRoutes().length!==24)throw Error("LAWS_INTERACTIONS_CANONICAL_REGISTRY_INVALID");',
              'if(c.getCanonicalLawRecords().length!==16||c.getCanonicalLawRoutes().length!==16||c.getCanonicalMemberRecords().length!==8||c.getCanonicalMemberRoutes().length!==8)throw Error("LAWS_INTERACTIONS_CANONICAL_REGISTRY_INVALID");',
              "INTERACTIONS_REGISTRY_COUNTS"
          )
          interactions = replace_once(
              interactions,
              'S.laws=Object.freeze(Array.from(S.controller.getCanonicalLawRecords()||[]));',
              'S.laws=Object.freeze([...Array.from(S.controller.getCanonicalLawRecords()||[]),...Array.from(S.controller.getCanonicalMemberRecords()||[])]);',
              "INTERACTIONS_COMBINED_CHILD_REGISTRY"
          )
          write(path, interactions)

          # CSS: semantic-hook parity only; no visual redesign.
          path = "laws/index.css"
          css = read(path)
          css = css.replace(
              "[data-laws-law-control]",
              ":is([data-laws-law-control], [data-laws-member-control])"
          )
          css = css.replace(
              "[data-laws-law]",
              ":is([data-laws-law], [data-laws-member])"
          )
          if "[data-laws-member]" not in css:
              raise RuntimeError("CSS_MEMBER_HOOK_NOT_INSTALLED")
          write(path, css)

          # Final source invariants before committing.
          html = read("laws/index.html")
          if len(re.findall(r'\bdata-laws-law(?:\s|=|>)', html)) != 16:
              raise RuntimeError("FINAL_HTML_LAW_COUNT_INVALID")
          if len(re.findall(r'\bdata-laws-member(?:\s|=|>)', html)) != 8:
              raise RuntimeError("FINAL_HTML_MEMBER_COUNT_INVALID")
          if len(re.findall(r'\bdata-laws-category(?:\s|=|>)', html)) != 6:
              raise RuntimeError("FINAL_HTML_AUTHORITY_COUNT_INVALID")
          if html.count('data-route=') < 24:
              raise RuntimeError("FINAL_HTML_ROUTE_COUNT_INVALID")
          PY

      - name: Validate corrected JavaScript syntax
        run: |
          node --check laws/index.controller.js
          node --check laws/index.crystals.js
          node --check laws/index.interactions.js

      - name: Commit bounded correction and remove one-run workflow
        shell: bash
        run: |
          rm .github/workflows/laws-checkpoint3-bounded-product-correction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add laws/index.html laws/index.controller.js laws/index.crystals.js laws/index.interactions.js laws/index.css .github/workflows/laws-checkpoint3-bounded-product-correction.yml
          git commit -m "Checkpoint 3: separate Law and non-Law cluster members"
          git push origin HEAD:agent/laws-compass-checkpoint-2-bounded-construction-002
