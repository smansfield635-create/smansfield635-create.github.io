name: Temporary Showroom Label Hierarchy Applicator

on:
  pull_request:
    branches:
      - agent/laws-showroom-label-visibility-cp1-001
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: showroom-label-hierarchy-applicator
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/laws-showroom-label-visibility-executor-001'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout bounded target branch
        uses: actions/checkout@v4
        with:
          ref: agent/laws-showroom-label-visibility-cp1-001
          fetch-depth: 0

      - name: Apply bounded Showroom label correction
        run: python3 verification/showroom-label-correction/apply-showroom-label-hierarchy.py

      - name: Normalize generated benchmark and isolate workflow mutations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          benchmark = Path('verification/benchmark-tools/four-compass-benchmark-v1/showroom-label-conformance-benchmark.mjs')
          text = benchmark.read_text(encoding='utf-8')
          if text.startswith('\\\n'):
              benchmark.write_text(text[2:], encoding='utf-8')
          PY
          git checkout -- .github/workflows/showroom-label-hierarchy-applicator.yml
          rm -f .github/workflows/showroom-label-conformance-benchmark.yml
          rm -f .github/workflows/showroom-four-compass-exact-head-regression.yml

      - name: Validate syntax and bounded non-workflow candidate
        run: |
          node --check showroom/index.interactions.js
          node --check verification/benchmark-tools/four-compass-benchmark-v1/showroom-label-conformance-benchmark.mjs
          test ! -e verification/showroom-label-correction/apply-showroom-label-hierarchy.py
          test -e .github/workflows/showroom-label-hierarchy-applicator.yml
          test ! -e .github/workflows/showroom-label-conformance-benchmark.yml
          test ! -e .github/workflows/showroom-four-compass-exact-head-regression.yml
          git diff --check

      - name: Commit exact bounded non-workflow candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Showroom label hierarchy and primary-only cluster label"
          git push origin HEAD:agent/laws-showroom-label-visibility-cp1-001
