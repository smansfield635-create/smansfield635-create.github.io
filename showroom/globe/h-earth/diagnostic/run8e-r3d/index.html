<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>H-Earth Run 8E R3D · Direct GPU Interaction</title>
  <style>
    :root { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #e7f1ef; background: #071115; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 18px; background: radial-gradient(circle at top, #102831, #071115 62%); }
    main { width: min(100%, 760px); margin: 0 auto; }
    h1 { font-size: 1rem; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 10px; }
    #r3d-status { margin: 0 0 12px; color: #b8d7d0; }
    .stage { border: 1px solid #31545b; border-radius: 12px; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: auto; touch-action: none; background: #000; }
    pre { margin: 14px 0 0; padding: 12px; max-height: 340px; overflow: auto; white-space: pre-wrap; border: 1px solid #243f45; border-radius: 10px; background: #09191e; font-size: .72rem; line-height: 1.35; }
    .law { margin-top: 10px; color: #8eb2aa; font-size: .75rem; }
  </style>
</head>
<body>
  <main>
    <h1>Run 8E R3D · Diagnostic Direct GPU Interaction</h1>
    <p id="r3d-status">Loading…</p>
    <div class="stage">
      <canvas id="r3d-canvas" aria-label="Interactive H-Earth WebGL2 diagnostic frame"></canvas>
    </div>
    <p class="law">One finger: look · Two fingers: travel · Pinch: zoom · Wheel: fallback. No bitmap preview or deferred CPU raster commit.</p>
    <pre id="r3d-metrics"></pre>
  </main>
  <script type="module" src="./direct-interaction.js"></script>
</body>
</html>
