name: Compass Brain V9 Publication — Retired Compatibility Notice

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Record canonical publication path
        run: |
          echo 'COMPASS_BRAIN_V9_SPECIALIZED_AUTOPUBLISH=RETIRED'
          echo 'Production publication authority is Exact Head Pages Deploy v3.'
          echo 'Use .github/workflows/pages-exact-head-deploy-v3.yml with an admitted exact head and registered Brain surface.'
          echo 'This compatibility workflow performs no deployment and creates no publication authority.'
