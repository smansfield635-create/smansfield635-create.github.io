name: Laws Experiential Restoration Geometry Probe

on:
  push:
    branches:
      - agent/laws-experiential-architecture-restoration-001
    paths:
      - '.github/workflows/laws-experiential-restoration-materialize.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/laws-experiential-restoration-materialize.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laws-experiential-restoration-geometry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXECUTION_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  EXPECTED_MAIN_BASE: ef2ffdb1da7911238652f076a6b44326061493ef
  BASE_URL: http://127.0.0.1:4173
  EVIDENCE_DIR: artifacts/laws-experiential-restoration/interaction-diagnostic

jobs:
  geometry-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXECUTION_COMMIT }}
          fetch-depth: 0

      - name: Lock exact checkout and product hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXECUTION_COMMIT"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_BASE"
          test "$(git merge-base origin/main HEAD)" = "$EXPECTED_MAIN_BASE"
          echo '8fff5010933b90ffd396fddab393fb4044954b1b2838299b2a454f598c246854  laws/index.html' | sha256sum --check --strict
          echo '4a48242720d7f42dcf582ff910766882091c1b00a0ad3fad72807d5a5090d196  laws/index.experience.css' | sha256sum --check --strict
          echo 'e5a289b9e6792f7549be7797880ffe6911a6fea3e4f5e02b48ada1b71158a59f  laws/index.experience.polish.css' | sha256sum --check --strict
          echo '2722d0f4da22b07d40fb2ecd14eea0d07c9bb21181013352136800a4934a9062  laws/index.experience.js' | sha256sum --check --strict

      - name: Install pinned browser verifier
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start exact candidate server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/laws-geometry-server.log 2>&1 &
          for attempt in $(seq 1 50); do
            curl --fail --silent http://127.0.0.1:4173/laws/ > /dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Record scene and projected-label geometry
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          printf '{"contract":"LAWS_GEOMETRY_PROBE_BOOTSTRAP_v1","head":"%s","status":"NODE_NOT_STARTED"}\n' "$EXECUTION_COMMIT" > "$EVIDENCE_DIR/geometry-probe.json"
          cat > tools/.laws-geometry-probe.mjs <<'JS'
          import fs from "node:fs/promises";
          import { chromium } from "playwright";

          const output = `${process.env.EVIDENCE_DIR}/geometry-probe.json`;
          const receipt = {
            contract: "LAWS_EXPERIENTIAL_RESTORATION_GEOMETRY_PROBE_v1",
            head: process.env.EXECUTION_COMMIT,
            status: "STARTED",
            initial: null,
            centered: null,
            error: null
          };
          const persist = () => fs.writeFile(output, `${JSON.stringify(receipt, null, 2)}\n`, "utf8");
          await persist();

          const snapshot = () => {
            const root = document.querySelector("[data-laws-root]");
            const scene = document.querySelector("[data-laws-scene-field]");
            const visibleId = root?.dataset.lawsVisibleOuterAuthorityLabelId || "";
            const label = document.querySelector(`[data-laws-projected-category-label="${visibleId}"]`);
            const sceneRect = scene?.getBoundingClientRect();
            const labelRect = label?.getBoundingClientRect();
            const point = labelRect ? {
              x: labelRect.left + labelRect.width / 2,
              y: labelRect.top + labelRect.height / 2
            } : null;
            const top = point && point.x >= 0 && point.y >= 0 && point.x < innerWidth && point.y < innerHeight
              ? document.elementFromPoint(point.x, point.y) : null;
            return {
              scrollY,
              viewport: { width: innerWidth, height: innerHeight },
              controllerStatus: root?.dataset.lawsControllerStatus || "",
              interactionsStatus: root?.dataset.lawsInteractionsStatus || "",
              visibleId,
              sceneRect: sceneRect ? {
                left: sceneRect.left, top: sceneRect.top, right: sceneRect.right,
                bottom: sceneRect.bottom, width: sceneRect.width, height: sceneRect.height
              } : null,
              labelRect: labelRect ? {
                left: labelRect.left, top: labelRect.top, right: labelRect.right,
                bottom: labelRect.bottom, width: labelRect.width, height: labelRect.height
              } : null,
              centerPoint: point,
              centerInViewport: Boolean(point && point.x >= 0 && point.y >= 0 && point.x < innerWidth && point.y < innerHeight),
              centerTopTag: top?.tagName || "",
              centerTopClass: typeof top?.className === "string" ? top.className : "",
              centerOwnedByVisibleLabel: Boolean(top?.closest?.(`[data-laws-projected-category-label="${visibleId}"]`))
            };
          };

          let browser;
          try {
            browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              isMobile: true,
              hasTouch: true,
              deviceScaleFactor: 1
            });
            const page = await context.newPage();
            await page.goto(`${process.env.BASE_URL}/laws/`, { waitUntil: "networkidle" });
            await page.waitForFunction(() => {
              const root = document.querySelector("[data-laws-root]");
              return Boolean(globalThis.DGB_LAWS_CONTROLLER && globalThis.DGB_LAWS_EXPERIENCE && globalThis.DGBLawsStagedLoader) &&
                root?.dataset.lawsControllerStatus === "available";
            }, null, { timeout: 30000 });
            await page.evaluate(() => globalThis.DGB_LAWS_EXPERIENCE.requestCompassRuntimePreload());
            await page.waitForFunction(() => {
              const root = document.querySelector("[data-laws-root]");
              return Boolean(globalThis.DGB_LAWS_INTERACTIONS) && root?.dataset.lawsInteractionsStatus === "available";
            }, null, { timeout: 30000 });
            receipt.initial = await page.evaluate(snapshot);
            await page.evaluate(() => document.querySelector("[data-laws-scene-field]")?.scrollIntoView({
              block: "center", inline: "nearest", behavior: "instant"
            }));
            await page.waitForTimeout(500);
            receipt.centered = await page.evaluate(snapshot);
            receipt.status = "COMPLETE";
            await context.close();
          } catch (error) {
            receipt.status = "ERROR";
            receipt.error = { message: error.message, stack: error.stack || "" };
          } finally {
            await persist();
            if (browser) await browser.close();
          }
          if (receipt.status !== "COMPLETE") process.exitCode = 1;
          JS
          set +e
          node tools/.laws-geometry-probe.mjs > "$EVIDENCE_DIR/node-output.log" 2>&1
          status=$?
          set -e
          rm -f tools/.laws-geometry-probe.mjs
          exit $status

      - name: Upload geometry probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laws-geometry-probe-${{ env.EXECUTION_COMMIT }}
          path: |
            artifacts/laws-experiential-restoration/interaction-diagnostic/**
            /tmp/laws-geometry-server.log
          if-no-files-found: error
          retention-days: 30
