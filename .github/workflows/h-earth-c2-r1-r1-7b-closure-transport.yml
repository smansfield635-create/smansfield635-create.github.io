          entry.update({'status':'PASS_CLOSED_DO_NOT_REOPEN','passingExecutionHead':base,'durableClosureHead':'COMMIT_CONTAINING_THIS_RECORD','closedRollbackBranch':'rollback/h-earth-c2-r1-r1-7b-closed-001','workflow':{'run':30679342931,'job':91313062274,'artifactId':8811649872,'artifactDigest':'sha256:6516110abe68a14160b64b4dbc0ed5dd3996128260806d4c21f773edb82b9ae4','result':'PASS','dispositionAfterClosure':'MANUAL_ONLY'},'registryPreflight':'PASS','representativeEngineeringCaptureCount':3,'firstBlocker':None})
          ledger['currentSubcheckpoint']='R1.7C_MINIMAL_CANDIDATE_RENDERER_SAMPLING_INTEGRATION'
          ledger['nextAuthorizedSubcheckpoint']='R1.7C_MINIMAL_CANDIDATE_RENDERER_SAMPLING_INTEGRATION'
          program_path.write_text(json.dumps(program,indent=2)+'\n'); ledger_path.write_text(json.dumps(ledger,indent=2)+'\n')

          exact_files={'h-earth.c2-r1.r1-7b-verification.json':{'sha256':hashlib.sha256(receipt_text.encode()).hexdigest()}}
          for name in projections:
              exact_files[f'r1-7b-engineering-captures/{name}']={'sha256':projections[name]['sourceSha256']}
          manifest={'manifestType':'H_EARTH_C2_R1_R1_7B_EVIDENCE_MANIFEST_v1','operation':'R1.7B_BOUNDED_BAKED_MACRO_CONTROL_FIELD','status':'PASS_ENGINEERING_DURABLE_CLOSURE_COMMITTED','startingHead':'0498da0f3f4fe522659830499bd55ef8f018f776','passingExecutionHead':base,'durableClosureHead':'COMMIT_CONTAINING_THIS_RECORD','startRollbackBranch':'rollback/h-earth-c2-r1-r1-7b-start-001','closedRollbackBranch':'rollback/h-earth-c2-r1-r1-7b-closed-001','workflow':{'runId':30679342931,'jobId':91313062274,'result':'PASS','artifactId':8811649872,'artifactName':'h-earth-c2-r1-r1-7b-engineering-evidence','artifactDigest':'sha256:6516110abe68a14160b64b4dbc0ed5dd3996128260806d4c21f773edb82b9ae4','artifactSizeBytes':32980},'exactWorkflowArtifactFiles':exact_files,'durableRepositoryProjections':{name:{'projection':'DOCUMENTED_DOWNSAMPLED_5_BY_10_PROJECTION_OF_EXACT_WORKFLOW_CAPTURE',**meta} for name,meta in projections.items()},'implementationBlobs':{'.github/workflows/h-earth-c2-r1-r1-7b-baked-macro-control-field.yml':git_blob(workflow.encode()),'h-earth-3d/control-plane/coastal-morphology/c2-r1/h-earth.c2-r1.baked-macro-control-field.js':'a97b3df57ae01626a2ff5cbedf510e2afdf06912','h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.r1-7b-baked-macro-control-field.mjs':'74b6c1b4b9f69a7ff56cc58467c99168fbc5f959','h-earth-3d/control-plane/coastal-morphology/c2-r1/tools/h-earth.c2-r1.r1-7b-bake-macro-control-field.mjs':'d9dac1e6e14e956432d8d9122a4c9b498cb0a3dc'},'immutableUpstreamBlobs':receipt['metrics']['immutableUpstreamBlobs'],'fieldValuesSha256':'4377ff9e9fc60a6218478b289acbff99075eab08d4e518a6eb68b1a12b98f866','representativeEngineeringCaptureCount':3,'capturePurpose':'ENGINEERING_BAKED_FIELD_CORRESPONDENCE_CONTINUITY_AND_COASTAL_PRESERVATION_ONLY','bakedMacroControlFieldCreated':True,'rendererSamplingIntegrationCreated':False,'wholeWorldBakeCreated':False,'upstreamAuthoritiesUnchanged':True,'productDefaultMutated':False,'publicRouteMutated':False,'visualSuccessorStatus':'NOT_ESTABLISHED','userDifferentialReady':False}
          (ev/'h-earth.c2-r1.r1-7b-evidence-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY

          rm .github/workflows/h-earth-c2-r1-r1-7b-closure-transport.yml

      - name: Enforce exact eight-path closure boundary and commit
        run: |
          cat > /tmp/expected <<'EOF'
          .github/workflows/h-earth-c2-r1-r1-7b-baked-macro-control-field.yml
          h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/h-earth.c2-r1.r1-7b-evidence-manifest.json
          h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/h-earth.c2-r1.r1-7b-verification.json
          h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/r1-7b-engineering-captures/h-earth.c2-r1.r1-7b-albedo-roughness.svg
          h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/r1-7b-engineering-captures/h-earth.c2-r1.r1-7b-cavity-normal.svg
          h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/r1-7b-engineering-captures/h-earth.c2-r1.r1-7b-coastal-preservation.svg
