name: Compass Gen1538 Display Continuity

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/compass/**'
      - '.github/ai-router/projects/compass/verify-display-continuity.v1.mjs'
      - '.github/ai-router/projects/compass/verify-performance-successor.mjs'
      - '.github/workflows/compass-display-continuity-validation.yml'
      - '.github/workflows/compass-performance-successor-validation.yml'
      - '.github/workflows/compass-carousel-successor-live-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPASS_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  COMPASS_SCOPE_BASE_SHA: 21ee87e945a62492b8f9447a5049f4ae0ab1ceb9
  COMPASS_VERIFICATION_OUTPUT: /tmp/compass-gen1538-display.json
  COMPASS_PERFORMANCE_OUTPUT: /tmp/compass-gen1538-performance.json

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMPASS_CANDIDATE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Gen1538 exact-head contracts
        run: |
          test "$(git rev-parse HEAD^{commit})" = "$COMPASS_CANDIDATE_HEAD"
          node --check assets/compass/compass.capability-carousel.js
          node --check assets/compass/compass.house-scene.js
          node .github/ai-router/projects/compass/verify-display-continuity.v1.mjs
          node .github/ai-router/projects/compass/verify-performance-successor.mjs
          jq -e '.result == "PASS_CLOSED" and .lockGeneration == 1537 and .candidate == env.COMPASS_CANDIDATE_HEAD' /tmp/compass-gen1538-display.json >/dev/null
          jq -e '.result == "PASS_CLOSED" and .lockGeneration == 1537 and .candidate == env.COMPASS_CANDIDATE_HEAD' /tmp/compass-gen1538-performance.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-gen1538-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/compass-gen1538-display.json
            /tmp/compass-gen1538-performance.json
          retention-days: 90

  owner-evidence:
    runs-on: ubuntu-latest
    needs: static-contract
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMPASS_CANDIDATE_HEAD }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Host exact candidate
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/compass-gen1538-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Capture Gen1538 owner evidence
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true}),checks=[];const check=(id,pass,evidence)=>checks.push({id,pass:Boolean(pass),evidence});
          try{for(const [name,width,height] of [['desktop',1440,900],['tablet',820,1180],['phone',390,844],['phone-tall',430,932]]){const context=await browser.newContext({viewport:{width,height}}),page=await context.newPage(),errors=[];page.on('pageerror',e=>errors.push(String(e)));await page.goto(`http://127.0.0.1:4173/?candidate=${process.env.COMPASS_CANDIDATE_HEAD}&display=${name}`,{waitUntil:'domcontentloaded',timeout:30000});await page.waitForFunction(()=>globalThis.CompassEditorialCarousel?.version==='gen1538-reference-recovery-v1');await page.waitForFunction(()=>Boolean(document.querySelector('[data-capability-orbit]')));await page.waitForTimeout(900);const state=await page.evaluate(()=>{const root=document.querySelector('[data-compass-root]'),stage=document.querySelector('[data-capability-orbit]'),house=document.querySelector('[data-capability="house"]'),proof=document.querySelector('[data-proof-orbit]');return{central:document.querySelectorAll('[data-gen1537-compass-instrument]').length,gen1537Recovery:globalThis.DGB_COMPASS_GEN1537_LIVE_RECOVERY?.version||'',mirrorland:root?.dataset.gen1538Mirrorland||'',cards:stage?.querySelectorAll('[data-capability]').length||0,houseGuides:house?.querySelectorAll('[data-house-function]').length||0,houseCanvas:Boolean(house?.querySelector('[data-gen1538-house-canvas]')),proofCards:proof?.querySelectorAll('[data-proof-card]').length||0,overflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth,architecture:root?.dataset.gen1538Architecture||''}});check(`${name}_NO_CENTRAL_COMPASS`,state.central===0,state);check(`${name}_CONSTELLATION_ARCHITECTURE`,state.architecture==='AUG14_CONSTELLATION_AUTHORITY_RECOVERED',state);check(`${name}_MIRRORLAND_PROTECTED`,state.mirrorland==='protected',state);check(`${name}_CAPABILITY_THREE_OBJECTS`,state.cards===3&&state.houseGuides===3&&state.houseCanvas,state);check(`${name}_TRL7_CAROUSEL_PRESERVED`,state.proofCards===3,state);check(`${name}_NO_OVERFLOW`,state.overflow<=2,state.overflow);check(`${name}_NO_ERRORS`,errors.length===0,errors);await page.screenshot({path:`/tmp/compass-gen1538-owner-${name}.png`,fullPage:true});await context.close()}}finally{await browser.close()}
          const failures=checks.filter(x=>!x.pass),receipt={schema:'COMPASS_GEN1538_OWNER_DISPLAY_EVIDENCE_RECEIPT_v1',operationId:'COMPASS_GEN1538_REFERENCE_ARCHITECTURE_RECOVERY_AND_CAROUSEL_CONTINUITY_20260818_005',lockGeneration:1537,candidateHead:process.env.COMPASS_CANDIDATE_HEAD,result:failures.length?'FAIL_CLOSED':'PASS_CLOSED',checks,failures:failures.map(x=>x.id)};fs.writeFileSync('/tmp/compass-gen1538-owner-display.json',JSON.stringify(receipt,null,2)+'\n');console.log(JSON.stringify(receipt,null,2));if(failures.length)process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-gen1538-owner-display-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/compass-gen1538-owner-display.json
            /tmp/compass-gen1538-owner-*.png
            /tmp/compass-gen1538-http.log
          retention-days: 90
