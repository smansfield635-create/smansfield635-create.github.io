name: H-Earth Map-Wide Environment Redevelopment Builder + Fresh Role 3

on:
  push:
    branches:
      - verification/h-earth-map-wide-environment-redevelopment-builder-role3-001
    paths:
      - .github/workflows/h-earth-map-wide-environment-redevelopment-builder-role3-carrier.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: h-earth-map-wide-environment-redevelopment-builder-role3-001
  cancel-in-progress: false

env:
  GOVERNING_MAIN: 3f51f0cd159df33571905c6cb14253ebdd137e3b
  CANDIDATE_HEAD: 2b8061d61d852f920036ff5254f0cb69914399c5
  CONSTRUCTION_OPERATION: H_EARTH_MAP_WIDE_ENVIRONMENT_REDEVELOPMENT_v1
  CONSTRUCTION_LOCK_GENERATION: '422'
  CARRIER_LOCK_GENERATION: '423'
  CARRIER_SCOPE_HASH: aa22e34651773ea77af5f8460bd598e248bc6178808c87ef417f649adc7d14b7
  VERIFY_PATH: h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/terrain-estate-construction-v1/verify.v1.mjs

jobs:
  builder-and-fresh-role3:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact Builder candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind exact candidate and governing ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_HEAD"
          test "$(git -C candidate merge-base "$GOVERNING_MAIN" "$CANDIDATE_HEAD")" = "$GOVERNING_MAIN"
          test -z "$(git -C candidate status --porcelain=v1 --untracked-files=all)"
          test -f "candidate/$VERIFY_PATH"

      - name: Run Builder exact verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/h-earth-map-wide-environment-redevelopment-builder-role3/builder"
          (
            cd candidate
            node "$VERIFY_PATH" \
              --output "$RUNNER_TEMP/h-earth-map-wide-environment-redevelopment-builder-role3/builder"
          ) | tee "$RUNNER_TEMP/h-earth-map-wide-environment-redevelopment-builder-role3/builder/stdout.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = process.env.RUNNER_TEMP + '/h-earth-map-wide-environment-redevelopment-builder-role3/builder';
          const receipt = JSON.parse(fs.readFileSync(root + '/builder.verification-receipt.v1.json', 'utf8'));
          if (receipt.result !== 'PASS') throw new Error(`BUILDER_NOT_PASS:${JSON.stringify(receipt.issues)}`);
          if (receipt.candidateHead !== process.env.CANDIDATE_HEAD) throw new Error('BUILDER_CANDIDATE_HEAD_MISMATCH');
          if (receipt.exactPathCount !== 28 || receipt.changedPathCount !== 28) throw new Error('BUILDER_PATH_COUNT_MISMATCH');
          if (!receipt.constructionFingerprint) throw new Error('BUILDER_FINGERPRINT_MISSING');
          NODE

      - name: Check out exact candidate independently for fresh Role 3
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0
          persist-credentials: false
          path: fresh-role3

      - name: Require fresh independent checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C fresh-role3 rev-parse HEAD)" = "$CANDIDATE_HEAD"
          test "$(git -C fresh-role3 merge-base "$GOVERNING_MAIN" "$CANDIDATE_HEAD")" = "$GOVERNING_MAIN"
          test -z "$(git -C fresh-role3 status --porcelain=v1 --untracked-files=all)"

      - name: Run fresh Role 3 verifier without repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/h-earth-map-wide-environment-redevelopment-builder-role3/role3"
          (
            cd fresh-role3
            node "$VERIFY_PATH" \
              --role ROLE_3 \
              --output "$RUNNER_TEMP/h-earth-map-wide-environment-redevelopment-builder-role3/role3"
          ) | tee "$RUNNER_TEMP/h-earth-map-wide-environment-redevelopment-builder-role3/role3/stdout.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = process.env.RUNNER_TEMP + '/h-earth-map-wide-environment-redevelopment-builder-role3/role3';
          const receipt = JSON.parse(fs.readFileSync(root + '/role-3.verification-receipt.v1.json', 'utf8'));
          if (receipt.result !== 'PASS') throw new Error(`ROLE3_NOT_PASS:${JSON.stringify(receipt.issues)}`);
          if (receipt.candidateHead !== process.env.CANDIDATE_HEAD) throw new Error('ROLE3_CANDIDATE_HEAD_MISMATCH');
          if (receipt.exactPathCount !== 28 || receipt.changedPathCount !== 28) throw new Error('ROLE3_PATH_COUNT_MISMATCH');
          if (!receipt.constructionFingerprint) throw new Error('ROLE3_FINGERPRINT_MISSING');
          NODE

      - name: Require deterministic Builder and Role 3 equality
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const root = process.env.RUNNER_TEMP + '/h-earth-map-wide-environment-redevelopment-builder-role3';
          const builder = JSON.parse(fs.readFileSync(root + '/builder/builder.verification-receipt.v1.json', 'utf8'));
          const role3 = JSON.parse(fs.readFileSync(root + '/role3/role-3.verification-receipt.v1.json', 'utf8'));
          if (builder.constructionFingerprint !== role3.constructionFingerprint) {
            throw new Error('CONSTRUCTION_FINGERPRINT_MISMATCH');
          }
          const equality = {
            schema: 'H_EARTH_MAP_WIDE_ENVIRONMENT_REDEVELOPMENT_BUILDER_ROLE3_EQUALITY_RECEIPT_v1',
            result: 'PASS',
            operationId: process.env.CONSTRUCTION_OPERATION,
            candidateHead: process.env.CANDIDATE_HEAD,
            governingMain: process.env.GOVERNING_MAIN,
            constructionLockGeneration: Number(process.env.CONSTRUCTION_LOCK_GENERATION),
            carrierLockGeneration: Number(process.env.CARRIER_LOCK_GENERATION),
            carrierScopeHash: process.env.CARRIER_SCOPE_HASH,
            builderResult: builder.result,
            role3Result: role3.result,
            constructionFingerprint: builder.constructionFingerprint,
            exactPathCount: builder.exactPathCount,
            changedPathCount: builder.changedPathCount,
            repairPerformedDuringRole3: false,
            constructionCandidateMutatedByCarrier: false,
            mainMutatedByCarrier: false,
            mergePerformed: false,
            deploymentPerformed: false,
            releasePerformed: false
          };
          const text = JSON.stringify(equality, null, 2) + '\n';
          fs.writeFileSync(root + '/equality.receipt.v1.json', text);
          fs.writeFileSync(root + '/equality.sha256', crypto.createHash('sha256').update(text).digest('hex') + '\n');
          NODE

      - name: Upload exact verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-map-wide-environment-redevelopment-builder-role3
          path: ${{ runner.temp }}/h-earth-map-wide-environment-redevelopment-builder-role3
          if-no-files-found: error
          retention-days: 90
