name: S26 Private Gen303 Successor Carrier

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/private-gen303-successor-carrier-20260817.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  supersede:
    if: >-
      github.event.pull_request.head.ref == 'handoff/s26-private-gen303-successor-carrier-20260817' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.user.login == 'smansfield635-create'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRIVATE_REPOSITORY: smansfield635-create/geodiametrics1
      PRIVATE_SUCCESSOR_COMMENT_ID: '5317793121'
      EXACT_PRIVATE_HEAD: e9454cdc330931a284cfa709b5745daa76255a07
      LOCK_REF: operation-locks/repository-operation-intake-v1
      LEDGER_PATH: .github/operation-intake/active-operation-ledger.v1.json
      EXPECTED_PREDECESSOR: AI_ENTRY_ROOM_LOCAL_CONNECTED_GITHUB_INTAKE_ROUTING_ADOPTION_20260817_004
      EXPECTED_PREDECESSOR_GENERATION: '303'
      EXPECTED_SUCCESSOR: AI_ENTRY_ROOM_LOCAL_CONNECTED_GITHUB_INTAKE_ROUTING_ADOPTION_20260817_007

    steps:
      - name: Mint bounded private successor token
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.PRIVATE_EXECUTION_APP_ID }}
          private-key: ${{ secrets.PRIVATE_EXECUTION_APP_PRIVATE_KEY }}
          owner: smansfield635-create
          repositories: geodiametrics1
          permission-contents: write
          permission-issues: read

      - name: Fetch and freeze successor envelope
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/gen303-successor"
          mkdir -p "$work"
          curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$PRIVATE_REPOSITORY/issues/comments/$PRIVATE_SUCCESSOR_COMMENT_ID" > "$work/comment.json"
          curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$PRIVATE_REPOSITORY/git/ref/heads/main" > "$work/main-ref.json"
          python - <<'PY'
          import json, os
          work=os.path.join(os.environ['RUNNER_TEMP'],'gen303-successor')
          c=json.load(open(os.path.join(work,'comment.json'),encoding='utf-8'))
          body=c.get('body') or ''
          marker='REMOTE_OPERATION_SUCCESSOR_REQUEST_V1'
          if not body.startswith(marker): raise SystemExit('SUCCESSOR_MARKER_MISSING')
          env=json.loads(body[len(marker):].strip())
          if env.get('schema')!='REMOTE_OPERATION_SUCCESSOR_INVOCATION_REQUEST_v1': raise SystemExit('ENVELOPE_SCHEMA_MISMATCH')
          if env.get('repository')!=os.environ['PRIVATE_REPOSITORY']: raise SystemExit('REPOSITORY_MISMATCH')
          tr=env.get('transition') or {}; req=env.get('operationRequest') or {}; proc=env.get('constructionProcedure') or {}
          pred=tr.get('predecessor') or {}; succ=tr.get('successor') or {}
          if pred.get('operationId')!=os.environ['EXPECTED_PREDECESSOR'] or pred.get('lockGeneration')!=int(os.environ['EXPECTED_PREDECESSOR_GENERATION']): raise SystemExit('PREDECESSOR_MISMATCH')
          if succ.get('operationId')!=os.environ['EXPECTED_SUCCESSOR']: raise SystemExit('SUCCESSOR_MISMATCH')
          for x in (succ.get('governingHead'),req.get('exactGoverningHead'),proc.get('exactGoverningHead')):
              if x!=os.environ['EXACT_PRIVATE_HEAD']: raise SystemExit('EXACT_HEAD_MISMATCH')
          if tr.get('inheritedAuthority')!=[]: raise SystemExit('INHERITED_AUTHORITY_FORBIDDEN')
          main=json.load(open(os.path.join(work,'main-ref.json'),encoding='utf-8'))['object']['sha']
          if main!=os.environ['EXACT_PRIVATE_HEAD']: raise SystemExit('LIVE_PRIVATE_MAIN_MOVED')
          for name,obj in [('transition',tr),('request',req),('procedure',proc)]:
              json.dump(obj,open(os.path.join(work,name+'.json'),'w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          PY

      - name: Check out exact private canonical executor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: smansfield635-create/geodiametrics1
          ref: ${{ env.EXACT_PRIVATE_HEAD }}
          token: ${{ steps.token.outputs.token }}
          path: private-control-plane
          fetch-depth: 1
          persist-credentials: false

      - name: Execute canonical successor CAS
        id: execute
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/gen303-successor"
          cd "$GITHUB_WORKSPACE/private-control-plane"
          test "$(git rev-parse HEAD^{commit})" = "$EXACT_PRIVATE_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          set +e
          node .github/ai-router/operation-lifecycle/repository-operation-successor-gate.v1.mjs \
            --repository "$PRIVATE_REPOSITORY" \
            --lock-ref "refs/heads/$LOCK_REF" \
            --transition "$work/transition.json" \
            --request "$work/request.json" \
            --procedure "$work/procedure.json" \
            --output "$work/receipt.json"
          rc=$?
          set -e
          echo '--- canonical successor receipt ---'
          cat "$work/receipt.json"
          echo '--- end canonical successor receipt ---'
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'gen303-successor','receipt.json')
          r=json.load(open(p,encoding='utf-8'))
          if r.get('result')!='SUCCESSOR_ADMITTED_PREDECESSOR_SUPERSEDED': raise SystemExit('CANONICAL_SUCCESSOR_NOT_ADMITTED')
          if r.get('ledgerCompareAndSwapCommitted') is not True: raise SystemExit('CAS_NOT_COMMITTED')
          if (r.get('successor') or {}).get('operationId')!=os.environ['EXPECTED_SUCCESSOR']: raise SystemExit('RECEIPT_SUCCESSOR_MISMATCH')
          PY

      - name: Exact post-write ledger readback
        id: readback
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/gen303-successor"
          curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$PRIVATE_REPOSITORY/contents/$LEDGER_PATH?ref=$LOCK_REF" > "$work/readback-file.json"
          python - <<'PY'
          import base64, json, os
          work=os.path.join(os.environ['RUNNER_TEMP'],'gen303-successor')
          receipt=json.load(open(os.path.join(work,'receipt.json'),encoding='utf-8'))
          f=json.load(open(os.path.join(work,'readback-file.json'),encoding='utf-8'))
          raw=base64.b64decode(''.join(f['content'].split())).decode('utf-8')
          ledger=json.loads(raw)
          succ=receipt['successor']
          active=[x for x in (ledger.get('activeScopes') or {}).values() if x.get('operationId')==os.environ['EXPECTED_SUCCESSOR']]
          if len(active)!=1: raise SystemExit('READBACK_SUCCESSOR_NOT_UNIQUE')
          a=active[0]
          for field in ('lockScope','lockGeneration','governingHead','requestDigest','procedureLocatorDigest','state'):
              if a.get(field)!=succ.get(field): raise SystemExit('READBACK_SUCCESSOR_FIELD_MISMATCH:'+field)
          hist=[x for x in ledger.get('terminalHistory',[]) if x.get('operationId')==os.environ['EXPECTED_PREDECESSOR'] and x.get('lockGeneration')==int(os.environ['EXPECTED_PREDECESSOR_GENERATION'])]
          if len(hist)!=1 or hist[0].get('terminalDisposition')!='SUPERSEDED' or hist[0].get('released') is not True: raise SystemExit('READBACK_PREDECESSOR_NOT_SUPERSEDED')
          if f.get('sha')!=receipt.get('committedLedgerBlobSha'): raise SystemExit('READBACK_BLOB_SHA_MISMATCH')
          with open(os.environ['GITHUB_OUTPUT'],'a') as o:
              o.write('generation='+str(a.get('lockGeneration'))+'\n')
              o.write('blob='+f['sha']+'\n')
              o.write('commit='+str(receipt.get('transitionCommitSha'))+'\n')
          PY

      - name: Publish bounded carrier receipt
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATION: ${{ steps.readback.outputs.generation }}
          BLOB: ${{ steps.readback.outputs.blob }}
          COMMIT: ${{ steps.readback.outputs.commit }}
        run: |
          set -euo pipefail
          body="S26_PRIVATE_GEN303_SUCCESSOR_CARRIER_RECEIPT_V1\nresult: SUCCESSOR_ADMITTED_PREDECESSOR_SUPERSEDED\nreadbackVerified: true\nsuccessorOperationId: $EXPECTED_SUCCESSOR\nsuccessorLockGeneration: $GENERATION\nsuccessorGoverningHead: $EXACT_PRIVATE_HEAD\ncommittedLedgerBlobSha: $BLOB\ntransitionCommitSha: $COMMIT\npublicProductMutationPerformed: false\nprivateMainMutationPerformed: false\nledgerWritePathCount: 1"
          gh api "repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/comments" -f body="$body" >/dev/null
