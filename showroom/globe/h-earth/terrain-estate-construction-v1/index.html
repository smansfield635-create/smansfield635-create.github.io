<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>H-Earth Map-Wide Environment Redevelopment — Nonpublic Inspector</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="preview-shell" aria-label="H-Earth map-wide environment redevelopment nonpublic inspector">
    <header class="preview-toolbar" aria-live="polite">
      <div class="preview-brand">H-Earth · World Inspector</div>
      <div class="preview-status" data-h-earth-status>loading…</div>
      <button class="preview-button" type="button" data-fit-world>reset view</button>
    </header>

    <section class="preview-viewport" aria-label="Interactive H-Earth map viewport">
      <canvas
        class="preview-canvas"
        data-h-earth-map-wide-canvas
        aria-label="Interactive 3D H-Earth terrain inspector"
      ></canvas>
    </section>

    <footer class="preview-help">
      One finger: orbit · two fingers: pan + pinch · wheel: zoom · W/A/S/D or arrows: move.
    </footer>
  </main>

  <script type="module" src="./app.mjs"></script>
</body>
</html>
