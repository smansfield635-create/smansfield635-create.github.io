name: Laws Destination Carousel Verification

on:
  pull_request:
    paths:
      - 'laws/index.destination-carousel.js'
      - 'laws/index.destination-carousel.css'
      - 'laws/index.mobile-background-tabs.js'
      - 'laws/index.mobile-background-tabs.core.js'
      - '.github/workflows/laws-destination-carousel-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Verify JavaScript syntax
        run: |
          node --check laws/index.destination-carousel.js
          node --check laws/index.mobile-background-tabs.js
          node --check laws/index.mobile-background-tabs.core.js
      - name: Verify Methods-reference shared-ring contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          js = Path('laws/index.destination-carousel.js').read_text()
          css = Path('laws/index.destination-carousel.css').read_text()
          loader = Path('laws/index.mobile-background-tabs.js').read_text()
          methods = Path('laws/research/methods-and-models/carousel.js').read_text()
          required_js = [
            'LAWS_DESTINATION_CAROUSEL_RUNTIME_v9_METHODS_REFERENCE_PORT',
            'METHODS_MODELS_SINGLE_AXIS_EUCLIDEAN_CAROUSEL_v1',
            'pointerStartAngle', 'state.angle', 'pointermove', 'snapFromDrag',
            'angleForIndex', 'selectIndex', 'sharedRingAuthority: true',
            'directManipulation: true', 'oneAuthoritativeSpatialCoordinate: true',
            'restoreOrbitState', 'Return to Orbit'
          ]
          required_css = [
            '--laws-ring-rotation', '--laws-ring-radius', '--laws-card-angle',
            'rotateY(var(--laws-ring-rotation))',
            'rotateY(var(--laws-card-angle,0deg)) translateZ(var(--laws-ring-radius))',
            '.laws-rolodex-viewport[data-dragging="true"] .laws-rolodex-track',
            'transition:none!important', 'touch-action:pan-y'
          ]
          reference_tokens = ['pointerStartAngle', 'state.angle', 'snapFromDrag', 'angleForIndex', 'selectIndex']
          for token in required_js: assert token in js, f'missing reference-port JS token: {token}'
          for token in required_css: assert token in css, f'missing shared-ring CSS token: {token}'
          for token in reference_tokens: assert token in methods, f'Methods reference token missing: {token}'
          assert 'LAWS_DESTINATION_CAROUSEL_RUNTIME_V9_METHODS_REFERENCE_PORT_20260816B' in loader
          forbidden = ['detentPosition','targetDetent','directionOnlyGesture:true','atomicRotation:true','pointer-atomic-step','nearestCircularRelativePosition','--laws-carousel-x','--laws-carousel-z']
          for token in forbidden: assert token not in js + css, f'legacy independent spatial authority remains: {token}'
          print('LAWS_METHODS_REFERENCE_PORT_STATIC_PASS')
          PY
