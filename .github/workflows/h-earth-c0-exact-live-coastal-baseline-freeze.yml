name: H-Earth C0 Exact Live Coastal Baseline Freeze

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h-earth-c0-exact-live-coastal-baseline-freeze.yml'

permissions:
  contents: write

jobs:
  c0-c-bound-offshore-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Restore bounded C0-C executor with valid offshore endpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          target = Path('.github/workflows/h-earth-c0-exact-live-coastal-baseline-freeze.yml')
          text = subprocess.check_output(
              ['git', 'show', f'HEAD^:{target.as_posix()}'],
              text=True
          )
          replacements = [
              (
                  "const offsets=[80,60,42,34,24,14,8,4,2,0,-1.6,-3.2,-8,-14,-22,-32,-44,-58,-76,-96,-120];",
                  "const offsets=[80,60,42,34,24,14,8,4,2,0,-1.6,-3.2,-8,-14,-22,-32,-44,-58,-76,-96];"
              ),
              (
                  "zMaximum:round(Math.max(...shoreValues)+120)",
                  "zMaximum:round(Math.max(...shoreValues)+96)"
              ),
              (
                  "center+120",
                  "center+96"
              ),
              (
                  "sampleCount>=63",
                  "sampleCount>=60"
              )
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'C0_C_EXPECTED_SOURCE_FRAGMENT_MISSING:{old}')
              text = text.replace(old, new)
          target.write_text(text)
          PY
          git config user.name "h-earth-c0-evidence"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/h-earth-c0-exact-live-coastal-baseline-freeze.yml
          git commit -m "C0-C: use valid open-water sample endpoint"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
