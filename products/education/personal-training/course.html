<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Everything Breaks · Guided Sales Training</title><style>:root{color-scheme:dark;--bg:#0b111d;--card:#151f30;--raise:#1b2a40;--line:#32445f;--ink:#edf3ff;--dim:#b2c0d1;--light:#dce9ff;--good:#9bdfc4;--warn:#f6c999;--bad:#f5b8b9}

.shell{width:min(100% - 28px,800px);margin:auto;padding:18px 0 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}.brand{text-transform:uppercase;letter-spacing:.1em;font-weight:850;font-size:12px;color:#aac7f2}.tag{border:1px solid var(--line);border-radius:99px;color:#a3bacf;font-size:11px;padding:4px 8px;white-space:nowrap}.nav{display:flex;gap:8px;overflow-x:auto;padding:15px 0;scrollbar-width:thin}.nav button{flex:0 0 auto;border:1px solid var(--line);border-radius:11px;padding:8px 12px;background:var(--card);color:var(--dim);font-size:14px;min-height:42px}.nav button[aria-current=true]{background:var(--light);color:#1a2940;font-weight:800}
.status{padding:10px 2px 16px}.eyebrow{font-size:11px;font-weight:850;color:#9fbfeb;letter-spacing:.1em;text-transform:uppercase}.small{font-size:13px;color:var(--dim)}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.bar{height:7px;display:flex;gap:5px;margin-top:12px}.bar span{flex:1;border-radius:6px;background:#293b50}.bar span.past{background:#58aa96}.bar span.now{background:var(--light)}h1{font-size:clamp(26px,5.5vw,38px);line-height:1.16;letter-spacing:-.035em;margin:10px 0}h2{font-size:clamp(19px,4vw,26px);line-height:1.28;margin:8px 0 12px}p{margin:11px 0;color:var(--dim)}strong{color:var(--ink)}.panel{border:1px solid var(--line);background:var(--card);padding:clamp(17px,4vw,25px);border-radius:17px;margin:15px 0}.focus{background:var(--raise);border:1px solid #416080;padding:17px;border-radius:14px;margin-top:18px}.quote{font-size:clamp(19px,4vw,23px);line-height:1.56;white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:var(--dim)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.stack{display:grid;gap:11px}.btn{border:1px solid #b6c9df;border-radius:11px;padding:11px 15px;background:var(--light);color:#182940;font-weight:800}.btn.alt{background:#20334b;border-color:#4d6784;color:#e2edfd}.btn.warn{background:#392a2b;border-color:#805e5a;color:#ffdddd}.btn.plain{background:transparent;border-color:#465a72;color:#d3e3f4}.btn.full{width:100%}.options{display:grid;gap:10px;margin-top:17px}.option{background:#203149;color:var(--ink);padding:13px 16px;border-radius:11px;border:1px solid #49617c;text-align:left;line-height:1.4;overflow-wrap:anywhere}.option.wrong{border-color:#e7a9a9;background:#4c2b32}.option.right{border-color:#80cbaa;background:#214737}.tip{padding:11px 13px;border-left:3px solid #90c7ff;background:#10263d;border-radius:4px;margin:14px 0;color:#d9eafa}.tip.warn{border-color:#e7c28d;background:#332d23}.tip.good{border-color:#91dbb9;background:#16352c}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.controls .btn{flex:1}.course-list{display:grid;gap:10px;margin:18px 0}.course-item{text-align:left;border:1px solid var(--line);background:var(--raise);color:var(--ink);padding:16px;border-radius:12px;min-height:76px}.course-item:disabled{opacity:.55}.course-item strong{display:block}.course-item span{color:var(--dim);font-size:13px}.words{font-size:21px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.cue{font-size:clamp(20px,4.8vw,27px);font-weight:750}.dot{color:var(--good)}.miss{color:var(--warn)}.measure{color:var(--dim);font-size:13px}.divider{height:1px;background:var(--line);margin:17px 0}.field{width:100%;background:#0d1929;color:var(--ink);border:1px solid #4b6682;border-radius:10px;padding:12px;min-height:120px}.footer{border-top:1px solid var(--line);padding:14px 0;margin-top:20px;color:#899db4;font-size:12px}.hidden{display:none!important}.goal{display:flex;align-items:center;justify-content:space-between;gap:12px}.progress{height:8px;background:#2c3d52;border-radius:10px;overflow:hidden;margin-top:10px}.progress span{display:block;height:100%;background:#85bfa9}.lesson-meta{font-size:12px;color:#9ab0c9}.pill{border:1px solid var(--line);border-radius:20px;padding:5px 10px;display:inline-block;color:#cad8ec;font-size:12px}.info{font-size:14px;color:#cbd9ec}.nav-foot{display:flex;align-items:center;gap:10px;margin-top:18px;justify-content:space-between}.nav-foot button{font-size:13px}.action-chips{display:flex;gap:7px;flex-wrap:wrap}.action-chips button{border:1px solid #476181;background:#1b2b43;border-radius:9px;color:#d5e6fd;padding:7px 11px;font-size:13px}.anchor{color:#b0d1ff;text-decoration:underline}

</style></head><body><div class="shell"><div class="top"><span class="brand">Personal Training Studio</span><span class="tag">Progress on this device</span></div><nav id="nav" class="nav" aria-label="Training navigation"><button data-nav="home">Today</button><button data-nav="script">Script course</button><button data-nav="product">Product</button><button data-nav="skills">Call skills</button><button data-nav="terms">Flashcards</button><button data-nav="quiz">Knowledge check</button><button data-nav="scenario">Role-play</button><button data-nav="mock">Mock call</button><button data-nav="progress">Progress</button></nav><div id="mobileNav" class="mobile-nav"><label for="moduleSelect">Learning area</label><select id="moduleSelect" aria-label="Choose training area"><option value="home">Today</option><option value="script">Script course</option><option value="product">Product knowledge</option><option value="skills">Call skills</option><option value="terms">Flashcards</option><option value="quiz">Knowledge check</option><option value="scenario">Role-play</option><option value="mock">Mock call</option><option value="progress">My progress</option></select></div><div id="notify" class="tip" role="status" hidden></div><main id="main" aria-live="polite"></main><input id="fileInput" type="file" accept="application/json,.json" hidden><div class="footer">Local browser persistence only · No account or third-party scripts · Actual plan terms control coverage · This is not company-approved training software.</div></div><script id="privatePack" type="application/json">{"version":1,"deadline":"2026-11-09","stages":[{"id":"intro","name":"Introduction","cue":"Identify role · verify vehicle · establish rapport","lines":["Thank the caller for waiting, identify yourself as the coverage representative, and ask how their day is going.","Explain the recording notice only when it is accurate, and confirm the vehicle year, make, and model shown in the file.","Acknowledge the caller's response and ask how they like the vehicle so far.","Listen to their answer, then transition naturally to vehicle condition."]},{"id":"foam","name":"Vehicle condition","cue":"Mileage · symptoms · maintenance","lines":["Check the mileage shown in the file, then let the caller confirm or correct it.","Ask how the vehicle has been running rather than assuming that repairs are needed.","Ask whether warning lights, leaks, or other mechanical symptoms are already present.","Ask whether recommended routine maintenance has been kept current.","Explain that the next questions establish eligibility and the appropriate contract options."]},{"id":"qualification","name":"Qualification","cue":"Modifications · title · use · existing condition","lines":["Ask about aftermarket modifications that may affect eligibility, recording the customer's description accurately.","Verify title status without assuming the vehicle has a clean title.","Clarify whether the vehicle is used for personal, commercial, or rideshare purposes.","Record any pre-existing mechanical concerns and check applicable eligibility rules.","Avoid promising coverage until the actual contract and qualification requirements are known."]},{"id":"commitment","name":"Commitment and eligibility","cue":"Confirm facts · explain next step · ask permission","lines":["Summarize the information the caller provided, and check that the facts are correct.","Explain what has and has not yet been confirmed about eligibility.","Ask whether the caller would like to review the available service contract options.","State any deadline only if it is documented and genuinely applies to this caller.","Allow the caller time to ask questions or examine contract terms."]},{"id":"coverage","name":"Coverage and benefits","cue":"Covered systems · limits · deductible · claims","lines":["Introduce the vehicle service contract as a separate paid agreement, not a manufacturer's warranty.","Identify the covered components from the actual contract instead of suggesting every repair is included.","Explain the applicable deductible, exclusions, waiting periods, and maintenance obligations.","Describe claims authorization and which repair facilities can be used under that contract.","Review roadside or rental benefits only when present in the specific plan.","Invite questions about benefits and what is not covered before discussing payment."]},{"id":"close","name":"Price and close","cue":"Quote · disclosure · agreement · next steps","lines":["State the exact current down payment, number of installments, and monthly payment from the approved quote.","Explain the total payment obligation and any fees, cancellation conditions, or eligibility limitations accurately.","Ask whether the customer understands the terms and wants to proceed.","Use the approved secure payment workflow; never request sensitive payment data outside authorized systems.","Summarize what happens next, including when coverage begins and how the customer can access written terms."]}],"terms":[["VSC","Vehicle service contract: a separately purchased agreement for specified eligible repairs, subject to contract terms.","Product"],["Factory warranty","Manufacturer-provided coverage according to its own warranty terms and duration.","Product"],["Deductible","The amount the contract may require the customer to pay toward a qualifying claim.","Product"],["Exclusion","A repair, condition, use, or event that the contract does not cover.","Product"],["Waiting period","A defined time or mileage condition before specified benefits become available.","Product"],["Pre-existing condition","An issue that existed before the contract effective date and may be excluded.","Eligibility"],["Title status","Vehicle ownership classification that may affect contract eligibility.","Eligibility"],["Commercial use","Business or other nonpersonal vehicle use that may affect eligibility.","Eligibility"],["Claims authorization","Required approval before eligible repair work, depending on contract process.","Claims"],["Service facility","Repair shop qualified or permitted under the contract.","Claims"],["Roadside assistance","Optional support service subject to plan limitations.","Benefits"],["Rental benefit","Potential transportation reimbursement subject to contract terms.","Benefits"],["Rapport","Professional connection built through respectful questions and attentive listening.","Calls"],["Verification","Confirming the customer and vehicle facts before relying on them.","Calls"],["Qualification","Gathering facts that determine which plans, if any, may be offered.","Calls"],["Transition","A short statement that logically connects one call stage to the next.","Calls"],["Objection","A concern or uncertainty that requires understanding and an accurate response.","Sales"],["AIOA","Acknowledge, Isolate, Overcome, Ask; only use accurate information and respect the customer’s decision.","Sales"],["T.O.","Manager takeover or transfer for an issue requiring another person’s authority.","Sales"],["Spiff","An additional incentive attached to a defined sales or performance result.","Sales"]],"quiz":[{"q":"What is a VSC?","a":["A manufacturer warranty","A separately purchased contract with terms","A guarantee of all repairs"],"correct":1,"why":"A VSC has written eligibility, coverage and exclusion rules."},{"q":"What should happen before a coverage promise?","a":["Check actual plan language","Assume all repairs qualify","Skip qualification"],"correct":0,"why":"Customer-specific terms control."},{"q":"What is the purpose of the introduction?","a":["Verify identity and vehicle details","Collect payment before speaking","Guarantee a repair"],"correct":0,"why":"Opening questions establish factual context and rapport."},{"q":"Why ask about existing warning lights?","a":["They prove all repairs are covered","They may affect eligibility","They eliminate the deductible"],"correct":1,"why":"Record disclosed symptoms and follow the approved eligibility procedure."},{"q":"Can a customer already have a factory warranty?","a":["Yes; verify it rather than assume","No","Only if the dealer says so"],"correct":0,"why":"Do not suggest manufacturer coverage has expired without checking."},{"q":"What does a waiting period mean?","a":["No waiting under any plan","A defined condition before benefits begin","A full refund guarantee"],"correct":1,"why":"Only the written contract defines applicability."},{"q":"How should a representative handle a contract review request?","a":["Provide an appropriate way to review it","Refuse to answer","Claim the contract does not matter"],"correct":0,"why":"Help the customer understand obligations and exclusions."},{"q":"When should you mention a same-call deadline?","a":["Whenever it increases urgency","Only when a real documented rule applies","On every call"],"correct":1,"why":"Avoid fabricated urgency."},{"q":"What is an appropriate response to an unclear objection?","a":["Guess","Clarify the concern","Interrupt"],"correct":1,"why":"Ask what specifically concerns the caller."},{"q":"What determines monthly payment?","a":["A made-up script number","The current approved quote","The customer’s mood"],"correct":1,"why":"Use the actual payment schedule."},{"q":"What is needed before a repair claim is promised?","a":["Contract conditions and authorization","Vehicle brand alone","No evidence"],"correct":0,"why":"Coverage is not unconditional."},{"q":"When should a customer provide payment details?","a":["Through the approved secure process after understanding terms","At the start of the call without explanation","By personal text message"],"correct":0,"why":"Follow employer payment procedures and customer consent."}],"scenarios":[{"customer":"I'm still under the factory warranty.","focus":"Ask about the existing warranty before discussing additional protection.","points":["Acknowledge current coverage","Differentiate the separate paid service contract","Avoid suggesting the factory warranty expired"]},{"customer":"Can I read the contract before paying?","focus":"Make the written terms accessible.","points":["Respect the request","Explain relevant exclusions and limits","Avoid pressuring the customer"]},{"customer":"What if I already have a check-engine light?","focus":"Disclose and verify existing conditions.","points":["Document the symptom","Check applicable eligibility and exclusions","Do not promise that symptom is covered"]},{"customer":"I use my vehicle for rideshare.","focus":"Check vehicle use classification.","points":["Clarify the type and amount of use","Follow eligibility rules","Do not assume ordinary personal-use coverage"]},{"customer":"How much will I pay in total?","focus":"Provide the complete payment arrangement.","points":["Explain initial payment and installment count","Explain total amount and fees","Avoid quoting only a small monthly figure"]},{"customer":"Does this cover every part in my car?","focus":"Use specific written coverage.","points":["Name relevant contract terms","Explain exclusions and deductibles","Do not say every repair qualifies"]},{"customer":"I need to talk with my partner.","focus":"Handle a reasonable decision process.","points":["Acknowledge their need","Offer clear written details","Avoid inventing a deadline"]},{"customer":"What happens when the repair shop finds a problem?","focus":"Explain claims authorization correctly.","points":["Describe contacting claims administrators","Explain repair approval and documentation","Avoid guaranteeing payment before review"]}],"schema":"PERSONAL_SALES_STUDIO_LESSON_PACK_v4","sourceBoundary":"Original practice outline created for learning; not the employer-issued verbatim script. Use the source document for exact wording."}</script><script>'use strict';
const K='personal-training-studio-v4';const PK='personal-training-studio-pack-v4';
const EMBED=document.getElementById('privatePack').textContent.trim();
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const norm=s=>String(s||'').toLowerCase().replace(/[’']/g,'').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
const defaultState=()=>({schema:4,view:'home',stage:0,phase:0,index:0,script:{},products:{},skills:{},quiz:{correct:0,total:0},quizCursor:0,term:0,termKnown:{},scenario:0,weak:[],mockRuns:[],mock:null,started:new Date().toISOString()});
let pack=null,st;try{pack=EMBED?JSON.parse(EMBED):JSON.parse(localStorage.getItem(PK)||'null')}catch{}
try{st={...defaultState(),...JSON.parse(localStorage.getItem(K)||'{}')}}catch{st=defaultState()}
for(const x of ['script','products','skills','termKnown'])if(!st[x]||typeof st[x]!=='object')st[x]={};
if(!Array.isArray(st.weak))st.weak=[];if(!Array.isArray(st.mockRuns))st.mockRuns=[];
function save(){try{localStorage.setItem(K,JSON.stringify(st));if(pack&&!EMBED)localStorage.setItem(PK,JSON.stringify(pack))}catch{}}
function rec(id){return st.script[id]||(st.script[id]={phase:0,index:0,complete:false,weak:[],passCount:0,attempts:0})}
const names=['Understand','Hear & echo','Reconstruct','Put in order','Recall from cues','Independent delivery'];
const teaching=[
 {purpose:'Establish your role, verify the relevant vehicle facts, and build rapport.',map:'Introduce → recording & vehicle check → rapport → acknowledge',question:'What is the purpose of the opening?',answers:['To make a repair approval','To establish identity, accurate facts, and rapport','To collect payment immediately'],correct:1},
 {purpose:'Ask about mileage and condition, then transition to qualifying questions.',map:'Mileage → condition → symptoms → maintenance → explain questions',question:'What should the vehicle-condition questions establish?',answers:['Whether the customer has disclosed existing symptoms','That every truck requires expensive repairs','That the factory warranty has expired'],correct:0},
 {purpose:'Ask about vehicle modifications, title status, and commercial use.',map:'Modifications → title → commercial use',question:'Why ask about modifications and vehicle use?',answers:['To make coverage guarantees','To check details that may affect eligibility or surcharges','Only to lengthen the call'],correct:1},
 {purpose:'Explain the offer and transition to discussing a possible coverage plan.',map:'Eligibility language → decision request → pen and paper',question:'What should be verified about a same-call deadline?',answers:['Nothing; every offer always expires','Whether it is an actual authorized condition','Whether pressure makes the sale faster'],correct:1},
 {purpose:'Explain plan type, exclusions, deductible and assistance benefits.',map:'Plan → coverage limits → deductible → repair shop → additional benefits',question:'What controls actual repair coverage?',answers:['A broad phrase in a mock script','The written contract and claims process','A verbal promise alone'],correct:1},
 {purpose:'Present the example payment schedule accurately and ask for a decision.',map:'Down payment → monthly payment → payment method',question:'What do the sample payment figures represent?',answers:['Your guaranteed earnings','One mock-sale example, subject to actual quotation','A universal price for every vehicle'],correct:1},
];
function chunks(lines){let out=[];for(let li=0;li<lines.length;li++){
 const line=String(lines[li]);const sentences=line.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[line];
 for(let q of sentences){q=q.trim();if(!q)continue;const words=q.split(/\s+/);let piece=[];for(const word of words){if(piece.join(' ').length+word.length>155&&piece.length){out.push({text:piece.join(' '),line:li});piece=[]}piece.push(word)}if(piece.length)out.push({text:piece.join(' '),line:li});}}
 return out.length?out:[{text:'',line:0}];}
function gs(){const s=pack.stages[st.stage],r=rec(s.id);return {s,r,parts:chunks(s.lines)};}
function phaseSet(p){let {r}=gs();r.phase=Math.min(5,Math.max(0,p));r.index=0;st.phase=r.phase;st.index=0;save();render()}
function nextStage(){let n=st.stage+1;st.view='script';st.stage=n>=pack.stages.length?0:n;const x=rec(pack.stages[st.stage].id);st.phase=x.phase;st.index=x.index;save();render()}
function selectStage(i){st.view='script';st.stage=Math.max(0,Math.min(i,pack.stages.length-1));let r=rec(pack.stages[st.stage].id);st.phase=r.phase;st.index=r.index;save();render()}
function setView(v){st.view=v;save();render()}
function button(label,action,variant='btn'){return `<button class="${variant}" data-action="${esc(action)}" type="button">${esc(label)}</button>`}
function opts(options,answer,action){return `<div class="options">${options.map((v,i)=>`<button class="option" data-action="${action}" data-value="${esc(String(i))}" type="button">${esc(v)}</button>`).join('')}</div>`}
function lessonHead(label,title,desc,cur,max){return `<div class="status"><div class="head"><span class="eyebrow">${esc(label)}</span><span class="small">${cur}/${max}</span></div><div class="bar">${Array.from({length:max},(_,i)=>`<span class="${i<cur-1?'past':i===cur-1?'now':''}"></span>`).join('')}</div></div><h1>${esc(title)}</h1><p>${esc(desc)}</p>`}
function packHome(){const ready=pack.stages.filter(s=>rec(s.id).complete).length,items=pack.stages.map((s,i)=>{const r=rec(s.id);return `<button class="course-item" data-action="stage" data-value="${i}"><strong>${i+1}. ${esc(s.name)} ${r.complete?'✓':''}</strong><span>${r.complete?'Guided rehearsal completed':names[r.phase]+(r.weak.length?` · ${r.weak.length} review items`:``)}</span><div class="progress"><span style="width:${r.complete?'100':Math.round((r.phase+r.index/Math.max(1,chunks(s.lines).length))/6*100)}%"></span></div></button>`}).join('');
 const next=pack.stages.findIndex(s=>!rec(s.id).complete);return `<div class="status"><div class="eyebrow">Your private learning program</div><h1>Train for Monday.</h1><p>Learn one action at a time. Assess the entire script only after guided practice.</p></div><div class="panel"><div class="goal"><strong>Script stages practiced</strong><span class="pill">${ready}/6</span></div><div class="progress"><span style="width:${ready/6*100}%"></span></div><p class="small">Monday, November 9, 2026 is the initial memorization target. Independent spoken accuracy is self-assessed.</p><div class="controls">${button(next<0?'Review first stage':'Continue my next lesson','continue')}</div></div><div class="panel"><div class="eyebrow">Course map</div><h2>Six script lessons</h2><div class="course-list">${items}</div></div><div class="panel"><h2>Learn the job as well as the words</h2><p>Product knowledge, telephone communication, role-play, and mock calls are separate instructional and assessment tracks.</p><div class="controls">${button('Product knowledge','product','btn alt')}${button('Call skills','skills','btn alt')}</div></div>`}
function training(){const {s,r,parts}=gs(),p=r.phase,i=Math.min(r.index,parts.length-1),item=parts[i],teach=teaching[st.stage];let core='',subtitle='';
 if(p===0){subtitle='First understand why this stage exists. Memorization comes afterward.';core=`<div class="focus"><div class="eyebrow">Learning objective</div><h2>${esc(teach.purpose)}</h2><p>${esc(teach.map)}</p></div><div class="panel"><div class="eyebrow">Comprehension gate</div><h2>${esc(teach.question)}</h2>${opts(teach.answers,teach.correct,'understand-answer')}<div id="feedback" role="status"></div></div>`;}
 if(p===1){subtitle='Hear one short phrase, then say it while the words are visible.';core=`<div class="panel"><div class="head"><span class="eyebrow">Chunk ${i+1} of ${parts.length}</span><span class="small">Source passage ${item.line+1}</span></div><div class="focus quote">${esc(item.text)}</div><p class="small">Focus on wording, pauses, and clear pronunciation. Listening is optional where unsupported.</p><div class="controls">${button('▶ Listen','listen','btn alt')}${button('I repeated this →','echo')}</div></div>`;}
 if(p===2){subtitle='Rebuild one phrase while the surrounding words remain visible.';const v=gap(item.text,i),choices=v.choices;core=`<div class="panel"><div class="eyebrow">Missing words · chunk ${i+1} of ${parts.length}</div><div class="words">${esc(v.before)} <strong style="color:#b2d1fc">_____</strong> ${esc(v.after)}</div><div class="options">${choices.map((x,j)=>`<button class="option" type="button" data-action="gap-answer" data-value="${j}">${esc(x)}</button>`).join('')}</div><div class="small" id="feedback" role="status"></div></div>`;}
 if(p===3){subtitle='Practice retrieving the next phrase in the correct conversation order.';const prev=i===0?'Beginning of this stage':parts[i-1].text;const choices=seqOptions(parts,i);core=`<div class="panel"><div class="eyebrow">What comes next? · ${i+1}/${parts.length}</div><div class="focus"><div class="small">Previous phrase</div><p>${esc(prev.slice(-135))}</p></div><div class="options">${choices.map(o=>`<button class="option" type="button" data-action="seq-answer" data-value="${o.i}">${esc(o.t.slice(0,115))}${o.t.length>115?'…':''}</button>`).join('')}</div><div id="feedback" role="status"></div></div>`;}
 if(p===4){subtitle='Speak the phrase using only its first words. Reveal it after attempting.';let cue=item.text.split(/\s+/).slice(0,Math.min(5,item.text.split(/\s+/).length)).join(' ');const revealed=st.reveal===true;core=`<div class="panel"><div class="eyebrow">Supported recall · ${i+1}/${parts.length}</div><p class="small">Opening cue</p><div class="focus cue">${esc(cue)} …</div>${revealed?`<div class="focus quote">${esc(item.text)}</div><div class="controls">${button('I remembered it','recall-ok')}${button('Needs more practice','recall-weak','btn warn')}</div>`:`<div class="controls">${button('Reveal after speaking','recall-reveal')}</div>`}</div>`;}
 if(p===5){subtitle='Try the stage without visible words. Compare phrase by phrase afterward.';let started=st.checkpoint===true,review=st.review===true,at=Number(st.reviewIndex||0);const chunk=parts[Math.min(at,parts.length-1)];core=`<div class="panel"><div class="eyebrow">Independent rehearsal</div><div class="focus"><div class="small">Stage memory cue</div><h2>${esc(s.cue)}</h2></div>${!started?`<p>Put the device down and recite this entire stage. Do not look at the script. When finished, begin the phrase-by-phrase accuracy review.</p><div class="controls">${button('I finished reciting — check','checkpoint-start')}</div>`:review?`<div class="eyebrow">Check phrase ${at+1}/${parts.length}</div><div class="focus quote">${esc(chunk.text)}</div><p>Did you deliver these words correctly without looking? Do not count corrections made after revealing the text.</p><div class="controls">${button('Accurate','checkpoint-pass')}${button('Missed / changed wording','checkpoint-fail','btn warn')}</div>`:`<p>Compare each phrase against what you just said, not what you wish you had said.</p><div class="controls">${button('Start comparison','checkpoint-review')}</div>`}</div>`;}
 const foot=`<div class="nav-foot"><button class="btn plain" data-action="home">← Course map</button><span class="small">${esc(s.name)} · Step ${p+1}/6</span></div>`;
 return lessonHead('Script mastery · stage '+(st.stage+1),names[p],subtitle,p+1,6)+core+foot;}
function advancePhase(){const {r}=gs();r.phase=Math.min(5,r.phase+1);r.index=0;st.reveal=false;st.phase=r.phase;save();render()}
function stepNext(){let {r,parts}=gs();r.index++;st.reveal=false;if(r.index>=parts.length){advancePhase();return}save();render()}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h>>>0}
function gap(text,i){const words=text.split(/\s+/).filter(Boolean);const start=words.length>5?Math.min(words.length-3,Math.max(1,Math.floor(words.length/3))):0;const count=Math.max(1,Math.min(3,words.length-start));const phrase=words.slice(start,start+count).join(' ');const before=words.slice(0,start).join(' ');const after=words.slice(start+count).join(' ');const others=['this coverage','as you know','for every vehicle','right now','the original contract','your latest payment'];let distract=[others[hash(text)%others.length],others[(hash(text)+2)%others.length]].filter(x=>x!==phrase);let choices=[phrase,...distract];choices.sort((a,b)=>(hash(a+i)-hash(b+i))||a.localeCompare(b));return {before,after,phrase,choices};}
function seqOptions(parts,i){let arr=[{i,t:parts[i].text}];let choices=[(i+1)%parts.length,(i+Math.max(1,Math.floor(parts.length/2)))%parts.length];for(const n of choices){if(n!==i&&!arr.some(x=>x.i===n))arr.push({i:n,t:parts[n].text})}if(parts.length===1)arr.push({i:-1,t:'Another phrase not in this stage'});return arr.sort((a,b)=>(hash(a.t+i)-hash(b.t+i))||a.i-b.i)}
function feedback(text,type='warn'){const e=$('feedback');if(e)e.innerHTML=`<div class="tip ${type}">${esc(text)}</div>`}
function nextScriptAnswer(action,val){const {r,parts}=gs();let i=r.index;if(action==='understand-answer'){if(Number(val)!==teaching[st.stage].correct){feedback('Not yet. Revisit the objective and try again.');return}advancePhase();return}
 if(action==='gap-answer'){if(gap(parts[i].text,i).choices[Number(val)]!==gap(parts[i].text,i).phrase){feedback('Not quite. Read the surrounding words and choose again.');return}stepNext();return}
 if(action==='seq-answer'){if(Number(val)!==i){feedback('That phrase belongs elsewhere. Think about the preceding phrase.');return}stepNext();return}}
function speak(text){if(!('speechSynthesis' in window)){notify('Audio playback is unavailable on this browser. Read the phrase aloud instead.');return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.86;u.lang='en-US';window.speechSynthesis.speak(u)}
function notify(t){const e=$('notify');e.textContent=t;e.hidden=false;setTimeout(()=>e.hidden=true,4500)}
const lessons=[
 ['Factory warranty versus VSC','Manufacturer warranty and a separately purchased service contract are different products. Never imply a company service contract is issued by the manufacturer.','Customer: “Is this from Ford?” Answer accurately without implying affiliation.','Which statement is correct?',['The plan is Ford factory coverage','A VSC is a separate paid agreement','Every vehicle has to buy a VSC'],1],
 ['Vehicle eligibility','Vehicle age, mileage, title status, modifications, and commercial use may change eligibility or pricing. Verify before stating a qualification.','Caller: “I added oversized tires.” Record the information and check the proper rules.','What happens after a customer reports modifications?',['Ignore the changes','Guarantee the standard plan','Verify applicable rules before promising coverage'],2],
 ['Coverage and limitations','Written contract terms, exclusions, deductibles, waiting periods, and prior authorization govern actual repairs. A broad verbal statement is not a guarantee.','Caller: “Are all electrical components covered?” Explain that the specific contract governs.','What determines a covered repair?',['The applicable contract and claim decision','The customer’s assumption','The mock script alone'],0],
 ['Claims process','The customer or shop contacts the claims team; the claim is reviewed against terms and authorized if covered. The applicable deductible remains the customer’s responsibility.','Caller: “Can I just have the repair done?” Explain the need to follow the claim instructions.','Who makes the coverage determination?',['The service advisor without approval','The claims team applying the contract','Any salesperson'],1],
 ['Price and informed choice','A mock down payment and monthly quote do not establish the full contract cost, financing term, cancellation rules, or the exact price for a customer.','Caller: “Can I review the terms?” Help them get the applicable contract before a decision.','What should you communicate about the mock script pricing?',['It is the same for every customer','It proves your future income','It is an example, not a universal quote'],2]
 ];
const skills=[
 ['Professional voice','A calm, clear tone and appropriate pause improve comprehension. Avoid false urgency and do not rush after questions.','Practice “How’s everything running?” at a natural pace, then pause.','What follows an actual question?',['Space for an answer','A louder pitch','Immediate interruption'],0],
 ['Listen and clarify','Listen for actual concerns, take notes, avoid interruption, and ask precise clarification questions before responding.','Customer: “I’m worried about money.” Ask whether their concern is monthly cost or total price.','What is the next step after an unclear concern?',['Guess the objection','Clarify the specific concern','Ignore it'],1],
 ['AIOA and boundaries','Acknowledge, Isolate, Overcome, Ask for money. The response at “overcome” must be accurate and based on authorized facts.','A customer wants to read the contract: acknowledge the request and provide a way to review it.','What follows acknowledging an objection?',['Isolate the specific objection','Invent a guarantee','Assume a discount'],0]
 ];
function miniRec(track){let group=track==='product'?st.products:st.skills;return group[st.miniIndex||0]||(group[st.miniIndex||0]={step:0,complete:false})}
function miniView(track){const arr=track==='product'?lessons:skills,idx=Math.min(Number(st.miniIndex||0),arr.length-1),l=arr[idx],r=miniRec(track),n=r.step;let content='';
 if(n===0)content=`<div class="panel"><div class="eyebrow">Purpose</div><h2>${esc(l[0])}</h2><p>${esc(l[1].split('.')[0])}.</p><div class="controls">${button('Show the explanation','mini-next')}</div></div>`;
 if(n===1)content=`<div class="panel"><div class="eyebrow">Learn the concept</div><p class="words">${esc(l[1])}</p><div class="controls">${button('▶ Listen','mini-listen','btn alt')}${button('I understand — apply it','mini-next')}</div></div>`;
 if(n===2)content=`<div class="panel"><div class="eyebrow">Practice in context</div><div class="focus quote">${esc(l[2])}</div><p>Say your response aloud, then move to the understanding check.</p><div class="controls">${button('I practiced — check','mini-next')}</div></div>`;
 if(n===3)content=`<div class="panel"><div class="eyebrow">Understanding check</div><h2>${esc(l[3])}</h2>${opts(l[4],l[5],'mini-answer')}<div id="feedback" role="status"></div></div>`;
 if(n===4)content=`<div class="panel"><div class="eyebrow">Learned — review later</div><h2>${esc(l[0])}</h2><p>You passed the understanding check. Apply this in a full call and revisit it later for retention.</p><div class="controls">${button('Next lesson','mini-complete')}${button('Review explanation','mini-restart','btn alt')}</div></div>`;
 return lessonHead((track==='product'?'Product':'Call skills')+' · '+(idx+1)+'/'+arr.length, n===0?'Why this matters':n===1?'Understand':n===2?'Apply':n===3?'Check':'Complete','One instructional action per screen.',Math.min(5,n+1),5)+content+`<div class="nav-foot">${button('← Course map','home','btn plain')}<span class="small">${esc(l[0])}</span></div>`;
}
function viewTerms(){let idx=Number(st.term||0)%pack.terms.length;const t=pack.terms[idx];return `<div class="eyebrow">Terminology practice</div><h1>Flashcards</h1><p>Remember the meaning, not just the acronym.</p><div class="panel"><div class="head"><span class="small">Card ${idx+1}/${pack.terms.length}</span><span class="pill">${Object.values(st.termKnown).filter(Boolean).length} learned</span></div><div class="focus"><div class="cue">${esc(t[0])}</div></div>${st.cardRevealed?`<div class="focus"><p class="words">${esc(t[1])}</p></div><div class="controls">${button('I know it','card-yes')}${button('Needs review','card-no','btn warn')}</div>`:`<div class="controls">${button('Show meaning','card-reveal')}</div>`}</div>`}
function viewQuiz(){const q=pack.quiz[st.quizCursor%pack.quiz.length];return `<div class="eyebrow">Independent assessment</div><h1>Knowledge check</h1><p class="small">${st.quiz.correct}/${st.quiz.total} correct across attempts</p><div class="panel"><div class="small">Question ${st.quizCursor%pack.quiz.length+1}/${pack.quiz.length}</div><h2>${esc(q.q)}</h2>${opts(q.a,q.correct,'quiz-answer')}<div id="feedback" role="status"></div></div>`}
function viewScenario(){const q=pack.scenarios[st.scenario%pack.scenarios.length];return `<div class="eyebrow">Customer simulation</div><h1>Role-play</h1><div class="panel"><div class="small">Situation ${st.scenario%pack.scenarios.length+1}/${pack.scenarios.length}</div><div class="focus quote">${esc(q.customer)}</div><p>${esc(q.focus)}</p><label for="roleAnswer">Say your response first, then write it below if useful.</label><textarea id="roleAnswer" class="field" placeholder="How would you respond?"></textarea>${st.showCoach?`<div class="tip">${q.points.map(x=>'<p>'+esc(x)+'</p>').join('')}</div>`:''}<div class="controls">${button('Show coaching','scenario-coach','btn alt')}${button('Next situation','scenario-next')}</div></div>`}
function viewMock(){const m=st.mock,idx=m?.at||0;const s=pack.stages[Math.min(pack.stages.length-1,idx)];return `<div class="eyebrow">Final rehearsal</div><h1>Unassisted mock call</h1><p>Guided teaching and mock-call assessment remain distinct.</p><div class="panel">${!m?`<h2>Six stages, one continuous delivery</h2><p>Say the full script in order without looking. You can check each stage afterward, but spoken accuracy is currently self-rated.</p><p class="small">Completed mock calls: ${st.mockRuns.length}</p><div class="controls">${button('Start mock call','mock-start')}</div>`:`<div class="eyebrow">Stage ${idx+1}/6</div><h2>${esc(s.name)}</h2><div class="focus cue">${esc(s.cue)}</div>${m.show?`<div class="focus quote">${esc(s.lines.join('\n\n'))}</div><div class="controls">${button('Delivered accurately','mock-pass')}${button('Needs review','mock-fail','btn warn')}</div>`:`<p>Recite this stage, then reveal the words for an accuracy check.</p><div class="controls">${button('Reveal this stage','mock-reveal')}${button('End rehearsal','mock-stop','btn warn')}</div>`}</div>`}</div>`}
function viewProgress(){const done=pack.stages.filter(s=>rec(s.id).complete).length;return `<div class="eyebrow">Your learning record</div><h1>Progress & privacy</h1><div class="panel"><h2>${done}/6 guided script stages completed</h2><p>${st.weak.length} phrases flagged for review · ${st.mockRuns.length} mock calls · ${st.quiz.correct}/${st.quiz.total} quiz responses correct</p><p>Progress remains only in this browser and is not synced between devices. Use Export before switching devices or clearing storage.</p><div class="controls">${button('Export progress','export')}${button('Import progress','import-progress','btn alt')}</div><div class="divider"></div>${button('Reset this browser’s progress','reset','btn warn')}</div><div class="panel"><h2>Content boundary</h2><p>The employer-provided lesson pack is personal-use material. The generic hosted shell contains no employer source text. Imported content stays in this browser’s storage, not on a server.</p><p>Optional browser speech synthesis is a device feature. The tool does not make voice-accuracy claims.</p><div class="controls">${button('Replace private lesson pack','pack-import','btn alt')}</div></div>`}
function emptyView(){return `<div class="status"><div class="eyebrow">Personal Training Studio</div><h1>Start your training now.</h1><p>Practice lessons are ready now; official memorization requires your employer-issued script.</p></div><div class="panel"><h2>Set up your private course</h2><p>Choose the JSON lesson pack from your files. It is saved in local browser storage for future visits to the same URL.</p><div class="controls">${button('Import private lesson pack','pack-import')}</div><p class="small">No account, server upload, external scripts, or tracking.</p></div>`}
function render(){if(!pack||!Array.isArray(pack.stages)){st.view='home';$('main').innerHTML=emptyView();$('nav').hidden=true;$('mobileNav').hidden=true;}else{$('nav').hidden=false;$('mobileNav').hidden=false;let v=st.view;const views={home:packHome,script:training,product:()=>miniView('product'),skills:()=>miniView('skills'),terms:viewTerms,quiz:viewQuiz,scenario:viewScenario,mock:viewMock,progress:viewProgress};$('main').innerHTML=(views[v]||packHome)();}
 $('notify').hidden=true;$('moduleSelect').value=st.view;document.querySelectorAll('[data-nav]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.nav===st.view)));window.scrollTo(0,0);save();}
function exportJSON(obj,name){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function openImport(kind){const inp=$('fileInput');inp.value='';inp.dataset.kind=kind;inp.click()}
$('fileInput').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());const kind=e.target.dataset.kind;if(kind==='pack'){
 if(data.schema!=='PERSONAL_SALES_STUDIO_LESSON_PACK_v4'||!Array.isArray(data.stages)||data.stages.length!==6||!Array.isArray(data.quiz)||!Array.isArray(data.terms))throw Error('Wrong lesson-pack format');
 pack=data;try{localStorage.setItem(PK,JSON.stringify(pack))}catch{}st=defaultState();notify('Private lesson pack loaded. On a hosted HTTPS page, it will persist in this browser.');}
 else {let candidate=data.state||data;if(candidate.schema===4){st={...defaultState(),...candidate};}else if(candidate.scores&&candidate.learn){st=defaultState(); for(let i=0;i<6;i++){const old=candidate.learn.stages?.[i];if(old){const rr=rec(pack.stages[i].id);rr.phase=Math.min(5,Number(old.phase||0));rr.index=0;rr.complete=!!old.complete;}}st.quiz=candidate.quiz||st.quiz;st.mockRuns=candidate.mockRuns||[]; }else throw Error('Wrong progress-file format');notify('Progress imported.');}
 save();render();}catch(err){notify('Import error: '+err.message)}});
$('moduleSelect').addEventListener('change',e=>setView(e.target.value));
$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b){st.view=b.dataset.nav;save();render()}});
$('main').addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,val=b.dataset.value;
 if(a==='home')return setView('home');if(a==='stage')return selectStage(Number(val));if(a==='continue'){const n=pack.stages.findIndex(s=>!rec(s.id).complete);return selectStage(n<0?0:n)}
 if(a==='product'||a==='skills'){st.miniIndex=0;return setView(a)}
 if(a==='understand-answer'||a==='gap-answer'||a==='seq-answer')return nextScriptAnswer(a,val);
 if(a==='echo')return stepNext();if(a==='listen'){const {parts,r}=gs();return speak(parts[r.index].text)}
 if(a==='recall-reveal'){st.reveal=true;return render()}
 if(a==='recall-ok'||a==='recall-weak'){const {r}=gs();if(a==='recall-weak'){if(!r.weak.includes(r.index))r.weak.push(r.index);st.weak.push({stage:st.stage,index:r.index,at:new Date().toISOString()});}return stepNext()}
 if(a==='checkpoint-start'){st.checkpoint=true;st.review=false;st.reviewIndex=0;st.checkpointWeak=[];return render()}
 if(a==='checkpoint-review'){st.review=true;return render()}
 if(a==='checkpoint-pass'||a==='checkpoint-fail'){const {s,r,parts}=gs();if(a==='checkpoint-fail'){st.checkpointWeak.push(st.reviewIndex);if(!r.weak.includes(st.reviewIndex))r.weak.push(st.reviewIndex);st.weak.push({stage:st.stage,index:st.reviewIndex,at:new Date().toISOString()})}
 st.reviewIndex++;if(st.reviewIndex>=parts.length){r.attempts++;if(st.checkpointWeak.length){r.phase=4;r.index=st.checkpointWeak[0];r.complete=false;notify(`${st.checkpointWeak.length} missed phrases need another supported recall pass.`);}else{r.passCount++;r.complete=true;notify('Independent stage rehearsal complete (self-rated).');}st.checkpoint=false;st.review=false;st.reviewIndex=0;st.checkpointWeak=[];if(r.complete)return nextStage();}return render()}
 if(a==='mini-next'){const r=miniRec(st.view);r.step=Math.min(4,r.step+1);return render()}
 if(a==='mini-listen'){const arr=st.view==='product'?lessons:skills;return speak(arr[st.miniIndex||0][1])}
 if(a==='mini-answer'){const arr=st.view==='product'?lessons:skills;const correct=arr[st.miniIndex||0][5];if(Number(val)!==correct){feedback('Review the explanation and try again.');return}const r=miniRec(st.view);r.step=4;r.complete=true;return render()}
 if(a==='mini-restart'){miniRec(st.view).step=1;return render()}
 if(a==='mini-complete'){const arr=st.view==='product'?lessons:skills;st.miniIndex=(st.miniIndex+1)%arr.length;return render()}
 if(a==='card-reveal'){st.cardRevealed=true;return render()}
 if(a==='card-yes'||a==='card-no'){st.termKnown[st.term]=a==='card-yes';st.term=(st.term+1)%pack.terms.length;st.cardRevealed=false;return render()}
 if(a==='quiz-answer'){const q=pack.quiz[st.quizCursor%pack.quiz.length],correct=Number(val)===q.correct;st.quiz.total++;if(correct)st.quiz.correct++;st.quizCursor++;save();notify(correct?'Correct. '+q.why:'Review: '+q.why);return render()}
 if(a==='scenario-coach'){st.showCoach=!st.showCoach;return render()}
 if(a==='scenario-next'){st.showCoach=false;st.scenario++;return render()}
 if(a==='mock-start'){st.mock={at:0,grades:[],start:Date.now(),show:false};return render()}
 if(a==='mock-reveal'){st.mock.show=true;return render()}
 if(a==='mock-pass'||a==='mock-fail'){st.mock.grades.push(a==='mock-pass');st.mock.at++;st.mock.show=false;if(st.mock.at>=pack.stages.length){const m=st.mock;st.mockRuns.unshift({date:new Date().toISOString(),accurate:m.grades.filter(Boolean).length,seconds:Math.round((Date.now()-m.start)/1000)});st.mock=null;notify('Mock call recorded.');}return render()}
 if(a==='mock-stop'){st.mock=null;return render()}
 if(a==='pack-import')return openImport('pack');if(a==='import-progress')return openImport('progress');
 if(a==='export')return exportJSON({schema:4,state:st},'personal-training-progress-v4.json');
 if(a==='reset'){if(confirm('Delete progress on this browser? Imported lesson pack will remain.')){st=defaultState();return render()}};
});
render();
</script></body></html>
