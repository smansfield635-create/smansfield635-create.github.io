name: Compass cache delivery repair

on:
  push:
    branches:
      - agent/compass-cache-delivery-repair-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/compass-cache-delivery-repair-v1
          fetch-depth: 0

      - name: Apply exact Compass stylesheet cache identity
        shell: bash
        run: |
          set -euo pipefail
          old='compass.css?v=dgb-main-compass-architecture-context-round-002-v1'
          new='compass.css?v=display-continuity-reference-v1'
          before="$(grep -o "$old" index.html | wc -l | tr -d ' ')"
          test "$before" = "1"
          sed -i "s/$old/$new/" index.html
          after_old="$(grep -o "$old" index.html | wc -l | tr -d ' ')"
          after_new="$(grep -o "$new" index.html | wc -l | tr -d ' ')"
          test "$after_old" = "0"
          test "$after_new" = "1"
          git diff --exit-code -- . ':!index.html'
          git diff --check -- index.html

      - name: Commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git diff --cached --exit-code -- . ':!index.html'
          git diff --cached --quiet && exit 0
          git commit -m 'Bust Compass reference stylesheet cache identity'
          git push origin HEAD:agent/compass-cache-delivery-repair-v1
