name: Laws Renewal Reconcile Legacy Verifier

on:
  push:
    branches:
      - agent/laws-renewal-public-audit-translation-001
    paths:
      - scripts/laws-renewal-reconcile-legacy-verifier.mjs
      - .github/workflows/laws-renewal-reconcile-legacy-verifier.yml
  pull_request:
    paths:
      - scripts/laws-renewal-reconcile-legacy-verifier.mjs
      - .github/workflows/laws-renewal-reconcile-legacy-verifier.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/laws-renewal-public-audit-translation-001
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reconcile legacy verifier
        run: node scripts/laws-renewal-reconcile-legacy-verifier.mjs

      - name: Validate patch integrity
        run: git diff --check

      - name: Commit verifier reconciliation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No verifier changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/laws_cp6_contextual_browser_verify.mjs
          git commit -m "Reconcile Laws integrated verifier with collapsed entry contract"
          git push origin HEAD:agent/laws-renewal-public-audit-translation-001
