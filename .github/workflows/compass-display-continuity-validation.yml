          }catch(error){fatal=String(error?.stack||error);check('DISPLAY_RUNTIME_EXECUTION',false,fatal)}finally{await browser.close()}
          const failures=checks.filter(item=>!item.pass),receipt={...binding,schema:'COMPASS_ROOT_AWARD_FINISH_DISPLAY_RUNTIME_v1',candidateHead:process.env.COMPASS_CANDIDATE_HEAD,result:failures.length?'FAIL_CLOSED':'PASS_CLOSED',checks,failures:failures.map(item=>item.id),fatal};fs.writeFileSync('/tmp/compass-display-runtime.json',JSON.stringify(receipt,null,2)+'\n');console.log(JSON.stringify(receipt,null,2));if(failures.length)process.exit(1);
