<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H-Earth CP5 Round 2 Comparison</title>
  <style>
    html,body{margin:0;background:#020405;color:#eef;font-family:monospace}
    main{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
    figure{margin:0;min-width:0}figcaption{padding:4px 0}
    canvas{display:block;width:100%;height:auto;background:#000}
    pre{margin:8px;white-space:pre-wrap;font-size:11px}
  </style>
</head>
<body>
  <main>
    <figure><figcaption>Accepted CP2</figcaption><canvas id="cp2-canvas" width="960" height="540"></canvas></figure>
    <figure><figcaption>Round 2 candidate</figcaption><canvas id="candidate-canvas" width="960" height="540"></canvas></figure>
  </main>
  <pre id="status">initializing</pre>
  <script type="module">
    import { createCp5Round2Suite } from './h-earth.cp5-round2-browser.mjs';
    const status=document.getElementById('status');
    try{
      const response=await fetch('../../control-plane/post-cp2-round2/h-earth.cp5-round2-execution-control.v1.json',{cache:'no-store'});
      if(!response.ok)throw new Error(`CP5_CONTROL_FETCH_FAILED:${response.status}`);
      const control=await response.json();
      window.H_EARTH_CP5_ROUND2=await createCp5Round2Suite({
        cp2Canvas:document.getElementById('cp2-canvas'),
        candidateCanvas:document.getElementById('candidate-canvas'),
        control
      });
      status.textContent=JSON.stringify(window.H_EARTH_CP5_ROUND2.getIdentity(),null,2);
      document.documentElement.dataset.cp5Ready='true';
    }catch(error){
      document.documentElement.dataset.cp5Ready='false';
      document.documentElement.dataset.cp5Error='true';
      status.textContent=error?.stack??String(error);
      throw error;
    }
  </script>
</body>
</html>
