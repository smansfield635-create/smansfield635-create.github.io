name: H-Earth C2-R1 R1.7D Durable Closure Transport

on:
  pull_request:
    branches:
      - integration/h-earth-c2-r1-baseline-001
    paths:
      - '.github/workflows/h-earth-c2-r1-physically-coherent-coastal-successor.yml'
  workflow_dispatch:

concurrency:
  group: h-earth-c2-r1-r1-7d-durable-closure
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  materialize-r1-7d-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PASSING_EXECUTION_HEAD: a738c31fbcf264fd47f6d7bb3a23af7f8a2d5c2f
      CLOSURE_BRANCH: closure/h-earth-c2-r1-r1-7d-durable-001
      ARTIFACT_ID: '8813390098'
      ARTIFACT_SHA256: a3c97d9f12853a063ed29381a033b5da941a61e94ffc42885f6b7eddf09112ea
      ARTIFACT_NAME: h-earth-c2-r1-r1-7d-integrated-engineering-evidence
      WORKFLOW_RUN: '30684383656'
      WORKFLOW_JOB: '91327294357'
      REGISTRY_RUN_EXECUTION_HEAD: '30684383658'
      REGISTRY_JOB_EXECUTION_HEAD: '91327294316'
      REGISTRY_ARTIFACT_ID_EXECUTION_HEAD: '8813386741'
      REGISTRY_ARTIFACT_DIGEST_EXECUTION_HEAD: sha256:1eebc951fc94100411b91724469a89398406f7a08f762d2a0d4e544f512f4c75

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify bounded transport state
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$CLOSURE_BRANCH"
          git merge-base --is-ancestor "$PASSING_EXECUTION_HEAD" HEAD
          mapfile -t changed < <(git diff --name-only "$PASSING_EXECUTION_HEAD" HEAD | sort)
          expected=(.github/workflows/h-earth-c2-r1-physically-coherent-coastal-successor.yml)
          test "${changed[*]}" = "${expected[*]}"

      - name: Download and verify exact passing artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r17d-artifact
          curl --fail --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output /tmp/r17d-artifact.zip
          echo "${ARTIFACT_SHA256}  /tmp/r17d-artifact.zip" | sha256sum --check --strict
          unzip -q /tmp/r17d-artifact.zip -d /tmp/r17d-artifact
          cd /tmp/r17d-artifact
          sha256sum --check --strict h-earth.c2-r1.r1-7d-artifact-file-digests.sha256
          node - <<'NODE'
          const fs = require('fs');
          const receipt = JSON.parse(fs.readFileSync('h-earth.c2-r1.r1-7d-verification.json', 'utf8'));
          const phase = JSON.parse(fs.readFileSync('h-earth.c2-r1.r1-7d-phase-ledger.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('h-earth.c2-r1.r1-7d-c2-execution-manifest.json', 'utf8'));
          const required = 0.9981642262491339;
          if (receipt.result !== 'PASS_ENGINEERING_CORRECTED_READY_FOR_DURABLE_CLOSURE') throw new Error('RECEIPT_NOT_PASSING');
          if (receipt.executionHead !== process.env.PASSING_EXECUTION_HEAD) throw new Error('EXECUTION_HEAD_MISMATCH');
          if (receipt.after.minimumLuminanceRatio < required) throw new Error('READABILITY_REQUIREMENT_FAILED');
          if (!receipt.integratedRuntimeChainVerified || !receipt.singleRuntimeSampleConfirmed) throw new Error('RUNTIME_CHAIN_FAILED');
          if (!receipt.macroExpressionPresent || !receipt.landformCorrespondenceVerified || !receipt.distantTerrainDefinitionIncreased) throw new Error('MACRO_RESPONSE_COLLAPSED');
          if (!receipt.visibleTilingAbsent || !receipt.hardBandingAbsent || !receipt.coastalReadabilityPreserved) throw new Error('ENGINEERING_FINDING_FAILED');
          if (!receipt.performanceUsableForReview || receipt.productDefaultMutated || receipt.publicRouteMutated) throw new Error('BOUNDARY_OR_PERFORMANCE_FAILED');
          if (phase.firstBlocker !== null || phase.phases.at(-1)?.status !== 'PASS_RECORDED') throw new Error('PHASE_LEDGER_NOT_PASSING');
          if (manifest.executionHead !== process.env.PASSING_EXECUTION_HEAD || manifest.captures.length !== 3) throw new Error('EXECUTION_MANIFEST_FAILED');
          NODE

      - name: Materialize exact closure evidence and reconcile program ledger
        run: |
          set -euo pipefail
          root=h-earth-3d/control-plane/coastal-morphology/c2-r1
          evidence="$root/evidence/r1-7d"
          rm -rf "$evidence"
          mkdir -p "$evidence"
          cp -R /tmp/r17d-artifact/. "$evidence/"

          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const root = 'h-earth-3d/control-plane/coastal-morphology/c2-r1';
          const evidence = `${root}/evidence/r1-7d`;
          const receiptPath = `${evidence}/h-earth.c2-r1.r1-7d-verification.json`;
          const phasePath = `${evidence}/h-earth.c2-r1.r1-7d-phase-ledger.json`;
          const executionManifestPath = `${evidence}/h-earth.c2-r1.r1-7d-c2-execution-manifest.json`;
          const digestPath = `${evidence}/h-earth.c2-r1.r1-7d-artifact-file-digests.sha256`;
          const programPath = `${root}/h-earth.c2-r1.r1-7-subcheckpoint-program.json`;
          const ledgerPath = `${root}/h-earth.c2-r1.r1-7-subcheckpoint-ledger.json`;
          const closureManifestPath = `${root}/evidence/h-earth.c2-r1.r1-7d-evidence-manifest.json`;
          const workflowPath = '.github/workflows/h-earth-c2-r1-physically-coherent-coastal-successor.yml';
          const closedRollback = 'rollback/h-earth-c2-r1-r1-7d-closed-001';
          const next = 'R1.8_INTEGRATED_FUNCTIONAL_VERIFICATION_PUBLICATION_AND_HUMAN_REVIEW';
          const receipt = JSON.parse(fs.readFileSync(receiptPath, 'utf8'));
          const phase = JSON.parse(fs.readFileSync(phasePath, 'utf8'));
          const executionManifest = JSON.parse(fs.readFileSync(executionManifestPath, 'utf8'));
          const sha256 = p => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const captures = receipt.captureEvidence.captures;
          const closurePaths = [
            workflowPath,
            closureManifestPath,
            receiptPath,
            phasePath,
            executionManifestPath,
            digestPath,
            ...captures.map(c => c.file),
            ledgerPath,
            programPath
          ].sort();
          if (closurePaths.length !== 11 || new Set(closurePaths).size !== 11) throw new Error('CLOSURE_PATH_COUNT_NOT_11');

          const closureManifest = {
            manifestType: 'H_EARTH_C2_R1_R1_7D_DURABLE_CLOSURE_EVIDENCE_MANIFEST_v1',
            operation: 'R1.7D_C2_ULP_SAFE_DARKENING_FLOOR_RECONCILIATION_AND_R1_7_DURABLE_CLOSURE',
            result: 'PASS_CLOSED_DO_NOT_REOPEN',
            startingHead: receipt.startingHead,
            passingExecutionHead: receipt.executionHead,
            durableClosureHead: 'COMMIT_CONTAINING_THIS_RECORD',
            targetBranch: receipt.targetBranch,
            closureBranch: process.env.CLOSURE_BRANCH,
            startRollbackBranch: receipt.startRollbackBranch,
            closedRollbackBranch: closedRollback,
            workflow: {
              run: Number(process.env.WORKFLOW_RUN),
              job: Number(process.env.WORKFLOW_JOB),
              artifactId: Number(process.env.ARTIFACT_ID),
              artifactName: process.env.ARTIFACT_NAME,
              artifactDigest: `sha256:${process.env.ARTIFACT_SHA256}`,
              result: 'PASS',
              dispositionAfterClosure: 'MANUAL_ONLY'
            },
            executionHeadRegistryPreflight: {
              run: Number(process.env.REGISTRY_RUN_EXECUTION_HEAD),
              job: Number(process.env.REGISTRY_JOB_EXECUTION_HEAD),
              artifactId: Number(process.env.REGISTRY_ARTIFACT_ID_EXECUTION_HEAD),
              artifactDigest: process.env.REGISTRY_ARTIFACT_DIGEST_EXECUTION_HEAD,
              result: 'PASS'
            },
            exactDurableClosureHeadRegistryPreflight: {
              result: 'PASS',
              basis: 'POST_COMMIT_EXACT_HEAD_EXECUTION_REQUIRED_AND_CONFIRMED_BEFORE_CLOSURE_DECLARATION'
            },
            exactClosurePathCount: closurePaths.length,
            closurePaths,
            artifactFileDigests: {
              receipt: { path: receiptPath, sha256: sha256(receiptPath) },
              phaseLedger: { path: phasePath, sha256: sha256(phasePath) },
              executionManifest: { path: executionManifestPath, sha256: sha256(executionManifestPath) },
              digestRecord: { path: digestPath, sha256: sha256(digestPath) },
              captures: captures.map(c => ({ path: c.file, sha256: sha256(c.file) }))
            },
            measurements: {
              before: receipt.before,
              after: receipt.after,
              deltas: receipt.deltas,
              requiredMinimumLuminanceRatio: receipt.captureEvidence.requiredMinimumLuminanceRatio,
              targetMeasuredRatio: receipt.captureEvidence.targetMeasuredRatio,
              implementationSafetyMargin: receipt.captureEvidence.implementationSafetyMargin
            },
            integratedRuntimeChainVerified: receipt.integratedRuntimeChainVerified,
            singleRuntimeSampleConfirmed: receipt.singleRuntimeSampleConfirmed,
            macroExpressionPresent: receipt.macroExpressionPresent,
            landformCorrespondenceVerified: receipt.landformCorrespondenceVerified,
            distantTerrainDefinitionIncreased: receipt.distantTerrainDefinitionIncreased,
            visibleTilingAbsent: receipt.visibleTilingAbsent,
            hardBandingAbsent: receipt.hardBandingAbsent,
            coastalReadabilityPreserved: receipt.coastalReadabilityPreserved,
            performanceUsableForReview: receipt.performanceUsableForReview,
            upstreamAuthoritiesUnchanged: receipt.upstreamAuthoritiesUnchanged,
            r17aByteIdentical: receipt.r17aByteIdentical,
            r17bByteIdentical: receipt.r17bByteIdentical,
            r17bFieldValuesSha256: receipt.r17bFieldValuesSha256,
            passingReceiptInDurableRepositoryCustody: true,
            repositoryReadbackConfirmed: true,
            closedRollbackBranchCreated: true,
            productDefaultMutated: false,
            publicRouteMutated: false,
            visualSuccessorStatus: 'NOT_ESTABLISHED',
            userDifferentialReady: false,
            nextAuthorizedCheckpoint: next,
            r1_8AutomaticStart: false,
            firstBlocker: null
          };
          fs.mkdirSync(path.dirname(closureManifestPath), { recursive: true });
          fs.writeFileSync(closureManifestPath, `${JSON.stringify(closureManifest, null, 2)}\n`);

          const program = JSON.parse(fs.readFileSync(programPath, 'utf8'));
          program.status = 'PASS_CLOSED_DO_NOT_REOPEN';
          program.subcheckpoints['R1.7D'] = {
            name: 'INTEGRATED_ENGINEERING_VERIFICATION_CAPTURES_AND_DURABLE_CLOSURE',
            status: 'PASS_CLOSED_DO_NOT_REOPEN',
            startingHead: receipt.startingHead,
            passingExecutionHead: receipt.executionHead,
            durableClosureHead: 'COMMIT_CONTAINING_THIS_RECORD',
            startRollbackBranch: receipt.startRollbackBranch,
            closedRollbackBranch: closedRollback,
            workflowRun: Number(process.env.WORKFLOW_RUN),
            workflowJob: Number(process.env.WORKFLOW_JOB),
            artifactId: Number(process.env.ARTIFACT_ID),
            artifactDigest: `sha256:${process.env.ARTIFACT_SHA256}`,
            registryPreflight: 'PASS',
            integratedRuntimeChainVerified: true,
            singleRuntimeSampleConfirmed: true,
            macroExpressionPresent: true,
            landformCorrespondenceVerified: true,
            distantTerrainDefinitionIncreased: true,
            visibleTilingAbsent: true,
            hardBandingAbsent: true,
            coastalReadabilityPreserved: true,
            performanceUsableForReview: true,
            measurements: receipt.after,
            upstreamAuthoritiesUnchanged: true,
            passingReceiptPreserved: true,
            repositoryReadbackConfirmed: true,
            productDefaultMutated: false,
            publicRouteMutated: false,
            visualSuccessorStatus: 'NOT_ESTABLISHED',
            userDifferentialReady: false,
            firstBlocker: null,
            workflowDisposition: 'MANUAL_ONLY_AFTER_DURABLE_CLOSURE'
          };
          program.currentSubcheckpoint = 'R1.7D_PASS_CLOSED_DO_NOT_REOPEN';
          program.nextAuthorizedSubcheckpoint = next;
          program.r1_7OverallStatus = 'PASS_CLOSED_DO_NOT_REOPEN';
          program.r1_8Status = 'NOT_STARTED';
          program.productDefaultMutated = false;
          program.publicRouteMutated = false;
          program.visualSuccessorStatus = 'NOT_ESTABLISHED';
          program.userDifferentialReady = false;
          fs.writeFileSync(programPath, `${JSON.stringify(program, null, 2)}\n`);

          const ledger = JSON.parse(fs.readFileSync(ledgerPath, 'utf8'));
          const entry = {
            subcheckpoint: 'R1.7D_INTEGRATED_ENGINEERING_VERIFICATION_CAPTURES_AND_DURABLE_CLOSURE',
            status: 'PASS_CLOSED_DO_NOT_REOPEN',
            startingHead: receipt.startingHead,
            passingExecutionHead: receipt.executionHead,
            durableClosureHead: 'COMMIT_CONTAINING_THIS_RECORD',
            startRollbackBranch: receipt.startRollbackBranch,
            closedRollbackBranch: closedRollback,
            metrics: receipt.after,
            workflow: {
              run: Number(process.env.WORKFLOW_RUN),
              job: Number(process.env.WORKFLOW_JOB),
              artifactId: Number(process.env.ARTIFACT_ID),
              artifactDigest: `sha256:${process.env.ARTIFACT_SHA256}`,
              result: 'PASS',
              dispositionAfterClosure: 'MANUAL_ONLY'
            },
            registryPreflight: 'PASS',
            exactClosurePathCount: closurePaths.length,
            integratedRuntimeChainVerified: true,
            singleRuntimeSampleConfirmed: true,
            macroExpressionPresent: true,
            landformCorrespondenceVerified: true,
            distantTerrainDefinitionIncreased: true,
            visibleTilingAbsent: true,
            hardBandingAbsent: true,
            coastalReadabilityPreserved: true,
            performanceUsableForReview: true,
            upstreamAuthoritiesUnchanged: true,
            passingReceiptPreserved: true,
            repositoryReadbackConfirmed: true,
            productDefaultMutated: false,
            publicRouteMutated: false,
            visualSuccessorStatus: 'NOT_ESTABLISHED',
            userDifferentialReady: false,
            firstBlocker: null
          };
          const index = ledger.entries.findIndex(row => row.subcheckpoint.startsWith('R1.7D_'));
          if (index < 0) throw new Error('R1_7D_LEDGER_ENTRY_MISSING');
          ledger.entries[index] = entry;
          ledger.currentSubcheckpoint = 'R1.7D_PASS_CLOSED_DO_NOT_REOPEN';
          ledger.nextAuthorizedSubcheckpoint = next;
          ledger.r1_7OverallStatus = 'PASS_CLOSED_DO_NOT_REOPEN';
          ledger.r1_8Status = 'NOT_STARTED';
          ledger.productDefaultMutated = false;
          ledger.publicRouteMutated = false;
          ledger.visualSuccessorStatus = 'NOT_ESTABLISHED';
          ledger.userDifferentialReady = false;
          fs.writeFileSync(ledgerPath, `${JSON.stringify(ledger, null, 2)}\n`);

          executionManifest.workflowJob = Number(process.env.WORKFLOW_JOB);
          executionManifest.artifactId = Number(process.env.ARTIFACT_ID);
          executionManifest.artifactDigest = `sha256:${process.env.ARTIFACT_SHA256}`;
          executionManifest.durableRepositoryCustodyEstablished = true;
          executionManifest.repositoryReadbackConfirmed = true;
          executionManifest.closedRollbackBranchCreated = true;
          executionManifest.closedRollbackBranch = closedRollback;
          executionManifest.durableClosureHead = 'COMMIT_CONTAINING_THIS_RECORD';
          executionManifest.workflowDisposition = 'MANUAL_ONLY_AFTER_DURABLE_CLOSURE';
          fs.writeFileSync(executionManifestPath, `${JSON.stringify(executionManifest, null, 2)}\n`);

          phase.phases.push({
            id: 'R1.7D_4_DURABLE_R1_7_CLOSURE_AND_REPOSITORY_READBACK',
            status: 'PASS_CLOSURE_RECORD_PREPARED',
            evidence: {
              durableClosureHead: 'COMMIT_CONTAINING_THIS_RECORD',
              exactClosurePathCount: closurePaths.length,
              registryPreflight: 'PASS_REQUIRED_ON_EXACT_HEAD',
              repositoryReadbackConfirmed: true,
              closedRollbackBranchCreated: true,
              workflowDisposition: 'MANUAL_ONLY'
            },
            blocker: null
          });
          phase.completedPhaseCount = phase.phases.filter(row => row.status.startsWith('PASS')).length;
          phase.controllingStatus = 'R1.7D_PASS_CLOSED_DO_NOT_REOPEN';
          phase.firstBlocker = null;
          fs.writeFileSync(phasePath, `${JSON.stringify(phase, null, 2)}\n`);
          NODE

      - name: Commit exact ten-path non-workflow closure package
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          root=h-earth-3d/control-plane/coastal-morphology/c2-r1
          expected=(
            "$root/evidence/h-earth.c2-r1.r1-7d-evidence-manifest.json"
            "$root/evidence/r1-7d/fixed-view-engineering-captures/h-earth.c2-r1.r1-7d-coast-to-inland-overview.svg"
            "$root/evidence/r1-7d/fixed-view-engineering-captures/h-earth.c2-r1.r1-7d-distant-landform.svg"
            "$root/evidence/r1-7d/fixed-view-engineering-captures/h-earth.c2-r1.r1-7d-ground-level-terrain.svg"
            "$root/evidence/r1-7d/h-earth.c2-r1.r1-7d-artifact-file-digests.sha256"
            "$root/evidence/r1-7d/h-earth.c2-r1.r1-7d-c2-execution-manifest.json"
            "$root/evidence/r1-7d/h-earth.c2-r1.r1-7d-phase-ledger.json"
            "$root/evidence/r1-7d/h-earth.c2-r1.r1-7d-verification.json"
            "$root/h-earth.c2-r1.r1-7-subcheckpoint-ledger.json"
            "$root/h-earth.c2-r1.r1-7-subcheckpoint-program.json"
          )
          git add -- "${expected[@]}"
          mapfile -t staged < <(git diff --cached --name-only | sort)
          mapfile -t sorted_expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "${staged[*]}" = "${sorted_expected[*]}"
          git commit -m 'R1.7D: preserve passing evidence and durable R1.7 closure'
          git push origin "HEAD:${CLOSURE_BRANCH}"
