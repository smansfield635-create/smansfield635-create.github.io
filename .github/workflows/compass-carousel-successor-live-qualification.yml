name: Compass Gen1525 Candidate Browser Qualification

on:
  pull_request:
    paths:
      - 'assets/compass/compass.crystals.js'
      - '.github/ai-router/projects/compass/verify-performance-successor.mjs'
      - '.github/ai-router/projects/compass/verify-display-continuity.v1.mjs'
      - '.github/workflows/compass-performance-successor-validation.yml'
      - '.github/workflows/compass-carousel-successor-live-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GEN1525_GOVERNING_HEAD: d53b9c627c6b9be3222044b5ca879c080a7165f1
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  COMPASS_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  COMPASS_PERFORMANCE_OUTPUT: /tmp/compass-gen1525-performance.json
  COMPASS_VERIFICATION_OUTPUT: /tmp/compass-gen1525-display.json

jobs:
  qualify-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact checkout and static Gen1525 contract
        run: |
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$GEN1525_GOVERNING_HEAD" "$EXPECTED_HEAD"
          node .github/ai-router/projects/compass/verify-performance-successor.mjs
          node .github/ai-router/projects/compass/verify-display-continuity.v1.mjs
          jq -e '.result == "PASS_CLOSED" and .lockGeneration == 1525' /tmp/compass-gen1525-performance.json >/dev/null
          jq -e '.result == "PASS_CLOSED" and .lockGeneration == 1525' /tmp/compass-gen1525-display.json >/dev/null
      - name: Install browser runtime
        env:
          npm_config_package_lock: 'false'
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Start isolated candidate server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/compass-gen1525-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
      - name: Qualify and isolate crystal cadence contribution
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import {chromium} from 'playwright';
          const candidate=process.env.EXPECTED_HEAD,base=`http://127.0.0.1:4173/?candidate=${candidate}`;
          const checks=[],metrics={}; const check=(id,pass,evidence)=>checks.push({id,pass:Boolean(pass),evidence});
          const measure=async page=>page.evaluate(async()=>{const a=[];let last=performance.now();for(let i=0;i<90;i++)await new Promise(r=>requestAnimationFrame(now=>{a.push(now-last);last=now;r()}));const s=a.slice(5).sort((x,y)=>x-y);return{median:Number((s[Math.floor(s.length*.5)]||999).toFixed(2)),p95:Number((s[Math.floor(s.length*.95)]||999).toFixed(2)),samples:s.length}});
          const browser=await chromium.launch({headless:true});
          for(const [name,width,height,reduced] of [['desktop',1440,900,false],['tablet',820,1180,false],['phone',390,844,false],['reduced',820,1180,true]]){
            const context=await browser.newContext({viewport:{width,height},reducedMotion:reduced?'reduce':'no-preference'});const page=await context.newPage(),errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(`${base}&surface=${name}`,{waitUntil:'domcontentloaded',timeout:30000});await page.waitForFunction(()=>globalThis.DGB_COMPASS_IDENTITY_3D_GEN1524?.mounted===true,{timeout:15000});await page.waitForTimeout(1800);
            const evidence=await page.evaluate(()=>{const spatial=document.querySelector('[data-compass-spatial-instrument]'),craft=document.querySelector('canvas[data-compass-spacecraft-layer]'),brain=document.querySelector('[data-human-brain] canvas')||document.querySelector('canvas[data-brain-contract]'),identity=globalThis.DGB_COMPASS_IDENTITY_3D_GEN1524,renderer=globalThis.DGB_UPSTREAM_COMPASS_RENDERER,rr=renderer?.receipt?.()||globalThis.DGB_UPSTREAM_COMPASS_RENDERER_RECEIPT||null,cr=globalThis.DGB_COMPASS_CRYSTALS?.receipt?.()||globalThis.DGB_COMPASS_CRYSTALS_RECEIPT||null;return{provenance:identity?.provenance,spatial:{present:Boolean(spatial),renderer:spatial?.dataset.compassSpatialRenderer,canvasVisible:spatial?.querySelector('canvas[data-upstream-compass-canvas]')?.dataset.upstreamCompassCanvasVisible,strata:spatial?.dataset.compassDepthStrata},craft:{present:Boolean(craft),display:craft?getComputedStyle(craft).display:null,designId:craft?.dataset.designId,adoption:craft?.dataset.adoption},brain:{present:Boolean(brain),topology:brain?.dataset.brainTopology,bulbs:brain?.dataset.brainPosteriorBulbs,material:brain?.dataset.brainMaterial},cardinals:document.querySelectorAll('[data-cardinal-id]').length,rooms:document.querySelectorAll('[data-compass-room-declarations] [data-compass-room]').length,overflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth,rendererReceipt:rr?{firstEnhancedFrameCompleted:rr.firstEnhancedFrameCompleted,lastWebGLError:rr.lastWebGLError}:null,crystalReceipt:cr?{contract:cr.contract||cr.contractId,cardinals:cr.registryCardinalCount,rooms:cr.registryRoomCount}:null}});
            const baseline=await measure(page);await page.screenshot({path:`/tmp/compass-gen1525-${name}.png`,fullPage:true});
            await page.evaluate(()=>globalThis.DGB_COMPASS_CRYSTALS?.stop?.());await page.waitForTimeout(250);const crystalStopped=await measure(page);metrics[name]={baseline,crystalStopped};
            check(`${name}_NO_PAGE_ERRORS`,errors.length===0,errors);check(`${name}_CARDINAL_AND_ROOM_FLOOR`,evidence.cardinals===4&&evidence.rooms===19,evidence);check(`${name}_NO_HORIZONTAL_OVERFLOW`,evidence.overflow<=2,evidence.overflow);check(`${name}_SPATIAL_COMPASS_RENDERED`,evidence.spatial.renderer==='upstream-authoritative-webgl'&&evidence.spatial.canvasVisible==='true'&&evidence.rendererReceipt?.firstEnhancedFrameCompleted===true&&evidence.rendererReceipt?.lastWebGLError===0,evidence.spatial);check(`${name}_LAWS_PROVENANCE`,evidence.provenance?.designId==='DGB_SCOUTCRAFT_01'&&evidence.provenance?.adoption==='DIRECT_CANONICAL_GEOMETRY_MODULE_CONSUMPTION',evidence.provenance);if(reduced||width<=720)check(`${name}_SPACECRAFT_SUSPENDED`,!evidence.craft.present||evidence.craft.display==='none',evidence.craft);else check(`${name}_LAWS_CRAFT_RENDERED`,evidence.craft.present&&evidence.craft.designId==='DGB_SCOUTCRAFT_01',evidence.craft);if(evidence.brain.present)check(`${name}_BRAIN_ANATOMY`,evidence.brain.topology==='CONTINUOUS_MIDBRAIN_PONS_MEDULLA_SINGLE_POSTERIOR_INFERIOR_CEREBELLAR_MASS'&&evidence.brain.bulbs==='none'&&evidence.brain.material==='NATIVE_ROSE_FLESH_V1',evidence.brain);check(`${name}_FRAME_CADENCE`,baseline.median<=18.5&&baseline.p95<=26,{targetMs:16.7,...baseline});
            await context.close();
          }
          await browser.close();const failures=checks.filter(x=>!x.pass),receipt={schema:'COMPASS_CRYSTAL_RENDERER_GEN1525_BROWSER_RECEIPT_v2_CAUSAL',operationId:'COMPASS_CRYSTAL_RENDERER_PERFORMANCE_CONTINUATION_20260817_007',lockGeneration:1525,governingHead:process.env.GEN1525_GOVERNING_HEAD,candidateHead:candidate,targetFrameBudgetMs:16.7,result:failures.length?'FAIL_CLOSED':'PASS_CLOSED',metrics,checks,failures:failures.map(x=>x.id)};fs.writeFileSync('/tmp/compass-gen1525-browser.json',JSON.stringify(receipt,null,2)+'\n');console.log(JSON.stringify(receipt,null,2));if(failures.length)process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-gen1525-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/compass-gen1525-performance.json
            /tmp/compass-gen1525-display.json
            /tmp/compass-gen1525-browser.json
            /tmp/compass-gen1525-*.png
            /tmp/compass-gen1525-server.log
          retention-days: 90
