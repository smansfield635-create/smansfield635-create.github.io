name: H-Earth GEN311 Relief Correspondence Audit v1
on: workflow_dispatch
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node h-earth-3d/audits/h-earth-gen311-relief-correspondence-audit.v1.mjs | tee h-earth-gen311-relief-correspondence.json
      - uses: actions/upload-artifact@v4
        with:
          name: h-earth-gen311-relief-correspondence-${{ github.run_id }}
          path: h-earth-gen311-relief-correspondence.json
