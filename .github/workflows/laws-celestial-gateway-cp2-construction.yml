          if count != 1:
              raise SystemExit(f'CP2_REGISTRY_REPAIR_ANCHOR_INVALID:{count}')

          text = text.replace(old, new, 1)

          start = text.index('  function buildRegistry() {')
          end = text.index('  function clusterAnchorVector() {', start)
          segment = text[start:end]

          required = [
              'return registry;',
              'function constellationAnchorVector()',
              'RECEIPT.categoryCount =',
              'RECEIPT.auxiliaryCount =',
              'RECEIPT.lawCount =',
              'RECEIPT.canonicalSemanticLawCount =',
          ]
          invalid = [item for item in required if segment.count(item) != 1]
          if invalid:
              raise SystemExit(
                  'CP2_REGISTRY_REPAIR_INVALID:' + ','.join(invalid)
              )

          path.write_text(text, encoding='utf-8')
          print('CP2_CANDIDATE_PATH_SET=PASS')
          print('CP2_REGISTRY_REPAIR_SOURCE_ASSERTIONS=PASS')
          PY

