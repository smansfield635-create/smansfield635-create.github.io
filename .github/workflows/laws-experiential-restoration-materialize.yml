name: Laws Experiential Restoration Interaction Diagnostic

on:
  push:
    branches:
      - agent/laws-experiential-architecture-restoration-001
    paths:
      - '.github/workflows/laws-experiential-restoration-materialize.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/laws-experiential-restoration-materialize.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laws-experiential-restoration-interaction-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXECUTION_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  EXPECTED_MAIN_BASE: ef2ffdb1da7911238652f076a6b44326061493ef
  BASE_URL: http://127.0.0.1:4173

jobs:
  interaction-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact restoration head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXECUTION_COMMIT }}
          fetch-depth: 0

      - name: Lock exact checkout and main base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXECUTION_COMMIT"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_BASE"
          test "$(git merge-base origin/main HEAD)" = "$EXPECTED_MAIN_BASE"

      - name: Install pinned browser verifier
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start exact candidate server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/laws-interaction-diagnostic-server.log 2>&1 &
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:4173/laws/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/laws-interaction-diagnostic-server.log
          exit 1

      - name: Trace raw-coordinate authority activation
        shell: bash
        run: |
          set -euo pipefail
          cat > tools/.laws-interaction-diagnostic.mjs <<'JS'
          import { chromium } from "playwright";

          const baseUrl = process.env.BASE_URL;
          const methods = ["touchscreen-coordinate", "mouse-coordinate"];
          const browser = await chromium.launch({ headless: true });

          async function state(page, label) {
            return page.evaluate(nextLabel => {
              const root = document.querySelector("[data-laws-root]");
              let frame = null;
              try { frame = globalThis.DGB_LAWS_CONTROLLER?.getFrame?.() || null; } catch (_) { frame = null; }
              return {
                label: nextLabel,
                controllerState: root?.dataset.lawsControllerState || "",
                activeDirection: root?.dataset.lawsActiveDirection || "",
                activeCategory: root?.dataset.lawsActiveCategory || "",
                experienceDirection: document.documentElement.dataset.lawsExperienceDirection || "",
                spatialPrimaryId: root?.dataset.lawsSpatialPrimaryId || "",
                visibleLabelId: root?.dataset.lawsVisibleOuterAuthorityLabelId || "",
                interactionsStatus: root?.dataset.lawsInteractionsStatus || "",
                interactionReceipt: globalThis.DGB_LAWS_INTERACTIONS?.getReceipt?.() || null,
                frameState: frame?.state || "",
                frameDirection: frame?.compass?.selectedDirection || ""
              };
            }, label);
          }

          async function currentHit(page) {
            return page.evaluate(() => {
              const root = document.querySelector("[data-laws-root]");
              const visibleId = root?.dataset.lawsVisibleOuterAuthorityLabelId || "";
              const projected = document.querySelector(
                `[data-laws-projected-category-label="${visibleId}"]`
              );
              if (!(projected instanceof HTMLElement)) return null;
              const rect = projected.getBoundingClientRect();
              const points = [
                [0.5, 0.5], [0.35, 0.5], [0.65, 0.5],
                [0.5, 0.35], [0.5, 0.65]
              ];
              for (const [fx, fy] of points) {
                const x = rect.left + rect.width * fx;
                const y = rect.top + rect.height * fy;
                if (x < 0 || y < 0 || x >= innerWidth || y >= innerHeight) continue;
                const top = document.elementFromPoint(x, y);
                const owner = top?.closest?.(
                  `[data-laws-projected-category-label="${visibleId}"]`
                );
                if (owner) {
                  return {
                    visibleId,
                    x,
                    y,
                    rect: {
                      left: rect.left,
                      top: rect.top,
                      width: rect.width,
                      height: rect.height
                    },
                    topTag: top?.tagName || "",
                    topClass: top?.className || "",
                    ownerTag: owner.tagName,
                    ownerText: owner.textContent?.trim() || "",
                    pointerEvents: getComputedStyle(owner).pointerEvents
                  };
                }
              }
              return {
                visibleId,
                x: null,
                y: null,
                rect: {
                  left: rect.left,
                  top: rect.top,
                  width: rect.width,
                  height: rect.height
                },
                topTag: "",
                topClass: "",
                ownerTag: "",
                ownerText: projected.textContent?.trim() || "",
                pointerEvents: getComputedStyle(projected).pointerEvents
              };
            });
          }

          for (const method of methods) {
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              isMobile: true,
              hasTouch: true,
              deviceScaleFactor: 1
            });
            const page = await context.newPage();
            const errors = [];
            page.on("pageerror", error => errors.push(`pageerror:${error.message}`));
            page.on("console", message => {
              if (message.type() === "error") errors.push(`console:${message.text()}`);
            });

            await page.goto(`${baseUrl}/laws/`, { waitUntil: "networkidle" });
            await page.waitForFunction(() => {
              const root = document.querySelector("[data-laws-root]");
              return Boolean(
                globalThis.DGB_LAWS_CONTROLLER &&
                globalThis.DGB_LAWS_EXPERIENCE &&
                globalThis.DGBLawsStagedLoader
              ) && root?.dataset.lawsControllerStatus === "available";
            });
            const preload = await page.evaluate(() => {
              document.querySelector("[data-laws-compass-primary]")?.scrollIntoView({
                block: "center",
                behavior: "instant"
              });
              return globalThis.DGB_LAWS_EXPERIENCE?.requestCompassRuntimePreload?.() ?? false;
            });
            await page.waitForFunction(() => {
              const root = document.querySelector("[data-laws-root]");
              return Boolean(globalThis.DGB_LAWS_INTERACTIONS) &&
                root?.dataset.lawsInteractionsStatus === "available";
            });
            await page.waitForTimeout(250);

            const before = await state(page, "before");
            let hit = null;
            for (let attempt = 0; attempt < 20; attempt += 1) {
              hit = await currentHit(page);
              if (hit?.x !== null && hit?.y !== null) break;
              await page.waitForTimeout(16);
            }
            if (!hit || hit.x === null || hit.y === null) {
              throw new Error(`No owned projected-label point for ${method}: ${JSON.stringify(hit)}`);
            }

            if (method === "touchscreen-coordinate") {
              await page.touchscreen.tap(hit.x, hit.y);
            } else {
              await page.mouse.click(hit.x, hit.y);
            }

            await page.waitForTimeout(1400);
            const after = await state(page, "after");
            console.log(JSON.stringify({
              method,
              preload,
              hit,
              before,
              after,
              errors
            }, null, 2));
            await context.close();
          }

          await browser.close();
          JS
          node tools/.laws-interaction-diagnostic.mjs
          rm -f tools/.laws-interaction-diagnostic.mjs
