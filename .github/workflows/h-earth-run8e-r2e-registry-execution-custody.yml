name: H-Earth Run 8E R2E Registry Execution Custody

on:
  push:
    branches:
      - agent/h-earth-run8e-r2e-registry-execution-custody-001
  pull_request:
    branches:
      - agent/h-earth-run8e-r2d-gpu-resource-lifecycle-001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-run8e-r2e-registry-execution-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      H_EARTH_RUN8E_R2E_OUTPUT: /tmp/h-earth-run8e-r2e
    steps:
      - name: Check out exact R2E event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact R2D base and stacked branch posture
        run: |
          set -euo pipefail
          git fetch origin agent/h-earth-run8e-r2d-gpu-resource-lifecycle-001
          test "$(git merge-base HEAD origin/agent/h-earth-run8e-r2d-gpu-resource-lifecycle-001)" = "9cc33fee5c82bbe47e3bb57f8bc40d1ffa3a31b9"
          test "$(git rev-parse origin/agent/h-earth-run8e-r2d-gpu-resource-lifecycle-001)" = "9cc33fee5c82bbe47e3bb57f8bc40d1ffa3a31b9"

      - name: Verify JavaScript and JSON syntax
        run: |
          set -euo pipefail
          node --check h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.run8e-r2-execution-scope.js
          node --check h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.run8e-r2e-execution-scope.js
          node --check h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js
          node --check h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r2.immutable-live-render-package.js
          node --check h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r2e.registry-execution-custody.js
          node --check h-earth-3d/validation/h-earth.run8e-r2e.registry-execution-custody.validation.mjs
          node -e "JSON.parse(require('fs').readFileSync('h-earth-3d/validation/run-8e-r2/h-earth.run8e-r2e.path-inventory.json','utf8'))"
          if test -f h-earth-3d/validation/run-8e-r2/h-earth.run8e-r2e.pass-closed.receipt.json; then
            node -e "JSON.parse(require('fs').readFileSync('h-earth-3d/validation/run-8e-r2/h-earth.run8e-r2e.pass-closed.receipt.json','utf8'))"
          fi

      - name: Verify final closure controls when durable receipt exists
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { H_EARTH_RUN_8E_R2_CONTROL } from './h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r2.immutable-live-render-package.js';
          import { H_EARTH_RUN_8E_R2E_CONTROL } from './h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r2e.registry-execution-custody.js';
          const receiptPath = './h-earth-3d/validation/run-8e-r2/h-earth.run8e-r2e.pass-closed.receipt.json';
          if (fs.existsSync(receiptPath)) {
            const r2e = H_EARTH_RUN_8E_R2_CONTROL.boundedSubcheckpoints.find((entry) => entry.checkpointId === 'RUN_8E_R2E');
            const r2f = H_EARTH_RUN_8E_R2_CONTROL.boundedSubcheckpoints.find((entry) => entry.checkpointId === 'RUN_8E_R2F');
            if (r2e?.currentStatus !== 'PASS_CLOSED') throw new Error('R2E_PARENT_CONTROL_NOT_PASS_CLOSED');
            if (r2f?.currentStatus !== 'NOT_STARTED') throw new Error('R2F_STARTED');
            if (H_EARTH_RUN_8E_R2_CONTROL.predecessor.run8E !== 'FAIL_OPEN') throw new Error('RUN_8E_NOT_FAIL_OPEN');
            if (H_EARTH_RUN_8E_R2_CONTROL.stoppingBoundary.nextCheckpoint !== 'RUN_8E_R2F_NOT_STARTED') {
              throw new Error('R2_PARENT_NOT_OPEN_AT_R2F_BOUNDARY');
            }
            if (H_EARTH_RUN_8E_R2E_CONTROL.currentStatus !== 'PASS_CLOSED') {
              throw new Error('R2E_CHILD_CONTROL_NOT_PASS_CLOSED');
            }
          }
          NODE

      - name: Execute independent registry and exact-scope audit
        run: |
          set -euo pipefail
          node h-earth-3d/validation/h-earth.run8e-r2e.registry-execution-custody.validation.mjs

      - name: Execute automatic preflight against exact R2E governed delta
        run: |
          set -euo pipefail
          git diff --name-only 9cc33fee5c82bbe47e3bb57f8bc40d1ffa3a31b9...HEAD \
            | grep -E '^(h-earth-3d/|showroom/globe/h-earth/)' \
            | grep -Ev '^(h-earth-3d/registry/|h-earth-3d/AGENTS\.md$|showroom/globe/h-earth/AGENTS\.md$)' \
            | sort -u > /tmp/h-earth-run8e-r2e-changed-governed-paths.txt || true
          node --experimental-default-type=module \
            tools/h-earth-repository-registry-auto-preflight.mjs \
            --paths-file /tmp/h-earth-run8e-r2e-changed-governed-paths.txt \
            --task "Run 8E R2E final exact governed change preflight" \
            --mutation-intent \
            --output /tmp/h-earth-run8e-r2e/automatic-changed-path-preflight.json

      - name: Verify exact bounded scope and stopping boundary
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only 9cc33fee5c82bbe47e3bb57f8bc40d1ffa3a31b9...HEAD | sort \
            > /tmp/h-earth-run8e-r2e-changed-paths.txt
          node - <<'NODE'
          const fs = require('fs');
          const inventory = JSON.parse(fs.readFileSync(
            'h-earth-3d/validation/run-8e-r2/h-earth.run8e-r2e.path-inventory.json',
            'utf8'
          ));
          const actual = fs.readFileSync('/tmp/h-earth-run8e-r2e-changed-paths.txt', 'utf8')
            .split(/\r?\n/).map((value) => value.trim()).filter(Boolean);
          const permitted = new Set(inventory.r2ePlannedPaths.map((row) => row.path.slice(1)));
          const unexpected = actual.filter((repositoryPath) => !permitted.has(repositoryPath));
          if (unexpected.length) throw new Error(`R2E_UNEXPECTED_PATHS:${unexpected.join(',')}`);
          const forbidden = actual.filter((repositoryPath) =>
            repositoryPath === 'showroom/globe/h-earth/render/live-render-package.run8e-r2.js' ||
            repositoryPath === 'showroom/globe/h-earth/render/gpu-upload-views.run8e-r2d.js' ||
            repositoryPath === 'showroom/globe/h-earth/index.html' ||
            repositoryPath.includes('run8e-r2f') ||
            repositoryPath.includes('run-8e-r2f') ||
            repositoryPath.includes('run8e-r3') ||
            repositoryPath.includes('run-8e-r3')
          );
          if (forbidden.length) throw new Error(`R2E_PROTECTED_OR_LATER_CHECKPOINT_PATH:${forbidden.join(',')}`);
          NODE

      - name: Upload R2E execution and exact-scope evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-run8e-r2e-registry-execution-custody-evidence
          path: |
            /tmp/h-earth-run8e-r2e
            /tmp/h-earth-run8e-r2e-changed-governed-paths.txt
            /tmp/h-earth-run8e-r2e-changed-paths.txt
          if-no-files-found: warn
          retention-days: 90
