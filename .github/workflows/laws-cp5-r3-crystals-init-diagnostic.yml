name: Laws CP5 R3 Crystals Init Diagnostic

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - run: npm install --no-save --no-package-lock puppeteer-core@24.15.0
      - name: Start exact-head runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/laws-cp5-init-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/laws/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Capture exact initialization exception
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          mkdir -p verification/benchmark-tools/laws-compass-cp5-single-active-label-v1
          cat > verification/benchmark-tools/laws-compass-cp5-single-active-label-v1/cp5-init-diagnostic.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:'new',args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const page=await browser.newPage();
          await page.setViewport({width:430,height:932,deviceScaleFactor:1,isMobile:true,hasTouch:true});
          const telemetry={pageErrors:[],console:[]};
          page.on('pageerror',error=>telemetry.pageErrors.push(String(error?.stack||error)));
          page.on('console',message=>telemetry.console.push({type:message.type(),text:message.text()}));
          await page.goto('http://127.0.0.1:4173/laws/?cp5-init-diagnostic=1',{waitUntil:'domcontentloaded',timeout:45000});
          await page.waitForFunction(()=>Boolean(globalThis.DGBLawsStagedLoader&&globalThis.DGB_LAWS_CONTROLLER),{timeout:20000});
          await page.evaluate(()=>{
            globalThis.__CP5_CRYSTALS_FAILURES=[];
            globalThis.addEventListener('LAWS_CRYSTALS_RENDER_FAILURE',event=>{
              globalThis.__CP5_CRYSTALS_FAILURES.push(event.detail||null);
            });
          });
          await page.evaluate(async()=>{await globalThis.DGBLawsStagedLoader.loadOrbitSystems();});
          await page.waitForFunction(()=>{
            const receipt=globalThis.DGB_LAWS_CRYSTALS_RECEIPT;
            return receipt?.status==='available'||receipt?.status==='held'||globalThis.__CP5_CRYSTALS_FAILURES?.length>0;
          },{timeout:30000});
          const result=await page.evaluate(()=>({
            failures:globalThis.__CP5_CRYSTALS_FAILURES||[],
            receipt:globalThis.DGB_LAWS_CRYSTALS_RECEIPT||null,
            compositor:globalThis.DGB_LAWS_COMPOSITOR_RECEIPT||null,
            loader:globalThis.DGBLawsStagedLoader?.status?.()||null
          }));
          console.log(JSON.stringify({result,telemetry},null,2));
          await browser.close();
          if(result.receipt?.status!=='available') process.exitCode=1;
          NODE
          node verification/benchmark-tools/laws-compass-cp5-single-active-label-v1/cp5-init-diagnostic.mjs
