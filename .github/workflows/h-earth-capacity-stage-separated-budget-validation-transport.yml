name: H-Earth Capacity Stage-Separated Budget Validation Transport

on:
  push:
    branches:
      - agent/h-earth-capacity-stage-separated-budget-validation-001
    paths:
      - .github/workflows/h-earth-capacity-stage-separated-budget-validation-transport.yml

permissions:
  contents: write

jobs:
  apply-and-close-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/h-earth-capacity-stage-separated-budget-validation-001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object showroom/globe/h-earth/capacity.js)" = "0b1c3f6d29735d42141e2feffc5898985e5996af"
      - name: Apply exact one-file correction
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > /tmp/apply-capacity-v3.py
          python /tmp/apply-capacity-v3.py
          node --check showroom/globe/h-earth/capacity.js
      - name: Execute bounded capacity controls
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const m = await import('./showroom/globe/h-earth/capacity.js?validation=' + Date.now());
          const counts = [514, 526, 696, 784, 798];
          for (const projectedFragmentCount of counts) {
            const legacy = m.evaluateHEarth3DNodeBudget({
              semanticLayerContainers: 15,
              environmentPrimitives: projectedFragmentCount,
              interactionNodes: 1,
              diagnosticOwnedNodes: 0
            });
            const separated = m.evaluateHEarth3DStageSeparatedCapacity({
              admittedPrimitiveCount: 3,
              projectedFragmentCount
            });
            if (!legacy.eligible || !separated.eligible) {
              throw new Error('PROFILE_CAPACITY_REJECTED:' + projectedFragmentCount);
            }
          }
          const projectedOverflow = m.evaluateHEarth3DStageSeparatedCapacity({
            admittedPrimitiveCount: 3,
            projectedFragmentCount: 1025
          });
          const admittedOverflow = m.evaluateHEarth3DStageSeparatedCapacity({
            admittedPrimitiveCount: 385,
            projectedFragmentCount: 798
          });
          const mountMismatch = m.evaluateHEarth3DStageSeparatedCapacity({
            admittedPrimitiveCount: 3,
            projectedFragmentCount: 798,
            mountedProjectedFragmentNodeCount: 797
          });
          if (projectedOverflow.eligible || admittedOverflow.eligible || mountMismatch.eligible) {
            throw new Error('NEGATIVE_CONTROL_DID_NOT_FAIL_CLOSED');
          }
          if (m.H_EARTH_3D_CAPACITY_PREFLIGHT.eligible !== true) {
            throw new Error('CAPACITY_PREFLIGHT_NOT_ELIGIBLE');
          }
          NODE
      - name: Commit only the product correction and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/h-earth-capacity-stage-separated-budget-validation-transport.yml
          git add showroom/globe/h-earth/capacity.js
          test "$(git diff --cached --name-only | sort)" = "showroom/globe/h-earth/capacity.js"
          git config user.name "openai-codex[bot]"
          git config user.email "openai-codex[bot]@users.noreply.github.com"
          git commit -m "Validate H-Earth stage-separated capacity correction"
          git push origin HEAD:agent/h-earth-capacity-stage-separated-budget-validation-001
