<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mirror Manor · Live 3D Preview</title>
<meta name="description" content="Direct live 3D preview of the canonical Mirror Manor Gothic estate model.">
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#071018;color:#f7f0dc}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 32%,#173044 0,#09131d 43%,#04090e 100%)}
body{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;overflow-x:hidden}
header,footer{width:min(1120px,calc(100% - 32px));margin:auto;padding:20px 0}header{display:flex;align-items:end;justify-content:space-between;gap:18px}h1{margin:0;font:600 clamp(1.8rem,5vw,4rem)/.95 Georgia,serif;letter-spacing:-.035em}.eyebrow{margin:0 0 8px;color:#d9bd71;font-size:.74rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.status{margin:0;color:#b9c9d2;font-size:.86rem;text-align:right}.stage{position:relative;width:min(1180px,calc(100vw - 20px));height:min(76vh,820px);min-height:520px;margin:auto;border:1px solid rgba(224,201,132,.2);border-radius:24px;overflow:hidden;background:radial-gradient(ellipse at 50% 70%,rgba(127,150,155,.13),transparent 50%),linear-gradient(#08131e,#050a10);box-shadow:0 40px 100px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05)}
.stage:after{content:"";position:absolute;left:8%;right:8%;bottom:8%;height:12%;background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 70%);filter:blur(15px);pointer-events:none}.house-field{position:absolute;inset:0;display:block}.house-field canvas{position:absolute;inset:0;width:100%!important;height:100%!important;z-index:2}.note{position:absolute;z-index:4;left:18px;bottom:16px;margin:0;padding:8px 11px;border:1px solid rgba(255,255,255,.09);border-radius:999px;background:rgba(3,9,14,.62);backdrop-filter:blur(10px);font-size:.72rem;color:#bdcbd1}.error{color:#ffb0a6}.back{color:#ead59c;text-decoration:none;font-weight:750}footer{display:flex;justify-content:space-between;gap:20px;color:#8296a2;font-size:.76rem}@media(max-width:700px){header{align-items:start;flex-direction:column}.status{text-align:left}.stage{height:68vh;min-height:430px;border-radius:16px}footer{flex-direction:column}}
</style>
</head>
<body>
<header><div><p class="eyebrow">Canonical 3D object · development viewer</p><h1>Mirror Manor</h1></div><p class="status" id="status">Loading the Gothic estate geometry…</p></header>
<main class="stage" id="stage"><span class="house-field"><canvas id="manor" role="img" aria-label="Three-dimensional Mirror Manor Gothic estate"></canvas></span><p class="note">27-unit principal span · canonical Phase 3 geometry</p></main>
<footer><span>Direct production viewer · no carousel dependency</span><a class="back" href="/">Return to Compass</a></footer>
<script src="/assets/compass/compass.house-scene.js?cb=db72f4729817ec97-manor-visible-v2"></script>
<script>
(()=>{
 const canvas=document.getElementById('manor'),status=document.getElementById('status');
 const start=()=>{
   if(!window.CompassHouseScene){status.textContent='Renderer unavailable';status.classList.add('error');return;}
   const api=window.CompassHouseScene.mount(canvas,{foreground:()=>true});api.setForeground(true);
   let n=0;const poll=()=>{const ready=canvas.dataset.houseAssetReady;if(ready==='true'){status.textContent='Live canonical geometry · renderer active';return;}if(ready==='false'){status.textContent='Renderer error: '+(canvas.dataset.houseError||'unknown');status.classList.add('error');return;}if(n++<240){requestAnimationFrame(poll);return;}status.textContent='Renderer initialization timed out';status.classList.add('error');};poll();
 };
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>
</body>
</html>
