name: Laws cache bust once

# Retriggered after the merge event did not publish the one-shot commit.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/laws-cache-bust-once.yml

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace exact Laws asset versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('laws/index.html')
          text = page.read_text(encoding='utf-8')

          replacements = {
              'LAWS_CP6_EXPERIENTIAL_PRESENTATION_20260801A':
                  'LAWS_CP6_EXPERIENTIAL_PRESENTATION_20260801B',
              'LAWS_CP6_EXPERIENTIAL_POLISH_20260801A':
                  'LAWS_CP6_EXPERIENTIAL_POLISH_20260801B',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {old!r}; found {count}')
              text = text.replace(old, new, 1)

          page.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/laws-cache-bust-once.yml')
          if not workflow.exists():
              raise SystemExit('One-shot workflow file missing before cleanup')
          workflow.unlink()
          PY

      - name: Verify bounded diff
        shell: bash
        run: |
          git diff -- laws/index.html .github/workflows/laws-cache-bust-once.yml
          test "$(git diff --numstat -- laws/index.html | awk '{print $1+$2}')" -eq 2
          grep -q 'index.experience.js?v=LAWS_CP6_EXPERIENTIAL_PRESENTATION_20260801B' laws/index.html
          grep -q 'index.experience.polish.css?v=LAWS_CP6_EXPERIENTIAL_POLISH_20260801B' laws/index.html
          ! grep -q 'index.experience.js?v=LAWS_CP6_EXPERIENTIAL_PRESENTATION_20260801A' laws/index.html
          ! grep -q 'index.experience.polish.css?v=LAWS_CP6_EXPERIENTIAL_POLISH_20260801A' laws/index.html

      - name: Publish cache identity correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add laws/index.html .github/workflows/laws-cache-bust-once.yml
          git commit -m 'Bust Laws experiential asset cache identities'
          git push origin HEAD:main
