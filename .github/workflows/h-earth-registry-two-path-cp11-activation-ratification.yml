name: CP11 H-Earth Registry Two-Path Post-Merge Verification

on:
  pull_request:
    paths:
      - '.github/workflows/h-earth-registry-two-path-cp11-activation-ratification.yml'

permissions:
  contents: write
  pull-requests: read
  actions: read

env:
  PREMERGE_MAIN: '347642b5c4f90b68a8351ead379eeb34d4fdb639'
  ACTIVATION_HEAD: 'dccb1da47e912ed9018d4188b7a6268daa99cb78'
  MERGED_MAIN: '0dafe6718df298640aab184a7d85928f7548ba27'
  SUBJECT_PR590_HEAD: '603f74d3d4d52909812b0564102b742ded0ee27f'
  SUBJECT_PR570_HEAD: '7c0b8871928b21cd9b2806f058bce34eed11f2ba'
  TOOLING_HEAD: 'f978d62886b71bd0e619e4a713472ebffea43419'
  PREMERGE_SUCCESSOR_FINGERPRINT: '6d3a9e8d13e8bcb9b330592b84318fb3474879f69d01c224d7f83dc29c06f9de'
  PREMERGE_CERTIFICATION_DIGEST: '322181b2b9a71fb3919aa6724038058f241466d44b891fb135d555c7b55270e5'
  OVERLAY_PATH: 'h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.c2-r1-material-only-binding-exact-head.js'
  LOADER_PATH: 'h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js'
  OVERLAY_BLOB: '602217838af009a778b0ba32b4bcc230e14090ac'
  LOADER_BLOB: 'f18e0772903e85a55517d49e178c9e7088b56f91'
  PREDECESSOR_BLOB: 'a195eea704df0a3f754f626817181b63114178fd'
  ACTIVATION_PR: '597'
  SUBJECT_PR: '590'
  INSTRUMENT_SUBJECT_PR: '570'
  OPERATION_ID: 'H_EARTH_REGISTRY_TWO_PATH_SUCCESSOR_MAIN_ACTIVATION_RATIFICATION_CP11_v1'
  OPERATION_SCOPE: 'H_EARTH:REGISTRY_TWO_PATH_SUCCESSOR:MAIN_ACTIVATION_RATIFICATION:CP11:V1'
  OPERATION_GENERATION: '85'
  LOCK_REF: 'refs/heads/operation-locks/repository-operation-intake-v1'
  LEDGER_PATH: '.github/operation-intake/active-operation-ledger.v1.json'
  WORKFLOW_PATH: '.github/workflows/h-earth-registry-two-path-cp11-activation-ratification.yml'

jobs:
  post-merge-builder:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact merged-main identity and blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for sha in "$PREMERGE_MAIN" "$ACTIVATION_HEAD" "$MERGED_MAIN" "$SUBJECT_PR590_HEAD" "$SUBJECT_PR570_HEAD" "$TOOLING_HEAD"; do
            git fetch --no-tags origin "$sha"
            git cat-file -e "$sha^{commit}"
          done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')" = "$MERGED_MAIN"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${ACTIVATION_PR}" --jq '.merged')" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${ACTIVATION_PR}" --jq '.head.sha')" = "$ACTIVATION_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${ACTIVATION_PR}" --jq '.merge_commit_sha')" = "$MERGED_MAIN"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${SUBJECT_PR}" --jq '.head.sha')" = "$SUBJECT_PR590_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${INSTRUMENT_SUBJECT_PR}" --jq '.head.sha')" = "$SUBJECT_PR570_HEAD"
          mapfile -t changed < <(git diff --name-only "$PREMERGE_MAIN" "$MERGED_MAIN")
          test "${#changed[@]}" = "2"
          printf '%s\n' "${changed[@]}" | cmp - <(printf '%s\n' "$OVERLAY_PATH" "$LOADER_PATH")
          test "$(git rev-parse "$MERGED_MAIN:$OVERLAY_PATH")" = "$OVERLAY_BLOB"
          test "$(git rev-parse "$MERGED_MAIN:$LOADER_PATH")" = "$LOADER_BLOB"
          test "$(git rev-parse "$ACTIVATION_HEAD:$OVERLAY_PATH")" = "$OVERLAY_BLOB"
          test "$(git rev-parse "$ACTIVATION_HEAD:$LOADER_PATH")" = "$LOADER_BLOB"
      - name: Reproduce exact merged main as builder
        run: |
          set -euo pipefail
          rm -rf /tmp/cp11-post-tooling-builder /tmp/cp11-post-builder
          mkdir -p /tmp/cp11-post-builder
          git worktree add --detach /tmp/cp11-post-tooling-builder "$TOOLING_HEAD"
          (
            cd /tmp/cp11-post-tooling-builder
            node tools/h-earth-registry-two-path-toolset/reproduction-harness.v1.mjs \
              --base-head "$PREMERGE_MAIN" \
              --candidate-head "$MERGED_MAIN" \
              --subject-head "$SUBJECT_PR570_HEAD" \
              --execution-holder "CP11_POST_MERGE_BUILDER_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
              --output /tmp/cp11-post-builder/builder-receipt.json
          )
          git worktree remove --force /tmp/cp11-post-tooling-builder
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('/tmp/cp11-post-builder/builder-receipt.json'));
          if(r.result!=='PASS_CLOSED_TWO_PATH_SUCCESSOR_REPRODUCED')throw Error(`POST_MERGE_BUILDER_FAILED:${r.errorCode??'UNKNOWN'}`);
          if(r.baseHead!==process.env.PREMERGE_MAIN||r.candidateHead!==process.env.MERGED_MAIN||r.subjectHead!==process.env.SUBJECT_PR570_HEAD)throw Error('POST_MERGE_BUILDER_HEAD_MISMATCH');
          if(r.overlayBlob!==process.env.OVERLAY_BLOB||r.loaderBlob!==process.env.LOADER_BLOB||r.predecessorBlob!==process.env.PREDECESSOR_BLOB)throw Error('POST_MERGE_BUILDER_BLOB_MISMATCH');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: cp11-post-merge-builder-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/cp11-post-builder/builder-receipt.json
          if-no-files-found: error
          retention-days: 90

  post-merge-fresh-verifier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Independently verify exact merged-main state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for sha in "$PREMERGE_MAIN" "$MERGED_MAIN" "$SUBJECT_PR590_HEAD" "$SUBJECT_PR570_HEAD" "$TOOLING_HEAD"; do
            git fetch --no-tags origin "$sha"
            git cat-file -e "$sha^{commit}"
          done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')" = "$MERGED_MAIN"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${ACTIVATION_PR}" --jq '.merged')" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${SUBJECT_PR}" --jq '.head.sha')" = "$SUBJECT_PR590_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${INSTRUMENT_SUBJECT_PR}" --jq '.head.sha')" = "$SUBJECT_PR570_HEAD"
          mapfile -t changed < <(git diff --name-only "$PREMERGE_MAIN" "$MERGED_MAIN")
          test "${#changed[@]}" = "2"
          printf '%s\n' "${changed[@]}" | cmp - <(printf '%s\n' "$OVERLAY_PATH" "$LOADER_PATH")
          test "$(git rev-parse "$MERGED_MAIN:$OVERLAY_PATH")" = "$OVERLAY_BLOB"
          test "$(git rev-parse "$MERGED_MAIN:$LOADER_PATH")" = "$LOADER_BLOB"
      - name: Reproduce exact merged main as fresh verifier
        run: |
          set -euo pipefail
          rm -rf /tmp/cp11-post-tooling-verifier /tmp/cp11-post-verifier
          mkdir -p /tmp/cp11-post-verifier
          git worktree add --detach /tmp/cp11-post-tooling-verifier "$TOOLING_HEAD"
          (
            cd /tmp/cp11-post-tooling-verifier
            node tools/h-earth-registry-two-path-toolset/reproduction-harness.v1.mjs \
              --base-head "$PREMERGE_MAIN" \
              --candidate-head "$MERGED_MAIN" \
              --subject-head "$SUBJECT_PR570_HEAD" \
              --execution-holder "CP11_POST_MERGE_FRESH_VERIFIER_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
              --output /tmp/cp11-post-verifier/fresh-verifier-receipt.json
          )
          git worktree remove --force /tmp/cp11-post-tooling-verifier
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('/tmp/cp11-post-verifier/fresh-verifier-receipt.json'));
          if(r.result!=='PASS_CLOSED_TWO_PATH_SUCCESSOR_REPRODUCED')throw Error(`POST_MERGE_VERIFIER_FAILED:${r.errorCode??'UNKNOWN'}`);
          if(r.baseHead!==process.env.PREMERGE_MAIN||r.candidateHead!==process.env.MERGED_MAIN||r.subjectHead!==process.env.SUBJECT_PR570_HEAD)throw Error('POST_MERGE_VERIFIER_HEAD_MISMATCH');
          if(r.overlayBlob!==process.env.OVERLAY_BLOB||r.loaderBlob!==process.env.LOADER_BLOB||r.predecessorBlob!==process.env.PREDECESSOR_BLOB)throw Error('POST_MERGE_VERIFIER_BLOB_MISMATCH');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: cp11-post-merge-verifier-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/cp11-post-verifier/fresh-verifier-receipt.json
          if-no-files-found: error
          retention-days: 90

  certify-close-and-terminate:
    needs: [post-merge-builder, post-merge-fresh-verifier]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: cp11-post-merge-builder-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/cp11-post-builder
      - uses: actions/download-artifact@v4
        with:
          name: cp11-post-merge-verifier-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/cp11-post-verifier
      - name: Reconfirm terminal identities and carrier boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for sha in "$PREMERGE_MAIN" "$ACTIVATION_HEAD" "$MERGED_MAIN" "$SUBJECT_PR590_HEAD" "$SUBJECT_PR570_HEAD"; do git fetch --no-tags origin "$sha"; done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')" = "$MERGED_MAIN"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${ACTIVATION_PR}" --jq '.merged')" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${ACTIVATION_PR}" --jq '.head.sha')" = "$ACTIVATION_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${ACTIVATION_PR}" --jq '.merge_commit_sha')" = "$MERGED_MAIN"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${SUBJECT_PR}" --jq '.head.sha')" = "$SUBJECT_PR590_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${INSTRUMENT_SUBJECT_PR}" --jq '.head.sha')" = "$SUBJECT_PR570_HEAD"
          carrier="${{ github.event.pull_request.number }}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${carrier}" --jq '.merged')" = "false"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${carrier}/files?per_page=100" > /tmp/carrier-files.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files=JSON.parse(fs.readFileSync('/tmp/carrier-files.json')).map(x=>x.filename);
          if(files.length!==1||files[0]!==process.env.WORKFLOW_PATH)throw Error(`TERMINAL_CARRIER_SCOPE_MISMATCH:${JSON.stringify(files)}`);
          NODE
      - name: Certify fingerprints and run automatic registry preflight
        run: |
          set -euo pipefail
          mkdir -p /tmp/cp11-terminal
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const b=JSON.parse(fs.readFileSync('/tmp/cp11-post-builder/builder-receipt.json'));
          const v=JSON.parse(fs.readFileSync('/tmp/cp11-post-verifier/fresh-verifier-receipt.json'));
          if(b.result!=='PASS_CLOSED_TWO_PATH_SUCCESSOR_REPRODUCED'||v.result!==b.result)throw Error('POST_MERGE_RESULT_MISMATCH');
          if(b.executionHolder===v.executionHolder)throw Error('POST_MERGE_HOLDERS_NOT_DISTINCT');
          if(b.packageFingerprint!==v.packageFingerprint)throw Error('POST_MERGE_FINGERPRINT_MISMATCH');
          const expected=[process.env.OVERLAY_PATH,process.env.LOADER_PATH];
          if(JSON.stringify(b.changedPaths)!==JSON.stringify(expected)||JSON.stringify(v.changedPaths)!==JSON.stringify(expected))throw Error('POST_MERGE_PATH_SET_MISMATCH');
          const receipt={schema:'CP11_H_EARTH_TWO_PATH_POST_MERGE_VERIFICATION_v1',result:'PASS_CLOSED_MERGED_MAIN_EXACT_AND_INDEPENDENTLY_REPRODUCED',operationId:process.env.OPERATION_ID,operationGeneration:Number(process.env.OPERATION_GENERATION),preMergeMain:process.env.PREMERGE_MAIN,activationHead:process.env.ACTIVATION_HEAD,mergedMain:process.env.MERGED_MAIN,activationPr:Number(process.env.ACTIVATION_PR),immutableSubjectHead:process.env.SUBJECT_PR590_HEAD,instrumentSubjectHead:process.env.SUBJECT_PR570_HEAD,exactToolingHead:process.env.TOOLING_HEAD,preMergeSuccessorFingerprint:process.env.PREMERGE_SUCCESSOR_FINGERPRINT,preMergeCertificationDigest:process.env.PREMERGE_CERTIFICATION_DIGEST,postMergeFingerprint:b.packageFingerprint,builderHolder:b.executionHolder,verifierHolder:v.executionHolder,distinctExecutionHolders:true,exactChangedPaths:expected,overlayBlob:b.overlayBlob,loaderBlob:b.loaderBlob,predecessorBlob:b.predecessorBlob,runtime:b.runtime,semanticChecks:b.semanticChecks,productMutation:false,pr570Mutation:false,verificationCarrierMerged:false,headSubstitution:false};
          receipt.receiptDigest=crypto.createHash('sha256').update(JSON.stringify(receipt)).digest('hex');
          fs.writeFileSync('/tmp/cp11-terminal/post-merge-verification.json',JSON.stringify(receipt,null,2)+'\n');
          fs.copyFileSync('/tmp/cp11-post-builder/builder-receipt.json','/tmp/cp11-terminal/builder-receipt.json');
          fs.copyFileSync('/tmp/cp11-post-verifier/fresh-verifier-receipt.json','/tmp/cp11-terminal/fresh-verifier-receipt.json');
          NODE
          rm -rf /tmp/cp11-merged-worktree
          git worktree add --detach /tmp/cp11-merged-worktree "$MERGED_MAIN"
          (
            cd /tmp/cp11-merged-worktree
            node --input-type=module <<'NODE'
            import fs from 'node:fs';
            import {runHEarthC2R1MC5AutomaticRegistryPreflight} from './h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js';
            const r=await runHEarthC2R1MC5AutomaticRegistryPreflight();
            if(r.finalDisposition!=='PASS'||r.requiredFinalDisposition!=='PASS')throw Error('POST_MERGE_AUTOMATIC_PREFLIGHT_FAILED');
            fs.writeFileSync('/tmp/cp11-terminal/automatic-registry-preflight.json',JSON.stringify(r,null,2)+'\n');
            NODE
          )
          git worktree remove --force /tmp/cp11-merged-worktree
      - name: Close CP11 generation 85 PASS_CLOSED
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tools/operation-intake/repository-operation-lock-manager.v1.mjs \
            --action close \
            --repository "$GITHUB_REPOSITORY" \
            --lock-ref "$LOCK_REF" \
            --operation-id "$OPERATION_ID" \
            --lock-scope "$OPERATION_SCOPE" \
            --lock-generation "$OPERATION_GENERATION" \
            --terminal-disposition PASS_CLOSED \
            --output /tmp/cp11-terminal/closure-receipt.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('/tmp/cp11-terminal/closure-receipt.json'));
          if(r.result!=='TERMINAL_CLOSURE_COMMITTED'||r.lockReleased!==true||r.terminalDisposition!=='PASS_CLOSED')throw Error(`CP11_CLOSURE_FAILED:${JSON.stringify(r)}`);
          NODE
      - name: Verify terminal ledger and emit authority termination
        run: |
          set -euo pipefail
          git fetch --no-tags origin operation-locks/repository-operation-intake-v1
          git show FETCH_HEAD:"$LEDGER_PATH" > /tmp/cp11-terminal/terminal-ledger.json
          ledger_head="$(git rev-parse FETCH_HEAD)"
          export LEDGER_HEAD="$ledger_head"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const ledger=JSON.parse(fs.readFileSync('/tmp/cp11-terminal/terminal-ledger.json'));
          const closure=JSON.parse(fs.readFileSync('/tmp/cp11-terminal/closure-receipt.json'));
          const terminal=ledger.terminalHistory.find(x=>x.operationId===process.env.OPERATION_ID&&Number(x.lockGeneration)===Number(process.env.OPERATION_GENERATION));
          const active=Object.values(ledger.activeScopes??{}).find(x=>x.operationId===process.env.OPERATION_ID);
          if(active)throw Error('CP11_AUTHORITY_STILL_ACTIVE');
          if(!terminal||terminal.state!=='TERMINAL'||terminal.released!==true||terminal.terminalDisposition!=='PASS_CLOSED')throw Error('CP11_TERMINAL_HISTORY_MISSING');
          const receipt={schema:'CP11_H_EARTH_TWO_PATH_AUTHORITY_TERMINATION_v1',result:'PASS_CLOSED_CP11_AUTHORITY_TERMINATED',operationId:process.env.OPERATION_ID,operationGeneration:Number(process.env.OPERATION_GENERATION),lockScope:process.env.OPERATION_SCOPE,terminalDisposition:'PASS_CLOSED',lockReleased:true,closureCommit:closure.closureCommitSha,committedLedgerBlob:closure.committedLedgerBlobSha,terminalLedgerHead:process.env.LEDGER_HEAD,mergedMain:process.env.MERGED_MAIN,activationPr:Number(process.env.ACTIVATION_PR),activationHead:process.env.ACTIVATION_HEAD,constructionAuthorityActive:false,verificationAuthorityActive:false,mergeAuthorityActive:false,residualAuthority:false,verificationCarrierMerged:false,productMutation:false,pr570Mutation:false,deployment:false,release:false};
          receipt.receiptDigest=crypto.createHash('sha256').update(JSON.stringify(receipt)).digest('hex');
          fs.writeFileSync('/tmp/cp11-terminal/authority-termination.json',JSON.stringify(receipt,null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: cp11-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/cp11-terminal
          if-no-files-found: error
          retention-days: 90
