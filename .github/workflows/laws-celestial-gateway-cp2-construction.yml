, Integrity, Reality, and Structure.</p></section><section class="panel" id="reverse-audit"><p class="kicker">Test 3</p><h2>Reverse Audit</h2><p>The accepted record is traversed backward to expose baseline drift, contradiction, identity loss, unsupported substitutions, or invented evidence.</p></section><section class="panel" id="results-records"><p class="kicker">Test 4</p><h2>Results &amp; Records</h2><p>Classify pass, fail, held, insufficient evidence, or not admitted while preserving receipts, claim ceilings, and Research sources.</p><details><summary>Open the optional record tool</summary><div class="tool"><label>Proposition<textarea data-proposition></textarea></label><label>Baseline authority<textarea data-baseline></textarea></label><button type="button" data-create>Prepare bounded record</button><pre class="receipt" data-receipt>status=NOT_ADMITTED</pre></div></details></section></main></div><script>(()=>{"use strict";const p=document.querySelector("[data-proposition]"),b=document.querySelector("[data-baseline]"),r=document.querySelector("[data-receipt]"),c=document.querySelector("[data-create]");c?.addEventListener("click",()=>{const admitted=Boolean(p.value.trim()&&b.value.trim());r.textContent=[`status=${admitted?"ADMITTED_FOR_FORWARD_CONSTRUCTION":"NOT_ADMITTED"}`,`proposition=${p.value.trim()||"missing"}`,`baseline=${b.value.trim()||"missing"}`,"scientific_validation_claimed=false"].join("\\n")})})();</script></body></html>'''; write('laws/test/index.html',test_page)
