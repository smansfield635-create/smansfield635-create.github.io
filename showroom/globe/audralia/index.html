<!doctype html>
<html lang="en" data-audralia-live-planetary="active">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0e1510">
  <meta name="description" content="Explore Audralia continuously from planetary scale to surface-horizon view and back again.">
  <title>Audralia · Planetary World</title>
  <link rel="canonical" href="https://diamondgatebridge.com/showroom/globe/audralia/">
  <link rel="modulepreload" href="../h-earth/terrain-estate-construction-v1/app.mjs">
  <link rel="modulepreload" href="../h-earth/terrain-estate-construction-v1/renderer.mjs">
  <link rel="modulepreload" href="../../../h-earth-3d/terrain/h-earth.terrain-estate-construction-v1.candidate.js">
  <link rel="modulepreload" href="./surface-horizon-bootstrap.mjs">
  <link rel="stylesheet" href="./index.css?v=AUDRALIA_LIVE_STARTUP_LOADING_v1">
  <link rel="stylesheet" href="./surface-horizon.css?v=AUDRALIA_SURFACE_HORIZON_TRAVERSAL_v1">
</head>
<body>
  <div class="audralia-loading-screen" data-audralia-loader role="status" aria-live="polite" aria-label="Audralia is loading">
    <div class="audralia-loading-panel">
      <div class="audralia-loading-orbit" aria-hidden="true"></div>
      <div class="audralia-loading-title">Audralia</div>
      <div class="audralia-loading-stage" data-audralia-loader-stage>Preparing the world…</div>
      <div class="audralia-loading-track" aria-hidden="true"><span></span></div>
      <div class="audralia-loading-time" data-audralia-loader-time>0.0 s</div>
      <div class="audralia-loading-note">Building one continuous world from planetary scale to the surface horizon.</div>
    </div>
  </div>

  <main class="audralia-live-shell" aria-label="Audralia planetary world">
    <header class="audralia-live-toolbar" aria-label="Audralia world navigation">
      <div class="audralia-live-brand" aria-label="Audralia">Audralia</div>
      <nav class="audralia-live-nav" aria-label="World navigation">
        <button class="audralia-live-action audralia-live-action-primary" type="button" data-fit-world>focus Gratitude</button>
        <a class="audralia-live-action" href="../h-earth/">H-Earth · Play</a>
        <a class="audralia-live-action" href="../../../index.html">Compass</a>
        <a class="audralia-live-action" href="../../">Mirrorland</a>
      </nav>
      <span class="audralia-sr-only" data-h-earth-status aria-live="polite">booting Audralia</span>
    </header>

    <section class="audralia-world-stage" aria-label="Interactive Audralia planetary view">
      <canvas
        class="audralia-world-canvas"
        data-h-earth-map-wide-canvas
        aria-label="Interactive Audralia world. Drag one finger to look independently. Slide two fingers together in the same direction to travel. Pinch two fingers together to go lower toward the surface. Spread two fingers apart to go higher toward planetary view."
      ></canvas>
      <p class="audralia-sr-only" data-h-earth-diagnostic aria-live="polite"></p>
    </section>

    <footer class="audralia-live-help" aria-label="Four-step exploration guide">
      <div class="audralia-help-rule">1 finger = LOOK · 2 fingers = MOVE · same gap = TRAVEL · change the gap = HEIGHT</div>
      <div class="audralia-help-steps" role="group" aria-label="Open an exploration step">
        <button class="audralia-help-step" type="button" data-help-step="1" aria-expanded="false" aria-controls="audralia-help-detail"><span class="audralia-help-step-number">1</span><span>LOOK</span></button>
        <button class="audralia-help-step" type="button" data-help-step="2" aria-expanded="false" aria-controls="audralia-help-detail"><span class="audralia-help-step-number">2</span><span>TRAVEL</span></button>
        <button class="audralia-help-step" type="button" data-help-step="3" aria-expanded="false" aria-controls="audralia-help-detail"><span class="audralia-help-step-number">3</span><span>LOWER</span></button>
        <button class="audralia-help-step" type="button" data-help-step="4" aria-expanded="false" aria-controls="audralia-help-detail"><span class="audralia-help-step-number">4</span><span>HIGHER</span></button>
      </div>
      <div class="audralia-help-panel" id="audralia-help-detail" data-help-panel hidden aria-live="polite">
        <strong data-help-panel-title></strong>
        <p data-help-panel-copy></p>
      </div>
    </footer>
  </main>

  <script>
    window.__AUDRALIA_LIVE_PLANETARY_INTEGRATION__ = Object.freeze({
      schema: 'AUDRALIA_LIVE_PLANETARY_INTEGRATION_v1',
      legacyPlanetActive: false,
      diagnosticTrackPreserved: true,
      planetarySourceHead: 'f7f14a8748a2a782f5795ad395ae5967a7d3949d',
      surfaceHorizonTraversalCandidate: true,
      surfaceHorizonBaseHead: '798d3b034ed9814574e5cbe189ef280eb857602e'
    });

    (() => {
      const loader = document.querySelector('[data-audralia-loader]');
      const stageNode = document.querySelector('[data-audralia-loader-stage]');
      const timeNode = document.querySelector('[data-audralia-loader-time]');
      const statusNode = document.querySelector('[data-h-earth-status]');
      if (!loader || !stageNode || !timeNode || !statusNode) return;

      const startedAt = performance.now();
      let finished = false;
      const stageLabels = Object.freeze({
        BOOTSTRAP_ACTIVE: 'Preparing the world…',
        IMPORTING_CLOUD_VISUAL_REFERENCE: 'Loading planetary systems…',
        BUILDING_CLOUD_PERFORMANCE_SUCCESSOR: 'Building surface-horizon traversal…'
      });
      const elapsed = () => Math.max(0, performance.now() - startedAt);
      const renderElapsed = () => { timeNode.textContent = `${(elapsed() / 1000).toFixed(1)} s`; };

      const finish = () => {
        if (finished) return;
        finished = true;
        const elapsedMs = elapsed();
        renderElapsed();
        stageNode.textContent = 'World ready';
        loader.classList.add('is-ready');
        window.__AUDRALIA_STARTUP_LOADING_RECEIPT__ = Object.freeze({
          schema: 'AUDRALIA_LIVE_STARTUP_LOADING_RECEIPT_v1',
          elapsedMs,
          readyState: statusNode.dataset.status || statusNode.textContent.trim(),
          measuredInBrowser: true,
          geometryReducedForLoadTime: false,
          modulePreloadEnabled: true,
          surfaceHorizonTraversalCandidate: true
        });
        window.setTimeout(() => { loader.hidden = true; }, 420);
      };

      const update = () => {
        const state = statusNode.dataset.status || '';
        const text = statusNode.textContent.trim();
        renderElapsed();
        if (state.includes('FAILED') || text === 'ERROR' || text === 'FAIL') {
          finished = true;
          stageNode.textContent = 'Audralia could not finish loading';
          loader.classList.add('is-error');
          return;
        }
        if (text === 'REVIEW' || state.includes('VISUAL_READY') || state.includes('USER_REVIEW_REQUIRED')) {
          finish();
          return;
        }
        stageNode.textContent = stageLabels[state] || (text && !text.includes('…') ? text : 'Building the world…');
      };

      const observer = new MutationObserver(update);
      observer.observe(statusNode, { attributes: true, attributeFilter: ['data-status'], childList: true, subtree: true });
      const ticker = window.setInterval(() => {
        if (finished) { window.clearInterval(ticker); observer.disconnect(); return; }
        renderElapsed();
      }, 250);
      update();
    })();
  </script>
  <script type="module" src="./surface-horizon-bootstrap.mjs?v=AUDRALIA_SURFACE_HORIZON_TRAVERSAL_v1"></script>
</body>
</html>
