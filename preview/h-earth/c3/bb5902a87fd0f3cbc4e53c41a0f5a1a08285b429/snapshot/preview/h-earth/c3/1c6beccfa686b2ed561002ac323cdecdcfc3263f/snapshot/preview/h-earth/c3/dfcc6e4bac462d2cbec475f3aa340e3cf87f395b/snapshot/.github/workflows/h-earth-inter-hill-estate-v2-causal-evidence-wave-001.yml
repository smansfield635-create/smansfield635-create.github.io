name: H-Earth Inter-Hill Estate V2 Causal Evidence Wave 001

on:
  workflow_call:
    inputs:
      epoch: { required: true, type: string }
      wave_descriptor_json: { required: true, type: string }
      authorized_candidate_head: { required: true, type: string }

permissions:
  contents: read

jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(inputs.wave_descriptor_json).shards }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.authorized_candidate_head }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.1 }
      - uses: actions/download-artifact@v4
        with: { name: h-earth-v2-causal-001-frozen-plan, path: artifacts }
      - uses: actions/download-artifact@v4
        with:
          name: h-earth-v2-causal-001-preflight-${{ matrix.shard.sourceMode }}
          path: artifacts/preflight
      - run: mkdir -p "artifacts/${{ inputs.epoch }}/${{ matrix.shard.sourceMode }}/wave-${{ matrix.shard.waveIndex }}/shard-${{ matrix.shard.shardIndex }}"
      - env:
          H_EARTH_FULL_CAUSAL_EXECUTION_AUTHORIZED: "TRUE"
        run: >-
          node h-earth-3d/validation/h-earth.inter-hill-estate-v2-causal-evidence-execution-001.mjs
          shard --epoch "${{ inputs.epoch }}"
          --plan artifacts/execution-plan.json
          --preflight "artifacts/preflight/${{ matrix.shard.sourceMode }}.eligible-seed-manifest.json"
          --source-mode "${{ matrix.shard.sourceMode }}"
          --shard-index "${{ matrix.shard.shardIndex }}"
          --output-root "artifacts/${{ inputs.epoch }}/${{ matrix.shard.sourceMode }}/wave-${{ matrix.shard.waveIndex }}/shard-${{ matrix.shard.shardIndex }}"
      - uses: actions/upload-artifact@v4
        with:
          name: h-earth-v2-causal-001-${{ inputs.epoch }}-${{ matrix.shard.sourceMode }}-wave-${{ matrix.shard.waveIndex }}-shard-${{ matrix.shard.shardIndex }}
          path: artifacts/${{ inputs.epoch }}/${{ matrix.shard.sourceMode }}/wave-${{ matrix.shard.waveIndex }}/shard-${{ matrix.shard.shardIndex }}
          if-no-files-found: error
          retention-days: 30
