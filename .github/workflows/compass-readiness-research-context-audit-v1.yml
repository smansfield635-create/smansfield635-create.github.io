name: Compass Readiness Research Context Audit v1
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/compass/compass.readiness-context-v1.js'
      - 'laws/research/methods-and-models/**'
      - '.github/workflows/compass-readiness-research-context-audit-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Verify contextual successor and research surface
        run: |
          python3 -m http.server 4173 >/tmp/dgb-http.log 2>&1 &
          cat > .audit-verify.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const contexts=[
            {name:'tablet',viewport:{width:960,height:1536}},
            {name:'phone',viewport:{width:390,height:844}},
            {name:'desktop',viewport:{width:1440,height:1000}}
          ];
          for(const cfg of contexts){
            const page=await browser.newPage({viewport:cfg.viewport});
            await page.goto('http://127.0.0.1:4173/?audit='+Date.now(),{waitUntil:'networkidle',timeout:120000});
            await page.waitForFunction(()=>globalThis.DGB_COMPASS_READINESS_CONTEXT_V1?.mounted===true,{timeout:30000});
            const base=await page.evaluate(()=>({
              owner:globalThis.DGB_COMPASS_READINESS_CONTEXT_V1,
              tabs:[...document.querySelectorAll('.compass-readiness-tabs > .compass-readiness-tab')].map(x=>x.textContent.trim()),
              families:[...document.querySelectorAll('.compass-readiness-family')].map(x=>({type:x.dataset.readinessFamily,count:x.querySelectorAll('.compass-readiness-slide').length})),
              cardinals:document.querySelectorAll('[data-compass-cardinal]').length,
              readable:document.querySelectorAll('[data-compass-cardinal].is-readable-cardinal').length,
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
            }));
            if(JSON.stringify(base.tabs)!==JSON.stringify(['TRL','TRA','RESEARCH']))throw new Error(cfg.name+' FAMILY_TABS '+JSON.stringify(base));
            for(const family of base.families){if(family.count!==4)throw new Error(cfg.name+' SLIDE_COUNT '+JSON.stringify(base));}
            if(base.owner.geometryChanged!==false||base.owner.compassStateChanged!==false)throw new Error(cfg.name+' SCOPE_RECEIPT '+JSON.stringify(base.owner));
            if(base.cardinals!==4||base.readable!==1)throw new Error(cfg.name+' COMPASS_REGRESSION '+JSON.stringify(base));
            if(base.overflow>2)throw new Error(cfg.name+' HORIZONTAL_OVERFLOW '+JSON.stringify(base));
            for(const label of ['TRA','RESEARCH','TRL']){
              await page.getByRole('tab',{name:label,exact:true}).click();
              await page.waitForTimeout(120);
              const state=await page.evaluate(()=>({active:document.querySelector('.compass-readiness-stage')?.dataset.activeFamily,visible:[...document.querySelectorAll('.compass-readiness-family')].filter(x=>!x.hidden).map(x=>x.dataset.readinessFamily)}));
              const expected=label.toLowerCase();
              if(state.active!==expected||state.visible.length!==1||state.visible[0]!==expected)throw new Error(cfg.name+' FAMILY_SWITCH '+label+' '+JSON.stringify(state));
            }
            await page.getByRole('tab',{name:'RESEARCH',exact:true}).click();
            const researchText=await page.locator('[data-readiness-family="research"]').innerText();
            for(const phrase of ['Condition is not capacity','Prospective evidence exists','The decisive threshold is still ahead'])if(!researchText.includes(phrase))throw new Error(cfg.name+' MISSING_RESEARCH_COPY '+phrase);
            await page.close();
          }
          const rp=await browser.newPage({viewport:{width:960,height:1200}});
          await rp.goto('http://127.0.0.1:4173/laws/research/methods-and-models/?audit='+Date.now(),{waitUntil:'networkidle',timeout:120000});
          await rp.waitForFunction(()=>globalThis.METHODS_MODELS_CAROUSEL_DATA?.contract==='METHODS_MODELS_SINGLE_AXIS_CAROUSEL_DATA_v2',{timeout:30000});
          const research=await rp.evaluate(()=>({
            contract:globalThis.METHODS_MODELS_CAROUSEL_DATA.contract,
            families:globalThis.METHODS_MODELS_CAROUSEL_DATA.families.map(f=>f.id),
            imi:globalThis.METHODS_MODELS_CAROUSEL_DATA.families.find(f=>f.id==='maneuverability')?.models.map(m=>({id:m.id,status:m.status,statement:m.statement,limits:m.limits}))||[]
          }));
          if(!research.families.includes('maneuverability'))throw new Error('RESEARCH_FAMILY_MISSING '+JSON.stringify(research));
          if(research.imi.length!==4)throw new Error('IMI_MODEL_COUNT '+JSON.stringify(research));
          const ag=research.imi.find(m=>m.id==='agricultural-temporal');
          if(!ag||!ag.statement.includes('did not beat the additive Mean4 comparator')||!ag.limits.includes('not confirmatory validation'))throw new Error('AGRICULTURAL_BOUNDARY '+JSON.stringify(ag));
          console.log('PASS',JSON.stringify({contexts:contexts.map(x=>x.name),research}));
          await browser.close();
          NODE
          node ./.audit-verify.mjs
