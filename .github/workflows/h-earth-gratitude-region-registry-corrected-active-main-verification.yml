name: H-Earth Gratitude Region Corrected Registry Active Main Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/h-earth-gratitude-region-registry-corrected-active-main-verification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-corrected-active-main-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR 319 merge commit
        uses: actions/checkout@v4
        with:
          ref: 048294358eb6ad563564730eb130650a963fb059
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact merge commit, current main equivalence, and registry blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "048294358eb6ad563564730eb130650a963fb059"
          git fetch --no-tags origin main
          git fetch --no-tags origin a0cadd1e5ce70d98c34f11ddacb063c91816bd93
          git diff --quiet 048294358eb6ad563564730eb130650a963fb059 origin/main -- .
          test "$(git hash-object h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.gratitude-region-coordinate-reconciliation-occurrence-correction.js)" = "c5aaf2ea9cecc838145565484ecafefe9e4b4860"
          test "$(git hash-object h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js)" = "739e28c7bdaf860f6c46f604cc5bf1a6e1b9ee09"
          test "$(git hash-object h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.gratitude-region-coordinate-reconciliation-scope.js)" = "cacf05628627d3f427ae37fbbc0e00139ce8351a"

      - name: Execute corrected active-main registry verification twice
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { pathToFileURL } from 'node:url';

          const root = process.cwd();
          const importFromRoot = async (relativePath) => import(pathToFileURL(path.join(root, relativePath)).href);
          const loaderModule = await importFromRoot('h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js');
          const correctionModule = await importFromRoot('h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.gratitude-region-coordinate-reconciliation-occurrence-correction.js');
          const preflightModule = await importFromRoot('h-earth-3d/registry/activation/h-earth.repository-registry.auto-preflight.js');

          const loadDependencies = loaderModule.default;
          const registryFacade = correctionModule.default;
          const correctedOccurrences = correctionModule.H_EARTH_GRATITUDE_REGION_COORDINATE_RECONCILIATION_CORRECTED_PACKAGE_OCCURRENCES;
          const correctedNode = correctionModule.H_EARTH_GRATITUDE_REGION_COORDINATE_RECONCILIATION_CORRECTED_SCOPE_NODE;
          const runAutomaticHEarthPreflight = preflightModule.runAutomaticHEarthPreflight;

          const MERGE_COMMIT = '048294358eb6ad563564730eb130650a963fb059';
          const PACKAGE_HEAD = 'a0cadd1e5ce70d98c34f11ddacb063c91816bd93';
          const SUCCESSOR_OVERLAY_BLOB = 'c5aaf2ea9cecc838145565484ecafefe9e4b4860';
          const CORRECTED_LOADER_BLOB = '739e28c7bdaf860f6c46f604cc5bf1a6e1b9ee09';
          const HISTORICAL_OVERLAY_BLOB = 'cacf05628627d3f427ae37fbbc0e00139ce8351a';
          const TARGET_PATH = '/h-earth-3d/validation/h-earth.gratitude-region.mirror-manor-reconciliation.runner.mjs';
          const RETIRED_BLOB = '72d06326cc1a990c5a748d7b4d2b8368b32c2c79';
          const CORRECTED_BLOB = '72d0ffcd9835a2a02b18b220382db105edbc4314';
          const CORRECTION_PATH = '/h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.gratitude-region-coordinate-reconciliation-occurrence-correction.js';
          const HISTORICAL_OVERLAY_PATH = '/h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.gratitude-region-coordinate-reconciliation-scope.js';
          const LOADER_PATH = '/h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js';
          const PACKAGE_NODE_ID = correctedNode.nodeId;

          const stable = (value) => value === null || typeof value !== 'object'
            ? JSON.stringify(value)
            : Array.isArray(value)
              ? `[${value.map(stable).join(',')}]`
              : `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${stable(value[key])}`).join(',')}}`;
          const digest = (value) => crypto.createHash('sha256').update(stable(value)).digest('hex');
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const blobAt = (commit, repositoryPath) => {
            const cleanPath = repositoryPath.replace(/^\//, '');
            const line = git('ls-tree', commit, '--', cleanPath);
            const match = line.match(/^\d+\s+blob\s+([0-9a-f]{40})\t/);
            return match?.[1] ?? null;
          };

          function executeVerification() {
            const issues = [];
            const currentMainHead = git('rev-parse', 'origin/main');
            const exactCheckoutHead = git('rev-parse', 'HEAD');
            const currentMainTree = git('rev-parse', 'origin/main^{tree}');
            const mergeCommitTree = git('rev-parse', `${MERGE_COMMIT}^{tree}`);
            const successorOverlayBlob = blobAt(MERGE_COMMIT, CORRECTION_PATH);
            const correctedLoaderBlob = blobAt(MERGE_COMMIT, LOADER_PATH);
            const historicalOverlayBlob = blobAt(MERGE_COMMIT, HISTORICAL_OVERLAY_PATH);

            if (exactCheckoutHead !== MERGE_COMMIT) issues.push(`EXACT_CHECKOUT_HEAD_MISMATCH:${exactCheckoutHead}`);
            if (currentMainTree !== mergeCommitTree) issues.push(`CURRENT_MAIN_TREE_DIVERGED:${currentMainHead}`);
            if (successorOverlayBlob !== SUCCESSOR_OVERLAY_BLOB) issues.push(`SUCCESSOR_OVERLAY_BLOB_MISMATCH:${successorOverlayBlob}`);
            if (correctedLoaderBlob !== CORRECTED_LOADER_BLOB) issues.push(`CORRECTED_LOADER_BLOB_MISMATCH:${correctedLoaderBlob}`);
            if (historicalOverlayBlob !== HISTORICAL_OVERLAY_BLOB) issues.push(`HISTORICAL_OVERLAY_BLOB_MISMATCH:${historicalOverlayBlob}`);

            const dependencies = loadDependencies();
            if (dependencies.identityVerified !== true) issues.push('LOADER_DEPENDENCY_IDENTITY_NOT_VERIFIED');
            if (dependencies.registryFacade !== registryFacade) issues.push('LOADER_FACADE_NOT_CORRECTION_FACADE');

            const expected = new Map(correctedOccurrences);
            const allPackagePaths = [...expected.keys()];
            const governedPaths = allPackagePaths.filter((repositoryPath) =>
              repositoryPath.startsWith('/h-earth-3d/') || repositoryPath.startsWith('/showroom/globe/h-earth/'));
            if (allPackagePaths.length !== 16) issues.push(`PACKAGE_PATH_COUNT_${allPackagePaths.length}_NOT_16`);
            if (governedPaths.length !== 15) issues.push(`GOVERNED_PATH_COUNT_${governedPaths.length}_NOT_15`);
            if (new Set(allPackagePaths).size !== 16) issues.push('DUPLICATE_PACKAGE_PATH');

            const actualPackageOccurrences = [];
            for (const [repositoryPath, expectedBlob] of expected.entries()) {
              const actualBlob = blobAt(PACKAGE_HEAD, repositoryPath);
              const exactMatch = actualBlob === expectedBlob;
              actualPackageOccurrences.push({ repositoryPath, expectedBlob, actualBlob, exactMatch });
              if (!exactMatch) issues.push(`PACKAGE_GIT_BLOB_MISMATCH:${repositoryPath}:${actualBlob}`);
            }

            for (const repositoryPath of [...allPackagePaths, CORRECTION_PATH, HISTORICAL_OVERLAY_PATH, LOADER_PATH]) {
              const resolution = registryFacade.resolveHEarthRepositoryRegistryPath(repositoryPath);
              if (resolution.resolved !== true || resolution.unresolved !== false) issues.push(`PATH_UNRESOLVED:${repositoryPath}`);
              if (!resolution.nodes.some((node) => node.nodeId === PACKAGE_NODE_ID)) issues.push(`PACKAGE_NODE_NOT_RESOLVED:${repositoryPath}`);
              if (!Array.isArray(resolution.occurrences) || resolution.occurrences.length < 1) issues.push(`OCCURRENCE_UNRESOLVED:${repositoryPath}`);
            }

            const correctedResolution = registryFacade.resolveHEarthRepositoryRegistryOccurrence({
              path: TARGET_PATH,
              commitSha: PACKAGE_HEAD,
              gitBlobSha: CORRECTED_BLOB
            });
            const retiredResolution = registryFacade.resolveHEarthRepositoryRegistryOccurrence({
              path: TARGET_PATH,
              commitSha: PACKAGE_HEAD,
              gitBlobSha: RETIRED_BLOB
            });
            if (correctedResolution.resolved !== true || correctedResolution.matches.length !== 1) {
              issues.push(`CORRECTED_OCCURRENCE_MATCH_COUNT:${correctedResolution.matches.length}`);
            }
            if (retiredResolution.resolved !== false || retiredResolution.matches.length !== 0) {
              issues.push(`RETIRED_OCCURRENCE_STILL_RESOLVES:${retiredResolution.matches.length}`);
            }

            const preflight = runAutomaticHEarthPreflight({
              paths: governedPaths,
              taskText: 'Corrected active-main Gratitude Region registry verification before PR 311 base and delta reconciliation',
              mutationIntent: false
            });
            const failureCodes = preflight.validatorReceipt?.failureCodes ?? [];
            const resolvedPaths = preflight.validatorReceipt?.resolvedPaths ?? [];
            const affectedNodeIds = preflight.scopePreview?.affectedNodeIds ?? [];
            if (preflight.finalDisposition !== 'PASS') issues.push(`PREFLIGHT_DISPOSITION_${preflight.finalDisposition}`);
            if (preflight.continuation !== 'READ_ONLY_CONTINUATION_PERMITTED') issues.push(`PREFLIGHT_CONTINUATION_${preflight.continuation}`);
            if (failureCodes.length !== 0) issues.push(`PREFLIGHT_FAILURE_CODES:${failureCodes.join(',')}`);
            if (resolvedPaths.length !== 15) issues.push(`PREFLIGHT_RESOLVED_PATH_COUNT_${resolvedPaths.length}_NOT_15`);
            if (!affectedNodeIds.includes(PACKAGE_NODE_ID)) issues.push('PACKAGE_NODE_NOT_IN_AFFECTED_SCOPE');

            const instance = registryFacade.getHEarthRepositoryRegistryInstance();
            const packageNodeCount = instance.nodes.filter((node) => node.nodeId === PACKAGE_NODE_ID).length;
            if (packageNodeCount !== 1) issues.push(`PACKAGE_NODE_COUNT_${packageNodeCount}_NOT_1`);
            if (correctedNode.authorityClass !== 'NO_AUTHORITY') issues.push('PACKAGE_NODE_AUTHORITY_OVERREACH');
            if (correctedNode.allowedMutationScope !== 'READ_ONLY_INSPECTION') issues.push('PACKAGE_NODE_MUTATION_SCOPE_OVERREACH');
            if (correctedNode.lifecycleStatus !== 'CANDIDATE') issues.push('PACKAGE_NODE_LIFECYCLE_PROMOTION');

            const base = {
              schemaVersion: 'H_EARTH_GRATITUDE_REGION_CORRECTED_REGISTRY_ACTIVE_MAIN_EXECUTION_VERIFICATION_RECEIPT_v1',
              operationClass: 'READ_ONLY_ACTIVE_MAIN_REGISTRY_EXECUTION_VERIFICATION',
              pr319MergeCommit: MERGE_COMMIT,
              exactCheckoutHead,
              currentMainHead,
              currentMainTreeEquivalentToMergeCommit: currentMainTree === mergeCommitTree,
              successorOverlayBlob,
              correctedLoaderBlob,
              historicalOverlayBlob,
              packageHead: PACKAGE_HEAD,
              exactPackagePathCount: allPackagePaths.length,
              governedPreflightPathCount: governedPaths.length,
              exactPackageBlobMatches: actualPackageOccurrences.every((entry) => entry.exactMatch),
              actualPackageOccurrences,
              correctedOccurrenceResolved: correctedResolution.resolved,
              correctedOccurrenceMatchCount: correctedResolution.matches.length,
              retiredOccurrenceResolved: retiredResolution.resolved,
              retiredOccurrenceMatchCount: retiredResolution.matches.length,
              loaderIdentityVerified: dependencies.identityVerified,
              activePackageNodePresent: packageNodeCount === 1,
              preflightFinalDisposition: preflight.finalDisposition,
              preflightContinuation: preflight.continuation,
              preflightResolvedPathCount: resolvedPaths.length,
              preflightAffectedNodeIds: affectedNodeIds,
              preflightFailureCodes: failureCodes,
              requestedPathUnresolvedClosed: !failureCodes.includes('REQUESTED_PATH_UNRESOLVED'),
              operationScopeUnresolvedClosed: !failureCodes.includes('OPERATION_SCOPE_UNRESOLVED'),
              spatialCandidateAcceptanceCreated: false,
              finalCoordinateAuthorityCreated: false,
              pr311RetargetAuthorityCreated: false,
              pr311MergeAuthorityCreated: false,
              canonicalizationAuthorityCreated: false,
              terrainMutationAuthorityCreated: false,
              geometryConstructionAuthorityCreated: false,
              runtimeAuthorityCreated: false,
              productConstructionAuthorityCreated: false,
              nextAuthorizedOperation: 'PR_311_BASE_AND_DELTA_RECONCILIATION',
              issues
            };
            return { ...base, receiptDigest: digest(base), status: issues.length === 0 ? 'PASS_CLOSED' : 'FAIL_STOPPED' };
          }

          const first = executeVerification();
          const second = executeVerification();
          const deterministicRepeatExecution = first.receiptDigest === second.receiptDigest;
          const custody = {
            schemaVersion: 'H_EARTH_GRATITUDE_REGION_CORRECTED_REGISTRY_ACTIVE_MAIN_EXECUTION_VERIFICATION_CUSTODY_v1',
            status: deterministicRepeatExecution && first.status === 'PASS_CLOSED' && second.status === 'PASS_CLOSED'
              ? 'PASS_CLOSED'
              : 'FAIL_STOPPED',
            pr319MergeCommit: MERGE_COMMIT,
            currentMainHead: first.currentMainHead,
            currentMainTreeEquivalentToMergeCommit: first.currentMainTreeEquivalentToMergeCommit,
            successorOverlayBlob: first.successorOverlayBlob,
            correctedLoaderBlob: first.correctedLoaderBlob,
            historicalOverlayBlob: first.historicalOverlayBlob,
            packageHead: first.packageHead,
            firstExecutionDigest: first.receiptDigest,
            secondExecutionDigest: second.receiptDigest,
            deterministicRepeatExecution,
            exactPackagePathCount: first.exactPackagePathCount,
            exactPackageBlobMatches: first.exactPackageBlobMatches,
            correctedOccurrenceResolved: first.correctedOccurrenceResolved,
            correctedOccurrenceMatchCount: first.correctedOccurrenceMatchCount,
            retiredOccurrenceResolved: first.retiredOccurrenceResolved,
            retiredOccurrenceMatchCount: first.retiredOccurrenceMatchCount,
            preflightFinalDisposition: first.preflightFinalDisposition,
            preflightResolvedPathCount: first.preflightResolvedPathCount,
            preflightFailureCodes: first.preflightFailureCodes,
            requestedPathUnresolvedClosed: first.requestedPathUnresolvedClosed,
            operationScopeUnresolvedClosed: first.operationScopeUnresolvedClosed,
            pr311RetargetAuthorityCreated: false,
            pr311MergeAuthorityCreated: false,
            canonicalizationAuthorityCreated: false,
            productConstructionAuthorityCreated: false,
            nextAuthorizedOperation: 'PR_311_BASE_AND_DELTA_RECONCILIATION'
          };

          fs.writeFileSync('/tmp/h-earth-corrected-active-main-registry-verification.first.json', `${JSON.stringify(first, null, 2)}\n`);
          fs.writeFileSync('/tmp/h-earth-corrected-active-main-registry-verification.second.json', `${JSON.stringify(second, null, 2)}\n`);
          fs.writeFileSync('/tmp/h-earth-corrected-active-main-registry-verification.custody.json', `${JSON.stringify(custody, null, 2)}\n`);
          console.log(JSON.stringify(custody, null, 2));
          if (custody.status !== 'PASS_CLOSED') process.exitCode = 1;
          NODE

      - name: Upload corrected active-main verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-gratitude-region-corrected-registry-active-main-verification-evidence
          path: |
            /tmp/h-earth-corrected-active-main-registry-verification.first.json
            /tmp/h-earth-corrected-active-main-registry-verification.second.json
            /tmp/h-earth-corrected-active-main-registry-verification.custody.json
          if-no-files-found: error
          retention-days: 30
