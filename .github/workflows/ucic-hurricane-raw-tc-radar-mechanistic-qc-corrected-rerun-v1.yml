name: UCIC Hurricane Raw TC-RADAR Mechanistic QC Corrected Rerun v1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corrected-raw-mechanistic-study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas netCDF4 scikit-learn
      - name: Verify protocol unchanged and correction bounded
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('research/route-operator-platform-v1/registered-challenges/ucic-hurricane-mechanistic-early-warning-v1')
          p=root/'raw-tc-radar-mechanistic-protocol.v1.json'
          q=root/'RAW_TC_RADAR_SST_SENTINEL_QC_CORRECTION_v1.md'
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '52199364e8880188230831080c333a3a83a52fcccd57e7086aa7fac45d45463d'
          text=q.read_text()
          assert 'POST_RESULT_SCIENTIFIC_RETUNING = PROHIBITED' in text
          assert 'TECHNICAL_SENTINEL_CORRECTION = AUTHORIZED_WITH_PROTOCOL_SEMANTICS_UNCHANGED' in text
          print('PASS_PROTOCOL_UNCHANGED_AND_QC_CORRECTION_BOUNDED')
          PY
      - name: Execute corrected raw TC-RADAR mechanistic temporal holdout
        shell: bash
        run: |
          set -euo pipefail
          python research/route-operator-platform-v1/registered-challenges/ucic-hurricane-mechanistic-early-warning-v1/run-raw-tc-radar-mechanistic-qc-corrected-v1.py | tee raw-tc-radar-mechanistic-qc-corrected-execution.log
      - name: Verify terminal result and SST QC
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          root=Path('research/route-operator-platform-v1/registered-challenges/ucic-hurricane-mechanistic-early-warning-v1')
          r=json.loads((root/'raw-tc-radar-mechanistic-qc-corrected-result.v1.json').read_text())
          assert r['terminal_disposition'] in {
            'RAW_TC_RADAR_MECHANISTIC_SUPPORTED_WITH_LIMITATIONS',
            'STRUCTURAL_SIGNAL_PRESENT_NONCOMPENSATORY_SPECIFICITY_NOT_SUPPORTED',
            'RAW_TC_RADAR_SIGNAL_PRESENT_INCONCLUSIVE',
            'RAW_TC_RADAR_MECHANISTIC_NOT_SUPPORTED',
            'RAW_TC_RADAR_MECHANISTIC_UNEVALUABLE'
          }
          d=pd.read_csv(root/'raw-tc-radar-mechanistic-qc-corrected-features.v1.csv')
          bad=d['sst0'].abs().ge(900).fillna(False)
          assert int(bad.sum()) == 0
          print('TERMINAL_DISPOSITION='+r['terminal_disposition'])
          print('PASS_SST_SENTINEL_QC')
          PY
      - name: Preserve corrected empirical result
        uses: actions/upload-artifact@v4
        with:
          name: ucic-hurricane-raw-tc-radar-mechanistic-qc-corrected-rerun-v1
          if-no-files-found: error
          retention-days: 90
          path: |
            research/route-operator-platform-v1/registered-challenges/ucic-hurricane-mechanistic-early-warning-v1/raw-tc-radar-mechanistic-protocol.v1.json
            research/route-operator-platform-v1/registered-challenges/ucic-hurricane-mechanistic-early-warning-v1/RAW_TC_RADAR_SST_SENTINEL_QC_CORRECTION_v1.md
            research/route-operator-platform-v1/registered-challenges/ucic-hurricane-mechanistic-early-warning-v1/raw-tc-radar-mechanistic-qc-corrected-result.v1.json
            research/route-operator-platform-v1/registered-challenges/ucic-hurricane-mechanistic-early-warning-v1/raw-tc-radar-mechanistic-qc-corrected-features.v1.csv
            raw-tc-radar-mechanistic-qc-corrected-execution.log
