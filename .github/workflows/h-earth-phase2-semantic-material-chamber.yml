name: H-Earth Phase2 Semantic Material Chamber
on:
  push:
    branches:
      - h-earth/phase2-semantic-material-classifier-v1
permissions:
  contents: write
  actions: read
jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[semantic-material-chamber]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve exact-head qualified artifacts
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          find_run () {
            WF="$1"
            for attempt in $(seq 1 60); do
              ID=$(gh api "repos/$REPO/actions/workflows/$WF/runs?branch=h-earth/phase2-semantic-material-classifier-v1&per_page=30" --jq ".workflow_runs[] | select(.head_sha==\"$SHA\" and .conclusion==\"success\") | .id" | head -1)
              if [ -n "$ID" ]; then echo "$ID"; return 0; fi
              sleep 10
            done
            return 1
          }
          echo "bake=$(find_run h-earth-phase2-semantic-material-bake.yml)" >> "$GITHUB_OUTPUT"
          echo "qual=$(find_run h-earth-phase2-semantic-material-asset-qualification.yml)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: h-earth-phase2-semantic-material-v2
          path: /tmp/bake
          github-token: ${{ github.token }}
          run-id: ${{ steps.evidence.outputs.bake }}
      - uses: actions/download-artifact@v4
        with:
          name: h-earth-phase2-semantic-material-v2-qualification
          path: /tmp/qual
          github-token: ${{ github.token }}
          run-id: ${{ steps.evidence.outputs.qual }}
      - name: Materialize immutable chamber branch
        env:
          CHAMBER_BRANCH: h-earth/phase2-semantic-material-chamber-v1
          BASE: 2582dda13038c05fe9279177d5a737eb4e7eef73
        run: |
          node -e "const fs=require('fs');const q=JSON.parse(fs.readFileSync('/tmp/qual/semantic-material-v2-qualification.json'));if(q.eligible!==true)process.exit(1)"
          ASHA=$(sha256sum /tmp/bake/semantic-material-v2.rgba | awk '{print $1}')
          QSHA=$(node -e "const q=require('/tmp/qual/semantic-material-v2-qualification.json');process.stdout.write(q.sha256)")
          test "$ASHA" = "$QSHA"
          git checkout --detach "$BASE"
          git checkout -B "$CHAMBER_BRANCH"
          R="preview/h-earth/corridor/38df744ba7402aabe7fd2eaee71b961a451350de/B/showroom/globe/h-earth/render"
          cp /tmp/bake/semantic-material-v2.rgba "$R/terrain-material-field.phase2-semantic-v2.rgba"
          cp "$R/terrain-material-field.round2-baked.v1.js" "$R/terrain-material-field.phase2-semantic-v2.js"
          sed -i "s/H_EARTH_BAKED_MATERIAL_FIELD_ID/H_EARTH_PHASE2_SEMANTIC_MATERIAL_FIELD_ID/g; s/H_EARTH_BAKED_MATERIAL_FIELD_WIDTH/H_EARTH_PHASE2_SEMANTIC_MATERIAL_FIELD_WIDTH/g; s/H_EARTH_BAKED_MATERIAL_FIELD_HEIGHT/H_EARTH_PHASE2_SEMANTIC_MATERIAL_FIELD_HEIGHT/g; s/H_EARTH_BAKED_MATERIAL_FIELD_BYTE_LENGTH/H_EARTH_PHASE2_SEMANTIC_MATERIAL_FIELD_BYTE_LENGTH/g; s/H_EARTH_BAKED_MATERIAL_FIELD_SHA256/H_EARTH_PHASE2_SEMANTIC_MATERIAL_FIELD_SHA256/g; s/H_EARTH_BAKED_MATERIAL_FIELD_DOMAIN/H_EARTH_PHASE2_SEMANTIC_MATERIAL_FIELD_DOMAIN/g; s/H_EARTH_BAKED_MATERIAL_FIELD_v1/H_EARTH_PHASE2_SEMANTIC_MATERIAL_FIELD_v2/g; s#terrain-material-field.round2-baked.v1.rgba#terrain-material-field.phase2-semantic-v2.rgba#g; s/28f801f8e5f7b82433f3e0f742cb8292d918ff33b1696c524d0762830c42e15f/$ASHA/g; s/loadHEarthRound2BakedMaterialField/loadHEarthPhase2SemanticMaterialField/g; s/getHEarthRound2BakedMaterialFieldReceipt/getHEarthPhase2SemanticMaterialFieldReceipt/g" "$R/terrain-material-field.phase2-semantic-v2.js"
          cp "$R/persistent-live-renderer.run8e-r3c.cp2-round2-baked-material-candidate.js" "$R/persistent-live-renderer.run8e-r3c.phase2-semantic-material-v2.js"
          sed -i "s#./terrain-material-field.round2-baked.v1.js#./terrain-material-field.phase2-semantic-v2.js#g; s/loadHEarthRound2BakedMaterialField/loadHEarthPhase2SemanticMaterialField/g; s/getHEarthRound2BakedMaterialFieldReceipt/getHEarthPhase2SemanticMaterialFieldReceipt/g; s/H_EARTH_BAKED_MATERIAL_FIELD_ID/H_EARTH_PHASE2_SEMANTIC_MATERIAL_FIELD_ID/g; s/H_EARTH_BAKED_MATERIAL_FIELD_WIDTH/H_EARTH_PHASE2_SEMANTIC_MATERIAL_FIELD_WIDTH/g; s/H_EARTH_BAKED_MATERIAL_FIELD_HEIGHT/H_EARTH_PHASE2_SEMANTIC_MATERIAL_FIELD_HEIGHT/g" "$R/persistent-live-renderer.run8e-r3c.phase2-semantic-material-v2.js"
          B="preview/h-earth/corridor/38df744ba7402aabe7fd2eaee71b961a451350de/B/showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js"
          python3 - <<'PY'
          p="preview/h-earth/corridor/38df744ba7402aabe7fd2eaee71b961a451350de/B/showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js"
          s=open(p).read()
          anchor="const CP2_LIVE_DIFFERENTIAL_QUERY_KEY = 'cp2';"
          s=s.replace(anchor,"const SEMANTIC_MATERIAL_QUERY_KEY = 'semantic-material';\nconst SEMANTIC_MATERIAL_QUERY_VALUE = 'v2';\nconst SEMANTIC_MATERIAL_RENDERER_PATH = '../../render/persistent-live-renderer.run8e-r3c.phase2-semantic-material-v2.js';\n"+anchor)
          anchor2="const cp2LiveDifferentialRequested =\n  queryParameters.get(CP2_LIVE_DIFFERENTIAL_QUERY_KEY) ===\n  CP2_LIVE_DIFFERENTIAL_QUERY_VALUE;"
          s=s.replace(anchor2,"const semanticMaterialRequested = queryParameters.get(SEMANTIC_MATERIAL_QUERY_KEY) === SEMANTIC_MATERIAL_QUERY_VALUE;\n"+anchor2)
          old="  : additiveVisualRequested\n  ? ADDITIVE_VISUAL_RENDERER_PATH\n  : cp2LiveDifferentialRequested\n    ? CP2_LIVE_DIFFERENTIAL_RENDERER_PATH\n    : ACCEPTED_BASELINE_RENDERER_PATH;"
          new="  : additiveVisualRequested\n  ? ADDITIVE_VISUAL_RENDERER_PATH\n  : semanticMaterialRequested\n    ? SEMANTIC_MATERIAL_RENDERER_PATH\n  : cp2LiveDifferentialRequested\n    ? CP2_LIVE_DIFFERENTIAL_RENDERER_PATH\n    : ACCEPTED_BASELINE_RENDERER_PATH;"
          if old not in s: raise SystemExit("selector anchor missing")
          open(p,"w").write(s.replace(old,new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/h-earth/corridor/38df744ba7402aabe7fd2eaee71b961a451350de/B/showroom/globe/h-earth
          git commit -m "H-Earth Phase2: materialize qualified semantic material chamber [semantic-material-chamber]"
          git push --force-with-lease origin HEAD:"$CHAMBER_BRANCH"
