name: Characters Step 9 Regional Bridge Qualification

on:
  pull_request:
    paths:
      - 'characters/**'
      - 'control-plane/whole-estate/characters-reconstruction-v1/**'
      - '.github/workflows/characters-step9-regional-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-step9-regional-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Step 9 dependency surface
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            characters
            h-earth-3d
            control-plane/whole-estate/characters-reconstruction-v1
          sparse-checkout-cone-mode: true
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Step 9 regional bridge
        run: node control-plane/whole-estate/characters-reconstruction-v1/verify-step9-regional-bridge.v1.mjs | tee /tmp/characters-step9-regional-bridge.json
      - name: Reverify Task 20 cinematic primer
        run: node control-plane/whole-estate/characters-reconstruction-v1/verify-task20-cinematic-primer.v1.mjs
      - name: Upload Step 9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: characters-step9-regional-bridge-evidence
          path: /tmp/characters-step9-regional-bridge.json
          if-no-files-found: warn
          retention-days: 30
