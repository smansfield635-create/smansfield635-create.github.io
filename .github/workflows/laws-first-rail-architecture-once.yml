name: Laws FIRST rail architecture once

on:
  push:
    branches:
      - agent/laws-first-indicator-cache-bust-001

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/laws-first-indicator-cache-bust-001
          fetch-depth: 0

      - name: Install source-native rail, reflow, and permanent verifier
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(source, pattern, replacement, label) {
            const matches = source.match(pattern);
            if (!matches) throw new Error(`${label}: marker not found`);
            const result = source.replace(pattern, replacement);
            if (result === source) throw new Error(`${label}: replacement made no change`);
            return result;
          }

          const htmlPath = 'laws/index.html';
          let html = fs.readFileSync(htmlPath, 'utf8');

          const rail = `<section class="laws-first-rail" data-laws-first-rail="" aria-label="F.I.R.S.T. Compass state">
          <p class="sr-only" id="laws-first-rail-guidance">The illuminated marker follows the current Compass authority.</p>
          <ol class="laws-first-rail__list" aria-describedby="laws-first-rail-guidance">
          <li class="laws-first-rail__item" data-laws-experience-indicator="flow" data-laws-experience-active="false" aria-current="false"><span class="laws-first-rail__light" aria-hidden="true"></span><span class="laws-first-rail__label">Flow</span><span class="laws-first-rail__question">What changed?</span></li>
          <li class="laws-first-rail__item" data-laws-experience-indicator="integrity" data-laws-experience-active="false" aria-current="false"><span class="laws-first-rail__light" aria-hidden="true"></span><span class="laws-first-rail__label">Integrity</span><span class="laws-first-rail__question">What remained intact?</span></li>
          <li class="laws-first-rail__item" data-laws-experience-indicator="reality" data-laws-experience-active="false" aria-current="false"><span class="laws-first-rail__light" aria-hidden="true"></span><span class="laws-first-rail__label">Reality</span><span class="laws-first-rail__question">What does the evidence show?</span></li>
          <li class="laws-first-rail__item" data-laws-experience-indicator="structure" data-laws-experience-active="false" aria-current="false"><span class="laws-first-rail__light" aria-hidden="true"></span><span class="laws-first-rail__label">Structure</span><span class="laws-first-rail__question">What conditions shaped the result?</span></li>
          <li class="laws-first-rail__item" data-laws-experience-indicator="test" data-laws-experience-active="false" aria-current="false"><span class="laws-first-rail__light" aria-hidden="true"></span><span class="laws-first-rail__label">Test</span><span class="laws-first-rail__question">What was actually tested?</span></li>
          </ol>
          </section>`;

          if (!html.includes('data-laws-first-rail=""')) {
            html = replaceOnce(
              html,
              '<div class="laws-compass-primary" data-laws-compass-primary="">',
              `<div class="laws-compass-primary" data-laws-compass-primary="">\n${rail}`,
              'persistent rail insertion'
            );
          }

          if (!html.includes('data-laws-first-rail-architecture=')) {
            html = replaceOnce(
              html,
              'data-cp6-experiential-presentation="candidate"',
              'data-cp6-experiential-presentation="candidate" data-laws-first-rail-architecture="persistent-compass-zone-v2" data-laws-tablet-hero-reflow="single-column-at-1100px"',
              'root architecture markers'
            );
          }

          html = html.replace(
            /\/laws\/index\.experience\.polish\.css\?v=[^"]+/,
            '/laws/index.experience.polish.css?v=LAWS_FIRST_RAIL_ARCHITECTURE_20260802B'
          );
          html = html.replace(
            /\/laws\/index\.experience\.js\?v=[^"]+/,
            '/laws/index.experience.js?v=LAWS_FIRST_RAIL_ARCHITECTURE_20260802B'
          );
          fs.writeFileSync(htmlPath, html, 'utf8');

          const jsPath = 'laws/index.experience.js';
          let js = fs.readFileSync(jsPath, 'utf8');
          js = js.replace(
            'const CONTRACT = "LAWS_CP6_EXPERIENTIAL_PRESENTATION_v1";',
            'const CONTRACT = "LAWS_CP6_EXPERIENTIAL_PRESENTATION_v2";'
          );
          if (!js.includes('const indicatorNodes =')) {
            js = replaceOnce(
              js,
              '  const questionNodes = Array.from(document.querySelectorAll("[data-laws-experience-question]"));',
              '  const questionNodes = Array.from(document.querySelectorAll("[data-laws-experience-question]"));\n  const indicatorNodes = Array.from(document.querySelectorAll("[data-laws-experience-indicator]"));',
              'indicator node registry'
            );
          }
          if (!js.includes('node.dataset.lawsExperienceIndicator')) {
            const questionLoop = `    for (const node of questionNodes) {
              const nodeDirection = normalizeDirection(node.dataset.lawsExperienceQuestion);
              node.dataset.lawsExperienceActive = String(Boolean(normalized && nodeDirection === normalized));
            }`;
            const expandedLoop = `${questionLoop}

            for (const node of indicatorNodes) {
              const nodeDirection = normalizeDirection(node.dataset.lawsExperienceIndicator);
              const isActive = Boolean(normalized && nodeDirection === normalized);
              node.dataset.lawsExperienceActive = String(isActive);
              node.setAttribute("aria-current", isActive ? "true" : "false");
            }`;
            js = replaceOnce(js, questionLoop, expandedLoop, 'persistent rail correspondence');
          }
          fs.writeFileSync(jsPath, js, 'utf8');

          const cssPath = 'laws/index.experience.polish.css';
          let css = fs.readFileSync(cssPath, 'utf8');
          if (!css.includes('LAWS_FIRST_PERSISTENT_COMPASS_RAIL_AND_TABLET_REFLOW_v2')) {
            css += `

/*
 * LAWS_FIRST_PERSISTENT_COMPASS_RAIL_AND_TABLET_REFLOW_v2
 * One source-native F.I.R.S.T. indicator rail remains in the Compass zone.
 * It consumes the existing presentation correspondence and creates no control.
 */
html[data-cp6-experiential-presentation="candidate"] .laws-compass-primary {
  grid-auto-flow: row;
}

html[data-cp6-experiential-presentation="candidate"] .laws-orbit {
  order: 1;
}

html[data-cp6-experiential-presentation="candidate"] .laws-first-rail {
  order: 2;
  position: relative;
  z-index: 12;
  width: 100%;
  margin: -1rem 0 1rem;
  padding: 0;
  border: 0;
  background: transparent;
}

html[data-cp6-experiential-presentation="candidate"] .laws-first-rail__list {
  isolation: isolate;
  position: relative;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 0;
  margin: 0;
  padding: 0;
  list-style: none;
}

html[data-cp6-experiential-presentation="candidate"] .laws-first-rail__list::before {
  content: "";
  position: absolute;
  z-index: -1;
  top: 0.47rem;
  right: 0;
  left: 0;
  height: 1px;
  background: linear-gradient(90deg, rgba(121, 234, 255, 0.52), var(--laws-experience-line), rgba(121, 234, 255, 0.26));
  box-shadow: 0 0 12px rgba(121, 234, 255, 0.12);
}

html[data-cp6-experiential-presentation="candidate"] .laws-first-rail__item {
  position: relative;
  min-width: 0;
  padding: 1.55rem 0.8rem 0.75rem 0;
  opacity: 0.58;
  transition: opacity 220ms ease, transform 220ms ease;
}

html[data-cp6-experiential-presentation="candidate"] .laws-first-rail__light {
  position: absolute;
  top: 0;
  left: 0;
  box-sizing: border-box;
  width: 0.95rem;
  height: 0.95rem;
  border: 2px solid rgba(116, 229, 255, 0.58);
  border-radius: 50%;
  background: #07101f;
  box-shadow: 0 0 12px rgba(116, 229, 255, 0.2);
  transform: scale(1);
  transition: background-color 180ms ease, border-color 180ms ease, box-shadow 220ms ease, transform 180ms ease;
}

html[data-cp6-experiential-presentation="candidate"] .laws-first-rail__label,
html[data-cp6-experiential-presentation="candidate"] .laws-first-rail__question {
  display: block;
  min-width: 0;
}

html[data-cp6-experiential-presentation="candidate"] .laws-first-rail__label {
  color: var(--laws-experience-ink);
  font-size: 0.7rem;
  font-weight: 760;
  letter-spacing: 0.065em;
  text-transform: uppercase;
}

html[data-cp6-experiential-presentation="candidate"] .laws-first-rail__question {
  margin-top: 0.55rem;
  color: var(--laws-experience-muted);
  font-size: clamp(0.76rem, 0.92vw, 0.9rem);
  line-height: 1.4;
}

html[data-cp6-experiential-presentation="candidate"] .laws-first-rail__item[data-laws-experience-active="true"] {
  opacity: 1;
  transform: translateY(-0.12rem);
}

html[data-cp6-experiential-presentation="candidate"] .laws-first-rail__item[data-laws-experience-active="true"] .laws-first-rail__light {
  border-color: #e7fcff;
  background: #79eaff;
  box-shadow: 0 0 0 4px rgba(121, 234, 255, 0.12), 0 0 12px rgba(121, 234, 255, 0.92), 0 0 28px rgba(121, 234, 255, 0.74);
  transform: scale(1.16);
}

html[data-cp6-experiential-presentation="candidate"] .laws-controller-panel {
  order: 3;
}

/* The disclosure remains explanatory. Its markers are secondary to the persistent rail. */
html[data-cp6-experiential-presentation="candidate"] .laws-first__question-grid article::before {
  width: 0.72rem;
  height: 0.72rem;
  border-width: 1px;
  box-shadow: 0 0 8px rgba(116, 229, 255, 0.16);
}

html[data-cp6-experiential-presentation="candidate"] .laws-first__question-grid article[data-laws-experience-active="true"]::before {
  background: rgba(121, 234, 255, 0.72);
  box-shadow: 0 0 12px rgba(121, 234, 255, 0.52);
  transform: scale(1.05);
}

@media (max-width: 1100px) {
  html[data-cp6-experiential-presentation="candidate"] .laws-experience-hero {
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: clamp(1.25rem, 3.5vw, 2.75rem);
    padding: clamp(2rem, 5vh, 4rem) 0 clamp(3.5rem, 7vh, 5.5rem);
  }

  html[data-cp6-experiential-presentation="candidate"] .laws-experience-atmosphere span:nth-child(3) {
    display: none;
  }

  html[data-cp6-experiential-presentation="candidate"] .laws-first {
    width: min(100%, 56rem);
  }

  html[data-cp6-experiential-presentation="candidate"] .laws-first__disclosure-body {
    width: 100%;
  }

  html[data-cp6-experiential-presentation="candidate"] .laws-compass-primary {
    position: relative;
    top: auto;
    width: 100%;
    align-self: stretch;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
  }

  html[data-cp6-experiential-presentation="candidate"] .laws-first-rail {
    order: 1;
    margin: 0 0 0.5rem;
  }

  html[data-cp6-experiential-presentation="candidate"] .laws-orbit {
    order: 2;
    min-height: clamp(31rem, 76vw, 42rem);
  }

  html[data-cp6-experiential-presentation="candidate"] .laws-controller-panel {
    order: 3;
    width: min(100%, 44rem);
    margin: -3rem auto 0;
  }
}

@media (max-width: 780px) {
  html[data-cp6-experiential-presentation="candidate"] .laws-experience-hero {
    gap: 0.85rem;
    padding-top: clamp(1.75rem, 5vh, 3rem);
  }

  html[data-cp6-experiential-presentation="candidate"] .laws-first-rail {
    margin-bottom: 0;
  }

  html[data-cp6-experiential-presentation="candidate"] .laws-orbit {
    min-height: min(118vw, 36rem);
  }

  html[data-cp6-experiential-presentation="candidate"] .laws-controller-panel {
    margin-top: -1.75rem;
  }
}

@media (max-width: 600px) {
  html[data-cp6-experiential-presentation="candidate"] .laws-first-rail__item {
    padding: 1.45rem 0.2rem 0.55rem;
    text-align: center;
  }

  html[data-cp6-experiential-presentation="candidate"] .laws-first-rail__light {
    left: 50%;
    transform: translateX(-50%);
  }

  html[data-cp6-experiential-presentation="candidate"] .laws-first-rail__item[data-laws-experience-active="true"] {
    transform: none;
  }

  html[data-cp6-experiential-presentation="candidate"] .laws-first-rail__item[data-laws-experience-active="true"] .laws-first-rail__light {
    transform: translateX(-50%) scale(1.16);
  }

  html[data-cp6-experiential-presentation="candidate"] .laws-first-rail__label {
    font-size: clamp(0.55rem, 2.55vw, 0.68rem);
    letter-spacing: 0.035em;
  }

  html[data-cp6-experiential-presentation="candidate"] .laws-first-rail__question {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  html[data-cp6-experiential-presentation="candidate"] .laws-first-rail__item,
  html[data-cp6-experiential-presentation="candidate"] .laws-first-rail__light {
    transition: none !important;
  }
}
`;
          }
          fs.writeFileSync(cssPath, css, 'utf8');

          const verifierPath = 'scripts/verify-laws-first-rail-architecture.mjs';
          const verifier = `import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium } from 'playwright';

          const baseUrl = process.env.LAWS_BASE_URL || 'http://127.0.0.1:4173';
          const directions = ['flow', 'integrity', 'reality', 'structure', 'test'];
          const profiles = [
            { name: 'phone', width: 390, height: 844, isMobile: true, hasTouch: true, narrow: true },
            { name: 'tablet', width: 820, height: 1180, isMobile: true, hasTouch: true, narrow: true },
            { name: 'tablet-wide', width: 1024, height: 1366, isMobile: true, hasTouch: true, narrow: true },
            { name: 'desktop', width: 1440, height: 1000, isMobile: false, hasTouch: false, narrow: false }
          ];

          const receipt = { contract: 'LAWS_FIRST_PERSISTENT_RAIL_ARCHITECTURE_BROWSER_VERIFICATION_v2', head: process.env.GITHUB_SHA || 'LOCAL', generated_at: new Date().toISOString(), route: '/laws/', checks: [], disposition: 'IN_PROGRESS' };
          const record = (check, status, detail = '') => receipt.checks.push({ check, status, detail });

          function verifySource() {
            const html = fs.readFileSync('laws/index.html', 'utf8');
            const css = fs.readFileSync('laws/index.experience.polish.css', 'utf8');
            const js = fs.readFileSync('laws/index.experience.js', 'utf8');
            assert.ok(html.includes('data-laws-first-rail=""'), 'Persistent rail missing from HTML.');
            assert.equal((html.match(/data-laws-experience-indicator="(?:flow|integrity|reality|structure|test)"/g) || []).length, 5, 'Exactly five persistent indicators required.');
            assert.ok(html.includes('data-laws-first-rail-architecture="persistent-compass-zone-v2"'), 'Architecture marker missing.');
            assert.ok(html.includes('index.experience.polish.css?v=LAWS_FIRST_RAIL_ARCHITECTURE_20260802B'), 'Polish cache token missing.');
            assert.ok(html.includes('index.experience.js?v=LAWS_FIRST_RAIL_ARCHITECTURE_20260802B'), 'Experience cache token missing.');
            assert.ok(css.includes('LAWS_FIRST_PERSISTENT_COMPASS_RAIL_AND_TABLET_REFLOW_v2'), 'Rail/reflow CSS contract missing.');
            assert.ok(css.includes('@media (max-width: 1100px)'), 'Tablet reflow breakpoint missing.');
            assert.ok(js.includes('const indicatorNodes ='), 'Persistent indicator registry missing.');
            assert.ok(js.includes('node.dataset.lawsExperienceIndicator'), 'Persistent indicator correspondence missing.');
            assert.ok(!html.includes('<a class="laws-first-rail__item"'), 'Rail must not create navigation controls.');
            record('source_contract', 'PASS', 'Source-native five-light rail, cache tokens, tablet reflow, and read-only correspondence are present.');
          }

          async function ensureConstellation(page) {
            const state = await page.locator('[data-laws-root]').getAttribute('data-laws-controller-state');
            if (state === 'CONSTELLATION') return;
            const returned = await page.evaluate(() => globalThis.DGB_LAWS_CONTROLLER?.requestReturnToConstellation({ scrollToScene: false }));
            assert.equal(returned, true, 'Return to constellation rejected.');
            await page.waitForFunction(() => document.querySelector('[data-laws-root]')?.dataset.lawsControllerState === 'CONSTELLATION');
          }

          async function select(page, direction) {
            await ensureConstellation(page);
            await page.evaluate((next) => {
              const control = document.querySelector('[data-laws-category][data-direction="' + next + '"]');
              if (!control) throw new Error('Missing authority control: ' + next);
              control.click();
            }, direction);
            await page.waitForFunction((next) => document.documentElement.dataset.lawsExperienceDirection === next && document.querySelector('[data-laws-root]')?.dataset.lawsControllerState === 'CLUSTER_OPEN', direction);
            await page.waitForFunction((next) => {
              const items = Array.from(document.querySelectorAll('[data-laws-first-rail] [data-laws-experience-indicator]'));
              return items.length === 5 && items.filter((item) => item.dataset.lawsExperienceActive === 'true').length === 1 && items.find((item) => item.dataset.lawsExperienceActive === 'true')?.dataset.lawsExperienceIndicator === next;
            }, direction);
            await page.waitForTimeout(260);
          }

          async function snapshot(page) {
            return page.evaluate(() => {
              const hero = document.querySelector('.laws-experience-hero');
              const primary = document.querySelector('.laws-compass-primary');
              const rail = document.querySelector('[data-laws-first-rail]');
              const orbit = document.querySelector('.laws-orbit');
              const panel = document.querySelector('.laws-controller-panel');
              const root = document.documentElement;
              const body = document.body;
              const rect = (node) => node ? ({ top: node.getBoundingClientRect().top, right: node.getBoundingClientRect().right, bottom: node.getBoundingClientRect().bottom, left: node.getBoundingClientRect().left, width: node.getBoundingClientRect().width, height: node.getBoundingClientRect().height }) : null;
              return {
                viewport: { width: innerWidth, height: innerHeight },
                overflow: Math.max(root.scrollWidth, body.scrollWidth) - root.clientWidth,
                heroDisplay: hero ? getComputedStyle(hero).display : '',
                primaryPosition: primary ? getComputedStyle(primary).position : '',
                hero: rect(hero), primary: rect(primary), rail: rect(rail), orbit: rect(orbit), panel: rect(panel),
                items: Array.from(document.querySelectorAll('[data-laws-first-rail] [data-laws-experience-indicator]')).map((item) => {
                  const light = item.querySelector('.laws-first-rail__light');
                  const lightStyle = light ? getComputedStyle(light) : null;
                  const itemRect = item.getBoundingClientRect();
                  return { direction: item.dataset.lawsExperienceIndicator || '', active: item.dataset.lawsExperienceActive === 'true', ariaCurrent: item.getAttribute('aria-current'), display: getComputedStyle(item).display, opacity: getComputedStyle(item).opacity, backgroundColor: lightStyle?.backgroundColor || '', boxShadow: lightStyle?.boxShadow || '', left: itemRect.left, right: itemRect.right };
                })
              };
            });
          }

          function assertSnapshot(data, direction, profile) {
            assert.ok(data.overflow <= 2, profile.name + ': horizontal overflow ' + data.overflow + 'px');
            assert.equal(data.items.length, 5, profile.name + ': five rail items required');
            assert.ok(data.rail && data.primary && data.hero && data.orbit && data.panel, profile.name + ': required hero surfaces missing');
            assert.ok(data.rail.left >= -1 && data.rail.right <= data.viewport.width + 2, profile.name + ': rail leaves viewport');
            assert.ok(data.rail.top >= data.primary.top - 2 && data.rail.bottom <= data.primary.bottom + 2, profile.name + ': rail leaves Compass zone');
            assert.equal(data.items.filter((item) => item.active).length, 1, profile.name + ': exactly one active rail item required');
            const active = data.items.find((item) => item.active);
            assert.equal(active.direction, direction, profile.name + ': rail did not follow Compass');
            assert.equal(active.ariaCurrent, 'true', profile.name + ': active rail ARIA state missing');
            assert.equal(active.backgroundColor, 'rgb(121, 234, 255)', profile.name + ': active light is not cyan');
            assert.notEqual(active.boxShadow, 'none', profile.name + ': active light has no glow');
            for (const item of data.items) {
              assert.ok(item.left >= -1 && item.right <= data.viewport.width + 2, profile.name + '/' + item.direction + ': item outside viewport');
              if (!item.active) assert.equal(item.ariaCurrent, 'false', profile.name + '/' + item.direction + ': inactive ARIA state incorrect');
            }
            if (profile.narrow) {
              assert.equal(data.heroDisplay, 'flex', profile.name + ': hero did not reflow to one column');
              assert.equal(data.primaryPosition, 'relative', profile.name + ': Compass remains sticky in narrow layout');
              assert.ok(data.rail.bottom <= data.orbit.top + 4, profile.name + ': rail is not placed before the Compass in narrow layout');
            } else {
              assert.ok(data.rail.top >= data.orbit.top, profile.name + ': desktop rail is not paired with the Compass scene');
            }
          }

          async function verifyProfile(browser, profile) {
            const context = await browser.newContext({ viewport: { width: profile.width, height: profile.height }, isMobile: profile.isMobile, hasTouch: profile.hasTouch });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', (error) => errors.push('pageerror: ' + error.message));
            page.on('console', (message) => { if (message.type() === 'error' && !message.text().includes('404')) errors.push('console: ' + message.text()); });
            await page.goto(baseUrl + '/laws/', { waitUntil: 'networkidle' });
            await page.waitForFunction(() => Boolean(globalThis.DGB_LAWS_EXPERIENCE && globalThis.DGB_LAWS_CONTROLLER));
            for (const direction of directions) {
              await select(page, direction);
              assertSnapshot(await snapshot(page), direction, profile);
              await ensureConstellation(page);
            }
            assert.deepEqual(errors, [], profile.name + ': browser errors: ' + errors.join(' | '));
            await page.screenshot({ path: 'artifacts/laws-first-rail-' + profile.name + '.png', fullPage: true });
            await context.close();
            record('interactive_' + profile.name, 'PASS', 'Persistent rail remained in the Compass zone, followed all five selections, and preserved the declared reflow.');
          }

          async function verifyStatic(browser) {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true, javaScriptEnabled: false });
            const page = await context.newPage();
            await page.goto(baseUrl + '/laws/', { waitUntil: 'load' });
            const data = await snapshot(page);
            assert.equal(data.items.length, 5, 'Static rail lost items.');
            assert.equal(data.items.filter((item) => item.active).length, 0, 'Static rail invented active state.');
            assert.ok(data.rail && data.rail.left >= -1 && data.rail.right <= data.viewport.width + 2, 'Static rail outside viewport.');
            assert.equal(data.heroDisplay, 'flex', 'Static phone hero did not reflow.');
            assert.ok(data.rail.bottom <= data.orbit.top + 4, 'Static phone rail is not before Compass.');
            await context.close();
            record('static_no_javascript', 'PASS', 'Five neutral source-native indicators remain visible without runtime state.');
          }

          async function verifyReducedMotion(browser) {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true, reducedMotion: 'reduce' });
            const page = await context.newPage();
            await page.goto(baseUrl + '/laws/', { waitUntil: 'networkidle' });
            await page.waitForFunction(() => Boolean(globalThis.DGB_LAWS_EXPERIENCE && globalThis.DGB_LAWS_CONTROLLER));
            await select(page, 'structure');
            const transition = await page.locator('[data-laws-first-rail] [data-laws-experience-active="true"] .laws-first-rail__light').evaluate((node) => getComputedStyle(node).transitionDuration);
            assert.ok(transition === '0s' || transition === '0.001ms', 'Reduced-motion transition remains active: ' + transition);
            await context.close();
            record('reduced_motion', 'PASS', 'Persistent light correspondence remains correct with transitions removed.');
          }

          fs.mkdirSync('artifacts', { recursive: true });
          verifySource();
          const browser = await chromium.launch({ headless: true });
          try {
            for (const profile of profiles) await verifyProfile(browser, profile);
            await verifyReducedMotion(browser);
            await verifyStatic(browser);
            receipt.disposition = 'PASS';
          } finally {
            await browser.close();
          }
          fs.writeFileSync(path.join('artifacts', 'laws-first-rail-architecture-verification.json'), JSON.stringify(receipt, null, 2) + '\n');
          console.log(JSON.stringify(receipt, null, 2));
          `;
          fs.writeFileSync(verifierPath, verifier.replace(/^          /gm, ''), 'utf8');

          const workflowPath = '.github/workflows/laws-first-rail-architecture-verification.yml';
          const workflow = `name: Laws FIRST Persistent Rail Architecture Verification

          on:
            pull_request:
              paths:
                - 'laws/index.html'
                - 'laws/index.experience.js'
                - 'laws/index.experience.css'
                - 'laws/index.experience.polish.css'
                - 'scripts/verify-laws-first-rail-architecture.mjs'
                - '.github/workflows/laws-first-rail-architecture-verification.yml'
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            verify-first-rail:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - name: Check out candidate
                  uses: actions/checkout@v4
                - name: Set up Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: '20'
                - name: Install browser verifier
                  run: |
                    npm install --no-save playwright@1.54.2
                    npx playwright install --with-deps chromium
                - name: Start static candidate server
                  run: |
                    nohup python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/laws-first-rail-server.log 2>&1 &
                    for i in {1..30}; do curl -fsS http://127.0.0.1:4173/laws/ >/dev/null && exit 0; sleep 1; done
                    cat /tmp/laws-first-rail-server.log
                    exit 1
                - name: Run persistent rail and reflow matrix
                  env:
                    LAWS_BASE_URL: http://127.0.0.1:4173
                  run: node scripts/verify-laws-first-rail-architecture.mjs
                - name: Upload architecture evidence
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: laws-first-rail-architecture-evidence
                    path: artifacts/
                    if-no-files-found: warn
          `;
          fs.writeFileSync(workflowPath, workflow.replace(/^          /gm, ''), 'utf8');

          const recordPath = 'laws/control-plane/renewal/laws-first-persistent-rail-and-tablet-reflow-v2.json';
          const control = {
            contract: 'LAWS_FIRST_PERSISTENT_RAIL_AND_TABLET_REFLOW_v2',
            status: 'CANDIDATE_PENDING_USER_VISUAL_ACCEPTANCE',
            route: '/laws/',
            authority_source: 'EXISTING_COMPASS_PRESENTATION_CORRESPONDENCE',
            product_surfaces: ['laws/index.html', 'laws/index.experience.js', 'laws/index.experience.polish.css'],
            guarantees: [
              'FIVE_SOURCE_NATIVE_FIRST_INDICATORS',
              'ONE_ACTIVE_CYAN_LIGHT_FOLLOWS_ACCEPTED_COMPASS_STATE',
              'NO_RESEARCH_LIGHT',
              'NO_NEW_INTERACTION_OR_ROUTE_AUTHORITY',
              'PERSISTENT_RAIL_REMAINS_IN_COMPASS_ZONE',
              'PHONE_TABLET_SINGLE_COLUMN_HERO_REFLOW',
              'QUESTION_DISCLOSURE_REMAINS_SECONDARY',
              'STATIC_NO_JAVASCRIPT_NEUTRAL_VISIBILITY',
              'CACHE_BUSTED_PRESENTATION_ASSETS'
            ],
            protected: ['laws/index.controller.js', 'laws/index.interactions.js', 'laws/index.compositor.js', 'laws/index.cosmos.js', 'laws/index.crystals.js', 'laws/index.planet.js'],
            claim_authority_change: false,
            route_authority_change: false,
            empirical_status_change: false,
            merge_authority: 'USER_ONLY'
          };
          fs.writeFileSync(recordPath, JSON.stringify(control, null, 2) + '\n', 'utf8');
          NODE

      - name: Remove one-time installer and commit durable correction
        shell: bash
        run: |
          git rm .github/workflows/laws-first-rail-architecture-once.yml
          git add laws/index.html laws/index.experience.js laws/index.experience.polish.css \
            scripts/verify-laws-first-rail-architecture.mjs \
            .github/workflows/laws-first-rail-architecture-verification.yml \
            laws/control-plane/renewal/laws-first-persistent-rail-and-tablet-reflow-v2.json
          git config user.name "laws-rail-architecture-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Restore persistent FIRST rail and tablet hero reflow"
          git push origin HEAD:agent/laws-first-indicator-cache-bust-001
