name: Temporary Compass cold-media gating executor
# retry: corrected cinematic block anchors

on:
  push:
    branches:
      - perf/compass-cold-media-gating-20260913-001
    paths:
      - .github/workflows/temp-compass-cold-media-gating.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'push' || github.head_ref == 'perf/compass-cold-media-gating-20260913-001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/compass-cold-media-gating-20260913-001
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /assets/compass/compass.capability-carousel.js
            /assets/compass/compass.orientation-cinematic.js
            /tools/temp_compass_cold_media_patch.py
            /.github/workflows/temp-compass-cold-media-gating.yml

      - name: Apply bounded cold-media scheduling repair
        run: python tools/temp_compass_cold_media_patch.py

      - name: Static qualification
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/compass/compass.capability-carousel.js
          node --check assets/compass/compass.orientation-cinematic.js
          python - <<'PY'
          from pathlib import Path
          idx=Path('index.html').read_text(encoding='utf-8')
          ori=Path('assets/compass/compass.orientation-cinematic.js').read_text(encoding='utf-8')
          cap=Path('assets/compass/compass.capability-carousel.js').read_text(encoding='utf-8')
          assert 'installFirstEntryHiddenSyncGate' not in cap
          assert 'preload="none" playsinline aria-label="Diamond Gate Bridge — Chapter One" data-compass-chapter-one-video' in idx
          assert 'data-compass-ambient-audio loop playsinline preload="none"' in idx
          assert "ambientVideo.preload='none'" in ori and "video.preload='none'" in ori
          assert ori.count('media.src=CONTRACT.mediaPath;')==1
          print('COLD_MEDIA_GATING_STATIC_QUALIFICATION_PASS')
          PY

      - name: Commit bounded candidate and remove temporary executor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Codex Connector"
          git config user.email "noreply@openai.com"
          git rm .github/workflows/temp-compass-cold-media-gating.yml tools/temp_compass_cold_media_patch.py
          git add index.html assets/compass/compass.capability-carousel.js assets/compass/compass.orientation-cinematic.js
          git diff --cached --check
          git commit -m "Compass: defer cold media until explicit user intent"
          git push origin HEAD:perf/compass-cold-media-gating-20260913-001
