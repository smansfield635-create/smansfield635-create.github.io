name: Compass Capability Continuity Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/compass/**'
      - '.github/ai-router/projects/compass/verify-experience-consolidation.v1.mjs'
      - '.github/workflows/compass-display-continuity-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax floor
        run: |
          set -euo pipefail
          node --check assets/compass/compass.capability-carousel.js
          node --check assets/compass/compass.brain-scene.js
          node --check assets/compass/compass.house-scene.js
          node --check assets/compass/compass.trophy-scene.js
          node --check assets/compass/compass.gen1537.recovery.js
          node --check .github/ai-router/projects/compass/verify-experience-consolidation.v1.mjs
      - name: Verify continuity ownership
        env:
          COMPASS_EXPERIENCE_OUTPUT: /tmp/compass-capability-continuity-receipt.json
        run: node .github/ai-router/projects/compass/verify-experience-consolidation.v1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-capability-continuity-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/compass-capability-continuity-receipt.json
          retention-days: 90

  rendered-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Serve exact candidate
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/compass-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
      - name: Inspect every rendered capability
        run: |
          mkdir -p /tmp/compass-rendered
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const viewports=[['desktop',1440,1000],['tablet',1024,1366],['phone',390,844]];
          const failures=[];const results={};
          for(const [id,width,height] of viewports){
            const ctx=await browser.newContext({viewport:{width,height}});const page=await ctx.newPage();const errors=[];
            page.on('pageerror',e=>errors.push(String(e.message||e)));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForSelector('[data-capability-orbit]',{timeout:10000});await page.waitForTimeout(900);
            const states=[];
            for(let step=0;step<3;step++){
              const state=await page.evaluate(()=>{
                const stage=document.querySelector('[data-capability-orbit]');const objectStage=stage?.querySelector('.compass-object-stage');const active=stage?.querySelector('[data-active="true"]');const caption=active?.querySelector('.compass-object-caption');const dock=stage?.querySelector('.compass-action-dock');const portal=active?.querySelector('.compass-object-portal');
                const rect=n=>n?(()=>{const r=n.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height,b:r.bottom,r:r.right}})():null;
                const c=rect(caption),d=rect(dock),p=rect(portal),s=rect(stage),os=rect(objectStage),a=rect(active);
                const captionViewportOverflow=c?Math.max(0,-c.x,c.r-innerWidth):0;
                const portalStageEscape=p&&os?Math.max(0,os.y-p.y,p.b-os.b):0;
                const activeViewportOverflow=a?Math.max(0,-a.x,a.r-innerWidth):0;
                return{capability:active?.dataset.capability||'',captionText:(caption?.innerText||'').replace(/\s+/g,' ').trim(),dockText:(dock?.innerText||'').replace(/\s+/g,' ').trim(),caption:c,dock:d,portal:p,stage:s,objectStage:os,active:a,captionDockGap:c&&d?d.y-c.b:null,captionViewportOverflow,activeViewportOverflow,portalStageEscape,documentOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};
              });
              if(!state.capability)failures.push(`${id}:no-active-capability:${step}`);
              if(!state.captionText)failures.push(`${id}:missing-caption:${step}`);
              if(state.captionDockGap!=null&&state.captionDockGap<0)failures.push(`${id}:caption-action-overlap:${state.capability}:${state.captionDockGap}`);
              if(state.captionViewportOverflow>2)failures.push(`${id}:caption-viewport-overflow:${state.capability}:${state.captionViewportOverflow}`);
              if(state.activeViewportOverflow>2)failures.push(`${id}:active-card-overflow:${state.capability}:${state.activeViewportOverflow}`);
              if(state.portalStageEscape>2)failures.push(`${id}:object-stage-escape:${state.capability}:${state.portalStageEscape}`);
              if(state.documentOverflow>2)failures.push(`${id}:document-overflow:${state.documentOverflow}`);
              states.push(state);
              await page.locator('[data-capability-orbit]').screenshot({path:`/tmp/compass-rendered/${id}-${state.capability}.png`});
              await page.locator('[data-capability-orbit] [data-orbit-next]').click();await page.waitForTimeout(700);
            }
            results[id]={viewport:{width,height},errors,states};
            if(errors.length)failures.push(...errors.map(e=>`${id}:pageerror:${e}`));
            await ctx.close();
          }
          await browser.close();
          const receipt={schema:'COMPASS_RENDERED_CONTINUITY_INSPECTION_v2',productBase:'8eb0af9afa5f1e20eab88b43e5dd53dee7b2a7ec',results,failures,result:failures.length?'FAIL_CLOSED':'PASS_CLOSED'};
          fs.writeFileSync('/tmp/compass-rendered/receipt.json',JSON.stringify(receipt,null,2)+'\n');console.log(JSON.stringify(receipt,null,2));if(failures.length)process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-rendered-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/compass-rendered
          retention-days: 30
