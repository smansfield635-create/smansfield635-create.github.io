name: Laws Carousel V5 Publish Binding

on:
  push:
    branches: [main]
    paths:
      - 'laws/index.destination-carousel.js'
      - 'laws/index.mobile-background-tabs.js'
      - 'laws/index.mobile-background-tabs.core.js'
      - '.github/workflows/laws-carousel-v4-publish-binding.yml'

permissions:
  contents: write

jobs:
  publish-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Bump public Laws asset identity to E
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('laws/index.html')
          s = p.read_text()
          old = 'LAWS_DESTINATION_STAGE_LIVE_20260816D'
          new = 'LAWS_DESTINATION_STAGE_LIVE_20260816E'
          if new in s:
              print('binding already current')
          elif old in s:
              p.write_text(s.replace(old, new))
              print('binding advanced to E')
          else:
              raise SystemExit('expected D binding not found')
          PY
      - name: Commit cache binding if changed
        run: |
          if git diff --quiet -- laws/index.html; then
            echo 'No binding commit required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add laws/index.html
          git commit -m 'Publish Laws entry-scroll custody cache binding E'
          git push origin HEAD:main
