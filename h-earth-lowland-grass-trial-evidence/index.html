<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H-Earth — inner oasis</title>
<style>*{box-sizing:border-box}body{margin:0;background:#132019;color:#edf4e9;font:15px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header{position:fixed;top:12px;left:12px;padding:10px 14px;background:#132019bb;border-radius:8px;pointer-events:none}h1{font-size:17px;margin:0}small{display:block;color:#d0dfcd;margin-top:3px}nav{position:fixed;top:12px;right:12px;display:flex;gap:6px}button{border:1px solid #b5c9b080;border-radius:8px;padding:11px;background:#203f2dcc;color:white;font:inherit;touch-action:none;user-select:none}button:disabled{opacity:.4}button:active{background:#5e7852}#travel{position:fixed;bottom:28px;left:20px;display:grid;grid-template-columns:52px 52px 52px;gap:6px}#travel button{height:52px;font-size:22px}#forward{grid-column:2}#left{grid-column:1}#hint{position:fixed;bottom:14px;right:14px;font-size:12px;text-shadow:0 1px 3px black;color:white;pointer-events:none}#loading{position:fixed;inset:0;background:#132019;display:grid;place-content:center;text-align:center;padding:25px}#loading[hidden]{display:none}@media(max-width:500px){header{max-width:52%;top:8px;left:8px}h1{font-size:15px}small{font-size:11px}nav{top:8px;right:8px}nav button{font-size:12px;padding:10px}#hint{max-width:135px;text-align:right}}</style></head>
<body><canvas id="scene" aria-label="H-Earth full environment. Drag to look; use arrow buttons or W A S D to travel."></canvas><header><h1>Inner oasis</h1><small id="status">Grass & cattail sample</small></header><nav aria-label="Return to a location"><button id="close" disabled>Oasis</button><button id="wide" disabled>Original grass</button></nav><div id="travel" aria-label="Travel controls"><button id="forward" aria-label="Move forward" data-action="MOVE_FORWARD" disabled>↑</button><button id="left" aria-label="Move left" data-action="STRAFE_LEFT" disabled>←</button><button id="back" aria-label="Move backward" data-action="MOVE_BACKWARD" disabled>↓</button><button id="right" aria-label="Move right" data-action="STRAFE_RIGHT" disabled>→</button></div><span id="hint">Drag to look · Hold arrows to walk<br>Keyboard: W A S D</span><div id="loading"><strong id="progress">Opening the oasis…</strong><p>You can explore the full environment.</p></div>
<script type="module">
const canvas=document.querySelector('#scene'),status=document.querySelector('#status'),progress=document.querySelector('#progress');
try {
 const base='../showroom/globe/h-earth/';
 const [nav,frames,mod]=await Promise.all([import(base+'functional-landscape/navigation.js'),import(base+'render/live-renderer-contract.run8e-r3a.js'),import(base+'render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js')]);
 const rect=canvas.getBoundingClientRect(),ratio=Math.min(devicePixelRatio||1,1.5),width=Math.min(1440,Math.round(rect.width*ratio)),height=Math.round(width*rect.height/rect.width);
 canvas.width=width;canvas.height=height;
 let state,renderer,sequence=0,dirty=true;
 function act(intent){const result=nav.proposeHEarthFunctionalLandscapeNavigation(state,intent);if(result.ok){state=result.state;dirty=true;}return result.ok;}
 function position(oasis){state=nav.createHEarthFunctionalLandscapeNavigationState({waypointId:'LOWLAND'}).state;if(!act({action:'SET_CAMERA_POSITION',position:oasis?{x:-10,z:-159}:{x:-23.57004735,z:-147.1}}))throw new Error('Arrival point lacks terrain support');const yaw=oasis?5:18,pitch=oasis?-19:-24;for(let i=0;i<50&&Math.abs(state.yawDegrees-yaw)>.01;i++)act({action:state.yawDegrees>yaw?'TURN_LEFT':'TURN_RIGHT',degrees:Math.min(8,Math.abs(state.yawDegrees-yaw))});for(let i=0;i<30&&Math.abs(state.pitchDegrees-pitch)>.01;i++)act({action:state.pitchDegrees>pitch?'PITCH_DOWN':'PITCH_UP',degrees:Math.min(8,Math.abs(state.pitchDegrees-pitch))});}
 function packet(){return frames.createHEarthRun8ER3AFrameUniformPacket({navigationState:state,viewport:{width:canvas.clientWidth,height:canvas.clientHeight,pixelRatio:ratio},frameSequence:++sequence});}
 function draw(){renderer.renderFrame(packet());renderer.presentColorFrame();window.GRASS_PATCH_PREVIEW.navigationState=state;dirty=false;}
 position(true);renderer=mod.createHEarthRun8ER3CPersistentRenderer({canvas,width,height});renderer.initialize(packet());
 for(let i=0;i<108;i++){renderer.materializeNextVegetationBatch();progress.textContent=`Opening the oasis… ${Math.round((i+1)/108*100)}%`;if(i%4===0)await new Promise(requestAnimationFrame);}
 window.GRASS_PATCH_PREVIEW={baselineCommit:'c449707775fabd8574ec7f5e9787eaebcb7d2309',legacyGrassPolicy:'EXCLUDED',patch:{minX:-14,maxX:2,minZ:-174,maxZ:-158},getReceipt:()=>renderer.getResourceReceipt(),getNavigationCheck:()=>nav.evaluateHEarthFunctionalLandscapeNavigationState(state),navigationState:state,ready:false};
 draw();window.GRASS_PATCH_PREVIEW.ready=true;document.querySelector('#loading').hidden=true;
 const held=new Set();
 for(const [id,oasis] of [['close',true],['wide',false]]){const button=document.querySelector('#'+id);button.disabled=false;button.onclick=()=>{held.clear();position(oasis);};}
 for(const button of document.querySelectorAll('[data-action]')){button.disabled=false;button.onpointerdown=e=>{e.preventDefault();button.setPointerCapture(e.pointerId);held.add(button.dataset.action);};button.onpointerup=button.onpointercancel=button.onlostpointercapture=()=>held.delete(button.dataset.action);}
 const keyActions={w:'MOVE_FORWARD',ArrowUp:'MOVE_FORWARD',s:'MOVE_BACKWARD',ArrowDown:'MOVE_BACKWARD',a:'STRAFE_LEFT',ArrowLeft:'STRAFE_LEFT',d:'STRAFE_RIGHT',ArrowRight:'STRAFE_RIGHT'};
 window.addEventListener('keydown',e=>{const action=keyActions[e.key]||keyActions[e.key.toLowerCase()];if(action){e.preventDefault();held.add(action);}});window.addEventListener('keyup',e=>held.delete(keyActions[e.key]||keyActions[e.key.toLowerCase()]));window.addEventListener('blur',()=>held.clear());document.addEventListener('visibilitychange',()=>held.clear());
 let previous=null;
 canvas.onpointerdown=e=>{if(previous)return;previous={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);};
 canvas.onpointermove=e=>{if(previous?.id!==e.pointerId)return;const dx=e.clientX-previous.x,dy=e.clientY-previous.y;previous={id:e.pointerId,x:e.clientX,y:e.clientY};if(dx)act({action:dx>0?'TURN_LEFT':'TURN_RIGHT',degrees:Math.min(8,Math.abs(dx)*.18)});if(dy)act({action:dy>0?'PITCH_UP':'PITCH_DOWN',degrees:Math.min(8,Math.abs(dy)*.18)});};
 canvas.onpointerup=canvas.onpointercancel=canvas.onlostpointercapture=e=>{if(previous?.id===e.pointerId)previous=null;};
 canvas.onwheel=e=>{e.preventDefault();act({action:e.deltaY>0?'ZOOM_OUT':'ZOOM_IN',degrees:3});};
 window.addEventListener('resize',()=>{dirty=true;});let last=performance.now();function tick(now){const dt=Math.min(.08,(now-last)/1000);last=now;for(const action of held)act({action,magnitude:dt*3});if(dirty)draw();requestAnimationFrame(tick);}requestAnimationFrame(tick);
} catch(error){status.textContent='Could not open';progress.textContent=error.message;window.GRASS_PATCH_PREVIEW_ERROR=error.message;console.error(error);}
</script></body></html>
