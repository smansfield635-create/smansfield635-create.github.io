name: Compass Display Continuity Validation

on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/compass/**'
      - '.github/ai-router/projects/compass/verify-display-continuity.v1.mjs'
      - '.github/ai-router/projects/compass/verify-performance-successor.mjs'
      - '.github/workflows/compass-display-continuity-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPASS_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact admitted successor
        run: |
          test "$(git rev-parse HEAD^{commit})" = "$COMPASS_CANDIDATE_HEAD"
          node .github/ai-router/projects/compass/verify-display-continuity.v1.mjs --binding > /tmp/compass-gen1521-binding.json
          node .github/ai-router/projects/compass/verify-display-continuity.v1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-gen1521-static-receipts
          path: |
            /tmp/compass-gen1521-binding.json
            /tmp/compass-gen1521-display.json
            /tmp/compass-gen1521-performance.json

  runtime-display:
    runs-on: ubuntu-latest
    needs: static-contract
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Start exact candidate host
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/compass-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/compass-http.log; exit 1
      - name: Qualify desktop tablet phone and reduced motion
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true}),checks=[],check=(id,pass,evidence)=>checks.push({id,pass:Boolean(pass),evidence}),settle=page=>page.waitForTimeout(1500);
          for(const [name,width,height] of [['desktop',1440,900],['tablet',820,1180],['phone',390,844],['phone-tall',1080,2340]]){
            const context=await browser.newContext({viewport:{width,height}}),page=await context.newPage(),errors=[];page.setDefaultTimeout(8000);page.on('pageerror',e=>errors.push(String(e)));await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:15000});await settle(page);
            const r=await page.evaluate(()=>{const root=document.querySelector('[data-compass-root]'),identity=document.querySelector('[data-compass-identity-3d]'),brain=document.querySelector('[data-human-brain] canvas'),craft=document.querySelector('[data-compass-spacecraft-layer]'),front=document.querySelector('[data-capability][data-slot="front"]'),title=document.querySelector('[data-wordmark-object="the-compass"]'),control=document.querySelector('.compass-identity-o-control');return{overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,cardinals:document.querySelectorAll('[data-compass-cardinal]').length,rooms:document.querySelectorAll('[data-compass-room-declarations] [data-compass-room]').length,identity:Boolean(identity),maker:Boolean(document.querySelector('[data-wordmark-object="diamond-gate-bridge"]')),title:Boolean(title),layers:document.querySelectorAll('.compass-wordmark-layer').length,descriptor:document.querySelector('.compass-studio-descriptor')?.textContent.trim()||'',control:control?.getBoundingClientRect().width||0,product:front?.querySelector('h2')?.textContent.trim()||'',productDescriptor:front?.querySelector('.coheriscope-descriptor')?.textContent.trim()||'',brain:{material:brain?.dataset.brainMaterial||'',linework:brain?.dataset.brainLinework||'',depth:brain?.dataset.brainDepthModel||''},craft:{present:Boolean(craft),source:craft?.dataset.sourceContract||'',authority:craft?.dataset.authority||''},trophy:document.querySelectorAll('.compass-award-trophy').length,house:document.querySelectorAll('[data-house-parent]').length,proofs:document.querySelectorAll('[data-proof-card]').length,rootIdentity:root?.dataset.studioIdentity||'',editorialVersion:globalThis.CompassEditorialCarousel?.version||'',identityApi:Boolean(globalThis.DGB_COMPASS_IDENTITY_3D_GEN1521?.mounted),capabilityOrbit:Boolean(document.querySelector('[data-capability-orbit]'))};});
            check(`${name}_CORE`,r.cardinals===4&&r.rooms===19&&r.trophy===1&&r.house===1&&r.proofs===3,r);check(`${name}_NO_OVERFLOW`,r.overflow<=2,r.overflow);check(`${name}_RUNTIMES_READY`,r.identityApi&&r.capabilityOrbit&&r.editorialVersion==='root-award-finish-successor-v1',r);check(`${name}_TRUE_3D_IDENTITY`,r.identity&&r.maker&&r.title&&r.layers>=19,r);check(`${name}_STUDIO_DESCRIPTOR`,r.descriptor==='Independent Studio for Interactive Worlds, Creative Technology & Original Systems',r.descriptor);check(`${name}_O_CONTROL`,r.control>=32,r.control);check(`${name}_COHERISCOPE`,r.product==='Coheriscope'&&r.productDescriptor==='The Coherence Diagnostic by Diamond Gate Bridge',r);check(`${name}_ROSE_BRAIN`,r.brain.material==='NATIVE_ROSE_FLESH_V1'&&r.brain.linework==='none'&&r.brain.depth==='GEOMETRY_LIGHT_FALLOFF_FOLD_OCCLUSION_FORM_SHADOW',r.brain);check(`${name}_SPACECRAFT`,r.craft.present&&r.craft.source==='LAWS_CP6_TRUE_3D_SPACECRAFT_PARTICIPANT_v1'&&r.craft.authority==='ambient-presentation-and-bounded-hit-response-only',r.craft);check(`${name}_NO_ERRORS`,errors.length===0,errors);try{await page.screenshot({path:`/tmp/compass-gen1521-${name}.png`,animations:'disabled',timeout:8000})}catch(e){check(`${name}_SCREENSHOT`,false,String(e))}await context.close();
          }
          const context=await browser.newContext({viewport:{width:820,height:1180}}),page=await context.newPage(),interactionErrors=[];page.setDefaultTimeout(8000);page.on('pageerror',e=>interactionErrors.push(String(e)));await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:15000});await settle(page);const started=await page.evaluate(()=>{const c=document.querySelector('.compass-identity-o-control'),s=document.querySelector('[data-wordmark-object="the-compass"]');if(!c||!s)return false;c.click();return s.classList.contains('is-revolving')});check('ONE_REVOLUTION_START',started,started);await page.waitForTimeout(1500);const returned=await page.evaluate(()=>{const s=document.querySelector('[data-wordmark-object="the-compass"]');return Boolean(s&&!s.classList.contains('is-revolving'))});check('ONE_REVOLUTION_CANONICAL_RETURN',returned,returned);
          const inspect=await page.evaluate(()=>{const canvas=document.querySelector('[data-human-brain] canvas'),api=globalThis.CompassBrainScene;if(!canvas||!api?.inspect)return null;const r=canvas.getBoundingClientRect(),x=r.left+r.width*.52,y=r.top+r.height*.48;for(const [type,cx,cy] of [['pointerdown',x,y],['pointermove',x+50,y+20],['pointerup',x+50,y+20]])canvas.dispatchEvent(new PointerEvent(type,{bubbles:true,pointerId:1,clientX:cx,clientY:cy}));return api.inspect()});check('BRAIN_MANUAL_ROTATION',inspect&&inspect.material==='NATIVE_ROSE_FLESH_V1'&&inspect.linework==='none',inspect);check('INTERACTION_NO_ERRORS',interactionErrors.length===0,interactionErrors);await context.close();
          const reduced=await browser.newContext({viewport:{width:390,height:844},reducedMotion:'reduce'}),rp=await reduced.newPage(),reducedErrors=[];rp.setDefaultTimeout(8000);rp.on('pageerror',e=>reducedErrors.push(String(e)));await rp.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:15000});await settle(rp);const rr=await rp.evaluate(()=>({craft:document.querySelector('[data-compass-spacecraft-layer]'),brain:document.querySelector('[data-human-brain] canvas')?.dataset.brainMotion||'',identityApi:Boolean(globalThis.DGB_COMPASS_IDENTITY_3D_GEN1521?.mounted)}));check('REDUCED_MOTION_EQUIVALENCE',!rr.craft&&rr.brain==='static-reduced-motion'&&rr.identityApi,rr);check('REDUCED_NO_ERRORS',reducedErrors.length===0,reducedErrors);await reduced.close();await browser.close();
          const failures=checks.filter(x=>!x.pass),receipt={schema:'COMPASS_STUDIO_IDENTITY_COHERISCOPE_RUNTIME_QUALIFICATION_v1',candidateHead:process.env.COMPASS_CANDIDATE_HEAD,result:failures.length?'FAIL_CLOSED':'PASS_CLOSED',checks,failures:failures.map(x=>x.id)};fs.writeFileSync('/tmp/compass-gen1521-runtime.json',JSON.stringify(receipt,null,2)+'\n');console.log(JSON.stringify(receipt,null,2));if(failures.length)process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-gen1521-runtime-evidence
          path: |
            /tmp/compass-gen1521-runtime.json
            /tmp/compass-gen1521-*.png
