name: Compass Gen1560 Shared Orbit Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/compass/**'
      - '.github/ai-router/projects/compass/**'
      - '.github/workflows/compass-display-continuity-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPASS_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  COMPASS_GOVERNING_HEAD: e68740655c05bafef86b18457873cabdab3e8a67
  COMPASS_EXPERIENCE_OUTPUT: /tmp/compass-experience-consolidation-receipt.json
  COMPASS_EXPERIENCE_CAPTURE_INPUT: /tmp/compass-experience-capture-receipt.json

jobs:
  engineering-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMPASS_CANDIDATE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact Gen1560 candidate and mutation envelope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "$COMPASS_CANDIDATE_HEAD"
          node --check assets/compass/compass.controller.js
          node --check assets/compass/compass.statement-carousel.js
          node --check assets/compass/compass.capability-carousel.js
          node --check assets/compass/compass.brain-scene.js
          node --check assets/compass/compass.trophy-scene.js
          node --check assets/compass/compass.house-scene.js
          node --check .github/ai-router/projects/compass/verify-experience-consolidation.v1.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import cp from 'node:child_process';
          const base=process.env.COMPASS_GOVERNING_HEAD;
          const allowed=new Set([
            'index.html','assets/compass/compass.css','assets/compass/compass.capability-carousel.css','assets/compass/compass.capability-carousel.js',
            '.github/ai-router/projects/compass/experience-consolidation-amendment.v1.json',
            '.github/ai-router/projects/compass/verify-experience-consolidation.v1.mjs',
            '.github/workflows/compass-display-continuity-validation.yml'
          ]);
          const protectedPaths=[
            'assets/compass/compass.controller.js','assets/compass/compass.mirrorland-window.js','assets/compass/compass.crystals.js','assets/compass/compass.cosmos.js',
            'assets/compass/compass.laws-spacecraft.js','assets/compass/compass.identity-3d.js','assets/compass/compass.statement-carousel.js','assets/compass/compass.statement-carousel.css',
            'assets/compass/compass.brain.js','assets/compass/compass.brain-scene.js','assets/compass/compass.trophy-scene.js','assets/compass/compass.house-scene.js'
          ];
          const changed=cp.execFileSync('git',['diff','--name-only',`${base}...HEAD`],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const mutatedProtected=protectedPaths.filter(p=>changed.includes(p));
          const controller=fs.readFileSync('assets/compass/compass.controller.js','utf8');
          const capability=fs.readFileSync('assets/compass/compass.capability-carousel.js','utf8');
          const checks={
            exactHead:cp.execFileSync('git',['rev-parse','HEAD^{commit}'],{encoding:'utf8'}).trim()===process.env.COMPASS_CANDIDATE_HEAD,
            exactScope:changed.every(p=>allowed.has(p)),
            protectedRuntimeUnchanged:mutatedProtected.length===0,
            productMutationPresent:changed.some(p=>['index.html','assets/compass/compass.css','assets/compass/compass.capability-carousel.css','assets/compass/compass.capability-carousel.js'].includes(p)),
            sharedOrbitRuntime:capability.includes('COMPASS_SHARED_ORBIT_STAGE_CHANGED')&&capability.includes('state.velocity')&&capability.includes('drag-snap'),
            foregroundNotEnter:capability.includes('Enter only after the object settles in front.')&&capability.includes('actionAuthority:settled'),
            traversalSourcePreserved:controller.includes('ROOM_SELECTED')&&controller.includes('MIRRORLAND_FOCUSED')&&controller.includes('requestReturnToConstellation')&&controller.includes('requestReturnToOrbit')
          };
          const failures=Object.entries(checks).filter(([,v])=>!v).map(([k])=>k);
          const receipt={schema:'COMPASS_GEN1560_ENGINEERING_FLOOR_RECEIPT_v1',candidateHead:process.env.COMPASS_CANDIDATE_HEAD,governingHead:base,changedPaths:changed,mutatedProtected,checks,failures,result:failures.length?'FAIL_CLOSED':'PASS_CLOSED'};
          fs.writeFileSync('/tmp/compass-engineering-floor-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          if(failures.length)process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-gen1560-engineering-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/compass-engineering-floor-receipt.json
          retention-days: 90

  experience:
    runs-on: ubuntu-latest
    needs: engineering-floor
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMPASS_CANDIDATE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Host exact candidate
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/compass-candidate-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
      - name: Capture Gen1560 state and rendered matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/compass-experience-captures
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const candidateHead=process.env.COMPASS_CANDIDATE_HEAD,governingHead=process.env.COMPASS_GOVERNING_HEAD;
          const viewports=[['desktop',1440,1000],['tablet',1024,1366],['phone',390,844]];
          const errors=[],stateCoverage={},metrics={};
          async function snap(page,id,state){await page.screenshot({path:`/tmp/compass-experience-captures/${id}-${state}.png`,fullPage:true});(stateCoverage[id]??=[]).push(state)}
          async function inspect(page){return page.evaluate(()=>{
            const visible=el=>{if(!el)return false;const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>.02&&r.width>2&&r.height>2};
            const root=document.querySelector('[data-compass-root]');
            const purpose=document.querySelector('[data-compass-purpose-stage]');
            const kicker=document.querySelector('.compass-estate__kicker');
            const orbit=document.querySelector('.compass-capability-orbit');
            const objectStage=document.querySelector('.compass-object-stage');
            const cards=[...document.querySelectorAll('.compass-capability-orbit .compass-orbit-plaque')];
            const active=cards.filter(c=>c.dataset.active==='true'&&visible(c));
            const dock=document.querySelector('.compass-action-dock');
            const proof=document.querySelector('[data-proof-orbit]');
            const proofActive=[...document.querySelectorAll('[data-proof-card]')].filter(c=>c.dataset.active==='true');
            const objective=document.querySelector('.compass-orbit-intro');
            const scene=document.querySelector('[data-compass-scene]');
            const sceneAfter=scene?getComputedStyle(scene,'::after'):null;
            const purposeRect=purpose?.getBoundingClientRect();
            const orbitRect=orbit?.getBoundingClientRect();
            const objectRect=objectStage?.getBoundingClientRect();
            const inactiveInteractive=cards.filter(c=>c.dataset.active!=='true').flatMap(c=>[...c.querySelectorAll('a,button,input,select,textarea')]).filter(x=>x.tabIndex>=0&&!x.closest('[inert]')).length;
            return {
              mode:root?.dataset.compassMode||'',
              kicker:(kicker?.textContent||'').trim(),
              identityEvent:document.querySelector('.compass-estate__header')?.dataset.identityEvent||'',
              purposeOpen:Boolean(purpose?.open),purposeHeight:purposeRect?.height||0,purposeCollapsed:purpose?.dataset.gen1560CollapsedDefault==='true',
              orbitHeight:orbitRect?.height||0,objectStageHeight:objectRect?.height||0,
              activeCount:active.length,activeId:active[0]?.dataset.capability||'',
              dockBusy:dock?.getAttribute('aria-busy')||'',dockText:(dock?.innerText||'').replace(/\s+/g,' ').trim(),dockLinks:[...dock?.querySelectorAll('a')||[]].map(a=>a.getAttribute('href')),
              objectStageKind:orbit?.dataset.stageKind||'',proofStageKind:proof?.dataset.stageKind||'',proofActiveCount:proofActive.length,
              inactiveInteractive,
              objectiveVisible:visible(objective)&&/Mirrorland/i.test(objective?.innerText||'')&&/Rotate the Compass/i.test(objective?.innerText||''),
              glowNonBlocking:sceneAfter?.pointerEvents==='none',
              overflowX:document.documentElement.scrollWidth-document.documentElement.clientWidth,
              bodyText:document.body.innerText.replace(/\s+/g,' ').trim()
            };
          })}
          try{
            for(const [id,width,height] of viewports){
              const context=await browser.newContext({viewport:{width,height},reducedMotion:'no-preference'});
              const page=await context.newPage();page.on('pageerror',e=>errors.push(`${id}:${String(e)}`));
              await page.goto(`http://127.0.0.1:4173/?candidate=${candidateHead}`,{waitUntil:'domcontentloaded',timeout:30000});await page.waitForTimeout(1100);
              const initial=await inspect(page);metrics[id]={initial};await snap(page,id,'initial');
              const next=page.locator('.compass-capability-orbit .compass-orbit-controls button').nth(1);
              await next.click();await page.waitForTimeout(40);metrics[id].duringSettle=await inspect(page);await page.waitForTimeout(620);metrics[id].trophy=await inspect(page);await snap(page,id,'trophy');
              await next.click();await page.waitForTimeout(620);metrics[id].house=await inspect(page);await snap(page,id,'house');
              const proofNext=page.locator('[data-proof-orbit] .compass-orbit-controls button').nth(1);if(await proofNext.count()){await proofNext.click();await page.waitForTimeout(620);metrics[id].proof=await inspect(page);await snap(page,id,'proof')}
              const controller=await page.evaluate(()=>({hasSelect:typeof globalThis.DGB_COMPASS_CONTROLLER?.requestCardinalSelection==='function',hasRoom:typeof globalThis.DGB_COMPASS_CONTROLLER?.requestRoomSelection==='function',hasReturn:typeof globalThis.DGB_COMPASS_CONTROLLER?.requestReturnToOrbit==='function'}));metrics[id].controller=controller;
              await context.close();
            }
          } finally {await browser.close()}
          const all=Object.values(metrics),desktop=metrics.desktop?.initial,phone=metrics.phone?.initial;
          const every=fn=>all.every(fn);
          const hardZero={
            visualSystemCoherence:every(m=>m.initial.overflowX<=2),
            narrativeContinuity:every(m=>m.initial.kicker==='Find Your Way'&&m.initial.purposeCollapsed&&!m.initial.purposeOpen),
            interactionLegibility:every(m=>m.initial.activeCount===1&&/Enter Coheriscope/i.test(m.initial.dockText)&&m.trophy.activeId==='awards'&&/Enter Awards/i.test(m.trophy.dockText)&&m.house.activeId==='house'&&/Jeeves/i.test(m.house.dockText)),
            responsiveRecomposition:Boolean(desktop&&phone&&desktop.orbitHeight<=402&&phone.orbitHeight<=362),
            evidenceHierarchy:every(m=>m.initial.proofStageKind==='proof'&&m.initial.objectStageKind==='object'),
            categoryPreservation:every(m=>m.initial.proofStageKind==='proof'&&m.initial.objectStageKind==='object'),
            visibleGeometryIntegrity:every(m=>m.initial.overflowX<=2&&m.initial.objectStageHeight>0&&m.initial.orbitHeight>0),
            traversalContinuity:every(m=>m.controller.hasSelect&&m.controller.hasRoom&&m.controller.hasReturn),
            stateLayerExclusivity:every(m=>m.initial.activeCount===1&&m.initial.inactiveInteractive===0&&m.initial.proofActiveCount===1),
            purposeVisibleBeforePrimaryInteraction:every(m=>m.initial.purposeHeight>0&&m.initial.purposeHeight<=120),
            compassObjectiveVisibleAtCompass:every(m=>m.initial.objectiveVisible),
            semanticDisclosureLabels:every(m=>/Why Diamond Gate exists/i.test(m.initial.bodyText)),
            dimensionalStageProportionality:Boolean(desktop&&phone&&desktop.orbitHeight<=402&&phone.orbitHeight<=362&&desktop.objectStageHeight<=300&&phone.objectStageHeight<=270)
          };
          const newAssertions={
            singleTopIdentityEvent:every(m=>m.initial.kicker==='Find Your Way'&&m.initial.identityEvent==='single'),
            purposeCollapsedDefaultDepthPreserved:every(m=>m.initial.purposeCollapsed&&!m.initial.purposeOpen&&/Diamond Gate exists because/i.test(m.initial.bodyText)),
            foregroundNotEnter:every(m=>m.initial.activeId==='diagnostic'&&m.initial.dockLinks.includes('/coherence-diagnostic/')&&m.initial.activeCount===1),
            actionDisabledDuringSettle:every(m=>m.duringSettle.dockBusy==='true'&&m.duringSettle.dockLinks.length===0),
            actionDockMatchesForeground:every(m=>/Enter Awards/i.test(m.trophy.dockText)&&/Jeeves/i.test(m.house.dockText)),
            objectProofStageDistinct:every(m=>m.initial.objectStageKind==='object'&&m.initial.proofStageKind==='proof'),
            spatialEconomy:Boolean(desktop&&phone&&desktop.orbitHeight<=402&&phone.orbitHeight<=362),
            compassGlowNonBlocking:every(m=>m.initial.glowNonBlocking)
          };
          const stateMatrixComplete=Object.values(stateCoverage).every(v=>['initial','trophy','house','proof'].every(s=>v.includes(s)));
          const receipt={schema:'COMPASS_EXPERIENCE_CAPTURE_RECEIPT_v2',operationId:'COMPASS_SHARED_ORBIT_STAGE_AND_LUMINOUS_IDENTITY_SUCCESSOR_20260819_v1',lockGeneration:1560,candidateHead,governingHead,hardZero,newAssertions,stateMatrixComplete,stateCoverage,metrics,errors,result:Object.values(hardZero).every(Boolean)&&Object.values(newAssertions).every(Boolean)&&stateMatrixComplete&&errors.length===0?'PASS_CLOSED':'FAIL_CLOSED'};
          fs.writeFileSync('/tmp/compass-experience-capture-receipt.json',JSON.stringify(receipt,null,2)+'\n');console.log(JSON.stringify(receipt,null,2));if(receipt.result!=='PASS_CLOSED')process.exit(1);
          NODE
      - name: Verify Gen1560 exact-head experience contract
        if: always()
        shell: bash
        run: node .github/ai-router/projects/compass/verify-experience-consolidation.v1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-gen1560-experience-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/compass-experience-capture-receipt.json
            /tmp/compass-experience-consolidation-receipt.json
            /tmp/compass-experience-captures/
          retention-days: 90
