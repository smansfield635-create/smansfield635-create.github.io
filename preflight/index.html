<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#f4f0ff">
<meta name="description" content="Start a project with your AI tool, bring its response back, and keep your work moving.">
<title>DiamondGate · Preflight</title>
</head>
<body>
<main>
<h1>Opening your DiamondGate workspace</h1>
<p><a id="open-workspace" href="./app/">Open DiamondGate</a></p>
<p>Copy the new-work prompt into your AI conversation. Answer there, then bring its response back to your project.</p>
<noscript><p>Enable JavaScript to use the project workspace.</p></noscript>
</main>
<script>
const workspace = new URL('./app/', window.location.href);
workspace.search = window.location.search;
workspace.hash = window.location.hash;
document.getElementById('open-workspace').href = workspace.href;
window.location.replace(workspace.href);
</script>
</body>
</html>
