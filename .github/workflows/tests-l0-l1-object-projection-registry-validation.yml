name: Tests L0 L1 Object Projection Registry Validation

on:
  push:
    branches:
      - agent/tests-l0-l1-object-projection-registry-v1
  pull_request:
    paths:
      - control-plane/whole-estate/tests-l0-l1-object-projection-registry-v1/**
      - .github/workflows/tests-l0-l1-object-projection-registry-validation.yml

permissions:
  contents: read

jobs:
  exact-scope-and-source-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate scope, pinned sources, and review-base noninterference
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha || '21e1115557ce37507b9b01f4d45d5a6173714637' }}
        run: |
          set -euo pipefail
          CONSTRUCTION_BASE=21e1115557ce37507b9b01f4d45d5a6173714637

          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base "$CANDIDATE_SHA" "$CONSTRUCTION_BASE")" = "$CONSTRUCTION_BASE"

          mapfile -t actual < <(git diff --name-only "$CONSTRUCTION_BASE"..."$CANDIDATE_SHA" | sort)
          expected=(
            ".github/workflows/tests-l0-l1-object-projection-registry-validation.yml"
            "control-plane/whole-estate/tests-l0-l1-object-projection-registry-v1/README.md"
            "control-plane/whole-estate/tests-l0-l1-object-projection-registry-v1/object-projection-registry.v1.json"
            "control-plane/whole-estate/tests-l0-l1-object-projection-registry-v1/source-admission-ledger.v1.json"
            "control-plane/whole-estate/tests-l0-l1-object-projection-registry-v1/verify.v1.mjs"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")

          check_blob_at() {
            local ref="$1"
            local path="$2"
            local expected_sha="$3"
            local actual_sha
            actual_sha="$(git rev-parse "$ref:$path")"
            test "$actual_sha" = "$expected_sha"
          }

          source_paths=(
            "control-plane/whole-estate/tests-l0-l1-navigation-shell-authority-v1/authority-contract.v1.json"
            "control-plane/whole-estate/tests-l0-l1-navigation-shell-authority-v1/object-projection-registry-contract.v1.json"
            "control-plane/whole-estate/tests-l0-l1-navigation-shell-authority-v1/source-authority-ledger.v1.json"
            "control-plane/methods-information-benchmark/imi-methods-models-universal-integration-v1/canonical-hierarchy.v1.json"
            "control-plane/whole-estate/whole-estate-narrative-and-constitutive-baseline-freeze-v1/baseline-identities.v1.json"
          )
          source_blobs=(
            "0bfab791c005ca71cee771a5d14d27f8dfab3177"
            "ed969c87359c42444c477a752f332f07f0059a30"
            "fe37b67fe3faf0d62b969ec3860c2d083e2e8185"
            "c2d7383ff6377cdbe6b31710011db1d4287e49e4"
            "b86cc4094901989fdd2b3a3f13e65c5d50b73005"
          )

          for i in "${!source_paths[@]}"; do
            check_blob_at "$CONSTRUCTION_BASE" "${source_paths[$i]}" "${source_blobs[$i]}"
          done

          git cat-file -e "$REVIEW_BASE_SHA^{commit}"
          test "$(git merge-base "$REVIEW_BASE_SHA" "$CONSTRUCTION_BASE")" = "$CONSTRUCTION_BASE"
          mapfile -t review_base_drift < <(git diff --name-only "$CONSTRUCTION_BASE"..."$REVIEW_BASE_SHA" | sort)

          protected_overlap=0
          for changed in "${review_base_drift[@]}"; do
            for protected in "${source_paths[@]}"; do
              if [[ "$changed" == "$protected" ]]; then
                printf 'PROTECTED_SOURCE_BASE_DRIFT=%s\n' "$changed" >&2
                protected_overlap=$((protected_overlap + 1))
              fi
            done
            if [[ "$changed" == control-plane/whole-estate/tests-l0-l1-object-projection-registry-v1/* || "$changed" == ".github/workflows/tests-l0-l1-object-projection-registry-validation.yml" ]]; then
              printf 'REGISTRY_SCOPE_BASE_DRIFT=%s\n' "$changed" >&2
              protected_overlap=$((protected_overlap + 1))
            fi
          done
          test "$protected_overlap" -eq 0

          for i in "${!source_paths[@]}"; do
            check_blob_at "$REVIEW_BASE_SHA" "${source_paths[$i]}" "${source_blobs[$i]}"
          done

          mkdir -p artifacts
          cat > artifacts/scope-source-audit.v1.json <<EOF
          {
            "schema": "WHOLE_ESTATE_TESTS_L0_L1_OBJECT_PROJECTION_SCOPE_SOURCE_AUDIT_v1",
            "result": "PASS",
            "constructionBaseMain": "$CONSTRUCTION_BASE",
            "candidateHead": "$CANDIDATE_SHA",
            "candidateChangedPathCount": ${#actual[@]},
            "sourceBlobCount": ${#source_paths[@]},
            "reviewBase": "$REVIEW_BASE_SHA",
            "reviewBaseDriftPathCount": ${#review_base_drift[@]},
            "reviewBaseProtectedOverlapCount": $protected_overlap,
            "publicMutation": false,
            "visualConstruction": false
          }
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: tests-l0-l1-object-projection-scope-source-audit-v1
          path: artifacts/scope-source-audit.v1.json

  registry-contract-verification:
    needs: exact-scope-and-source-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Execute bounded registry verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node control-plane/whole-estate/tests-l0-l1-object-projection-registry-v1/verify.v1.mjs | tee artifacts/object-projection-registry-verification.v1.json

      - uses: actions/upload-artifact@v4
        with:
          name: tests-l0-l1-object-projection-registry-verification-v1
          path: artifacts/object-projection-registry-verification.v1.json
