name: IMI structural-regime severe test v1
on:
  pull_request:
    paths:
      - 'research/imi/IMI_STRUCTURAL_REGIME_TEST_PROTOCOL_v1.md'
      - 'research/imi/imi_structural_regime_test_v1.py'
      - '.github/workflows/imi-structural-regime-test-v1.yml'
  workflow_dispatch:
jobs:
  structural-regime:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            research/imi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: pip install numpy pandas scikit-learn lightgbm requests
      - name: Execute frozen structural-regime severe test
        run: python research/imi/imi_structural_regime_test_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imi-structural-regime-test-v1
          path: |
            imi_structural_regime_findings_v1.json
            IMI_STRUCTURAL_REGIME_VERDICT_v1.txt
            imi_structural_regime_predictions_v1.csv
