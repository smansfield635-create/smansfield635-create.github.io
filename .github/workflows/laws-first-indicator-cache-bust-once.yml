name: Laws FIRST indicator cache bust once

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: laws-first-indicator-cache-bust-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cache-bust:
    if: github.event.pull_request.head.ref == 'agent/laws-first-indicator-cache-bust-001'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace only the Laws polish cache token
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('laws/index.html')
          text = path.read_text(encoding='utf-8')
          old = '/laws/index.experience.polish.css?v=LAWS_CP6_EXPERIENTIAL_POLISH_20260801B'
          new = '/laws/index.experience.polish.css?v=LAWS_FIRST_INDICATOR_RESTORATION_20260802A'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one cache token, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          rm .github/workflows/laws-first-indicator-cache-bust-once.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add laws/index.html .github/workflows/laws-first-indicator-cache-bust-once.yml
          git commit -m "Bust Laws FIRST indicator stylesheet cache"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
