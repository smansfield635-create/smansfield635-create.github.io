name: H-Earth Terrain Intelligence and Perceptual Workbench

on:
  pull_request:
    paths:
      - '.github/workflows/h-earth-terrain-workbench.yml'
      - 'h-earth-3d/tools/terrain-workbench/**'
      - 'h-earth-3d/control-plane/post-cp2-round2/H_EARTH_ROUND2_ASSET_DISPOSITION_MANIFEST.v1.json'
      - 'h-earth-3d/validation/terrain-workbench/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-terrain-workbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact workbench candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bounded Chromium dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start repository server
        run: |
          python3 -m http.server 4187 --bind 127.0.0.1 > /tmp/h-earth-terrain-workbench-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4187/h-earth-3d/tools/terrain-workbench/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/h-earth-terrain-workbench-server.log
          exit 1
      - name: Execute workbench verifier
        env:
          TERRAIN_WORKBENCH_URL: http://127.0.0.1:4187/h-earth-3d/tools/terrain-workbench/index.html
        run: node h-earth-3d/validation/terrain-workbench/h-earth.terrain-workbench.runner.mjs | tee /tmp/h-earth-terrain-workbench.log
      - name: Upload workbench evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-terrain-intelligence-and-perceptual-workbench
          path: |
            h-earth-3d/validation/terrain-workbench/h-earth.terrain-workbench.receipt.v1.json
            h-earth-3d/validation/terrain-workbench/evidence/
            /tmp/h-earth-terrain-workbench.log
            /tmp/h-earth-terrain-workbench-server.log
          retention-days: 90
      - name: Enforce workbench pass
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipt = JSON.parse(fs.readFileSync('h-earth-3d/validation/terrain-workbench/h-earth.terrain-workbench.receipt.v1.json', 'utf8'));
          if (receipt.pass !== true || receipt.result !== 'H_EARTH_TERRAIN_WORKBENCH_VERIFICATION_PASS') {
            console.error(JSON.stringify(receipt, null, 2));
            process.exit(1);
          }
          console.log(`TERRAIN_WORKBENCH_PASS:${receipt.packetDigest}:${receipt.canonicalReceiptSha256}`);
          NODE
