name: World Manifold Gen306 Candidate Qualification

on:
  push:
    branches:
      - control-plane-carrier/world-manifold-intake-20260817
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_HEAD: f484e601e5efaa0ae6d436101d42020d70973ce1
      BASE_HEAD: a7b13dd5cebeafe6ce126d7df64c4088db7feb48
    steps:
      - name: Checkout exact Gen306 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: smansfield635-create/smansfield635-create.github.io
          ref: ${{ env.CANDIDATE_HEAD }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact candidate identity
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
      - name: Syntax check exact eleven mutated modules
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            h-earth-3d/terrain/h-earth.world-manifold-domain.js \
            h-earth-3d/integration/h-earth.world-representation-plan.js \
            h-earth-3d/integration/h-earth.world-manifold-union-admission.js \
            h-earth-3d/validation/h-earth.world-manifold-architecture.harness.mjs \
            h-earth-3d/terrain/h-earth.successor-terrain-field.run8b.js \
            showroom/globe/h-earth/render/geometry-successor-terrain.run8b.js \
            showroom/globe/h-earth/render/geometry-shoreline.js \
            showroom/globe/h-earth/render/geometry-distant-context.js \
            showroom/globe/h-earth/render/landscape-preview.js \
            h-earth-3d/integration/h-earth.run8e-successor-environment-transfer.js \
            showroom/globe/h-earth/render/run8e-successor-environment.js
          do node --check "$path"; done
      - name: Execute Gen306 architecture harness
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          node h-earth-3d/validation/h-earth.world-manifold-architecture.harness.mjs | tee "$RUNNER_TEMP/gen306.json"
          test "$(jq -r '.result' "$RUNNER_TEMP/gen306.json")" = 'PASS_CLOSED'
          for p in CONTINUOUS_WORLD_MANIFOLD RADIAL_HORIZON_CONTINUITY TOPOLOGY_PRESERVING_LOD OCEAN_SECTOR_EMPTINESS REPRESENTATION_BOUNDARY_INVISIBILITY SINGLE_WORLD_ENVELOPE_DOMAIN_FUNCTION SPATIALLY_OVERLAPPED_LOD_AUTHORITY CAMERA_SURROUNDING_FAR_ENVELOPE GEOGRAPHY_IDENTITY_PRESERVED; do test "$(jq -r ".predicates.$p" "$RUNNER_TEMP/gen306.json")" = 'true'; done
      - name: Execute construction smoke graph
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { constructHEarthDistantContextGeometry } from './showroom/globe/h-earth/render/geometry-distant-context.js';
          import { previewHEarthFunctionalLandscape } from './showroom/globe/h-earth/render/landscape-preview.js';
          import { buildHEarthRun8ENeutralPackage } from './showroom/globe/h-earth/render/run8e-successor-environment.js';
          const far=constructHEarthDistantContextGeometry({cameraWorld:{x:0,y:8,z:-40}});
          if(far.ok!==true) throw new Error(`FAR:${JSON.stringify({issues:far.issues,construction:far.constructionDiagnostics})}`);
          const preview=previewHEarthFunctionalLandscape({cameraWorld:{x:0,y:8,z:-40}});
          if(preview.ok!==true) throw new Error(`PREVIEW:${JSON.stringify(preview.issues)}`);
          if(preview.worldManifoldUnion?.valid!==true) throw new Error('MANIFOLD_UNION_INVALID');
          const neutral=buildHEarthRun8ENeutralPackage({cameraWorld:{x:0,y:8,z:-40}});
          if(neutral.ok!==true) throw new Error(`NEUTRAL:${JSON.stringify(neutral.issues)}`);
          if(neutral.topologySourceId!==preview.topologySourceId) throw new Error('TOPOLOGY_IDENTITY_DIVERGED');
          console.log(JSON.stringify({farMesh:far.meshDiagnostics,previewPrimitives:preview.primitiveCount,neutralPrimitives:neutral.primitiveCount,terrain:neutral.terrainPrimitiveCount,shoreline:neutral.shorelinePrimitiveCount,far:neutral.farRepresentationPrimitiveCount,vegetation:neutral.vegetationPrimitiveCount,topologySourceId:neutral.topologySourceId}));
          NODE
      - name: Execute predecessor harnesses diagnostically
        working-directory: candidate
        shell: bash
        run: |
          set +e
          if test -f h-earth-3d/validation/h-earth.run8b.successor-neutral-geometry.harness.mjs; then
            node h-earth-3d/validation/h-earth.run8b.successor-neutral-geometry.harness.mjs > "$RUNNER_TEMP/run8b.log" 2>&1; echo "RUN8B_EXIT=$?"; cat "$RUNNER_TEMP/run8b.log";
          fi
          if test -f h-earth-3d/validation/h-earth.run8e.integration-engineering.harness.mjs; then
            node h-earth-3d/validation/h-earth.run8e.integration-engineering.harness.mjs > "$RUNNER_TEMP/run8e.log" 2>&1; echo "RUN8E_EXIT=$?"; cat "$RUNNER_TEMP/run8e.log";
          fi
          exit 0
