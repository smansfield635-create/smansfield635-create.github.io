name: Existing Portfolio Internal Retrospective Adjudication v1

on:
  pull_request:
    paths:
      - "research/route-operator-platform-v1/registered-challenges/independent-constitutive-route-identification-challenge-v1/existing-portfolio-internal-retrospective-adjudication-v1/**"
      - ".github/workflows/existing-portfolio-internal-retrospective-adjudication-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-frozen-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify and recompute terminal adjudication
        run: |
          python research/route-operator-platform-v1/registered-challenges/independent-constitutive-route-identification-challenge-v1/existing-portfolio-internal-retrospective-adjudication-v1/verify.py
