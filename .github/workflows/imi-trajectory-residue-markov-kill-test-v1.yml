name: IMI trajectory residue Markov kill test v1
on:
  pull_request:
    paths:
      - 'research/imi/IMI_TRAJECTORY_RESIDUE_MARKOV_KILL_TEST_PROTOCOL_v1.md'
      - 'research/imi/imi_trajectory_residue_markov_kill_test_v1.py'
      - 'research/imi/imi_trajectory_residue_markov_kill_test_sourcefix_v1.py'
      - '.github/workflows/imi-trajectory-residue-markov-kill-test-v1.yml'
  workflow_dispatch:
jobs:
  kill-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            research/imi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: pip install numpy pandas scikit-learn lightgbm requests
      - name: Execute frozen IMI trajectory-residue kill test
        run: python research/imi/imi_trajectory_residue_markov_kill_test_sourcefix_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imi-trajectory-residue-markov-kill-test-v1
          path: |
            imi_trajectory_residue_markov_findings_v1.json
            IMI_TRAJECTORY_RESIDUE_MARKOV_VERDICT_v1.txt
            imi_trajectory_residue_temporal_predictions_v1.csv
            imi_trajectory_residue_snapshot_sample_v1.csv
