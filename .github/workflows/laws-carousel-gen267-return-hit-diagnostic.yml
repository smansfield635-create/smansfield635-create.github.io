name: Laws Carousel Gen267 Return Hit Diagnostic
on:
  push:
    branches: ['agent/laws-carousel-gen267-continuity-intake']
    paths: ['.github/workflows/laws-carousel-gen267-return-hit-diagnostic.yml']
permissions:
  contents: read
env:
  CANDIDATE: d7d9cfa4c1aa4a38082852094d3d8f069d2881b3
  ORIGIN: http://127.0.0.1:4173
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.CANDIDATE }}'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with: {chrome-version: stable}
      - run: npm install --no-save --no-package-lock puppeteer-core@24.15.0
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS "$ORIGIN/laws/research/methods-and-models/" >/dev/null && exit 0; sleep .25; done
          exit 1
      - name: Check open and return hit paths
        env: {CHROME_PATH: '${{ steps.chrome.outputs.chrome-path }}'}
        run: |
          cat > hit.mjs <<'JS'
          import fs from 'node:fs'; import puppeteer from 'puppeteer-core'; const b=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox']}); const p=await b.newPage(); await p.setViewport({width:390,height:844}); await p.goto(process.env.ORIGIN+'/laws/research/methods-and-models/',{waitUntil:'networkidle0'}); await p.click('[data-mm-family-tabs] [data-family-index="1"]'); await p.waitForFunction(()=>document.querySelector('[data-mm-carousel]')?.dataset.family==='pressure'); await p.click('.mm-card[data-active="true"] [data-open-inspection]'); await p.waitForFunction(()=>document.querySelector('[data-mm-carousel]')?.dataset.inspecting==='true'); const before=await p.evaluate(()=>{const e=document.querySelector('.mm-card[data-active="true"] [data-close-inspection]'); const r=e.getBoundingClientRect(); const h=document.elementFromPoint(r.x+r.width/2,r.y+r.height/2); return {scrollY,rect:{x:r.x,y:r.y,w:r.width,h:r.height,b:r.bottom},hidden:e.hidden,hit:{tag:h?.tagName,cls:h?.className,text:h?.textContent?.trim()?.slice(0,80)}}}); let err=null; try{await p.click('.mm-card[data-active="true"] [data-close-inspection]'); await p.waitForFunction(()=>document.querySelector('[data-mm-carousel]')?.dataset.inspecting==='false',{timeout:5000});}catch(e){err=String(e)} const after=await p.evaluate(()=>({scrollY,inspecting:document.querySelector('[data-mm-carousel]')?.dataset.inspecting})); fs.writeFileSync('return-hit.json',JSON.stringify({before,after,err},null,2)); await b.close();
          JS
          CANDIDATE="$CANDIDATE" ORIGIN="$ORIGIN" node hit.mjs
      - uses: actions/upload-artifact@v4
        with: {name: 'gen267-return-hit-${{ github.run_id }}', path: return-hit.json}
