name: H-Earth Gate B Post-Guardrail Preflight

on:
  push:
    branches:
      - agent/h-earth-gate-b-post-guardrail-evaluation-001
    paths:
      - .h-earth-evaluation/gate-b-preflight.request
      - .github/workflows/h-earth-gate-b-post-guardrail-preflight.yml

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve exact implementation ledger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .h-earth-evaluation
          cat > .h-earth-evaluation/gate-b-eight-path.ledger <<'EOF'
          showroom/globe/h-earth/admitted-geometry-frame.js
          showroom/globe/h-earth/compositor.js
          showroom/globe/h-earth/environment.js
          showroom/globe/h-earth/gate-b-route-input.js
          showroom/globe/h-earth/index.html
          showroom/globe/h-earth/render/ground-view-gate-b-packet-002-adapter.js
          showroom/globe/h-earth/render/ground-view-gate-b.js
          showroom/globe/h-earth/render/tests/ground-view-gate-b.contract.js
          EOF
          test "$(wc -l < .h-earth-evaluation/gate-b-eight-path.ledger)" -eq 8
      - name: Execute installed mutation-intent preflight
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t paths < .h-earth-evaluation/gate-b-eight-path.ledger
          args=()
          for path in "${paths[@]}"; do args+=(--path "$path"); done
          node --experimental-default-type=module tools/h-earth-repository-registry-auto-preflight.mjs "${args[@]}" --mutation-intent | tee .h-earth-evaluation/gate-b-preflight.output.txt
      - name: Record preflight receipt
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'PHASE=POST_GUARDRAIL_GATE_B_IMPLEMENTATION_EVALUATION'
            echo 'PACKAGE_PATH_COUNT=8'
            echo 'BASE_MAIN=465596de77ef0a28a7f779e06851130f4768e445'
            echo 'PREFLIGHT_EXECUTED=TRUE'
            echo 'MUTATION_PERFORMED=FALSE'
          } > .h-earth-evaluation/gate-b-preflight.receipt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .h-earth-evaluation/gate-b-eight-path.ledger .h-earth-evaluation/gate-b-preflight.output.txt .h-earth-evaluation/gate-b-preflight.receipt
          git commit -m 'Record post-guardrail Gate B preflight'
          git push origin HEAD:agent/h-earth-gate-b-post-guardrail-evaluation-001
