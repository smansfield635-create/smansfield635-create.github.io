name: Bounded Exact-Head Execution Carrier v1

on:
  push:
    branches:
      - agent/bounded-exact-head-execution-carrier-v1-003
    paths:
      - '.github/ai-router/router.v1.json'
      - '.github/ai-router/execution-backends.v1.json'
      - '.github/ai-router/system-continuity/gap-registry.v1.json'
      - '.github/ai-router/bounded-exact-head-execution-carrier/**'
      - '.github/workflows/bounded-exact-head-execution-carrier-v1.yml'
  pull_request:
    paths:
      - '.github/ai-router/router.v1.json'
      - '.github/ai-router/execution-backends.v1.json'
      - '.github/ai-router/system-continuity/gap-registry.v1.json'
      - '.github/ai-router/bounded-exact-head-execution-carrier/**'
      - '.github/workflows/bounded-exact-head-execution-carrier-v1.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  verify-candidate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      REPAIR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      ADMITTED_BASE: 9476afe595b85f7e0e4bb696f7978bc0c62cc04d
      TARGET_PR897_HEAD: 8cafbb22448cc6d950c4333e1af1b61540356cfa
      TARGET_GEN1039_SCOPE_HASH: fadfa350a31e2871ee3319cedcaf160d307b8d20f0e117af88a50bb613ed4268
      REPAIR_GEN1049_SCOPE_HASH: 9e2a82b25e6a8aa670f8b3fb30516147d33b8fd55cf79768c52d88fb7d7bf6f0
    steps:
      - name: Check out exact repair candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REPAIR_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact repair head, one-path scope, and preserved issue-comment route
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "$REPAIR_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mapfile -t changed < <(git diff --name-only "$ADMITTED_BASE" "$REPAIR_HEAD")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/bounded-exact-head-execution-carrier-v1.yml'
          git show "$ADMITTED_BASE:.github/workflows/bounded-exact-head-execution-carrier-v1.yml" > "$RUNNER_TEMP/base-workflow.yml"
          node - <<'NODE'
          const fs=require('fs');
          const base=fs.readFileSync(process.env.RUNNER_TEMP+'/base-workflow.yml','utf8');
          const current=fs.readFileSync('.github/workflows/bounded-exact-head-execution-carrier-v1.yml','utf8');
          const marker='  execute-registered-command:\n';
          const b=base.indexOf(marker), c=current.indexOf(marker);
          if(b<0||c<0||base.slice(b)!==current.slice(c)) process.exit(1);
          const legacyEnv=['GEN','839_SUCCESSOR_RECEIPT_B64'].join('');
          const legacyOp=['BOUNDED_EXACT_HEAD_EXECUTION_CARRIER','_V1_INSTALLATION_20260809_002_SUCCESSOR_001'].join('');
          if(current.includes(legacyEnv)||current.includes(legacyOp)) process.exit(1);
          NODE
          printf '%s\n' '.github/workflows/bounded-exact-head-execution-carrier-v1.yml' > "$RUNNER_TEMP/scope-diff.txt"

      - name: Verify canonical Gen1039 target and Gen1049 repair locks
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/operation-locks/repository-operation-intake-v1:refs/remotes/origin/operation-locks/repository-operation-intake-v1
          git show refs/remotes/origin/operation-locks/repository-operation-intake-v1:.github/operation-intake/active-operation-ledger.v1.json > "$RUNNER_TEMP/canonical-ledger.json"
          node - <<'NODE'
          const fs=require('fs');
          const ledger=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/canonical-ledger.json','utf8'));
          const g1039=ledger.activeScopes?.[process.env.TARGET_GEN1039_SCOPE_HASH];
          const g1049=ledger.activeScopes?.[process.env.REPAIR_GEN1049_SCOPE_HASH];
          const ok1039=g1039&&g1039.operationId==='PAGE_EXCELLENCE_IMPLEMENTATION_CARRIER_EXTENSION_V1_20260810_001'&&g1039.lockGeneration===1039&&g1039.governingHead===process.env.ADMITTED_BASE&&g1039.lockScope==='REPOSITORY_CONTROL_PLANE:BOUNDED_EXACT_HEAD_EXECUTION_CARRIER:PAGE_EXCELLENCE_IMPLEMENTATION_PHASE:V1'&&g1039.requestDigest==='7f8402d6a0757c081f9e962566db13cc24714adcddf0b1a1f420f4339aa211f4'&&g1039.procedureLocatorDigest==='841be9249220475e422d7f9de21f39f7b97dbf40983c119b8310f09beddba6e4'&&g1039.state==='ADMITTED_LOCKED'&&g1039.released===false;
          const ok1049=g1049&&g1049.operationId==='PAGE_EXCELLENCE_IMPLEMENTATION_CARRIER_CERTIFICATION_IDENTITY_REPAIR_V1_20260810_002'&&g1049.lockGeneration===1049&&g1049.governingHead===process.env.ADMITTED_BASE&&g1049.lockScope==='REPOSITORY_CONTROL_PLANE:BOUNDED_EXACT_HEAD_EXECUTION_CARRIER:CERTIFICATION_IDENTITY_REPAIR:V1'&&g1049.requestDigest==='9124d57b3b472f08f08083b426e4e278c4582f802b3d840a5f5862c1229a4002'&&g1049.procedureLocatorDigest==='bac9af9fe55c65c3eaee3d6a0dcebb867737bb7dbe0986f68391e20f9d91138e'&&g1049.state==='ADMITTED_LOCKED'&&g1049.released===false;
          if(!ok1039||!ok1049) process.exit(1);
          NODE

      - name: Verify exact frozen PR 897 carrier candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/infra/page-excellence-implementation-carrier-v1-001:refs/remotes/origin/pr897-target
          test "$(git rev-parse refs/remotes/origin/pr897-target^{commit})" = "$TARGET_PR897_HEAD"
          worktree="$RUNNER_TEMP/pr897-worktree"
          git worktree add --detach "$worktree" "$TARGET_PR897_HEAD"
          test -z "$(git -C "$worktree" status --porcelain=v1 --untracked-files=all)"
          (
            cd "$worktree"
            CARRIER_EXACT_HEAD_REEXEC=1 node .github/ai-router/bounded-exact-head-execution-carrier/self-test.v1.mjs --output "$RUNNER_TEMP/pr897-self-test.json"
          )
          test -z "$(git -C "$worktree" status --porcelain=v1 --untracked-files=all)"
          git worktree remove --force "$worktree"
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/pr897-self-test.json','utf8'));
          if(r.result!=='PASS'||r.executionHead!==process.env.TARGET_PR897_HEAD||r.passed!==r.total||r.total!==35||r.nativeRegressionPassCount!==r.nativeRegressionCount||r.nativeRegressionCount!==5||r.genericPageImplementationExecutionClassPresent!==true||r.architectureReceiptContinuityEnforced!==true||r.nineImplementationFindingsRequired!==true||r.canonicalOperationDerivedImplementationBundleOnly!==true||r.authorityInflationObserved!==false||r.arbitraryCommandAccepted!==false||r.callerSuppliedBundleAccepted!==false) process.exit(1);
          NODE

      - name: Recompute exact one-path repair Router gate
        shell: bash
        run: |
          set -euo pipefail
          worktree="$RUNNER_TEMP/repair-worktree"
          git worktree add --detach "$worktree" "$REPAIR_HEAD"
          (
            cd "$worktree"
            node tools/repository-ai-entry-router.mjs \
              --mutation-intent \
              --path .github/workflows/bounded-exact-head-execution-carrier-v1.yml \
              --task PAGE_EXCELLENCE_IMPLEMENTATION_CARRIER_CERTIFICATION_IDENTITY_REPAIR_V1_20260810_002 \
              --output "$RUNNER_TEMP/router-receipt.json"
          )
          test -z "$(git -C "$worktree" status --porcelain=v1 --untracked-files=all)"
          git worktree remove --force "$worktree"
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/router-receipt.json','utf8'));
          if(r.disposition!=='PASS'||r.governingHead!==process.env.REPAIR_HEAD||r.routes?.length!==1||r.routes[0]?.path!=='.github/workflows/bounded-exact-head-execution-carrier-v1.yml'||r.routes[0]?.projectId!=='REPOSITORY_AI_ROUTER_INFRASTRUCTURE'||r.routes[0]?.disposition!=='PASS'||r.workingTreeClean!==true) process.exit(1);
          NODE

      - name: Emit fresh Gen1039-bound carrier certification receipt
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'); const p=process.env.RUNNER_TEMP;
          const router=JSON.parse(fs.readFileSync(p+'/router-receipt.json','utf8'));
          const self=JSON.parse(fs.readFileSync(p+'/pr897-self-test.json','utf8'));
          const out={schema:'BOUNDED_EXACT_HEAD_EXECUTION_CARRIER_VERIFICATION_RECEIPT_v1',result:'PASS',generation:1039,operationId:'PAGE_EXCELLENCE_IMPLEMENTATION_CARRIER_EXTENSION_V1_20260810_001',head:process.env.TARGET_PR897_HEAD,governingHead:process.env.ADMITTED_BASE,lockScope:'REPOSITORY_CONTROL_PLANE:BOUNDED_EXACT_HEAD_EXECUTION_CARRIER:PAGE_EXCELLENCE_IMPLEMENTATION_PHASE:V1',scopeHash:process.env.TARGET_GEN1039_SCOPE_HASH,certificationRouteGeneration:1049,certificationRouteOperationId:'PAGE_EXCELLENCE_IMPLEMENTATION_CARRIER_CERTIFICATION_IDENTITY_REPAIR_V1_20260810_002',certificationRouteHead:process.env.REPAIR_HEAD,routerDisposition:router.disposition,routerRouteCount:router.routes.length,selfTestResult:self.result,selfTestPassed:self.passed,selfTestTotal:self.total,nativeRegressionPassCount:self.nativeRegressionPassCount,nativeRegressionCount:self.nativeRegressionCount,canonicalOperationDerivedImplementationBundleOnly:self.canonicalOperationDerivedImplementationBundleOnly,architectureReceiptContinuityEnforced:self.architectureReceiptContinuityEnforced,nineImplementationFindingsRequired:self.nineImplementationFindingsRequired,historicalGeneration839AuthorityUsed:false,issueCommentExecutionRoutePreserved:true,carrierFunctionalBytesMutated:false,authorityInherited:false,arbitraryCommandAuthority:false,repositoryWriteAuthority:false,productAuthority:false,semanticAuthority:false};
          fs.writeFileSync(p+'/verification.json',JSON.stringify(out,null,2)+'\n');
          NODE
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-exact-head-carrier-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/canonical-ledger.json
            ${{ runner.temp }}/scope-diff.txt
            ${{ runner.temp }}/router-receipt.json
            ${{ runner.temp }}/pr897-self-test.json
            ${{ runner.temp }}/verification.json
          if-no-files-found: warn
          retention-days: 90

  execute-registered-command:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 578 &&
      github.actor == 'smansfield635-create' &&
      startsWith(github.event.comment.body, 'BOUNDED_EXACT_HEAD_EXECUTION_REQUEST_V1')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out ratified default branch carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse bounded request without shell evaluation
        shell: bash
        env:
          REQUEST_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const marker='BOUNDED_EXACT_HEAD_EXECUTION_REQUEST_V1';
          const body=process.env.REQUEST_BODY ?? '';
          if(!body.startsWith(marker)) process.exit(2);
          const raw=body.slice(marker.length).trim();
          fs.writeFileSync(process.env.RUNNER_TEMP+'/request.json',JSON.stringify(JSON.parse(raw),null,2)+'\n');
          NODE

      - name: Execute registered command through bounded carrier
        id: carrier
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node .github/ai-router/bounded-exact-head-execution-carrier/carrier.v1.mjs \
            --input "$RUNNER_TEMP/request.json" \
            --output "$RUNNER_TEMP/execution-receipt.json"

      - name: Upload bounded execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-exact-head-carrier-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/request.json
            ${{ runner.temp }}/execution-receipt.json
          if-no-files-found: warn
          retention-days: 90

      - name: Return bounded execution receipt
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const p=process.env.RUNNER_TEMP+'/execution-receipt.json';
            let r={schema:'BOUNDED_EXACT_HEAD_EXECUTION_FAILURE_v1',result:'FAIL_CLOSED',errorCode:'EXECUTION_RECEIPT_MISSING'};
            if(fs.existsSync(p)) r=JSON.parse(fs.readFileSync(p,'utf8'));
            const n=r.nativeReceipt??null;
            const projection={schema:r.schema,result:r.result,errorCode:r.errorCode??null,descriptorId:r.descriptorId??null,operationId:r.operationId??null,lockGeneration:r.lockGeneration??null,targetHead:r.targetHead??null,exactHeadVerified:r.exactHeadVerified??false,workingTreeCleanBeforeAndAfter:r.workingTreeCleanBeforeAndAfter??false,nativeReceiptSchema:r.nativeReceiptSchema??n?.schema??null,nativeReceiptDisposition:n?.disposition??null,nativeReceiptDigest:r.nativeReceiptDigest??null,nativeReceiptRewritten:r.nativeReceiptRewritten??null,repositoryWritesPerformed:r.repositoryWritesPerformed??false,arbitraryCommandAuthority:r.arbitraryCommandAuthority??false,semanticAuthorityCreated:r.semanticAuthorityCreated??false};
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:578,body:'BOUNDED_EXACT_HEAD_EXECUTION_RETURN_V1\n```json\n'+JSON.stringify(projection,null,2)+'\n```'});

      - name: Fail closed if carrier execution was nonpass
        if: steps.carrier.outcome != 'success'
        shell: bash
        run: exit 1
