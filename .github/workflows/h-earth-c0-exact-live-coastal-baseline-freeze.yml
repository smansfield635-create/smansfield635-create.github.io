name: H-Earth C0 Exact Live Coastal Baseline Freeze

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h-earth-c0-exact-live-coastal-baseline-freeze.yml'

permissions:
  contents: write

concurrency:
  group: h-earth-c0-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXACT_MAIN_HEAD: 59df682501f63aec8a263cef8e1a5adacbc2a1a2
  C0_BRANCH: agent/h-earth-c0-exact-live-coastal-baseline-freeze-001
  ROLLBACK_BRANCH: rollback/h-earth-c0-exact-live-coastal-baseline-freeze-001
  C0_ROOT: h-earth-3d/control-plane/coastal-morphology/c0
  C0_EVIDENCE: h-earth-3d/control-plane/coastal-morphology/c0/evidence

jobs:
  c0-e-reproducibility-rollback-and-final-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify C0-D correction input and rollback authority
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.ref }}" = "$C0_BRANCH"
          git fetch origin main "$ROLLBACK_BRANCH"
          test "$(git rev-parse origin/main)" = "$EXACT_MAIN_HEAD"
          test "$(git merge-base "$EXACT_MAIN_HEAD" HEAD)" = "$EXACT_MAIN_HEAD"
          test "$(git rev-parse "origin/$ROLLBACK_BRANCH")" = "$EXACT_MAIN_HEAD"
          test "$(git rev-parse "$EXACT_MAIN_HEAD^{tree}")" = "$(git rev-parse "origin/$ROLLBACK_BRANCH^{tree}")"
          test "$(node -p "require('./$C0_EVIDENCE/h-earth.c0.runtime-receipts.json').result")" = "OPEN_BLOCKED"
          test "$(node -p "require('./$C0_EVIDENCE/h-earth.c0.runtime-receipts.json').firstBlocker")" = "PHYSICAL_MOBILE_BASELINE_NOT_EXECUTED"

      - name: Apply management correction and execute C0-E
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import cp from 'node:child_process';

          const git = (args) => cp.execFileSync('git', args, { encoding: 'utf8' }).trim();
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const write = (path, value) => fs.writeFileSync(path, JSON.stringify(value, null, 2) + '\n');
          const sha = (path) => crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex');
          const blob = (path) => git(['hash-object', path]);
          const exactMain = process.env.EXACT_MAIN_HEAD;
          const branch = process.env.C0_BRANCH;
          const rollbackBranch = process.env.ROLLBACK_BRANCH;
          const root = process.env.C0_ROOT;
          const evidence = process.env.C0_EVIDENCE;
          const paths = {
            performance: `${evidence}/h-earth.c0.performance-baseline.json`,
            runtime: `${evidence}/h-earth.c0.runtime-receipts.json`,
            manifest: `${root}/h-earth.c0.allowed-path-manifest.json`,
            schema: `${root}/h-earth.c0.receipt.schema.json`,
            reproducibility: `${evidence}/h-earth.c0.reproducibility-receipt.json`,
            history: `${evidence}/h-earth.c0.content-history-reconciliation.json`,
            artifacts: `${evidence}/h-earth.c0.artifact-manifest.json`,
            final: `${evidence}/h-earth.c0.receipt.json`
          };

          const performance = read(paths.performance);
          const runtime = read(paths.runtime);
          const manifest = read(paths.manifest);
          const measurementSnapshot = JSON.stringify(performance.runtimeStates);
          const causalitySnapshot = JSON.stringify(runtime.causalityTest);
          const aliasSnapshot = JSON.stringify(runtime.sceneAliasMapping);
          const ranges = {
            medianFrameTimeRangeMilliseconds: [16.7, 383.3],
            p95FrameTimeRangeMilliseconds: [16.8, 400],
            p99FrameTimeRangeMilliseconds: [16.8, 400]
          };
          const actualRange = (key) => {
            const values = performance.runtimeStates.map((state) => state.frameTime[key]);
            return [Math.min(...values), Math.max(...values)];
          };
          if (JSON.stringify(actualRange('median')) !== JSON.stringify(ranges.medianFrameTimeRangeMilliseconds)) throw new Error('C0_D_MEDIAN_RANGE_CHANGED');
          if (JSON.stringify(actualRange('p95')) !== JSON.stringify(ranges.p95FrameTimeRangeMilliseconds)) throw new Error('C0_D_P95_RANGE_CHANGED');
          if (JSON.stringify(actualRange('p99')) !== JSON.stringify(ranges.p99FrameTimeRangeMilliseconds)) throw new Error('C0_D_P99_RANGE_CHANGED');
          if (runtime.captureObservability !== 'VERIFIED' || runtime.cameraToPresentedFrameCausality !== 'VERIFIED') throw new Error('C0_D_CAUSALITY_NOT_VERIFIED');
          if (runtime.sceneIdCount !== 6 || runtime.uniqueCameraStateCount !== 4 || runtime.allSixEvidencePurposesRepresented !== true) throw new Error('C0_D_SCENE_CUSTODY_INVALID');
          if (runtime.runtimeStateCount !== 3 || runtime.allThreeRuntimeStatesMeasured !== true) throw new Error('C0_D_RUNTIME_BASELINE_INCOMPLETE');
          if (runtime.frameTimePercentilesRecorded !== true || runtime.memoryFieldsRecordedOrExplicitlyUnavailable !== true || runtime.downloadCostRecorded !== true || runtime.errorBaselineRecorded !== true) throw new Error('C0_D_FIELDS_INCOMPLETE');

          const correction = 'C0_D_PHYSICAL_MOBILE_REQUIREMENT_WITHDRAWAL_001';
          const history = ['C0_D_SCENE_UNIQUENESS_REQUIREMENT_WITHDRAWAL_001', correction];
          Object.assign(performance, {
            managementCorrectionHistory: history,
            managementCorrection: correction,
            previousRequirement: 'PHYSICAL_MOBILE_BASELINE_EXECUTED_MUST_EQUAL_TRUE',
            disposition: 'WITHDRAWN_AS_UNAUTHORIZED_OVERCONSTRAINT',
            correctionReason: 'C0_REQUIRES_AN_EXECUTED_AND_REPRODUCIBLE_PERFORMANCE_BASELINE_NOT_MANDATORY_PHYSICAL_DEVICE_EXECUTION',
            result: 'PASS_CLOSED',
            c0Overall: 'OPEN_IN_PROGRESS',
            performanceBaselineExecuted: true
          });
          Object.assign(performance.physicalMobile, {
            executed: false,
            status: 'DEFERRED_NONBLOCKING_REFERENCE_VALIDATION',
            disposition: 'DEFERRED_NONBLOCKING_REFERENCE_VALIDATION',
            reason: 'REQUIRED_LATER_FOR_CHANGED_CANDIDATE_VERIFICATION_NOT_REQUIRED_FOR_C0_BASELINE_CUSTODY',
            officialBaseline: false
          });
          Object.assign(runtime, {
            managementCorrectionHistory: history,
            managementCorrection: correction,
            previousRequirement: 'PHYSICAL_MOBILE_BASELINE_EXECUTED_MUST_EQUAL_TRUE',
            disposition: 'WITHDRAWN_AS_UNAUTHORIZED_OVERCONSTRAINT',
            correctionReason: 'C0_REQUIRES_AN_EXECUTED_AND_REPRODUCIBLE_PERFORMANCE_BASELINE_NOT_MANDATORY_PHYSICAL_DEVICE_EXECUTION',
            result: 'PASS_CLOSED',
            c0Overall: 'OPEN_IN_PROGRESS',
            performanceBaselineExecuted: true,
            frameTimeBaselineRecorded: true,
            memoryBaselineRecordedOrExplicitlyUnavailable: true,
            physicalMobileBaselineExecuted: false,
            physicalMobileDisposition: 'DEFERRED_NONBLOCKING_REFERENCE_VALIDATION',
            firstBlocker: null,
            nextAuthorizedC0Block: 'C0_E_REPRODUCIBILITY_ROLLBACK_AND_FINAL_RECEIPT',
            c0EAuthorized: true,
            c1Authorized: false
          });
          write(paths.performance, performance);
          write(paths.runtime, runtime);
          if (JSON.stringify(read(paths.performance).runtimeStates) !== measurementSnapshot) throw new Error('C0_D_MEASUREMENTS_MUTATED');
          if (JSON.stringify(read(paths.runtime).causalityTest) !== causalitySnapshot) throw new Error('C0_D_CAUSALITY_MUTATED');
          if (JSON.stringify(read(paths.runtime).sceneAliasMapping) !== aliasSnapshot) throw new Error('C0_D_ALIASES_MUTATED');

          for (const block of manifest.boundedExecutionBlocks) block.status = 'PASS_CLOSED';
          Object.assign(manifest, {
            currentBlock: 'C0_E_REPRODUCIBILITY_ROLLBACK_AND_FINAL_RECEIPT',
            c0Overall: 'PASS_CLOSED',
            repositoryRollbackBranch: rollbackBranch,
            laterCheckpointsAuthorized: false
          });
          write(paths.manifest, manifest);

          write(paths.schema, {
            '$schema': 'https://json-schema.org/draft/2020-12/schema',
            '$id': 'H_EARTH_C0_FINAL_RECEIPT_SCHEMA_v1',
            type: 'object',
            additionalProperties: true,
            required: ['receiptType', 'operation', 'result', 'c0Overall', 'exactMainHead', 'activeBranch', 'repositoryRollbackBranch', 'reproducibilityVerified', 'rollbackVerified', 'productMutation', 'unauthorizedChangedPaths', 'exactChangedPathCount'],
            properties: {
              receiptType: { const: 'H_EARTH_C0_FINAL_RECEIPT_v1' },
              result: { const: 'PASS_CLOSED' },
              c0Overall: { const: 'PASS_CLOSED' },
              productMutation: { const: false },
              unauthorizedChangedPaths: { const: 0 },
              exactChangedPathCount: { const: 26 }
            }
          });

          const inputHead = git(['rev-parse', 'HEAD']);
          const mainHead = git(['rev-parse', 'origin/main']);
          const rollbackHead = git(['rev-parse', `origin/${rollbackBranch}`]);
          const mergeBase = git(['merge-base', exactMain, 'HEAD']);
          const exactMainTree = git(['rev-parse', `${exactMain}^{tree}`]);
          const rollbackTree = git(['rev-parse', `origin/${rollbackBranch}^{tree}`]);
          if (mainHead !== exactMain || rollbackHead !== exactMain || mergeBase !== exactMain || exactMainTree !== rollbackTree) throw new Error('C0_E_ROLLBACK_IDENTITY_FAILURE');

          const commits = git(['log', '--reverse', '--format=%H%x09%s', `${exactMain}..HEAD`]).split(/\r?\n/).filter(Boolean).map((row) => {
            const [commit, ...subject] = row.split('\t');
            return { commit, subject: subject.join('\t') };
          });
          write(paths.history, {
            receiptType: 'H_EARTH_C0_CONTENT_HISTORY_RECONCILIATION_v1',
            operation: 'C0_E_REPRODUCIBILITY_ROLLBACK_AND_FINAL_RECEIPT',
            result: 'PASS_CLOSED',
            exactMainHead: exactMain,
            inputBranchHead: inputHead,
            chronologicalCommitCount: commits.length,
            chronologicalCommits: commits,
            earlierReceiptsReopened: false,
            measurementsRerun: false,
            fixedScenesChanged: false,
            contentHistoryReconciled: true
          });

          const digestExcluded = new Set([paths.reproducibility, paths.artifacts, paths.final]);
          const digestPaths = manifest.exactAllowedPaths.filter((path) => !digestExcluded.has(path));
          const digestPass = () => digestPaths.map((path) => ({ path, sha256: sha(path), gitBlobSha: blob(path) }));
          const passOne = digestPass();
          const passTwo = digestPass();
          if (JSON.stringify(passOne) !== JSON.stringify(passTwo)) throw new Error('C0_E_DIGEST_REPRODUCIBILITY_FAILURE');
          write(paths.reproducibility, {
            receiptType: 'H_EARTH_C0_REPRODUCIBILITY_RECEIPT_v1',
            operation: 'C0_E_REPRODUCIBILITY_ROLLBACK_AND_FINAL_RECEIPT',
            result: 'PASS_CLOSED',
            exactMainHead: exactMain,
            inputBranchHead: inputHead,
            mainHeadAtExecution: mainHead,
            mergeBase,
            repositoryRollbackBranch: rollbackBranch,
            repositoryRollbackHead: rollbackHead,
            exactMainTree,
            rollbackTree,
            rollbackVerified: true,
            deterministicDigestScopePathCount: digestPaths.length,
            deterministicDigestPassCount: 2,
            deterministicDigestPassesIdentical: true,
            performanceBaselineExecuted: true,
            physicalMobileDisposition: 'DEFERRED_NONBLOCKING_REFERENCE_VALIDATION',
            measurementsRerun: false,
            productMutation: false,
            unauthorizedChangedPaths: 0,
            digestPass: passOne
          });

          const recursiveExcluded = new Set([paths.artifacts, paths.final]);
          const artifactPaths = manifest.exactAllowedPaths.filter((path) => !recursiveExcluded.has(path));
          write(paths.artifacts, {
            receiptType: 'H_EARTH_C0_ARTIFACT_MANIFEST_v1',
            operation: 'C0_E_REPRODUCIBILITY_ROLLBACK_AND_FINAL_RECEIPT',
            result: 'PASS_CLOSED',
            exactAllowedPathCount: manifest.exactAllowedPathCount,
            manifestedArtifactCount: artifactPaths.length,
            recursiveExclusions: [paths.artifacts, paths.final],
            artifacts: artifactPaths.map((path) => ({ path, byteCount: fs.statSync(path).size, sha256: sha(path), gitBlobSha: blob(path) }))
          });

          const tracked = git(['diff', '--name-only', exactMain]).split(/\r?\n/).filter(Boolean);
          const untracked = git(['ls-files', '--others', '--exclude-standard']).split(/\r?\n/).filter(Boolean);
          const changedPaths = [...new Set([...tracked, ...untracked, paths.final])].sort();
          const allowed = new Set(manifest.exactAllowedPaths);
          const unauthorized = changedPaths.filter((path) => !allowed.has(path));
          const product = changedPaths.filter((path) => path.startsWith('showroom/globe/h-earth/') || path.startsWith('h-earth-3d/terrain/') || path.startsWith('h-earth-3d/environment/'));
          if (changedPaths.length !== 26) throw new Error(`C0_E_CHANGED_PATH_COUNT_${changedPaths.length}`);
          if (unauthorized.length) throw new Error(`C0_E_UNAUTHORIZED_PATHS:${unauthorized.join(',')}`);
          if (product.length) throw new Error(`C0_E_PRODUCT_MUTATION:${product.join(',')}`);

          write(paths.final, {
            receiptType: 'H_EARTH_C0_FINAL_RECEIPT_v1',
            operation: 'C0_E_REPRODUCIBILITY_ROLLBACK_AND_FINAL_RECEIPT',
            result: 'PASS_CLOSED',
            c0Overall: 'PASS_CLOSED',
            exactMainHead: exactMain,
            activeBranch: branch,
            inputBranchHead: inputHead,
            activePullRequest: 411,
            repositoryRollbackBranch: rollbackBranch,
            repositoryRollbackHead: rollbackHead,
            blockStatuses: Object.fromEntries(manifest.boundedExecutionBlocks.map((block) => [block.id, block.status])),
            managementCorrections: history,
            captureObservability: 'VERIFIED',
            cameraToPresentedFrameCausality: 'VERIFIED',
            sceneIdCount: 6,
            uniqueCameraStateCount: 4,
            allSixEvidencePurposesRepresented: true,
            sceneAliasMappingRecorded: true,
            performanceBaselineExecuted: true,
            runtimeStateCount: 3,
            frameTimeBaseline: ranges,
            memoryBaselineRecordedOrExplicitlyUnavailable: true,
            downloadCostRecorded: true,
            errorBaselineRecorded: true,
            physicalMobileExecuted: false,
            physicalMobileDisposition: 'DEFERRED_NONBLOCKING_REFERENCE_VALIDATION',
            physicalSamsungReferenceRun: 'REQUIRED_LATER_FOR_CHANGED_CANDIDATE_VERIFICATION_NOT_REQUIRED_FOR_C0_BASELINE_CUSTODY',
            reproducibilityVerified: true,
            rollbackVerified: true,
            artifactManifestSha256: sha(paths.artifacts),
            reproducibilityReceiptSha256: sha(paths.reproducibility),
            contentHistoryReconciliationSha256: sha(paths.history),
            performanceBaselineSha256: sha(paths.performance),
            runtimeReceiptsSha256: sha(paths.runtime),
            exactChangedPathCount: changedPaths.length,
            changedPaths,
            unauthorizedChangedPaths: 0,
            productMutation: false,
            firstBlocker: null,
            nextAuthorizedC0Block: null,
            nextProgramCheckpoint: 'C1_NOT_AUTHORIZED_PENDING_MANAGEMENT',
            activePullRequestMerged: false
          });

          const final = read(paths.final);
          if (final.result !== 'PASS_CLOSED' || final.c0Overall !== 'PASS_CLOSED' || final.exactChangedPathCount !== 26 || final.productMutation !== false || final.unauthorizedChangedPaths !== 0) throw new Error('C0_E_FINAL_RECEIPT_INVALID');
          console.log(JSON.stringify({ operation: final.operation, result: final.result, c0Overall: final.c0Overall, rollbackHead: final.repositoryRollbackHead, exactChangedPathCount: final.exactChangedPathCount, productMutation: final.productMutation }, null, 2));
          NODE

      - name: Verify and commit C0 closure package
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./$C0_EVIDENCE/h-earth.c0.runtime-receipts.json').result")" = "PASS_CLOSED"
          test "$(node -p "require('./$C0_EVIDENCE/h-earth.c0.performance-baseline.json').result")" = "PASS_CLOSED"
          test "$(node -p "require('./$C0_EVIDENCE/h-earth.c0.reproducibility-receipt.json').result")" = "PASS_CLOSED"
          test "$(node -p "require('./$C0_EVIDENCE/h-earth.c0.receipt.json').c0Overall")" = "PASS_CLOSED"
          test "$(node -p "require('./$C0_EVIDENCE/h-earth.c0.receipt.json').exactChangedPathCount")" = "26"
          sha256sum \
            "$C0_EVIDENCE/h-earth.c0.performance-baseline.json" \
            "$C0_EVIDENCE/h-earth.c0.runtime-receipts.json" \
            "$C0_EVIDENCE/h-earth.c0.reproducibility-receipt.json" \
            "$C0_EVIDENCE/h-earth.c0.content-history-reconciliation.json" \
            "$C0_EVIDENCE/h-earth.c0.artifact-manifest.json" \
            "$C0_EVIDENCE/h-earth.c0.receipt.json"
          git config user.name "h-earth-c0-evidence"
          git config user.email "actions@users.noreply.github.com"
          git add "$C0_ROOT" "$C0_EVIDENCE"
          git commit -m "C0-E: close reproducibility rollback and baseline custody"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
