name: H-Earth Band-Limited Terrain Relief V2 Finalize

on:
  push:
    branches:
      - agent/h-earth-current-live-bandlimited-terrain-relief-v2-002
    paths:
      - .github/workflows/h-earth-bandlimited-relief-v2-finalize.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore package and generate exact product outputs
        shell: bash
        run: |
          set -euo pipefail
          cat .role6-v2-package/part-* | base64 -d > /tmp/role6.zip
          printf '%s  %s\n' '676534a0cc3f75ca518c4dcd2dcf23af96f19ab01b4a8d8881f61298d7f056cd' /tmp/role6.zip | sha256sum -c -
          mkdir -p /tmp/role6
          unzip -q /tmp/role6.zip -d /tmp/role6
          PKG=/tmp/role6/ROLE_6_H_EARTH_BAND_LIMITED_TERRAIN_RELIEF_V2_COMPLETE_PRESCRIPTION_v1
          (cd "$PKG" && sha256sum -c SHA256SUMS.txt)
          test "$(git hash-object showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-round1-1f520809.js)" = de55609b0b0bd66601445a369c727ff7a6d7065d
          test "$(git hash-object showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js)" = 5eb1b6f2e72ac0525f608850234182b2c646f66f
          if git merge-base --is-ancestor 14e0f0ad03f9d6355b36d24a89e136bf3fe063aa HEAD 2>/dev/null; then
            echo FAILED_PR_524_LINEAGE_DETECTED >&2
            exit 1
          fi
          node "$PKG/apply-role6-terrain-relief-v2.mjs" \
            showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-round1-1f520809.js \
            showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js \
            /tmp/generated | tee /tmp/transform.json
          cp /tmp/generated/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js \
            showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js
          cp /tmp/generated/live-gpu-binding.terrain-relief-v2.js \
            showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js
          cp /tmp/generated/generated-output-manifest.json /tmp/output-manifest.json
          node --input-type=module --check < showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js
          node --input-type=module --check < showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const rp='showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js';
          const bp='showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js';
          const r=fs.readFileSync(rp,'utf8'), b=fs.readFileSync(bp,'utf8');
          const required=[
            'vec3 perturbTerrainNormal(', 'vec3 limitTerrainNormalDeviation(',
            '3.306939635357677','2.7318196987737333','2.243994752564138',
            '0.9271838545667874','0.3746065934159120','microReliefSignal=',
            'microReliefHeight=','0.95*terrainReliefEnvelope','geometricDiffuse-0.28',
            'geometricDiffuse+0.28','0.85*terrainReliefEnvelope','vRoleCode==1u?18.0:24.0',
            'mix(0.07,0.14,terrainReliefEnvelope)'
          ];
          for(const t of required) if(!r.includes(t)) throw new Error(`RENDERER_TOKEN_MISSING:${t}`);
          for(const t of ["'terrain-relief-v2'","'../../render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js'",'const selectedRendererModule = await import(selectedRendererPath);']) if(!b.includes(t)) throw new Error(`BINDING_TOKEN_MISSING:${t}`);
          const m=JSON.parse(fs.readFileSync('/tmp/output-manifest.json','utf8'));
          const h=x=>crypto.createHash('sha256').update(x).digest('hex');
          if(h(r)!==m.outputs.renderer.sha256||h(b)!==m.outputs.binding.sha256) throw new Error('GENERATED_SHA256_MISMATCH');
          NODE

      - name: Install Chromium and start local server
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.54.1
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          for n in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/showroom/globe/h-earth/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/server.log
          exit 1

      - name: Validate selector, shader, frame, and lifecycle
        shell: bash
        run: |
          cat > .role6-v2-verify.cjs <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          const CP2='../../render/persistent-live-renderer.run8e-r3c.cp2-round1-1f520809.js';
          const V2='../../render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js';
          async function check(browser,label,query,path,additive){
            const c=await browser.newContext({viewport:{width:1280,height:720}}),p=await c.newPage();
            const errors=[]; p.on('pageerror',e=>errors.push(e.message));
            const response=await p.goto(`http://127.0.0.1:4173/showroom/globe/h-earth/${query}`,{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForFunction(()=>document.getElementById('h-earth-functional-landscape-route')?.dataset?.run8eReady==='true'&&typeof window.H_EARTH_RUN8E_PUBLIC_ROUTE?.getLiveGpuReceipt==='function',null,{timeout:120000});
            const s=await p.evaluate(()=>{const canvas=document.getElementById('h-earth-functional-landscape-canvas');const r=window.H_EARTH_RUN8E_PUBLIC_ROUTE.getLiveGpuReceipt();const gl=canvas?.getContext?.('webgl2');return{href:location.href,r,webgl:!!gl,lost:gl?.isContextLost?.()};});
            const r=s.r, f=[];
            if(response?.status()!==200)f.push('HTTP');
            if(!s.webgl||s.lost!==false)f.push('WEBGL');
            if(r?.selectedRendererPath!==path)f.push(`PATH:${r?.selectedRendererPath}`);
            if(r?.additiveVisualRequested!==additive)f.push('ADDITIVE');
            if(r?.liveDifferential?.requested!==true)f.push('CP2');
            if(r?.resources?.counters?.shaderCompileCount!==4)f.push('SHADERS');
            if(r?.resources?.counters?.programLinkCount!==2)f.push('PROGRAMS');
            if((r?.counters?.gpuFramebufferPresentationCount??0)<1)f.push('FRAME');
            if(r?.resources?.packageUploadedOnce!==true)f.push('UPLOAD');
            if(r?.resources?.resourceIdentityStable!==true)f.push('IDENTITY');
            if(r?.resources?.noPostInitializationResourceCreation!==true)f.push('POST_RESOURCE');
            if(r?.resources?.noPostInitializationBufferUpload!==true)f.push('POST_UPLOAD');
            if(errors.length)f.push(`PAGE:${errors.join(',')}`);
            const out={label,finalUrl:s.href,selectedRendererPath:r?.selectedRendererPath,additiveVisualRequested:r?.additiveVisualRequested,cp2Requested:r?.liveDifferential?.requested,shaderCompileCount:r?.resources?.counters?.shaderCompileCount,programLinkCount:r?.resources?.counters?.programLinkCount,visibleFrames:r?.counters?.gpuFramebufferPresentationCount,packageUploadedOnce:r?.resources?.packageUploadedOnce,resourceIdentityStable:r?.resources?.resourceIdentityStable,noPostInitializationResourceCreation:r?.resources?.noPostInitializationResourceCreation,noPostInitializationBufferUpload:r?.resources?.noPostInitializationBufferUpload,failures:f};
            await c.close(); if(f.length)throw new Error(`${label}:${f.join('|')}`); return out;
          }
          (async()=>{const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--disable-dev-shm-usage']});let results;try{results=[await check(browser,'ACCEPTED_DEFAULT','',CP2,false),await check(browser,'EXPLICIT_CP2','?cp2=round1-1f520809',CP2,false),await check(browser,'V2_QUERY','?visual=terrain-relief-v2',V2,true),await check(browser,'V2_PRECEDENCE','?cp2=round1-1f520809&visual=terrain-relief-v2',V2,true)];}finally{await browser.close();}const receipt={receiptType:'H_EARTH_CURRENT_LIVE_BAND_LIMITED_TERRAIN_RELIEF_V2_EXACT_HEAD_VALIDATION_v1',result:'PASS',workflowRunId:process.env.GITHUB_RUN_ID,validationHead:process.env.GITHUB_SHA,packageSha256:'676534a0cc3f75ca518c4dcd2dcf23af96f19ab01b4a8d8881f61298d7f056cd',javascriptSyntax:'PASS',exactPhaseConstants:'PASS',querySelector:'PASS',defaultSelectionPreservation:'PASS',v2Precedence:'PASS',shaderCompile:'PASS_4_OF_4',programLink:'PASS_2_OF_2',visibleFrame:'PASS',resourceLifecycle:'PASS',outputManifest:JSON.parse(fs.readFileSync('/tmp/output-manifest.json','utf8')),results};fs.writeFileSync('/tmp/receipt.json',JSON.stringify(receipt,null,2)+'\n');console.log(JSON.stringify(receipt,null,2));})().catch(e=>{fs.writeFileSync('/tmp/receipt.json',JSON.stringify({result:'FAIL',workflowRunId:process.env.GITHUB_RUN_ID,error:e.stack||String(e)},null,2)+'\n');throw e;});
          NODE
          node .role6-v2-verify.cjs

      - name: Freeze two-path candidate and remove temporary carriers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .role6-v2-package
          git rm .github/workflows/h-earth-bandlimited-relief-v2-bootstrap.yml
          git rm .github/workflows/h-earth-v2-trigger-probe.yml
          git rm .github/workflows/h-earth-bandlimited-relief-v2-finalize.yml
          git add showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js
          git add showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js
          rm -f .role6-v2-verify.cjs
          git commit -m 'Add band-limited terrain relief v2 candidate'
          FINAL_HEAD=$(git rev-parse HEAD)
          RENDERER_BLOB=$(git hash-object showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js)
          BINDING_BLOB=$(git hash-object showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js)
          git push origin HEAD:agent/h-earth-current-live-bandlimited-terrain-relief-v2-002
          echo "FINAL_HEAD=$FINAL_HEAD" >> "$GITHUB_ENV"
          echo "RENDERER_BLOB=$RENDERER_BLOB" >> "$GITHUB_ENV"
          echo "BINDING_BLOB=$BINDING_BLOB" >> "$GITHUB_ENV"

      - name: Publish exact validation receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('/tmp/receipt.json','utf8'));
          r.exactCandidateHead=process.env.FINAL_HEAD;
          r.successorRendererGitBlob=process.env.RENDERER_BLOB;
          r.updatedBindingGitBlob=process.env.BINDING_BLOB;
          fs.writeFileSync('/tmp/receipt-final.json',JSON.stringify(r,null,2)+'\n');
          NODE
          { echo '## Band-limited terrain relief V2 exact-head validation'; echo; echo '```json'; cat /tmp/receipt-final.json; echo '```'; } >/tmp/comment.md
          gh pr comment 529 --repo smansfield635-create/smansfield635-create.github.io --body-file /tmp/comment.md

      - name: Publish failure locator
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 529 --repo smansfield635-create/smansfield635-create.github.io --body "H_EARTH_V2_FINALIZE_FAILURE:${GITHUB_RUN_ID}:${GITHUB_SHA}"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-bandlimited-terrain-relief-v2-finalize-${{ github.run_id }}
          path: |
            /tmp/receipt.json
            /tmp/receipt-final.json
            /tmp/output-manifest.json
            /tmp/transform.json
            /tmp/server.log
          if-no-files-found: warn
          retention-days: 30
