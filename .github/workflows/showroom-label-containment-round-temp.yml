name: Temporary Showroom Label Containment Round

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/showroom-label-containment-round-temp.yml

permissions:
  contents: write

jobs:
  construct-verify-and-persist:
    if: github.event.pull_request.head.ref == 'agent/showroom-compass-label-containment-002'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out bounded task branch
        uses: actions/checkout@v4
        with:
          ref: agent/showroom-compass-label-containment-002
          fetch-depth: 0

      - name: Apply inward edge-constrained label placement
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          html_path = Path('showroom/index.html')
          interactions_path = Path('showroom/index.interactions.js')

          html = html_path.read_text()
          interactions = interactions_path.read_text()

          if 'SHOWROOM_LABEL_CONTAINMENT_20260726B' not in html:
              old_contract = 'SHOWROOM_MIRRORLAND_IMMERSIVE_MISSION_CONTEXT_HTML_TNT_v17_14_CENTER_HIT_PROJECTED_LABELS'
              new_contract = 'SHOWROOM_MIRRORLAND_IMMERSIVE_MISSION_CONTEXT_HTML_TNT_v17_15_LABEL_CONTAINMENT'
              if html.count(old_contract) < 2:
                  raise SystemExit('HTML_CONTRACT_BASELINE_NOT_FOUND')
              html = html.replace(old_contract, new_contract)
              html = html.replace(
                  'data-version="SHOWROOM-MIRRORLAND-IMMERSIVE-MISSION-CONTEXT-17.11"',
                  'data-version="SHOWROOM-MIRRORLAND-IMMERSIVE-MISSION-CONTEXT-17.12"',
                  1
              )
              html = html.replace(
                  'data-showroom-projected-label-model="four-cardinal-and-four-active-room-labels"',
                  'data-showroom-projected-label-model="four-cardinal-and-four-active-room-labels-inward-edge-constrained"',
                  1
              )
              html = html.replace(
                  '/showroom/index.interactions.js?v=SHOWROOM_CENTER_HIT_PROJECTED_LABELS_20260726A',
                  '/showroom/index.interactions.js?v=SHOWROOM_LABEL_CONTAINMENT_20260726B',
                  1
              )
              html = html.replace(
                  '<!-- TARGET FILE: /showroom/index.html -->',
                  '<!-- TARGET FILE: /showroom/index.html -->\n<!-- SHOWROOM_LABEL_CONTAINMENT_20260726B -->',
                  1
              )

          if 'SHOWROOM_LABEL_CONTAINMENT_20260726B' not in interactions:
              interactions = interactions.replace(
                  '/* SHOWROOM_CENTER_HIT_PROJECTED_LABELS_20260726A */',
                  '/* SHOWROOM_CENTER_HIT_PROJECTED_LABELS_20260726A */\n/* SHOWROOM_LABEL_CONTAINMENT_20260726B */',
                  1
              )

              pattern = re.compile(
                  r'''      const x = Number\(record\.x\);\n'''
                  r'''      const y = Number\(record\.y\);\n'''
                  r'''      const radius = Math\.max\(0, Number\(record\.radiusPx\) \|\| 0\);\n'''
                  r'''      const dx = x - centerX;\n'''
                  r'''      const dy = y - centerY;\n'''
                  r'''      const magnitude = Math\.hypot\(dx, dy\) \|\| 1;\n'''
                  r'''      const offset =\n'''
                  r'''        kind === SEMANTIC_KINDS\.CARDINAL\n'''
                  r'''\? Math\.min\(62, Math\.max\(34, radius \* 0\.64 \+ 12\)\)\n'''
                  r''': Math\.min\(42, Math\.max\(23, radius \* 0\.5 \+ 9\)\);\n'''
                  r'''      const left = x \+ \(dx / magnitude\) \* offset;\n'''
                  r'''      const top = y \+ \(dy / magnitude\) \* offset;\n'''
                  r'''      const depth = normalizeLower\(record\.depthLayer\) \|\| "unknown";\n'''
                  r'''      const primary =\n'''
                  r'''        kind === SEMANTIC_KINDS\.CARDINAL\n'''
                  r'''\? identity === normalizeWing\(frame && frame\.orbitFocus\)\n'''
                  r''': identity === normalizeRoomId\(\n'''
                  r'''    frame && frame\.cluster\n'''
                  r'''      \? frame\.cluster\.primaryRoom\n'''
                  r'''      : ""\n'''
                  r'''  \);\n\n'''
                  r'''      element\.textContent = label;\n'''
                  r'''      element\.hidden = false;\n'''
                  r'''      element\.style\.left = `\$\{left\}px`;\n'''
                  r'''      element\.style\.top = `\$\{top\}px`;\n'''
                  r'''      element\.style\.zIndex = depth === "front" \? "28" : "8";\n'''
                  r'''      element\.dataset\.showroomProjectedKind = kind;\n'''
                  r'''      element\.dataset\.showroomProjectedDepth = depth;\n'''
                  r'''      element\.dataset\.showroomProjectedPrimary = primary \? "true" : "false";'''
              )

              replacement = '''      const x = Number(record.x);\n      const y = Number(record.y);\n      const radius = Math.max(0, Number(record.radiusPx) || 0);\n      const dx = x - centerX;\n      const dy = y - centerY;\n      const magnitude = Math.hypot(dx, dy) || 1;\n      const offset =\n        kind === SEMANTIC_KINDS.CARDINAL\n          ? Math.min(48, Math.max(26, radius * 0.30 + 10))\n          : Math.min(30, Math.max(17, radius * 0.24 + 8));\n      const candidateLeft = x - (dx / magnitude) * offset;\n      const candidateTop = y - (dy / magnitude) * offset;\n      const depth = normalizeLower(record.depthLayer) || "unknown";\n      const primary =\n        kind === SEMANTIC_KINDS.CARDINAL\n          ? identity === normalizeWing(frame && frame.orbitFocus)\n          : identity === normalizeRoomId(\n              frame && frame.cluster\n                ? frame.cluster.primaryRoom\n                : ""\n            );\n\n      element.textContent = label;\n      element.hidden = false;\n      element.dataset.showroomProjectedKind = kind;\n      element.dataset.showroomProjectedDepth = depth;\n      element.dataset.showroomProjectedPrimary = primary ? "true" : "false";\n      element.dataset.showroomProjectedPlacement = "inward-edge-constrained";\n      element.style.visibility = "hidden";\n      element.style.left = "0px";\n      element.style.top = "0px";\n\n      const labelRect = element.getBoundingClientRect();\n      const labelWidth = Math.max(1, labelRect.width || element.offsetWidth || 1);\n      const labelHeight = Math.max(1, labelRect.height || element.offsetHeight || 1);\n      const safeInset = kind === SEMANTIC_KINDS.CARDINAL ? 10 : 8;\n      const minLeft = safeInset + labelWidth / 2;\n      const maxLeft = Math.max(minLeft, rect.width - safeInset - labelWidth / 2);\n      const minTop = safeInset + labelHeight / 2;\n      const maxTop = Math.max(minTop, rect.height - safeInset - labelHeight / 2);\n      const left = Math.min(maxLeft, Math.max(minLeft, candidateLeft));\n      const top = Math.min(maxTop, Math.max(minTop, candidateTop));\n      const clamped =\n        Math.abs(left - candidateLeft) > 0.5 ||\n        Math.abs(top - candidateTop) > 0.5;\n\n      element.style.left = `${left}px`;\n      element.style.top = `${top}px`;\n      element.style.zIndex = depth === "front" ? "28" : "8";\n      element.style.visibility = "visible";\n      element.dataset.showroomProjectedClamped = clamped ? "true" : "false";'''

              interactions, count = pattern.subn(replacement, interactions, count=1)
              if count != 1:
                  raise SystemExit(f'LABEL_PLACEMENT_BLOCK_REPLACEMENT_COUNT={count}')

          html_path.write_text(html)
          interactions_path.write_text(interactions)
          PY

      - name: Verify bounded source identities
        run: |
          set -euo pipefail
          node --check showroom/index.interactions.js
          grep -F 'SHOWROOM_LABEL_CONTAINMENT_20260726B' showroom/index.html
          grep -F 'SHOWROOM_LABEL_CONTAINMENT_20260726B' showroom/index.interactions.js
          grep -F 'inward-edge-constrained' showroom/index.interactions.js
          grep -F 'candidateLeft = x - (dx / magnitude) * offset' showroom/index.interactions.js
          grep -F 'SHOWROOM_LABEL_CONTAINMENT_20260726B' showroom/index.html

      - name: Install Chromium runtime
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Execute multi-viewport label containment verification
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/showroom-label-containment-server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/showroom/ >/dev/null; then
              break
            fi
            sleep 1
          done

          node <<'NODE'
          const { chromium } = require('playwright');

          const expectedCardinals = [
            'E · Characters',
            'N · Story',
            'S · Wonders',
            'W · Mysteries'
          ].sort();
          const expectedNorth = [
            'Invitation',
            'Mission',
            'Timeline',
            'Welcome'
          ].sort();

          function rectWithin(inner, outer, tolerance = 1) {
            return inner.left >= outer.left - tolerance &&
              inner.top >= outer.top - tolerance &&
              inner.right <= outer.right + tolerance &&
              inner.bottom <= outer.bottom + tolerance;
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const viewports = [
              { width: 360, height: 800, name: 'mobile-360' },
              { width: 768, height: 1024, name: 'tablet-768' },
              { width: 1280, height: 900, name: 'desktop-1280' }
            ];
            const receipts = [];

            for (const viewport of viewports) {
              const page = await browser.newPage({
                viewport: { width: viewport.width, height: viewport.height },
                isMobile: viewport.width <= 768,
                hasTouch: viewport.width <= 768
              });
              const pageErrors = [];
              page.on('pageerror', error => pageErrors.push(String(error)));

              await page.goto('http://127.0.0.1:4173/showroom/', {
                waitUntil: 'domcontentloaded'
              });
              await page.waitForFunction(() => Boolean(window.SHOWROOM_INTERACTIONS), null, { timeout: 20000 });
              await page.waitForTimeout(1500);

              const constellation = await page.evaluate(() => {
                const field = document.querySelector('[data-showroom-orbit-field]');
                const fieldRect = field.getBoundingClientRect();
                const labels = Array.from(
                  document.querySelectorAll('[data-showroom-projected-label]:not([hidden])')
                ).map(node => {
                  const rect = node.getBoundingClientRect();
                  const style = getComputedStyle(node);
                  return {
                    text: node.textContent.trim(),
                    rect: {
                      left: rect.left,
                      top: rect.top,
                      right: rect.right,
                      bottom: rect.bottom,
                      width: rect.width,
                      height: rect.height
                    },
                    opacity: Number(style.opacity),
                    visibility: style.visibility,
                    display: style.display,
                    placement: node.dataset.showroomProjectedPlacement || '',
                    clamped: node.dataset.showroomProjectedClamped || ''
                  };
                });
                return {
                  fieldRect: {
                    left: fieldRect.left,
                    top: fieldRect.top,
                    right: fieldRect.right,
                    bottom: fieldRect.bottom,
                    width: fieldRect.width,
                    height: fieldRect.height
                  },
                  labels
                };
              });

              const cardinalTexts = constellation.labels.map(label => label.text).sort();
              const cardinalContainment = constellation.labels.every(label =>
                rectWithin(label.rect, constellation.fieldRect) &&
                label.rect.width > 0 &&
                label.rect.height > 0 &&
                label.opacity > 0 &&
                label.visibility === 'visible' &&
                label.display !== 'none' &&
                label.placement === 'inward-edge-constrained'
              );

              const cardinalRequest = await page.evaluate(() =>
                window.SHOWROOM_MIRRORLAND_CONSTELLATION_CONTROLLER
                  .requestCardinalSelection('north')
              );
              await page.waitForTimeout(1200);

              const cluster = await page.evaluate(() => {
                const field = document.querySelector('[data-showroom-orbit-field]');
                const fieldRect = field.getBoundingClientRect();
                const labels = Array.from(
                  document.querySelectorAll('[data-showroom-projected-label]:not([hidden])')
                ).map(node => {
                  const rect = node.getBoundingClientRect();
                  const style = getComputedStyle(node);
                  return {
                    text: node.textContent.trim(),
                    rect: {
                      left: rect.left,
                      top: rect.top,
                      right: rect.right,
                      bottom: rect.bottom,
                      width: rect.width,
                      height: rect.height
                    },
                    opacity: Number(style.opacity),
                    visibility: style.visibility,
                    display: style.display,
                    placement: node.dataset.showroomProjectedPlacement || ''
                  };
                });
                return {
                  fieldRect: {
                    left: fieldRect.left,
                    top: fieldRect.top,
                    right: fieldRect.right,
                    bottom: fieldRect.bottom,
                    width: fieldRect.width,
                    height: fieldRect.height
                  },
                  labels
                };
              });

              const clusterTexts = cluster.labels.map(label => label.text).sort();
              const clusterContainment = cluster.labels.every(label =>
                rectWithin(label.rect, cluster.fieldRect) &&
                label.rect.width > 0 &&
                label.rect.height > 0 &&
                label.opacity > 0 &&
                label.visibility === 'visible' &&
                label.display !== 'none' &&
                label.placement === 'inward-edge-constrained'
              );

              const pass =
                JSON.stringify(cardinalTexts) === JSON.stringify(expectedCardinals) &&
                cardinalContainment &&
                cardinalRequest === true &&
                JSON.stringify(clusterTexts) === JSON.stringify(expectedNorth) &&
                clusterContainment &&
                pageErrors.length === 0;

              receipts.push({
                viewport,
                pass,
                constellation,
                cardinalRequest,
                cluster,
                pageErrors
              });
              await page.close();
            }

            const pass = receipts.every(receipt => receipt.pass);
            console.log(JSON.stringify({
              schema: 'SHOWROOM_LABEL_CONTAINMENT_MULTI_VIEWPORT_VERIFICATION_v1',
              pass,
              receipts
            }, null, 2));
            await browser.close();
            if (!pass) process.exit(1);
          })().catch(error => {
            console.error(error && (error.stack || error.message || String(error)));
            process.exit(1);
          });
          NODE

      - name: Commit verified bounded production files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189828+github-actions[bot]@users.noreply.github.com'
          git add showroom/index.html showroom/index.interactions.js
          git commit -m 'Constrain Showroom labels inside the constellation field'
          git push origin HEAD:agent/showroom-compass-label-containment-002
