name: H-Earth Run 8E R2F Closure and Promotion Decision

on:
  push:
    branches:
      - agent/h-earth-run8e-r2f-closure-promotion-decision-001
  pull_request:
    branches:
      - agent/h-earth-run8e-r2e-registry-execution-custody-001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-run8e-r2f-closure-promotion-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      H_EARTH_RUN8E_R2F_OUTPUT: /tmp/h-earth-run8e-r2f
    steps:
      - name: Check out exact R2F event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact R2E base and protected identities
        run: |
          set -euo pipefail
          git fetch origin agent/h-earth-run8e-r2e-registry-execution-custody-001
          test "$(git merge-base HEAD origin/agent/h-earth-run8e-r2e-registry-execution-custody-001)" = "096bfbaf45b8987041600385ae16646b00137b9b"
          test "$(git hash-object showroom/globe/h-earth/render/live-render-package.run8e-r2.js)" = "1699654f39c9e183f4cfc6f75b20ba051641b763"
          test "$(git hash-object showroom/globe/h-earth/render/gpu-upload-views.run8e-r2d.js)" = "785856d7702a0e855c2672e6b8a7325ad5b3ba50"

      - name: Verify JavaScript and JSON syntax
        run: |
          set -euo pipefail
          node --check h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r2.immutable-live-render-package.js
          node --check h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r2f.closure-promotion-decision.js
          node --check h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.run8e-r2f-closure-promotion-scope.js
          node --check h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js
          node --check h-earth-3d/validation/h-earth.run8e-r2f.closure-promotion-decision.validation.mjs
          node -e "JSON.parse(require('fs').readFileSync('h-earth-3d/validation/run-8e-r2/h-earth.run8e-r2f.promotion-decision.json','utf8'))"
          if test -f h-earth-3d/validation/run-8e-r2/h-earth.run8e-r2f.pass-closed.receipt.json; then
            node -e "JSON.parse(require('fs').readFileSync('h-earth-3d/validation/run-8e-r2/h-earth.run8e-r2f.pass-closed.receipt.json','utf8'))"
          fi

      - name: Execute R2 closure and promotion-decision audit
        run: |
          set -euo pipefail
          mkdir -p "$H_EARTH_RUN8E_R2F_OUTPUT"
          node h-earth-3d/validation/h-earth.run8e-r2f.closure-promotion-decision.validation.mjs \
            | tee "$H_EARTH_RUN8E_R2F_OUTPUT/r2f-validation.log"

      - name: Execute automatic repository-registry preflight
        run: |
          set -euo pipefail
          git diff --name-only 096bfbaf45b8987041600385ae16646b00137b9b...HEAD \
            | grep -E '^(h-earth-3d/|showroom/globe/h-earth/)' \
            | sort -u > /tmp/h-earth-run8e-r2f-governed-paths.txt || true
          node --experimental-default-type=module \
            tools/h-earth-repository-registry-auto-preflight.mjs \
            --paths-file /tmp/h-earth-run8e-r2f-governed-paths.txt \
            --task "Run 8E R2F closure and promotion decision" \
            --mutation-intent \
            --output "$H_EARTH_RUN8E_R2F_OUTPUT/h-earth.run8e-r2f.automatic-preflight.receipt.json"
          node - <<'NODE'
          const receipt = require('/tmp/h-earth-run8e-r2f/h-earth.run8e-r2f.automatic-preflight.receipt.json');
          if (receipt.finalDisposition !== 'PASS') {
            throw new Error(`R2F_AUTOMATIC_PREFLIGHT_NOT_PASS:${receipt.finalDisposition}`);
          }
          NODE

      - name: Verify bounded scope and R3 stopping boundary
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only 096bfbaf45b8987041600385ae16646b00137b9b...HEAD | sort \
            > "$H_EARTH_RUN8E_R2F_OUTPUT/r2f-changed-paths.txt"
          node - <<'NODE'
          const fs = require('fs');
          const receipt = JSON.parse(fs.readFileSync(
            '/tmp/h-earth-run8e-r2f/h-earth.run8e-r2f.closure-audit.execution.receipt.json',
            'utf8'
          ));
          if (receipt.eligible !== true) throw new Error(receipt.issues.join(','));
          if (receipt.stoppingBoundary !== 'STOP_BEFORE_RUN_8E_R3') {
            throw new Error('R2F_STOPPING_BOUNDARY_MISMATCH');
          }
          if (receipt.promotionDecision.mainBranchPromotion !== 'NOT_EXECUTED') {
            throw new Error('R2F_MAIN_PROMOTION_EXECUTED');
          }
          NODE

      - name: Upload R2F closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-run8e-r2f-closure-promotion-decision-evidence
          path: |
            /tmp/h-earth-run8e-r2f
            /tmp/h-earth-run8e-r2f-governed-paths.txt
          if-no-files-found: warn
          retention-days: 90
