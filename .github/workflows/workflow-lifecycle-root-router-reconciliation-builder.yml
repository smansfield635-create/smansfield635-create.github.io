name: Workflow Lifecycle Root Router Reconciliation Builder

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/workflow-lifecycle-root-router-reconciliation-builder.yml'

permissions: {}

env:
  GOVERNING_BASE: 328c0f48cae7aeeacc4a8465b27fa90c253fbc74
  HELPER_PATH: .github/workflows/workflow-lifecycle-root-router-reconciliation-builder.yml

jobs:
  build-exact-two-surface-candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      candidate_head: ${{ steps.build.outputs.candidate_head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify transient builder lineage
        shell: bash
        run: |
          set -euo pipefail
          HEAD="$(git rev-parse HEAD^{commit})"
          test "$HEAD" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse "$HEAD^")" = "$GOVERNING_BASE"
          git diff --name-only "$GOVERNING_BASE" "$HEAD" | sort > "$RUNNER_TEMP/actual.txt"
          printf '%s\n' "$HELPER_PATH" > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
      - name: Materialize exact semantic reconciliation and self-remove
        id: build
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const rootPath='AI_ENTRYPOINT.json';
          const routerPath='.github/ai-router/router.v1.json';
          const root=JSON.parse(fs.readFileSync(rootPath,'utf8'));
          const router=JSON.parse(fs.readFileSync(routerPath,'utf8'));

          const retiredWorkflows=new Set([
            '.github/workflows/instrument-lifecycle-observation-v1.yml',
            '.github/workflows/integrated-development-pipeline-v1.yml',
            '.github/workflows/remote-operation-successor-v1.yml',
            '.github/workflows/differential-continuity-v1.yml',
            '.github/workflows/bounded-exact-head-execution-carrier-v1.yml'
          ]);
          const retiredRules=new Set([
            'MULTIPLE_INTERMEDIATE_HEADS_COALESCE_TO_LAST_PROVEN_HEAD_VS_LATEST_MAIN',
            'AMBIGUOUS_INCOMPLETE_DIVERGED_OR_OVERLAPPING_DIFFERENTIAL_REQUIRES_STRICT_SUCCESSOR',
            'HEAD_CHANGE_ALONE_DOES_NOT_FORCE_SUCCESSOR_WHEN_COMPLETE_DISJOINT_DIFFERENTIAL_RECEIPT_EXISTS',
            'DIFFERENTIAL_CONTINUITY_BEFORE_STRICT_SUCCESSOR_WHEN_COMPLETE_DEPENDENCY_SURFACE_AVAILABLE',
            'STALE_ACTIVE_OPERATION_USES_SUCCESSOR_GATE_NOT_MANUAL_CLOSE_AND_READMISSION',
            'SUCCESSOR_GATE_REQUIRES_FRESH_REQUEST_AND_PROCEDURE_AT_NEW_EXACT_HEAD',
            'PREDECESSOR_SUPERSEDED_AND_SUCCESSOR_ADMITTED_IN_ONE_LEDGER_COMPARE_AND_SWAP',
            'SUCCESSOR_AUTHORITY_IS_NOT_INHERITED_FROM_PREDECESSOR',
            'PREDECESSOR_EVIDENCE_DOES_NOT_BECOME_SUCCESSOR_EXACT_HEAD_EVIDENCE',
            'POST_RATIFICATION_STRICT_SUCCESSOR_PACKET_MAY_BE_COMPILED_ONLY_FROM_CANONICAL_PREDECESSOR_WITH_EXPLICIT_HEAD_REBINDS',
            'SUCCESSOR_PACKET_COMPILER_CREATES_NO_AUTHORITY_AND_EXISTING_ATOMIC_SUCCESSOR_GATE_REMAINS_MANDATORY'
          ]);

          if(root.status!=='ACTIVE_FAIL_CLOSED'||router.status!=='ACTIVE_FAIL_CLOSED')throw Error('ACTIVE_ROOT_ROUTER_STATUS_MISSING');
          if(!root.operationIntakeGate?.gateCli?.includes('repository-operation-intake-gate.v1.mjs'))throw Error('CANONICAL_INTAKE_MISSING');
          if(!root.operationIntakeGate?.lockManagerCli?.includes('repository-operation-lock-manager.v1.mjs'))throw Error('CANONICAL_LOCK_MANAGER_MISSING');
          if(root.preRegistrationIntakeBridge?.status!=='ACTIVE_PERMANENT_PRE_REGISTRATION_CAPABILITY')throw Error('PRE_REGISTRATION_BRIDGE_MISSING');
          if(!root.systemContinuityTrack||!root.mandatoryPageExcellenceGate)throw Error('REQUIRED_CONTROL_PLANE_MISSING');
          if(!Array.isArray(router.projects)||router.projects.length===0)throw Error('PROJECT_ROUTES_MISSING');

          delete root.operationIntakeGate.successorLifecycle;
          delete root.instrumentLifecycleSystem;
          delete root.integratedDevelopmentPipeline;
          delete root.differentialContinuitySystem;
          root.rules=(root.rules||[]).filter(x=>!retiredRules.has(x));
          router.routerInfrastructure.ownedExactPaths=(router.routerInfrastructure.ownedExactPaths||[]).filter(x=>!retiredWorkflows.has(x));

          const forbidden=[
            'REPOSITORY_INSTRUMENT_LIFECYCLE_ADOPTION_RETIREMENT_SIGNAL_CLASSIFICATION_v1',
            'REPOSITORY_DIFFERENTIAL_CONTINUITY_AND_PROOF_CHURN_SUPPRESSION_v1',
            'REPOSITORY_INTEGRATED_DEVELOPMENTAL_INSTRUMENTATION_STACK_v1',
            'GENERIC_STALE_HEAD_SUCCESSOR_AND_SUPERSESSION_PROTOCOL_v1',
            'BOUNDED_EXACT_HEAD_EXECUTION_CARRIER_v1',
            ...retiredWorkflows
          ];
          const combined=JSON.stringify({root,router});
          for(const token of forbidden)if(combined.includes(token))throw Error('RETIRED_BINDING_REMAINS:'+token);

          fs.writeFileSync(rootPath,JSON.stringify(root)+'\n');
          fs.writeFileSync(routerPath,JSON.stringify(router)+'\n');
          NODE
          git rm "$HELPER_PATH"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AI_ENTRYPOINT.json .github/ai-router/router.v1.json
          git commit -m 'Reconcile retired public control-plane root and router bindings'
          CANDIDATE_HEAD="$(git rev-parse HEAD^{commit})"
          git diff --name-only "$GOVERNING_BASE" "$CANDIDATE_HEAD" | sort > "$RUNNER_TEMP/final.txt"
          printf '%s\n' '.github/ai-router/router.v1.json' 'AI_ENTRYPOINT.json' | sort > "$RUNNER_TEMP/final.expected"
          diff -u "$RUNNER_TEMP/final.expected" "$RUNNER_TEMP/final.txt"
          test ! -e "$HELPER_PATH"
          git push origin "HEAD:${{ github.head_ref }}"
          echo "candidate_head=$CANDIDATE_HEAD" >> "$GITHUB_OUTPUT"

  validate-final-candidate:
    needs: build-exact-two-surface-candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-exact-two-surface-candidate.outputs.candidate_head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact final delta and transformation
        shell: bash
        env:
          CANDIDATE_HEAD: ${{ needs.build-exact-two-surface-candidate.outputs.candidate_head }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "$CANDIDATE_HEAD"
          test ! -e "$HELPER_PATH"
          git diff --name-only "$GOVERNING_BASE" "$CANDIDATE_HEAD" | sort > "$RUNNER_TEMP/actual.txt"
          printf '%s\n' '.github/ai-router/router.v1.json' 'AI_ENTRYPOINT.json' | sort > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process'),assert=require('assert');
          const base=process.env.GOVERNING_BASE;
          const show=p=>JSON.parse(cp.execFileSync('git',['show',`${base}:${p}`],{encoding:'utf8'}));
          const expectedRoot=show('AI_ENTRYPOINT.json');
          const expectedRouter=show('.github/ai-router/router.v1.json');
          const actualRoot=JSON.parse(fs.readFileSync('AI_ENTRYPOINT.json','utf8'));
          const actualRouter=JSON.parse(fs.readFileSync('.github/ai-router/router.v1.json','utf8'));
          const retiredWorkflows=new Set([
            '.github/workflows/instrument-lifecycle-observation-v1.yml',
            '.github/workflows/integrated-development-pipeline-v1.yml',
            '.github/workflows/remote-operation-successor-v1.yml',
            '.github/workflows/differential-continuity-v1.yml',
            '.github/workflows/bounded-exact-head-execution-carrier-v1.yml'
          ]);
          const retiredRules=new Set([
            'MULTIPLE_INTERMEDIATE_HEADS_COALESCE_TO_LAST_PROVEN_HEAD_VS_LATEST_MAIN',
            'AMBIGUOUS_INCOMPLETE_DIVERGED_OR_OVERLAPPING_DIFFERENTIAL_REQUIRES_STRICT_SUCCESSOR',
            'HEAD_CHANGE_ALONE_DOES_NOT_FORCE_SUCCESSOR_WHEN_COMPLETE_DISJOINT_DIFFERENTIAL_RECEIPT_EXISTS',
            'DIFFERENTIAL_CONTINUITY_BEFORE_STRICT_SUCCESSOR_WHEN_COMPLETE_DEPENDENCY_SURFACE_AVAILABLE',
            'STALE_ACTIVE_OPERATION_USES_SUCCESSOR_GATE_NOT_MANUAL_CLOSE_AND_READMISSION',
            'SUCCESSOR_GATE_REQUIRES_FRESH_REQUEST_AND_PROCEDURE_AT_NEW_EXACT_HEAD',
            'PREDECESSOR_SUPERSEDED_AND_SUCCESSOR_ADMITTED_IN_ONE_LEDGER_COMPARE_AND_SWAP',
            'SUCCESSOR_AUTHORITY_IS_NOT_INHERITED_FROM_PREDECESSOR',
            'PREDECESSOR_EVIDENCE_DOES_NOT_BECOME_SUCCESSOR_EXACT_HEAD_EVIDENCE',
            'POST_RATIFICATION_STRICT_SUCCESSOR_PACKET_MAY_BE_COMPILED_ONLY_FROM_CANONICAL_PREDECESSOR_WITH_EXPLICIT_HEAD_REBINDS',
            'SUCCESSOR_PACKET_COMPILER_CREATES_NO_AUTHORITY_AND_EXISTING_ATOMIC_SUCCESSOR_GATE_REMAINS_MANDATORY'
          ]);
          delete expectedRoot.operationIntakeGate.successorLifecycle;
          delete expectedRoot.instrumentLifecycleSystem;
          delete expectedRoot.integratedDevelopmentPipeline;
          delete expectedRoot.differentialContinuitySystem;
          expectedRoot.rules=(expectedRoot.rules||[]).filter(x=>!retiredRules.has(x));
          expectedRouter.routerInfrastructure.ownedExactPaths=(expectedRouter.routerInfrastructure.ownedExactPaths||[]).filter(x=>!retiredWorkflows.has(x));
          assert.deepStrictEqual(actualRoot,expectedRoot);
          assert.deepStrictEqual(actualRouter,expectedRouter);
          if(actualRoot.operationIntakeGate.gateCli!=='tools/operation-intake/repository-operation-intake-gate.v1.mjs')throw Error('INTAKE_GATE_CHANGED');
          if(actualRoot.operationIntakeGate.lockManagerCli!=='tools/operation-intake/repository-operation-lock-manager.v1.mjs')throw Error('LOCK_MANAGER_CHANGED');
          if(actualRoot.preRegistrationIntakeBridge.status!=='ACTIVE_PERMANENT_PRE_REGISTRATION_CAPABILITY')throw Error('PRE_REGISTRATION_CHANGED');
          if(!actualRoot.systemContinuityTrack||!actualRoot.mandatoryPageExcellenceGate)throw Error('REQUIRED_CONTROL_PLANE_CHANGED');
          assert.deepStrictEqual(actualRouter.projects,show('.github/ai-router/router.v1.json').projects);
          assert.deepStrictEqual(actualRouter.unregisteredPathPolicy,show('.github/ai-router/router.v1.json').unregisteredPathPolicy);
          assert.deepStrictEqual(actualRouter.ambiguityPolicy,show('.github/ai-router/router.v1.json').ambiguityPolicy);
          const forbidden=[
            'REPOSITORY_INSTRUMENT_LIFECYCLE_ADOPTION_RETIREMENT_SIGNAL_CLASSIFICATION_v1',
            'REPOSITORY_DIFFERENTIAL_CONTINUITY_AND_PROOF_CHURN_SUPPRESSION_v1',
            'REPOSITORY_INTEGRATED_DEVELOPMENTAL_INSTRUMENTATION_STACK_v1',
            'GENERIC_STALE_HEAD_SUCCESSOR_AND_SUPERSESSION_PROTOCOL_v1',
            'BOUNDED_EXACT_HEAD_EXECUTION_CARRIER_v1',
            ...retiredWorkflows
          ];
          const combined=JSON.stringify({actualRoot,actualRouter});
          for(const token of forbidden)if(combined.includes(token))throw Error('RETIRED_BINDING_REMAINS:'+token);
          NODE
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Emit reconciliation validation receipt
        shell: bash
        env:
          CANDIDATE_HEAD: ${{ needs.build-exact-two-surface-candidate.outputs.candidate_head }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const out={schema:'WORKFLOW_LIFECYCLE_ROOT_ROUTER_RECONCILIATION_VALIDATION_RECEIPT_v1',result:'PASS_CLOSED',governingHead:process.env.GOVERNING_BASE,candidateHead:process.env.CANDIDATE_HEAD,finalPaths:['.github/ai-router/router.v1.json','AI_ENTRYPOINT.json'],transientBuilderPresent:false,retiredBindingsAbsent:true,canonicalIntakePreserved:true,canonicalLockManagerPreserved:true,preRegistrationBridgePreserved:true,systemContinuityTrackPreserved:true,pageGatePreserved:true,projectRoutingPreserved:true,gapClosureAuthorized:false,physicalRetirementAuthorized:false,productMutationAuthorized:false,mergeAuthorized:false};
          fs.writeFileSync(process.env.RUNNER_TEMP+'/root-router-reconciliation-validation.v1.json',JSON.stringify(out,null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: workflow-lifecycle-root-router-reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/root-router-reconciliation-validation.v1.json
          if-no-files-found: error
          retention-days: 90
