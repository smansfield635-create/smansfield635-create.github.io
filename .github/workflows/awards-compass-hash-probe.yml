name: Awards Compass Hash Probe

on:
  push:
    branches:
      - agent/awards-compass-video

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print awards page SHA-256
        run: sha256sum showroom/globe/h-earth/awards/index.html
