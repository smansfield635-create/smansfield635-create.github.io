name: Compass Label Owner Audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/compass-label-owner-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Verify deployed Compass composite v2 label ownership
        run: |
          cat > audit.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:960,height:1500},deviceScaleFactor:1});
          await page.goto('https://diamondgatebridge.com/compass-composite/?audit_v2='+Date.now(),{waitUntil:'networkidle',timeout:120000});
          await page.waitForTimeout(4500);
          const inspect=()=>page.evaluate(()=>{
            const root=document.querySelector('[data-compass-root]');
            const mirror=document.querySelector('.compass-object--mirrorland');
            const wings=[...document.querySelectorAll('[data-compass-cardinal]')];
            const one=el=>{const c=getComputedStyle(el);return {id:el.dataset.cardinalId||'',readable:el.dataset.gen1596Readable||'',bg:c.backgroundColor,border:c.borderTopColor,shadow:c.boxShadow,spans:[...el.querySelectorAll('span')].map(s=>{const x=getComputedStyle(s);return {text:s.textContent.trim(),display:x.display,visibility:x.visibility,opacity:x.opacity}})}};
            const mc=getComputedStyle(mirror);
            return {
              mode:root?.dataset.compassMode,
              readable:root?.dataset.renderedForegroundCardinal||root?.dataset.readableCardinal,
              compositeBuild:root?.dataset.compassComposite||'',
              css:[...document.querySelectorAll('link[rel="stylesheet"]')].map(x=>x.href).filter(x=>x.includes('/compass-composite/')),
              js:[...document.scripts].map(x=>x.src).filter(x=>x.includes('/compass-composite/')),
              mirror:{bg:mc.backgroundColor,border:mc.borderTopColor,shadow:mc.boxShadow,opacity:mc.opacity,spans:[...mirror.querySelectorAll('span')].map(s=>{const x=getComputedStyle(s);return {text:s.textContent.trim(),display:x.display,visibility:x.visibility,opacity:x.opacity}})},
              wings:wings.map(one)
            };
          });
          const initial=await inspect();
          await page.evaluate(()=>{
            const root=document.querySelector('[data-compass-root]');
            root.dataset.renderedForegroundCardinal='east';
            root.dataset.readableCardinal='east';
          });
          await page.waitForTimeout(250);
          const east=await inspect();
          console.log('AUDIT_V2 '+JSON.stringify({initial,east}));
          const hasV2=[...initial.css,...initial.js].every(x=>x.includes('gen1596-surgical-composite-2'));
          const stateOk=s=>{
            const active=s.wings.filter(w=>w.readable==='true');
            const inactive=s.wings.filter(w=>w.readable==='false');
            const activeReadable=active.length===1&&active[0].spans.every(x=>x.display!=='none'&&x.visibility!=='hidden'&&Number(x.opacity)>0.5);
            const inactiveHidden=inactive.length===3&&inactive.every(w=>w.bg==='rgba(0, 0, 0, 0)'&&w.spans.every(x=>x.display==='none'||x.visibility==='hidden'||Number(x.opacity)===0));
            const mirrorHidden=s.mirror.spans.every(x=>x.display==='none'||x.visibility==='hidden'||Number(x.opacity)===0);
            return activeReadable&&inactiveHidden&&mirrorHidden;
          };
          if(!hasV2||initial.compositeBuild!=='gen1596-surgical-composite-2'||east.compositeBuild!=='gen1596-surgical-composite-2'||!stateOk(initial)||!stateOk(east)){
            throw new Error('COMPASS_LABEL_OWNER_V2_VERIFICATION_FAILED');
          }
          await browser.close();
          NODE
          node audit.mjs
