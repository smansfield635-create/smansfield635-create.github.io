name: H-Earth Landward Entry Camera Transport

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - ".github/workflows/h-earth-landward-entry-camera-transport.yml"
      - "showroom/globe/h-earth/capacity.js"

permissions:
  contents: write

concurrency:
  group: h-earth-landward-entry-camera-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-execute-and-close-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact camera branch
        uses: actions/checkout@v4
        with:
          ref: agent/h-earth-landward-entry-camera-001
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify base and execute fail-closed preflight
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          test "$(git merge-base HEAD origin/main)" = "626f5f0a7873187a81899a0211232e06caf905ff"
          test "$(git rev-parse HEAD:showroom/globe/h-earth/capacity.js)" = "c2ab883f3d693175c60a29ca7ffffaef93555267"
          mkdir -p artifacts/h-earth-landward-entry-camera
          node --experimental-default-type=module \
            tools/h-earth-repository-registry-auto-preflight.mjs \
            --path /showroom/globe/h-earth/capacity.js \
            --task "Renew the initial H-Earth camera composition from waterward shoreline inspection to a bounded landward estate-entry view while preserving geometry, admitted primitives, projection mathematics, capacity ceilings, DOM counts, and interaction behavior." \
            --mutation-intent \
            --output artifacts/h-earth-landward-entry-camera/preflight.receipt.json \
            > artifacts/h-earth-landward-entry-camera/preflight.stdout.json
          node <<'NODE'
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync(
            'artifacts/h-earth-landward-entry-camera/preflight.receipt.json',
            'utf8'
          ));
          const entry = r.pathClassification?.classifications?.find(
            (candidate) =>
              candidate.repositoryPath === '/showroom/globe/h-earth/capacity.js'
          );
          const failureCodes = r.validatorReceipt?.failureCodes ?? [];
          if (
            r.dependenciesVerified !== true ||
            r.finalDisposition !== 'PASS' ||
            entry?.classification !== 'REGISTERED_H_EARTH_PATH' ||
            failureCodes.length !== 0
          ) {
            throw new Error(
              `CAPACITY_PREFLIGHT_NOT_PASS:${JSON.stringify({
                dependenciesVerified: r.dependenciesVerified,
                finalDisposition: r.finalDisposition,
                entry,
                failureCodes
              })}`
            );
          }
          NODE

      - name: Apply bounded landward entry camera renewal
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'showroom/globe/h-earth/capacity.js';
          let source = fs.readFileSync(path, 'utf8');

          function replaceExact(oldText, newText, label) {
            const first = source.indexOf(oldText);
            const last = source.lastIndexOf(oldText);
            if (first < 0 || first !== last) {
              throw new Error(
                `${label}_EXPECTED_EXACTLY_ONCE:first=${first}:last=${last}`
              );
            }
            source =
              source.slice(0, first) +
              newText +
              source.slice(first + oldText.length);
          }

          replaceExact(
            'H_EARTH_3D_CAPACITY_FILE_RENEWAL_STEP_034O_3_FRAME_BASED_EXECUTION_CAPACITY_v3',
            'H_EARTH_3D_CAPACITY_FILE_RENEWAL_STEP_034O_3_FRAME_BASED_EXECUTION_CAPACITY_v4',
            'CAPACITY_CONTRACT_ID'
          );
          replaceExact(
            ' * H_EARTH_3D_CAPACITY_FILE_RENEWAL_STEP_034O_3_FRAME_BASED_EXECUTION_CAPACITY_v2',
            ' * H_EARTH_3D_CAPACITY_FILE_RENEWAL_STEP_034O_3_FRAME_BASED_EXECUTION_CAPACITY_v3',
            'CAPACITY_RENEWS_HEADER'
          );
          replaceExact(
            'export const H_EARTH_3D_CAPACITY_SCHEMA_VERSION = 3;',
            'export const H_EARTH_3D_CAPACITY_SCHEMA_VERSION = 4;',
            'CAPACITY_SCHEMA_VERSION'
          );

          replaceExact(
            [
              '    position: deepFreeze({',
              '      x: 0,',
              '      y: 14,',
              '      z: -240',
              '    }),',
              '',
              '    target: deepFreeze({',
              '      x: 0,',
              '      y: 0.6,',
              '      z: -48',
              '    }),'
            ].join('\n'),
            [
              '    position: deepFreeze({',
              '      x: 28,',
              '      y: 10.5,',
              '      z: -82',
              '    }),',
              '',
              '    target: deepFreeze({',
              '      x: -34,',
              '      y: 5.5,',
              '      z: -214',
              '    }),'
            ].join('\n'),
            'INITIAL_CAMERA_POSITION_AND_TARGET'
          );
          replaceExact(
            '    verticalFovDegrees: 60,',
            '    verticalFovDegrees: 56,',
            'INITIAL_CAMERA_FOV'
          );
          replaceExact(
            "  'H_EARTH_LANDWARD_GROUND_INSPECTION_CAMERA_ENVELOPE_v2_SINGLE_MODULE';",
            "  'H_EARTH_LANDWARD_ESTATE_ENTRY_CAMERA_ENVELOPE_v3_SINGLE_MODULE';",
            'CAMERA_ENVELOPE_ID'
          );
          replaceExact(
            [
              "  compositionRole:",
              "    'LANDWARD_GROUND_INSPECTION_LOOKING_WATERWARD',",
              "  cameraSide:",
              "    'LAND_SIDE_NEGATIVE_Z',",
              "  viewDirection:",
              "    'TOWARD_POSITIVE_Z_WATER_SIDE',",
              '  shorelineReferenceZ: -96,',
              '  wetSandForegroundRequired: true,',
              '  foamContactSeamRequired: true,',
              '  waterRecessionRequired: true,',
              '  futureContextDepthReserved: true,'
            ].join('\n'),
            [
              "  compositionRole:",
              "    'SHORELINE_ENTRY_LOOKING_LANDWARD_TOWARD_ESTATE_CONTEXT',",
              "  cameraSide:",
              "    'SHORELINE_WATERWARD_EDGE_NEAR_NEGATIVE_Z_LAND',",
              "  viewDirection:",
              "    'TOWARD_NEGATIVE_Z_LAND_MANOR_AND_OBJECT_CONTEXT',",
              '  shorelineReferenceZ: -96,',
              '  wetSandForegroundRequired: true,',
              '  foamContactSeamRequired: false,',
              '  waterRecessionRequired: false,',
              '  shorelineBehindOrPeripheralRequired: true,',
              '  manorContextForwardReserved: true,',
              '  futureContextDepthReserved: true,'
            ].join('\n'),
            'CAMERA_COMPOSITION_INTENT'
          );

          fs.writeFileSync(path, source, 'utf8');
          NODE

      - name: Validate source authority and exact environment facts
        shell: bash
        run: |
          set -euo pipefail
          node --check showroom/globe/h-earth/capacity.js
          node --experimental-default-type=module <<'NODE'
          import fs from 'node:fs';
          import * as capacity from './showroom/globe/h-earth/capacity.js';
          import * as environment from './showroom/globe/h-earth/environment.js';

          const pose = capacity.H_EARTH_3D_CAMERA_CAPACITY.initialProjectionCandidate;
          const intent = capacity.H_EARTH_3D_CAMERA_COMPOSITION_INTENT;
          const objects = Object.keys(
            environment.H_EARTH_3D_RESOLVED_ENVIRONMENT_OBJECTS
          );
          const manor =
            environment.H_EARTH_3D_RESOLVED_ENVIRONMENT_OBJECTS
              .OBJ_009_MANOR_EXTERIOR_CONTEXT;
          const forward = {
            x: pose.target.x - pose.position.x,
            y: pose.target.y - pose.position.y,
            z: pose.target.z - pose.position.z
          };

          const report = {
            result: 'PASS',
            capacityContractId:
              capacity.H_EARTH_3D_CAPACITY_CONTRACT_ID,
            capacitySchemaVersion:
              capacity.H_EARTH_3D_CAPACITY_SCHEMA_VERSION,
            pose,
            intent,
            forward,
            landwardDirectionEstablished:
              forward.z < 0,
            cameraStartsAtWaterwardShorelineEdge:
              pose.position.z > intent.shorelineReferenceZ,
            targetInsideLandBounds:
              pose.target.z < intent.shorelineReferenceZ &&
              pose.target.z >=
                capacity.H_EARTH_3D_PUBLIC_STAGE_WORLD_BOUNDS.z.minimum,
            environmentObjectDescriptorCount:
              objects.length,
            environmentObjectIds:
              objects,
            manorDescriptorPresent:
              Boolean(manor),
            manorDescriptorResolved:
              manor?.resolved === true,
            manorGeometryClaim:
              false,
            executableAdmittedPrimitiveExpectation:
              capacity.H_EARTH_3D_ADMITTED_PRIMITIVE_BUDGET
                .productionOccurrenceExpected
          };

          if (
            report.landwardDirectionEstablished !== true ||
            report.cameraStartsAtWaterwardShorelineEdge !== true ||
            report.targetInsideLandBounds !== true ||
            report.environmentObjectDescriptorCount !== 12 ||
            report.manorDescriptorPresent !== true ||
            report.manorDescriptorResolved !== true ||
            report.executableAdmittedPrimitiveExpectation !== 3
          ) {
            throw new Error(
              `LANDWARD_CAMERA_AUTHORITY_INVALID:${JSON.stringify(report)}`
            );
          }

          fs.writeFileSync(
            'artifacts/h-earth-landward-entry-camera/source-authority-report.json',
            JSON.stringify(report, null, 2) + '\n'
          );
          NODE

      - name: Stage verified renderer corridor tools outside commit scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            agent/h-earth-renderer-corridor-gate-001:refs/remotes/origin/agent/h-earth-renderer-corridor-gate-001
          git ls-tree -r --name-only \
            origin/agent/h-earth-renderer-corridor-gate-001 \
            tools \
            | grep -E '^tools/h-earth-(renderer-corridor|deployed-route)' \
            > /tmp/h-earth-renderer-tool-paths.txt
          while IFS= read -r tool_path; do
            mkdir -p "$(dirname "$tool_path")"
            git show \
              "origin/agent/h-earth-renderer-corridor-gate-001:$tool_path" \
              > "$tool_path"
          done < /tmp/h-earth-renderer-tool-paths.txt

      - name: Install pinned browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Execute renderer corridor and validate mounted result
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node tools/h-earth-renderer-corridor-integration-harness.mjs \
            | tee artifacts/h-earth-landward-entry-camera/renderer-corridor.log
          corridor_exit=${PIPESTATUS[0]}
          set -e
          echo "$corridor_exit" \
            > artifacts/h-earth-landward-entry-camera/renderer-corridor.exit-code.txt
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const directory = 'artifacts/h-earth-renderer-corridor';
          const files = fs.readdirSync(directory)
            .filter((name) =>
              name.endsWith('.receipt.json') &&
              name !== 'aggregate.receipt.json' &&
              name !== 'receipt-custody.receipt.json'
            )
            .sort();

          if (files.length !== 5) {
            throw new Error(`EXPECTED_FIVE_PROFILE_RECEIPTS:${files.length}`);
          }

          const profiles = [];
          for (const file of files) {
            const r = JSON.parse(
              fs.readFileSync(path.join(directory, file), 'utf8')
            );
            const item = {
              file,
              constructed: r.construction?.receipt?.constructed === true,
              mounted: r.mount?.receipt?.mounted === true,
              routeStatus: r.routeState?.status ?? null,
              fallbackRestored:
                r.routeState?.fallbackRestored ?? null,
              productionCapacityEligible:
                r.construction?.receipt
                  ?.nodeBudgetEvaluation
                  ?.authorityEvaluation
                  ?.eligible === true
            };
            if (
              item.constructed !== true ||
              item.mounted !== true ||
              item.routeStatus !== 'PUBLIC_STAGE_RENDERER_MOUNTED' ||
              item.fallbackRestored !== false ||
              item.productionCapacityEligible !== true
            ) {
              throw new Error(
                `LANDWARD_PROFILE_NOT_PASS:${JSON.stringify(item)}`
              );
            }
            profiles.push(item);
          }

          fs.writeFileSync(
            'artifacts/h-earth-landward-entry-camera/profile-summary.json',
            JSON.stringify({ result: 'PASS', profiles }, null, 2) + '\n'
          );
          NODE

      - name: Capture landward route evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 \
            > /tmp/h-earth-landward-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node <<'NODE'
          const fs = require('node:fs');
          const { chromium } = require('playwright');

          const profiles = [
            {
              id: 'mobile',
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 2,
              isMobile: true,
              hasTouch: true
            },
            {
              id: 'desktop',
              viewport: { width: 1440, height: 900 },
              deviceScaleFactor: 1,
              isMobile: false,
              hasTouch: false
            }
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const evidence = [];
            try {
              for (const profile of profiles) {
                const context = await browser.newContext({
                  viewport: profile.viewport,
                  deviceScaleFactor: profile.deviceScaleFactor,
                  isMobile: profile.isMobile,
                  hasTouch: profile.hasTouch
                });
                const page = await context.newPage();
                await page.goto(
                  'http://127.0.0.1:4173/showroom/globe/h-earth/',
                  { waitUntil: 'networkidle', timeout: 120000 }
                );
                await page.waitForSelector(
                  '#h-earth-3d-renderer-mount .h-earth-3d-render-stage',
                  { state: 'attached', timeout: 120000 }
                );
                await page.waitForTimeout(1200);

                const values = await page.evaluate(() => {
                  const stage = document.querySelector(
                    '#h-earth-3d-renderer-mount .h-earth-3d-render-stage'
                  );
                  const water = document.querySelectorAll(
                    '[data-material-reference="H_EARTH_MATERIAL_OPEN_WATER"], ' +
                    '[data-material-reference="H_EARTH_MATERIAL_NEARSHORE_WATER"]'
                  );
                  const wet = document.querySelectorAll(
                    '[data-material-reference="H_EARTH_MATERIAL_WET_SAND"]'
                  );
                  const foam = document.querySelectorAll(
                    '[data-material-reference="H_EARTH_MATERIAL_FOAM"]'
                  );
                  const globals = Object.keys(globalThis)
                    .filter((key) =>
                      key.includes('H_EARTH') ||
                      key.includes('HEarth')
                    )
                    .sort();
                  return {
                    routeStatus:
                      document.querySelector('#h-earth-3d-status')
                        ?.textContent?.trim() ?? null,
                    stagePresent: Boolean(stage),
                    primitiveNodeCount:
                      document.querySelectorAll(
                        '.h-earth-3d-render-primitive'
                      ).length,
                    wetSandNodeCount: wet.length,
                    waterNodeCount: water.length,
                    foamNodeCount: foam.length,
                    publishedGlobalKeys: globals
                  };
                });

                if (
                  values.stagePresent !== true ||
                  values.primitiveNodeCount <= 0 ||
                  values.wetSandNodeCount <= 0
                ) {
                  throw new Error(
                    `LANDWARD_ROUTE_EVIDENCE_FAILED:${profile.id}:${JSON.stringify(values)}`
                  );
                }

                const fullPagePath =
                  `artifacts/h-earth-landward-entry-camera/${profile.id}-full.png`;
                const stagePath =
                  `artifacts/h-earth-landward-entry-camera/${profile.id}-stage.png`;
                await page.screenshot({ path: fullPagePath, fullPage: true });
                await page.locator('#h-earth-3d-renderer-mount')
                  .screenshot({ path: stagePath });
                evidence.push({
                  profile,
                  values,
                  fullPagePath,
                  stagePath
                });
                await context.close();
              }
            } finally {
              await browser.close();
            }

            fs.writeFileSync(
              'artifacts/h-earth-landward-entry-camera/visual-evidence.json',
              JSON.stringify(
                {
                  result: 'PASS',
                  visualAcceptanceClaim: false,
                  manorGeometryClaim: false,
                  profiles: evidence
                },
                null,
                2
              ) + '\n'
            );
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Remove staged tools and commit only capacity renewal
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tool_path; do
            rm -f "$tool_path"
          done < /tmp/h-earth-renderer-tool-paths.txt
          rm -rf node_modules package.json package-lock.json
          rm -f .github/workflows/h-earth-landward-entry-camera-transport.yml
          git add showroom/globe/h-earth/capacity.js
          git add -u .github/workflows/h-earth-landward-entry-camera-transport.yml
          changed="$(git diff --cached --name-only)"
          expected=$'.github/workflows/h-earth-landward-entry-camera-transport.yml\nshowroom/globe/h-earth/capacity.js'
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Orient H-Earth entry camera landward"
          git push origin HEAD:agent/h-earth-landward-entry-camera-001

      - name: Upload execution and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-landward-entry-camera-${{ github.sha }}
          path: |
            artifacts/h-earth-landward-entry-camera/**
            artifacts/h-earth-renderer-corridor/*.json
          if-no-files-found: warn
          retention-days: 30
