name: H-Earth Public Route Registry Verification

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - ".github/workflows/h-earth-public-route-registry-verification.yml"
      - "h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.public-route-interaction-scope-reconciliation.js"
      - "h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js"
      - "tools/h-earth-post-merge-scope-disposition-audit.mjs"

permissions:
  contents: write

concurrency:
  group: h-earth-public-route-registry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-close-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact registry branch
        uses: actions/checkout@v4
        with:
          ref: agent/h-earth-public-route-registry-scope-reconciliation-001
          fetch-depth: 0

      - name: Verify source boundaries
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          test "$(git merge-base HEAD origin/main)" = "691346d3f0dbe8e16f46c705a78d26f63c733d1b"
          test "$(git rev-parse origin/main:showroom/globe/h-earth/index.js)" = "a74364ad75dca8b8fab069026d181b5e64bdd007"
          node --check h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.public-route-interaction-scope-reconciliation.js
          node --check h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js
          node --check tools/h-earth-post-merge-scope-disposition-audit.mjs

      - name: Execute exact public route preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/h-earth-public-route-registry
          node --experimental-default-type=module \
            tools/h-earth-repository-registry-auto-preflight.mjs \
            --path /showroom/globe/h-earth/index.js \
            --task "Verify exact public route interaction path registration before separately authorized touch-camera implementation." \
            --mutation-intent \
            --output artifacts/h-earth-public-route-registry/preflight.receipt.json \
            > artifacts/h-earth-public-route-registry/preflight.stdout.json
          node <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync(
            'artifacts/h-earth-public-route-registry/preflight.receipt.json',
            'utf8'
          ));
          const entry = receipt.pathClassification?.classifications?.find(
            (candidate) => candidate.repositoryPath === '/showroom/globe/h-earth/index.js'
          );
          if (
            receipt.dependenciesVerified !== true ||
            receipt.finalDisposition !== 'PASS' ||
            entry?.classification !== 'REGISTERED_H_EARTH_PATH' ||
            entry?.resolvedNodeIds?.includes('H_EARTH_PUBLIC_ROUTE_INTERACTION_SCOPE_PACKAGE') !== true ||
            (receipt.validatorReceipt?.failureCodes ?? []).length !== 0
          ) {
            throw new Error(`PUBLIC_ROUTE_REGISTRY_PREFLIGHT_FAILED:${JSON.stringify({
              dependenciesVerified: receipt.dependenciesVerified,
              finalDisposition: receipt.finalDisposition,
              entry,
              failureCodes: receipt.validatorReceipt?.failureCodes ?? []
            })}`);
          }
          NODE

      - name: Execute retained-state continuity audit
        shell: bash
        run: |
          set -euo pipefail
          node tools/h-earth-post-merge-scope-disposition-audit.mjs \
            > artifacts/h-earth-public-route-registry/retained-state-audit.stdout.json
          cp artifacts/h-earth-post-merge-scope-disposition-audit-receipt.json \
            artifacts/h-earth-public-route-registry/retained-state-audit.receipt.json
          node <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync(
            'artifacts/h-earth-public-route-registry/retained-state-audit.receipt.json',
            'utf8'
          ));
          if (
            receipt.result !== 'PASS' ||
            (receipt.failedChecks ?? []).length !== 0 ||
            receipt.exitState?.retainedStateContinuityEstablished !== true
          ) {
            throw new Error(`RETAINED_STATE_AUDIT_FAILED:${JSON.stringify({
              result: receipt.result,
              failedChecks: receipt.failedChecks,
              exitState: receipt.exitState
            })}`);
          }
          NODE

      - name: Remove verification workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/h-earth-public-route-registry-verification.yml
          git add -u .github/workflows/h-earth-public-route-registry-verification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove public route registry verification transport"
          git push origin HEAD:agent/h-earth-public-route-registry-scope-reconciliation-001

      - name: Upload registry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-public-route-registry-${{ github.sha }}
          path: artifacts/h-earth-public-route-registry/**
          if-no-files-found: warn
          retention-days: 30
