name: H-Earth Gate B Browser Renderer Audit

on:
  pull_request:
    branches:
      - agent/h-earth-gate-b-seven-file-verification-001
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  browser-audit:
    if: github.head_ref == 'agent/h-earth-gate-b-seven-file-trigger-001'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/h-earth-gate-b-seven-file-verification-001
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve isolated branch
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/h-earth-server.log 2>&1 &
          echo $! > /tmp/h-earth-server.pid
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/showroom/globe/h-earth/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/h-earth-server.log
          exit 1
      - name: Execute browser-visible Gate B route audit
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
          const consoleMessages = [];
          const pageErrors = [];
          const failedRequests = [];

          page.on('console', message => consoleMessages.push({ type: message.type(), text: message.text() }));
          page.on('pageerror', error => pageErrors.push({ name: error.name, message: error.message, stack: error.stack ?? null }));
          page.on('requestfailed', request => failedRequests.push({ url: request.url(), failure: request.failure()?.errorText ?? null }));

          const response = await page.goto(
            'http://127.0.0.1:4173/showroom/globe/h-earth/',
            { waitUntil: 'networkidle', timeout: 60000 }
          );

          await page.waitForFunction(() => {
            const root = document.getElementById('h-earth-3d-route-root');
            return root?.dataset?.hEarthHtmlEntryTaskComplete === 'true';
          }, null, { timeout: 60000 });

          await page.screenshot({ path: 'H_EARTH_GATE_B_BROWSER_RENDERER_AUDIT_v1.png', fullPage: true });

          const evidence = await page.evaluate(() => {
            const root = document.getElementById('h-earth-3d-route-root');
            const mount = document.getElementById('h-earth-3d-renderer-mount');
            const entryReceipt = globalThis.H_EARTH_3D_PUBLIC_ROUTE_HTML_ENTRY_RECEIPT ?? null;
            const failureReceipt = globalThis.H_EARTH_3D_PUBLIC_ROUTE_HTML_ENTRY_FAILURE ?? null;
            const rendererReceipt = globalThis.H_EARTH_3D_PUBLIC_RENDERER_BOOTSTRAP_RECEIPT ?? null;
            const routeReceipt = globalThis.H_EARTH_3D_PUBLIC_ROUTE_BOOTSTRAP_RECEIPT ?? null;
            const mountRect = mount?.getBoundingClientRect?.() ?? null;
            const visibleDescendants = mount
              ? [...mount.querySelectorAll('*')].filter(node => {
                  const rect = node.getBoundingClientRect();
                  const style = getComputedStyle(node);
                  return rect.width > 0 && rect.height > 0 && style.display !== 'none' && style.visibility !== 'hidden' && Number(style.opacity || 1) > 0;
                }).length
              : 0;

            return {
              title: document.title,
              rootDataset: root ? { ...root.dataset } : null,
              rootClasses: root ? [...root.classList] : [],
              statusText: document.getElementById('h-earth-3d-status')?.textContent?.trim() ?? null,
              fallbackText: document.getElementById('h-earth-3d-fallback')?.textContent?.trim() ?? null,
              mountObserved: Boolean(mount),
              mountChildCount: mount?.childElementCount ?? 0,
              mountRect: mountRect ? { width: mountRect.width, height: mountRect.height } : null,
              visibleDescendantCount: visibleDescendants,
              canvasCount: mount?.querySelectorAll('canvas').length ?? 0,
              svgCount: mount?.querySelectorAll('svg').length ?? 0,
              entryReceipt,
              failureReceipt,
              rendererReceipt,
              routeReceipt
            };
          });

          const checks = {
            httpOk: response?.ok() === true,
            htmlEntryComplete: evidence.rootDataset?.hEarthHtmlEntryTaskComplete === 'true',
            noHtmlEntryFailure: evidence.failureReceipt === null,
            entryReceiptObserved: evidence.entryReceipt !== null,
            gateBPresentationMode: evidence.entryReceipt?.presentationMode === 'GROUND_VIEW_GATE_B_PROOF',
            rendererBootstrapRequested: evidence.rootDataset?.hEarthRendererBootstrapRequested === 'true',
            rendererMountObserved: evidence.mountObserved === true,
            rendererMountHasArea: (evidence.mountRect?.width ?? 0) > 0 && (evidence.mountRect?.height ?? 0) > 0,
            rendererMaterializedChildren: evidence.mountChildCount > 0,
            browserVisibleOutput: evidence.visibleDescendantCount > 0,
            noPageErrors: pageErrors.length === 0,
            noFailedModuleRequests: failedRequests.filter(item => /\.(?:js|css)(?:\?|$)/.test(item.url)).length === 0
          };

          const receipt = {
            receiptId: 'H_EARTH_GATE_B_BROWSER_RENDERER_AUDIT_RECEIPT_v1',
            auditedUrl: page.url(),
            checks,
            passed: Object.values(checks).every(Boolean),
            evidence,
            consoleMessages,
            pageErrors,
            failedRequests,
            screenshot: 'H_EARTH_GATE_B_BROWSER_RENDERER_AUDIT_v1.png',
            mainChanged: false,
            finalAcceptance: 'NOT_CONFERRED_BY_THIS_AUDIT'
          };

          fs.writeFileSync(
            'H_EARTH_GATE_B_BROWSER_RENDERER_AUDIT_RECEIPT_v1.json',
            JSON.stringify(receipt, null, 2)
          );
          console.log(JSON.stringify(receipt, null, 2));
          await browser.close();
          if (!receipt.passed) process.exit(1);
          EOF
      - name: Upload browser audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-gate-b-browser-renderer-audit-v1
          path: |
            H_EARTH_GATE_B_BROWSER_RENDERER_AUDIT_RECEIPT_v1.json
            H_EARTH_GATE_B_BROWSER_RENDERER_AUDIT_v1.png
          if-no-files-found: error
