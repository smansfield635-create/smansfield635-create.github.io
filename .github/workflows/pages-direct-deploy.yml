name: Direct GitHub Pages Deploy — Manual Diagnostic Only

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read authoritative GitHub Pages state without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          payload="$(curl --fail-with-body --silent --show-error -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")"
          echo "$payload" | jq '{build_type,source,status,html_url,cname}'
          echo "Diagnostic only: this workflow no longer requests, retries, or dispatches Pages builds."
