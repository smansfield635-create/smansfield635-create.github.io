name: Characters Vegetation V6 Live Material Recovery v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'characters/app.mjs'
      - 'characters/vegetation-representation.mjs'
      - 'characters/vegetation-understory.mjs'
      - 'control-plane/whole-estate/characters-reconstruction-v1/vegetation-v6-live-material-recovery-contract.v1.json'
      - 'control-plane/whole-estate/characters-reconstruction-v1/verify-vegetation-v6-live-material-recovery.v1.mjs'
      - '.github/workflows/characters-vegetation-v6-live-material-recovery-v1.yml'

permissions:
  contents: read

env:
  OPERATION_ID: MIRRORLAND_V6_LIVE_VEGETATION_MATERIAL_RECOVERY_20260908_001
  LOCK_GENERATION: '2018'
  GOVERNING_MAIN: 423af93560625eac974fea037cbbf14e56baeebb

jobs:
  exact-head-mechanical-and-material-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact V6 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate lineage and path scope
        shell: bash
        run: |
          set -euo pipefail
          EXACT_HEAD="$(git rev-parse HEAD^{commit})"
          test "$EXACT_HEAD" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor "$GOVERNING_MAIN" "$EXACT_HEAD"
          git diff --name-only "$GOVERNING_MAIN...$EXACT_HEAD" > "$RUNNER_TEMP/v6-changed.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const allowed=new Set([
            'characters/app.mjs',
            'characters/vegetation-representation.mjs',
            'characters/vegetation-understory.mjs',
            'control-plane/whole-estate/characters-reconstruction-v1/vegetation-v6-live-material-recovery-contract.v1.json',
            'control-plane/whole-estate/characters-reconstruction-v1/verify-vegetation-v6-live-material-recovery.v1.mjs',
            '.github/workflows/characters-vegetation-v6-live-material-recovery-v1.yml'
          ]);
          const changed=fs.readFileSync(process.env.RUNNER_TEMP+'/v6-changed.txt','utf8').trim().split('\n').filter(Boolean);
          const outside=changed.filter(file=>!allowed.has(file));
          if(outside.length)throw new Error('PATH_SCOPE_VIOLATION:'+outside.join(','));
          NODE
          test -z "$(git status --porcelain)"
          echo "EXACT_HEAD=$EXACT_HEAD" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run exact-head V6 independent verifier
        shell: bash
        run: |
          set -euo pipefail
          node control-plane/whole-estate/characters-reconstruction-v1/verify-vegetation-v6-live-material-recovery.v1.mjs --output vegetation-v6-live-material-recovery-receipt.json
          mkdir -p "$RUNNER_TEMP/v6-evidence"
          cp vegetation-v6-live-material-recovery-receipt.json "$RUNNER_TEMP/v6-evidence/vegetation-v6-live-material-recovery-receipt.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipt=JSON.parse(fs.readFileSync('vegetation-v6-live-material-recovery-receipt.json','utf8'));
          if(receipt.schema!=='MIRRORLAND_V6_LIVE_VEGETATION_MATERIAL_RECOVERY_RECEIPT_v1')throw new Error('V6_RECEIPT_SCHEMA_INVALID');
          if(receipt.result!=='MECHANICAL_PASS')throw new Error('V6_MECHANICAL_NOT_PASS');
          if(receipt.exactHead!==process.env.EXACT_HEAD)throw new Error('V6_RECEIPT_HEAD_MISMATCH');
          if(receipt.canonicalPopulationCount!==818)throw new Error('V6_POPULATION_NOT_818');
          NODE
          rm vegetation-v6-live-material-recovery-receipt.json
          test -z "$(git status --porcelain)"

      - name: Install passive browser evidence tooling outside repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v6-pw"
          cd "$RUNNER_TEMP/v6-pw"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 pngjs@7.0.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Start exact candidate server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >"$RUNNER_TEMP/v6-http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/v6-http.pid"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/characters/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/v6-http.log"
          exit 1

      - name: Capture bounded exact-head V6 material evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/v6-capture.cjs" <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const crypto=require('crypto');
          const {chromium}=require(path.join(process.env.RUNNER_TEMP,'v6-pw','node_modules','playwright'));
          const {PNG}=require(path.join(process.env.RUNNER_TEMP,'v6-pw','node_modules','pngjs'));
          const OUT=path.join(process.env.RUNNER_TEMP,'v6-evidence');
          const URL='http://127.0.0.1:4173/characters/';
          const CANDIDATE=process.env.EXACT_HEAD;
          fs.mkdirSync(OUT,{recursive:true});
          const errors=[];
          const captures=[];
          const sha256=file=>crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));

          async function dismissPrimer(page){
            const skip=page.locator('#intro-skip');
            if(await skip.count()&&await skip.isVisible())await skip.click();
            const primer=page.locator('#step9-primer');
            if(await primer.count())await primer.waitFor({state:'hidden',timeout:10000});
          }

          async function health(page,response,label){
            if(!response||response.status()!==200)throw new Error(label+':HTTP_'+(response?response.status():'NO_RESPONSE'));
            await page.locator('.signal-layer .signal').first().waitFor({state:'attached',timeout:15000});
            await wait(1000);
            const state=await page.evaluate(()=>{
              const canvas=document.querySelector('#scene');
              const gl=canvas&&canvas.getContext('webgl2');
              return {
                webgl2:!!gl,
                signalCount:document.querySelectorAll('.signal-layer .signal').length,
                fatal:document.querySelector('#fatal')?.classList.contains('show')||false,
                width:canvas?.width||0,
                height:canvas?.height||0
              };
            });
            if(!state.webgl2||state.fatal||state.signalCount<1||state.width<1||state.height<1)throw new Error(label+':RUNTIME_HEALTH_INVALID:'+JSON.stringify(state));
            return state;
          }

          async function probe(page,compact,state){
            return page.evaluate(async ({compact,state})=>{
              const rep=await import('./vegetation-representation.mjs');
              const under=await import('./vegetation-understory.mjs');
              const geo=await import('./step9-regional-geography.mjs');
              let camera={eye:{x:0,y:365,z:590},look:{x:70,y:24,z:-660}};
              if(state==='MANOR'){
                const resolved=geo.resolveStep9Camera(geo.STEP9_DESTINATION_BINDINGS.manor.siteId);
                camera={eye:{x:resolved.eye.x,y:resolved.eye.y,z:resolved.eye.z},look:{x:resolved.look.x,y:resolved.look.y,z:resolved.look.z}};
              }
              const frame=rep.buildVegetationRepresentationFrame({camera});
              const counts={NEAR_FIELD:0,MID_FIELD:0,FAR_FIELD:0};
              for(const item of frame.representations)counts[item.lod]++;
              return {
                population:frame.canonicalPopulationCount,
                representation:frame.representationCount,
                lodCounts:counts,
                compact,
                nearBudget:rep.resolveNearLeafBudget(1,compact),
                midBudget:rep.resolveMidClusterBudget(1,compact),
                foliageNightLighting:rep.LIVE_MATERIAL_V6_REPRESENTATION_CONTRACT.foliageNightLighting,
                farCanopyLayerCount:rep.LIVE_MATERIAL_V6_REPRESENTATION_CONTRACT.farCanopyLayerCount,
                understoryPopulation:under.getCanonicalUnderstoryPopulation().instanceCount,
                understoryCompactRatio:under.V6_UNDERSTORY_PRESENTATION_CONTRACT.compactPresentationSampling,
                understoryNightLighting:under.V6_UNDERSTORY_PRESENTATION_CONTRACT.nightLighting
              };
            },{compact,state});
          }

          function pixels(file){
            const png=PNG.sync.read(fs.readFileSync(file));
            let lit=0,green=0,luminance=0;
            const total=png.width*png.height;
            for(let i=0;i<png.data.length;i+=4){
              const r=png.data[i],g=png.data[i+1],b=png.data[i+2];
              const y=.2126*r+.7152*g+.0722*b;
              luminance+=y;
              if(y>24)lit++;
              if(g>r*1.08&&g>b*.82&&g>20)green++;
            }
            return {width:png.width,height:png.height,meanLuminance:luminance/total,litRatio:lit/total,greenRatio:green/total};
          }

          async function gotoManor(page){
            await page.locator('#map-toggle').click();
            await page.locator('#coast-map').waitFor({state:'visible',timeout:10000});
            const node=page.locator('.map-node[data-id="manor"]');
            await node.click();
            await page.locator('#return').waitFor({state:'visible',timeout:12000});
            await wait(1100);
          }

          async function shot(page,filename,profile,state,compact){
            const file=path.join(OUT,filename);
            const forest=await probe(page,compact,state);
            if(forest.population!==818||forest.representation!==818)throw new Error(filename+':POPULATION_NOT_818:'+JSON.stringify(forest));
            if(!forest.foliageNightLighting||forest.farCanopyLayerCount!==2||!forest.understoryNightLighting)throw new Error(filename+':V6_CONTRACT_NOT_ACTIVE:'+JSON.stringify(forest));
            if(compact&&forest.understoryCompactRatio<.9)throw new Error(filename+':COMPACT_UNDERSTORY_RATIO_LOW:'+JSON.stringify(forest));
            await page.screenshot({path:file,fullPage:false});
            const stat=fs.statSync(file);
            const pixel=pixels(file);
            if(stat.size<18000||pixel.meanLuminance<6||pixel.litRatio<.01||pixel.greenRatio<.002)throw new Error(filename+':MATERIAL_CAPTURE_HEALTH_INVALID:'+JSON.stringify({bytes:stat.size,pixel}));
            captures.push({filename,profile,state,forest,bytes:stat.size,sha256:sha256(file),pixel});
          }

          async function openProfile(browser,profile,viewport,compact){
            const context=await browser.newContext({viewport,deviceScaleFactor:1});
            const page=await context.newPage();
            page.on('pageerror',error=>errors.push({profile,type:'pageerror',message:String(error&&error.message||error)}));
            page.on('console',message=>{if(message.type()==='error')errors.push({profile,type:'console',message:message.text()});});
            const response=await page.goto(URL,{waitUntil:'networkidle',timeout:30000});
            const runtime=await health(page,response,profile);
            await dismissPrimer(page);
            await wait(500);
            return {context,page,runtime,httpStatus:response.status(),compact};
          }

          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            try{
              const runtime=[];
              const desktop=await openProfile(browser,'DESKTOP',{width:1440,height:900},false);
              runtime.push({profile:'DESKTOP',httpStatus:desktop.httpStatus,...desktop.runtime});
              await shot(desktop.page,'v6-desktop-orbit.png','DESKTOP','ORBIT',false);
              await gotoManor(desktop.page);
              await shot(desktop.page,'v6-desktop-near.png','DESKTOP','MANOR',false);
              await desktop.context.close();

              const tablet=await openProfile(browser,'TABLET',{width:1024,height:1366},false);
              runtime.push({profile:'TABLET',httpStatus:tablet.httpStatus,...tablet.runtime});
              await gotoManor(tablet.page);
              await shot(tablet.page,'v6-tablet-near.png','TABLET','MANOR',false);
              await tablet.context.close();

              const mobile=await openProfile(browser,'MOBILE',{width:390,height:844},true);
              runtime.push({profile:'MOBILE',httpStatus:mobile.httpStatus,...mobile.runtime});
              await gotoManor(mobile.page);
              await shot(mobile.page,'v6-mobile-near.png','MOBILE','MANOR',true);
              await mobile.context.close();

              if(errors.length)throw new Error('BROWSER_ERRORS:'+JSON.stringify(errors));
              const manifest={
                schema:'MIRRORLAND_V6_MATERIAL_EVIDENCE_RECEIPT_v1',
                result:'EVIDENCE_CAPTURE_PASS_VISUAL_DISPOSITION_REQUIRED',
                operationId:process.env.OPERATION_ID,
                lockGeneration:Number(process.env.LOCK_GENERATION),
                candidateSha:CANDIDATE,
                governingMain:process.env.GOVERNING_MAIN,
                route:'/characters/',
                captureSemantics:'PASSIVE_EXACT_HEAD_BROWSER_EVIDENCE_NO_PRODUCT_MUTATION',
                visualDispositionAuthority:'OWNER_REVIEW_REQUIRED',
                runtime,
                errors,
                captures
              };
              fs.writeFileSync(path.join(OUT,'v6-material-evidence.json'),JSON.stringify(manifest,null,2)+'\n');
            }finally{
              await browser.close();
            }
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
          node "$RUNNER_TEMP/v6-capture.cjs"

      - name: Verify evidence manifest and clean tree
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const dir=path.join(process.env.RUNNER_TEMP,'v6-evidence');
          const manifest=JSON.parse(fs.readFileSync(path.join(dir,'v6-material-evidence.json'),'utf8'));
          if(manifest.schema!=='MIRRORLAND_V6_MATERIAL_EVIDENCE_RECEIPT_v1')throw new Error('V6_MANIFEST_SCHEMA_INVALID');
          if(manifest.result!=='EVIDENCE_CAPTURE_PASS_VISUAL_DISPOSITION_REQUIRED')throw new Error('V6_MANIFEST_RESULT_INVALID');
          if(manifest.candidateSha!==process.env.EXACT_HEAD)throw new Error('V6_MANIFEST_HEAD_MISMATCH');
          if(manifest.operationId!==process.env.OPERATION_ID||manifest.lockGeneration!==Number(process.env.LOCK_GENERATION))throw new Error('V6_MANIFEST_OPERATION_MISMATCH');
          if(manifest.errors.length!==0||manifest.captures.length!==4)throw new Error('V6_MANIFEST_CAPTURE_OR_ERROR_COUNT_INVALID');
          for(const capture of manifest.captures){
            const file=path.join(dir,capture.filename);
            const observed=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            if(observed!==capture.sha256)throw new Error('V6_PNG_DIGEST_MISMATCH:'+capture.filename);
          }
          NODE
          test -z "$(git status --porcelain)"

      - name: Upload bounded V6 evidence
        uses: actions/upload-artifact@v4
        with:
          name: characters-v6-live-material-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/v6-evidence/vegetation-v6-live-material-recovery-receipt.json
            ${{ runner.temp }}/v6-evidence/v6-material-evidence.json
            ${{ runner.temp }}/v6-evidence/v6-desktop-orbit.png
            ${{ runner.temp }}/v6-evidence/v6-desktop-near.png
            ${{ runner.temp }}/v6-evidence/v6-tablet-near.png
            ${{ runner.temp }}/v6-evidence/v6-mobile-near.png
          if-no-files-found: error
          retention-days: 90
