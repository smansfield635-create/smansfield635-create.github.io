name: Laws Carousel Methods Behavioral Equivalence Proof

on:
  pull_request:
    paths:
      - 'laws/index.destination-carousel.js'
      - 'laws/index.destination-carousel.css'
      - 'laws/index.mobile-background-tabs.js'
      - 'laws/index.html'
      - '.github/workflows/laws-carousel-discrete-swipe-proof.yml'
permissions: { contents: read }

jobs:
  methods-behavior-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 1 }
      - name: Syntax and canonical behavior contract
        run: |
          node --check laws/index.destination-carousel.js
          python3 - <<'PY'
          from pathlib import Path
          js=Path('laws/index.destination-carousel.js').read_text()
          methods=Path('laws/research/methods-and-models/carousel.js').read_text()
          loader=Path('laws/index.mobile-background-tabs.js').read_text()
          required=['LAWS_DESTINATION_CAROUSEL_RUNTIME_v10_METHODS_BEHAVIORAL_STANDARD','METHODS_MODELS_SINGLE_AXIS_EUCLIDEAN_CAROUSEL_v1','pointerStartAngle','state.angle','state.velocity','snapFromDrag','const projected=state.angle+Math.max(-26,Math.min(26,state.velocity*90))','Math.round(-projected/step)','methodsReleaseProjection:true','momentumTraversal:true']
          for token in required: assert token in js, f'missing canonical Methods behavior: {token}'
          for token in ['pointerStartAngle','state.angle','state.velocity','snapFromDrag','Math.max(-26, Math.min(26, state.velocity * 90))','Math.round(-projected / step)']: assert token in methods, f'Methods oracle missing token: {token}'
          for token in ['oneSwipeOneStep','SWIPE_STEP_THRESHOLD_PX','drag-single-step']: assert token not in js, f'superseded one-step authority remains: {token}'
          assert 'LAWS_DESTINATION_CAROUSEL_RUNTIME_V10_METHODS_BEHAVIORAL_STANDARD_20260816D' in loader
          print('LAWS_METHODS_BEHAVIORAL_STANDARD_STATIC_PASS')
          PY
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve exact candidate
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/laws-methods-behavior.log 2>&1 &
      - name: Prove direct manipulation, momentum, seam, and settlement
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const A=(x,m)=>{if(!x)throw Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:960,height:1536},hasTouch:true,isMobile:true,deviceScaleFactor:1});
            const page=await context.newPage();
            await page.goto('http://127.0.0.1:4173/laws/',{waitUntil:'networkidle'});
            await page.waitForSelector('html[data-laws-destination-carousel-runtime="active"]',{timeout:15000});
            const runtime=await page.evaluate(()=>globalThis.DGB_LAWS_DESTINATION_CAROUSEL);
            A(runtime?.contract==='LAWS_DESTINATION_CAROUSEL_RUNTIME_v10_METHODS_BEHAVIORAL_STANDARD','wrong runtime');
            A(runtime.referenceContract==='METHODS_MODELS_SINGLE_AXIS_EUCLIDEAN_CAROUSEL_v1','wrong reference');
            A(runtime.buildId==='20260816D_METHODS_BEHAVIORAL_EQUIVALENCE','wrong build');
            A(runtime.methodsReleaseProjection===true&&runtime.momentumTraversal===true,'Methods behavior authority absent');
            const field=page.locator('[data-laws-root-rolodex-section] .laws-rolodex-field[data-destination-stage-state="active"]').first();
            const viewport=field.locator('.laws-rolodex-viewport'); await viewport.scrollIntoViewIfNeeded(); const box=await viewport.boundingBox(); A(box,'no viewport');
            const id=await field.getAttribute('data-rolodex-id'); const count=await field.locator('.laws-rolodex-card').count();
            const get=()=>field.evaluate(el=>({index:+el.dataset.carouselIndex,angle:+el.dataset.carouselOrbitAngle,canonical:el.dataset.carouselCanonicalLanding,ring:getComputedStyle(el.querySelector('.laws-rolodex-track')).transform}));
            const restore=async index=>{A(await page.evaluate(({id,index})=>globalThis.DGB_LAWS_DESTINATION_CAROUSEL.restoreOrbitState({rolodexId:id,index}),{id,index}),'restore failed');await page.waitForTimeout(60)};
            const cdp=await context.newCDPSession(page);let tid=200;const sx=box.x+box.width*.78,sy=box.y+box.height*.52;
            const touch=(type,x,y)=>cdp.send('Input.dispatchTouchEvent',{type,touchPoints:/End|Cancel/.test(type)?[]:[{x,y,id:tid,radiusX:2,radiusY:2,force:1}],modifiers:0});
            async function gesture(points,delay){tid++;await touch('touchStart',sx,sy);await page.waitForTimeout(25);for(const dx of points){await touch('touchMove',sx+dx,sy);await page.waitForTimeout(delay);}await touch('touchEnd',sx,sy);await page.waitForTimeout(760);return get();}
            await restore(0);const start=await get();tid++;await touch('touchStart',sx,sy);await page.waitForTimeout(25);await touch('touchMove',sx-box.width*.25,sy);await page.waitForTimeout(80);const during=await get();await touch('touchEnd',sx,sy);await page.waitForTimeout(760);const controlled=await get();
            A(during.index===0&&during.ring!==start.ring,'direct shared-ring manipulation absent');
            A(controlled.canonical==='true'&&controlled.index!==0,'controlled swipe failed canonical traversal');
            await restore(0);const energetic=await gesture([-box.width*.18,-box.width*.62],8);A(energetic.canonical==='true','energetic gesture did not settle canonically');A(energetic.index!==0,'energetic gesture produced no traversal');
            await restore(count-1);const seam=await gesture([-box.width*.5],35);A(seam.canonical==='true','seam failed canonical settlement');
            console.log(JSON.stringify({start,during,controlled,energetic,seam,count},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
