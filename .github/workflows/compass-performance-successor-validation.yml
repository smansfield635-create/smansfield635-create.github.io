name: Compass Gen1525 Performance Successor Validation

on:
  pull_request:
    paths:
      - 'assets/compass/compass.crystals.js'
      - '.github/ai-router/projects/compass/verify-performance-successor.mjs'
      - '.github/ai-router/projects/compass/verify-display-continuity.v1.mjs'
      - '.github/workflows/compass-performance-successor-validation.yml'
      - '.github/workflows/compass-carousel-successor-live-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GEN1525_GOVERNING_HEAD: d53b9c627c6b9be3222044b5ca879c080a7165f1

jobs:
  qualify-gen1525-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact candidate and bounded lineage
        run: |
          CANDIDATE="$(git rev-parse HEAD^{commit})"
          test "$CANDIDATE" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$GEN1525_GOVERNING_HEAD" "$CANDIDATE"
          unexpected="$(git diff --name-only "$GEN1525_GOVERNING_HEAD"..."$CANDIDATE" | grep -Ev '^(assets/compass/compass\.crystals\.js|\.github/ai-router/projects/compass/verify-performance-successor\.mjs|\.github/ai-router/projects/compass/verify-display-continuity\.v1\.mjs|\.github/workflows/compass-performance-successor-validation\.yml|\.github/workflows/compass-carousel-successor-live-qualification\.yml)$' || true)"
          test -z "$unexpected"
      - name: Run Gen1525 static qualification
        run: |
          export COMPASS_CANDIDATE_HEAD="$(git rev-parse HEAD^{commit})"
          export COMPASS_PERFORMANCE_OUTPUT=/tmp/compass-gen1525-performance.json
          export COMPASS_VERIFICATION_OUTPUT=/tmp/compass-gen1525-display.json
          node .github/ai-router/projects/compass/verify-performance-successor.mjs
          node .github/ai-router/projects/compass/verify-display-continuity.v1.mjs
          jq -e '.result == "PASS_CLOSED" and .lockGeneration == 1525' /tmp/compass-gen1525-performance.json >/dev/null
          jq -e '.result == "PASS_CLOSED" and .lockGeneration == 1525' /tmp/compass-gen1525-display.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: compass-gen1525-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/compass-gen1525-performance.json
            /tmp/compass-gen1525-display.json
