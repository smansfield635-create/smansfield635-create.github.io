name: H-Earth Gate B Extract Unit 41

on:
  push:
    branches:
      - agent/h-earth-gate-b-transfer-staging-001
    paths:
      - .gate-b-transfer/source/compositor-c56854c.js
      - .gate-b-transfer/extract-unit-41.request

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact unit 41
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          source = pathlib.Path('.gate-b-transfer/source/compositor-c56854c.js').read_bytes()
          expected_sha256 = '5b9932a5f88e9087183a10de29f7e6c173f6e8c5b666c5a668114398e2e8b972'
          expected_git_blob = 'cc76ecee40428c8a256be0e637f56448c73f9ab7'
          expected_length = 4500
          matches = []
          for offset in range(len(source) - expected_length + 1):
              candidate = source[offset:offset + expected_length]
              if hashlib.sha256(candidate).hexdigest() == expected_sha256:
                  matches.append((offset, candidate))
          assert len(matches) == 1, f'expected one match, found {len(matches)}'
          offset, candidate = matches[0]
          out = pathlib.Path('.gate-b-transfer/files/compositor/part-0041.repository-extracted.raw')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(candidate)
          git_blob = subprocess.check_output(['git','hash-object',str(out)], text=True).strip()
          assert git_blob == expected_git_blob
          receipt = pathlib.Path('.gate-b-transfer/unit-41.repository-extraction.receipt')
          receipt.write_text('\n'.join([
              'UNIT=41',
              f'SOURCE_BYTE_OFFSET={offset}',
              f'BYTE_COUNT={len(candidate)}',
              f'SHA256={expected_sha256}',
              f'GIT_BLOB_SHA={git_blob}',
              'IDENTITY_RESULT=PASS',
              '',
          ]))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .gate-b-transfer/files/compositor/part-0041.repository-extracted.raw .gate-b-transfer/unit-41.repository-extraction.receipt
          git commit -m 'Extract exact H-Earth Gate B unit 41'
          git push origin HEAD:agent/h-earth-gate-b-transfer-staging-001
