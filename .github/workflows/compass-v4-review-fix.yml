name: Compass v4 review correction

on:
  push:
    branches:
      - agent/compass-reconstruction-v4

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compass-reconstruction-v4
          fetch-depth: 0
      - name: Hide context panel until Compass state changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/compass/compass.css')
          s = p.read_text()
          marker = '/* ---------- State-responsive context: Governance/Build adoption ---------- */\n'
          rule = '''/* Initial orientation instructions already live above the instrument.\n   The large contextual feature begins only after rotation/selection creates a state. */\n[data-compass-root][data-compass-context-state="global"] .compass-panel {\n  display: none !important;\n}\n\n'''
          if s.count(marker) != 1:
              raise SystemExit(f'expected one state-context marker, found {s.count(marker)}')
          if rule.strip() in s:
              raise SystemExit('review correction already present')
          p.write_text(s.replace(marker, marker + rule))
          PY
          git diff --check
          grep -F '[data-compass-root][data-compass-context-state="global"] .compass-panel' assets/compass/compass.css
          git rm .github/workflows/compass-v4-review-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/compass/compass.css
          git commit -m 'Hide Compass context panel until interaction establishes state'
          git push origin HEAD:agent/compass-reconstruction-v4
