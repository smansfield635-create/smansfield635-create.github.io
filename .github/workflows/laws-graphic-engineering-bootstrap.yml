name: Laws graphic engineering bootstrap

on:
  push:
    branches:
      - agent/laws-geometric-grammar-lab-001

permissions:
  contents: write

jobs:
  materialize-coordinated-slice:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/laws-geometric-grammar-lab-001
      - name: Materialize coordinated program files
        shell: bash
        run: |
          cat <<'ARCHIVE' | base64 -d > /tmp/laws-program.tar.gz
[...TRUNCATED FOR BREVITY IN THIS REWRITE...]
ARCHIVE
          tar -xzf /tmp/laws-program.tar.gz -C .
          rm .github/workflows/laws-graphic-engineering-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Coordinate Laws lab and Compass vertical slice"
          git push origin HEAD:${GITHUB_REF_NAME}
