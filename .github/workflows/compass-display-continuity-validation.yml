name: Compass Gen1538 Room Selected Continuity

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/compass/compass.controller.js'
      - 'assets/compass/compass.crystals.js'
      - 'assets/compass/compass.laws-spacecraft.js'
      - '.github/ai-router/projects/compass/room-selected-continuity-qualification-amendment.v1.json'
      - '.github/ai-router/projects/compass/verify-display-continuity.v1.mjs'
      - '.github/workflows/compass-display-continuity-validation.yml'
      - '.github/ai-router/router.v1.json'
      - '.github/ai-router/projects/compass/entrypoint.v1.json'

permissions:
  contents: write

jobs:
  materialize-spacecraft-bootstrap:
    if: github.head_ref == 'fix/compass-room-selected-continuity-gen1538'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bind Laws spacecraft adapter from loaded presentation owner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('assets/compass/compass.crystals.js')
          text=path.read_text()
          marker='DGB_COMPASS_LAWS_SPACECRAFT_BOOTSTRAP_GEN1538'
          if marker not in text:
              anchor='(() => {\n  "use strict";\n'
              if anchor not in text:
                  raise SystemExit('CRYSTALS_BOOTSTRAP_ANCHOR_MISSING')
              block='''(() => {\n  "use strict";\n\n  // DGB_COMPASS_LAWS_SPACECRAFT_BOOTSTRAP_GEN1538\n  // Crystals is an existing loaded presentation owner and executes before Cosmos.\n  // Disable the obsolete local spacecraft synchronously, then load the bounded Laws presentation owner.\n  globalThis.DGB_COMPASS_DISABLE_LOCAL_SPACECRAFT = true;\n  void import('/assets/compass/compass.laws-spacecraft.js?v=gen1538-laws-parity-v1')\n    .catch(error => {\n      globalThis.DGB_COMPASS_LAWS_SPACECRAFT_BOOTSTRAP_ERROR = String(error?.message || error);\n    });\n'''
              text=text.replace(anchor,block,1)
              path.write_text(text)
          PY
          node --check assets/compass/compass.crystals.js
          grep -q 'DGB_COMPASS_LAWS_SPACECRAFT_BOOTSTRAP_GEN1538' assets/compass/compass.crystals.js
          grep -q '/assets/compass/compass.laws-spacecraft.js' assets/compass/compass.crystals.js
      - name: Commit bounded product bootstrap if needed
        shell: bash
        run: |
          if git diff --quiet -- assets/compass/compass.crystals.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/compass/compass.crystals.js
          git commit -m 'fix(compass): bootstrap bounded Laws spacecraft [gen1538]'
          git push origin HEAD:${{ github.head_ref }}
