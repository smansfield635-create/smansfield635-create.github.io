name: H-Earth Map-Wide Environment Redevelopment Carrier 423 Supersession

on:
  push:
    branches:
      - verification/h-earth-map-wide-environment-redevelopment-builder-role3-001
    paths:
      - .github/workflows/h-earth-map-wide-environment-redevelopment-builder-role3-carrier.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: h-earth-map-wide-environment-redevelopment-carrier-423-supersession
  cancel-in-progress: false

env:
  REPOSITORY: smansfield635-create/smansfield635-create.github.io
  GOVERNING_MAIN: 3f51f0cd159df33571905c6cb14253ebdd137e3b
  LOCK_REF: refs/heads/operation-locks/repository-operation-intake-v1
  OPERATION_ID: H_EARTH_MAP_WIDE_ENVIRONMENT_REDEVELOPMENT_BUILDER_ROLE3_EXECUTION_CARRIER_001
  LOCK_SCOPE: H_EARTH:MAP_WIDE_ENVIRONMENT_REDEVELOPMENT:BUILDER_ROLE3_EXECUTION_CARRIER:V1:EXACT_1_PATH_SCOPE
  LOCK_GENERATION: '423'
  SCOPE_HASH: aa22e34651773ea77af5f8460bd598e248bc6178808c87ef417f649adc7d14b7
  TERMINAL_DISPOSITION: SUPERSEDED
  EXPECTED_LOCK_MANAGER_BLOB: 0aa440a3de30e145c7912fcfe2833fb8430ffbb0

jobs:
  supersede-carrier-423:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact carrier branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind exact main and canonical lock manager
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$GOVERNING_MAIN"
          test "$(git hash-object tools/operation-intake/repository-operation-lock-manager.v1.mjs)" = "$EXPECTED_LOCK_MANAGER_BLOB"
          node --check tools/operation-intake/repository-operation-lock-manager.v1.mjs

      - name: Close carrier generation 423 as SUPERSEDED
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/h-earth-carrier-423-supersession"
          for attempt in $(seq 1 12); do
            set +e
            node tools/operation-intake/repository-operation-lock-manager.v1.mjs \
              --action close \
              --repository "$REPOSITORY" \
              --lock-ref "$LOCK_REF" \
              --operation-id "$OPERATION_ID" \
              --lock-scope "$LOCK_SCOPE" \
              --lock-generation "$LOCK_GENERATION" \
              --terminal-disposition "$TERMINAL_DISPOSITION" \
              --output "$RUNNER_TEMP/h-earth-carrier-423-supersession/closure.json"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              break
            fi
            node --input-type=module -e "import fs from 'node:fs'; const p=process.env.RUNNER_TEMP+'/h-earth-carrier-423-supersession/closure.json'; const r=JSON.parse(fs.readFileSync(p,'utf8')); if(r.errorCode!=='LEDGER_COMPARE_AND_SWAP_CONFLICT'||![409,422].includes(r.httpStatus)) throw new Error('NONRETRYABLE_CLOSURE_FAILURE:'+JSON.stringify(r));"
            test "$attempt" -lt 12
            sleep $((attempt + 1))
          done
          node --input-type=module -e "import fs from 'node:fs'; const p=process.env.RUNNER_TEMP+'/h-earth-carrier-423-supersession/closure.json'; const r=JSON.parse(fs.readFileSync(p,'utf8')); const e={result:'TERMINAL_CLOSURE_COMMITTED',operationId:process.env.OPERATION_ID,lockScope:process.env.LOCK_SCOPE,scopeHash:process.env.SCOPE_HASH,lockGeneration:Number(process.env.LOCK_GENERATION),terminalDisposition:process.env.TERMINAL_DISPOSITION,lockReleased:true}; for(const [k,v] of Object.entries(e)){if(r[k]!==v) throw new Error('CLOSURE_RECEIPT_MISMATCH:'+k+':'+JSON.stringify(r));}"

      - name: Verify terminal history and active-scope removal
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module -e "const h={Accept:'application/vnd.github+json',Authorization:'Bearer '+process.env.GITHUB_TOKEN,'X-GitHub-Api-Version':'2022-11-28'}; const base='https://api.github.com/repos/'+process.env.REPOSITORY; const get=async u=>{const x=await fetch(u,{headers:h});const t=await x.text();if(!x.ok)throw new Error('GITHUB_API_ERROR:'+x.status+':'+t);return JSON.parse(t)}; const ref=await get(base+'/git/ref/heads/operation-locks/repository-operation-intake-v1'); const head=ref.object.sha; const f=await get(base+'/contents/.github/operation-intake/active-operation-ledger.v1.json?ref='+head); const l=JSON.parse(Buffer.from(f.content.replace(/\\s/g,''),'base64').toString('utf8')); if(l.activeScopes[process.env.SCOPE_HASH]) throw new Error('SUPERSEDED_SCOPE_STILL_ACTIVE'); const term=l.terminalHistory.find(e=>e.scopeHash===process.env.SCOPE_HASH&&e.operationId===process.env.OPERATION_ID&&e.lockGeneration===Number(process.env.LOCK_GENERATION)&&e.state==='TERMINAL'&&e.released===true&&e.terminalDisposition===process.env.TERMINAL_DISPOSITION); if(!term)throw new Error('SUPERSEDED_TERMINAL_HISTORY_NOT_FOUND');"

      - name: Upload closure evidence
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-map-wide-environment-redevelopment-carrier-423-supersession
          path: ${{ runner.temp }}/h-earth-carrier-423-supersession
          if-no-files-found: error
          retention-days: 90
