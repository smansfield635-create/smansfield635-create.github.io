name: H-Earth Phase2 Semantic Material Classifier
on:
  push:
    branches:
      - h-earth/phase2-semantic-material-classifier-v1
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node h-earth-3d/validation/phase2-semantic-material-classifier.measure.mjs "$PWD" | tee semantic-material.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h-earth-phase2-semantic-material-classifier
          path: semantic-material.json
          retention-days: 90
