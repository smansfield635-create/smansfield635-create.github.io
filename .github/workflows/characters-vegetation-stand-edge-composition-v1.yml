name: Characters Vegetation Stand Edge Composition v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'characters/vegetation-stand-topology.mjs'
      - 'characters/vegetation-composition.mjs'
      - 'characters/vegetation-edge-ecology.mjs'
      - 'characters/vegetation-population.mjs'
      - 'characters/vegetation-understory.mjs'
      - 'control-plane/whole-estate/characters-reconstruction-v1/vegetation-stand-edge-composition-contract.v1.json'
      - 'control-plane/whole-estate/characters-reconstruction-v1/verify-vegetation-stand-edge-composition.v1.mjs'
      - '.github/workflows/characters-vegetation-stand-edge-composition-v1.yml'

permissions:
  contents: read

env:
  OPERATION_ID: MIRRORLAND_STAND_TOPOLOGY_EDGE_ECOLOGY_NEGATIVE_SPACE_20260906_002
  LOCK_GENERATION: '1969'
  GOVERNING_MAIN: 8af6708cf872ec90b9ed39f9aa477f64f557a695
  V5_REPRESENTATION_BLOB: f3b64eb1ffc1c1bc8e908ff96eb6c833b6bc928d

jobs:
  exact-head-mechanical-and-world-reading-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact admitted candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate and admitted lineage
        shell: bash
        run: |
          set -euo pipefail
          EXACT_HEAD="$(git rev-parse HEAD^{commit})"
          test "$EXACT_HEAD" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor "$GOVERNING_MAIN" HEAD
          test "$(git hash-object characters/vegetation-representation.mjs)" = "$V5_REPRESENTATION_BLOB"
          test -z "$(git status --porcelain)"
          echo "EXACT_HEAD=$EXACT_HEAD" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run exact stand edge independent mechanical verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stand-edge-evidence"
          node control-plane/whole-estate/characters-reconstruction-v1/verify-vegetation-stand-edge-composition.v1.mjs \
            --output "$RUNNER_TEMP/stand-edge-evidence/vegetation-stand-edge-composition-receipt.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const file=path.join(process.env.RUNNER_TEMP,'stand-edge-evidence','vegetation-stand-edge-composition-receipt.json');
          const r=JSON.parse(fs.readFileSync(file,'utf8'));
          if(r.schema!=='MIRRORLAND_STAND_EDGE_COMPOSITION_QUALIFICATION_RECEIPT_v1')throw Error('STAND_EDGE_RECEIPT_SCHEMA_INVALID');
          if(r.result!=='PASS_CLOSED'||r.boundary!=='STAND_TOPOLOGY_EDGE_ECOLOGY_NEGATIVE_SPACE_PASS')throw Error('STAND_EDGE_MECHANICAL_NOT_PASS_CLOSED');
          if(r.exactHead!==process.env.EXACT_HEAD)throw Error('STAND_EDGE_RECEIPT_HEAD_MISMATCH');
          if(r.failCount!==0||r.populationCount!==818||r.representationCount!==818||r.v5RepresentationPreserved!==true)throw Error('STAND_EDGE_RECEIPT_INVARIANT_FAILURE');
          NODE
          test -z "$(git status --porcelain)"

      - name: Install passive Chromium tooling outside repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stand-edge-pw"
          cd "$RUNNER_TEMP/stand-edge-pw"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Start exact candidate server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >"$RUNNER_TEMP/stand-edge-http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/stand-edge-http.pid"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/characters/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/stand-edge-http.log"
          exit 1

      - name: Capture exact-head world-reading evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/stand-edge-capture.cjs" <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const crypto=require('crypto');
          const {chromium}=require(path.join(process.env.RUNNER_TEMP,'stand-edge-pw','node_modules','playwright'));
          const OUT=path.join(process.env.RUNNER_TEMP,'stand-edge-evidence');
          const URL='http://127.0.0.1:4173/characters/';
          const sha256=file=>crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          const errors=[];
          const captures=[];

          async function dismissPrimer(page){
            const skip=page.locator('#intro-skip');
            if(await skip.count()&&await skip.isVisible())await skip.click();
            const primer=page.locator('#step9-primer');
            if(await primer.count())await primer.waitFor({state:'hidden',timeout:10000});
          }
          async function health(page,response){
            if(!response||response.status()!==200)throw Error(`HTTP_${response?.status()??'NO_RESPONSE'}`);
            await page.locator('.signal-layer .signal').first().waitFor({state:'attached',timeout:15000});
            await sleep(900);
            const state=await page.evaluate(()=>{
              const canvas=document.querySelector('#scene');
              const gl=canvas?.getContext('webgl2');
              return {webgl2:!!gl,fatal:document.querySelector('#fatal')?.classList.contains('show')||false,width:canvas?.width||0,height:canvas?.height||0};
            });
            if(!state.webgl2||state.fatal||state.width<1||state.height<1)throw Error(`RUNTIME_HEALTH_INVALID:${JSON.stringify(state)}`);
            return state;
          }
          async function returnOrbit(page){
            const button=page.locator('#return');
            if(await button.count()&&await button.isVisible()){
              await button.click();
              await button.waitFor({state:'hidden',timeout:10000});
              await sleep(450);
            }
          }
          async function gotoDestination(page,id){
            await returnOrbit(page);
            await page.locator('#map-toggle').click();
            await page.locator('#coast-map').waitFor({state:'visible',timeout:10000});
            const node=page.locator(`.map-node[data-id="${id}"]`);
            if(!await node.count()||!await node.isVisible())throw Error(`MAP_NODE_NOT_VISIBLE:${id}`);
            await node.click();
            await page.locator('#return').waitFor({state:'visible',timeout:10000});
            await sleep(900);
          }
          async function snapshot(page,filename,state,destinationId=null){
            const environment=await page.evaluate(async destinationId=>{
              const pop=await import('./vegetation-population.mjs');
              const stands=await import('./vegetation-stand-topology.mjs');
              const composition=await import('./vegetation-composition.mjs');
              const p=pop.getCanonicalVegetationPopulation();
              return {
                populationCount:p.instanceCount,
                standSeedCount:stands.getStandTopologySeeds().length,
                zoneSelectedCounts:p.diagnostics?.zoneSelectedCounts||{},
                classSelectedCounts:p.diagnostics?.classSelectedCounts||{},
                territoryCount:composition.getCompositionTerritories().length,
                destinationId
              };
            },destinationId);
            if(environment.populationCount!==818)throw Error(`${filename}:POPULATION_NOT_818`);
            const file=path.join(OUT,filename);
            await page.screenshot({path:file,fullPage:false});
            const stat=fs.statSync(file);
            if(stat.size<10000)throw Error(`${filename}:PNG_TOO_SMALL:${stat.size}`);
            captures.push({filename,state,destinationId,environment,bytes:stat.size,sha256:sha256(file)});
          }

          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            try{
              const context=await browser.newContext({viewport:{width:1440,height:900},deviceScaleFactor:1});
              const page=await context.newPage();
              page.on('pageerror',error=>errors.push({type:'pageerror',message:String(error?.message||error)}));
              page.on('console',message=>{if(message.type()==='error')errors.push({type:'console',message:message.text()});});
              const response=await page.goto(URL,{waitUntil:'networkidle',timeout:30000});
              const runtime=await health(page,response);
              await dismissPrimer(page);
              await sleep(450);

              await snapshot(page,'stand-edge-wide.png','WIDE_COAST');
              await gotoDestination(page,'crossing');
              await snapshot(page,'stand-edge-open.png','OPEN_TERRAIN','crossing');
              await gotoDestination(page,'alaric');
              await snapshot(page,'stand-edge-edge.png','WOODLAND_EDGE','alaric');
              await gotoDestination(page,'manor');
              await snapshot(page,'stand-edge-interior.png','FOREST_INTERIOR_REPRESENTATIVE','manor');
              await snapshot(page,'stand-edge-manor.png','MIRROR_MANOR_APPROACH','manor');
              await gotoDestination(page,'tarian');
              await snapshot(page,'stand-edge-waterline.png','SHORELINE_WETLAND_TRANSITION','tarian');

              if(errors.length)throw Error(`BROWSER_ERRORS:${JSON.stringify(errors)}`);
              const expected=['stand-edge-wide.png','stand-edge-open.png','stand-edge-edge.png','stand-edge-interior.png','stand-edge-manor.png','stand-edge-waterline.png'].sort();
              const observed=captures.map(x=>x.filename).sort();
              if(JSON.stringify(expected)!==JSON.stringify(observed))throw Error(`CAPTURE_SET_MISMATCH:${JSON.stringify(observed)}`);
              const manifest={
                schema:'MIRRORLAND_STAND_EDGE_WORLD_READING_EVIDENCE_v1',
                result:'EVIDENCE_CAPTURE_PASS',
                operationId:process.env.OPERATION_ID,
                lockGeneration:Number(process.env.LOCK_GENERATION),
                candidateSha:process.env.EXACT_HEAD,
                governingMain:process.env.GOVERNING_MAIN,
                route:'/characters/',
                captureSemantics:'PASSIVE_EXACT_HEAD_WORLD_READING_EVIDENCE_NO_PRODUCT_MUTATION',
                visualDispositionAuthority:'NOT_ASSIGNED_BY_CAPTURE_JOB',
                materialDisposition:'EVIDENCE_CAPTURED_PENDING_VISUAL_ADJUDICATION',
                targetSequence:['WIDE_COAST','OPEN_TERRAIN','WOODLAND_EDGE','FOREST_INTERIOR','CLEARING','MIRROR_MANOR_APPROACH','SHORELINE_WETLAND_TRANSITION','WIDE_RETURN'],
                judgmentDimensions:['DENSITY_RHYTHM','OPEN_DENSE_CONTRAST','EDGE_LEGIBILITY','PARALLAX','OCCLUSION_ACCUMULATION','SILHOUETTE_HIERARCHY','DESTINATION_READABILITY','BREATHING_SPACE','LOD_CONTINUITY','UNDERSTANDABLE_SPATIAL_STRUCTURE'],
                runtime,
                errors,
                captures
              };
              fs.writeFileSync(path.join(OUT,'stand-edge-world-reading-evidence.json'),JSON.stringify(manifest,null,2)+'\n');
              await context.close();
            }finally{await browser.close();}
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
          node "$RUNNER_TEMP/stand-edge-capture.cjs"

      - name: Verify evidence identities and clean repository tree
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const dir=path.join(process.env.RUNNER_TEMP,'stand-edge-evidence');
          const manifest=JSON.parse(fs.readFileSync(path.join(dir,'stand-edge-world-reading-evidence.json'),'utf8'));
          if(manifest.schema!=='MIRRORLAND_STAND_EDGE_WORLD_READING_EVIDENCE_v1'||manifest.result!=='EVIDENCE_CAPTURE_PASS')throw Error('WORLD_READING_MANIFEST_INVALID');
          if(manifest.candidateSha!==process.env.EXACT_HEAD)throw Error('WORLD_READING_HEAD_MISMATCH');
          if(manifest.operationId!==process.env.OPERATION_ID||manifest.lockGeneration!==Number(process.env.LOCK_GENERATION))throw Error('WORLD_READING_OPERATION_MISMATCH');
          if(manifest.visualDispositionAuthority!=='NOT_ASSIGNED_BY_CAPTURE_JOB'||manifest.materialDisposition!=='EVIDENCE_CAPTURED_PENDING_VISUAL_ADJUDICATION')throw Error('WORLD_READING_AUTHORITY_LEAK');
          if(manifest.errors.length!==0||manifest.captures.length!==6)throw Error('WORLD_READING_CAPTURE_COUNT_INVALID');
          for(const capture of manifest.captures){
            const file=path.join(dir,capture.filename);
            const actual=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            if(actual!==capture.sha256)throw Error(`WORLD_READING_PNG_DIGEST_MISMATCH:${capture.filename}`);
          }
          NODE
          test "$(git hash-object characters/vegetation-representation.mjs)" = "$V5_REPRESENTATION_BLOB"
          test -z "$(git status --porcelain)"

      - name: Upload bounded stand edge qualification evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stand-edge-composition-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/stand-edge-evidence/vegetation-stand-edge-composition-receipt.json
            ${{ runner.temp }}/stand-edge-evidence/stand-edge-world-reading-evidence.json
            ${{ runner.temp }}/stand-edge-evidence/stand-edge-wide.png
            ${{ runner.temp }}/stand-edge-evidence/stand-edge-open.png
            ${{ runner.temp }}/stand-edge-evidence/stand-edge-edge.png
            ${{ runner.temp }}/stand-edge-evidence/stand-edge-interior.png
            ${{ runner.temp }}/stand-edge-evidence/stand-edge-manor.png
            ${{ runner.temp }}/stand-edge-evidence/stand-edge-waterline.png
          if-no-files-found: warn
          retention-days: 90
