name: H-Earth Phase1 Coast Cross-Section Measurement
on:
  push:
    branches:
      - h-earth/phase1-coast-cross-section-v1
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node h-earth-3d/validation/phase1-coast-cross-section.measure.mjs "$PWD" | tee phase1-coast-cross-section.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h-earth-phase1-coast-cross-section
          path: phase1-coast-cross-section.json
          retention-days: 90
