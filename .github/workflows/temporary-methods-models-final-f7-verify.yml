name: Temporary Final Program F7 Interaction And Accessibility Verify

on:
  push:
    branches:
      - construction/methods-models-integrated-environment-v1
    paths:
      - 'control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/f7-interaction-and-accessibility/**'
      - '.github/workflows/temporary-methods-models-final-f7-verify.yml'

permissions:
  contents: read

jobs:
  verify-f7-interaction-and-accessibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Bind governing main ref
        run: git fetch origin main:refs/remotes/origin/main
      - name: Verify F7 interaction and accessibility fail-closed
        run: node control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/f7-interaction-and-accessibility/verify.v1.mjs | tee f7-verification.log
      - name: Require terminal F7 contract
        run: node -e "const r=require('./control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/f7-interaction-and-accessibility/f7-terminal-receipt.v1.json'); if(r.candidateDisposition!=='PASS_F7_INTERACTION_AND_ACCESSIBILITY_v1'||r.f8ConstructionAuthorityAfterEffectivePass!==true||r.f9ThroughF12Authority!==false) process.exit(1);"
      - name: Preserve F7 verification log
        uses: actions/upload-artifact@v4
        with:
          name: methods-models-final-program-f7-interaction-and-accessibility-verification
          path: f7-verification.log
          if-no-files-found: error
