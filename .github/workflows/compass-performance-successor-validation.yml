name: Compass Gen1531 Mirrorland Lifecycle Repair Transport

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/compass-performance-successor-validation.yml'

permissions:
  contents: write

env:
  REPAIR_PARENT: edb41283520247ee6de3309cb83128d799ab85c6

jobs:
  repair-mirrorland-lifecycle:
    if: github.head_ref == 'compass-gen1531-mirrorland-crystal-scheduling'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify repair parent and workflow-only staging
        run: |
          git merge-base --is-ancestor "$REPAIR_PARENT" HEAD
          test "$(git diff --name-only "$REPAIR_PARENT" HEAD)" = '.github/workflows/compass-performance-successor-validation.yml'
          git diff --quiet "$REPAIR_PARENT" HEAD -- assets/compass/compass.mirrorland-window.js
      - name: Repair requestRender wake semantics and retire carrier
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/compass/compass.mirrorland-window.js')
          s=p.read_text()
          old='''  function requestRender() {\n    if (\n      !state.running ||\n      state.failed ||\n      state.disposed ||\n      state.raf\n    ) {\n      return;\n    }\n\n    requestRender();\n  }'''
          new='''  function requestRender() {\n    if (\n      !state.running ||\n      state.failed ||\n      state.disposed ||\n      state.raf\n    ) {\n      return;\n    }\n\n    state.raf =\n      requestAnimationFrame(\n        render\n      );\n  }'''
          if s.count(old)!=1: raise SystemExit(f'requestRender defect match count={s.count(old)}')
          s=s.replace(old,new,1)
          old2='''    emitReceipt({\n      lastAction:\n        action,\n\n      lastFailure:\n        null\n    });\n\n    return true;\n  }'''
          new2='''    emitReceipt({\n      lastAction:\n        action,\n\n      lastFailure:\n        null\n    });\n\n    requestRender();\n\n    return true;\n  }'''
          if s.count(old2)!=1: raise SystemExit(f'startTransition wake match count={s.count(old2)}')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          node --check assets/compass/compass.mirrorland-window.js
          git show "$REPAIR_PARENT":.github/workflows/compass-performance-successor-validation.yml > .github/workflows/compass-performance-successor-validation.yml
          test "$(git diff --name-only "$REPAIR_PARENT" | sort)" = 'assets/compass/compass.mirrorland-window.js'
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/compass/compass.mirrorland-window.js .github/workflows/compass-performance-successor-validation.yml
          git commit -m 'Repair Mirrorland demand-driven lifecycle wake'
          git push origin HEAD:${{ github.head_ref }}
