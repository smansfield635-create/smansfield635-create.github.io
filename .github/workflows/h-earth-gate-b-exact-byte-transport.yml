name: H-Earth Shared Packet 002 Gate B Observation
on:
  pull_request:
permissions:
  contents: read
  issues: read
jobs:
  observe-shared-packet-002-gate-b:
    if: github.head_ref == 'agent/h-earth-gate-b-phase-a-successor-001'
    runs-on: ubuntu-latest
    env:
      TARGET_PATH: h-earth-3d/integration/h-earth.post-west-admitted-geometry-transfer.js
      EXPECTED_BASE_BLOB: 2bcb67ebf84f36248475921c85e75236a1115102
      EXPECTED_SUCCESSOR_BYTES: 63412
      EXPECTED_SUCCESSOR_SHA256: 58e1f0100019a64d870837b69882f59d0fd5c6a522cc5abebb56e97a7179de0a
      EXPECTED_SUCCESSOR_BLOB: b6c92988fee6997344b5df89cd5645d7d5b2d1a2
      COMMENT_IDS: 5059696536,5059713725,5059717709
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/h-earth-gate-b-phase-a-successor-001
          fetch-depth: 0
      - name: Reconstruct exact successor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$TARGET_PATH")" = "$EXPECTED_BASE_BLOB"
          mkdir -p "$RUNNER_TEMP/shared-packet-002-gate-b-observation"
          python - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,urllib.request
          ids=[int(v) for v in os.environ['COMMENT_IDS'].split(',')]
          lengths=[7000,7000,180]
          hashes=['38d0c10cd020c991082655487f27185b2efb56a726562640a07440d8501e51d7','f3037a6fad7128f5e0a5ac6034aaf33ce9920625e7e256bb013ea70dc01603b2','a85b34c42ab9535c1a01530dcafa04734323f8daed056b231f2839a80f8177ea']
          pieces=[]
          for index,comment_id in enumerate(ids,1):
              req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/comments/{comment_id}",headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req) as response: body=json.load(response)['body']
              prefix=f'H_EARTH_SHARED_PACKET_002_SUCCESSOR_GZIP_PART_{index:02d}_OF_03\n'
              if not body.startswith(prefix): raise SystemExit(f'Header mismatch for part {index}.')
              payload=body[len(prefix):].strip()
              observed=hashlib.sha256(payload.encode()).hexdigest()
              if len(payload)!=lengths[index-1] or observed!=hashes[index-1]: raise SystemExit(f'Part {index} mismatch: {len(payload)} {observed}')
              pieces.append(payload)
          raw=gzip.decompress(base64.b64decode(''.join(pieces),validate=True))
          observed=hashlib.sha256(raw).hexdigest()
          if len(raw)!=int(os.environ['EXPECTED_SUCCESSOR_BYTES']) or observed!=os.environ['EXPECTED_SUCCESSOR_SHA256']: raise SystemExit(f'Successor mismatch: {len(raw)} {observed}')
          pathlib.Path(os.environ['TARGET_PATH']).write_bytes(raw)
          PY
          test "$(git hash-object "$TARGET_PATH")" = "$EXPECTED_SUCCESSOR_BLOB"
          node --check "$TARGET_PATH"
      - name: Record exact Gate B evaluator and builder results
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const observation={stage:'START',adapter:null,evaluation:null,builder:null,thrown:null};
          try {
            const providerModule=await import('./showroom/globe/h-earth/render/ground-view-gate-b.js');
            const adapterModule=await import('./h-earth-3d/integration/h-earth.ground-view-gate-b-west-admission-adapter.js');
            const transfer=await import('./h-earth-3d/integration/h-earth.post-west-admitted-geometry-transfer.js');
            observation.stage='IMPORTED';
            const deepFreeze=(value,seen=new WeakSet())=>{if(value===null||typeof value!=='object'||seen.has(value))return value;seen.add(value);for(const nested of Object.values(value))deepFreeze(nested,seen);return Object.freeze(value);};
            const routeToken='H_EARTH_GATE_B_DIAGNOSTIC_ROUTE_TOKEN:123e4567-e89b-42d3-a456-426614174000';
            const executionIdentity=deepFreeze({executionClass:'GATE_B_DIAGNOSTIC_CHILD_ROUTE_ENTRY',routeToken,adapterOccurrenceId:`H_EARTH_GATE_B_ADAPTER_OCCURRENCE:${routeToken}`,aggregateFrameId:`H_EARTH_WEST_AGGREGATE_FRAME:${routeToken}`,packet002TransferOccurrenceId:`H_EARTH_GATE_B_PACKET_002_TRANSFER_OCCURRENCE:${routeToken}`,compositorFrameOccurrenceId:`H_EARTH_COMPOSITOR_FRAME_OCCURRENCE:${routeToken}`});
            const construction=providerModule.constructHEarthGroundViewGateBGeometry();
            const adapterOccurrence=adapterModule.executeHEarthGroundViewGateBWestAdmissionAdapter({gateBConstructionResult:construction,executionIdentity,provenanceApplicability:adapterModule.H_EARTH_GROUND_VIEW_GATE_B_PROVENANCE_APPLICABILITY,toleranceContext:null});
            observation.adapter={ok:adapterOccurrence.ok,status:adapterOccurrence.status,validator:adapterModule.isHEarthGroundViewGateBWestAdmissionAdapterOccurrence(adapterOccurrence),issueCodes:(adapterOccurrence.issues??[]).map((issue)=>issue.code),primitiveOrder:adapterOccurrence.primitiveOrder,standaloneCount:adapterOccurrence.admittedPrimitives?.length??null,aggregateCount:adapterOccurrence.aggregateFrameAdmissionRecord?.primitives?.length??null,frameId:adapterOccurrence.aggregateFrameAdmissionRecord?.frameId??null,toleranceContext:adapterOccurrence.toleranceContext??null,frozen:Object.isFrozen(adapterOccurrence)};
            observation.stage='ADAPTER_COMPLETE';
            const input={gateBAdapterOccurrence:adapterOccurrence,toleranceContext:null};
            const evaluation=transfer.evaluateHEarthPostWestAdmittedGeometryTransferInput(input);
            observation.evaluation={ok:evaluation.ok,status:evaluation.status,transferMode:evaluation.transferMode,issueCodes:(evaluation.issues??[]).map((issue)=>issue.code),issues:evaluation.issues,keys:Object.keys(evaluation).sort(),gateBAdapterValidation:evaluation.gateBAdapterValidation?{ok:evaluation.gateBAdapterValidation.ok,issueCodes:(evaluation.gateBAdapterValidation.issues??[]).map((issue)=>issue.code),sourceObjectIds:evaluation.gateBAdapterValidation.sourceObjectIds,sourceZoneIds:evaluation.gateBAdapterValidation.sourceZoneIds,latticeRegionIds:evaluation.gateBAdapterValidation.latticeRegionIds,primitiveOrder:evaluation.gateBAdapterValidation.primitiveOrder}:null};
            observation.stage='EVALUATED';
            const result=transfer.buildHEarthPostWestAdmittedGeometryTransfer(input);
            observation.builder={ok:result.ok,status:result.status,transferMode:result.transferMode??null,issueCodes:(result.issues??[]).map((issue)=>issue.code),issues:result.issues,keys:Object.keys(result).sort(),admittedCount:result.admittedPrimitives?.length??null,aggregateCount:result.aggregateFrameAdmissionRecord?.primitives?.length??null,correspondence:result.standaloneToAggregateMemberCorrespondence??null,sourceObjectIds:result.sourceObjectIds??null,sourceZoneIds:result.sourceZoneIds??null,latticeRegionIds:result.latticeRegionIds??null,identityChecks:{admittedArraySeparate:result.admittedPrimitives!==adapterOccurrence.admittedPrimitives,frameSeparate:result.aggregateFrameAdmissionRecord!==adapterOccurrence.aggregateFrameAdmissionRecord,boundsSeparateFromAdapter:result.bounds!==adapterOccurrence.bounds,boundsSeparateFromFrame:result.bounds!==result.aggregateFrameAdmissionRecord?.bounds,provenanceSeparate:result.primitiveProvenanceApplicability!==adapterOccurrence.provenanceApplicability},frozenChecks:{result:Object.isFrozen(result),admitted:Object.isFrozen(result.admittedPrimitives),frame:Object.isFrozen(result.aggregateFrameAdmissionRecord),bounds:Object.isFrozen(result.bounds),provenance:Object.isFrozen(result.primitiveProvenanceApplicability)}};
            observation.stage='BUILT';
          }catch(error){observation.thrown={name:error?.name??'Error',message:error?.message??String(error),stack:error?.stack??null};}
          fs.writeFileSync(process.env.RUNNER_TEMP+'/shared-packet-002-gate-b-observation/observation.json',JSON.stringify(observation,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: h-earth-shared-packet-002-gate-b-observation
          path: ${{ runner.temp }}/shared-packet-002-gate-b-observation/observation.json
          retention-days: 1
      - name: Prove no governed source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --short | wc -l)" -eq 1
          test "$(git status --short | awk '{print $2}')" = "$TARGET_PATH"
