name: Laws Experiential Restoration Verifier Target Correction

on:
  push:
    branches:
      - agent/laws-experiential-architecture-restoration-001
    paths:
      - '.github/workflows/laws-experiential-restoration-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: laws-experiential-restoration-verifier-target-correction
  cancel-in-progress: false

env:
  RESTORATION_BRANCH: agent/laws-experiential-architecture-restoration-001
  EXPECTED_MAIN_BASE: ef2ffdb1da7911238652f076a6b44326061493ef

jobs:
  correct-verifier-targets:
    if: github.ref_name == 'agent/laws-experiential-architecture-restoration-001'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out bounded restoration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RESTORATION_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lock current main and branch ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$RESTORATION_BRANCH"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_BASE"
          test "$(git merge-base origin/main HEAD)" = "$EXPECTED_MAIN_BASE"

      - name: Replace verifier target resolution exactly once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/laws-experiential-restoration-root-matrix.mjs")
          text = path.read_text(encoding="utf-8")
          old = r'''async function activateAuthority(page, direction, input) {
            await returnToConstellation(page);
            const control = page.locator(`[data-laws-category][data-direction="${direction}"]`).first();
            assert.equal(await control.count(), 1, `Authority control missing: ${direction}.`);
            await activate(page, control, input);

            await page.waitForFunction(nextDirection => {'''
          new = r'''async function activateAuthority(page, direction, input) {
            await returnToConstellation(page);
            const semanticSelector = `[data-laws-category][data-direction="${direction}"]`;
            const semanticControl = page.locator(semanticSelector).first();
            assert.equal(await semanticControl.count(), 1, `Authority control missing: ${direction}.`);
            await semanticControl.scrollIntoViewIfNeeded();
            await page.waitForTimeout(180);

            if (input === "keyboard") {
              await activate(page, semanticControl, input);
            } else {
              const hit = await page.evaluate(nextDirection => {
                const semantic = document.querySelector(
                  `[data-laws-category][data-direction="${nextDirection}"]`
                );
                const projected = document.querySelector(
                  `[data-laws-projected-category-label="${nextDirection}"]`
                );
                const surfaces = [projected, semantic].filter(node => {
                  if (!(node instanceof HTMLElement)) return false;
                  const rect = node.getBoundingClientRect();
                  const style = getComputedStyle(node);
                  return !node.hidden &&
                    style.display !== "none" &&
                    style.visibility !== "hidden" &&
                    style.pointerEvents !== "none" &&
                    rect.width > 0 &&
                    rect.height > 0;
                });
                const fractions = [
                  [0.5, 0.5], [0.2, 0.2], [0.8, 0.2], [0.2, 0.8],
                  [0.8, 0.8], [0.5, 0.2], [0.5, 0.8], [0.2, 0.5], [0.8, 0.5]
                ];

                for (const surface of surfaces) {
                  const rect = surface.getBoundingClientRect();
                  for (const [fx, fy] of fractions) {
                    const x = rect.left + rect.width * fx;
                    const y = rect.top + rect.height * fy;
                    if (x < 0 || y < 0 || x >= innerWidth || y >= innerHeight) continue;
                    const top = document.elementFromPoint(x, y);
                    const owner = top?.closest?.(
                      `[data-laws-projected-category-label="${nextDirection}"], ` +
                      `[data-laws-category][data-direction="${nextDirection}"]`
                    );
                    if (!owner) continue;
                    return {
                      x,
                      y,
                      surface: owner.hasAttribute("data-laws-projected-category-label")
                        ? "projected-label"
                        : "semantic-control"
                    };
                  }
                }
                return null;
              }, direction);

              assert.ok(hit, `No unblocked physical hit surface for ${direction} (${input}).`);
              if (input === "touch") {
                await page.touchscreen.tap(hit.x, hit.y);
              } else {
                await page.mouse.click(hit.x, hit.y);
              }
            }

            await page.waitForFunction(nextDirection => {'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"VERIFIER_TARGET_ANCHOR_COUNT={count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify bounded verifier-only scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "tools/laws-experiential-restoration-root-matrix.mjs"
          node --check tools/laws-experiential-restoration-root-matrix.mjs
          git diff --check

      - name: Commit corrected physical target verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/laws-experiential-restoration-root-matrix.mjs
          git commit -m "Verify Laws authorities through physical input surfaces"
          git push origin "HEAD:$RESTORATION_BRANCH"
