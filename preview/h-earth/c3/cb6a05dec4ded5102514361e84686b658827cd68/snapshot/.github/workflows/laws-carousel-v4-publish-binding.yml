name: Laws Carousel V6 Publish Binding — Retired Compatibility Notice

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Record bounded replacement rule
        run: |
          echo 'LAWS_AUTOMATIC_MAIN_WRITEBACK=RETIRED'
          echo 'Asset identity changes must be included in the admitted product mutation, not generated by a post-merge push workflow.'
          echo 'This compatibility workflow performs no repository mutation and creates no publication authority.'
