name: Laws CP6 OSF derivative methods

on:
  push:
    branches:
      - agent/laws-cp6-child-derivative-methods-001
    paths:
      - .github/workflows/laws-cp6-osf-derivative-methods.yml
      - tools/laws-cp6-osf-derivative-methods-transform.mjs
      - tools/laws-cp6-osf-derivative-methods-verify.mjs
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - .github/workflows/laws-cp6-osf-derivative-methods.yml
      - tools/laws-cp6-osf-derivative-methods-transform.mjs
      - tools/laws-cp6-osf-derivative-methods-verify.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: laws-cp6-osf-derivative-methods-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}

    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconcile exact source-registry identities
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/laws-cp6-osf-derivative-methods-transform.mjs')
          text = p.read_text(encoding='utf-8')
          replacements = {
              "method_class: 'DOMAIN_SPECIFIC_SDTL_FALSIFICATION'": "method_class: 'FORMAL_FALSIFICATION_PATH'",
              "metadata_sha256: '8b88e6605d4b3afee7a46aa2439a51a941c4f3ffbc3fd7d6cd8f7e2b5c1e44cf'": "metadata_sha256: '12d75fd447aa5686c695264bf9387d35546d02933644eafbdaed251ed141cada'",
              "method_class: 'ADMISSIBLE_EVIDENCE_WINDOWS_OBSERVER_INVARIANCE_CLASSIFICATION_RULES'": "method_class: 'ADMISSIBLE_EVIDENCE_FIXED_WINDOWS_OBSERVER_INVARIANCE'",
              "metadata_sha256: 'c38419126a445f240982fb4f3a667bdf4227840c7db1e2670acc75c35a0c7219'": "metadata_sha256: '695a0d8ccb59b57135758a2ea89b54b5c27119f74024b98de6da1becc8bf437c'",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'MISSING_SOURCE_IDENTITY:{old}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/laws-cp6-osf-derivative-methods-transform.mjs
          git commit -m "Reconcile exact OSF source identities"

      - name: Build derivative-method candidate
        run: node tools/laws-cp6-osf-derivative-methods-transform.mjs

      - name: Enforce exact six-page product scope
        run: |
          git checkout -- laws/index.html
          test -z "$(git diff --name-only -- laws/index.html)"

      - name: Install browser verifier
        run: |
          npm install --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Verify source, archive, runtime, responsive, and static contracts
        run: node tools/laws-cp6-osf-derivative-methods-verify.mjs

      - name: Upload evidence package
        uses: actions/upload-artifact@v4
        with:
          name: laws-cp6-osf-derivative-methods
          path: laws/control-plane/osf-derivative-methods/
          if-no-files-found: error
          retention-days: 90

      - name: Commit exact verified candidate
        run: |
          git add \
            laws/derivative-methods.css \
            laws/test/admission-and-baseline/index.html \
            laws/test/forward-construction/index.html \
            laws/test/reverse-audit/index.html \
            laws/test/result-and-record/index.html \
            laws/research/evidence-and-sources/index.html \
            laws/research/methods-and-models/index.html \
            laws/control-plane/osf-derivative-methods
          git diff --cached --check
          git commit -m "Integrate source-bound OSF derivative methods"
          git push origin HEAD:${TARGET_BRANCH}
