name: Compass Live Binding Repair Executor

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'repair/compass-live-asset-bindings-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Repair Compass asset bindings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='gen1532-live-binding-v1'
          if marker not in s:
              s=s.replace('g=1521', marker)
              s=s.replace('v=compass-contextual-quick-pass-v11', f'v={marker}')
              s=s.replace('v=gen1531-cc7a9b11', f'v={marker}')
              css='<link rel="stylesheet" href="/assets/compass/compass.identity-3d.css?v='+marker+'">\n'
              anchor='<link rel="stylesheet" href="/assets/compass/compass.statement-carousel.css'
              if 'compass.identity-3d.css' not in s:
                  s=s.replace(anchor, css+anchor, 1)
              js='<script src="/assets/compass/compass.identity-3d.js?v='+marker+'" defer></script>\n'
              anchor_js='<script src="/assets/compass/compass.controller.js'
              if 'compass.identity-3d.js' not in s:
                  s=s.replace(anchor_js, js+anchor_js, 1)
              p.write_text(s)
          PY
          grep -q 'compass.identity-3d.css?v=gen1532-live-binding-v1' index.html
          grep -q 'compass.identity-3d.js?v=gen1532-live-binding-v1' index.html
          ! grep -q 'g=1521' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m 'Bind reconciled Compass visual runtimes in live HTML'
            git push origin HEAD:${{ github.head_ref }}
          fi
