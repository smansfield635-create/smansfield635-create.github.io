name: Education Cycle Two Boundary Qualification v1
on:
  workflow_dispatch:
    inputs:
      candidate_sha: {required: true, type: string}
      base_sha: {required: true, type: string}
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Qualify Cycle Two setup boundary
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=10 origin "$CANDIDATE_SHA" "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = products/education/index.html
          git show "$CANDIDATE_SHA:products/education/index.html" >/tmp/e.html
          ! grep -Fq 'data-demo-stage="language"' /tmp/e.html
          ! grep -Fq 'id="native-language"' /tmp/e.html
          grep -Fq 'data-step-indicator="intake" data-state="active">About you</span>' /tmp/e.html
          grep -Fq 'data-step-indicator="test">Placement</span>' /tmp/e.html
          grep -Fq 'data-step-indicator="result">Result</span>' /tmp/e.html
          grep -Fq 'data-step-indicator="entry">Start</span>' /tmp/e.html
          grep -Fq 'id="begin-placement">Start placement</button>' /tmp/e.html
          grep -Fq 'function startDemo(){qs("#demo-shell").hidden=false;setStage("intake")' /tmp/e.html
          grep -Fq 'const order=["intake","test","result","entry"]' /tmp/e.html
          grep -Fq '["claimed-level","study-history","translation-use"]' /tmp/e.html
          grep -Fq 'learner={...learner,help_language:helpLanguage,claimed_level:claimed' /tmp/e.html
          grep -Fq 'const BANK={' /tmp/e.html
          grep -Fq 'function startProbe(' /tmp/e.html
          echo EDUCATION_CYCLE_TWO_BOUNDARY_QUALIFICATION=PASS
