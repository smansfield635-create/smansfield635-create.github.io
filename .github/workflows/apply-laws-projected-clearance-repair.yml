              '''                  projectedRadiusForNode(
                      node
                    ),

                  nodeId:''',
              '''                  projectedRadiusForNode(
                      node
                    ),

                  compassOverlapPadding:
                    node.type === NODE_TYPES.LAW
                      ? SPHERE.cluster
                          .projectedClearanceMarginPx
                      : undefined,

                  nodeId:''',
