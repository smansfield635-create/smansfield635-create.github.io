name: DGB Weekly Productivity Receipt
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: write
concurrency:
  group: dgb-weekly-productivity-receipt
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate bounded weekly receipt
        run: python3 .github/productivity/generate-productivity-receipt.v1.py
      - name: Validate receipt structure
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open("productivity-receipts/latest.json"))
          assert p["schema"]=="DGB_PRODUCTIVITY_RECEIPT_v1"
          assert p["activity"]["meaningfulCommits"] >= 0
          assert p["source"]["historicalBaseline"]=="project-records/dgb-longitudinal-productivity-audit-2026-09-29.md"
          print("PASS_PRODUCTIVITY_RECEIPT_STRUCTURE")
          PY
      - name: Commit receipt if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add productivity-receipts/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update weekly productivity receipt"
          git push
