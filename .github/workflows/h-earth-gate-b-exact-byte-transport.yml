name: H-Earth Gate B Exact Byte Transport

on:
  pull_request:

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  transport-environment:
    if: github.head_ref == 'agent/h-earth-gate-b-phase-a-successor-001'
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA256: 7a30779d77385f4b81ed333c6b729cc23b3450f4491ae7c38749ae2f584c3fbf
      EXPECTED_BYTE_COUNT: 53209
      TARGET_PATH: showroom/globe/h-earth/environment.js
      TARGET_BRANCH: agent/h-earth-gate-b-phase-a-successor-001
      CANDIDATE_PATH: /tmp/h-earth-gate-b-environment.js
      BASE64_PATH: /tmp/h-earth-gate-b-environment.b64
    steps:
      - name: Check out isolated Phase A branch
        uses: actions/checkout@v4
        with:
          ref: agent/h-earth-gate-b-phase-a-successor-001
          fetch-depth: 0

      - name: Reconstruct exact candidate from fixed PR comments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > "$BASE64_PATH"

          fetch_payload() {
            local comment_id="$1"
            local expected_header="$2"
            local body
            body="$(curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              | jq -r '.body')"
            test "$(printf '%s\n' "$body" | head -n 1)" = "$expected_header"
            printf '%s\n' "$body" | tail -n +2 | tr -d '\r\n' >> "$BASE64_PATH"
          }

          fetch_payload 5054865088 H_EARTH_GATE_B_ENVIRONMENT_B64_PART_0001_OF_0006
          fetch_payload 5054902794 H_EARTH_GATE_B_ENVIRONMENT_B64_PART_0002_OF_0004
          fetch_payload 5054935104 H_EARTH_GATE_B_ENVIRONMENT_B64_PART_0003_OF_0004
          fetch_payload 5054960445 H_EARTH_GATE_B_ENVIRONMENT_B64_PART_0004_OF_0004

          base64 --decode "$BASE64_PATH" > "$CANDIDATE_PATH"
          test "$(wc -c < "$CANDIDATE_PATH" | tr -d ' ')" = "$EXPECTED_BYTE_COUNT"
          test "$(sha256sum "$CANDIDATE_PATH" | awk '{print $1}')" = "$EXPECTED_SHA256"

      - name: Install, verify, commit, and push exact environment bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$TARGET_PATH")"
          cp "$CANDIDATE_PATH" "$TARGET_PATH"
          test "$(wc -c < "$TARGET_PATH" | tr -d ' ')" = "$EXPECTED_BYTE_COUNT"
          test "$(sha256sum "$TARGET_PATH" | awk '{print $1}')" = "$EXPECTED_SHA256"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET_PATH"

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Install validated Gate B environment successor"
          git push origin "HEAD:${TARGET_BRANCH}"
