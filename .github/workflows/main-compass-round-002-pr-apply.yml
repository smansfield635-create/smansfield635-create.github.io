name: Main Compass Round 002 PR Apply

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply-locked-two-file-candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Extract and execute locked patch script
        shell: bash
        run: |
          awk '
            /^[[:space:]]*python3 - <<'\''PY'\''$/ { capture=1; next }
            /^[[:space:]]*PY$/ && capture { capture=0; exit }
            capture {
              sub(/^          /, "")
              print
            }
          ' .github/workflows/main-compass-round-002-apply.yml > /tmp/main-compass-round-002.py
          test -s /tmp/main-compass-round-002.py
          python3 /tmp/main-compass-round-002.py

      - name: Remove temporary transport and validate final tree
        shell: bash
        run: |
          rm .github/workflows/main-compass-round-002-apply.yml
          rm .github/workflows/main-compass-round-002-pr-apply.yml
          rm .round-002-trigger
          git diff --check
          mapfile -t paths < <(git diff --name-only | sort)
          expected=(
            ".github/workflows/main-compass-round-002-apply.yml"
            ".github/workflows/main-compass-round-002-pr-apply.yml"
            ".round-002-trigger"
            "assets/compass/compass.css"
            "index.html"
          )
          if [[ "${paths[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected paths:\n%s\n' "${paths[*]}"
            exit 1
          fi

      - name: Commit clean two-file candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Main Compass architecture and context round 002 [round-002-applied]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
