name: H-Earth R06-C10 Candidate Preview 95504c V4

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h-earth-r06-c10-preview-95504c-v4.yml'

permissions:
  contents: write

concurrency:
  group: h-earth-r06-c10-preview-95504c-v4
  cancel-in-progress: false

jobs:
  materialize-prove-publish:
    if: github.head_ref == 'publication/h-earth-r06-c10-preview-95504c-001'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_HEAD: 95504c9927922318225da1d61fa303cec70497f9
      PUBLICATION_BRANCH: publication/h-earth-r06-c10-preview-95504c-001
      PREVIEW_ROOT: preview/h-earth/r06-c10/95504c9927922318225da1d61fa303cec70497f9
      PREVIEW_URL_PATH: /preview/h-earth/r06-c10/95504c9927922318225da1d61fa303cec70497f9/index.html
      SOURCE_ENTRY: showroom/globe/h-earth/index.html
      V1_WORKFLOW: .github/workflows/h-earth-r06-c10-preview-95504c.yml
      PLAYWRIGHT_VERSION: 1.55.0
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: publication/h-earth-r06-c10-preview-95504c-001
          fetch-depth: 0
          path: publication

      - name: Check out exact terrain candidate
        uses: actions/checkout@v4
        with:
          ref: 95504c9927922318225da1d61fa303cec70497f9
          fetch-depth: 1
          path: source

      - name: Materialize exact closure with runtime-selected renderers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,textwrap
          from pathlib import Path
          workflow=Path(os.environ['GITHUB_WORKSPACE'])/'publication'/os.environ['V1_WORKFLOW']
          text=workflow.read_text()
          match=re.search(r"- name: Materialize exact self-contained environment preview.*?python3 - <<'PY'\n(.*?)\n          PY",text,re.S)
          if not match: raise RuntimeError('V1_MATERIALIZER_BLOCK_NOT_FOUND')
          code=textwrap.dedent(match.group(1))
          old='queue = [entry]'
          new="""queue = [
              entry,
              PurePosixPath('showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js'),
              PurePosixPath('showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-round1-1f520809.js'),
              PurePosixPath('showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.js')
          ]"""
          if old not in code: raise RuntimeError('V1_QUEUE_PATCH_TARGET_NOT_FOUND')
          code=code.replace(old,new,1)
          exec(compile(code,'r06-c10-preview-materializer-v4.py','exec'),{'__name__':'__main__'})
          PY

      - name: Verify exact closure and renderer presence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])/'publication'/os.environ['PREVIEW_ROOT']
          src=Path(os.environ['GITHUB_WORKSPACE'])/'source'
          manifest=json.loads((root/'byte-manifest.json').read_text())
          assert hashlib.sha256((root/'byte-manifest.json').read_bytes()).hexdigest()==(root/'byte-manifest.sha256').read_text().split()[0]
          accounted={'index.html','byte-manifest.json','byte-manifest.sha256','publication-receipt.json'}
          for row in manifest['sourceEntries']:
              s=src/row['sourceFile']; d=root/row['previewFile']
              assert s.is_file() and d.is_file()
              assert subprocess.check_output(['git','-C',str(src),'rev-parse',f"{manifest['sourceHead']}:{row['sourceFile']}"],text=True).strip()==row['sourceBlob']
              assert hashlib.sha256(s.read_bytes()).hexdigest()==row['sourceSha256']
              assert hashlib.sha256(d.read_bytes()).hexdigest()==row['previewSha256']
              accounted.add(row['previewFile'])
          actual={str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          assert actual==accounted,(sorted(actual-accounted),sorted(accounted-actual))
          required={
              '_source/showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js',
              '_source/showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-round1-1f520809.js',
              '_source/showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.js'
          }
          assert required.issubset(actual),sorted(required-actual)
          print(json.dumps({'result':'PASS','sourceEntries':len(manifest['sourceEntries']),'previewFiles':len(actual)}))
          PY

      - name: Install Chromium verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw" "$RUNNER_TEMP/proof"
          cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium

      - name: Prove visible environment on desktop and touch mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4188 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/publication" >"$RUNNER_TEMP/proof/server.log" 2>&1 &
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:4188$PREVIEW_URL_PATH" >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          python3 - <<'PY'
          import os,re,textwrap
          from pathlib import Path
          workflow=Path(os.environ['GITHUB_WORKSPACE'])/'publication'/os.environ['V1_WORKFLOW']
          text=workflow.read_text()
          match=re.search(r"cat > \"\$RUNNER_TEMP/pw/verify\.mjs\" <<'JS'\n(.*?)\n          JS",text,re.S)
          if not match: raise RuntimeError('V1_BROWSER_VERIFIER_BLOCK_NOT_FOUND')
          (Path(os.environ['RUNNER_TEMP'])/'pw'/'verify.mjs').write_text(textwrap.dedent(match.group(1)))
          PY
          cd "$RUNNER_TEMP/pw"
          node verify.mjs
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])/'publication'/os.environ['PREVIEW_ROOT']
          receipt=json.loads((root/'publication-receipt.json').read_text())
          proof=json.loads((Path(os.environ['RUNNER_TEMP'])/'proof'/'browser-proof.summary.json').read_text())
          receipt.update({'status':'PASS_VISIBLE_ENVIRONMENT_PROVEN','desktopBrowserProof':'PASS','touchMobileBrowserProof':'PASS','candidateTerrainModuleLoaded':True,'visibleWorldFrameProven':True,'browserProofSummary':proof})
          (root/'publication-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY

      - name: Commit verified preview root
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/publication"
          git config user.name h-earth-preview-publisher
          git config user.email actions@users.noreply.github.com
          git add "$PREVIEW_ROOT"
          test -n "$(git status --porcelain -- "$PREVIEW_ROOT")"
          git commit -m 'Publish verified R06 C10 candidate environment preview'
          git push origin "HEAD:$PUBLICATION_BRANCH"

      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-r06-c10-preview-95504c-v4-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/proof
            publication/${{ env.PREVIEW_ROOT }}/byte-manifest.json
            publication/${{ env.PREVIEW_ROOT }}/byte-manifest.sha256
            publication/${{ env.PREVIEW_ROOT }}/publication-receipt.json
          if-no-files-found: warn
          retention-days: 30
