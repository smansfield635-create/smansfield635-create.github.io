name: H-Earth C2-R1 R1.6 Fragment Probe Correction

on:
  push:
    branches:
      - correction/h-earth-c2-r1-r1-6-fragment-probe-001
    paths:
      - '.github/workflows/h-earth-c2-r1-r1-6-fragment-probe-correction.yml'

permissions:
  contents: write

jobs:
  correct-fragment-probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: correction/h-earth-c2-r1-r1-6-fragment-probe-001
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact verifier-localization correction
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.r1-6-restrained-swash-foam-wetness.mjs')
          s = p.read_text()
          old = """for (let anchorX = -160; anchorX <= 160; anchorX += 8) {\n  const sample = at(anchorX, 4, maximumTime);\n  if (sample.valid !== true) continue;\n  alongshoreFoam.push(sample.foamIntensity);\n  alongshoreReach.push(sample.maximumLandwardReach);\n  alongshoreFragments.push(sample.foamFragmentation);\n}\n"""
          new = """for (let anchorX = -160; anchorX <= 160; anchorX += 8) {\n  const shorelineProbe = at(anchorX, 0, maximumTime);\n  if (shorelineProbe.valid !== true) continue;\n  const sample = at(\n    anchorX,\n    shorelineProbe.frontSignedInlandDistance,\n    maximumTime\n  );\n  if (sample.valid !== true) continue;\n  alongshoreFoam.push(sample.foamIntensity);\n  alongshoreReach.push(sample.maximumLandwardReach);\n  alongshoreFragments.push(sample.foamFragmentation);\n}\n"""
          if s.count(old) != 1:
              raise SystemExit('exact fixed-distance fragment probe not found once')
          p.write_text(s.replace(old, new))
          PY
          node --check h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.r1-6-restrained-swash-foam-wetness.mjs

      - name: Execute focused physical-front fragmentation gauge
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { getHEarthCanonicalShorelineZ } from './h-earth-3d/terrain/h-earth.terrain-field.js';
          import {
            H_EARTH_C2_R1_SWASH_FOAM_WETNESS,
            getHEarthC2R1SwashCyclePhaseOffset,
            sampleHEarthC2R1CoastalSwashFoamWetness
          } from './h-earth-3d/environment/h-earth.coastal-swash-foam-wetness.c2-r1.js';
          const fract = value => value - Math.floor(value);
          const standardDeviation = values => {
            const mean = values.reduce((sum, value) => sum + value, 0) / values.length;
            return Math.sqrt(values.reduce((sum, value) => sum + (value - mean) ** 2, 0) / values.length);
          };
          function shorelineFrame(anchorX) {
            const step = 0.5;
            const z0 = getHEarthCanonicalShorelineZ(anchorX - step);
            const z1 = getHEarthCanonicalShorelineZ(anchorX + step);
            const length = Math.hypot(1, z1 - z0);
            let waterwardNormal = { x: -(z1 - z0) / length, z: 1 / length };
            if (waterwardNormal.z < 0) waterwardNormal = { x: -waterwardNormal.x, z: -waterwardNormal.z };
            return { x: anchorX, z: getHEarthCanonicalShorelineZ(anchorX), waterwardNormal };
          }
          function worldAt(anchorX, signedInlandDistance) {
            const frame = shorelineFrame(anchorX);
            return {
              x: frame.x - frame.waterwardNormal.x * signedInlandDistance,
              z: frame.z - frame.waterwardNormal.z * signedInlandDistance
            };
          }
          function at(anchorX, signedInlandDistance, timeSeconds) {
            const world = worldAt(anchorX, signedInlandDistance);
            return sampleHEarthC2R1CoastalSwashFoamWetness(world.x, world.z, { timeSeconds });
          }
          const centerWorld = worldAt(0, 4);
          const centerOffset = getHEarthC2R1SwashCyclePhaseOffset(0, centerWorld.x);
          const maximumTime = fract(0.45 - centerOffset) * H_EARTH_C2_R1_SWASH_FOAM_WETNESS.cycleDurationSeconds;
          const foam = [];
          const fragments = [];
          for (let anchorX = -160; anchorX <= 160; anchorX += 8) {
            const shorelineProbe = at(anchorX, 0, maximumTime);
            if (shorelineProbe.valid !== true) throw new Error(`invalid shoreline probe ${anchorX}`);
            const sample = at(anchorX, shorelineProbe.frontSignedInlandDistance, maximumTime);
            if (sample.valid !== true) throw new Error(`invalid front probe ${anchorX}`);
            foam.push(sample.foamIntensity);
            fragments.push(sample.foamFragmentation);
          }
          const foamRange = Math.max(...foam) - Math.min(...foam);
          const foamStandardDeviation = standardDeviation(foam);
          const fragmentRange = Math.max(...fragments) - Math.min(...fragments);
          console.log(JSON.stringify({ foamRange, foamStandardDeviation, fragmentRange }, null, 2));
          if (!(foamStandardDeviation > 0.015 && fragmentRange > 0.18)) {
            throw new Error('physical-front fragmentation gauge did not pass frozen thresholds');
          }
          NODE

      - name: Commit verifier-only correction
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.r1-6-restrained-swash-foam-wetness.mjs'
          git add h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.r1-6-restrained-swash-foam-wetness.mjs
          git commit -m 'C2-R1 R1.6: localize fragmentation gauge at physical swash front'
          git push origin HEAD:correction/h-earth-c2-r1-r1-6-fragment-probe-001
