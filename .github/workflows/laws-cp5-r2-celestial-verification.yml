name: Laws CP5 R2 Celestial Verification

on:
  push:
    branches:
      - agent/laws-cp5-r2-celestial-visual-correction-001
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: laws-cp5-r2-celestial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-candidate:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/laws-cp5-r2-celestial-visual-correction-001'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/laws-cp5-r2-celestial-visual-correction-001
          fetch-depth: 0

      - name: Materialize bounded celestial correction once
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'CP5_R2_SOLAR_LARGE_CONVECTION_CELLS' laws/index.crystals.js; then
            echo "materialized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test "$(git rev-parse 0ff5741803926a6c218415587955aa867f93a0f7:laws/index.crystals.js)" = "43bb3659e24094074b72a45a1990bc66bd79e2be"
          test "$(git hash-object laws/index.interactions.js)" = "be365cc331ee5643f916abee204d4f5f45376c04"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("laws/index.crystals.js")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              '"2.1.0-exact-two-object-field"',
              '"2.2.0-cp5-r2-celestial-visual-correction"',
              1
          )

          research_pattern = re.compile(
              r'    research:\n      Object\.freeze\(\[\n        0\.52,\n        0\.34,\n        1\.0\n      \]\),'
          )
          text, count = research_pattern.subn(
              '    research:\\n      Object.freeze([\\n        0.82,\\n        0.84,\\n        0.88\\n      ]),',
              text,
              count=1
          )
          if count != 1:
              raise SystemExit(f"research palette replacement count={count}")

          text = text.replace(
              '    AUTHORITY_SOLAR:\n      Object.freeze({specular:0.18,rim:0.42,emissive:0.88,alpha:1.50,sparkle:0.00,halo:0.58,contrast:1.70}),',
              '    AUTHORITY_SOLAR:\\n      Object.freeze({specular:0.06,rim:0.24,emissive:0.46,alpha:1.00,sparkle:0.00,halo:0.50,contrast:1.92}),',
              1
          )
          text = text.replace(
              '    AUTHORITY_LUNAR:\n      Object.freeze({specular:0.08,rim:0.18,emissive:0.018,alpha:1.50,sparkle:0.00,halo:0.10,contrast:1.85}),',
              '    AUTHORITY_LUNAR:\\n      Object.freeze({specular:0.13,rim:0.22,emissive:0.012,alpha:1.00,sparkle:0.00,halo:0.055,contrast:1.78}),',
              1
          )

          text = text.replace(
              '    uniform float uHaloPass;\n    uniform float uHaloExpansion;',
              '    uniform float uHaloPass;\\n    uniform float uHaloExpansion;\\n    uniform float uSolarBody;',
              1
          )
          text = text.replace(
              '''      if (uHaloPass > 0.5) {
                pos += normalize(aNormal) * uHaloExpansion;
              }''',
              '''      if (uHaloPass > 0.5) {
                float solarWaveA = 0.5 + 0.5 * sin(aPosition.x * 13.0 + aPosition.y * 7.0 - aPosition.z * 9.0);
                float solarWaveB = 0.5 + 0.5 * sin(aPosition.x * 5.0 - aPosition.y * 17.0 + aPosition.z * 11.0 + 1.7);
                float solarPlume = pow(max(solarWaveA * solarWaveB, 0.0), 1.65);
                float irregularExpansion = mix(1.0, 0.24 + solarPlume * 1.34, uSolarBody);
                pos += normalize(aNormal) * uHaloExpansion * irregularExpansion;
              }''',
              1
          )

          fragment_anchor = '    uniform float uSaturation;\n'
          if text.count(fragment_anchor) != 1:
              raise SystemExit("fragment uniform anchor mismatch")
          text = text.replace(fragment_anchor, fragment_anchor + '    uniform float uSolarBody;\\n', 1)

          halo_start = text.index('      if (vHaloPass > 0.5) {')
          halo_end = text.index('      float diffuse =', halo_start)
          new_halo = '''      if (vHaloPass > 0.5) {
                float gasA = 0.5 + 0.5 * sin(vWorldPosition.x * 12.0 + vWorldPosition.y * 7.0 - vWorldPosition.z * 8.0 + uTime * 0.17);
                float gasB = 0.5 + 0.5 * sin(vWorldPosition.x * 5.0 - vWorldPosition.y * 15.0 + vWorldPosition.z * 11.0 - uTime * 0.11);
                float gasMask = clamp(0.18 + gasA * gasB * 1.05, 0.0, 1.0);
                float prominenceWisp = pow(max(gasA * gasB - 0.44, 0.0) * 1.78, 1.55);
                vec3 standardHalo =
                  base *
                  (
                    0.70 +
                    fresnel * 1.18 +
                    sideRim * 0.42 +
                    rear * 0.24
                  );
                vec3 stellarHalo =
                  mix(
                    vec3(1.0, 0.30, 0.018),
                    vec3(1.0, 0.82, 0.24),
                    clamp(gasA * 0.70 + fresnel * 0.30, 0.0, 1.0)
                  ) *
                  (
                    0.50 +
                    fresnel * 0.62 +
                    prominenceWisp * 0.74
                  );
                vec3 haloColor =
                  mix(standardHalo, stellarHalo, uSolarBody) *
                  uHaloStrength *
                  twinkle;
                float standardAlpha =
                  (
                    0.040 +
                    fresnel * 0.18 +
                    sideRim * 0.08
                  );
                float stellarAlpha =
                  (
                    0.018 +
                    fresnel * 0.105 +
                    prominenceWisp * 0.16
                  ) *
                  gasMask;
                float haloAlpha =
                  clamp(
                    mix(standardAlpha, stellarAlpha, uSolarBody) *
                    uProminence *
                    uHaloStrength,
                    0.0,
                    mix(0.34, 0.26, uSolarBody)
                  );
                gl_FragColor = vec4(haloColor, haloAlpha);
                return;
              }

          '''
          text = text[:halo_start] + new_halo + text[halo_end:]

          function_start = text.index('  function createCelestialSphereMesh(options = {}) {')
          function_end = text.index('  function lawColorForDirection(direction) {', function_start)
          new_function = r'''  function createCelestialSphereMesh(options = {}) {
            const segments = Math.max(24, options.segments || 48);
            const rings = Math.max(16, options.rings || 32);
            const radius = options.radius || 0.66;
            const mode = options.mode === "solar" ? "solar" : "lunar";
            const positions = [];
            const normals = [];
            const colors = [];

            /* CP5_R2_LUNAR_RELIEF_PRESERVED */
            const craters = [
              [0.42, 0.26, 0.86, 0.24, 0.052],
              [-0.36, 0.54, 0.76, 0.19, 0.043],
              [0.18, -0.48, 0.86, 0.16, 0.038],
              [-0.58, -0.20, 0.79, 0.21, 0.046],
              [0.64, -0.12, 0.76, 0.14, 0.033],
              [-0.08, 0.78, 0.62, 0.13, 0.030],
              [0.16, 0.08, 0.98, 0.09, 0.024],
              [-0.28, -0.62, 0.73, 0.11, 0.027]
            ].map(record => ({
              center: normalizeVector(record.slice(0, 3)),
              radius: record[3],
              depth: record[4]
            }));

            /* CP5_R2_SOLAR_LARGE_CONVECTION_CELLS */
            const solarCells = [
              [0.16, 0.92, 0.36, 1.00], [-0.44, 0.78, 0.45, 0.74],
              [0.66, 0.52, 0.54, 0.88], [0.82, 0.04, 0.57, 0.62],
              [0.44, -0.52, 0.73, 0.91], [-0.18, -0.72, 0.67, 0.70],
              [-0.72, -0.34, 0.61, 0.84], [-0.86, 0.18, 0.47, 0.58],
              [0.08, 0.34, 0.94, 0.78], [0.55, -0.18, -0.81, 0.66],
              [-0.38, 0.22, -0.90, 0.94], [0.18, -0.86, -0.47, 0.72],
              [-0.78, -0.12, -0.61, 0.82], [0.72, 0.48, -0.49, 0.60]
            ].map(record => ({
              center: normalizeVector(record.slice(0, 3)),
              energy: record[3]
            }));

            function deterministicField(x, y, z, frequency, phase) {
              return (
                Math.sin((x * 1.73 + y * 2.11 + z * 2.67) * frequency + phase) * 0.50 +
                Math.sin((x * 2.93 - y * 1.37 + z * 1.91) * frequency * 1.61 - phase * 0.73) * 0.30 +
                Math.sin((-x * 1.17 + y * 2.51 + z * 3.07) * frequency * 2.37 + phase * 1.29) * 0.20
              );
            }

            function smoothTransition(edge0, edge1, value) {
              const amount = clamp((value - edge0) / (edge1 - edge0), 0, 1);
              return amount * amount * (3 - 2 * amount);
            }

            function mixColor(a, b, amount) {
              const t = clamp(amount, 0, 1);
              return [
                a[0] + (b[0] - a[0]) * t,
                a[1] + (b[1] - a[1]) * t,
                a[2] + (b[2] - a[2]) * t
              ];
            }

            function craterField(nx, ny, nz) {
              let relief = 0;
              let albedo = 0;
              craters.forEach(crater => {
                const angularDistance = Math.acos(
                  clamp(nx * crater.center[0] + ny * crater.center[1] + nz * crater.center[2], -1, 1)
                );
                const normalizedDistance = angularDistance / crater.radius;
                const bowl = Math.exp(-normalizedDistance * normalizedDistance * 3.2);
                const rim = Math.exp(-Math.pow((normalizedDistance - 0.84) * 6.2, 2));
                const ejecta = Math.exp(-Math.pow((normalizedDistance - 1.18) * 3.4, 2));
                relief += rim * crater.depth * 0.92 - bowl * crater.depth * 1.18 + ejecta * crater.depth * 0.12;
                albedo += rim * 0.22 - bowl * 0.25 + ejecta * 0.035;
              });
              return { relief, albedo };
            }

            function nearestSolarCells(nx, ny, nz) {
              let first = Infinity;
              let second = Infinity;
              let energy = 0.72;
              solarCells.forEach(cell => {
                const distance = Math.acos(
                  clamp(nx * cell.center[0] + ny * cell.center[1] + nz * cell.center[2], -1, 1)
                );
                if (distance < first) {
                  second = first;
                  first = distance;
                  energy = cell.energy;
                } else if (distance < second) {
                  second = distance;
                }
              });
              return { first, second, energy };
            }

            function solarPalette(tone) {
              const darkRed = [0.42, 0.035, 0.006];
              const redOrange = [0.78, 0.105, 0.008];
              const deepOrange = [1.0, 0.285, 0.012];
              const gold = [1.0, 0.665, 0.055];
              const yellowWhite = [1.0, 0.985, 0.72];
              if (tone < 0.18) return mixColor(darkRed, redOrange, tone / 0.18);
              if (tone < 0.42) return mixColor(redOrange, deepOrange, (tone - 0.18) / 0.24);
              if (tone < 0.72) return mixColor(deepOrange, gold, (tone - 0.42) / 0.30);
              return mixColor(gold, yellowWhite, (tone - 0.72) / 0.28);
            }

            function surfaceSample(phi, theta) {
              const nx = Math.sin(phi) * Math.cos(theta);
              const ny = Math.cos(phi);
              const nz = Math.sin(phi) * Math.sin(theta);
              let relief = 1;
              let surfaceColor;

              if (mode === "solar") {
                const cell = nearestSolarCells(nx, ny, nz);
                const separation = cell.second - cell.first;
                const boundary = 1 - smoothTransition(0.018, 0.145, separation);
                const risingCenter = 1 - smoothTransition(0.07, 0.58, cell.first);
                const broad = deterministicField(nx, ny, nz, 3.2, 0.73);
                const turbulentFold = deterministicField(nx, ny, nz, 7.4, 2.17);
                const fine = deterministicField(nx, ny, nz, 25.0, 1.31);
                const activityA = Math.exp(-Math.pow(Math.acos(clamp(nx * 0.44 + ny * 0.18 + nz * 0.88, -1, 1)) / 0.16, 2) * 2.3);
                const activityB = Math.exp(-Math.pow(Math.acos(clamp(nx * -0.34 + ny * -0.36 + nz * 0.87, -1, 1)) / 0.13, 2) * 2.8);
                const activityC = Math.exp(-Math.pow(Math.acos(clamp(nx * 0.62 + ny * -0.56 + nz * -0.54, -1, 1)) / 0.18, 2) * 2.1);
                const activity = clamp(activityA * 0.95 + activityB * 0.80 + activityC * 0.68, 0, 1);
                const cellEnergy = clamp(
                  0.24 +
                  risingCenter * (0.48 + cell.energy * 0.20) -
                  boundary * 0.50 +
                  broad * 0.09 +
                  turbulentFold * 0.085 +
                  fine * 0.035 -
                  activity * 0.33,
                  0,
                  1
                );
                /* CP5_R2_SOLAR_ORANGE_RED_ACTIVITY */
                const tone = clamp(cellEnergy + (1 - boundary) * 0.08, 0, 1);
                surfaceColor = solarPalette(tone);
                relief +=
                  risingCenter * 0.0085 -
                  boundary * 0.0055 +
                  broad * 0.0038 +
                  turbulentFold * 0.0027 +
                  fine * 0.0012 +
                  activity * 0.0020;
              } else {
                const terrain = deterministicField(nx, ny, nz, 5.8, 1.43);
                const fineTerrain = deterministicField(nx, ny, nz, 15.8, 0.39);
                const maria = deterministicField(nx, ny, nz, 2.35, 2.73);
                const crater = craterField(nx, ny, nz);
                const light = normalizeVector([-0.62, 0.22, 0.75]);
                const illumination = nx * light[0] + ny * light[1] + nz * light[2];
                const terminator = 0.10 + 0.90 * smoothTransition(-0.24, 0.18, illumination);
                const region = clamp(0.55 + terrain * 0.12 + fineTerrain * 0.055 - Math.max(0, -maria) * 0.16 + crater.albedo, 0.16, 0.96);
                const shade = clamp(region * terminator, 0.055, 1.0);
                relief += terrain * 0.013 + fineTerrain * 0.0055 + crater.relief;
                /* CP5_R2_LUNAR_NEUTRAL_MATERIAL */
                surfaceColor = [
                  clamp(shade * 1.04, 0, 1),
                  clamp(shade * 1.025, 0, 1),
                  clamp(shade * 0.99, 0, 1)
                ];
              }

              const radial = radius * relief;
              return {
                radialNormal: [nx, ny, nz],
                position: [nx * radial, ny * radial, nz * radial],
                color: surfaceColor
              };
            }

            function localCross(a, b) {
              return [
                a[1] * b[2] - a[2] * b[1],
                a[2] * b[0] - a[0] * b[2],
                a[0] * b[1] - a[1] * b[0]
              ];
            }

            function localSubtract(a, b) {
              return [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
            }

            function point(ring, segment) {
              const phi = ring / rings * Math.PI;
              const theta = segment / segments * Math.PI * 2;
              const sample = surfaceSample(phi, theta);
              const phiStep = Math.PI / rings * 0.32;
              const thetaStep = Math.PI * 2 / segments * 0.32;
              const phiMinus = Math.max(0.0001, phi - phiStep);
              const phiPlus = Math.min(Math.PI - 0.0001, phi + phiStep);
              const tangentTheta = localSubtract(
                surfaceSample(phi, theta + thetaStep).position,
                surfaceSample(phi, theta - thetaStep).position
              );
              const tangentPhi = localSubtract(
                surfaceSample(phiPlus, theta).position,
                surfaceSample(phiMinus, theta).position
              );
              let normal = normalizeVector(localCross(tangentTheta, tangentPhi), sample.radialNormal);
              const outward = normal[0] * sample.radialNormal[0] + normal[1] * sample.radialNormal[1] + normal[2] * sample.radialNormal[2];
              if (outward < 0) normal = normal.map(value => -value);
              return { position: sample.position, normal, color: sample.color };
            }

            function push(vertex) {
              positions.push(...vertex.position);
              normals.push(...vertex.normal);
              colors.push(...vertex.color);
            }

            for (let ring = 0; ring < rings; ring += 1) {
              for (let segment = 0; segment < segments; segment += 1) {
                const next = (segment + 1) % segments;
                const a = point(ring, segment);
                const b = point(ring + 1, segment);
                const c = point(ring + 1, next);
                const d = point(ring, next);
                push(a); push(b); push(c); push(a); push(c); push(d);
              }
            }

            return Object.freeze({
              positions: new Float32Array(positions),
              normals: new Float32Array(normals),
              colors: new Float32Array(colors),
              vertexCount: positions.length / 3
            });
          }

          '''
          text = text[:function_start] + new_function + text[function_end:]

          uniform_anchor = '''        haloExpansion:
                  gl.getUniformLocation(
                    program,
                    "uHaloExpansion"
                  ),'''
          if text.count(uniform_anchor) != 1:
              raise SystemExit("uniform map anchor mismatch")
          text = text.replace(
              uniform_anchor,
              uniform_anchor + '''

                solarBody:
                  gl.getUniformLocation(
                    program,
                    "uSolarBody"
                  ),''',
              1
          )

          text = text.replace(
              '''    gl.uniform1f(
                renderer.uniforms.haloPass,
                haloPass ? 1 : 0
              );

              gl.uniform1f(
                renderer.uniforms.haloExpansion,
                0.075
              );''',
              '''    gl.uniform1f(
                renderer.uniforms.haloPass,
                haloPass ? 1 : 0
              );

              gl.uniform1f(
                renderer.uniforms.solarBody,
                node.id === "test" ? 1 : 0
              );

              gl.uniform1f(
                renderer.uniforms.haloExpansion,
                node.id === "test"
                  ? 0.13
                  : node.id === "research"
                    ? 0.025
                    : 0.075
              );''',
              1
          )

          old_bloom = '''    if (!bloomDisabled) {
                gl.depthMask(false);

                gl.blendFunc(
                  gl.SRC_ALPHA,
                  gl.ONE
                );

                nodes.forEach(
                  node => {
                    drawCalls +=
                      drawNode(
                        renderer,
                        node,
                        true
                      );
                  }
                );
              }'''
          new_bloom = '''    const haloNodes =
                bloomDisabled
                  ? nodes.filter(node => node.id === "test")
                  : nodes;

              /* CP5_R2_SOLAR_IRREGULAR_GASEOUS_CORONA */
              if (haloNodes.length) {
                gl.depthMask(false);

                gl.blendFunc(
                  gl.SRC_ALPHA,
                  gl.ONE
                );

                haloNodes.forEach(
                  node => {
                    drawCalls +=
                      drawNode(
                        renderer,
                        node,
                        true
                      );
                  }
                );
              }'''
          if text.count(old_bloom) != 1:
              raise SystemExit("bloom block mismatch")
          text = text.replace(old_bloom, new_bloom, 1)

          if text.count("CP5_R2_SOLAR_LARGE_CONVECTION_CELLS") != 1:
              raise SystemExit("solar marker count mismatch")
          if text.count("CP5_R2_LUNAR_NEUTRAL_MATERIAL") != 1:
              raise SystemExit("lunar marker count mismatch")
          path.write_text(text, encoding="utf-8")
          PY

          node --check laws/index.crystals.js
          test "$(git hash-object laws/index.interactions.js)" = "be365cc331ee5643f916abee204d4f5f45376c04"
          git diff --name-only | grep -qx 'laws/index.crystals.js'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add laws/index.crystals.js
          git commit -m 'Correct CP5 solar and lunar visual expression'
          git push origin HEAD:agent/laws-cp5-r2-celestial-visual-correction-001
          echo "materialized=true" >> "$GITHUB_OUTPUT"

      - name: Stop constructor run
        if: steps.materialize.outputs.materialized == 'true'
        run: echo "Candidate materialized; exact-head verification will execute on the synchronized head."

      - name: Verify exact candidate custody
        if: steps.materialize.outputs.materialized != 'true'
        id: custody
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          test "$(git hash-object laws/index.interactions.js)" = "be365cc331ee5643f916abee204d4f5f45376c04"
          node --check laws/index.crystals.js
          node --check verification/benchmark-tools/laws-cp5-r2-celestial-verification-v1/laws-cp5-r2-celestial-verification.mjs
          git diff --name-only 0ff5741803926a6c218415587955aa867f93a0f7 "$head" | sort | tee laws-cp5-r2-changed-paths.txt
          test "$(tr '\n' '|' < laws-cp5-r2-changed-paths.txt)" = ".github/workflows/laws-cp5-r2-celestial-verification.yml|laws/index.crystals.js|verification/benchmark-tools/laws-cp5-r2-celestial-verification-v1/laws-cp5-r2-celestial-verification.mjs|"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "blob=$(git hash-object laws/index.crystals.js)" >> "$GITHUB_OUTPUT"

      - name: Set up Chrome
        if: steps.materialize.outputs.materialized != 'true'
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Install pinned verifier dependencies
        if: steps.materialize.outputs.materialized != 'true'
        run: npm install --no-save --no-package-lock puppeteer-core@24.15.0 pngjs@7.0.0

      - name: Start exact-head local runtime
        if: steps.materialize.outputs.materialized != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/laws-cp5-r2-server.log 2>&1 &
          echo $! >/tmp/laws-cp5-r2-server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/laws/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/laws-cp5-r2-server.log
          exit 1

      - name: Execute four-profile celestial verification
        if: steps.materialize.outputs.materialized != 'true'
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          LAWS_ORIGIN: http://127.0.0.1:4173
          BASELINE_COMMIT: 0ff5741803926a6c218415587955aa867f93a0f7
          EXECUTION_COMMIT: ${{ steps.custody.outputs.head }}
          EXECUTION_BRANCH: agent/laws-cp5-r2-celestial-visual-correction-001
        run: node verification/benchmark-tools/laws-cp5-r2-celestial-verification-v1/laws-cp5-r2-celestial-verification.mjs

      - name: Upload CP5 R2 evidence
        if: steps.materialize.outputs.materialized != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: laws-cp5-r2-celestial-${{ steps.custody.outputs.head }}
          path: |
            laws-cp5-r2-celestial-verification.json
            laws-cp5-r2-changed-paths.txt
            laws-cp5-r2-celestial-screenshots/**
            /tmp/laws-cp5-r2-server.log
          retention-days: 30
