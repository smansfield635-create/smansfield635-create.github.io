name: H-Earth R06 C10 Prospective Candidate 002 Construction and Admission
on:
  push:
    branches:
      - control/r06-c10-prospective-candidate-002-construction-and-admission
    paths-ignore:
      - h-earth-3d/control-plane/r06-c10/candidate-admission/executions/prospective-candidate-002/**
permissions:
  contents: write
concurrency:
  group: h-earth-r06-c10-prospective-candidate-002
  cancel-in-progress: false
jobs:
  construct-and-admit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Construct and execute exact gate
        shell: bash
        run: |
          chmod +x .github/ai-router/carriers/r06-c10-prospective-candidate-002.operation.sh
          .github/ai-router/carriers/r06-c10-prospective-candidate-002.operation.sh
      - name: Upload construction and admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-r06-c10-prospective-candidate-002-admission
          path: /tmp/r06-c10-prospective-candidate-002/
          if-no-files-found: error
          retention-days: 90
