name: Methods and Models Showroom Exact-Head Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - "laws/research/methods-and-models/index.html"
      - "laws/research/methods-and-models/showroom.css"
      - "laws/research/methods-and-models/showroom.js"
      - "laws/research/methods-and-models/showroom-refinement.css"
      - "laws/research/methods-and-models/showroom-refinement.js"
      - "laws/research/methods-and-models/showroom-euclidean.css"
      - "laws/research/methods-and-models/showroom-euclidean-interaction.css"
      - "laws/research/methods-and-models/showroom-euclidean.js"
      - "laws/research/methods-and-models/rotational-text.css"
      - "laws/research/methods-and-models/rotational-text-responsive-repair.css"
      - "laws/research/methods-and-models/rotational-text-overlay-repair.css"
      - "laws/research/methods-and-models/rotational-text.js"
      - "laws/research/methods-and-models/canonical-records-v1.html"
      - ".github/workflows/methods-models-showroom-exact-head.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: methods-models-showroom-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXECUTION_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  METHODS_MODELS_ORIGIN: http://127.0.0.1:4173

jobs:
  exact-head-showroom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact execution head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXECUTION_COMMIT }}

      - name: Verify exact checkout identity
        run: test "$(git rev-parse HEAD)" = "$EXECUTION_COMMIT"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate public product JavaScript syntax
        run: |
          node --check laws/research/methods-and-models/showroom.js
          node --check laws/research/methods-and-models/showroom-refinement.js
          node --check laws/research/methods-and-models/showroom-euclidean.js
          node --check laws/research/methods-and-models/rotational-text.js

      - name: Start exact-head static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/methods-models-server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS "$METHODS_MODELS_ORIGIN/laws/research/methods-and-models/" >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/methods-models-server.log
          exit 1

      - name: Verify exact-head public product route and asset integrity
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$METHODS_MODELS_ORIGIN/laws/research/methods-and-models/" >/dev/null
          for asset in \
            rotational-text.js \
            rotational-text.css \
            rotational-text-responsive-repair.css \
            rotational-text-overlay-repair.css \
            showroom-euclidean.js \
            showroom-euclidean-interaction.css; do
            curl -fsS "$METHODS_MODELS_ORIGIN/laws/research/methods-and-models/$asset" >/dev/null
          done

      - name: Emit public integrity receipt and private qualification boundary
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipt={
            schema:'METHODS_MODELS_PUBLIC_EXACT_HEAD_INTEGRITY_RECEIPT_v1',
            result:'PASS_CLOSED',
            repository:process.env.GITHUB_REPOSITORY,
            candidateSha:process.env.EXECUTION_COMMIT,
            exactHeadVerified:true,
            syntaxValidated:true,
            publicRouteLoaded:true,
            requiredProductAssetsLoaded:true,
            terminalBrowserQualificationAuthority:false,
            privatePlaywrightQualificationRequired:true,
            privateQualificationModel:'PUBLIC_BUILD_PRIVATE_QUALIFICATION_EXACT_ARTIFACT_IDENTITY_v1',
            productAcceptanceCreated:false,
            mergeAuthorityCreated:false,
            userApprovalCreated:false
          };
          fs.writeFileSync('methods-models-public-exact-head-integrity.json',JSON.stringify(receipt,null,2)+'\n');
          NODE

      - name: Upload public integrity receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: methods-models-public-exact-head-integrity-${{ env.EXECUTION_COMMIT }}
          path: |
            methods-models-public-exact-head-integrity.json
            /tmp/methods-models-server.log
          if-no-files-found: warn
          retention-days: 30
