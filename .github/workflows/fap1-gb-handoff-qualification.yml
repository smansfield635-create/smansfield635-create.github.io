name: FAP1 G_B Handoff Qualification
on:
  pull_request:
    paths: ['.github/workflows/fap1-gb-handoff-qualification.yml']
permissions:
  contents: read
jobs:
  lod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8ffc2437c318c6e0c040bd121f1344cb2c62e751
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Execute deterministic ellipsoid promotion qualification
        run: |
          node --input-type=module <<'NODE'
          import {buildFAP1GPUWeatherPacket} from './showroom/globe/audralia/weather-presentation-reconciliation/fap1-gpu-weather-descriptors.mjs';
          import {buildFAP1SpatialWeatherObjects,evaluateFAP1SpatialLOD} from './showroom/globe/audralia/weather-presentation-reconciliation/fap1-spatial-lod.gb.mjs';
          const packet=buildFAP1GPUWeatherPacket({canonicalTimeHours:0}),objects=buildFAP1SpatialWeatherObjects({packet});
          const object=objects.find(o=>o.weatherClass==='LOW_CUMULIFORM')||objects[0],up=object.V_i.axisUp,c=object.V_i.center,vr=object.V_i.radii[1];
          const distances=[5600,4300,3500,2800,2200,1700,1450,1200,1000,800,720,400,0],samples=[];
          for(const surfaceDistance of distances){
            const eye=c.map((v,i)=>v+up[i]*(vr+surfaceDistance)),forward=up.map(v=>-v),state=evaluateFAP1SpatialLOD(objects,{eye,forward}),entry=state.objects.find(e=>e.object.ID_i===object.ID_i);
            samples.push({surfaceDistance,distanceToVolume:entry.distanceToVolume,inside:entry.inside,promoted:entry.localPromoted,alpha:entry.alpha});
          }
          const l=samples.map(x=>x.alpha.l),result={weatherId:object.ID_i,samples,distanceAccurate:samples.every(x=>Math.abs(x.distanceToVolume-x.surfaceDistance)<1e-5),macro:l.some(v=>v===0),overlap:l.some(v=>v>0&&v<.72),local:l.some(v=>v>=.72),monotonic:l.every((v,i)=>!i||v+1e-9>=l[i-1])};
          result.pass=result.distanceAccurate&&result.macro&&result.overlap&&result.local&&result.monotonic;console.log(JSON.stringify(result,null,2));if(!result.pass)process.exit(2);
          NODE
