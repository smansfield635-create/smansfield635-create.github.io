name: Repair Methods source comment chunk recovery
on:
  push:
    branches: [materialization/methods-adoption-translation-v1-001]
    paths:
      - '.github/workflows/methods-information-benchmark-router-registration-and-adoption-translation-materialization-v1.yml'
permissions:
  contents: write
jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Construct exact two-path recovery candidate
        env:
          EXPECTED_MAIN: ee0a7ae331ae9eb2d2b7d0800b0e636a58168072
          REPAIR_BRANCH: repair/methods-source-comment-chunk1-recovery-v1-001
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_MAIN"
          git switch --detach "$EXPECTED_MAIN"
          git switch -c "$REPAIR_BRANCH"
          python - <<'PY'
          import json
          from pathlib import Path
          carrier_path=Path('.github/ai-router/projects/methods-information-benchmark/adoption-review-source-package.carrier.v1.json')
          verifier_path=Path('.github/ai-router/projects/methods-information-benchmark/verify-router-registration-and-package.v1.mjs')
          c=json.loads(carrier_path.read_text())
          policy={"commentId":5187613092,"chunkIndex":1,"observedBase64Length":9285,"observedBase64Sha256":"3de2f39b8d937e8c7891ad67f1bb75f90eac38221963e9771a9e95fcd9994fcc","acceptedPrefixLength":6000,"acceptedPrefixSha256":"0d2cbc3c5151e46f21cb0a93128677ce289661b6c651126a5062ae3b81e368a8","trailingLength":3285,"trailingSha256":"d9d5810cdd31a5e7e13da9e1502271a3e3f55777d15101b826e935fef8621e56","trailingMustEqualChunkIndex":2,"trailingMustEqualPrefixLength":3285,"rejectedReplacementCommentId":5188010300,"recoveryClass":"EXACT_COMMENT_ID_PREFIX_AND_NEXT_CHUNK_CROSSCHECK_ONLY"}
          c['transport']['exactRecoveryPolicies']=[policy]
          c['transport']['rejectedReplacementCommentIds']=[5188010300]
          c['transport']['recoveryPolicyVersion']='EXACT_COMMENT_CHUNK_RECOVERY_v1'
          carrier_path.write_text(json.dumps(c,indent=2,sort_keys=True)+'\n')
          v=verifier_path.read_text()
          old_chunk="function chunk(body,k,c){let m=c.transport.marker+'\\n';if(typeof body!=='string'||!body.startsWith(m))bad('CHUNK_MARKER',k.commentId);let p=JSON.parse(body.slice(m.length));if(p.schema!=='METHODS_ADOPTION_SOURCE_PACKAGE_CHUNK_v1'||p.packageFingerprint!==F||p.zipSha256!==c.exactZip.sha256||p.chunkIndex!==k.chunkIndex||p.chunkCount!==c.exactZip.chunkCount||p.chunkSha256!==k.sha256||typeof p.base64!=='string'||p.base64.length!==k.length||sha(Buffer.from(p.base64))!==k.sha256)bad('CHUNK_INVALID',k.commentId);return p.base64}"
          old_source="function source(c){if(process.env.METHODS_SOURCE_ZIP_PATH)return fs.readFileSync(process.env.METHODS_SOURCE_ZIP_PATH);if(!process.env.GITHUB_TOKEN&&!process.env.GH_TOKEN)bad('TOKEN_MISSING');let s='';for(let k of[...c.transport.chunks].sort((a,b)=>a.chunkIndex-b.chunkIndex)){let q=JSON.parse(ex('gh',['api',`repos/${c.transport.repository}/issues/comments/${k.commentId}`]).stdout);if(q.id!==k.commentId)bad('COMMENT_ID',k.commentId);s+=chunk(q.body,k,c)}if(s.length!==c.exactZip.base64Length)bad('BASE64_LENGTH');return Buffer.from(s,'base64')}"
          new_chunk="function chunk(body,k,c){let m=c.transport.marker+'\\n';if(typeof body!=='string'||!body.startsWith(m))bad('CHUNK_MARKER',k.commentId);let p=JSON.parse(body.slice(m.length));if(p.schema!=='METHODS_ADOPTION_SOURCE_PACKAGE_CHUNK_v1'||p.packageFingerprint!==F||p.zipSha256!==c.exactZip.sha256||p.chunkIndex!==k.chunkIndex||p.chunkCount!==c.exactZip.chunkCount||p.chunkSha256!==k.sha256||typeof p.base64!=='string')bad('CHUNK_IDENTITY',k.commentId);let policy=(c.transport.exactRecoveryPolicies??[]).find(x=>x.commentId===k.commentId&&x.chunkIndex===k.chunkIndex);if(policy){if(p.base64.length!==policy.observedBase64Length||sha(Buffer.from(p.base64))!==policy.observedBase64Sha256)bad('CHUNK_RECOVERY_OBSERVED',k.commentId);let accepted=p.base64.slice(0,k.length),trailing=p.base64.slice(k.length);if(k.length!==policy.acceptedPrefixLength||k.sha256!==policy.acceptedPrefixSha256||accepted.length!==k.length||sha(Buffer.from(accepted))!==k.sha256||trailing.length!==policy.trailingLength||sha(Buffer.from(trailing))!==policy.trailingSha256)bad('CHUNK_RECOVERY_PREFIX',k.commentId);return{base64:accepted,trailing,recoveryPolicy:policy}}if(p.base64.length!==k.length||sha(Buffer.from(p.base64))!==k.sha256)bad('CHUNK_INVALID',k.commentId);return{base64:p.base64,trailing:null,recoveryPolicy:null}}"
          new_source="function source(c){if(process.env.METHODS_SOURCE_ZIP_PATH)return fs.readFileSync(process.env.METHODS_SOURCE_ZIP_PATH);if(!process.env.GITHUB_TOKEN&&!process.env.GH_TOKEN)bad('TOKEN_MISSING');let records=[];for(let k of[...c.transport.chunks].sort((a,b)=>a.chunkIndex-b.chunkIndex)){let q=JSON.parse(ex('gh',['api',`repos/${c.transport.repository}/issues/comments/${k.commentId}`]).stdout);if(q.id!==k.commentId)bad('COMMENT_ID',k.commentId);records.push({k,...chunk(q.body,k,c)})}let s='';for(let r of records){if(r.recoveryPolicy){let p=r.recoveryPolicy,n=records.find(x=>x.k.chunkIndex===p.trailingMustEqualChunkIndex);if(!n||r.trailing!==n.base64.slice(0,p.trailingMustEqualPrefixLength))bad('CHUNK_RECOVERY_CROSSCHECK',r.k.commentId)}s+=r.base64}if(s.length!==c.exactZip.base64Length)bad('BASE64_LENGTH');return Buffer.from(s,'base64')}"
          if v.count(old_chunk)!=1 or v.count(old_source)!=1:
              raise SystemExit('EXACT_VERIFIER_SOURCE_NOT_FOUND')
          v=v.replace(old_chunk,new_chunk).replace(old_source,new_source)
          verifier_path.write_text(v)
          PY
          node --check .github/ai-router/projects/methods-information-benchmark/verify-router-registration-and-package.v1.mjs
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          c=json.loads(Path('.github/ai-router/projects/methods-information-benchmark/adoption-review-source-package.carrier.v1.json').read_text())
          p=c['transport']['exactRecoveryPolicies'][0]
          assert p['commentId']==5187613092
          assert p['observedBase64Length']==9285
          assert p['acceptedPrefixLength']==6000
          assert p['trailingLength']==3285
          assert p['trailingMustEqualChunkIndex']==2
          assert p['trailingMustEqualPrefixLength']==3285
          print(hashlib.sha256(Path('.github/ai-router/projects/methods-information-benchmark/adoption-review-source-package.carrier.v1.json').read_bytes()).hexdigest())
          print(hashlib.sha256(Path('.github/ai-router/projects/methods-information-benchmark/verify-router-registration-and-package.v1.mjs').read_bytes()).hexdigest())
          PY
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/ai-router/projects/methods-information-benchmark/adoption-review-source-package.carrier.v1.json .github/ai-router/projects/methods-information-benchmark/verify-router-registration-and-package.v1.mjs "
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/ai-router/projects/methods-information-benchmark/adoption-review-source-package.carrier.v1.json .github/ai-router/projects/methods-information-benchmark/verify-router-registration-and-package.v1.mjs
          git commit -m "Bind exact recovery for malformed Methods chunk 1"
          git push origin "HEAD:$REPAIR_BRANCH"
