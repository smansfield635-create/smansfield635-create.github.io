name: H-Earth C2-R1 Complete World Integration

on:
  workflow_dispatch:
    inputs:
      expected_candidate_head:
        description: Exact candidate head to verify
        required: true
        type: string
  pull_request:
    branches: [integration/h-earth-c2-r1-baseline-001]
    paths:
      - '.github/workflows/h-earth-c2-r1-complete-world-integration.yml'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/h-earth.c2-r1.allowed-path-manifest.json'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/**'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.complete-world-integration.mjs'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/complete-world/**'

permissions:
  contents: read

env:
  EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.expected_candidate_head }}
  REVIEW_URL: http://127.0.0.1:4188/h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/index.html
  PLAYWRIGHT_VERSION: 1.55.0

jobs:
  exact-head-and-static-construction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Verify exact heads and path boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin rollback/h-earth-c2-r1-real-package-adapter-start-001:refs/remotes/origin/rollback/h-earth-c2-r1-real-package-adapter-start-001
          git fetch origin rollback/h-earth-c2-r1-startup-performance-start-001:refs/remotes/origin/rollback/h-earth-c2-r1-startup-performance-start-001
          test "$(git rev-parse origin/rollback/h-earth-c2-r1-real-package-adapter-start-001)" = "8d41e4eb85a8ef6a2162e46c2bc5d0a92892dc55"
          test "$(git rev-parse origin/rollback/h-earth-c2-r1-startup-performance-start-001)" = "f171852f3b453a1535fc29ed2798430814351084"
          cat > /tmp/corrective <<'PATHS'
          .github/workflows/h-earth-c2-r1-complete-world-integration.yml
          h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/complete-world/h-earth.c2-r1.complete-world-operation-ledger.json
          h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/complete-world/h-earth.c2-r1.complete-world-role3-entry.json
          h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/complete-world-render-package.js
          h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/complete-world.js
          h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.complete-world-integration.mjs
          PATHS
          git diff --name-only 8d41e4eb85a8ef6a2162e46c2bc5d0a92892dc55...HEAD | sort > /tmp/corrective-actual
          diff -u /tmp/corrective /tmp/corrective-actual
          cat > /tmp/overall <<'PATHS'
          .github/workflows/h-earth-c2-r1-complete-world-integration.yml
          h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/complete-world/h-earth.c2-r1.complete-world-operation-ledger.json
          h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/complete-world/h-earth.c2-r1.complete-world-role3-entry.json
          h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/complete-world/h-earth.c2-r1.complete-world-source-custody.json
          h-earth-3d/control-plane/coastal-morphology/c2-r1/h-earth.c2-r1.allowed-path-manifest.json
          h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/complete-world-persistent-renderer.js
          h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/complete-world-render-package.js
          h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/complete-world.js
          h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/identity.json
          h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/index.html
          h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.complete-world-integration.mjs
          PATHS
          git diff --name-only e03f211a472fd564b1ed4b8a00096c923a077528...HEAD | sort > /tmp/overall-actual
          diff -u /tmp/overall /tmp/overall-actual
      - name: Run synthetic and exact-cache integration tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/static"
          node h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.complete-world-integration.mjs | tee "$RUNNER_TEMP/static/static-test.log"
          sha256sum "$RUNNER_TEMP/static/static-test.log" > "$RUNNER_TEMP/static/static-test.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: h-earth-c2-r1-complete-world-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/static
          if-no-files-found: error
          retention-days: 30

  browser-execution-transport:
    needs: exact-head-and-static-construction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Provision browser and server
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p "$RUNNER_TEMP/browser/runtime" "$RUNNER_TEMP/browser/artifacts"
          cd "$RUNNER_TEMP/browser/runtime"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
          python3 -m http.server 4188 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" >"$RUNNER_TEMP/browser/artifacts/server.log" 2>&1 &
          for attempt in $(seq 1 60); do curl -fsS "$REVIEW_URL" >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Execute desktop and mobile browser matrix
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/browser/runtime/verify.mjs" <<'SCRIPT'
          import fs from 'node:fs';
          import path from 'node:path';
          import process from 'node:process';
          import { chromium } from 'playwright';
          const out=path.join(process.env.RUNNER_TEMP,'browser/artifacts');
          const assert=(v,c,d=null)=>{if(!v){const e=new Error(c);e.detail=d;throw e;}};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const touch=async(page,steps)=>page.evaluate(async steps=>{const c=document.getElementById('complete-world-canvas');for(const s of steps){for(const p of s.p){const up=s.t==='pointerup';c.dispatchEvent(new PointerEvent(s.t,{bubbles:true,cancelable:true,pointerId:p.id,pointerType:'touch',isPrimary:p.id===1,clientX:p.x,clientY:p.y,buttons:up?0:1,pressure:up?0:.5}));}await new Promise(r=>setTimeout(r,s.w??80));}},steps);
          async function input(page,mobile){
            if(!mobile){const b=await page.locator('#complete-world-canvas').boundingBox();assert(b,'CANVAS_BOX_MISSING');const x=b.x+b.width/2,y=b.y+b.height/2;await page.mouse.move(x,y);await page.mouse.down();await page.mouse.move(x+120,y,{steps:12});await page.mouse.up();await page.mouse.wheel(0,-240);await sleep(250);return;}
            await touch(page,[{t:'pointerdown',p:[{id:1,x:110,y:220}]},{t:'pointermove',p:[{id:1,x:205,y:220}],w:380},{t:'pointerup',p:[{id:1,x:205,y:220}]}]);
            await touch(page,[{t:'pointerdown',p:[{id:1,x:105,y:360},{id:2,x:225,y:360}]},{t:'pointermove',p:[{id:1,x:105,y:275},{id:2,x:225,y:275}],w:420},{t:'pointerup',p:[{id:1,x:105,y:275},{id:2,x:225,y:275}]}]);
            await touch(page,[{t:'pointerdown',p:[{id:1,x:125,y:330},{id:2,x:205,y:330}]},{t:'pointermove',p:[{id:1,x:70,y:330},{id:2,x:260,y:330}],w:420},{t:'pointerup',p:[{id:1,x:70,y:330},{id:2,x:260,y:330}]}]);
          }
          async function scenario(browser,cfg){
            const context=await browser.newContext({viewport:cfg.viewport,deviceScaleFactor:cfg.dpr,isMobile:cfg.mobile,hasTouch:cfg.mobile});
            await context.tracing.start({screenshots:true,snapshots:true,sources:true});
            const page=await context.newPage(),consoleRecords=[],pageErrors=[],requestFailures=[],httpRecords=[];
            page.on('console',m=>consoleRecords.push({type:m.type(),text:m.text()}));
            page.on('pageerror',e=>pageErrors.push({message:e.message}));
            page.on('requestfailed',r=>requestFailures.push({url:r.url(),failure:r.failure()}));
            page.on('response',r=>httpRecords.push({url:r.url(),status:r.status(),contentType:r.headers()['content-type']??null}));
            try{
              const started=Date.now();await page.goto(process.env.REVIEW_URL,{waitUntil:'domcontentloaded',timeout:120000});
              await page.waitForFunction(()=>{const s=window.H_EARTH_C2_R1_COMPLETE_WORLD;return s?.ready===true||s?.failed===true;},null,{timeout:120000,polling:250});
              const startupMilliseconds=Date.now()-started;
              const state=await page.evaluate(()=>{const s=window.H_EARTH_C2_R1_COMPLETE_WORLD;return s.failed?{failed:true,value:s.getFailureReceipt()}:{failed:false,value:s.getReceipt()};});
              assert(!state.failed,state.value.rootRejectionCode??'RUNTIME_FAILED',state.value);const before=state.value;
              assert(startupMilliseconds<=120000,'STARTUP_BUDGET_EXCEEDED',{startupMilliseconds});
              assert(before.packageBinding.counters.constructionMilliseconds<=105000,'CONSTRUCTION_BUDGET_EXCEEDED',before.packageBinding.counters);
              await page.screenshot({path:path.join(out,`${cfg.name}-before.png`),fullPage:true});await input(page,cfg.mobile);
              const after=await page.evaluate(()=>window.H_EARTH_C2_R1_COMPLETE_WORLD.getReceipt());
              const webgl=await page.evaluate(()=>document.getElementById('complete-world-canvas').getContext('webgl2') instanceof WebGL2RenderingContext);
              await page.screenshot({path:path.join(out,`${cfg.name}-after.png`),fullPage:true});
              const rb=before.renderer.counters,ra=after.renderer.counters,ib=before.intake.counters,ia=after.intake.counters;
              assert(webgl,'WEBGL2_NOT_BOUND');assert(ra.contextCreationCount===1,'CONTEXT_COUNT_NOT_ONE',ra);assert(ra.rendererInitializationCount===1,'RENDERER_INIT_NOT_ONE',ra);
              assert(ra.visiblePresentationCount>rb.visiblePresentationCount,'VISIBLE_FRAME_NOT_ADVANCED',{rb,ra});assert(ra.worldRebuildCount===0,'WORLD_REBUILD',ra);
              assert(ra.postInitializationResourceCreationCount===0,'POST_INIT_RESOURCE_CREATION',ra);assert(ra.postInitializationBufferUploadCount===0,'POST_INIT_BUFFER_UPLOAD',ra);
              assert(after.packageBinding.counters.candidateSampleFailureCount===0,'SAMPLE_FAILURE');assert(after.packageBinding.counters.boundTerrainVertexCount===10419,'TERRAIN_COUNT');assert(after.packageBinding.counters.boundShorelineVertexCount===299,'SHORELINE_COUNT');
              assert(ia.navigationProposalCount>ib.navigationProposalCount,'NAVIGATION_NOT_ADVANCED',{ib,ia});
              if(cfg.mobile){assert(ia.touchPointerEventCount>ib.touchPointerEventCount,'TOUCH_NOT_RECORDED');assert(ia.oneFingerLookProposalCount>ib.oneFingerLookProposalCount,'LOOK_NOT_RECORDED');assert(ia.twoFingerTravelProposalCount>ib.twoFingerTravelProposalCount,'TRAVEL_NOT_RECORDED');assert(ia.pinchProposalCount>ib.pinchProposalCount,'PINCH_NOT_RECORDED');assert(ia.releaseTerminationCount>ib.releaseTerminationCount,'RELEASE_NOT_RECORDED');}
              else{assert(ia.mousePointerEventCount>ib.mousePointerEventCount,'MOUSE_NOT_RECORDED');assert(ia.oneFingerLookProposalCount>ib.oneFingerLookProposalCount,'DESKTOP_LOOK_NOT_RECORDED');assert(ia.wheelEventCount>ib.wheelEventCount,'WHEEL_NOT_RECORDED');}
              assert(consoleRecords.filter(x=>x.type==='error').length===0,'CONSOLE_ERROR',consoleRecords);assert(pageErrors.length===0,'PAGE_ERROR',pageErrors);assert(requestFailures.length===0,'REQUEST_FAILURE',requestFailures);assert(httpRecords.filter(x=>x.status>=400&&!x.url.endsWith('/favicon.ico')).length===0,'HTTP_FAILURE',httpRecords);
              const receipt={receiptType:'H_EARTH_C2_R1_COMPLETE_WORLD_BROWSER_SCENARIO_v4',expectedHead:process.env.EXPECTED_HEAD,reviewUrl:process.env.REVIEW_URL,scenario:cfg,startupMilliseconds,webgl,before,after,consoleRecords,pageErrors,requestFailures,httpRecords};
              fs.writeFileSync(path.join(out,`${cfg.name}-receipt.json`),JSON.stringify(receipt,null,2));await context.tracing.stop({path:path.join(out,`${cfg.name}-trace.zip`)});return receipt;
            }catch(e){const progress=await page.evaluate(()=>window.H_EARTH_C2_R1_COMPLETE_WORLD?.getProgressReceipt?.()??null).catch(()=>null);fs.writeFileSync(path.join(out,`${cfg.name}-failure.json`),JSON.stringify({error:{name:e.name,message:e.message,detail:e.detail??null},progress,consoleRecords,pageErrors,requestFailures,httpRecords},null,2));await context.tracing.stop({path:path.join(out,`${cfg.name}-trace.zip`)}).catch(()=>{});throw e;}finally{await context.close();}
          }
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
          try{const configs=[{name:'desktop-1440x900',viewport:{width:1440,height:900},dpr:1,mobile:false},{name:'mobile-412x915',viewport:{width:412,height:915},dpr:2.625,mobile:true},{name:'mobile-390x844',viewport:{width:390,height:844},dpr:3,mobile:true}];const receipts=[];for(const c of configs)receipts.push(await scenario(browser,c));fs.writeFileSync(path.join(out,'browser-summary.json'),JSON.stringify({receiptType:'H_EARTH_C2_R1_COMPLETE_WORLD_BROWSER_TRANSPORT_SUMMARY_v4',expectedHead:process.env.EXPECTED_HEAD,reviewUrl:process.env.REVIEW_URL,roleBoundary:'ROLE_1_TRANSPORT_NOT_ROLE_3_CERTIFICATION',scenarios:receipts.map(r=>({name:r.scenario.name,startupMilliseconds:r.startupMilliseconds,constructionMilliseconds:r.after.packageBinding.counters.constructionMilliseconds}))},null,2));}finally{await browser.close();}
          SCRIPT
          cd "$RUNNER_TEMP/browser/runtime"
          node verify.mjs
      - name: Digest browser artifacts
        if: always()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/browser/artifacts"
          find . -maxdepth 1 -type f ! -name artifact-sha256.txt -print0 | sort -z | xargs -0 sha256sum > artifact-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h-earth-c2-r1-complete-world-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser/artifacts
          if-no-files-found: error
          retention-days: 30
