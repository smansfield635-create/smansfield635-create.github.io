name: Laws Destination Carousel Verification

on:
  pull_request:
    paths:
      - 'laws/index.destination-carousel.js'
      - 'laws/index.destination-carousel.css'
      - 'laws/index.mobile-background-tabs.js'
      - 'laws/index.mobile-background-tabs.core.js'
      - '.github/workflows/laws-destination-carousel-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Verify JavaScript syntax
        run: |
          node --check laws/index.destination-carousel.js
          node --check laws/index.mobile-background-tabs.js
          node --check laws/index.mobile-background-tabs.core.js
      - name: Verify carousel and orbit custody contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          js = Path('laws/index.destination-carousel.js').read_text()
          css = Path('laws/index.destination-carousel.css').read_text()
          loader = Path('laws/index.mobile-background-tabs.js').read_text()
          core = Path('laws/index.mobile-background-tabs.core.js').read_text()
          required_js = [
              'LAWS_DESTINATION_CAROUSEL_RUNTIME_v5',
              'pointerdown', 'pointermove', 'pointerup',
              'ArrowLeft', 'ArrowRight', 'Home', 'End',
              'LAWS_DESTINATION_CAROUSEL_CHANGED',
              'data-laws-root-rolodex-section',
              'swipe-step', 'swipe-cancel',
              'removeSurrogateControls',
              'surrogateNavigation: false',
              'discreteSwipe: true', 'oneGestureOneStep: true',
              'directionOnlyGesture: true', 'liveGestureGeometry: false',
              'atomicRotation: true', 'restoreOrbitState',
              'Return to Orbit'
          ]
          required_core = [
              'LAWS_ROOT_ROLODEX_RESPONSIVE_CONTINUITY_v5',
              'COMPASS_ORBIT = "O1"', 'DESTINATION_ORBIT = "O2"',
              'enforceCompassEntry', 'captureOrigin', 'restoreOrigin',
              'orbitViewportOffset', 'carouselIndex', 'rolodexId', 'destinationId',
              'LAWS_ORBIT_CUSTODY_RESTORED', 'DGB_LAWS_ORBIT_CUSTODY'
          ]
          required_css = [
              'position: absolute !important',
              '--laws-carousel-x', '--laws-carousel-z',
              'translateZ', 'rotateY',
              'data-carousel-relative',
              'prefers-reduced-motion',
              '.laws-rolodex-control',
              'display: none !important'
          ]
          for token in required_js:
              assert token in js, f'missing JS contract token: {token}'
          for token in required_core:
              assert token in core, f'missing orbit custody token: {token}'
          for token in required_css:
              assert token in css, f'missing CSS contract token: {token}'
          assert 'LAWS_ROOT_ROLODEX_RESPONSIVE_CONTINUITY_V5_ORBIT_CUSTODY' in loader
          assert 'LAWS_DESTINATION_CAROUSEL_RUNTIME_V5_20260816A' in loader
          for forbidden in ['dragPreview', 'PREVIEW_LIMIT', 'swipe-preview', 'state.velocity', 'projected =']:
              assert forbidden not in js, f'forbidden intermediate gesture geometry/token present: {forbidden}'
          for forbidden in ['control-previous', 'control-next', 'Previous item in', 'Next item in']:
              assert forbidden not in js, f'forbidden surrogate navigation present: {forbidden}'
          assert 'navigationAuthority: false' in js and 'contentAuthority: false' in js
          assert 'routeAuthority: false' in js and 'evidenceAuthority: false' in js
          print('Laws V5 atomic carousel + orbit custody exact-head static qualification PASS')
          PY
