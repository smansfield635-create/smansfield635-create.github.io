name: H-Earth BM5 Baked Material Engineering

on:
  pull_request:
    paths:
      - '.github/workflows/h-earth-bm5-baked-material-engineering.yml'
      - 'h-earth-3d/control-plane/post-cp2-round2/baked-material/h-earth.bm5-engineering-control.v1.json'
      - 'h-earth-3d/validation/baked-material/bm5/h-earth.bm5-candidate-shim.mjs'
      - 'h-earth-3d/validation/baked-material/bm5/h-earth.bm5-engineering-harness.html'
      - 'h-earth-3d/validation/baked-material/h-earth.bm5-engineering.runner.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-baked-material-engineering:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact BM5 execution head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bounded Chromium dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start exact BM5 candidate server
        run: |
          python3 -m http.server 4181 --bind 127.0.0.1 > /tmp/h-earth-bm5-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4181/h-earth-3d/validation/baked-material/bm5/h-earth.bm5-engineering-harness.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/h-earth-bm5-server.log
          exit 1
      - name: Execute BM5 fixed engineering suite
        env:
          BM5_HARNESS_URL: http://127.0.0.1:4181/h-earth-3d/validation/baked-material/bm5/h-earth.bm5-engineering-harness.html
        run: node h-earth-3d/validation/baked-material/h-earth.bm5-engineering.runner.mjs | tee /tmp/bm5.log
      - name: Upload BM5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-bm5-baked-material-engineering
          path: |
            h-earth-3d/validation/baked-material/h-earth.bm5-engineering.receipt.v1.json
            h-earth-3d/validation/baked-material/bm5-evidence/
            /tmp/bm5.log
            /tmp/h-earth-bm5-server.log
          retention-days: 90
      - name: Report BM5 engineering disposition
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipt = JSON.parse(fs.readFileSync('h-earth-3d/validation/baked-material/h-earth.bm5-engineering.receipt.v1.json', 'utf8'));
          const allowed = new Set([
            'ROUND2_BAKED_MATERIAL_PASS_ENGINEERING',
            'ROUND2_BAKED_MATERIAL_PARTIAL_IMPROVEMENT_REMAINS_BLOCKED',
            'ROUND2_BAKED_MATERIAL_NO_MATERIAL_IMPROVEMENT_STOP',
            'ROUND2_BAKED_MATERIAL_REGRESSION_ROLLBACK'
          ]);
          if (!allowed.has(receipt.disposition)) {
            console.error(JSON.stringify(receipt, null, 2));
            process.exit(1);
          }
          console.log(`BM5_DISPOSITION:${receipt.disposition}:${receipt.candidateSourceSha256}:${receipt.bakedMapSha256}`);
          NODE
