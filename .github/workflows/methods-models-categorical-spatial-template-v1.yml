name: Methods Models Categorical Spatial Template v1

on:
  push:
    branches:
      - experiment/methods-models-categorical-spatial-template-v1-001
  pull_request:
    branches:
      - candidate/methods-native-visual-architecture-v1-001
    paths:
      - '.github/workflows/methods-models-categorical-spatial-template-v1.yml'
      - 'verification/methods-models-categorical-spatial-template-v1/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operational-vertical-slice:
    runs-on: ubuntu-24.04
    env:
      CANDIDATE_HEAD: 9b7e241c56b9b5d189df7a93705186406c607867
      METHODS_ORIGIN: http://127.0.0.1:4173
      OUT_DIR: methods-models-categorical-spatial-template-v1-evidence
    steps:
      - name: Checkout exact spatial-template head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Preserve Methods and candidate boundaries
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$CANDIDATE_HEAD" HEAD -- laws/research/methods-and-models/
          git diff --exit-code "$CANDIDATE_HEAD" HEAD -- verification/methods-native-visual-architecture-v1/
          while IFS= read -r changed; do
            case "$changed" in
              .github/workflows/methods-models-categorical-spatial-template-v1.yml) ;;
              verification/methods-models-categorical-spatial-template-v1/*) ;;
              *) echo "UNAUTHORIZED_CHANGED_PATH:$changed"; exit 1 ;;
            esac
          done < <(git diff --name-only "$CANDIDATE_HEAD" HEAD)
          git diff --name-only "$CANDIDATE_HEAD" HEAD | sort | tee exact-changed-paths.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install pinned browser driver
        run: npm install --no-save --no-package-lock puppeteer-core@24.15.0

      - name: Validate registry, resolver, and source contracts
        shell: bash
        run: |
          set -euo pipefail
          for source in verification/methods-models-categorical-spatial-template-v1/*.mjs; do node --check "$source"; done
          node verification/methods-models-categorical-spatial-template-v1/validate.mjs | tee registry-validation.log

      - name: Start exact candidate server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/methods-spatial-server.log 2>&1 &
          for attempt in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:4173/verification/methods-models-categorical-spatial-template-v1/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/methods-spatial-server.log
          exit 1

      - name: Execute desktop and mobile operational observer
        shell: bash
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          node verification/methods-models-categorical-spatial-template-v1/observer.mjs | tee operational-observer.log

      - name: Package exact nonproduct evidence
        shell: bash
        run: |
          set -euo pipefail
          cp exact-changed-paths.txt "$OUT_DIR/"
          cp registry-validation.log "$OUT_DIR/"
          cp operational-observer.log "$OUT_DIR/"
          cp /tmp/methods-spatial-server.log "$OUT_DIR/server.log" || true
          cp verification/methods-models-categorical-spatial-template-v1/tool-admission-matrix.json "$OUT_DIR/"
          find "$OUT_DIR" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$OUT_DIR/SHA256SUMS"
          tar -czf methods-models-categorical-spatial-template-v1-evidence.tar.gz "$OUT_DIR"
          sha256sum methods-models-categorical-spatial-template-v1-evidence.tar.gz > methods-models-categorical-spatial-template-v1-evidence.tar.gz.sha256

      - name: Upload operational vertical-slice evidence
        uses: actions/upload-artifact@v4
        with:
          name: methods-models-categorical-spatial-template-v1-evidence
          path: |
            methods-models-categorical-spatial-template-v1-evidence/
            methods-models-categorical-spatial-template-v1-evidence.tar.gz
            methods-models-categorical-spatial-template-v1-evidence.tar.gz.sha256
            exact-changed-paths.txt
            registry-validation.log
            operational-observer.log
          retention-days: 30
