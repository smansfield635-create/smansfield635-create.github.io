name: Compass settlement mapping inspection

on:
  push:
    branches:
      - compass-a2f838-exact-qualification-temp

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6cc7deaed4ea562ea2f7b9147d234e68192abc30
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            assets/compass
          sparse-checkout-cone-mode: true
      - name: Print settlement authorities
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for f,names in [
            ('assets/compass/compass.crystals.js',['constellationAnchorVector','nearestPrimaryWing','settledConstellationQuaternion','finishConstellationDrag']),
            ('assets/compass/compass.controller.js',['CANONICAL_CONSTELLATION_EULER','canonicalConstellationOrientation','requestOrbitCommit'])
          ]:
            s=Path(f).read_text().splitlines()
            print('\n###',f)
            for name in names:
              hits=[i for i,l in enumerate(s) if name in l]
              print('\n##',name,'hits', [i+1 for i in hits])
              for i in hits[:2]:
                a=max(0,i-8); b=min(len(s),i+90)
                print('\n'.join(f'{j+1}: {s[j]}' for j in range(a,b)))
          PY
