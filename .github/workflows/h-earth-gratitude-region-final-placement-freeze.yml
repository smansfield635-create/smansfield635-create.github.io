              nextProgramBoundary:{finalPlacementProgramComplete:issues.length===0,nextConstructionProgramCandidates:['EXISTING_CAMERA_BOUND_ARRIVAL_PRESENTATION','MIRROR_MANOR_WITHIN_ACCEPTED_UPPER_SITE','VERIFIED_CAVERN_EXTERIOR_ENTRANCE'],deferred:['CAVERN_INTERIOR','FRONTIER_PLAINS','DISTRIBUTED_FUNCTIONAL_SYSTEMS_TOPOLOGY','DYNAMIC_SUN_AND_WORLD_TIME_ACTIVATION'],nextProgramExecutionAuthorized:false},
              authorityBoundary:boundary,
              stoppingBoundary:'STOP_BEFORE_FINAL_PLACEMENT_PR_MERGE',
              issues
            };
          }

          const a=execute(),b=execute(),at=`${JSON.stringify(a,null,2)}\n`,bt=`${JSON.stringify(b,null,2)}\n`,ad=dg(a),bd=dg(b),ash=sh(at),bsh=sh(bt),same=at===bt,issues=[...a.issues];
          if(ad!==bd)issues.push('NONDETERMINISTIC_EXECUTION_DIGEST_MISMATCH');
          if(!same)issues.push('NONDETERMINISTIC_RECEIPT_BYTES_MISMATCH');
          const base=baselineRun();
          const custody={
            schemaVersion:'H_EARTH_GRATITUDE_REGION_FP05_EXECUTION_CUSTODY_v1',
            eligible:a.eligible&&issues.length===0,
            status:a.eligible&&issues.length===0?'FP_05_EXECUTION_PASS_CLOSED':'FP_05_EXECUTION_FAIL_STOPPED',
            authorizedBaseHead:BASE,
            executedDetachedCandidateHead:git('rev-parse','HEAD'),
            workflowTriggerHead:process.env.FP05_WORKFLOW_TRIGGER_HEAD??null,
