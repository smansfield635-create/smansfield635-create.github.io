name: H-Earth B0 Morphology Baseline Freeze

on:
  pull_request:
    paths:
      - '.github/workflows/h-earth-b0-morphology-baseline-freeze.yml'
      - 'h-earth-3d/control-plane/post-cp2-round2/morphology/**'
      - 'h-earth-3d/validation/morphology/h-earth.b0-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-morphology-baseline-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact B0 candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute B0 verifier first pass
        run: node h-earth-3d/validation/morphology/h-earth.b0-morphology-baseline-freeze.mjs > /tmp/b0-first.json
      - name: Execute B0 verifier second pass
        run: node h-earth-3d/validation/morphology/h-earth.b0-morphology-baseline-freeze.mjs > /tmp/b0-second.json
      - name: Require identical receipts
        run: cmp /tmp/b0-first.json /tmp/b0-second.json
      - name: Upload B0 evidence
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-b0-morphology-baseline-freeze
          path: /tmp/b0-first.json
      - name: Enforce B0 pass
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync('/tmp/b0-first.json', 'utf8'));
          if (receipt.pass !== true || receipt.result !== 'B0_MORPHOLOGY_BASELINE_FREEZE_PASS_CLOSED') process.exit(1);
          console.log(`B0_PASS:${receipt.canonicalReceiptSha256}`);
          NODE
