                node: H_EARTH_RUN_8A_SCOPE_NODE,
                occurrence
              }));
            const base = baseFacade.resolveHEarthRepositoryRegistryOccurrence(input);
            return freeze({
              query: base.query,
              matches: [...base.matches, ...local],
              resolved: base.resolved || local.length > 0
            });
