name: H-Earth R06 C10 C5 Successor Materialization

on:
  push:
    branches:
      - recovery/r06-c10-c5-records-001
    paths:
      - .github/workflows/h-earth-r06-c10-c5-successor-materialization.yml

permissions:
  contents: write
  issues: read
  pull-requests: read

env:
  BASE_SHA: 38ebb449c6d81070a2a6668b41515ee5d76f4297
  EVIDENCE_BRANCH: evidence/r06-c10-c5-comment-finalizer-707468ea
  SUCCESSOR_BRANCH: role1/r06-c10-c5-successor-recovery-001
  BUNDLE_SHA256: f2cdd4700902c78be9b8d8ccaed2628759397eae8c5576cb49ee066500dd7ee6

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover and verify six exact records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work=/tmp/c5-successor-materialization
          mkdir -p "$work/comments" "$work/records"
          ids=(5173099262 5173104396 5173109832 5173114502 5173119638)
          for index in "${!ids[@]}"; do
            sequence=$((index+1))
            gh api "repos/smansfield635-create/smansfield635-create.github.io/issues/comments/${ids[$index]}" > "$work/comments/comment-${sequence}.json"
          done

          python3 - <<'PY'
          import base64, hashlib, json, pathlib, re
          root=pathlib.Path('/tmp/c5-successor-materialization')
          marker='H_EARTH_R06_C10_C5_RECORDS_CHUNK_v1'
          expected='f2cdd4700902c78be9b8d8ccaed2628759397eae8c5576cb49ee066500dd7ee6'
          chunks=[]
          for sequence in range(1,6):
              comment=json.loads((root/'comments'/f'comment-{sequence}.json').read_text())
              match=re.fullmatch(rf'{marker}:(\d+):(\d+):([0-9a-f]{{64}})\n([A-Za-z0-9+/=]+)',comment.get('body',''))
              if not match:
                  raise SystemExit(f'C5_COMMENT_FORMAT_MISMATCH:{sequence}')
              index,total,declared,payload=int(match.group(1)),int(match.group(2)),match.group(3),match.group(4)
              if index!=sequence or total!=5 or declared!=expected:
                  raise SystemExit(f'C5_COMMENT_IDENTITY_MISMATCH:{sequence}')
              chunks.append(payload)
          duplicate=3974
          if chunks[0][-duplicate:] != chunks[1][:duplicate]:
              raise SystemExit('C5_KNOWN_DUPLICATE_PREFIX_NOT_PRESENT')
          encoded=chunks[0]+chunks[1][duplicate:]+chunks[2]+chunks[3]+chunks[4]
          raw=base64.b64decode(encoded,validate=True)
          actual=hashlib.sha256(raw).hexdigest()
          if actual!=expected:
              raise SystemExit(f'C5_RECOVERED_BUNDLE_SHA256_MISMATCH:{actual}')
          (root/'c5-records.tgz').write_bytes(raw)
          print(json.dumps({'duplicatePrefixRemoved':duplicate,'bundleByteCount':len(raw),'bundleSha256':actual},indent=2))
          PY

          tar -xzf "$work/c5-records.tgz" -C "$work/records"

          receipt='h-earth-3d/control-plane/r06-c10/receipts/h-earth.r06-c10.role1.c5.cumulative-return-custody.receipt.v1.json'
          manifest='h-earth-3d/control-plane/r06-c10/tool-base/h-earth.r06-c10.role1.complete-member-manifest.v1.json'
          successor='h-earth-3d/control-plane/r06-c10/tool-base/h-earth.r06-c10.role1.nonproduct-tool-construction.locator.v1.json'
          predecessor='h-earth-3d/control-plane/r06-c10/tool-base/h-earth.r06-c10.geometry-articulation-shared-tool-base.locator.v1.json'
          handoff='h-earth-3d/control-plane/r06-c10/handoffs/h-earth.r06-c10.role6-to-role1.tool-construction-handoff.locator.v1.json'
          role3='h-earth-3d/control-plane/r06-c10/handoffs/h-earth.r06-c10.role1-to-role3.independent-tool-verification-handoff.locator.v1.json'

          cd "$work/records"
          echo 'e41200bcc156ad35806487568673e4d3e77df01ed00d8511a151531dc2c300f0  '"$receipt" | sha256sum -c -
          echo '783a7a2a199c8a0f05f780ce2f960cb8182eb45c5cc71cdb6b39dc30a448e98c  '"$manifest" | sha256sum -c -
          echo '1263e5db1e3650b277f81196e5d8a1189549e8aebc4b80c688937e466cb1866a  '"$successor" | sha256sum -c -
          echo 'b5447f21d7d361526e6935780c8c5b99012af1c1c3f099776119f2367a0ad6fb  '"$predecessor" | sha256sum -c -
          echo '6c378d29d04921ce569c0b0dca1c89fb800dc2e82e621a725703d1332d1b682b  '"$handoff" | sha256sum -c -
          echo 'd856c4bf8ed952c147b0af0b6f2a5d8392dd67ff38b447d8e59148db4336f6c9  '"$role3" | sha256sum -c -

      - name: Create exact seven-path successor branch
        run: |
          set -euo pipefail
          work=/tmp/c5-successor-materialization
          tool='h-earth-3d/tools/r06-c10/h-earth.r06-c10.package-and-recovery-emitter.v1.mjs'
          git fetch origin "$EVIDENCE_BRANCH" main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git show "origin/$EVIDENCE_BRANCH:$tool" > "$work/package-and-recovery-emitter.v1.mjs"
          echo 'e1b818bd081c063e7d9d4b96043276f2f3e0c32dfd8286b87d4952f94f2e7846  '"$work/package-and-recovery-emitter.v1.mjs" | sha256sum -c -

          git switch --detach "$BASE_SHA"
          git switch -c "$SUCCESSOR_BRANCH"
          cp -a "$work/records/h-earth-3d" ./
          mkdir -p "$(dirname "$tool")"
          cp "$work/package-and-recovery-emitter.v1.mjs" "$tool"

          expected_paths=(
            'h-earth-3d/control-plane/r06-c10/handoffs/h-earth.r06-c10.role1-to-role3.independent-tool-verification-handoff.locator.v1.json'
            'h-earth-3d/control-plane/r06-c10/handoffs/h-earth.r06-c10.role6-to-role1.tool-construction-handoff.locator.v1.json'
            'h-earth-3d/control-plane/r06-c10/receipts/h-earth.r06-c10.role1.c5.cumulative-return-custody.receipt.v1.json'
            'h-earth-3d/control-plane/r06-c10/tool-base/h-earth.r06-c10.geometry-articulation-shared-tool-base.locator.v1.json'
            'h-earth-3d/control-plane/r06-c10/tool-base/h-earth.r06-c10.role1.complete-member-manifest.v1.json'
            'h-earth-3d/control-plane/r06-c10/tool-base/h-earth.r06-c10.role1.nonproduct-tool-construction.locator.v1.json'
            'h-earth-3d/tools/r06-c10/h-earth.r06-c10.package-and-recovery-emitter.v1.mjs'
          )

          git add -- "${expected_paths[@]}"
          mapfile -t staged < <(git diff --cached --name-only | sort)
          mapfile -t expected < <(printf '%s\n' "${expected_paths[@]}" | sort)
          test "${#staged[@]}" -eq 7
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${staged[@]}")
          if printf '%s\n' "${staged[@]}" | grep -Eq '^(showroom/globe/h-earth/|h-earth-3d/terrain/|h-earth-3d/integration/)'; then
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Close R06 C10 Role 1 C5 cumulative return custody'
          final_head=$(git rev-parse HEAD)
          mapfile -t final_paths < <(git diff --name-only "$BASE_SHA" HEAD | sort)
          test "${#final_paths[@]}" -eq 7
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${final_paths[@]}")
          git push origin "HEAD:refs/heads/$SUCCESSOR_BRANCH"
          printf '{"schema":"H_EARTH_R06_C10_C5_SUCCESSOR_MATERIALIZATION_v1","base":"%s","head":"%s","branch":"%s","pathCount":7}\n' "$BASE_SHA" "$final_head" "$SUCCESSOR_BRANCH" > "$work/successor-materialization.json"
          cat "$work/successor-materialization.json"

      - name: Upload successor materialization evidence
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-r06-c10-c5-successor-materialization
          path: |
            /tmp/c5-successor-materialization/successor-materialization.json
            /tmp/c5-successor-materialization/c5-records.tgz
            /tmp/c5-successor-materialization/records
            /tmp/c5-successor-materialization/package-and-recovery-emitter.v1.mjs
          if-no-files-found: error
          retention-days: 30
