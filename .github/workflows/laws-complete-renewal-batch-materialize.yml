name: Laws complete renewal batch materialize

on:
  push:
    branches:
      - agent/laws-complete-renewal-batch-001
    paths:
      - .github/workflows/laws-complete-renewal-batch-materialize.yml
      - scripts/laws_complete_renewal_batch.py
      - scripts/laws_complete_renewal_batch_polish.py
      - scripts/laws_complete_renewal_signals_horizon_patch.py
      - assets/laws-destination/renewal-batch.css
      - laws/control-plane/renewal/laws-complete-renewal-battery-study-presentation-scope-v1.json
      - laws/control-plane/renewal/laws-complete-renewal-remaining-20-route-migration-manifest-v1.json
      - laws/control-plane/renewal/laws-complete-renewal-signals-battery-horizon-correction-v1.json
  pull_request:
    types:
      - ready_for_review
    branches:
      - main
    paths:
      - .github/workflows/laws-complete-renewal-batch-materialize.yml
      - scripts/laws_complete_renewal_batch.py
      - scripts/laws_complete_renewal_batch_polish.py
      - scripts/laws_complete_renewal_signals_horizon_patch.py
      - assets/laws-destination/renewal-batch.css
      - laws/control-plane/renewal/laws-complete-renewal-battery-study-presentation-scope-v1.json
      - laws/control-plane/renewal/laws-complete-renewal-remaining-20-route-migration-manifest-v1.json
      - laws/control-plane/renewal/laws-complete-renewal-signals-battery-horizon-correction-v1.json

permissions:
  contents: write

concurrency:
  group: laws-complete-renewal-batch-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.ref == 'refs/heads/agent/laws-complete-renewal-batch-001' ||
      (github.event_name == 'pull_request' && github.event.pull_request.number == 493 && github.event.pull_request.head.ref == 'agent/laws-complete-renewal-batch-001')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact batch branch
        uses: actions/checkout@v4
        with:
          ref: agent/laws-complete-renewal-batch-001
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize once or reuse existing product candidate
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f laws/control-plane/renewal/laws-complete-renewal-batch-materialization-receipt-v1.json ]]; then
            echo 'Existing materialized candidate detected; regeneration and nested source wrapping are prohibited.'
          else
            python scripts/laws_complete_renewal_batch.py
          fi

      - name: Apply bounded presentation polish
        run: python scripts/laws_complete_renewal_batch_polish.py

      - name: Apply exact Signals 20-cycle completeness correction
        run: python scripts/laws_complete_renewal_signals_horizon_patch.py

      - name: Verify generated route and presentation markers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          receipt = json.loads((root / 'laws/control-plane/renewal/laws-complete-renewal-batch-materialization-receipt-v1.json').read_text())
          assert receipt['remaining_child_routes_materialized'] == 20
          assert receipt['battery_public_surface_scope'] == 27
          assert receipt['product_file_count'] == 29
          assert receipt['presentation_polish']['formula_node_split_rule'] == 'ARROWS_ONLY_PLUS_SIGNS_PRESERVED'
          assert receipt['representative_battery_completeness_correction']['path'] == 'laws/categories/flow/signals/index.html'

          for path in receipt['product_files_written']:
              text = (root / path).read_text(encoding='utf-8')
              if path == 'laws/index.html':
                  assert 'lr-battery-landing' in text
                  assert 'BATTERY_COHERENCE_HELDOUT_STUDY_v1' in text
                  continue
              assert 'data-laws-complete-renewal="v1"' in text, path
              assert '/assets/laws-destination/renewal.css' in text, path
              assert '/assets/laws-destination/renewal-navigation.css' in text, path
              assert '/assets/laws-destination/renewal-batch.css' in text, path
              assert '/assets/laws-destination/renewal.js' in text, path
              assert 'lr-topbar' in text and 'lr-nav' in text, path
              assert 'lr-boundary' in text, path
              assert 'lr-audit' in text, path

          signals = (root / 'laws/categories/flow/signals/index.html').read_text(encoding='utf-8')
          assert 'the defined near-term event was evaluated within the next 20 cycles' in signals

          cycles = (root / 'laws/categories/flow/cycles/index.html').read_text(encoding='utf-8')
          assert '<strong>STATE_(t+1); cumulative effect = Σ cycle effects</strong>' in cycles
          assert '<strong>STATE_(t</strong>' not in cycles

          expected_titles = {
              'laws/battery-heldout-study/index.html': 'Battery health held-out study · Laws',
              'laws/scientific-law/battery-heldout-study/index.html': 'Battery health held-out study · Scientific Law · Laws',
              'laws/categories/reality/battery-heldout-study/index.html': 'Battery health held-out study · Reality · Laws',
          }
          for path, title in expected_titles.items():
              assert f'<title>{title}</title>' in (root / path).read_text(encoding='utf-8')
          print('Generated, polished, and representative-complete presentation contract: PASS')
          PY

      - name: Normalize generated whitespace
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          receipt_path = Path('laws/control-plane/renewal/laws-complete-renewal-batch-materialization-receipt-v1.json')
          receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
          paths = list(receipt['product_files_written']) + ['laws/categories/flow/signals/index.html']
          for raw_path in paths:
              path = Path(raw_path)
              text = path.read_text(encoding='utf-8')
              normalized = '\n'.join(line.rstrip() for line in text.splitlines()) + '\n'
              path.write_text(normalized, encoding='utf-8')
          print('Generated whitespace normalization: PASS')
          PY

      - name: Check HTML and whitespace integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re

          receipt = Path('laws/control-plane/renewal/laws-complete-renewal-batch-materialization-receipt-v1.json')
          assert receipt.exists()
          for path in Path('laws').rglob('*.html'):
              text = path.read_text(encoding='utf-8', errors='strict')
              if 'data-laws-complete-renewal="v1"' not in text and path.as_posix() != 'laws/categories/flow/signals/index.html':
                  continue
              assert re.search(r'<!doctype html>', text, re.I), path
              assert re.search(r'<html\b', text, re.I), path
              assert re.search(r'</html>', text, re.I), path
              assert text.count('id="main"') == 1, path
          print('Generated HTML structural checks: PASS')
          PY

      - name: Commit polished product candidate
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No product polish changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add laws frontier/energy/battery-coherence-study/index.html
          git commit -m 'Complete Signals battery horizon context'
          git push origin HEAD:agent/laws-complete-renewal-batch-001
