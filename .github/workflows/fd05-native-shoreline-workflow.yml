name: FD05 clean native shoreline review branch

on:
  pull_request:
    branches:
      - agent/fd05-native-shoreline-work-001
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-clean-review-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fd05-native-shoreline-work-001
          fetch-depth: 0

      - name: Preserve validated harnesses and construct clean candidate
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse origin/main)" = "cbde5b50470a528954f634baf8045674c2079cf0"
          git show origin/agent/fd05-native-shoreline-work-001:.fd05/test-native-shoreline.mjs > /tmp/test-native-shoreline.mjs
          git show origin/agent/fd05-native-shoreline-work-001:.fd05/test-native-shoreline-browser.mjs > /tmp/test-native-shoreline-browser.mjs
          git show origin/agent/fd05-index-compositor-viewport-work-001:.fd05/test-index-viewport.mjs > /tmp/test-index-viewport.mjs
          git checkout -B agent/fd05-native-shoreline-001 origin/main
          git checkout origin/agent/fd05-native-shoreline-work-001 -- \
            showroom/globe/h-earth/render/geometry-water.js \
            showroom/globe/h-earth/render/geometry-foam.js \
            showroom/globe/h-earth/render/shoreline-preview.js \
            h-earth-3d/integration/h-earth.post-west-admitted-geometry-transfer.js \
            showroom/globe/h-earth/admitted-geometry-frame.js \
            showroom/globe/h-earth/compositor.js \
            showroom/globe/h-earth/renderer.js \
            showroom/globe/h-earth/index.html
          EXPECTED="$(printf '%s\n' \
            h-earth-3d/integration/h-earth.post-west-admitted-geometry-transfer.js \
            showroom/globe/h-earth/admitted-geometry-frame.js \
            showroom/globe/h-earth/compositor.js \
            showroom/globe/h-earth/index.html \
            showroom/globe/h-earth/render/geometry-foam.js \
            showroom/globe/h-earth/render/geometry-water.js \
            showroom/globe/h-earth/render/shoreline-preview.js \
            showroom/globe/h-earth/renderer.js | sort)"
          ACTUAL="$(git diff --cached --name-only | sort)"
          test "$ACTUAL" = "$EXPECTED"

      - name: Verify syntax and source corridor
        run: |
          node --check showroom/globe/h-earth/render/geometry-water.js
          node --check showroom/globe/h-earth/render/geometry-foam.js
          node --check showroom/globe/h-earth/render/shoreline-preview.js
          node --check h-earth-3d/integration/h-earth.post-west-admitted-geometry-transfer.js
          node --check showroom/globe/h-earth/admitted-geometry-frame.js
          node --check showroom/globe/h-earth/compositor.js
          node --check showroom/globe/h-earth/renderer.js
          mkdir -p .fd05/native-shoreline-output
          cp /tmp/test-native-shoreline.mjs .fd05-test-native-shoreline.mjs
          cp /tmp/test-index-viewport.mjs .fd05-test-index-viewport.mjs
          node --experimental-default-type=module .fd05-test-native-shoreline.mjs
          node --experimental-default-type=module .fd05-test-index-viewport.mjs

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run mobile and desktop route gates
        run: |
          cp /tmp/test-native-shoreline-browser.mjs .fd05-test-native-shoreline-browser.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/fd05-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          H_EARTH_TEST_BASE_URL='http://127.0.0.1:8765/showroom/globe/h-earth/' node .fd05-test-native-shoreline-browser.mjs

      - name: Upload clean candidate validation
        uses: actions/upload-artifact@v4
        with:
          name: fd05-clean-native-shoreline-validation
          path: |
            .fd05/native-shoreline-output/*.json
            .fd05/native-shoreline-output/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Publish one-commit eight-file review branch
        run: |
          rm -rf node_modules package-lock.json .fd05
          rm -f .fd05-test-native-shoreline.mjs .fd05-test-native-shoreline-browser.mjs .fd05-test-index-viewport.mjs
          git checkout -- package.json 2>/dev/null || true
          EXPECTED="$(printf '%s\n' \
            h-earth-3d/integration/h-earth.post-west-admitted-geometry-transfer.js \
            showroom/globe/h-earth/admitted-geometry-frame.js \
            showroom/globe/h-earth/compositor.js \
            showroom/globe/h-earth/index.html \
            showroom/globe/h-earth/render/geometry-foam.js \
            showroom/globe/h-earth/render/geometry-water.js \
            showroom/globe/h-earth/render/shoreline-preview.js \
            showroom/globe/h-earth/renderer.js | sort)"
          ACTUAL="$(git diff --cached --name-only | sort)"
          test "$ACTUAL" = "$EXPECTED"
          test -z "$(git status --short | awk '$1 == "??" {print $2}')"
          echo "BASE_COMMIT=$(git rev-parse HEAD)"
          for FILE in $EXPECTED
          do
            echo "$FILE bytes=$(wc -c < "$FILE" | tr -d ' ') sha256=$(sha256sum "$FILE" | awk '{print $1}') blob=$(git hash-object "$FILE")"
          done
          git config user.name "OpenAI Engineering Agent"
          git config user.email "engineering-agent@users.noreply.github.com"
          git commit -m "Materialize minimum native shoreline context"
          git push --force origin HEAD:agent/fd05-native-shoreline-001
