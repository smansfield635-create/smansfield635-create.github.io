name: Temporary CP2 Narrative Spine Verify

on:
  pull_request:
    paths:
      - 'control-plane/whole-estate/narrative-spine-constitution-v1/**'
      - '.github/workflows/temporary-cp2-narrative-spine-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-checkpoint-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Checkpoint 2 narrative spine constitution
        run: node control-plane/whole-estate/narrative-spine-constitution-v1/verify.v1.mjs
