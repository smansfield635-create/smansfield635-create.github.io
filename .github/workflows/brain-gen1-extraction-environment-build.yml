name: Brain Gen1 Extraction Environment Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/compass/brain-anatomical-basis/extraction-environment/Dockerfile'
      - '.github/workflows/brain-gen1-extraction-environment-build.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build local exact candidate
        run: |
          set -euo pipefail
          docker build --pull=false -t brain-gen1-extraction:${GITHUB_SHA} research/compass/brain-anatomical-basis/extraction-environment
      - name: Frozen toolchain probes
        run: |
          set -euo pipefail
          IMAGE=brain-gen1-extraction:${GITHUB_SHA}
          docker run --rm "$IMAGE" bash -lc 'command -v recon-all; recon-all -version'
          docker run --rm "$IMAGE" bash -lc 'command -v segmentBS.sh'
          docker run --rm "$IMAGE" python3 - <<'PY'
          import vtk
          assert vtk.vtkVersion.GetVTKVersion() == '9.3.0', vtk.vtkVersion.GetVTKVersion()
          assert hasattr(vtk, 'vtkFlyingEdges3D')
          print('VTK_VERSION=9.3.0')
          print('VTK_FLYING_EDGES_3D=PASS')
          PY
      - name: Push and bind immutable manifest on main dispatch only
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/brain-gen1-extraction
        run: |
          set -euo pipefail
          LOWER_IMAGE=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker tag brain-gen1-extraction:${GITHUB_SHA} "$LOWER_IMAGE:${GITHUB_SHA}"
          docker push "$LOWER_IMAGE:${GITHUB_SHA}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$LOWER_IMAGE:${GITHUB_SHA}" 2>/dev/null || true)
          if [ -z "$DIGEST" ]; then
            docker pull "$LOWER_IMAGE:${GITHUB_SHA}"
            DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$LOWER_IMAGE:${GITHUB_SHA}")
          fi
          printf '%s\n' "$DIGEST" | tee child-image-digest.txt
          test -n "$DIGEST"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        with:
          name: brain-gen1-extraction-environment-${{ github.run_id }}
          path: child-image-digest.txt
          if-no-files-found: error
