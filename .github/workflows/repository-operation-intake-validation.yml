  SOURCE_ISSUE: '656'
  SOURCE_PR: '665'
  SOURCE_CANDIDATE: 935e6c9243df60d2362b1bb834df49412b610496
  SOURCE_MERGE: 1a7f674bed83730ac37b40c38dbbde5d2e0593a9
  INTERACTION_CONTRACT_ID: METHODS_SPATIAL_DATABASE_TEXT_FIRST_INTERACTION_STATE_CONTRACT_v2
