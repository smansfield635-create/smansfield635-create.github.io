name: H-Earth C2-R1 Immutable Preview Builder

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/h-earth-c2-r1-immutable-preview-builder.yml'

permissions:
  contents: write

concurrency:
  group: h-earth-c2-r1-immutable-preview-builder
  cancel-in-progress: false

jobs:
  materialize-and-verify:
    if: github.head_ref == 'publication/h-earth-c2-r1-immutable-preview-a699c5a-001'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_HEAD: a699c5a64e2bf54d950a69c839c3d9ee41b6514f
      PUBLICATION_BRANCH: publication/h-earth-c2-r1-immutable-preview-a699c5a-001
      PREVIEW_ROOT: preview/h-earth/c2-r1/a699c5a64e2bf54d950a69c839c3d9ee41b6514f
      PREVIEW_URL_PATH: /preview/h-earth/c2-r1/a699c5a64e2bf54d950a69c839c3d9ee41b6514f/index.html
      PLAYWRIGHT_VERSION: 1.55.0
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: publication/h-earth-c2-r1-immutable-preview-a699c5a-001
          fetch-depth: 0
          path: publication

      - name: Check out exact verified source candidate
        uses: actions/checkout@v4
        with:
          ref: a699c5a64e2bf54d950a69c839c3d9ee41b6514f
          fetch-depth: 1
          path: source

      - name: Materialize exact dependency closure and byte manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, subprocess
          from pathlib import Path, PurePosixPath

          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          source_root = workspace / 'source'
          publication_root = workspace / 'publication'
          preview_rel = PurePosixPath(os.environ['PREVIEW_ROOT'])
          out_root = publication_root / Path(str(preview_rel))
          public_prefix = '/' + str(preview_rel).strip('/') + '/'
          source_head = os.environ['SOURCE_HEAD']
          entry = PurePosixPath('h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/index.html')

          if out_root.exists():
              shutil.rmtree(out_root)
          out_root.mkdir(parents=True)

          spec_re = re.compile(r"(?:from\s+|import\s*\(\s*|import\s+|fetch\s*\(\s*)['\"]([^'\"]+)['\"]")
          html_re = re.compile(r"(?:src|href)\s*=\s*['\"]([^'\"]+)['\"]", re.I)
          text_ext = {'.js', '.mjs', '.html', '.json', '.css', '.txt', '.svg'}

          def resolve(owner: PurePosixPath, spec: str):
              if spec.startswith(('http://','https://','data:','blob:','#')):
                  return None
              if spec.startswith('/'):
                  candidate = PurePosixPath(spec.lstrip('/'))
              elif spec.startswith('.'):
                  candidate = owner.parent.joinpath(spec)
              else:
                  return None
              normalized = PurePosixPath(os.path.normpath(str(candidate)).replace('\\','/'))
              path = source_root / Path(str(normalized))
              if not path.is_file():
                  raise FileNotFoundError(f'UNRESOLVED_RUNTIME_DEPENDENCY:{owner}:{spec}:{normalized}')
              return normalized

          queue = [entry]
          seen = set()
          while queue:
              item = queue.pop(0)
              if item in seen:
                  continue
              path = source_root / Path(str(item))
              if not path.is_file():
                  raise FileNotFoundError(f'SOURCE_FILE_MISSING:{item}')
              seen.add(item)
              if path.suffix.lower() not in text_ext:
                  continue
              text = path.read_text(encoding='utf-8')
              specs = [m.group(1) for m in spec_re.finditer(text)]
              if path.suffix.lower() in {'.html','.svg'}:
                  specs += [m.group(1) for m in html_re.finditer(text)]
              for spec in specs:
                  dep = resolve(item, spec)
                  if dep is not None and dep not in seen:
                      queue.append(dep)

          def rebase(text: str):
              def repl(match):
                  whole = match.group(0)
                  spec = match.group(1)
                  if not spec.startswith('/'):
                      return whole
                  rebased = public_prefix + '_source/' + spec.lstrip('/')
                  start, end = match.span(1)
                  rel_start = start - match.start(0)
                  rel_end = end - match.start(0)
                  return whole[:rel_start] + rebased + whole[rel_end:]
              text = spec_re.sub(repl, text)
              text = html_re.sub(repl, text)
              return text

          def sha256(data: bytes):
              return hashlib.sha256(data).hexdigest()

          source_entries = []
          for item in sorted(seen, key=str):
              source_path = source_root / Path(str(item))
              source_bytes = source_path.read_bytes()
              source_blob = subprocess.check_output(
                  ['git','-C',str(source_root),'hash-object',str(item)], text=True
              ).strip()
              transform = 'NONE'
              if item == entry:
                  text = source_bytes.decode('utf-8')
                  text = text.replace(
                      '<html lang="en"',
                      '<html lang="en" data-preview-class="IMMUTABLE_UNLINKED_NONPRODUCTION_REVIEW" data-source-head="a699c5a64e2bf54d950a69c839c3d9ee41b6514f"',
                      1
                  )
                  text = text.replace(
                      '<header>',
                      '<header><div class="badge" style="border-color:#f4c86a;color:#ffe9a8;background:#5a430f66">Nonproduction immutable review · exact verified head a699c5a</div>',
                      1
                  )
                  text = text.replace(
                      '<script type="module" src="./complete-world.js"></script>',
                      '<script type="module" src="./_source/h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/complete-world.js"></script>\n  <script type="module" src="./preview-correspondence-verifier.js"></script>',
                      1
                  )
                  text = text.replace(
                      '</footer>',
                      '<p><strong>Byte correspondence:</strong> <output id="preview-correspondence-status">Verifying immutable preview files…</output></p></footer>',
                      1
                  )
                  output_rel = PurePosixPath('index.html')
                  output_bytes = text.encode('utf-8')
                  transform = 'ENTRY_REBASED_AND_NONPRODUCTION_LABEL_ADDED'
              else:
                  output_rel = PurePosixPath('_source') / item
                  if source_path.suffix.lower() in text_ext:
                      original_text = source_bytes.decode('utf-8')
                      transformed_text = rebase(original_text)
                      output_bytes = transformed_text.encode('utf-8')
                      if transformed_text != original_text:
                          transform = 'ABSOLUTE_RUNTIME_PATHS_REBASED_TO_HASH_BOUND_PREVIEW'
                  else:
                      output_bytes = source_bytes
              output_path = out_root / Path(str(output_rel))
              output_path.parent.mkdir(parents=True, exist_ok=True)
              output_path.write_bytes(output_bytes)
              source_entries.append({
                  'sourceFile': str(item),
                  'sourceCommit': source_head,
                  'sourceBlob': source_blob,
                  'sourceSha256': sha256(source_bytes),
                  'previewFile': str(output_rel),
                  'previewSha256': sha256(output_bytes),
                  'transform': transform
              })

          verifier = r'''const statusNode=document.getElementById('preview-correspondence-status');
          const hex=bytes=>[...new Uint8Array(bytes)].map(v=>v.toString(16).padStart(2,'0')).join('');
          const digest=async bytes=>hex(await crypto.subtle.digest('SHA-256',bytes));
          const base=new URL('./',import.meta.url);
          try{
            const manifestResponse=await fetch(new URL('byte-manifest.json',base),{cache:'no-store'});
            const digestResponse=await fetch(new URL('byte-manifest.sha256',base),{cache:'no-store'});
            if(!manifestResponse.ok||!digestResponse.ok)throw new Error(`MANIFEST_HTTP_FAILURE:${manifestResponse.status}:${digestResponse.status}`);
            const manifestBytes=await manifestResponse.arrayBuffer();
            const expectedManifestDigest=(await digestResponse.text()).trim().split(/\s+/)[0];
            const actualManifestDigest=await digest(manifestBytes);
            if(actualManifestDigest!==expectedManifestDigest)throw new Error('MANIFEST_DIGEST_MISMATCH');
            const manifest=JSON.parse(new TextDecoder().decode(manifestBytes));
            const rows=[...manifest.sourceEntries,...manifest.generatedFiles];
            const results=[];
            for(const row of rows){
              const response=await fetch(new URL(row.previewFile,base),{cache:'no-store'});
              if(!response.ok)throw new Error(`PREVIEW_FILE_HTTP_FAILURE:${row.previewFile}:${response.status}`);
              const actual=await digest(await response.arrayBuffer());
              const expected=row.previewSha256;
              results.push({previewFile:row.previewFile,expected,actual,match:actual===expected});
              if(actual!==expected)throw new Error(`PREVIEW_FILE_DIGEST_MISMATCH:${row.previewFile}`);
            }
            window.H_EARTH_C2_R1_PREVIEW_CORRESPONDENCE=Object.freeze({status:'PASS',sourceHead:manifest.sourceHead,fileCount:rows.length,manifestDigest:actualManifestDigest,results});
            if(statusNode)statusNode.textContent=`PASS · ${rows.length} files bound to ${manifest.sourceHead.slice(0,12)}`;
          }catch(error){
            window.H_EARTH_C2_R1_PREVIEW_CORRESPONDENCE=Object.freeze({status:'FAIL',error:{name:error.name,message:error.message}});
            if(statusNode)statusNode.textContent=`FAIL · ${error.message}`;
            console.error('H_EARTH_C2_R1_PREVIEW_CORRESPONDENCE_FAILURE',error);
          }
          '''
          verifier_path = out_root / 'preview-correspondence-verifier.js'
          verifier_path.write_text(verifier, encoding='utf-8')
          generated_files = [{
              'previewFile': 'preview-correspondence-verifier.js',
              'previewSha256': sha256(verifier_path.read_bytes()),
              'generationAuthority': 'H_EARTH_C2_R1_COMPLETE_WORLD_IMMUTABLE_PREVIEW_PUBLICATION_001'
          }]

          manifest = {
              'manifestType': 'H_EARTH_C2_R1_IMMUTABLE_PREVIEW_SOURCE_TO_PREVIEW_BYTE_MANIFEST_v1',
              'operationId': 'H_EARTH_C2_R1_COMPLETE_WORLD_IMMUTABLE_PREVIEW_PUBLICATION_001',
              'sourceHead': source_head,
              'previewPath': str(preview_rel) + '/',
              'expectedPublicEntry': 'https://diamondgatebridge.com/' + str(preview_rel) + '/index.html',
              'packageIdentity': 'H_EARTH_C2_R1_COMPLETE_WORLD_PACKAGE_218F37AE',
              'packageContentDigest': 'fnv1a32:218f37ae',
              'sourceDependencyClosureCount': len(source_entries),
              'generatedFileCount': len(generated_files),
              'sourceEntries': source_entries,
              'generatedFiles': generated_files,
              'manifestSelfBinding': 'byte-manifest.sha256',
              'boundaries': {
                  'unlinkedFromPublicNavigation': True,
                  'publicDefaultRouteMutated': False,
                  'productCandidateMerged': False,
                  'sourceBehaviorChanged': False,
                  'cloudflareUsed': False
              }
          }
          manifest_path = out_root / 'byte-manifest.json'
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          manifest_digest = sha256(manifest_path.read_bytes())
          (out_root / 'byte-manifest.sha256').write_text(f'{manifest_digest}  byte-manifest.json\n', encoding='utf-8')
          (out_root / 'publication-receipt.json').write_text(json.dumps({
              'operationId': 'H_EARTH_C2_R1_COMPLETE_WORLD_IMMUTABLE_PREVIEW_PUBLICATION_001',
              'status': 'MATERIALIZED_PENDING_LOCAL_BROWSER_PROOF',
              'sourceHead': source_head,
              'previewFileCount': len(source_entries) + len(generated_files) + 3,
              'dependencyClosureResult': 'PASS',
              'byteManifestResult': 'PASS',
              'manifestDigest': 'sha256:' + manifest_digest
          }, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'closureCount':len(source_entries),'previewRoot':str(out_root),'manifestDigest':manifest_digest}))
          PY

      - name: Verify source-to-preview correspondence and closure completeness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])/'publication'/os.environ['PREVIEW_ROOT']
          source=Path(os.environ['GITHUB_WORKSPACE'])/'source'
          manifest=json.loads((root/'byte-manifest.json').read_text())
          expected=(root/'byte-manifest.sha256').read_text().split()[0]
          actual=hashlib.sha256((root/'byte-manifest.json').read_bytes()).hexdigest()
          assert actual==expected
          accounted={'byte-manifest.json','byte-manifest.sha256','publication-receipt.json'}
          for row in manifest['sourceEntries']:
              src=source/row['sourceFile']; dst=root/row['previewFile']
              assert src.is_file() and dst.is_file()
              assert subprocess.check_output(['git','-C',str(source),'hash-object',row['sourceFile']],text=True).strip()==row['sourceBlob']
              assert hashlib.sha256(src.read_bytes()).hexdigest()==row['sourceSha256']
              assert hashlib.sha256(dst.read_bytes()).hexdigest()==row['previewSha256']
              accounted.add(row['previewFile'])
          for row in manifest['generatedFiles']:
              dst=root/row['previewFile']; assert dst.is_file()
              assert hashlib.sha256(dst.read_bytes()).hexdigest()==row['previewSha256']
              accounted.add(row['previewFile'])
          files={str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          assert files==accounted,(sorted(files-accounted),sorted(accounted-files))
          print(json.dumps({'byteManifest':'PASS','sourceEntries':len(manifest['sourceEntries']),'files':len(files)}))
          PY

      - name: Install local browser verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/preview-browser"
          cd "$RUNNER_TEMP/preview-browser"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium

      - name: Execute exact hash-bound preview browser proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/preview-proof"
          python3 -m http.server 4188 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/publication" >"$RUNNER_TEMP/preview-proof/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/preview-proof/server.pid"
          for attempt in $(seq 1 60); do curl -fsS "http://127.0.0.1:4188$PREVIEW_URL_PATH" >/dev/null && break; sleep 1; done
          cat > "$RUNNER_TEMP/preview-browser/verify.mjs" <<'SCRIPT'
          import fs from 'node:fs';
          import path from 'node:path';
          import process from 'node:process';
          import { chromium } from 'playwright';
          const url=`http://127.0.0.1:4188${process.env.PREVIEW_URL_PATH}`;
          const out=path.join(process.env.RUNNER_TEMP,'preview-proof');
          const assert=(v,c,d=null)=>{if(!v){const e=new Error(c);e.detail=d;throw e;}};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const touch=async(page)=>page.evaluate(async()=>{const c=document.getElementById('complete-world-canvas');const fire=(t,p)=>c.dispatchEvent(new PointerEvent(t,{bubbles:true,cancelable:true,pointerId:p.id,pointerType:'touch',isPrimary:p.id===1,clientX:p.x,clientY:p.y,buttons:t==='pointerup'?0:1,pressure:t==='pointerup'?0:.5}));fire('pointerdown',{id:1,x:100,y:220});fire('pointermove',{id:1,x:210,y:220});await new Promise(r=>setTimeout(r,350));fire('pointerup',{id:1,x:210,y:220});fire('pointerdown',{id:1,x:100,y:360});fire('pointerdown',{id:2,x:220,y:360});fire('pointermove',{id:1,x:100,y:275});fire('pointermove',{id:2,x:220,y:275});await new Promise(r=>setTimeout(r,350));fire('pointermove',{id:1,x:55,y:275});fire('pointermove',{id:2,x:265,y:275});await new Promise(r=>setTimeout(r,350));fire('pointerup',{id:1,x:55,y:275});fire('pointerup',{id:2,x:265,y:275});});
          async function run(browser,cfg){
            const context=await browser.newContext({viewport:cfg.viewport,deviceScaleFactor:cfg.dpr,isMobile:cfg.mobile,hasTouch:cfg.mobile});
            const page=await context.newPage();const consoleErrors=[],pageErrors=[],requestFailures=[],httpFailures=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});page.on('pageerror',e=>pageErrors.push(e.message));page.on('requestfailed',r=>requestFailures.push({url:r.url(),failure:r.failure()}));page.on('response',r=>{if(r.status()>=400&&!r.url().endsWith('/favicon.ico'))httpFailures.push({url:r.url(),status:r.status()})});
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>{const s=window.H_EARTH_C2_R1_COMPLETE_WORLD;return s?.ready===true||s?.failed===true;},null,{timeout:120000,polling:250});
            await page.waitForFunction(()=>window.H_EARTH_C2_R1_PREVIEW_CORRESPONDENCE?.status==='PASS',null,{timeout:120000,polling:250});
            const before=await page.evaluate(()=>window.H_EARTH_C2_R1_COMPLETE_WORLD.getReceipt());
            assert(before.packageIdentity==='H_EARTH_C2_R1_COMPLETE_WORLD_PACKAGE_218F37AE','PACKAGE_IDENTITY_MISMATCH',before.packageIdentity);
            assert(before.packageContentDigest==='fnv1a32:218f37ae','PACKAGE_DIGEST_MISMATCH',before.packageContentDigest);
            assert(before.packageBinding.counters.candidateSampleFailureCount===0,'CANDIDATE_SAMPLE_FAILURE');
            assert(before.packageBinding.counters.boundTerrainVertexCount===10419,'BOUND_TERRAIN_COUNT');
            assert(before.packageBinding.counters.boundShorelineVertexCount===299,'BOUND_SHORELINE_COUNT');
            assert(before.renderer.counters.contextCreationCount===1&&before.renderer.counters.rendererInitializationCount===1,'WEBGL2_INITIALIZATION_COUNT');
            if(cfg.mobile)await touch(page);else{const b=await page.locator('#complete-world-canvas').boundingBox();assert(b,'CANVAS_BOX');await page.mouse.move(b.x+b.width/2,b.y+b.height/2);await page.mouse.down();await page.mouse.move(b.x+b.width/2+100,b.y+b.height/2,{steps:10});await page.mouse.up();await page.mouse.wheel(0,-220);await sleep(400);}
            const after=await page.evaluate(()=>window.H_EARTH_C2_R1_COMPLETE_WORLD.getReceipt());
            assert(after.renderer.counters.visiblePresentationCount>before.renderer.counters.visiblePresentationCount,'VISIBLE_FRAMES_NOT_ADVANCED');
            assert(after.intake.counters.navigationProposalCount>before.intake.counters.navigationProposalCount,'CAMERA_NAVIGATION_NOT_RESPONSIVE');
            if(cfg.mobile){assert(after.intake.counters.touchPointerEventCount>before.intake.counters.touchPointerEventCount,'TOUCH_NOT_RESPONSIVE');assert(after.intake.counters.twoFingerTravelProposalCount>before.intake.counters.twoFingerTravelProposalCount,'TOUCH_TRAVEL_NOT_RESPONSIVE');assert(after.intake.counters.pinchProposalCount>before.intake.counters.pinchProposalCount,'PINCH_NOT_RESPONSIVE');}
            assert(consoleErrors.length===0,'CONSOLE_ERRORS',consoleErrors);assert(pageErrors.length===0,'PAGE_ERRORS',pageErrors);assert(requestFailures.length===0,'REQUEST_FAILURES',requestFailures);assert(httpFailures.length===0,'HTTP_FAILURES',httpFailures);
            await page.screenshot({path:path.join(out,`${cfg.name}.png`),fullPage:true});
            const receipt={name:cfg.name,url,before,after,consoleErrors,pageErrors,requestFailures,httpFailures,correspondence:await page.evaluate(()=>window.H_EARTH_C2_R1_PREVIEW_CORRESPONDENCE)};
            fs.writeFileSync(path.join(out,`${cfg.name}.json`),JSON.stringify(receipt,null,2));await context.close();return receipt;
          }
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
          try{const configs=[{name:'desktop-1440x900',viewport:{width:1440,height:900},dpr:1,mobile:false},{name:'mobile-412x915',viewport:{width:412,height:915},dpr:2.625,mobile:true},{name:'mobile-390x844',viewport:{width:390,height:844},dpr:3,mobile:true}];const results=[];for(const cfg of configs)results.push(await run(browser,cfg));fs.writeFileSync(path.join(out,'local-preview-summary.json'),JSON.stringify({status:'PASS',sourceHead:process.env.SOURCE_HEAD,previewPath:process.env.PREVIEW_URL_PATH,scenarios:results.map(r=>r.name)},null,2));}finally{await browser.close();}
          SCRIPT
          cd "$RUNNER_TEMP/preview-browser"
          node verify.mjs
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['GITHUB_WORKSPACE'])/'publication'/os.environ['PREVIEW_ROOT']/'publication-receipt.json'
          r=json.loads(p.read_text());r.update({'status':'ROLE_1_PREMERGE_PROOF_PASS','localPreviewResult':'PASS','webgl2Result':'PASS_SINGLE_INITIALIZATION','cameraNavigationAndTouchResult':'PASS','consolePageRequestHttpResult':'PASS_ZERO_FAILURES'});p.write_text(json.dumps(r,indent=2)+'\n')
          PY

      - name: Commit immutable preview package only
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/publication"
          git config user.name 'h-earth-role1-preview-publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add "$PREVIEW_ROOT"
          test -n "$(git status --porcelain -- "$PREVIEW_ROOT")"
          git commit -m 'H-Earth C2-R1: materialize immutable hash-bound preview'
          git push origin "HEAD:$PUBLICATION_BRANCH"

      - name: Upload premerge proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-c2-r1-immutable-preview-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/preview-proof
            publication/${{ env.PREVIEW_ROOT }}/byte-manifest.json
            publication/${{ env.PREVIEW_ROOT }}/byte-manifest.sha256
            publication/${{ env.PREVIEW_ROOT }}/publication-receipt.json
          if-no-files-found: error
          retention-days: 30
