name: Compass renderer settlement repair

on:
  push:
    branches:
      - compass-a2f838-exact-qualification-temp

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compass-renewal-corrected-gen1772
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            assets/compass
          sparse-checkout-cone-mode: true
      - name: Prove expected Compass head
        run: test "$(git rev-parse HEAD)" = "6cc7deaed4ea562ea2f7b9147d234e68192abc30"
      - name: Align renderer canonical east-west settlement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/compass/compass.crystals.js')
          s=p.read_text()
          old='''    const canonicalAngle =\n      wing === "east"\n        ? -Math.PI / 2\n        : wing === "south"\n          ? Math.PI\n          : wing === "west"\n            ? Math.PI / 2\n            : 0;'''
          new='''    const canonicalAngle =\n      wing === "east"\n        ? Math.PI / 2\n        : wing === "south"\n          ? Math.PI\n          : wing === "west"\n            ? -Math.PI / 2\n            : 0;'''
          if s.count(old)!=1:
              raise SystemExit(f'expected one settled cardinal map, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          git diff --check
      - name: Commit bounded renderer repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "smansfield635-create"
          git config user.email "smansfield635@gmail.com"
          git add assets/compass/compass.crystals.js
          test "$(git diff --cached --name-only)" = "assets/compass/compass.crystals.js"
          git commit -m "Compass: align renderer cardinal settlement"
          git push origin HEAD:compass-renewal-corrected-gen1772
