name: Laws CP5 R2 Lunar Materialization

on:
  push:
    branches:
      - agent/laws-cp5-r2-celestial-visual-correction-001

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/laws-cp5-r2-celestial-visual-correction-001
          fetch-depth: 0

      - name: Apply bounded lunar correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object laws/index.crystals.js)" = "50685b9588f8a821afe320e4a5cdb13181e58443"
          test "$(git hash-object laws/index.interactions.js)" = "be365cc331ee5643f916abee204d4f5f45376c04"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('laws/index.crystals.js')
          t=p.read_text()
          def r(a,b,n):
              global t
              c=t.count(a)
              if c!=1: raise SystemExit(f'{n}: {c}')
              t=t.replace(a,b,1)
          r('"2.1.0-exact-two-object-field"','"2.2.1-cp5-r2-solar-lunar-visual-correction"','version')
          r('''    research:
      Object.freeze([
        0.52,
        0.34,
        1.0
      ]),''','''    research:
      Object.freeze([
        0.82,
        0.83,
        0.86
      ]),''','palette')
          r('Object.freeze({specular:0.08,rim:0.18,emissive:0.018,alpha:1.50,sparkle:0.00,halo:0.10,contrast:1.85}),','Object.freeze({specular:0.12,rim:0.16,emissive:0.006,alpha:1.00,sparkle:0.00,halo:0.045,contrast:1.76}),','material')
          old='''        const terminator = 0.14 + 0.86 * smoothTransition(-0.20, 0.16, illumination);
        const shade = clamp((0.66 + terrain * 0.11 + fineTerrain * 0.055 + crater.albedo) * terminator, 0.09, 1.02);
        relief += terrain * 0.013 + fineTerrain * 0.0055 + crater.relief;
        surfaceColor = [
          clamp(color[0] * shade * 0.92, 0, 1),
          clamp(color[1] * shade * 0.78, 0, 1),
          clamp(color[2] * shade * 1.08, 0, 1)
        ];'''
          new='''        /* CP5_R2_LUNAR_NEUTRAL_MATERIAL */
        const terminator = 0.10 + 0.90 * smoothTransition(-0.18, 0.18, illumination);
        const highlands = smoothTransition(-0.12, 0.34, terrain + crater.albedo * 0.82);
        const maria = smoothTransition(0.06, 0.52, -terrain - crater.albedo * 0.28);
        const neutralAlbedo = clamp(0.56 + highlands * 0.24 - maria * 0.20 + fineTerrain * 0.045 + crater.albedo * 0.46, 0.22, 0.96);
        const reliefLighting = clamp(0.78 + terrain * 0.10 + fineTerrain * 0.038 + crater.albedo * 0.34, 0.52, 1.08);
        const shade = clamp(neutralAlbedo * reliefLighting * terminator, 0.055, 1.0);
        const reflectedCoolTint = (1 - terminator) * 0.008;
        relief += terrain * 0.013 + fineTerrain * 0.0055 + crater.relief;
        surfaceColor = [
          clamp(shade * 1.018, 0, 1),
          clamp(shade * 1.012, 0, 1),
          clamp(shade + reflectedCoolTint, 0, 1)
        ];'''
          r(old,new,'lunar branch')
          for x in ['CP5_R2_SOLAR_LARGE_CONVECTION_CELLS','CP5_R2_SOLAR_IRREGULAR_GASEOUS_CORONA','CP5_R2_LUNAR_NEUTRAL_MATERIAL','gatewayBodyScale:\n    0.7666667','horizontalRadius:\n        1.68','verticalRadius:\n        1.5008','depthRadius:\n        1.2992']:
              if x not in t: raise SystemExit(f'missing {x}')
          p.write_text(t)
          PY
          node --check laws/index.crystals.js
          git diff --check -- laws/index.crystals.js
          test "$(git hash-object laws/index.interactions.js)" = "be365cc331ee5643f916abee204d4f5f45376c04"

      - name: Commit one-file result
        shell: bash
        run: |
          set -euo pipefail
          base="0ff5741803926a6c218415587955aa867f93a0f7"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/laws-cp5-r2-celestial-verification.yml
          git add laws/index.crystals.js
          test "$(git diff --cached --name-only "$base")" = "laws/index.crystals.js"
          git commit -m '[skip ci] Apply bounded Laws CP5-R2 lunar visual correction'
          git push origin HEAD:agent/laws-cp5-r2-celestial-visual-correction-001
