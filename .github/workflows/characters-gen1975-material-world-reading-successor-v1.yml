name: Characters Gen1975 Material World Reading Successor v1

on:
  pull_request:
    branches: [characters/territorial-massing-edge-wet-margin-repair-20260906-001]
    paths:
      - 'characters/vegetation-population.mjs'
      - 'characters/vegetation-understory.mjs'
      - 'characters/app.mjs'
      - 'control-plane/whole-estate/characters-reconstruction-v1/gen1975-material-world-reading-successor-contract.v1.json'
      - 'control-plane/whole-estate/characters-reconstruction-v1/verify-gen1975-material-world-reading-successor.v1.mjs'
      - '.github/workflows/characters-gen1975-material-world-reading-successor-v1.yml'

permissions:
  contents: read

env:
  OPERATION_ID: MIRRORLAND_GEN1975_MATERIAL_WORLD_READING_SUCCESSOR_20260906_002
  LOCK_GENERATION: '1980'
  PRODUCT_SUBSTRATE: 84754b3d3f0befc0977fc747dce205af4fbeab25
  GOVERNING_MAIN: 24eba044e3c4943756ee2412cb81f35a440f9608
  V5_REPRESENTATION_BLOB: f3b64eb1ffc1c1bc8e908ff96eb6c833b6bc928d

jobs:
  exact-head-sparse-mechanical-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Materialize exact sparse-index candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git sparse-checkout init --cone --sparse-index
          git sparse-checkout set \
            .github/workflows \
            control-plane/whole-estate/characters-reconstruction-v1 \
            characters \
            h-earth-3d/terrain \
            h-earth-3d/integration
          git -c protocol.version=2 fetch --filter=blob:none --no-tags --depth=60 origin "$HEAD_SHA"
          git checkout --detach "$HEAD_SHA"
          test "$(git rev-parse HEAD^{commit})" = "$HEAD_SHA"
          git cat-file -e "$PRODUCT_SUBSTRATE^{commit}"
          test "$(git config --bool core.sparseCheckout)" = "true"
          test "$(git config --bool index.sparse)" = "true"
          echo "EXACT_HEAD=$HEAD_SHA" >> "$GITHUB_ENV"

      - name: Verify sparse locality and exact identities
        shell: bash
        run: |
          set -euo pipefail
          SPARSE_ENTRIES="$(git ls-files --sparse | wc -l | tr -d ' ')"
          MATERIALIZED="$(find . -type f ! -path './.git/*' | wc -l | tr -d ' ')"
          test "$SPARSE_ENTRIES" -lt 5000
          test "$MATERIALIZED" -lt 2500
          for path in characters/app.mjs characters/vegetation-population.mjs characters/vegetation-understory.mjs control-plane/whole-estate/characters-reconstruction-v1/gen1975-material-world-reading-successor-contract.v1.json control-plane/whole-estate/characters-reconstruction-v1/verify-gen1975-material-world-reading-successor.v1.mjs .github/workflows/characters-gen1975-material-world-reading-successor-v1.yml; do test -f "$path"; done
          test "$(git hash-object characters/vegetation-representation.mjs)" = "$V5_REPRESENTATION_BLOB"
          BAD_TOP="$(find . -mindepth 1 -maxdepth 1 ! -name .git ! -name characters ! -name control-plane ! -name .github ! -name h-earth-3d -printf '%f\n' | sort)"
          test -z "$BAD_TOP"
          mkdir -p "$RUNNER_TEMP/material-world-reading-successor"
          cat > "$RUNNER_TEMP/material-world-reading-successor/material-world-reading-successor-scope-receipt.json" <<JSON
          {
            "schema":"MIRRORLAND_GEN1980_SPARSE_SCOPE_RECEIPT_v1",
            "result":"PASS_CLOSED",
            "operationId":"$OPERATION_ID",
            "lockGeneration":$LOCK_GENERATION,
            "exactHead":"$EXACT_HEAD",
            "productSubstrate":"$PRODUCT_SUBSTRATE",
            "checkoutLaw":"EXACT_REF_BLOB_FILTERED_CONE_SPARSE_INDEX_ONLY",
            "sparseIndex":true,
            "sparseEntries":$SPARSE_ENTRIES,
            "materializedFiles":$MATERIALIZED,
            "topLevelLocality":[".github","characters","control-plane","h-earth-3d"]
          }
          JSON
          test -z "$(git status --porcelain)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run exact-head independent mechanical verifier
        shell: bash
        run: |
          set -euo pipefail
          node control-plane/whole-estate/characters-reconstruction-v1/verify-gen1975-material-world-reading-successor.v1.mjs \
            --output "$RUNNER_TEMP/material-world-reading-successor/material-world-reading-successor-mechanical-receipt.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const file=path.join(process.env.RUNNER_TEMP,'material-world-reading-successor','material-world-reading-successor-mechanical-receipt.json');
          const r=JSON.parse(fs.readFileSync(file,'utf8'));
          if(r.schema!=='MIRRORLAND_GEN1975_MATERIAL_WORLD_READING_SUCCESSOR_QUALIFICATION_RECEIPT_v1')throw Error('GEN1980_RECEIPT_SCHEMA_INVALID');
          if(r.result!=='PASS_CLOSED'||r.failCount!==0)throw Error('GEN1980_MECHANICAL_NOT_PASS_CLOSED');
          if(r.exactHead!==process.env.EXACT_HEAD||r.productSubstrate!==process.env.PRODUCT_SUBSTRATE)throw Error('GEN1980_IDENTITY_MISMATCH');
          if(r.canopyCount!==818||r.v5RepresentationPreserved!==true)throw Error('GEN1980_PRESERVATION_FAILURE');
          if(r.materialDisposition!=='UNASSIGNED'||r.materialDispositionAuthority!==false)throw Error('GEN1980_MATERIAL_AUTHORITY_LEAK');
          NODE
          test -z "$(git status --porcelain)"

      - name: Upload bounded Gen1980 qualification receipts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gen1980-material-world-reading-successor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/material-world-reading-successor/material-world-reading-successor-mechanical-receipt.json
            ${{ runner.temp }}/material-world-reading-successor/material-world-reading-successor-scope-receipt.json
          if-no-files-found: warn
          retention-days: 90
