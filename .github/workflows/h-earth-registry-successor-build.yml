name: H-Earth Registry Successor Build

on:
  push:
    branches:
      - agent/h-earth-gate-b-post-guardrail-evaluation-001
    paths:
      - tools/h-earth-registry-successor-build.mjs
      - h-earth-3d/registry/candidates/h-earth.repository-registry.compositor-and-route-entry-amendment.candidate.js
      - .github/workflows/h-earth-registry-successor-build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/h-earth-gate-b-post-guardrail-evaluation-001
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build deterministic successor
        run: node tools/h-earth-registry-successor-build.mjs
      - name: Verify deterministic rebuild
        run: |
          sha256sum h-earth-3d/registry/candidates/h-earth.repository-registry.successor.candidate.js > /tmp/first
          node tools/h-earth-registry-successor-build.mjs
          sha256sum h-earth-3d/registry/candidates/h-earth.repository-registry.successor.candidate.js > /tmp/second
          diff -u /tmp/first /tmp/second
      - name: Commit successor identity
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add h-earth-3d/registry/candidates/h-earth.repository-registry.successor.candidate.js h-earth-3d/registry/candidates/h-earth.repository-registry.successor.identity.json
          git diff --cached --quiet && exit 0
          git commit -m 'Generate deterministic H-Earth registry successor candidate'
          git push origin HEAD:agent/h-earth-gate-b-post-guardrail-evaluation-001
