name: H-Earth Run 8E R3E4 Public Direct Manipulation Acceptance

on:
  push:
    branches:
      - agent/h-earth-run8e-r3e4-public-direct-manipulation-acceptance-001
  pull_request:
    branches:
      - agent/h-earth-run8e-r3e3-public-runtime-authority-exclusivity-001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-run8e-r3e4-public-direct-manipulation-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      H_EARTH_RUN8E_R3E4_URL: http://127.0.0.1:4173/showroom/globe/h-earth/
      H_EARTH_RUN8E_R3E4_OUTPUT: /tmp/h-earth-run8e-r3e4
    steps:
      - name: Check out exact R3E4 event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact R3E3 base and frozen public runtime
        run: |
          set -euo pipefail
          git fetch origin agent/h-earth-run8e-r3e3-public-runtime-authority-exclusivity-001
          test "$(git merge-base HEAD origin/agent/h-earth-run8e-r3e3-public-runtime-authority-exclusivity-001)" = "504b81ff50acd7b23cf3cdb2e915ed53f0112ff9"
          test "$(git hash-object showroom/globe/h-earth/index.html)" = "0daedf61f7e19af095f4db5fc47563a9cd786837"
          test "$(git hash-object showroom/globe/h-earth/functional-landscape/public-live-gpu-integration.run8e-r3e.js)" = "2b0a916b3a6d11da84316925f8abd8a3a1447445"
          test "$(git hash-object showroom/globe/h-earth/functional-landscape/navigation.js)" = "8ab3446c536fc24423d5601acce232b19fa71c91"
          test "$(git hash-object showroom/globe/h-earth/render/live-renderer-contract.run8e-r3a.js)" = "4e187fc38780dfb2020482b674ac331f5a65b2c1"
          test "$(git hash-object showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.js)" = "b8b3c713d5f0b7c79808e8942ce385887589d880"
          test "$(git hash-object showroom/globe/h-earth/diagnostic/run8e-r3d/pointer-touch-intake.js)" = "bb96858fec09d14bbe10aa9ffa8a7f07af3621e6"
          test "$(git hash-object showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js)" = "5017bbaf857a644287cb829037b0fde4646f270d"
          test "$(git hash-object h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3e3.pass-closed.receipt.json)" = "5c5f1ae06220f88f497dc2b45f4d749679849918"
          ! git diff --name-only 504b81ff50acd7b23cf3cdb2e915ed53f0112ff9...HEAD | grep -q '^showroom/'

      - name: Verify R3E4 syntax and declared acceptance law
        run: |
          set -euo pipefail
          node --check h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3.live-gpu-presentation-recovery.js
          node --check h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3e4.public-direct-manipulation-acceptance.js
          node --check h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.run8e-r3e4-public-direct-manipulation-acceptance.js
          node --check h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js
          node --check h-earth-3d/validation/h-earth.run8e-r3e4.public-direct-manipulation-acceptance.harness.mjs
          if test -f h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3e4.pass-closed.receipt.json; then
            node -e "JSON.parse(require('fs').readFileSync('h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3e4.pass-closed.receipt.json','utf8'))"
          fi
          grep -q "NONE_ONE_SYNCHRONOUS_FRAME_PER_ACCEPTED_PROPOSAL" h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3e4.public-direct-manipulation-acceptance.js
          grep -q "scheduledInteractionGroupsPerOrientation: 24" h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3e4.public-direct-manipulation-acceptance.js
          grep -q "inputCadenceMs: 350" h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3e4.public-direct-manipulation-acceptance.js

      - name: Install bounded Chromium dependency
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Start branch-local public route server
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/h-earth-run8e-r3e4-server.log 2>&1 &
          echo $! >/tmp/h-earth-run8e-r3e4-server.pid
          for attempt in $(seq 1 30); do
            if curl --silent --fail "$H_EARTH_RUN8E_R3E4_URL" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/h-earth-run8e-r3e4-server.log
          exit 1

      - name: Execute public-route direct-manipulation acceptance
        run: |
          set -o pipefail
          mkdir -p "$H_EARTH_RUN8E_R3E4_OUTPUT"
          node h-earth-3d/validation/h-earth.run8e-r3e4.public-direct-manipulation-acceptance.harness.mjs \
            2>&1 | tee "$H_EARTH_RUN8E_R3E4_OUTPUT/h-earth.run8e-r3e4.browser-execution.log"

      - name: Execute automatic repository-registry preflight
        run: |
          set -euo pipefail
          git diff --name-only 504b81ff50acd7b23cf3cdb2e915ed53f0112ff9...HEAD \
            | grep -E '^(h-earth-3d/|showroom/globe/h-earth/)' \
            | sort -u > /tmp/h-earth-run8e-r3e4-governed-paths.txt || true
          node --experimental-default-type=module \
            tools/h-earth-repository-registry-auto-preflight.mjs \
            --paths-file /tmp/h-earth-run8e-r3e4-governed-paths.txt \
            --task "Run 8E R3E4 public direct manipulation execution and acceptance" \
            --mutation-intent \
            --output "$H_EARTH_RUN8E_R3E4_OUTPUT/h-earth.run8e-r3e4.automatic-preflight.receipt.json"
          node - <<'NODE'
          const receipt = require('/tmp/h-earth-run8e-r3e4/h-earth.run8e-r3e4.automatic-preflight.receipt.json');
          if (receipt.finalDisposition !== 'PASS') throw new Error(`R3E4_AUTOMATIC_PREFLIGHT_NOT_PASS:${receipt.finalDisposition}`);
          NODE

      - name: Verify exact scope and R3E5 stopping boundary
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only 504b81ff50acd7b23cf3cdb2e915ed53f0112ff9...HEAD | sort > "$H_EARTH_RUN8E_R3E4_OUTPUT/r3e4-changed-paths.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = {line.strip() for line in Path('/tmp/h-earth-run8e-r3e4/r3e4-changed-paths.txt').read_text().splitlines() if line.strip()}
          required = {
            '.github/workflows/h-earth-run8e-r3e4-public-direct-manipulation-acceptance.yml',
            'h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3.live-gpu-presentation-recovery.js',
            'h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3e4.public-direct-manipulation-acceptance.js',
            'h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.run8e-r3e4-public-direct-manipulation-acceptance.js',
            'h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js',
            'h-earth-3d/validation/h-earth.run8e-r3e4.public-direct-manipulation-acceptance.harness.mjs',
            'h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3e4.attempt-001.failure.receipt.json'
          }
          optional = {'h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3e4.pass-closed.receipt.json'}
          missing = sorted(required - paths)
          unexpected = sorted(paths - required - optional)
          if missing: raise SystemExit(f'R3E4_REQUIRED_PATHS_MISSING:{missing}')
          if unexpected: raise SystemExit(f'R3E4_UNEXPECTED_PATHS:{unexpected}')
          if any(path.startswith('showroom/') for path in paths): raise SystemExit('R3E4_SHOWROOM_MUTATION_OBSERVED')
          receipt = json.loads(Path('/tmp/h-earth-run8e-r3e4/h-earth.run8e-r3e4.public-direct-manipulation-acceptance.execution.receipt.json').read_text())
          if receipt['eligible'] is not True or receipt['status'] != 'RUN_8E_R3E4_EXECUTION_PASS': raise SystemExit('R3E4_EXECUTION_RECEIPT_INVALID')
          aggregate = receipt['aggregate']
          if aggregate['sessions'] != 2 or aggregate['groups'] != 48: raise SystemExit('R3E4_SESSION_OR_GROUP_COUNT_INVALID')
          if not (aggregate['acceptedProposals'] == aggregate['framePackets'] == aggregate['visibleFrames']): raise SystemExit('R3E4_PUBLIC_CORRESPONDENCE_INVALID')
          if aggregate['maxDelivery'] >= 2000 or aggregate['maxCompletion'] >= 2000 or aggregate['maxProcessing'] >= 1000: raise SystemExit('R3E4_TIMING_THRESHOLD_FAILED')
          for session in receipt['sessions']:
            if session['execution']['peak'] != 1: raise SystemExit('R3E4_CALLBACK_CONCURRENCY_INVALID')
            if session['execution']['document']['visibleControllers'] != 0 or session['execution']['document']['visibleImages'] != 0: raise SystemExit('R3E4_VISIBLE_CONTROLLER_OR_BITMAP_PRESENTATION')
            resources = session['resourceLedger']['counters']
            if resources['postInitializationResourceCreationCount'] != 0 or resources['postInitializationBufferUploadCount'] != 0: raise SystemExit('R3E4_POST_INITIALIZATION_RESOURCE_ACTIVITY')
            live = session['execution']['after']['liveGpu']['counters']
            intake = session['execution']['after']['intake']['counters']
            if any(live[key] != 0 for key in ['worldRebuildCount','bitmapPreviewApplicationCount','cssTransformPreviewCount','deferredRenderCommitCount','queuedFrameChainCount']): raise SystemExit('R3E4_OBSOLETE_PRESENTATION_ACTIVITY')
            if intake['deferredCommitCount'] != 0 or intake['queuedNavigationChainCount'] != 0: raise SystemExit('R3E4_QUEUED_NAVIGATION_ACTIVITY')
          if receipt['stoppingBoundary'] != 'STOP_BEFORE_R3E_CLOSURE_AND_R3F_INPUT_DECISION_R3E5': raise SystemExit('R3E4_STOPPING_BOUNDARY_MISMATCH')
          if any(receipt['boundaries'].values()): raise SystemExit('R3E4_BOUNDARY_VIOLATION')
          PY

      - name: Upload R3E4 public direct-manipulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-run8e-r3e4-public-direct-manipulation-acceptance-evidence
          path: |
            /tmp/h-earth-run8e-r3e4
            /tmp/h-earth-run8e-r3e4-server.log
            /tmp/h-earth-run8e-r3e4-governed-paths.txt
          if-no-files-found: warn
          retention-days: 90
