name: H-Earth Registry Amendment Candidate Audit

on:
  push:
    branches:
      - agent/h-earth-gate-b-post-guardrail-evaluation-001
    paths:
      - h-earth-3d/registry/candidates/h-earth.repository-registry.compositor-and-route-entry-amendment.candidate.js
      - tools/h-earth-repository-registry-compositor-route-amendment-audit.mjs
      - .github/workflows/h-earth-registry-amendment-candidate-audit.yml
  pull_request:
    branches:
      - main
    paths:
      - h-earth-3d/registry/candidates/h-earth.repository-registry.compositor-and-route-entry-amendment.candidate.js
      - tools/h-earth-repository-registry-compositor-route-amendment-audit.mjs
      - .github/workflows/h-earth-registry-amendment-candidate-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute amendment candidate audit
        run: node tools/h-earth-repository-registry-compositor-route-amendment-audit.mjs | tee /tmp/h-earth-registry-amendment-audit.receipt.json
      - name: Upload audit receipt
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-registry-amendment-audit-receipt
          path: /tmp/h-earth-registry-amendment-audit.receipt.json
          if-no-files-found: error
          retention-days: 30
