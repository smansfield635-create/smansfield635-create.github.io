name: FD05 rendered material inspection

on:
  pull_request:
    branches:
      - agent/fd05-visual-baseline-capture-001
    types: [synchronize]

permissions:
  contents: write

jobs:
  inspect-rendered-material:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fd05-visual-baseline-capture-001
          fetch-depth: 0
      - name: Install browser dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Inspect terminal rendered material
        run: node .fd05/inspect-rendered-material.mjs
      - name: Commit read-only material inspection
        run: |
          git config user.name "OpenAI Engineering Agent"
          git config user.email "engineering-agent@users.noreply.github.com"
          git add .fd05/visual-baseline-output/rendered-material-inspection.json
          git commit -m "Record rendered wet-sand material inspection"
          git push origin HEAD:agent/fd05-visual-baseline-capture-001
