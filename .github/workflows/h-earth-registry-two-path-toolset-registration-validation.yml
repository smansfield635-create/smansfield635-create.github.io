name: PR570 Router Count Defect Termination

on:
  pull_request:
    paths:
      - '.github/workflows/h-earth-registry-two-path-toolset-registration-validation.yml'

permissions:
  contents: write
  actions: read

env:
  GOVERNING_HEAD: ffe3cb714751ea0e8df2e53611538f6cadcc241c
  LOCK_REF: refs/heads/operation-locks/repository-operation-intake-v1
  INVALID_OPERATION_ID: H_EARTH_MAP_WIDE_INSTRUMENT_ROUTER_OWNERSHIP_R_001
  INVALID_LOCK_SCOPE: REPOSITORY_AI_ROUTER_INFRASTRUCTURE:H_EARTH_MAP_WIDE_INSTRUMENT_OWNERSHIP:R:V1
  INVALID_GENERATION: '104'
  TERMINATION_OPERATION_ID: H_EARTH_MAP_WIDE_ROUTER_COUNT_DEFECT_TERMINATION_T_001
  TERMINATION_LOCK_SCOPE: H_EARTH:MAP_WIDE_ROUTER_COUNT_DEFECT:TERMINATION:T:V1
  TERMINATION_GENERATION: '108'

jobs:
  terminate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact isolated carrier
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$GOVERNING_HEAD")" = "$GOVERNING_HEAD"
          mapfile -t paths < <(git diff --name-only "$GOVERNING_HEAD" HEAD)
          test "${#paths[@]}" -eq 1
          test "${paths[0]}" = '.github/workflows/h-earth-registry-two-path-toolset-registration-validation.yml'
          test "$(git rev-parse "$GOVERNING_HEAD:tools/operation-intake/repository-operation-lock-manager.v1.mjs")" = '6fc0199c9dc943b8cdf3efe7c789f0e1888774b8'
      - name: Close invalid generation 104 fail closed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if node tools/operation-intake/repository-operation-lock-manager.v1.mjs \
              --action close \
              --repository "${{ github.repository }}" \
              --lock-ref "$LOCK_REF" \
              --operation-id "$INVALID_OPERATION_ID" \
              --lock-scope "$INVALID_LOCK_SCOPE" \
              --lock-generation "$INVALID_GENERATION" \
              --terminal-disposition FAIL_CLOSED \
              --output /tmp/generation-104-closure.json; then break; fi
            test "$attempt" -lt 3
            sleep $((attempt * 2))
          done
          node -e "const r=require('/tmp/generation-104-closure.json');if(r.result!=='TERMINAL_CLOSURE_COMMITTED'||!r.lockReleased)process.exit(1)"
      - name: Close termination generation 108 pass closed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if node tools/operation-intake/repository-operation-lock-manager.v1.mjs \
              --action close \
              --repository "${{ github.repository }}" \
              --lock-ref "$LOCK_REF" \
              --operation-id "$TERMINATION_OPERATION_ID" \
              --lock-scope "$TERMINATION_LOCK_SCOPE" \
              --lock-generation "$TERMINATION_GENERATION" \
              --terminal-disposition PASS_CLOSED \
              --output /tmp/generation-108-closure.json; then break; fi
            test "$attempt" -lt 3
            sleep $((attempt * 2))
          done
          node -e "const r=require('/tmp/generation-108-closure.json');if(r.result!=='TERMINAL_CLOSURE_COMMITTED'||!r.lockReleased)process.exit(1)"
      - name: Emit terminal certification
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const invalid=JSON.parse(fs.readFileSync('/tmp/generation-104-closure.json','utf8'));
          const termination=JSON.parse(fs.readFileSync('/tmp/generation-108-closure.json','utf8'));
          const out={
            schema:'PR570_ROUTER_COUNT_DEFECT_TERMINATION_CERTIFICATION_v1',
            result:'PASS_CLOSED_INVALID_ADMISSION_TERMINATED',
            governingHead:process.env.GOVERNING_HEAD,
            invalidOperationId:process.env.INVALID_OPERATION_ID,
            invalidGeneration:Number(process.env.INVALID_GENERATION),
            invalidTerminalDisposition:'FAIL_CLOSED',
            invalidClosureCommit:invalid.closureCommitSha,
            terminationOperationId:process.env.TERMINATION_OPERATION_ID,
            terminationGeneration:Number(process.env.TERMINATION_GENERATION),
            terminationTerminalDisposition:'PASS_CLOSED',
            terminationClosureCommit:termination.closureCommitSha,
            correctedRequiredOwnershipPathCount:13,
            branchMutationPerformed:false,
            routerMutationPerformed:false,
            mainMutationPerformed:false,
            pr570Mutated:false,
            mergePerformed:false,
            residualAuthority:false
          };
          out.certificationDigest=crypto.createHash('sha256').update(JSON.stringify(out)).digest('hex');
          fs.mkdirSync('/tmp/pr570-router-count-defect-terminal',{recursive:true});
          fs.writeFileSync('/tmp/pr570-router-count-defect-terminal/certification.json',JSON.stringify(out,null,2)+'\n');
          fs.copyFileSync('/tmp/generation-104-closure.json','/tmp/pr570-router-count-defect-terminal/generation-104-closure.json');
          fs.copyFileSync('/tmp/generation-108-closure.json','/tmp/pr570-router-count-defect-terminal/generation-108-closure.json');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: pr570-router-count-defect-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/pr570-router-count-defect-terminal/
          if-no-files-found: error
          retention-days: 90
