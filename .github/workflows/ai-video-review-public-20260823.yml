name: AI Video Review Public Carrier 20260823

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  materialize-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare tooling
        run: |
          set -euo pipefail
          python -m pip install --quiet gdown
          ffmpeg -version >/dev/null
      - name: Download public Drive source
        id: download
        run: |
          set -euo pipefail
          gdown --fuzzy 'https://drive.google.com/file/d/1JmBeYxcjnq8v-fwkSnPXqfbiEEvgjAP8/view?usp=drivesdk' -O source.mp4
          test -s source.mp4
          stat -c '%s' source.mp4 | tee source-bytes.txt
          sha256sum source.mp4 | tee source-sha256.txt
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of json source.mp4 > probe.json
      - name: Build compact review package
        run: |
          set -euo pipefail
          mkdir -p review/frames
          ffmpeg -hide_banner -loglevel error -i source.mp4 -vf "scale=-2:480,fps=12" -c:v libx264 -preset veryfast -crf 31 -c:a aac -b:a 48k -movflags +faststart review/proxy-480p.mp4
          ffmpeg -hide_banner -loglevel error -i source.mp4 -vf "fps=1/8,scale=-2:640" -q:v 4 review/frames/frame-%04d.jpg
          ffmpeg -hide_banner -loglevel error -i source.mp4 -vn -c:a libmp3lame -b:a 48k review/audio.mp3
          cp probe.json source-bytes.txt source-sha256.txt review/
      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: diamond-gate-seven-minute-review-public
          path: review/
          if-no-files-found: error
          retention-days: 7
