name: Audralia Live Recovery Publish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audralia-live-promotion-retry.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  publish-current-main:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Stage bounded current-main Pages payload
        shell: bash
        env:
          STAGE: ${{ runner.temp }}/pages-site
          LEGACY_SHA: 1d45379f81ea4089e9c5f3d7d9688e702be9add3
          LEGACY_ROOT: ${{ runner.temp }}/pages-site/inspection/h-earth/24056
        run: |
          set -euo pipefail
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          rsync -a --prune-empty-dirs --exclude='.git/' --exclude='.github/' --exclude='preview/' --exclude='h-earth-live-6d18e158/' ./ "$STAGE/"

          rm -rf "$STAGE/showroom/globe/h-earth"
          mkdir -p "$STAGE/showroom/globe/h-earth"
          rsync -a --delete h-earth-live-6d18e158/showroom/globe/h-earth/ "$STAGE/showroom/globe/h-earth/"

          audralia_renderer_src="showroom/globe/h-earth/terrain-estate-construction-v1/renderer.mjs"
          audralia_runtime_dir="$STAGE/showroom/globe/audralia/runtime-dependencies"
          audralia_app="$STAGE/showroom/globe/audralia/weather-presentation-reconciliation/app.mjs"
          test -f "$audralia_renderer_src"
          test -f "$audralia_app"
          mkdir -p "$audralia_runtime_dir"
          cp "$audralia_renderer_src" "$audralia_runtime_dir/renderer.mjs"
          python3 - "$audralia_app" <<'PY'
from pathlib import Path
import sys
path=Path(sys.argv[1])
text=path.read_text()
old="../../h-earth/terrain-estate-construction-v1/renderer.mjs"
new="../runtime-dependencies/renderer.mjs"
count=text.count(old)
if count != 1:
    raise SystemExit(f"AUDRALIA_RENDERER_IMPORT_REWRITE_CARDINALITY:{count}")
path.write_text(text.replace(old,new))
PY
          test "$(sha256sum "$audralia_renderer_src" | awk '{print $1}')" = "$(sha256sum "$audralia_runtime_dir/renderer.mjs" | awk '{print $1}')"

          git fetch --no-tags --depth=1 origin "$LEGACY_SHA"
          mkdir -p "$LEGACY_ROOT"
          git archive "$LEGACY_SHA" showroom/globe/audralia showroom/globe/h-earth h-earth-3d | tar -x -C "$LEGACY_ROOT"

          mkdir -p "$STAGE/.well-known"
          jq -n --arg schema 'DGB_PUBLIC_RELEASE_MARKER_v2' --arg commit '${{ github.sha }}' --arg surface 'audralia' '{schema:$schema,commit:$commit,surface:$surface}' > "$STAGE/.well-known/dgb-release.json"

          grep -Fq 'AUDRALIA_RECOVERY_RUNTIME_20260831_001' "$STAGE/showroom/globe/audralia/index.html"
          grep -Fq 'APPROVED_PRESENTATION_PRE_RENDER_v1' "$STAGE/showroom/globe/audralia/index.html"
          grep -Fq 'scheduleRenderAll' "$STAGE/showroom/globe/audralia/weather-presentation-reconciliation/app.mjs"
          grep -Fq '../runtime-dependencies/renderer.mjs' "$STAGE/showroom/globe/audralia/weather-presentation-reconciliation/app.mjs"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy current main
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify restored Audralia live bytes
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          root="${PAGE_URL%/}/showroom/globe/audralia"
          for attempt in $(seq 1 30); do
            marker="$(curl -fsSL --max-time 20 "${PAGE_URL%/}/.well-known/dgb-release.json" 2>/dev/null || true)"
            html="$(curl -fsSL --max-time 20 "$root/" 2>/dev/null || true)"
            app="$(curl -fsSL --max-time 20 "$root/weather-presentation-reconciliation/app.mjs?cb=AUDRALIA_RECOVERY_RUNTIME_20260831_001" 2>/dev/null || true)"
            observed="$(printf '%s' "$marker" | jq -r '.commit // empty' 2>/dev/null || true)"
            if [ "$observed" = "$TARGET_SHA" ] \
              && printf '%s' "$html" | grep -Fq 'AUDRALIA_RECOVERY_RUNTIME_20260831_001' \
              && printf '%s' "$html" | grep -Fq 'APPROVED_PRESENTATION_PRE_RENDER_v1' \
              && printf '%s' "$app" | grep -Fq 'scheduleRenderAll' \
              && ! printf '%s' "$html" | grep -Fq '../../../assets/audralia/audralia.planet.js'; then
              echo "AUDRALIA_RESTORED_LIVE_BYTES_VERIFIED target=$TARGET_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "AUDRALIA_LIVE_RECOVERY_NOT_PROVEN target=$TARGET_SHA" >&2
          exit 1

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install browser driver
        shell: bash
        run: npm install --no-save --no-package-lock puppeteer-core@24.15.0

      - name: Verify Audralia runtime readiness
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          MANIFEST_PATH: .github/ai-router/publication-surfaces/audralia.json
        run: |
          set -euo pipefail
          export CHROME_PATH="$(command -v google-chrome || command -v chrome || command -v chromium || find /opt/hostedtoolcache/setup-chrome -type f -name chrome 2>/dev/null | head -1)"
          test -x "$CHROME_PATH"
          node tools/publication-live-verify.mjs runtime "$PAGE_URL" "$MANIFEST_PATH"
