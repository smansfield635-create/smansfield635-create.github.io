name: H-Earth Inter-Hill Estate Evaluator Materialization

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/h-earth-inter-hill-estate-successor-evaluator-materialize.yml

permissions:
  contents: write
  issues: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct checksum-bound implementation payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE='0d88fe21aba99c97b73fcdc68d44af57d55b68be'
          TARGET='role1/inter-hill-estate-successor-evaluator-implementation-001'
          ISSUE=614
          PAYLOAD_SHA='1355e2abdd1354a398edd7705da423bb1287f9f8f182f5618062b3b8b265a847'
          MARKER='H_EARTH_INTER_HILL_ESTATE_16_PATH_PAYLOAD_v1'
          work=/tmp/inter-hill-estate-materialize
          rm -rf "$work"
          mkdir -p "$work/comments" "$work/payload"
          git fetch origin main "$TARGET"
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git rev-parse origin/$TARGET)" = "$BASE"

          ids=(5195430059 5195454167 5195508604 5195513760 5195519285)
          for index in "${!ids[@]}"; do
            sequence=$((index+1))
            gh api "repos/smansfield635-create/smansfield635-create.github.io/issues/comments/${ids[$index]}" > "$work/comments/comment-${sequence}.json"
          done

          python3 - <<'PY2'
          import base64, hashlib, json, pathlib, re
          root=pathlib.Path('/tmp/inter-hill-estate-materialize')
          marker='H_EARTH_INTER_HILL_ESTATE_16_PATH_PAYLOAD_v1'
          expected_payload='1355e2abdd1354a398edd7705da423bb1287f9f8f182f5618062b3b8b265a847'
          expected_chunks=[
            '2f98a1c7ba0ed0db65cf771ae518ff8b5f4004086b0ba93360ccc3d13b1b1fd4',
            '9491634a4f6f17c9b84808271b15f6548cce18bd98dad59db9374ec7e3448514',
            'de6a0e6f91c72b9cb3b347baabf6f5cebd6284a9326035c9e98542cf9fa111f1',
            'f56e206715d9de8260a2d34bb24c167a9e7f08663d9751e50f7e98546995e7dc',
            '89567b46e7ec1cd7eb6411afe8a96251e91bf1dba95383a040a2730281eefd00',
          ]
          chunks=[]
          for sequence in range(1,6):
              body=json.loads((root/'comments'/f'comment-{sequence}.json').read_text()).get('body','')
              match=re.fullmatch(rf'{marker}:(\d+):(\d+):([0-9a-f]{{64}})\n([A-Za-z0-9+/=]+)',body)
              if not match:
                  raise SystemExit(f'CARRIER_COMMENT_FORMAT_MISMATCH:{sequence}')
              index,total,declared,payload=int(match.group(1)),int(match.group(2)),match.group(3),match.group(4)
              if index != sequence or total != 5 or declared != expected_chunks[sequence-1]:
                  raise SystemExit(f'CARRIER_COMMENT_IDENTITY_MISMATCH:{sequence}')
              actual=hashlib.sha256(payload.encode()).hexdigest()
              if actual != declared:
                  raise SystemExit(f'CARRIER_CHUNK_SHA256_MISMATCH:{sequence}:{actual}:{declared}')
              chunks.append(payload)
          raw=base64.b64decode(''.join(chunks),validate=True)
          actual=hashlib.sha256(raw).hexdigest()
          if actual != expected_payload:
              raise SystemExit(f'CARRIER_PAYLOAD_SHA256_MISMATCH:{actual}')
          (root/'implementation.tgz').write_bytes(raw)
          print(json.dumps({'chunkCount':5,'payloadByteCount':len(raw),'payloadSha256':actual},indent=2))
          PY2

          tar -xzf "$work/implementation.tgz" -C "$work/payload"
          cd "$work/payload"
          cat > /tmp/inter-hill-expected-sha256s <<'SUMS'
          e644009feb3accc2c0617ea7d2ca952cad026b5bc97095d439168cff1295d6e7  .github/workflows/h-earth-inter-hill-estate-successor-evaluator.yml
          ac3b3536f36e86793bfcfb0c6be853655c7749ff58af64a62f2021864a4c0ea1  h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/inter-hill-estate-successor-evaluator/AGENTS.md
          178bfca7c40093d554f116c4c3d0f3b5a28e2c13d96372fa2ce555dbbfd62b35  h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/inter-hill-estate-successor-evaluator/requirements.v1.json
          6d529fd1734e7e6e2df02df835666911dedb9b2036f1f2d42326b64c788fe09a  h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/inter-hill-estate-successor-evaluator/input-schema.v1.json
          de31063e11ece7a4b18d1b0eaab0cf0365fb7a3e619d172314755fa8d10194ec  h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/inter-hill-estate-successor-evaluator/output-schema.v1.json
          181ad11fa824d3fb3bfee1fa1f1b4d6e4d2391ed543dcdf8049851d63f7517d8  h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/inter-hill-estate-successor-evaluator/operator-family-admission.v1.json
          fd3c899c1cc69ccb38d7c9ea1604ca58b03c46ac574c9a36993b96d31e858a4d  h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/inter-hill-estate-successor-evaluator/negative-fixtures.v1.json
          a5d4f1ca262dc2f8771fec30d3ff602d66eb4c2d8c831416cfcf8a9ea7e16df0  h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/inter-hill-estate-successor-evaluator/changed-path-manifest.v1.json
          503adee6b850929a23b4872794cc468e134258ccf52ae7b5420c94caf699ee86  tools/h-earth-map-wide-terrain/inter-hill-estate/accepted-local-reference-loader.v1.mjs
          db5ba1d8eb0f37d7a7644dd96194fbb506fbed16d8f7102b8803329ed6760615  tools/h-earth-map-wide-terrain/inter-hill-estate/real-terrain-partition.v1.mjs
          4731f2f9bd73b07079fd84da0f73926da05f53ee57bead3ea075600ff4b9c145  tools/h-earth-map-wide-terrain/inter-hill-estate/estate-multizone-search.v1.mjs
          c59c20bd9b127e156a5dc71dbdb098f8305760a3f4c3033fc99a9b9aaed036a7  tools/h-earth-map-wide-terrain/inter-hill-estate/view-approach-evaluator.v1.mjs
          5d27a93fdde04eeae6022f2d78c9feb0b766068bf52dbb332d67b9e78ab555e8  tools/h-earth-map-wide-terrain/inter-hill-estate/cumulative-budget-evaluator.v1.mjs
          1148c833a824badb555fb7022a327551f7109e835a45f49d046679c71759d315  tools/h-earth-map-wide-terrain/inter-hill-estate/successor-evaluator.v1.mjs
          48281286a45e71e7ad526d080e38c910f1aa2e3f83a779b438ee3f36d0c4ecef  tools/h-earth-map-wide-terrain/inter-hill-estate/self-test.v1.mjs
          0c4d29784f55bc74f5d06c4b86b0fd08747a52831e8f6194490c32a8ea207c0a  h-earth-3d/validation/h-earth.inter-hill-estate-successor-evaluator.mjs
          SUMS
          sed -i 's/^          //' /tmp/inter-hill-expected-sha256s
          sha256sum -c /tmp/inter-hill-expected-sha256s

          expected_paths=(
            '.github/workflows/h-earth-inter-hill-estate-successor-evaluator.yml'
            'h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/inter-hill-estate-successor-evaluator/AGENTS.md'
            'h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/inter-hill-estate-successor-evaluator/requirements.v1.json'
            'h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/inter-hill-estate-successor-evaluator/input-schema.v1.json'
            'h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/inter-hill-estate-successor-evaluator/output-schema.v1.json'
            'h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/inter-hill-estate-successor-evaluator/operator-family-admission.v1.json'
            'h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/inter-hill-estate-successor-evaluator/negative-fixtures.v1.json'
            'h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/inter-hill-estate-successor-evaluator/changed-path-manifest.v1.json'
            'tools/h-earth-map-wide-terrain/inter-hill-estate/accepted-local-reference-loader.v1.mjs'
            'tools/h-earth-map-wide-terrain/inter-hill-estate/real-terrain-partition.v1.mjs'
            'tools/h-earth-map-wide-terrain/inter-hill-estate/estate-multizone-search.v1.mjs'
            'tools/h-earth-map-wide-terrain/inter-hill-estate/view-approach-evaluator.v1.mjs'
            'tools/h-earth-map-wide-terrain/inter-hill-estate/cumulative-budget-evaluator.v1.mjs'
            'tools/h-earth-map-wide-terrain/inter-hill-estate/successor-evaluator.v1.mjs'
            'tools/h-earth-map-wide-terrain/inter-hill-estate/self-test.v1.mjs'
            'h-earth-3d/validation/h-earth.inter-hill-estate-successor-evaluator.mjs'
          )
          mapfile -t actual_paths < <(find . -type f -printf '%P\n' | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected_paths[@]}" | sort)
          test "${#actual_paths[@]}" -eq 16
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual_paths[@]}")
          for path in "${expected_paths[@]}"; do
            if git --git-dir="$GITHUB_WORKSPACE/.git" cat-file -e "$BASE:$path" 2>/dev/null; then
              echo "EXISTING_PATH_MUTATION_PROHIBITED:$path" >&2
              exit 1
            fi
          done

      - name: Create exact one-commit additive implementation branch
        shell: bash
        run: |
          set -euo pipefail
          BASE='0d88fe21aba99c97b73fcdc68d44af57d55b68be'
          TARGET='role1/inter-hill-estate-successor-evaluator-implementation-001'
          work=/tmp/inter-hill-estate-materialize
          expected_paths=(
            '.github/workflows/h-earth-inter-hill-estate-successor-evaluator.yml'
            'h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/inter-hill-estate-successor-evaluator/AGENTS.md'
            'h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/inter-hill-estate-successor-evaluator/requirements.v1.json'
            'h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/inter-hill-estate-successor-evaluator/input-schema.v1.json'
            'h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/inter-hill-estate-successor-evaluator/output-schema.v1.json'
            'h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/inter-hill-estate-successor-evaluator/operator-family-admission.v1.json'
            'h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/inter-hill-estate-successor-evaluator/negative-fixtures.v1.json'
            'h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/inter-hill-estate-successor-evaluator/changed-path-manifest.v1.json'
            'tools/h-earth-map-wide-terrain/inter-hill-estate/accepted-local-reference-loader.v1.mjs'
            'tools/h-earth-map-wide-terrain/inter-hill-estate/real-terrain-partition.v1.mjs'
            'tools/h-earth-map-wide-terrain/inter-hill-estate/estate-multizone-search.v1.mjs'
            'tools/h-earth-map-wide-terrain/inter-hill-estate/view-approach-evaluator.v1.mjs'
            'tools/h-earth-map-wide-terrain/inter-hill-estate/cumulative-budget-evaluator.v1.mjs'
            'tools/h-earth-map-wide-terrain/inter-hill-estate/successor-evaluator.v1.mjs'
            'tools/h-earth-map-wide-terrain/inter-hill-estate/self-test.v1.mjs'
            'h-earth-3d/validation/h-earth.inter-hill-estate-successor-evaluator.mjs'
          )
          git switch --detach "$BASE"
          git switch -C "$TARGET"
          cp -a "$work/payload/." .
          git add -- "${expected_paths[@]}"
          mapfile -t staged < <(git diff --cached --name-only | sort)
          mapfile -t expected < <(printf '%s\n' "${expected_paths[@]}" | sort)
          test "${#staged[@]}" -eq 16
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${staged[@]}")
          mapfile -t status < <(git diff --cached --name-status)
          test "${#status[@]}" -eq 16
          if printf '%s\n' "${status[@]}" | grep -Ev '^A[[:space:]]' >/dev/null; then
            echo 'NON_ADDITIVE_PATH_DETECTED' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement H-Earth inter-hill estate successor evaluator'
          test "$(git rev-parse HEAD^)" = "$BASE"
          mapfile -t final_paths < <(git diff --name-only "$BASE" HEAD | sort)
          test "${#final_paths[@]}" -eq 16
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${final_paths[@]}")
          git push origin "HEAD:refs/heads/$TARGET"
          echo "IMPLEMENTATION_HEAD=$(git rev-parse HEAD)"
