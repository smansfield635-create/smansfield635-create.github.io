name: FAP1 GC W5 Single Surface Ownership Qualification v1
on:
  pull_request:
    paths: ['.github/workflows/fap1-gc-w5-single-surface-qualification-v1.yml']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fc503ec6458161281c1a68f2c2d7a9ed6f87fb83
      - id: chrome
        uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --no-package-lock puppeteer-core@24.15.0
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          for a in $(seq 1 120); do curl -fsS http://127.0.0.1:4173/showroom/globe/audralia/ >/dev/null && exit 0; sleep .25; done; exit 1
      - name: Prove single W5 runtime owner and presented pixels
        timeout-minutes: 5
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          timeout 285s node <<'NODE'
          const puppeteer=require('puppeteer-core'),fs=require('fs');
          const mark=(name,data={})=>console.log('OWNERSHIP',JSON.stringify({t:Date.now(),name,data}));
          const delay=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:'new',args:['--no-sandbox','--ignore-gpu-blocklist','--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            const page=await browser.newPage();await page.setViewport({width:900,height:900});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/showroom/globe/audralia/',{waitUntil:'domcontentloaded',timeout:45000});
            mark('APP_IMPORT_BEGIN');
            await page.evaluate(()=>import('./weather-presentation-reconciliation/app.mjs?qual=single-owner'));
            await page.waitForFunction(()=>!!window.__AUDRALIA_WEATHER_PRESENTATION_RECONCILIATION__?.renderer,{timeout:100000});
            mark('APP_READY');
            if(!(await page.evaluate(()=>window.__AUDRALIA_FAP1_GA_AUTHORITY__?.meteorologicalAuthority==='FAP1_ONLY'))){
              await page.evaluate(()=>import('./weather-presentation-reconciliation/fap1-ga-authority-bootstrap.mjs?qual=single-owner'));
              await page.waitForFunction(()=>window.__AUDRALIA_FAP1_GA_AUTHORITY__?.meteorologicalAuthority==='FAP1_ONLY',{timeout:30000});
            }
            mark('GA_READY');

            await page.evaluate(()=>import('./weather-presentation-reconciliation/fap1-w5-handoff-bootstrap.gb.mjs?qual=owner-a'));
            await page.waitForFunction(()=>window.__AUDRALIA_FAP1_W5_HANDOFF__?.surfaceOwnership==='SINGLE_RUNTIME_OWNER'&&window.__AUDRALIA_FAP1_W5_HANDOFF__?.getSurfaceCount?.()===1,{timeout:30000});
            const first=await page.evaluate(()=>({count:window.__AUDRALIA_FAP1_W5_HANDOFF__.getSurfaceCount(),canvas:!!window.__AUDRALIA_FAP1_W5_HANDOFF__.getActiveSurface()}));
            mark('FIRST_OWNER',first);

            await page.evaluate(()=>import('./weather-presentation-reconciliation/fap1-w5-handoff-bootstrap.gb.mjs?qual=owner-b'));
            await page.waitForFunction(()=>window.__AUDRALIA_FAP1_W5_HANDOFF__?.surfaceOwnership==='SINGLE_RUNTIME_OWNER'&&window.__AUDRALIA_FAP1_W5_HANDOFF__?.getSurfaceCount?.()===1,{timeout:30000});
            await delay(250);
            const second=await page.evaluate(()=>({count:window.__AUDRALIA_FAP1_W5_HANDOFF__.getSurfaceCount(),domCount:document.querySelectorAll('canvas[data-fap1-w5-local-raymarch="true"]').length,canvas:!!window.__AUDRALIA_FAP1_W5_HANDOFF__.getActiveSurface()}));
            mark('SECOND_OWNER',second);
            if(second.count!==1||second.domCount!==1||!second.canvas)throw new Error('W5_SINGLE_SURFACE_OWNERSHIP_NOT_PROVEN');

            const witness=await page.evaluate(async()=>{
              const S=await import('./weather-presentation-reconciliation/fap1-spatial-lod.gb.mjs?qual=single-owner');
              const W=await import('./weather-presentation-reconciliation/fap1-w5-local-density.gb.mjs?qual=single-owner');
              const ga=window.__AUDRALIA_FAP1_GA_AUTHORITY__,packet=ga.descriptorPacket()??ga.renderNow();
              const objects=S.buildFAP1SpatialWeatherObjects({packet}),o=objects.find(x=>x.ID_i==='SOUTHEAST_DEEP_CONVECTION'),brick=W.buildW5DensityBrick(o),body=brick.mesoBodies[1]||brick.mesoBodies[0];
              const pc=S.PLANET_CENTER,c=o.V_i.center,r=[c[0]-pc[0],c[1]-pc[1],c[2]-pc[2]],len=Math.hypot(...r),dir=r.map(v=>v/len),angle=Math.acos(Math.max(-1,Math.min(1,dir[1]))),horiz=Math.hypot(dir[0],dir[2])||1,radius=angle*S.PLANET_RADIUS,baseU=radius*dir[0]/horiz,baseV=radius*dir[2]/horiz;
              const targetU=baseU+body.center[0]*o.V_i.radii[0],targetV=baseV+body.center[2]*o.V_i.radii[2],altitude=o.Z_i.centerAltitude+body.center[1]*o.V_i.radii[1],distance=Math.max(95,Math.min(180,(altitude-18)/Math.sin(.46)));
              return{targetU,targetV,distance,pitch:.46,yaw:2.4,weatherId:o.ID_i};
            });
            await page.evaluate(w=>window.__AUDRALIA_WEATHER_PRESENTATION_RECONCILIATION__.setCameraStateForTest(w),witness);
            const receipt=await page.evaluate(()=>{window.__AUDRALIA_FAP1_GA_AUTHORITY__.renderNow();return window.__AUDRALIA_FAP1_W5_HANDOFF__.renderNow();});
            mark('HANDOFF',receipt);

            const cpu=await page.evaluate(async()=>{
              const S=await import('./weather-presentation-reconciliation/fap1-spatial-lod.gb.mjs?qual=single-owner-cpu');
              const W=await import('./weather-presentation-reconciliation/fap1-w5-local-density.gb.mjs?qual=single-owner-cpu');
              const ga=window.__AUDRALIA_FAP1_GA_AUTHORITY__,p=window.__AUDRALIA_WEATHER_PRESENTATION_RECONCILIATION__,packet=ga.descriptorPacket(),o=S.buildFAP1SpatialWeatherObjects({packet}).find(x=>x.ID_i==='SOUTHEAST_DEEP_CONVECTION'),cam=p.getCameraFrame();
              let max=0,occupied=0;for(let i=0;i<32;i++){const t=i*8,pt=[cam.eye[0]+cam.forward[0]*t,cam.eye[1]+cam.forward[1]*t,cam.eye[2]+cam.forward[2]*t],d=W.sampleW5LocalDensity(o,pt);max=Math.max(max,d);if(d>.0025)occupied++;}
              return{rhoEye:W.sampleW5LocalDensity(o,cam.eye),maxForward:max,occupiedForward:occupied,interval:S.rayWeatherVolumeInterval(cam.eye,cam.forward,o)};
            });
            mark('CPU',cpu);

            const gpu=await page.evaluate(()=>{
              const owner=window.__AUDRALIA_FAP1_W5_HANDOFF__,canvas=owner.getActiveSurface();
              if(!canvas)return{canvas:false};const gl=canvas.getContext('webgl2',{preserveDrawingBuffer:true});if(!gl)return{canvas:true,gl:false};
              const w=canvas.width,h=canvas.height,pix=new Uint8Array(w*h*4);gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,pix);let nonzero=0,maxAlpha=0;for(let i=3;i<pix.length;i+=4){if(pix[i])nonzero++;if(pix[i]>maxAlpha)maxAlpha=pix[i];}
              const cs=getComputedStyle(canvas),wr=canvas.getBoundingClientRect();
              return{canvas:true,gl:true,w,h,nonzero,maxAlpha,display:cs.display,zIndex:cs.zIndex,rect:{x:wr.x,y:wr.y,width:wr.width,height:wr.height},weatherId:canvas.dataset.weatherId,brickAddress:canvas.dataset.brickAddress,domCount:document.querySelectorAll('canvas[data-fap1-w5-local-raymarch="true"]').length};
            });
            mark('ACTIVE_GPU',gpu);
            await page.screenshot({path:'w5-single-owner-presented.png'});
            const pass=second.domCount===1&&receipt?.active===true&&receipt?.weatherId==='SOUTHEAST_DEEP_CONVECTION'&&cpu.maxForward>0&&gpu.nonzero>0&&gpu.display!=='none'&&gpu.domCount===1;
            fs.writeFileSync('w5-single-owner-receipt.json',JSON.stringify({pass,first,second,witness,receipt,cpu,gpu,errors},null,2));
            if(!pass)throw new Error('W5_SINGLE_SURFACE_PRESENTATION_GATE_FAILED');
            await browser.close();
          })().catch(e=>{console.error('OWNERSHIP_ERROR',e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w5-single-surface-qualification
          path: |
            w5-single-owner-receipt.json
            w5-single-owner-presented.png
          if-no-files-found: warn
