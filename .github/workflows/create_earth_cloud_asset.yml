name: H-Earth Gate 4B stage six replacement blobs

on:
  push:
    branches:
      - agent/h-earth-gate4b-helper
    paths:
      - ".github/workflows/create_earth_cloud_asset.yml"

permissions:
  contents: write

jobs:
  stage-six-replacements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/h-earth-gate4b-helper
          fetch-depth: 0

      - name: Recover accepted replacement constructor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/workflows/fd05-shoreline-gate4.yml?ref=b1fc49f962e2f727cd9dd69c7a9add6cf3828f58" \
            -o /tmp/gate4-source.yml
          python3 - <<'PY'
          import base64
          import gzip
          import pathlib
          import re

          source = pathlib.Path('/tmp/gate4-source.yml').read_text(encoding='utf-8')
          match = re.search(
              r"printf '%s' '([^']+)' \| base64 -d \| gzip -d > /tmp/gate4-patch.py",
              source,
          )
          if match is None:
              raise SystemExit('accepted Gate 4 replacement payload not found')
          pathlib.Path('/tmp/gate4-patch.py').write_bytes(
              gzip.decompress(base64.b64decode(match.group(1)))
          )
          PY

      - name: Stage exactly six corrected existing files on helper
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/gate4-patch.py

          actual="$(git diff --name-only | sort | tr '\n' ' ')"
          expected="showroom/globe/h-earth/environment.js showroom/globe/h-earth/render/geometry-foam.js showroom/globe/h-earth/render/geometry-ground.js showroom/globe/h-earth/render/geometry-preview.js showroom/globe/h-earth/render/geometry-water.js showroom/globe/h-earth/render/shoreline-preview.js "
          test "$actual" = "$expected"
          test -z "$(git diff --diff-filter=AD --name-only)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            showroom/globe/h-earth/environment.js \
            showroom/globe/h-earth/render/geometry-preview.js \
            showroom/globe/h-earth/render/geometry-ground.js \
            showroom/globe/h-earth/render/geometry-foam.js \
            showroom/globe/h-earth/render/geometry-water.js \
            showroom/globe/h-earth/render/shoreline-preview.js
          git commit -m "Stage Gate 4B six replacement blobs" \
            -m "No tests executed. Helper-only staging for clean six-path commit construction."
          git push origin HEAD:agent/h-earth-gate4b-helper
