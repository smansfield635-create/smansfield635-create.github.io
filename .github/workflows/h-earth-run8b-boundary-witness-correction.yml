name: H-Earth Run 8B Correction Cleanup

on:
  push:
    branches:
      - agent/h-earth-run8b-successor-neutral-geometry-001
  pull_request:
    branches:
      - agent/h-earth-run8a-dimensional-reconciliation-001

permissions:
  contents: write

jobs:
  cleanup-run8b-correction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/h-earth-run8b-successor-neutral-geometry-001
          fetch-depth: 0

      - name: Remove temporary correction workflow
        run: |
          rm .github/workflows/h-earth-run8b-boundary-witness-correction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows/h-earth-run8b-boundary-witness-correction.yml
          git commit -m 'Remove temporary Run 8B correction workflow'
          git push origin HEAD:agent/h-earth-run8b-successor-neutral-geometry-001
