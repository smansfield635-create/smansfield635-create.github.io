name: Mirror Manor Carousel Culling Fix
on:
  pull_request:
    paths:
      - 'assets/compass/compass.house-scene.js'
      - '.github/ai-router/projects/compass/verify-mirror-manor-carousel-culling-fix.mjs'
      - 'preview/mirror-manor-carousel-culling-fix/**'
      - 'h-earth-3d/validation/manor/mirror-manor.carousel-culling-fix.receipt.md'
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/compass/compass.house-scene.js
      - run: node .github/ai-router/projects/compass/verify-mirror-manor-carousel-culling-fix.mjs
