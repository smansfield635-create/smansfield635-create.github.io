name: H-Earth R06-C10 Candidate Preview 95504c V11 Runtime Identity

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h-earth-r06-c10-preview-95504c-v11-runtime-identity.yml'

permissions:
  contents: write

concurrency:
  group: h-earth-r06-c10-preview-95504c-v11-runtime-identity
  cancel-in-progress: false

jobs:
  prove-and-publish:
    if: github.head_ref == 'publication/h-earth-r06-c10-preview-95504c-001'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_HEAD: 95504c9927922318225da1d61fa303cec70497f9
      PUBLICATION_BRANCH: publication/h-earth-r06-c10-preview-95504c-001
      PREVIEW_ROOT: preview/h-earth/r06-c10/95504c9927922318225da1d61fa303cec70497f9
      PREVIEW_URL_PATH: /preview/h-earth/r06-c10/95504c9927922318225da1d61fa303cec70497f9/index.html
      SOURCE_ENTRY: showroom/globe/h-earth/index.html
      V10_WORKFLOW: .github/workflows/h-earth-r06-c10-preview-95504c-v10-full-frame.yml
      PLAYWRIGHT_VERSION: 1.55.0
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: publication/h-earth-r06-c10-preview-95504c-001
          fetch-depth: 0
          path: publication

      - name: Check out exact terrain candidate
        uses: actions/checkout@v4
        with:
          ref: 95504c9927922318225da1d61fa303cec70497f9
          fetch-depth: 1
          path: source

      - name: Materialize and apply bounded terrain preview compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,textwrap
          from pathlib import Path
          workflow=Path(os.environ['GITHUB_WORKSPACE'])/'publication'/os.environ['V10_WORKFLOW']
          text=workflow.read_text()
          match=re.search(r"- name: Materialize and apply bounded preview compatibility.*?python3 - <<'PY'\n(.*?)\n          PY",text,re.S)
          if not match: raise RuntimeError('V10_MATERIALIZATION_BLOCK_NOT_FOUND')
          exec(compile(textwrap.dedent(match.group(1)),'v11-materialize-compatibility.py','exec'),{'__name__':'__main__'})
          PY

      - name: Bind complete candidate package identity into preview renderers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proof"
          cat > "$RUNNER_TEMP/resolve-package-id.mjs" <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import process from 'node:process';
          import { pathToFileURL } from 'node:url';
          const root=path.join(process.env.GITHUB_WORKSPACE,'publication',process.env.PREVIEW_ROOT,'_source');
          const module=await import(pathToFileURL(path.join(root,'showroom/globe/h-earth/render/live-render-package.run8e-r2.canonical.js')).href);
          const record=module.getHEarthRun8ER2CanonicalLiveRenderPackage();
          if(record?.eligible!==true||!/^H_EARTH_RUN_8E_R2_LIVE_RENDER_PACKAGE_[0-9A-F]{8}$/.test(record.packageIdentity))throw new Error(`CANDIDATE_CANONICAL_PACKAGE_NOT_ELIGIBLE:${record?.status}:${record?.packageIdentity}`);
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'proof','candidate-package-identity.json'),JSON.stringify({packageIdentity:record.packageIdentity,contentDigest:record.contentDigest,status:record.status,eligible:record.eligible},null,2)+'\n');
          process.stdout.write(record.packageIdentity);
          JS
          PACKAGE_ID="$(node "$RUNNER_TEMP/resolve-package-id.mjs")"
          export PACKAGE_ID
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])/'publication'/os.environ['PREVIEW_ROOT']
          package_id=os.environ['PACKAGE_ID']
          renderer_paths=[
            '_source/showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js',
            '_source/showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-round1-1f520809.js',
            '_source/showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.js'
          ]
          manifest_path=root/'byte-manifest.json'
          manifest=json.loads(manifest_path.read_text())
          bindings=[]
          for rel in renderer_paths:
              path=root/rel
              text=path.read_text()
              changed,count=re.subn(r"const LOGICAL_ID = 'H_EARTH_RUN_8E_R2_LIVE_RENDER_PACKAGE_[0-9A-F]{8}';",f"const LOGICAL_ID = '{package_id}';",text,count=1)
              if count!=1: raise RuntimeError(f'RENDERER_PACKAGE_ID_PATCH_COUNT:{rel}:{count}')
              path.write_text(changed)
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              row=next((r for r in manifest['sourceEntries'] if r['previewFile']==rel),None)
              if row is None: raise RuntimeError(f'RENDERER_MANIFEST_ROW_MISSING:{rel}')
              source_identity=re.search(r"const LOGICAL_ID = '(H_EARTH_RUN_8E_R2_LIVE_RENDER_PACKAGE_[0-9A-F]{8})';",text)
              row['previewSha256']=digest
              row['transform']='PREVIEW_ONLY_BIND_RENDERER_TO_EXACT_COMPLETE_CANDIDATE_PACKAGE_IDENTITY'
              bindings.append({'previewFile':rel,'sourceExpectedPackageIdentity':source_identity.group(1) if source_identity else None,'candidatePackageIdentity':package_id,'previewSha256':digest})
          manifest['previewRuntimeIdentityBinding']={'class':'EXACT_COMPLETE_CANDIDATE_PACKAGE_IDENTITY','candidatePackageIdentity':package_id,'terrainElevationMutation':False,'candidateDeltaMutation':False,'rendererPresentationMutation':False,'bindings':bindings}
          manifest_path.write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          manifest_digest=hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          (root/'byte-manifest.sha256').write_text(f'{manifest_digest}  byte-manifest.json\n')
          receipt_path=root/'publication-receipt.json'
          receipt=json.loads(receipt_path.read_text())
          receipt.update({'manifestDigest':'sha256:'+manifest_digest,'candidatePackageIdentity':package_id,'previewRuntimeIdentityBindingInstalled':True,'terrainElevationMutation':False,'candidateDeltaMutation':False,'rendererPresentationMutation':False})
          receipt_path.write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps({'candidatePackageIdentity':package_id,'rendererBindings':len(bindings),'manifestDigest':manifest_digest}))
          PY

      - name: Verify complete package and identity correspondence
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/package-check.mjs" <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import process from 'node:process';
          import { pathToFileURL } from 'node:url';
          const root=path.join(process.env.GITHUB_WORKSPACE,'publication',process.env.PREVIEW_ROOT,'_source');
          const packageModule=await import(pathToFileURL(path.join(root,'showroom/globe/h-earth/render/live-render-package.run8e-r2.canonical.js')).href);
          const rawModule=await import(pathToFileURL(path.join(root,'showroom/globe/h-earth/render/live-render-package.run8e-r2.js')).href);
          const terrain=await import(pathToFileURL(path.join(root,'h-earth-3d/terrain/h-earth.successor-terrain-field.run8b.js')).href);
          const canonical=packageModule.getHEarthRun8ER2CanonicalLiveRenderPackage();
          const raw=rawModule.getHEarthRun8ER2ImmutableLiveRenderPackage();
          const witnesses=[[44,-168],[44,-180],[44,-192],[32,-192],[64,-164]].map(([x,z])=>{const s=terrain.sampleHEarthRun8BSuccessorTerrainField(x,z);return{x,z,valid:s.valid,elevation:s.elevation,delta:s.appliedCandidateDelta,slope:s.slope,curvature:s.curvature};});
          const result={rawStatus:raw.status,rawIssueCount:raw.issues?.length??0,canonicalStatus:canonical.status,canonicalEligible:canonical.eligible,packageIdentity:canonical.packageIdentity,contentDigest:canonical.contentDigest,witnesses};
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'proof','package-check.json'),JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));
          if(raw.status!=='RUN_8E_R2_IMMUTABLE_LIVE_RENDER_PACKAGE_COMPLETE'||(raw.issues?.length??0)>0||canonical.eligible!==true||!witnesses.every(w=>w.valid&&Number.isFinite(w.elevation)&&Number.isFinite(w.slope)&&Number.isFinite(w.curvature))||!witnesses.some(w=>Math.abs(w.delta)>1e-9))process.exit(1);
          JS
          node "$RUNNER_TEMP/package-check.mjs"

      - name: Install Chromium verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium

      - name: Prove full visible environment on desktop and touch mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4188 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/publication" >"$RUNNER_TEMP/proof/server.log" 2>&1 &
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:4188$PREVIEW_URL_PATH" >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          python3 - <<'PY'
          import os,re,textwrap
          from pathlib import Path
          workflow=Path(os.environ['GITHUB_WORKSPACE'])/'publication'/os.environ['V10_WORKFLOW']
          text=workflow.read_text()
          match=re.search(r"cat > \"\$RUNNER_TEMP/pw/verify\.mjs\" <<'JS'\n(.*?)\n          JS",text,re.S)
          if not match: raise RuntimeError('V10_BROWSER_VERIFIER_BLOCK_NOT_FOUND')
          (Path(os.environ['RUNNER_TEMP'])/'pw'/'verify.mjs').write_text(textwrap.dedent(match.group(1)))
          PY
          cd "$RUNNER_TEMP/pw"
          node verify.mjs

      - name: Bind proof and commit verified preview root
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])/'publication'/os.environ['PREVIEW_ROOT']
          receipt_path=root/'publication-receipt.json'
          receipt=json.loads(receipt_path.read_text())
          proof=json.loads((Path(os.environ['RUNNER_TEMP'])/'proof'/'browser-proof.summary.json').read_text())
          package=json.loads((Path(os.environ['RUNNER_TEMP'])/'proof'/'package-check.json').read_text())
          identity=json.loads((Path(os.environ['RUNNER_TEMP'])/'proof'/'candidate-package-identity.json').read_text())
          receipt.update({'status':'PASS_VISIBLE_ENVIRONMENT_PROVEN','desktopBrowserProof':'PASS','touchMobileBrowserProof':'PASS','candidateTerrainModuleLoaded':True,'visibleWorldFrameProven':True,'packageConstructionResult':'PASS','browserProofSummary':proof,'packageCheck':package,'candidatePackageIdentityReceipt':identity})
          receipt_path.write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          cd "$GITHUB_WORKSPACE/publication"
          git config user.name h-earth-preview-publisher
          git config user.email actions@users.noreply.github.com
          git add "$PREVIEW_ROOT"
          test -n "$(git status --porcelain -- "$PREVIEW_ROOT")"
          git commit -m 'Publish verified R06 C10 candidate environment preview'
          git push origin "HEAD:$PUBLICATION_BRANCH"

      - name: Upload full proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-r06-c10-preview-95504c-v11-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/proof
            publication/${{ env.PREVIEW_ROOT }}/byte-manifest.json
            publication/${{ env.PREVIEW_ROOT }}/byte-manifest.sha256
            publication/${{ env.PREVIEW_ROOT }}/publication-receipt.json
          if-no-files-found: warn
          retention-days: 30
