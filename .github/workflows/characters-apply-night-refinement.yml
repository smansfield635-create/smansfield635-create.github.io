name: Characters Apply Night Refinement

on:
  push:
    branches:
      - agent/characters-night-world-state-proof
    paths:
      - '.github/workflows/characters-apply-night-refinement.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/characters-night-world-state-proof
          fetch-depth: 0
      - name: Apply exact-string runtime refinement
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('characters/app.mjs')
          s=p.read_text()
          def once(old,new,label):
              global s
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected exactly one source match, got {n}')
              s=s.replace(old,new,1)

          once("const returnButton=document.querySelector('#return');\n", "const returnButton=document.querySelector('#return');\nconst inspectButton=document.querySelector('#inspect');\n", 'inspect binding')
          once("const moonProgram=makeProgram(MOON_VS,MOON_FS);\nconst moonVAO=gl.createVertexArray();\n", """const moonProgram=makeProgram(MOON_VS,MOON_FS);\nconst moonVAO=gl.createVertexArray();\nconst SKY_VS=`#version 300 es\nprecision highp float;out vec2 vUv;void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);vUv=p*.5;gl_Position=vec4(p-1.0,0.0,1.0);}`;\nconst SKY_FS=`#version 300 es\nprecision highp float;in vec2 vUv;uniform float uDeep;out vec4 outColor;void main(){float y=clamp(vUv.y,0.0,1.0);vec3 zenith=mix(vec3(.006,.012,.032),vec3(.002,.005,.016),uDeep);vec3 horizon=mix(vec3(.055,.095,.17),vec3(.026,.045,.095),uDeep);float lift=exp(-pow((y-.33)/.19,2.0));vec3 c=mix(horizon,zenith,smoothstep(.18,.92,y));c+=mix(vec3(.025,.045,.08),vec3(.012,.022,.052),uDeep)*lift;outColor=vec4(c,1.0);}`;\nconst skyProgram=makeProgram(SKY_VS,SKY_FS);\nconst skyVAO=gl.createVertexArray();\n""", 'sky program')

          old="function setStory(d){storyMore.innerHTML='';if(!d){story.classList.remove('show');return;}storyKind.textContent=d.kind;storyTitle.textContent=d.title;storyCopy.textContent=d.copy;for(const p of d.more||[]){const el=document.createElement('p');el.textContent=p;storyMore.appendChild(el);}if(d.connections?.length){const wrap=document.createElement('div');wrap.className='connections';for(const id of d.connections){const target=byId.get(id);if(!target||worldState.destinations[id]?.signalState==='UNSEEN')continue;const b=document.createElement('button');b.type='button';b.textContent=target.title;b.addEventListener('click',()=>travelTo(target,true));wrap.appendChild(b);}storyMore.appendChild(wrap);}story.classList.add('show');visited.add(d.id);recomputeWorldState();}\nfunction finishArrival(){statusNode.textContent=`You found ${active.title}`;returnButton.classList.add('show');setStory(active);}\n"
          new="function setStory(d){storyMore.innerHTML='';if(!d){story.classList.remove('show');return;}storyKind.textContent=d.kind;storyTitle.textContent=d.title;storyCopy.textContent=d.copy;for(const p of d.more||[]){const el=document.createElement('p');el.textContent=p;storyMore.appendChild(el);}if(d.connections?.length){const wrap=document.createElement('div');wrap.className='connections';for(const id of d.connections){const target=byId.get(id);if(!target||worldState.destinations[id]?.signalState==='UNSEEN')continue;const b=document.createElement('button');b.type='button';b.textContent=target.title;b.addEventListener('click',()=>travelTo(target,true));wrap.appendChild(b);}storyMore.appendChild(wrap);}story.classList.add('show');}\nfunction discover(d){visited.add(d.id);recomputeWorldState();}\nfunction finishArrival(){discover(active);world.classList.add('intimate');statusNode.textContent=`You found ${active.title} · witness the place`;returnButton.classList.add('show');inspectButton.classList.add('show');setStory(null);}\ninspectButton.addEventListener('click',()=>{if(!active||transition)return;setStory(active);inspectButton.classList.remove('show');statusNode.textContent=`Inspecting ${active.title}`;});\n"
          once(old,new,'arrival inspect sequence')

          old="function travelTo(d,fromConnection=false){if(transition||worldState.destinations[d.id]?.signalState==='UNSEEN'||d===active&&!fromConnection)return;closeMap();setStory(null);returnButton.classList.remove('show');active=d;recomputeWorldState();statusNode.textContent=`Following ${d.signal.toLowerCase()}`;"
          new="function travelTo(d,fromConnection=false){if(transition||worldState.destinations[d.id]?.signalState==='UNSEEN'||d===active&&!fromConnection)return;closeMap();setStory(null);inspectButton.classList.remove('show');returnButton.classList.remove('show');world.classList.remove('intimate');active=d;recomputeWorldState();statusNode.textContent=`Following ${d.signal.toLowerCase()}`;"
          once(old,new,'travel arrival reset')

          old="function returnOrbit(){if(transition)return;closeMap();setStory(null);statusNode.textContent='Returning to the coast';returnButton.classList.remove('show');"
          new="function returnOrbit(){if(transition)return;closeMap();setStory(null);inspectButton.classList.remove('show');world.classList.remove('intimate');statusNode.textContent='Returning to the coast';returnButton.classList.remove('show');"
          once(old,new,'return intimate reset')

          old="function draw(mesh,waterFlag,vp,time){const u=nightUniforms(worldState);gl.useProgram(program);gl.uniformMatrix4fv(gl.getUniformLocation(program,'uVP'),false,vp);gl.uniform3fv(gl.getUniformLocation(program,'uEye'),camera.eye);gl.uniform1f(gl.getUniformLocation(program,'uTime'),time);gl.uniform1i(gl.getUniformLocation(program,'uWater'),waterFlag);gl.uniform1f(gl.getUniformLocation(program,'uLunarIntensity'),u.lunarIntensity);gl.uniform1f(gl.getUniformLocation(program,'uHorizonHaze'),u.horizonHaze);gl.uniform1f(gl.getUniformLocation(program,'uWaterMoonResponse'),u.waterMoonResponse);gl.bindVertexArray(mesh.vao);gl.drawElements(gl.TRIANGLES,mesh.count,gl.UNSIGNED_INT,0);}\nfunction drawMoon(vp){const moonPos=[-1180,1180,-2650];gl.useProgram(moonProgram);gl.uniformMatrix4fv(gl.getUniformLocation(moonProgram,'uVP'),false,vp);gl.uniform3fv(gl.getUniformLocation(moonProgram,'uMoonPos'),moonPos);gl.uniform1f(gl.getUniformLocation(moonProgram,'uSize'),compact?54:76);gl.bindVertexArray(moonVAO);gl.drawArrays(gl.POINTS,0,1);}\n"
          new="function draw(mesh,waterFlag,vp,time){const u=nightUniforms(worldState);gl.useProgram(program);gl.uniformMatrix4fv(gl.getUniformLocation(program,'uVP'),false,vp);gl.uniform3fv(gl.getUniformLocation(program,'uEye'),camera.eye);gl.uniform1f(gl.getUniformLocation(program,'uTime'),time);gl.uniform1i(gl.getUniformLocation(program,'uWater'),waterFlag);gl.uniform1f(gl.getUniformLocation(program,'uLunarIntensity'),u.lunarIntensity);gl.uniform1f(gl.getUniformLocation(program,'uHorizonHaze'),u.horizonHaze);gl.uniform1f(gl.getUniformLocation(program,'uWaterMoonResponse'),u.waterMoonResponse);gl.uniform1f(gl.getUniformLocation(program,'uMoonPathX'),camera.look[0]+320);gl.bindVertexArray(mesh.vao);gl.drawElements(gl.TRIANGLES,mesh.count,gl.UNSIGNED_INT,0);}\nfunction drawSky(){gl.disable(gl.DEPTH_TEST);gl.useProgram(skyProgram);gl.uniform1f(gl.getUniformLocation(skyProgram,'uDeep'),worldState.environment.phase==='deep-night'?1:0);gl.bindVertexArray(skyVAO);gl.drawArrays(gl.TRIANGLES,0,3);}\nfunction drawMoon(vp){const forward=norm(sub(camera.look,camera.eye)),right=norm(cross(forward,[0,1,0])),up=norm(cross(right,forward));const moonPos=add(add(add(camera.eye,scale(forward,2700)),scale(right,720)),scale(up,760));gl.disable(gl.DEPTH_TEST);gl.useProgram(moonProgram);gl.uniformMatrix4fv(gl.getUniformLocation(moonProgram,'uVP'),false,vp);gl.uniform3fv(gl.getUniformLocation(moonProgram,'uMoonPos'),moonPos);gl.uniform1f(gl.getUniformLocation(moonProgram,'uSize'),compact?66:94);gl.bindVertexArray(moonVAO);gl.drawArrays(gl.POINTS,0,1);}\n"
          once(old,new,'sky moon and reflection uniforms')

          old="function render(now){const {w,h}=resize();updateTransition(now);const vp=mul(perspective(52*Math.PI/180,w/h,1,5000),lookAt(camera.eye,camera.look));gl.enable(gl.DEPTH_TEST);gl.disable(gl.BLEND);const clear=worldState.environment.phase==='deep-night'?[.004,.008,.022,1]:GRATITUDE_COAST_NIGHT.sky.clear;gl.clearColor(clear[0],clear[1],clear[2],clear[3]);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);drawMoon(vp);draw(water,1,vp,reducedMotion?0:now*.001);draw(terrain,0,vp,reducedMotion?0:now*.001);updateSignals(vp);updateConstellations(vp);updateProofExpressions(vp);requestAnimationFrame(render);}\n"
          new="function render(now){const {w,h}=resize();updateTransition(now);const vp=mul(perspective(52*Math.PI/180,w/h,1,5000),lookAt(camera.eye,camera.look));gl.disable(gl.BLEND);const clear=worldState.environment.phase==='deep-night'?[.004,.008,.022,1]:GRATITUDE_COAST_NIGHT.sky.clear;gl.clearColor(clear[0],clear[1],clear[2],clear[3]);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);drawSky();drawMoon(vp);gl.enable(gl.DEPTH_TEST);draw(water,1,vp,reducedMotion?0:now*.001);draw(terrain,0,vp,reducedMotion?0:now*.001);updateSignals(vp);updateConstellations(vp);updateProofExpressions(vp);requestAnimationFrame(render);}\n"
          once(old,new,'render sequencing')

          p.write_text(s)
          PY
          node --check characters/app.mjs
          git diff --check
      - name: Commit bounded runtime refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add characters/app.mjs
          git commit -m 'Characters: refine night arrival and celestial rendering'
          git fetch origin agent/characters-night-world-state-proof
          git rebase origin/agent/characters-night-world-state-proof
          git push origin HEAD:agent/characters-night-world-state-proof
