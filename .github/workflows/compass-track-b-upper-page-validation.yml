name: Compass Track B Upper Page Qualification
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/compass/compass.track-b.js'
      - 'assets/compass/compass.track-b.css'
      - 'assets/compass/compass.carousel.js'
      - '.github/workflows/compass-track-b-upper-page-validation.yml'
permissions:
  contents: read
jobs:
  rendered:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 >/tmp/track-b-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Inspect Track B presentation
        run: |
          mkdir -p /tmp/track-b-rendered
          cat > .track-b-inspect.mjs <<'NODE'
          import {chromium} from 'playwright';import fs from 'node:fs';
          const b=await chromium.launch({headless:true}),out={};
          for(const [name,viewport] of Object.entries({desktop:{width:1440,height:1100},tablet:{width:900,height:1000},phone:{width:412,height:915}})){
            const p=await b.newPage({viewport});await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});await p.waitForTimeout(800);
            const state=await p.evaluate(()=>{const brand=document.querySelector('.compass-track-b-brand'),intro=document.querySelector('.compass-track-b-intro'),about=document.querySelector('.compass-track-b-about'),video=document.querySelector('.compass-track-b-film video'),built=document.querySelector('.compass-built'),orbit=document.querySelector('[data-capability-orbit]'),orbitSection=orbit?.closest('section')||orbit?.parentElement,cta=document.querySelector('.compass-build-cta'),scene=document.querySelector('[data-compass-scene]');return{brand:brand?.textContent.trim()||'',introClosed:Boolean(intro&&!intro.open),summary:intro?.querySelector(':scope>summary')?.textContent.trim()||'',about:about?.querySelector(':scope>summary')?.textContent.trim()||'',video:video?.querySelector('source')?.getAttribute('src')||'',introContainsOriginal:Boolean(about?.querySelector('.compass-introduction')),builtBeforeOrbit:Boolean(built&&orbitSection&&(built.compareDocumentPosition(orbitSection)&Node.DOCUMENT_POSITION_FOLLOWING)),ctaBeforeOrbit:Boolean(cta&&orbitSection&&(cta.compareDocumentPosition(orbitSection)&Node.DOCUMENT_POSITION_FOLLOWING)),sceneHeight:scene?.getBoundingClientRect().height||0,trackAArrows:orbit?.querySelectorAll('[data-orbit-next],[data-orbit-previous]').length??-1,guidance:orbit?.querySelector('.compass-capability-guidance')?.textContent.trim()||'',overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}});
            console.log(name,JSON.stringify(state));
            if(state.brand!=='DiamondGateBridge.com')throw Error(`${name}: brand`);if(!state.introClosed)throw Error(`${name}: intro open`);if(state.summary!=='New here? Open the introduction.')throw Error(`${name}: summary`);if(state.about!=='What is Diamond Gate Bridge?')throw Error(`${name}: about`);if(!state.video.includes('diamond-gate-compass-mirrorland-36s.mp4'))throw Error(`${name}: video`);if(!state.introContainsOriginal)throw Error(`${name}: original intro not consolidated`);if(!state.builtBeforeOrbit||!state.ctaBeforeOrbit)throw Error(`${name}: order`);if(state.trackAArrows!==0||state.guidance!=='Swipe to rotate.')throw Error(`${name}: Track A regression`);if(state.overflow>2)throw Error(`${name}: overflow ${state.overflow}`);if(state.sceneHeight<430)throw Error(`${name}: compass presentation too small ${state.sceneHeight}`);await p.screenshot({path:`/tmp/track-b-rendered/${name}.png`,fullPage:true});out[name]=state;await p.close();
          }
          await b.close();fs.writeFileSync('/tmp/track-b-rendered/receipt.json',JSON.stringify({result:'PASS_CLOSED',out},null,2));
          NODE
          node .track-b-inspect.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-track-b-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/track-b-rendered
          retention-days: 30
