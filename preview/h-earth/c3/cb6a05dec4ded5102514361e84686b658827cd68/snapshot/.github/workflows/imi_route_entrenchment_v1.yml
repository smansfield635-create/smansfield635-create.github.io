name: IMI route-entrenchment test v1

on:
  pull_request:
    paths:
      - 'research/imi/IMI_ROUTE_ENTRENCHMENT_PROTOCOL_v1.md'
      - 'research/imi/IMI_ROUTE_ENTRENCHMENT_FREEZE_v1.txt'
      - 'research/imi/imi_route_entrenchment_test_v1.py'
      - '.github/workflows/imi_route_entrenchment_v1.yml'
  workflow_dispatch:

jobs:
  route-entrenchment-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/imi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: pip install numpy pandas requests
      - name: Execute frozen route-entrenchment test
        run: python research/imi/imi_route_entrenchment_test_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imi-route-entrenchment-test-v1
          path: |
            imi_route_entrenchment_findings_v1.json
            IMI_ROUTE_ENTRENCHMENT_VERDICT_v1.txt
            imi_route_entrenchment_confirmation_panel_v1.csv
          if-no-files-found: warn
