name: Temporary Cancel Redundant Hurricane Runs

on:
  push:
    paths:
      - '.github/workflows/temporary-cancel-redundant-hurricane-runs.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel-redundant-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded corrected run and preserve current corrected run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          KEEP=31195025635
          CANCEL_RUNS=(
            31193672956
          )
          echo "Current authoritative QC run preserved: ${KEEP}"
          for run_id in "${CANCEL_RUNS[@]}"; do
            echo "Cancelling superseded run ${run_id}"
            code=$(curl -sS -o /tmp/cancel-${run_id}.txt -w '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/runs/${run_id}/cancel")
            if [[ "${code}" == "202" || "${code}" == "409" ]]; then
              echo "run ${run_id}: cancel response ${code}"
            else
              cat /tmp/cancel-${run_id}.txt || true
              echo "Unexpected cancel response ${code} for ${run_id}" >&2
              exit 1
            fi
          done
