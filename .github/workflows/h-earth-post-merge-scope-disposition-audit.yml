name: H-Earth Capacity Single-Module Restoration Builder

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit-capacity-restoration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and execute single-module restoration
        run: node --experimental-default-type=module tools/h-earth-capacity-single-module-restoration-build.mjs
      - name: Upload generated capacity and execution receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-capacity-single-module-restoration
          path: artifacts/h-earth-capacity-single-module-restoration/**
          if-no-files-found: error
          retention-days: 30
