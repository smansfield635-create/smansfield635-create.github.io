name: World Manifold Gen306 Exact Mutation Router Carrier

on:
  push:
    branches:
      - control-plane-carrier/world-manifold-intake-20260817
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRIVATE_HEAD: 804e2c31c10ab04a73c1cfbae883892735a62f3d
    steps:
      - name: Mint exact private read token
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.PRIVATE_EXECUTION_APP_ID }}
          private-key: ${{ secrets.PRIVATE_EXECUTION_APP_PRIVATE_KEY }}
          owner: smansfield635-create
          repositories: geodiametrics1
          permission-contents: read

      - name: Checkout exact private governing head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: smansfield635-create/geodiametrics1
          ref: ${{ env.PRIVATE_HEAD }}
          token: ${{ steps.token.outputs.token }}
          path: private-control-plane
          fetch-depth: 1
          persist-credentials: false

      - name: Build exact Gen306 route inputs
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/paths.txt" <<'EOF'
          h-earth-3d/terrain/h-earth.world-manifold-domain.js
          h-earth-3d/integration/h-earth.world-representation-plan.js
          h-earth-3d/integration/h-earth.world-manifold-union-admission.js
          h-earth-3d/validation/h-earth.world-manifold-architecture.harness.mjs
          h-earth-3d/terrain/h-earth.successor-terrain-field.run8b.js
          showroom/globe/h-earth/render/geometry-successor-terrain.run8b.js
          showroom/globe/h-earth/render/geometry-shoreline.js
          showroom/globe/h-earth/render/geometry-distant-context.js
          showroom/globe/h-earth/render/landscape-preview.js
          h-earth-3d/integration/h-earth.run8e-successor-environment-transfer.js
          showroom/globe/h-earth/render/run8e-successor-environment.js
          EOF
          cat > "$RUNNER_TEMP/availability.json" <<'EOF'
          {
            "schema":"REPOSITORY_AI_INTAKE_EXECUTION_AVAILABILITY_RECEIPT_v1",
            "result":"HOST_CAPABILITIES_OBSERVED",
            "evidenceSource":"GITHUB_ACTIONS_EXACT_PRIVATE_HEAD_READ_ONLY_ROUTER_CARRIER_3207",
            "localAuthenticatedExecutionAvailable":false,
            "localNodeRuntimeAvailable":true,
            "connectedGithubReadAvailable":false,
            "connectedGithubShaGuardedContentsWriteAvailable":false,
            "githubActionsExecutionAvailable":true
          }
          EOF

      - name: Execute root AI router for all 11 admitted paths
        shell: bash
        working-directory: private-control-plane
        run: |
          set -euo pipefail
          node tools/repository-ai-entry-router.mjs \
            --paths-file "$RUNNER_TEMP/paths.txt" \
            --task H_EARTH_WORLD_MANIFOLD_ARCHITECTURE_INSTALLATION_GEN306 \
            --mutation-intent \
            --intake-availability-receipt "$RUNNER_TEMP/availability.json" \
            --output "$RUNNER_TEMP/router-receipt.json"
          cat "$RUNNER_TEMP/router-receipt.json"
          test "$(jq -r '.disposition // .result // ""' "$RUNNER_TEMP/router-receipt.json")" = 'PASS'
          test "$(jq '[.routes[] | select(.disposition != "PASS")] | length' "$RUNNER_TEMP/router-receipt.json")" = '0'
          test "$(jq '.routes | length' "$RUNNER_TEMP/router-receipt.json")" = '11'
