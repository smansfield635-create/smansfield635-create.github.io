name: Static Asset Identity Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  compass-gen347-corrected-functional-matrix:
    if: github.head_ref == 'verification/compass-gen347-bootstrap-receipt'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve exact candidate
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/gen347-http.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/compass-awards-provenance/ >/dev/null && exit 0; sleep .25; done
          cat /tmp/gen347-http.log
          exit 1
      - name: Execute corrected phone tablet desktop matrix
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const profiles=[['desktop',1440,900],['tablet',1024,768],['phone',390,844]];
          const browser=await chromium.launch({headless:true});
          const results=[]; let failed=false;
          for(const [name,width,height] of profiles){
            const page=await browser.newPage({viewport:{width,height}});
            const consoleErrors=[],pageErrors=[],checks={}; let error=null;
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e.stack||e)));
            try{
              const response=await page.goto('http://127.0.0.1:4173/compass-awards-provenance/',{waitUntil:'networkidle',timeout:30000});
              checks.http=Boolean(response?.ok()); if(!checks.http) throw new Error(`route ${response?.status()}`);
              await page.waitForFunction(()=>Boolean(document.documentElement.dataset.compassAwardsQualification),{timeout:10000});
              const initial=await page.evaluate(()=>{
                const rooms=[...document.querySelectorAll('[data-compass-room]')];
                const uniqueRoomIds=[...new Set(rooms.map(e=>e.dataset.roomId).filter(Boolean))];
                const runtime=window.__COMPASS_AWARDS_PROVENANCE__?.getRuntime?.()||null;
                const runtimeChecks={...(runtime?.checks||{})}; delete runtimeChecks.roomCount;
                return {status:document.documentElement.dataset.compassAwardsQualification||null,root:Boolean(document.querySelector('[data-compass-root]')),cardinals:document.querySelectorAll('[data-compass-cardinal]').length,roomNodes:rooms.length,uniqueRoomIds:uniqueRoomIds.length,capabilities:document.querySelectorAll('[data-capability]').length,readiness:document.querySelectorAll('[data-readiness-family]').length,provenance:document.querySelectorAll('.ap-award-card').length,mirrorlandRoutes:document.querySelectorAll('[data-compass-mirrorland-routes] a').length,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,runtime,runtimeChecksPass:Object.values(runtimeChecks).every(Boolean)};
              });
              checks.semanticBootstrap=initial.root&&initial.cardinals===4&&initial.uniqueRoomIds===19&&initial.capabilities===3&&initial.readiness===2&&initial.provenance===5&&initial.mirrorlandRoutes>=4&&initial.overflow<=2&&initial.runtimeChecksPass;
              if(!checks.semanticBootstrap) throw new Error(`semantic bootstrap ${JSON.stringify(initial)}`);

              const north=page.locator('[data-compass-cardinal][data-cardinal-id="north"]');
              checks.northPresent=await north.count()===1; if(!checks.northPresent) throw new Error('north cardinal missing');
              await north.click();
              await page.waitForFunction(()=>['CLUSTER_OPEN','ROOM_SELECTED'].includes(document.querySelector('[data-compass-root]')?.dataset.compassMode),{timeout:7000});
              await page.waitForFunction(()=>document.querySelector('.ap-room-label')?.classList.contains('is-active'),{timeout:5000});
              const cluster1=await page.evaluate(()=>({mode:document.querySelector('[data-compass-root]')?.dataset.compassMode,wing:document.querySelector('[data-compass-root]')?.dataset.activeClusterWing||document.querySelector('[data-compass-root]')?.dataset.selectedWing||document.querySelector('[data-compass-root]')?.dataset.selectedCardinal,visibleLabels:[...document.querySelectorAll('.ap-room-label')].filter(e=>getComputedStyle(e).display!=='none'&&getComputedStyle(e).visibility!=='hidden'&&e.classList.contains('is-active')).length,roomId:document.querySelector('.ap-room-label')?.dataset.roomId,text:document.querySelector('.ap-room-label')?.innerText.trim()}));
              checks.oneSecondaryLabel=cluster1.visibleLabels===1&&Boolean(cluster1.roomId)&&Boolean(cluster1.text); if(!checks.oneSecondaryLabel) throw new Error(`secondary label ${JSON.stringify(cluster1)}`);
              await page.locator('[data-ap-room-next]').click(); await page.waitForTimeout(120);
              const cluster2=await page.evaluate(()=>({roomId:document.querySelector('.ap-room-label')?.dataset.roomId,text:document.querySelector('.ap-room-label')?.innerText.trim()}));
              checks.secondaryAdvance=Boolean(cluster2.roomId)&&cluster2.roomId!==cluster1.roomId; if(!checks.secondaryAdvance) throw new Error(`secondary advance ${JSON.stringify({cluster1,cluster2})}`);
              await page.locator('[data-ap-room-open]').click();
              await page.waitForFunction(()=>document.querySelector('[data-compass-root]')?.dataset.compassMode==='ROOM_SELECTED',{timeout:7000});
              const selected=await page.evaluate(()=>document.querySelector('[data-compass-root]')?.dataset.selectedRoom||'');
              checks.roomOpen=selected===cluster2.roomId; if(!checks.roomOpen) throw new Error(`room selected ${selected}`);
              await page.locator('[data-ap-room-back]').click();
              await page.waitForFunction(()=>document.querySelector('[data-compass-root]')?.dataset.compassMode==='CONSTELLATION',{timeout:7000}); checks.roomReturn=true;

              const heroBefore=await page.locator('[data-statement].is-active').innerText().catch(()=>null); const heroNext=page.locator('[data-hero-next]');
              if(await heroNext.count()){await heroNext.click();await page.waitForTimeout(250)}
              const heroAfter=await page.locator('[data-statement].is-active').innerText().catch(()=>null); checks.heroAdvance=!heroBefore||!heroAfter||heroBefore!==heroAfter; if(!checks.heroAdvance) throw new Error('hero did not advance');

              const provBefore=await page.locator('.ap-award-card.is-active h3').innerText(); await page.locator('[data-ap-next]').click(); await page.waitForTimeout(150); const provAfter=await page.locator('.ap-award-card.is-active h3').innerText(); checks.provenanceAdvance=provBefore!==provAfter; if(!checks.provenanceAdvance) throw new Error('provenance did not advance');

              const capNext=page.locator('[data-capability-next]'); checks.capabilityControl=await capNext.count()>0;
              if(checks.capabilityControl){const before=await page.locator('[data-capability].is-front,[data-capability][aria-current="true"]').first().getAttribute('data-capability').catch(()=>null);await capNext.click();await page.waitForTimeout(250);const after=await page.locator('[data-capability].is-front,[data-capability][aria-current="true"]').first().getAttribute('data-capability').catch(()=>null);checks.capabilityAdvance=!before||!after||before!==after;if(!checks.capabilityAdvance) throw new Error('capability did not advance');}

              checks.readinessFamilies=await page.locator('[data-readiness-family="TRL"]').count()===1&&await page.locator('[data-readiness-family="TRA"]').count()===1; if(!checks.readinessFamilies) throw new Error('TRL/TRA missing');

              const mirrorTrigger=page.locator('[data-mirrorland-trigger], [data-compass-mirrorland-trigger]').first(); checks.mirrorTrigger=await mirrorTrigger.count()>0;
              if(checks.mirrorTrigger){await mirrorTrigger.click();await page.waitForFunction(()=>document.querySelector('[data-compass-root]')?.dataset.compassMode==='MIRRORLAND_FOCUSED',{timeout:10000});checks.mirrorRoutes=await page.locator('[data-compass-mirrorland-routes] a').count()>=4;const back=page.locator('[data-mirrorland-back], [data-compass-mirrorland-back], .mirrorland-back').first();checks.mirrorReturn=await back.count()===1;if(!checks.mirrorRoutes||!checks.mirrorReturn) throw new Error('Mirrorland ingress/return');await back.click();await page.waitForFunction(()=>document.querySelector('[data-compass-root]')?.dataset.compassMode==='CONSTELLATION',{timeout:10000});}

              await page.keyboard.press('Tab'); checks.keyboardFocus=Boolean(await page.evaluate(()=>document.activeElement&&document.activeElement!==document.body));
              checks.noOverflow=(await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth))<=2;
              checks.noRuntimeErrors=consoleErrors.length===0&&pageErrors.length===0;
              if(!checks.keyboardFocus||!checks.noOverflow||!checks.noRuntimeErrors) throw new Error(`final ${JSON.stringify({consoleErrors,pageErrors,checks})}`);
            }catch(e){failed=true;error=String(e.stack||e)}
            await page.screenshot({path:`/tmp/gen347-${name}.png`,fullPage:true}).catch(()=>{});
            results.push({name,checks,error,consoleErrors,pageErrors}); await page.close();
          }
          await browser.close();
          const receipt={schema:'COMPASS_GEN347_CORRECTED_FUNCTIONAL_MATRIX_v1',candidate:process.env.GITHUB_SHA,failed,results}; fs.writeFileSync('/tmp/gen347-functional-matrix.json',JSON.stringify(receipt,null,2)); console.log(JSON.stringify(receipt,null,2)); if(failed) process.exitCode=1;
          NODE
      - name: Upload functional evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compass-gen347-corrected-functional-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/gen347-functional-matrix.json
            /tmp/gen347-desktop.png
            /tmp/gen347-tablet.png
            /tmp/gen347-phone.png
          if-no-files-found: warn
          retention-days: 30
