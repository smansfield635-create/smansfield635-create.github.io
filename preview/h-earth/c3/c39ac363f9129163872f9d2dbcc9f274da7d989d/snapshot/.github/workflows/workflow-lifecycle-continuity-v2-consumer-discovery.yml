name: Workflow Lifecycle V2 Consumer Discovery Carrier

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/workflow-lifecycle-continuity-v2-consumer-discovery.yml'
  issue_comment:
    types: [created]

permissions: {}

env:
  REQUEST_MARKER: WORKFLOW_LIFECYCLE_V2_CONSUMER_DISCOVERY_REQUEST_V1
  REGISTRATION_BASE: 8c769cf69305732917a5457c15fb204fc7928c53
  DISCOVERY_PATH: .github/ai-router/workflow-lifecycle-continuity/consumer-discovery.v2.mjs
  DISCOVERY_BLOB: 074a0a0ca772f7e31d8552a5d05308c0bc49f3b8

jobs:
  validate-candidate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact one-path candidate and native discovery identity
        shell: bash
        run: |
          set -euo pipefail
          HEAD="$(git rev-parse HEAD^{commit})"
          test "$HEAD" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse "$HEAD^")" = "$REGISTRATION_BASE"
          git diff --name-only "$REGISTRATION_BASE" "$HEAD" | sort > "$RUNNER_TEMP/actual.txt"
          printf '%s\n' '.github/workflows/workflow-lifecycle-continuity-v2-consumer-discovery.yml' > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          test "$(git rev-parse "$HEAD:$DISCOVERY_PATH")" = "$DISCOVERY_BLOB"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "CANDIDATE_HEAD=$HEAD" >> "$GITHUB_ENV"
      - name: Verify read-only fixed-command contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'contents: write|actions: write|pull-requests: write|issues: write|deployments: write|packages: write' '.github/workflows/workflow-lifecycle-continuity-v2-consumer-discovery.yml'
          grep -Fq "$DISCOVERY_PATH" '.github/workflows/workflow-lifecycle-continuity-v2-consumer-discovery.yml'
          forbidden='workflow_'
          forbidden="${forbidden}dispatch:"
          ! grep -Fq "$forbidden" '.github/workflows/workflow-lifecycle-continuity-v2-consumer-discovery.yml'
      - name: Reproduce deterministic native discovery fixture twice
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const q={repoRoot:'.',governingHead:process.env.CANDIDATE_HEAD,searchRoots:['AI_ENTRYPOINT.json'],tokens:['SMANSFIELD_REPOSITORY_AI_ENTRYPOINT_v4_CONTEXTUAL_ARCHITECTURE_GATE']};
          fs.writeFileSync(process.env.RUNNER_TEMP+'/fixture.json',JSON.stringify(q,null,2)+'\n');
          NODE
          node "$DISCOVERY_PATH" --request "$RUNNER_TEMP/fixture.json" --output "$RUNNER_TEMP/discovery-1.json"
          node "$DISCOVERY_PATH" --request "$RUNNER_TEMP/fixture.json" --output "$RUNNER_TEMP/discovery-2.json"
          cmp "$RUNNER_TEMP/discovery-1.json" "$RUNNER_TEMP/discovery-2.json"
          node - <<'NODE'
          const r=require(process.env.RUNNER_TEMP+'/discovery-1.json');
          if(r.schema!=='WORKFLOW_LIFECYCLE_CONSUMER_DISCOVERY_RECEIPT_v2'||r.governingHead!==process.env.CANDIDATE_HEAD||r.scannedFileCount!==1||r.matchedConsumers.length!==1)process.exit(1);
          if(r.matchedConsumers[0].path!=='AI_ENTRYPOINT.json')process.exit(1);
          NODE
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Emit validation receipt
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');const r=require(process.env.RUNNER_TEMP+'/discovery-1.json');
          const out={schema:'WORKFLOW_LIFECYCLE_V2_CONSUMER_DISCOVERY_CARRIER_VALIDATION_RECEIPT_v1',result:'PASS_CLOSED',candidateHead:process.env.CANDIDATE_HEAD,consumerDiscoveryBlob:process.env.DISCOVERY_BLOB,nativeReceiptDigest:r.receiptDigest,nativeScannedPathDigest:r.scannedPathDigest,deterministicReproduction:true,repositoryWritePermission:false,genericCommandAuthority:false,realConsumerDiscoveryExecuted:false,gapClosureAuthorized:false,physicalRetirementAuthorized:false,productMutationAuthorized:false,mergeAuthorized:false};
          fs.writeFileSync(process.env.RUNNER_TEMP+'/validation.json',JSON.stringify(out,null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: workflow-lifecycle-v2-consumer-discovery-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/discovery-1.json
            ${{ runner.temp }}/validation.json
          if-no-files-found: error
          retention-days: 90

  execute-consumer-discovery:
    if: >-
      github.event_name == 'issue_comment' &&
      startsWith(github.event.comment.body, 'WORKFLOW_LIFECYCLE_V2_CONSUMER_DISCOVERY_REQUEST_V1') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify installed exact-head identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:$DISCOVERY_PATH)" = "$DISCOVERY_BLOB"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Parse closed discovery request
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');const body=String(process.env.COMMENT_BODY||'').trim(),marker=process.env.REQUEST_MARKER;
          if(!body.startsWith(marker))throw Error('REQUEST_MARKER_MISSING');const tail=body.slice(marker.length).trim();if(!tail.startsWith('{')||!tail.endsWith('}'))throw Error('REQUEST_JSON_NOT_EXACT');
          const q=JSON.parse(tail),keys=Object.keys(q).sort(),expected=['requestNonce','schema','searchRoots','subjectHead','tokens'].sort();if(JSON.stringify(keys)!==JSON.stringify(expected))throw Error('REQUEST_KEYSET_INVALID');
          if(q.schema!=='WORKFLOW_LIFECYCLE_V2_CONSUMER_DISCOVERY_INVOCATION_REQUEST_v1')throw Error('REQUEST_SCHEMA_INVALID');if(q.subjectHead!==process.env.GITHUB_SHA||!/^[0-9a-f]{40}$/.test(q.subjectHead))throw Error('SUBJECT_HEAD_NOT_EVENT_MAIN');
          if(!Array.isArray(q.searchRoots)||!q.searchRoots.length||q.searchRoots.some(x=>typeof x!=='string'||!x||x.includes('\0')))throw Error('SEARCH_ROOTS_INVALID');
          if(!Array.isArray(q.tokens)||!q.tokens.length||q.tokens.some(x=>typeof x!=='string'||!x||x.length>512))throw Error('TOKENS_INVALID');if(!/^[0-9a-f]{64}$/.test(q.requestNonce))throw Error('REQUEST_NONCE_INVALID');
          const native={repoRoot:'.',governingHead:q.subjectHead,searchRoots:q.searchRoots,tokens:q.tokens};fs.writeFileSync(process.env.RUNNER_TEMP+'/native-request.json',JSON.stringify(native,null,2)+'\n');
          NODE
      - name: Execute fixed native consumer discovery
        shell: bash
        run: |
          set -euo pipefail
          node "$DISCOVERY_PATH" --request "$RUNNER_TEMP/native-request.json" --output "$RUNNER_TEMP/consumer-discovery-receipt.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/consumer-discovery-receipt.json');if(r.schema!=='WORKFLOW_LIFECYCLE_CONSUMER_DISCOVERY_RECEIPT_v2'||r.governingHead!==process.env.GITHUB_SHA)process.exit(1)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        with:
          name: workflow-lifecycle-v2-consumer-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/consumer-discovery-receipt.json
          if-no-files-found: error
          retention-days: 90
