name: FAP1 G_C L5 Visible Direct Qualification
on:
  pull_request:
    paths: ['.github/workflows/fap1-gc-l5-visible-direct-qualification.yml']
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 01c38f39fce3ff22b48f07abed338da86e9a218c
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with: {chrome-version: stable}
      - run: npm install --no-save --no-package-lock puppeteer-core@24.15.0
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          for a in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/showroom/globe/audralia/weather-presentation-reconciliation/ >/dev/null && exit 0; sleep .25; done; exit 1
      - name: Execute exact-head visible L5 traversal
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const fs=require('fs'),puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:'new',args:['--no-sandbox','--ignore-gpu-blocklist','--enable-webgl','--use-gl=angle','--use-angle=swiftshader']});
            const page=await browser.newPage();await page.setViewport({width:720,height:1280,deviceScaleFactor:1});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));page.on('console',m=>{const t=m.text();if(m.type()==='error'&&!t.includes('favicon.ico')&&!t.includes('404 (File not found)'))errors.push(t);});
            await page.goto('http://127.0.0.1:4173/showroom/globe/audralia/weather-presentation-reconciliation/',{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForFunction(()=>window.__AUDRALIA_FAP1_W5_HANDOFF__?.l5LightingActive===true&&window.__AUDRALIA_FAP1_W5_HANDOFF__?.l5LightingModel==='DIRECT_SUN_TRANSMITTANCE_ONLY',{timeout:90000});
            const setup=await page.evaluate(()=>{const proof=window.__AUDRALIA_WEATHER_PRESENTATION_RECONCILIATION__,ga=window.__AUDRALIA_FAP1_GA_AUTHORITY__,system=ga.descriptorPacket().systems.find(s=>s.weatherClass==='LOW_CUMULIFORM')||ga.descriptorPacket().systems[0];const R=6200,D=Math.PI/180,N=[0,.5,-.8660254037844386],M=[0,.8660254037844386,.5],E=[1,0,0],lat=system.latitudeDeg*D,lon=system.longitudeDeg*D,cl=Math.cos(lat),sl=Math.sin(lat),co=Math.cos(lon),si=Math.sin(lon),r=[N[0]*sl+(M[0]*co+E[0]*si)*cl,N[1]*sl+(M[1]*co+E[1]*si)*cl,N[2]*sl+(M[2]*co+E[2]*si)*cl],angle=Math.acos(Math.max(-1,Math.min(1,r[1]))),sine=Math.sin(angle),arc=angle*R;return{systemId:system.id,targetU:Math.abs(sine)<1e-7?0:arc*r[0]/sine,targetV:Math.abs(sine)<1e-7?0:arc*r[2]/sine};});
            const stages=[['macro',5600],['overlap',1200],['local',800],['interior',520]],samples=[];
            for(const [name,distance] of stages){
              const sample=await page.evaluate(async({distance,targetU,targetV})=>{const sleep=ms=>new Promise(r=>setTimeout(r,ms)),proof=window.__AUDRALIA_WEATHER_PRESENTATION_RECONCILIATION__,h=window.__AUDRALIA_FAP1_W5_HANDOFF__;proof.setCameraStateForTest({targetU,targetV,distance,pitch:1.25,yaw:0});await sleep(700);h.setQuality('REST');const t0=performance.now();const receipt=h.renderNow();const renderMs=performance.now()-t0;await sleep(250);const verification=h.getVerification();const local=document.querySelector('[data-fap1-w5-local-raymarch="true"]');return{receipt,verification,renderMs,canvas:local?{display:getComputedStyle(local).display,quality:local.dataset.l5Quality,lightSteps:local.dataset.l5LightSteps,renderPixels:local.dataset.renderPixels}:null};},{distance,targetU:setup.targetU,targetV:setup.targetV});
              samples.push({name,distance,...sample});await page.screenshot({path:`artifacts/${name}.png`,fullPage:false});
            }
            const capture=await page.evaluate(()=>{const h=window.__AUDRALIA_FAP1_W5_HANDOFF__,t0=performance.now(),receipt=h.setQuality('CAPTURE');return{receipt,renderMs:performance.now()-t0,verification:h.getVerification()};});
            await page.screenshot({path:'artifacts/interior-capture.png',fullPage:false});
            const active=samples.filter(x=>x.receipt?.active),ids=new Set(active.map(x=>x.receipt.weatherId));
            const checks={identity:active.length>0&&ids.size===1&&ids.has(setup.systemId),handoff:samples.every(x=>x.verification?.pass&&Math.abs((x.receipt?.contributionSum??0)-1)<=1e-6),l5:samples.every(x=>x.receipt?.l5LightingActive===true&&x.receipt?.l5LightingModel==='DIRECT_SUN_TRANSMITTANCE_ONLY'),scope:samples.every(x=>x.receipt?.multipleScattering===false&&x.receipt?.skyAmbient===false&&x.receipt?.groundContribution===false),regimes:samples[0].receipt.localContribution===0&&samples[1].receipt.localContribution>0&&samples[1].receipt.localContribution<.72&&samples[2].receipt.localContribution>=.72&&samples[3].receipt.localContribution>=.72,quality:capture.receipt?.quality==='CAPTURE'&&capture.receipt?.lightSteps===8,noRuntimeErrors:errors.length===0};
            const perf={restMaxMs:Math.max(...samples.map(x=>x.renderMs)),captureMs:capture.renderMs};
            const result={schema:'FAP1_GC_L5_VISIBLE_DIRECT_QUALIFICATION_v1',candidateHead:'01c38f39fce3ff22b48f07abed338da86e9a218c',systemId:setup.systemId,checks,perf,samples,capture,errors,pass:Object.values(checks).every(Boolean)};
            fs.writeFileSync('artifacts/qualification.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result,null,2));await browser.close();if(!result.pass)process.exit(2);
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fap1-gc-l5-visible-direct-evidence
          path: artifacts/
          if-no-files-found: error
