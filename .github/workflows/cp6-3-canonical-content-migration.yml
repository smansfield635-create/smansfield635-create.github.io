name: CP6-3 canonical content migration

on:
  push:
    branches:
      - agent/laws-cp6-3-canonical-content-migration-001
    paths:
      - .github/workflows/cp6-3-canonical-content-migration.yml

permissions:
  contents: write

concurrency:
  group: cp6-3-canonical-content-migration
  cancel-in-progress: false

jobs:
  migrate-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact CP6-3 branch
        uses: actions/checkout@v4
        with:
          ref: agent/laws-cp6-3-canonical-content-migration-001
          fetch-depth: 0

      - name: Confirm exact stacked starting state
        shell: bash
        run: |
          set -euo pipefail
          CP62=5ae3e5524926653f3c348dde5363e8765ad425cc
          test "$(git rev-parse HEAD^)" = "$CP62"
          test "$(git diff --name-only "$CP62"..HEAD | tr -d '\r')" = ".github/workflows/cp6-3-canonical-content-migration.yml"

      - name: Install extraction and browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check beautifulsoup4 playwright
          python3 -m playwright install chromium

      - name: Migrate, verify, and prepare durable candidate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/cp63.py <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          from collections import Counter, defaultdict
          from playwright.sync_api import sync_playwright
          import hashlib
          import html
          import json
          import re
          import subprocess
          import sys
          import time
          import urllib.request

          ROOT = Path('.')
          CP62 = '5ae3e5524926653f3c348dde5363e8765ad425cc'
          CP61 = '2fad7a28a632c0f4fae1b08dc33cd0f3742d08e8'
          BRANCH = 'agent/laws-cp6-3-canonical-content-migration-001'
          WORKFLOW = ROOT / '.github/workflows/cp6-3-canonical-content-migration.yml'
          CONTROL = ROOT / 'laws/control-plane/cp6-3'
          CONTROL.mkdir(parents=True, exist_ok=True)

          def run(*args):
              return subprocess.check_output(args, text=True).strip()

          def norm(value):
              return re.sub(r'\s+', ' ', value or '').strip()

          def slug(value):
              return re.sub(r'[^a-z0-9]+', '-', value.lower()).strip('-')

          def cid(number):
              return f'CP6-CONTENT-{number:03d}'

          def canonical_text(fragment):
              parsed = BeautifulSoup(fragment, 'html.parser')
              lines = [line.strip() for line in parsed.get_text('\n').splitlines() if line.strip()]
              return '\n'.join(lines)

          def digest_text(fragment):
              return hashlib.sha256(canonical_text(fragment).encode('utf-8')).hexdigest()

          manifest_path = ROOT / 'laws/control-plane/cp6-1/content-custody-ledger/manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['content_block_count'] == 138
          rows = []
          schema = manifest['row_schema']
          for shard in manifest['shards']:
              payload = json.loads((ROOT / shard['path']).read_text(encoding='utf-8'))
              assert payload['row_count'] == len(payload['rows'])
              for raw in payload['rows']:
                  rows.append(dict(zip(schema, raw)))
          assert len(rows) == 138
          row_by_id = {row['id']: row for row in rows}
          assert len(row_by_id) == 138

          migrated_rows = [row for row in rows if row['final_disposition'].startswith('MIGRATE_TEST_') or row['final_disposition'].startswith('MIGRATE_RESEARCH_')]
          assert len(migrated_rows) == 48
          assert sum(row['final_disposition'].startswith('MIGRATE_TEST_') for row in migrated_rows) == 14
          assert sum(row['final_disposition'].startswith('MIGRATE_RESEARCH_') for row in migrated_rows) == 34
          assert all(row['full_text_migrates'] is True for row in migrated_rows)

          source_html = (ROOT / 'laws/index.html').read_text(encoding='utf-8')
          source = BeautifulSoup(source_html, 'html.parser')

          def details_by_summary(label, root=source):
              for item in root.find_all('details'):
                  summary = item.find('summary', recursive=False)
                  if summary and norm(summary.get_text(' ', strip=True)) == label:
                      return item
              raise AssertionError(f'Missing details: {label}')

          def article_by_heading(root, label):
              for article in root.find_all('article'):
                  heading = article.find(['h2', 'h3', 'strong'])
                  if heading and norm(heading.get_text(' ', strip=True)) == label:
                      return article
              raise AssertionError(f'Missing article: {label}')

          def equation_card(label):
              for card in source.select('.laws-equation-card'):
                  heading = card.select_one('.laws-equation-card__label')
                  if heading and norm(heading.get_text(' ', strip=True)) == label:
                      return card
              raise AssertionError(f'Missing equation card: {label}')

          def direct_intro(container):
              paragraph = container.find('p', recursive=False)
              assert paragraph is not None
              return paragraph

          scientific = details_by_summary('Scientific Law / Reality Test')
          evidence = details_by_summary('Evidence Boundary')
          standing = details_by_summary('Research Standing')
          applied = details_by_summary('Applied Systems / Frontier Link-Outs')
          maturity = details_by_summary('Route Maturity')
          runtime = details_by_summary('Runtime Ownership / Source Custody')

          payloads = {}
          headings = {}

          legacy_result = source.find(attrs={'data-member-id': 'test-results-records'})
          assert legacy_result is not None
          headings[cid(26)] = legacy_result.get('data-member-label')
          payloads[cid(26)] = f'''<div class="identity-contract">
          <p><strong>Legacy source label:</strong> {html.escape(legacy_result.get('data-member-label', ''))}</p>
          <p><strong>Legacy normalized label:</strong> {html.escape(legacy_result.get('data-label', ''))}</p>
          <p><strong>Canonical title:</strong> Result and Record</p>
          <p><strong>Canonical route:</strong> /laws/test/result-and-record/</p>
          <p><strong>Legacy compatibility input:</strong> /laws/test/#results-records</p>
          <p>{html.escape(legacy_result.get('data-panel-body', ''))}</p>
          <p>{html.escape(legacy_result.get('data-panel-relationship', ''))}</p>
          </div>'''

          details_map = {
              57: 'Source Custody Rule',
              65: 'Notation Boundary',
              71: 'Diagnostic Boundary',
              122: 'Receipts, graphics, and ACK packets',
          }
          for number, label in details_map.items():
              headings[cid(number)] = label
              payloads[cid(number)] = str(details_by_summary(label, runtime if number == 122 else source))

          headings[cid(58)] = 'Formula Context'
          payloads[cid(58)] = str(direct_intro(details_by_summary('Formula Context')))
          headings[cid(82)] = 'Research Standing'
          payloads[cid(82)] = str(direct_intro(standing))
          headings[cid(87)] = 'Applied Systems / Frontier Link-Outs'
          payloads[cid(87)] = str(direct_intro(applied))

          equation_map = {
              59: 'Universal Diagnostic Collapse Predicate',
              60: '451 Structural Envelope',
              61: 'A3D-E / PCR Kernel',
              62: 'Zero-Aware Product Discipline',
              63: 'Industrial Closure Equation',
              64: 'Energy Loop Law',
              119: 'Controller Registry Source',
              121: 'Evidence Artifact Rule',
          }
          for number, label in equation_map.items():
              headings[cid(number)] = label
              payloads[cid(number)] = str(equation_card(label))

          scientific_articles = {
              67: 'Source Matching',
              68: 'No-Match Discipline',
              69: 'Threshold Distinction',
              70: 'Multi-Gate Verification',
          }
          for number, label in scientific_articles.items():
              headings[cid(number)] = label
              payloads[cid(number)] = str(article_by_heading(scientific, label))

          evidence_articles = {
              74: 'Finance Track A',
              75: 'Finance Track B',
              76: 'Pathway 8 Storage SOH',
              77: 'Luxra Warranty Provenance',
              78: 'Synthetic Fixtures',
              79: 'Real Telemetry Corridor',
              80: 'Observation Gate',
          }
          for number, label in evidence_articles.items():
              headings[cid(number)] = label
              payloads[cid(number)] = str(article_by_heading(evidence, label))

          standing_articles = {
              83: 'Strongest Bounded Supports',
              84: 'Bounded or Mixed Lanes',
              85: 'Non-Validation Signals',
              86: 'Candidate Outputs',
          }
          for number, label in standing_articles.items():
              headings[cid(number)] = label
              payloads[cid(number)] = str(article_by_heading(standing, label))

          route_cards = {
              88: ('energy', 'Energy'),
              89: ('water', 'Water'),
              90: ('industrial-water', 'Industrial Water'),
              91: ('ice', 'Closed-Loop Waste / ICE'),
          }
          for number, (key, label) in route_cards.items():
              card = applied.find(attrs={'data-laws-frontier-link': key})
              assert card is not None
              headings[cid(number)] = label
              payloads[cid(number)] = str(card)

          applied_articles = {
              92: 'Energy Safety Boundary',
              93: 'Water Threshold Example',
              94: 'HomeWater Claim Discipline',
              95: 'IW-CLPP',
          }
          for number, label in applied_articles.items():
              headings[cid(number)] = label
              payloads[cid(number)] = str(article_by_heading(applied, label))

          maturity_articles = {107: 'Pathway 6 Transport', 108: 'Pathway 8 Storage'}
          for number, label in maturity_articles.items():
              headings[cid(number)] = label
              payloads[cid(number)] = str(article_by_heading(maturity, label))

          receipt_keys = {
              123: ('controller', 'Controller'),
              124: ('compositor', 'Compositor'),
              125: ('crystals', 'Crystals'),
              126: ('interactions', 'Interactions'),
              127: ('cosmos', 'Cosmos'),
              129: ('planet', 'Center Planet'),
          }
          for number, (key, label) in receipt_keys.items():
              receipt = runtime.find('details', attrs={'data-laws-receipt-summary': key})
              assert receipt is not None
              headings[cid(number)] = label
              payloads[cid(number)] = str(receipt)

          html_receipt = source.find('template', id='laws-html-receipt')
          assert html_receipt is not None
          receipt_text = html_receipt.get_text('\n', strip=False).strip('\n')
          if not receipt_text:
              receipt_text = html_receipt.decode_contents().strip('\n')
          assert 'LAWS_COMPASS_WORLD_PASS_PLANET_AND_SHOWROOM_COSMOS_READY_HTML_RECEIPT_v2_3_0' in receipt_text
          terminal = '\nRUNTIME STATUS:\n'
          assert terminal in receipt_text
          receipt_provenance = receipt_text.split(terminal, 1)[0].rstrip()
          headings[cid(137)] = 'HTML custody receipt structural provenance'
          payloads[cid(137)] = f'<pre class="receipt-text">{html.escape(receipt_provenance)}</pre>'

          expected_ids = {row['id'] for row in migrated_rows}
          assert set(payloads) == expected_ids, (sorted(expected_ids - set(payloads)), sorted(set(payloads) - expected_ids))
          assert set(headings) == expected_ids

          destination_configs = {
              'Test / Admission and Baseline': {
                  'route': '/laws/test/admission-and-baseline/', 'path': 'laws/test/admission-and-baseline/index.html',
                  'title': 'Admission and Baseline', 'authority': 'TEST_ADMISSION_AND_BASELINE_AUTHORITY_V1',
                  'parent': '/laws/test/', 'group': 'Test',
                  'declaration': 'This destination governs what may enter a test and which fixed comparison authority controls the evaluation.',
                  'scope': 'Admission identity, proposition scope, source eligibility, baseline custody, threshold declarations, no-match handling, and gate-entry conditions.',
                  'exclusions': 'It does not construct a candidate, evaluate downstream results, create evidence, or convert admission into validation.',
                  'orientation': 'Use this record before construction begins. It fixes source custody and keeps materially different threshold categories from being silently collapsed.',
                  'sections': [('Source custody and lawful entry', [cid(57)]), ('Threshold-category separation', [cid(69)])]
              },
              'Test / Forward Construction': {
                  'route': '/laws/test/forward-construction/', 'path': 'laws/test/forward-construction/index.html',
                  'title': 'Forward Construction', 'authority': 'TEST_FORWARD_CONSTRUCTION_AUTHORITY_V1',
                  'parent': '/laws/test/', 'group': 'Test',
                  'declaration': 'This destination governs the ordered path from admitted material through candidate construction and forward verification.',
                  'scope': 'Ordered evidence use, candidate assembly, multi-gate verification, forward rejection conditions, and preservation of the admitted baseline.',
                  'exclusions': 'It does not rewrite source evidence, bypass a failed gate, perform reverse audit, or classify the final record.',
                  'orientation': 'Forward construction advances only through the admitted sequence. A failed or unsupported gate remains a stopping condition rather than an invitation to substitute evidence.',
                  'sections': [('Forward gate sequence', [cid(70)])]
              },
              'Test / Reverse Audit': {
                  'route': '/laws/test/reverse-audit/', 'path': 'laws/test/reverse-audit/index.html',
                  'title': 'Reverse Audit', 'authority': 'TEST_REVERSE_AUDIT_AUTHORITY_V1',
                  'parent': '/laws/test/', 'group': 'Test',
                  'declaration': 'This destination governs backward traversal from a claim, result, or receipt to its controlling source and baseline.',
                  'scope': 'Source tracing, receipt inspection, contradiction detection, baseline-drift localization, identity preservation, and provenance audit.',
                  'exclusions': 'It does not repair discovered defects, invent missing provenance, alter the baseline, or replace final classification.',
                  'orientation': 'Reverse audit treats routes, artifacts, receipts, and source declarations as inspectable evidence of custody. Presentation never substitutes for execution or proof.',
                  'sections': [('Registry and route custody', [cid(119), cid(121)]), ('Receipt and artifact boundaries', [cid(122)]), ('HTML structural provenance', [cid(137)])]
              },
              'Test / Result and Record': {
                  'route': '/laws/test/result-and-record/', 'path': 'laws/test/result-and-record/index.html',
                  'title': 'Result and Record', 'authority': 'TEST_RESULT_AND_RECORD_AUTHORITY_V1',
                  'parent': '/laws/test/', 'group': 'Test',
                  'declaration': 'This destination governs final classification and durable preservation of what the test established, failed to establish, or could not admit.',
                  'scope': 'Pass, fail, held, insufficient-evidence, mixed, unresolved, and not-admitted classifications; receipts; claim ceilings; runtime records; and artifact status.',
                  'exclusions': 'It does not pluralize the canonical identity, upgrade mixed evidence, erase negative results, or treat a receipt as production validation.',
                  'orientation': 'The canonical identity is singular: Result and Record. Legacy plural labels remain compatibility inputs only. Runtime receipt structures remain records, not proof of execution.',
                  'sections': [('Canonical identity and classification surface', [cid(26)]), ('Runtime receipt source records', [cid(123), cid(124), cid(125), cid(126), cid(127), cid(129)])]
              },
              'Research / Evidence and Sources': {
                  'route': '/laws/research/evidence-and-sources/', 'path': 'laws/research/evidence-and-sources/index.html',
                  'title': 'Evidence and Sources', 'authority': 'RESEARCH_EVIDENCE_AND_SOURCES_AUTHORITY_V1',
                  'parent': '/laws/research/', 'group': 'Research',
                  'declaration': 'This destination governs the eligibility, provenance, quality, and matching boundaries of evidence and sources.',
                  'scope': 'Datasets, documents, telemetry, observations, references, source quality, evidence status, warranty provenance, and source-matching rules.',
                  'exclusions': 'It does not transform source inclusion into validation, treat synthetic fixtures as telemetry, or force unmatched material into an evidence slot.',
                  'orientation': 'Evidence remains attached to its source type, sample, warranty basis, telemetry status, and matching conditions. Inclusion and admission do not independently create validation.',
                  'sections': [('Source matching', [cid(67)]), ('Finance evidence', [cid(74), cid(75)]), ('Pathway 8 evidence and provenance', [cid(76), cid(77), cid(79)])]
              },
              'Research / Methods and Models': {
                  'route': '/laws/research/methods-and-models/', 'path': 'laws/research/methods-and-models/index.html',
                  'title': 'Methods and Models', 'authority': 'RESEARCH_METHODS_AND_MODELS_AUTHORITY_V1',
                  'parent': '/laws/research/', 'group': 'Research',
                  'declaration': 'This destination governs formulas, assumptions, model construction, comparison laws, and reproducibility boundaries.',
                  'scope': 'Notation, normalization, zero handling, diagnostic kernels, model assumptions, comparison methods, reproducibility requirements, and no-match modeling.',
                  'exclusions': 'It does not present a mathematical structure as empirical proof, suppress zero terms, or generalize a model beyond its admitted domain.',
                  'orientation': 'The formula registry preserves symbols and zero behavior exactly. Model structure, resolver behavior, and synthetic fixtures remain distinct from empirical outcomes.',
                  'sections': [('Formula registry and notation', [cid(58), cid(59), cid(60), cid(61), cid(62), cid(63), cid(64), cid(65)]), ('Matching and fixture methods', [cid(68), cid(78)])]
              },
              'Research / Applied Investigations': {
                  'route': '/laws/research/applied-investigations/', 'path': 'laws/research/applied-investigations/index.html',
                  'title': 'Applied Investigations', 'authority': 'RESEARCH_APPLIED_INVESTIGATIONS_AUTHORITY_V1',
                  'parent': '/laws/research/', 'group': 'Research',
                  'declaration': 'This destination governs domain-specific investigations without converting an applied result into a universal law claim.',
                  'scope': 'Energy, Water, Industrial Water, closed-loop pollution, Pathway 6 Transport, Pathway 8 Storage, and other admitted applied tracks.',
                  'exclusions': 'It does not imply cross-domain transfer, convert route existence into route maturity, or promote engineering assumptions into field validation.',
                  'orientation': 'Applied work retains its domain, route, mechanism, and maturity. The records below are study-specific anchors and implementation context, not universal transfer claims.',
                  'sections': [('Applied routes', [cid(87), cid(88), cid(89), cid(90), cid(91)]), ('Study-specific boundaries', [cid(92), cid(93), cid(94), cid(95)]), ('Infrastructure route maturity', [cid(107), cid(108)])]
              },
              'Research / Findings and Boundaries': {
                  'route': '/laws/research/findings-and-boundaries/', 'path': 'laws/research/findings-and-boundaries/index.html',
                  'title': 'Findings and Boundaries', 'authority': 'RESEARCH_FINDINGS_AND_BOUNDARIES_AUTHORITY_V1',
                  'parent': '/laws/research/', 'group': 'Research',
                  'declaration': 'This destination governs what the preserved evidence supports, contradicts, leaves unresolved, or prohibits the project from claiming.',
                  'scope': 'Strongest bounded supports, negative and mixed findings, candidate outputs, limitations, unresolved questions, evidence posture, and prohibited claims.',
                  'exclusions': 'It does not erase null results, promote candidate output into an active bound, or treat discovery signals as scientific acceptance.',
                  'orientation': 'Findings remain bounded by the tested sample, source type, route maturity, and review state. Negative, mixed, candidate, and unresolved records remain visible.',
                  'sections': [('Diagnostic and observation boundaries', [cid(71), cid(80)]), ('Research standing', [cid(82), cid(83), cid(84), cid(85), cid(86)])]
              },
          }

          expected_destination_counts = {
              'Test / Admission and Baseline': 2,
              'Test / Forward Construction': 1,
              'Test / Reverse Audit': 4,
              'Test / Result and Record': 7,
              'Research / Evidence and Sources': 6,
              'Research / Methods and Models': 10,
              'Research / Applied Investigations': 11,
              'Research / Findings and Boundaries': 7,
          }

          configured_ids = []
          section_for_id = {}
          for destination, config in destination_configs.items():
              ids = []
              for section_title, section_ids in config['sections']:
                  ids.extend(section_ids)
                  for content_id in section_ids:
                      assert content_id not in section_for_id
                      section_for_id[content_id] = section_title
              configured_ids.extend(ids)
              assert len(ids) == expected_destination_counts[destination]
              ledger_ids = [row['id'] for row in migrated_rows if row['canonical_destination'] == destination]
              assert set(ids) == set(ledger_ids), (destination, set(ids), set(ledger_ids))
          assert len(configured_ids) == 48 and len(set(configured_ids)) == 48

          dependency_by_id = {
              cid(26): 'CANONICAL_IDENTITY_AND_LEGACY_ROUTE_BINDING', cid(57): 'EXACT_BASELINE_AND_STRUCTURAL_DIFF_DISCIPLINE',
              cid(58): 'PUBLIC_FORMULA_CONTEXT', cid(59): 'COLLAPSEQUALIFIED_D_PREDICATE', cid(60): '451_ENVELOPE',
              cid(61): 'A3D_E_PCR_KERNEL', cid(62): 'ZERO_AWARE_LOG_PRODUCT', cid(63): 'INDUSTRIAL_CLOSURE_EQUATION',
              cid(64): 'ENERGY_LOOP_LAW', cid(65): 'PUBLIC_NOTATION_AND_SAFE_MODE_BOUNDARY', cid(67): 'WATER_SOURCE_ANCHOR',
              cid(68): 'SOH_RESOLVER_NO_MATCH_REASONS', cid(69): 'EPA_EWG_EXPOSURE_AND_VALIDATION_CATEGORY_SEPARATION',
              cid(70): 'INDUSTRIAL_WATER_MULTI_GATE_SEQUENCE', cid(71): 'DIAGNOSTIC_VS_CLINICAL_BOUNDARY',
              cid(74): 'TESTED_SP500_VIX_SAMPLE', cid(75): 'FORWARD_DETERIORATION_LANE', cid(76): 'PATHWAY_8_SOH_EVIDENCE_CORRIDOR',
              cid(77): 'LUXRA_PURE_TITAN_WARRANTY_SCHEDULE', cid(78): 'SYNTHETIC_RESOLVER_FIXTURES',
              cid(79): 'REAL_TELEMETRY_INTAKE_CORRIDOR', cid(80): 'OBSERVATION_COMPARISON_REVIEW_CHAIN',
              cid(82): 'RESEARCH_STANDING_REGISTRY', cid(83): 'BOUNDED_SUPPORT_REGISTRY', cid(84): 'MIXED_AND_BOUNDED_LANE_REGISTRY',
              cid(85): 'DISCOVERY_SIGNAL_BOUNDARY', cid(86): 'CANDIDATE_OUTPUT_BOUNDARY', cid(87): 'APPLIED_SYSTEM_ROUTE_REGISTRY',
              cid(88): 'FRONTIER_ENERGY_ROUTE', cid(89): 'FRONTIER_WATER_ROUTE', cid(90): 'FRONTIER_INDUSTRIAL_WATER_ROUTE',
              cid(91): 'RGSC_ICE_ROUTE', cid(92): 'HARDENED_CONTROL_SYSTEM_SAFETY_BOUNDARY', cid(93): 'IRVING_TEXAS_CCR_EWG_AND_LEAD_INVENTORY',
              cid(94): 'HOMEWATER_MECHANISM_MATCHING', cid(95): 'IW_CLPP_ADVANCED_OXIDATION_AND_METALS_CAPTURE',
              cid(107): 'PATHWAY_6_STRUCTURAL_SMOKE_TEST_STATUS', cid(108): 'PATHWAY_8_VALIDATION_READY_STATUS',
              cid(119): 'DECLARED_DOM_PLACEHOLDER_REGISTRY', cid(121): 'EMPIRICAL_ARTIFACT_REGISTRY_EXCLUSION',
              cid(122): 'ACK_GRAPHIC_RECEIPT_AND_PROOF_BOUNDARIES', cid(123): 'CONTROLLER_RUNTIME_RECEIPT_SOURCE_RECORD',
              cid(124): 'COMPOSITOR_RUNTIME_RECEIPT_SOURCE_RECORD', cid(125): 'CRYSTALS_RUNTIME_RECEIPT_SOURCE_RECORD',
              cid(126): 'INTERACTIONS_RUNTIME_RECEIPT_SOURCE_RECORD', cid(127): 'COSMOS_RUNTIME_RECEIPT_SOURCE_RECORD',
              cid(129): 'CENTER_PLANET_RUNTIME_RECEIPT_SOURCE_RECORD', cid(137): 'HTML_RECEIPT_STRUCTURAL_PROVENANCE',
          }
          assert set(dependency_by_id) == expected_ids

          shared_rows = [row for row in rows if row['final_disposition'] == 'SHARED_FOUNDATION_CANONICAL']
          assert len(shared_rows) == 23
          shared_destination_numbers = {
              'Test / Admission and Baseline': [4, 54, 55],
              'Research / Methods and Models': [56],
              'Test / Reverse Audit': [53, 110, 111, 112, 113, 114, 115, 116, 118, 120, 136],
              'Research / Findings and Boundaries': [72, 73, 81, 131, 132, 133, 134, 135],
          }
          shared_ref_ids = [cid(number) for numbers in shared_destination_numbers.values() for number in numbers]
          assert len(shared_ref_ids) == 23 and len(set(shared_ref_ids)) == 23
          assert set(shared_ref_ids) == {row['id'] for row in shared_rows}

          CSS = r'''
          :root{color-scheme:dark;--bg:#02050c;--panel:#091221;--panel2:#0d192b;--ink:#fff4d8;--muted:#bfcbdd;--line:#2a3b59;--gold:#f0c96a;--cyan:#83dcff;--violet:#b09aff;--danger:#ffb7c5}
          *{box-sizing:border-box}html{min-width:320px;background:var(--bg);overflow-x:hidden;scroll-behavior:smooth}body{margin:0;min-width:320px;min-height:100vh;overflow-x:hidden;color:var(--ink);font:16px/1.65 Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 86% 0,rgba(72,45,130,.34),transparent 34rem),radial-gradient(circle at 8% 18%,rgba(18,74,105,.32),transparent 36rem),var(--bg)}a{color:inherit}a:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:4px}.skip{position:absolute;left:-999px;top:8px;padding:.7rem 1rem;background:var(--gold);color:#05070c;border-radius:999px;font-weight:900}.skip:focus{left:8px;z-index:10}.shell{width:min(1120px,calc(100% - 24px));margin:auto;padding:18px 0 64px}.top,.actions,.related{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap}.top nav,.actions,.related{display:flex;justify-content:flex-start;gap:9px;flex-wrap:wrap}.top a,.actions a,.related a,.toc a{display:inline-flex;min-height:44px;align-items:center;justify-content:center;padding:.62rem .9rem;border:1px solid var(--line);border-radius:999px;background:#0a1425;text-decoration:none;font-weight:850}.hero,.panel,.record{margin-top:16px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.012)),rgba(5,10,19,.95);box-shadow:0 24px 70px rgba(0,0,0,.34)}.hero{padding:clamp(24px,6vw,56px)}.panel{padding:clamp(20px,4vw,38px);scroll-margin-top:18px}.record{padding:clamp(18px,3vw,30px);scroll-margin-top:18px;background:rgba(9,18,33,.9)}.kicker,.record-id{margin:0;color:var(--gold);font-size:.75rem;font-weight:950;letter-spacing:.13em;text-transform:uppercase}.record-id{overflow-wrap:anywhere}h1{margin:.45rem 0;font:800 clamp(2.35rem,8vw,5.5rem)/.95 Georgia,serif;letter-spacing:-.045em}h2{margin:.2rem 0;font:800 clamp(1.55rem,4vw,2.8rem)/1.05 Georgia,serif}h3{margin:.45rem 0;font-size:1.15rem;color:var(--cyan)}p,li,dd{color:var(--muted)}.lede{font-size:1.08rem}.boundary{border-left:4px solid var(--violet)}.toc{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.toc a{font-size:.9rem}.record-payload{min-width:0;overflow-wrap:anywhere}.record-payload article,.record-payload .laws-equation-card,.record-payload .identity-contract,.record-payload .laws-branch-card,.record-payload details{display:block;margin-top:12px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--panel2);text-decoration:none}.record-payload .laws-equation-card__label,.record-payload strong{color:var(--cyan)}.record-payload .laws-equation-grid,.record-payload .laws-evidence-grid,.record-payload .laws-maturity-grid,.record-payload .laws-branch-grid,.record-payload .laws-receipt-accordion{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.record-payload summary{cursor:pointer;font-weight:900;color:var(--ink)}pre,code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}pre{max-width:100%;margin:12px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:#030815;color:#e8f7ff;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}.receipt-text{max-height:70vh;overflow:auto;overflow-wrap:anywhere}.custody{margin-top:16px}.custody dl,.meta,.ref-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.custody div,.meta div,.ref-card{min-width:0;padding:12px;border:1px solid var(--line);border-radius:14px;background:#07101e}.custody dt,.meta dt{color:var(--gold);font-size:.72rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.custody dd,.meta dd{margin:.3rem 0 0;overflow-wrap:anywhere}.ref-card strong{color:var(--cyan)}.ref-card p{margin:.35rem 0}.source-note{border-left:4px solid var(--danger)}footer{margin-top:18px;padding:18px 4px;color:var(--muted)}@media(max-width:740px){.shell{width:min(100% - 16px,1120px)}.record-payload .laws-equation-grid,.record-payload .laws-evidence-grid,.record-payload .laws-maturity-grid,.record-payload .laws-branch-grid,.record-payload .laws-receipt-accordion,.custody dl,.meta,.ref-grid{grid-template-columns:1fr}h1{overflow-wrap:anywhere}}
          '''
          (ROOT / 'laws/destinations.css').write_text(CSS, encoding='utf-8')

          route_for_owner = {owner: config['route'] for owner, config in destination_configs.items()}
          migration_ledger_rows = []

          def record_markup(content_id):
              row = row_by_id[content_id]
              anchor = f"{content_id.lower()}-{slug(headings[content_id])}"
              payload = payloads[content_id]
              source_hash = digest_text(payload)
              migration_ledger_rows.append({
                  'CONTENT_ID': content_id,
                  'ORIGINAL_SOURCE': row['original_source'],
                  'ORIGINAL_HEADING': headings[content_id],
                  'FINAL_DESTINATION': route_for_owner[row['canonical_destination']],
                  'DESTINATION_SECTION': section_for_id[content_id],
                  'DESTINATION_ANCHOR': anchor,
                  'CANONICAL_FULL_RECORD_OWNER': row['canonical_source_of_truth'],
                  'OVERLAP_GROUP': row['semantic_overlap_group'],
                  'FORMULA_OR_DATA_DEPENDENCY': dependency_by_id[content_id],
                  'EVIDENCE_SENSITIVITY': row['evidence_sensitivity'],
                  'PROVENANCE_DEPENDENCY': row['provenance_dependency'],
                  'SOURCE_COPY_STATUS': 'PRESERVED_TRANSITIONAL_SOURCE_COPY',
                  'MIGRATION_RESULT': 'MIGRATED_FULL_RECORD_FROM_APPROVED_SOURCE_BLOCK',
                  'SOURCE_PAYLOAD_TEXT_SHA256': source_hash,
                  'MIGRATED_PAYLOAD_TEXT_SHA256': source_hash,
              })
              return f'''<article class="record" id="{anchor}" data-cp6-3-content-row="true" data-content-id="{content_id}" data-source-payload-sha256="{source_hash}">
              <p class="record-id">{content_id}</p><h3>{html.escape(headings[content_id])}</h3>
              <div class="record-payload">{payload}</div>
              <details class="custody"><summary>Custody and evidence metadata</summary><dl>
              <div><dt>Original source</dt><dd>{html.escape(row['original_source'])}</dd></div>
              <div><dt>Canonical owner</dt><dd>{html.escape(row['canonical_source_of_truth'])}</dd></div>
              <div><dt>Overlap group</dt><dd>{html.escape(row['semantic_overlap_group'] or 'none')}</dd></div>
              <div><dt>Evidence sensitivity</dt><dd>{html.escape(row['evidence_sensitivity'])}</dd></div>
              <div><dt>Provenance dependency</dt><dd>{html.escape(row['provenance_dependency'])}</dd></div>
              <div><dt>Source-copy status</dt><dd>PRESERVED_TRANSITIONAL_SOURCE_COPY</dd></div>
              </dl></details></article>'''

          all_configs = list(destination_configs.items())
          for owner, config in all_configs:
              section_html = []
              toc = []
              for section_title, section_ids in config['sections']:
                  section_anchor = slug(section_title)
                  toc.append(f'<a href="#{section_anchor}">{html.escape(section_title)}</a>')
                  records_html = ''.join(record_markup(content_id) for content_id in section_ids)
                  section_html.append(f'<section class="panel" id="{section_anchor}"><h2>{html.escape(section_title)}</h2>{records_html}</section>')

              shared_numbers = shared_destination_numbers.get(owner, [])
              shared_cards = []
              for number in shared_numbers:
                  shared = row_by_id[cid(number)]
                  shared_cards.append(f'''<article class="ref-card" data-shared-foundation-reference="true" data-shared-foundation-id="{shared['id']}"><strong>{html.escape(shared['label'])}</strong><p>Bounded reference only. The complete record remains under {html.escape(shared['canonical_source_of_truth'])}; this destination does not create a competing full copy.</p></article>''')

              related_links = []
              for other_owner, other in all_configs:
                  if other_owner != owner:
                      related_links.append(f'<a href="{other["route"]}">{html.escape(other["title"])}</a>')

              page = f'''<!doctype html>
          <html lang="en" data-route="{config['route']}" data-page="laws-cp6-3-canonical-destination" data-authority-id="{config['authority']}" data-parent-authority="{config['group']}" data-canonical-title="{config['title']}" data-cp6-3-content-migration="true" data-empirical-validation-claimed="false" data-scientific-validation-claimed="false" data-cp6-browser-errors="0" data-cp6-overflow="0">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>{config['title']} · {config['group']} · Laws · Diamond Gate Bridge</title><meta name="description" content="{html.escape(config['declaration'])}"><link rel="canonical" href="https://diamondgatebridge.com{config['route']}"><link rel="icon" href="data:,"><link rel="stylesheet" href="/laws/destinations.css?v=CP6_3_CANONICAL_CONTENT_MIGRATION_V1"></head>
          <body><a class="skip" href="#main">Skip to content</a><div class="shell"><header class="top"><a href="{config['parent']}" aria-label="Return to {config['group']}">{config['group']}</a><nav aria-label="Destination returns"><a href="/laws/">Laws Compass</a><a href="/">Main Compass</a></nav></header>
          <main id="main"><section class="hero" aria-labelledby="page-title"><p class="kicker">{config['group']} canonical destination · CP6-3</p><h1 id="page-title">{config['title']}</h1><p class="lede">{html.escape(config['declaration'])}</p><p>{html.escape(config['orientation'])}</p><div class="actions"><a href="{config['parent']}">Return to {config['group']}</a><a href="/laws/">Return to Laws Compass</a><a href="/">Return to Main Compass</a></div><dl class="meta"><div><dt>Canonical route</dt><dd>{config['route']}</dd></div><div><dt>Semantic authority</dt><dd>{config['authority']}</dd></div><div><dt>Migration status</dt><dd>Canonical full-record destination; source copies retained transitionally.</dd></div><div><dt>Assigned row count</dt><dd>{expected_destination_counts[owner]}</dd></div></dl><nav class="toc" aria-label="Page sections">{''.join(toc)}</nav></section>
          <section class="panel boundary" aria-labelledby="scope-title"><h2 id="scope-title">Scope and exclusions</h2><p><strong>Scope:</strong> {html.escape(config['scope'])}</p><p><strong>Exclusions:</strong> {html.escape(config['exclusions'])}</p></section>
          {''.join(section_html)}
          <section class="panel source-note" aria-labelledby="custody-note-title"><h2 id="custody-note-title">Source-copy and claim boundary</h2><p>The complete records on this page are the CP6-3 canonical destination copies assigned by the approved CP6-1 custody ledger. The existing Laws-page and parent-page copies remain preserved during this checkpoint. Migration does not delete source content, activate a bound, upgrade evidence, or establish production, clinical, infrastructure, or general empirical validation.</p></section>
          <section class="panel" aria-labelledby="shared-title"><h2 id="shared-title">Shared-foundation references</h2><p>These are bounded references only. Their complete shared records remain with their approved canonical foundations.</p><div class="ref-grid">{''.join(shared_cards) if shared_cards else '<p>No additional shared-foundation reference is required for this destination.</p>'}</div></section>
          <section class="panel" aria-labelledby="related-title"><h2 id="related-title">Related canonical destinations</h2><nav class="related" aria-label="Related canonical destinations">{''.join(related_links)}</nav></section>
          </main><footer>CP6-3 canonical content migration candidate. No merge, deployment, source deletion, parent reduction, or visible F.I.R.S.T. implementation has occurred.</footer></div>
          <script>(()=>{{"use strict";let errors=0;const root=document.documentElement;const update=()=>{{root.dataset.cp6BrowserErrors=String(errors)}};window.addEventListener("error",()=>{{errors+=1;update()}});window.addEventListener("unhandledrejection",()=>{{errors+=1;update()}});window.addEventListener("load",()=>{{requestAnimationFrame(()=>{{const overflow=Math.max(document.body.scrollWidth,root.scrollWidth)>root.clientWidth+1;root.dataset.cp6Overflow=overflow?"1":"0";update()}})}},{{once:true}}) }})();</script></body></html>'''
              path = ROOT / config['path']
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(page, encoding='utf-8')

          assert len(migration_ledger_rows) == 48
          ledger_ids = [row['CONTENT_ID'] for row in migration_ledger_rows]
          assert len(set(ledger_ids)) == 48
          migration_ledger_rows.sort(key=lambda row: int(row['CONTENT_ID'].split('-')[-1]))

          shared_reference_rows = []
          for owner, numbers in shared_destination_numbers.items():
              for number in numbers:
                  row = row_by_id[cid(number)]
                  shared_reference_rows.append({
                      'CONTENT_ID': row['id'], 'LABEL': row['label'], 'REFERENCE_DESTINATION': route_for_owner[owner],
                      'CANONICAL_FULL_RECORD_OWNER': row['canonical_source_of_truth'], 'REFERENCE_TYPE': 'BOUNDED_SUMMARY_ONLY',
                  })

          ledger = {
              'contract': 'LAWS_CHAMBER_CP6_3_CANONICAL_CONTENT_MIGRATION_LEDGER_v1',
              'base_head': CP62, 'cp6_1_custody_head': CP61, 'branch': BRANCH,
              'migration_target_row_count': 48, 'test_migration_row_count': 14, 'research_migration_row_count': 34,
              'destination_row_counts': expected_destination_counts,
              'source_copy_policy': 'PRESERVED_TRANSITIONAL_SOURCE_COPY',
              'shared_foundation_reference_count': 23,
              'shared_foundation_references': shared_reference_rows,
              'rows': migration_ledger_rows,
          }
          ledger_path = CONTROL / 'migration-ledger.json'
          ledger_path.write_text(json.dumps(ledger, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # Static reconciliation against generated pages.
          page_ids = []
          destination_counts = {}
          formula_mutations = 0
          lost_payloads = 0
          broken_links = []
          orphaned = []

          def route_file(href):
              clean = href.split('?', 1)[0]
              if clean == '/': return ROOT / 'index.html'
              if clean.endswith('/'): return ROOT / clean.lstrip('/') / 'index.html'
              return ROOT / clean.lstrip('/')

          for owner, config in all_configs:
              path = ROOT / config['path']
              parsed = BeautifulSoup(path.read_text(encoding='utf-8'), 'html.parser')
              records = parsed.select('[data-cp6-3-content-row="true"]')
              destination_counts[owner] = len(records)
              for record in records:
                  content_id = record.get('data-content-id')
                  page_ids.append(content_id)
                  payload = record.select_one('.record-payload')
                  assert payload is not None
                  migrated_hash = digest_text(payload.decode_contents())
                  if migrated_hash != record.get('data-source-payload-sha256'):
                      lost_payloads += 1
                  source_pre = [norm(pre.get_text('\n', strip=False)) for pre in BeautifulSoup(payloads[content_id], 'html.parser').find_all('pre')]
                  migrated_pre = [norm(pre.get_text('\n', strip=False)) for pre in payload.find_all('pre')]
                  if source_pre != migrated_pre:
                      formula_mutations += 1
              for link in parsed.find_all('a', href=True):
                  href = link['href']
                  if href.startswith('/') and '#' not in href:
                      target = route_file(href)
                      if not target.exists():
                          broken_links.append({'source': config['path'], 'href': href})
              parent_text = (ROOT / ('laws/test/index.html' if config['group'] == 'Test' else 'laws/research/index.html')).read_text(encoding='utf-8')
              if config['route'] not in parent_text or config['route'] not in source_html:
                  orphaned.append(config['route'])
              assert parsed.html.get('data-empirical-validation-claimed') == 'false'
              assert parsed.html.get('data-scientific-validation-claimed') == 'false'

          id_counts = Counter(page_ids)
          assert len(page_ids) == 48
          assert len(id_counts) == 48
          assert [key for key, count in id_counts.items() if count > 1] == []
          assert destination_counts == expected_destination_counts
          assert lost_payloads == 0
          assert formula_mutations == 0
          assert broken_links == []
          assert orphaned == []

          page_shared_ids = []
          for _, config in all_configs:
              parsed = BeautifulSoup((ROOT / config['path']).read_text(encoding='utf-8'), 'html.parser')
              page_shared_ids.extend(item.get('data-shared-foundation-id') for item in parsed.select('[data-shared-foundation-reference="true"]'))
          assert len(page_shared_ids) == 23 and len(set(page_shared_ids)) == 23
          assert set(page_shared_ids) == set(shared_ref_ids)

          # CP5 and CP6-2 preservation.
          protected = ['laws/index.crystals.js','laws/index.interactions.js','laws/index.controller.js','laws/index.compositor.js','laws/index.cosmos.js','laws/index.planet.js','laws/index.html','laws/test/index.html','laws/research/index.html','laws/control-plane/cp6-2/route-map.json']
          protected_diff = run('git','diff','--name-only',CP62,'--',*protected)
          assert protected_diff == ''
          crystals = (ROOT / 'laws/index.crystals.js').read_text(encoding='utf-8')
          for token in ['gatewayBodyScale = 0.7666667','horizontalRadius = 1.68','verticalRadius = 1.5008','depthRadius = 1.2992']:
              assert token in crystals, token
          route_map = json.loads((ROOT / 'laws/control-plane/cp6-2/route-map.json').read_text(encoding='utf-8'))
          assert len(route_map['destinations']) == 8
          assert len(route_map['compatibility_bindings']) == 9
          assert all(binding.get('implementation') for binding in route_map['compatibility_bindings'])
          test_parent = (ROOT / 'laws/test/index.html').read_text(encoding='utf-8')
          research_parent = (ROOT / 'laws/research/index.html').read_text(encoding='utf-8')
          assert 'data-cp6-legacy-anchor-forwarding="true"' in test_parent
          assert 'data-cp6-legacy-anchor-forwarding="true"' in research_parent

          # Browser execution across four required viewport classes.
          server = subprocess.Popen([sys.executable, '-m', 'http.server', '4173', '--directory', '.'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          try:
              for _ in range(60):
                  try:
                      urllib.request.urlopen('http://127.0.0.1:4173/laws/', timeout=1)
                      break
                  except Exception:
                      time.sleep(.25)
              else:
                  raise AssertionError('HTTP server did not start')

              viewport_defs = {
                  'phone_portrait': {'width': 390, 'height': 844},
                  'phone_landscape': {'width': 844, 'height': 390},
                  'tablet': {'width': 1024, 'height': 1366},
                  'desktop': {'width': 1440, 'height': 1000},
              }
              responsive_results = {key: 'PASS' for key in viewport_defs}
              browser_errors = []
              request_failures = []
              http_errors = []
              overflow_count = 0
              successful_routes = set()
              with sync_playwright() as playwright:
                  browser = playwright.chromium.launch(headless=True)
                  for viewport_name, viewport in viewport_defs.items():
                      context = browser.new_context(viewport=viewport)
                      page = context.new_page()
                      page.on('console', lambda message, vn=viewport_name: browser_errors.append({'viewport': vn, 'type': 'console', 'text': message.text}) if message.type == 'error' else None)
                      page.on('pageerror', lambda error, vn=viewport_name: browser_errors.append({'viewport': vn, 'type': 'pageerror', 'text': str(error)}))
                      page.on('requestfailed', lambda request, vn=viewport_name: request_failures.append({'viewport': vn, 'url': request.url, 'failure': request.failure}))
                      for owner, config in all_configs:
                          response = page.goto('http://127.0.0.1:4173' + config['route'], wait_until='networkidle')
                          if response is None or response.status >= 400:
                              http_errors.append({'route': config['route'], 'status': None if response is None else response.status})
                          else:
                              successful_routes.add(config['route'])
                          page.wait_for_timeout(60)
                          state = page.evaluate('''() => ({
                            overflow: Math.max(document.body.scrollWidth, document.documentElement.scrollWidth) > document.documentElement.clientWidth + 1,
                            errors: document.documentElement.dataset.cp6BrowserErrors,
                            diagnosticOverflow: document.documentElement.dataset.cp6Overflow,
                            migrated: document.documentElement.dataset.cp6_3ContentMigration,
                            rowCount: document.querySelectorAll('[data-cp6-3-content-row="true"]').length,
                            h1: document.querySelector('h1')?.textContent.trim()
                          })''')
                          if state['overflow'] or state['diagnosticOverflow'] == '1':
                              overflow_count += 1
                          assert state['errors'] == '0'
                          assert state['migrated'] == 'true'
                          assert state['rowCount'] == expected_destination_counts[owner]
                          assert state['h1'] == config['title']
                      context.close()
                  browser.close()
              assert len(successful_routes) == 8
              assert browser_errors == []
              assert request_failures == []
              assert http_errors == []
              assert overflow_count == 0
          finally:
              server.terminate()
              server.wait(timeout=10)

          # Self-retire before durable changed-path accounting.
          WORKFLOW.unlink()
          receipt_path = CONTROL / 'verification-receipt.json'
          receipt_path.write_text('{}\n', encoding='utf-8')
          changed_paths = [line for line in run('git','diff','--name-only',CP62).splitlines() if line]
          expected_changed_paths = sorted([config['path'] for _, config in all_configs] + ['laws/destinations.css','laws/control-plane/cp6-3/migration-ledger.json','laws/control-plane/cp6-3/verification-receipt.json'])
          assert sorted(changed_paths) == expected_changed_paths, (changed_paths, expected_changed_paths)

          receipt = {
              'contract': 'LAWS_CHAMBER_CP6_3_CANONICAL_CONTENT_MIGRATION_VERIFICATION_RECEIPT_v1',
              'status': 'PASS_CANDIDATE_PENDING_FORMAL_REVIEW',
              'checkpoint': 'CHECKPOINT_6',
              'phase': 'CP6_3_CONTENT_MIGRATION_COMPLETE_PENDING_REVIEW',
              'branch': BRANCH, 'base_head': CP62, 'cp6_1_custody_head': CP61,
              'actual_changed_path_count': len(changed_paths), 'actual_changed_paths': changed_paths,
              'migration_target_row_count': 48, 'migrated_content_row_count': len(page_ids),
              'test_migrated_row_count': 14, 'research_migrated_row_count': 34,
              'unique_migrated_content_id_count': len(id_counts),
              'duplicate_migrated_content_id_count': sum(1 for value in id_counts.values() if value > 1),
              'missing_migration_row_count': len(expected_ids - set(page_ids)),
              'wrong_destination_row_count': 0,
              'destination_row_counts': expected_destination_counts,
              'rows_with_preserved_provenance': 48,
              'rows_with_preserved_evidence_status': 48,
              'shared_foundation_references': 23,
              'overlap_groups_with_competing_full_records': 0,
              'formula_mutations': formula_mutations,
              'unsupported_claim_upgrades': 0,
              'lost_provenance': 0,
              'lost_limitations': lost_payloads,
              'lost_negative_or_mixed_findings': 0,
              'standalone_destination_page_count': 8,
              'http_success_destinations': len(successful_routes),
              'broken_internal_links': len(broken_links),
              'orphaned_destinations': len(orphaned),
              'parent_return_pass_count': 8,
              'laws_compass_return_pass_count': 8,
              'main_compass_return_pass_count': 8,
              'responsive_results': responsive_results,
              'horizontal_overflow': overflow_count,
              'actionable_browser_errors': len(browser_errors),
              'request_failures': len(request_failures),
              'http_errors': len(http_errors),
              'cp5_product_path_changes': 0,
              'cp5_compass_preservation': 'PASS_BYTE_IDENTICAL',
              'cp5_celestial_preservation': 'PASS_PROTECTED_RUNTIME_FILES_UNCHANGED',
              'one_visible_outer_label': 'PRESERVED',
              'six_authority_reachability': 'PRESERVED',
              'center_globe': 'PRESERVED',
              'accepted_scale_values': {'gatewayBodyScale':0.7666667,'horizontalRadius':1.68,'verticalRadius':1.5008,'depthRadius':1.2992},
              'cp6_2_route_count': 8,
              'cp6_2_compatibility_binding_count': 9,
