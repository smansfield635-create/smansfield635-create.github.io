name: H-Earth Target 4F Bounded Final Closure Audit

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  execute-target-4f:
    if: startsWith(github.head_ref, 'agent/h-earth-repository-registry-target-4f-')
    runs-on: ubuntu-latest
    steps:
      - name: Check out actual installation branch
        uses: actions/checkout@v4
        with:
          ref: agent/h-earth-repository-registry-installation-001
          fetch-depth: 0

      - name: Execute final integrated Target 4F audit and preserve diagnostics
        shell: bash
        run: |
          set +e
          TARGET_COMMIT="$(git rev-parse HEAD)"
          TARGET_BRANCH='agent/h-earth-repository-registry-installation-001' \
          TARGET_COMMIT="$TARGET_COMMIT" \
          node --experimental-default-type=module \
            tools/h-earth-repository-registry-target-4f-audit.mjs \
            > /tmp/target-4f-audit.json \
            2> /tmp/target-4f-audit.stderr
          STATUS=$?
          echo "$STATUS" > /tmp/target-4f-status

          if [ ! -f h-earth-3d/registry/h-earth.repository-registry.target-4f-receipt.json ]; then
            node -e "
              const fs = require('fs');
              const stderr = fs.existsSync('/tmp/target-4f-audit.stderr')
                ? fs.readFileSync('/tmp/target-4f-audit.stderr', 'utf8')
                : 'NO_STDERR_CAPTURED';
              const receipt = {
                receiptId: 'H_EARTH_REPOSITORY_REGISTRY_TARGET_4F_EXECUTION_EXCEPTION_RECEIPT_v1',
                targetNumber: 4,
                targetSubtarget: '4F-7',
                result: 'ERROR',
                branch: 'agent/h-earth-repository-registry-installation-001',
                executedCommit: process.env.GITHUB_SHA,
                executionEnvironment: 'BOUNDED_GITHUB_ACTION_ACTUAL_BRANCH_CHECKOUT',
                executionError: stderr,
                boundaries: {
                  userAcceptanceEstablished: false,
                  mergeAuthorityCreated: false,
                  canonicalizationAuthorityCreated: false,
                  mainActivationCreated: false
                }
              };
              fs.writeFileSync(
                'h-earth-3d/registry/h-earth.repository-registry.target-4f-receipt.json',
                JSON.stringify(receipt, null, 2) + '\n'
              );
            "
          fi

      - name: Commit diagnostic or passing receipt
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(node -p "JSON.parse(require('fs').readFileSync('h-earth-3d/registry/h-earth.repository-registry.target-4f-receipt.json','utf8')).result")"
          if [ "$RESULT" = "PASS" ]; then
            rm .github/workflows/h-earth-repository-registry-target-4f-bounded-audit.yml
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add h-earth-3d/registry/h-earth.repository-registry.target-4f-receipt.json
          if [ "$RESULT" = "PASS" ]; then
            git add .github/workflows/h-earth-repository-registry-target-4f-bounded-audit.yml
          fi
          git commit -m "Record Target 4F final audit receipt: $RESULT"
          git push origin HEAD:agent/h-earth-repository-registry-installation-001

      - name: Enforce final audit result
        shell: bash
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const value = JSON.parse(fs.readFileSync('h-earth-3d/registry/h-earth.repository-registry.target-4f-receipt.json', 'utf8'));
            if (value.result !== 'PASS') {
              console.error(JSON.stringify({ result: value.result, failedChecks: value.audit?.failedChecks ?? [], executionError: value.executionError ?? null }));
              process.exit(1);
            }
            if (value.audit.failedChecks.length !== 0) process.exit(1);
            if (value.regressions.target2.passedChecks !== 25) process.exit(1);
            if (value.regressions.target3.passedChecks !== 24) process.exit(1);
            if (value.regressions.target4A.passedChecks !== 33) process.exit(1);
            if (value.regressions.target4B.passedChecks !== 34) process.exit(1);
            if (value.regressions.target4C.staticPassedChecks !== 37) process.exit(1);
            if (value.regressions.target4C.passedFixtureCount !== 33) process.exit(1);
            if (value.regressions.target4E.staticPassedChecks !== 47) process.exit(1);
            if (value.regressions.target4E.passedScenarioCount !== 8) process.exit(1);
          "
