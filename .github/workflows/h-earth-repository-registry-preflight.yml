name: H-Earth HC00 Lock Lifecycle Closure Carrier

on:
  push:
    branches:
      - verification/h-earth-hc00-lock-lifecycle-carrier-v1-001
    paths:
      - '.github/workflows/h-earth-repository-registry-preflight.yml'

permissions:
  contents: write

concurrency:
  group: h-earth-hc00-lock-lifecycle-carrier-v1
  cancel-in-progress: false

env:
  REPOSITORY: smansfield635-create/smansfield635-create.github.io
  LOCK_REF: refs/heads/operation-locks/repository-operation-intake-v1
  EXPECTED_PARENT: 6469b1b800e3ce3d3334623f591797cfac78d378
  WORKFLOW_PATH: .github/workflows/h-earth-repository-registry-preflight.yml
  OUT_DIR: /tmp/h-earth-lock-lifecycle-closure-receipts

jobs:
  close-exact-locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out execution-only carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact one-path carrier and parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only HEAD^ HEAD)" = "$WORKFLOW_PATH"
          mkdir -p "$OUT_DIR"
          git ls-remote origin refs/heads/main | awk '{print $1}' > "$OUT_DIR/main-before.txt"

      - name: Verify exact live lock identities before closure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const repo=process.env.REPOSITORY;
          const token=process.env.GITHUB_TOKEN;
          const out=process.env.OUT_DIR;
          const headers={Accept:'application/vnd.github+json',Authorization:`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'};
          async function get(url){const r=await fetch(url,{headers});const t=await r.text();if(!r.ok)throw Error(`API_${r.status}:${t}`);return t?JSON.parse(t):null;}
          const ref=await get(`https://api.github.com/repos/${repo}/git/ref/heads/operation-locks/repository-operation-intake-v1`);
          const head=ref.object.sha;
          const file=await get(`https://api.github.com/repos/${repo}/contents/.github/operation-intake/active-operation-ledger.v1.json?ref=${head}`);
          const ledger=JSON.parse(Buffer.from(file.content.replace(/\s/g,''),'base64').toString());
          const expected=[
            {generation:607,operationId:'H_EARTH_LIVE_EXPERIENCE_MATURITY_CONVERGENCE_ACCEPTED_OCCURRENCE_REGISTRY_CLOSURE_v1',scope:'H_EARTH:LIVE_EXPERIENCE_MATURITY_CONVERGENCE:ACCEPTED_OCCURRENCE_REGISTRY_CLOSURE:V1:EXACT_3_PATH_SCOPE'},
            {generation:610,operationId:'H_EARTH_HC00_ACCEPTED_OCCURRENCE_FRESH_EXECUTION_CARRIER_v1',scope:'H_EARTH:LIVE_EXPERIENCE_MATURITY_CONVERGENCE:HC00_ACCEPTED_OCCURRENCE:FRESH_EXECUTION_CARRIER:V1:EXACT_4_PATH_SCOPE'},
            {generation:613,operationId:'H_EARTH_HC00_ACCEPTED_OCCURRENCE_EXACT_HEAD_RATIFICATION_AND_MERGE_v1',scope:'H_EARTH:LIVE_EXPERIENCE_MATURITY_CONVERGENCE:HC00_ACCEPTED_OCCURRENCE:PR789:EXACT_HEAD_RATIFICATION_AND_MERGE:V1'},
            {generation:618,operationId:'H_EARTH_HC00_ACCEPTED_OCCURRENCE_REGISTRY_REANCHOR_v1',scope:'H_EARTH:LIVE_EXPERIENCE_MATURITY_CONVERGENCE:HC00_ACCEPTED_OCCURRENCE:PR789:REANCHOR:V1:EXACT_3_PATH_SCOPE'},
            {generation:624,operationId:'H_EARTH_HC00_REGISTRY_CLOSURE_LOCK_LIFECYCLE_CARRIER_v1',scope:'H_EARTH:LIVE_EXPERIENCE_MATURITY_CONVERGENCE:HC00_ACCEPTED_OCCURRENCE:LOCK_LIFECYCLE_CARRIER:V1:EXACT_1_WORKFLOW_PATH_SCOPE'}
          ];
          const active=Object.values(ledger.activeScopes ?? {});
          const checks=expected.map(e=>{const x=active.find(v=>v.lockGeneration===e.generation&&v.operationId===e.operationId&&v.lockScope===e.scope&&v.released===false);return {...e,activeExact:Boolean(x)};});
          const receipt={schema:'H_EARTH_HC00_LOCK_LIFECYCLE_PRECHECK_v1',result:checks.every(x=>x.activeExact)?'PASS':'FAIL_CLOSED',lockRefHead:head,checks};
          fs.writeFileSync(`${out}/precheck.json`,JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          if(receipt.result!=='PASS')process.exit(1);
          NODE

      - name: Close target locks and carrier lock through canonical manager
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p "$OUT_DIR"
          MANAGER=tools/operation-intake/repository-operation-lock-manager.v1.mjs
          close_exact() {
            local operation_id="$1" scope="$2" generation="$3" disposition="$4" output="$5"
            local attempt=1
            while [ "$attempt" -le 3 ]; do
              node "$MANAGER" \
                --action close \
                --repository "$REPOSITORY" \
                --lock-ref "$LOCK_REF" \
                --operation-id "$operation_id" \
                --lock-scope "$scope" \
                --lock-generation "$generation" \
                --terminal-disposition "$disposition" \
                --output "$output"
              local status=$?
              if [ "$status" -eq 0 ] && node -e "const r=require('$output');process.exit(r.result==='TERMINAL_CLOSURE_COMMITTED'&&r.lockReleased===true?0:1)"; then
                return 0
              fi
              local conflict
              conflict=$(node -e "try{const r=require('$output');process.stdout.write(r.errorCode||'')}catch{}")
              if [ "$conflict" != "LEDGER_COMPARE_AND_SWAP_CONFLICT" ]; then
                return 1
              fi
              attempt=$((attempt+1))
              sleep 1
            done
            return 1
          }

          target_ok=1
          close_exact \
            'H_EARTH_HC00_ACCEPTED_OCCURRENCE_FRESH_EXECUTION_CARRIER_v1' \
            'H_EARTH:LIVE_EXPERIENCE_MATURITY_CONVERGENCE:HC00_ACCEPTED_OCCURRENCE:FRESH_EXECUTION_CARRIER:V1:EXACT_4_PATH_SCOPE' \
            610 PASS_CLOSED "$OUT_DIR/close-610.json" || target_ok=0
          close_exact \
            'H_EARTH_HC00_ACCEPTED_OCCURRENCE_EXACT_HEAD_RATIFICATION_AND_MERGE_v1' \
            'H_EARTH:LIVE_EXPERIENCE_MATURITY_CONVERGENCE:HC00_ACCEPTED_OCCURRENCE:PR789:EXACT_HEAD_RATIFICATION_AND_MERGE:V1' \
            613 FAIL_CLOSED "$OUT_DIR/close-613.json" || target_ok=0
          close_exact \
            'H_EARTH_HC00_ACCEPTED_OCCURRENCE_REGISTRY_REANCHOR_v1' \
            'H_EARTH:LIVE_EXPERIENCE_MATURITY_CONVERGENCE:HC00_ACCEPTED_OCCURRENCE:PR789:REANCHOR:V1:EXACT_3_PATH_SCOPE' \
            618 FAIL_CLOSED "$OUT_DIR/close-618.json" || target_ok=0

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const repo=process.env.REPOSITORY,token=process.env.GITHUB_TOKEN,out=process.env.OUT_DIR;
          const headers={Accept:'application/vnd.github+json',Authorization:`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'};
          async function get(url){const r=await fetch(url,{headers});const t=await r.text();if(!r.ok)throw Error(`API_${r.status}:${t}`);return t?JSON.parse(t):null;}
          const ref=await get(`https://api.github.com/repos/${repo}/git/ref/heads/operation-locks/repository-operation-intake-v1`);
          const file=await get(`https://api.github.com/repos/${repo}/contents/.github/operation-intake/active-operation-ledger.v1.json?ref=${ref.object.sha}`);
          const ledger=JSON.parse(Buffer.from(file.content.replace(/\s/g,''),'base64').toString());
          const active=Object.values(ledger.activeScopes ?? {});
          const retained=active.find(v=>v.lockGeneration===607&&v.operationId==='H_EARTH_LIVE_EXPERIENCE_MATURITY_CONVERGENCE_ACCEPTED_OCCURRENCE_REGISTRY_CLOSURE_v1'&&v.released===false);
          const closedTargets=[610,613,618].every(g=>!active.some(v=>v.lockGeneration===g));
          const terminalByGeneration=new Map((ledger.terminalHistory??[]).map(v=>[v.lockGeneration,v]));
          const terminalExact=
            terminalByGeneration.get(610)?.terminalDisposition==='PASS_CLOSED'&&
            terminalByGeneration.get(613)?.terminalDisposition==='FAIL_CLOSED'&&
            terminalByGeneration.get(618)?.terminalDisposition==='FAIL_CLOSED';
          const receipt={schema:'H_EARTH_HC00_LOCK_LIFECYCLE_TARGET_POSTCHECK_v1',result:retained&&closedTargets&&terminalExact?'PASS':'FAIL_CLOSED',lockRefHead:ref.object.sha,lock607Retained:Boolean(retained),targetsRemovedFromActiveScopes:closedTargets,targetTerminalDispositionsExact:terminalExact};
          fs.writeFileSync(`${out}/target-postcheck.json`,JSON.stringify(receipt,null,2)+'\n');
          if(receipt.result!=='PASS')process.exit(1);
          NODE
          postcheck_status=$?

          git ls-remote origin refs/heads/main | awk '{print $1}' > "$OUT_DIR/main-after-targets.txt"
          main_stable=1
          cmp -s "$OUT_DIR/main-before.txt" "$OUT_DIR/main-after-targets.txt" || main_stable=0

          if [ "$target_ok" -eq 1 ] && [ "$postcheck_status" -eq 0 ] && [ "$main_stable" -eq 1 ]; then
            carrier_disposition=PASS_CLOSED
          else
            carrier_disposition=FAIL_CLOSED
          fi

          close_exact \
            'H_EARTH_HC00_REGISTRY_CLOSURE_LOCK_LIFECYCLE_CARRIER_v1' \
            'H_EARTH:LIVE_EXPERIENCE_MATURITY_CONVERGENCE:HC00_ACCEPTED_OCCURRENCE:LOCK_LIFECYCLE_CARRIER:V1:EXACT_1_WORKFLOW_PATH_SCOPE' \
            624 "$carrier_disposition" "$OUT_DIR/close-624.json"
          carrier_close_status=$?

          TARGET_OK="$target_ok" POSTCHECK_STATUS="$postcheck_status" MAIN_STABLE="$main_stable" CARRIER_DISPOSITION="$carrier_disposition" CARRIER_CLOSE_STATUS="$carrier_close_status" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const out=process.env.OUT_DIR;
          const read=(name)=>{try{return JSON.parse(fs.readFileSync(`${out}/${name}`,'utf8'));}catch{return null;}};
          const pass=process.env.TARGET_OK==='1'&&process.env.POSTCHECK_STATUS==='0'&&process.env.MAIN_STABLE==='1'&&process.env.CARRIER_DISPOSITION==='PASS_CLOSED'&&process.env.CARRIER_CLOSE_STATUS==='0'&&read('close-624.json')?.result==='TERMINAL_CLOSURE_COMMITTED';
          const receipt={
            schema:'H_EARTH_HC00_LOCK_LIFECYCLE_CARRIER_RECEIPT_v1',
            result:pass?'PASS_CLOSED':'FAIL_CLOSED',
            executionCarrierHead:process.env.GITHUB_SHA,
            executionCarrierParent:'6469b1b800e3ce3d3334623f591797cfac78d378',
            changedPaths:['.github/workflows/h-earth-repository-registry-preflight.yml'],
            targetClosures:{generation610:read('close-610.json'),generation613:read('close-613.json'),generation618:read('close-618.json')},
            targetPostcheck:read('target-postcheck.json'),
            carrierClosure:read('close-624.json'),
            lock607Retained:read('target-postcheck.json')?.lock607Retained===true,
            mainHeadBefore:fs.readFileSync(`${out}/main-before.txt`,'utf8').trim(),
            mainHeadAfterTargets:fs.readFileSync(`${out}/main-after-targets.txt`,'utf8').trim(),
            mainStableDuringTargetClosures:process.env.MAIN_STABLE==='1',
            directLedgerEditingPerformed:false,
            canonicalLockManagerOnly:true,
            productMutationPerformed:false,
            registryMutationPerformed:false,
            mergePerformed:false,
            carrierMergeAuthorized:false
          };
          fs.writeFileSync(`${out}/summary.json`,JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          if(!pass)process.exit(1);
          NODE
          summary_status=$?
          exit "$summary_status"

      - name: Upload canonical lock lifecycle receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-lock-lifecycle-closure-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/h-earth-lock-lifecycle-closure-receipts/
          if-no-files-found: error
          retention-days: 30
