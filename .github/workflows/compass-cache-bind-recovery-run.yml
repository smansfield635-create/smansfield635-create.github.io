name: Compass Cache Bind Recovery Run

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'fix/compass-cache-bind-recovery-run'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Validate permanent cache identity controller
        run: node .github/ai-router/platform/post-merge-cache-identity-sync.v1.mjs --self-test
      - name: Materialize recovered cache identities
        env:
          CACHE_IDENTITY_BASE: ad3357e817f50cb66b7074e0d620888f2bc5407f
          CACHE_IDENTITY_HEAD: ${{ github.event.pull_request.head.sha }}
          CACHE_IDENTITY_RECEIPT: /tmp/compass-cache-bind-recovery.json
        run: node .github/ai-router/platform/post-merge-cache-identity-sync.v1.mjs
      - name: Commit recovered public bindings
        env:
          HEAD_BEFORE: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo 'No recovered cache bindings were required.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.html' '*.css' '*.js' '*.mjs'
          git commit -m 'chore(delivery): recover missed Compass cache identities [cache-identity-sync]'
          git push origin HEAD:${{ github.head_ref }}
