name: H-Earth East one-shot repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  commit-verified-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify pinned bytes and apply exact repair
        shell: bash
        run: |
          python3 - <<'PY'
          from hashlib import sha1, sha256
          from pathlib import Path

          path = Path('showroom/globe/h-earth/render/geometry-kernel.east.js')
          source = path.read_bytes()

          def git_blob_sha(data: bytes) -> str:
              return sha1(f'blob {len(data)}\0'.encode('ascii') + data).hexdigest()

          assert len(source) == 128722
          assert sha256(source).hexdigest() == '5ce77ab2e477ff1585e2e5835c6c95cac32219e28e44b589f43d15a10afe8e2c'
          assert git_blob_sha(source) == 'b9872c89291f9ec6d404fd7203d7de57826670cf'

          replacements = (
              (b'? ${first}:${second}', b'? `${first}:${second}`'),
              (b': ${second}:${first};', b': `${second}:${first}`;'),
              (b'return ${first}:${second};', b'return `${first}:${second}`;'),
          )
          candidate = source
          for old, new in replacements:
              assert candidate.count(old) == 1
              candidate = candidate.replace(old, new, 1)

          assert len(candidate) == 128728
          assert sha256(candidate).hexdigest() == '4e586ab473123bd0fc4a77c10e07d7f742a48f10d9d8afbb6ae65282136fa6ba'
          assert git_blob_sha(candidate) == '261e73cc2c561dbf8d4f2f8210e51dad361cec91'
          for old, new in replacements:
              assert old not in candidate
              assert candidate.count(new) == 1

          path.write_bytes(candidate)
          print('EXACT_EAST_CANDIDATE_CONSTRUCTED')
          PY

      - name: Run East syntax check
        shell: bash
        run: node --check showroom/globe/h-earth/render/geometry-kernel.east.js

      - name: Parse and link all nineteen governed roots
        shell: bash
        run: |
          node --experimental-vm-modules --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import path from 'node:path';
          import vm from 'node:vm';
          import { fileURLToPath, pathToFileURL } from 'node:url';

          const root = process.cwd();
          const manifestModule = await import(pathToFileURL(
            path.join(root, 'showroom/globe/h-earth/diagnostic/manifest-projection.js')
          ).href);
          const manifest = manifestModule.H_EARTH_FD05_MANIFEST_PROJECTION;
          if (!manifest || !Array.isArray(manifest.rows) || manifest.rows.length !== 19) {
            throw new Error('EXACT_NINETEEN_MANIFEST_ROWS_REQUIRED');
          }

          const cache = new Map();
          const resolveSpecifier = (specifier, identifier) => {
            if (specifier.startsWith('/')) return path.join(root, specifier.slice(1));
            if (specifier.startsWith('.')) return fileURLToPath(new URL(specifier, identifier));
            throw new Error(`UNSUPPORTED_BARE_IMPORT:${specifier}`);
          };

          async function instantiate(absolutePath) {
            const normalized = path.normalize(absolutePath);
            if (cache.has(normalized)) return cache.get(normalized);
            const source = await readFile(normalized, 'utf8');
            const module = new vm.SourceTextModule(source, {
              identifier: pathToFileURL(normalized).href
            });
            cache.set(normalized, module);
            const requests = Array.isArray(module.moduleRequests)
              ? module.moduleRequests.map((request) => request.specifier)
              : module.dependencySpecifiers;
            for (const specifier of requests) {
              await instantiate(resolveSpecifier(specifier, module.identifier));
            }
            return module;
          }

          const roots = [];
          for (const row of manifest.rows) {
            roots.push({
              repositoryPath: row.repositoryPath,
              module: await instantiate(path.join(root, row.repositoryPath.slice(1)))
            });
          }

          const linker = (specifier, referencingModule) => {
            const resolved = path.normalize(resolveSpecifier(specifier, referencingModule.identifier));
            const dependency = cache.get(resolved);
            if (!dependency) throw new Error(`DEPENDENCY_NOT_INSTANTIATED:${resolved}`);
            return dependency;
          };

          for (const item of roots) {
            if (item.module.status === 'unlinked') await item.module.link(linker);
            if (item.module.status !== 'linked') {
              throw new Error(`MODULE_NOT_LINKED:${item.repositoryPath}:${item.module.status}`);
            }
          }
          console.log(`FULFILLED_${roots.length}_OF_19`);
          NODE

      - name: Enforce exact one-file source delta
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only)" = "showroom/globe/h-earth/render/geometry-kernel.east.js"

      - name: Commit verified candidate to PR branch
        shell: bash
        run: |
          git config user.name 'OpenAI Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add showroom/globe/h-earth/render/geometry-kernel.east.js
          git commit -m 'Correct East template literals'
          git push origin HEAD:${{ github.head_ref }}
