name: Estate Validation v1

on:
  pull_request:
    paths:
      - 'validation/**'
      - '.github/ai-router/router.v1.json'
      - '.github/ai-router/projects/estate-validation/entrypoint.v1.json'
      - '.github/workflows/estate-validation-v1.yml'
  push:
    paths:
      - 'validation/**'
      - '.github/ai-router/router.v1.json'
      - '.github/ai-router/projects/estate-validation/entrypoint.v1.json'
      - '.github/workflows/estate-validation-v1.yml'
  workflow_dispatch:

env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  verify-estate-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0

      - name: Verify exact workflow head identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Run repository router self-test
        run: |
          node tools/repository-ai-entry-router.mjs \
            --self-test \
            --output /tmp/estate-validation-router-self-test.json

      - name: Require Estate Validation mutation route
        shell: bash
        run: |
          set -euo pipefail
          node tools/repository-ai-entry-router.mjs \
            --mutation-intent \
            --path validation/README.md \
            --path .github/workflows/estate-validation-v1.yml \
            --task "estate-validation-route-check" \
            --output /tmp/estate-validation-router-route.json
          node -e "const r=require('/tmp/estate-validation-router-route.json');if(r.disposition!=='PASS'||r.routes.length!==2||!r.routes.every(x=>x.projectId==='ESTATE_VALIDATION'&&x.disposition==='PASS'))process.exit(1)"

      - name: Require coverage expansion mutation routes
        shell: bash
        run: |
          set -euo pipefail
          node tools/repository-ai-entry-router.mjs \
            --mutation-intent \
            --path validation/master-validation-register.v1.json \
            --path validation/manifest.v1.json \
            --path validation/harness/verify-estate-validation.v1.mjs \
            --path validation/schemas/coverage-profile.schema.v1.json \
            --path validation/profiles/narrative.v1.json \
            --path validation/profiles/frontier.v1.json \
            --path validation/profiles/products.v1.json \
            --path validation/profiles/mirrorland.v1.json \
            --task "estate-validation-coverage-expansion-route-check" \
            --output /tmp/estate-validation-coverage-router-probe.json
          node - <<'NODE'
          const r = require('/tmp/estate-validation-coverage-router-probe.json');
          if (
            r.disposition !== 'PASS' ||
            r.routes.length !== 8 ||
            !r.routes.every((route) => route.projectId === 'ESTATE_VALIDATION' && route.disposition === 'PASS')
          ) process.exit(1);
          NODE

      - name: Verify estate validation sidecar
        run: |
          node validation/harness/verify-estate-validation.v1.mjs \
            --output /tmp/estate-validation-receipt.json

      - name: Upload validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estate-validation-v1-receipts
          path: |
            /tmp/estate-validation-router-self-test.json
            /tmp/estate-validation-router-route.json
            /tmp/estate-validation-coverage-router-probe.json
            /tmp/estate-validation-receipt.json
          if-no-files-found: error
          retention-days: 30

  close-stale-predecessor-lock-677:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 812 &&
      github.event.pull_request.head.ref == 'agent/estate-validation-coverage-expansion-v1'
    needs: verify-estate-validation
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      LOCK_REF: refs/heads/operation-locks/repository-operation-intake-v1
      LEDGER_PATH: .github/operation-intake/active-operation-ledger.v1.json
      LOCK_MANAGER_PATH: tools/operation-intake/repository-operation-lock-manager.v1.mjs
      LOCK_MANAGER_BLOB: 0aa440a3de30e145c7912fcfe2833fb8430ffbb0
      STALE_SCOPE_HASH: a8b4877947e257dd290d2b809e96e946c7a611487f40bd1b5507edb75034aeba
      SUCCESSOR_SCOPE_HASH: 77e9d50eb7b12a10edb88aa4520d9d7c1333f174f9fbbc325bf8f0234749d07e
    steps:
      - name: Check out exact post-admission probe head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify bounded closure authority and exact lock identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "3c15015e400df28751b719fd0f0cd3e60fde1808"
          test "$(git rev-parse HEAD:$LOCK_MANAGER_PATH)" = "$LOCK_MANAGER_BLOB"
          git fetch --no-tags origin "$LOCK_REF"
          git show FETCH_HEAD:"$LEDGER_PATH" > "$RUNNER_TEMP/estate-validation-ledger-before-closure.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ledger = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/estate-validation-ledger-before-closure.json', 'utf8'));
          const stale = ledger.activeScopes?.[process.env.STALE_SCOPE_HASH];
          if (
            !stale || stale.released || stale.state !== 'ADMITTED_LOCKED' ||
            stale.lockGeneration !== 677 ||
            stale.operationId !== 'ESTATE_VALIDATION_COVERAGE_EXPANSION_NARRATIVE_FRONTIER_PRODUCTS_MIRRORLAND_20260809' ||
            stale.lockScope !== 'ESTATE_VALIDATION:READ_ONLY_COVERAGE:NARRATIVE_FRONTIER_PRODUCTS_MIRRORLAND:V1' ||
            stale.governingHead !== 'de4de1e8b0800c219424afbb047b204870c3e6ce'
          ) throw new Error('STALE_PREDECESSOR_LOCK_677_IDENTITY_MISMATCH');
          const successor = ledger.activeScopes?.[process.env.SUCCESSOR_SCOPE_HASH];
          if (
            !successor || successor.released || successor.state !== 'ADMITTED_LOCKED' ||
            successor.lockGeneration !== 693 ||
            successor.operationId !== 'ESTATE_VALIDATION_COVERAGE_EXPANSION_REANCHOR_AND_STALE_PREDECESSOR_CLOSURE_20260809' ||
            successor.lockScope !== 'ESTATE_VALIDATION:READ_ONLY_COVERAGE:NARRATIVE_FRONTIER_PRODUCTS_MIRRORLAND:V2_REANCHOR' ||
            successor.governingHead !== '3bc5306d0aaa3c023f59b1022bf4e0caed8010fa'
          ) throw new Error('SUCCESSOR_LOCK_693_IDENTITY_MISMATCH');
          NODE

      - name: FAIL-close exact stale predecessor through canonical lock manager
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node "$LOCK_MANAGER_PATH" \
            --action close \
            --repository "$GITHUB_REPOSITORY" \
            --lock-ref "$LOCK_REF" \
            --operation-id ESTATE_VALIDATION_COVERAGE_EXPANSION_NARRATIVE_FRONTIER_PRODUCTS_MIRRORLAND_20260809 \
            --lock-scope 'ESTATE_VALIDATION:READ_ONLY_COVERAGE:NARRATIVE_FRONTIER_PRODUCTS_MIRRORLAND:V1' \
            --lock-generation 677 \
            --terminal-disposition FAIL_CLOSED \
            --output /tmp/estate-validation-stale-lock-677-closure.json
          node - <<'NODE'
          const r = require('/tmp/estate-validation-stale-lock-677-closure.json');
          if (
            r.result !== 'TERMINAL_CLOSURE_COMMITTED' ||
            r.terminalDisposition !== 'FAIL_CLOSED' ||
            r.lockReleased !== true ||
            r.lockGeneration !== 677 ||
            r.scopeHash !== 'a8b4877947e257dd290d2b809e96e946c7a611487f40bd1b5507edb75034aeba'
          ) process.exit(1);
          NODE

      - name: Upload stale predecessor closure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estate-validation-stale-lock-677-closure-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/estate-validation-stale-lock-677-closure.json
          if-no-files-found: error
          retention-days: 90
