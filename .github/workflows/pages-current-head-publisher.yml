name: Shared Current-Head Pages Publisher
# publication nudge: bridge runtime bounded recovery publication 2026-09-30
# publication nudge: lbs two-path implementation fork publication 2026-09-30
# publication nudge: crm runtime bounded recovery publication 2026-09-30
# publication nudge: crm integrated governance and global bridge publication 2026-09-30
# publication nudge: abc local global management publication 2026-09-30
# publication nudge: lbs client journey publication 2026-09-30
# publication nudge: abc roofing plain-language manager surface 2026-09-30
# publication nudge: abc roofing manager actions publication 2026-09-30
# publication nudge: abc roofing bridge compact disclosure publication 2026-09-30
# publication nudge: abc roofing bridge current-head publication 2026-09-30
# publication nudge: final ROI collaboration presentation 2026-09-26
# publication nudge: collaboration contrast repair 2026-09-26
# publication nudge: unified collapsible collaboration 2026-09-26
# publication nudge: DGB-LBS collaboration proposition 2026-09-26
# publication nudge: progressive governance-bridge asset investigation 2026-09-26
# publication nudge: governance-bridge asset investigation 2026-09-26

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-current-head-publisher.yml'
      - 'governance-bridge/index.html'
      - 'release-proof/index.html'
      - '.github/ai-router/publication-surfaces/release-proof.json'
      - 'governance-bridge/governance/index.html'
      - 'governance-bridge/portability/index.html'
      - 'governance-bridge/collaboration/index.html'
      - 'governance-bridge/fort-worth-job-fair/index.html'
      - '.github/ai-router/publication-surfaces/governance-bridge.json'
  workflow_dispatch:
    inputs:
      surface_id:
        description: Registered surface to verify after publishing current main
        required: true
        default: analytics
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: pages-publication-coordinator
  queue: max
  cancel-in-progress: false

jobs:
  dispatch-current-head:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch sole normal production authority
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SURFACE_ID: ${{ inputs.surface_id || 'analytics' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            changed="$(gh api "/repos/$REPO/commits/$EVENT_SHA" --jq '.files[].filename')"
            if printf '%s\n' "$changed" | grep -Eq '^(release-proof/|\.github/ai-router/publication-surfaces/release-proof\.json$)'; then
              SURFACE_ID="release-proof"
            else
              SURFACE_ID="governance-bridge"
            fi
          fi
          echo "CURRENT_HEAD_PUBLICATION_SURFACE_SELECTED=$SURFACE_ID event=$EVENT_NAME"
          head="$(gh api "/repos/$REPO/commits/main" --jq .sha)"
          runs="$(gh api "/repos/$REPO/actions/workflows/pages-exact-head-deploy-v3.yml/runs?event=workflow_dispatch&per_page=100")"
          equivalent="$(printf '%s' "$runs" | jq -r --arg sha "$head" '[.workflow_runs[] | select(.head_sha==$sha and (.status=="queued" or .status=="in_progress" or (.status=="completed" and .conclusion=="success")))] | length')"
          if [ "$equivalent" -gt 0 ]; then
            echo "CURRENT_HEAD_PUBLICATION_SUPPRESSED_EQUIVALENT_HEAD=$head count=$equivalent"
            exit 0
          fi
          gh api --method POST "/repos/$REPO/actions/workflows/pages-exact-head-deploy-v3.yml/dispatches" -f ref=main -f inputs[target_sha]="$head" -f inputs[surface_id]="$SURFACE_ID"
          echo "CURRENT_HEAD_PUBLICATION_DISPATCHED=$head:$SURFACE_ID"
