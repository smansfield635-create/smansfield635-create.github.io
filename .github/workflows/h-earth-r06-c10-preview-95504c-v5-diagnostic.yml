name: H-Earth R06-C10 Candidate Preview 95504c V5 Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h-earth-r06-c10-preview-95504c-v5-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: h-earth-r06-c10-preview-95504c-v5-diagnostic
  cancel-in-progress: false

jobs:
  diagnose-runtime:
    if: github.head_ref == 'publication/h-earth-r06-c10-preview-95504c-001'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_HEAD: 95504c9927922318225da1d61fa303cec70497f9
      PREVIEW_ROOT: preview/h-earth/r06-c10/95504c9927922318225da1d61fa303cec70497f9
      PREVIEW_URL_PATH: /preview/h-earth/r06-c10/95504c9927922318225da1d61fa303cec70497f9/index.html
      SOURCE_ENTRY: showroom/globe/h-earth/index.html
      V1_WORKFLOW: .github/workflows/h-earth-r06-c10-preview-95504c.yml
      PLAYWRIGHT_VERSION: 1.55.0
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: publication/h-earth-r06-c10-preview-95504c-001
          fetch-depth: 0
          path: publication

      - name: Check out exact terrain candidate
        uses: actions/checkout@v4
        with:
          ref: 95504c9927922318225da1d61fa303cec70497f9
          fetch-depth: 1
          path: source

      - name: Materialize exact closure with runtime-selected renderers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,textwrap
          from pathlib import Path
          workflow=Path(os.environ['GITHUB_WORKSPACE'])/'publication'/os.environ['V1_WORKFLOW']
          text=workflow.read_text()
          match=re.search(r"- name: Materialize exact self-contained environment preview.*?python3 - <<'PY'\n(.*?)\n          PY",text,re.S)
          if not match: raise RuntimeError('V1_MATERIALIZER_BLOCK_NOT_FOUND')
          code=textwrap.dedent(match.group(1))
          old='queue = [entry]'
          new="""queue = [
              entry,
              PurePosixPath('showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js'),
              PurePosixPath('showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-round1-1f520809.js'),
              PurePosixPath('showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.js')
          ]"""
          if old not in code: raise RuntimeError('V1_QUEUE_PATCH_TARGET_NOT_FOUND')
          exec(compile(code.replace(old,new,1),'r06-c10-preview-materializer-v5.py','exec'),{'__name__':'__main__'})
          PY

      - name: Install Chromium verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw" "$RUNNER_TEMP/proof"
          cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium

      - name: Capture runtime failure evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4188 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/publication" >"$RUNNER_TEMP/proof/server.log" 2>&1 &
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:4188$PREVIEW_URL_PATH" >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          cat > "$RUNNER_TEMP/pw/diagnose.mjs" <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import process from 'node:process';
          import { chromium } from 'playwright';
          const out=path.join(process.env.RUNNER_TEMP,'proof');
          const url=`http://127.0.0.1:4188${process.env.PREVIEW_URL_PATH}`;
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:412,height:915},deviceScaleFactor:2,isMobile:true,hasTouch:true});
          const page=await context.newPage();
          const consoleRecords=[],pageErrors=[],requestFailures=[],httpFailures=[];
          page.on('console',m=>consoleRecords.push({type:m.type(),text:m.text()}));
          page.on('pageerror',e=>pageErrors.push({name:e.name,message:e.message,stack:e.stack}));
          page.on('requestfailed',r=>requestFailures.push({url:r.url(),method:r.method(),failure:r.failure()}));
          page.on('response',r=>{if(r.status()>=400&&!r.url().endsWith('/favicon.ico'))httpFailures.push({url:r.url(),status:r.status()})});
          let navigationError=null;
          try{await page.goto(url,{waitUntil:'domcontentloaded',timeout:120000});}catch(e){navigationError={name:e.name,message:e.message,stack:e.stack};}
          await page.waitForTimeout(15000);
          const state=await page.evaluate(()=>{
            const canvas=document.getElementById('h-earth-functional-landscape-canvas');
            let canvasInfo=null;
            if(canvas){
              const rect=canvas.getBoundingClientRect();
              const gl=canvas.getContext('webgl2')||canvas.getContext('webgl');
              let pixels=null;
              if(gl&&canvas.width&&canvas.height){
                const sampleWidth=Math.min(canvas.width,256),sampleHeight=Math.min(canvas.height,256);
                const data=new Uint8Array(sampleWidth*sampleHeight*4);
                gl.readPixels(0,0,sampleWidth,sampleHeight,gl.RGBA,gl.UNSIGNED_BYTE,data);
                let visible=0,sum=0,max=0;
                for(let i=0;i<data.length;i+=4){const s=data[i]+data[i+1]+data[i+2];sum+=s;max=Math.max(max,s);if(s>18)visible++;}
                pixels={sampleWidth,sampleHeight,visiblePixelFraction:visible/(sampleWidth*sampleHeight),meanRgbSum:sum/(sampleWidth*sampleHeight),maximumRgbSum:max,glError:gl.getError()};
              }
              canvasInfo={width:canvas.width,height:canvas.height,clientWidth:rect.width,clientHeight:rect.height,hasWebGL:Boolean(gl),pixels};
            }
            return {
              href:location.href,
              readyState:document.readyState,
              title:document.title,
              canvas:canvasInfo,
              htmlDataset:{...document.documentElement.dataset},
              routeDataset:{...(document.getElementById('h-earth-functional-landscape-route')?.dataset??{})},
              startupReceipt:window.H_EARTH_RENDERER_STARTUP_DIAGNOSTICS?.getReceipt?.()??null,
              runtimeSnapshot:window.H_EARTH_RUNTIME_DIAGNOSTICS?.getSnapshot?.()??null,
              bindingReceipt:window.H_EARTH_RUN8E_R3D_LIVE_GPU_BINDING_RECEIPT??null,
              publicIntegrationReceipt:window.H_EARTH_RUN8E_R3E_PUBLIC_LIVE_GPU_INTEGRATION_RECEIPT??null,
              selectedRenderer:window.H_EARTH_CP2_SELECTED_RENDERER??null,
              resourceNames:performance.getEntriesByType('resource').map(r=>r.name),
              bodyText:document.body?.innerText?.slice(0,12000)??null
            };
          });
          const result={sourceHead:process.env.SOURCE_HEAD,url,navigationError,consoleRecords,pageErrors,requestFailures,httpFailures,state};
          fs.writeFileSync(path.join(out,'runtime-diagnostic.json'),JSON.stringify(result,null,2)+'\n');
          await page.screenshot({path:path.join(out,'runtime-diagnostic.png'),fullPage:true});
          await context.close(); await browser.close();
          console.log(JSON.stringify({navigationError,consoleErrors:consoleRecords.filter(x=>x.type==='error'),pageErrors,requestFailures,httpFailures,startupReceipt:state.startupReceipt,runtimeSnapshot:state.runtimeSnapshot,canvas:state.canvas},null,2));
          if(pageErrors.length||requestFailures.length||httpFailures.length||state.startupReceipt?.firstFailureStage||!state.canvas?.pixels||state.canvas.pixels.visiblePixelFraction<=.01)process.exit(1);
          JS
          cd "$RUNNER_TEMP/pw"
          node diagnose.mjs

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-r06-c10-preview-95504c-v5-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/proof
            publication/${{ env.PREVIEW_ROOT }}/byte-manifest.json
            publication/${{ env.PREVIEW_ROOT }}/publication-receipt.json
          if-no-files-found: warn
          retention-days: 30
