name: H-Earth C2-R1 Material-Only Binding Recovery

on:
  pull_request:
    branches:
      - integration/h-earth-c2-r1-baseline-001
    paths:
      - '.github/workflows/h-earth-c2-r1-complete-world-integration.yml'
      - '.github/workflows/h-earth-c2-r1-integrated-environment-coherence.yml'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/h-earth.c2-r1.allowed-path-manifest.json'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/identity.json'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/complete-world.js'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/complete-world-render-package.js'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.complete-world-integration.mjs'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/complete-world/h-earth.c2-r1.complete-world-source-custody.json'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/complete-world/h-earth.c2-r1.complete-world-operation-ledger.json'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/complete-world/h-earth.c2-r1.complete-world-role3-entry.json'
      - 'showroom/globe/h-earth/functional-landscape/public-live-gpu-integration.run8e-r3e.js'
      - 'showroom/globe/h-earth/render/live-render-package.run8e-r2.canonical.js'
  workflow_dispatch:
    inputs:
      expected_candidate_head:
        required: true
        type: string

permissions:
  contents: read

env:
  EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.expected_candidate_head }}
  STARTING_HEAD: 4f0491f00fae794ecdefbae36f4ee86c8a1bd21a
  ROLLBACK_BRANCH: rollback/h-earth-c2-r1-material-only-binding-start-001

jobs:
  material-only-static-construction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0

      - name: Verify exact head and rollback custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin "$ROLLBACK_BRANCH:refs/remotes/origin/$ROLLBACK_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$ROLLBACK_BRANCH")" = "$STARTING_HEAD"

      - name: Verify bounded twelve-path corridor
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/allowed-paths <<'PATHS'
          .github/workflows/h-earth-c2-r1-complete-world-integration.yml
          .github/workflows/h-earth-c2-r1-integrated-environment-coherence.yml
          h-earth-3d/control-plane/coastal-morphology/c2-r1/h-earth.c2-r1.allowed-path-manifest.json
          h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/identity.json
          h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/complete-world.js
          h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/complete-world-render-package.js
          h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.complete-world-integration.mjs
          h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/complete-world/h-earth.c2-r1.complete-world-source-custody.json
          h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/complete-world/h-earth.c2-r1.complete-world-operation-ledger.json
          h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/complete-world/h-earth.c2-r1.complete-world-role3-entry.json
          showroom/globe/h-earth/functional-landscape/public-live-gpu-integration.run8e-r3e.js
          showroom/globe/h-earth/render/live-render-package.run8e-r2.canonical.js
          PATHS
          sort -u /tmp/allowed-paths -o /tmp/allowed-paths
          git diff --name-only "$STARTING_HEAD...HEAD" | sort -u > /tmp/actual-paths
          test ! -s <(comm -23 /tmp/actual-paths /tmp/allowed-paths)
          test "$(wc -l < /tmp/allowed-paths)" -eq 12

      - name: Check syntax and JSON surfaces
        shell: bash
        run: |
          set -euo pipefail
          node --check h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/complete-world-render-package.js
          node --check h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.complete-world-integration.mjs
          node -e "JSON.parse(require('fs').readFileSync('h-earth-3d/control-plane/coastal-morphology/c2-r1/h-earth.c2-r1.allowed-path-manifest.json','utf8'))"

      - name: Generate and verify exact material-only cache v2
        shell: bash
        env:
          H_EARTH_MATERIAL_ONLY_CACHE_JSON_OUTPUT: ${{ runner.temp }}/material-only/complete-world-material-only-cache-v2.json
          H_EARTH_MATERIAL_ONLY_CACHE_GZIP_OUTPUT: ${{ runner.temp }}/material-only/complete-world-material-only-cache-v2.json.gz
          H_EARTH_MATERIAL_ONLY_CACHE_CARRIER_1_OUTPUT: ${{ runner.temp }}/material-only/cache-carrier-part-1.txt
          H_EARTH_MATERIAL_ONLY_CACHE_CARRIER_2_OUTPUT: ${{ runner.temp }}/material-only/cache-carrier-part-2.txt
          H_EARTH_MATERIAL_ONLY_STATIC_RECEIPT_OUTPUT: ${{ runner.temp }}/material-only/material-only-static-receipt.json
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/material-only"
          node h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.complete-world-integration.mjs \
            | tee "$RUNNER_TEMP/material-only/static-test.log"
          test -s "$H_EARTH_MATERIAL_ONLY_CACHE_JSON_OUTPUT"
          test -s "$H_EARTH_MATERIAL_ONLY_CACHE_GZIP_OUTPUT"
          test -s "$H_EARTH_MATERIAL_ONLY_CACHE_CARRIER_1_OUTPUT"
          test -s "$H_EARTH_MATERIAL_ONLY_CACHE_CARRIER_2_OUTPUT"
          test -s "$H_EARTH_MATERIAL_ONLY_STATIC_RECEIPT_OUTPUT"
          sha256sum "$RUNNER_TEMP/material-only"/* > "$RUNNER_TEMP/material-only/artifact-files.sha256"

      - name: Upload material-only cache and static receipt
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-c2-r1-material-only-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/material-only
          if-no-files-found: error
          retention-days: 30
