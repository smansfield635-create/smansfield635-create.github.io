name: Laws Desktop Disclosure Finalization

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/laws-desktop-disclosure-finalize.yml'
      - 'tools/finalize-laws-desktop-disclosure.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: laws-desktop-disclosure-finalization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  EXECUTION_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  finalize-desktop-disclosure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXECUTION_COMMIT }}
          fetch-depth: 0

      - name: Apply bounded desktop correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXECUTION_COMMIT"
          python3 tools/finalize-laws-desktop-disclosure.py
          git diff --check
          for protected in laws/index.controller.js laws/index.interactions.js laws/index.compositor.js laws/index.crystals.js laws/index.cosmos.js laws/index.planet.js laws/index.experience.css laws/index.html laws/index.experience.js; do
            git diff --quiet HEAD -- "$protected"
          done
          sha256sum laws/index.experience.polish.css

      - name: Commit product correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add laws/index.experience.polish.css
          git commit -m "Keep Laws Explore response adjacent on desktop"
          git push origin HEAD:agent/laws-experiential-architecture-restoration-001
