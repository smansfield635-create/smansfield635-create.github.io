name: Estate Laboratory Successor 005 Constructor

on:
  push:
    branches:
      - 'ESTATE_LABORATORY_NAVIGATION_RECONCILIATION_20260824_005'
    paths:
      - '.github/workflows/estate-laboratory-gen1.yml'

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact admitted branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Revalidate exact governing head
        shell: bash
        run: |
          set -euo pipefail
          BASE='57302a9b955475f57a14bcd80940eb89d55094d8'
          test "$GITHUB_REF_NAME" = 'ESTATE_LABORATORY_NAVIGATION_RECONCILIATION_20260824_005'
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main^{commit})" = "$BASE"
          test "$(git merge-base HEAD "$BASE")" = "$BASE"

      - name: Reapply inspected predecessor candidate bytes
        shell: bash
        run: |
          set -euo pipefail
          STALE='232d673faa0cb4df5bd6542fe57242371f8c9633'
          git cat-file -e "$STALE^{commit}"
          for p in \
            index.html \
            site-guide/index.html \
            instruments/index.html \
            instruments/laboratory.js \
            showroom/globe/audralia/disposition/index.html \
            showroom/globe/audralia/diagnostic/index.html \
            showroom/globe/h-earth/diagnostic/index.html \
            showroom/globe/hearth/diagnostic/index.html \
            tools/estate-laboratory-gen1-verify.mjs \
            tools/h-earth-experience-anchor-gate.mjs; do
            mkdir -p "$(dirname "$p")"
            git show "$STALE:$p" > "$p"
          done
          rm -f showroom/globe/audralia/disposition/laboratory.js

      - name: Patch Coherence Diagnostic from exact current-head bytes only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('coherence-diagnostic/index.html')
          s=p.read_text()
          old='''      <nav class="route-links" aria-label="Route links">
        <a href="/">Compass</a>
        <a href="/showroom/globe/">Mirrorland</a>
        <a href="/gauges/">Triple G</a>
      </nav>'''
          new='''      <nav class="route-links" aria-label="Route links">
        <a href="/">Compass</a>
        <a href="/showroom/globe/">Mirrorland</a>
        <a href="/instruments/" data-estate-laboratory-return>Estate Laboratory</a>
        <a href="/gauges/">Triple G</a>
      </nav>'''
          count=s.count(old)
          if count != 1:
              raise SystemExit(f'COHERENCE_DIAGNOSTIC_RETURN_PATCH_MATCH_COUNT:{count}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check -- coherence-diagnostic/index.html
          test "$(git diff --numstat -- coherence-diagnostic/index.html | awk '{print $1":"$2}')" = '1:0'

      - name: Install exact-head read-only browser qualifier
        shell: bash
        run: |
          set -euo pipefail
          STALE='232d673faa0cb4df5bd6542fe57242371f8c9633'
          git show "$STALE:.github/workflows/estate-laboratory-gen1.yml" > .github/workflows/estate-laboratory-gen1.yml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/estate-laboratory-gen1.yml')
          s=p.read_text()
          old='6419f78d2c048d51827bb6c631e557d83fe4f061'
          new='57302a9b955475f57a14bcd80940eb89d55094d8'
          count=s.count(old)
          if count < 1:
              raise SystemExit('FINAL_QUALIFIER_OLD_BASE_BINDING_NOT_FOUND')
          p.write_text(s.replace(old,new))
          PY
          grep -Fq 'name: Estate Laboratory Governed Observability Qualification' .github/workflows/estate-laboratory-gen1.yml
          grep -Fq 'contents: read' .github/workflows/estate-laboratory-gen1.yml
          ! grep -Fq 'contents: write' .github/workflows/estate-laboratory-gen1.yml
          grep -Fq '57302a9b955475f57a14bcd80940eb89d55094d8' .github/workflows/estate-laboratory-gen1.yml
          ! grep -Fq '6419f78d2c048d51827bb6c631e557d83fe4f061' .github/workflows/estate-laboratory-gen1.yml

      - name: Enforce admitted diff boundary
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(index.html|site-guide/index.html|instruments/index.html|instruments/laboratory.js|showroom/globe/audralia/disposition/index.html|showroom/globe/audralia/disposition/laboratory.js|showroom/globe/audralia/diagnostic/index.html|showroom/globe/h-earth/diagnostic/index.html|showroom/globe/hearth/diagnostic/index.html|coherence-diagnostic/index.html|tools/estate-laboratory-gen1-verify.mjs|tools/h-earth-experience-anchor-gate.mjs|\.github/workflows/estate-laboratory-gen1.yml)$'
          changed="$(git diff --name-only)"
          test -n "$changed"
          if printf '%s\n' "$changed" | grep -Ev "$allowed"; then
            echo 'ESTATE_LABORATORY_CONSTRUCTOR_OUT_OF_SCOPE_PATH' >&2
            exit 1
          fi
          for prohibited in showroom/globe/audralia/index.html showroom/globe/audralia/render.js showroom/globe/audralia/world_kernel.js evidence/readiness/governance-gen3-entitlement/evidence-identity.v1.json; do
            if printf '%s\n' "$changed" | grep -Fxq "$prohibited"; then
              echo "ESTATE_LABORATORY_CONSTRUCTOR_PROHIBITED_PATH:$prohibited" >&2
              exit 1
            fi
          done
          grep -Fq 'data-page="estate-laboratory"' instruments/index.html
          grep -Fq 'data-page="audralia-command-cockpit"' showroom/globe/audralia/disposition/index.html
          grep -Fq 'data-estate-laboratory-return' showroom/globe/audralia/diagnostic/index.html
          grep -Fq 'data-estate-laboratory-return' showroom/globe/h-earth/diagnostic/index.html
          grep -Fq 'data-estate-laboratory-return' showroom/globe/hearth/diagnostic/index.html
          grep -Fq 'data-estate-laboratory-return' coherence-diagnostic/index.html

      - name: Commit bounded candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            index.html \
            site-guide/index.html \
            instruments/index.html \
            instruments/laboratory.js \
            showroom/globe/audralia/disposition/index.html \
            showroom/globe/audralia/disposition/laboratory.js \
            showroom/globe/audralia/diagnostic/index.html \
            showroom/globe/h-earth/diagnostic/index.html \
            showroom/globe/hearth/diagnostic/index.html \
            coherence-diagnostic/index.html \
            tools/estate-laboratory-gen1-verify.mjs \
            tools/h-earth-experience-anchor-gate.mjs \
            .github/workflows/estate-laboratory-gen1.yml
          git commit -m 'Estate Laboratory: construct exact-head successor 005 candidate'
          git push origin "HEAD:$GITHUB_REF_NAME"
