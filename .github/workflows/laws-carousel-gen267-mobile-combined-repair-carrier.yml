name: Laws Carousel Gen267 Mobile Combined Repair Carrier
on:
  push:
    branches: ['agent/laws-carousel-gen267-mobile-legibility-repair']
    paths: ['.github/workflows/laws-carousel-gen267-mobile-combined-repair-carrier.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/laws-carousel-gen267-mobile-legibility-repair
      - name: Apply combined bounded mobile repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('laws/research/methods-and-models/carousel.css')
          s=p.read_text()
          needle='''    .mm-viewport { inset: 18.5rem 0 0; }\n    .mm-carousel__heading h2 { font-size: 1.8rem; }'''
          repl='''    .mm-viewport { inset: 18.5rem 0 0; }\n    .mm-card:not([data-active="true"]) .mm-card__top,\n    .mm-card:not([data-active="true"]) .mm-card__body { opacity: 0; }\n    .mm-card:not([data-active="true"]) .mm-card__surface { opacity: .24; filter: saturate(.58); }\n    .mm-carousel__heading h2 { font-size: 1.8rem; }'''
          if needle not in s: raise SystemExit('CORRECTED_PHONE_BLOCK_NOT_FOUND')
          if 'mm-card:not([data-active="true"]) .mm-card__top' in s: raise SystemExit('COMBINED_REPAIR_ALREADY_PRESENT')
          p.write_text(s.replace(needle,repl,1))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add laws/research/methods-and-models/carousel.css
          git commit -m 'complete Gen267 mobile legibility repair'
          git push origin HEAD:agent/laws-carousel-gen267-mobile-legibility-repair
