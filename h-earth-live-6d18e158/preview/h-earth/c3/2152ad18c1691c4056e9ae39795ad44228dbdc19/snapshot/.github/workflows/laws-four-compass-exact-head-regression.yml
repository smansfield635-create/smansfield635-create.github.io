name: Laws Four-Compass Exact-Head Regression

on:
  pull_request:
    branches:
      - main
    paths:
      - "laws/index.html"
      - "laws/index.controller.js"
      - "laws/index.interactions.js"
      - "laws/index.compositor.js"
      - "laws/index.cosmos.js"
      - "laws/index.crystals.js"
      - "laws/index.planet.js"
      - "laws/index.experience.js"
      - "laws/index.experience.css"
      - "laws/index.experience.polish.css"
      - "verification/benchmark-tools/four-compass-benchmark-v1/four-compass-benchmark.config.mjs"
      - "verification/benchmark-tools/four-compass-benchmark-v1/four-compass-browser-baseline.mjs"
      - ".github/workflows/laws-four-compass-exact-head-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laws-four-compass-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXECUTION_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
  EXECUTION_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  FOUR_COMPASS_ORIGIN: http://127.0.0.1:4173

jobs:
  four-compass-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact execution head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXECUTION_COMMIT }}

      - name: Verify exact checkout identity
        run: test "$(git rev-parse HEAD)" = "$EXECUTION_COMMIT"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install pinned browser driver
        run: npm install --no-save --no-package-lock puppeteer-core@24.15.0

      - name: Validate family benchmark source
        run: |
          node --check verification/benchmark-tools/four-compass-benchmark-v1/four-compass-benchmark.config.mjs
          node --check verification/benchmark-tools/four-compass-benchmark-v1/four-compass-browser-baseline.mjs

      - name: Verify current accepted Laws contract
        run: |
          grep -F 'data-laws-category-count="6"' laws/index.html
          grep -F 'data-laws-primary-star-count="4"' laws/index.html
          grep -F 'data-laws-test-method="four-member-reversible-admissibility-cluster"' laws/index.html
          grep -F 'data-laws-first-disclosure' laws/index.html
          grep -F 'const D=Object.freeze(["flow","integrity","reality","structure","test","research"])' laws/index.interactions.js
          grep -F 'singleActiveOuterAuthorityLabel:true' laws/index.interactions.js
          grep -F 'primary-only-star-center-protected-tab' laws/index.interactions.js

      - name: Start exact-head static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/laws-four-compass-server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/laws/ >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/laws-four-compass-server.log
          exit 1

      - name: Execute exact-head Four-Compass regression
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node verification/benchmark-tools/four-compass-benchmark-v1/four-compass-browser-baseline.mjs

      - name: Validate family and classify superseded Laws assertions
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const compass = JSON.parse(fs.readFileSync('four-compass-benchmark-tool-baseline.json', 'utf8'));
          const auxiliary = JSON.parse(fs.readFileSync('website-home-receiver-control-baseline.json', 'utf8'));
          const failures = [];
          if (compass.status !== 'PASS_BOUNDED_LANE_BASELINE' || compass.summaries.length !== 4) failures.push('compass_lane');
          if (auxiliary.status !== 'PASS_BOUNDED_LANE_BASELINE' || auxiliary.summaries.length !== 1) failures.push('auxiliary_lane');
          if (compass.execution.commit !== process.env.EXECUTION_COMMIT) failures.push('commit');
          const laws = compass.summaries.find(item => item.authorityId === 'LAWS_COMPASS');
          if (!laws || laws.executedProfileCount !== 2) failures.push('laws_execution');

          const superseded = new Set([
            'LAWS_FIRST_TEST_METHOD_INVALID',
            'LAWS_CATEGORY_LABEL_CONFORMANCE_FAILED'
          ]);
          const lawsFindings = compass.findings.filter(item => item.authorityId === 'LAWS_COMPASS' && String(item.id || '').startsWith('LAWS_'));
          const material = lawsFindings.filter(item => !superseded.has(item.id));
          const classified = lawsFindings.filter(item => superseded.has(item.id));
          console.log(JSON.stringify({
            currentContract: 'SIX_AUTHORITY_SINGLE_ACTIVE_OUTER_LABEL',
            classifiedSupersededFindings: classified.map(item => item.id),
            materialFindings: material.map(item => item.id)
          }, null, 2));
          if (material.length) failures.push(`laws_findings:${material.map(item => item.id).join('|')}`);
          if (failures.length) throw new Error(`LAWS_FOUR_COMPASS_REGRESSION_FAILED:${failures.join(',')}`);
          NODE

      - name: Upload exact-head regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laws-four-compass-exact-head-regression-evidence
          path: |
            four-compass-benchmark-tool-baseline.json
            website-home-receiver-control-baseline.json
            four-compass-benchmark-tool-screenshots/**
            website-home-receiver-control-screenshots/**
            /tmp/laws-four-compass-server.log
          if-no-files-found: warn
          retention-days: 30
