name: Main Compass Round 002 Apply

on:
  push:
    branches:
      - agent/main-compass-architecture-context-round-002

permissions:
  contents: write

jobs:
  apply-two-file-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out task branch
        uses: actions/checkout@v4
        with:
          ref: agent/main-compass-architecture-context-round-002
          fetch-depth: 0

      - name: Apply deterministic HTML and CSS correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re

          html_path = Path('index.html')
          css_path = Path('assets/compass/compass.css')
          workflow_path = Path('.github/workflows/main-compass-round-002-apply.yml')

          html = html_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')
          original_html = html
          original_css = css

          protected_pattern = re.compile(
              r'<style id="dgb-main-compass-label-cosmos-v1">.*?</style>',
              re.S,
          )
          protected_before = protected_pattern.search(original_html)
          assert protected_before, 'protected inline cosmos region not found'
          protected_before = protected_before.group(0)

          old_cache = 'dgb-main-compass-shell-context-round-001-v1'
          new_cache = 'dgb-main-compass-architecture-context-round-002-v1'
          assert html.count(old_cache) >= 2, 'expected shell cache identity missing'
          html = html.replace(
              '/assets/compass/compass.css?v=' + old_cache,
              '/assets/compass/compass.css?v=' + new_cache,
              1,
          )

          practical_pattern = re.compile(
              r'''      <section\n        class="compass-practical-context"\n        aria-labelledby="compass-practical-context-title"\n      >.*?      </section>\n''',
              re.S,
          )
          practical_replacement = '''      <details
        class="compass-practical-context"
        aria-labelledby="compass-practical-context-title"
      >
        <summary class="compass-practical-context__summary">
          <span class="compass-estate__kicker">
            Practical Mathematical Context
          </span>

          <span
            id="compass-practical-context-title"
            class="compass-practical-context__title"
          >
            Notice the pressure before it becomes a crisis.
          </span>
        </summary>

        <div class="compass-practical-context__body">
          <p class="compass-practical-context__lead">
            The mathematics begins with experiences people already recognize: carrying too much, losing support, compensating for what is missing, and continuing to function while strength is running out.
          </p>

          <p class="compass-practical-context__bridge">
            People do not always arrive with the same kind of question. Sometimes the clearest next step is to understand an experience through story. Sometimes it is to build or test what does not yet exist. Sometimes it is to use a practical system or instrument. Sometimes it is to examine the laws and boundaries shaping the situation.
          </p>

          <div
            class="compass-practical-context__routes"
            aria-label="Four ways to explore the estate"
          >
            <article data-estate-route-context="narrative">
              <h3>Narrative</h3>
              <p>
                Follow a question through story, character, dialogue, and consequence when lived experience needs room to unfold.
              </p>
            </article>

            <article data-estate-route-context="frontier">
              <h3>Frontier</h3>
              <p>
                Move into experiments, prototypes, and construction when the responsibility is to discover or build what comes next.
              </p>
            </article>

            <article data-estate-route-context="product">
              <h3>Product</h3>
              <p>
                Use dedicated tools, systems, and models when the question needs a practical application or operational surface.
              </p>
            </article>

            <article data-estate-route-context="laws">
              <h3>Laws</h3>
              <p>
                Examine governing principles, boundaries, and recurring relationships when the question needs structure and disciplined interpretation.
              </p>
            </article>
          </div>

          <p class="compass-practical-context__orientation">
            The Compass keeps these paths connected without turning them into one path. Use it when you want orientation before choosing where to enter.
          </p>

          <p class="compass-practical-context__definition">
            <strong>On this page, coherence means:</strong>
            The important parts of life are working together instead of constantly working against one another.
          </p>
        </div>
      </details>
'''
          html, count = practical_pattern.subn(practical_replacement, html, count=1)
          assert count == 1, f'practical context replacement count: {count}'

          supporting_pattern = re.compile(
              r'''      <section\n        class="compass-supporting-entry"\n        aria-labelledby="compass-supporting-entry-title"\n      >.*?      </section>\n''',
              re.S,
          )
          supporting_replacement = '''      <section
        class="compass-supporting-entry"
        aria-labelledby="compass-supporting-entry-title"
      >
        <p class="compass-estate__kicker">
          Supporting Entry Points
        </p>

        <h2 id="compass-supporting-entry-title">
          Another way to begin.
        </h2>

        <p>
          Use the Compass when you want orientation across the estate. Use a direct destination when you already know the kind of path you need, or choose a guided aid when measurement or conversation would help.
        </p>

        <div class="compass-supporting-entry__group">
          <h3 class="compass-supporting-entry__group-title">
            Direct destinations
          </h3>

          <nav
            class="compass-route-deck"
            aria-label="Direct estate destinations"
          >
            <a class="compass-route-card" href="/characters/">
              <span class="compass-route-card__label">Narrative</span>
              <span class="compass-route-card__purpose">
                Enter through character, story, dialogue, and the consequences of lived choices.
              </span>
              <span class="compass-route-card__action">Enter Narrative</span>
            </a>

            <a class="compass-route-card" href="/explore/frontier/">
              <span class="compass-route-card__label">Frontier</span>
              <span class="compass-route-card__purpose">
                Explore prototypes, energy, water, infrastructure, and future-facing construction.
              </span>
              <span class="compass-route-card__action">Enter Frontier</span>
            </a>

            <a class="compass-route-card" href="/products/">
              <span class="compass-route-card__label">Product</span>
              <span class="compass-route-card__purpose">
                Open the estate’s dedicated systems, tools, models, and practical applications.
              </span>
              <span class="compass-route-card__action">Explore Products</span>
            </a>

            <a class="compass-route-card" href="/laws/">
              <span class="compass-route-card__label">Laws</span>
              <span class="compass-route-card__purpose">
                Study the principles, boundaries, standards, and recurring relationships that govern the work.
              </span>
              <span class="compass-route-card__action">Explore Laws</span>
            </a>
          </nav>
        </div>

        <div class="compass-supporting-entry__group">
          <h3 class="compass-supporting-entry__group-title">
            Guided aids
          </h3>

          <nav
            class="compass-value-deck"
            aria-label="Guided estate entry aids"
          >
            <a
              class="compass-value-card"
              href="/coherence-diagnostic/"
              data-capability-id="coherence-diagnostic"
              data-capability-class="assessment-instrument"
            >
              <span class="compass-value-card__eyebrow">
                Assessment Instrument
              </span>

              <span class="compass-value-card__label">
                Coherence Diagnostic
              </span>

              <span class="compass-value-card__purpose">
                Inspect recurring patterns through a structured diagnostic surface. Use it when measurement can clarify what repeated experience alone has not resolved.
              </span>

              <span class="compass-value-card__action">
                Run the diagnostic
              </span>
            </a>

            <a
              class="compass-value-card"
              href="/showroom/globe/hearth/jeeves/"
              data-capability-id="talk-to-the-house"
              data-capability-class="estate-intelligence"
            >
              <span class="compass-value-card__eyebrow">
                Estate Intelligence
              </span>

              <span class="compass-value-card__label">
                Talk to the House
              </span>

              <span class="compass-value-card__purpose">
                Ask where to begin, what a room contains, or which direction may fit the question you are carrying.
              </span>

              <span class="compass-value-card__action">
                Ask the guide
              </span>
            </a>
          </nav>
        </div>
      </section>
'''
          html, count = supporting_pattern.subn(supporting_replacement, html, count=1)
          assert count == 1, f'supporting entry replacement count: {count}'

          def renew_formula(source, *, opening_class, aria_label, modifier, practical_copy):
              pattern = re.compile(
                  rf'''(?P<open><details class="{re.escape(opening_class)}">)\s*'''
                  rf'''<p class="compass-formula-artifact__entry">.*?</p>\s*'''
                  rf'''<summary aria-label="{re.escape(aria_label)}">\s*'''
                  rf'''(?P<title><span class="compass-formula-artifact__title">.*?</span>)\s*'''
                  rf'''(?P<math><span class="compass-formula-artifact__math">.*?</span>)\s*'''
                  rf'''</summary>''',
                  re.S,
              )

              def replace(match):
                  opening = match.group('open').replace(
                      '">',
                      f' {modifier}">',
                      1,
                  )
                  title = match.group('title')
                  math = match.group('math')
                  return f'''{opening}
          <summary aria-label="{aria_label}">
            <span class="compass-formula-artifact__practical-summary">
              {practical_copy}
            </span>

            <span class="compass-formula-artifact__engineering-summary">
              {title}

              {math}
            </span>
          </summary>'''

              result, replacement_count = pattern.subn(replace, source, count=1)
              assert replacement_count == 1, (
                  f'formula replacement failed for {aria_label}: {replacement_count}'
              )
              return result

          html = renew_formula(
              html,
              opening_class='compass-formula-artifact compass-formula-artifact--primary',
              aria_label='Expand the collapse predicate',
              modifier='compass-formula-artifact--collapse',
              practical_copy=(
                  'Things often start breaking down before anyone calls the situation a crisis. '
                  'When one required part fails, strength elsewhere cannot erase the failure.'
              ),
          )
          html = renew_formula(
              html,
              opening_class='compass-formula-artifact compass-formula-artifact--stacked',
              aria_label='Expand the pressure capacity ratio',
              modifier='compass-formula-artifact--pcr',
              practical_copy=(
                  'You can keep getting everything done and still be running out of strength. '
                  'Pressure becomes dangerous when what is being carried grows beyond what can responsibly support it.'
              ),
          )
          html = renew_formula(
              html,
              opening_class='compass-formula-artifact compass-formula-artifact--stacked',
              aria_label='Expand the stability and collapse pressure split',
              modifier='compass-formula-artifact--split',
              practical_copy=(
                  'You can be strong and still need support. '
                  'As pressure rises, stability can remain visible while the share of danger also grows.'
              ),
          )

          css_marker = '/* Main Compass architecture and context round 002 */'
          assert css_marker not in css, 'round 002 CSS marker already present'
          css_addition = r'''

/* Main Compass architecture and context round 002 */
/* HTML/CSS-only correction. No scene, controller, renderer, route, or gesture ownership. */

.compass-practical-context {
  padding: 0;
  overflow: hidden;
}

.compass-practical-context > summary {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px 18px;
  min-height: 92px;
  padding: clamp(17px, 2.3vw, 24px) clamp(18px, 2.6vw, 28px);
  cursor: pointer;
  list-style: none;
}

.compass-practical-context > summary::-webkit-details-marker {
  display: none;
}

.compass-practical-context > summary::after {
  content: "+";
  display: inline-grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border: 1px solid rgba(243, 217, 139, 0.34);
  border-radius: 999px;
  color: var(--compass-gold-hot);
  background: rgba(7, 10, 16, 0.88);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  font-size: 1rem;
  font-weight: 800;
}

.compass-practical-context[open] > summary::after {
  content: "–";
}

.compass-practical-context__summary .compass-estate__kicker {
  grid-column: 1;
  margin-bottom: 0;
}

.compass-practical-context__title {
  grid-column: 1;
  color: rgba(255, 248, 224, 0.98);
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(1.35rem, 3vw, 2.35rem);
  font-weight: 700;
  line-height: 1.05;
  letter-spacing: -0.028em;
}

.compass-practical-context__body {
  position: relative;
  z-index: 1;
  display: grid;
  gap: 16px;
  padding: 0 clamp(18px, 2.6vw, 28px) clamp(19px, 2.7vw, 30px);
  border-top: 1px solid rgba(225, 218, 198, 0.10);
}

.compass-practical-context__body > p {
  max-width: 78ch;
  margin: 0;
  color: var(--compass-text-secondary);
  line-height: 1.62;
}

.compass-practical-context__lead {
  padding-top: 18px;
}

.compass-practical-context__bridge,
.compass-practical-context__orientation {
  color: var(--compass-text-primary) !important;
}

.compass-practical-context__routes {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.compass-practical-context__routes article {
  min-width: 0;
  padding: 15px 16px;
  border: 1px solid rgba(225, 218, 198, 0.12);
  border-radius: 15px;
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0.038), rgba(124, 220, 255, 0.018)),
    rgba(4, 7, 12, 0.88);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.045),
    0 10px 26px rgba(0, 0, 0, 0.18);
}

.compass-practical-context__routes h3 {
  margin: 0 0 7px;
  color: var(--compass-gold-hot);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1.05rem;
  letter-spacing: -0.012em;
}

.compass-practical-context__routes p {
  margin: 0;
  color: var(--compass-text-secondary);
  font-size: 0.94rem;
  line-height: 1.52;
}

.compass-supporting-entry__group {
  position: relative;
  z-index: 1;
  margin-top: 20px;
}

.compass-supporting-entry__group-title {
  margin: 0 0 11px;
  color: rgba(243, 217, 139, 0.94);
  font-size: 0.74rem;
  font-weight: 900;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.compass-route-deck {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 11px;
}

.compass-route-card {
  position: relative;
  display: grid;
  align-content: start;
  gap: 8px;
  min-width: 0;
  min-height: 150px;
  padding: 17px 18px;
  border: 1px solid rgba(124, 220, 255, 0.23);
  border-radius: 17px;
  color: inherit;
  background:
    linear-gradient(145deg, rgba(255, 255, 255, 0.055), transparent 28%),
    linear-gradient(155deg, rgba(14, 24, 36, 0.96), rgba(5, 8, 14, 0.98));
  box-shadow:
    0 14px 34px rgba(0, 0, 0, 0.26),
    inset 0 1px 0 rgba(255, 255, 255, 0.08);
  transition:
    transform 180ms var(--compass-ease),
    border-color 180ms var(--compass-ease),
    box-shadow 180ms var(--compass-ease);
}

.compass-route-card:hover,
.compass-route-card:focus-visible {
  transform: translateY(-2px);
  border-color: rgba(243, 217, 139, 0.46);
  box-shadow:
    0 18px 42px rgba(0, 0, 0, 0.31),
    0 0 24px rgba(124, 220, 255, 0.08),
    inset 0 1px 0 rgba(255, 255, 255, 0.10);
}

.compass-route-card__label {
  color: rgba(255, 248, 224, 0.98);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1.12rem;
  font-weight: 800;
}

.compass-route-card__purpose {
  color: var(--compass-text-secondary);
  font-size: 0.91rem;
  line-height: 1.48;
}

.compass-route-card__action {
  align-self: end;
  margin-top: auto;
  color: var(--compass-gold-hot);
  font-size: 0.70rem;
  font-weight: 900;
  letter-spacing: 0.10em;
  text-transform: uppercase;
}

.compass-formula-artifact > summary {
  grid-template-columns: minmax(0, 1.12fr) minmax(290px, 0.88fr);
  align-items: center;
  column-gap: clamp(16px, 2.5vw, 28px);
  row-gap: 10px;
}

.compass-formula-artifact__practical-summary {
  grid-column: 1;
  grid-row: 1 / span 2;
  color: var(--compass-text-primary);
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(1.08rem, 1.8vw, 1.34rem);
  font-weight: 700;
  line-height: 1.45;
}

.compass-formula-artifact__engineering-summary {
  grid-column: 2;
  display: grid;
  gap: 8px;
  min-width: 0;
}

.compass-formula-artifact > summary::after {
  grid-column: 2;
  justify-self: start;
}

.compass-formula-artifact__engineering-summary .compass-formula-artifact__math {
  width: 100%;
}

.compass-formula-artifact--pcr .compass-formula-artifact__math {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px 16px;
  align-items: center;
  line-height: 1.45;
}

.compass-formula-artifact--split .compass-formula-artifact__math {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px 12px;
  align-items: center;
  line-height: 1.45;
}

.compass-formula-artifact--pcr .formula-line,
.compass-formula-artifact--split .formula-line {
  display: flex;
  align-items: baseline;
  justify-content: center;
  min-width: 0;
  margin-top: 0 !important;
  white-space: nowrap;
}

@media (max-width: 900px) {
  .compass-route-deck {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .compass-formula-artifact > summary {
    grid-template-columns: minmax(0, 1fr) minmax(250px, 0.9fr);
  }
}

@media (max-width: 700px) {
  .compass-practical-context__routes,
  .compass-route-deck {
    grid-template-columns: 1fr;
  }

  .compass-route-card {
    min-height: 0;
  }

  .compass-formula-artifact > summary {
    grid-template-columns: 1fr;
  }

  .compass-formula-artifact__practical-summary,
  .compass-formula-artifact__engineering-summary,
  .compass-formula-artifact > summary::after {
    grid-column: 1;
    grid-row: auto;
  }

  .compass-formula-artifact__engineering-summary {
    padding-top: 3px;
  }

  .compass-formula-artifact--split .compass-formula-artifact__math {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .compass-formula-artifact--split .formula-line:last-child {
    grid-column: 1 / -1;
  }
}

@media (max-width: 560px) {
  .compass-practical-context > summary {
    min-height: 80px;
    padding: 15px 16px;
  }

  .compass-practical-context__body {
    padding: 0 16px 17px;
  }

  .compass-formula-artifact--pcr .compass-formula-artifact__math,
  .compass-formula-artifact--split .compass-formula-artifact__math {
    grid-template-columns: 1fr;
  }

  .compass-formula-artifact--split .formula-line:last-child {
    grid-column: auto;
  }

  .compass-formula-artifact--pcr .formula-line,
  .compass-formula-artifact--split .formula-line {
    white-space: normal;
  }
}
'''
          css += css_addition

          protected_after = protected_pattern.search(html)
          assert protected_after, 'protected inline cosmos region missing after update'
          assert protected_after.group(0) == protected_before, (
              'protected inline cosmos region changed'
          )

          required_routes = (
              'href="/characters/"',
              'href="/explore/frontier/"',
              'href="/products/"',
              'href="/laws/"',
          )
          for route in required_routes:
              assert route in html, f'missing direct route: {route}'

          required_formula_fragments = (
              '<i>CollapseQualified</i><sub>d</sub> =',
              'Π = <i>G</i> · <i>X</i>',
              '<i>K</i><sub>used</sub> = max(<i>K</i>, ε<sub>K</sub>)',
              '<i>PCR</i> = Π / <i>K</i><sub>used</sub>',
              '<i>S</i>* = 1 / (1 + <i>PCR</i>)',
              '<i>H</i>* = <i>PCR</i> / (1 + <i>PCR</i>)',
              '<i>S</i>* + <i>H</i>* = 1',
          )
          for formula in required_formula_fragments:
              assert formula in html, f'missing formula fragment: {formula}'

          assert '<details\n        class="compass-practical-context"' in html
          assert '<details\n        class="compass-practical-context"\n        aria-labelledby="compass-practical-context-title"\n        open' not in html
          assert html.count('compass-formula-artifact__practical-summary') == 3
          assert html.count('compass-formula-artifact__engineering-summary') == 3
          assert css_marker in css
          assert new_cache in html
          assert '/assets/compass/compass.controller.js?v=' + old_cache in html

          class Parser(HTMLParser):
              pass

          Parser().feed(html)
          assert css.count('{') == css.count('}'), 'CSS brace imbalance'

          html_path.write_text(html, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')

          changed = {str(html_path), str(css_path), str(workflow_path)}
          assert original_html != html, 'HTML did not change'
          assert original_css != css, 'CSS did not change'
          print('ROUND_002_SPEC_LOCK=PASS')
          print('ROUND_002_HTML_CONSTRUCTION=PASS')
          print('ROUND_002_CSS_CONSTRUCTION=PASS')
          print('ROUND_002_PROTECTED_INLINE_REGION=PASS')
          print('ROUND_002_FORMULAS_PRESERVED=PASS')
          print('ROUND_002_DIRECT_ROUTES=PASS')
          PY

      - name: Remove temporary workflow and validate bounded diff
        shell: bash
        run: |
          rm .github/workflows/main-compass-round-002-apply.yml
          git diff --check
          mapfile -t paths < <(git diff --name-only | sort)
          expected=(
            ".github/workflows/main-compass-round-002-apply.yml"
            "assets/compass/compass.css"
            "index.html"
          )
          if [[ "${paths[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected paths:\n%s\n' "${paths[*]}"
            exit 1
          fi

      - name: Commit clean two-file candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/compass/compass.css .github/workflows/main-compass-round-002-apply.yml
          git commit -m "Apply Main Compass architecture and context round 002 [round-002-applied]"
          git push origin HEAD:agent/main-compass-architecture-context-round-002
