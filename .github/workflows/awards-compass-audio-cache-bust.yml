name: Awards Compass audio cache bust
on:
  push:
    branches:
      - agent/awards-compass-audio-cache-bust-20260815
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force repaired Compass asset URL
        shell: bash
        run: |
          set -euo pipefail
          FILE="showroom/globe/h-earth/awards/index.html"
          OLD="media/diamond-gate-compass-mirrorland-36s.mp4"
          NEW="media/diamond-gate-compass-mirrorland-36s.mp4?v=audio-v2-d3273b79"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('showroom/globe/h-earth/awards/index.html')
          s=p.read_text()
          old='media/diamond-gate-compass-mirrorland-36s.mp4'
          new='media/diamond-gate-compass-mirrorland-36s.mp4?v=audio-v2-d3273b79'
          n=s.count(old)
          assert n == 1, f'expected one Compass media reference, found {n}'
          p.write_text(s.replace(old,new,1))
          PY
          grep -Fq "$NEW" "$FILE"
          git diff --check
          git diff --name-only
          test "$(git diff --name-only)" = "$FILE"
      - name: Commit cache-busted page reference and retire builder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "smansfield635-create"
          git config user.email "smansfield635@gmail.com"
          rm .github/workflows/awards-compass-audio-cache-bust.yml
          git add showroom/globe/h-earth/awards/index.html .github/workflows/awards-compass-audio-cache-bust.yml
          git commit -m "Force repaired Compass reel asset refresh"
          git push origin HEAD
