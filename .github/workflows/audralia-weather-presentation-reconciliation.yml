name: Audralia Weather Presentation Reconciliation

on:
  pull_request:
    paths:
      - 'showroom/globe/audralia/weather-presentation-reconciliation/**'
      - '.github/workflows/audralia-weather-presentation-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-reconciliation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate module syntax
        run: |
          node --check showroom/globe/audralia/weather-presentation-reconciliation/exterior-classification.mjs
          node --check showroom/globe/audralia/weather-presentation-reconciliation/clear-atmosphere.mjs
          node --check showroom/globe/audralia/weather-presentation-reconciliation/exterior-weather.mjs
          node --check showroom/globe/audralia/weather-presentation-reconciliation/app.mjs
      - name: Verify reconciliation prohibitions
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {EXTERIOR_COMPONENT_CLASSIFICATION,RECONCILIATION_INVARIANTS} from './showroom/globe/audralia/weather-presentation-reconciliation/exterior-classification.mjs';
          assert.equal(RECONCILIATION_INVARIANTS.cameraSemanticsMutated,false);
          assert.equal(RECONCILIATION_INVARIANTS.zoomSemanticsMutated,false);
          assert.equal(RECONCILIATION_INVARIANTS.travelSemanticsMutated,false);
          assert.equal(RECONCILIATION_INVARIANTS.oldNearFieldOcclusionMayBeInherited,false);
          assert.equal(RECONCILIATION_INVARIANTS.terrainClearanceMayRender,false);
          const exterior=EXTERIOR_COMPONENT_CLASSIFICATION.find(x=>x.id==='EVOLVING_GLOBAL_CLOUD_SUPPORT');
          const bounded=EXTERIOR_COMPONENT_CLASSIFICATION.find(x=>x.id==='CANONICAL_BOUNDED_WEATHER_OBJECTS');
          assert.equal(exterior.nearFieldOcclusionAuthority,false);
          assert.equal(bounded.nearFieldOcclusionAuthority,true);
          console.log(JSON.stringify({pass:true,classifications:EXTERIOR_COMPONENT_CLASSIFICATION},null,2));
          NODE

  exact-page-runtime-reconciliation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Install browser driver
        run: npm install --no-save --no-package-lock puppeteer-core@24.15.0
      - name: Start exact-head server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/audralia-reconciliation-server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/showroom/globe/audralia/weather-presentation-reconciliation/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/audralia-reconciliation-server.log
          exit 1
      - name: Execute reconciliation page
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:'new',args:['--no-sandbox','--disable-setuid-sandbox','--ignore-gpu-blocklist','--enable-webgl','--use-gl=angle','--use-angle=swiftshader']});
            const page=await browser.newPage();await page.setViewport({width:720,height:1280,deviceScaleFactor:1});
            const pageErrors=[],consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e?.stack||e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text());});
            await page.goto('http://127.0.0.1:4173/showroom/globe/audralia/weather-presentation-reconciliation/',{waitUntil:'domcontentloaded',timeout:60000});
            let ready=false;
            try{
              await page.waitForFunction(()=>window.__AUDRALIA_WEATHER_PRESENTATION_RECONCILIATION__?.getRuntime()?.invariants?.pass===true,{timeout:30000});
              ready=true;
            }catch(error){
              const diagnostic=await page.evaluate(()=>({
                statusText:document.querySelector('[data-h-earth-status]')?.textContent?.trim()||null,
                status:document.querySelector('[data-h-earth-status]')?.dataset?.status||null,
                loaderStage:document.querySelector('[data-audralia-loader-stage]')?.textContent?.trim()||null,
                reconciliationPresent:Boolean(window.__AUDRALIA_WEATHER_PRESENTATION_RECONCILIATION__),
                runtimePresent:Boolean(window.__AUDRALIA_WEATHER_PRESENTATION_RECONCILIATION__?.getRuntime?.()),
                previewError:window.__H_EARTH_AUDRALIA_OPEN_WORLD_OW01_PREVIEW_ERROR__||null,
                celestialError:window.__AUDRALIA_CELESTIAL_CONTEXT_ERROR__||null
              }));
              console.error('RECONCILIATION_BOOT_DIAGNOSTIC',JSON.stringify({diagnostic,pageErrors,consoleErrors,waitError:String(error)},null,2));
            }
            if(!ready){await browser.close();process.exit(1);}
            await page.waitForFunction(()=>window.__AUDRALIA_CELESTIAL_STATE__?.getSolarVector,{timeout:30000});
            const result=await page.evaluate(()=>{
              const proof=window.__AUDRALIA_WEATHER_PRESENTATION_RECONCILIATION__;
              const ids0=proof.canonicalObjects.map(x=>x.ID_i);
              const local=proof.setCameraStateForTest({distance:720});
              const localCutoff=Number(proof.exterior.overlay.dataset.nearCutoff||0);
              const skyAltitude=Number(proof.sky.overlay.dataset.cameraAltitude||0);
              const ids1=proof.canonicalObjects.map(x=>x.ID_i);
              const planetary=proof.setCameraStateForTest({distance:5000});
              const planetaryCutoff=Number(proof.exterior.overlay.dataset.nearCutoff||-1);
              const ids2=proof.canonicalObjects.map(x=>x.ID_i);
              proof.setCameraStateForTest({distance:720});
              return {
                schema:proof.schema,
                cameraSemanticsMutated:proof.cameraSemanticsMutated,
                zoomSemanticsMutated:proof.zoomSemanticsMutated,
                travelSemanticsMutated:proof.travelSemanticsMutated,
                localPass:local.invariants.pass,
                planetaryPass:planetary.invariants.pass,
                localCutoff,planetaryCutoff,skyAltitude,
                idsStable:JSON.stringify(ids0)===JSON.stringify(ids1)&&JSON.stringify(ids1)===JSON.stringify(ids2),
                localActive:local.spatial.activeLocalCount,
                localCap:local.spatial.maxLocalCount,
                skyEvidence:proof.sky.getEvidence(),
                exteriorEvidence:proof.exterior.getEvidence(),
                celestial:Boolean(window.__AUDRALIA_CELESTIAL_STATE__?.getSolarVector),
                status:document.querySelector('[data-h-earth-status]')?.dataset?.status||null
              };
            });
            console.log(JSON.stringify({result,pageErrors,consoleErrors},null,2));
            const failed=pageErrors.length||!result.localPass||!result.planetaryPass||!result.idsStable||result.localActive>result.localCap||result.cameraSemanticsMutated||result.zoomSemanticsMutated||result.travelSemanticsMutated||result.localCutoff<500||result.planetaryCutoff!==0||result.skyEvidence.nearTerrainVeil!==false||result.exteriorEvidence.nearFieldExtinctionAuthority!==false||!result.celestial||!String(result.status).includes('USER_REVIEW_REQUIRED');
            await browser.close();if(failed)process.exit(1);
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
