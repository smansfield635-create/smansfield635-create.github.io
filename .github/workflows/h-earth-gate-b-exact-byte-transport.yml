name: H-Earth Packet 002 Bounded Correction
on:
  pull_request:
  pull_request_review:
    types: [submitted]
permissions:
  contents: write
  issues: read
jobs:
  correct-audit-install:
    if: github.event.pull_request.head.ref == 'agent/h-earth-gate-b-phase-a-successor-001'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: agent/h-earth-gate-b-phase-a-successor-001
      TARGET_PATH: h-earth-3d/integration/h-earth.post-west-admitted-geometry-transfer.js
      EXPECTED_BASE_BLOB: 2bcb67ebf84f36248475921c85e75236a1115102
      SOURCE_COMMENT_IDS: 5059696536,5059713725,5059717709
      MATRIX_COMMENT_ID: 5060174689
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/h-earth-gate-b-phase-a-successor-001
          fetch-depth: 0

      - name: Reconstruct audited candidate and apply bounded correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$TARGET_PATH")" = "$EXPECTED_BASE_BLOB"
          mkdir -p "$RUNNER_TEMP/packet-002-correction"
          python - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, urllib.request

          def comment_body(comment_id):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/comments/{comment_id}",
                  headers={
                      'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28'
                  }
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)['body']

          ids = [int(value) for value in os.environ['SOURCE_COMMENT_IDS'].split(',')]
          lengths = [7000, 7000, 180]
          hashes = [
              '38d0c10cd020c991082655487f27185b2efb56a726562640a07440d8501e51d7',
              'f3037a6fad7128f5e0a5ac6034aaf33ce9920625e7e256bb013ea70dc01603b2',
              'a85b34c42ab9535c1a01530dcafa04734323f8daed056b231f2839a80f8177ea'
          ]
          pieces = []
          for index, comment_id in enumerate(ids, 1):
              body = comment_body(comment_id)
              prefix = f'H_EARTH_SHARED_PACKET_002_SUCCESSOR_GZIP_PART_{index:02d}_OF_03\n'
              assert body.startswith(prefix)
              payload = body[len(prefix):].strip()
              assert len(payload) == lengths[index - 1]
              assert hashlib.sha256(payload.encode()).hexdigest() == hashes[index - 1]
              pieces.append(payload)

          raw = gzip.decompress(base64.b64decode(''.join(pieces), validate=True))
          assert len(raw) == 63412
          assert hashlib.sha256(raw).hexdigest() == '58e1f0100019a64d870837b69882f59d0fd5c6a522cc5abebb56e97a7179de0a'
          text = raw.decode('utf-8')
          old = """  issues.push(...toleranceValidation.issues);

  if (
    modeEvaluation.transferMode ===
"""
          new = """  issues.push(...toleranceValidation.issues);

  if (!modeEvaluation.ok) {
    return Object.freeze({
      ok: false,

      status:
        'H_EARTH_POST_WEST_ADMITTED_GEOMETRY_TRANSFER_INPUT_REJECTED',

      transferMode: null,

      toleranceValidation,
      previewValidation: null,
      westBatchValidation: null,
      gateBAdapterValidation: null,

      issues: freezeIssues(issues)
    });
  }

  if (
    modeEvaluation.transferMode ===
"""
          assert text.count(old) == 1
          corrected = text.replace(old, new, 1).encode('utf-8')
          assert len(corrected) == 63774
          assert hashlib.sha256(corrected).hexdigest() == '936b9853b48526d2e4234eaf5830b2d622830c6a11a1a48a233e7d44508175fe'
          pathlib.Path(os.environ['TARGET_PATH']).write_bytes(corrected)

          matrix_body = comment_body(int(os.environ['MATRIX_COMMENT_ID']))
          matrix_prefix = 'H_EARTH_PACKET_002_CORRECTION_MATRIX_GZIP_B64\n'
          assert matrix_body.startswith(matrix_prefix)
          matrix_b64 = matrix_body[len(matrix_prefix):].strip()
          assert len(matrix_b64) == 2968
          assert hashlib.sha256(matrix_b64.encode()).hexdigest() == 'e5ddb29787151784702b742e6b786cce568a93daaa027f3b05f156a35052e55d'
          matrix_raw = gzip.decompress(base64.b64decode(matrix_b64, validate=True))
          assert len(matrix_raw) == 7363
          assert hashlib.sha256(matrix_raw).hexdigest() == 'b6935c68b431fc0e5a903ad12837b7ebfb2c8894f95f8b2c4944a429397835f4'
          pathlib.Path('.h-earth-packet-002-matrix.mjs').write_bytes(matrix_raw)
          PY
          test "$(git hash-object "$TARGET_PATH")" = c31412854dbce91bc6b378f345976fff5431e671

      - name: Execute identical 48-check matrix and fail-fast assertions
        shell: bash
        env:
          MATRIX_OUTPUT: ${{ runner.temp }}/packet-002-correction/matrix.json
        run: |
          set -euo pipefail
          node ./.h-earth-packet-002-matrix.mjs
          rm ./.h-earth-packet-002-matrix.mjs
          python - <<'PY'
          import json, os, pathlib
          matrix = json.loads(pathlib.Path(os.environ['MATRIX_OUTPUT']).read_text())
          assert matrix['totalChecks'] == 48
          assert matrix['passedChecks'] == 48
          assert matrix['failed'] == []
          assert matrix['overallResult'] == 'PASS'
          PY

      - name: Commit only corrected shared Packet 002
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | awk '{print $2}' | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$TARGET_PATH"
          printf 'result=PASS\nchecks=48_OF_48\nsource_bytes=63774\nsource_sha256=936b9853b48526d2e4234eaf5830b2d622830c6a11a1a48a233e7d44508175fe\nsource_blob=c31412854dbce91bc6b378f345976fff5431e671\ncorrection=mixed_mode_fail_fast_and_explicit_null_discriminator\n' > "$RUNNER_TEMP/packet-002-correction/receipt.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET_PATH"
          git commit -m 'Renew shared Packet 002 with Gate B fail-fast mode'
          git push origin "HEAD:$TARGET_BRANCH"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h-earth-packet-002-bounded-correction-audit
          path: ${{ runner.temp }}/packet-002-correction/
          retention-days: 1
