name: Laws CP5 R2 Solar Materialization

on:
  push:
    branches:
      - agent/laws-cp5-r2-celestial-visual-correction-001

permissions:
  contents: write

concurrency:
  group: laws-cp5-r2-solar-materialization
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact CP5-R2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/laws-cp5-r2-celestial-visual-correction-001
          fetch-depth: 0

      - name: Apply bounded solar visual correction
        shell: bash
        run: |
          set -euo pipefail
          base="0ff5741803926a6c218415587955aa867f93a0f7"
          expected_crystal="43bb3659e24094074b72a45a1990bc66bd79e2be"
          expected_interactions="be365cc331ee5643f916abee204d4f5f45376c04"

          test "$(git rev-parse "$base":laws/index.crystals.js)" = "$expected_crystal"
          test "$(git hash-object laws/index.crystals.js)" = "$expected_crystal"
          test "$(git hash-object laws/index.interactions.js)" = "$expected_interactions"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("laws/index.crystals.js")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              'Object.freeze({specular:0.18,rim:0.42,emissive:0.88,alpha:1.50,sparkle:0.00,halo:0.58,contrast:1.70}),',
              'Object.freeze({specular:0.03,rim:0.10,emissive:0.22,alpha:1.00,sparkle:0.00,halo:0.78,contrast:1.94}),',
              "solar material"
          )

          replace_once(
              "    uniform float uHaloExpansion;\n\n    varying vec3 vNormal;",
              "    uniform float uHaloExpansion;\n    uniform float uTime;\n    uniform float uSolarBody;\n\n    varying vec3 vNormal;",
              "vertex solar uniforms"
          )

          replace_once(
              """      if (uHaloPass > 0.5) {
        pos += normalize(aNormal) * uHaloExpansion;
      }""",
              """      if (uHaloPass > 0.5) {
        float expansionScale = 1.0;
        if (uSolarBody > 0.5) {
          vec3 direction = normalize(aPosition);
          float plume =
            sin(direction.x * 8.7 + direction.y * 5.1 + uTime * 0.31) * 0.46 +
            sin(direction.y * 11.3 - direction.z * 6.4 - uTime * 0.23) * 0.32 +
            sin(direction.z * 15.7 + direction.x * 4.9 + uTime * 0.17) * 0.22;
          expansionScale = 0.10 + smoothstep(0.02, 0.76, plume) * 1.76;
        }
        pos += normalize(aNormal) * uHaloExpansion * expansionScale;
      }""",
              "irregular solar halo geometry"
          )

          replace_once(
              "    uniform float uSaturation;\n\n    uniform vec3 uKeyLight;",
              "    uniform float uSaturation;\n    uniform float uSolarBody;\n\n    uniform vec3 uKeyLight;",
              "fragment solar uniform"
          )

          halo_start = text.index("      if (vHaloPass > 0.5) {")
          halo_end = text.index("      float diffuse =", halo_start)
          new_halo = """      if (vHaloPass > 0.5) {
        if (uSolarBody > 0.5) {
          float gasA = 0.5 + 0.5 * sin(n.x * 10.7 + n.y * 6.1 - n.z * 8.4 + uTime * 0.19);
          float gasB = 0.5 + 0.5 * sin(n.x * 5.2 - n.y * 14.3 + n.z * 11.8 - uTime * 0.13);
          float gasC = 0.5 + 0.5 * sin(n.z * 18.1 + n.x * 4.6 + uTime * 0.09);
          float plume = gasA * 0.50 + gasB * 0.32 + gasC * 0.18;
          float wisp = smoothstep(0.54, 0.83, plume);
          float prominenceWisp = pow(max(plume - 0.63, 0.0) * 2.70, 1.45);
          vec3 haloColor =
            mix(
              vec3(1.0, 0.20, 0.008),
              vec3(1.0, 0.84, 0.25),
              clamp(gasA * 0.72 + gasC * 0.28, 0.0, 1.0)
            ) *
            (0.46 + wisp * 0.90 + prominenceWisp * 0.74) *
            uHaloStrength;
          float haloAlpha =
            clamp(
              (0.012 + fresnel * 0.075 + sideRim * 0.035 + prominenceWisp * 0.15) *
              wisp *
              uProminence *
              uHaloStrength,
              0.0,
              0.23
            );
          gl_FragColor = vec4(haloColor, haloAlpha);
          return;
        }

        vec3 haloColor =
          base *
          (
            0.70 +
            fresnel * 1.18 +
            sideRim * 0.42 +
            rear * 0.24
          ) *
          uHaloStrength *
          twinkle;

        float haloAlpha =
          clamp(
            (
              0.040 +
              fresnel * 0.18 +
              sideRim * 0.08
            ) *
            uProminence *
            uHaloStrength,
            0.0,
            0.34
          );

        gl_FragColor = vec4(haloColor, haloAlpha);
        return;
      }

      if (uSolarBody > 0.5) {
        float centerToLimb = smoothstep(0.04, 0.92, max(facingToCamera, 0.0));
        float limbBrightness = 0.68 + centerToLimb * 0.32;
        float activity = clamp((base.r - base.g) * 1.12 + (0.34 - base.b) * 0.28, 0.0, 1.0);
        vec3 solarColor = base * limbBrightness * (0.94 + uProminence * 0.08);
        solarColor += vec3(1.0, 0.28, 0.012) * activity * 0.035;
        solarColor *= 0.96 + key * 0.07 + fill * 0.025;
        gl_FragColor = vec4(min(solarColor, vec3(1.0)), 1.0);
        return;
      }

"""
          text = text[:halo_start] + new_halo + text[halo_end:]

          crater_anchor = """    ].map(record => ({
      center: normalizeVector(record.slice(0, 3)),
      radius: record[3],
      depth: record[4]
    }));

    function deterministicField"""
          solar_fields = """    ].map(record => ({
      center: normalizeVector(record.slice(0, 3)),
      radius: record[3],
      depth: record[4]
    }));

    /* CP5_R2_SOLAR_LARGE_CONVECTION_CELLS */
    const solarCells = [
      [0.16, 0.92, 0.36, 1.00], [-0.44, 0.78, 0.45, 0.74],
      [0.66, 0.52, 0.54, 0.88], [0.82, 0.04, 0.57, 0.62],
      [0.44, -0.52, 0.73, 0.91], [-0.18, -0.72, 0.67, 0.70],
      [-0.72, -0.34, 0.61, 0.84], [-0.86, 0.18, 0.47, 0.58],
      [0.08, 0.34, 0.94, 0.78], [0.55, -0.18, -0.81, 0.66],
      [-0.38, 0.22, -0.90, 0.94], [0.18, -0.86, -0.47, 0.72],
      [-0.78, -0.12, -0.61, 0.82], [0.72, 0.48, -0.49, 0.60]
    ].map(record => ({
      center: normalizeVector(record.slice(0, 3)),
      energy: record[3]
    }));

    const solarActivity = [
      [0.44, 0.18, 0.88, 0.16, 0.95],
      [-0.34, -0.36, 0.87, 0.13, 0.82],
      [0.62, -0.56, -0.54, 0.18, 0.70]
    ].map(record => ({
      center: normalizeVector(record.slice(0, 3)),
      radius: record[3],
      strength: record[4]
    }));

    function mixColor(a, b, amount) {
      const t = clamp(amount, 0, 1);
      return [
        a[0] + (b[0] - a[0]) * t,
        a[1] + (b[1] - a[1]) * t,
        a[2] + (b[2] - a[2]) * t
      ];
    }

    function deterministicField"""
          replace_once(crater_anchor, solar_fields, "solar field insertion")

          old_solar = """      if (mode === \"solar\") {
        const broad = deterministicField(nx, ny, nz, 4.6, 0.73);
        const cells = deterministicField(nx, ny, nz, 13.6, 2.17);
        const fine = deterministicField(nx, ny, nz, 31.0, 1.31);
        const spotCenterA = normalizeVector([0.44, 0.18, 0.88]);
        const spotCenterB = normalizeVector([-0.34, -0.36, 0.87]);
        const spotA = Math.exp(-Math.pow(Math.acos(clamp(nx * spotCenterA[0] + ny * spotCenterA[1] + nz * spotCenterA[2], -1, 1)) / 0.14, 2) * 2.8);
        const spotB = Math.exp(-Math.pow(Math.acos(clamp(nx * spotCenterB[0] + ny * spotCenterB[1] + nz * spotCenterB[2], -1, 1)) / 0.11, 2) * 3.2);
        const shade = clamp(0.82 + broad * 0.09 + cells * 0.15 + fine * 0.055 - spotA * 0.24 - spotB * 0.18, 0.48, 1.10);
        relief += broad * 0.0055 + cells * 0.0036 + fine * 0.0014;
        surfaceColor = [
          clamp(0.93 + shade * 0.12, 0, 1),
          clamp(color[1] * (0.70 + shade * 0.30), 0, 1),
          clamp(color[2] * (0.38 + shade * 0.50), 0, 1)
        ];
      } else {"""

          new_solar = """      if (mode === \"solar\") {
        let nearest = Infinity;
        let second = Infinity;
        let cellEnergyWeight = 0.72;
        solarCells.forEach(cell => {
          const distance = Math.acos(
            clamp(nx * cell.center[0] + ny * cell.center[1] + nz * cell.center[2], -1, 1)
          );
          if (distance < nearest) {
            second = nearest;
            nearest = distance;
            cellEnergyWeight = cell.energy;
          } else if (distance < second) {
            second = distance;
          }
        });

        const boundary = 1 - smoothTransition(0.018, 0.145, second - nearest);
        const risingCenter = 1 - smoothTransition(0.07, 0.58, nearest);
        const broad = deterministicField(nx, ny, nz, 3.2, 0.73);
        const turbulentFold = deterministicField(nx, ny, nz, 7.4, 2.17);
        const fine = deterministicField(nx, ny, nz, 25.0, 1.31);
        let activity = 0;
        solarActivity.forEach(region => {
          const angularDistance = Math.acos(
            clamp(nx * region.center[0] + ny * region.center[1] + nz * region.center[2], -1, 1)
          );
          activity += Math.exp(-Math.pow(angularDistance / region.radius, 2) * 2.5) * region.strength;
        });
        activity = clamp(activity, 0, 1);

        const heat = clamp(
          0.24 +
          risingCenter * (0.48 + cellEnergyWeight * 0.20) -
          boundary * 0.50 +
          broad * 0.09 +
          turbulentFold * 0.085 +
          fine * 0.035 -
          activity * 0.33,
          0,
          1
        );

        const darkRed = [0.42, 0.035, 0.006];
        const redOrange = [0.78, 0.105, 0.008];
        const deepOrange = [1.0, 0.285, 0.012];
        const gold = [1.0, 0.665, 0.055];
        const yellowWhite = [1.0, 0.985, 0.72];
        if (heat < 0.18) {
          surfaceColor = mixColor(darkRed, redOrange, heat / 0.18);
        } else if (heat < 0.42) {
          surfaceColor = mixColor(redOrange, deepOrange, (heat - 0.18) / 0.24);
        } else if (heat < 0.72) {
          surfaceColor = mixColor(deepOrange, gold, (heat - 0.42) / 0.30);
        } else {
          surfaceColor = mixColor(gold, yellowWhite, (heat - 0.72) / 0.28);
        }

        relief +=
          risingCenter * 0.0085 -
          boundary * 0.0055 +
          broad * 0.0038 +
          turbulentFold * 0.0027 +
          fine * 0.0012 +
          activity * 0.0020;
      } else {"""
          replace_once(old_solar, new_solar, "solar convection branch")

          uniform_pattern = re.compile(
              r'(haloExpansion:\s*\n\s*gl\.getUniformLocation\(\s*\n\s*program,\s*\n\s*"uHaloExpansion"\s*\n\s*\),)'
          )
          text, count = uniform_pattern.subn(
              r'\1\n\n        solarBody:\n          gl.getUniformLocation(\n            program,\n            "uSolarBody"\n          ),',
              text,
              count=1
          )
          if count != 1:
              raise SystemExit(f"solar uniform map replacement count={count}")

          replace_once(
              """    const haloScale =
      haloPass
        ? 1 +
          transform.halo *
            0.10
        : 1;""",
              """    const haloScale =
      haloPass
        ? node.id === "test"
          ? 1
          : 1 + transform.halo * 0.10
        : 1;""",
              "solar non-ring model scale"
          )

          draw_pattern = re.compile(
              r'(gl\.uniform1f\(\s*\n\s*renderer\.uniforms\.haloPass,\s*\n\s*haloPass \? 1 : 0\s*\n\s*\);)\s*\n\s*gl\.uniform1f\(\s*\n\s*renderer\.uniforms\.haloExpansion,\s*\n\s*0\.075\s*\n\s*\);'
          )
          draw_replacement = r'''\1

    gl.uniform1f(
      renderer.uniforms.solarBody,
      node.id === "test" ? 1 : 0
    );

    gl.uniform1f(
      renderer.uniforms.haloExpansion,
      node.id === "test" ? 0.14 : 0.075
    );'''
          text, count = draw_pattern.subn(draw_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"draw solar binding replacement count={count}")

          draw_function = text.index("  function drawCrystalNodes(")
          bloom_start = text.index("    if (!bloomDisabled) {", draw_function)
          bloom_end = text.index("    gl.depthMask(true);", bloom_start)
          new_bloom = """    const haloNodes =
      bloomDisabled
        ? nodes.filter(node => node.id === "test")
        : nodes;

    /* CP5_R2_SOLAR_IRREGULAR_GASEOUS_CORONA */
    if (haloNodes.length) {
      gl.depthMask(false);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
      haloNodes.forEach(node => {
        drawCalls += drawNode(renderer, node, true);
      });
    }

"""
          text = text[:bloom_start] + new_bloom + text[bloom_end:]

          required = [
              "horizontalRadius:\n        1.68",
              "verticalRadius:\n        1.5008",
              "depthRadius:\n        1.2992",
              "gatewayBodyScale:\n    0.7666667",
              "CP5_R2_SOLAR_LARGE_CONVECTION_CELLS",
              "CP5_R2_SOLAR_IRREGULAR_GASEOUS_CORONA",
              "const crater = craterField(nx, ny, nz);",
              "relief += terrain * 0.013 + fineTerrain * 0.0055 + crater.relief;"
          ]
          missing = [fragment for fragment in required if fragment not in text]
          if missing:
              raise SystemExit(f"required markers missing: {missing}")

          path.write_text(text, encoding="utf-8")
          PY

          node --check laws/index.crystals.js
          git diff --check -- laws/index.crystals.js
          test "$(git hash-object laws/index.interactions.js)" = "$expected_interactions"
          test "$(git diff --name-only "$base" -- laws/index.interactions.js laws/index.controller.js laws/index.compositor.js laws/index.html laws/index.css laws/index.planet.js laws/index.cosmos.js)" = ""

      - name: Commit final one-file CP5-R2 state
        shell: bash
        run: |
          set -euo pipefail
          base="0ff5741803926a6c218415587955aa867f93a0f7"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm -f \
            .github/workflows/laws-cp5-r2-celestial-verification.yml \
            .github/workflows/laws-cp5-r2-solar-constructor.yml \
            verification/benchmark-tools/laws-cp5-r2-celestial-verification-v1/laws-cp5-r2-celestial-verification.mjs
          git add laws/index.crystals.js

          test "$(git diff --cached --name-only "$base")" = "laws/index.crystals.js"
          git commit -m '[skip ci] Apply bounded Laws CP5-R2 solar visual correction'
          test "$(git diff --name-only "$base" HEAD)" = "laws/index.crystals.js"
          git push origin HEAD:agent/laws-cp5-r2-celestial-visual-correction-001
