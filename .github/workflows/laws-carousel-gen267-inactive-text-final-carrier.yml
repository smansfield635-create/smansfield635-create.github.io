name: Laws Carousel Gen267 Inactive Text Final Carrier
on:
  push:
    branches: ['agent/laws-carousel-gen267-mobile-legibility-repair']
    paths: ['.github/workflows/laws-carousel-gen267-inactive-text-final-carrier.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/laws-carousel-gen267-mobile-legibility-repair
      - name: Suppress only inactive phone text payloads
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('laws/research/methods-and-models/carousel.css')
          s=p.read_text()
          needle='''    .mm-carousel { --card-width: min(78vw, 19.5rem); min-height: 900px; }\n    .mm-viewport { inset: 26rem 0 0; }'''
          repl='''    .mm-carousel { --card-width: min(78vw, 19.5rem); min-height: 900px; }\n    .mm-viewport { inset: 26rem 0 0; }\n    .mm-card:not([data-active="true"]) .mm-card__top,\n    .mm-card:not([data-active="true"]) .mm-card__body { opacity: 0; }\n    .mm-card:not([data-active="true"]) .mm-card__surface { opacity: .24; filter: saturate(.58); }'''
          if needle not in s: raise SystemExit('FINAL_PHONE_GEOMETRY_NOT_FOUND')
          if 'mm-card:not([data-active="true"]) .mm-card__top' in s: raise SystemExit('INACTIVE_TEXT_RULE_ALREADY_PRESENT')
          p.write_text(s.replace(needle,repl,1))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add laws/research/methods-and-models/carousel.css
          git commit -m 'suppress inactive Gen267 phone text projection'
          git push origin HEAD:agent/laws-carousel-gen267-mobile-legibility-repair
