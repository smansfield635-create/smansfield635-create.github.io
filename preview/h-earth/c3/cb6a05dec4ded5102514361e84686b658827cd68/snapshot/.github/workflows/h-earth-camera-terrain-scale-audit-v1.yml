name: H-Earth Camera Terrain Scale Audit v1
on: workflow_dispatch
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node h-earth-3d/audits/h-earth-camera-terrain-scale-audit.v1.mjs | tee h-earth-camera-terrain-scale.json
      - uses: actions/upload-artifact@v4
        with:
          name: h-earth-camera-terrain-scale-${{ github.run_id }}
          path: h-earth-camera-terrain-scale.json
