name: Project Awareness Validation Runner

on:
  pull_request:
    branches:
      - agent/project-awareness-validation-001
    paths:
      - "research/project-awareness/**"

permissions:
  contents: read

jobs:
  validate-project-awareness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Execute repository awareness fixtures
        shell: bash
        run: |
          node --experimental-default-type=module --input-type=module <<'NODE'
          import {
            runAwarenessValidation
          } from "./research/project-awareness/awareness-validation.fixtures.js";

          const receipt = runAwarenessValidation();
          console.log(JSON.stringify(receipt, null, 2));
          NODE
