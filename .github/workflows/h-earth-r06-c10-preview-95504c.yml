name: H-Earth R06-C10 Candidate Preview 95504c

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h-earth-r06-c10-preview-95504c.yml'

permissions:
  contents: write

concurrency:
  group: h-earth-r06-c10-preview-95504c
  cancel-in-progress: false

jobs:
  materialize-prove-publish:
    if: github.head_ref == 'publication/h-earth-r06-c10-preview-95504c-001'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_HEAD: 95504c9927922318225da1d61fa303cec70497f9
      PUBLICATION_BRANCH: publication/h-earth-r06-c10-preview-95504c-001
      PREVIEW_ROOT: preview/h-earth/r06-c10/95504c9927922318225da1d61fa303cec70497f9
      PREVIEW_URL_PATH: /preview/h-earth/r06-c10/95504c9927922318225da1d61fa303cec70497f9/index.html
      SOURCE_ENTRY: showroom/globe/h-earth/index.html
      PLAYWRIGHT_VERSION: 1.55.0
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: publication/h-earth-r06-c10-preview-95504c-001
          fetch-depth: 0
          path: publication

      - name: Check out exact terrain candidate
        uses: actions/checkout@v4
        with:
          ref: 95504c9927922318225da1d61fa303cec70497f9
          fetch-depth: 1
          path: source

      - name: Materialize exact self-contained environment preview
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, subprocess
          from pathlib import Path, PurePosixPath

          ws = Path(os.environ['GITHUB_WORKSPACE'])
          src = ws / 'source'
          pub = ws / 'publication'
          preview_rel = PurePosixPath(os.environ['PREVIEW_ROOT'])
          out = pub / Path(str(preview_rel))
          prefix = '/' + str(preview_rel).strip('/') + '/_source/'
          source_head = os.environ['SOURCE_HEAD']
          entry = PurePosixPath(os.environ['SOURCE_ENTRY'])
          text_ext = {'.js','.mjs','.html','.json','.css','.txt','.svg','.xml','.webmanifest'}
          spec_re = re.compile(r"(?:from\s+|import\s*\(\s*|import\s+|fetch\s*\(\s*|new\s+URL\s*\(\s*)['\"]([^'\"]+)['\"]")
          html_re = re.compile(r"(?:src|href)\s*=\s*['\"]([^'\"]+)['\"]", re.I)
          css_re = re.compile(r"url\(\s*['\"]?([^)'\"]+)['\"]?\s*\)", re.I)
          abs_re = re.compile(r"(['\"])(/[^'\"`\s]+)\1")

          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True)

          def split_suffix(spec):
              base = spec
              suffix = ''
              for marker in ('#','?'):
                  if marker in base:
                      idx = base.index(marker)
                      suffix = base[idx:] + suffix
                      base = base[:idx]
              return base, suffix

          def normalize(owner, spec):
              if spec.startswith(('http://','https://','data:','blob:','#','javascript:','mailto:')):
                  return None
              base, _ = split_suffix(spec)
              if not base:
                  return None
              if base.startswith('/'):
                  p = PurePosixPath(base.lstrip('/'))
              elif base.startswith('.'):
                  p = owner.parent.joinpath(base)
              else:
                  return None
              return PurePosixPath(os.path.normpath(str(p)).replace('\\','/'))

          def existing(owner, spec, strict=False):
              p = normalize(owner, spec)
              if p is None:
                  return None
              if (src / Path(str(p))).is_file():
                  return p
              if strict:
                  raise FileNotFoundError(f'UNRESOLVED_RUNTIME_DEPENDENCY:{owner}:{spec}:{p}')
              return None

          queue = [entry]
          seen = set()
          while queue:
              item = queue.pop(0)
              if item in seen:
                  continue
              path = src / Path(str(item))
              if not path.is_file():
                  raise FileNotFoundError(f'SOURCE_FILE_MISSING:{item}')
              seen.add(item)
              if path.suffix.lower() not in text_ext:
                  continue
              text = path.read_text('utf-8')
              specs = [m.group(1) for m in spec_re.finditer(text)]
              if path.suffix.lower() in {'.html','.svg'}:
                  specs += [m.group(1) for m in html_re.finditer(text)]
              if path.suffix.lower() == '.css':
                  specs += [m.group(1) for m in css_re.finditer(text)]
              for spec in specs:
                  dep = existing(item, spec, strict=False)
                  if dep is not None and dep not in seen:
                      queue.append(dep)
              for match in abs_re.finditer(text):
                  dep = existing(item, match.group(2), strict=False)
                  if dep is not None and dep not in seen:
                      queue.append(dep)

          def rebase(owner, text):
              def repl(match):
                  spec = match.group(2)
                  dep = existing(owner, spec, strict=False)
                  if dep is None:
                      return match.group(0)
                  _, suffix = split_suffix(spec)
                  return match.group(1) + prefix + str(dep) + suffix + match.group(1)
              return abs_re.sub(repl, text)

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          rows = []
          for item in sorted(seen, key=str):
              source_path = src / Path(str(item))
              raw = source_path.read_bytes()
              blob = subprocess.check_output(
                  ['git','-C',str(src),'rev-parse',f'{source_head}:{item}'],
                  text=True
              ).strip()
              data = raw
              transform = 'NONE'
              if source_path.suffix.lower() in text_ext:
                  original = raw.decode('utf-8')
                  changed = rebase(item, original)
                  data = changed.encode('utf-8')
                  if changed != original:
                      transform = 'ABSOLUTE_RUNTIME_PATHS_REBASED_TO_PREVIEW'
              rel = PurePosixPath('_source') / item
              destination = out / Path(str(rel))
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
              rows.append({
                  'sourceFile': str(item),
                  'sourceCommit': source_head,
                  'sourceBlob': blob,
                  'sourceSha256': sha(raw),
                  'previewFile': str(rel),
                  'previewSha256': sha(data),
                  'transform': transform
              })

          root_html = f'''<!doctype html>
          <html lang="en" data-preview-class="IMMUTABLE_UNLINKED_NONPRODUCTION_REVIEW" data-source-head="{source_head}">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>H-Earth R06:C10 Candidate Preview</title></head>
          <body style="margin:0;background:#020708;color:#edf7f3;font-family:system-ui,sans-serif"><p id="status" style="padding:16px">Opening exact R06:C10 candidate environment…</p><script>location.replace('./_source/{entry}'+location.search+location.hash)</script></body></html>'''
          (out / 'index.html').write_text(root_html, 'utf-8')

          manifest = {
              'manifestType': 'H_EARTH_R06_C10_IMMUTABLE_ENVIRONMENT_PREVIEW_MANIFEST_v1',
              'operationId': 'H_EARTH_R06_C10_CANDIDATE_PREVIEW_PUBLICATION_001',
              'sourceHead': source_head,
              'sourceEntry': str(entry),
              'previewPath': str(preview_rel) + '/',
              'expectedPublicEntry': 'https://diamondgatebridge.com/' + str(preview_rel) + '/index.html',
              'sourceDependencyClosureCount': len(rows),
              'sourceEntries': rows,
              'boundaries': {
                  'unlinkedFromPublicNavigation': True,
                  'publicDefaultRouteMutated': False,
                  'candidateMerged': False,
                  'terrainRetuned': False,
                  'sourceBehaviorChanged': False
              }
          }
          manifest_path = out / 'byte-manifest.json'
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', 'utf-8')
          manifest_digest = sha(manifest_path.read_bytes())
          (out / 'byte-manifest.sha256').write_text(f'{manifest_digest}  byte-manifest.json\n', 'utf-8')
          (out / 'publication-receipt.json').write_text(json.dumps({
              'operationId': 'H_EARTH_R06_C10_CANDIDATE_PREVIEW_PUBLICATION_001',
              'status': 'MATERIALIZED_PENDING_BROWSER_PROOF',
              'sourceHead': source_head,
              'previewFileCount': len(rows) + 4,
              'dependencyClosureResult': 'PASS',
              'byteManifestResult': 'PASS',
              'manifestDigest': 'sha256:' + manifest_digest
          }, indent=2) + '\n', 'utf-8')
          print(json.dumps({'closureCount': len(rows), 'manifestDigest': manifest_digest}))
          PY

      - name: Verify exact source-to-preview correspondence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])/'publication'/os.environ['PREVIEW_ROOT']
          src = Path(os.environ['GITHUB_WORKSPACE'])/'source'
          manifest = json.loads((root/'byte-manifest.json').read_text())
          assert hashlib.sha256((root/'byte-manifest.json').read_bytes()).hexdigest() == (root/'byte-manifest.sha256').read_text().split()[0]
          accounted = {'index.html','byte-manifest.json','byte-manifest.sha256','publication-receipt.json'}
          for row in manifest['sourceEntries']:
              source_path = src/row['sourceFile']
              preview_path = root/row['previewFile']
              assert source_path.is_file() and preview_path.is_file()
              assert subprocess.check_output(['git','-C',str(src),'rev-parse',f"{manifest['sourceHead']}:{row['sourceFile']}"],text=True).strip() == row['sourceBlob']
              assert hashlib.sha256(source_path.read_bytes()).hexdigest() == row['sourceSha256']
              assert hashlib.sha256(preview_path.read_bytes()).hexdigest() == row['previewSha256']
              accounted.add(row['previewFile'])
          actual = {str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          assert actual == accounted, (sorted(actual-accounted), sorted(accounted-actual))
          print(json.dumps({'result':'PASS','sourceEntries':len(manifest['sourceEntries']),'previewFiles':len(actual)}))
          PY

      - name: Install Chromium verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw" "$RUNNER_TEMP/proof"
          cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium

      - name: Prove visible environment on desktop and touch mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4188 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/publication" >"$RUNNER_TEMP/proof/server.log" 2>&1 &
          for attempt in $(seq 1 60); do curl -fsS "http://127.0.0.1:4188$PREVIEW_URL_PATH" >/dev/null && break; sleep 1; done
          cat > "$RUNNER_TEMP/pw/verify.mjs" <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import process from 'node:process';
          import { chromium } from 'playwright';
          const url = `http://127.0.0.1:4188${process.env.PREVIEW_URL_PATH}`;
          const out = path.join(process.env.RUNNER_TEMP,'proof');
          const assert = (value, code, detail=null) => { if (!value) { const error = new Error(code); error.detail = detail; throw error; } };
          async function inspect(browser, profile) {
            const context = await browser.newContext({viewport:profile.viewport,deviceScaleFactor:profile.dpr,isMobile:profile.mobile,hasTouch:profile.mobile});
            const page = await context.newPage();
            const consoleErrors=[]; const pageErrors=[]; const requestFailures=[]; const httpFailures=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(e.message));
            page.on('requestfailed',r=>requestFailures.push({url:r.url(),failure:r.failure()}));
            page.on('response',r=>{if(r.status()>=400&&!r.url().endsWith('/favicon.ico'))httpFailures.push({url:r.url(),status:r.status()})});
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForSelector('#h-earth-functional-landscape-canvas',{timeout:120000});
            await page.waitForFunction(()=>{
              const c=document.getElementById('h-earth-functional-landscape-canvas');
              if(!c||!c.width||!c.height)return false;
              const gl=c.getContext('webgl2')||c.getContext('webgl');
              if(!gl)return false;
              const w=c.width,h=c.height,p=new Uint8Array(w*h*4);
              gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,p);
              let visible=0;
              for(let i=0;i<p.length;i+=4)if(p[i]+p[i+1]+p[i+2]>18)visible++;
              return visible/(w*h)>.01;
            },null,{timeout:120000,polling:500});
            const result=await page.evaluate(()=>{
              const c=document.getElementById('h-earth-functional-landscape-canvas');
              const gl=c.getContext('webgl2')||c.getContext('webgl');
              const w=c.width,h=c.height,p=new Uint8Array(w*h*4);
              gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,p);
              let visible=0,brightness=0;
              for(let i=0;i<p.length;i+=4){const sum=p[i]+p[i+1]+p[i+2];brightness+=sum;if(sum>18)visible++;}
              const resources=performance.getEntriesByType('resource').map(r=>r.name);
              return {
                canvas:{width:w,height:h,visiblePixelFraction:visible/(w*h),meanRgbSum:brightness/(w*h)},
                candidateModuleLoaded:resources.some(u=>u.includes('h-earth.r06-c10.official-landform-candidate-001.js')),
                startupReceipt:window.H_EARTH_RENDERER_STARTUP_DIAGNOSTICS?.getReceipt?.()??null,
                runtimeSnapshot:window.H_EARTH_RUNTIME_DIAGNOSTICS?.getSnapshot?.()??null,
                documentReadyState:document.readyState,
                location:location.href
              };
            });
            assert(result.canvas.visiblePixelFraction>.01,'VISIBLE_WORLD_FRAME_NOT_PROVEN',result);
            assert(result.candidateModuleLoaded,'CANDIDATE_TERRAIN_MODULE_NOT_LOADED',result);
            assert(!result.startupReceipt?.firstFailureStage,'STARTUP_RECEIPT_REPORTED_FAILURE',result.startupReceipt);
            assert(pageErrors.length===0,'PAGE_ERRORS_PRESENT',pageErrors);
            assert(requestFailures.length===0,'REQUEST_FAILURES_PRESENT',requestFailures);
            assert(httpFailures.length===0,'HTTP_FAILURES_PRESENT',httpFailures);
            await page.screenshot({path:path.join(out,`${profile.name}.png`),fullPage:true});
            const receipt={profile:profile.name,url,result,consoleErrors,pageErrors,requestFailures,httpFailures,status:'PASS_VISIBLE_ENVIRONMENT'};
            fs.writeFileSync(path.join(out,`${profile.name}.receipt.json`),JSON.stringify(receipt,null,2)+'\n');
            await context.close();
            return receipt;
          }
          const browser=await chromium.launch({headless:true});
          try{
            const desktop=await inspect(browser,{name:'desktop',viewport:{width:1440,height:1000},dpr:1,mobile:false});
            const mobile=await inspect(browser,{name:'touch-mobile',viewport:{width:412,height:915},dpr:2,mobile:true});
            fs.writeFileSync(path.join(out,'browser-proof.summary.json'),JSON.stringify({status:'PASS',sourceHead:process.env.SOURCE_HEAD,desktop,mobile},null,2)+'\n');
          }finally{await browser.close();}
          JS
          cd "$RUNNER_TEMP/pw"
          node verify.mjs
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])/'publication'/os.environ['PREVIEW_ROOT']
          receipt=json.loads((root/'publication-receipt.json').read_text())
          proof=json.loads((Path(os.environ['RUNNER_TEMP'])/'proof'/'browser-proof.summary.json').read_text())
          receipt.update({
              'status':'PASS_VISIBLE_ENVIRONMENT_PROVEN',
              'desktopBrowserProof':'PASS',
              'touchMobileBrowserProof':'PASS',
              'candidateTerrainModuleLoaded':True,
              'visibleWorldFrameProven':True,
              'browserProofSummary':proof
          })
          (root/'publication-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY

      - name: Commit verified preview root
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/publication"
          git config user.name h-earth-preview-publisher
          git config user.email actions@users.noreply.github.com
          git add "$PREVIEW_ROOT"
          test -n "$(git status --porcelain -- "$PREVIEW_ROOT")"
          git commit -m 'Publish verified R06 C10 candidate environment preview'
          git push origin "HEAD:$PUBLICATION_BRANCH"

      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-r06-c10-preview-95504c-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/proof
            publication/${{ env.PREVIEW_ROOT }}/byte-manifest.json
            publication/${{ env.PREVIEW_ROOT }}/byte-manifest.sha256
            publication/${{ env.PREVIEW_ROOT }}/publication-receipt.json
          if-no-files-found: warn
          retention-days: 30
