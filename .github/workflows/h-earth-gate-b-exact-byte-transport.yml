name: H-Earth Shared Packet 002 Legacy Observation
on:
  pull_request:
permissions:
  contents: read
  issues: read
jobs:
  observe-shared-packet-002-legacy:
    if: github.head_ref == 'agent/h-earth-gate-b-phase-a-successor-001'
    runs-on: ubuntu-latest
    env:
      TARGET_PATH: h-earth-3d/integration/h-earth.post-west-admitted-geometry-transfer.js
      EXPECTED_BASE_BLOB: 2bcb67ebf84f36248475921c85e75236a1115102
      EXPECTED_SUCCESSOR_BYTES: 63412
      EXPECTED_SUCCESSOR_SHA256: 58e1f0100019a64d870837b69882f59d0fd5c6a522cc5abebb56e97a7179de0a
      EXPECTED_SUCCESSOR_BLOB: b6c92988fee6997344b5df89cd5645d7d5b2d1a2
      COMMENT_IDS: 5059696536,5059713725,5059717709
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/h-earth-gate-b-phase-a-successor-001
          fetch-depth: 0
      - name: Reconstruct exact successor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$TARGET_PATH")" = "$EXPECTED_BASE_BLOB"
          cp "$TARGET_PATH" h-earth-3d/integration/__h-earth.post-west-admitted-geometry-transfer.baseline.js
          mkdir -p "$RUNNER_TEMP/shared-packet-002-observation"
          python - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,urllib.request
          ids=[int(v) for v in os.environ['COMMENT_IDS'].split(',')]
          lengths=[7000,7000,180]
          hashes=['38d0c10cd020c991082655487f27185b2efb56a726562640a07440d8501e51d7','f3037a6fad7128f5e0a5ac6034aaf33ce9920625e7e256bb013ea70dc01603b2','a85b34c42ab9535c1a01530dcafa04734323f8daed056b231f2839a80f8177ea']
          pieces=[]
          for index,comment_id in enumerate(ids,1):
              req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/comments/{comment_id}",headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req) as response: body=json.load(response)['body']
              prefix=f'H_EARTH_SHARED_PACKET_002_SUCCESSOR_GZIP_PART_{index:02d}_OF_03\n'
              assert body.startswith(prefix)
              payload=body[len(prefix):].strip()
              assert len(payload)==lengths[index-1]
              assert hashlib.sha256(payload.encode()).hexdigest()==hashes[index-1]
              pieces.append(payload)
          raw=gzip.decompress(base64.b64decode(''.join(pieces),validate=True))
          assert len(raw)==int(os.environ['EXPECTED_SUCCESSOR_BYTES'])
          assert hashlib.sha256(raw).hexdigest()==os.environ['EXPECTED_SUCCESSOR_SHA256']
          pathlib.Path(os.environ['TARGET_PATH']).write_bytes(raw)
          PY
          test "$(git hash-object "$TARGET_PATH")" = "$EXPECTED_SUCCESSOR_BLOB"
      - name: Record exact legacy baseline and successor behavior
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const observation={stage:'START',preview:null,west:null,baseline:null,successor:null,comparison:null,thrown:null};
          try {
            const previewModule=await import('./showroom/globe/h-earth/render/shoreline-preview.js');
            const kernel=await import('./showroom/globe/h-earth/render/geometry-kernel.js');
            const baseline=await import('./h-earth-3d/integration/__h-earth.post-west-admitted-geometry-transfer.baseline.js');
            const successor=await import('./h-earth-3d/integration/h-earth.post-west-admitted-geometry-transfer.js');
            observation.stage='IMPORTED';
            const requestId='H_EARTH_PACKET_002_LEGACY_REGRESSION_REQUEST';
            const previewResult=previewModule.previewHEarthMinimumShorelineGeometry({sourceObjectId:'OBJ_002_FOREGROUND_WET_SAND',requestedPurpose:'MINIMUM_NATIVE_SHORELINE_PROOF',requestId});
            observation.preview={ok:previewResult?.ok,status:previewResult?.status,contractId:previewResult?.contractId,requestId:previewResult?.requestId,providerRequestId:previewResult?.providerRequestId,resolutionReceiptId:previewResult?.resolutionReceiptId,primitiveCount:previewResult?.primitives?.length,sourceObjectIds:previewResult?.sourceObjectIds,sourceZoneIds:previewResult?.sourceZoneIds,latticeRegionIds:previewResult?.latticeRegionIds,keys:previewResult?Object.keys(previewResult).sort():null};
            observation.stage='PREVIEW';
            const westBatchAdmissionResult=kernel.admitHEarthPrimitiveBatch(previewResult.primitives,{frameId:'H_EARTH_PACKET_002_LEGACY_REGRESSION_FRAME',metadata:Object.freeze({requestId:previewResult.requestId,providerRequestId:previewResult.providerRequestId,resolutionReceiptId:previewResult.resolutionReceiptId,sourceObjectIds:Object.freeze([...previewResult.sourceObjectIds]),sourceZoneIds:previewResult.sourceZoneIds,latticeRegionIds:previewResult.latticeRegionIds})});
            observation.west={valid:westBatchAdmissionResult?.valid,status:westBatchAdmissionResult?.status,primitiveAdmissionCount:westBatchAdmissionResult?.primitiveAdmissions?.length,frameId:westBatchAdmissionResult?.frame?.frameId,framePrimitiveCount:westBatchAdmissionResult?.frame?.primitives?.length,issues:westBatchAdmissionResult?.issues,keys:westBatchAdmissionResult?Object.keys(westBatchAdmissionResult).sort():null};
            observation.stage='WEST';
            const input={previewResult,westBatchAdmissionResult};
            const baselineEvaluation=baseline.evaluateHEarthPostWestAdmittedGeometryTransferInput(input);
            const baselineOutput=baseline.buildHEarthPostWestAdmittedGeometryTransfer(input);
            observation.baseline={evaluationOk:baselineEvaluation.ok,evaluationStatus:baselineEvaluation.status,evaluationIssues:baselineEvaluation.issues,evaluationKeys:Object.keys(baselineEvaluation).sort(),outputOk:baselineOutput.ok,outputStatus:baselineOutput.status,outputIssues:baselineOutput.issues,outputKeys:Object.keys(baselineOutput).sort()};
            observation.stage='BASELINE';
            const successorEvaluation=successor.evaluateHEarthPostWestAdmittedGeometryTransferInput(input);
            const successorOutput=successor.buildHEarthPostWestAdmittedGeometryTransfer(input);
            observation.successor={evaluationOk:successorEvaluation.ok,evaluationStatus:successorEvaluation.status,transferMode:successorEvaluation.transferMode,evaluationIssues:successorEvaluation.issues,evaluationKeys:Object.keys(successorEvaluation).sort(),outputOk:successorOutput.ok,outputStatus:successorOutput.status,outputTransferMode:successorOutput.transferMode,outputIssues:successorOutput.issues,outputKeys:Object.keys(successorOutput).sort()};
            observation.stage='SUCCESSOR';
            let normalizedEqual=false;
            if(baselineOutput.ok===true&&successorOutput.ok===true){const normalized=structuredClone(successorOutput);delete normalized.transferMode;normalizedEqual=JSON.stringify(normalized)===JSON.stringify(structuredClone(baselineOutput));}
            observation.comparison={normalizedOutputEqual:normalizedEqual,contractIdEqual:baselineOutput.contractId===successorOutput.contractId,statusEqual:baselineOutput.status===successorOutput.status};
            observation.stage='COMPLETE';
          }catch(error){observation.thrown={name:error?.name??'Error',message:error?.message??String(error),stack:error?.stack??null};}
          fs.writeFileSync(process.env.RUNNER_TEMP+'/shared-packet-002-observation/legacy-observation.json',JSON.stringify(observation,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: h-earth-shared-packet-002-legacy-observation
          path: ${{ runner.temp }}/shared-packet-002-observation/legacy-observation.json
          retention-days: 1
      - name: Prove no governed source commit
        shell: bash
        run: |
          set -euo pipefail
          rm h-earth-3d/integration/__h-earth.post-west-admitted-geometry-transfer.baseline.js
          test "$(git status --short | wc -l)" -eq 1
          test "$(git status --short | awk '{print $2}')" = "$TARGET_PATH"
