name: Direct GitHub Pages Deploy — Retired Compatibility Notice

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Record canonical production authority
        run: |
          echo 'LEGACY_PAGES_MUTATION_AUTHORITY=RETIRED'
          echo 'Production publication authority is .github/workflows/pages-exact-head-deploy-v3.yml.'
          echo 'This compatibility workflow performs no Pages deployment and creates no publication authority.'
