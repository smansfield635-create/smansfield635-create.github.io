name: H-Earth CP7F Static Authority Audit

on:
  pull_request:
    paths:
      - '.github/workflows/h-earth-cp7f-static-authority-audit.yml'
      - 'h-earth-3d/control-plane/post-cp2-round2/cp7/h-earth.cp7f-static-authority-audit.v1.mjs'
      - 'h-earth-3d/validation/cp7/h-earth.cp7f-static-authority-audit.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-static-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact CP7F candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute deterministic CP7F verifier first pass
        run: node h-earth-3d/validation/cp7/h-earth.cp7f-static-authority-audit.mjs h-earth-3d/validation/cp7/cp7f-evidence/receipt-first.json
      - name: Execute deterministic CP7F verifier second pass
        run: node h-earth-3d/validation/cp7/h-earth.cp7f-static-authority-audit.mjs h-earth-3d/validation/cp7/cp7f-evidence/receipt-second.json
      - name: Require identical receipts
        run: cmp h-earth-3d/validation/cp7/cp7f-evidence/receipt-first.json h-earth-3d/validation/cp7/cp7f-evidence/receipt-second.json
      - name: Upload CP7F evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-cp7f-static-authority-audit
          path: h-earth-3d/validation/cp7/cp7f-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce CP7F pass
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipt = JSON.parse(fs.readFileSync('h-earth-3d/validation/cp7/cp7f-evidence/receipt-first.json', 'utf8'));
          if (receipt.result !== 'CP7F_STATIC_AUTHORITY_AUDIT_PASS_CLOSED' || receipt.pass !== true) {
            console.error(JSON.stringify(receipt, null, 2));
            process.exit(1);
          }
          console.log(`CP7F_PASS:${receipt.candidateSourceSha256}:${receipt.canonicalReceiptSha256}`);
          NODE
