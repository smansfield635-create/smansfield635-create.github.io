name: H-Earth Phase4 Terrain Microstructure Qualification
on:
  push:
    branches:
      - h-earth/phase2-semantic-material-classifier-v1
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: h-earth-phase4-terrain-microstructure-v1
          path: field
          github-token: ${{ github.token }}
          run-id: 36028808509
      - run: node h-earth-3d/validation/phase4-terrain-microstructure.qualify.mjs field/terrain-microstructure-v1.rg | tee terrain-microstructure-qualification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h-earth-phase4-terrain-microstructure-qualification
          path: terrain-microstructure-qualification.json
          retention-days: 90
