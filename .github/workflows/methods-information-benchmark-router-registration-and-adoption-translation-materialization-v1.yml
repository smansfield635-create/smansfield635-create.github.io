name: Methods Information Benchmark Router Registration and Adoption Translation Materialization v1
on:
  workflow_dispatch:
  push:
    branches:
      - materialization/methods-adoption-translation-v1-001
    paths:
      - .github/workflows/methods-information-benchmark-router-registration-and-adoption-translation-materialization-v1.yml

permissions:
  contents: write
  actions: read
  issues: read
  pull-requests: read

env:
  REPOSITORY: smansfield635-create/smansfield635-create.github.io
  BASE: ffe3cb714751ea0e8df2e53611538f6cadcc241c
  FINGERPRINT: 4fc8e2280057b426e1573ab5ac4f710e0b0d1881264d443a56fb25b9f560f79e
  G58_OPERATION: METHODS_AND_MODELS_AUDIT_OUTPUT_ADOPTION_AND_PAGE_TRANSLATION_v1
  G58_SCOPE: METHODS_INFORMATION_BENCHMARK/METHODS_AND_MODELS/AUDIT_OUTPUT_ADOPTION_AND_PAGE_TRANSLATION/V1
  G64_OPERATION: METHODS_INFORMATION_BENCHMARK_ROUTER_REGISTRATION_AND_ADOPTION_TRANSLATION_PACKAGE_MATERIALIZATION_v1
  G64_SCOPE: METHODS_INFORMATION_BENCHMARK/ROUTER_REGISTRATION/ADOPTION_TRANSLATION_PACKAGE_MATERIALIZATION/V1
  VERIFIER: .github/ai-router/projects/methods-information-benchmark/verify-router-registration-and-package.v1.mjs
  W: .github/workflows/methods-information-benchmark-router-registration-and-adoption-translation-materialization-v1.yml
  P0: .github/workflows/methods-and-models-audit-output-adoption-and-page-translation-v1.yml
  IREC: control-plane/methods-information-benchmark/adoption-and-page-translation-v1/receipts/independent-verification.receipt.v1.json
  CREC: control-plane/methods-information-benchmark/adoption-and-page-translation-v1/receipts/operation-closure.receipt.v1.json

jobs:
  materialize:
    runs-on: ubuntu-24.04
    outputs:
      head: ${{ steps.head.outputs.head }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct immutable source and commit exact seven-path core
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE" "$GITHUB_SHA")" = "$BASE"
          mapfile -t changed < <(git diff --name-only "$BASE..$GITHUB_SHA" | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$W"
          test ! -e "$P0"
          test ! -e "$IREC"
          test ! -e "$CREC"
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const os = require('os');
          const crypto = require('crypto');
          const { spawnSync } = require('child_process');
          const H = b => crypto.createHash('sha256').update(b).digest('hex');
          const get = async url => {
            const r = await fetch(url, {headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              'X-GitHub-Api-Version': '2022-11-28'
            }});
            if (!r.ok) throw new Error(`FETCH_${r.status}`);
            return r.json();
          };
          (async () => {
            const carrierPath = '.github/ai-router/projects/methods-information-benchmark/adoption-review-source-package.carrier.v1.json';
            const c = JSON.parse(fs.readFileSync(carrierPath, 'utf8'));
            const f = process.env.FINGERPRINT;
            if (c.packageFingerprintSha256 !== f || c.reviewRepeated || c.packageRegenerated) throw new Error('CARRIER');
            const records = [];
            for (const k of [...c.transport.chunks].sort((a,b) => a.chunkIndex - b.chunkIndex)) {
              const q = await get(`https://api.github.com/repos/${c.transport.repository}/issues/comments/${k.commentId}`);
              const marker = c.transport.marker + '\n';
              if (q.id !== k.commentId || typeof q.body !== 'string' || !q.body.startsWith(marker)) throw new Error('COMMENT');
              const p = JSON.parse(q.body.slice(marker.length));
              if (p.schema !== 'METHODS_ADOPTION_SOURCE_PACKAGE_CHUNK_v1' ||
                  p.packageFingerprint !== f ||
                  p.zipSha256 !== c.exactZip.sha256 ||
                  p.chunkIndex !== k.chunkIndex ||
                  p.chunkCount !== c.exactZip.chunkCount ||
                  p.chunkSha256 !== k.sha256 ||
                  typeof p.base64 !== 'string') throw new Error('CHUNK_IDENTITY');
              const policy = (c.transport.exactRecoveryPolicies || []).find(x => x.commentId === k.commentId && x.chunkIndex === k.chunkIndex);
              if (policy) {
                if (p.base64.length !== policy.observedBase64Length || H(Buffer.from(p.base64)) !== policy.observedBase64Sha256) throw new Error('RECOVERY_OBSERVED');
                if (policy.recoveryClass === 'EXACT_COMMENT_ID_PREFIX_AND_NEXT_CHUNK_CROSSCHECK_ONLY') {
                  const accepted = p.base64.slice(0, k.length);
                  const trailing = p.base64.slice(k.length);
                  if (k.length !== policy.acceptedPrefixLength ||
                      k.sha256 !== policy.acceptedPrefixSha256 ||
                      accepted.length !== k.length ||
                      H(Buffer.from(accepted)) !== k.sha256 ||
                      trailing.length !== policy.trailingLength ||
                      H(Buffer.from(trailing)) !== policy.trailingSha256) throw new Error('RECOVERY_PREFIX');
                  records.push({k, base64: accepted, trailing, policy});
                } else if (policy.recoveryClass === 'EXACT_COMMENT_ID_SINGLE_CHARACTER_SUBSTITUTION_ONLY') {
                  if (!Number.isInteger(policy.substitutionIndex) ||
                      policy.substitutionIndex < 0 ||
                      policy.substitutionIndex >= p.base64.length ||
                      typeof policy.observedCharacter !== 'string' ||
                      policy.observedCharacter.length !== 1 ||
                      typeof policy.correctedCharacter !== 'string' ||
                      policy.correctedCharacter.length !== 1 ||
                      p.base64[policy.substitutionIndex] !== policy.observedCharacter) throw new Error('RECOVERY_SUBSTITUTION_IDENTITY');
                  const corrected = p.base64.slice(0, policy.substitutionIndex) +
                    policy.correctedCharacter +
                    p.base64.slice(policy.substitutionIndex + 1);
                  if (policy.correctedBase64Length !== k.length ||
                      policy.correctedBase64Sha256 !== k.sha256 ||
                      corrected.length !== k.length ||
                      H(Buffer.from(corrected)) !== k.sha256) throw new Error('RECOVERY_SUBSTITUTION_RESULT');
                  records.push({k, base64: corrected, trailing: null, policy});
                } else {
                  throw new Error('RECOVERY_CLASS');
                }
              } else {
                if (p.base64.length !== k.length || H(Buffer.from(p.base64)) !== k.sha256) throw new Error('CHUNK');
                records.push({k, base64: p.base64, trailing: null, policy: null});
              }
            }
            for (const r of records) {
              if (r.policy?.recoveryClass !== 'EXACT_COMMENT_ID_PREFIX_AND_NEXT_CHUNK_CROSSCHECK_ONLY') continue;
              const next = records.find(x => x.k.chunkIndex === r.policy.trailingMustEqualChunkIndex);
              if (!next || r.trailing !== next.base64.slice(0, r.policy.trailingMustEqualPrefixLength)) throw new Error('RECOVERY_CROSSCHECK');
            }
            const encoded = records.map(r => r.base64).join('');
            const zip = Buffer.from(encoded, 'base64');
            if (encoded.length !== c.exactZip.base64Length || zip.length !== c.exactZip.size || H(zip) !== c.exactZip.sha256) throw new Error('ZIP');
            const zipPath = path.join(os.tmpdir(), 'methods-adoption-review.zip');
            fs.writeFileSync(zipPath, zip);
            const docs = new Map();
            for (const name of c.expectedZipMembers) {
              const r = spawnSync('unzip', ['-p', zipPath, name], {encoding: null});
              if (r.error || r.status !== 0) throw new Error(`UNZIP_${name}`);
              docs.set(name, Buffer.from(r.stdout));
            }
            const manifest = JSON.parse(docs.get('review-package.v1.json'));
            if (manifest.packageFingerprintSha256 !== f) throw new Error('MANIFEST');
            for (const x of manifest.files) {
              const b = docs.get(x.path);
              if (!b || b.length !== x.size || H(b) !== x.sha256) throw new Error(`FILE_${x.path}`);
            }
            for (const [source, destination] of Object.entries(c.destinationMap)) {
              fs.mkdirSync(path.dirname(destination), {recursive: true});
              fs.writeFileSync(destination, docs.get(source));
            }
            const q = await get('https://api.github.com/repos/smansfield635-create/smansfield635-create.github.io/issues/comments/5187885715');
            const marker = 'METHODS_GENERATION_58_WORKFLOW_CARRIER_V1\n';
            if (q.id !== 5187885715 || typeof q.body !== 'string' || !q.body.startsWith(marker)) throw new Error('P0_COMMENT');
            const p = JSON.parse(q.body.slice(marker.length));
            const b = Buffer.from(p.base64, 'base64');
            if (p.sha256 !== 'e7cd206fd90ffdd005cbd0f01048792c3d178faa10e353df1a7bb1e856a14686' ||
                p.size !== b.length ||
                H(b) !== p.sha256) throw new Error('P0');
            fs.mkdirSync(path.dirname(process.env.P0), {recursive: true});
            fs.writeFileSync(process.env.P0, b);
            const adoption = JSON.parse(fs.readFileSync(c.destinationMap['adoption-register.v1.json'], 'utf8'));
            if (adoption.entries?.length !== 27 ||
                adoption.counts?.total !== 27 ||
                adoption.sourceBinding?.role6State !== 'INACTIVE' ||
                adoption.sourceBinding?.role6Reopened !== false) throw new Error('BOUNDARY');
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add "$P0" control-plane/methods-information-benchmark/adoption-and-page-translation-v1/{adoption-register.v1.json,page-translation-model.v1.json,rolodex-information-map.v1.json,review-summary.v1.json,review-package.v1.json}
          git commit -m 'Materialize exact Methods adoption translation package'
          test "$(git diff --name-only "$BASE..HEAD" | wc -l)" -eq 7
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - id: head
        run: echo "head=$(git rev-parse HEAD^{commit})" >> "$GITHUB_OUTPUT"

  package:
    needs: materialize
    strategy:
      matrix:
        lane: [builder, verifier]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.materialize.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - run: node "$VERIFIER" --mode package --base-head "$BASE" --candidate-head "${{ needs.materialize.outputs.head }}" --holder "GITHUB_ACTIONS_METHODS_PACKAGE_${{ matrix.lane }}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" --output "$RUNNER_TEMP/${{ matrix.lane }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: methods-package-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ matrix.lane }}.json

  close58:
    needs: [materialize, package]
    runs-on: ubuntu-24.04
    outputs:
      head: ${{ steps.head.outputs.head }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.materialize.outputs.head }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: methods-package-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package
          merge-multiple: true
      - name: Verify core, close generation 58, and commit receipts
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const b = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/package/builder.json'));
          const v = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/package/verifier.json'));
          if (b.holder === v.holder ||
              b.result !== 'PASS_MATERIALIZATION_CORE_BYTES_EXACT' ||
              v.result !== b.result ||
              b.sourcePackageFingerprintSha256 !== process.env.FINGERPRINT ||
              b.repositoryFingerprint !== v.repositoryFingerprint ||
              b.verifierRepairPerformed ||
              v.verifierRepairPerformed) process.exit(1);
          NODE
          node tools/operation-intake/repository-operation-lock-manager.v1.mjs \
            --action close \
            --repository "$REPOSITORY" \
            --operation-id "$G58_OPERATION" \
            --lock-scope "$G58_SCOPE" \
            --lock-generation 58 \
            --terminal-disposition PASS_CLOSED \
            --output "$RUNNER_TEMP/g58.json"
          mkdir -p "$(dirname "$IREC")"
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const sort = v => Array.isArray(v) ? v.map(sort) : v && typeof v === 'object' ? Object.fromEntries(Object.keys(v).sort().map(k => [k, sort(v[k])])) : v;
          const H = b => crypto.createHash('sha256').update(b).digest('hex');
          const bt = fs.readFileSync(process.env.RUNNER_TEMP + '/package/builder.json');
          const vt = fs.readFileSync(process.env.RUNNER_TEMP + '/package/verifier.json');
          const b = JSON.parse(bt);
          const v = JSON.parse(vt);
          const c = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/g58.json'));
          if (c.result !== 'TERMINAL_CLOSURE_COMMITTED' || c.lockGeneration !== 58 || c.terminalDisposition !== 'PASS_CLOSED') process.exit(1);
          const common = {
            operationId: process.env.G58_OPERATION,
            lockGeneration: 58,
            sourcePackageFingerprintSha256: process.env.FINGERPRINT,
            repositoryFingerprintSha256: b.repositoryFingerprint,
            role6State: 'INACTIVE',
            reviewRepeated: false,
            packageRegenerated: false,
            publicMethodsMutation: 'NONE',
            publicLawsMutation: 'NONE',
            implementation: 'NONE',
            deployment: 'NONE',
            release: 'NONE'
          };
          const independent = sort({
            schema: 'METHODS_AND_MODELS_ADOPTION_REVIEW_VERIFICATION_RECEIPT_v1',
            result: 'PASS_INDEPENDENT_REPOSITORY_REPRODUCTION',
            ...common,
            candidateHeadBeforeCommandReceipts: '${{ needs.materialize.outputs.head }}',
            builderHolder: b.holder,
            verifierHolder: v.holder,
            builderReceiptSha256: H(bt),
            verifierReceiptSha256: H(vt),
            distinctExecutionHolders: true,
            verifierRepairPerformed: false
          });
          const closure = sort({
            schema: 'METHODS_AND_MODELS_ADOPTION_REVIEW_OPERATION_CLOSURE_RECEIPT_v1',
            result: 'PASS_CLOSED',
            ...common,
            canonicalGeneration58ClosureReceipt: c,
            role6Reopened: false
          });
          fs.writeFileSync(process.env.IREC, JSON.stringify(independent, null, 2) + '\n');
          fs.writeFileSync(process.env.CREC, JSON.stringify(closure, null, 2) + '\n');
          NODE
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add "$IREC" "$CREC"
          git commit -m 'Close Methods adoption translation generation 58'
          test "$(git diff --name-only "$BASE..HEAD" | wc -l)" -eq 9
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - id: head
        run: echo "head=$(git rev-parse HEAD^{commit})" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: methods-generation-58-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g58.json

  final:
    needs: close58
    strategy:
      matrix:
        lane: [builder, verifier]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.close58.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - run: node "$VERIFIER" --mode final --base-head "$BASE" --candidate-head "${{ needs.close58.outputs.head }}" --holder "GITHUB_ACTIONS_METHODS_FINAL_${{ matrix.lane }}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" --output "$RUNNER_TEMP/${{ matrix.lane }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: methods-final-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ matrix.lane }}.json

  close64:
    needs: [close58, final]
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.close58.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: methods-final-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final
          merge-multiple: true
      - name: Verify final state and close generation 64
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const b = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/final/builder.json'));
          const v = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/final/verifier.json'));
          if (b.holder === v.holder ||
              b.result !== 'PASS_FINAL_REPOSITORY_PACKAGE_AND_GENERATION58_CLOSURE' ||
              v.result !== b.result ||
              b.repositoryFingerprint !== v.repositoryFingerprint ||
              b.sourcePackageFingerprintSha256 !== process.env.FINGERPRINT ||
              b.verifierRepairPerformed ||
              v.verifierRepairPerformed ||
              !b.generation58Closed ||
              !v.generation58Closed) process.exit(1);
          NODE
          node tools/operation-intake/repository-operation-lock-manager.v1.mjs \
            --action close \
            --repository "$REPOSITORY" \
            --operation-id "$G64_OPERATION" \
            --lock-scope "$G64_SCOPE" \
            --lock-generation 64 \
            --terminal-disposition PASS_CLOSED \
            --output "$RUNNER_TEMP/g64.json"
          node -e "const r=require(process.env.RUNNER_TEMP + '/g64.json'); if(r.result!=='TERMINAL_CLOSURE_COMMITTED'||r.lockGeneration!==64||r.terminalDisposition!=='PASS_CLOSED') process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: methods-materialization-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g64.json
