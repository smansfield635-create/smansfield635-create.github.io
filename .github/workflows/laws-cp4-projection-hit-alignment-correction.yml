name: Laws CP4 Projection Hit Alignment Correction

on:
  push:
    branches:
      - agent/laws-six-node-cp4-browser-verification-001
    paths:
      - .github/workflows/laws-cp4-projection-hit-alignment-correction.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: laws-cp4-projection-hit-alignment-correction
  cancel-in-progress: false

jobs:
  apply-bounded-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact Laws candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/laws-fifth-test-star-reversible-admissibility-cp1-001
          fetch-depth: 0

      - name: Verify exact Checkpoint 3 source custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8607693d75fffed5a8a85c42b8fdc28fff0b0554"
          test "$(git hash-object laws/index.interactions.js)" = "1325aa7899a48516362dec9761160a14ed62ae26"
          test -z "$(git status --short --untracked-files=all)"

      - name: Apply live-projection offset reset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('laws/index.interactions.js')
          source = path.read_text()
          old = 'Object.assign(el.style,{position:"absolute",left:`${r.x}px`,top:`${r.y}px`,width:`${z*2}px`,height:`${z*2}px`,margin:"0",transform:"translate(-50%, -50%)",pointerEvents:p>P.OFF?"auto":"none"});'
          new = 'Object.assign(el.style,{position:"absolute",left:`${r.x}px`,top:`${r.y}px`,right:"auto",bottom:"auto",width:`${z*2}px`,height:`${z*2}px`,margin:"0",transform:"translate(-50%, -50%)",pointerEvents:p>P.OFF?"auto":"none"});'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'CP4_ALIGNMENT_PATCH_ANCHOR_INVALID:{count}')
          path.write_text(source.replace(old, new, 1))
          print('CP4_LIVE_PROJECTION_OFFSET_RESET=APPLIED')
          PY

      - name: Validate bounded correction
        shell: bash
        run: |
          set -euo pipefail
          node --check laws/index.interactions.js
          grep -Fq 'right:"auto",bottom:"auto"' laws/index.interactions.js
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only)" = "laws/index.interactions.js"
          git diff -- laws/index.interactions.js

      - name: Commit corrected Checkpoint 4 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add laws/index.interactions.js
          git commit -m "Align Laws semantic hit targets with live projections"
          git push origin HEAD:agent/laws-fifth-test-star-reversible-admissibility-cp1-001
          echo "CORRECTED_CANDIDATE_HEAD=$(git rev-parse HEAD)"
          echo "CORRECTED_INTERACTIONS_BLOB=$(git hash-object laws/index.interactions.js)"
