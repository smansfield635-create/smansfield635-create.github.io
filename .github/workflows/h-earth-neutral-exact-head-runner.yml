          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const manifestBytes=fs.readFileSync(manifestPath);
          const m=JSON.parse(manifestBytes.toString('utf8'));
          const compressed=fs.readFileSync(compressedPath);
          const loader=fs.readFileSync(loaderPath,'utf8');
          assert.equal(m.schema,'H_EARTH_PRECOMPUTED_GRASS_v1');
          assert.equal(m.rootCount,2879698);
          assert.equal(m.stride,52);
          assert.equal(m.rawBytes,149854888);
          assert.equal(m.compressedBytes,65030739);
          assert.equal(m.habitat.width,576);
          assert.equal(m.habitat.height,192);
          assert.equal(m.rawBytes,m.rootCount*m.stride+m.habitat.width*m.habitat.height);
          assert.equal(m.receipt.contactCount,m.rootCount);
          assert.equal(m.tiles.length,8303);
          assert.equal(m.tiles.reduce((n,t)=>n+t.count,0),m.rootCount);
          assert(m.tiles.every(t=>Number.isInteger(t.count)&&t.count>=0&&t.count<=1600));
          assert.equal(sha(manifestBytes),'b89713280767ad083d4b2deadafebc7f296300fd84c6677f4e5d7f14a2010b9c');
          assert.equal(compressed.byteLength,m.compressedBytes);
          assert.equal(sha(compressed),'03dc3b07e53d8425d4a3e29e32d6511bdc4cddcb30ea5a2e27ca78c8e5cc2851');
          assert.equal(m.compressedSha256,'03dc3b07e53d8425d4a3e29e32d6511bdc4cddcb30ea5a2e27ca78c8e5cc2851');
          assert.equal(m.rawSha256,'351c8a09bce94af2c022303a4b86f303e991a1db291e393b780b5ae5773f9728');
