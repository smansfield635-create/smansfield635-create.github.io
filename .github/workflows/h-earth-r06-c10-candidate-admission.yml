name: H-Earth R06 C10 Exact Candidate Admission

on:
  workflow_dispatch:
    inputs:
      candidate_head:
        description: Exact 40-character candidate commit SHA
        required: true
        type: string
      governing_head:
        description: Governing commit or ref containing the unchanged admission authority
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  exact-candidate-admission:
    runs-on: ubuntu-latest
    steps:
      - name: Check out governing authority
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.governing_head }}
          fetch-depth: 0

      - name: Validate exact inputs
        shell: bash
        env:
          CANDIDATE_HEAD: ${{ inputs.candidate_head }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          git rev-parse "${CANDIDATE_HEAD}^{commit}"
          git status --porcelain=v1 --untracked-files=all | grep -q . && exit 1 || true

      - name: Execute repository-declared admission gate
        id: gate
        shell: bash
        env:
          CANDIDATE_HEAD: ${{ inputs.candidate_head }}
        run: |
          set +e
          mkdir -p /tmp/h-earth-r06-c10-admission
          node h-earth-3d/validation/h-earth.r06-c10.exact-candidate-admission-gate.v1.mjs \
            --candidate "$CANDIDATE_HEAD" \
            --output /tmp/h-earth-r06-c10-admission/gate-receipt.json
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Bind workflow execution identity
        if: always()
        shell: bash
        env:
          CANDIDATE_HEAD: ${{ inputs.candidate_head }}
          GOVERNING_HEAD_INPUT: ${{ inputs.governing_head }}
          GATE_EXIT_CODE: ${{ steps.gate.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          out = pathlib.Path('/tmp/h-earth-r06-c10-admission/workflow-binding.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          record = {
              "schema": "H_EARTH_R06_C10_CANDIDATE_ADMISSION_WORKFLOW_BINDING_v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
              "workflowRunAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "workflowJob": os.environ["GITHUB_JOB"],
              "governingHeadInput": os.environ["GOVERNING_HEAD_INPUT"],
              "governingHeadResolved": git("rev-parse", "HEAD^{commit}"),
              "candidateHead": os.environ["CANDIDATE_HEAD"],
              "gateExitCode": int(os.environ.get("GATE_EXIT_CODE") or 1),
              "manualMetadataReconstructionUsed": False
          }
          out.write_text(json.dumps(record, indent=2) + "\n")
          PY

      - name: Upload command-emitted admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-r06-c10-candidate-admission-receipt
          path: /tmp/h-earth-r06-c10-admission/
          if-no-files-found: error
          retention-days: 90

      - name: Preserve fail-closed gate conclusion
        if: always()
        shell: bash
        env:
          GATE_EXIT_CODE: ${{ steps.gate.outputs.exit_code }}
        run: |
          test "${GATE_EXIT_CODE:-1}" -eq 0
