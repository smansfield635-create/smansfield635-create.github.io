name: Compass Masterplan Browser Qualification
on:
  pull_request:
    branches: [main]
    paths:
      - 'compass-masterplan/**'
      - '.github/workflows/compass-rebuild-browser-qualification.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Serve candidate tree
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/compass-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/compass-masterplan/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/compass-http.log; exit 1
      - name: Browser qualify masterplan states
        run: |
          cat >.compass-masterplan-qualify.mjs <<'NODE'
          import { chromium } from 'playwright'; import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1024,height:1366},deviceScaleFactor:1});
          const consoleErrors=[],pageErrors=[],failed=[];
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())}); page.on('pageerror',e=>pageErrors.push(String(e))); page.on('requestfailed',r=>failed.push({url:r.url(),failure:r.failure()?.errorText||''}));
          const response=await page.goto('http://127.0.0.1:8080/compass-masterplan/',{waitUntil:'domcontentloaded',timeout:120000});
          await page.waitForFunction(()=>['PASS','FAIL'].includes(document.querySelector('[data-compass-root]')?.dataset.masterplanRuntime||''),{timeout:30000}); await page.waitForTimeout(700);
          const snap=()=>page.evaluate(()=>{const box=el=>{const r=el?.getBoundingClientRect(),s=el?getComputedStyle(el):null;return {w:r?.width||0,h:r?.height||0,x:r?.x||0,y:r?.y||0,display:s?.display||'',visibility:s?.visibility||'',opacity:s?.opacity||''}};const root=document.querySelector('[data-compass-root]'),scene=document.querySelector('[data-compass-scene]');const labels=[...document.querySelectorAll('.mp-nav-star__label')].filter(el=>!el.hidden&&getComputedStyle(el).display!=='none'&&getComputedStyle(el).visibility!=='hidden');const routes=document.querySelector('[data-compass-mirrorland-routes]');return {runtime:root?.dataset.masterplanRuntime||'',mode:root?.dataset.compassMode||'',scene:box(scene),controller:globalThis.DGB_COMPASS_CONTROLLER_RECEIPT||{},renderer:globalThis.DGB_MASTERPLAN_COMPASS_RENDERER?.getState?.()||{},cardinals:document.querySelectorAll('[data-compass-cardinal]').length,rooms:document.querySelectorAll('[data-compass-room-declarations] [data-compass-room]').length,visibleLabels:labels.map(x=>x.innerText.trim()),visualStars:document.querySelectorAll('.mp-nav-star').length,introOpen:document.querySelector('.mp-intro')?.open===true,statementCount:document.querySelectorAll('[data-statement-item]').length,objectCarousels:document.querySelectorAll('[data-carousel-name="objects"]').length,readinessCarousels:document.querySelectorAll('[data-carousel-name="readiness"]').length,objectTabs:[...document.querySelectorAll('[data-carousel-name="objects"] [data-carousel-tab]')].map(x=>x.textContent.trim()),readinessTabs:[...document.querySelectorAll('[data-carousel-name="readiness"] [data-carousel-tab]')].map(x=>x.textContent.trim()),mirrorRoutes:[...document.querySelectorAll('[data-compass-mirrorland-routes] a')].map(x=>x.textContent.trim()),mirrorRoutesVisible:routes?(!routes.hidden&&getComputedStyle(routes).display!=='none'):false,legacyProof:document.querySelectorAll('.compass-built,[data-proof-orbit],.compass-capability-cue').length,brainCanvas:document.querySelectorAll('[data-compass-brain] canvas').length}});
          const before=await snap(); await page.screenshot({path:'masterplan-01-constellation.png',fullPage:false});
          if(before.runtime!=='PASS'||before.cardinals!==4||before.rooms!==19||before.scene.w<300||before.scene.h<300) throw new Error('CORE_INVALID:'+JSON.stringify(before));
          if(before.visualStars!==4||before.visibleLabels.length!==1) throw new Error('CONSTELLATION_VISUAL_CONTRACT:'+JSON.stringify(before));
          if(before.statementCount!==3||before.objectCarousels!==1||before.readinessCarousels!==1||before.legacyProof!==0) throw new Error('PAGE_ARCHITECTURE_INVALID:'+JSON.stringify(before));
          if(before.objectTabs.join('|')!=='Trophy|House|Brain'||before.readinessTabs.join('|')!=='TRL|TRA') throw new Error('CAROUSEL_TABS_INVALID');
          const intro=page.locator('.mp-intro'); if(await intro.getAttribute('open')!==null) throw new Error('INTRO_NOT_COLLAPSED'); await intro.locator('summary').click(); await page.waitForTimeout(180); if(!(await snap()).introOpen) throw new Error('INTRO_DID_NOT_EXPAND');
          const opened=await page.evaluate(()=>globalThis.DGB_COMPASS_CONTROLLER?.requestCardinalSelection('north')); await page.waitForTimeout(450); const cluster=await snap(); await page.screenshot({path:'masterplan-02-cluster.png',fullPage:false}); if(opened!==true||cluster.mode!=='CLUSTER_OPEN'||cluster.visualStars!==5||cluster.visibleLabels.length!==1) throw new Error('CLUSTER_VISUAL_CONTRACT:'+JSON.stringify(cluster));
          await page.evaluate(()=>globalThis.DGB_COMPASS_CONTROLLER?.requestReturnToConstellation?.()); await page.waitForTimeout(250); const reveal=await page.evaluate(()=>globalThis.DGB_COMPASS_CONTROLLER?.requestMirrorlandReveal?.()); if(reveal!==true) throw new Error('MIRROR_REVEAL_REJECTED');
          await page.waitForFunction(()=>['MIRRORLAND_REVEALING','MIRRORLAND_FOCUSED'].includes(document.querySelector('[data-compass-root]')?.dataset.compassMode||''),{timeout:3000}); await page.waitForTimeout(1100); const mirror=await snap(); await page.screenshot({path:'masterplan-03-mirrorland.png',fullPage:false}); if(!['MIRRORLAND_REVEALING','MIRRORLAND_FOCUSED'].includes(mirror.mode)||mirror.mirrorRoutes.join('|')!=='Enter the Narrative|Enter the Demo|See the World Map|Return to Compass'||!mirror.mirrorRoutesVisible) throw new Error('MIRRORLAND_CONTRACT:'+JSON.stringify(mirror));
          await page.evaluate(()=>globalThis.DGB_COMPASS_CONTROLLER?.requestMirrorlandBack?.()); await page.waitForTimeout(700);
          const objectTabs=page.locator('[data-carousel-name="objects"] [data-carousel-tab]'); await objectTabs.nth(1).click(); if(await objectTabs.nth(1).getAttribute('aria-selected')!=='true') throw new Error('HOUSE_TAB_FAILED'); await objectTabs.nth(2).click(); await page.waitForTimeout(250); const brain=await snap(); if(brain.brainCanvas<1) throw new Error('BRAIN_NOT_MOUNTED');
          const readinessTabs=page.locator('[data-carousel-name="readiness"] [data-carousel-tab]'); await readinessTabs.nth(1).click(); if(await readinessTabs.nth(1).getAttribute('aria-selected')!=='true') throw new Error('TRA_TAB_FAILED'); await page.screenshot({path:'masterplan-04-lower.png',fullPage:true});
          const result={httpStatus:response?.status()||0,before,cluster,mirror,brain,consoleErrors,pageErrors,failed}; fs.writeFileSync('masterplan-qualification.json',JSON.stringify(result,null,2)+'\n'); console.log(JSON.stringify(result,null,2)); if(pageErrors.length)throw new Error('PAGE_ERRORS:'+JSON.stringify(pageErrors)); await browser.close();
          NODE
          node .compass-masterplan-qualify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-masterplan-browser-qualification
          path: |
            masterplan-qualification.json
            masterplan-01-constellation.png
            masterplan-02-cluster.png
            masterplan-03-mirrorland.png
            masterplan-04-lower.png
          if-no-files-found: ignore