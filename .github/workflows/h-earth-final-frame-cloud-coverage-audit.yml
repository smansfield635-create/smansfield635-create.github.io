name: H-Earth Final Screen Cloud Model Sweep

on:
  pull_request:
    branches:
      - agent/h-earth-multiscale-atmosphere-convergence-24055-20260821
    paths:
      - 'showroom/globe/audralia/**'
      - '.github/workflows/h-earth-final-frame-cloud-coverage-audit.yml'

permissions:
  contents: read

jobs:
  rendered-cloud-model-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4

      - name: Start repository-local inspection server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/h-earth-server.log 2>&1 &
          echo $! >/tmp/h-earth-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/showroom/globe/audralia/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/h-earth-server.log
          exit 1

      - name: Capture 60 final browser-composited cloud models
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo 'No Chrome/Chromium binary found on runner.' >&2
            exit 1
          fi
          mkdir -p /tmp/cloud-sweep
          : > /tmp/cloud-sweep/manifest.tsv
          for model in $(seq 1 60); do
            padded=$(printf '%02d' "$model")
            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --use-angle=swiftshader \
              --enable-unsafe-swiftshader \
              --ignore-gpu-blocklist \
              --hide-scrollbars \
              --window-size=1280,900 \
              --virtual-time-budget=9000 \
              --screenshot="/tmp/cloud-sweep/model-${padded}.png" \
              "http://127.0.0.1:4173/showroom/globe/audralia/?cloudModel=${model}&fap1Quality=capture" \
              >/tmp/cloud-sweep/model-${padded}.stdout 2>/tmp/cloud-sweep/model-${padded}.stderr || true
            if [ ! -s "/tmp/cloud-sweep/model-${padded}.png" ]; then
              echo "MODEL ${model} SCREENSHOT_MISSING" >&2
              exit 1
            fi
            bytes=$(stat -c%s "/tmp/cloud-sweep/model-${padded}.png")
            printf '%s\t%s\n' "$model" "$bytes" >> /tmp/cloud-sweep/manifest.tsv
          done
          test "$(find /tmp/cloud-sweep -name 'model-*.png' | wc -l)" -eq 60

      - name: Preserve final-screen sweep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-final-screen-cloud-model-sweep-60
          path: |
            /tmp/cloud-sweep/model-*.png
            /tmp/cloud-sweep/manifest.tsv
            /tmp/h-earth-server.log
          if-no-files-found: error
