name: H-Earth IMI Phase 3 DATASUS Hospital Completion

on:
  push:
    branches:
      - instrument/imi-empirical-platform-v1
    paths:
      - '.github/workflows/h-earth-imi-phase3-datasus-hospital-completion.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  datasus-hospital-completion:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true

      - name: Install frozen DATASUS access dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            pysus==2.7.0 \
            duckdb==1.5.4
          python - <<'PY'
          import duckdb
          import pysus
          print({
              'pysus': getattr(pysus, '__version__', '2.7.0'),
              'duckdb': duckdb.__version__,
          })
          PY

      - name: Execute frozen public DATASUS hospital replication
        run: |
          set -euo pipefail
          mkdir -p /tmp/imi-phase3-datasus-hospital
          node h-earth-3d/validation/imi-empirical-platform/imi.phase3.hospital-external-or-next-release.runner.mjs \
            --output-dir /tmp/imi-phase3-datasus-hospital \
            --clock 2026-08-05T21:50:00.000Z \
            2>&1 | tee /tmp/imi-phase3-datasus-hospital.log

      - name: Enforce hospital closure gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          path = '/tmp/imi-phase3-datasus-hospital/hospital-phase3-track-receipt.v1.json'
          receipt = json.load(open(path, encoding='utf-8'))
          assert receipt['minimumEvidenceSatisfied'] is True, receipt
          assert receipt['terminalDisposition'] == 'PASS_CLOSED_PUBLIC_NON_CMS_EXTERNAL_REPLICATION', receipt
          assert receipt['phase4Candidate'] is False, receipt
          assert receipt['boundaries']['routeRetuned'] is False, receipt
          assert receipt['boundaries']['nonCmsIndependentSource'] is True, receipt
          print(json.dumps({
              'result': 'PASS_PHASE_3_DATASUS_HOSPITAL_COMPLETION_GATE',
              'receiptDigest': receipt['receiptDigest'],
              'terminalDisposition': receipt['terminalDisposition'],
              'independentInstitutionCount': receipt['admission']['independentInstitutionCount'],
          }))
          PY

      - name: Upload DATASUS hospital completion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imi-phase3-datasus-hospital-completion
          path: |
            /tmp/imi-phase3-datasus-hospital.log
            /tmp/imi-phase3-datasus-hospital/**
          retention-days: 90
