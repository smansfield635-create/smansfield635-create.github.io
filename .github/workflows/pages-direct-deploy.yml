name: Direct GitHub Pages Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a --exclude '.git' --exclude '_site' ./ _site/
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('_site/index.html')
          text = path.read_text(encoding='utf-8')
          version = 'compass-performance-successor-v1'
          text = re.sub(r'<link rel="stylesheet" href="/assets/compass/compass(?:\\.carousel|\\.statement-carousel|\\.capability-carousel)\\.css\\?v=[^"]+">\\n?', '', text)
          text = re.sub(r'<script src="/assets/compass/compass(?:\\.carousel|\\.orbit-input|\\.statement-carousel|\\.brain-scene|\\.capability-carousel)\\.js\\?v=[^"]+" defer></script>\\n?', '', text)
          css = ''.join(f'<link rel="stylesheet" href="/assets/compass/{name}.css?v={version}">\\n' for name in ('compass.statement-carousel','compass.capability-carousel'))
          js = ''.join(f'<script src="/assets/compass/{name}.js?v={version}" defer></script>\\n' for name in ('compass.orbit-input','compass.statement-carousel','compass.brain-scene','compass.capability-carousel'))
          text = text.replace('</head>', f'{css}</head>', 1)
          text = text.replace('</body>', f'{js}</body>', 1)
          path.write_text(text, encoding='utf-8')
          assert text.count(version) == 6
          assert 'compass.carousel.js' not in text
          assert 'compass.carousel.css' not in text
          PY

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
