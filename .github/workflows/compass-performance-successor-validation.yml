name: Compass Gen1531 Crystal Invalidation Repair Transport

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/compass-performance-successor-validation.yml'

permissions:
  contents: write

env:
  REPAIR_PARENT: 2dd901bb112816f7f7123ecc2e54fec00ae95eb5

jobs:
  repair-crystal-invalidation:
    if: github.head_ref == 'compass-gen1531-mirrorland-crystal-scheduling'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify repair parent and workflow-only staging
        run: |
          git merge-base --is-ancestor "$REPAIR_PARENT" HEAD
          test "$(git diff --name-only "$REPAIR_PARENT" HEAD)" = '.github/workflows/compass-performance-successor-validation.yml'
          git diff --quiet "$REPAIR_PARENT" HEAD -- assets/compass/compass.crystals.js
      - name: Deduplicate controller invalidation and push product only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('assets/compass/compass.crystals.js')
          s=p.read_text()
          pattern=r'''  function bindRenderInvalidation\(\) \{.*?\n  \}\n\n  function unbindRenderInvalidation\(\) \{'''
          replacement='''  function bindRenderInvalidation() {\n    if (state.renderInvalidationBound || !state.root) return;\n    state.renderInvalidationBound = true;\n\n    const watchedAttributes = [\n      "data-compass-mode",\n      "data-orbit-focus",\n      "data-orbit-preview-focus",\n      "data-orbit-phase",\n      "data-orbit-gesture-active",\n      "data-orbit-quaternion",\n      "data-active-cluster-wing",\n      "data-cluster-quaternion",\n      "data-cluster-primary-room",\n      "data-cluster-preview-primary-room",\n      "data-cluster-phase",\n      "data-cluster-gesture-active",\n      "data-cluster-revision",\n      "data-selected-cardinal",\n      "data-selected-room",\n      "data-selected-destination-type",\n      "data-selected-destination-id",\n      "data-selected-destination-label",\n      "data-selected-route",\n      "data-reduced-motion",\n      "data-compass-prominence",\n      "data-window-prominence"\n    ];\n\n    const invalidationSignature = () =>\n      watchedAttributes\n        .map(name => `${name}:${state.root.getAttribute(name) || ""}`)\n        .join("|");\n\n    let lastInvalidationSignature =\n      invalidationSignature();\n\n    if (typeof MutationObserver === "function") {\n      state.renderObserver = new MutationObserver(() => {\n        const nextInvalidationSignature =\n          invalidationSignature();\n\n        if (nextInvalidationSignature === lastInvalidationSignature) {\n          return;\n        }\n\n        lastInvalidationSignature =\n          nextInvalidationSignature;\n\n        requestRender();\n      });\n\n      state.renderObserver.observe(\n        state.root,\n        {\n          attributes: true,\n          attributeFilter: watchedAttributes\n        }\n      );\n    }\n\n    globalThis.addEventListener(\n      "resize",\n      requestRender,\n      { passive: true }\n    );\n  }\n\n  function unbindRenderInvalidation() {'''
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'bindRenderInvalidation replacement count={n}')
          p.write_text(s2)
          PY
          node --check assets/compass/compass.crystals.js
          test "$(git diff --name-only | sort)" = 'assets/compass/compass.crystals.js'
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/compass/compass.crystals.js
          git commit -m 'Deduplicate Compass crystal render invalidation'
          git push origin HEAD:${{ github.head_ref }}
