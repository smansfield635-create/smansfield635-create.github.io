name: Mirror Manor Cache Identity Repair
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: mirror-manor-cache-identity-repair
  cancel-in-progress: true
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Synchronize recursive content identities
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD^{commit})"
          base="$(git rev-parse HEAD^1)"
          node .github/ai-router/platform/post-merge-cache-identity-sync.v1.mjs --self-test
          CACHE_IDENTITY_BASE="$base" CACHE_IDENTITY_HEAD="$head" CACHE_IDENTITY_RECEIPT=/tmp/manor-cache-identity.json node .github/ai-router/platform/post-merge-cache-identity-sync.v1.mjs
          if git diff --quiet; then
            echo "No cache identity changes required."
            exit 0
          fi
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.html' '*.css' '*.js' '*.mjs'
          git commit -m "chore(delivery): synchronize Mirror Manor carousel cache identities"
          git push origin HEAD:main
      - name: Upload repair receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirror-manor-cache-identity-repair
          path: /tmp/manor-cache-identity.json
          if-no-files-found: warn
