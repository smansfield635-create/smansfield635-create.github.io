name: Laws CP6 direct language and hierarchy

on:
  pull_request:
    paths:
      - 'laws/**'
      - 'tools/laws-cp6-direct-language-hierarchy-*.mjs'
      - 'tools/laws-cp6-first-css-cache-bust.mjs'
      - '.github/workflows/laws-cp6-direct-language-hierarchy.yml'

permissions:
  contents: write

jobs:
  correct-and-verify:
    if: github.head_ref == 'agent/laws-cp6-first-css-cache-bust-001'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Apply bounded CSS cache bust
        run: node tools/laws-cp6-first-css-cache-bust.mjs

      - name: Commit exact product mutation locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add laws/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Bust Laws CP6 F.I.R.S.T. stylesheet cache"
          fi

      - name: Verify cache-key contract
        run: |
          node --check tools/laws-cp6-first-css-cache-bust.mjs
          grep -Fq '/laws/index.css?v=LAWS_CP6_DIRECT_FIRST_HIERARCHY_20260801B' laws/index.html
          ! grep -Fq '/laws/index.css?v=LAWS_CELESTIAL_GATEWAY_AUXILIARY_CLUSTERS_20260729A' laws/index.html

      - name: Install browser verifier
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve candidate
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/laws-cp6-cache-server.log 2>&1 &
          echo $! > /tmp/laws-cp6-cache-server.pid
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173/laws/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/laws-cp6-cache-server.log
          exit 1

      - name: Verify phone tablet and desktop hierarchy
        env:
          BASE_URL: http://127.0.0.1:4173
          EVIDENCE_DIR: cp6-cache-evidence
        run: node tools/laws-cp6-direct-language-hierarchy-verify.mjs browser

      - name: Verify F.I.R.S.T. CSS actually applies
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          await page.goto('http://127.0.0.1:4173/laws/', { waitUntil: 'networkidle' });
          const href = await page.locator('link[data-laws-page-css]').getAttribute('href');
          if (!href?.includes('LAWS_CP6_DIRECT_FIRST_HIERARCHY_20260801B')) throw new Error(`Wrong stylesheet href: ${href}`);
          await page.locator('[data-laws-first-disclosure] summary').click();
          const style = await page.locator('.laws-first__question-grid article').first().evaluate((el) => {
            const card = getComputedStyle(el);
            const grid = getComputedStyle(el.parentElement);
            return {
              gridDisplay: grid.display,
              borderStyle: card.borderStyle,
              borderRadius: card.borderRadius,
              backgroundColor: card.backgroundColor,
              fontSize: card.fontSize
            };
          });
          if (style.gridDisplay !== 'grid') throw new Error(`Question grid is not styled: ${JSON.stringify(style)}`);
          if (style.borderStyle === 'none' || style.borderRadius === '0px') throw new Error(`Question cards are not styled: ${JSON.stringify(style)}`);
          if (style.backgroundColor === 'rgba(0, 0, 0, 0)') throw new Error(`Question card background missing: ${JSON.stringify(style)}`);
          console.log(JSON.stringify({ href, style }, null, 2));
          await browser.close();
          NODE

      - name: Upload cache-bust evidence
        uses: actions/upload-artifact@v4
        with:
          name: laws-cp6-first-css-cache-bust
          path: cp6-cache-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Publish verified cache-bust head
        run: git push origin HEAD:${{ github.head_ref }}
