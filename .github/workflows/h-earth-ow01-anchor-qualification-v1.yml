name: H-Earth OW01 Anchor Qualification v1

on:
  push:
    branches:
      - control-plane-delivery/h-earth-ow01-public-product-20260814-014

permissions:
  contents: write

jobs:
  qualify:
    if: ${{ !contains(github.event.head_commit.message, '[anchor evidence]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_HEAD: 0c834c7135dc78890ef5b77af6895e9cbdb9942c
      PRODUCT_BLOB: 272b3a8c0ef547646e674d0ad1ec2e2bca4a820a
      BASE_HEAD: aefb54971ae0f91a9abf9e8fc8e588f82f3a5744
      ANCHOR_SHA256: 7757fb4fe731456b3058ec595369133f5c2136c99b282eb6b4df108600bca573
      ROUTE: /showroom/globe/h-earth/
      EVIDENCE_STEM: h-earth-3d/experience-anchor/evidence/OW01_GRATITUDE_COASTAL_ENTRY_20260815_001
      RECEIPT_PATH: h-earth-3d/experience-anchor/receipts/OW01_GRATITUDE_COASTAL_ENTRY_20260815_001.json
    steps:
      - name: Checkout exact qualification candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify product bytes remain frozen
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object h-earth-3d/terrain/h-earth.terrain-field.js)" = "$PRODUCT_BLOB"
          while IFS= read -r changed; do
            case "$changed" in
              .github/workflows/h-earth-ow01-anchor-qualification-v1.yml) ;;
              h-earth-3d/experience-anchor/evidence/OW01_GRATITUDE_COASTAL_ENTRY_20260815_001.*) ;;
              h-earth-3d/experience-anchor/receipts/OW01_GRATITUDE_COASTAL_ENTRY_20260815_001.json) ;;
              *) echo "UNAUTHORIZED_POST_PRODUCT_PATH:$changed" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$PRODUCT_HEAD"...HEAD | sort)
          git cat-file -e "$BASE_HEAD^{commit}"
          git cat-file -e "$PRODUCT_HEAD^{commit}"
      - name: Materialize exact baseline worktree
        run: git worktree add --detach /tmp/h-earth-ow01-base "$BASE_HEAD"
      - name: Install bounded browser harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/h-earth-ow01-browser
          npm --prefix /tmp/h-earth-ow01-browser init -y >/dev/null
          npm --prefix /tmp/h-earth-ow01-browser install playwright@1.55.0 >/dev/null
          /tmp/h-earth-ow01-browser/node_modules/.bin/playwright install --with-deps chromium >/dev/null
      - name: Serve base and candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" >/tmp/ow01-candidate-server.log 2>&1 &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/h-earth-ow01-base >/tmp/ow01-base-server.log 2>&1 &
          for port in 4173 4174; do
            for attempt in $(seq 1 60); do
              curl -fsS "http://127.0.0.1:$port$ROUTE" >/dev/null && break
              sleep 1
            done
            curl -fsS "http://127.0.0.1:$port$ROUTE" >/dev/null
          done
      - name: Capture exact base candidate and anchor
        id: capture
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/h-earth-ow01-browser/qualify.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs'; import crypto from 'node:crypto'; import path from 'node:path';
          const workspace=process.env.GITHUB_WORKSPACE;
          const stem=path.join(workspace,process.env.EVIDENCE_STEM);
          fs.mkdirSync(path.dirname(stem),{recursive:true});
          const digest=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          async function capture(label,port){
            const context=await browser.newContext({viewport:{width:1440,height:900},hasTouch:true,isMobile:false});
            const page=await context.newPage(); const pageErrors=[]; const consoleErrors=[]; const requestFailures=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error'&&!/favicon/i.test(m.text()))consoleErrors.push(m.text())});
            page.on('requestfailed',r=>requestFailures.push(`${r.url()} :: ${r.failure()?.errorText??'unknown'}`));
            let response=null, interactionExercised=false, beforeGesture=null, afterGesture=null, captureError=null, r2PackageDiagnostic=null, vegetationDiagnostic=null;
            try{
              response=await page.goto(`http://127.0.0.1:${port}${process.env.ROUTE}`,{waitUntil:'commit',timeout:60000});
              await page.waitForLoadState('domcontentloaded',{timeout:30000}).catch(()=>{}); await page.waitForTimeout(5000);
              vegetationDiagnostic=await page.evaluate(async()=>{
                try{
                  const mod=await import('/h-earth-3d/environment/h-earth.vegetation-resolution.run8d.js');
                  const resolution=mod.buildHEarthRun8DVegetationResolution();
                  return {ok:true,eligible:resolution?.eligible??null,status:resolution?.status??null,instanceCount:resolution?.instanceCount??null,archetypeCounts:resolution?.archetypeCounts??null,populationInstanceCount:resolution?.populationPlan?.instanceCount??null,speciesCounts:resolution?.populationPlan?.speciesCounts??null,issues:resolution?.issues??null,instances:(resolution?.instances??[]).map(i=>({sourcePopulationInstanceId:i.sourcePopulationInstanceId,speciesId:i.speciesId,sourceInstanceClass:i.sourceInstanceClass,archetypeId:i.archetypeId,worldAnchor:i.worldAnchor,biomeClass:i.biomeClass,surfaceClass:i.surfaceClass}))};
                }catch(error){return {ok:false,error:String(error?.stack||error)}}
              });
              if(label==='candidate'){
                r2PackageDiagnostic=await page.evaluate(async()=>{
                  try{
                    const mod=await import('/showroom/globe/h-earth/render/live-render-package.run8e-r2.js');
                    const record=mod.buildHEarthRun8ER2ImmutableLiveRenderPackage();
                    return {ok:true,eligible:record?.eligible??null,status:record?.status??null,contractId:record?.contractId??null,issues:Array.isArray(record?.issues)?record.issues:null,primitiveCount:record?.primitiveCount??null,triangleCount:record?.triangleCount??null,indexCount:record?.indexCount??null,vertexCount:record?.vertexCount??null,sourceAuthorities:record?.sourceAuthorities??null};
                  }catch(error){return {ok:false,error:String(error?.stack||error)}}
                });
              }
              const canvases=page.locator('canvas'); const count=await canvases.count();
              beforeGesture=await page.evaluate(()=>document.querySelector('[data-gesture-used]')?.getAttribute('data-gesture-used')??null);
              let best=null;
              for(let i=0;i<count;i++){const box=await canvases.nth(i).boundingBox(); if(box&&(!best||box.width*box.height>best.box.width*best.box.height))best={index:i,box};}
              if(best){const x=best.box.x+best.box.width*.52,y=best.box.y+best.box.height*.52;await page.mouse.move(x,y);await page.mouse.down();await page.mouse.move(x+80,y-20,{steps:6});await page.mouse.up();await page.mouse.wheel(0,-240);await page.waitForTimeout(700);interactionExercised=true;}
              afterGesture=await page.evaluate(()=>document.querySelector('[data-gesture-used]')?.getAttribute('data-gesture-used')??null);
            }catch(e){captureError=String(e?.stack||e);}
            const screenshot=`${stem}.${label}.png`;
            try{await page.screenshot({path:screenshot,fullPage:false,timeout:30000});}catch(e){captureError=(captureError?captureError+' | ':'')+String(e?.stack||e);}
            const out={label,status:response?.status()??null,title:await page.title().catch(()=>''),url:page.url(),canvasCount:await page.locator('canvas').count().catch(()=>0),interactionExercised,beforeGesture,afterGesture,pageErrors,consoleErrors,requestFailures,captureError,r2PackageDiagnostic,vegetationDiagnostic,screenshotSha256:fs.existsSync(screenshot)?digest(screenshot):null,screenshotBytes:fs.existsSync(screenshot)?fs.statSync(screenshot).size:0};
            await context.close(); return out;
          }
          const base=await capture('base',4174); const candidate=await capture('candidate',4173);
          const context=await browser.newContext({viewport:{width:1440,height:900}}); const page=await context.newPage(); let anchorStatus=null,anchorError=null;
          try{const r=await page.goto('http://127.0.0.1:4173/h-earth-3d/experience-anchor/H_EARTH_EXPERIENCE_ANCHOR_v1.contact-sheet.svg',{waitUntil:'load',timeout:60000});anchorStatus=r?.status()??null;}catch(e){anchorError=String(e?.stack||e);}
          const anchorPath=`${stem}.anchor.png`; try{await page.screenshot({path:anchorPath,fullPage:false,timeout:30000});}catch(e){anchorError=(anchorError?anchorError+' | ':'')+String(e?.stack||e);}
          const anchor={status:anchorStatus,captureError:anchorError,screenshotSha256:fs.existsSync(anchorPath)?digest(anchorPath):null,screenshotBytes:fs.existsSync(anchorPath)?fs.statSync(anchorPath).size:0}; await context.close(); await browser.close();
          const terrainPath=path.join(workspace,'h-earth-3d/terrain/h-earth.terrain-field.js'); const terrainSha256=digest(terrainPath);
          const evidence={schema:'H_EARTH_OW01_ANCHOR_BROWSER_EVIDENCE_v1',evidenceId:'OW01_GRATITUDE_COASTAL_ENTRY_20260815_001',productHead:process.env.PRODUCT_HEAD,qualificationHead:process.env.GITHUB_SHA,baseHead:process.env.BASE_HEAD,anchorId:'H_EARTH_GROUND_EXPERIENCE_VIDEO_20260814_001',anchorSha256:process.env.ANCHOR_SHA256,route:process.env.ROUTE,terrainFieldSha256:terrainSha256,base,candidate,anchor,automatedFindings:{baseRouteLoaded:base.status===200,candidateRouteLoaded:candidate.status===200,baseCanvasPresent:base.canvasCount>0,candidateCanvasPresent:candidate.canvasCount>0,baseNoPageErrors:base.pageErrors.length===0,candidateNoPageErrors:candidate.pageErrors.length===0,candidateInteractionExercised:candidate.interactionExercised,sameCanonicalRoute:base.title===candidate.title,visualStateChanged:base.screenshotSha256&&candidate.screenshotSha256&&base.screenshotSha256!==candidate.screenshotSha256,anchorContactSheetCaptured:anchor.status===200&&!!anchor.screenshotSha256},disposition:'PENDING_INDEPENDENT_VISUAL_REVIEW'};
          fs.writeFileSync(`${stem}.json`,JSON.stringify(evidence,null,2)+'\n');
          if(!fs.existsSync(`${stem}.base.png`)||!fs.existsSync(`${stem}.candidate.png`)||!fs.existsSync(`${stem}.anchor.png`)) process.exitCode=1;
          NODE
          cd /tmp/h-earth-ow01-browser && node qualify.mjs
      - name: Write fail-closed provisional anchor receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$EVIDENCE_STEM.json"
          TERRAIN_SHA="$(sha256sum h-earth-3d/terrain/h-earth.terrain-field.js | awk '{print $1}')"
          mkdir -p "$(dirname "$RECEIPT_PATH")"
          jq -n --arg terrain_sha "$TERRAIN_SHA" --arg evidence "$EVIDENCE_STEM.json" --arg visual "$EVIDENCE_STEM.candidate.png" '{schema:"H_EARTH_EXPERIENCE_ANCHOR_ACCEPTANCE_RECEIPT_v1",anchorId:"H_EARTH_GROUND_EXPERIENCE_VIDEO_20260814_001",anchorSha256:"7757fb4fe731456b3058ec595369133f5c2136c99b282eb6b4df108600bca573",reviewedAgainstAnchor:false,disposition:"BLOCK_PENDING_ANCHOR_REVIEW",visualEvidence:[$visual,$evidence],interactionEvidence:[$evidence],continuityEvidence:[$evidence],experienceFiles:[{path:"h-earth-3d/terrain/h-earth.terrain-field.js",sha256:$terrain_sha}],invariants:{SAME_CANONICAL_WORLD_IDENTITY:false,PLANETARY_TO_REGIONAL_TO_GROUND_CONTINUITY:false,CONTINUOUS_TERRAIN_AND_GEOGRAPHIC_SPACE:false,EMBODIED_LOCAL_GROUND_EXPERIENCE:false,DIRECT_LOOK_AND_TRAVEL_INTERACTION:false,MINIMAL_INTERFACE_INTRUSION_OVER_WORLD:false,TERRAIN_COAST_ELEVATION_AND_HORIZON_READ_AS_ONE_NAVIGABLE_SURFACE:false,NO_PARALLEL_OR_DUPLICATE_H_EARTH_PRODUCT:false,NO_DASHBOARD_MAP_APP_OR_CARD_UI_SUBSTITUTION_FOR_WORLD_EXPERIENCE:false,GLOBE_IS_HIGHER_ALTITUDE_EXPRESSION_OF_THE_SAME_WORLD:false,REGION_ENTRY_MUST_NOT_CREATE_A_VISUALLY_OR_INTERACTIONALLY_UNRELATED_PRODUCT:false}}' > "$RECEIPT_PATH"
      - name: Upload independent-review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ow01-gratitude-coastal-entry-anchor-qualification
          path: |
            h-earth-3d/experience-anchor/evidence/OW01_GRATITUDE_COASTAL_ENTRY_20260815_001.*
            h-earth-3d/experience-anchor/receipts/OW01_GRATITUDE_COASTAL_ENTRY_20260815_001.json
            /tmp/ow01-candidate-server.log
            /tmp/ow01-base-server.log
          retention-days: 90
      - name: Commit qualification evidence only
        if: always() && steps.capture.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add h-earth-3d/experience-anchor/evidence/OW01_GRATITUDE_COASTAL_ENTRY_20260815_001.* h-earth-3d/experience-anchor/receipts/OW01_GRATITUDE_COASTAL_ENTRY_20260815_001.json
          git commit -m 'Record OW01 anchor qualification evidence [anchor evidence]'
          git push origin HEAD:control-plane-delivery/h-earth-ow01-public-product-20260814-014
      - name: Enforce capture completeness
        if: always()
        run: test '${{ steps.capture.outcome }}' = 'success'
