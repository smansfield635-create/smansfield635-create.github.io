name: H-Earth Gate B Exact Adapter Observation
on:
  pull_request:
permissions:
  contents: read
  issues: read
jobs:
  observe-exact-adapter:
    if: github.head_ref == 'agent/h-earth-gate-b-phase-a-successor-001'
    runs-on: ubuntu-latest
    env:
      ADAPTER_PATH: h-earth-3d/integration/h-earth.ground-view-gate-b-west-admission-adapter.js
      EXPECTED_ADAPTER_SHA256: e37670990e4bfb937b8a48ddeeeadc4f31b53c740f3596afc60e0c0b345c574b
      EXPECTED_ADAPTER_BLOB: c274907528c49cbc1f7d070cf88a8783b3055e08
      EXPECTED_BASE64_SHA256: 26fd22267d33830fef7ee4e12c73287ebcc5a936c72a7e79fc72c44c6506a78c
      COMMENT_IDS: 5059352298,5059368052,5059387501,5059405378,5059416475
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/h-earth-gate-b-phase-a-successor-001
          fetch-depth: 0
      - name: Reconstruct exact adapter
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$ADAPTER_PATH"
          mkdir -p "$(dirname "$ADAPTER_PATH")" "$RUNNER_TEMP/adapter-observation"
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          ids=[int(v) for v in os.environ['COMMENT_IDS'].split(',')]
          lengths=[7000,7000,7000,7000,3344]
          hashes=['4aae37239396548c4ef5c53ec59ce02af769b2abbe7e1f881921a9c24bb18149','d2415fb12fe85fd5aee61d83828810d29a8f6660733ac2aacca8623d1ab8c38f','38650c9613bf8af47644d47b5cc3faeadf707283022246cb0c22dbd61bda9d7c','4f931246f5bbf3d241b85bfe69ddc4463036a4235b5146c2151b007041197298','809b2295f3a2d4c6db65fd9083fcf2305345753f085e701a26273b070192c207']
          pieces=[]
          for index,comment_id in enumerate(ids,1):
              req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/comments/{comment_id}",headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req) as response: body=json.load(response)['body']
              prefix=f'H_EARTH_GATE_B_ADAPTER_PAYLOAD_PART_{index:02d}_OF_05\n'
              assert body.startswith(prefix)
              payload=body[len(prefix):].strip()
              assert len(payload)==lengths[index-1]
              assert hashlib.sha256(payload.encode()).hexdigest()==hashes[index-1]
              pieces.append(payload)
          encoded=''.join(pieces)
          assert len(encoded)==31344
          assert hashlib.sha256(encoded.encode()).hexdigest()==os.environ['EXPECTED_BASE64_SHA256']
          decoded=base64.b64decode(encoded,validate=True)
          assert len(decoded)==23506
          assert hashlib.sha256(decoded).hexdigest()==os.environ['EXPECTED_ADAPTER_SHA256']
          pathlib.Path(os.environ['ADAPTER_PATH']).write_bytes(decoded)
          PY
          test "$(git hash-object "$ADAPTER_PATH")" = "$EXPECTED_ADAPTER_BLOB"
      - name: Record exact live adapter result
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { constructHEarthGroundViewGateBGeometry } from './showroom/globe/h-earth/render/ground-view-gate-b.js';
          import * as adapter from './h-earth-3d/integration/h-earth.ground-view-gate-b-west-admission-adapter.js';
          const deepFreeze=(v,s=new WeakSet())=>{if(v===null||typeof v!=='object'||s.has(v))return v;s.add(v);for(const n of Object.values(v))deepFreeze(n,s);return Object.freeze(v);};
          const routeToken='H_EARTH_GATE_B_DIAGNOSTIC_ROUTE_TOKEN:123e4567-e89b-42d3-a456-426614174000';
          const executionIdentity=deepFreeze({executionClass:'GATE_B_DIAGNOSTIC_CHILD_ROUTE_ENTRY',routeToken,adapterOccurrenceId:`H_EARTH_GATE_B_ADAPTER_OCCURRENCE:${routeToken}`,aggregateFrameId:`H_EARTH_WEST_AGGREGATE_FRAME:${routeToken}`,packet002TransferOccurrenceId:`H_EARTH_GATE_B_PACKET_002_TRANSFER_OCCURRENCE:${routeToken}`,compositorFrameOccurrenceId:`H_EARTH_COMPOSITOR_FRAME_OCCURRENCE:${routeToken}`});
          const provider=constructHEarthGroundViewGateBGeometry();
          const input={gateBConstructionResult:provider,executionIdentity,provenanceApplicability:adapter.H_EARTH_GROUND_VIEW_GATE_B_PROVENANCE_APPLICABILITY,toleranceContext:null};
          let inputEvaluation=null, occurrence=null, thrown=null, validator=null;
          try {
            inputEvaluation=adapter.evaluateHEarthGroundViewGateBWestAdmissionAdapterInput(input);
            occurrence=adapter.executeHEarthGroundViewGateBWestAdmissionAdapter(input);
            validator=adapter.isHEarthGroundViewGateBWestAdmissionAdapterOccurrence(occurrence);
          } catch(error) {
            thrown={name:error?.name??'Error',message:error?.message??String(error),stack:error?.stack??null};
          }
          const projectPrimitive=(p)=>p?{primitiveId:p.primitiveId,aggregateFrameMember:p.aggregateFrameMember,keys:Object.keys(p).sort(),frozen:Object.isFrozen(p)}:null;
          const projection={
            adapterExports:Object.keys(adapter).sort(),
            provider:{valid:provider.valid,status:provider.constructionStatus,primitiveCount:provider.primitives.length,frozen:Object.isFrozen(provider)},
            inputEvaluation:inputEvaluation?{ok:inputEvaluation.ok,status:inputEvaluation.status,issues:inputEvaluation.issues,keys:Object.keys(inputEvaluation).sort()}:null,
            occurrence:occurrence?{
              ok:occurrence.ok,status:occurrence.status,keys:Object.keys(occurrence).sort(),issues:occurrence.issues,validator,
              westInvoked:occurrence.westBatchAdmissionInvoked??null,
              westInvocationCount:occurrence.westBatchAdmissionInvocationCount??null,
              admittedPrimitiveCount:occurrence.admittedPrimitives?.length??null,
              admittedPrimitives:occurrence.admittedPrimitives?.map(projectPrimitive)??null,
              aggregateFrameKeys:occurrence.aggregateFrameAdmissionRecord?Object.keys(occurrence.aggregateFrameAdmissionRecord).sort():null,
              aggregatePrimitiveCount:occurrence.aggregateFrameAdmissionRecord?.primitives?.length??null,
              aggregatePrimitives:occurrence.aggregateFrameAdmissionRecord?.primitives?.map((p)=>({keys:Object.keys(p).sort(),primitiveId:p.primitiveId,standalonePrimitiveReferenceId:p.standalonePrimitiveReference?.primitiveId??null,aggregateFrameMember:p.aggregateFrameMember,frozen:Object.isFrozen(p)}))??null,
              aggregateFrameId:occurrence.aggregateFrameAdmissionRecord?.frameId??null,
              boundsIdentity:occurrence.bounds===occurrence.aggregateFrameAdmissionRecord?.bounds,
              provenanceIdentity:occurrence.provenanceApplicability===adapter.H_EARTH_GROUND_VIEW_GATE_B_PROVENANCE_APPLICABILITY,
              provenanceSynthesized:occurrence.provenanceSynthesized??null,
              exactWestReferencesPreserved:occurrence.exactWestReferencesPreserved??null,
              geometryIdentityPreserved:occurrence.geometryIdentityPreserved??null,
              outputDeeplyFrozen:occurrence.outputDeeplyFrozen??null,
              frozen:Object.isFrozen(occurrence)
            }:null,
            boundaries:adapter.H_EARTH_GROUND_VIEW_GATE_B_WEST_ADMISSION_ADAPTER_BOUNDARIES,
            claimCeilings:adapter.H_EARTH_GROUND_VIEW_GATE_B_WEST_ADMISSION_ADAPTER_CLAIM_CEILINGS,
            thrown
          };
          fs.writeFileSync(process.env.RUNNER_TEMP+'/adapter-observation/observation.json',JSON.stringify(projection,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: h-earth-gate-b-exact-adapter-observation
          path: ${{ runner.temp }}/adapter-observation/observation.json
          retention-days: 1
      - name: Prove no governed source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --short | wc -l)" -eq 1
          test "$(git status --short | awk '{print $2}')" = "$ADAPTER_PATH"
