name: H-Earth Gen307 Exact Candidate Anchor Evidence Carrier
on:
  pull_request:
permissions:
  contents: read
jobs:
  capture-gen307-anchor-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact Gen307 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 71bafea00748e672cf64320507d346438bf06a75
          fetch-depth: 1
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Bind preinstalled Chrome and Playwright core
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          printf 'CHROME_BIN=%s\n' "$chrome" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false playwright-core@1.55.0
          "$chrome" --version
      - name: Start exact candidate server
        run: |
          python3 -m http.server 4189 --bind 127.0.0.1 > /tmp/gen307-anchor-server.log 2>&1 &
          for attempt in $(seq 1 90); do
            curl -fsS http://127.0.0.1:4189/showroom/globe/h-earth/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/gen307-anchor-server.log
          exit 1
      - name: Capture exact-head desktop mobile and interaction evidence
        env:
          CANDIDATE_HEAD: 71bafea00748e672cf64320507d346438bf06a75
        run: |
          mkdir -p /tmp/gen307-anchor-evidence
          cat > .gen307-capture.mjs <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { chromium } from 'playwright-core';
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--disable-dev-shm-usage','--no-sandbox']});
          const captures=[];
          try {
            for (const cfg of [
              {id:'desktop',viewport:{width:1440,height:960},isMobile:false,hasTouch:false},
              {id:'mobile',viewport:{width:430,height:860},isMobile:true,hasTouch:true}
            ]) {
              const context=await browser.newContext({viewport:cfg.viewport,isMobile:cfg.isMobile,hasTouch:cfg.hasTouch,deviceScaleFactor:1});
              const page=await context.newPage();
              const pageErrors=[],consoleErrors=[],httpErrors=[];
              page.on('pageerror',e=>pageErrors.push(e.message));
              page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
              page.on('response',r=>{if(r.status()>=400&&r.url().startsWith('http://127.0.0.1:4189'))httpErrors.push({status:r.status(),url:r.url()})});
              const response=await page.goto('http://127.0.0.1:4189/showroom/globe/h-earth/?gen307-anchor=1',{waitUntil:'domcontentloaded',timeout:120000});
              const canvas=page.locator('#h-earth-functional-landscape-canvas');
              await canvas.waitFor({state:'visible',timeout:60000});
              await page.waitForFunction(()=>document.getElementById('h-earth-functional-landscape-route')?.dataset.run8eReady==='true'||(document.getElementById('h-earth-startup-result')?.textContent||'').includes('PASS'),null,{timeout:180000});
              await page.waitForTimeout(1200);
              const beforeBytes=await canvas.screenshot({type:'png'}),before=hash(beforeBytes),box=await canvas.boundingBox();
              if(!cfg.isMobile){const cx=box.x+box.width*.5,cy=box.y+box.height*.5;await page.mouse.move(cx,cy);await page.mouse.down();await page.mouse.move(cx+125,cy+48,{steps:12});await page.mouse.up();await page.mouse.wheel(0,-420);}
              else {const client=await context.newCDPSession(page);await client.send('Emulation.setTouchEmulationEnabled',{enabled:true,maxTouchPoints:2});const cx=box.x+box.width*.5,cy=box.y+box.height*.45;await client.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:cx,y:cy,radiusX:4,radiusY:4,force:1,id:1}]});for(let i=1;i<=8;i++)await client.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:cx+9*i,y:cy+3*i,radiusX:4,radiusY:4,force:1,id:1}]});await client.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});}
              await page.waitForTimeout(900);
              const afterBytes=await canvas.screenshot({type:'png'}),after=hash(afterBytes);
              fs.writeFileSync(`/tmp/gen307-anchor-evidence/${cfg.id}-before.png`,beforeBytes);
              fs.writeFileSync(`/tmp/gen307-anchor-evidence/${cfg.id}-after.png`,afterBytes);
              captures.push({id:cfg.id,status:response?.status()??null,canvasVisible:true,interactionExercised:before!==after,pageErrors,consoleErrors,httpErrors,beforeCanvasSha256:before,afterCanvasSha256:after});
              await context.close();
            }
          } finally {await browser.close();}
          const manifest={schema:'H_EARTH_GEN307_EXACT_CANDIDATE_ANCHOR_EVIDENCE_v1',candidateHead:process.env.CANDIDATE_HEAD,captures,result:captures.every(r=>r.status===200&&r.canvasVisible&&r.interactionExercised&&r.pageErrors.length===0&&r.consoleErrors.length===0&&r.httpErrors.length===0)?'PASS':'FAIL'};
          fs.writeFileSync('/tmp/gen307-anchor-evidence/manifest.json',JSON.stringify(manifest,null,2)+'\n');
          console.log(JSON.stringify(manifest,null,2));
          if(manifest.result!=='PASS')process.exitCode=1;
          NODE
          node .gen307-capture.mjs
          rm -f .gen307-capture.mjs
      - name: Upload exact candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h-earth-gen307-exact-candidate-anchor-evidence
          path: /tmp/gen307-anchor-evidence
          retention-days: 90
