name: Wastewater safe-envelope adversarial v2
on:
  pull_request:
    paths:
      - 'research/imi/WASTEWATER_SAFE_ENVELOPE_ADVERSARIAL_PROTOCOL_v2.md'
      - 'research/imi/wastewater_safe_envelope_adversarial_v2.py'
      - '.github/workflows/wastewater-safe-envelope-adversarial-v2.yml'
  workflow_dispatch:
jobs:
  severe-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            research/imi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: pip install numpy pandas scikit-learn lightgbm requests
      - name: Execute frozen wastewater v2 severe test
        run: python research/imi/wastewater_safe_envelope_adversarial_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wastewater-safe-envelope-adversarial-v2
          path: |
            wastewater_safe_envelope_findings_v2.json
            wastewater_safe_envelope_temporal_predictions_v2.csv
            wastewater_safe_envelope_snapshot_sample_v2.csv
            WASTEWATER_SAFE_ENVELOPE_VERDICT_v2.txt
