name: Public → Private Bounded Exact-Head Execution v1

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: ['control-plane-delivery/study-private-save-20261013']
    paths: ['.github/workflows/public-private-bounded-exact-head-execution-v1.yml']
permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  study-private-recurring-cycle:
    if: >-
      github.repository == 'smansfield635-create/smansfield635-create.github.io' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/control-plane-delivery/study-private-save-20261013') ||
       ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: private-study-checkpoint-v1
      cancel-in-progress: false
    env:
      DGB_STUDY_SOURCE_HEAD: 62e9416ceff65ed8319cf6fca864d93331c24b97
      DGB_STUDY_RATIFICATION_COMMIT: e38806125cb0b0aec1581001373212376610c137
      DGB_READBACK_QUALIFICATION_ONLY: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Qualify independently saved checkpoint readback only' }}
    steps:
      - name: Require independently admitted public binding
        uses: actions/github-script@v7
        with:
          script: |
            const path='.github/operation-intake/active-operation-ledger.v1.json';
            const f=(await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'operation-locks/repository-operation-intake-v1'})).data;
            const blob=f.encoding==='base64'?f:(await github.rest.git.getBlob({owner:context.repo.owner,repo:context.repo.repo,file_sha:f.sha})).data;
            const ledger=JSON.parse(Buffer.from(blob.content.replace(/\s/g,''),'base64').toString('utf8'));
            const id='DGB_PUBLIC_PRIVATE_GOVERNING_REBIND_ADOPTION_20261016_001';
            const active=Object.values(ledger.activeScopes).filter(x=>x.operationId===id);
            const terminal=ledger.terminalHistory.filter(x=>x.operationId===id&&x.lockGeneration===2770);
            const row=active.length===1&&terminal.length===0?active[0]:active.length===0&&terminal.length===1&&terminal[0].released===true&&terminal[0].terminalDisposition==='PASS_CLOSED'?terminal[0]:null;
            if(!row||row.lockGeneration!==2770||row.requestDigest!=='d13502f780b0c2dba3764f65b83c77e1b3b99042828bca81f39ab0003b4d5924'||row.procedureLocatorDigest!=='bb0d5f909821e9d91dfa6e4cb656b1d5d84d21c22c2e5267427723c5a3cf5f74'||!(row.state==='ADMITTED_LOCKED'&&row.released===false||row.state==='TERMINAL'&&row.released===true&&row.terminalDisposition==='PASS_CLOSED'))throw Error('PUBLIC_RECURRING_AUTHORITY_REFUSED');
      - name: Mint existing private installation write credential
        id: private
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.PRIVATE_EXECUTION_APP_ID }}
          private-key: ${{ secrets.PRIVATE_EXECUTION_APP_PRIVATE_KEY }}
          owner: smansfield635-create
          repositories: geodiametrics1
          permission-contents: write
          permission-issues: read
          permission-pull-requests: read
      - name: Check out fixed registered private study command
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: smansfield635-create/geodiametrics1
          ref: ${{ env.DGB_STUDY_SOURCE_HEAD }}
          token: ${{ steps.private.outputs.token }}
          path: private-control-plane
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/private-public-bridge/
            /tools/operation-intake/
            /.github/ai-router/
            /control-plane/whole-estate/characters-reconstruction-v1/compass-functional-coordinate-constitution.v1.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute fixed private recurring cycle and redact public output
        id: proof
        if: env.DGB_READBACK_QUALIFICATION_ONLY != 'true'
        env:
          NODE_DEBUG: undici
          DGB_GITHUB_TOKEN: ${{ steps.private.outputs.token }}
          DGB_PUBLIC_GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/private-control-plane"
          test "$(git rev-parse HEAD^{commit})" = "$DGB_STUDY_SOURCE_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          set +e
          node tools/private-public-bridge/material-work-runtime-carrier.v1.mjs --cycle > "$RUNNER_TEMP/study-redacted.json" 2> "$RUNNER_TEMP/study-private-stderr.log"
          status=$?
          set -e
          echo "collector_status=$status" >> "$GITHUB_OUTPUT"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let r;try{r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/study-redacted.json','utf8'));}catch{throw Error('REDACTION_OR_RESULT_INVALID');}
          const keys=['descriptorId','nativeReceiptSha256','rawPrivateDataExported','result','schema'];
          const results=["PASS","FAIL_CLOSED","FAIL_CLOSED_FIXED_COMMAND_REQUIRED","FAIL_CLOSED_EXACT_SOURCE_MISMATCH","FAIL_CLOSED_GOVERNING_HEAD_DRIFT","FAIL_CLOSED_AUTHORITY_BLOB_MISMATCH","FAIL_CLOSED_RUNTIME_DESCRIPTOR_REFUSED","FAIL_CLOSED_SOURCE_OUTSIDE_ADMISSION","FAIL_CLOSED_RUNTIME_ADMISSION_NOT_ACTIVE","FAIL_CLOSED_RUNTIME_DESTINATION_SUBSTITUTION","FAIL_CLOSED_REAL_CHANGED_SAVE_REQUIRED","FAIL_CLOSED_INTERRUPTION_RECOVERY_STATE_MISMATCH","FAIL_CLOSED_REVIEW_CUSTODY_CHANGED","FAIL_CLOSED_RECOVERY_OR_NO_CHANGE_NOT_PROVEN","FAIL_CLOSED_SEARCH_INCOMPLETE","FAIL_CLOSED_SEARCH_DRIFT","FAIL_CLOSED_SEARCH_PAGE_COUNT_MISMATCH","FAIL_CLOSED_PR_DISAPPEARED_OR_MERGE_TIME_CHANGED","FAIL_CLOSED_POPULATION_ROW_INVALID","FAIL_CLOSED_CHECKPOINT_INVALID","FAIL_CLOSED_BLOB_CONTENT_IDENTITY_MISMATCH","FAIL_CLOSED_UPDATED_SCAN_DRIFT","FAIL_CLOSED_UPDATED_SCAN_INCOMPLETE","FAIL_CLOSED_RATE_LIMIT_DEFER_CHECKPOINT_UNCHANGED","FAIL_CLOSED_GITHUB_API_403","FAIL_CLOSED_GITHUB_API_404","FAIL_CLOSED_GITHUB_API_401"];
          if(!r||typeof r!=='object'||Array.isArray(r)||JSON.stringify(Object.keys(r).sort())!==JSON.stringify(keys)||r.schema!=='PUBLIC_PRIVATE_STUDY_REDACTED_RECEIPT_v1'||r.descriptorId!=='DGB_PRIVATE_STUDY_FIXED_CHECKPOINT_SAVE_V1'||!results.includes(r.result)||r.rawPrivateDataExported!==false||typeof r.nativeReceiptSha256!=='string'||!/^[0-9a-f]{64}$/.test(r.nativeReceiptSha256))throw Error('REDACTION_OR_RESULT_INVALID');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'collector_result='+r.result+'\n');
          if(r.result!=='PASS'){
            let trace='';try{trace=fs.readFileSync(process.env.RUNNER_TEMP+'/study-private-stderr.log','utf8');}catch{}
            let stage='TRACE_UNAVAILABLE';
            for(const line of trace.split('\n')){
              const m=line.match(/^UNDICI [0-9]+: received response to (GET|POST|PATCH) https:\/\/api\.github\.com(\/\S+) - HTTP 422$/);
              if(!m)continue;
              const method=m[1],p=m[2].replace(/^\/+/, '/');stage='OTHER';
              if(method==='POST'&&/^\/repos\/[^/]+\/[^/]+\/git\/blobs$/.test(p))stage='GIT_BLOB_WRITE';
              else if(method==='POST'&&/^\/repos\/[^/]+\/[^/]+\/git\/trees$/.test(p))stage='GIT_TREE_WRITE';
              else if(method==='POST'&&/^\/repos\/[^/]+\/[^/]+\/git\/commits$/.test(p))stage='GIT_COMMIT_WRITE';
              else if(method==='PATCH'&&/^\/repos\/[^/]+\/[^/]+\/git\/refs\/heads\//.test(p))stage='CHECKPOINT_REF_UPDATE';
              else if(method==='GET'&&/^\/search\/issues\?/.test(p))stage='SEARCH_READ';
              else if(method==='GET'&&/^\/repos\/[^/]+\/[^/]+\/pulls\/[0-9]+$/.test(p))stage='PULL_METADATA_READ';
              else if(method==='GET'&&/^\/repos\/[^/]+\/[^/]+\/pulls\?/.test(p))stage='PULL_LIST_READ';
              else if(method==='GET'&&/^\/repos\/[^/]+\/[^/]+\/pulls\/[0-9]+\/files\?/.test(p))stage='PULL_FILES_READ';
              else if(method==='GET'&&/^\/repos\/[^/]+\/[^/]+\/compare\//.test(p))stage='COMPARISON_READ';
              else if(method==='GET'&&/^\/repos\/[^/]+\/[^/]+\/contents\//.test(p))stage='CONTENTS_READ';
              else if(method==='GET'&&/^\/repos\/[^/]+\/[^/]+\/git\/blobs\//.test(p))stage='GIT_BLOB_READ';
              else if(method==='GET'&&/^\/repos\/[^/]+\/[^/]+\/git\/trees\//.test(p))stage='GIT_TREE_READ';
              else if(method==='GET'&&/^\/repos\/[^/]+\/[^/]+\/(git\/)?commits\//.test(p))stage='GIT_COMMIT_READ';
              else if(method==='GET'&&/^\/repos\/[^/]+\/[^/]+\/git\/refs?\/heads\//.test(p))stage='REF_READ';
            }
            console.log(JSON.stringify({schema:'DGB_SAFE_HTTP_FAILURE_STAGE_v1',httpStatus:stage==='TRACE_UNAVAILABLE'?null:422,stage}));
          }
          NODE
          echo 'redaction_valid=true' >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/study-redacted.json"
      - name: Retain failed blob diagnostic privately
        if: always() && steps.private.outputs.token != ''
        env:
          DGB_GITHUB_TOKEN: ${{ steps.private.outputs.token }}
          DGB_PUBLIC_GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const root='https://api.github.com/repos/smansfield635-create/geodiametrics1';
          const branch='ops-chamber-study-checkpoint-v1';
          const destination='tools/private-public-bridge/standalone/study/runtime/checkpoint-upload-diagnostic.v1.json';
          const hex=x=>typeof x==='string'&&/^[0-9a-f]{40}$/.test(x);
          const refuse=()=>{throw Error('PRIVATE_DIAGNOSTIC_RETENTION_REFUSED');};
          const blobSha=bytes=>crypto.createHash('sha1').update(Buffer.concat([Buffer.from(`blob ${bytes.length}\0`),bytes])).digest('hex');
          function validateDiagnostic(bytes,secrets=[]){
            if(!Buffer.isBuffer(bytes)||bytes.length>2097152)refuse();
            let d;try{d=JSON.parse(bytes.toString('utf8'));}catch{refuse();}
            const keys=['body','httpStatus','method','readError','retainedBytes','schema','stage','truncated','validation'];
            if(!d||typeof d!=='object'||Array.isArray(d)||JSON.stringify(Object.keys(d).sort())!==JSON.stringify(keys)||d.schema!=='DGB_PRIVATE_GITHUB_FAILURE_v1'||d.httpStatus!==422||d.method!=='POST'||d.stage!=='GIT_BLOB_WRITE'||typeof d.body!=='string'||Buffer.byteLength(d.body)>1048576||typeof d.truncated!=='boolean'||typeof d.readError!=='boolean'||!Number.isSafeInteger(d.retainedBytes)||d.retainedBytes<0||d.retainedBytes>65536)refuse();
            let expected=null;if(!d.truncated&&!d.readError){try{expected=JSON.parse(d.body);}catch{}}
            if(JSON.stringify(d.validation)!==JSON.stringify(expected))refuse();
            // Source has already redacted credentials; reject unexpected secret survival.
            const serialized=JSON.stringify(d);if(secrets.some(s=>typeof s==='string'&&s&&serialized.includes(s)))refuse();
            return d;
          }
          async function retainDiagnostic({env=process.env,request=fetch,readFile=fs.readFileSync,lstat=fs.lstatSync}={}){
            if(env.GITHUB_ACTIONS!=='true'||!path.isAbsolute(env.RUNNER_TEMP??''))refuse();
            const source=path.join(env.RUNNER_TEMP,'private-study-proof/github-failure.json');
            let stat;try{stat=lstat(source);}catch(e){if(e.code==='ENOENT')return 'ABSENT';throw e;}
            if(!stat.isFile()||stat.isSymbolicLink()||stat.size>2097152)refuse();
            const bytes=readFile(source),token=env.DGB_GITHUB_TOKEN;
            if(typeof token!=='string'||!token)refuse();
            validateDiagnostic(bytes,[token,env.DGB_PUBLIC_GITHUB_TOKEN]);
            const sha=blobSha(bytes),contentUrl=root+'/contents/'+destination;
            async function call(url,{method='GET',body,ok=[200]}={}){
              const r=await request(url,{method,redirect:'error',signal:AbortSignal.timeout(30000),headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});
              if(!ok.includes(r.status))refuse();
              // Do not read or surface any rejected API response body.
              return {status:r.status,value:r.status===404?null:await r.json()};
            }
            const head=(await call(root+'/git/ref/heads/'+branch)).value.object?.sha;if(!hex(head))refuse();
            const previous=await call(contentUrl+'?ref='+head,{ok:[200,404]});
            if(previous.status===200&&(!hex(previous.value.sha)||previous.value.type!=='file'))refuse();
            // An existing file uses its observed blob SHA; initial creation guards absence
            // by omitting SHA. A concurrent creation is rejected by the Contents API.
            const expectedSha=previous.status===200?previous.value.sha:null;
            const current=(await call(root+'/git/ref/heads/'+branch)).value.object?.sha;if(current!==head)refuse();
            const saved=(await call(contentUrl,{method:'PUT',ok:expectedSha?[200]:[201],body:{message:'Retain private checkpoint upload diagnostic',branch,content:bytes.toString('base64'),...(expectedSha?{sha:expectedSha}:{})}})).value;
            if(saved.content?.sha!==sha||!hex(saved.commit?.sha))refuse();
            const readback=(await call(contentUrl+'?ref='+saved.commit.sha)).value;
            if(readback.sha!==sha||readback.encoding!=='base64'||typeof readback.content!=='string'||!Buffer.from(readback.content.replace(/\s/g,''),'base64').equals(bytes))refuse();
            const detail=(await call(root+'/commits/'+saved.commit.sha)).value;
            if(detail.parents?.length!==1||detail.parents[0].sha!==head||detail.files?.length!==1||detail.files[0].filename!==destination||detail.files[0].sha!==sha)refuse();
            return 'SAVED_AND_VERIFIED';
          }
          async function runRetentionWithSafeReceipt(options={},log=console.log){
            try{const result=await retainDiagnostic(options);log(JSON.stringify({schema:'DGB_SAFE_PRIVATE_DIAGNOSTIC_RETENTION_v1',result}));return 0;}
            catch{log(JSON.stringify({schema:'DGB_SAFE_PRIVATE_DIAGNOSTIC_RETENTION_v1',result:'FAIL_CLOSED'}));return 1;}
          }
          process.exitCode=await runRetentionWithSafeReceipt();
          NODE

      - name: Independently verify saved private study and persist hosted capture
        if: steps.proof.outputs.collector_result == 'PASS' || env.DGB_READBACK_QUALIFICATION_ONLY == 'true'
        env:
          DGB_GITHUB_TOKEN: ${{ steps.private.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          const REPO='smansfield635-create/geodiametrics1',ROOT='https://api.github.com/repos/'+REPO,BRANCH='ops-chamber-study-checkpoint-v1';
          const PREFIX='tools/private-public-bridge/standalone/study/runtime/';
          const PRIOR='6e1f4fc90408f05139461bfd61508e1e4d66f24a';
          const QUALIFICATION='d2d8c97547d13d2aafd0957153a13c3562caf871';
          const hex=x=>typeof x==='string'&&/^[0-9a-f]{40}$/.test(x);
          const stop=()=>{throw Error('PRIVATE_READBACK_REFUSED');};
          const blobSha=bytes=>crypto.createHash('sha1').update(Buffer.concat([Buffer.from(`blob ${bytes.length}\0`),bytes])).digest('hex');
          function createPrivateReadbackApi({token,request=fetch}){
           if(typeof token!=='string'||!token)stop();
           return {async call(url,{method='GET',body,ok=[200]}={}){
            const u=new URL(url);if(u.origin!=='https://api.github.com'||u.username||u.password||!u.pathname.startsWith('/repos/'+REPO+'/'))stop();
            if(method!=='GET'&&!(method==='PUT'&&u.pathname==='/repos/'+REPO+'/contents/'+PREFIX+'study-readback-verification.v1.json'&&!u.search))stop();
            const r=await request(url,{method,redirect:'error',signal:AbortSignal.timeout(30000),headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});
            if(!ok.includes(r.status))stop();return {status:r.status,value:r.status===404?null:await r.json()};
           },async read(url){return (await this.call(url)).value;}};
          }
          async function readJsonFile(github,p,ref){
           if(!hex(ref)||typeof p!=='string'||!p||p.startsWith('/')||/[?#]/.test(p)||p.split('/').some(x=>x==='..'||x==='.'))stop();
           const f=await github.read(ROOT+'/contents/'+p+'?ref='+ref);if(!hex(f.sha))stop();let raw;
           if(f.encoding==='base64'&&typeof f.content==='string')raw=Buffer.from(f.content.replace(/\s/g,''),'base64');
           else{const b=await github.read(ROOT+'/git/blobs/'+f.sha);if(b.encoding!=='base64'||typeof b.content!=='string')stop();raw=Buffer.from(b.content.replace(/\s/g,''),'base64');}
           if(blobSha(raw)!==f.sha)stop();return {raw,value:JSON.parse(raw.toString('utf8')),blob:f.sha};
          }
          async function verifyAndSave({github,native,authority=async()=>false,now=()=>new Date().toISOString(),sourceHead,qualificationOnly=false}){
           if(!hex(sourceHead))stop();
           const {createCheckpointStore,projectSavedBaseline,projectRollingStudy,validateDashboard,digest}=native;
           if(await authority({github,jsonAt:async(p,ref)=>(await readJsonFile(github,p,ref)).value,digest})!==true)stop();
           const head=async()=>{const h=(await github.read(ROOT+'/git/ref/heads/'+BRANCH)).object?.sha;if(!hex(h))stop();return h;};
           const expectedHead=await head(),snapshotHead=qualificationOnly?QUALIFICATION:expectedHead;
           const evidence=new Map();
           async function file(name,ref){
            const p=PREFIX+name,result=await readJsonFile(github,p,ref);evidence.set(ref+':'+p,{path:p,blob:result.blob});return result;
           }
           const store=createCheckpointStore({github}),saved=await store.readback(snapshotHead);
           if(!hex(saved.blob))stop();
           evidence.set(snapshotHead+':'+PREFIX+'checkpoint.v1.json',{path:PREFIX+'checkpoint.v1.json',blob:saved.blob});
           const prior=await store.readback(PRIOR),state=saved.state;
           const data=(await file('dashboard-data.v1.json',snapshotHead)).value,receipt=(await file('dashboard-projection-receipt.v1.json',snapshotHead)).value;
           validateDashboard(data);
           if(receipt.schema!=='DGB_PRIVATE_STUDY_DASHBOARD_PROJECTION_RECEIPT_v1'||receipt.result!=='PRIVATE_PROJECTION_PREPARED_NOT_HOSTED'||!hex(receipt.checkpointHead)||receipt.sourceHead!==sourceHead||receipt.savedThrough!==state.population.through||!Number.isFinite(Date.parse(receipt.projectionObservedAt))||receipt.projectionDigest!==digest(data)||receipt.displayedThrough!==null||receipt.hostedPublicationVerified!==false||receipt.publicRawDataExported!==false)stop();
           // The projection may be a later single-file commit; bind its referenced checkpoint.
           const referenced=await github.read(ROOT+'/contents/'+PREFIX+'checkpoint.v1.json?ref='+receipt.checkpointHead);
           if(referenced.sha!==saved.blob)stop();
           const rolling=projectRollingStudy(projectSavedBaseline(state,{commit:receipt.checkpointHead,lastSuccessfulUpdate:receipt.projectionObservedAt}));
           if(digest(data.rollingStudy)!==digest(rolling)||Date.parse(rolling.through)<=Date.parse('2026-10-15T18:49:41Z'))stop();
           const custody=s=>({reviewDigest:s.baseline.reviewDigest,corrections:s.baseline.corrections,rows:s.baseline.rows.filter(r=>r.reviewDigest)});
           if(digest(custody(state))!==digest(custody(prior.state))||state.baseline.reviewedCount!==390||state.baseline.corrections.length!==47||state.baseline.inputAuditCount!==5)stop();
           const auditFlags=state.baseline.rows.filter(r=>r.inputAuditReason).map(r=>({repository:r.repository,number:r.number,reason:r.inputAuditReason}));
           if(auditFlags.length!==5||rolling.reviewedCount!==390||rolling.correctionCount!==47||rolling.auditFlagCount!==5+state.auditFlags.length||rolling.cohorts.reduce((n,c)=>n+c.total,0)!==state.population.records.length)stop();
           const inputs=state.inputs.filter(x=>x.metadata.repository==='smansfield635-create/smansfield635-create.github.io'&&x.metadata.number===6377);if(inputs.length!==1)stop();
           const c=inputs[0].capture,t=c.treeProof;
           if(c.complete!==true||c.expectedChangedFiles!==59367||c.files?.length!==59367||new Set(c.files.map(f=>f.filename)).size!==59367||t?.schema!=='DGB_IMMUTABLE_COMPLETE_PATH_DIFF_v1'||t.complete!==true||t.treeObjectsHashVerified!==true||t.changedPathEntries!==59367||!c.inputAuditReason)stop();
           const tree6377summary={repository:c.repository,number:c.number,changedPaths:59367,captureDigest:c.captureDigest,complete:true,treeObjectsHashVerified:true,baseTree:t.baseTree,headTree:t.headTree,renamePolicy:t.renamePolicy,lineStatistics:t.lineStatistics,inputAuditReason:c.inputAuditReason};
           const capturedAt=now();if(!Number.isFinite(Date.parse(capturedAt))||Date.parse(capturedAt)<Date.parse(receipt.projectionObservedAt))stop();
           const capture={schema:'DGB_HOSTED_STUDY_CAPTURE_v1',capturedAt,projectionHead:snapshotHead,sourceProjectionDigest:receipt.projectionDigest,rollingStudy:rolling,auditFlags};
           const proof={schema:'DGB_PRIVATE_STUDY_READBACK_VERIFICATION_v1',result:'INDEPENDENT_READBACK_VERIFIED',snapshotHead,checkpointHead:receipt.checkpointHead,files:[...evidence.values()],sourceHead,custodyDigest:digest(custody(state)),tree6377summary,capture};
           const bytes=Buffer.from(JSON.stringify(proof,null,2)+'\n'),sha=blobSha(bytes),url=ROOT+'/contents/'+PREFIX+'study-readback-verification.v1.json';
           const priorProof=await github.call(url+'?ref='+expectedHead,{ok:[200,404]});if(priorProof.status===200&&!hex(priorProof.value.sha))stop();
           if(await head()!==expectedHead)stop();
           const response=await github.call(url,{method:'PUT',ok:priorProof.status===200?[200]:[201],body:{message:'Save independent private study readback verification',branch:BRANCH,content:bytes.toString('base64'),...(priorProof.status===200?{sha:priorProof.value.sha}:{})}});
           const committed=response.value;if(committed.content?.sha!==sha||!hex(committed.commit?.sha))stop();
           const readback=await file('study-readback-verification.v1.json',committed.commit.sha);if(!readback.raw.equals(bytes))stop();
           const detail=await github.read(ROOT+'/commits/'+committed.commit.sha);if(detail.parents?.length!==1||detail.parents[0].sha!==expectedHead||detail.files?.length!==1||detail.files[0].filename!==PREFIX+'study-readback-verification.v1.json'||detail.files[0].sha!==sha)stop();
           return proof;
          }
          async function runSafe(options,log=console.log){try{await verifyAndSave(options);log('{"schema":"DGB_SAFE_PRIVATE_STUDY_READBACK_v1","result":"PASS"}');return 0;}catch{log('{"schema":"DGB_SAFE_PRIVATE_STUDY_READBACK_v1","result":"FAIL_CLOSED"}');return 1;}}
          
          async function verifyReadbackGrant({github,jsonAt,digest}){
           const root='https://api.github.com/repos/smansfield635-create/geodiametrics1';
           const packetPath='tools/private-public-bridge/standalone/study/rebound-readback-evidence-20261016/operation-packet.v1.json';
           const closure='efb8879cc2d7aa6bf2949f3447cbd66211ecd515';
           const packet=await jsonAt(packetPath,'052fc63f741d9b74f6f7708052d2ba4a84442ba3');
           const r=packet?.operationRequest,p=packet?.constructionProcedure,s=r?.subjectIdentity;
           const req='a3e9be2d16c0e07a241ea360ef7cd7c0eef865eb970948d421fd91a76763d7fa',proc='4996809c9826e844ab15b3da88bb18dbf30f106e9d5eb610c14d0d0636b89e26';
           const id='DGB_STUDY_REBOUND_READBACK_EVIDENCE_20261016_001',scope='PRIVATE_PUBLIC_BRIDGE:OPERATIONS_CHAMBER:FIXED_STUDY_READBACK_EVIDENCE_V1';
           const proof='tools/private-public-bridge/standalone/study/runtime/study-readback-verification.v1.json';
           const refuse=()=>{throw Error('READBACK_AUTHORITY_REFUSED');};
           if(!r||!p||digest(r)!==req||digest(p)!==proc||r.operationId!==id||r.lockScope!==scope||s?.sourceHead!=='62e9416ceff65ed8319cf6fca864d93331c24b97'||s?.sourceRatification!=='e38806125cb0b0aec1581001373212376610c137'||s?.runtimeBranch!=='ops-chamber-study-checkpoint-v1'||s?.proofPath!==proof||s?.priorCustodyCheckpoint!=='6e1f4fc90408f05139461bfd61508e1e4d66f24a'||s?.standingFixedReadbackEvidenceAuthorityAfterVerifiedClosure!==true||s?.publicRawDataExport!==false||s?.collectorAndCheckpointMutation!==false||!r.allowedPaths.includes(proof))refuse();
           const ledgerPath='.github/operation-intake/active-operation-ledger.v1.json';
           const closed=await jsonAt(ledgerPath,closure);
           const liveHead=(await github.read(root+'/git/ref/heads/operation-locks/repository-operation-intake-v1')).object?.sha;
           const live=await jsonAt(ledgerPath,liveHead);
           const check=ledger=>{
            const terminal=(ledger?.terminalHistory??[]).filter(x=>x.operationId===id&&x.lockGeneration===682);
            if(Object.values(ledger?.activeScopes??{}).some(x=>x.operationId===id)||terminal.length!==1)refuse();
            const x=terminal[0];if(x.state!=='TERMINAL'||x.released!==true||x.terminalDisposition!=='PASS_CLOSED'||x.requestDigest!==req||x.procedureLocatorDigest!==proc||x.lockScope!==scope||x.governingHead!==r.exactGoverningHead)refuse();return x;
           };
           if(digest(check(closed))!==digest(check(live)))refuse();
           const commit=await github.read(root+'/commits/'+closure);
           if(commit.sha!==closure||commit.parents?.length!==1||commit.files?.length!==1||commit.files[0].filename!==ledgerPath||commit.files[0].sha!=='dde1b45f8d3ae754b95d935015290ea0d9851550')refuse();
           return {operationId:id,generation:682,requestDigest:req,procedureDigest:proc,packetHead:'052fc63f741d9b74f6f7708052d2ba4a84442ba3',closureHead:closure,proofPath:proof};
          }
          
          try {
           const base='file://'+process.env.GITHUB_WORKSPACE+'/private-control-plane/tools/private-public-bridge/';
           const {createCheckpointStore}=await import(base+'material-work-checkpoint-host.v1.mjs');
           const {projectSavedBaseline}=await import(base+'material-work-incremental.v1.mjs');
           const {projectRollingStudy,validateDashboard}=await import(base+'standalone/dashboard.mjs');
           const {digest}=await import(base+'material-work-study.v1.mjs');
           const github=createPrivateReadbackApi({token:process.env.DGB_GITHUB_TOKEN});
           const authority=async args=>{await verifyReadbackGrant(args);return true;};
           process.exitCode=await runSafe({github,native:{createCheckpointStore,projectSavedBaseline,projectRollingStudy,validateDashboard,digest},authority,sourceHead:'62e9416ceff65ed8319cf6fca864d93331c24b97',qualificationOnly:process.env.DGB_READBACK_QUALIFICATION_ONLY==='true'});
          } catch { console.log('{"schema":"DGB_SAFE_PRIVATE_STUDY_READBACK_v1","result":"FAIL_CLOSED"}'); process.exitCode=1; }
          NODE

      - name: Upload only allowlisted redacted result
        if: always() && steps.proof.outputs.redaction_valid == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-study-cycle-redacted-${{ github.run_id }}
          path: ${{ runner.temp }}/study-redacted.json
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce collector status after preserving redacted evidence
        if: always() && env.DGB_READBACK_QUALIFICATION_ONLY != 'true'
        env:
          COLLECTOR_STATUS: ${{ steps.proof.outputs.collector_status }}
          COLLECTOR_RESULT: ${{ steps.proof.outputs.collector_result }}
          REDACTION_VALID: ${{ steps.proof.outputs.redaction_valid }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REDACTION_VALID" = 'true'
          test "$COLLECTOR_STATUS" = '0'
          test "$COLLECTOR_RESULT" = 'PASS'

  execute:
    if: >-
      github.event.issue.number == 578 &&
      startsWith(github.event.comment.body, 'PUBLIC_PRIVATE_BOUNDED_EXACT_HEAD_EXECUTION_REQUEST_V1') &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATE_REPOSITORY: smansfield635-create/geodiametrics1
      PRIVATE_ISSUE: '217'
      PRIVATE_CARRIER_PATH: .github/ai-router/bounded-exact-head-execution-carrier/carrier.v1.mjs

    steps:
      - name: Parse closed locator
        id: locator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          event=json.load(open(os.environ['GITHUB_EVENT_PATH'],encoding='utf-8'))
          body=event['comment']['body']
          marker='PUBLIC_PRIVATE_BOUNDED_EXACT_HEAD_EXECUTION_REQUEST_V1'
          request=json.loads(body[len(marker):].strip())
          required={'schema','privateCommentId','expectedRequestId','exactPrivateHead'}
          if set(request) != required or request['schema'] != marker:
              raise SystemExit('REQUEST_NOT_CLOSED')
          comment=str(request['privateCommentId'])
          if not comment.isdigit() or int(comment) < 1:
              raise SystemExit('PRIVATE_COMMENT_INVALID')
          request_id=request['expectedRequestId']
          if not isinstance(request_id,str) or len(request_id) < 3 or len(request_id) > 128:
              raise SystemExit('REQUEST_ID_INVALID')
          allowed=set('ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_.:-')
          if request_id[0] not in 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789' or any(ch not in allowed for ch in request_id):
              raise SystemExit('REQUEST_ID_INVALID')
          head=request['exactPrivateHead']
          if not isinstance(head,str) or len(head)!=40 or any(ch not in '0123456789abcdef' for ch in head):
              raise SystemExit('PRIVATE_HEAD_INVALID')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f'comment={comment}\n')
              f.write(f'request_id={request_id}\n')
              f.write(f'head={head}\n')
          PY

      - name: Mint private read token
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.PRIVATE_EXECUTION_APP_ID }}
          private-key: ${{ secrets.PRIVATE_EXECUTION_APP_PRIVATE_KEY }}
          owner: smansfield635-create
          repositories: geodiametrics1
          permission-contents: read
          permission-issues: read

      - name: Fetch and validate frozen bounded request
        id: request
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PRIVATE_COMMENT: ${{ steps.locator.outputs.comment }}
          EXPECTED_REQUEST_ID: ${{ steps.locator.outputs.request_id }}
          EXACT_PRIVATE_HEAD: ${{ steps.locator.outputs.head }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/public-private-bounded-execution"
          mkdir -p "$work"
          curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$PRIVATE_REPOSITORY/issues/comments/$PRIVATE_COMMENT" \
            > "$work/private-comment.json"
          python - <<'PY'
          import json, os
          work=os.path.join(os.environ['RUNNER_TEMP'],'public-private-bounded-execution')
          comment=json.load(open(os.path.join(work,'private-comment.json'),encoding='utf-8'))
          if not str(comment.get('issue_url','')).endswith('/issues/' + os.environ['PRIVATE_ISSUE']):
              raise SystemExit('PRIVATE_COMMENT_ISSUE_MISMATCH')
          body=comment.get('body') or ''
          marker='BOUNDED_EXACT_HEAD_EXECUTION_REQUEST_V1'
          if not body.startswith(marker):
              raise SystemExit('PRIVATE_BOUNDED_MARKER_MISSING')
          request=json.loads(body[len(marker):].strip())
          required={'schema','requestId','descriptorId','operationRequest','constructionProcedure','admissionReceipt','requestNonce'}
          if set(request) != required or request.get('schema') != 'BOUNDED_EXACT_HEAD_EXECUTION_REQUEST_v1':
              raise SystemExit('PRIVATE_BOUNDED_REQUEST_NOT_CLOSED')
          if request.get('requestId') != os.environ['EXPECTED_REQUEST_ID']:
              raise SystemExit('PRIVATE_REQUEST_ID_MISMATCH')
          if request.get('operationRequest',{}).get('exactGoverningHead') != os.environ['EXACT_PRIVATE_HEAD']:
              raise SystemExit('OPERATION_HEAD_MISMATCH')
          if request.get('constructionProcedure',{}).get('exactGoverningHead') != os.environ['EXACT_PRIVATE_HEAD']:
              raise SystemExit('PROCEDURE_HEAD_MISMATCH')
          forbidden={'command','shell','shellCommand','script','scriptBody','executable','arguments','extraArguments','environment','environmentOverride','paths','targetHead','workingDirectory','workflowOverride','architectureBundle','receiptBundle','pageReceiptBundle','browserScript','url','browserUrl','viewport'}
          if forbidden.intersection(request):
              raise SystemExit('ARBITRARY_COMMAND_FIELD_PROHIBITED')
          out=os.path.join(work,'request.json')
          with open(out,'w',encoding='utf-8') as f:
              json.dump(request,f,sort_keys=True,separators=(',',':'))
              f.write('\n')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('descriptor=' + request['descriptorId'] + '\n')
          PY

      - name: Verify live private main
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          EXPECTED_HEAD: ${{ steps.locator.outputs.head }}
        run: |
          set -euo pipefail
          observed="$(curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$PRIVATE_REPOSITORY/branches/main" | jq -r '.commit.sha')"
          test "$observed" = "$EXPECTED_HEAD"

      - name: Check out exact private source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: smansfield635-create/geodiametrics1
          ref: ${{ steps.locator.outputs.head }}
          token: ${{ steps.token.outputs.token }}
          path: private-control-plane
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact private checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ steps.locator.outputs.head }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/private-control-plane"
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD"
          test -f "$PRIVATE_CARRIER_PATH"
          git status --porcelain=v1 --untracked-files=all | grep -q . && exit 1 || true

      - name: Execute private registered bounded carrier
        id: execute
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/public-private-bounded-execution"
          node "$GITHUB_WORKSPACE/private-control-plane/$PRIVATE_CARRIER_PATH" \
            --input "$work/request.json" \
            --output "$work/native-receipt.json"

      - name: Produce redacted result
        id: redact
        if: always()
        shell: bash
        env:
          REQUEST_ID: ${{ steps.locator.outputs.request_id }}
          DESCRIPTOR_ID: ${{ steps.request.outputs.descriptor }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/public-private-bounded-execution"
          test -s "$work/native-receipt.json"
          python - <<'PY'
          import hashlib, json, os
          work=os.path.join(os.environ['RUNNER_TEMP'],'public-private-bounded-execution')
          raw=open(os.path.join(work,'native-receipt.json'),'rb').read()
          receipt=json.loads(raw)
          redacted={
            'schema':'PUBLIC_PRIVATE_BOUNDED_EXACT_HEAD_EXECUTION_REDACTED_RECEIPT_v1',
            'requestId':os.environ.get('REQUEST_ID'),
            'descriptorId':os.environ.get('DESCRIPTOR_ID'),
            'result':receipt.get('result'),
            'nativeReceiptSha256':hashlib.sha256(raw).hexdigest(),
            'runId':os.environ['GITHUB_RUN_ID'],
            'runAttempt':int(os.environ['GITHUB_RUN_ATTEMPT'])
          }
          with open(os.path.join(work,'redacted-receipt.json'),'w',encoding='utf-8') as f:
              json.dump(redacted,f,sort_keys=True,indent=2); f.write('\n')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              for k in ('result','nativeReceiptSha256'):
                  f.write(f"{k}={redacted.get(k) or ''}\n")
          PY

      - name: Publish redacted result
        if: always() && steps.redact.outputs.nativeReceiptSha256 != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.locator.outputs.request_id }}
          DESCRIPTOR_ID: ${{ steps.request.outputs.descriptor }}
          RESULT: ${{ steps.redact.outputs.result }}
          RECEIPT_SHA: ${{ steps.redact.outputs.nativeReceiptSha256 }}
        run: |
          set -euo pipefail
          body="PUBLIC_PRIVATE_BOUNDED_EXACT_HEAD_EXECUTION_RESULT_V1\nrequestId: $REQUEST_ID\ndescriptorId: $DESCRIPTOR_ID\nresult: $RESULT\nnativeReceiptSha256: $RECEIPT_SHA\nrunId: $GITHUB_RUN_ID\nrunAttempt: $GITHUB_RUN_ATTEMPT"
          jq -n --arg body "$body" '{body:$body}' > "$RUNNER_TEMP/result-comment.json"
          curl --fail-with-body --silent --show-error --request POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/578/comments" \
            --data-binary "@$RUNNER_TEMP/result-comment.json" >/dev/null

      - name: Upload redacted receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-private-bounded-execution-redacted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-private-bounded-execution/redacted-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce bounded result
        if: always()
        shell: bash
        env:
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          RESULT: ${{ steps.redact.outputs.result }}
        run: |
          set -euo pipefail
          test "$EXECUTE_OUTCOME" = 'success'
          test "$RESULT" = 'COMMAND_EXECUTED_AND_PASSED'
