name: Compass Gen1531 Semantic Invalidation Repair Transport

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/compass-performance-successor-validation.yml'

permissions:
  contents: write

env:
  REPAIR_PARENT: e002c0f9e787c4941b4fdded6a2814f11a495df8

jobs:
  repair-crystal-semantic-invalidation:
    if: github.head_ref == 'compass-gen1531-mirrorland-crystal-scheduling'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify repair parent and workflow-only staging
        run: |
          git merge-base --is-ancestor "$REPAIR_PARENT" HEAD
          test "$(git diff --name-only "$REPAIR_PARENT" HEAD)" = '.github/workflows/compass-performance-successor-validation.yml'
          git diff --quiet "$REPAIR_PARENT" HEAD -- assets/compass/compass.crystals.js
      - name: Restrict invalidation to semantic state and push product only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('assets/compass/compass.crystals.js')
          s=p.read_text()
          pattern=r'''    const watchedAttributes = \[.*?\n    \];'''
          replacement='''    const watchedAttributes = [\n      "data-compass-mode",\n      "data-orbit-focus",\n      "data-orbit-phase",\n      "data-orbit-gesture-active",\n      "data-active-cluster-wing",\n      "data-cluster-primary-room",\n      "data-cluster-phase",\n      "data-cluster-gesture-active",\n      "data-cluster-revision",\n      "data-selected-cardinal",\n      "data-selected-room",\n      "data-selected-destination-type",\n      "data-selected-destination-id",\n      "data-selected-destination-label",\n      "data-selected-route",\n      "data-reduced-motion"\n    ];'''
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'watchedAttributes replacement count={n}')
          p.write_text(s2)
          PY
          node --check assets/compass/compass.crystals.js
          test "$(git diff --name-only | sort)" = 'assets/compass/compass.crystals.js'
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/compass/compass.crystals.js
          git commit -m 'Restrict Compass crystal invalidation to semantic state'
          git push origin HEAD:${{ github.head_ref }}
