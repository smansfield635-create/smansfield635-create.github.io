name: Laws CP6-4/5 corrected execution

on:
  pull_request:
    branches:
      - agent/laws-cp6-3-canonical-content-migration-001
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  execute:
    if: github.head_ref == 'agent/laws-cp6-4-first-theme-and-page-consolidation-002'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/laws-cp6-4-first-theme-and-page-consolidation-002
          fetch-depth: 0

      - name: Confirm exact temporary scope
        shell: bash
        run: |
          set -euo pipefail
          CP63=a76bb97f9a63c588b5e7131b3dc3461f8d1e36ee
          test "$(git merge-base HEAD "$CP63")" = "$CP63"
          mapfile -t changed < <(git diff --name-only "$CP63"..HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = ".github/scripts/laws_cp645_wrapper.py"
          test "${changed[1]}" = ".github/workflows/laws-cp6-4-5-execution-carrier.yml"
          test "${changed[2]}" = ".github/workflows/laws-cp6-4-5-first-consolidation.yml"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check beautifulsoup4 playwright pillow
          python3 -m playwright install chromium

      - name: Execute formal review and consolidation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/laws_cp645_wrapper.py
          rm -f .github/scripts/laws_cp645_wrapper.py
          rm -f .github/workflows/laws-cp6-4-5-execution-carrier.yml
          python3 /tmp/laws_cp645.py

      - name: Commit inspectable candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "CP6-4/5 implement F.I.R.S.T. and consolidate Laws pages"
          git push origin HEAD:agent/laws-cp6-4-first-theme-and-page-consolidation-002
