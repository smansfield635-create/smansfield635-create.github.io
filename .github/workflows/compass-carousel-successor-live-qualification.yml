name: Compass Carousel Successor Live Qualification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compass-carousel-successor-live-qualification.yml'
      - 'assets/compass/compass.carousel.js'
      - 'assets/compass/compass.carousel.css'
      - '.github/workflows/pages-direct-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        env:
          npm_config_package_lock: 'false'
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Qualify deployed Compass successor
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const live='https://diamondgatebridge.com/?compass-successor-qualify=successor-v3';
          const expectedVersion='successor-v3';
          const browser=await chromium.launch({headless:true});
          const checks=[]; const check=(id,pass,evidence)=>checks.push({id,pass:Boolean(pass),evidence}); let fatal=null;
          async function load(page,suffix='desktop'){
            for(let n=0;n<18;n++){
              await page.goto(`${live}-${suffix}-${n}`,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(500);
              const state=await page.evaluate(()=>({version:globalThis.CompassEditorialCarousel?.version||'',statement:!!document.querySelector('[data-statement-orbit]'),capability:!!document.querySelector('[data-capability-orbit]'),legacy:!!document.querySelector('[data-compass-capability-switcher]')}));
              if(state.version===expectedVersion&&state.statement&&state.capability&&!state.legacy)return state;
              await page.waitForTimeout(10000);
            }
            return page.evaluate(()=>({version:globalThis.CompassEditorialCarousel?.version||'',statement:!!document.querySelector('[data-statement-orbit]'),capability:!!document.querySelector('[data-capability-orbit]'),legacy:!!document.querySelector('[data-compass-capability-switcher]')}));
          }
          async function swipe(page,locator,fromX=.72,toX=.42,y=.35){
            await locator.scrollIntoViewIfNeeded(); await page.waitForTimeout(180);
            const b=await locator.boundingBox(); if(!b)throw new Error('Missing swipe box');
            await page.mouse.move(b.x+b.width*fromX,b.y+b.height*y); await page.mouse.down(); await page.mouse.move(b.x+b.width*toX,b.y+b.height*y,{steps:5}); return b;
          }
          try{
            const ctx=await browser.newContext({viewport:{width:1280,height:800}}),page=await ctx.newPage(),errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            const loaded=await load(page);
            check('LIVE_SUCCESSOR_RUNTIME',loaded.version===expectedVersion,loaded); check('LIVE_STATEMENT_ORBIT',loaded.statement,loaded); check('LIVE_CAPABILITY_ORBIT',loaded.capability,loaded); check('LEGACY_SWITCHER_REMOVED',!loaded.legacy,loaded);
            const structure=await page.evaluate(()=>{const ps=[...document.querySelectorAll('.compass-orbit-plaque')],ss=[...document.querySelectorAll('.compass-statement-object')],rear=ps.find(x=>x.dataset.slot==='rear'),rs=rear&&getComputedStyle(rear),rr=rear?.getBoundingClientRect();const nav=[...document.querySelectorAll('[data-statement-orbit] button,[data-statement-orbit] a,[data-capability-orbit] button,[data-capability-orbit] a')].filter(el=>{if(!el.offsetParent)return false;const t=(el.textContent||'').trim().toLowerCase(),a=(el.getAttribute('aria-label')||'').toLowerCase();return t==='previous'||t==='next'||a.includes('previous')||a.includes('next');}).length;const counters=[...document.querySelectorAll('[data-statement-orbit] [class*="counter"],[data-capability-orbit] [class*="counter"],[data-carousel-counter]')].filter(x=>x.offsetParent).length;return{statements:ss.length,noChrome:ss.every(el=>{const s=getComputedStyle(el);return s.borderTopWidth==='0px'&&s.backgroundImage==='none'&&s.backgroundColor==='rgba(0, 0, 0, 0)';}),plaques:ps.length,rearVisible:!!(rr&&rr.width&&rr.height&&Number(rs.opacity)>.1),rearFilter:rs?.filter||'',rearPointer:rs?.pointerEvents||'',nav,counters};});
            check('TWO_FLOATING_STATEMENTS',structure.statements===2,structure); check('STATEMENTS_NO_CARD_CHROME',structure.noChrome,structure); check('TWO_CAPABILITY_PLAQUES',structure.plaques===2,structure); check('REAR_PARENT_VISIBLE',structure.rearVisible&&structure.rearFilter.includes('blur'),structure); check('REAR_PARENT_NONINTERACTIVE',structure.rearPointer==='none',structure); check('NO_VISIBLE_ARROW_CONTROLS',structure.nav===0,structure.nav); check('NO_NUMERIC_COUNTERS',structure.counters===0,structure.counters);

            const brain=page.locator('.compass-orbit-plaque[data-slot="front"] [data-human-brain] canvas'); await brain.scrollIntoViewIfNeeded(); await page.waitForTimeout(180);
            check('BRAIN_CANVAS_PRESENT',await brain.count()===1,await brain.count()); const bi=await brain.evaluate(el=>({w:el.width,h:el.height,data:el.toDataURL().length})); check('BRAIN_RENDERED_NONEMPTY',bi.w>10&&bi.h>10&&bi.data>1000,bi);
            const bb=await brain.boundingBox(),parent0=await page.locator('.compass-orbit-plaque[data-slot="front"]').getAttribute('data-capability'); await page.mouse.move(bb.x+bb.width*.42,bb.y+bb.height*.5);await page.mouse.down();await page.mouse.move(bb.x+bb.width*.70,bb.y+bb.height*.5,{steps:4});await page.mouse.up();await page.waitForTimeout(160);const parent1=await page.locator('.compass-orbit-plaque[data-slot="front"]').getAttribute('data-capability');check('BRAIN_PARENT_GESTURE_ISOLATION',parent0===parent1,{parent0,parent1});

            const stage=page.locator('[data-capability-orbit]'); await stage.scrollIntoViewIfNeeded(); await page.waitForTimeout(180); const before=await page.evaluate(()=>[...document.querySelectorAll('.compass-orbit-plaque')].map(x=>({id:x.dataset.capability,slot:x.dataset.slot,transform:getComputedStyle(x).transform})));
            await swipe(page,stage,.40,.16,.22); const held=await page.evaluate(()=>[...document.querySelectorAll('.compass-orbit-plaque')].map(x=>({id:x.dataset.capability,slot:x.dataset.slot,transform:getComputedStyle(x).transform}))); check('NO_POINTER_CUSTODIED_INTERMEDIATE_GEOMETRY',JSON.stringify(before)===JSON.stringify(held),{before,held}); await page.mouse.up(); await page.waitForTimeout(600); const after=await page.evaluate(()=>[...document.querySelectorAll('.compass-orbit-plaque')].map(x=>({id:x.dataset.capability,slot:x.dataset.slot}))); check('ONE_GESTURE_ONE_NEIGHBOR',after.find(x=>x.slot==='front')?.id==='house',{before,after});

            const enterHouse=page.locator('.compass-orbit-plaque[data-slot="front"] [data-enter-house]'); await enterHouse.scrollIntoViewIfNeeded(); await enterHouse.click(); await page.waitForTimeout(180);
            const nested0=await page.evaluate(()=>{const orbit=document.querySelector('[data-house-orbit]'),r=orbit?.getBoundingClientRect(),s=orbit?getComputedStyle(orbit):null;return{mode:document.querySelector('[data-capability-orbit]')?.dataset.capabilityMode||'',parent:document.querySelector('.compass-orbit-plaque[data-slot="front"]')?.dataset.capability||'',houseHidden:orbit?.hidden??true,houseDisplay:s?.display||'',houseVisible:!!(r&&r.width>0&&r.height>0&&s.display!=='none'),members:[...document.querySelectorAll('.house-orbit-member')].map(x=>({id:x.dataset.member,slot:x.dataset.slot,href:x.querySelector('a[href]')?.getAttribute('href')||null}))};});
            check('HOUSE_MEMBER_ORBIT_ACTIVE',nested0.mode==='house-members'&&nested0.houseHidden===false&&nested0.houseVisible&&nested0.members.length===3,nested0);check('JEEVES_ROUTE_PRESERVED',nested0.members.find(x=>x.id==='jeeves')?.href==='/showroom/globe/hearth/jeeves/',nested0.members);check('ELARA_NO_FABRICATED_ROUTE',nested0.members.find(x=>x.id==='elara')?.href===null,nested0.members);check('AUREN_NO_FABRICATED_ROUTE',nested0.members.find(x=>x.id==='auren')?.href===null,nested0.members);
            const nested=page.locator('[data-house-orbit]'); await nested.scrollIntoViewIfNeeded(); await page.waitForTimeout(180); await swipe(page,nested,.72,.45,.25); await page.mouse.up(); await page.waitForTimeout(600); const nested1=await page.evaluate(()=>({mode:document.querySelector('[data-capability-orbit]')?.dataset.capabilityMode||'',parent:document.querySelector('.compass-orbit-plaque[data-slot="front"]')?.dataset.capability||'',member:document.querySelector('.house-orbit-member[data-slot="front"]')?.dataset.member||'',rear:[...document.querySelectorAll('.house-orbit-member')].filter(x=>x.dataset.slot?.startsWith('rear')).filter(x=>{const r=x.getBoundingClientRect(),s=getComputedStyle(x);return r.width>0&&r.height>0&&Number(s.opacity)>.1}).length})); check('PARENT_NESTED_GESTURE_ISOLATION',nested1.mode==='house-members'&&nested1.parent==='house',nested1);check('NESTED_ONE_NEIGHBOR',nested1.member==='elara',nested1);check('NESTED_REAR_PEERS_VISIBLE',nested1.rear===2,nested1);
            const returnHouse=page.locator('.house-orbit-member[data-slot="front"] [data-return-house]');await returnHouse.click();await page.waitForTimeout(180);const returned=await page.evaluate(()=>({mode:document.querySelector('[data-capability-orbit]')?.dataset.capabilityMode||'',parent:document.querySelector('.compass-orbit-plaque[data-slot="front"]')?.dataset.capability||'',houseHidden:document.querySelector('[data-house-orbit]')?.hidden??false}));check('RETURN_TO_PARENT_ORBIT',returned.mode==='orbit'&&returned.parent==='house'&&returned.houseHidden===true,returned);
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);check('DESKTOP_NO_HORIZONTAL_OVERFLOW',overflow<=2,overflow);check('NO_PAGE_ERRORS',errors.length===0,errors);await page.screenshot({path:'/tmp/compass-successor-desktop.png',fullPage:true});await ctx.close();

            const pc=await browser.newContext({viewport:{width:390,height:844}}),phone=await pc.newPage(),perrors=[];phone.on('pageerror',e=>perrors.push(String(e)));await load(phone,'phone');const pm=await phone.evaluate(()=>({overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,rear:[...document.querySelectorAll('.compass-orbit-plaque[data-slot="rear"]')].some(x=>{const r=x.getBoundingClientRect(),s=getComputedStyle(x);return r.width>0&&r.height>0&&Number(s.opacity)>.1})}));check('PHONE_NO_HORIZONTAL_OVERFLOW',pm.overflow<=2,pm);check('PHONE_REAR_PEER_VISIBLE',pm.rear,pm);check('PHONE_NO_PAGE_ERRORS',perrors.length===0,perrors);await phone.screenshot({path:'/tmp/compass-successor-phone.png',fullPage:true});await pc.close();

            const rc=await browser.newContext({viewport:{width:390,height:844},reducedMotion:'reduce'}),rm=await rc.newPage();await load(rm,'reduced');const rb=rm.locator('.compass-orbit-plaque[data-slot="front"] [data-human-brain] canvas');await rb.scrollIntoViewIfNeeded();const im1=await rb.evaluate(el=>el.toDataURL());await rm.waitForTimeout(450);const im2=await rb.evaluate(el=>el.toDataURL());check('REDUCED_MOTION_BRAIN_STATIC',im1===im2,{len1:im1.length,len2:im2.length});check('REDUCED_MOTION_INFORMATION_EQUIVALENT',await rm.locator('.compass-orbit-plaque').count()===2,await rm.locator('.compass-orbit-plaque').count());await rc.close();
          }catch(e){fatal=String(e?.stack||e);check('QUALIFIER_EXECUTION',false,fatal);}finally{await browser.close();}
          const failures=checks.filter(x=>!x.pass);const receipt={schema:'COMPASS_CAROUSEL_SUCCESSOR_LIVE_QUALIFICATION_v1',expectedProductIdentity:expectedVersion,result:failures.length?'FAIL_CLOSED':'PASS_CLOSED',checks,failures:failures.map(x=>x.id),fatal};fs.writeFileSync('/tmp/compass-carousel-successor-live-receipt.json',JSON.stringify(receipt,null,2)+'\n');console.log(JSON.stringify(receipt,null,2));if(failures.length)process.exit(1);
          NODE
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compass-carousel-successor-live-qualification
          path: |
            /tmp/compass-carousel-successor-live-receipt.json
            /tmp/compass-successor-desktop.png
            /tmp/compass-successor-phone.png
