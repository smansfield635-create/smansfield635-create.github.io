name: Full Bird Kernel v3.2 conformance

on:
  pull_request:
    paths:
      - 'laws/research/methods-and-models/full_bird_kernel_v3_2/**'
      - '.github/workflows/full-bird-kernel-v3-2-conformance.yml'
  push:
    paths:
      - 'laws/research/methods-and-models/full_bird_kernel_v3_2/**'
      - '.github/workflows/full-bird-kernel-v3-2-conformance.yml'

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v3.2 conformance suite
        working-directory: laws/research/methods-and-models/full_bird_kernel_v3_2
        run: python -m unittest -v test_fbk_v3_2.py
      - name: Validate canonical JSON artifacts
        run: |
          python -m json.tool laws/research/methods-and-models/full_bird_kernel_v3_2/requirements_registry.json >/dev/null
          python -m json.tool laws/research/methods-and-models/full_bird_kernel_v3_2/claim_manifest.json >/dev/null
          python -m json.tool laws/research/methods-and-models/full_bird_kernel_v3_2/fixtures.json >/dev/null
          python -m json.tool laws/research/methods-and-models/full_bird_kernel_v3_2/release_manifest.json >/dev/null
