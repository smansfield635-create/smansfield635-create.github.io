name: H-Earth Inter-Hill Estate Negative Schema Lock Closure Carrier

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - '.github/workflows/h-earth-inter-hill-estate-negative-schema-lock-closure-carrier.yml'

permissions:
  contents: write
  pull-requests: read
  actions: read

jobs:
  close-exact-operation-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a96447b720b9466a3843a4eafb52a990e449f580
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable correction, registry merge, and fresh preflight
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/${GITHUB_REPOSITORY}/pulls/616 --jq .head.sha)" = "b935c204da2904e86f9c9c566bed0ac9b0de4193"
          test "$(gh api repos/${GITHUB_REPOSITORY}/pulls/616 --jq .merged)" = "false"
          test "$(gh api repos/${GITHUB_REPOSITORY}/pulls/624 --jq .merged)" = "true"
          test "$(gh api repos/${GITHUB_REPOSITORY}/pulls/624 --jq .merge_commit_sha)" = "a96447b720b9466a3843a4eafb52a990e449f580"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/31045111771 --jq .conclusion)" = "success"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/31045111835 --jq .conclusion)" = "success"
      - name: Execute canonical fixed lock termination command
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/operation-intake/repository-operation-lock-manager.v1.mjs \
            --action close \
            --repository "${GITHUB_REPOSITORY}" \
            --lock-ref refs/heads/operation-locks/repository-operation-intake-v1 \
            --operation-id H_EARTH_INTER_HILL_ESTATE_SUCCESSOR_EVALUATOR_NEGATIVE_FIXTURE_AND_SCHEMA_ENFORCEMENT_CORRECTION_001 \
            --lock-scope H_EARTH/INTER_HILL_ESTATE_SUCCESSOR_EVALUATOR/NEGATIVE_FIXTURE_AND_SCHEMA_ENFORCEMENT_CORRECTION_001 \
            --lock-generation 258 \
            --terminal-disposition PASS_CLOSED \
            --output "$RUNNER_TEMP/root-lock-closure-receipt.json"
      - name: Verify exact closure receipt
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=process.env.RUNNER_TEMP+'/root-lock-closure-receipt.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          const checks=[
            r.schema==='REPOSITORY_OPERATION_REMOTE_CLOSURE_RECEIPT_v1',
            r.result==='TERMINAL_CLOSURE_COMMITTED',
            r.operationId==='H_EARTH_INTER_HILL_ESTATE_SUCCESSOR_EVALUATOR_NEGATIVE_FIXTURE_AND_SCHEMA_ENFORCEMENT_CORRECTION_001',
            r.lockScope==='H_EARTH/INTER_HILL_ESTATE_SUCCESSOR_EVALUATOR/NEGATIVE_FIXTURE_AND_SCHEMA_ENFORCEMENT_CORRECTION_001',
            r.lockGeneration===258,
            r.terminalDisposition==='PASS_CLOSED',
            r.lockReleased===true,
            r.terminalHistoryPreserved===true,
            /^[0-9a-f]{40}$/.test(r.closureCommitSha),
            /^[0-9a-f]{40}$/.test(r.committedLedgerBlobSha)
          ];
          if(checks.some(x=>!x))throw Error('LOCK_CLOSURE_RECEIPT_IDENTITY_FAILURE');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: h-earth-inter-hill-estate-negative-schema-lock-closure-258
          path: ${{ runner.temp }}/root-lock-closure-receipt.json
          if-no-files-found: error
          retention-days: 90
