name: Education Compression Localization Parity Qualification v1
on:
  workflow_dispatch:
    inputs:
      candidate_sha: {required: true, type: string}
      base_sha: {required: true, type: string}
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Qualify EN ES ZH compression parity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=10 origin "$CANDIDATE_SHA" "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = products/education/index.html
          git show "$CANDIDATE_SHA:products/education/index.html" >/tmp/c.html
          git show "$BASE_SHA:products/education/index.html" >/tmp/b.html
          node - <<'NODE'
          const fs=require('fs'),c=fs.readFileSync('/tmp/c.html','utf8'),b=fs.readFileSync('/tmp/b.html','utf8');
          for(const src of [...c.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]))new Function(src);
          const block=(s,a,z)=>s.slice(s.indexOf(a),s.indexOf(z,s.indexOf(a)));
          for(const [a,z,n] of [['const BANK=','const CAPSTONE_BANK=','BANK'],['const CAPSTONE_BANK=','const EDUCATION_STATE_KEY=','CAPSTONE'],['function placementCoordinate','const BANK=','CROSSWALK'],['function submitAdaptiveAnswer','function resolveAdaptiveBoundary','ADAPTIVE']])if(block(c,a,z)!==block(b,a,z))throw Error('frozen '+n+' changed');
          const old=[
            'Move through the journey one step at a time.',
            'Six cards share one learning path.',
            'Avanza paso a paso.',
            'Seis tarjetas comparten un recorrido.',
            '一步一步完成学习旅程。',
            '六张卡片共用一条学习路径。',
            'From possibility to action',
            'De la posibilidad a la acción',
            '从可能性到行动'
          ];
          for(const x of old)if(c.includes(x))throw Error('stale localized copy '+x);
          const required=[
            'journeyLead:"See how the system works, one step at a time."',
            'railNote:"Drag, swipe, tap a neighboring card, or use the arrow keys."',
            'gatewayEye:"Your starting point"',
            'journeyLead:"Mira cómo funciona el sistema, paso a paso."',
            'railNote:"Arrastra, desliza, toca una tarjeta vecina o usa las flechas."',
            'gatewayEye:"Tu punto de partida"',
            'journeyLead:"一步一步了解这个系统如何运作。"',
            'railNote:"拖动、滑动、点击相邻卡片，或使用方向键。"',
            'gatewayEye:"你的起点"'
          ];
          for(const x of required)if(!c.includes(x))throw Error('missing localized parity '+x);
          for(const x of ['pointermove','data-flip','CAPSTONE_PASS','PUBLIC_AVAILABLE','NOT_CURRENTLY_AVAILABLE','data-shell-language="en"','data-shell-language="es"','data-shell-language="zh"'])if(!c.includes(x))throw Error('runtime regression '+x);
          console.log('EDUCATION_COMPRESSION_LOCALIZATION_PARITY=PASS');
          NODE
