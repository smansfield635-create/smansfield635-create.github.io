name: Compass cache delivery repair

on:
  push:
    branches:
      - agent/compass-cache-delivery-repair-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/compass-cache-delivery-repair-v1
          fetch-depth: 0

      - name: Apply exact Compass stylesheet cache identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          old = b'compass.css?v=dgb-main-compass-architecture-context-round-002-v1'
          new = b'compass.css?v=display-continuity-reference-v1'
          data = path.read_bytes()
          assert data.count(old) == 1, f'expected exactly one old cache identity, found {data.count(old)}'
          assert data.count(new) == 0, f'new cache identity already present {data.count(new)} time(s)'
          data = data.replace(old, new, 1)
          assert data.count(old) == 0
          assert data.count(new) == 1
          path.write_bytes(data)
          PY
          git diff --exit-code -- . ':!index.html'
          git diff --check -- index.html

      - name: Commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git diff --cached --exit-code -- . ':!index.html'
          git diff --cached --quiet && exit 0
          git commit -m 'Bust Compass reference stylesheet cache identity'
          git push origin HEAD:agent/compass-cache-delivery-repair-v1
