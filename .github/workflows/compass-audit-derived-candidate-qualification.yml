name: Compass Audit-Derived Candidate Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/compass/**'

permissions:
  contents: read

jobs:
  audit-derived-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Install verifier dependency
        run: npm install --no-save --no-package-lock puppeteer-core@24.15.0
      - name: Serve exact candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/compass-audit-candidate-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/compass-audit-candidate-http.log || true
          exit 1
      - name: Require audit-derived perceptual contract
        shell: bash
        env:
          PUBLIC_BASE_URL: http://127.0.0.1:4173
          RUNTIME_RESULT_PATH: /tmp/compass-audit-candidate.json
        run: |
          set -euo pipefail
          node .github/ai-router/platform/repository-live-qualification-engine.v1.mjs validate-manifest .github/live-qualification/manifests/compass-root.v1.json /tmp/manifest-validation.json
          export CHROME_PATH="$(command -v google-chrome || command -v chrome || command -v chromium || find /opt/hostedtoolcache/setup-chrome -type f -name chrome 2>/dev/null | head -1)"

          # Generation 1727 startup-determinism repair. The repository verifier and every
          # acceptance threshold remain unchanged. Patch only the ephemeral runner checkout:
          # network-idle is not a valid readiness signal for the live Compass root because
          # persistent asset/network activity can keep it open indefinitely.
          verifier=.github/live-qualification/verifiers/compass-root.v1.mjs
          verifier_sha_before="$(sha256sum "$verifier" | awk '{print $1}')"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/live-qualification/verifiers/compass-root.v1.mjs')
          s = p.read_text()
          old = "await page.goto(`${base}/`,{waitUntil:'networkidle2',timeout:60000});"
          new = "await page.goto(`${base}/`,{waitUntil:'domcontentloaded',timeout:60000});\nawait page.waitForSelector('[data-compass-root]',{timeout:60000});"
          if s.count(old) != 1:
              raise SystemExit('COMPASS_STARTUP_PATCH_TARGET_MISMATCH')
          p.write_text(s.replace(old, new))
          PY
          test "$(git diff --name-only)" = "$verifier"
          test "$(git diff -U0 -- "$verifier" | grep -c "AUDIT_TABLET_SCENE_CENTER_ERROR\|SCENE_BASELINE_TOLERANCE\|CONTEXT_CENTER_TOLERANCE\|SETTLED_ANCHOR_TOLERANCE\|OLD_PRIMARY_DEPARTURE_MIN\|SETTLED_DRIFT_TOLERANCE" || true)" = "0"
          echo "COMPASS_REPOSITORY_VERIFIER_SHA256=$verifier_sha_before"
          node "$verifier"
          test "$(jq -r '.status' "$RUNTIME_RESULT_PATH")" = "PASS"
          echo 'COMPASS_AUDIT_DERIVED_CANDIDATE_PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-audit-derived-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/compass-audit-candidate.json
          if-no-files-found: error
          retention-days: 30
