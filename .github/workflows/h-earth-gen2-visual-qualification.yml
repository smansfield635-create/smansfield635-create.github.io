name: H-Earth Gen2 Visual Qualification
on:
  workflow_dispatch:
    inputs:
      target_sha:
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  visual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
      - name: Require exact candidate
        run: test "$(git rev-parse HEAD)" = "${{ inputs.target_sha }}"
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Materialize verifier from explicit control-plane commit
        shell: bash
        env:
          CONTROL_PLANE_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$CONTROL_PLANE_SHA"
          git show "$CONTROL_PLANE_SHA:tools/h-earth-gen2-visual-qualify.mjs" > .gen2-visual-qualify.control-plane.mjs
          test -s .gen2-visual-qualify.control-plane.mjs
      - name: Capture Gen2
        run: node .gen2-visual-qualify.control-plane.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h-earth-gen2-visual-${{ inputs.target_sha }}
          path: /tmp/gen2-evidence
          if-no-files-found: error
          retention-days: 30

  gen3230-gen3228-optimized-grass-comparison:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'h-earth/gen3229-optimized-wide-grass-qualification-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Fetch immutable inspection candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          sparse-checkout: |
            tools
            .github/workflows
      - name: Verify exact admitted inspection commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install established first-party Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Exact published versus Gen3228 native WebGL, GPU, scheduling and capacity comparison
        run: |
          node --check tools/h-earth-gen2-visual-qualify.mjs
          node tools/h-earth-gen2-visual-qualify.mjs --gen3226-wide-grass-comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h-earth-gen3230-exact-gen3228-optimized-grass-native-webgl
          path: /tmp/gen2-evidence/gen3226
          if-no-files-found: error
          retention-days: 30
