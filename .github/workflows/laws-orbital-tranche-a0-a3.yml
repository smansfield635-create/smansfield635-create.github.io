name: Laws Orbital Tranche A0-A3

on:
  push:
    branches:
      - agent/laws-orbital-tranche-a0-a3-v1
    paths:
      - .github/workflows/laws-orbital-tranche-a0-a3.yml

permissions:
  contents: write

concurrency:
  group: laws-orbital-tranche-a0-a3-v1
  cancel-in-progress: false

jobs:
  construct:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 9eb636d33cff36b2344bb721726db7b4e8dcd2bc
      BASE_TREE: d850728805825599f268e9021fb669f2e9f5790b
      BRANCH: agent/laws-orbital-tranche-a0-a3-v1
    steps:
      - name: Checkout authorized branch
        uses: actions/checkout@v4
        with:
          ref: agent/laws-orbital-tranche-a0-a3-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Preflight authority and branch relation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$BRANCH"
          git cat-file -e "$BASE_SHA^{commit}"
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "$BASE_TREE"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git config user.name "laws-orbital-construction-bot"
          git config user.email "laws-orbital-construction-bot@users.noreply.github.com"

      - name: A0 — orientation integration and tranche controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p laws/orbital-tranche-a0-a3/receipts

          cat > laws/orbital-tranche-a0-a3/manifest.v1.json <<'EOF'
          {
            "recordId": "LAWS_ORBITAL_TRANCHE_A0_A3_MANIFEST_v1",
            "constructionBase": "9eb636d33cff36b2344bb721726db7b4e8dcd2bc",
            "surface": {
              "surfaceId": "LAWS_COMPLETE_STORY",
              "semanticType": "NARRATIVE_SEQUENCE",
              "canonicalOrder": "1_TO_24",
              "orderingAuthority": ["LAWS_COMPLETE_NARRATIVE_MAP_v1", "LAWS_COMPLETE_NARRATIVE_MAP_FREEZE_RECORD_v1"],
              "wrapPolicy": "BOUNDED",
              "selectionMeaning": "NARRATIVE_INTERACTION_FOCUS",
              "routeBehavior": "DIRECT_ENTRY_PLUS_BOUNDED_PREVIOUS_NEXT",
              "statePersistence": "ROUTE_IDENTITY"
