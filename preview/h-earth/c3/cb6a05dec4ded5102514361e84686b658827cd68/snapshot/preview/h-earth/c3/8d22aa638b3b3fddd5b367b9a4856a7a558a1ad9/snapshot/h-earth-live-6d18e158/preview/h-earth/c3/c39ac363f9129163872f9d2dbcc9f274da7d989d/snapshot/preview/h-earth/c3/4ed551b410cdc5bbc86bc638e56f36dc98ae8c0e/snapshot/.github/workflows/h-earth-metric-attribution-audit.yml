name: H-Earth Metric Attribution Audit

on:
  pull_request:
    paths:
      - '.github/workflows/h-earth-metric-attribution-audit.yml'
      - 'h-earth-3d/control-plane/post-cp2-round2/metric-attribution/**'
      - 'h-earth-3d/validation/metric-attribution/**'
      - 'h-earth-3d/research/metric-attribution/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-bounded-metric-attribution-checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact checkpoint head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bounded Chromium dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start diagnostic server
        run: |
          python3 -m http.server 4181 --bind 127.0.0.1 > /tmp/h-earth-metric-attribution-server.log 2>&1 &
          echo $! > /tmp/h-earth-metric-attribution-server.pid
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4181/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/h-earth-metric-attribution-server.log
          exit 1
      - name: Select exact bounded checkpoint runner
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          RUNNER=$(git diff --name-only "$BASE_SHA..HEAD" | grep -E '^h-earth-3d/validation/metric-attribution/h-earth\.(ma[1-6]|rma[0-3]).*\.runner\.mjs$' | sort | tail -n 1)
          if [ -z "$RUNNER" ]; then
            echo 'No bounded MA1-MA6 or RMA0-RMA3 runner found in the pull request.'
            git diff --name-only "$BASE_SHA..HEAD"
            exit 1
          fi
          echo "runner=$RUNNER" >> "$GITHUB_OUTPUT"
          echo "Selected runner: $RUNNER"
      - name: Execute bounded checkpoint
        env:
          METRIC_ATTRIBUTION_HARNESS_URL: http://127.0.0.1:4181/h-earth-3d/validation/metric-attribution/h-earth.ma1-existing-metric-reproduction-harness.html
        run: |
          set -o pipefail
          node "${{ steps.select.outputs.runner }}" | tee h-earth.metric-attribution-checkpoint.log
      - name: Upload bounded checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-metric-attribution-checkpoint
          path: |
            h-earth-3d/validation/metric-attribution/*.receipt.v1.json
            h-earth-3d/validation/metric-attribution/ma*-evidence/
            h-earth-3d/validation/metric-attribution/rma*-evidence/
            h-earth-3d/research/metric-attribution/
            h-earth.metric-attribution-checkpoint.log
            /tmp/h-earth-metric-attribution-server.log
          if-no-files-found: warn
          retention-days: 90
      - name: Report checkpoint disposition
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const directory = 'h-earth-3d/validation/metric-attribution';
          const receipts = fs.readdirSync(directory)
            .filter((name) => name.endsWith('.receipt.v1.json'))
            .map((name) => ({ name, path: path.join(directory, name), mtime: fs.statSync(path.join(directory, name)).mtimeMs }))
            .sort((a, b) => b.mtime - a.mtime);
          if (!receipts.length) throw new Error('METRIC_ATTRIBUTION_RECEIPT_MISSING');
          const receipt = JSON.parse(fs.readFileSync(receipts[0].path, 'utf8'));
          if (receipt.passClosed !== true) {
            console.error(JSON.stringify(receipt, null, 2));
            process.exit(1);
          }
          console.log(`METRIC_ATTRIBUTION_DISPOSITION:${receipt.checkpoint}:${receipt.result}:${receipt.canonicalReceiptSha256}:${receipt.resumeToken}`);
          NODE
