name: L2 HC05 Gen957 Visible Browser Evidence v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/l2-hc05-gen957-browser-navigation-evidence-v1.yml'

permissions:
  contents: read

env:
  L2_ADMISSION_HEAD: e52fe4e8fa9e6f6d65710e32ce0dfa6f54b8382e
  HC05_PRODUCT_BASE: 8b253efb26a22e30c85c28d2666dcfbfb1fbc173
  HC05_CANDIDATE_SHA: 074f6460ae4acdb523deac6c9584e5d75e384c7a
  HC05_EXPECTED_PACKAGE_ID: H_EARTH_RUN_8E_R2_LIVE_RENDER_PACKAGE_263563C5
  EVIDENCE_DIR: /tmp/l2-hc05-gen957-visible-browser-evidence

jobs:
  visible-browser-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact carrier scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$L2_ADMISSION_HEAD" HEAD | sort > /tmp/actual.txt
          printf '%s\n' '.github/workflows/l2-hc05-gen957-browser-navigation-evidence-v1.yml' > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          mkdir -p "$EVIDENCE_DIR"
          cp /tmp/actual.txt "$EVIDENCE_DIR/carrier-paths.txt"

      - name: Checkout exact product candidate read-only
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HC05_CANDIDATE_SHA }}
          path: hc05-candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact product scope and protected sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C hc05-candidate rev-parse HEAD)" = "$HC05_CANDIDATE_SHA"
          git -C hc05-candidate diff --name-only "$HC05_PRODUCT_BASE" "$HC05_CANDIDATE_SHA" | sort > "$EVIDENCE_DIR/product-paths.txt"
          cat > /tmp/expected-product.txt <<'EOF'
          h-earth-3d/environment/h-earth.successor-surface-material.run8c.js
          h-earth-3d/environment/h-earth.vegetation-resolution.run8d.js
          showroom/globe/h-earth/functional-landscape/navigation.js
          showroom/globe/h-earth/functional-landscape/public-live-gpu-integration.run8e-r3e.js
          showroom/globe/h-earth/render/geometry-shoreline.js
          showroom/globe/h-earth/render/geometry-successor-terrain.run8b.js
          showroom/globe/h-earth/render/live-renderer-contract.run8e-r3a.js
          showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js
          EOF
          sort -o /tmp/expected-product.txt /tmp/expected-product.txt
          diff -u /tmp/expected-product.txt "$EVIDENCE_DIR/product-paths.txt"
          test "$(git -C hc05-candidate rev-parse "$HC05_CANDIDATE_SHA:h-earth-3d/terrain/h-earth.terrain-estate-construction-v1.candidate.js")" = "4ec87cdd5ec1b73710da6dd686a96610a633d27a"
          test "$(git -C hc05-candidate rev-parse "$HC05_CANDIDATE_SHA:showroom/globe/h-earth/terrain-estate-construction-v1/renderer.mjs")" = "1f9f03cc10c687f6890ff3efed417018fd3496bf"

      - name: Install Chromium capability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hc05-playwright
          cd /tmp/hc05-playwright
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false playwright pngjs
          npx playwright install --with-deps chromium

      - name: Start candidate server
        shell: bash
        run: |
          set -euo pipefail
          (cd hc05-candidate && python3 -m http.server 4174 > "$EVIDENCE_DIR/server.log" 2>&1 &)
          for attempt in $(seq 1 40); do
            curl --fail --silent http://127.0.0.1:4174/showroom/globe/h-earth/ >/dev/null && break
            test "$attempt" != 40
            sleep 1
          done

      - name: Execute visible desktop and Samsung navigation matrix
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/hc05-playwright/run.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { PNG } from 'pngjs';
          import { chromium } from 'playwright';

          const out = process.env.EVIDENCE_DIR;
          const configs = [
            { id:'desktop-landscape', width:1280, height:800, mobile:false, touch:false, dsf:1 },
            { id:'samsung-portrait', width:412, height:915, mobile:true, touch:true, dsf:3 },
            { id:'samsung-landscape', width:915, height:412, mobile:true, touch:true, dsf:3 }
          ];
          const browser = await chromium.launch({headless:true});
          const results=[];
          await fs.mkdir(out,{recursive:true});

          function analyzePng(buffer){
            const png=PNG.sync.read(buffer);
            let lum=0, nonblack=0, count=0;
            const x0=Math.floor(png.width*.15), x1=Math.ceil(png.width*.85);
            const y0=Math.floor(png.height*.18), y1=Math.ceil(png.height*.82);
            for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++){
              const i=(y*png.width+x)*4;
              const r=png.data[i],g=png.data[i+1],b=png.data[i+2];
              const l=.2126*r+.7152*g+.0722*b;
              lum+=l; if(r+g+b>45) nonblack++; count++;
            }
            return {width:png.width,height:png.height,centerMeanLuminance:lum/count,centerNonblackFraction:nonblack/count};
          }

          async function observation(page){
            return page.evaluate(async()=>{
              const startup=window.H_EARTH_RENDERER_STARTUP_DIAGNOSTICS?.getReceipt?.()??null;
              const api=window.H_EARTH_RUN8E_PUBLIC_ROUTE;
              const publicReceipt=api?.getReceipt?.()??null;
              const intake=api?.getIntakeReceipt?.()??null;
              const liveGpu=api?.getLiveGpuReceipt?.()??null;
              const module=await import('/showroom/globe/h-earth/render/live-render-package.run8e-r2.canonical.js');
              const pkg=module.getHEarthRun8ER2CanonicalLiveRenderPackage();
              const canvas=document.getElementById('h-earth-functional-landscape-canvas');
              const rect=canvas?.getBoundingClientRect();
              return {startup,publicReceipt,intake,liveGpu,packageIdentity:pkg.packageIdentity,canvas:canvas?{width:canvas.width,height:canvas.height,cssWidth:rect.width,cssHeight:rect.height}:null,dpr:devicePixelRatio};
            });
          }

          async function waitReady(page){
            await page.waitForFunction(()=>{
              const r=window.H_EARTH_RENDERER_STARTUP_DIAGNOSTICS?.getReceipt?.();
              return !!r && (r.firstFailureStage || (r.stages?.FIRST_FRAME_PRESENTED==='PASS' && r.stages?.READY_PUBLISHED==='PASS'));
            },null,{timeout:120000});
            await page.waitForFunction(()=>window.H_EARTH_RUN8E_PUBLIC_ROUTE?.ready===true,null,{timeout:30000});
          }

          async function snap(page,name){
            const buffer=await page.locator('#h-earth-functional-landscape-canvas').screenshot({path:path.join(out,`${name}.png`)});
            const visual=analyzePng(buffer);
            assert.ok(visual.centerMeanLuminance>12,`${name}: visible canvas too dark ${JSON.stringify(visual)}`);
            assert.ok(visual.centerNonblackFraction>.18,`${name}: visible canvas effectively black ${JSON.stringify(visual)}`);
            return visual;
          }

          async function look(page){
            const box=await page.locator('#h-earth-functional-landscape-canvas').boundingBox(); assert.ok(box);
            const x=box.x+box.width*.43,y=box.y+box.height*.5;
            await page.mouse.move(x,y); await page.mouse.down();
            await page.mouse.move(x+Math.min(130,box.width*.22),y,{steps:10});
            await page.waitForTimeout(500); await page.mouse.up(); await page.waitForTimeout(350);
          }

          async function travelTouch(page){
            const box=await page.locator('#h-earth-functional-landscape-canvas').boundingBox(); assert.ok(box);
            const cdp=await page.context().newCDPSession(page);
            const x1=box.x+box.width*.42,x2=box.x+box.width*.58,y=box.y+box.height*.58,dy=Math.min(110,box.height*.20);
            const pts=o=>[{x:x1,y:y-o,radiusX:7,radiusY:7,force:1,id:1},{x:x2,y:y-o,radiusX:7,radiusY:7,force:1,id:2}];
            await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:pts(0)});
            await cdp.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:pts(dy)});
            await page.waitForTimeout(650);
            await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});
            await page.waitForTimeout(400);
          }

          try{
            for(const cfg of configs){
              const context=await browser.newContext({viewport:{width:cfg.width,height:cfg.height},isMobile:cfg.mobile,hasTouch:cfg.touch,deviceScaleFactor:cfg.dsf});
              const page=await context.newPage();
              const consoleErrors=[],pageErrors=[];
              page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
              page.on('pageerror',e=>pageErrors.push(e.message));
              await page.goto(`http://127.0.0.1:4174/showroom/globe/h-earth/?visual=terrain-relief-v2&visible=${cfg.id}`,{waitUntil:'domcontentloaded',timeout:180000});
              await waitReady(page);
              const initial=await observation(page);
              assert.equal(initial.startup.firstFailureStage,null);
              assert.equal(initial.packageIdentity,process.env.HC05_EXPECTED_PACKAGE_ID);
              assert.equal(consoleErrors.length,0,JSON.stringify(consoleErrors)); assert.equal(pageErrors.length,0,JSON.stringify(pageErrors));
              assert.equal(initial.publicReceipt.presentationAntialiasing.mode,'BOUNDED_HIGH_DPI_SUPERSAMPLING_PLUS_SHADER_DERIVATIVE_FILTERING');
              assert.equal(initial.liveGpu.resources.presentationProfile.cartographicContourBanding,false);
              assert.equal(initial.liveGpu.resources.presentationProfile.naturalContinuousLandformTone,true);
              assert.equal(initial.liveGpu.resources.context.antialias,false);
              assert.equal(initial.liveGpu.correspondence.resourceIdentityStable,true);
              assert.equal(initial.liveGpu.correspondence.packageUploadedOnce,true);
              if(cfg.dsf>1){assert.ok(initial.publicReceipt.viewport.pixelRatio>1);assert.ok(initial.publicReceipt.viewport.pixelRatio<=2.001);assert.ok(initial.canvas.width>initial.canvas.cssWidth);}
              const initialVisual=await snap(page,`${cfg.id}-initial`);
              const seq0=initial.intake.currentNavigationState.sequence,frame0=initial.liveGpu.counters.gpuFramebufferPresentationCount;
              await look(page);
              const afterLook=await observation(page);
              assert.ok(afterLook.intake.currentNavigationState.sequence>seq0);assert.ok(afterLook.liveGpu.counters.gpuFramebufferPresentationCount>frame0);
              const lookVisual=await snap(page,`${cfg.id}-after-look`);
              if(cfg.touch){
                const seq1=afterLook.intake.currentNavigationState.sequence,frame1=afterLook.liveGpu.counters.gpuFramebufferPresentationCount;
                await travelTouch(page);
                const afterTravel=await observation(page);
                assert.ok(afterTravel.intake.currentNavigationState.sequence>seq1);assert.ok(afterTravel.liveGpu.counters.gpuFramebufferPresentationCount>frame1);
                assert.ok(afterTravel.intake.counters.twoFingerTravelProposalCount>0);
                assert.equal(afterTravel.liveGpu.counters.worldRebuildCount,0);
                const travelVisual=await snap(page,`${cfg.id}-after-travel`);
                results.push({config:cfg.id,initial,afterLook,afterTravel,initialVisual,lookVisual,travelVisual});
              }else{
                await page.mouse.wheel(0,-400);await page.waitForTimeout(400);
                const afterTravel=await observation(page);
                assert.ok(afterTravel.intake.currentNavigationState.sequence>afterLook.intake.currentNavigationState.sequence);
                assert.equal(afterTravel.liveGpu.counters.worldRebuildCount,0);
                const travelVisual=await snap(page,`${cfg.id}-after-travel`);
                results.push({config:cfg.id,initial,afterLook,afterTravel,initialVisual,lookVisual,travelVisual});
              }
              await context.close();
            }
          }finally{await browser.close();}

          const receipt={receiptType:'L2_HC05_GEN957_VISIBLE_BROWSER_EVIDENCE_RECEIPT_v1',candidateSha:process.env.HC05_CANDIDATE_SHA,status:'PASS',visibleNonblackEnvironment:true,multipleNavigationStatesVerified:true,realSamsungTwoTouchTravelVerified:true,boundedHighDpiSupersamplingVerified:true,defaultFramebufferMsaaDisabledForCompatibility:true,acceptedWorldSourceMutation:false,productMutationPerformed:false,mergePerformed:false,deploymentPerformed:false,visualAcceptancePerformed:false,results};
          await fs.writeFile(path.join(out,'receipt.json'),JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify({status:receipt.status,visibleNonblackEnvironment:receipt.visibleNonblackEnvironment,results:results.map(r=>({config:r.config,initial:r.initialVisual,look:r.lookVisual,travel:r.travelVisual,initialYaw:r.initial.intake.currentNavigationState.yawDegrees}))},null,2));
          NODE
          cd /tmp/hc05-playwright
          NODE_PATH=/tmp/hc05-playwright/node_modules node run.mjs | tee "$EVIDENCE_DIR/execution.log"

      - name: Verify non-mutation
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git -C hc05-candidate status --porcelain)"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l2-hc05-gen957-visible-browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
