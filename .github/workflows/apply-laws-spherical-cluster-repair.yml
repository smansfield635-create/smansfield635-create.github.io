name: Apply Laws spherical cluster repair

on:
  push:
    branches:
      - agent/laws-spherical-cluster-positive-drag-001
    paths:
      - verification/laws-repair/spherical-cluster-transport/**
      - .github/workflows/apply-laws-spherical-cluster-repair.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/laws-spherical-cluster-positive-drag-001
          fetch-depth: 2

      - name: Verify repair ancestry
        run: |
          test "$(git merge-base HEAD c4e4a89f449532118eb712cf0a5193cc6e53c5d4)" = "c4e4a89f449532118eb712cf0a5193cc6e53c5d4"
          test "$(git rev-list --count c4e4a89f449532118eb712cf0a5193cc6e53c5d4..HEAD)" = "1"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconstruct bounded source transformation
        run: |
          cat verification/laws-repair/spherical-cluster-transport/part-*.b64 \
            | base64 --decode \
            | gzip --decompress \
            > verification/laws-repair/apply-laws-spherical-cluster-repair.py

      - name: Apply bounded source transformation
        run: python verification/laws-repair/apply-laws-spherical-cluster-repair.py

      - name: Validate JavaScript syntax
        run: |
          node --check laws/index.crystals.js
          node --check laws/index.interactions.source.round4.js
          node --check laws/index.interactions.js
          node --check laws/validation/laws.orbit-direct-manipulation.harness.mjs

      - name: Execute Laws spherical cluster harness
        run: node laws/validation/laws.orbit-direct-manipulation.harness.mjs

      - name: Validate generated receipt
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync('laws/validation/laws.orbit-direct-manipulation.receipt.json', 'utf8'));
          const failures = [];
          if (receipt.status !== 'PASS') failures.push('status');
          if (receipt.model !== 'BOUNDED_SPHERICAL_XYZ_CLUSTER') failures.push('model');
          if (receipt.horizontalDragYawSign !== 'POSITIVE_DX') failures.push('sign');
          if (receipt.noncoplanar !== true) failures.push('noncoplanar');
          if (receipt.releaseSettlement !== true) failures.push('settlement');
          if (receipt.assertions.failed !== 0) failures.push('assertions');
          if (failures.length) throw new Error(`LAWS_SPHERICAL_CLUSTER_RECEIPT_INVALID:${failures.join(',')}`);
          NODE

      - name: Remove temporary transport files
        run: |
          rm verification/laws-repair/apply-laws-spherical-cluster-repair.py
          rm -rf verification/laws-repair/spherical-cluster-transport
          rm .github/workflows/apply-laws-spherical-cluster-repair.yml

      - name: Verify exact final path set
        run: |
          git add -A
          printf '%s\n' \
            .github/workflows/apply-laws-spherical-cluster-repair.yml \
            laws/index.crystals.js \
            laws/index.html \
            laws/index.interactions.js \
            laws/index.interactions.source.round4.js \
            laws/validation/laws.orbit-direct-manipulation.harness.mjs \
            laws/validation/laws.orbit-direct-manipulation.receipt.json \
            verification/laws-repair/spherical-cluster-transport/part-0001.b64 \
            verification/laws-repair/spherical-cluster-transport/part-0002.b64 \
            verification/laws-repair/spherical-cluster-transport/part-0003.b64 \
            verification/laws-repair/spherical-cluster-transport/part-0004.b64 \
            verification/laws-repair/spherical-cluster-transport/part-0005.b64 \
            verification/laws-repair/spherical-cluster-transport/part-0006.b64 \
            verification/laws-repair/spherical-cluster-transport/part-0007.b64 \
            verification/laws-repair/spherical-cluster-transport/part-0008.b64 \
            verification/laws-repair/spherical-cluster-transport/part-0009.b64 \
            | sort > /tmp/expected-paths.txt
          git diff --cached --name-only | sort > /tmp/actual-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt

      - name: Commit validated correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair Laws spherical cluster manipulation"
          git push origin HEAD:agent/laws-spherical-cluster-positive-drag-001
