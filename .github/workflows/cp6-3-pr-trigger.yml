name: CP6-3 pull-request execution carrier

on:
  pull_request:
    branches:
      - agent/laws-cp6-2-eight-standalone-destinations-001
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: cp6-3-pull-request-execution-carrier
  cancel-in-progress: false

jobs:
  execute-existing-program:
    if: github.head_ref == 'agent/laws-cp6-3-canonical-content-migration-001'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact CP6-3 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Confirm bounded carrier state
        shell: bash
        run: |
          set -euo pipefail
          CP62=5ae3e5524926653f3c348dde5363e8765ad425cc
          mapfile -t paths < <(git diff --name-only "$CP62"..HEAD | sort)
          printf '%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 2
          test "${paths[0]}" = ".github/workflows/cp6-3-canonical-content-migration.yml"
          test "${paths[1]}" = ".github/workflows/cp6-3-pr-trigger.yml"

      - name: Install extraction and browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check beautifulsoup4 playwright
          python3 -m playwright install chromium

      - name: Extract, normalize source routes, and execute CP6-3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow_path = Path('.github/workflows/cp6-3-canonical-content-migration.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          start_marker = "cat > /tmp/cp63.py <<'PY'\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index("\n          PY\n          python3 /tmp/cp63.py", start)
          source = textwrap.dedent(workflow[start:end])

          needle = "\nexpected_ids = {row['id'] for row in migrated_rows}\n"
          assert source.count(needle) == 1
          correction = r'''

          # Preserve source-declared routes without publishing broken navigation from
          # the canonical destination copies. The route identity remains visible.
          def source_route_file(href):
              clean = href.split('?', 1)[0]
              if clean == '/':
                  return ROOT / 'index.html'
              if clean.endswith('/'):
                  return ROOT / clean.lstrip('/') / 'index.html'
              return ROOT / clean.lstrip('/')

          normalized_source_route_links = []
          for content_id, source_payload in list(payloads.items()):
              fragment = BeautifulSoup(source_payload, 'html.parser')
              changed = False
              for link in fragment.find_all('a', href=True):
                  href = link['href']
                  if href.startswith('/') and '#' not in href and not source_route_file(href).exists():
                      replacement = fragment.new_tag('article')
                      replacement['class'] = list(link.get('class', [])) + ['source-route-record']
                      for child in list(link.contents):
                          replacement.append(child.extract())
                      declaration = fragment.new_tag('p')
                      declaration['class'] = ['declared-source-route']
                      declaration.string = f'Declared source route retained without broken navigation: {href}'
                      replacement.append(declaration)
                      link.replace_with(replacement)
                      normalized_source_route_links.append({'content_id': content_id, 'declared_route': href})
                      changed = True
              if changed:
                  payloads[content_id] = str(fragment)
          '''
          source = source.replace(needle, textwrap.dedent(correction) + needle, 1)

          ledger_needle = "    'shared_foundation_references': shared_reference_rows,\n    'rows': migration_ledger_rows,"
          ledger_replacement = "    'shared_foundation_references': shared_reference_rows,\n    'normalized_source_route_links': normalized_source_route_links,\n    'rows': migration_ledger_rows,"
          assert source.count(ledger_needle) == 1
          source = source.replace(ledger_needle, ledger_replacement, 1)

          receipt_needle = "    'broken_internal_links': len(broken_links),\n    'orphaned_destinations': len(orphaned),"
          receipt_replacement = "    'broken_internal_links': len(broken_links),\n    'normalized_source_route_link_count': len(normalized_source_route_links),\n    'normalized_source_route_links': normalized_source_route_links,\n    'orphaned_destinations': len(orphaned),"
          assert source.count(receipt_needle) == 1
          source = source.replace(receipt_needle, receipt_replacement, 1)

          scale_needle = "for token in ['gatewayBodyScale = 0.7666667','horizontalRadius = 1.68','verticalRadius = 1.5008','depthRadius = 1.2992']:\n    assert token in crystals, token"
          scale_replacement = r'''scale_patterns = {
              'gatewayBodyScale': r'gatewayBodyScale:\s*0\.7666667',
              'horizontalRadius': r'horizontalRadius:\s*1\.68',
              'verticalRadius': r'verticalRadius:\s*1\.5008',
              'depthRadius': r'depthRadius:\s*1\.2992',
          }
          for scale_name, pattern in scale_patterns.items():
              assert re.search(pattern, crystals), scale_name'''
          scale_replacement = textwrap.dedent(scale_replacement)
          assert source.count(scale_needle) == 1
          source = source.replace(scale_needle, scale_replacement, 1)

          migrated_needle = "migrated: document.documentElement.dataset.cp6_3ContentMigration,"
          migrated_replacement = "migrated: document.documentElement.getAttribute('data-cp6-3-content-migration'),"
          assert source.count(migrated_needle) == 1
          source = source.replace(migrated_needle, migrated_replacement, 1)

          Path('/tmp/cp63.py').write_text(source, encoding='utf-8')
          PY
          rm -f .github/workflows/cp6-3-pr-trigger.yml
          python3 /tmp/cp63.py

      - name: Commit verified CP6-3 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "CP6-3 migrate and verify 48 canonical content rows"
          git push origin HEAD:agent/laws-cp6-3-canonical-content-migration-001
