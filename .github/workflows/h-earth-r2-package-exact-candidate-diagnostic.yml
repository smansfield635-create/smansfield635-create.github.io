name: H-Earth R2 Package Exact Candidate Diagnostic
on:
  workflow_dispatch:
    inputs:
      target_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
      - name: Require exact candidate
        run: test "$(git rev-parse HEAD)" = "${{ inputs.target_sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Evaluate raw R2 package
        run: |
          node --input-type=module <<'NODE' | tee h-earth-r2-package-diagnostic.json
          import {getHEarthRun8ER2ImmutableLiveRenderPackage,getHEarthOW01LiveRenderPackageOccurrence,evaluateHEarthRun8ER2ImmutableLiveRenderPackage} from './showroom/globe/h-earth/render/live-render-package.run8e-r2.js';
          import {getHEarthOW01CanonicalLiveRenderPackageOccurrence} from './showroom/globe/h-earth/render/live-render-package.run8e-r2.canonical.js';
          import {constructHEarthDistantContextGeometry} from './showroom/globe/h-earth/render/geometry-distant-context.js';
          const packageRecord=getHEarthRun8ER2ImmutableLiveRenderPackage();
          const ow01Raw=getHEarthOW01LiveRenderPackageOccurrence();
          const ow01Canonical=getHEarthOW01CanonicalLiveRenderPackageOccurrence();
          const ow01Evaluation=evaluateHEarthRun8ER2ImmutableLiveRenderPackage(ow01Canonical);
          const distant=constructHEarthDistantContextGeometry();
          const distantContext={ok:distant?.ok===true,status:distant?.status??null,issues:distant?.issues??[],derivedHorizonDistance:distant?.derivedHorizonDistance??null,primitiveIds:(distant?.primitives??[]).map(p=>p?.primitiveId??null),farSurfaceClasses:(distant?.primitives??[]).map(p=>p?.metadata?.farSurfaceClass??null),land:{triangleCount:distant?.meshDiagnostics?.land?.triangleCount??null,retainedCellCount:distant?.meshDiagnostics?.land?.retainedCellCount??null,compactVertexCount:distant?.meshDiagnostics?.land?.compactVertexCount??null},ocean:{triangleCount:distant?.meshDiagnostics?.ocean?.triangleCount??null,retainedCellCount:distant?.meshDiagnostics?.ocean?.retainedCellCount??null,compactVertexCount:distant?.meshDiagnostics?.ocean?.compactVertexCount??null,outerRadius:distant?.meshDiagnostics?.ocean?.outerRadius??null,landUnderlayCellCount:distant?.meshDiagnostics?.ocean?.landUnderlayCellCount??null,mixedCoastCellCount:distant?.meshDiagnostics?.ocean?.mixedCoastCellCount??null}};
          const ow01={rawEligible:ow01Raw?.eligible===true,rawStatus:ow01Raw?.status??null,rawIssues:ow01Raw?.issues??[],canonicalEligible:ow01Canonical?.eligible===true,canonicalStatus:ow01Canonical?.status??null,canonicalIssues:ow01Canonical?.issues??[],evaluationEligible:ow01Evaluation?.eligible===true,evaluationIssues:ow01Evaluation?.issues??[],packageOccurrenceId:ow01Canonical?.packageOccurrenceId??null,primitiveCount:ow01Canonical?.primitiveCount??null,vertexCount:ow01Canonical?.vertexCount??null,triangleCount:ow01Canonical?.triangleCount??null,indexCount:ow01Canonical?.indexCount??null,roleCounts:ow01Canonical?.roleCounts??null};
          const receipt={schema:'H_EARTH_R2_PACKAGE_EXACT_CANDIDATE_DIAGNOSTIC_v3',ow01,eligible:packageRecord?.eligible===true,status:packageRecord?.status??null,contractId:packageRecord?.contractId??null,issues:packageRecord?.issues??[],packageOccurrenceId:packageRecord?.packageOccurrenceId??null,primitiveCount:packageRecord?.primitiveCount??null,vertexCount:packageRecord?.vertexCount??null,triangleCount:packageRecord?.triangleCount??null,indexCount:packageRecord?.indexCount??null,roleCounts:packageRecord?.roleCounts??null,distantContext};
          console.log(JSON.stringify(receipt,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: h-earth-r2-package-${{ inputs.target_sha }}
          path: h-earth-r2-package-diagnostic.json
          if-no-files-found: error
          retention-days: 30
