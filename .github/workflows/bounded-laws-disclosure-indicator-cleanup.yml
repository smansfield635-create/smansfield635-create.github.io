name: Bounded Laws disclosure indicator cleanup

on:
  push:
    paths:
      - ".github/workflows/bounded-laws-disclosure-indicator-cleanup.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove overlapping Laws disclosure indicator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("laws/index.html")
          workflow = Path(".github/workflows/bounded-laws-disclosure-indicator-cleanup.yml")

          text = html.read_text(encoding="utf-8")
          old = '''          <summary>
            <span>Selection Details</span>
            <span aria-hidden="true">+</span>
          </summary>'''
          new = '''          <summary>
            <span>Selection Details</span>
          </summary>'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(
                  f"Expected exactly one overlapping Selection Details indicator; found {count}."
              )

          if "LAWS_COLLAPSED_DISCLOSURE_STANDARD_v1" not in Path("laws/index.css").read_text(encoding="utf-8"):
              raise SystemExit("Collapsed disclosure standard is missing.")

          updated = text.replace(old, new, 1)
          open_details = re.findall(
              r"<details\b[^>]*\sopen(?:\s|=|>)",
              updated,
              flags=re.IGNORECASE | re.DOTALL,
          )
          if open_details:
              raise SystemExit(
                  f"Laws still contains {len(open_details)} default-open disclosure(s)."
              )

          html.write_text(updated, encoding="utf-8")
          workflow.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add laws/index.html .github/workflows/bounded-laws-disclosure-indicator-cleanup.yml
          git commit -m "Correct Laws disclosure indicator overlap"
          git push origin HEAD:main
