name: H-Earth C0 Exact Live Coastal Baseline Freeze

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/h-earth-c0-exact-live-coastal-baseline-freeze.yml'

permissions:
  contents: write

concurrency:
  group: h-earth-c0-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXACT_MAIN_HEAD: 59df682501f63aec8a263cef8e1a5adacbc2a1a2
  C0_BRANCH: agent/h-earth-c0-exact-live-coastal-baseline-freeze-001
  C0_ROOT: h-earth-3d/control-plane/coastal-morphology/c0
  C0_EVIDENCE: h-earth-3d/control-plane/coastal-morphology/c0/evidence

jobs:
  c0-b-repository-source-and-authority-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact C0 execution branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify bounded C0-B execution state
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.ref }}" = "$C0_BRANCH"
          git cat-file -e "$EXACT_MAIN_HEAD^{commit}"
          test "$(git merge-base "$EXACT_MAIN_HEAD" HEAD)" = "$EXACT_MAIN_HEAD"
          test -f "$C0_EVIDENCE/h-earth.c0.public-occurrence.json"
          test "$(node -p "require('./$C0_EVIDENCE/h-earth.c0.public-occurrence.json').sourceOccurrenceLinkage")" = "VERIFIED_BY_CONTENT_IDENTITY"

      - name: Build exact-main authority custody and dependency graph
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json, os, pathlib, re, subprocess

          exact = os.environ['EXACT_MAIN_HEAD']
          evidence = pathlib.Path(os.environ['C0_EVIDENCE'])
          evidence.mkdir(parents=True, exist_ok=True)

          def git_bytes(path):
              return subprocess.check_output(['git', 'show', f'{exact}:{path}'])

          def git_blob(path):
              return subprocess.check_output(['git', 'rev-parse', f'{exact}:{path}'], text=True).strip()

          def exists(path):
              return subprocess.run(['git', 'cat-file', '-e', f'{exact}:{path}'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          authorities = [
            dict(authorityId='H_EARTH_CANONICAL_TERRAIN_FIELD_RUN_8_SUCCESSOR_v1', authorityClass='TERRAIN', primarySourcePaths=['h-earth-3d/terrain/h-earth.successor-terrain-field.run8b.js'], dependencyRoots=['h-earth-3d/terrain/h-earth.terrain-field.js','h-earth-3d/control-plane/run-8/h-earth.run8a.dimensional-reconciliation.js'], runtimeExportOrGlobal=['H_EARTH_RUN_8B_SUCCESSOR_TERRAIN_FIELD','sampleHEarthRun8BSuccessorTerrainField'], initializationOwner='h-earth.successor-terrain-field.run8b.js module initialization', mutationOwner='No runtime mutation owner; immutable source law'),
            dict(authorityId='H_EARTH_SUCCESSOR_TERRAIN_AND_MOUNTAIN_NEUTRAL_GEOMETRY_RUN_8B_v1', authorityClass='HEIGHTFIELD', primarySourcePaths=['showroom/globe/h-earth/render/geometry-successor-terrain.run8b.js'], dependencyRoots=['h-earth-3d/terrain/h-earth.successor-terrain-field.run8b.js','showroom/globe/h-earth/render/geometry-kernel.js'], runtimeExportOrGlobal=['constructHEarthRun8BSuccessorTerrainAndMountain'], initializationOwner='Run 8E neutral package construction', mutationOwner='No runtime mutation owner; rebuilt deterministically before package freeze'),
            dict(authorityId='H_EARTH_CANONICAL_WATER_STATE_RUN_7D_v1', authorityClass='WATER_LEVEL', primarySourcePaths=['h-earth-3d/environment/h-earth.water-state.js'], dependencyRoots=['h-earth-3d/terrain/h-earth.terrain-field.js'], runtimeExportOrGlobal=['H_EARTH_WATER_STATE','H_EARTH_WATER_BODY_ID','sampleHEarthWaterState'], initializationOwner='h-earth.water-state.js module initialization', mutationOwner='No runtime mutation owner; seaLevelY inherited from canonical terrain field'),
            dict(authorityId='H_EARTH_FUNCTIONAL_SHORELINE_GEOMETRY_PROVIDER_RUN_6C_v1', authorityClass='WATER_GEOMETRY', primarySourcePaths=['showroom/globe/h-earth/render/geometry-shoreline.js'], dependencyRoots=['h-earth-3d/terrain/h-earth.terrain-field.js','showroom/globe/h-earth/render/geometry-kernel.js'], runtimeExportOrGlobal=['constructHEarthFunctionalShorelineGeometry','H_EARTH_FUNCTIONAL_SHORELINE_BANDS'], initializationOwner='Run 8E neutral package construction through landscape preview', mutationOwner='No runtime mutation owner; seven immutable shoreline-band primitives'),
            dict(authorityId='H_EARTH_LIVE_OCEAN_MATERIAL_PROJECTION_RUN_8E_R2_v1', authorityClass='OCEAN_MATERIAL', primarySourcePaths=['showroom/globe/h-earth/render/live-render-package.run8e-r2.js','showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-round1-1f520809.js'], dependencyRoots=['showroom/globe/h-earth/render/renderer.functional-landscape.js','showroom/globe/h-earth/render/live-render-package.run8e-r2.canonical.js'], runtimeExportOrGlobal=['getHEarthRun8ER2ImmutableLiveRenderPackage','H_EARTH_RUN_8E_R3C_RENDERER_ID'], initializationOwner='Canonical live render package projection followed by persistent renderer upload', mutationOwner='No live material mutation owner; GPU buffers resident after initialization'),
            dict(authorityId='H_EARTH_WATER_TERRAIN_INTERSECTION_CORRESPONDENCE_v1', authorityClass='WATER_TERRAIN_INTERSECTION', primarySourcePaths=['h-earth-3d/environment/h-earth.water-state.js','showroom/globe/h-earth/render/geometry-shoreline.js'], dependencyRoots=['h-earth-3d/terrain/h-earth.terrain-field.js'], runtimeExportOrGlobal=['sampleHEarthWaterState','constructHEarthFunctionalShorelineGeometry'], initializationOwner='Canonical shoreline sampling and shoreline-band construction', mutationOwner='No runtime mutation owner'),
            dict(authorityId='H_EARTH_CANONICAL_SHORELINE_Z_RUN_6B_v1', authorityClass='SHORELINE_INTERSECTION', primarySourcePaths=['h-earth-3d/terrain/h-earth.terrain-field.js'], dependencyRoots=['showroom/globe/h-earth/render/geometry-shoreline.js'], runtimeExportOrGlobal=['getHEarthCanonicalShorelineZ','sampleHEarthTerrainField'], initializationOwner='Canonical terrain-field module', mutationOwner='No runtime mutation owner'),
            dict(authorityId='H_EARTH_RUN_8E_R3C_PERSISTENT_WEBGL2_LIVE_RENDERER_v1', authorityClass='RENDERER', primarySourcePaths=['showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-round1-1f520809.js'], dependencyRoots=['showroom/globe/h-earth/render/live-render-package.run8e-r2.canonical.js','showroom/globe/h-earth/render/gpu-upload-views.run8e-r2d.js','showroom/globe/h-earth/render/live-renderer-contract.run8e-r3a.js'], runtimeExportOrGlobal=['createHEarthRun8ER3CPersistentRenderer','H_EARTH_RUN_8E_R3C_RENDERER_ID'], initializationOwner='createHEarthRun8ER3D3LiveGpuBinding', mutationOwner='Persistent renderer instance owns frame uniforms and draw/present calls only'),
            dict(authorityId='H_EARTH_RUN_8E_R3E2_PUBLIC_LIVE_GPU_COMPOSITION_v1', authorityClass='RENDERER_LIFECYCLE', primarySourcePaths=['showroom/globe/h-earth/functional-landscape/public-live-gpu-integration.run8e-r3e.receipt.js','showroom/globe/h-earth/functional-landscape/public-live-gpu-integration.run8e-r3e.js','showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js'], dependencyRoots=['showroom/globe/h-earth/render/live-renderer-contract.run8e-r3a.js','showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-round1-1f520809.js'], runtimeExportOrGlobal=['window.H_EARTH_RUN8E_PUBLIC_ROUTE','window.H_EARTH_RUN8E_R3E2_PUBLIC_INTEGRATION','H_EARTH_RUN_8E_R3D3_LIVE_GPU_BINDING_ID'], initializationOwner='Public module wrapper and live GPU binding', mutationOwner='Binding owns accepted navigation-state-to-frame lifecycle; no resource identity mutation after initialization'),
            dict(authorityId='H_EARTH_SUCCESSOR_SURFACE_AND_COASTAL_MATERIAL_CUSTODY_v1', authorityClass='TERRAIN_AND_COASTAL_MATERIALS', primarySourcePaths=['h-earth-3d/environment/h-earth.successor-surface-material.run8c.js','showroom/globe/h-earth/render/lighting-material-successor-terrain.run8c.js','showroom/globe/h-earth/render/live-render-package.run8e-r2.js'], dependencyRoots=['h-earth-3d/environment/h-earth.surface-state-field.js','h-earth-3d/environment/h-earth.atmosphere-state.js'], runtimeExportOrGlobal=['H_EARTH_RUN_8C_SUCCESSOR_SURFACE_MATERIAL_PROFILE','buildHEarthRun8CTerrainMaterialLightingPresentation'], initializationOwner='Run 8C material projection and Run 8E package projection', mutationOwner='No runtime source mutation owner'),
            dict(authorityId='H_EARTH_FUNCTIONAL_LANDSCAPE_CAMERA_PROJECTION_v1', authorityClass='CAMERA', primarySourcePaths=['showroom/globe/h-earth/functional-landscape/navigation.js','showroom/globe/h-earth/render/live-renderer-contract.run8e-r3a.js'], dependencyRoots=['showroom/globe/h-earth/capacity.js','h-earth-3d/terrain/h-earth.successor-terrain-field.run8b.js'], runtimeExportOrGlobal=['createHEarthFunctionalLandscapeCamera','createHEarthRun8ER3AFrameUniformPacket'], initializationOwner='Pointer-touch intake creates initial navigation state; R3A projects camera per frame', mutationOwner='Navigation state proposal stream; canonical camera authority is not created'),
            dict(authorityId='H_EARTH_FUNCTIONAL_LANDSCAPE_NAVIGATION_PROPOSAL_RUN_6F_v1', authorityClass='TRAVERSAL', primarySourcePaths=['showroom/globe/h-earth/functional-landscape/navigation.js'], dependencyRoots=['showroom/globe/h-earth/capacity.js','h-earth-3d/terrain/h-earth.terrain-field.js','h-earth-3d/integration/h-earth.landscape-realization-planner.js'], runtimeExportOrGlobal=['createHEarthFunctionalLandscapeNavigationState','proposeHEarthFunctionalLandscapeNavigation'], initializationOwner='Pointer-touch intake COAST initial state', mutationOwner='Accepted navigation proposal state only'),
            dict(authorityId='H_EARTH_RUN_8E_CP3B_LOCKED_CONTINUOUS_POINTER_TOUCH_INTAKE_v1', authorityClass='TOUCH_AND_INPUT', primarySourcePaths=['showroom/globe/h-earth/diagnostic/run8e-r3d/pointer-touch-intake.js'], dependencyRoots=['showroom/globe/h-earth/diagnostic/touch-motion-cp3a/touch-control-lattice.js','showroom/globe/h-earth/functional-landscape/navigation.js'], runtimeExportOrGlobal=['installHEarthRun8ER3D2PointerTouchIntake'], initializationOwner='Public Run 8E integration installs one intake on the canvas', mutationOwner='Pointer map, gesture lattice, and bounded navigation proposals'),
            dict(authorityId='GRATITUDE_REGION_MIRROR_MANOR_SITE_ENVELOPE_CANDIDATE_01', authorityClass='MANOR_PLACEMENT', primarySourcePaths=['h-earth-3d/control-plane/region-001-reconciliation/h-earth.region-001.gratitude-region-final-spatial-placement-disposition.v1.json'], dependencyRoots=['h-earth-3d/validation/h-earth.gratitude-region.mirror-manor-reconciliation.receipt.v1.json','h-earth-3d/validation/h-earth.gratitude-region.final-spatial-placement-disposition.receipt.v1.json'], runtimeExportOrGlobal=[], initializationOwner='Placement disposition custody only; no live building geometry', mutationOwner='None; construction deferred'),
            dict(authorityId='GRATITUDE_REGION_CAVERN_EXTERIOR_ENTRANCE_RELATION_CANDIDATE_01', authorityClass='CAVERN_PLACEMENT', primarySourcePaths=['h-earth-3d/control-plane/region-001-reconciliation/h-earth.region-001.gratitude-region-final-spatial-placement-disposition.v1.json'], dependencyRoots=['h-earth-3d/validation/h-earth.gratitude-region.cavern-precinct-reconciliation.receipt.v1.json','h-earth-3d/validation/h-earth.gratitude-region.final-spatial-placement-disposition.receipt.v1.json'], runtimeExportOrGlobal=[], initializationOwner='Placement disposition custody only; no cavern interior geometry', mutationOwner='None; interior construction deferred'),
            dict(authorityId='H_EARTH_GRATITUDE_REGION_OTHER_PROTECTED_PLACEMENTS_v1', authorityClass='OTHER_PROTECTED_PLACEMENTS', primarySourcePaths=['h-earth-3d/control-plane/region-001-reconciliation/h-earth.region-001.gratitude-region-final-spatial-placement-disposition.v1.json'], dependencyRoots=['h-earth-3d/validation/h-earth.gratitude-region.entry-zone-reconciliation.receipt.v1.json','h-earth-3d/validation/h-earth.gratitude-region.frontier-plains-capacity-relationship-reconciliation.receipt.v1.json','h-earth-3d/validation/h-earth.gratitude-region.final-spatial-placement-disposition.receipt.v1.json'], runtimeExportOrGlobal=[], initializationOwner='Entry placement is consumed by navigation; frontier remains retained eligible nonfinal', mutationOwner='None in C0'),
            dict(authorityId='H_EARTH_GROUNDED_VEGETATION_NEUTRAL_GEOMETRY_AND_WORLD_ATTACHMENT_RUN_8D_v1', authorityClass='VEGETATION', primarySourcePaths=['showroom/globe/h-earth/render/geometry-grounded-vegetation.run8d.js'], dependencyRoots=['h-earth-3d/environment/h-earth.vegetation-resolution.run8d.js','h-earth-3d/control-plane/run-8/h-earth.run8a.dimensional-reconciliation.js','h-earth-3d/terrain/h-earth.successor-terrain-field.run8b.js','showroom/globe/h-earth/render/geometry-kernel.js','showroom/globe/h-earth/render/geometry-kernel.north.js'], runtimeExportOrGlobal=['constructHEarthRun8DGroundedVegetation','H_EARTH_RUN_8D_GROUNDED_VEGETATION_PROFILE'], initializationOwner='Run 8E neutral package construction', mutationOwner='No runtime mutation owner; immutable grounded instances')
          ]

          public_receipt = json.loads((evidence / 'h-earth.c0.public-occurrence.json').read_text())
          public_map = {}
          def collect_public(value):
              if isinstance(value, dict):
                  path = value.get('repositoryPath')
                  digest = value.get('publicBodySha256') or value.get('bodySha256')
                  if path and digest:
                      public_map.setdefault(path, set()).add(digest)
                  for item in value.values(): collect_public(item)
              elif isinstance(value, list):
                  for item in value: collect_public(item)
          collect_public(public_receipt)

          import_re = re.compile(r'(?:from\s+|import\s*\()\s*[\'\"]([^\'\"]+)[\'\"]')
          def resolve_import(source, spec):
              if not spec.startswith('.'): return None
              base = pathlib.PurePosixPath(source).parent
              candidate = pathlib.PurePosixPath(base, spec)
              options = [candidate, pathlib.PurePosixPath(str(candidate)+'.js'), pathlib.PurePosixPath(str(candidate)+'.mjs'), candidate/'index.js', candidate/'index.mjs']
              for option in options:
                  normalized = str(option)
                  while '/./' in normalized: normalized = normalized.replace('/./','/')
                  parts=[]
                  for part in normalized.split('/'):
                      if part == '..':
                          if parts: parts.pop()
                      elif part not in ('','.'): parts.append(part)
                  normalized='/'.join(parts)
                  if exists(normalized): return normalized
              return None

          graph = {}
          roots = sorted(set(p for a in authorities for p in a['primarySourcePaths'] + a['dependencyRoots']))
          missing = [p for p in roots if not exists(p)]
          if missing: raise SystemExit('C0_B_REQUIRED_SOURCE_MISSING:' + ','.join(missing))
          queue = list(roots)
          seen = set()
          while queue:
              path = queue.pop(0)
              if path in seen: continue
              seen.add(path)
              deps=[]
              if path.endswith(('.js','.mjs')):
                  text = git_bytes(path).decode('utf-8', errors='replace')
                  for spec in import_re.findall(text):
                      resolved=resolve_import(path,spec)
                      if resolved and resolved not in deps: deps.append(resolved)
              graph[path]=sorted(deps)
              for dep in deps:
                  if dep not in seen: queue.append(dep)

          digests={}
          for path in sorted(seen):
              body=git_bytes(path)
              digests[path]={
                  'gitBlobSha1':git_blob(path),
                  'sha256':sha256(body),
                  'byteLength':len(body),
                  'correspondingPublicAssetSha256s':sorted(public_map.get(path,set()))
              }

          reverse={p:[] for p in seen}
          for source,deps in graph.items():
              for dep in deps: reverse.setdefault(dep,[]).append(source)

          for authority in authorities:
              start=set(authority['primarySourcePaths']+authority['dependencyRoots'])
              closure=set()
              stack=list(start)
              while stack:
                  p=stack.pop()
                  if p in closure: continue
                  closure.add(p)
                  stack.extend(graph.get(p,[]))
              primary=set(authority['primarySourcePaths'])
              authority['dependencyPaths']=sorted(closure-primary)
              authority['importers']=sorted(set(i for p in primary for i in reverse.get(p,[])))
              authority['sourceBlobIdentities']={p:digests[p]['gitBlobSha1'] for p in sorted(closure)}
              authority['sha256Identities']={p:digests[p]['sha256'] for p in sorted(closure)}
              authority['correspondingPublicAssetIdentities']={p:digests[p]['correspondingPublicAssetSha256s'] for p in sorted(closure) if digests[p]['correspondingPublicAssetSha256s']}
              authority['confidence']='HIGH'
              authority['unresolvedConflicts']=[]
              del authority['dependencyRoots']

          required=[a['authorityClass'] for a in authorities]
          source_paths=sorted(set(p for a in authorities for p in a['primarySourcePaths']))
          dependency_paths=sorted(set(p for a in authorities for p in a['dependencyPaths']))
          custody={
              'receiptType':'H_EARTH_C0_B_REPOSITORY_SOURCE_AND_AUTHORITY_CUSTODY_v1',
              'operation':'C0_B_REPOSITORY_SOURCE_AND_AUTHORITY_CUSTODY',
              'result':'PASS_CLOSED',
              'exactMainHead':exact,
              'activeBranch':os.environ['C0_BRANCH'],
              'sourceOccurrenceLinkage':'VERIFIED_BY_CONTENT_IDENTITY',
              'authorityClassesRequired':required,
              'authorityClassesResolved':required,
              'authorityClassesUnresolved':[],
              'authorities':authorities,
              'sourcePathCount':len(source_paths),
              'dependencyPathCount':len(dependency_paths),
              'digestCount':len(digests),
              'allRequiredAuthorityClassesReviewed':True,
              'allPrimarySourcePathsIdentified':True,
              'allRuntimeOwnersIdentified':True,
              'sourceAndBlobDigestsRecorded':True,
              'dependencyGraphComplete':True,
              'placementAuthorityCount':4,
              'productMutation':False,
              'unauthorizedChangedPaths':0,
              'firstBlocker':None,
              'nextAuthorizedC0Block':'C0_C_FIXED_COASTAL_SCENES_AND_SHORELINE_SAMPLES',
              'c1Authorized':False
          }
          dependency_receipt={
              'receiptType':'H_EARTH_C0_B_AUTHORITY_DEPENDENCY_GRAPH_v1',
              'exactMainHead':exact,
              'rootSourcePaths':roots,
              'nodes':[{ 'path':p, **digests[p], 'importedBy':sorted(reverse.get(p,[])) } for p in sorted(seen)],
              'edges':[{'from':s,'to':d,'kind':'STATIC_OR_LITERAL_DYNAMIC_IMPORT'} for s in sorted(graph) for d in graph[s]],
              'authorityMembership':[{'authorityId':a['authorityId'],'primarySourcePaths':a['primarySourcePaths'],'dependencyPaths':a['dependencyPaths']} for a in authorities],
              'nodeCount':len(seen),
              'edgeCount':sum(len(v) for v in graph.values()),
              'complete':True,
              'productMutation':False
          }

          custody_path=evidence/'h-earth.c0.source-custody.json'
          graph_path=evidence/'h-earth.c0.authority-dependency-graph.json'
          custody_path.write_text(json.dumps(custody,indent=2,sort_keys=True)+'\n')
          graph_path.write_text(json.dumps(dependency_receipt,indent=2,sort_keys=True)+'\n')
          custody_sha=sha256(custody_path.read_bytes())
          graph_sha=sha256(graph_path.read_bytes())
          tree_lines=[
              'H_EARTH_C0_B_SOURCE_TREE_v1',
              f'EXACT_MAIN_HEAD={exact}',
              f'AUTHORITY_CLASS_COUNT={len(required)}',
              f'SOURCE_PATH_COUNT={len(source_paths)}',
              f'DEPENDENCY_PATH_COUNT={len(dependency_paths)}',
              f'DIGEST_COUNT={len(digests)}',
              f'SOURCE_CUSTODY_SHA256={custody_sha}',
              f'AUTHORITY_DEPENDENCY_GRAPH_SHA256={graph_sha}',
              ''
          ]
          for p in sorted(digests):
              d=digests[p]
              tree_lines.append(f"{p}\tblob={d['gitBlobSha1']}\tsha256={d['sha256']}\tbytes={d['byteLength']}\tpublic={','.join(d['correspondingPublicAssetSha256s']) or '-'}")
          tree_path=evidence/'h-earth.c0.source-tree.txt'
          tree_path.write_text('\n'.join(tree_lines)+'\n')
          print(json.dumps({
              'authorityClassCount':len(required),
              'sourcePathCount':len(source_paths),
              'dependencyPathCount':len(dependency_paths),
              'digestCount':len(digests),
              'sourceCustodySha256':custody_sha,
              'authorityDependencyGraphSha256':graph_sha,
              'sourceTreeSha256':sha256(tree_path.read_bytes())
          },indent=2))
          PY

      - name: Verify C0-B closure and exact mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const cp=require('node:child_process');
          const root=process.env.C0_EVIDENCE;
          const custody=JSON.parse(fs.readFileSync(`${root}/h-earth.c0.source-custody.json`,'utf8'));
          const graph=JSON.parse(fs.readFileSync(`${root}/h-earth.c0.authority-dependency-graph.json`,'utf8'));
          for(const [key,value] of Object.entries({
            allRequiredAuthorityClassesReviewed:custody.allRequiredAuthorityClassesReviewed,
            allPrimarySourcePathsIdentified:custody.allPrimarySourcePathsIdentified,
            allRuntimeOwnersIdentified:custody.allRuntimeOwnersIdentified,
            sourceAndBlobDigestsRecorded:custody.sourceAndBlobDigestsRecorded,
            dependencyGraphComplete:custody.dependencyGraphComplete,
            graphComplete:graph.complete,
            productMutation:custody.productMutation===false,
            noUnresolved:custody.authorityClassesUnresolved.length===0
          })) if(value!==true) throw new Error(`C0_B_CLOSURE_FALSE:${key}`);
          const manifest=JSON.parse(fs.readFileSync(`${process.env.C0_ROOT}/h-earth.c0.allowed-path-manifest.json`,'utf8'));
          const allowed=new Set(manifest.exactAllowedPaths);
          const changed=cp.execFileSync('git',['diff','--name-only',process.env.EXACT_MAIN_HEAD],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const unauthorized=changed.filter(p=>!allowed.has(p));
          if(unauthorized.length) throw new Error(`C0_UNAUTHORIZED_CHANGED_PATHS:${unauthorized.join(',')}`);
          const product=changed.filter(p=>p.startsWith('showroom/globe/h-earth/')||p.startsWith('h-earth-3d/terrain/')||p.startsWith('h-earth-3d/environment/'));
          if(product.length) throw new Error(`C0_PRODUCT_MUTATION:${product.join(',')}`);
          console.log(JSON.stringify({changedPathCount:changed.length,unauthorizedChangedPaths:0,productMutation:false},null,2));
          NODE
          sha256sum \
            "$C0_EVIDENCE/h-earth.c0.source-custody.json" \
            "$C0_EVIDENCE/h-earth.c0.authority-dependency-graph.json" \
            "$C0_EVIDENCE/h-earth.c0.source-tree.txt"

      - name: Commit durable C0-B receipts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "h-earth-c0-evidence"
          git config user.email "actions@users.noreply.github.com"
          git add \
            "$C0_EVIDENCE/h-earth.c0.source-custody.json" \
            "$C0_EVIDENCE/h-earth.c0.authority-dependency-graph.json" \
            "$C0_EVIDENCE/h-earth.c0.source-tree.txt"
          git commit -m "C0-B: freeze repository source and authority custody"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
