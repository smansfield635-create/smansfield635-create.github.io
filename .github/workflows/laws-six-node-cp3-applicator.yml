name: Laws Six-Node CP3 Applicator

on:
  push:
    branches:
      - agent/laws-fifth-test-star-reversible-admissibility-cp1-001
    paths:
      - .github/workflows/laws-six-node-cp3-applicator.yml
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: laws-six-node-cp3-applicator
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'agent/laws-fifth-test-star-reversible-admissibility-cp1-001'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/laws-fifth-test-star-reversible-admissibility-cp1-001
          fetch-depth: 0

      - name: Reconcile exact current main before mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main
          git merge-base --is-ancestor origin/main HEAD
          test "$(git diff --name-only origin/main...HEAD | grep -E '^laws/(index\.html|index\.controller\.js|index\.interactions\.js|index\.crystals\.js|index\.css|index\.crystals\.source\.js)$' | wc -l | tr -d ' ')" = "0"

      - name: Verify frozen Laws source custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "agent/laws-fifth-test-star-reversible-admissibility-cp1-001"
          test "$(git hash-object laws/index.html)" = "67fa907917a5f79862bc31856ebb0c170ed5e823"
          test "$(git hash-object laws/index.controller.js)" = "6f1406c151c4f983ce66ce32114355d0117e4f90"
          test "$(git hash-object laws/index.interactions.js)" = "24e3e655d1b3b064d173639e71851c5cb0bb7c90"
          test "$(git hash-object laws/index.crystals.js)" = "e7edf04cde5f58d7a1187bd5456d7749f79584f7"
          test "$(git hash-object laws/index.css)" = "469716bf125b5aa6ef7c3a7dfe5e328590a548c9"
          test "$(git hash-object laws/index.crystals.source.js)" = "e7edf04cde5f58d7a1187bd5456d7749f79584f7"

      - name: Decode exact temporary patch payloads
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2 3; do
            base64 --decode "verification/laws-six-node-cp3/patch${n}.py.gz.b64" | gunzip > "/tmp/patch${n}.py"
          done
          echo "88d8ff69186c6405b06b2118493ae05a328925b4bd68488d9807614b47a00bde  /tmp/patch1.py" | sha256sum -c -
          echo "b6ea1315c95fc316326ab4efaf8c864341dbb314dc0bf855e762f7d3f2592e17  /tmp/patch2.py" | sha256sum -c -
          echo "d27241821358085610e365e2f6634d04d3cf715ad23446e1c99ab05c2835b9b1  /tmp/patch3.py" | sha256sum -c -
          python -m py_compile /tmp/patch1.py /tmp/patch2.py /tmp/patch3.py
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/patch1.py').read_text()
          needle = 'html direct nav'
          index = source.find(needle)
          print('PATCH1_DIRECT_NAV_CONTEXT_BEGIN')
          print(source[max(0, index - 1400):index + 700])
          print('PATCH1_DIRECT_NAV_CONTEXT_END')
          PY

      - name: Apply bounded six-node source candidate
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/patch1.py
          python /tmp/patch2.py
          python /tmp/patch3.py

      - name: Execute syntax and source conformance checks
        shell: bash
        run: |
          set -euo pipefail
          node --check laws/index.controller.js
          node --check laws/index.interactions.js
          node --check laws/index.crystals.js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('laws/index.html').read_text()
          controller = Path('laws/index.controller.js').read_text()
          interactions = Path('laws/index.interactions.js').read_text()
          crystals = Path('laws/index.crystals.js').read_text()
          css = Path('laws/index.css').read_text()
          test = Path('laws/test/index.html').read_text()
          research = Path('laws/research/index.html').read_text()
          assert len(re.findall(r'<button\b[^>]*\bdata-laws-category-control\b', html, re.I)) == 4
          assert len(re.findall(r'<button\b[^>]*\bdata-laws-law-control\b', html, re.I)) == 16
          assert len(re.findall(r'<button\b[^>]*\bdata-laws-auxiliary-control\b', html, re.I)) == 2
          assert 'data-laws-primary-star-count="6"' in html
          assert 'data-laws-auxiliary-id="test"' in html and 'data-laws-auxiliary-id="research"' in html
          assert 'requestAuxiliarySelection' in controller
          assert 'KIND.AUXILIARY' in interactions
          assert 'NODE_TYPES.AUXILIARY' in crystals and 'auxiliaryScale' in crystals
          assert 'Object.freeze([0.62, 0.56, 0.70])' in crystals
          assert 'Object.freeze([-0.62, -0.56, 0.70])' in crystals
          assert '--laws-authority-size' in css
          assert 'LAWS_REVERSIBLE_ADMISSIBILITY_TEST_ROUTE_v1' in test
          assert 'data-canonical-state-names-recovered="false"' in test
          assert 'LAWS_RESEARCH_EVIDENCE_ATLAS_v1' in research
          assert '1,653' in research and '0.9394' in research and '0.9704' in research
          assert 'data-empirical-validation-claimed="false"' in research
          print('LAWS_SIX_NODE_CP3_SOURCE_CONFORMANCE=PASS')
          PY
          git diff --check

      - name: Execute static route availability check
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 >/tmp/laws-six-node-server.log 2>&1 &
          server_pid=$!
          trap 'kill ${server_pid} 2>/dev/null || true' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:4173/laws/ >/tmp/laws-index.html
          curl --fail --silent --show-error http://127.0.0.1:4173/laws/test/ >/tmp/laws-test.html
          curl --fail --silent --show-error http://127.0.0.1:4173/laws/research/ >/tmp/laws-research.html
          grep -q 'data-laws-primary-star-count="6"' /tmp/laws-index.html
          grep -q 'LAWS_REVERSIBLE_ADMISSIBILITY_TEST_ROUTE_v1' /tmp/laws-test.html
          grep -q 'LAWS_RESEARCH_EVIDENCE_ATLAS_v1' /tmp/laws-research.html

      - name: Verify bounded mutation set and frozen files
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- laws/index.compositor.js laws/index.planet.js laws/index.cosmos.js laws/index.crystals.source.js showroom products
          python - <<'PY'
          import subprocess
          allowed = {
            '.github/workflows/laws-six-node-cp3-applicator.yml',
            'verification/laws-six-node-cp3/patch1.py.gz.b64',
            'verification/laws-six-node-cp3/patch2.py.gz.b64',
            'verification/laws-six-node-cp3/patch3.py.gz.b64',
            'laws/index.html',
            'laws/index.controller.js',
            'laws/index.interactions.js',
            'laws/index.crystals.js',
            'laws/index.css',
            'laws/test/index.html',
            'laws/research/index.html',
          }
          lines = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          paths = {line[3:] for line in lines}
          unexpected = sorted(paths - allowed)
          required = {
            'laws/index.html',
            'laws/index.controller.js',
            'laws/index.interactions.js',
            'laws/index.crystals.js',
            'laws/index.css',
            'laws/test/index.html',
            'laws/research/index.html',
          }
          missing = sorted(required - paths)
          if unexpected or missing:
            raise SystemExit(f'BOUNDED_PATH_SET_FAILED unexpected={unexpected} missing={missing}')
          print('BOUNDED_PATH_SET=PASS')
          PY

      - name: Remove temporary applicator custody
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/laws-six-node-cp3-applicator.yml \
            verification/laws-six-node-cp3/patch1.py.gz.b64 \
            verification/laws-six-node-cp3/patch2.py.gz.b64 \
            verification/laws-six-node-cp3/patch3.py.gz.b64
          rmdir verification/laws-six-node-cp3 2>/dev/null || true

      - name: Commit bounded Checkpoint 3 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            laws/index.html \
            laws/index.controller.js \
            laws/index.interactions.js \
            laws/index.crystals.js \
            laws/index.css \
            laws/test/index.html \
            laws/research/index.html
          git add -u \
            .github/workflows/laws-six-node-cp3-applicator.yml \
            verification/laws-six-node-cp3
          git commit -m "Add Laws Test and Research authority stars"
          git push origin HEAD:agent/laws-fifth-test-star-reversible-admissibility-cp1-001
