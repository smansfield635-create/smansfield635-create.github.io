name: H-Earth Run 8E R3D3 Live GPU Camera Response

on:
  push:
    branches:
      - agent/h-earth-run8e-r3d3-live-gpu-camera-response-001
  pull_request:
    branches:
      - agent/h-earth-run8e-r3d2-pointer-touch-intake-001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-run8e-r3d3-live-gpu-camera-response:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      H_EARTH_RUN8E_R3D3_URL: http://127.0.0.1:4173/showroom/globe/h-earth/diagnostic/run8e-r3d/
      H_EARTH_RUN8E_R3D3_OUTPUT: /tmp/h-earth-run8e-r3d3
    steps:
      - name: Check out exact R3D3 event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact R3D2 base and protected witnesses
        run: |
          set -euo pipefail
          git fetch origin agent/h-earth-run8e-r3d2-pointer-touch-intake-001
          test "$(git merge-base HEAD origin/agent/h-earth-run8e-r3d2-pointer-touch-intake-001)" = "a58ed510eda8c21aac6fa6870271d945387f7cbd"
          test "$(git hash-object showroom/globe/h-earth/functional-landscape/navigation.js)" = "8ab3446c536fc24423d5601acce232b19fa71c91"
          test "$(git hash-object showroom/globe/h-earth/render/live-renderer-contract.run8e-r3a.js)" = "4e187fc38780dfb2020482b674ac331f5a65b2c1"
          test "$(git hash-object showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.js)" = "b8b3c713d5f0b7c79808e8942ce385887589d880"
          test "$(git hash-object showroom/globe/h-earth/diagnostic/run8e-r3d/pointer-touch-intake.js)" = "bb96858fec09d14bbe10aa9ffa8a7f07af3621e6"
          test "$(git hash-object showroom/globe/h-earth/index.html)" = "b5f72fb70f59276f868a5894ee0c5e8beccc40ca"
          test "$(git hash-object showroom/globe/h-earth/functional-landscape/direct-manipulation.js)" = "322ee2bfed5184acd8eac600f19abd72380b6c2b"

      - name: Verify R3D3 syntax authority and bounded source
        run: |
          set -euo pipefail
          node --check h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3.live-gpu-presentation-recovery.js
          node --check h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3d3.live-gpu-camera-response.js
          node --check h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.run8e-r3d3-live-gpu-camera-response-scope.js
          node --check h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js
          node --check h-earth-3d/validation/h-earth.run8e-r3d3.live-gpu-camera-response.harness.mjs
          node --check showroom/globe/h-earth/diagnostic/run8e-r3d/diagnostic-host.js
          node --check showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js
          if test -f h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3d3.pass-closed.receipt.json; then
            node -e "JSON.parse(require('fs').readFileSync('h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3d3.pass-closed.receipt.json','utf8'))"
          fi
          grep -q "from '../../render/live-renderer-contract.run8e-r3a.js'" showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js
          grep -q "from '../../render/persistent-live-renderer.run8e-r3c.js'" showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js
          grep -q "renderer.renderFrame(packet)" showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js
          grep -q "renderer.captureColorFrame" showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js
          ! grep -Eq "canvas\.style\.transform|translate3d\(|backgroundImage|new Image\(|createElement\(['\"]img" showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js showroom/globe/h-earth/diagnostic/run8e-r3d/diagnostic-host.js

      - name: Install bounded Chromium dependency
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Start isolated diagnostic server
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/h-earth-run8e-r3d3-server.log 2>&1 &
          echo $! >/tmp/h-earth-run8e-r3d3-server.pid
          for attempt in $(seq 1 30); do
            if curl --silent --fail "$H_EARTH_RUN8E_R3D3_URL" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/h-earth-run8e-r3d3-server.log
          exit 1

      - name: Execute live GPU camera response
        run: |
          set -euo pipefail
          node h-earth-3d/validation/h-earth.run8e-r3d3.live-gpu-camera-response.harness.mjs

      - name: Execute automatic repository-registry preflight
        run: |
          set -euo pipefail
          git diff --name-only a58ed510eda8c21aac6fa6870271d945387f7cbd...HEAD \
            | grep -E '^(h-earth-3d/|showroom/globe/h-earth/)' \
            | sort -u > /tmp/h-earth-run8e-r3d3-governed-paths.txt || true
          node --experimental-default-type=module \
            tools/h-earth-repository-registry-auto-preflight.mjs \
            --paths-file /tmp/h-earth-run8e-r3d3-governed-paths.txt \
            --task "Run 8E R3D3 live GPU camera response" \
            --mutation-intent \
            --output "$H_EARTH_RUN8E_R3D3_OUTPUT/h-earth.run8e-r3d3.automatic-preflight.receipt.json"
          node - <<'NODE'
          const receipt = require('/tmp/h-earth-run8e-r3d3/h-earth.run8e-r3d3.automatic-preflight.receipt.json');
          if (receipt.finalDisposition !== 'PASS') throw new Error(`R3D3_AUTOMATIC_PREFLIGHT_NOT_PASS:${receipt.finalDisposition}`);
          NODE

      - name: Verify exact scope and R3D4 stopping boundary
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only a58ed510eda8c21aac6fa6870271d945387f7cbd...HEAD | sort > "$H_EARTH_RUN8E_R3D3_OUTPUT/r3d3-changed-paths.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = {line.strip() for line in Path('/tmp/h-earth-run8e-r3d3/r3d3-changed-paths.txt').read_text().splitlines() if line.strip()}
          required = {
            '.github/workflows/h-earth-run8e-r3d3-live-gpu-camera-response.yml',
            'h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3.live-gpu-presentation-recovery.js',
            'h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3d3.live-gpu-camera-response.js',
            'h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.run8e-r3d3-live-gpu-camera-response-scope.js',
            'h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js',
            'h-earth-3d/validation/h-earth.run8e-r3d3.live-gpu-camera-response.harness.mjs',
            'showroom/globe/h-earth/diagnostic/run8e-r3d/index.html',
            'showroom/globe/h-earth/diagnostic/run8e-r3d/diagnostic-host.js',
            'showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js'
          }
          optional = {'h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3d3.pass-closed.receipt.json'}
          missing = sorted(required - paths)
          unexpected = sorted(paths - required - optional)
          if missing: raise SystemExit(f'R3D3_REQUIRED_PATHS_MISSING:{missing}')
          if unexpected: raise SystemExit(f'R3D3_UNEXPECTED_PATHS:{unexpected}')
          forbidden = [p for p in paths if p in {
            'showroom/globe/h-earth/index.html',
            'showroom/globe/h-earth/functional-landscape/direct-manipulation.js',
            'showroom/globe/h-earth/functional-landscape/navigation.js',
            'showroom/globe/h-earth/render/live-renderer-contract.run8e-r3a.js',
            'showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.js',
            'showroom/globe/h-earth/diagnostic/run8e-r3d/pointer-touch-intake.js'
          }]
          if forbidden: raise SystemExit(f'R3D3_FORBIDDEN_PATHS:{forbidden}')
          receipt = json.loads(Path('/tmp/h-earth-run8e-r3d3/h-earth.run8e-r3d3.live-gpu-camera-response.execution.receipt.json').read_text())
          if receipt['eligible'] is not True: raise SystemExit('R3D3_EXECUTION_RECEIPT_NOT_ELIGIBLE')
          if receipt['stoppingBoundary'] != 'STOP_BEFORE_INTERACTION_BROWSER_EXECUTION_R3D4': raise SystemExit('R3D3_STOPPING_BOUNDARY_MISMATCH')
          if any(receipt['liveGpu']['boundaries'].values()): raise SystemExit('R3D3_EXECUTION_BOUNDARY_VIOLATION')
          if receipt['correspondence']['visibleGpuFrameCount'] < 6: raise SystemExit('R3D3_VISIBLE_FRAME_COUNT_INSUFFICIENT')
          if receipt['correspondence']['distinctFrameHashCount'] < 3: raise SystemExit('R3D3_DISTINCT_FRAME_COUNT_INSUFFICIENT')
          if receipt['correspondence']['postInitializationResourceCreationCount'] != 0: raise SystemExit('R3D3_RESOURCE_RECREATION_OBSERVED')
          if receipt['correspondence']['postInitializationBufferUploadCount'] != 0: raise SystemExit('R3D3_BUFFER_REUPLOAD_OBSERVED')
          PY

      - name: Upload R3D3 live GPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-run8e-r3d3-live-gpu-camera-response-evidence
          path: |
            /tmp/h-earth-run8e-r3d3
            /tmp/h-earth-run8e-r3d3-server.log
            /tmp/h-earth-run8e-r3d3-governed-paths.txt
          if-no-files-found: warn
          retention-days: 90
