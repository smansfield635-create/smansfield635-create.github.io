              allPreservationLawsPass:laws.every(v=>v.passed),
              registryPreflight:registry,
              unresolvedRequiredPlacementFields:unresolved,
              unresolvedRequiredPlacementFieldCount:unresolved.length,
              deferredFieldsAreNotUnresolvedRequiredFields:true,
