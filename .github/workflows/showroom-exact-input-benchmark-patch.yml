name: Temporary Showroom Exact-Input Benchmark Patch

on:
  pull_request:
    branches:
      - agent/laws-showroom-cluster-front-lock-compass-fit-cp1-001
    paths:
      - "verification/showroom-exact-input-trigger.txt"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/laws-showroom-cluster-front-lock-compass-fit-cp1-001
          fetch-depth: 0
      - name: Apply exact-input benchmark correction
        run: python3 verification/showroom-cluster-front-lock/patch-exact-input-benchmark.py
      - name: Validate patched evidence sources
        run: |
          node --check verification/benchmark-tools/four-compass-benchmark-v1/showroom-label-conformance-benchmark.mjs
          test ! -e verification/showroom-cluster-front-lock/patch-exact-input-benchmark.py
          git diff --check
      - name: Commit corrected benchmark candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use actual browser input for Showroom front-lock benchmark"
          git push origin HEAD:agent/laws-showroom-cluster-front-lock-compass-fit-cp1-001
