name: Static Asset Identity Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  compass-gen347-bootstrap-receipt:
    if: github.head_ref == 'verification/compass-gen347-bootstrap-receipt'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve exact candidate
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/gen347-http.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/compass-awards-provenance/ >/dev/null && exit 0; sleep .25; done
          cat /tmp/gen347-http.log
          exit 1
      - name: Capture terminal bootstrap receipt
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const profiles=[['desktop',1440,900],['tablet',1024,768],['phone',390,844]];
          const browser=await chromium.launch({headless:true});
          const results=[];
          let failed=false;
          for(const [name,width,height] of profiles){
            const page=await browser.newPage({viewport:{width,height}});
            const errors=[];
            page.on('console',m=>{if(m.type()==='error') errors.push({type:'console',text:m.text()})});
            page.on('pageerror',e=>errors.push({type:'pageerror',text:String(e.stack||e)}));
            const response=await page.goto('http://127.0.0.1:4173/compass-awards-provenance/',{waitUntil:'networkidle',timeout:30000});
            await page.waitForFunction(()=>Boolean(document.documentElement.dataset.compassAwardsQualification),{timeout:10000}).catch(()=>{});
            const snapshot=await page.evaluate(()=>({
              status:document.documentElement.dataset.compassAwardsQualification||null,
              cloneController:document.documentElement.dataset.compassCloneController||null,
              runtime:window.__COMPASS_AWARDS_PROVENANCE__?.getRuntime?.()||null,
              root:Boolean(document.querySelector('[data-compass-root]')),
              cardinals:document.querySelectorAll('[data-compass-cardinal]').length,
              rooms:document.querySelectorAll('[data-compass-room]').length,
              mirrorlandRoutes:document.querySelectorAll('[data-compass-mirrorland-routes] a').length,
              capabilities:document.querySelectorAll('[data-capability]').length,
              readinessFamilies:document.querySelectorAll('[data-readiness-family]').length,
              provenance:document.querySelectorAll('.ap-award-card').length,
              bodyText:document.body.innerText.slice(0,500)
            }));
            results.push({name,http:response?.status()||null,snapshot,errors});
            if(snapshot.status!=='QUALIFICATION_READY'||snapshot.runtime?.pass!==true||errors.length) failed=true;
            await page.screenshot({path:`/tmp/gen347-bootstrap-${name}.png`,fullPage:true});
            await page.close();
          }
          await browser.close();
          const receipt={schema:'COMPASS_GEN347_BOOTSTRAP_DIAGNOSTIC_v1',candidate:process.env.GITHUB_SHA,failed,results};
          fs.writeFileSync('/tmp/gen347-bootstrap.json',JSON.stringify(receipt,null,2));
          console.log(JSON.stringify(receipt,null,2));
          if(failed) process.exitCode=1;
          NODE
      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compass-gen347-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/gen347-bootstrap.json
            /tmp/gen347-bootstrap-desktop.png
            /tmp/gen347-bootstrap-tablet.png
            /tmp/gen347-bootstrap-phone.png
          if-no-files-found: warn
          retention-days: 30
