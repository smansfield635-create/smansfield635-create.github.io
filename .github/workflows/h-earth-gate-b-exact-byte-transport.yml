name: H-Earth Gate B Exact Capacity Revalidation

on:
  pull_request:

permissions:
  contents: read

jobs:
  observe-exact-capacity-alignment:
    if: github.head_ref == 'agent/h-earth-gate-b-phase-a-successor-001'
    runs-on: ubuntu-latest
    env:
      OBSERVATION_PATH: /tmp/h-earth-gate-b-exact-capacity-observation.json
    steps:
      - name: Check out isolated Phase A branch
        uses: actions/checkout@v4
        with:
          ref: agent/h-earth-gate-b-phase-a-successor-001
          fetch-depth: 0

      - name: Record exact environment-capacity subchecks
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const environment = await import('./showroom/globe/h-earth/environment.js');
          const capacity = await import('./showroom/globe/h-earth/capacity.js');

          const observation = {
            environmentBlob: 'aa60accc453e66f84a11d27f25d946c2b33c1d83',
            capacityContractId:
              capacity.H_EARTH_3D_CAPACITY_CONTRACT_ID ?? null,
            environmentPreflight:
              environment.H_EARTH_3D_ENVIRONMENT_PREFLIGHT ?? null,
            primitivePlan:
              environment.H_EARTH_3D_ENVIRONMENT_PRIMITIVE_PLAN ?? null,
            primitivePlanEvaluation:
              environment.evaluateHEarth3DEnvironmentPrimitivePlan?.() ?? null,
            frameCapacityAlignment:
              environment.H_EARTH_3D_ENVIRONMENT_FRAME_CAPACITY_ALIGNMENT ?? null,
            frameCapacityAlignmentEvaluation:
              environment.evaluateHEarth3DEnvironmentCapacityAlignment?.() ?? null,
            handoffEvaluation:
              environment.evaluateHEarth3DEnvironmentHandoff?.() ?? null,
            wetSandEvaluation:
              environment.evaluateHEarth3DWetSandNumericConstructionProfile?.() ?? null,
            sharedBoundaryEvaluation:
              environment.evaluateHEarth3DSharedShorelineBoundary?.() ?? null,
            renderStageLimits:
              capacity.H_EARTH_3D_RENDER_STAGE_LIMITS ?? null,
            renderFrameCapacity:
              capacity.H_EARTH_3D_RENDER_FRAME_CAPACITY ?? null,
            compositorFrameEligibility:
              capacity.H_EARTH_3D_COMPOSITOR_FRAME_ELIGIBILITY ?? null,
            rendererFrameConsumptionEligibility:
              capacity.H_EARTH_3D_RENDERER_FRAME_CONSUMPTION_ELIGIBILITY ?? null
          };

          writeFileSync(
            process.env.OBSERVATION_PATH,
            JSON.stringify(observation, null, 2) + '\n',
            'utf8'
          );
          console.log(JSON.stringify({
            environmentPreflightEligible:
              observation.environmentPreflight?.eligible ?? null,
            primitivePlanEligible:
              observation.primitivePlanEvaluation?.eligible ?? null,
            capacityAlignmentEligible:
              observation.frameCapacityAlignmentEvaluation?.eligible ?? null,
            handoffEligible:
              observation.handoffEvaluation?.eligible ?? null,
            alignmentBooleans:
              Object.fromEntries(
                Object.entries(observation.frameCapacityAlignment ?? {})
                  .filter(([, value]) => typeof value === 'boolean')
              )
          }, null, 2));
          NODE

      - name: Upload exact capacity revalidation observation
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-gate-b-exact-capacity-observation
          path: /tmp/h-earth-gate-b-exact-capacity-observation.json
          if-no-files-found: error
          retention-days: 1

      - name: Stop without source mutation
        shell: bash
        run: |
          echo 'Exact capacity observation captured; source mutation withheld.'
          exit 1
