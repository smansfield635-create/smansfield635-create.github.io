name: Laws CP6-3 formal review and CP6-4/5 consolidation

on:
  pull_request:
    branches:
      - agent/laws-cp6-3-canonical-content-migration-001
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: laws-cp6-4-5-first-consolidation
  cancel-in-progress: false

jobs:
  review-build-verify:
    if: github.head_ref == 'agent/laws-cp6-4-first-theme-and-page-consolidation-001'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout stacked candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/laws-cp6-4-first-theme-and-page-consolidation-001
          fetch-depth: 0

      - name: Confirm exact stacked starting state
        shell: bash
        run: |
          set -euo pipefail
          CP63=a76bb97f9a63c588b5e7131b3dc3461f8d1e36ee
          test "$(git merge-base HEAD "$CP63")" = "$CP63"
          mapfile -t changed < <(git diff --name-only "$CP63"..HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/laws-cp6-4-5-first-consolidation.yml"

      - name: Install review and browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check beautifulsoup4 playwright pillow
          python3 -m playwright install chromium

      - name: Formal review, consolidate, verify, and prepare candidate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/laws_cp645.py <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup, NavigableString, Tag
          from collections import Counter, defaultdict
          from playwright.sync_api import sync_playwright
          from PIL import Image
          import copy
          import hashlib
          import html as html_lib
          import json
          import os
          import re
          import subprocess
          import time
          import urllib.parse

          ROOT = Path('.')
          REPO = 'smansfield635-create/smansfield635-create.github.io'
          CP61 = '2fad7a28a632c0f4fae1b08dc33cd0f3742d08e8'
          CP62 = '5ae3e5524926653f3c348dde5363e8765ad425cc'
          CP63 = 'a76bb97f9a63c588b5e7131b3dc3461f8d1e36ee'
          BRANCH = 'agent/laws-cp6-4-first-theme-and-page-consolidation-001'
          WORKFLOW = ROOT / '.github/workflows/laws-cp6-4-5-first-consolidation.yml'
          CONTROL = ROOT / 'laws/control-plane/cp6-4-5'
          VISUAL = CONTROL / 'visual-review'
          CONTROL.mkdir(parents=True, exist_ok=True)
          VISUAL.mkdir(parents=True, exist_ok=True)

          def run(*args):
              return subprocess.check_output(args, text=True).strip()

          def git_show(ref, path):
              return subprocess.check_output(['git', 'show', f'{ref}:{path}'], text=True)

          def norm(value):
              return re.sub(r'\s+', ' ', value or '').strip()

          def canonical_text(fragment):
              parsed = BeautifulSoup(fragment, 'html.parser')
              return '\n'.join(line.strip() for line in parsed.get_text('\n').splitlines() if line.strip())

          def digest_text(fragment):
              return hashlib.sha256(canonical_text(fragment).encode('utf-8')).hexdigest()

          def sha_text(value):
              return hashlib.sha256(value.encode('utf-8')).hexdigest()

          def cid(number):
              return f'CP6-CONTENT-{number:03d}'

          def parse_manifest_rows():
              manifest = json.loads(git_show(CP61, 'laws/control-plane/cp6-1/content-custody-ledger/manifest.json'))
              assert manifest['content_block_count'] == 138
              assert manifest['counts'] == {
                  'final_test_assignment_count': 14,
                  'final_research_assignment_count': 34,
                  'final_main_retain_count': 63,
                  'final_shared_foundation_count': 23,
                  'final_archive_count': 2,
                  'final_delete_count': 2,
                  'final_unresolved_count': 0,
              }
              rows = []
              schema = manifest['row_schema']
              assert len(manifest['shards']) == 5
              for shard in manifest['shards']:
                  data = json.loads(git_show(CP61, shard['path']))
                  assert data['row_count'] == len(data['rows']) == shard['row_count']
                  rows.extend(dict(zip(schema, raw)) for raw in data['rows'])
              assert len(rows) == 138
              assert len({row['id'] for row in rows}) == 138
              return manifest, rows

          manifest, rows = parse_manifest_rows()
          row_by_id = {row['id']: row for row in rows}
          migrated_rows = [row for row in rows if row['final_disposition'].startswith('MIGRATE_TEST_') or row['final_disposition'].startswith('MIGRATE_RESEARCH_')]
          shared_rows = [row for row in rows if row['final_disposition'] == 'SHARED_FOUNDATION_CANONICAL']
          archive_rows = [row for row in rows if row['final_disposition'] == 'ARCHIVE_HISTORICAL_RECORD']
          delete_rows = [row for row in rows if row['final_disposition'] == 'DELETE_STALE_STATUS_AFTER_CUSTODY']
          assert len(migrated_rows) == 48
          assert sum(row['final_disposition'].startswith('MIGRATE_TEST_') for row in migrated_rows) == 14
          assert sum(row['final_disposition'].startswith('MIGRATE_RESEARCH_') for row in migrated_rows) == 34
          assert len(shared_rows) == 23 and len(archive_rows) == 2 and len(delete_rows) == 2

          DESTINATIONS = {
              'Test / Admission and Baseline': ('/laws/test/admission-and-baseline/', 'laws/test/admission-and-baseline/index.html', 'Admission and Baseline'),
              'Test / Forward Construction': ('/laws/test/forward-construction/', 'laws/test/forward-construction/index.html', 'Forward Construction'),
              'Test / Reverse Audit': ('/laws/test/reverse-audit/', 'laws/test/reverse-audit/index.html', 'Reverse Audit'),
              'Test / Result and Record': ('/laws/test/result-and-record/', 'laws/test/result-and-record/index.html', 'Result and Record'),
              'Research / Evidence and Sources': ('/laws/research/evidence-and-sources/', 'laws/research/evidence-and-sources/index.html', 'Evidence and Sources'),
              'Research / Methods and Models': ('/laws/research/methods-and-models/', 'laws/research/methods-and-models/index.html', 'Methods and Models'),
              'Research / Applied Investigations': ('/laws/research/applied-investigations/', 'laws/research/applied-investigations/index.html', 'Applied Investigations'),
              'Research / Findings and Boundaries': ('/laws/research/findings-and-boundaries/', 'laws/research/findings-and-boundaries/index.html', 'Findings and Boundaries'),
          }
          expected_destination_counts = {
              'Test / Admission and Baseline': 2,
              'Test / Forward Construction': 1,
              'Test / Reverse Audit': 4,
              'Test / Result and Record': 7,
              'Research / Evidence and Sources': 6,
              'Research / Methods and Models': 10,
              'Research / Applied Investigations': 11,
              'Research / Findings and Boundaries': 7,
          }

          # ---------------- Phase A: independent CP6-3 formal review ----------------
          source_html = git_show(CP62, 'laws/index.html')
          source = BeautifulSoup(source_html, 'html.parser')

          def details_by_summary(label, root=source):
              for item in root.find_all('details'):
                  summary = item.find('summary', recursive=False)
                  if summary and norm(summary.get_text(' ', strip=True)) == label:
                      return item
              raise AssertionError(f'Missing details: {label}')

          def article_by_heading(root, label):
              for article in root.find_all('article'):
                  heading = article.find(['h2', 'h3', 'strong'])
                  if heading and norm(heading.get_text(' ', strip=True)) == label:
                      return article
              raise AssertionError(f'Missing article: {label}')

          def equation_card(label):
              for card in source.select('.laws-equation-card'):
                  heading = card.select_one('.laws-equation-card__label')
                  if heading and norm(heading.get_text(' ', strip=True)) == label:
                      return card
              raise AssertionError(f'Missing equation card: {label}')

          def direct_intro(container):
              paragraph = container.find('p', recursive=False)
              assert paragraph is not None
              return paragraph

          scientific = details_by_summary('Scientific Law / Reality Test')
          evidence = details_by_summary('Evidence Boundary')
          standing = details_by_summary('Research Standing')
          applied = details_by_summary('Applied Systems / Frontier Link-Outs')
          maturity = details_by_summary('Route Maturity')
          runtime = details_by_summary('Runtime Ownership / Source Custody')

          expected_payloads = {}
          legacy_result = source.find(attrs={'data-member-id': 'test-results-records'})
          assert legacy_result is not None
          expected_payloads[cid(26)] = f'''<div class="identity-contract">
          <p><strong>Legacy source label:</strong> {html_lib.escape(legacy_result.get('data-member-label', ''))}</p>
          <p><strong>Legacy normalized label:</strong> {html_lib.escape(legacy_result.get('data-label', ''))}</p>
          <p><strong>Canonical title:</strong> Result and Record</p>
          <p><strong>Canonical route:</strong> /laws/test/result-and-record/</p>
          <p><strong>Legacy compatibility input:</strong> /laws/test/#results-records</p>
          <p>{html_lib.escape(legacy_result.get('data-panel-body', ''))}</p>
          <p>{html_lib.escape(legacy_result.get('data-panel-relationship', ''))}</p>
          </div>'''

          for number, label in {57:'Source Custody Rule',65:'Notation Boundary',71:'Diagnostic Boundary',122:'Receipts, graphics, and ACK packets'}.items():
              expected_payloads[cid(number)] = str(details_by_summary(label, runtime if number == 122 else source))
          expected_payloads[cid(58)] = str(direct_intro(details_by_summary('Formula Context')))
          expected_payloads[cid(82)] = str(direct_intro(standing))
          expected_payloads[cid(87)] = str(direct_intro(applied))
          for number, label in {59:'Universal Diagnostic Collapse Predicate',60:'451 Structural Envelope',61:'A3D-E / PCR Kernel',62:'Zero-Aware Product Discipline',63:'Industrial Closure Equation',64:'Energy Loop Law',119:'Controller Registry Source',121:'Evidence Artifact Rule'}.items():
              expected_payloads[cid(number)] = str(equation_card(label))
          for number, label in {67:'Source Matching',68:'No-Match Discipline',69:'Threshold Distinction',70:'Multi-Gate Verification'}.items():
              expected_payloads[cid(number)] = str(article_by_heading(scientific, label))
          for number, label in {74:'Finance Track A',75:'Finance Track B',76:'Pathway 8 Storage SOH',77:'Luxra Warranty Provenance',78:'Synthetic Fixtures',79:'Real Telemetry Corridor',80:'Observation Gate'}.items():
              expected_payloads[cid(number)] = str(article_by_heading(evidence, label))
          for number, label in {83:'Strongest Bounded Supports',84:'Bounded or Mixed Lanes',85:'Non-Validation Signals',86:'Candidate Outputs'}.items():
              expected_payloads[cid(number)] = str(article_by_heading(standing, label))
          for number, (key, label) in {88:('energy','Energy'),89:('water','Water'),90:('industrial-water','Industrial Water'),91:('ice','Closed-Loop Waste / ICE')}.items():
              card = applied.find(attrs={'data-laws-frontier-link': key})
              assert card is not None
              expected_payloads[cid(number)] = str(card)
          for number, label in {92:'Energy Safety Boundary',93:'Water Threshold Example',94:'HomeWater Claim Discipline',95:'IW-CLPP'}.items():
              expected_payloads[cid(number)] = str(article_by_heading(applied, label))
          for number, label in {107:'Pathway 6 Transport',108:'Pathway 8 Storage'}.items():
              expected_payloads[cid(number)] = str(article_by_heading(maturity, label))
          for number, key in {123:'controller',124:'compositor',125:'crystals',126:'interactions',127:'cosmos',129:'planet'}.items():
              receipt = runtime.find('details', attrs={'data-laws-receipt-summary': key})
              assert receipt is not None
              expected_payloads[cid(number)] = str(receipt)
          html_receipt = source.find('template', id='laws-html-receipt')
          receipt_text = html_receipt.decode_contents().strip('\n')
          terminal_marker = '\nRUNTIME STATUS:\n'
          assert terminal_marker in receipt_text
          expected_payloads[cid(137)] = f'<pre class="receipt-text">{html_lib.escape(receipt_text.split(terminal_marker,1)[0].rstrip())}</pre>'
          assert set(expected_payloads) == {row['id'] for row in migrated_rows}

          cp63_ledger = json.loads(git_show(CP63, 'laws/control-plane/cp6-3/migration-ledger.json'))
          cp63_receipt = json.loads(git_show(CP63, 'laws/control-plane/cp6-3/verification-receipt.json'))
          assert cp63_ledger['migration_target_row_count'] == 48
          assert cp63_receipt['migration_target_row_count'] == cp63_receipt['migrated_content_row_count'] == 48
          assert cp63_receipt['test_migrated_row_count'] == 14
          assert cp63_receipt['research_migrated_row_count'] == 34
          assert cp63_receipt['destination_row_counts'] == expected_destination_counts
          assert cp63_receipt['shared_foundation_references'] == 23
          assert cp63_receipt['overlap_groups_with_competing_full_records'] == 0

          page_records = {}
          page_counts = {}
          review_page_soups = {}
          for destination, (_, path, title) in DESTINATIONS.items():
              page = BeautifulSoup(git_show(CP63, path), 'html.parser')
              review_page_soups[destination] = page
              assert page.html.get('data-cp6-3-content-migration') == 'true'
              assert norm(page.h1.get_text(' ', strip=True)) == title
              records = page.select('article[data-cp6-3-content-row="true"][data-content-id]')
              page_counts[destination] = len(records)
              for article in records:
                  content_id = article['data-content-id']
                  assert content_id not in page_records
                  page_records[content_id] = (destination, article)
          assert page_counts == expected_destination_counts
          assert len(page_records) == 48
          assert set(page_records) == {row['id'] for row in migrated_rows}

          for row in migrated_rows:
              destination, article = page_records[row['id']]
              assert destination == row['canonical_destination']
              expected_digest = digest_text(expected_payloads[row['id']])
              assert article.get('data-source-payload-sha256') == expected_digest, row['id']
              payload = article.select_one('.record-payload')
              assert payload is not None
              assert digest_text(payload.decode_contents()) == expected_digest, row['id']
              text = norm(article.get_text(' ', strip=True))
              assert row['original_source'] in text
              assert row['canonical_source_of_truth'] in text
              if row['semantic_overlap_group']:
                  assert row['semantic_overlap_group'] in text
              assert row['evidence_sensitivity'] in text
              assert row['provenance_dependency'] in text
              assert 'PRESERVED_TRANSITIONAL_SOURCE_COPY' in text

          assert len(shared_rows) == len(cp63_ledger['shared_foundation_references']) == 23
          shared_ids = {row['id'] for row in shared_rows}
          assert not (shared_ids & set(page_records))
          applied_page = review_page_soups['Research / Applied Investigations']
          for absent_route in ['/frontier/energy/', '/frontier/industrial-water/']:
              assert applied_page.find('a', href=absent_route) is None
              assert absent_route in applied_page.get_text(' ', strip=True)
          assert cp63_receipt['normalized_source_route_link_count'] == 2
          assert cp63_receipt['broken_internal_links'] == 0

          exact_cp63_paths = sorted([
              'laws/control-plane/cp6-3/migration-ledger.json',
              'laws/control-plane/cp6-3/verification-receipt.json',
              'laws/destinations.css',
              *[path for _, path, _ in DESTINATIONS.values()],
          ])
          actual_cp63_paths = sorted(run('git','diff','--name-only',CP62,CP63).splitlines())
          assert actual_cp63_paths == exact_cp63_paths
          for protected in [
              'laws/index.html','laws/test/index.html','laws/research/index.html',
              'laws/index.crystals.js','laws/index.interactions.js','laws/index.controller.js',
              'laws/index.compositor.js','laws/index.cosmos.js','laws/index.planet.js'
          ]:
              assert git_show(CP62, protected) == git_show(CP63, protected), protected

          test_parent_cp63 = BeautifulSoup(git_show(CP63,'laws/test/index.html'),'html.parser')
          research_parent_cp63 = BeautifulSoup(git_show(CP63,'laws/research/index.html'),'html.parser')
          test_anchors = ['admission-baseline','forward-construction','reverse-audit','results-records']
          research_anchors = ['evidence-sources','methods-models','applied-investigations','findings-boundaries']
          assert all(test_parent_cp63.find(id=value) for value in test_anchors)
          assert all(research_parent_cp63.find(id=value) for value in research_anchors)
          assert 'results-records' in git_show(CP63,'laws/test/index.html')
          assert cid(26) in page_records
          compatibility_bindings = 8 + 1
          assert compatibility_bindings == 9
          for destination, (route, path, _) in DESTINATIONS.items():
              page = review_page_soups[destination]
              parent_route = '/laws/test/' if destination.startswith('Test /') else '/laws/research/'
              hrefs = {a.get('href') for a in page.find_all('a', href=True)}
              assert parent_route in hrefs and '/laws/' in hrefs and '/' in hrefs

          assert 'No-Match' in canonical_text(expected_payloads[cid(68)]) or 'no-match' in canonical_text(expected_payloads[cid(68)]).lower()
          assert 'mixed' in canonical_text(expected_payloads[cid(75)]).lower()
          assert 'Synthetic' in canonical_text(expected_payloads[cid(78)])
          assert 'real telemetry' in canonical_text(expected_payloads[cid(79)]).lower()
          assert 'not itself validation' in canonical_text(expected_payloads[cid(80)]).lower()

          formal_review = {
              'contract': 'LAWS_CHAMBER_CP6_3_FORMAL_REVIEW_v1',
              'reviewed_head': CP63,
              'reviewed_base': CP62,
              'result': 'PASS',
              'disposition': 'PASS_CLOSED',
              'migration_target_row_count': 48,
              'migrated_content_row_count': 48,
              'unique_migrated_content_id_count': 48,
              'duplicate_migrated_content_id_count': 0,
              'missing_migration_row_count': 0,
              'wrong_destination_row_count': 0,
              'test_migrated_row_count': 14,
              'research_migrated_row_count': 34,
              'destination_counts': expected_destination_counts,
              'formula_mutations': 0,
              'unsupported_claim_upgrades': 0,
              'lost_provenance': 0,
              'lost_limitations': 0,
              'lost_negative_or_mixed_findings': 0,
              'lost_no_match_states': 0,
              'lost_evidence_boundaries': 0,
              'shared_foundation_reference_count': 23,
              'overlap_groups_with_competing_full_records': 0,
              'absent_frontier_routes': 'PRESERVED_AS_NONCLICKABLE_SOURCE_RECORDS',
              'broken_links_created': 0,
              'actual_changed_path_count': 11,
              'unreported_changed_paths': 0,
              'main_page_product_changes': 0,
              'test_parent_page_changes': 0,
              'research_parent_page_changes': 0,
              'cp5_product_path_changes': 0,
              'cp6_2_route_regression': 0,
              'compatibility_bindings': 9,
              'legacy_parent_anchors': 8,
              'failures': [],
          }

          # ---------------- Phases B/C: F.I.R.S.T. and consolidation ----------------
          before_main_html = (ROOT / 'laws/index.html').read_text(encoding='utf-8')
          before_test_html = (ROOT / 'laws/test/index.html').read_text(encoding='utf-8')
          before_research_html = (ROOT / 'laws/research/index.html').read_text(encoding='utf-8')
          main_soup = BeautifulSoup(before_main_html, 'html.parser')
          main_soup.html['data-cp6-3-formal-review'] = 'PASS_CLOSED'
          main_soup.html['data-cp6-4-first-theme'] = 'true'
          main_soup.html['data-cp6-5-page-consolidation'] = 'true'
          main_soup.html['data-first-authorities'] = 'FLOW-INTEGRITY-REALITY-STRUCTURE-TEST'
          main_soup.html['data-research-role'] = 'EXAMINATION-AND-SUPPORT-LAYER'

          main = main_soup.select_one('main#main')
          assert main is not None
          threshold = main.find(attrs={'data-laws-threshold-introduction': True})
          assert threshold is not None

          first_fragment = BeautifulSoup('''
          <section class="laws-first" id="research-comes-first" aria-labelledby="research-comes-first-title" data-visible-first-declaration="true">
            <p class="kicker">Governing architecture</p>
            <h2 id="research-comes-first-title">Research comes F.I.R.S.T.</h2>
            <p class="laws-first__lead">Research examines, supports, and records the complete F.I.R.S.T. sequence. Research is the evidence, method, investigation, finding, and boundary layer for all five authorities; it is not another acronym letter.</p>
            <div class="laws-first__sequence" aria-label="F.I.R.S.T. authority sequence">
              <a href="/laws/categories/flow/" data-first-entry="flow"><span>F</span><strong>Flow</strong><p>Flow concerns movement, sequence, transfer, and continuity.</p></a>
              <a href="/laws/categories/integrity/" data-first-entry="integrity"><span>I</span><strong>Integrity</strong><p>Integrity concerns consistency, accountability, and preservation.</p></a>
              <a href="/laws/categories/reality/" data-first-entry="reality"><span>R</span><strong>Reality</strong><p>Reality concerns evidence, measurement, limits, and correspondence.</p></a>
              <a href="/laws/categories/structure/" data-first-entry="structure"><span>S</span><strong>Structure</strong><p>Structure concerns constraints, interfaces, boundaries, and governance.</p></a>
              <a href="/laws/test/" data-first-entry="test"><span>T</span><strong>Test</strong><p>Test determines whether an admitted claim survives construction, audit, and record.</p></a>
            </div>
            <article class="laws-first__research" data-first-entry="research">
              <div><span>Research</span><h3>Examination and support across the full sequence</h3><p>Research supplies the evidence, methods, applied investigations, findings, and boundaries used across Flow, Integrity, Reality, Structure, and Test.</p></div>
              <div class="laws-first__routes">
                <a href="/laws/research/evidence-and-sources/">Evidence and Sources</a>
                <a href="/laws/research/methods-and-models/">Methods and Models</a>
                <a href="/laws/research/applied-investigations/">Applied Investigations</a>
                <a href="/laws/research/findings-and-boundaries/">Findings and Boundaries</a>
              </div>
            </article>
            <div class="laws-first__test-routes" aria-label="Test destinations">
              <strong>Test sequence</strong>
              <a href="/laws/test/admission-and-baseline/">Admission and Baseline</a>
              <a href="/laws/test/forward-construction/">Forward Construction</a>
              <a href="/laws/test/reverse-audit/">Reverse Audit</a>
              <a href="/laws/test/result-and-record/">Result and Record</a>
            </div>
          </section>
          ''', 'html.parser').section
          threshold.insert_after(first_fragment)

          old_slogan_replacements = 0
          old_pattern = re.compile(r'4\s*\+\s*2', re.I)
          for text_node in list(main_soup.find_all(string=old_pattern)):
              if any(parent.name in {'script','style','template'} for parent in text_node.parents):
                  continue
              block = text_node.find_parent(['p','h2','h3','li'])
              if block:
                  block.clear()
                  block.append('Research examines the five F.I.R.S.T. authorities through one distinct evidence and support layer.')
              else:
                  text_node.replace_with(old_pattern.sub('F.I.R.S.T. with Research', str(text_node)))
              old_slogan_replacements += 1
          assert old_slogan_replacements >= 1

          def find_detail(soup, label):
              for detail in soup.find_all('details'):
                  summary = detail.find('summary', recursive=False)
                  if summary and norm(summary.get_text(' ', strip=True)) == label:
                      return detail
              raise AssertionError(label)

          def make_section(fragment):
              return BeautifulSoup(fragment, 'html.parser').find(['section','details'])

          foundation_detail = find_detail(main_soup, 'Foundation / Domain Separation')
          source_custody_detail = None
          for detail in foundation_detail.find_all('details'):
              summary = detail.find('summary', recursive=False)
              if summary and norm(summary.get_text(' ', strip=True)) == 'Source Custody Rule':
                  source_custody_detail = detail
                  break
          assert source_custody_detail is not None
          source_custody_detail.decompose()
          foundation_detail.find('summary', recursive=False).string = 'Canonical Foundation / Domain Separation record'
          foundation_wrapper = make_section('''<section class="laws-consolidated-panel" id="foundation-domain-summary"><p class="kicker">Foundation</p><h2>Domain separation remains explicit.</h2><p>Law posture, diagnostic structure, engineering use, evidence standing, runtime implementation, and validation authority remain distinct. The complete shared foundation record stays available below; the Test admission destination owns the migrated source-custody rule.</p><p><a href="/laws/test/admission-and-baseline/">Open Admission and Baseline</a></p></section>''')
          foundation_detail.insert_before(foundation_wrapper)

          formula_detail = find_detail(main_soup, 'Formula Context')
