name: Compass Display Continuity Validation

on:
  push:
    branches:
      - agent/compass-renewal-plan-v2-construction
    paths:
      - 'index.html'
      - 'assets/compass/**'
      - '.github/ai-router/projects/compass/**'
      - '.github/workflows/compass-display-continuity-validation.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'assets/compass/**'
      - '.github/ai-router/projects/compass/**'
      - '.github/workflows/compass-display-continuity-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-static-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run fail-closed Compass verifier
        env:
          COMPASS_VERIFICATION_OUTPUT: /tmp/compass-display-continuity-verification-receipt.json
        run: node .github/ai-router/projects/compass/verify-display-continuity.v1.mjs
      - name: Upload static verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: compass-display-continuity-verification-receipt
          path: /tmp/compass-display-continuity-verification-receipt.json

  qualify-runtime:
    runs-on: ubuntu-latest
    needs: verify-static-contract
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright outside repository contract
        env:
          npm_config_package_lock: 'false'
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Start local static host
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/compass-http.log 2>&1 &
          echo $! >/tmp/compass-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/compass-http.log
          exit 1
      - name: Playwright desktop tablet phone interaction filtering
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const base='http://127.0.0.1:4173/';
          const browser=await chromium.launch({headless:true});
          const checks=[];
          const check=(id,pass,evidence)=>checks.push({id,pass:Boolean(pass),evidence});
          async function qualifyViewport(name,viewport){
            const context=await browser.newContext({viewport});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(base,{waitUntil:'domcontentloaded',timeout:15000});
            await page.waitForSelector('[data-compass-root]',{timeout:10000});
            await page.waitForSelector('[data-compass-cardinal]',{state:'visible',timeout:10000});
            await page.waitForTimeout(400);
            const result=await page.evaluate(()=>({
              cardinals:[...document.querySelectorAll('[data-compass-cardinal]')].map(el=>el.getAttribute('data-cardinal-id')),
              roomDeclarations:document.querySelectorAll('[data-compass-room-declarations] [data-compass-room]').length,
              horizontalOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
              introOpen:document.querySelector('[data-compass-full-introduction]')?.open,
              mathVisible:document.body.textContent.includes('Mathematical Foundation'),
              monuments:document.querySelectorAll('.compass-monument').length,
              built:Boolean(document.querySelector('.compass-built')),
              buildCta:Boolean(document.querySelector('.compass-build-cta')),
              mirrorRoutes:document.querySelectorAll('[data-compass-mirrorland-routes] a:not([data-compass-mirrorland-inline-back])').length,
              mirrorBack:Boolean(document.querySelector('[data-compass-mirrorland-inline-back]')),
              cosmos:Boolean(document.querySelector('[data-compass-cosmic-field]')),
              headerTop:document.querySelector('.compass-estate__header')?.getBoundingClientRect().top,
              instrumentTop:document.querySelector('.compass-instrument')?.getBoundingClientRect().top
            }));
            check(`${name}_FOUR_CARDINALS`,JSON.stringify(result.cardinals)===JSON.stringify(['north','east','south','west']),result.cardinals);
            check(`${name}_ROOM_DECLARATIONS`,result.roomDeclarations===19,result.roomDeclarations);
            check(`${name}_NO_OVERFLOW`,result.horizontalOverflow<=2,result.horizontalOverflow);
            check(`${name}_INTRO_COLLAPSED`,result.introOpen===false,result.introOpen);
            check(`${name}_MATH_REMOVED`,!result.mathVisible,result.mathVisible);
            check(`${name}_MONUMENTS`,result.monuments===2,result.monuments);
            check(`${name}_BUILT_AND_BUILD`,result.built&&result.buildCta,result);
            check(`${name}_MIRRORLAND_THREE_ROUTES`,result.mirrorRoutes===3&&result.mirrorBack,result);
            check(`${name}_COSMOS_HOST`,result.cosmos,result.cosmos);
            check(`${name}_OPENING_COMPACT`,Number.isFinite(result.headerTop)&&result.headerTop<140,result);
            check(`${name}_INSTRUMENT_FOLLOWS_OPENING`,Number.isFinite(result.instrumentTop)&&result.instrumentTop<900,result);
            check(`${name}_NO_PAGE_ERRORS`,errors.length===0,errors);
            await page.screenshot({path:`/tmp/compass-${name.toLowerCase()}.png`,fullPage:true});
            await context.close();
          }
          await qualifyViewport('DESKTOP',{width:1440,height:900});
          await qualifyViewport('TABLET',{width:1024,height:768});
          await qualifyViewport('PHONE',{width:390,height:844});
          {
            const context=await browser.newContext({viewport:{width:1280,height:800}});
            const page=await context.newPage();
            await page.goto(base,{waitUntil:'domcontentloaded'});
            const north=page.locator('[data-cardinal-id="north"]');
            await north.focus();
            check('KEYBOARD_FOCUS',await north.evaluate(el=>document.activeElement===el),true);
            await north.press('Enter');
            await page.waitForTimeout(500);
            const state=await page.locator('[data-compass-root]').evaluate(el=>({mode:el.dataset.compassMode,selected:el.dataset.selectedCardinal,preview:el.dataset.clusterPreviewPrimaryRoom||'',guidance:document.querySelector('[data-compass-guidance]')?.textContent.trim(),previewState:document.querySelector('[data-compass-preview-state]')?.textContent.trim(),panelTitle:document.querySelector('[data-compass-panel-title]')?.textContent.trim(),enterDisabled:document.querySelector('[data-compass-enter]')?.disabled}));
            check('CARDINAL_OPEN_STATE',state.mode==='CLUSTER_OPEN'&&state.selected==='north',state);
            check('CLUSTER_GUIDANCE_STATE',state.guidance==='Drag to rotate the cluster. Tap a room star to select it. Swipe across open space to return to the constellation.',state.guidance);
            check('FOREGROUND_ROOM_CONTEXT_AND_ENTRY_AVAILABLE',Boolean(state.preview)&&state.previewState?.includes('ROOM IN FRONT')&&Boolean(state.panelTitle)&&state.enterDisabled===false,state);
            const returnButton=page.locator('[data-compass-return-to-orbit]');
            check('RETURN_CONTROL_HIDDEN_WHILE_CLUSTER_OPEN',!(await returnButton.isVisible()),await returnButton.isVisible());
            const clusterReturned=await page.evaluate(()=>globalThis.DGB_COMPASS_CONTROLLER?.requestReturnToConstellation({source:'playwright-qualification',scrollToScene:false})===true);
            await page.waitForTimeout(200);
            check('CLUSTER_RETURN_TO_CONSTELLATION',clusterReturned&&(await page.locator('[data-compass-root]').getAttribute('data-compass-mode'))==='CONSTELLATION',await page.locator('[data-compass-root]').getAttribute('data-compass-mode'));
            await north.press('Enter');
            await page.waitForTimeout(300);
            const roomSelected=await page.evaluate(()=>globalThis.DGB_COMPASS_CONTROLLER?.requestRoomSelection('north-1')===true);
            await page.waitForTimeout(300);
            const roomState=await page.locator('[data-compass-root]').evaluate(el=>({mode:el.dataset.compassMode,room:el.dataset.selectedRoom,guidance:document.querySelector('[data-compass-guidance]')?.textContent.trim()}));
            check('ROOM_SELECTION_STATE',roomSelected&&roomState.mode==='ROOM_SELECTED'&&roomState.room==='north-1',roomState);
            check('ROOM_GUIDANCE_STATE',roomState.guidance==='Review the selected room. Use Enter Room to continue, Return To Orbit to reopen the cluster, or swipe across open space to return to the constellation.',roomState.guidance);
            check('RETURN_CONTROL_EXPOSED_AFTER_ROOM_SELECTION',await returnButton.isVisible(),await returnButton.isVisible());
            await returnButton.click();
            await page.waitForTimeout(300);
            check('EXPLICIT_RETURN_TO_ORBIT_WORKS',(await page.locator('[data-compass-root]').getAttribute('data-compass-mode'))==='CLUSTER_OPEN',await page.locator('[data-compass-root]').getAttribute('data-compass-mode'));
            await context.close();
          }
          {
            const context=await browser.newContext({viewport:{width:1280,height:800},reducedMotion:'reduce'});
            const page=await context.newPage();
            await page.goto(base,{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(300);
            const reduced=await page.locator('[data-compass-root]').getAttribute('data-reduced-motion');
            check('REDUCED_MOTION_STATE',reduced==='true',reduced);
            check('REDUCED_MOTION_SEMANTIC_EQUIVALENCE',await page.locator('[data-compass-cardinal]').count()===4,await page.locator('[data-compass-cardinal]').count());
            await context.close();
          }
          await browser.close();
          const failures=checks.filter(item=>!item.pass);
          const receipt={schema:'COMPASS_RUNTIME_QUALIFICATION_RECEIPT_v2',operationId:'COMPASS_RENEWAL_CONSTRUCTION_v2_20260814_001',lockGeneration:1471,candidateHead:process.env.GITHUB_SHA||null,result:failures.length?'FAIL_CLOSED':'PASS',checks,failures:failures.map(item=>item.id)};
          fs.writeFileSync('/tmp/compass-runtime-qualification-receipt.json',`${JSON.stringify(receipt,null,2)}\n`);
          console.log(JSON.stringify(receipt,null,2));
          if(failures.length)process.exit(1);
          NODE
      - name: Assert 19 rendered foreground room labels
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:800}});
          const failures=[];
          const observations=[];
          const traversal=[];
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          const fail=(id,evidence)=>failures.push({id,evidence});
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:20000});
          await page.waitForSelector('[data-compass-root]',{timeout:10000});
          await page.waitForSelector('[data-compass-room-proxy]',{timeout:10000});
          await page.waitForSelector('[data-compass-projected-room-label]',{state:'attached',timeout:10000});
          await page.waitForFunction(()=>Boolean(globalThis.DGB_COMPASS_CONTROLLER),{timeout:10000});
          const declarationMap=await page.evaluate(()=>Object.fromEntries([...document.querySelectorAll('[data-compass-room-declarations] [data-compass-room]')].map(el=>[el.dataset.roomId,{label:(el.dataset.label||'').trim(),wing:el.dataset.wing}])));
          if(Object.keys(declarationMap).length!==19) fail('DECLARATION_COUNT',Object.keys(declarationMap));
          const inspect=async wing=>page.evaluate(activeWing=>{
            const root=document.querySelector('[data-compass-root]');
            const foreground=root?.dataset.clusterPreviewPrimaryRoom||root?.dataset.clusterPrimaryRoom||'';
            const label=document.querySelector('[data-compass-projected-room-label]');
            const style=label?getComputedStyle(label):null;
            const rect=label?.getBoundingClientRect();
            return {wing:activeWing,mode:root?.dataset.compassMode||'',foreground,renderedRoomId:label?.dataset.roomId||'',text:(label?.textContent||'').replace(/\s+/g,' ').trim(),visible:Boolean(label&&!label.hidden&&style&&style.display!=='none'&&style.visibility!=='hidden'&&Number(style.opacity||1)>0.01&&rect&&rect.width>0&&rect.height>0),background:style?.backgroundImage||style?.backgroundColor||'',rect:rect?{left:rect.left,top:rect.top,width:rect.width,height:rect.height}:null};
          },wing);
          async function proxyCenter(roomId){
            return page.evaluate(id=>{
              const proxy=document.querySelector(`[data-compass-room-proxy][data-room-id="${CSS.escape(id)}"]`);
              if(!proxy) return null;
              const rect=proxy.getBoundingClientRect();
              const style=getComputedStyle(proxy);
              if(rect.width<=0||rect.height<=0||style.display==='none'||style.visibility==='hidden') return null;
              return {x:rect.left+rect.width/2,y:rect.top+rect.height/2,width:rect.width,height:rect.height};
            },roomId);
          }
          async function adaptiveDrag(targetRoom,currentRoom){
            const target=await proxyCenter(targetRoom);
            const current=await proxyCenter(currentRoom);
            if(!target||!current) return {ok:false,target,current};
            const dx=(current.x-target.x)*0.92;
            const dy=(current.y-target.y)*0.92;
            const distance=Math.hypot(dx,dy);
            if(distance<3) return {ok:false,target,current,dx,dy,distance};
            const cap=180;
            const scale=Math.min(1,cap/distance);
            const end={x:target.x+dx*scale,y:target.y+dy*scale};
            await page.mouse.move(target.x,target.y);
            await page.mouse.down();
            await page.mouse.move(end.x,end.y,{steps:12});
            await sleep(140);
            await page.mouse.up();
            await sleep(360);
            return {ok:true,target,current,end,dx,dy,distance};
          }
          async function recordForeground(wing,seen){
            const state=await inspect(wing);
            if(state.foreground&&declarationMap[state.foreground]?.wing===wing){
              const declared=declarationMap[state.foreground];
              const correct=state.visible&&state.renderedRoomId===state.foreground&&state.text===declared.label&&!/^rgb\(0, 0, 0\)$/.test(state.background||'');
              observations.push({...state,expectedLabel:declared.label,correct});
              if(correct) seen.add(state.foreground); else fail(`${state.foreground}_RENDERED_LABEL_INVALID`,{state,declared});
            }
            return state;
          }
          for(const wing of ['north','east','south','west']){
            await page.evaluate(w=>document.querySelector(`[data-compass-cardinal][data-cardinal-id="${w}"]`)?.click(),wing);
            await page.waitForFunction(w=>{const root=document.querySelector('[data-compass-root]');return root?.dataset.compassMode==='CLUSTER_OPEN'&&root?.dataset.selectedCardinal===w;},wing,{timeout:10000});
            await sleep(450);
            const expected=Object.entries(declarationMap).filter(([,v])=>v.wing===wing).map(([id])=>id);
            const seen=new Set();
            let state=await recordForeground(wing,seen);
            for(const targetRoom of expected){
              for(let attempt=0;attempt<14&&state.foreground!==targetRoom;attempt++){
                const currentRoom=state.foreground||[...seen][seen.size-1]||expected[0];
                const movement=await adaptiveDrag(targetRoom,currentRoom);
                traversal.push({wing,targetRoom,attempt,currentRoom,movement});
                if(!movement.ok){
                  const nudgeX=(attempt%2===0?1:-1)*(44+attempt*5);
                  const nudgeY=((attempt%3)-1)*32;
                  const current=await proxyCenter(currentRoom);
                  if(current){
                    await page.mouse.move(current.x,current.y);
                    await page.mouse.down();
                    await page.mouse.move(current.x+nudgeX,current.y+nudgeY,{steps:10});
                    await page.mouse.up();
                    await sleep(320);
                  }
                }
                state=await recordForeground(wing,seen);
              }
              if(state.foreground!==targetRoom){
                fail(`${targetRoom}_NOT_REACHED_BY_ADAPTIVE_POINTER_TRAVERSAL`,{wing,targetRoom,lastForeground:state.foreground});
              }
            }
            const missing=expected.filter(id=>!seen.has(id));
            if(missing.length) fail(`${wing}_FOREGROUND_STATES_MISSING`,{seen:[...seen],missing});
            await page.evaluate(()=>globalThis.DGB_COMPASS_CONTROLLER?.requestReturnToConstellation?.({source:'foreground-label-render-gate',scrollToScene:false}));
            await sleep(250);
          }
          await page.screenshot({path:'/tmp/compass-foreground-room-label-final.png',fullPage:true});
          await browser.close();
          const uniqueCorrect=new Set(observations.filter(item=>item.correct).map(item=>item.foreground));
          if(uniqueCorrect.size!==19) fail('NINETEEN_FOREGROUND_LABELS_NOT_PROVEN',{count:uniqueCorrect.size,ids:[...uniqueCorrect]});
          const receipt={schema:'COMPASS_RENDERED_FOREGROUND_ROOM_LABEL_RECEIPT_v2',candidateHead:process.env.GITHUB_SHA||null,result:failures.length?'FAIL_CLOSED':'PASS_CLOSED',provedForegroundLabels:[...uniqueCorrect].sort(),observations,traversal,failures};
          fs.writeFileSync('/tmp/compass-foreground-room-label-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          if(failures.length) process.exit(1);
          NODE
      - name: Upload runtime filtering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compass-runtime-qualification-evidence
          path: |
            /tmp/compass-runtime-qualification-receipt.json
            /tmp/compass-foreground-room-label-receipt.json
            /tmp/compass-foreground-room-label-final.png
            /tmp/compass-desktop.png
            /tmp/compass-tablet.png
            /tmp/compass-phone.png
