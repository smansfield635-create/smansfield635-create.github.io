name: Methods F12 R8B System Coordinate Atlas Contract Verify

on:
  push:
    branches:
      - agent/methods-f12-r8b-system-coordinate-atlas-contract-v1

permissions:
  contents: read

jobs:
  verify-r8b-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact terminal R8A parent and frozen boundaries
        shell: bash
        run: |
          set -euo pipefail
          ROOT="control-plane/methods-information-benchmark/f12-recursive-spatial-information-architecture-remediation-v1"
          test "$(git rev-parse HEAD^)" = "1238fb73df7554e05da7714dfd3d7668b4749485"
          test "$(git rev-parse 1238fb73df7554e05da7714dfd3d7668b4749485^{tree})" = "ce84819184c6117520bd1882bcf1b49a9b9c2ac2"
          test "$(git rev-parse HEAD:$ROOT/r8a-canonical-delivery-state-space-contract.v1.json)" = "3f593061fa3d4906c769707904108249943e3826"
          test "$(git rev-parse HEAD:$ROOT/r6-spatial-transformation-grammar-contract.v1.json)" = "6abb8d6b30fc92aa1eaff44ca7f8ec4e567b5938"
          test "$(git rev-parse HEAD:$ROOT/r7-continuity-and-accessibility-contract.v1.json)" = "475aa283c3feb2fb6520f953c0a96d94285bc214"
          test "$(git rev-parse HEAD:$ROOT/f12-r8-r12-continuation-corridor-freeze.v1.json)" = "86ea28520cc4954ab533142fc22abd0cac5a9d9e"

      - name: Verify exact terminal R8B payload blobs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="control-plane/methods-information-benchmark/f12-recursive-spatial-information-architecture-remediation-v1"
          test "$(git rev-parse HEAD:$ROOT/r8b-system-coordinate-atlas-contract.v1.json)" = "ccbe92dc0f4bcee99a34f17ef9efdfcea4329ccf"
          test "$(git rev-parse HEAD:$ROOT/r8b-system-coordinate-atlas-contract.verify.v1.mjs)" = "051e8ccdd108afada4f4a41b5ac6f570449f874f"
          node -e "JSON.parse(require('fs').readFileSync('$ROOT/r8b-system-coordinate-atlas-contract.v1.json','utf8'))"
          node --check "$ROOT/r8b-system-coordinate-atlas-contract.verify.v1.mjs"

      - name: Verify terminal R8B system coordinate atlas contract
        shell: bash
        run: |
          set -euo pipefail
          ROOT="control-plane/methods-information-benchmark/f12-recursive-spatial-information-architecture-remediation-v1"
          node "$ROOT/r8b-system-coordinate-atlas-contract.verify.v1.mjs" | tee r8b-system-coordinate-atlas-verification.json
          grep -Fq '"status": "PASS_CLOSED"' r8b-system-coordinate-atlas-verification.json
          grep -Fq '"atlas": "SYSTEM_COORDINATE_ATLAS_v1"' r8b-system-coordinate-atlas-verification.json
          grep -Fq '"manifoldStatus": "NOT_ASSUMED"' r8b-system-coordinate-atlas-verification.json
          grep -Fq '"concreteChartInstancesConstructed": false' r8b-system-coordinate-atlas-verification.json
          grep -Fq '"coordinateTransitionRuntimeConstructed": false' r8b-system-coordinate-atlas-verification.json
          grep -Fq '"r8bPassClosed": true' r8b-system-coordinate-atlas-verification.json
          grep -Fq '"r8PassClosed": false' r8b-system-coordinate-atlas-verification.json
          grep -Fq '"r9Unlock": false' r8b-system-coordinate-atlas-verification.json
          grep -Fq '"nextSubcheckpointOnPass": "R8C_TRANSFORM_PROJECTION_PRESENTATION_SEPARATION"' r8b-system-coordinate-atlas-verification.json
          grep -Fq '"r8cEligibility": "ELIGIBLE_READY_FOR_EXECUTION"' r8b-system-coordinate-atlas-verification.json
          grep -Fq '"r8dStatus": "BLOCKED_BY_R8C"' r8b-system-coordinate-atlas-verification.json

      - name: Prove exact additive R8B terminal diff scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 1238fb73df7554e05da7714dfd3d7668b4749485..HEAD | tee r8b-system-coordinate-atlas-changed-paths.txt
          test "$(wc -l < r8b-system-coordinate-atlas-changed-paths.txt)" -eq 3
          expected="$(mktemp)"
          cat > "$expected" <<'EOF'
          .github/workflows/methods-f12-r8b-system-coordinate-atlas-contract-verify.yml
          control-plane/methods-information-benchmark/f12-recursive-spatial-information-architecture-remediation-v1/r8b-system-coordinate-atlas-contract.v1.json
          control-plane/methods-information-benchmark/f12-recursive-spatial-information-architecture-remediation-v1/r8b-system-coordinate-atlas-contract.verify.v1.mjs
          EOF
          sort r8b-system-coordinate-atlas-changed-paths.txt > actual.sorted
          sort "$expected" > expected.sorted
          diff -u expected.sorted actual.sorted
          test -z "$(git diff --diff-filter=MDR --name-only 1238fb73df7554e05da7714dfd3d7668b4749485..HEAD)"

      - name: Preserve terminal R8B contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: methods-f12-r8b-system-coordinate-atlas-contract-evidence
          path: |
            control-plane/methods-information-benchmark/f12-recursive-spatial-information-architecture-remediation-v1/r8b-system-coordinate-atlas-contract.v1.json
            r8b-system-coordinate-atlas-verification.json
            r8b-system-coordinate-atlas-changed-paths.txt
