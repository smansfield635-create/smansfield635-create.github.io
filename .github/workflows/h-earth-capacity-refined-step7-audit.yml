name: H-Earth Capacity Refined Step 7 Audit

on:
  pull_request:
    branches:
      - agent/h-earth-capacity-camera-envelope-current-main-003

permissions:
  contents: read

jobs:
  execute-step7-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BASE_COMMIT: b5ae3ff2ec3b7ebd03dc0d25484892aab7927d30
      CANDIDATE_COMMIT: 1809d6d6e462b7809f24abda019f5d78135597fe
      CAPACITY_BLOB: db604fa0eef6600642b024d4e9147b1f35530715
      TARGET_PATH: showroom/globe/h-earth/capacity.js

    steps:
      - name: Checkout exact refined product commit
        uses: actions/checkout@v4
        with:
          ref: 1809d6d6e462b7809f24abda019f5d78135597fe
          fetch-depth: 0

      - name: Verify source, scope, and syntax anchors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(git hash-object "$TARGET_PATH")" = "$CAPACITY_BLOB"
          test "$(git diff --name-only "$BASE_COMMIT" "$CANDIDATE_COMMIT")" = "$TARGET_PATH"
          test "$(git rev-list --count "$BASE_COMMIT".."$CANDIDATE_COMMIT")" = "1"
          node --check showroom/globe/h-earth/capacity.js
          node --check showroom/globe/h-earth/compositor.js
          node --check showroom/globe/h-earth/renderer.js
          node --check showroom/globe/h-earth/controller.js
          node --check showroom/globe/h-earth/index.js

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser driver
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.54.1
          command -v google-chrome
          google-chrome --version

      - name: Start exact-commit route server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/h-earth-step7-server.log 2>&1 &
          echo $! > /tmp/h-earth-step7-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/showroom/globe/h-earth/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/h-earth-step7-server.log
          exit 1

      - name: Execute desktop, mobile, interaction, resize, and visual audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p step7-artifacts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright-core';

          const ROUTE_URL = 'http://127.0.0.1:4173/showroom/globe/h-earth/';
          const cases = [
            {
              id: 'desktop',
              context: {
                viewport: { width: 1440, height: 900 },
                deviceScaleFactor: 1,
                hasTouch: false,
                isMobile: false
              },
              resizedViewport: { width: 1180, height: 760 }
            },
            {
              id: 'mobile',
              context: {
                viewport: { width: 390, height: 844 },
                deviceScaleFactor: 3,
                hasTouch: true,
                isMobile: true
              },
              resizedViewport: { width: 430, height: 760 }
            }
          ];

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox', '--disable-dev-shm-usage']
          });

          const packageEvidence = {
            baseCommit: 'b5ae3ff2ec3b7ebd03dc0d25484892aab7927d30',
            candidateCommit: '1809d6d6e462b7809f24abda019f5d78135597fe',
            capacityBlob: 'db604fa0eef6600642b024d4e9147b1f35530715',
            mergeAuthority: 'WITHHELD',
            cases: []
          };

          async function capture(page) {
            return page.evaluate(async () => {
              const capacity = await import('/showroom/globe/h-earth/capacity.js?step7-audit');
              const compositor = await import('/showroom/globe/h-earth/compositor.js?step7-audit');
              const routeRoot = document.getElementById('h-earth-3d-route-root');
              const mount = document.getElementById('h-earth-3d-renderer-mount');
              const debugText = document.getElementById('h-earth-3d-debug')?.textContent ?? '';

              let debug = null;
              let debugParseError = null;
              try {
                debug = JSON.parse(debugText);
              } catch (error) {
                debugParseError = error instanceof Error ? error.message : String(error);
              }

              const callFirst = (names) => {
                for (const name of names) {
                  if (typeof compositor[name] === 'function') {
                    try {
                      return { exportName: name, value: compositor[name]() };
                    } catch (error) {
                      return {
                        exportName: name,
                        error: error instanceof Error ? error.message : String(error)
                      };
                    }
                  }
                }
                return { exportName: null, unavailable: true };
              };

              const routeReceipt = debug?.routeReceipt ?? null;
              const construct = routeReceipt?.rendererConstructReceipt ?? null;
              const nodeBudget = construct?.nodeBudgetEvaluation ?? null;
              const mountRect = mount?.getBoundingClientRect() ?? null;
              const visibleNodes = mount
                ? Array.from(mount.querySelectorAll('*')).filter((element) => {
                    const rect = element.getBoundingClientRect();
                    const style = getComputedStyle(element);
                    return (
                      rect.width > 0 &&
                      rect.height > 0 &&
                      style.display !== 'none' &&
                      style.visibility !== 'hidden' &&
                      Number(style.opacity) > 0
                    );
                  })
                : [];

              const clippedRects = mountRect
                ? visibleNodes.map((element) => {
                    const rect = element.getBoundingClientRect();
                    return {
                      left: Math.max(rect.left, mountRect.left),
                      top: Math.max(rect.top, mountRect.top),
                      right: Math.min(rect.right, mountRect.right),
                      bottom: Math.min(rect.bottom, mountRect.bottom)
                    };
                  }).filter((rect) => rect.right > rect.left && rect.bottom > rect.top)
                : [];

              const union = clippedRects.reduce((acc, rect) => ({
                left: Math.min(acc.left, rect.left),
                top: Math.min(acc.top, rect.top),
                right: Math.max(acc.right, rect.right),
                bottom: Math.max(acc.bottom, rect.bottom)
              }), {
                left: Number.POSITIVE_INFINITY,
                top: Number.POSITIVE_INFINITY,
                right: Number.NEGATIVE_INFINITY,
                bottom: Number.NEGATIVE_INFINITY
              });

              const unionWidth = Number.isFinite(union.left) ? Math.max(0, union.right - union.left) : 0;
              const unionHeight = Number.isFinite(union.top) ? Math.max(0, union.bottom - union.top) : 0;
              const mountWidth = mountRect?.width ?? 0;
              const mountHeight = mountRect?.height ?? 0;

              const transformFingerprint = visibleNodes.slice(0, 80).map((element) => {
                const style = getComputedStyle(element);
                const rect = element.getBoundingClientRect();
                return [
                  element.tagName,
                  typeof element.className === 'string' ? element.className : '',
                  style.transform,
                  rect.x.toFixed(3),
                  rect.y.toFixed(3),
                  rect.width.toFixed(3),
                  rect.height.toFixed(3)
                ].join('|');
              }).join('\n');

              const compositorEvidence = callFirst([
                'getHEarth3DCompositorState',
                'getHEarth3DCompositorSnapshot',
                'getHEarth3DCompositorOperationalReceipts',
                'getHEarth3DCompositorReceipt',
                'getHEarth3DCompositorRendererHandoff'
              ]);

              let compositorFingerprint = null;
              try {
                compositorFingerprint = JSON.stringify(compositorEvidence.value ?? compositorEvidence);
              } catch {
                compositorFingerprint = String(compositorEvidence.exportName ?? 'unavailable');
              }

              return {
                capacity: {
                  contractId: capacity.H_EARTH_3D_CAPACITY_CONTRACT_ID,
                  preflightEligible: capacity.getHEarth3DCapacityPreflight()?.eligible ?? null,
                  initialCamera: capacity.H_EARTH_3D_CAMERA_CAPACITY?.initialProjectionCandidate ?? null,
                  primitiveMaximum: capacity.H_EARTH_3D_NODE_BUDGET?.environmentPrimitives?.absoluteMaximum ?? null,
                  totalMaximum: capacity.H_EARTH_3D_NODE_BUDGET?.totalRendererOwnedNodes?.absoluteMaximum ?? null
                },
                route: {
                  documentStatus: document.getElementById('h-earth-3d-status')?.textContent ?? null,
                  routeReceiptStatus: routeReceipt?.status ?? null,
                  initialized: routeReceipt?.initialized ?? null,
                  rendererBootstrapStatus: routeReceipt?.routeStatus?.rendererBootstrapStatus ?? null,
                  rendererConstructed: construct?.constructed ?? null,
                  rendererConstructStatus: construct?.status ?? null,
                  rendererMounted: routeReceipt?.rendererMountReceipt != null,
                  rendererReleased: routeReceipt?.rendererReleaseReceipt != null,
                  debugParseError
                },
                budget: {
                  eligible: nodeBudget?.eligible ?? null,
                  status: nodeBudget?.status ?? null,
                  semanticLayerContainers: nodeBudget?.semanticLayerContainers ?? null,
                  environmentPrimitives: nodeBudget?.environmentPrimitives ?? null,
                  interactionNodes: nodeBudget?.interactionNodes ?? null,
                  totalRendererOwnedNodes: nodeBudget?.authorityEvaluation?.accounting?.totalRendererOwnedNodes ?? null,
                  issues: nodeBudget?.authorityEvaluation?.issues ?? []
                },
                dom: {
                  routeRootPresent: Boolean(routeRoot),
                  mountPresent: Boolean(mount),
                  mountChildCount: mount?.children.length ?? 0,
                  visibleNodeCount: visibleNodes.length,
                  intersectingNodeCount: clippedRects.length,
                  mountWidth,
                  mountHeight,
                  unionWidth,
                  unionHeight,
                  widthRatio: mountWidth > 0 ? unionWidth / mountWidth : 0,
                  heightRatio: mountHeight > 0 ? unionHeight / mountHeight : 0,
                  areaRatio: mountWidth > 0 && mountHeight > 0
                    ? (unionWidth * unionHeight) / (mountWidth * mountHeight)
                    : 0,
                  transformFingerprint
                },
                compositor: {
                  exportName: compositorEvidence.exportName,
                  fingerprint: compositorFingerprint
                },
                routeDataset: routeRoot ? { ...routeRoot.dataset } : null
              };
            });
          }

          for (const testCase of cases) {
            const context = await browser.newContext(testCase.context);
            const page = await context.newPage();
            const pageErrors = [];
            const consoleErrors = [];
            const failedRequests = [];

            page.on('pageerror', (error) => {
              pageErrors.push(error instanceof Error ? error.message : String(error));
            });
            page.on('console', (message) => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });
            page.on('requestfailed', (request) => {
              failedRequests.push({ url: request.url(), failure: request.failure() });
            });

            const response = await page.goto(ROUTE_URL, {
              waitUntil: 'domcontentloaded',
              timeout: 30000
            });
            assert(response?.ok() === true, `${testCase.id}: route response failed`);

            await page.waitForFunction(() => {
              const debugText = document.getElementById('h-earth-3d-debug')?.textContent ?? '';
              try {
                const debug = JSON.parse(debugText);
                return debug?.routeReceipt?.rendererMountReceipt != null;
              } catch {
                return false;
              }
            }, null, { timeout: 30000 });

            const before = await capture(page);
            await page.screenshot({
              path: `step7-artifacts/${testCase.id}-initial.png`,
              fullPage: true
            });

            assert(before.capacity.preflightEligible === true, `${testCase.id}: capacity preflight rejected`);
            assert(before.capacity.initialCamera?.position?.x === 0, `${testCase.id}: camera position x mismatch`);
            assert(before.capacity.initialCamera?.position?.y === 24, `${testCase.id}: camera position y mismatch`);
            assert(before.capacity.initialCamera?.position?.z === 64, `${testCase.id}: camera position z mismatch`);
            assert(before.capacity.initialCamera?.target?.x === 0, `${testCase.id}: camera target x mismatch`);
            assert(before.capacity.initialCamera?.target?.y === 0.5, `${testCase.id}: camera target y mismatch`);
            assert(before.capacity.initialCamera?.target?.z === -128, `${testCase.id}: camera target z mismatch`);
            assert(before.capacity.initialCamera?.nearPlane === 0.25, `${testCase.id}: near plane mismatch`);
            assert(before.capacity.initialCamera?.farPlane === 194, `${testCase.id}: far plane mismatch`);
            assert(before.route.rendererConstructed === true, `${testCase.id}: renderer construction failed`);
            assert(before.route.rendererMounted === true, `${testCase.id}: renderer mount failed`);
            assert(before.budget.eligible === true, `${testCase.id}: node budget rejected`);
            assert(before.budget.environmentPrimitives <= before.capacity.primitiveMaximum, `${testCase.id}: primitive maximum exceeded`);
            assert(before.budget.totalRendererOwnedNodes <= before.capacity.totalMaximum, `${testCase.id}: total node maximum exceeded`);
            assert(before.dom.visibleNodeCount > 0, `${testCase.id}: no visible renderer nodes`);
            assert(before.dom.widthRatio >= 0.05, `${testCase.id}: output remains horizontally sliver-sized`);
            assert(before.dom.heightRatio >= 0.05, `${testCase.id}: output remains vertically sliver-sized`);
            assert(before.dom.areaRatio >= 0.005, `${testCase.id}: output remains area-sliver-sized`);

            const mountBox = await page.locator('#h-earth-3d-renderer-mount').boundingBox();
            assert(mountBox != null, `${testCase.id}: renderer mount has no bounding box`);
            const centerX = mountBox.x + mountBox.width * 0.5;
            const centerY = mountBox.y + mountBox.height * 0.5;

            await page.mouse.move(centerX, centerY);
            await page.mouse.down({ button: 'left' });
            await page.mouse.move(centerX + 80, centerY + 35, { steps: 8 });
            await page.mouse.up({ button: 'left' });
            await page.waitForTimeout(500);
            const afterOrbit = await capture(page);

            await page.mouse.move(centerX, centerY);
            await page.mouse.down({ button: 'middle' });
            await page.mouse.move(centerX - 45, centerY + 28, { steps: 6 });
            await page.mouse.up({ button: 'middle' });
            await page.waitForTimeout(500);
            const afterPan = await capture(page);

            await page.mouse.move(centerX, centerY);
            await page.mouse.wheel(0, -360);
            await page.waitForTimeout(500);
            const afterWheel = await capture(page);

            await page.keyboard.press('ArrowRight');
            await page.waitForTimeout(400);
            const afterKeyboard = await capture(page);

            await page.keyboard.press('Home');
            await page.waitForTimeout(500);
            const afterReset = await capture(page);

            await page.setViewportSize(testCase.resizedViewport);
            await page.waitForTimeout(900);
            const afterResize = await capture(page);

            await page.screenshot({
              path: `step7-artifacts/${testCase.id}-after-interactions.png`,
              fullPage: true
            });

            const interactionFingerprints = [
              before,
              afterOrbit,
              afterPan,
              afterWheel,
              afterKeyboard,
              afterReset
            ].map((entry) => `${entry.dom.transformFingerprint}\n${entry.compositor.fingerprint}`);
            const interactionChanged = new Set(interactionFingerprints).size > 1;

            assert(interactionChanged === true, `${testCase.id}: representative interactions produced no observable state or projection change`);
            for (const [phase, evidence] of Object.entries({
              afterOrbit,
              afterPan,
              afterWheel,
              afterKeyboard,
              afterReset,
              afterResize
            })) {
              assert(evidence.route.rendererConstructed === true, `${testCase.id}/${phase}: renderer no longer constructed`);
              assert(evidence.route.rendererMounted === true, `${testCase.id}/${phase}: renderer no longer mounted`);
              assert(evidence.budget.eligible === true, `${testCase.id}/${phase}: node budget rejected`);
              assert(evidence.budget.environmentPrimitives <= evidence.capacity.primitiveMaximum, `${testCase.id}/${phase}: primitive maximum exceeded`);
              assert(evidence.budget.totalRendererOwnedNodes <= evidence.capacity.totalMaximum, `${testCase.id}/${phase}: total maximum exceeded`);
              assert(evidence.dom.visibleNodeCount > 0, `${testCase.id}/${phase}: visible output disappeared`);
            }

            assert(pageErrors.length === 0, `${testCase.id}: page errors: ${pageErrors.join(' | ')}`);
            assert(consoleErrors.length === 0, `${testCase.id}: console errors: ${consoleErrors.join(' | ')}`);
            assert(failedRequests.length === 0, `${testCase.id}: failed requests: ${JSON.stringify(failedRequests)}`);

            const caseEvidence = {
              id: testCase.id,
              navigation: { ok: response?.ok() ?? false, status: response?.status() ?? null },
              pageErrors,
              consoleErrors,
              failedRequests,
              interactionChanged,
              before,
              afterOrbit,
              afterPan,
              afterWheel,
              afterKeyboard,
              afterReset,
              afterResize
            };
            packageEvidence.cases.push(caseEvidence);
            fs.writeFileSync(
              `step7-artifacts/${testCase.id}.json`,
              JSON.stringify(caseEvidence, null, 2)
            );
            await context.close();
          }

          await browser.close();
          packageEvidence.step7Result = 'PASS_READY_FOR_STEP_8_MERGE_APPROVAL_DECISION';
          fs.writeFileSync(
            'step7-artifacts/package.json',
            JSON.stringify(packageEvidence, null, 2)
          );
          console.log(JSON.stringify({
            step7Result: packageEvidence.step7Result,
            candidateCommit: packageEvidence.candidateCommit,
            capacityBlob: packageEvidence.capacityBlob,
            cases: packageEvidence.cases.map((entry) => ({
              id: entry.id,
              primitives: entry.before.budget.environmentPrimitives,
              totalNodes: entry.before.budget.totalRendererOwnedNodes,
              widthRatio: entry.before.dom.widthRatio,
              heightRatio: entry.before.dom.heightRatio,
              areaRatio: entry.before.dom.areaRatio,
              interactionChanged: entry.interactionChanged,
              resizedPrimitives: entry.afterResize.budget.environmentPrimitives,
              resizedTotalNodes: entry.afterResize.budget.totalRendererOwnedNodes
            }))
          }, null, 2));
          NODE

      - name: Upload Step 7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-capacity-refined-step7-audit
          path: |
            step7-artifacts/
            /tmp/h-earth-step7-server.log
          if-no-files-found: error
