name: H-Earth Spatial Coherence Qualification 002
on:
  pull_request:
    types: [opened, reopened]
permissions:
  contents: read
  issues: write
jobs:
  prove:
    runs-on: ubuntu-24.04
    steps:
      - id: private-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.PRIVATE_EXECUTION_APP_ID }}
          private-key: ${{ secrets.PRIVATE_EXECUTION_APP_PRIVATE_KEY }}
          owner: smansfield635-create
          repositories: geodiametrics1
          permission-contents: read
          permission-issues: read
      - name: Recover admitted request and lock
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ steps.private-token.outputs.token }}
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/proof"; mkdir -p "$w"
          curl -fsSL -H "Authorization: Bearer $PRIVATE_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/smansfield635-create/geodiametrics1/issues/comments/5337975349 > "$w/comment.json"
          curl -fsSL -H "Authorization: Bearer $PRIVATE_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/smansfield635-create/geodiametrics1/contents/.github/operation-intake/active-operation-ledger.v1.json?ref=operation-locks%2Frepository-operation-intake-v1' > "$w/ledger-api.json"
          python - <<'PY'
          import base64,json,os
          w=os.path.join(os.environ['RUNNER_TEMP'],'proof'); c=json.load(open(w+'/comment.json')); marker='PRE_REGISTRATION_INTAKE_BRIDGE_REQUEST_V1'; env=json.loads(c['body'][len(marker):].strip()); op='H_EARTH_PLANETARY_SPATIAL_COHERENCE_SUCCESSOR_20260819_001'; api=json.load(open(w+'/ledger-api.json')); ledger=json.loads(base64.b64decode(api['content']).decode()); m=[x for x in ledger['activeScopes'].values() if x.get('operationId')==op and x.get('state')=='ADMITTED_LOCKED']; assert len(m)==1
          for n,v in [('request',env['operationRequest']),('procedure',env['constructionProcedure']),('lock',m[0])]:
            with open(w+'/'+n+'.json','w') as f: json.dump(v,f,sort_keys=True,separators=(',',':')); f.write('\n')
          print('lockGeneration',m[0].get('lockGeneration'))
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: smansfield635-create/geodiametrics1
          ref: 367f9f77c264c2eabe7398bfa1fdd0edcdbbb6ab
          token: ${{ steps.private-token.outputs.token }}
          path: private-control-plane
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: smansfield635-create/smansfield635-create.github.io
          ref: 10d046396d58c7cf7c38c7dad5121acdb8cd197d
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - id: execute
        continue-on-error: true
        shell: bash
        run: |
          node private-control-plane/tools/ai-room-transport/admitted-procedure-exact-head-qualification.v1.mjs --request "$RUNNER_TEMP/proof/request.json" --procedure "$RUNNER_TEMP/proof/procedure.json" --lock "$RUNNER_TEMP/proof/lock.json" --workspace "$GITHUB_WORKSPACE/subject" --subject-head 10d046396d58c7cf7c38c7dad5121acdb8cd197d --execution-holder H_EARTH_PLANETARY_SPATIAL_COHERENCE_PROOF_002 --output "$RUNNER_TEMP/proof/receipt.json"
      - name: Publish proof
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/proof/body.txt"
          import base64,json,os
          r=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'proof','receipt.json'))); cr=(r.get('commandResults') or [{}])[0]; out=cr.get('stdout') or (base64.b64decode(cr.get('stdoutBase64','')).decode() if cr.get('stdoutBase64') else '')
          try:n=json.loads(out)
          except:n={}
          d=n.get('diagnostics') or {}
          print('H_EARTH_PLANETARY_SPATIAL_COHERENCE_QUALIFICATION_RESULT_V1')
          for k,v in [('backendId',r.get('backendId')),('result',r.get('result')),('subjectHead',r.get('subjectHead')),('lockGeneration',r.get('lockGeneration')),('changedPathCount',len(r.get('changedPaths',[]))),('commandExitCodes',','.join(str(x.get('exitCode')) for x in r.get('commandResults',[]))),('workspaceCleanBeforeAndAfter',r.get('workspaceCleanBeforeAndAfter')),('runId',os.environ['GITHUB_RUN_ID']),('nativeOperationId',n.get('operationId')),('nativeResult',n.get('result')),('nativeIssueCount',len(n.get('issues',[])) if isinstance(n.get('issues',[]),list) else None),('localPatchChecks',d.get('localPatchChecks')),('sphericalChecks',d.get('sphericalChecks')),('fixedAnchorVertexChecks',d.get('fixedAnchorVertexChecks')),('distantGeometryIdentityChecks',d.get('distantGeometryIdentityChecks')),('r3aPacketChecks',d.get('r3aPacketChecks')),('maxSphericalDrop',d.get('maxSphericalDrop')),('maxHorizontalProjectionDelta',d.get('maxHorizontalProjectionDelta')),('maxAdjacentCameraDelta',d.get('maxAdjacentCameraDelta'))]: print(f'{k}: {v}')
          if n.get('operationId')!='H_EARTH_PLANETARY_SPATIAL_COHERENCE_SUCCESSOR_20260819_001' or n.get('result')!='PASS' or n.get('issues')!=[]: raise SystemExit('NATIVE_RECEIPT_INVALID')
          PY
          jq -n --rawfile body "$RUNNER_TEMP/proof/body.txt" '{body:$body}' > "$RUNNER_TEMP/proof/comment.json"
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/$GITHUB_REPOSITORY/issues/1396/comments --data-binary "@$RUNNER_TEMP/proof/comment.json" >/dev/null
          test "$EXECUTE_OUTCOME" = success
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h-earth-planetary-spatial-coherence-002-${{ github.run_id }}
          path: ${{ runner.temp }}/proof/receipt.json
          if-no-files-found: error
          retention-days: 90