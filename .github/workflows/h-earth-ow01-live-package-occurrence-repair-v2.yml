name: H-Earth OW01 Live Package Occurrence Repair v2

on:
  push:
    branches:
      - control-plane-delivery/h-earth-ow01-public-product-20260814-014
    paths:
      - '.github/workflows/h-earth-ow01-live-package-occurrence-repair-v2.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve repaired terrain identity
        run: |
          set -euo pipefail
          test "$(git hash-object h-earth-3d/terrain/h-earth.terrain-field.js)" = "c32431f4c0b0eff7812fca24daacac90bd4e7020"
      - name: Install additive live-package occurrence compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def rx(path,old,new):
              p=Path(path); t=p.read_text(); c=t.count(old)
              if c!=1: raise SystemExit(f'EXACT_REPLACEMENT_COUNT:{path}:{c}:{old[:100]}')
              p.write_text(t.replace(old,new))

          env='showroom/globe/h-earth/render/run8e-successor-environment.js'
          rx(env,"export function buildHEarthRun8ENeutralPackage() {","export function buildHEarthRun8ENeutralPackage({ compositionMode = 'HISTORICAL_R2_CLOSED' } = {}) {")
          rx(env,"  if (shorelinePrimitives.length !== 7) issues.push(`RUN_8E_SHORELINE_COUNT_EXPECTED_7_ACTUAL_${shorelinePrimitives.length}`);\n  if (vegetationPrimitives.length !== 27) issues.push(`RUN_8E_VEGETATION_COUNT_EXPECTED_27_ACTUAL_${vegetationPrimitives.length}`);\n  if (primitives.length !== 35) issues.push(`RUN_8E_NEUTRAL_COUNT_EXPECTED_35_ACTUAL_${primitives.length}`);",
             "  if (shorelinePrimitives.length !== 7) issues.push(`RUN_8E_SHORELINE_COUNT_EXPECTED_7_ACTUAL_${shorelinePrimitives.length}`);\n  const historicalComposition = compositionMode === 'HISTORICAL_R2_CLOSED';\n  if (!historicalComposition && compositionMode !== 'CONTENT_ADDRESSED_CURRENT_TERRAIN') issues.push('RUN_8E_COMPOSITION_MODE_INVALID');\n  if (historicalComposition && vegetationPrimitives.length !== 27) issues.push(`RUN_8E_VEGETATION_COUNT_EXPECTED_27_ACTUAL_${vegetationPrimitives.length}`);\n  if (historicalComposition && primitives.length !== 35) issues.push(`RUN_8E_NEUTRAL_COUNT_EXPECTED_35_ACTUAL_${primitives.length}`);")
          rx(env,"    contractId: H_EARTH_RUN_8E_NEUTRAL_PACKAGE_CONTRACT_ID,\n    controllingRun8EContractId: H_EARTH_RUN_8E_CONTROL_CONTRACT_ID,",
             "    contractId: H_EARTH_RUN_8E_NEUTRAL_PACKAGE_CONTRACT_ID,\n    compositionMode,\n    controllingRun8EContractId: H_EARTH_RUN_8E_CONTROL_CONTRACT_ID,")

          transfer='h-earth-3d/integration/h-earth.run8e-successor-environment-transfer.js'
          rx(transfer,"  if (neutralPackage?.terrainPrimitiveCount !== 1) issues.push('RUN_8E_TERRAIN_PRIMITIVE_COUNT_INVALID');\n  if (neutralPackage?.shorelinePrimitiveCount !== 7) issues.push('RUN_8E_SHORELINE_PRIMITIVE_COUNT_INVALID');\n  if (neutralPackage?.vegetationPrimitiveCount !== 27) issues.push('RUN_8E_VEGETATION_PRIMITIVE_COUNT_INVALID');\n  if (admittedPrimitives.length !== 35) issues.push(`RUN_8E_ADMITTED_PRIMITIVE_COUNT_EXPECTED_35_ACTUAL_${admittedPrimitives.length}`);",
             "  if (neutralPackage?.terrainPrimitiveCount !== 1) issues.push('RUN_8E_TERRAIN_PRIMITIVE_COUNT_INVALID');\n  if (neutralPackage?.shorelinePrimitiveCount !== 7) issues.push('RUN_8E_SHORELINE_PRIMITIVE_COUNT_INVALID');\n  const historicalComposition = neutralPackage?.compositionMode !== 'CONTENT_ADDRESSED_CURRENT_TERRAIN';\n  if (historicalComposition && neutralPackage?.vegetationPrimitiveCount !== 27) issues.push('RUN_8E_VEGETATION_PRIMITIVE_COUNT_INVALID');\n  if (historicalComposition && admittedPrimitives.length !== 35) issues.push(`RUN_8E_ADMITTED_PRIMITIVE_COUNT_EXPECTED_35_ACTUAL_${admittedPrimitives.length}`);\n  if (!historicalComposition && admittedPrimitives.length !== neutralPackage?.primitiveCount) issues.push('RUN_8E_CURRENT_COMPOSITION_MEMBERSHIP_COUNT_MISMATCH');")
          rx(transfer,"    neutralPackageContractId: neutralPackage.contractId,\n    transferOccurrenceId: transferOccurrenceId.trim(),",
             "    neutralPackageContractId: neutralPackage.contractId,\n    compositionMode: neutralPackage.compositionMode ?? 'HISTORICAL_R2_CLOSED',\n    transferOccurrenceId: transferOccurrenceId.trim(),")

          package='showroom/globe/h-earth/render/live-render-package.run8e-r2.js'
          rx(package,"export const H_EARTH_RUN_8E_R2_LIVE_RENDER_PACKAGE_SOURCE_FILE =\n  '/showroom/globe/h-earth/render/live-render-package.run8e-r2.js';",
             "export const H_EARTH_RUN_8E_R2_LIVE_RENDER_PACKAGE_SOURCE_FILE =\n  '/showroom/globe/h-earth/render/live-render-package.run8e-r2.js';\nexport const H_EARTH_RUN_8E_R2_HISTORICAL_OCCURRENCE_ID =\n  'H_EARTH_RUN_8E_R2_LIVE_RENDER_PACKAGE_OCCURRENCE_001';\nexport const H_EARTH_OW01_LIVE_RENDER_PACKAGE_OCCURRENCE_ID =\n  'H_EARTH_OW01_GRATITUDE_COASTAL_ENTRY_LIVE_RENDER_PACKAGE_OCCURRENCE_001';")
          rx(package,"  const neutralPackage = buildHEarthRun8ENeutralPackage();",
             "  const historicalOccurrence = packageOccurrenceId.trim() === H_EARTH_RUN_8E_R2_HISTORICAL_OCCURRENCE_ID;\n  const neutralPackage = buildHEarthRun8ENeutralPackage({\n    compositionMode: historicalOccurrence ? 'HISTORICAL_R2_CLOSED' : 'CONTENT_ADDRESSED_CURRENT_TERRAIN'\n  });")
          rx(package,"  if (packageRecord?.primitiveCount !== 35) issues.push(`R2_PRIMITIVE_COUNT_INVALID:${packageRecord?.primitiveCount}`);\n  if (packageRecord?.triangleCount !== 49040) issues.push(`R2_TRIANGLE_COUNT_INVALID:${packageRecord?.triangleCount}`);\n  if (packageRecord?.indexCount !== 147120) issues.push(`R2_INDEX_COUNT_INVALID:${packageRecord?.indexCount}`);",
             "  const historicalOccurrence = packageRecord?.packageOccurrenceId === H_EARTH_RUN_8E_R2_HISTORICAL_OCCURRENCE_ID;\n  if (historicalOccurrence) {\n    if (packageRecord?.primitiveCount !== 35) issues.push(`R2_PRIMITIVE_COUNT_INVALID:${packageRecord?.primitiveCount}`);\n    if (packageRecord?.triangleCount !== 49040) issues.push(`R2_TRIANGLE_COUNT_INVALID:${packageRecord?.triangleCount}`);\n    if (packageRecord?.indexCount !== 147120) issues.push(`R2_INDEX_COUNT_INVALID:${packageRecord?.indexCount}`);\n  } else {\n    if (!Number.isSafeInteger(packageRecord?.primitiveCount) || packageRecord.primitiveCount < 1) issues.push('LIVE_OCCURRENCE_PRIMITIVE_COUNT_INVALID');\n    if (!Number.isSafeInteger(packageRecord?.triangleCount) || packageRecord.triangleCount < 1) issues.push('LIVE_OCCURRENCE_TRIANGLE_COUNT_INVALID');\n    if (!Number.isSafeInteger(packageRecord?.indexCount) || packageRecord.indexCount !== packageRecord.triangleCount * 3) issues.push('LIVE_OCCURRENCE_INDEX_COUNT_INVALID');\n    if ((packageRecord?.roleCounts?.TERRAIN ?? 0) !== 1) issues.push('LIVE_OCCURRENCE_TERRAIN_COUNT_INVALID');\n    const roleTotal=(packageRecord?.roleCounts?.TERRAIN??0)+(packageRecord?.roleCounts?.SHORELINE??0)+(packageRecord?.roleCounts?.VEGETATION??0);\n    if (roleTotal !== packageRecord?.primitiveCount) issues.push('LIVE_OCCURRENCE_ROLE_COUNT_MISMATCH');\n  }")
          rx(package,"  if (!Object.isFrozen(packageRecord?.primitiveSpans) || packageRecord?.primitiveSpans?.length !== 35) {\n    issues.push('R2_PRIMITIVE_SPANS_INVALID');\n  }",
             "  const expectedPrimitiveSpanCount = historicalOccurrence ? 35 : packageRecord?.primitiveCount;\n  if (!Object.isFrozen(packageRecord?.primitiveSpans) || packageRecord?.primitiveSpans?.length !== expectedPrimitiveSpanCount) {\n    issues.push('R2_PRIMITIVE_SPANS_INVALID');\n  }")
          rx(package,"let cachedPackage = null;\n\nexport function getHEarthRun8ER2ImmutableLiveRenderPackage() {\n  if (!cachedPackage) cachedPackage = buildHEarthRun8ER2ImmutableLiveRenderPackage();\n  return cachedPackage;\n}\n\nexport default getHEarthRun8ER2ImmutableLiveRenderPackage;",
             "let cachedPackage = null;\nlet cachedOW01Package = null;\n\nexport function getHEarthRun8ER2ImmutableLiveRenderPackage() {\n  if (!cachedPackage) cachedPackage = buildHEarthRun8ER2ImmutableLiveRenderPackage();\n  return cachedPackage;\n}\n\nexport function getHEarthOW01LiveRenderPackageOccurrence() {\n  if (!cachedOW01Package) cachedOW01Package = buildHEarthRun8ER2ImmutableLiveRenderPackage({ packageOccurrenceId: H_EARTH_OW01_LIVE_RENDER_PACKAGE_OCCURRENCE_ID });\n  return cachedOW01Package;\n}\n\nexport default getHEarthRun8ER2ImmutableLiveRenderPackage;")

          canonical='showroom/globe/h-earth/render/live-render-package.run8e-r2.canonical.js'
          rx(canonical,"  getHEarthRun8ER2ImmutableLiveRenderPackage as getRawPackage,\n  evaluateHEarthRun8ER2ImmutableLiveRenderPackage",
             "  getHEarthRun8ER2ImmutableLiveRenderPackage as getRawPackage,\n  getHEarthOW01LiveRenderPackageOccurrence as getOW01RawPackage,\n  evaluateHEarthRun8ER2ImmutableLiveRenderPackage")
          rx(canonical,"function buildCanonicalPackage() {\n  const raw = getRawPackage();","function buildCanonicalPackage(raw = getRawPackage()) {")
          rx(canonical,"let cachedPackage = null;\n\nexport function getHEarthRun8ER2CanonicalLiveRenderPackage() {\n  if (!cachedPackage) cachedPackage = buildCanonicalPackage();\n  return cachedPackage;\n}\n\nexport default getHEarthRun8ER2CanonicalLiveRenderPackage;",
             "let cachedPackage = null;\nlet cachedOW01Package = null;\n\nexport function getHEarthRun8ER2CanonicalLiveRenderPackage() {\n  if (!cachedPackage) cachedPackage = buildCanonicalPackage();\n  return cachedPackage;\n}\n\nexport function getHEarthOW01CanonicalLiveRenderPackageOccurrence() {\n  if (!cachedOW01Package) cachedOW01Package = buildCanonicalPackage(getOW01RawPackage());\n  return cachedOW01Package;\n}\n\nexport default getHEarthRun8ER2CanonicalLiveRenderPackage;")

          r3a='showroom/globe/h-earth/render/live-renderer-contract.run8e-r3a.js'
          rx(r3a,"  getHEarthRun8ER2CanonicalLiveRenderPackage\n} from './live-render-package.run8e-r2.canonical.js';","  getHEarthOW01CanonicalLiveRenderPackageOccurrence\n} from './live-render-package.run8e-r2.canonical.js';")
          t=Path(r3a).read_text(); c=t.count('getHEarthRun8ER2CanonicalLiveRenderPackage()')
          if c!=2: raise SystemExit(f'R3A_GETTER_COUNT:{c}')
          t=t.replace('getHEarthRun8ER2CanonicalLiveRenderPackage()','getHEarthOW01CanonicalLiveRenderPackageOccurrence()')
          t=t.replace("    packageIdentity: packageRecord.packageIdentity,\n    packageContentDigest: packageRecord.contentDigest,","    packageIdentity: packageRecord.packageIdentity,\n    packageContentDigest: packageRecord.contentDigest,\n    packageOccurrenceId: packageRecord.packageOccurrenceId,")
          old="  if (packet?.packageIdentity !== 'H_EARTH_RUN_8E_R2_LIVE_RENDER_PACKAGE_9BD0B898') issues.push('R3A_PACKAGE_IDENTITY_MISMATCH');"
          new="  if (packet?.packageOccurrenceId !== 'H_EARTH_OW01_GRATITUDE_COASTAL_ENTRY_LIVE_RENDER_PACKAGE_OCCURRENCE_001') issues.push('R3A_PACKAGE_OCCURRENCE_MISMATCH');\n  if (typeof packet?.packageIdentity !== 'string' || !packet.packageIdentity.startsWith('H_EARTH_RUN_8E_R2_LIVE_RENDER_PACKAGE_')) issues.push('R3A_PACKAGE_IDENTITY_MISMATCH');"
          if t.count(old)!=1: raise SystemExit('R3A_IDENTITY_CLAUSE_MISSING')
          Path(r3a).write_text(t.replace(old,new))

          r3c='showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.js'
          rx(r3c,"import { getHEarthRun8ER2CanonicalLiveRenderPackage } from './live-render-package.run8e-r2.canonical.js';","import { getHEarthOW01CanonicalLiveRenderPackageOccurrence } from './live-render-package.run8e-r2.canonical.js';")
          rx(r3c,"const LOGICAL_ID = 'H_EARTH_RUN_8E_R2_LIVE_RENDER_PACKAGE_9BD0B898';\nconst RUNTIME_ID = LOGICAL_ID;","const RUNTIME_OCCURRENCE_ID = 'H_EARTH_OW01_GRATITUDE_COASTAL_ENTRY_LIVE_RENDER_PACKAGE_OCCURRENCE_001';")
          rx(r3c,"  const renderPackage = getHEarthRun8ER2CanonicalLiveRenderPackage();","  const renderPackage = getHEarthOW01CanonicalLiveRenderPackageOccurrence();")
          rx(r3c,"  if (renderPackage.packageIdentity !== RUNTIME_ID) {\n    throw new Error(`R3C_RUNTIME_PACKAGE_IDENTITY_MISMATCH:${renderPackage.packageIdentity}`);\n  }","  if (renderPackage.packageOccurrenceId !== RUNTIME_OCCURRENCE_ID) {\n    throw new Error(`R3C_RUNTIME_PACKAGE_OCCURRENCE_MISMATCH:${renderPackage.packageOccurrenceId}`);\n  }")
          PY
      - name: Verify new occurrence and historical strict mode
        run: |
          node --input-type=module <<'NODE'
          import { buildHEarthRun8ENeutralPackage } from './showroom/globe/h-earth/render/run8e-successor-environment.js';
          import { getHEarthOW01LiveRenderPackageOccurrence, evaluateHEarthRun8ER2ImmutableLiveRenderPackage } from './showroom/globe/h-earth/render/live-render-package.run8e-r2.js';
          import { getHEarthOW01CanonicalLiveRenderPackageOccurrence } from './showroom/globe/h-earth/render/live-render-package.run8e-r2.canonical.js';
          import { createHEarthRun8ER2DCanonicalGPUUploadViews, evaluateHEarthRun8ER2DCanonicalGPUUploadViews } from './showroom/globe/h-earth/render/gpu-upload-views.run8e-r2d.js';
          const historical=buildHEarthRun8ENeutralPackage();
          const current=buildHEarthRun8ENeutralPackage({compositionMode:'CONTENT_ADDRESSED_CURRENT_TERRAIN'});
          const raw=getHEarthOW01LiveRenderPackageOccurrence();
          const rawEval=evaluateHEarthRun8ER2ImmutableLiveRenderPackage(raw);
          const canonical=getHEarthOW01CanonicalLiveRenderPackageOccurrence();
          const canonicalEval=evaluateHEarthRun8ER2ImmutableLiveRenderPackage(canonical);
          console.log(JSON.stringify({historical:{ok:historical.ok,issues:historical.issues,primitiveCount:historical.primitiveCount,vegetationPrimitiveCount:historical.vegetationPrimitiveCount},current:{ok:current.ok,issues:current.issues,primitiveCount:current.primitiveCount,vegetationPrimitiveCount:current.vegetationPrimitiveCount},raw:{eligible:raw.eligible,issues:raw.issues,primitiveCount:raw.primitiveCount,roleCounts:raw.roleCounts},canonical:{eligible:canonical.eligible,issues:canonical.issues,occurrence:canonical.packageOccurrenceId,identity:canonical.packageIdentity,digest:canonical.contentDigest,primitiveCount:canonical.primitiveCount,roleCounts:canonical.roleCounts}},null,2));
          if(historical.ok===true) throw new Error('HISTORICAL_CLOSED_MODE_SHOULD_REJECT_CHANGED_COMPOSITION');
          if(current.ok!==true||raw.eligible!==true||rawEval.eligible!==true||canonical.eligible!==true||canonicalEval.eligible!==true) process.exit(1);
          const views=createHEarthRun8ER2DCanonicalGPUUploadViews(canonical);
          const viewsEval=evaluateHEarthRun8ER2DCanonicalGPUUploadViews(views);
          if(viewsEval.eligible!==true) { console.error(JSON.stringify(viewsEval)); process.exit(1); }
          NODE
      - name: Install browser harness
        run: |
          mkdir -p /tmp/ow01-repair
          npm --prefix /tmp/ow01-repair init -y >/dev/null
          npm --prefix /tmp/ow01-repair install playwright@1.55.0 >/dev/null
          /tmp/ow01-repair/node_modules/.bin/playwright install --with-deps chromium >/dev/null
      - name: Serve repaired candidate
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ow01-repair-server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/showroom/globe/h-earth/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/showroom/globe/h-earth/ >/dev/null
      - name: Prove live render and interaction
        run: |
          cat >/tmp/ow01-repair/verify.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const page=await browser.newPage({viewport:{width:1440,height:900},hasTouch:true});
          const errors=[]; page.on('pageerror',e=>errors.push(String(e))); page.on('console',m=>{if(m.type()==='error'&&!/favicon/i.test(m.text())) errors.push(m.text())});
          const response=await page.goto('http://127.0.0.1:4173/showroom/globe/h-earth/',{waitUntil:'domcontentloaded',timeout:120000});
          await page.waitForTimeout(8000);
          const canvases=page.locator('canvas'); const count=await canvases.count(); let best=null;
          for(let i=0;i<count;i++){const box=await canvases.nth(i).boundingBox();if(box&&(!best||box.width*box.height>best.box.width*best.box.height))best={i,box};}
          if(best){const x=best.box.x+best.box.width*.52,y=best.box.y+best.box.height*.52;await page.mouse.move(x,y);await page.mouse.down();await page.mouse.move(x+80,y-20,{steps:8});await page.mouse.up();await page.mouse.wheel(0,-240);await page.waitForTimeout(1000);}
          const state=await page.evaluate(()=>({gesture:document.querySelector('[data-gesture-used]')?.getAttribute('data-gesture-used')??null,text:document.body.innerText.slice(0,5000)}));
          await page.screenshot({path:'/tmp/ow01-repair/repaired.png'}); await browser.close();
          console.log(JSON.stringify({status:response?.status(),canvasCount:count,interaction:!!best,errors,state},null,2));
          if(response?.status()!==200||count<1||!best||errors.some(x=>/R2_GPU_VIEW_SOURCE_INVALID|R3A_PACKAGE_REJECTED|R3C_RUNTIME_PACKAGE/i.test(x))) process.exit(1);
          NODE
          cd /tmp/ow01-repair && node verify.mjs
      - name: Commit bounded compatibility repair and remove transient carriers
        run: |
          set -euo pipefail
          git rm .github/workflows/h-earth-ow01-live-package-occurrence-repair.yml .github/workflows/h-earth-ow01-live-package-occurrence-repair-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add showroom/globe/h-earth/render/run8e-successor-environment.js h-earth-3d/integration/h-earth.run8e-successor-environment-transfer.js showroom/globe/h-earth/render/live-render-package.run8e-r2.js showroom/globe/h-earth/render/live-render-package.run8e-r2.canonical.js showroom/globe/h-earth/render/live-renderer-contract.run8e-r3a.js showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.js
          git commit -m 'OW01: qualify new live-render package occurrence [skip ci]'
          git push origin HEAD:control-plane-delivery/h-earth-ow01-public-product-20260814-014
