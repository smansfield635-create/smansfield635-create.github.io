name: Compass Homepage Cinematic Startup Readiness Adjudication

on:
  push:
    branches:
      - qualification/compass-homepage-cinematic-startup-readiness-b72cc332-20260904

permissions:
  contents: read

jobs:
  adjudicate-startup-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Check out exact cinematic candidate
        uses: actions/checkout@v4
        with:
          ref: b72cc332bcaa156126eb99ae28be6eba1e9981c2
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b72cc332bcaa156126eb99ae28be6eba1e9981c2"
          grep -Fq "await final.prepare()" assets/compass/compass.orientation-cinematic.js
          grep -Fq "renderers.house.canvas.dataset.houseAssetReady==='true'" assets/compass/compass.orientation-cinematic.final.js

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install diagnostic dependency
        run: npm install --no-save --no-package-lock puppeteer-core@24.15.0

      - name: Serve exact candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/compass-startup-readiness-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/compass-startup-readiness-http.log || true
          exit 1

      - name: Time animated preparation and House readiness directly
        shell: bash
        env:
          TARGET_SHA: b72cc332bcaa156126eb99ae28be6eba1e9981c2
          RESULT_PATH: /tmp/compass-homepage-cinematic-startup-readiness.json
        run: |
          set -euo pipefail
          export CHROME_PATH="$(command -v google-chrome || command -v chrome || command -v chromium || find /opt/hostedtoolcache/setup-chrome -type f -name chrome 2>/dev/null | head -1)"
          mkdir -p .qualification
          cat >.qualification/diagnose-compass-startup.cjs <<'NODE'
          const fs=require('node:fs');
          const puppeteer=require('puppeteer-core');
          const targetSha=process.env.TARGET_SHA;
          const resultPath=process.env.RESULT_PATH;
          const url='http://127.0.0.1:4173/?compassCinematicConstruction=1';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:'new',args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            await page.setViewport({width:1440,height:1000,deviceScaleFactor:1});
            const pageErrors=[],consoleErrors=[],requestFailures=[],badResponses=[];
            page.on('pageerror',e=>pageErrors.push(String(e?.message||e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text());});
            page.on('requestfailed',r=>requestFailures.push({url:r.url(),error:r.failure()?.errorText||null}));
            page.on('response',r=>{if(r.status()>=400)badResponses.push({url:r.url(),status:r.status()});});
            await page.evaluateOnNewDocument(()=>{
              globalThis.__DGB_CINEMATIC_SETTLED=[];
              document.addEventListener('dgb:compass-orientation-cinematic-settled',event=>globalThis.__DGB_CINEMATIC_SETTLED.push(JSON.parse(JSON.stringify(event.detail))));
            });
            const startedAt=Date.now();
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>Boolean(globalThis.DGB_MAIN_ORIENTATION_CINEMATIC?.inspect),{timeout:15000});
            const navReadyAt=Date.now();
            const samples=[];
            let firstHouseCanvasAt=null,firstHouseTrueAt=null,firstHouseFalseAt=null,firstHouseErrorAt=null,firstPreparedAt=null,firstPlayingAt=null,terminalAt=null;

            async function sample(){
              return page.evaluate(()=>{
                const api=globalThis.DGB_MAIN_ORIENTATION_CINEMATIC;
                const inspect=api?.inspect?.()||null;
                const houseFrame=document.querySelector('[data-kind="house"] iframe');
                const houseCanvas=houseFrame?.contentDocument?.querySelector('canvas')||null;
                const brainFrame=document.querySelector('[data-kind="brain"] iframe');
                const brainCanvas=brainFrame?.contentDocument?.querySelector('canvas')||null;
                const trophyFrame=document.querySelector('[data-kind="trophy"] iframe');
                const trophyCanvas=trophyFrame?.contentDocument?.querySelector('canvas')||null;
                const pick=(canvas)=>canvas?Object.fromEntries([...canvas.attributes].filter(a=>a.name.startsWith('data-')).map(a=>[a.name,a.value])):null;
                return {
                  phase:inspect?.phase??null,
                  settled:Boolean(inspect?.settled),
                  restoring:Boolean(inspect?.restoring),
                  errorCode:inspect?.errorCode??null,
                  renderer:inspect?.renderer??null,
                  house:pick(houseCanvas),
                  brain:pick(brainCanvas),
                  trophy:pick(trophyCanvas),
                  settledReceipts:[...(globalThis.__DGB_CINEMATIC_SETTLED||[])]
                };
              });
            }

            const deadline=Date.now()+60000;
            while(Date.now()<deadline){
              const s=await sample();
              const elapsedMs=Date.now()-navReadyAt;
              samples.push({elapsedMs,...s});
              if(s.house&&!firstHouseCanvasAt)firstHouseCanvasAt=elapsedMs;
              if(s.house?.['data-house-asset-ready']==='true'&&!firstHouseTrueAt)firstHouseTrueAt=elapsedMs;
              if(s.house?.['data-house-asset-ready']==='false'&&!firstHouseFalseAt)firstHouseFalseAt=elapsedMs;
              if(s.house?.['data-house-error']&&!firstHouseErrorAt)firstHouseErrorAt=elapsedMs;
              if(s.renderer?.final?.prepared===true&&!firstPreparedAt)firstPreparedAt=elapsedMs;
              if(s.phase==='PLAYING'&&!firstPlayingAt)firstPlayingAt=elapsedMs;
              if((s.phase==='SETTLED'||s.settled)&&!terminalAt){terminalAt=elapsedMs;break;}
              if(firstPlayingAt){break;}
              await sleep(250);
            }
            const finalState=await sample();
            let classification='INDETERMINATE';
            if(firstPlayingAt!==null)classification=firstPlayingAt<=15000?'FINITE_WITHIN_BOUND':'FINITE_EXCESSIVE_STARTUP_LATENCY';
            else if(finalState.house?.['data-house-error']||firstHouseErrorAt!==null||finalState.errorCode)classification='EXPLICIT_PREPARATION_FAILURE';
            else if(finalState.phase==='SETTLED')classification='FAIL_OPEN_WITHOUT_HOUSE_ERROR';
            else classification='PENDING_OR_DEADLOCK_OVER_60S';
            const receipt={schema:'COMPASS_HOMEPAGE_CINEMATIC_STARTUP_READINESS_ADJUDICATION_v1',targetSha,url,classification,timing:{navigationReadyMs:navReadyAt-startedAt,firstHouseCanvasAt,firstHouseTrueAt,firstHouseFalseAt,firstHouseErrorAt,firstPreparedAt,firstPlayingAt,terminalAt,totalObservedMs:Date.now()-navReadyAt},finalState,pageErrors,consoleErrors,requestFailures,badResponses,samples};
            fs.writeFileSync(resultPath,JSON.stringify(receipt,null,2));
            console.log(JSON.stringify({...receipt,samples:`${samples.length} samples written to artifact`},null,2));
            await page.close();await browser.close();
          })().catch(error=>{const receipt={schema:'COMPASS_HOMEPAGE_CINEMATIC_STARTUP_READINESS_ADJUDICATION_v1',targetSha,status:'DIAGNOSTIC_TRANSPORT_FAIL',error:String(error?.stack||error)};try{fs.writeFileSync(resultPath,JSON.stringify(receipt,null,2));}catch{};console.error(receipt);process.exit(2);});
          NODE
          node .qualification/diagnose-compass-startup.cjs
          test -s "$RESULT_PATH"

      - name: Upload startup readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compass-homepage-cinematic-startup-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/compass-homepage-cinematic-startup-readiness.json
          if-no-files-found: error
          retention-days: 90
