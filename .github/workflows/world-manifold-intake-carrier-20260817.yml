name: World Manifold Gen306 Terminal Engineering Qualification

on:
  push:
    branches:
      - control-plane-carrier/world-manifold-intake-20260817
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CANDIDATE_HEAD: dbf2f3ec90faa59c09193e61a0d141481b68d758
      BASE_HEAD: a7b13dd5cebeafe6ce126d7df64c4088db7feb48
    steps:
      - name: Checkout frozen base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: smansfield635-create/smansfield635-create.github.io
          ref: ${{ env.BASE_HEAD }}
          path: base
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact Gen306 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: smansfield635-create/smansfield635-create.github.io
          ref: ${{ env.CANDIDATE_HEAD }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Prove old Run8B harness baseline disposition
        working-directory: base
        shell: bash
        run: |
          set +e
          node h-earth-3d/validation/h-earth.run8b.successor-neutral-geometry.harness.mjs > "$RUNNER_TEMP/base-run8b.log" 2>&1
          code=$?
          echo "BASE_RUN8B_EXIT=$code"
          cat "$RUNNER_TEMP/base-run8b.log"
          test "$code" -ne 0
          grep -q 'Run 8A predecessor must remain PASS' "$RUNNER_TEMP/base-run8b.log"
      - name: Prove old Run8E harness baseline disposition
        working-directory: base
        shell: bash
        run: |
          set +e
          node h-earth-3d/validation/h-earth.run8e.integration-engineering.harness.mjs > "$RUNNER_TEMP/base-run8e.log" 2>&1
          code=$?
          echo "BASE_RUN8E_EXIT=$code"
          cat "$RUNNER_TEMP/base-run8e.log"
          test "$code" -ne 0
          grep -q 'RUN_8E_VEGETATION_COUNT_EXPECTED_27_ACTUAL_16' "$RUNNER_TEMP/base-run8e.log"
      - name: Execute Gen306 architecture harness
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          node h-earth-3d/validation/h-earth.world-manifold-architecture.harness.mjs | tee "$RUNNER_TEMP/gen306.json"
          test "$(jq -r '.result' "$RUNNER_TEMP/gen306.json")" = 'PASS_CLOSED'
      - name: Execute complete Gen306 frame and raster path
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {
            constructHEarthRun8ESuccessorEnvironmentFrame,
            prepareHEarthRun8ERenderPlan,
            rasterizeHEarthRun8ERenderPlan,
            evaluateHEarthRun8EFrame
          } from './showroom/globe/h-earth/render/run8e-successor-environment.js';
          const camera={position:{x:0,y:18,z:42},target:{x:0,y:4,z:-150},up:{x:0,y:1,z:0},nearPlane:0.1,farPlane:4000,fieldOfViewDegrees:62};
          const viewport={width:320,height:180,pixelRatio:1};
          const frame=constructHEarthRun8ESuccessorEnvironmentFrame({camera,viewport,timeOfDayHours:15.25});
          if(frame.ok!==true) throw new Error(`FRAME:${JSON.stringify(frame.issues)}`);
          if(frame.worldFarPlane!==4000||frame.run8CPresentationFarPlane!==768||frame.presentationDistanceDecoupledFromWorldEnvelope!==true) throw new Error('PRESENTATION_DISTANCE_DECOUPLING_INVALID');
          if(!(frame.run8CPresentation?.summary?.hazeRange>0)) throw new Error(`HAZE_RANGE_NOT_POSITIVE:${frame.run8CPresentation?.summary?.hazeRange}`);
          const evalResult=evaluateHEarthRun8EFrame(frame);
          if(evalResult.eligible!==true) throw new Error(`FRAME_EVAL:${JSON.stringify(evalResult.issues)}`);
          const plan=prepareHEarthRun8ERenderPlan(frame,viewport);
          if(plan?.eligible!==true) throw new Error(`RENDER_PLAN:${JSON.stringify(plan?.issues)}`);
          const raster=rasterizeHEarthRun8ERenderPlan(plan,frame);
          if(raster?.ok!==true) throw new Error(`RASTER:${JSON.stringify(raster?.issues)}`);
          if(raster.worldManifoldRepresentationPlanExecuted!==true||raster.singlePhysicalDepthDomainExecuted!==true) throw new Error('GEN306_RENDER_EXECUTION_FLAGS_INVALID');
          console.log(JSON.stringify({frameStatus:frame.status,primitiveCount:frame.primitiveCount,topologySourceId:frame.topologySourceId,continuousWorldManifold:frame.continuousWorldManifold,worldFarPlane:frame.worldFarPlane,run8CPresentationFarPlane:frame.run8CPresentationFarPlane,hazeRange:frame.run8CPresentation.summary.hazeRange,renderPlanTriangles:plan.triangles?.length,raster:{width:raster.width,height:raster.height,skyPixelCount:raster.skyPixelCount,alphaClosed:raster.alphaClosed,singlePhysicalDepthDomainExecuted:raster.singlePhysicalDepthDomainExecuted,worldManifoldRepresentationPlanExecuted:raster.worldManifoldRepresentationPlanExecuted}}));
          NODE
      - name: Verify protected source surfaces unchanged relative to base
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            h-earth-3d/terrain/h-earth.terrain-field.js \
            h-earth-3d/control-plane/run-8/h-earth.run8a.dimensional-reconciliation.js \
            showroom/globe/h-earth/render/geometry-kernel.js \
            showroom/globe/h-earth/render/geometry-kernel.south.js \
            h-earth-3d/environment/h-earth.atmosphere-state.js \
            showroom/globe/h-earth/render/environment-atmosphere.js \
            showroom/globe/h-earth/render/lighting-material-successor-terrain.run8c.js
          do
            test "$(git -C base rev-parse HEAD:$path)" = "$(git -C candidate rev-parse HEAD:$path)"
          done
          echo PROTECTED_SOURCE_BYTES_UNCHANGED
