name: World Manifold Exact Canonical Intake Carrier

on:
  push:
    branches:
      - control-plane-carrier/world-manifold-intake-20260817
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRIVATE_REPOSITORY: smansfield635-create/geodiametrics1
      PRIVATE_HEAD: 804e2c31c10ab04a73c1cfbae883892735a62f3d
    steps:
      - name: Checkout exact public carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: carrier
          fetch-depth: 1
          persist-credentials: false

      - name: Validate frozen intake identity
        shell: bash
        run: |
          set -euo pipefail
          envelope="carrier/.github/carriers/world-manifold-intake-20260817-002.json"
          test -s "$envelope"
          test "$(jq -r '.operationRequest.operationId' "$envelope")" = 'H_EARTH_WORLD_MANIFOLD_ARCHITECTURE_INSTALLATION_20260817_002'
          test "$(jq -r '.operationRequest.exactGoverningHead' "$envelope")" = "$PRIVATE_HEAD"
          test "$(jq -r '.constructionProcedure.exactGoverningHead' "$envelope")" = "$PRIVATE_HEAD"

      - name: Mint exact private execution token
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.PRIVATE_EXECUTION_APP_ID }}
          private-key: ${{ secrets.PRIVATE_EXECUTION_APP_PRIVATE_KEY }}
          owner: smansfield635-create
          repositories: geodiametrics1
          permission-contents: write

      - name: Verify exact private governing head
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          observed="$(curl --fail-with-body --silent --show-error -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$PRIVATE_REPOSITORY/branches/main" | jq -r '.commit.sha')"
          test "$observed" = "$PRIVATE_HEAD"

      - name: Checkout exact private canonical intake implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: smansfield635-create/geodiametrics1
          ref: ${{ env.PRIVATE_HEAD }}
          token: ${{ steps.token.outputs.token }}
          path: private-control-plane
          fetch-depth: 1
          persist-credentials: false

      - name: Execute repository-owned canonical intake transform
        id: intake
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_REPOSITORY: smansfield635-create/geodiametrics1
        run: |
          set -euo pipefail
          node private-control-plane/tools/operation-intake/canonical-operation-intake-transport.v1.mjs \
            --input carrier/.github/carriers/world-manifold-intake-20260817-002.json \
            --output "$RUNNER_TEMP/intake-receipt.json"

      - name: Verify native admission
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/intake-receipt.json"
          native="$(jq -r '.canonicalReceiptJson.result // .result // ""' "$RUNNER_TEMP/intake-receipt.json")"
          generation="$(jq -r '.canonicalReceiptJson.lock.lockGeneration // .canonicalReceiptJson.lockGeneration // ""' "$RUNNER_TEMP/intake-receipt.json")"
          echo "nativeResult=$native"
          echo "lockGeneration=$generation"
          test "$native" = 'ADMITTED_AND_LOCKED'
