          retention-days: 30

      - name: Generation 2699 independent full-world boulder validator
        if: ${{ inputs.target_sha == '638b083b34d0c77908229614c57355a9a15f75d9' }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/h-earth-exact-evidence
          set +e
          timeout 240s node h-earth-3d/validation/h-earth.large-p2-boulder-presentation.v1.mjs --verify > /tmp/h-earth-exact-evidence/gen2699-large-p2-validator.stdout 2>&1
