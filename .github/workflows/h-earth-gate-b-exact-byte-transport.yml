name: H-Earth Gate B Provider Restore and Validation

on:
  pull_request:

permissions:
  contents: write

jobs:
  restore-and-validate-provider:
    if: github.head_ref == 'agent/h-earth-gate-b-phase-a-successor-001'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: agent/h-earth-gate-b-phase-a-successor-001
      PROVIDER_BLOB: 2a5b79a58ce411ed820df7ec2166f2e7b6e54b5b
      PROVIDER_PATH: showroom/globe/h-earth/render/ground-view-gate-b.js
    steps:
      - name: Check out isolated Phase A branch and full Git object graph
        uses: actions/checkout@v4
        with:
          ref: agent/h-earth-gate-b-phase-a-successor-001
          fetch-depth: 0

      - name: Restore exact historical provider blob
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${PROVIDER_BLOB}^{blob}"
          mkdir -p "$(dirname "$PROVIDER_PATH")"
          git cat-file blob "$PROVIDER_BLOB" > "$PROVIDER_PATH"
          test "$(git hash-object "$PROVIDER_PATH")" = "$PROVIDER_BLOB"

      - name: Validate environment, provider, and public kernel corridor
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const environment = await import('./showroom/globe/h-earth/environment.js');
          const provider = await import('./showroom/globe/h-earth/render/ground-view-gate-b.js');
          const kernel = await import('./showroom/globe/h-earth/render/geometry-kernel.js');

          assert.equal(
            environment.H_EARTH_GROUND_VIEW_GATE_B_ENVIRONMENT_AUTHORITY_ID,
            'H_EARTH_GROUND_VIEW_GATE_B_ENVIRONMENT_AUTHORITY_v1'
          );
          assert.equal(environment.H_EARTH_3D_ENVIRONMENT_PREFLIGHT.eligible, true);
          assert.equal(
            environment.evaluateHEarth3DSharedShorelineBoundary().eligible,
            true
          );
          assert.equal(
            environment.evaluateHEarth3DWetSandNumericConstructionProfile().eligible,
            true
          );

          assert.equal(
            provider.H_EARTH_GROUND_VIEW_GATE_B_GEOMETRY_CONTRACT_ID,
            'H_EARTH_GROUND_VIEW_GATE_B_BOUNDED_TERRAIN_WATER_GEOMETRY_PROVIDER_v1'
          );
          assert.equal(
            provider.H_EARTH_GROUND_VIEW_GATE_B_GEOMETRY_CONTRACT.environmentAuthorityId,
            environment.H_EARTH_GROUND_VIEW_GATE_B_ENVIRONMENT_AUTHORITY_ID
          );
          assert.equal(
            provider.H_EARTH_GROUND_VIEW_GATE_B_GEOMETRY_CONTRACT.admissionAuthority,
            false
          );
          assert.equal(
            provider.H_EARTH_GROUND_VIEW_GATE_B_GEOMETRY_CONTRACT.frameAuthority,
            false
          );
          assert.equal(
            provider.H_EARTH_GROUND_VIEW_GATE_B_GEOMETRY_CONTRACT.compositorAuthority,
            false
          );
          assert.equal(
            provider.H_EARTH_GROUND_VIEW_GATE_B_GEOMETRY_CONTRACT.rendererAuthority,
            false
          );
          assert.equal(
            provider.H_EARTH_GROUND_VIEW_GATE_B_GEOMETRY_CONTRACT.routeAuthority,
            false
          );

          const construction = provider.constructHEarthGroundViewGateBGeometry();
          assert.equal(construction.valid, true);
          assert.equal(
            construction.constructionStatus,
            'CONSTRUCTED_NEUTRAL_PRIMITIVES_NOT_ADMITTED'
          );
          assert.deepEqual(
            construction.primitives.map((primitive) => primitive.primitiveId),
            [
              provider.H_EARTH_GROUND_VIEW_GATE_B_PRIMITIVE_IDS.terrain,
              provider.H_EARTH_GROUND_VIEW_GATE_B_PRIMITIVE_IDS.water,
              provider.H_EARTH_GROUND_VIEW_GATE_B_PRIMITIVE_IDS.diagnosticRibbon
            ]
          );
          assert.equal(construction.receipt.neutralPrimitiveCount, 3);
          assert.equal(construction.receipt.physicalVertexCount, 2334);
          assert.equal(construction.receipt.physicalTriangleCount, 4368);
          assert.equal(construction.receipt.canonicalSeamUniqueVertexCount, 25);
          assert.equal(construction.receipt.canonicalSeamUniqueEdgeCount, 24);
          assert.equal(construction.receipt.duplicateSeamIdentityCount, 0);
          assert.equal(construction.receipt.consumerLocalSeamResourceCount, 0);
          assert.equal(construction.receipt.vertexBudgetPassed, true);
          assert.equal(construction.receipt.admissionIntegrated, false);
          assert.equal(construction.receipt.routeIntegrated, false);
          assert.equal(construction.receipt.rendererMaterialized, false);
          assert.equal(construction.receipt.runtimeClaim, false);
          assert.equal(construction.receipt.visualClaim, false);
          assert.equal(construction.receipt.mathematicsReopened, false);
          assert.equal(construction.receipt.configurationChanged, false);
          assert.equal(
            construction.receipt.configurationIdentity.geometryKernelContractId,
            kernel.H_EARTH_3D_GEOMETRY_KERNEL_PUBLIC_FACADE_CONTRACT_ID
          );

          const determinism = provider.evaluateHEarthGroundViewGateBDeterminism();
          assert.equal(determinism.passed, true);
          assert.equal(determinism.processingOrderDependency, false);

          console.log(JSON.stringify({
            environmentAuthorityId:
              environment.H_EARTH_GROUND_VIEW_GATE_B_ENVIRONMENT_AUTHORITY_ID,
            providerContractId:
              provider.H_EARTH_GROUND_VIEW_GATE_B_GEOMETRY_CONTRACT_ID,
            geometryKernelContractId:
              kernel.H_EARTH_3D_GEOMETRY_KERNEL_PUBLIC_FACADE_CONTRACT_ID,
            primitiveIds:
              construction.primitives.map((primitive) => primitive.primitiveId),
            physicalVertexCount: construction.receipt.physicalVertexCount,
            physicalTriangleCount: construction.receipt.physicalTriangleCount,
            deterministicConstructionIdentity:
              construction.receipt.deterministicConstructionIdentity,
            determinismPassed: determinism.passed
          }, null, 2));
          NODE

      - name: Commit exact provider only after validation passes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$PROVIDER_PATH")" = "$PROVIDER_BLOB"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$PROVIDER_PATH"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Restore exact Gate B geometry provider"
          git push origin "HEAD:${TARGET_BRANCH}"
