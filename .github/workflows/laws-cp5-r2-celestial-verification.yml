name: Laws CP5 R2 Celestial Verification

on:
  push:
    branches:
      - agent/laws-cp5-r2-celestial-visual-correction-001

permissions:
  contents: write

concurrency:
  group: laws-cp5-r2-solar-materialization
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact CP5-R2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/laws-cp5-r2-celestial-visual-correction-001
          fetch-depth: 0

      - name: Apply bounded solar correction
        shell: bash
        run: |
          set -euo pipefail
          base="0ff5741803926a6c218415587955aa867f93a0f7"
          test "$(git rev-parse "$base":laws/index.crystals.js)" = "43bb3659e24094074b72a45a1990bc66bd79e2be"
          test "$(git hash-object laws/index.crystals.js)" = "43bb3659e24094074b72a45a1990bc66bd79e2be"
          test "$(git hash-object laws/index.interactions.js)" = "be365cc331ee5643f916abee204d4f5f45376c04"
          printf '%s' '' | base64 -d > /tmp/cp5-r2.py
          python3 /tmp/cp5-r2.py
          node --check laws/index.crystals.js
          git diff --check -- laws/index.crystals.js
          test "$(git hash-object laws/index.interactions.js)" = "be365cc331ee5643f916abee204d4f5f45376c04"

      - name: Commit final one-file CP5-R2 state
        shell: bash
        run: |
          set -euo pipefail
          base="0ff5741803926a6c218415587955aa867f93a0f7"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/laws-cp5-r2-celestial-verification.yml
          git rm -f .github/workflows/laws-cp5-r2-solar-constructor.yml
          git rm -f verification/benchmark-tools/laws-cp5-r2-celestial-verification-v1/laws-cp5-r2-celestial-verification.mjs
          git rm -f .cp5-r2-solar-materialization-trigger
          git add laws/index.crystals.js
          test "$(git diff --cached --name-only "$base")" = "laws/index.crystals.js"
          git commit -m '[skip ci] Apply bounded Laws CP5-R2 solar visual correction'
          test "$(git diff --name-only "$base" HEAD)" = "laws/index.crystals.js"
          git push origin HEAD:agent/laws-cp5-r2-celestial-visual-correction-001
