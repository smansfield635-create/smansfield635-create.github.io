name: Temporary Methods Models Final F9 Verify
on:
  push:
    branches:
      - construction/methods-models-integrated-environment-v1
    paths:
      - 'control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/f9-integrated-environment-assembly/**'
      - '.github/workflows/temporary-methods-models-final-f9-verify.yml'
permissions:
  contents: read
concurrency:
  group: methods-models-final-f9-verify
  cancel-in-progress: true
jobs:
  verify-f9-integrated-environment-assembly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen F1 through F8 and pre-F8 tree identities
        shell: bash
        run: |
          test "$(git rev-parse HEAD:control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/f1-construction-baseline)" = "31aedf282a2e3d21dfadc362e762d6f72cc93c9c"
          test "$(git rev-parse HEAD:control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/f2-canonical-state-kernel)" = "44f10c6eab823c6fcd9e033e61d2e846629ead70"
          test "$(git rev-parse HEAD:control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/f3-resolution-and-validity-engine)" = "7aae62fe2d275081308cd9ac49e3afdb0ef15157"
          test "$(git rev-parse HEAD:control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/f4-scientific-content-binding)" = "c41d9007a60d8bf34b4f2e2e125863db46f9d088"
          test "$(git rev-parse HEAD:control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/f5-navigation-and-continuity)" = "61a9a8cb8567fd64407bfee7ceb5b96b63ff64a7"
          test "$(git rev-parse HEAD:control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/f6-depth-and-inquiry)" = "4c99ad12135c1496a57c7ade9ffc04d94ab08913"
          test "$(git rev-parse HEAD:control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/f7-interaction-and-accessibility)" = "4b237ec920eeec1eb3ac8c1bd4b32b544f606c79"
          test "$(git rev-parse HEAD:control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/f8-spatial-xyz-semantic-layer)" = "ab7a87b9428200f73bad2f468c953d0e116711c6"
          test "$(git rev-parse HEAD:control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/pre-f8-corrective-construction-v1)" = "07375924b86f4a0981eb12519735262bce315cdf"
      - name: Execute assembled F9 environment verifier
        run: |
          node control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/f9-integrated-environment-assembly/verify.v1.mjs | tee f9-verification.log
      - name: Prove exact F9 changed-path scope from F8 terminal head
        shell: bash
        run: |
          git diff --name-only fc44591931d0b62d039bfaf9517d99ba56ad1c76..HEAD > /tmp/f9-changed.txt
          cat /tmp/f9-changed.txt
          if grep -Ev '^(control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/f9-integrated-environment-assembly/|\.github/workflows/temporary-methods-models-final-f9-verify\.yml$)' /tmp/f9-changed.txt | grep -q .; then
            echo 'Unexpected non-F9 path changed'; exit 1
          fi
          if grep -Ei '(^|/)f10-|adversarial-verification|(^|/)f11-|candidate-certification|(^|/)f12-|laws/research/methods-and-models/|showroom|frontier' /tmp/f9-changed.txt | grep -v 'f9-integrated-environment-assembly' | grep -q .; then
            echo 'F10+ or public path detected'; exit 1
          fi
      - name: Classify governing main drift without rebasing
        shell: bash
        run: |
          git fetch origin main
          git diff --name-only a8ef9e4b4701bd15d09ad14c829e2f4b10f9ccfc..origin/main > /tmp/main-drift.txt
          cat /tmp/main-drift.txt
          if grep -E '^(control-plane/methods-information-benchmark/|laws/research/methods-and-models/)' /tmp/main-drift.txt | grep -q .; then
            echo 'Methods governing surface drift detected'; exit 1
          fi
          git show a8ef9e4b4701bd15d09ad14c829e2f4b10f9ccfc:.github/ai-router/router.v1.json > /tmp/router-base.json
          git show origin/main:.github/ai-router/router.v1.json > /tmp/router-main.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base=JSON.parse(fs.readFileSync('/tmp/router-base.json','utf8'));
          const main=JSON.parse(fs.readFileSync('/tmp/router-main.json','utf8'));
          const find=r=>(r.projects||[]).find(p=>p.projectId==='METHODS_INFORMATION_BENCHMARK');
          if(JSON.stringify(find(base))!==JSON.stringify(find(main))){
            console.error('Methods-specific global router drift detected');
            process.exit(1);
          }
          NODE
      - name: Preserve F9 verification log
        uses: actions/upload-artifact@v4
        with:
          name: methods-models-final-program-f9-integrated-environment-assembly-verification
          path: f9-verification.log
