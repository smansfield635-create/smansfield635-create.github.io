name: Compass Gen1526 Tablet Idle Yaw Repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'restore/compass-gen1526-exact-release-v1-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Disable automatic brain yaw on tablet class only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/compass/compass.brain-scene.js')
          s=p.read_text()
          old="const animate=()=>!constrained&&!reduce.matches&&!snap&&visible&&pageOn&&foreground(),resize=()=>"
          new="const animate=()=>!constrained&&!reduce.matches&&innerWidth>900&&!snap&&visible&&pageOn&&foreground(),resize=()=>"
          if old not in s:
              raise SystemExit('expected Gen1526 brain scheduling contract not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          grep -Fq "innerWidth>900&&!snap" assets/compass/compass.brain-scene.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/compass/compass.brain-scene.js
          git commit -m 'Suspend automatic brain yaw on tablet class'
          git push origin HEAD:${{ github.head_ref }}
