<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Stage Dashboard</title><link rel="stylesheet" href="./dashboard-v2.css"></head><body><main class="wrap"><header class="top"><div><div class="muted">CONTRACTOR JOB CONTROL</div><h1>Job Stage</h1><p class="muted">See what is done, what is owed, and what each job still needs.</p></div><div class="actions"><span id="saveState" class="muted">Saved on this device</span><button id="backupBtn" class="btn">Backup</button><button id="restoreBtn" class="btn">Restore</button><input id="restoreInput" type="file" accept="application/json,.json" hidden><button id="newBtn" class="btn primary">+ New job</button></div></header><section id="newPanel" class="panel hidden"><h3>Create a job</h3><form id="newForm" class="form"><input id="customer" required placeholder="Customer name"><input id="project" required placeholder="Project / job type"><button class="btn primary">Create job</button></form></section><section class="metrics"><div class="metric">Active jobs<b id="mJobs"></b></div><div class="metric">Need attention<b id="mAttention"></b></div><div class="metric">Approved<b id="mApproved"></b></div><div class="metric">Invoiced<b id="mInvoiced"></b></div><div class="metric">Collected<b id="mPaid"></b></div><div class="metric">Outstanding<b id="mOut"></b></div></section><section class="panel"><div class="between"><h2>Needs attention</h2><input id="search" class="search" placeholder="Search jobs"></div><div id="attention" class="attention"></div></section><section class="panel"><div class="between"><h2>Jobs</h2><div id="filters" class="filters"></div></div><div id="stage" class="stage"></div></section><section id="workspace" class="panel"><div id="jobHead"></div><nav id="tabs" class="tabs"></nav><div id="tabBody"></div></section></main><script src="./job-db-v3.js"></script><script src="./dashboard-v2.js"></script></body></html>
