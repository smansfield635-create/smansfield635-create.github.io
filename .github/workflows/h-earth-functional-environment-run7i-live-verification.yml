name: H-Earth Functional Environment Run 7I Live Verification

on:
  push:
    branches:
      - agent/h-earth-functional-environment-run7i-live-verification-001
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-run7i-main-public-route-live:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUN7I_LIVE_URL: https://smansfield635-create.github.io/showroom/globe/h-earth/
      RUN7I_MERGED_MAIN_COMMIT: 3b1f21db60b51fe1ffd627b2713c6f35b2a77f7e
    steps:
      - name: Check out Run 7I live-verification workspace
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Await deployed main public route
        run: |
          set -euo pipefail
          mkdir -p h-earth-run7i-live-artifacts
          for attempt in $(seq 1 90); do
            cache="run7i=${GITHUB_RUN_ID}-${attempt}"
            if curl --fail --silent --show-error --location \
              "${RUN7I_LIVE_URL}?${cache}" \
              -o h-earth-run7i-live-artifacts/live-index.html && \
              grep -q 'data-run7i-public-route="true"' h-earth-run7i-live-artifacts/live-index.html && \
              grep -q 'functional-landscape/environment-integration.js?v=run7i-public-route-001' h-earth-run7i-live-artifacts/live-index.html; then
              echo "Run 7I main public route observed on attempt ${attempt}."
              exit 0
            fi
            sleep 10
          done
          echo 'Run 7I main public route was not observed within the bounded polling window.'
          exit 1

      - name: Verify deployed public-route source identity
        run: |
          set -euo pipefail
          cmp --silent \
            showroom/globe/h-earth/index.html \
            h-earth-run7i-live-artifacts/live-index.html
          sha256sum \
            h-earth-run7i-live-artifacts/live-index.html \
            > h-earth-run7i-live-artifacts/live-index-sha256.txt

      - name: Install bounded Chromium dependency
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Execute live desktop and Samsung browser matrix
        run: |
          cat > h-earth-run7i-live-browser.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { chromium } from 'playwright';

          const url = process.env.RUN7I_LIVE_URL;
          const output = 'h-earth-run7i-live-artifacts';
          const configurations = [
            ['desktop-landscape', 1280, 800, false, false],
            ['samsung-mobile-portrait', 412, 915, true, true],
            ['samsung-mobile-landscape', 915, 412, true, true]
          ];
          const results = [];
          const browser = await chromium.launch({ headless: true });
          try {
            for (const [id, width, height, isMobile, hasTouch] of configurations) {
              const context = await browser.newContext({
                viewport: { width, height },
                isMobile,
                hasTouch,
                deviceScaleFactor: 1
              });
              const page = await context.newPage();
              const consoleErrors = [];
              const pageErrors = [];
              page.on('console', (message) => {
                if (message.type() === 'error') consoleErrors.push(message.text());
              });
              page.on('pageerror', (error) => pageErrors.push(error.message));

              await page.goto(`${url}?run7iLive=${Date.now()}-${id}`, {
                waitUntil: 'domcontentloaded',
                timeout: 120000
              });
              await page.waitForFunction(() =>
                window.H_EARTH_FUNCTIONAL_LANDSCAPE_RUN6F?.ready === true &&
                window.H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN7H?.ready === true &&
                document.getElementById('h-earth-functional-landscape-route')?.dataset.run7hReady === 'true' &&
                document.getElementById('h-earth-functional-landscape-route')?.dataset.run7iPublicRoute === 'true',
              null, { timeout: 120000 });

              const initial = await page.evaluate(async () => {
                await window.H_EARTH_FUNCTIONAL_LANDSCAPE_RUN6F.dispatch({ action: 'RESET' });
                await window.H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN7H.refresh();
                return {
                  run6f: window.H_EARTH_FUNCTIONAL_LANDSCAPE_RUN6F.getBrowserReceipt(),
                  run7h: window.H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN7H.getSnapshot(),
                  title: document.title,
                  publicRoute: document.getElementById('h-earth-functional-landscape-route')?.dataset.publicRoute,
                  run7iPublicRoute: document.getElementById('h-earth-functional-landscape-route')?.dataset.run7iPublicRoute,
                  gesturePrimary: document.getElementById('h-earth-3d-route-root')?.dataset.hEarthGesturePrimary,
                  returnToCompass: document.getElementById('h-earth-return-to-compass')?.getAttribute('href'),
                  diagnostics: document.getElementById('h-earth-3d-diagnostic-link')?.getAttribute('href')
                };
              });
              assert.equal(initial.run7h.ready, true);
              assert.equal(initial.run7h.receipt.eligible, true);
              assert.equal(initial.run7h.receipt.authorityCollapse, false);
              assert.equal(initial.run7h.receipt.rendererAuthorityReplaced, false);
              assert.equal(initial.run7h.receipt.cameraAuthorityReplaced, false);
              assert.equal(initial.run7h.receipt.navigationAuthorityReplaced, false);
              assert.equal(initial.title, 'H-Earth · Ground-View Matrix');
              assert.equal(initial.publicRoute, 'true');
              assert.equal(initial.run7iPublicRoute, 'true');
              assert.equal(initial.gesturePrimary, 'true');
              assert.equal(initial.returnToCompass, '/index.html');
              assert.equal(initial.diagnostics, '/showroom/globe/h-earth/diagnostic/');

              const beforeMove = initial.run6f.renderSequence;
              await page.evaluate(() =>
                window.H_EARTH_FUNCTIONAL_LANDSCAPE_RUN6F.dispatch({ action: 'MOVE_FORWARD' }));
              await page.waitForFunction((sequence) =>
                window.H_EARTH_FUNCTIONAL_LANDSCAPE_RUN6F.getBrowserReceipt().renderSequence > sequence &&
                window.H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN7H.getBrowserReceipt().renderSequence > sequence,
              beforeMove, { timeout: 120000 });

              const geographic = await page.evaluate(() =>
                window.H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN7H.runGeographicPath());
              assert.equal(geographic.length, 5);
              assert.equal(geographic.every((entry) =>
                entry.result.ok && entry.environmentReceipt.eligible), true);

              const lifecycle = await page.evaluate(() =>
                window.H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN7H.runLifecycleDistanceProof());
              assert.deepEqual(lifecycle.map((entry) => entry.state),
                ['ACTIVE_DETAIL', 'ACTIVE_REDUCED', 'SLEEPING', 'UNLOADED']);
              assert.equal(lifecycle[2].populationInstanceCount, 0);
              assert.equal(lifecycle[3].populationInstanceCount, 0);

              const final = await page.evaluate(() => {
                const ids = ['hud-surface', 'hud-water', 'hud-biome',
                  'hud-traversal', 'hud-lifecycle', 'hud-population'];
                const hud = Object.fromEntries(ids.map((fieldId) =>
                  [fieldId, document.getElementById(fieldId)?.textContent]));
                const canvas = document.getElementById('h-earth-functional-landscape-canvas');
                const pixels = canvas.getContext('2d').getImageData(
                  0, 0, canvas.width, canvas.height).data;
                let opaque = 0;
                const colors = new Set();
                const stride = Math.max(4,
                  Math.floor(pixels.length / 12000 / 4) * 4);
                for (let index = 0; index < pixels.length; index += stride) {
                  const offset = index - index % 4;
                  if (pixels[offset + 3] === 255) opaque += 1;
                  colors.add(`${pixels[offset]},${pixels[offset + 1]},${pixels[offset + 2]}`);
                }
                const root = document.getElementById('h-earth-functional-landscape-route');
                return {
                  snapshot: window.H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN7H.getSnapshot(),
                  hud,
                  hudComplete: Object.values(hud).every((value) => value && value !== '—'),
                  opaquePixelSamples: opaque,
                  sampledColorCount: colors.size,
                  run7hReady: root.dataset.run7hReady,
                  run7hError: root.dataset.run7hError,
                  run7iPublicRoute: root.dataset.run7iPublicRoute
                };
              });
              assert.equal(final.snapshot.ready, true);
              assert.equal(final.hudComplete, true);
              assert.equal(final.opaquePixelSamples > 0, true);
              assert.equal(final.sampledColorCount > 12, true);
              assert.equal(final.run7hReady, 'true');
              assert.equal(final.run7hError, 'false');
              assert.equal(final.run7iPublicRoute, 'true');
              assert.deepEqual(consoleErrors, []);
              assert.deepEqual(pageErrors, []);

              const screenshot = `live-${id}.png`;
              await page.screenshot({
                path: path.join(output, screenshot),
                fullPage: true
              });
              results.push({
                configurationId: id,
                viewport: { width, height },
                isMobile,
                hasTouch,
                geographicWaypointCount: geographic.length,
                lifecycle,
                hud: final.hud,
                run7hReceipt: final.snapshot.receipt,
                opaquePixelSamples: final.opaquePixelSamples,
                sampledColorCount: final.sampledColorCount,
                screenshot,
                consoleErrors,
                pageErrors
              });
              await context.close();
            }
          } finally {
            await browser.close();
          }

          const receipt = {
            receiptType: 'H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN_7I_MAIN_PUBLIC_ROUTE_LIVE_RECEIPT',
            eligible: true,
            status: 'RUN_7I_MAIN_PUBLIC_ROUTE_LIVE_PASS',
            mergedMainCommit: process.env.RUN7I_MERGED_MAIN_COMMIT,
            liveUrl: url,
            deployedSourceIdentityMatch: true,
            configurationCount: results.length,
            desktopExecution: 'PASS',
            samsungMobilePortraitExecution: 'PASS',
            samsungMobileLandscapeExecution: 'PASS',
            run7hIntegrationLoaded: true,
            publicShellPreserved: true,
            gestureShellPreserved: true,
            environmentTelemetryComplete: true,
            lifecycleTransitionProof: 'PASS',
            actualLiveBrowserExecution: true,
            physicalSamsungInstrumentation: false,
            results,
            issues: []
          };
          await fs.writeFile(path.join(output, 'run7i-live-receipt.json'),
            `${JSON.stringify(receipt, null, 2)}\n`, 'utf8');
          console.log(JSON.stringify(receipt, null, 2));
          NODE

          set -o pipefail
          node h-earth-run7i-live-browser.mjs \
            2>&1 | tee h-earth-run7i-live-artifacts/live-browser.log

      - name: Verify live receipt
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const receipt = JSON.parse(readFileSync(
            'h-earth-run7i-live-artifacts/run7i-live-receipt.json', 'utf8'));
          if (
            receipt.eligible !== true ||
            receipt.status !== 'RUN_7I_MAIN_PUBLIC_ROUTE_LIVE_PASS' ||
            receipt.mergedMainCommit !== process.env.RUN7I_MERGED_MAIN_COMMIT ||
            receipt.deployedSourceIdentityMatch !== true ||
            receipt.configurationCount !== 3 ||
            receipt.desktopExecution !== 'PASS' ||
            receipt.samsungMobilePortraitExecution !== 'PASS' ||
            receipt.samsungMobileLandscapeExecution !== 'PASS' ||
            receipt.run7hIntegrationLoaded !== true ||
            receipt.publicShellPreserved !== true ||
            receipt.gestureShellPreserved !== true ||
            receipt.environmentTelemetryComplete !== true ||
            receipt.lifecycleTransitionProof !== 'PASS' ||
            receipt.actualLiveBrowserExecution !== true ||
            receipt.physicalSamsungInstrumentation !== false ||
            receipt.issues.length !== 0
          ) process.exit(1);
          NODE

      - name: Upload Run 7I live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-run7i-main-public-route-live-evidence
          path: h-earth-run7i-live-artifacts
          if-no-files-found: error
          retention-days: 30
