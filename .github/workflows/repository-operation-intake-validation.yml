jobs:
  builder:
    if: github.head_ref == 'ratification/methods-spatial-database-text-first-v2-001'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify text-first v2 routes and close predecessor lock 365
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$BASE_SHA" = "$GOVERNING_MAIN"
          git merge-base --is-ancestor "$SOURCE_MERGE" "$BASE_SHA"
          test "$(git hash-object .github/ai-router/router.v1.json)" = "$EXPECTED_ROUTER_BLOB"
          test "$(git hash-object .github/ai-router/projects/methods-information-benchmark/entrypoint.v1.json)" = "$EXPECTED_ENTRYPOINT_BLOB"
          mkdir -p /tmp/builder
          node tools/repository-ai-entry-router.mjs --self-test --output /tmp/builder/router.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const expected=JSON.parse(process.env.EXPECTED_PATHS_JSON).sort();
          fs.writeFileSync('/tmp/methods-spatial-database-text-first-v2-paths.txt', expected.join('\n')+'\n');
          const entry=JSON.parse(fs.readFileSync('.github/ai-router/projects/methods-information-benchmark/entrypoint.v1.json','utf8'));
          const p=entry.procedures?.spatialDatabaseNestedTabRecomposition;
          const actual=[...(p?.exactDestinationPaths??[])].sort();
          if(expected.length!==19||JSON.stringify(actual)!==JSON.stringify(expected)||(entry.ownedPathPrefixes??[]).length)throw Error('NINETEEN_ROUTE_STATE_MISMATCH');
          if(p.interactionStateContractFingerprint!==process.env.INTERACTION_CONTRACT_FINGERPRINT)throw Error('INTERACTION_CONTRACT_FINGERPRINT_MISMATCH');
          if(![p.informationRecordsAsVisibleTabsRequired,p.textFirstInformationPageRequired,p.semanticDomTextPrimaryRequired,p.standardTextualScrollingRequired,p.exactContextualReturnRequired,p.practicalDefaultRequired,p.oneLensActiveAtATimeRequired,p.nestedTabsRequired,p.compassEquationChoreographyRequired,p.semanticAccessibilityRequired,p.reducedMotionEquivalenceRequired,p.userControlledCameraProhibited,p.gestureHeavyFirstProofProhibited].every(Boolean))throw Error('TEXT_FIRST_V2_CONTRACT_INCOMPLETE');
          if(p.webglStatus!=='OPTIONAL_SUPPORTING_NONCONTROLLING'||p.primaryInteractionMode!=='TEXT_FIRST_TAB_AND_NESTED_CONTROL_SELECTION')throw Error('TEXT_FIRST_V2_INTERACTION_MODE_MISMATCH');
          const r=JSON.parse(fs.readFileSync('/tmp/builder/router.json','utf8'));
          if(!String(r.result??'').startsWith('PASS'))throw Error('ROUTER_SELF_TEST_FAILED');
          fs.writeFileSync('/tmp/builder/route.json',JSON.stringify({result:'PASS',paths:expected,interactionContractFingerprint:p.interactionStateContractFingerprint},null,2)+'\n');
          NODE
          node tools/repository-ai-entry-router.mjs --paths-file /tmp/methods-spatial-database-text-first-v2-paths.txt
          node tools/operation-intake/repository-operation-lock-manager.v1.mjs --action close --repository "$REPOSITORY" --lock-ref "$LOCK_REF" --operation-id "$PREDECESSOR_OPERATION" --lock-scope "$PREDECESSOR_SCOPE" --lock-generation "$PREDECESSOR_GENERATION" --terminal-disposition PASS_CLOSED --output /tmp/builder/closure.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const stable=v=>Array.isArray(v)?v.map(stable):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,stable(v[k])])):v;
          const c=JSON.parse(fs.readFileSync('/tmp/builder/closure.json','utf8'));
          if(c.result!=='TERMINAL_CLOSURE_COMMITTED'||!c.lockReleased||c.lockGeneration!==365||c.scopeHash!==process.env.PREDECESSOR_SCOPE_HASH||c.terminalDisposition!=='PASS_CLOSED')throw Error('LOCK_365_CLOSURE_INVALID');
          const paths=JSON.parse(fs.readFileSync('/tmp/builder/route.json','utf8')).paths;
          const domain=stable({governingMainHead:process.env.GOVERNING_MAIN,sourceIssue:Number(process.env.SOURCE_ISSUE),sourcePr:Number(process.env.SOURCE_PR),sourceCandidateHead:process.env.SOURCE_CANDIDATE,mergeCommit:process.env.SOURCE_MERGE,routerBlob:process.env.EXPECTED_ROUTER_BLOB,entrypointBlob:process.env.EXPECTED_ENTRYPOINT_BLOB,interactionContract:{id:process.env.INTERACTION_CONTRACT_ID,fingerprint:process.env.INTERACTION_CONTRACT_FINGERPRINT,canonicalByteCount:Number(process.env.INTERACTION_CONTRACT_CANONICAL_BYTES)},registeredExactPaths:paths,predecessorLockClosure:{operationId:process.env.PREDECESSOR_OPERATION,lockScope:process.env.PREDECESSOR_SCOPE,scopeHash:process.env.PREDECESSOR_SCOPE_HASH,lockGeneration:365,terminalDisposition:'PASS_CLOSED',lockReleased:true},validation:{routerSelfTest:'PASS',routeCount:19,prefixWideOwnership:false,routerValidationRun:Number(process.env.ROUTER_VALIDATION_RUN),intakeBootstrapRun:Number(process.env.INTAKE_BOOTSTRAP_RUN),textFirstInformationPage:true,semanticDomTextPrimary:true,informationRecordsAsVisibleTabs:true,standardTextualScrolling:true,exactContextualReturn:true,webglOptionalSupportingNoncontrolling:true,userControlledCameraProhibited:true,gestureHeavyFirstProofProhibited:true},authority:{checkpoint4Executed:false,successorImplementationExecuted:false,methodsPageMutation:false,lawsMutation:false,compassMutation:false,waveMutation:false,robMutation:false,hEarthMutation:false,publicMutation:false,deployment:false,release:false,perceptualAcceptanceClaim:false,ratificationReceiptMergeAuthorized:true}});
          const fingerprint=crypto.createHash('sha256').update(JSON.stringify(domain)).digest('hex');
          fs.writeFileSync('/tmp/builder/builder.json',JSON.stringify({schema:'METHODS_SPATIAL_DATABASE_TEXT_FIRST_V2_RATIFICATION_BUILDER_RECEIPT_v1',result:'PASS',domain,fingerprint,predecessorClosureCommitSha:c.closureCommitSha},null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: methods-spatial-database-text-first-v2-ratification-builder-v1
          path: /tmp/builder/
          if-no-files-found: error
          retention-days: 90

  verifier-finalize:
    needs: builder
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BRANCH_NAME: ${{ github.head_ref }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: methods-spatial-database-text-first-v2-ratification-builder-v1
          path: /tmp/final/builder
      - name: Independently reproduce, restore workflow, and materialize ratification receipt
        run: |
          set -euo pipefail
          test "$BRANCH_NAME" = "$EXPECTED_BRANCH"
          test "$BASE_SHA" = "$GOVERNING_MAIN"
          test "$(git hash-object .github/ai-router/router.v1.json)" = "$EXPECTED_ROUTER_BLOB"
          test "$(git hash-object .github/ai-router/projects/methods-information-benchmark/entrypoint.v1.json)" = "$EXPECTED_ENTRYPOINT_BLOB"
          mkdir -p /tmp/final/output
          node tools/repository-ai-entry-router.mjs --self-test --output /tmp/final/router.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const expected=JSON.parse(process.env.EXPECTED_PATHS_JSON).sort();
          fs.writeFileSync('/tmp/methods-spatial-database-text-first-v2-paths.txt', expected.join('\n')+'\n');
          NODE
          node tools/repository-ai-entry-router.mjs --paths-file /tmp/methods-spatial-database-text-first-v2-paths.txt
          git fetch origin operation-locks/repository-operation-intake-v1
          git show origin/operation-locks/repository-operation-intake-v1:.github/operation-intake/active-operation-ledger.v1.json > /tmp/final/ledger.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const stable=v=>Array.isArray(v)?v.map(stable):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,stable(v[k])])):v;
          const expected=JSON.parse(process.env.EXPECTED_PATHS_JSON).sort();
          const entry=JSON.parse(fs.readFileSync('.github/ai-router/projects/methods-information-benchmark/entrypoint.v1.json','utf8'));
          const p=entry.procedures?.spatialDatabaseNestedTabRecomposition;
          const actual=[...(p?.exactDestinationPaths??[])].sort();
          if(expected.length!==19||JSON.stringify(actual)!==JSON.stringify(expected)||(entry.ownedPathPrefixes??[]).length)throw Error('FRESH_NINETEEN_ROUTE_STATE_MISMATCH');
          if(p.interactionStateContractFingerprint!==process.env.INTERACTION_CONTRACT_FINGERPRINT)throw Error('FRESH_INTERACTION_CONTRACT_FINGERPRINT_MISMATCH');
          if(![p.informationRecordsAsVisibleTabsRequired,p.textFirstInformationPageRequired,p.semanticDomTextPrimaryRequired,p.standardTextualScrollingRequired,p.exactContextualReturnRequired,p.practicalDefaultRequired,p.oneLensActiveAtATimeRequired,p.nestedTabsRequired,p.compassEquationChoreographyRequired,p.semanticAccessibilityRequired,p.reducedMotionEquivalenceRequired,p.userControlledCameraProhibited,p.gestureHeavyFirstProofProhibited].every(Boolean))throw Error('FRESH_TEXT_FIRST_V2_CONTRACT_INCOMPLETE');
          if(p.webglStatus!=='OPTIONAL_SUPPORTING_NONCONTROLLING'||p.primaryInteractionMode!=='TEXT_FIRST_TAB_AND_NESTED_CONTROL_SELECTION')throw Error('FRESH_TEXT_FIRST_V2_INTERACTION_MODE_MISMATCH');
          const router=JSON.parse(fs.readFileSync('/tmp/final/router.json','utf8'));
          if(!String(router.result??'').startsWith('PASS'))throw Error('FRESH_ROUTER_SELF_TEST_FAILED');
          const ledger=JSON.parse(fs.readFileSync('/tmp/final/ledger.json','utf8'));
          const terminal=(ledger.terminalHistory??[]).find(x=>x.operationId===process.env.PREDECESSOR_OPERATION&&x.lockGeneration===365);
          if(!terminal||!terminal.released||terminal.terminalDisposition!=='PASS_CLOSED'||terminal.scopeHash!==process.env.PREDECESSOR_SCOPE_HASH)throw Error('FRESH_LOCK_365_CLOSURE_MISSING');
          const domain=stable({governingMainHead:process.env.GOVERNING_MAIN,sourceIssue:Number(process.env.SOURCE_ISSUE),sourcePr:Number(process.env.SOURCE_PR),sourceCandidateHead:process.env.SOURCE_CANDIDATE,mergeCommit:process.env.SOURCE_MERGE,routerBlob:process.env.EXPECTED_ROUTER_BLOB,entrypointBlob:process.env.EXPECTED_ENTRYPOINT_BLOB,interactionContract:{id:process.env.INTERACTION_CONTRACT_ID,fingerprint:process.env.INTERACTION_CONTRACT_FINGERPRINT,canonicalByteCount:Number(process.env.INTERACTION_CONTRACT_CANONICAL_BYTES)},registeredExactPaths:expected,predecessorLockClosure:{operationId:process.env.PREDECESSOR_OPERATION,lockScope:process.env.PREDECESSOR_SCOPE,scopeHash:process.env.PREDECESSOR_SCOPE_HASH,lockGeneration:365,terminalDisposition:'PASS_CLOSED',lockReleased:true},validation:{routerSelfTest:'PASS',routeCount:19,prefixWideOwnership:false,routerValidationRun:Number(process.env.ROUTER_VALIDATION_RUN),intakeBootstrapRun:Number(process.env.INTAKE_BOOTSTRAP_RUN),textFirstInformationPage:true,semanticDomTextPrimary:true,informationRecordsAsVisibleTabs:true,standardTextualScrolling:true,exactContextualReturn:true,webglOptionalSupportingNoncontrolling:true,userControlledCameraProhibited:true,gestureHeavyFirstProofProhibited:true},authority:{checkpoint4Executed:false,successorImplementationExecuted:false,methodsPageMutation:false,lawsMutation:false,compassMutation:false,waveMutation:false,robMutation:false,hEarthMutation:false,publicMutation:false,deployment:false,release:false,perceptualAcceptanceClaim:false,ratificationReceiptMergeAuthorized:true}});
          const fingerprint=crypto.createHash('sha256').update(JSON.stringify(domain)).digest('hex');
          const builder=JSON.parse(fs.readFileSync('/tmp/final/builder/builder.json','utf8'));
          if(builder.result!=='PASS'||builder.fingerprint!==fingerprint||JSON.stringify(builder.domain)!==JSON.stringify(domain))throw Error('BUILDER_FRESH_MISMATCH');
          const receipt={schema:'METHODS_SPATIAL_DATABASE_TEXT_FIRST_V2_PERMANENT_RATIFICATION_RECEIPT_v1',status:'RATIFICATION_CANDIDATE_VERIFIED_PASS_CLOSED',governingMainHead:process.env.GOVERNING_MAIN,sourceIssue:Number(process.env.SOURCE_ISSUE),sourcePr:Number(process.env.SOURCE_PR),sourceCandidateHead:process.env.SOURCE_CANDIDATE,sourceMergeCommit:process.env.SOURCE_MERGE,sourceRouterBlob:process.env.EXPECTED_ROUTER_BLOB,sourceEntrypointBlob:process.env.EXPECTED_ENTRYPOINT_BLOB,interactionContract:{id:process.env.INTERACTION_CONTRACT_ID,fingerprint:process.env.INTERACTION_CONTRACT_FINGERPRINT,canonicalByteCount:Number(process.env.INTERACTION_CONTRACT_CANONICAL_BYTES)},registeredExactPathCount:19,prefixWideOwnership:false,textFirstSemantics:{semanticDomTextPrimary:true,informationRecordsAsVisibleTabs:true,standardTextualScrolling:true,exactContextualReturn:true,practicalDefault:true,oneLensActiveAtATime:true,nestedTabs:true,webglOptionalSupportingNoncontrolling:true,userControlledCameraProhibited:true,gestureHeavyFirstProofProhibited:true},predecessorLock:{operationId:process.env.PREDECESSOR_OPERATION,lockScope:process.env.PREDECESSOR_SCOPE,scopeHash:process.env.PREDECESSOR_SCOPE_HASH,lockGeneration:365,terminalDisposition:'PASS_CLOSED',lockReleased:true,closureCommitSha:builder.predecessorClosureCommitSha},ratificationOperation:{operationId:process.env.CURRENT_OPERATION,lockScope:process.env.CURRENT_SCOPE,scopeHash:process.env.CURRENT_SCOPE_HASH,lockGeneration:376,terminalClosureRequiredAfterCandidateCommit:true},builderFingerprint:fingerprint,freshVerifierFingerprint:fingerprint,exactNormalizedEquality:true,sourcePostMergeValidation:{routerValidationRun:Number(process.env.ROUTER_VALIDATION_RUN),intakeBootstrapRun:Number(process.env.INTAKE_BOOTSTRAP_RUN),result:'PASS'},validationWorkflowRun:Number(process.env.RUN_ID),finalCandidateScope:{changedPathCount:1,changedPath:process.env.RECEIPT_PATH,workflowRestoredToBlob:process.env.BASE_WORKFLOW_BLOB},authorityBoundaries:{checkpoint4Executed:false,successorImplementationExecuted:false,methodsPageMutation:false,lawsMutation:false,compassMutation:false,waveMutation:false,robMutation:false,hEarthMutation:false,publicOrVisualMutation:false,deploymentOrRelease:false,perceptualAcceptanceClaim:false,ratificationReceiptMergeAuthorized:true},permanentEffectCondition:'EFFECTIVE_ONLY_AFTER_THIS_RECEIPT_CANDIDATE_IS_MERGED_AND_RESULTING_MAIN_VALIDATION_PASSES'};
          const text=JSON.stringify(receipt,null,2)+'\n';
          const headers={Accept:'application/vnd.github+json',Authorization:`Bearer ${process.env.GITHUB_TOKEN}`,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};
          const api=`https://api.github.com/repos/${process.env.REPOSITORY}`;
          const request=async(url,options={},ok=[200])=>{const response=await fetch(url,{...options,headers:{...headers,...options.headers}});const raw=await response.text();let body;try{body=raw?JSON.parse(raw):null}catch{body={raw}}if(!ok.includes(response.status))throw Error(`API_${response.status}:${JSON.stringify(body)}`);return body};
          const blob=await request(`${api}/git/blobs`,{method:'POST',body:JSON.stringify({content:text,encoding:'utf-8'})},[201]);
          const base=await request(`${api}/git/commits/${process.env.HEAD_SHA}`);
          const tree=await request(`${api}/git/trees`,{method:'POST',body:JSON.stringify({base_tree:base.tree.sha,tree:[{path:process.env.RECEIPT_PATH,mode:'100644',type:'blob',sha:blob.sha},{path:'.github/workflows/repository-operation-intake-validation.yml',mode:'100644',type:'blob',sha:process.env.BASE_WORKFLOW_BLOB}]})},[201]);
          const commit=await request(`${api}/git/commits`,{method:'POST',body:JSON.stringify({message:'Ratify Methods spatial database text-first interaction contract v2',tree:tree.sha,parents:[process.env.HEAD_SHA]})},[201]);
          await request(`${api}/git/refs/heads/${encodeURIComponent(process.env.BRANCH_NAME)}`,{method:'PATCH',body:JSON.stringify({sha:commit.sha,force:false})});
          fs.writeFileSync('/tmp/final/output/permanent-ratification-receipt.json',text);
          fs.writeFileSync('/tmp/final/output/final-candidate.json',JSON.stringify({result:'PASS',candidateHead:commit.sha,receiptBlob:blob.sha,tree:tree.sha,workflowRestoredBlob:process.env.BASE_WORKFLOW_BLOB,fingerprint},null,2)+'\n');
          NODE
          node tools/operation-intake/repository-operation-lock-manager.v1.mjs --action close --repository "$REPOSITORY" --lock-ref "$LOCK_REF" --operation-id "$CURRENT_OPERATION" --lock-scope "$CURRENT_SCOPE" --lock-generation "$CURRENT_GENERATION" --terminal-disposition PASS_CLOSED --output /tmp/final/output/current-operation-closure.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('/tmp/final/output/current-operation-closure.json','utf8'));
          if(c.result!=='TERMINAL_CLOSURE_COMMITTED'||!c.lockReleased||c.lockGeneration!==376||c.scopeHash!==process.env.CURRENT_SCOPE_HASH||c.terminalDisposition!=='PASS_CLOSED')throw Error('LOCK_376_CLOSURE_INVALID');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: methods-spatial-database-text-first-v2-ratification-final-v1
          path: /tmp/final/output/
          if-no-files-found: error
          retention-days: 90
