name: H-Earth R06 C10 Prospective Candidate 003 Construction and Admission

on:
  push:
    branches:
      - control/r06-c10-prospective-candidate-003-construction-and-admission
    paths-ignore:
      - h-earth-3d/control-plane/r06-c10/candidate-admission/executions/prospective-candidate-003/**

permissions:
  contents: write

concurrency:
  group: h-earth-r06-c10-prospective-candidate-003
  cancel-in-progress: false

jobs:
  construct-and-admit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact isolated carrier head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recover exact prospectively authored operation blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION_BLOB: f24d137139935cfb78cea02e6b7cd098f63d1fef
        run: |
          set -euo pipefail
          mkdir -p .github/ai-router/carriers
          python - <<'PY'
          import base64, json, os, pathlib, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          blob=os.environ['OPERATION_BLOB']
          request=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/git/blobs/{blob}',
              headers={
                  'Authorization':f'Bearer {os.environ["GH_TOKEN"]}',
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28'
              }
          )
          with urllib.request.urlopen(request) as response:
              payload=json.load(response)
          content=base64.b64decode(payload['content'])
          path=pathlib.Path('.github/ai-router/carriers/r06-c10-prospective-candidate-003.operation.sh')
          path.write_bytes(content)
          PY
          test "$(git hash-object .github/ai-router/carriers/r06-c10-prospective-candidate-003.operation.sh)" = "$OPERATION_BLOB"
          sed -i "s#CARRIER_BRANCH='control/r06-c10-prospective-candidate-002-construction-and-admission'#CARRIER_BRANCH='control/r06-c10-prospective-candidate-003-construction-and-admission'#" .github/ai-router/carriers/r06-c10-prospective-candidate-003.operation.sh

      - name: Construct direct-main successor and execute current 28-assertion gate
        shell: bash
        run: |
          chmod +x .github/ai-router/carriers/r06-c10-prospective-candidate-003.operation.sh
          .github/ai-router/carriers/r06-c10-prospective-candidate-003.operation.sh

      - name: Upload prospective construction and admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-r06-c10-prospective-candidate-003-admission
          path: /tmp/r06-c10-prospective-candidate-003/
          if-no-files-found: error
          retention-days: 90
