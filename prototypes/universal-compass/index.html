<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ARCHCOIN Calibration Lab</title>
</head>
<body>
  <p>Preparing isolated ARCHCOIN calibration lab…</p>
  <script>
    (async () => {
      "use strict";
      const BUILD = "ARCHCOIN_ISOLATION_v1";
      const target = `./archcoin.lab.html?build=${encodeURIComponent(BUILD)}`;
      if (!("serviceWorker" in navigator)) {
        document.body.textContent = "Service worker support is required for the isolated calibration lab.";
        return;
      }
      try {
        await navigator.serviceWorker.register(`./archcoin.lab.sw.js?build=${encodeURIComponent(BUILD)}`, { scope: "./" });
        await navigator.serviceWorker.ready;
        if (!navigator.serviceWorker.controller) {
          location.reload();
          return;
        }
        location.replace(target);
      } catch (error) {
        document.body.textContent = `ARCHCOIN lab isolation failed: ${error && error.message ? error.message : String(error)}`;
      }
    })();
  </script>
</body>
</html>
