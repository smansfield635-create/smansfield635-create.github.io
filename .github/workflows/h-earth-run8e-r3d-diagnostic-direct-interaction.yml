name: H-Earth Run 8E R3D Diagnostic Direct Interaction

on:
  push:
    branches:
      - agent/h-earth-run8e-r3d-direct-interaction-no-bitmap-001
  pull_request:
    branches:
      - agent/h-earth-run8e-r3c-persistent-gpu-camera-loop-001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-run8e-r3d-diagnostic-direct-interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      H_EARTH_RUN8E_R3D_URL: http://127.0.0.1:4173/showroom/globe/h-earth/diagnostic/run8e-r3d/
      H_EARTH_RUN8E_R3D_OUTPUT: /tmp/h-earth-run8e-r3d
    steps:
      - name: Check out exact R3D event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact R3C base and protected identities
        run: |
          set -euo pipefail
          git fetch origin agent/h-earth-run8e-r3c-persistent-gpu-camera-loop-001
          test "$(git merge-base HEAD origin/agent/h-earth-run8e-r3c-persistent-gpu-camera-loop-001)" = "5c7a7eef489da94a230812eecc5e531e285b7cac"
          test "$(git hash-object showroom/globe/h-earth/render/live-render-package.run8e-r2.js)" = "1699654f39c9e183f4cfc6f75b20ba051641b763"
          test "$(git hash-object showroom/globe/h-earth/render/gpu-upload-views.run8e-r2d.js)" = "785856d7702a0e855c2672e6b8a7325ad5b3ba50"
          test "$(git hash-object showroom/globe/h-earth/functional-landscape/navigation.js)" = "8ab3446c536fc24423d5601acce232b19fa71c91"
          test "$(git hash-object showroom/globe/h-earth/render/live-renderer-contract.run8e-r3a.js)" = "4e187fc38780dfb2020482b674ac331f5a65b2c1"
          test "$(git hash-object showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.js)" = "b8b3c713d5f0b7c79808e8942ce385887589d880"
          test "$(git hash-object showroom/globe/h-earth/functional-landscape/direct-manipulation.js)" = "322ee2bfed5184acd8eac600f19abd72380b6c2b"
          test "$(git hash-object showroom/globe/h-earth/index.html)" = "b5f72fb70f59276f868a5894ee0c5e8beccc40ca"

      - name: Verify source syntax and R3D authority
        run: |
          set -euo pipefail
          node --check h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3.live-gpu-presentation-recovery.js
          node --check h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3d.diagnostic-direct-interaction.js
          node --check h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.run8e-r3d-diagnostic-direct-interaction-scope.js
          node --check h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js
          node --check h-earth-3d/validation/h-earth.run8e-r3d.diagnostic-direct-interaction.harness.mjs
          node --check showroom/globe/h-earth/render/direct-interaction.run8e-r3d.js
          node --check showroom/globe/h-earth/diagnostic/run8e-r3d/direct-interaction.js
          node -e "JSON.parse(require('fs').readFileSync('h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3d.attempt-001.failure.receipt.json','utf8'))"
          if test -f h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3d.pass-closed.receipt.json; then
            node -e "JSON.parse(require('fs').readFileSync('h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3d.pass-closed.receipt.json','utf8'))"
          fi
          if grep -En "style\.transform[[:space:]]*=|translate3d\(|createImageBitmap[[:space:]]*\(|\.drawImage[[:space:]]*\(|getContext\([\'\"]2d|successorApi|\.refresh[[:space:]]*\(" \
            showroom/globe/h-earth/render/direct-interaction.run8e-r3d.js \
            showroom/globe/h-earth/diagnostic/run8e-r3d/direct-interaction.js; then
            echo "R3D_BITMAP_OR_CPU_PREVIEW_SOURCE_DETECTED"
            exit 1
          fi
          node --input-type=module - <<'NODE'
          import { evaluateHEarthRun8ER3Control } from './h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3.live-gpu-presentation-recovery.js';
          import { evaluateHEarthRun8ER3DControl } from './h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3d.diagnostic-direct-interaction.js';
          import loader from './h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js';
          const parent = evaluateHEarthRun8ER3Control();
          const child = evaluateHEarthRun8ER3DControl();
          const dependencies = loader();
          if (!parent.eligible) throw new Error(parent.issues.join(','));
          if (!child.eligible) throw new Error(child.issues.join(','));
          if (dependencies.identityVerified !== true) throw new Error('R3D_REGISTRY_LOADER_IDENTITY_NOT_VERIFIED');
          NODE

      - name: Install bounded Chromium dependency
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Start isolated workspace server
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/h-earth-run8e-r3d-server.log 2>&1 &
          echo $! >/tmp/h-earth-run8e-r3d-server.pid
          for attempt in $(seq 1 60); do
            if curl --silent --fail "$H_EARTH_RUN8E_R3D_URL" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/h-earth-run8e-r3d-server.log
          exit 1

      - name: Execute diagnostic direct GPU interaction
        run: |
          set -o pipefail
          node h-earth-3d/validation/h-earth.run8e-r3d.diagnostic-direct-interaction.harness.mjs \
            2>&1 | tee /tmp/h-earth-run8e-r3d-harness.log

      - name: Execute automatic repository-registry preflight
        run: |
          set -euo pipefail
          git diff --name-only 5c7a7eef489da94a230812eecc5e531e285b7cac...HEAD \
            | grep -E '^(h-earth-3d/|showroom/globe/h-earth/)' \
            | sort -u > /tmp/h-earth-run8e-r3d-governed-paths.txt || true
          node --experimental-default-type=module \
            tools/h-earth-repository-registry-auto-preflight.mjs \
            --paths-file /tmp/h-earth-run8e-r3d-governed-paths.txt \
            --task "Run 8E R3D diagnostic direct interaction without bitmap preview" \
            --mutation-intent \
            --output "$H_EARTH_RUN8E_R3D_OUTPUT/h-earth.run8e-r3d.automatic-preflight.receipt.json"
          node - <<'NODE'
          const receipt = require('/tmp/h-earth-run8e-r3d/h-earth.run8e-r3d.automatic-preflight.receipt.json');
          if (receipt.finalDisposition !== 'PASS') throw new Error(`R3D_AUTOMATIC_PREFLIGHT_NOT_PASS:${receipt.finalDisposition}`);
          NODE

      - name: Verify exact scope, direct interaction, and R3E stopping boundary
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only 5c7a7eef489da94a230812eecc5e531e285b7cac...HEAD | sort \
            > "$H_EARTH_RUN8E_R3D_OUTPUT/r3d-changed-paths.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = {line.strip() for line in Path('/tmp/h-earth-run8e-r3d/r3d-changed-paths.txt').read_text().splitlines() if line.strip()}
          required = {
            '.github/workflows/h-earth-run8e-r3d-diagnostic-direct-interaction.yml',
            'h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3.live-gpu-presentation-recovery.js',
            'h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3d.diagnostic-direct-interaction.js',
            'h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.run8e-r3d-diagnostic-direct-interaction-scope.js',
            'h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js',
            'h-earth-3d/validation/h-earth.run8e-r3d.diagnostic-direct-interaction.harness.mjs',
            'h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3d.attempt-001.failure.receipt.json',
            'showroom/globe/h-earth/render/direct-interaction.run8e-r3d.js',
            'showrom/globe/h-earth/diagnostic/run8e-r3d/index.html',
            'showroom/globe/h-earth/diagnostic/run8e-r3d/direct-interaction.js'
          }
          optional = {'h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3d.pass-closed.receipt.json'}
          missing = sorted(required - paths)
          unexpected = sorted(paths - required - optional)
          if missing: raise SystemExit(f'R3D_REQUIRED_PATHS_MISSING:{missing}')
          if unexpected: raise SystemExit(f'R3D_UNEXPECTED_PATHS:{unexpected}')
          forbidden = [p for p in paths if p in {
            'showroom/globe/h-earth/index.html',
            'showroom/globe/h-earth/functional-landscape/direct-manipulation.js',
            'showroom/globe/h-earth/functional-landscape/navigation.js',
             'showroom/globe/h-earth/render/live-render-package.run8e-r2.js',
            'showroom/globe/h-earth/render/gpu-upload-views.run8e-r2d.js',
            'showroom/globe/h-earth/render/live-renderer-contract.run8e-r3a.js',
            'showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.js'
          }]
          if forbidden: raise SystemExit(f'R3D_FORBIDDEN_PATHS:{forbidden}')
          receipt = json.loads(Path('/tmp/h-earth-run8e-r3d/h-earth.run8e-r3d.diagnostic-direct-interaction.execution.receipt.json').read_text())
          if receipt['eligible'] is not True: raise SystemExit('R3D_EXECUTION_RECEIPT_NOT_ELIGIBLE')
          if receipt['status'] != 'RUN_8E_R3D_EXECUTION_PASS': raise SystemExit('R3D_EXECUTION_STATUS_INVALID')
          if receipt['distinctFrameArtifactCount'] != 5: raise SystemExit('R3D_DISTINCT_FRAME_COUNT_INVALID')
          if receipt['stoppingBoundary'] != 'STOP_BEFORE_PUBLIC_ROUTE_BRANCH_INTEGRATION_R3E':
            raise SystemExit('R3D_STOPPING_BOUNDARY_MISMATCH')
          if not all(receipt['correspondence'].values()):
            raise SystemExit('R3D_CORRESPONDENCE_AUDIT_FAILED')
          PY
          for label in initial look travel pinch wheel; do
            test -s "$H_EARTH_RUN8E_R3D_OUTPUT/h-earth.run8e-r3d.${label}-frame.png"
            file "$H_EARTH_RUN8E_R3D_OUTPUT/h-earth.run8e-r3d.${label}-frame.png" \
              | grep -q 'PNG image data, 640 x 360'
          done
          test -s "$H_EARTH_RUN8E_R3D_OUTPUT/h-earth.run8e-r3d.diagnostic-page.png"

      - name: Upload R3D direct-interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-run8e-r3d-diagnostic-direct-interaction-evidence
          path: |
            /tmp/h-earth-run8e-r3d
            /tmp/h-earth-run8e-r3d-harness.log
            /tmp/h-earth-run8e-r3d-server.log
            /tmp/h-earth-run8e-r3d-governed-paths.txt
          if-no-files-found: warn
          retention-days: 90
