name: FAP1 GC W5 Body Visual Qualification v1
on:
  pull_request:
    paths: ['.github/workflows/fap1-gc-w5-body-visual-qualification-v1.yml']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2651bcba5c1071153914e6abb722d19aa778a051
      - id: chrome
        uses: browser-actions/setup-chrome@v1
      - run: npm install --no-save --no-package-lock puppeteer-core@24.15.0
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          for a in $(seq 1 120); do curl -fsS http://127.0.0.1:4173/showroom/globe/audralia/ >/dev/null && exit 0; sleep .25; done; exit 1
      - name: Derive and capture valid W5 body-gap witnesses
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node <<'NODE'
          const puppeteer=require('puppeteer-core'),fs=require('fs');
          const delay=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:'new',args:['--no-sandbox','--ignore-gpu-blocklist','--enable-webgl','--use-gl=angle','--use-angle=swiftshader']});
            const page=await browser.newPage();await page.setViewport({width:900,height:900});const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/showroom/globe/audralia/',{waitUntil:'domcontentloaded',timeout:90000});await delay(15000);
            if(!(await page.evaluate(()=>!!window.__AUDRALIA_WEATHER_PRESENTATION_RECONCILIATION__?.renderer)))await page.evaluate(()=>import('./weather-presentation-reconciliation/app.mjs?qual=body-witness-v4'));
            await page.waitForFunction(()=>window.__AUDRALIA_WEATHER_PRESENTATION_RECONCILIATION__?.renderer,{timeout:180000});
            if(!(await page.evaluate(()=>window.__AUDRALIA_FAP1_GA_AUTHORITY__?.meteorologicalAuthority==='FAP1_ONLY')))await page.evaluate(()=>import('./weather-presentation-reconciliation/fap1-ga-authority-bootstrap.mjs?qual=body-witness-v4'));
            await page.waitForFunction(()=>window.__AUDRALIA_FAP1_GA_AUTHORITY__?.meteorologicalAuthority==='FAP1_ONLY',{timeout:60000});
            if(!(await page.evaluate(()=>window.__AUDRALIA_FAP1_W5_HANDOFF__?.authority==='BOUNDED_GB_HANDOFF_ACTIVE')))await page.evaluate(()=>import('./weather-presentation-reconciliation/fap1-w5-handoff-bootstrap.gb.mjs?qual=body-witness-v4'));
            await page.waitForFunction(()=>window.__AUDRALIA_FAP1_W5_HANDOFF__?.authority==='BOUNDED_GB_HANDOFF_ACTIVE',{timeout:60000});
            const search=await page.evaluate(async()=>{
              const S=await import('./weather-presentation-reconciliation/fap1-spatial-lod.gb.mjs?qual=witness-v4');
              const D=await import('./weather-presentation-reconciliation/fap1-gpu-weather-descriptors.mjs?qual=witness-v4');
              const W=await import('./weather-presentation-reconciliation/fap1-w5-local-density.gb.mjs?qual=witness-v4');
              const p=window.__AUDRALIA_WEATHER_PRESENTATION_RECONCILIATION__,objects=S.buildFAP1SpatialWeatherObjects({packet:D.buildFAP1GPUWeatherPacket({canonicalTimeHours:0})}),o=objects.find(x=>x.ID_i==='SOUTHEAST_DEEP_CONVECTION');
              const pc=S.PLANET_CENTER,c=o.V_i.center,r=[c[0]-pc[0],c[1]-pc[1],c[2]-pc[2]],len=Math.hypot(...r),dir=r.map(v=>v/len),angle=Math.acos(Math.max(-1,Math.min(1,dir[1]))),horiz=Math.hypot(dir[0],dir[2])||1,radius=angle*S.PLANET_RADIUS,baseU=radius*dir[0]/horiz,baseV=radius*dir[2]/horiz;
              const candidates=[];
              for(const du of [-240,-160,-80,0,80,160,240])for(const dv of [-240,-160,-80,0,80,160,240])for(const distance of [95,120,160,220,300,420,600,850])for(const pitch of [.46,.55,.68,.82])for(const yaw of [-2.4,-1.6,-.8,0,.8,1.6,2.4]){
                p.setCameraStateForTest({targetU:baseU+du,targetV:baseV+dv,distance,pitch,yaw});const cam=p.getCameraFrame(),q=S.localCoordinates(cam.eye,o),inside=q[0]*q[0]+q[1]*q[1]+q[2]*q[2]<=1,dEye=W.sampleW5LocalDensity(o,cam.eye);let max=0,min=99,occupied=0,empty=0,transitions=0,prev=null;
                for(let i=0;i<18;i++){const t=i*35,pt=[cam.eye[0]+cam.forward[0]*t,cam.eye[1]+cam.forward[1]*t,cam.eye[2]+cam.forward[2]*t],d=W.sampleW5LocalDensity(o,pt),occ=d>.0025;max=Math.max(max,d);min=Math.min(min,d);occ?occupied++:empty++;if(prev!==null&&prev!==occ)transitions++;prev=occ;}
                const state={du,dv,distance,pitch,yaw,targetU:baseU+du,targetV:baseV+dv,inside,dEye,max,min,occupied,empty,transitions,q};
                if(inside||max>.04)candidates.push(state);
              }
              const dense=[...candidates].filter(x=>x.inside&&x.dEye>.08).sort((a,b)=>b.dEye-a.dEye)[0]||null;
              const gap=[...candidates].filter(x=>x.inside&&x.dEye===0&&x.max>.04&&x.transitions>=1).sort((a,b)=>b.max-a.max||b.transitions-a.transitions)[0]||null;
              const wall=[...candidates].filter(x=>!x.inside&&x.dEye===0&&x.max>.08).sort((a,b)=>b.max-a.max)[0]||null;
              const mixed=[...candidates].filter(x=>x.transitions>=2&&x.max>.05&&x.empty>=3&&x.occupied>=3).sort((a,b)=>b.transitions-a.transitions||b.max-a.max)[0]||null;
              const brick=W.buildW5DensityBrick(o);return {baseU,baseV,weatherId:o.ID_i,brick:{bodyCount:brick.mesoBodyCount,bodies:brick.mesoBodies,interiorEmpty:brick.interiorEmptySampleFraction,gapColumns:brick.gapColumnFraction},dense,gap,wall,mixed};
            });
            fs.mkdirSync('w5-visual-evidence',{recursive:true});fs.writeFileSync('w5-visual-evidence/witnesses.json',JSON.stringify(search,null,2));console.log('WITNESSES',JSON.stringify(search,null,2));
            const stages=[['orbit',{targetU:search.baseU,targetV:search.baseV,distance:5200,pitch:.8,yaw:0}],['wall',search.wall],['dense',search.dense],['gap',search.gap],['mixed',search.mixed]].filter(x=>x[1]);const rows=[];
            for(const [name,s] of stages){const out=await page.evaluate(s=>{const p=window.__AUDRALIA_WEATHER_PRESENTATION_RECONCILIATION__;p.setCameraStateForTest({targetU:s.targetU,targetV:s.targetV,distance:s.distance,pitch:s.pitch,yaw:s.yaw});window.__AUDRALIA_FAP1_GA_AUTHORITY__.renderNow();const h=window.__AUDRALIA_FAP1_W5_HANDOFF__,rec=h.renderNow(),canvas=[...document.querySelectorAll('canvas')].find(c=>c.dataset.fap1W5LocalRaymarch==='true');let fb={nonzero:0,low:0,mid:0,high:0,total:0,meanAlpha:0};if(canvas&&canvas.style.display!=='none'){const gl=canvas.getContext('webgl2',{preserveDrawingBuffer:true});if(gl){const w=canvas.width,hh=canvas.height,pix=new Uint8Array(w*hh*4);gl.readPixels(0,0,w,hh,gl.RGBA,gl.UNSIGNED_BYTE,pix);let sum=0;fb.total=w*hh;for(let i=3;i<pix.length;i+=4){const a=pix[i];sum+=a;if(a>0)fb.nonzero++;if(a<=8)fb.low++;else if(a<=64)fb.mid++;else fb.high++;}fb.meanAlpha=sum/Math.max(1,fb.total);}}return{receipt:rec,fb};},s);await page.screenshot({path:`w5-visual-evidence/${name}.png`});rows.push({name,state:s,...out});}
            fs.writeFileSync('w5-visual-evidence/metrics.json',JSON.stringify({rows,errors},null,2));console.log('METRICS',JSON.stringify({rows,errors},null,2));
            const orbit=rows.find(x=>x.name==='orbit'),required=['wall','dense','gap'].every(n=>rows.some(x=>x.name===n)),active=rows.filter(x=>x.name!=='orbit');const checks={witnessesExist:required,macroOrbit:orbit?.receipt?.active===false&&orbit?.receipt?.macroContribution===1,persistentIdentity:active.every(x=>x.receipt?.weatherId==='SOUTHEAST_DEEP_CONVECTION'),handoffConserved:active.every(x=>Math.abs((x.receipt?.contributionSum??0)-1)<1e-6),localPixels:active.every(x=>x.fb.nonzero>0),visualContrast:active.some(x=>x.fb.high>0)&&active.some(x=>x.fb.low>0),noRuntimeErrors:errors.length===0};const pass=Object.values(checks).every(Boolean);console.log('CHECKS',JSON.stringify({checks,pass},null,2));await browser.close();if(!pass)process.exit(2);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w5-body-visual-evidence
          path: w5-visual-evidence/*
          if-no-files-found: warn
