name: Build Awards visual-first 16x9 reframe

on:
  push:
    branches:
      - agent/awards-video-visual-reframe-16x9
    paths:
      - '.github/workflows/build-awards-video-visual-reframe.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/awards-video-visual-reframe-16x9
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Analyze existing merged master
        shell: bash
        run: |
          set -euo pipefail
          SRC='showroom/globe/h-earth/awards/media/diamond-gate-h-earth-awards-18s-vivaldi.mp4'
          EVID='h-earth-3d/experience-anchor/evidence/AWARDS_VIDEO_VISUAL_REFRAME_20260815_001'
          mkdir -p "$(dirname "$EVID")"

          ffprobe -v error -show_format -show_streams -of json "$SRC" > "${EVID}.ffprobe.json"
          ffmpeg -hide_banner -i "$SRC" -vf 'cropdetect=24:16:0' -an -f null - 2> "${EVID}.cropdetect.log" || true
          ffmpeg -hide_banner -i "$SRC" -vf "select='gt(scene,0.18)',showinfo" -an -f null - 2> "${EVID}.scenes.log" || true

          python - <<'PY'
          import collections, json, re
          from pathlib import Path

          evid = Path('h-earth-3d/experience-anchor/evidence/AWARDS_VIDEO_VISUAL_REFRAME_20260815_001')
          text = Path(str(evid) + '.cropdetect.log').read_text(errors='replace')
          crops = re.findall(r'crop=(\d+):(\d+):(\d+):(\d+)', text)
          if crops:
              crop, count = collections.Counter(crops).most_common(1)[0]
              w,h,x,y = map(int,crop)
          else:
              w,h,x,y,count = 1280,720,0,0,0

          if w < 240 or h < 240:
              w,h,x,y = 1280,720,0,0

          scene_text = Path(str(evid) + '.scenes.log').read_text(errors='replace')
          scene_times = [float(v) for v in re.findall(r'pts_time:([0-9.]+)', scene_text)]
          scene_times = sorted({round(v,3) for v in scene_times})

          analysis = {
              'schema': 'AWARDS_VIDEO_VISUAL_REFRAME_ANALYSIS_v1',
              'source': 'showroom/globe/h-earth/awards/media/diamond-gate-h-earth-awards-18s-vivaldi.mp4',
              'sourceSha256': __import__('hashlib').sha256(Path('showroom/globe/h-earth/awards/media/diamond-gate-h-earth-awards-18s-vivaldi.mp4').read_bytes()).hexdigest(),
              'detectedActiveCrop': {'width': w, 'height': h, 'x': x, 'y': y, 'observations': count},
              'sceneTimesSeconds': scene_times,
              'constructionLaw': {
                  'sequenceInvariant': True,
                  'audioInvariant': True,
                  'durationInvariant': True,
                  'newFootageRequired': False,
                  'presentationGeometryOnly': True,
                  'canvas': '1920x1080',
                  'strategy': 'active visual foreground over full-bleed softened derivative of the same frame'
              }
          }
          Path(str(evid) + '.json').write_text(json.dumps(analysis, indent=2) + '\n')
          Path('/tmp/crop.env').write_text(f'CW={w}\nCH={h}\nCX={x}\nCY={y}\n')
          print(json.dumps(analysis, indent=2))
          PY

      - name: Construct 1920x1080 visual-first candidate
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/crop.env
          SRC='showroom/globe/h-earth/awards/media/diamond-gate-h-earth-awards-18s-vivaldi.mp4'
          OUT='showroom/globe/h-earth/awards/media/diamond-gate-h-earth-awards-18s-vivaldi-visual-reframe-1080p.mp4'
          EVID='h-earth-3d/experience-anchor/evidence/AWARDS_VIDEO_VISUAL_REFRAME_20260815_001'

          ffmpeg -y -hide_banner -i "$SRC" \
            -filter_complex "[0:v]crop=${CW}:${CH}:${CX}:${CY},split=2[fg0][bg0];[bg0]scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,gblur=sigma=42,eq=brightness=-0.16:saturation=0.88[bg];[fg0]scale=-2:1020[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2:format=auto[v]" \
            -map '[v]' -map 0:a? \
            -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p \
            -c:a copy -movflags +faststart -shortest "$OUT"

          ffprobe -v error -show_format -show_streams -of json "$OUT" > "${EVID}.candidate.ffprobe.json"

          ffmpeg -y -hide_banner -i "$OUT" \
            -vf "fps=2/3,scale=480:270:force_original_aspect_ratio=decrease,pad=480:270:(ow-iw)/2:(oh-ih)/2,tile=4x3" \
            -frames:v 1 -q:v 2 "${EVID}.contact-sheet.jpg"

          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          evid = Path('h-earth-3d/experience-anchor/evidence/AWARDS_VIDEO_VISUAL_REFRAME_20260815_001')
          analysis_path = Path(str(evid) + '.json')
          data = json.loads(analysis_path.read_text())
          out = Path('showroom/globe/h-earth/awards/media/diamond-gate-h-earth-awards-18s-vivaldi-visual-reframe-1080p.mp4')
          data['candidate'] = {
              'path': str(out),
              'sha256': hashlib.sha256(out.read_bytes()).hexdigest(),
              'status': 'CONSTRUCTED_PENDING_EXPERIENCE_REVIEW'
          }
          data['invariantsCheckedByConstruction'] = {
              'sameInputTimeline': True,
              'sameInputAudioStreamMappedWithoutReencoding': True,
              'noSourceShotReplacement': True,
              'noNewFootage': True,
              'noCompassMutation': True,
              'noHEarthRuntimeMutation': True
          }
          analysis_path.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Commit bounded candidate evidence and retire builder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            showroom/globe/h-earth/awards/media/diamond-gate-h-earth-awards-18s-vivaldi-visual-reframe-1080p.mp4 \
            h-earth-3d/experience-anchor/evidence/AWARDS_VIDEO_VISUAL_REFRAME_20260815_001.json \
            h-earth-3d/experience-anchor/evidence/AWARDS_VIDEO_VISUAL_REFRAME_20260815_001.ffprobe.json \
            h-earth-3d/experience-anchor/evidence/AWARDS_VIDEO_VISUAL_REFRAME_20260815_001.candidate.ffprobe.json \
            h-earth-3d/experience-anchor/evidence/AWARDS_VIDEO_VISUAL_REFRAME_20260815_001.cropdetect.log \
            h-earth-3d/experience-anchor/evidence/AWARDS_VIDEO_VISUAL_REFRAME_20260815_001.scenes.log \
            h-earth-3d/experience-anchor/evidence/AWARDS_VIDEO_VISUAL_REFRAME_20260815_001.contact-sheet.jpg
          git rm .github/workflows/build-awards-video-visual-reframe.yml
          git commit -m 'Construct Awards visual-first 16:9 reframe candidate'
          git push origin HEAD:agent/awards-video-visual-reframe-16x9

# armed-after-install
