name: Laws CP6 final detail synchronization

on:
  push:
    branches:
      - agent/laws-complete-renewal-batch-001
    paths:
      - .github/workflows/laws-complete-renewal-batch-materialize.yml
      - scripts/laws_cp6_final_sync_apply.py

permissions:
  contents: write

concurrency:
  group: laws-cp6-final-detail-synchronization
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact recovered batch branch
        uses: actions/checkout@v4
        with:
          ref: agent/laws-complete-renewal-batch-001
          fetch-depth: 0

      - name: Apply exact non-generating CP6 deltas
        run: python3 scripts/laws_cp6_final_sync_apply.py

      - name: Remove one-shot carrier
        run: |
          rm .github/workflows/laws-complete-renewal-batch-materialize.yml
          rm scripts/laws_cp6_final_sync_apply.py

      - name: Verify exact mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/laws-complete-renewal-batch-materialize.yml',
              'assets/laws-destination/renewal.js',
              'laws/categories/flow/signals/index.html',
              'laws/categories/reality/measure.html',
              'laws/control-plane/renewal/laws-complete-renewal-batch-materialization-receipt-v1.json',
              'laws/index.html',
              'laws/test/reverse-audit/index.html',
              'scripts/laws_cp6_final_sync_apply.py',
          }
          observed = {
              line[3:]
              for line in subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
              if line.strip()
          }
          if observed != expected:
              raise SystemExit(f'CP6_FINAL_SYNC_SCOPE_DRIFT: expected={sorted(expected)} observed={sorted(observed)}')
          PY
          grep -F 'collapsePanels(buttons, panels)' assets/laws-destination/renewal.js
          grep -F 'setupCollapsibleNavigation' assets/laws-destination/renewal.js
          grep -F 'within the next 20 cycles' laws/categories/flow/signals/index.html
          grep -F 'within the next 20 cycles' laws/categories/reality/measure.html
          grep -F '1,653 final-test cycle records from three held-out cells' laws/test/reverse-audit/index.html
          grep -F 'lr-battery-landing' laws/index.html

      - name: Commit exact synchronized candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete CP6 final detail synchronization [skip ci]'
          git push origin HEAD:agent/laws-complete-renewal-batch-001
