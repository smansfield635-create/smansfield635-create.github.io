name: H-Earth OW04 Exact Candidate Anchor Evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  capture-ow04-anchor-evidence:
    if: ${{ github.head_ref == 'control-plane-delivery/h-earth-ow04-subtropical-world-continuation-20260815' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start exact candidate server
        run: |
          python3 -m http.server 4189 --bind 127.0.0.1 > /tmp/ow04-server.log 2>&1 &
          for attempt in $(seq 1 90); do
            curl -fsS http://127.0.0.1:4189/showroom/globe/h-earth/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/ow04-server.log
          exit 1
      - name: Capture hashes, desktop, mobile, and interaction evidence
        env:
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p /tmp/ow04-anchor-evidence
          cat > .tmp-ow04-capture.mjs <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { chromium } from 'playwright';
          const sha = (p) => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const productFiles = [
            'showroom/globe/h-earth/render/functional-landscape-frame.js',
            'showroom/globe/h-earth/render/geometry-distant-context.js',
            'showroom/globe/h-earth/render/geometry-landscape.js'
          ];
          const browser = await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--disable-dev-shm-usage','--no-sandbox']});
          const results=[];
          try {
            for (const cfg of [
              {id:'desktop',viewport:{width:1440,height:960},isMobile:false,hasTouch:false},
              {id:'mobile',viewport:{width:430,height:860},isMobile:true,hasTouch:true}
            ]) {
              const context=await browser.newContext({viewport:cfg.viewport,isMobile:cfg.isMobile,hasTouch:cfg.hasTouch,deviceScaleFactor:1});
              const page=await context.newPage();
              const pageErrors=[],consoleErrors=[],httpErrors=[];
              page.on('pageerror',e=>pageErrors.push(e.message));
              page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
              page.on('response',r=>{if(r.status()>=400&&r.url().startsWith('http://127.0.0.1:4189'))httpErrors.push({status:r.status(),url:r.url()})});
              const response=await page.goto('http://127.0.0.1:4189/showroom/globe/h-earth/?ow04-anchor=1',{waitUntil:'domcontentloaded',timeout:120000});
              await page.locator('#h-earth-functional-landscape-canvas').waitFor({state:'visible',timeout:60000});
              await page.waitForFunction(()=>document.getElementById('h-earth-functional-landscape-route')?.dataset.run8eReady==='true'||(document.getElementById('h-earth-startup-result')?.textContent||'').includes('PASS'),null,{timeout:180000});
              await page.waitForTimeout(1000);
              const canvas=page.locator('#h-earth-functional-landscape-canvas');
              const before=crypto.createHash('sha256').update(await canvas.screenshot({type:'png'})).digest('hex');
              const box=await canvas.boundingBox();
              if(!cfg.isMobile){
                const cx=box.x+box.width*.5,cy=box.y+box.height*.5;
                await page.mouse.move(cx,cy);await page.mouse.down();await page.mouse.move(cx+120,cy+45,{steps:10});await page.mouse.up();await page.mouse.wheel(0,-360);await page.waitForTimeout(700);
              } else {
                const client=await context.newCDPSession(page);await client.send('Emulation.setTouchEmulationEnabled',{enabled:true,maxTouchPoints:2});
                const cx=box.x+box.width*.5,cy=box.y+box.height*.45;
                await client.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:cx,y:cy,radiusX:4,radiusY:4,force:1,id:1}]});
                await client.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:cx+70,y:cy+25,radiusX:4,radiusY:4,force:1,id:1}]});
                await client.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});await page.waitForTimeout(700);
              }
              const after=crypto.createHash('sha256').update(await canvas.screenshot({type:'png'})).digest('hex');
              await canvas.screenshot({path:`/tmp/ow04-anchor-evidence/${cfg.id}.png`,type:'png'});
              results.push({id:cfg.id,status:response?.status()??null,canvasVisible:true,interactionExercised:before!==after,pageErrors,consoleErrors,httpErrors,beforeCanvasSha256:before,afterCanvasSha256:after});
              await context.close();
            }
          } finally {await browser.close();}
          const manifest={schema:'H_EARTH_OW04_EXACT_CANDIDATE_ANCHOR_EVIDENCE_v1',candidateHead:process.env.CANDIDATE_HEAD,productFiles:productFiles.map(path=>({path,sha256:sha(path)})),captures:results,result:results.every(r=>r.status===200&&r.canvasVisible&&r.interactionExercised&&r.pageErrors.length===0&&r.consoleErrors.length===0&&r.httpErrors.length===0)?'PASS':'FAIL'};
          fs.writeFileSync('/tmp/ow04-anchor-evidence/manifest.json',JSON.stringify(manifest,null,2)+'\n');
          fs.unlinkSync('.tmp-ow04-capture.mjs');
          if(manifest.result!=='PASS'){console.error(JSON.stringify(manifest,null,2));process.exit(1)}
          console.log(JSON.stringify(manifest,null,2));
          NODE
          node .tmp-ow04-capture.mjs
      - name: Upload exact candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-ow04-exact-candidate-anchor-evidence
          path: /tmp/ow04-anchor-evidence
          retention-days: 90
