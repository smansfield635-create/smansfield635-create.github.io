name: Compass Display Continuity Validation

on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/compass/**'
      - '.github/ai-router/router.v1.json'
      - '.github/ai-router/projects/compass/entrypoint.v1.json'
      - '.github/ai-router/projects/compass/verify-display-continuity.v1.mjs'
      - '.github/ai-router/projects/compass/verify-performance-successor.mjs'
      - '.github/workflows/compass-display-continuity-validation.yml'
      - '.github/workflows/compass-performance-successor-validation.yml'
      - '.github/workflows/compass-carousel-successor-live-qualification.yml'
      - '.github/workflows/pages-direct-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPASS_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  COMPASS_SCOPE_BASE: ${{ github.event.pull_request.base.sha }}

jobs:
  verify-static-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run fresh fail-closed Compass verifier
        env:
          COMPASS_VERIFICATION_OUTPUT: /tmp/compass-root-award-finish-display-continuity.json
        run: |
          test "$(git rev-parse HEAD^{commit})" = "$COMPASS_CANDIDATE_HEAD"
          node .github/ai-router/projects/compass/verify-display-continuity.v1.mjs --binding > /tmp/compass-operation-binding.json
          node .github/ai-router/projects/compass/verify-display-continuity.v1.mjs
      - name: Upload static verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compass-display-continuity-verification-receipt
          path: |
            /tmp/compass-operation-binding.json
            /tmp/compass-root-award-finish-display-continuity.json

  qualify-runtime:
    runs-on: ubuntu-latest
    needs: verify-static-contract
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve fresh operation binding
        run: node .github/ai-router/projects/compass/verify-display-continuity.v1.mjs --binding > /tmp/compass-operation-binding.json
      - name: Install Playwright outside repository contract
        env:
          npm_config_package_lock: 'false'
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Start local static host
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/compass-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/compass-http.log
          exit 1
      - name: Qualify estate continuity and accessible composition
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {chromium} from 'playwright';const binding=JSON.parse(fs.readFileSync('/tmp/compass-operation-binding.json','utf8')),browser=await chromium.launch({headless:true}),checks=[];const check=(id,pass,evidence)=>checks.push({id,pass:Boolean(pass),evidence});let fatal=null;
          try{
            for(const [name,width,height] of [['desktop',1440,900],['tablet',820,1180],['phone',390,844],['phone-tall',1080,2340]]){
              const context=await browser.newContext({viewport:{width,height}}),page=await context.newPage(),errors=[],requests=[];page.on('pageerror',error=>errors.push(String(error)));page.on('request',request=>requests.push(request.url()));await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});await page.waitForFunction(()=>globalThis.CompassEditorialCarousel?.version==='root-award-finish-successor-v1');await page.waitForTimeout(600);
              const result=await page.evaluate(()=>{const visible=element=>{const rect=element.getBoundingClientRect(),style=getComputedStyle(element);return rect.width>0&&rect.height>0&&style.visibility!=='hidden'&&style.display!=='none'},brain=document.querySelector('[data-human-brain] canvas'),house=document.querySelector('[data-capability="house"]'),parent=document.querySelector('[data-house-parent]'),houseBox=house.getBoundingClientRect(),parentBox=parent.getBoundingClientRect();return{cardinals:[...document.querySelectorAll('[data-compass-cardinal]')].map(element=>element.dataset.cardinalId),rooms:document.querySelectorAll('[data-compass-room-declarations] [data-compass-room]').length,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,introOpen:document.querySelector('[data-compass-full-introduction]')?.open,mirrorRoutes:document.querySelectorAll('[data-compass-mirrorland-routes] a:not([data-compass-mirrorland-inline-back])').length,capabilities:document.querySelectorAll('[data-capability-orbit] > [data-capability]').length,capabilityFront:document.querySelectorAll('[data-capability-orbit] > [data-slot="front"]').length,proofs:document.querySelectorAll('[data-proof-card]').length,proofFront:document.querySelectorAll('[data-proof-card][data-slot="front"]').length,buildSeparated:document.querySelector('.compass-built .compass-build-cta')===null,targets:[...document.querySelectorAll('[data-capability-orbit] > [data-slot="front"] button,[data-capability-orbit] > [data-slot="front"] a,[data-capability-orbit] > .compass-orbit-controls button,[data-proof-orbit] > [data-slot="front"] button,[data-proof-orbit] > [data-slot="front"] a,[data-proof-orbit] > .compass-orbit-controls button')].filter(visible).map(element=>{const rect=element.getBoundingClientRect();return{label:element.getAttribute('aria-label')||element.textContent.trim(),width:rect.width,height:rect.height}}),guidance:visible(document.querySelector('[data-capability-guidance