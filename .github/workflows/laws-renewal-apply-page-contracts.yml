name: Laws Renewal Apply Page Contracts

on:
  push:
    branches:
      - agent/laws-renewal-public-audit-translation-001
    paths:
      - scripts/laws-renewal-apply-page-contracts.mjs
      - .github/workflows/laws-renewal-apply-page-contracts.yml

permissions:
  contents: write

jobs:
  apply-page-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/laws-renewal-public-audit-translation-001
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply five-page source contracts
        run: node scripts/laws-renewal-apply-page-contracts.mjs

      - name: Validate patch integrity
        run: git diff --check

      - name: Commit transformed pages
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No page changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            laws/categories/flow/signals/index.html \
            laws/categories/reality/measure.html \
            laws/test/reverse-audit/index.html \
            laws/research/findings-and-boundaries/index.html \
            laws/industrial-posture/index.html
          git commit -m "Apply collapsed entry contract to five Laws pages"
          git push origin HEAD:agent/laws-renewal-public-audit-translation-001
