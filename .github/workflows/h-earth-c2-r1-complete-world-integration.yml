name: H-Earth C2-R1 Complete World Integration

on:
  workflow_dispatch:
    inputs:
      expected_candidate_head:
        required: true
        type: string
  pull_request:
    branches: [integration/h-earth-c2-r1-baseline-001]
    paths:
      - '.github/workflows/h-earth-c2-r1-complete-world-integration.yml'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/h-earth.c2-r1.allowed-path-manifest.json'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/**'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.complete-world-integration.mjs'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/complete-world/**'

permissions:
  contents: read

env:
  EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.expected_candidate_head }}
  REVIEW_URL: http://127.0.0.1:4188/h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/index.html
  PLAYWRIGHT_VERSION: 1.55.0

jobs:
  exact-head-and-static-construction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Verify exact identities and path boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin rollback/h-earth-c2-r1-real-package-adapter-start-001:refs/remotes/origin/rollback/h-earth-c2-r1-real-package-adapter-start-001
          git fetch origin rollback/h-earth-c2-r1-startup-performance-start-001:refs/remotes/origin/rollback/h-earth-c2-r1-startup-performance-start-001
          test "$(git rev-parse origin/rollback/h-earth-c2-r1-real-package-adapter-start-001)" = 8d41e4eb85a8ef6a2162e46c2bc5d0a92892dc55
          test "$(git rev-parse origin/rollback/h-earth-c2-r1-startup-performance-start-001)" = f171852f3b453a1535fc29ed2798430814351084
          printf '%s\n' \
            .github/workflows/h-earth-c2-r1-complete-world-integration.yml \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/complete-world/h-earth.c2-r1.complete-world-operation-ledger.json \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/complete-world/h-earth.c2-r1.complete-world-role3-entry.json \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/complete-world-render-package.js \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/complete-world.js \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.complete-world-integration.mjs | sort > /tmp/expected-six
          git diff --name-only 8d41e4eb85a8ef6a2162e46c2bc5d0a92892dc55...HEAD | sort > /tmp/actual-six
          diff -u /tmp/expected-six /tmp/actual-six
          printf '%s\n' \
            .github/workflows/h-earth-c2-r1-complete-world-integration.yml \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/complete-world/h-earth.c2-r1.complete-world-operation-ledger.json \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/complete-world/h-earth.c2-r1.complete-world-role3-entry.json \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/complete-world/h-earth.c2-r1.complete-world-source-custody.json \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/h-earth.c2-r1.allowed-path-manifest.json \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/complete-world-persistent-renderer.js \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/complete-world-render-package.js \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/complete-world.js \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/identity.json \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/index.html \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.complete-world-integration.mjs | sort > /tmp/expected-eleven
          git diff --name-only e03f211a472fd564b1ed4b8a00096c923a077528...HEAD | sort > /tmp/actual-eleven
          diff -u /tmp/expected-eleven /tmp/actual-eleven
      - name: Run synthetic and exact-cache integration tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/static"
          node h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.complete-world-integration.mjs | tee "$RUNNER_TEMP/static/static-test.log"
          sha256sum "$RUNNER_TEMP/static/static-test.log" > "$RUNNER_TEMP/static/static-test.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: h-earth-c2-r1-complete-world-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/static
          if-no-files-found: error
          retention-days: 30

  browser-execution-transport:
    needs: exact-head-and-static-construction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Provision exact-head same-origin browser host
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p "$RUNNER_TEMP/browser/runtime" "$RUNNER_TEMP/browser/artifacts"
          cd "$RUNNER_TEMP/browser/runtime"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
          python3 -m http.server 4188 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" >"$RUNNER_TEMP/browser/artifacts/server.log" 2>&1 &
          for attempt in $(seq 1 60); do curl -fsS "$REVIEW_URL" >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Execute desktop and touch mobile matrix
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/browser/runtime/verify.mjs" <<'SCRIPT'
          import fs from 'node:fs';
          import path from 'node:path';
          import process from 'node:process';
          import { chromium } from 'playwright';
          const out=path.join(process.env.RUNNER_TEMP,'browser/artifacts');
          const check=(value,code,detail=null)=>{if(!value){const error=new Error(code);error.detail=detail;throw error;}};
          const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function touch(page,steps){await page.evaluate(async rows=>{const canvas=document.getElementById('complete-world-canvas');for(const row of rows){for(const point of row.points){const released=row.type==='pointerup';canvas.dispatchEvent(new PointerEvent(row.type,{bubbles:true,cancelable:true,pointerId:point.id,pointerType:'touch',isPrimary:point.id===1,clientX:point.x,clientY:point.y,buttons:released?0:1,pressure:released?0:.5}));}await new Promise(resolve=>setTimeout(resolve,row.wait??80));}},steps);}
          async function interact(page,mobile){
            if(!mobile){const box=await page.locator('#complete-world-canvas').boundingBox();check(box,'CANVAS_BOX_MISSING');const x=box.x+box.width/2,y=box.y+box.height/2;await page.mouse.move(x,y);await page.mouse.down();await page.mouse.move(x+120,y,{steps:12});await page.mouse.up();await page.mouse.wheel(0,-240);await wait(250);return;}
            await touch(page,[{type:'pointerdown',points:[{id:1,x:110,y:220}]},{type:'pointermove',points:[{id:1,x:205,y:220}],wait:380},{type:'pointerup',points:[{id:1,x:205,y:220}]}]);
            await touch(page,[{type:'pointerdown',points:[{id:1,x:105,y:360},{id:2,x:225,y:360}]},{type:'pointermove',points:[{id:1,x:105,y:275},{id:2,x:225,y:275}],wait:420},{type:'pointerup',points:[{id:1,x:105,y:275},{id:2,x:225,y:275}]}]);
            await touch(page,[{type:'pointerdown',points:[{id:1,x:125,y:330},{id:2,x:205,y:330}]},{type:'pointermove',points:[{id:1,x:70,y:330},{id:2,x:260,y:330}],wait:420},{type:'pointerup',points:[{id:1,x:70,y:330},{id:2,x:260,y:330}]}]);
          }
          async function run(browser,scenario){
            const context=await browser.newContext({viewport:scenario.viewport,deviceScaleFactor:scenario.dpr,isMobile:scenario.mobile,hasTouch:scenario.mobile});
            await context.tracing.start({screenshots:true,snapshots:true,sources:true});
            const page=await context.newPage(),consoleRecords=[],pageErrors=[],requestFailures=[],httpRecords=[];
            page.on('console',message=>consoleRecords.push({type:message.type(),text:message.text()}));page.on('pageerror',error=>pageErrors.push({message:error.message}));page.on('requestfailed',request=>requestFailures.push({url:request.url(),failure:request.failure()}));page.on('response',response=>httpRecords.push({url:response.url(),status:response.status(),contentType:response.headers()['content-type']??null}));
            try{
              const started=Date.now();await page.goto(process.env.REVIEW_URL,{waitUntil:'domcontentloaded',timeout:120000});await page.waitForFunction(()=>{const state=window.H_EARTH_C2_R1_COMPLETE_WORLD;return state?.ready===true||state?.failed===true;},null,{timeout:120000,polling:250});const startupMilliseconds=Date.now()-started;
              const startup=await page.evaluate(()=>{const state=window.H_EARTH_C2_R1_COMPLETE_WORLD;return state.failed?{failed:true,value:state.getFailureReceipt()}:{failed:false,value:state.getReceipt()};});check(!startup.failed,startup.value.rootRejectionCode??'RUNTIME_FAILED',startup.value);const before=startup.value;
              check(startupMilliseconds<=120000,'STARTUP_BUDGET_EXCEEDED',{startupMilliseconds});check(before.packageBinding.counters.constructionMilliseconds<=105000,'CONSTRUCTION_BUDGET_EXCEEDED',before.packageBinding.counters);
              await page.screenshot({path:path.join(out,`${scenario.name}-before.png`),fullPage:true});await interact(page,scenario.mobile);const after=await page.evaluate(()=>window.H_EARTH_C2_R1_COMPLETE_WORLD.getReceipt());const webgl=await page.evaluate(()=>document.getElementById('complete-world-canvas').getContext('webgl2') instanceof WebGL2RenderingContext);await page.screenshot({path:path.join(out,`${scenario.name}-after.png`),fullPage:true});
              const rb=before.renderer.counters,ra=after.renderer.counters,ib=before.intake.counters,ia=after.intake.counters;check(webgl,'WEBGL2_NOT_BOUND');check(ra.contextCreationCount===1,'CONTEXT_COUNT_NOT_ONE',ra);check(ra.rendererInitializationCount===1,'RENDERER_INIT_NOT_ONE',ra);check(ra.visiblePresentationCount>rb.visiblePresentationCount,'VISIBLE_FRAME_NOT_ADVANCED',{rb,ra});check(ra.worldRebuildCount===0,'WORLD_REBUILD',ra);check(ra.postInitializationResourceCreationCount===0,'POST_INIT_RESOURCE_CREATION',ra);check(ra.postInitializationBufferUploadCount===0,'POST_INIT_BUFFER_UPLOAD',ra);check(after.packageBinding.counters.candidateSampleFailureCount===0,'SAMPLE_FAILURE');check(after.packageBinding.counters.boundTerrainVertexCount===10419,'TERRAIN_COUNT');check(after.packageBinding.counters.boundShorelineVertexCount===299,'SHORELINE_COUNT');check(ia.navigationProposalCount>ib.navigationProposalCount,'NAVIGATION_NOT_ADVANCED',{ib,ia});
              if(scenario.mobile){check(ia.touchPointerEventCount>ib.touchPointerEventCount,'TOUCH_NOT_RECORDED');check(ia.oneFingerLookProposalCount>ib.oneFingerLookProposalCount,'LOOK_NOT_RECORDED');check(ia.twoFingerTravelProposalCount>ib.twoFingerTravelProposalCount,'TRAVEL_NOT_RECORDED');check(ia.pinchProposalCount>ib.pinchProposalCount,'PINCH_NOT_RECORDED');check(ia.releaseTerminationCount>ib.releaseTerminationCount,'RELEASE_NOT_RECORDED');}else{check(ia.mousePointerEventCount>ib.mousePointerEventCount,'MOUSE_NOT_RECORDED');check(ia.oneFingerLookProposalCount>ib.oneFingerLookProposalCount,'DESKTOP_LOOK_NOT_RECORDED');check(ia.wheelEventCount>ib.wheelEventCount,'WHEEL_NOT_RECORDED');}
              check(consoleRecords.filter(row=>row.type==='error').length===0,'CONSOLE_ERROR',consoleRecords);check(pageErrors.length===0,'PAGE_ERROR',pageErrors);check(requestFailures.length===0,'REQUEST_FAILURE',requestFailures);check(httpRecords.filter(row=>row.status>=400&&!row.url.endsWith('/favicon.ico')).length===0,'HTTP_FAILURE',httpRecords);
              const receipt={receiptType:'H_EARTH_C2_R1_COMPLETE_WORLD_BROWSER_SCENARIO_v5',expectedHead:process.env.EXPECTED_HEAD,reviewUrl:process.env.REVIEW_URL,scenario,startupMilliseconds,webgl,before,after,consoleRecords,pageErrors,requestFailures,httpRecords};fs.writeFileSync(path.join(out,`${scenario.name}-receipt.json`),JSON.stringify(receipt,null,2));await context.tracing.stop({path:path.join(out,`${scenario.name}-trace.zip`)});return receipt;
            }catch(error){const progress=await page.evaluate(()=>window.H_EARTH_C2_R1_COMPLETE_WORLD?.getProgressReceipt?.()??null).catch(()=>null);fs.writeFileSync(path.join(out,`${scenario.name}-failure.json`),JSON.stringify({error:{name:error.name,message:error.message,detail:error.detail??null},progress,consoleRecords,pageErrors,requestFailures,httpRecords},null,2));await context.tracing.stop({path:path.join(out,`${scenario.name}-trace.zip`)}).catch(()=>{});throw error;}finally{await context.close();}
          }
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--disable-dev-shm-usage']});try{const scenarios=[{name:'desktop-1440x900',viewport:{width:1440,height:900},dpr:1,mobile:false},{name:'mobile-412x915',viewport:{width:412,height:915},dpr:2.625,mobile:true},{name:'mobile-390x844',viewport:{width:390,height:844},dpr:3,mobile:true}];const receipts=[];for(const scenario of scenarios)receipts.push(await run(browser,scenario));fs.writeFileSync(path.join(out,'browser-summary.json'),JSON.stringify({receiptType:'H_EARTH_C2_R1_COMPLETE_WORLD_BROWSER_TRANSPORT_SUMMARY_v5',expectedHead:process.env.EXPECTED_HEAD,reviewUrl:process.env.REVIEW_URL,roleBoundary:'ROLE_1_TRANSPORT_NOT_ROLE_3_CERTIFICATION',scenarios:receipts.map(receipt=>({name:receipt.scenario.name,startupMilliseconds:receipt.startupMilliseconds,constructionMilliseconds:receipt.after.packageBinding.counters.constructionMilliseconds}))},null,2));}finally{await browser.close();}
          SCRIPT
          cd "$RUNNER_TEMP/browser/runtime"
          node verify.mjs
      - name: Digest browser artifacts
        if: always()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/browser/artifacts"
          find . -maxdepth 1 -type f ! -name artifact-sha256.txt -print0 | sort -z | xargs -0 sha256sum > artifact-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h-earth-c2-r1-complete-world-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser/artifacts
          if-no-files-found: error
          retention-days: 30
