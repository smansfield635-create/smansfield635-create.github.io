name: Tests L0 L1 M1 Runtime Interaction Evidence

on:
  push:
    branches:
      - agent/tests-l0-l1-bounded-manifestation-m1-runtime-evidence-v1
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    paths:
      - control-plane/whole-estate/tests-l0-l1-bounded-manifestation-m1-runtime-evidence-v1/**

permissions:
  contents: read

concurrency:
  group: tests-l0-l1-m1-runtime-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  M1_PROMOTION: 391c3543fd048bac90493232f04973911468d3eb
  M1_CANDIDATE: 9370bba7841b8a831f7f1c034d0b74fb83dab2e0
  M1_PACKAGE: control-plane/whole-estate/tests-l0-l1-bounded-manifestation-m1-v1
  RUNTIME_PACKAGE: control-plane/whole-estate/tests-l0-l1-bounded-manifestation-m1-runtime-evidence-v1
  REGISTRY_PATH: control-plane/whole-estate/tests-l0-l1-object-projection-registry-v1/object-projection-registry.v1.json

jobs:
  exact-scope-and-promoted-source-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact evidence candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify additive evidence scope and promoted source identity
        shell: bash
        env:
          REVIEW_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '391c3543fd048bac90493232f04973911468d3eb' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/m1-runtime-evidence
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$(git merge-base HEAD "$M1_PROMOTION")" = "$M1_PROMOTION"

          mapfile -t CHANGED < <(git diff --name-only "$M1_PROMOTION"...HEAD | sort)
          EXPECTED=(
            ".github/workflows/tests-l0-l1-bounded-manifestation-m1-runtime-evidence.yml"
            "$RUNTIME_PACKAGE/README.md"
            "$RUNTIME_PACKAGE/runtime-evidence-manifest.v1.json"
            "$RUNTIME_PACKAGE/verify.runtime.mjs"
          )
          mapfile -t EXPECTED_SORTED < <(printf '%s\n' "${EXPECTED[@]}" | sort)
          test "${#CHANGED[@]}" -eq 4
          test "$(printf '%s\n' "${CHANGED[@]}")" = "$(printf '%s\n' "${EXPECTED_SORTED[@]}")"
          test "$(git diff --diff-filter=AMD --name-status "$M1_PROMOTION"...HEAD | awk '$1 != "A" {count++} END {print count+0}')" -eq 0

          git diff --quiet "$M1_PROMOTION" -- "$M1_PACKAGE" "$REGISTRY_PATH"
          test "$(git rev-parse HEAD:$M1_PACKAGE/index.html)" = "1dab5d948af7326db1213f6b0ff3c92acdce6246"
          test "$(git rev-parse HEAD:$M1_PACKAGE/candidate-manifest.v1.json)" = "e18c382c7f82bd3335f69bcf752198c0c10e66a9"
          test "$(git rev-parse HEAD:$M1_PACKAGE/manifestation.mjs)" = "93773f7ecff4036e531f6db1a672850919cee7c5"
          test "$(git rev-parse HEAD:$REGISTRY_PATH)" = "b801a11e342051a6b00e6f7098b1d691685ad0b6"

          git fetch origin main --quiet
          CURRENT_MAIN="$(git rev-parse origin/main)"
          PROTECTED_OVERLAP=0
          if git merge-base --is-ancestor "$M1_PROMOTION" "$CURRENT_MAIN"; then
            PROTECTED_OVERLAP="$(git diff --name-only "$M1_PROMOTION".."$CURRENT_MAIN" -- "$M1_PACKAGE" "$REGISTRY_PATH" | wc -l | xargs)"
          fi
          test "$PROTECTED_OVERLAP" -eq 0

          export HEAD_SHA CURRENT_MAIN PROTECTED_OVERLAP REVIEW_BASE
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipt = {
            schema: 'WHOLE_ESTATE_TESTS_L0_L1_M1_RUNTIME_EVIDENCE_SCOPE_RECEIPT_v1',
            operation: 'M1_RUNTIME_INTERACTION_EVIDENCE_v1',
            constructionBase: process.env.M1_PROMOTION,
            governingM1Candidate: process.env.M1_CANDIDATE,
            evidenceCandidateHead: process.env.HEAD_SHA,
            eventReviewBase: process.env.REVIEW_BASE,
            observedCurrentMain: process.env.CURRENT_MAIN,
            candidateChangedPathCount: 4,
            candidatePaths: [
              '.github/workflows/tests-l0-l1-bounded-manifestation-m1-runtime-evidence.yml',
              `${process.env.RUNTIME_PACKAGE}/README.md`,
              `${process.env.RUNTIME_PACKAGE}/runtime-evidence-manifest.v1.json`,
              `${process.env.RUNTIME_PACKAGE}/verify.runtime.mjs`,
            ].sort(),
            protectedSources: {
              m1IndexBlob: '1dab5d948af7326db1213f6b0ff3c92acdce6246',
              m1ManifestBlob: 'e18c382c7f82bd3335f69bcf752198c0c10e66a9',
              m1RuntimeBlob: '93773f7ecff4036e531f6db1a672850919cee7c5',
              registryBlob: 'b801a11e342051a6b00e6f7098b1d691685ad0b6',
              currentMainProtectedOverlapCount: Number(process.env.PROTECTED_OVERLAP),
            },
            mutationBoundary: {
              publicMutation: false,
              publicRouteCreation: false,
              m1SourceMutation: false,
              registryMutation: false,
              m1r2Mutation: false,
              scientificClaimUpgrade: false,
            },
            result: 'PASS_EXACT_SCOPE_AND_PROMOTED_SOURCE_IDENTITY',
          };
          fs.writeFileSync('/tmp/m1-runtime-evidence/scope-source-receipt.v1.json', JSON.stringify(receipt, null, 2) + '\n');
          NODE

      - name: Upload scope and source receipt
        uses: actions/upload-artifact@v4
        with:
          name: m1-runtime-scope-source-${{ github.run_id }}
          path: /tmp/m1-runtime-evidence/scope-source-receipt.v1.json
          if-no-files-found: error
          retention-days: 30

  runtime-interaction-evidence:
    needs: exact-scope-and-promoted-source-identity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact evidence candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify runtime evidence source syntax
        run: node --check "$RUNTIME_PACKAGE/verify.runtime.mjs"

      - name: Install Chromium runtime authority
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Start bounded local repository server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" >/tmp/m1-runtime-server.log 2>&1 &
          echo $! >/tmp/m1-runtime-server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:4173/$M1_PACKAGE/" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/m1-runtime-server.log || true
          exit 1

      - name: Execute bounded M1 runtime and interaction verifier
        shell: bash
        env:
          M1_BASE_URL: http://127.0.0.1:4173
          M1_RUNTIME_EVIDENCE_DIR: /tmp/m1-runtime-evidence
        run: |
          set -euo pipefail
          node "$RUNTIME_PACKAGE/verify.runtime.mjs"

      - name: Upload runtime evidence receipt and raw screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-runtime-interaction-evidence-${{ github.run_id }}
          path: /tmp/m1-runtime-evidence
          if-no-files-found: error
          retention-days: 30
