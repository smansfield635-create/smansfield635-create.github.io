name: Laws CP6-4/5 corrected execution carrier

on:
  pull_request:
    branches:
      - agent/laws-cp6-3-canonical-content-migration-001
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: laws-cp6-4-5-corrected-execution
  cancel-in-progress: false

jobs:
  execute-corrected-program:
    if: github.head_ref == 'agent/laws-cp6-4-first-theme-and-page-consolidation-002'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout corrected stacked branch
        uses: actions/checkout@v4
        with:
          ref: agent/laws-cp6-4-first-theme-and-page-consolidation-002
          fetch-depth: 0

      - name: Confirm bounded carrier state
        shell: bash
        run: |
          set -euo pipefail
          CP63=a76bb97f9a63c588b5e7131b3dc3461f8d1e36ee
          test "$(git merge-base HEAD "$CP63")" = "$CP63"
          mapfile -t changed < <(git diff --name-only "$CP63"..HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/laws-cp6-4-5-execution-carrier.yml"
          test "${changed[1]}" = ".github/workflows/laws-cp6-4-5-first-consolidation.yml"

      - name: Install review and browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check beautifulsoup4 playwright pillow
          python3 -m playwright install chromium

      - name: Extract, correct, and execute the bounded program
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source_path = Path('.github/workflows/laws-cp6-4-5-first-consolidation.yml')
          workflow = source_path.read_text(encoding='utf-8')
          start_marker = "cat > /tmp/laws_cp645.py <<'PY'\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index("\n          PY\n          python3 /tmp/laws_cp645.py", start)
          source = textwrap.dedent(workflow[start:end])

          source = source.replace(
              "BRANCH = 'agent/laws-cp6-4-first-theme-and-page-consolidation-001'",
              "BRANCH = 'agent/laws-cp6-4-first-theme-and-page-consolidation-002'",
              1,
          )

          payload_needle = "\nassert set(expected_payloads) == {row['id'] for row in migrated_rows}\n"
          assert source.count(payload_needle) == 1
          route_normalization = r'''

def normalize_absent_source_route(fragment):
    parsed = BeautifulSoup(fragment, 'html.parser')
    link = parsed.find('a', href=True)
    assert link is not None
    href = link['href']
    replacement = parsed.new_tag('article')
    replacement['class'] = list(link.get('class', [])) + ['source-route-record']
    for child in list(link.contents):
        replacement.append(child.extract())
    declaration = parsed.new_tag('p')
    declaration['class'] = ['declared-source-route']
    declaration.string = f'Declared source route retained without broken navigation: {href}'
    replacement.append(declaration)
    link.replace_with(replacement)
    return str(parsed)

for number in (88, 90):
    expected_payloads[cid(number)] = normalize_absent_source_route(expected_payloads[cid(number)])
'''
          source = source.replace(payload_needle, textwrap.dedent(route_normalization) + payload_needle, 1)

          source = source.replace(
              "/laws/research/applied-investigations/#route-maturity-and-infrastructure-pathways",
              "/laws/research/applied-investigations/",
          )

          status_needle = "status_lines = run('git','status','--porcelain').splitlines()"
          status_replacement = "status_lines = run('git','status','--porcelain','--untracked-files=all').splitlines()"
          assert source.count(status_needle) == 1
          source = source.replace(status_needle, status_replacement, 1)

          paths_needle = "changed_paths = sorted(line[3:] for line in status_lines if line)"
          paths_replacement = """carrier_paths = {
    '.github/workflows/laws-cp6-4-5-first-consolidation.yml',
    '.github/workflows/laws-cp6-4-5-execution-carrier.yml',
}
changed_paths = sorted(line[3:] for line in status_lines if line and line[3:] not in carrier_paths)"""
          assert source.count(paths_needle) == 1
          source = source.replace(paths_needle, paths_replacement, 1)

          Path('/tmp/laws_cp645.py').write_text(source, encoding='utf-8')
          PY
          rm -f .github/workflows/laws-cp6-4-5-execution-carrier.yml
          python3 /tmp/laws_cp645.py

      - name: Commit verified inspectable candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "CP6-4/5 implement F.I.R.S.T. and consolidate Laws pages"
          git push origin HEAD:agent/laws-cp6-4-first-theme-and-page-consolidation-002
