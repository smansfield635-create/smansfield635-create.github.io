name: Promote GitHub Pages Actions Authority

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-promote-actions-authority.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

environment:
  name: github-pages

concurrency:
  group: pages-authority-migration
  cancel-in-progress: true

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Promote Pages build type to workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          before="$(curl --fail-with-body --silent --show-error -L "${headers[@]}" "$api")"
          echo "Before migration: build_type=$(jq -r '.build_type // "unknown"' <<<"$before"), source=$(jq -r '(.source.branch // "") + (.source.path // "")' <<<"$before")"
          if [ "$(jq -r '.build_type // empty' <<<"$before")" != "workflow" ]; then
            curl --fail-with-body --silent --show-error -L -X PUT "${headers[@]}" \
              "$api" -d '{"build_type":"workflow"}' >/dev/null
          fi
          after="$(curl --fail-with-body --silent --show-error -L "${headers[@]}" "$api")"
          test "$(jq -r '.build_type // empty' <<<"$after")" = "workflow"
          echo "Pages publication authority is now workflow-based."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload exact static repository tree
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy exact head to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live successor marker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            html="$(curl --fail-with-body --silent --show-error -L --max-time 30 https://diamondgatebridge.com/ || true)"
            if grep -q 'COMPASS_STATIC_EDITORIAL_SUCCESSOR_v1' <<<"$html"; then
              echo "Qualified Compass successor is live from workflow-based Pages."
              exit 0
            fi
            sleep 10
          done
          echo "Workflow deployment completed but live successor marker was not observed in time." >&2
          exit 1
