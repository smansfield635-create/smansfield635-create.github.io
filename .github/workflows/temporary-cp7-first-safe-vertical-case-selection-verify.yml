name: Temporary CP7 First Safe Vertical Case Selection Verify

on:
  pull_request:
    paths:
      - 'control-plane/whole-estate/first-safe-vertical-case-selection-v1/**'
      - '.github/workflows/temporary-cp7-first-safe-vertical-case-selection-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-cp7-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch exact unmerged scientific source heads
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            agent/ucic-csb-five-case-external-specificity-replication-v1 \
            agent/ucic-hurricane-preflight-artifact-expose-v1
          git cat-file -e 54e0f3cf59cffab6a195c9c2ffe4f104185b5e81^{commit}
          git cat-file -e f6a7267e010a42cce94a7ea292af8e1974591ae2^{commit}
      - name: Verify Checkpoint 7 package fail-closed
        shell: bash
        run: node control-plane/whole-estate/first-safe-vertical-case-selection-v1/verify.v1.mjs | tee /tmp/cp7-verification.log
      - name: Require terminal Checkpoint 7 contract
        shell: bash
        run: grep -F 'PASS_FIRST_SAFE_VERTICAL_CASE_SELECTION_v1' /tmp/cp7-verification.log
      - name: Preserve verification log
        uses: actions/upload-artifact@v4
        with:
          name: cp7-first-safe-vertical-case-selection-verification
          if-no-files-found: error
          retention-days: 90
          path: /tmp/cp7-verification.log
