              closedCheckpointRegression:{fp00:b.fp00.status,fp01:b.fp01.status,fp02:b.fp02.status,fp03:FP03.status,fp04:FP04.status,doNotReopen:true},
              externalDurableCustodyInputs:{fp03:FP03,fp04:FP04},
              areaDispositionCount:areas.length,
