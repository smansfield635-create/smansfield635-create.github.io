<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H-Earth — grass test patch</title>
<style>*{box-sizing:border-box}body{margin:0;background:#132019;color:#edf4e9;font:16px system-ui}header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:18px;margin:0}small{display:block;color:#b8cbb7;margin-top:3px}canvas{display:block;width:100%;height:calc(100dvh - 128px);touch-action:none}footer{padding:10px 16px;display:flex;align-items:center;gap:10px}button{border:1px solid #71896c;border-radius:6px;padding:9px 14px;background:#28442f;color:white;font:inherit}button:disabled{opacity:.5}#loading{position:fixed;inset:65px 0 60px;background:#132019;display:grid;place-content:center;text-align:center;padding:25px}#loading[hidden]{display:none}#hint{font-size:13px;color:#c4d2bd}</style></head>
<body><header><div><h1>Grass test patch</h1><small>Updated grass · 16 × 16 metres</small></div><span id="status" role="status">Loading…</span></header><canvas id="scene" aria-label="Updated lowland grass test patch. Drag to look."></canvas><footer><button id="close" disabled>Close view</button><button id="wide" disabled>Patch view</button><span id="hint">Drag to look</span></footer><div id="loading"><strong id="progress">Opening the grass test patch…</strong><p>The view will open facing the updated grass.</p></div>
<script type="module">
const canvas=document.querySelector('#scene'),status=document.querySelector('#status'),progress=document.querySelector('#progress');
try {
 const base='../showroom/globe/h-earth/';
 const [nav,frames,mod]=await Promise.all([import(base+'functional-landscape/navigation.js'),import(base+'render/live-renderer-contract.run8e-r3a.js'),import(base+'render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js')]);
 const rect=canvas.getBoundingClientRect(),ratio=Math.min(devicePixelRatio||1,1.5),width=Math.min(1440,Math.round(rect.width*ratio)),height=Math.round(width*rect.height/rect.width);
 canvas.width=width;canvas.height=height;
 let state,renderer,sequence=0;
 function act(intent){const result=nav.proposeHEarthFunctionalLandscapeNavigation(state,intent);if(!result.ok)throw new Error(result.issues.join(', '));state=result.state;}
 function position(near){state=nav.createHEarthFunctionalLandscapeNavigationState({waypointId:'LOWLAND'}).state;act({action:'SET_CAMERA_POSITION',position:near?{x:-23.57004735,z:-147.1}:{x:-24,z:-140}});for(let i=0;i<3;i++)act({action:'TURN_RIGHT',degrees:6});for(let i=0;i<3;i++)act({action:'PITCH_DOWN',degrees:8});}
 function packet(){return frames.createHEarthRun8ER3AFrameUniformPacket({navigationState:state,viewport:{width,height,pixelRatio:ratio},frameSequence:++sequence});}
 function draw(){renderer.renderFrame(packet());renderer.presentColorFrame();window.GRASS_PATCH_PREVIEW.navigationState=state;}
 position(true);renderer=mod.createHEarthRun8ER3CPersistentRenderer({canvas,width,height});renderer.initialize(packet());
 for(let i=0;i<108;i++){renderer.materializeNextVegetationBatch();progress.textContent=`Loading the grass patch… ${Math.round((i+1)/108*100)}%`;if(i%4===0)await new Promise(requestAnimationFrame);}
 window.GRASS_PATCH_PREVIEW={productCommit:'b7295a3d10a0039ebbd43a6ca073558ff810b0b8',patch:{minX:-32,maxX:-16,minZ:-158,maxZ:-142},getReceipt:()=>renderer.getResourceReceipt(),navigationState:state,ready:false};
 draw();window.GRASS_PATCH_PREVIEW.ready=true;document.querySelector('#loading').hidden=true;status.textContent='Updated patch';
 for(const [id,near] of [['close',true],['wide',false]]){const button=document.querySelector('#'+id);button.disabled=false;button.onclick=()=>{position(near);draw();};}
 let previous=null;
 canvas.onpointerdown=e=>{previous={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);};
 canvas.onpointermove=e=>{if(!previous)return;const dx=e.clientX-previous.x,dy=e.clientY-previous.y;previous={x:e.clientX,y:e.clientY};if(dx)act({action:dx>0?'TURN_LEFT':'TURN_RIGHT',degrees:Math.min(8,Math.abs(dx)*.18)});if(dy)act({action:dy>0?'PITCH_UP':'PITCH_DOWN',degrees:Math.min(8,Math.abs(dy)*.18)});draw();};
 canvas.onpointerup=canvas.onpointercancel=()=>{previous=null;};
} catch(error){status.textContent='Could not open';progress.textContent=error.message;window.GRASS_PATCH_PREVIEW_ERROR=error.message;console.error(error);}
</script></body></html>
