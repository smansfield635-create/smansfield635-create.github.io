name: Laws Six-Node CP4 Browser Evidence v5

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: laws-six-node-cp4-browser-evidence-v5
  cancel-in-progress: false

jobs:
  browser-verification:
    if: github.event.pull_request.head.ref == 'agent/laws-six-node-cp4-browser-verification-001'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out verifier custody
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: verification-branch
          persist-credentials: false

      - name: Extract architecture-correct browser harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cp4
          python3 - <<'PY'
          from pathlib import Path

          source = Path('verification-branch/.github/workflows/laws-six-node-cp4-browser-verification.yml').read_text().splitlines()
          start_marker = "          cat > /tmp/cp4/run.mjs <<'EOF'"
          end_marker = "          EOF"
          start = source.index(start_marker) + 1
          end = source.index(end_marker, start)
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end]) + '\n'

          replacements = [
              (
                  'id: element.dataset.direction || element.dataset.auxiliaryId,',
                  'id: element.dataset.direction || element.dataset.lawsAuxiliaryId || element.dataset.auxiliaryId,'
              ),
              (
                  'return { field: { width: fieldRect.width, height: fieldRect.height }, records };',
                  'return { field: { width: fieldRect.width, height: fieldRect.height }, records, projections: globalThis.DGB_LAWS_CONTROLLER.getSemanticProjection() };'
              ),
              (
                  'check(`${label}: all primary nodes have pointer authority`, visual.records.every(x => x.pointerEvents !== \'none\'), visual.records);',
                  'const categoryTabs = await page.evaluate(() => [...document.querySelectorAll("[data-laws-projected-category-label]")].map(element => ({ id: element.dataset.lawsProjectedCategoryLabel, hidden: element.hidden, pointerEvents: getComputedStyle(element).pointerEvents, visibility: getComputedStyle(element).visibility })));\n  check(`${label}: cardinal projected labels retain pointer authority`, categoryTabs.length === 4 && categoryTabs.every(x => !x.hidden && x.pointerEvents !== "none" && x.visibility !== "hidden"), categoryTabs);\n  check(`${label}: auxiliary semantic controls retain pointer authority`, visual.records.filter(x => x.kind === "auxiliary").length === 2 && visual.records.filter(x => x.kind === "auxiliary").every(x => x.pointerEvents !== "none"), visual.records);'
              ),
              (
                  'check(`${label}: all primary centers remain inside scene`, visual.records.every(x => x.centerX >= 0 && x.centerX <= visual.field.width && x.centerY >= 0 && x.centerY <= visual.field.height), visual);',
                  'const projectionById = new Map((visual.projections || []).filter(x => ["category", "auxiliary"].includes(String(x.kind).toLowerCase())).map(x => [x.id, x]));\n  check(`${label}: semantic hit centers align with live projections`, visual.records.every(x => { const projection = projectionById.get(x.id); return Boolean(projection) && Math.abs(x.centerX - projection.x) <= 2 && Math.abs(x.centerY - projection.y) <= 2; }), visual);'
              ),
              (
                  'check(`${label}: Test warm-gold and Research cool-violet palettes differ`, test.pseudoBackground !== research.pseudoBackground && test.labelColor !== research.labelColor, { test, research });',
                  'check(`${label}: Test warm-gold and Research cool-violet labels differ`, Boolean(test.labelColor) && Boolean(research.labelColor) && test.labelColor !== research.labelColor, { test, research });'
              ),
              (
                  'check(`${label}: auxiliary authorities occupy distinct noncardinal positions`, Math.hypot(test.centerX - research.centerX, test.centerY - research.centerY) > Math.max(test.width, research.width), { test, research });',
                  'check(`${label}: auxiliary authorities occupy distinct noncardinal positions`, Math.hypot(test.centerX - research.centerX, test.centerY - research.centerY) > Math.max(test.width, research.width) * 0.25, { test, research });'
              ),
              (
                  'await projected.click();',
                  'const projectedBox = await projected.boundingBox();\n  assert.ok(projectedBox, `${direction} projected label bounding box required`);\n  const tapX = projectedBox.x + projectedBox.width / 2;\n  const tapY = projectedBox.y + projectedBox.height / 2;\n  await page.mouse.move(tapX, tapY);\n  await page.mouse.down();\n  await page.mouse.up();'
              )
          ]

          for old, new in replacements:
              count = script.count(old)
              if count != 1:
                  raise SystemExit(f'CP4_VERIFIER_REPLACEMENT_INVALID:{count}:{old[:100]}')
              script = script.replace(old, new, 1)

          Path('/tmp/cp4/run.mjs').write_text(script)
          PY
          node --check /tmp/cp4/run.mjs

      - name: Check out corrected Laws candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/laws-fifth-test-star-reversible-admissibility-cp1-001
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Verify bounded corrected candidate
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          base=343b0c269dd343a57c6ecb7e785141134cc5660f
          checkpoint3=8607693d75fffed5a8a85c42b8fdc28fff0b0554
          marker='el.style.setProperty("transform","translate(-50%, -50%)","important")'
          grep -Fq "$marker" laws/index.interactions.js
          git merge-base --is-ancestor "$base" HEAD
          git merge-base --is-ancestor "$checkpoint3" HEAD
          test "$(git rev-list --count "$checkpoint3"..HEAD)" = "2"
          git diff --name-only "$base"...HEAD | sort > /tmp/cp4-paths.txt
          cat > /tmp/cp4-expected-paths.txt <<'EOF'
          laws/index.controller.js
          laws/index.crystals.js
          laws/index.css
          laws/index.html
          laws/index.interactions.js
          laws/research/index.html
          laws/test/index.html
          EOF
          diff -u /tmp/cp4-expected-paths.txt /tmp/cp4-paths.txt
          test "$(git diff --name-only "$checkpoint3"...HEAD)" = "laws/index.interactions.js"
          node --check laws/index.controller.js
          node --check laws/index.interactions.js
          node --check laws/index.crystals.js
          git diff --check "$base"...HEAD
          test -z "$(find .github/workflows -maxdepth 1 -type f -name '*cp4*' -print 2>/dev/null || true)"
          echo "CORRECTED_CANDIDATE_HEAD=$(git rev-parse HEAD)"

      - name: Install Chromium execution harness
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/cp4
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Execute complete desktop and mobile corridor
        shell: bash
        env:
          CP4_BASE_URL: http://127.0.0.1:4173
          CP4_BASE_MAIN: 343b0c269dd343a57c6ecb7e785141134cc5660f
          CP4_EVIDENCE_DIR: ${{ github.workspace }}/cp4-evidence-v5
        run: |
          set -euo pipefail
          cd candidate
          export CP4_CANDIDATE_HEAD="$(git rev-parse HEAD)"
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cp4-server-v5.log 2>&1 &
          server_pid=$!
          trap 'kill ${server_pid} 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/laws/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/laws/ >/dev/null
          cd /tmp/cp4
          node run.mjs

      - name: Record corrected source identities
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cp4-evidence-v5
          cd candidate
          {
            echo "CANDIDATE_HEAD=$(git rev-parse HEAD)"
            echo "BASE_MAIN=343b0c269dd343a57c6ecb7e785141134cc5660f"
            echo "CHECKPOINT_3_HEAD=8607693d75fffed5a8a85c42b8fdc28fff0b0554"
            for path in \
              laws/index.html \
              laws/index.controller.js \
              laws/index.interactions.js \
              laws/index.crystals.js \
              laws/index.css \
              laws/test/index.html \
              laws/research/index.html; do
              printf '%s\t%s\t%s\n' "$path" "$(git hash-object "$path")" "$(wc -c < "$path" | tr -d ' ')"
            done
          } > ../cp4-evidence-v5/source-identities.tsv
          cp /tmp/cp4-server-v5.log ../cp4-evidence-v5/server.log || true
          git status --short --untracked-files=all > ../cp4-evidence-v5/candidate-worktree-status.txt

      - name: Upload Checkpoint 4 evidence v5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laws-six-node-cp4-browser-evidence-v5
          path: cp4-evidence-v5
          if-no-files-found: error
          retention-days: 30
