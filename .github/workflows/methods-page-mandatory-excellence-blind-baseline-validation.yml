name: Methods page mandatory excellence blind baseline

on:
  push:
    branches:
      - repair/methods-page-excellence-post-merge-validation-v1-001
      - main
    paths:
      - '.github/workflows/methods-page-mandatory-excellence-blind-baseline-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/methods-page-mandatory-excellence-blind-baseline-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: methods-page-excellence-post-merge-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  RATIFICATION_MERGE: 28f4e20050f08801311c841203120d0db56c446e
  SOURCE_ACTIVATION_MERGE: b0624bdab274e38ca1d596c5b8307ac56cb2a962
  SOURCE_CANDIDATE_HEAD: bdd68f3ac32e232331d29e8e849d9e4eb1b34241
  SOURCE_FINGERPRINT: b9cb2ec247338040fcf455c8e5d9a7e4e5b6c6af1ade5da337e752b7138cfda9
  REPAIR_OPERATION_ID: METHODS_PAGE_EXCELLENCE_RATIFICATION_POST_MERGE_VALIDATION_HARNESS_REPAIR_v1
  REPAIR_LOCK_SCOPE: PAGE_EXCELLENCE_TOOLCHAIN:RATIFICATION_POST_MERGE_VALIDATION_HARNESS_REPAIR:V1
  REPAIR_LOCK_GENERATION: '255'
  REPAIR_INTAKE_RUN: '31041976643'
  REPAIR_INTAKE_COMMIT: 1e764a7edda42fd878165a2339a68dc501547037
  WORKFLOW_PATH: .github/workflows/methods-page-mandatory-excellence-blind-baseline-validation.yml
  SUBJECT_HEAD: 2044e7ab5d27af7bcfbd477a6c3ee046549744ed
  PACKAGING_HEAD: 6c9f32d4ea13905b87f3519f9c18c425ae0e449c
  CANDIDATE_ROOT: control-plane/methods-information-benchmark/page-implementation-candidate-v1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact one-path harness repair
        run: |
          git merge-base --is-ancestor "$RATIFICATION_MERGE" HEAD
          test "$(git diff --name-only "$RATIFICATION_MERGE" HEAD -- .github/ai-router/page-excellence-toolchain | wc -l)" -eq 0

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            mapfile -t changed < <(git diff --name-only HEAD^1 HEAD | sort)
          else
            mapfile -t changed < <(git diff --name-only "$RATIFICATION_MERGE" HEAD | sort)
          fi

          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$WORKFLOW_PATH"

      - name: Revalidate permanently ratified state
        run: |
          mkdir -p artifacts

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const readme = fs.readFileSync(
            '.github/ai-router/page-excellence-toolchain/README.md',
            'utf8'
          );
          const bundle = JSON.parse(fs.readFileSync(
            '.github/ai-router/page-excellence-toolchain/toolset.bundle.v1.json',
            'utf8'
          ));
          const receipt = JSON.parse(fs.readFileSync(
            '.github/ai-router/page-excellence-toolchain/permanent-ratification.v1.json',
            'utf8'
          ));

          const contextual = bundle.instrumentRegistry?.instruments?.find(
            instrument => instrument.id === 'contextualArchitectureConformanceInstrument'
          );

          const pass =
            readme.includes('Status: `RATIFIED_ACTIVE_FAIL_CLOSED`') &&
            bundle.status === 'ACTIVE_VERSION_BOUND' &&
            bundle.version === '1.1.0' &&
            bundle.entrypoint?.status === 'RATIFIED_ACTIVE_FAIL_CLOSED' &&
            bundle.universalStandard?.status === 'RATIFIED_ACTIVE_MANDATORY' &&
            bundle.instrumentRegistry?.requiredInstrumentCount === 9 &&
            bundle.instrumentRegistry?.instruments?.length === 9 &&
            contextual?.status === 'ACTIVE_VERSION_BOUND' &&
            bundle.ratification?.status === 'RATIFIED_ACTIVE_FAIL_CLOSED' &&
            receipt.status === 'RATIFIED_ACTIVE_FAIL_CLOSED' &&
            receipt.sourcePullRequest === 613 &&
            receipt.exactActivatedCandidateHead === process.env.SOURCE_CANDIDATE_HEAD &&
            receipt.exactActivationMergeCommit === process.env.SOURCE_ACTIVATION_MERGE &&
            receipt.authorityBoundary?.namedAwardReadinessCreated === false &&
            receipt.authorityBoundary?.productMutationAuthorized === false &&
            receipt.authorityBoundary?.publicPageMutationAuthorized === false &&
            receipt.authorityBoundary?.visualSubjectMutationAuthorized === false;

          if (!pass) process.exit(1);
          NODE

          node .github/ai-router/page-excellence-toolchain/self-test.v1.mjs \
            --holder post-merge-validation \
            --output /tmp/self-test.json

          node .github/ai-router/page-excellence-toolchain/page-operation-entry-gate.v1.mjs \
            --self-test > /tmp/gate-self-test.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const self = JSON.parse(fs.readFileSync('/tmp/self-test.json', 'utf8'));
          const gate = JSON.parse(fs.readFileSync('/tmp/gate-self-test.json', 'utf8'));

          const pass =
            self.result === 'PASS' &&
            self.normalizedFingerprint === process.env.SOURCE_FINGERPRINT &&
            gate.result === 'PASS';

          const receipt = {
            schema: 'PAGE_EXCELLENCE_POST_MERGE_VALIDATION_REPAIR_RECEIPT_v1',
            result: pass ? 'PASS' : 'FAIL',
            ratificationMerge: process.env.RATIFICATION_MERGE,
            ratifiedToolsetVersion: '1.1.0',
            ratifiedInstrumentCount: 9,
            sourceToolchainFingerprint: self.normalizedFingerprint,
            gateResult: gate.result,
            exactChangedPathCount: 1,
            exactChangedPath: process.env.WORKFLOW_PATH,
            productMutationPerformed: false,
            publicPageMutationPerformed: false,
            visualSubjectMutationPerformed: false,
            namedAwardReadinessCreated: false
          };

          fs.writeFileSync(
            'artifacts/page-excellence-post-merge-validation-repair.v1.json',
            JSON.stringify(receipt, null, 2) + '\n'
          );

          if (!pass) process.exit(1);
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: page-excellence-post-merge-validation
          path: artifacts/page-excellence-post-merge-validation-repair.v1.json
          if-no-files-found: error
          retention-days: 90

  reproduce:
    needs: validate
    strategy:
      matrix:
        holder: [builder, fresh-verifier]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Reproduce ratified-state fingerprint
        env:
          HOLDER: ${{ matrix.holder }}
        run: |
          mkdir -p artifacts

          node .github/ai-router/page-excellence-toolchain/self-test.v1.mjs \
            --holder "$HOLDER" \
            --output /tmp/self-test.json

          node .github/ai-router/page-excellence-toolchain/page-operation-entry-gate.v1.mjs \
            --self-test > /tmp/gate-self-test.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const holder = process.env.HOLDER;
          const bundle = JSON.parse(fs.readFileSync(
            '.github/ai-router/page-excellence-toolchain/toolset.bundle.v1.json',
            'utf8'
          ));
          const ratification = JSON.parse(fs.readFileSync(
            '.github/ai-router/page-excellence-toolchain/permanent-ratification.v1.json',
            'utf8'
          ));
          const self = JSON.parse(fs.readFileSync('/tmp/self-test.json', 'utf8'));
          const gate = JSON.parse(fs.readFileSync('/tmp/gate-self-test.json', 'utf8'));

          const stable = value =>
            Array.isArray(value)
              ? value.map(stable)
              : value && typeof value === 'object'
                ? Object.fromEntries(
                    Object.keys(value).sort().map(key => [key, stable(value[key])])
                  )
                : value;

          const domain = stable({
            ratificationMerge: process.env.RATIFICATION_MERGE,
            ratifiedToolsetVersion: bundle.version,
            ratifiedInstrumentCount: bundle.instrumentRegistry.requiredInstrumentCount,
            ratifiedStatuses: ratification.ratifiedStatuses,
            sourceToolchainFingerprint: self.normalizedFingerprint,
            repairPath: process.env.WORKFLOW_PATH,
            validationResults: {
              toolchain: self.result,
              pageOperationGate: gate.result
            },
            authorityBoundaries: ratification.authorityBoundary
          });

          const normalizedFingerprint = crypto
            .createHash('sha256')
            .update(JSON.stringify(domain))
            .digest('hex');

          const pass =
            self.result === 'PASS' &&
            gate.result === 'PASS' &&
            self.normalizedFingerprint === process.env.SOURCE_FINGERPRINT;

          const output = {
            schema: 'PAGE_EXCELLENCE_POST_MERGE_VALIDATION_REPRODUCTION_RECEIPT_v1',
            holder,
            result: pass ? 'PASS' : 'FAIL',
            normalizedFingerprint,
            sourceToolchainFingerprint: self.normalizedFingerprint,
            ratifiedToolsetVersion: bundle.version,
            ratifiedInstrumentCount: bundle.instrumentRegistry.requiredInstrumentCount,
            productMutationPerformed: false,
            publicPageMutationPerformed: false,
            visualSubjectMutationPerformed: false
          };

          fs.writeFileSync(
            `artifacts/page-excellence-post-merge-${holder}.v1.json`,
            JSON.stringify(output, null, 2) + '\n'
          );

          if (!pass) process.exit(1);
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: page-excellence-post-merge-${{ matrix.holder }}
          path: artifacts/page-excellence-post-merge-${{ matrix.holder }}.v1.json
          if-no-files-found: error
          retention-days: 90

  independent:
    needs: reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: page-excellence-post-merge-builder
          path: receipts/builder

      - uses: actions/download-artifact@v4
        with:
          name: page-excellence-post-merge-fresh-verifier
          path: receipts/fresh-verifier

      - name: Compare independent reproduction
        run: |
          mkdir -p artifacts

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const builder = JSON.parse(fs.readFileSync(
            'receipts/builder/page-excellence-post-merge-builder.v1.json',
            'utf8'
          ));
          const verifier = JSON.parse(fs.readFileSync(
            'receipts/fresh-verifier/page-excellence-post-merge-fresh-verifier.v1.json',
            'utf8'
          ));

          const pass =
            builder.result === 'PASS' &&
            verifier.result === 'PASS' &&
            builder.normalizedFingerprint === verifier.normalizedFingerprint &&
            builder.sourceToolchainFingerprint === process.env.SOURCE_FINGERPRINT &&
            verifier.sourceToolchainFingerprint === process.env.SOURCE_FINGERPRINT;

          const output = {
            schema: 'PAGE_EXCELLENCE_POST_MERGE_VALIDATION_INDEPENDENT_RECEIPT_v1',
            result: pass ? 'PASS' : 'FAIL',
            exactNormalizedEquality: pass,
            builderFingerprint: builder.normalizedFingerprint,
            freshVerifierFingerprint: verifier.normalizedFingerprint,
            sourceToolchainFingerprint: builder.sourceToolchainFingerprint,
            ratifiedToolsetVersion: '1.1.0',
            ratifiedInstrumentCount: 9,
            constructionAuthorityTerminated: false,
            productMutationPerformed: false,
            publicPageMutationPerformed: false,
            visualSubjectMutationPerformed: false
          };

          fs.writeFileSync(
            'artifacts/page-excellence-post-merge-independent.v1.json',
            JSON.stringify(output, null, 2) + '\n'
          );

          if (!pass) process.exit(1);
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: page-excellence-post-merge-independent
          path: artifacts/page-excellence-post-merge-independent.v1.json
          if-no-files-found: error
          retention-days: 90

  terminal-closure:
    if: github.event_name == 'pull_request'
    needs: independent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: page-excellence-post-merge-independent
          path: incoming

      - name: Close operation lock and terminate temporary authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          closed=false

          for attempt in {1..8}; do
            set +e
            node tools/operation-intake/repository-operation-lock-manager.v1.mjs \
              --action close \
              --repository "${{ github.repository }}" \
              --lock-ref refs/heads/operation-locks/repository-operation-intake-v1 \
              --operation-id "$REPAIR_OPERATION_ID" \
              --lock-scope "$REPAIR_LOCK_SCOPE" \
              --lock-generation "$REPAIR_LOCK_GENERATION" \
              --terminal-disposition PASS_CLOSED \
              --output /tmp/closure.json
            status=$?
            set -e

            if [[ "$status" -eq 0 ]]; then
              closed=true
              break
            fi

            if [[ "$status" -ne 4 ]]; then
              cat /tmp/closure.json
              exit "$status"
            fi

            sleep $((attempt * 2))
          done

          test "$closed" = true

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const base = JSON.parse(fs.readFileSync(
            'incoming/page-excellence-post-merge-independent.v1.json',
            'utf8'
          ));
          const closure = JSON.parse(fs.readFileSync('/tmp/closure.json', 'utf8'));

          const pass =
            base.result === 'PASS' &&
            closure.result === 'TERMINAL_CLOSURE_COMMITTED' &&
            closure.lockReleased === true &&
            closure.operationId === process.env.REPAIR_OPERATION_ID &&
            closure.lockGeneration === Number(process.env.REPAIR_LOCK_GENERATION);

          const output = {
            ...base,
            result: pass ? 'PASS' : 'FAIL',
            canonicalIntake: {
              workflowRun: Number(process.env.REPAIR_INTAKE_RUN),
              acquisitionCommitSha: process.env.REPAIR_INTAKE_COMMIT,
              lockGeneration: Number(process.env.REPAIR_LOCK_GENERATION)
            },
            closure,
            constructionAuthorityTerminated: pass,
            exactHeadMergeAuthorized: pass,
            productMutationAuthorized: false,
            publicPageMutationAuthorized: false,
            visualSubjectMutationAuthorized: false
          };

          fs.writeFileSync(
            'artifacts/page-excellence-post-merge-final.v1.json',
            JSON.stringify(output, null, 2) + '\n'
          );

          if (!pass) process.exit(1);
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: page-excellence-post-merge-final
          path: artifacts/page-excellence-post-merge-final.v1.json
          if-no-files-found: error
          retention-days: 90

  main-proof:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: independent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: page-excellence-post-merge-independent
          path: incoming

      - name: Emit final ratified-main verification
        run: |
          mkdir -p artifacts

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const base = JSON.parse(fs.readFileSync(
            'incoming/page-excellence-post-merge-independent.v1.json',
            'utf8'
          ));

          if (base.result !== 'PASS' || base.exactNormalizedEquality !== true) {
            process.exit(1);
          }

          const output = {
            schema: 'PAGE_EXCELLENCE_MAIN_RATIFICATION_VERIFICATION_RECEIPT_v1',
            result: 'PASS',
            mainHead: process.env.GITHUB_SHA,
            ratificationMerge: process.env.RATIFICATION_MERGE,
            toolsetVersion: '1.1.0',
            mandatoryInstrumentCount: 9,
            contextualArchitectureConformanceInstrument: 'ACTIVE_VERSION_BOUND',
            sourceToolchainFingerprint: base.sourceToolchainFingerprint,
            builderFingerprint: base.builderFingerprint,
            freshVerifierFingerprint: base.freshVerifierFingerprint,
            exactNormalizedEquality: true,
            permanentRatificationEffective: true,
            postMergeValidationPass: true,
            productMutationPerformed: false,
            publicPageMutationPerformed: false,
            visualSubjectMutationPerformed: false,
            namedAwardReadinessCreated: false
          };

          fs.writeFileSync(
            'artifacts/page-excellence-main-ratification.v1.json',
            JSON.stringify(output, null, 2) + '\n'
          );
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: page-excellence-main-ratification
          path: artifacts/page-excellence-main-ratification.v1.json
          if-no-files-found: error
          retention-days: 90

  blind-evaluation:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    strategy:
      matrix:
        holder: [builder, fresh-verifier]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: toolchain

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PACKAGING_HEAD }}
          fetch-depth: 0
          path: subject

      - name: Reproduce immutable package and execute browser matrix
        run: |
          cd subject

          test "$(git diff --name-only "$SUBJECT_HEAD" "$PACKAGING_HEAD" | wc -l)" -eq 1
          test "$(git diff --name-only "$SUBJECT_HEAD" "$PACKAGING_HEAD")" = \
            "$CANDIDATE_ROOT/state-schema.v1.json"

          cd "$CANDIDATE_ROOT"
          node validate.mjs > /tmp/static.json
          node -e "const r=require('/tmp/static.json');if(r.result!=='PASS'||r.checks.length!==30)process.exit(1)"
          cd "$GITHUB_WORKSPACE/toolchain"

          npm init -y >/dev/null
          npm install --no-save playwright @axe-core/playwright
          npx playwright install --with-deps chromium firefox webkit

          mkdir -p artifacts
          python3 -m http.server 4173 \
            --bind 127.0.0.1 \
            --directory "$GITHUB_WORKSPACE/subject/$CANDIDATE_ROOT/candidate" \
            >/tmp/server.log 2>&1 &

          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break
            sleep 1
          done

          node .github/ai-router/page-excellence-toolchain/blind-evaluator.v1.mjs \
            --baseUrl http://127.0.0.1:4173/index.html \
            --subjectDir "$GITHUB_WORKSPACE/subject/$CANDIDATE_ROOT" \
            --subjectHead "$SUBJECT_HEAD" \
            --packagingHead "$PACKAGING_HEAD" \
            --holder "${{ matrix.holder }}" \
            --browsers chromium,firefox,webkit \
            --toolsetBundle .github/ai-router/page-excellence-toolchain/toolset.bundle.v1.json \
            --output "artifacts/${{ matrix.holder }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: methods-page-blind-${{ matrix.holder }}
          path: toolchain/artifacts/${{ matrix.holder }}.json
          if-no-files-found: error
          retention-days: 30
