          git diff --check

          test "$(git diff --name-only 0bf5bcd63132d92fa6a4758a4f57ef2a6f524038 | tr '\n' ',' | sed 's/,$//')" = "laws/index.controller.js,laws/index.crystals.js,laws/index.css,laws/index.html,laws/index.interactions.js,laws/research/index.html,laws/test/index.html"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add laws/index.controller.js laws/index.crystals.js laws/index.css laws/index.html laws/index.interactions.js laws/research/index.html laws/test/index.html
          git commit -m "Restore Laws crystal registry finalization"
          git push --force-with-lease origin HEAD:agent/laws-celestial-gateway-auxiliary-clusters-cp2-001

          echo "REPAIRED_CANDIDATE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
