name: Laws Carousel V4 Live Proof

on:
  push:
    branches: [main]
    paths:
      - 'laws/index.html'
      - 'laws/index.destination-carousel.js'
      - 'laws/index.mobile-background-tabs.js'
      - '.github/workflows/laws-carousel-v4-live-proof.yml'

permissions:
  contents: read

jobs:
  live-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public Laws V4 delivery
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            stamp="${GITHUB_SHA}-${attempt}"
            html="$(curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "https://diamondgatebridge.com/laws/?v4-proof=${stamp}" || true)"
            bootstrap="$(curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "https://diamondgatebridge.com/laws/index.mobile-background-tabs.js?v=LAWS_DESTINATION_STAGE_LIVE_20260816C&v4-proof=${stamp}" || true)"
            runtime="$(curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "https://diamondgatebridge.com/laws/index.destination-carousel.js?v=LAWS_DESTINATION_CAROUSEL_RUNTIME_V4_20260816A&v4-proof=${stamp}" || true)"

            if grep -q 'LAWS_DESTINATION_STAGE_LIVE_20260816C' <<<"$html" \
              && grep -q 'LAWS_DESTINATION_CAROUSEL_RUNTIME_V4_20260816A' <<<"$bootstrap" \
              && grep -q 'LAWS_DESTINATION_CAROUSEL_RUNTIME_v4' <<<"$runtime" \
              && grep -q 'oneGestureOneStep: true' <<<"$runtime" \
              && grep -q 'Return to Orbit' <<<"$runtime"; then
              echo 'LIVE_LAWS_CAROUSEL_V4_VERIFIED'
              echo "attempt=$attempt"
              exit 0
            fi

            echo "Public V4 delivery not settled yet; attempt $attempt/30"
            sleep 10
          done
          echo 'LIVE_LAWS_CAROUSEL_V4_NOT_VERIFIED' >&2
          exit 1
