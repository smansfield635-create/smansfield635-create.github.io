name: Laws FIRST verifier sequence reconciliation once

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - '.github/workflows/laws-first-verifier-sequence-reconciliation-once.yml'

permissions:
  contents: write

jobs:
  reconcile-verifier-sequence:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - name: Check out exact correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/laws-first-indicator-cache-bust-001
          fetch-depth: 0

      - name: Reconcile readiness and visual settlement waits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readiness = """async function waitForRuntimeReady(page) {
            await page.waitForFunction(() => {
              const root = document.querySelector('[data-laws-root]');
              return Boolean(globalThis.DGB_LAWS_EXPERIENCE && globalThis.DGB_LAWS_CONTROLLER) &&
                root?.dataset.lawsControllerStatus === 'ready' &&
                root?.dataset.lawsInteractionsStatus === 'ready';
            });
          }

          """.replace('          ', '')

          new_path = Path('scripts/verify-laws-first-rail-architecture.mjs')
          new_text = new_path.read_text()
          new_marker = "async function ensureConstellation(page) {"
          if 'async function waitForRuntimeReady(page)' not in new_text:
              if new_marker not in new_text:
                  raise SystemExit('new verifier ensureConstellation marker not found')
              new_text = new_text.replace(new_marker, readiness + new_marker, 1)

          old_select = """async function select(page, direction) {
            await ensureConstellation(page);
            await page.evaluate((next) => {
          """.replace('          ', '')
          new_select = """async function select(page, direction) {
            await ensureConstellation(page);
            await page.waitForFunction(() => document.querySelector('[data-laws-root]')?.dataset.lawsControllerState === 'CONSTELLATION');
            await page.waitForTimeout(120);
            await page.evaluate((next) => {
          """.replace('          ', '')
          if old_select in new_text:
              new_text = new_text.replace(old_select, new_select, 1)
          elif new_select not in new_text:
              raise SystemExit('new verifier select marker not found')

          old_ready = "await page.waitForFunction(() => Boolean(globalThis.DGB_LAWS_EXPERIENCE && globalThis.DGB_LAWS_CONTROLLER));"
          ready_count = new_text.count(old_ready)
          if ready_count not in (0, 2):
              raise SystemExit(f'expected 0 or 2 new-verifier global readiness waits, found {ready_count}')
          new_text = new_text.replace(old_ready, 'await waitForRuntimeReady(page);')
          new_path.write_text(new_text)

          legacy_path = Path('scripts/verify-laws-first-indicator-restoration.mjs')
          legacy_text = legacy_path.read_text()
          legacy_marker = "async function openFirstDisclosure(page) {"
          if 'async function waitForRuntimeReady(page)' not in legacy_text:
              if legacy_marker not in legacy_text:
                  raise SystemExit('legacy verifier disclosure marker not found')
              legacy_text = legacy_text.replace(legacy_marker, readiness + legacy_marker, 1)

          function_start = legacy_text.index('async function selectDirection(page, direction) {')
          if function_start < 0:
              raise SystemExit('legacy selectDirection start not found')
          snapshot_start = legacy_text.index('\nasync function snapshotIndicators', function_start)
          if snapshot_start < 0:
              raise SystemExit('legacy snapshot boundary not found')
          function_text = legacy_text[function_start:snapshot_start]
          style_wait_start = function_text.index("  await page.waitForFunction(\n    (nextDirection) => {\n      const records = Array.from(document.querySelectorAll('.laws-first__question-grid [data-laws-experience-question]'));\n      if (records.length !== 5) return false;")
          if style_wait_start < 0:
              if 'await page.waitForTimeout(260);' not in function_text:
                  raise SystemExit('legacy style-settlement wait start not found')
          else:
              style_wait_end = function_text.index('\n  );\n}', style_wait_start)
              if style_wait_end < 0:
                  raise SystemExit('legacy style-settlement wait end not found')
              style_wait_end += len('\n  );')
              replacement = """  await page.waitForFunction(
                (nextDirection) => {
                  const records = Array.from(document.querySelectorAll('.laws-first__question-grid [data-laws-experience-question]'));
                  return records.length === 5 && records.every((record) => {
                    const active = record.dataset.lawsExperienceActive === 'true';
                    const expectedActive = record.dataset.lawsExperienceQuestion === nextDirection;
                    return active === expectedActive;
                  });
                },
                direction
              );
              await page.waitForTimeout(260);""".replace('              ', '')
              function_text = function_text[:style_wait_start] + replacement + function_text[style_wait_end:]
              legacy_text = legacy_text[:function_start] + function_text + legacy_text[snapshot_start:]

          legacy_ready = "await page.waitForFunction(() => Boolean(globalThis.DGB_LAWS_EXPERIENCE && globalThis.DGB_LAWS_CONTROLLER));"
          legacy_count = legacy_text.count(legacy_ready)
          if legacy_count not in (0, 2):
              raise SystemExit(f'expected 0 or 2 legacy global readiness waits, found {legacy_count}')
          legacy_text = legacy_text.replace(legacy_ready, 'await waitForRuntimeReady(page);')
          legacy_path.write_text(legacy_text)
          PY

      - name: Commit verifier-only reconciliation
        shell: bash
        run: |
          git add scripts/verify-laws-first-rail-architecture.mjs scripts/verify-laws-first-indicator-restoration.mjs
          git config user.name "laws-first-verifier-sequence-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Reconcile FIRST verifier readiness and settlement sequence"
          git push origin HEAD:agent/laws-first-indicator-cache-bust-001
