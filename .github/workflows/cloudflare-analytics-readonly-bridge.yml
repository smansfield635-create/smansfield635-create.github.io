name: Cloudflare Analytics Read-Only Bridge

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cloudflare-analytics-readonly-bridge.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
    steps:
      - name: Require analytics token
        shell: bash
        run: |
          test -n "$CF_TOKEN" || { echo "CLOUDFLARE_ANALYTICS_TOKEN is missing"; exit 1; }

      - name: Collect read-only Cloudflare Web Analytics
        shell: python
        run: |
          import json, os, urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          endpoint = "https://api.cloudflare.com/client/v4/graphql"
          token = os.environ["CF_TOKEN"]
          now = datetime.now(timezone.utc).replace(microsecond=0)
          start = now - timedelta(days=7)

          def gql(query, variables=None):
              body = json.dumps({"query": query, "variables": variables or {}}).encode()
              req = urllib.request.Request(endpoint, data=body, method="POST",
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json", "Accept": "application/json"})
              with urllib.request.urlopen(req, timeout=45) as r:
                  return json.load(r)

          # Web Analytics/RUM is account-scoped. Introspection lets the API tell us
          # the exact account filter and RUM field shapes instead of hard-coding a zone.
          schema = gql("""
          query BridgeSchema {
            viewerType: __type(name: "Viewer") {
              fields { name args { name type { kind name ofType { kind name } } } type { kind name ofType { kind name } } }
            }
          }
          """)
          if schema.get("errors"):
              raise SystemExit("Cloudflare GraphQL introspection failed: " + json.dumps(schema["errors"]))

          fields = schema.get("data", {}).get("viewerType", {}).get("fields", [])
          account_field = next((x for x in fields if x.get("name") == "accounts"), None)
          if not account_field:
              raise SystemExit("Cloudflare schema did not expose viewer.accounts.")

          # Query all account-visible RUM page-load data and filter to the actual host.
          # Cloudflare account filters accept accountTag; the token is account-owned,
          # so discover the tag via a minimal account query using the known account owner scope.
          probe = gql("""
          query AccountProbe {
            viewer {
              accounts(filter: {}) { accountTag }
            }
          }
          """)
          if probe.get("errors"):
              raise SystemExit("Account discovery failed: " + json.dumps(probe["errors"]))
          accounts = probe.get("data", {}).get("viewer", {}).get("accounts", [])
          if not accounts:
              raise SystemExit("No Cloudflare account was visible to the analytics token.")

          query = """
          query RUMBridge($accountTag: string, $start: Time, $end: Time) {
            viewer {
              accounts(filter: {accountTag: $accountTag}) {
                pages: rumPageloadEventsAdaptiveGroups(
                  limit: 5000
                  orderBy: [datetimeHour_ASC]
                  filter: {
                    datetime_geq: $start
                    datetime_lt: $end
                    host: "diamondgatebridge.com"
                  }
                ) {
                  count
                  dimensions { datetimeHour path }
                }
              }
            }
          }
          """
          out = {"schema":"DGB_CLOUDFLARE_RUM_BRIDGE_V2","generatedAt":now.isoformat().replace("+00:00","Z"),
                 "window":{"start":start.isoformat().replace("+00:00","Z"),"end":now.isoformat().replace("+00:00","Z")},"accounts":[]}
          for a in accounts:
              tag=a["accountTag"]
              res=gql(query,{"accountTag":tag,"start":out["window"]["start"],"end":out["window"]["end"]})
              out["accounts"].append({"accountTag":tag,"response":res})
          Path("analytics-bridge").mkdir()
          Path("analytics-bridge/latest.json").write_text(json.dumps(out,indent=2)+"\n")
          Path("analytics-bridge/status.txt").write_text(f"PASS\nschema={out['schema']}\ngeneratedAt={out['generatedAt']}\naccounts={len(out['accounts'])}\n")
          print(f"Collected Web Analytics probe for {len(out['accounts'])} account(s); token value was never printed.")

      - name: Upload private workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-analytics-latest
          path: analytics-bridge/
          retention-days: 30
          if-no-files-found: error
