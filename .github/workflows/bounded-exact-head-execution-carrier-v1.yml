name: Bounded Exact-Head Execution Carrier v1

on:
  push:
    branches:
      - agent/bounded-exact-head-execution-carrier-v1-003
    paths:
      - '.github/ai-router/router.v1.json'
      - '.github/ai-router/execution-backends.v1.json'
      - '.github/ai-router/system-continuity/gap-registry.v1.json'
      - '.github/ai-router/bounded-exact-head-execution-carrier/**'
      - '.github/workflows/bounded-exact-head-execution-carrier-v1.yml'
  pull_request:
    paths:
      - '.github/ai-router/router.v1.json'
      - '.github/ai-router/execution-backends.v1.json'
      - '.github/ai-router/system-continuity/gap-registry.v1.json'
      - '.github/ai-router/bounded-exact-head-execution-carrier/**'
      - '.github/workflows/bounded-exact-head-execution-carrier-v1.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  verify-candidate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      REPAIR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      ADMITTED_BASE: 26d90c2a69478afaf8aa9dcab91b6dd95f2e2910
      TARGET_PR902_HEAD: 8d439625c0aa12a1bd85da7c1b933c4609193f8c
      TARGET_GEN1060_SCOPE_HASH: eb5c68248aa1be53ad4d54311e95588cf0a7c206bc3302787736487d47991a4a
      REPAIR_GEN1071_SCOPE_HASH: 9e2a82b25e6a8aa670f8b3fb30516147d33b8fd55cf79768c52d88fb7d7bf6f0
      TARGET_ARTIFACT_ID: '9090960409'
      TARGET_ARTIFACT_DIGEST: sha256:1db574c5ebb51fedd4458f57055f23a73cd2bddd0a0f66f6a5b8f433f10fb952
    steps:
      - name: Check out exact repair candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REPAIR_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact repair head, one-path scope, and preserved issue-comment route
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "$REPAIR_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mapfile -t changed < <(git diff --name-only "$ADMITTED_BASE" "$REPAIR_HEAD")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/bounded-exact-head-execution-carrier-v1.yml'
          git show "$ADMITTED_BASE:.github/workflows/bounded-exact-head-execution-carrier-v1.yml" > "$RUNNER_TEMP/base-workflow.yml"
          node - <<'NODE'
          const fs=require('fs');
          const base=fs.readFileSync(process.env.RUNNER_TEMP+'/base-workflow.yml','utf8');
          const current=fs.readFileSync('.github/workflows/bounded-exact-head-execution-carrier-v1.yml','utf8');
          const marker='  execute-registered-command:\n';
          const b=base.indexOf(marker), c=current.indexOf(marker);
          if(b<0||c<0||base.slice(b)!==current.slice(c)) process.exit(1);
          const legacyEnv=['GEN','839_SUCCESSOR_RECEIPT_B64'].join('');
          const legacyOp=['BOUNDED_EXACT_HEAD_EXECUTION_CARRIER','_V1_INSTALLATION_20260809_002_SUCCESSOR_001'].join('');
          if(current.includes(legacyEnv)||current.includes(legacyOp)) process.exit(1);
          NODE
          printf '%s\n' '.github/workflows/bounded-exact-head-execution-carrier-v1.yml' > "$RUNNER_TEMP/scope-diff.txt"

      - name: Verify terminal Gen1060 and active Gen1071 identities
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/operation-locks/repository-operation-intake-v1:refs/remotes/origin/operation-locks/repository-operation-intake-v1
          git show refs/remotes/origin/operation-locks/repository-operation-intake-v1:.github/operation-intake/active-operation-ledger.v1.json > "$RUNNER_TEMP/canonical-ledger.json"
          node - <<'NODE'
          const fs=require('fs');
          const ledger=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/canonical-ledger.json','utf8'));
          const repair=ledger.activeScopes?.[process.env.REPAIR_GEN1071_SCOPE_HASH];
          const okRepair=repair&&repair.operationId==='BROWSER_VERIFICATION_CARRIER_CERTIFICATION_IDENTITY_REPAIR_V1_20260811_002'&&repair.lockGeneration===1071&&repair.governingHead===process.env.ADMITTED_BASE&&repair.state==='ADMITTED_LOCKED'&&repair.released===false&&repair.requestDigest==='3cac718d1226e3a2444ec46a8f72d3c127a2a68cd621a536ea700677b128dbca'&&repair.procedureLocatorDigest==='c4f1a01f8a96d4e281c3e02bbfcad7dc49198ee0bc8441bb3ea30cbe67a61817';
          const matches=[];
          const walk=v=>{
            if(!v||typeof v!=='object') return;
            if(v.operationId==='BOUNDED_EXACT_HEAD_BROWSER_VERIFICATION_CARRIER_EXTENSION_V1_20260810_002'&&v.lockGeneration===1060) matches.push(v);
            if(Array.isArray(v)) v.forEach(walk); else Object.values(v).forEach(walk);
          };
          walk(ledger);
          const target=matches.find(x=>x.scopeHash===process.env.TARGET_GEN1060_SCOPE_HASH&&x.governingHead===process.env.ADMITTED_BASE&&x.released===true&&(x.terminalDisposition==='PASS_CLOSED'||x.state==='TERMINAL'));
          if(!okRepair||!target) process.exit(1);
          fs.writeFileSync(process.env.RUNNER_TEMP+'/gen1060-terminal.json',JSON.stringify(target,null,2)+'\n');
          NODE

      - name: Verify frozen PR 902 head and exact verification artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/infra/bounded-exact-head-browser-verification-carrier-v1-001:refs/remotes/origin/pr902-target
          test "$(git rev-parse refs/remotes/origin/pr902-target^{commit})" = "$TARGET_PR902_HEAD"
          api="https://api.github.com/repos/$GH_REPOSITORY/actions/artifacts/$TARGET_ARTIFACT_ID"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api" > "$RUNNER_TEMP/artifact-metadata.json"
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/artifact-metadata.json','utf8'));
          if(String(a.id)!==process.env.TARGET_ARTIFACT_ID||a.digest!==process.env.TARGET_ARTIFACT_DIGEST||a.expired!==false||a.workflow_run?.head_sha!==process.env.TARGET_PR902_HEAD) process.exit(1);
          NODE
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api/zip" -o "$RUNNER_TEMP/target-artifact.zip"
          mkdir "$RUNNER_TEMP/target-artifact"
          unzip -q "$RUNNER_TEMP/target-artifact.zip" -d "$RUNNER_TEMP/target-artifact"
          test -f "$RUNNER_TEMP/target-artifact/self-test.json"

      - name: Derive and validate native browser-carrier evidence
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p=process.env.RUNNER_TEMP+'/target-artifact/self-test.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          const legacy=r.legacyCarrierSelfTest??{};
          const smoke=r.realBrowserSmoke??{};
          const exact=r.exactCandidateReexecution??{};
          const validSmokeDigest=/^[0-9a-f]{64}$/.test(smoke.screenshotSha256??'');
          const ok=
            r.schema==='BOUNDED_EXACT_HEAD_EXECUTION_CARRIER_SELF_TEST_RECEIPT_v1'&&r.result==='PASS'&&r.passed===54&&r.total===54&&
            r.nativeRegressionPassCount===5&&r.nativeRegressionCount===5&&
            legacy.result==='PASS'&&legacy.passed===35&&legacy.total===35&&legacy.nativeRegressionPassCount===5&&legacy.nativeRegressionCount===5&&
            smoke.result==='PASS'&&smoke.skipped===false&&smoke.browser==='chromium'&&smoke.playwrightVersion==='1.55.0'&&smoke.localhostOnly===true&&smoke.screenshotByteLength>100&&validSmokeDigest&&
            smoke.arbitraryCommandAccepted===false&&smoke.arbitraryUrlAccepted===false&&smoke.callerScriptAccepted===false&&smoke.environmentOverrideAccepted===false&&
            exact.result==='PASS'&&exact.requestedHead===process.env.TARGET_PR902_HEAD&&exact.observedHead===process.env.TARGET_PR902_HEAD&&exact.fixturePassCount===54&&exact.fixtureCount===54&&exact.nativeRegressionPassCount===5&&exact.nativeRegressionCount===5&&exact.workingTreeCleanBeforeAndAfter===true&&
            r.genericBrowserVerificationExecutionClassPresent===true&&r.genericBrowserCallerControlSurfaceClosed===true&&r.browserExactCandidateBindingEnforced===true&&r.browserLocalhostOnlyEnforced===true&&r.authorityInflationObserved===false&&r.arbitraryCommandAccepted===false&&r.callerSuppliedBundleAccepted===false;
          if(!ok) process.exit(1);
          fs.writeFileSync(process.env.RUNNER_TEMP+'/derived-browser-evidence.json',JSON.stringify({
            selfTestResult:r.result,fixturePassCount:r.passed,fixtureCount:r.total,
            legacyFixturePassCount:legacy.passed,legacyFixtureCount:legacy.total,
            nativeRegressionPassCount:r.nativeRegressionPassCount,nativeRegressionCount:r.nativeRegressionCount,
            exactCandidateReexecution:exact,realBrowserSmoke:smoke
          },null,2)+'\n');
          NODE

      - name: Recompute exact one-path repair Router gate
        shell: bash
        run: |
          set -euo pipefail
          worktree="$RUNNER_TEMP/repair-worktree"
          git worktree add --detach "$worktree" "$REPAIR_HEAD"
          (
            cd "$worktree"
            node tools/repository-ai-entry-router.mjs \
              --mutation-intent \
              --path .github/workflows/bounded-exact-head-execution-carrier-v1.yml \
              --task BROWSER_VERIFICATION_CARRIER_CERTIFICATION_IDENTITY_REPAIR_V1_20260811_002 \
              --output "$RUNNER_TEMP/router-receipt.json"
          )
          test -z "$(git -C "$worktree" status --porcelain=v1 --untracked-files=all)"
          git worktree remove --force "$worktree"
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/router-receipt.json','utf8'));
          if(r.disposition!=='PASS'||r.governingHead!==process.env.REPAIR_HEAD||r.routes?.length!==1||r.routes[0]?.path!=='.github/workflows/bounded-exact-head-execution-carrier-v1.yml'||r.routes[0]?.projectId!=='REPOSITORY_AI_ROUTER_INFRASTRUCTURE'||r.routes[0]?.disposition!=='PASS'||r.workingTreeClean!==true) process.exit(1);
          NODE

      - name: Emit fresh Gen1060-bound browser-carrier certification receipt
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'); const p=process.env.RUNNER_TEMP;
          const router=JSON.parse(fs.readFileSync(p+'/router-receipt.json','utf8'));
          const ev=JSON.parse(fs.readFileSync(p+'/derived-browser-evidence.json','utf8'));
          const smoke=ev.realBrowserSmoke;
          const out={
            schema:'BOUNDED_EXACT_HEAD_EXECUTION_CARRIER_VERIFICATION_RECEIPT_v1',
            result:'PASS',
            generation:1060,
            operationId:'BOUNDED_EXACT_HEAD_BROWSER_VERIFICATION_CARRIER_EXTENSION_V1_20260810_002',
            head:process.env.TARGET_PR902_HEAD,
            governingHead:process.env.ADMITTED_BASE,
            lockScope:'REPOSITORY_CONTROL_PLANE:BOUNDED_EXACT_HEAD_EXECUTION_CARRIER:BROWSER_VERIFICATION:V1',
            scopeHash:process.env.TARGET_GEN1060_SCOPE_HASH,
            targetOperationTerminalDisposition:'PASS_CLOSED',
            certificationRouteGeneration:1071,
            certificationRouteOperationId:'BROWSER_VERIFICATION_CARRIER_CERTIFICATION_IDENTITY_REPAIR_V1_20260811_002',
            certificationRouteHead:process.env.REPAIR_HEAD,
            verificationArtifactId:Number(process.env.TARGET_ARTIFACT_ID),
            verificationArtifactDigest:process.env.TARGET_ARTIFACT_DIGEST,
            routerDisposition:router.disposition,
            selfTestResult:ev.selfTestResult,
            selfTestPassed:ev.fixturePassCount,
            selfTestTotal:ev.fixtureCount,
            legacySelfTestPassed:ev.legacyFixturePassCount,
            legacySelfTestTotal:ev.legacyFixtureCount,
            nativeRegressionPassCount:ev.nativeRegressionPassCount,
            nativeRegressionCount:ev.nativeRegressionCount,
            exactCandidateReexecutionResult:ev.exactCandidateReexecution.result,
            realBrowserSmokeResult:smoke.result,
            realBrowserSmokeBrowser:smoke.browser,
            realBrowserSmokePlaywrightVersion:smoke.playwrightVersion,
            realBrowserSmokeScreenshotSha256:smoke.screenshotSha256,
            realBrowserSmokeScreenshotByteLength:smoke.screenshotByteLength,
            historicalGeneration839AuthorityUsed:false,
            issueCommentExecutionRoutePreserved:true,
            carrierFunctionalBytesMutated:false,
            authorityInherited:false,
            arbitraryCommandAuthority:false,
            arbitraryUrlAuthority:false,
            callerScriptAuthority:false,
            environmentOverrideAuthority:false,
            repositoryWriteAuthority:false,
            productAuthority:false,
            semanticAuthority:false
          };
          fs.writeFileSync(p+'/verification.json',JSON.stringify(out,null,2)+'\n');
          NODE
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-exact-head-browser-carrier-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/canonical-ledger.json
            ${{ runner.temp }}/gen1060-terminal.json
            ${{ runner.temp }}/scope-diff.txt
            ${{ runner.temp }}/artifact-metadata.json
            ${{ runner.temp }}/derived-browser-evidence.json
            ${{ runner.temp }}/router-receipt.json
            ${{ runner.temp }}/verification.json
          if-no-files-found: warn
          retention-days: 90

  execute-registered-command:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 578 &&
      github.actor == 'smansfield635-create' &&
      startsWith(github.event.comment.body, 'BOUNDED_EXACT_HEAD_EXECUTION_REQUEST_V1')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out ratified default branch carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse bounded request without shell evaluation
        shell: bash
        env:
          REQUEST_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const marker='BOUNDED_EXACT_HEAD_EXECUTION_REQUEST_V1';
          const body=process.env.REQUEST_BODY ?? '';
          if(!body.startsWith(marker)) process.exit(2);
          const raw=body.slice(marker.length).trim();
          fs.writeFileSync(process.env.RUNNER_TEMP+'/request.json',JSON.stringify(JSON.parse(raw),null,2)+'\n');
          NODE

      - name: Execute registered command through bounded carrier
        id: carrier
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node .github/ai-router/bounded-exact-head-execution-carrier/carrier.v1.mjs \
            --input "$RUNNER_TEMP/request.json" \
            --output "$RUNNER_TEMP/execution-receipt.json"

      - name: Upload bounded execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-exact-head-carrier-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/request.json
            ${{ runner.temp }}/execution-receipt.json
          if-no-files-found: warn
          retention-days: 90

      - name: Return bounded execution receipt
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const p=process.env.RUNNER_TEMP+'/execution-receipt.json';
            let r={schema:'BOUNDED_EXACT_HEAD_EXECUTION_FAILURE_v1',result:'FAIL_CLOSED',errorCode:'EXECUTION_RECEIPT_MISSING'};
            if(fs.existsSync(p)) r=JSON.parse(fs.readFileSync(p,'utf8'));
            const n=r.nativeReceipt??null;
            const projection={schema:r.schema,result:r.result,errorCode:r.errorCode??null,descriptorId:r.descriptorId??null,operationId:r.operationId??null,lockGeneration:r.lockGeneration??null,targetHead:r.targetHead??null,exactHeadVerified:r.exactHeadVerified??false,workingTreeCleanBeforeAndAfter:r.workingTreeCleanBeforeAndAfter??false,nativeReceiptSchema:r.nativeReceiptSchema??n?.schema??null,nativeReceiptDisposition:n?.disposition??null,nativeReceiptDigest:r.nativeReceiptDigest??null,nativeReceiptRewritten:r.nativeReceiptRewritten??null,repositoryWritesPerformed:r.repositoryWritesPerformed??false,arbitraryCommandAuthority:r.arbitraryCommandAuthority??false,semanticAuthorityCreated:r.semanticAuthorityCreated??false};
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:578,body:'BOUNDED_EXACT_HEAD_EXECUTION_RETURN_V1\n```json\n'+JSON.stringify(projection,null,2)+'\n```'});

      - name: Fail closed if carrier execution was nonpass
        if: steps.carrier.outcome != 'success'
        shell: bash
        run: exit 1
