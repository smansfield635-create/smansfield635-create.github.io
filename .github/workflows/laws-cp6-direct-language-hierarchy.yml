name: Laws CP6 direct language and hierarchy

on:
  pull_request:
    paths:
      - 'laws/**'
      - 'tools/laws-cp6-direct-language-hierarchy-*.mjs'
      - '.github/workflows/laws-cp6-direct-language-hierarchy.yml'

permissions:
  contents: write

jobs:
  correct-and-verify:
    if: github.head_ref == 'agent/laws-cp6-direct-language-hierarchy-correction-001'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Fetch exact merged Lane 1 baseline
        run: git fetch origin main --depth=1

      - name: Apply direct product correction
        run: node tools/laws-cp6-direct-language-hierarchy-transform.mjs

      - name: Commit exact product mutation locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add laws/index.html laws/index.css
          if ! git diff --cached --quiet; then
            git commit -m "Correct Laws CP6 language and public hierarchy"
          fi

      - name: Verify JavaScript syntax
        run: |
          node --check tools/laws-cp6-direct-language-hierarchy-transform.mjs
          node --check tools/laws-cp6-direct-language-hierarchy-verify.mjs

      - name: Verify protected custody and source hierarchy
        env:
          EVIDENCE_DIR: cp6-direct-evidence
        run: node tools/laws-cp6-direct-language-hierarchy-verify.mjs static

      - name: Install browser verifier
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve candidate
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/laws-cp6-direct-server.log 2>&1 &
          echo $! > /tmp/laws-cp6-direct-server.pid
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173/laws/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/laws-cp6-direct-server.log
          exit 1

      - name: Verify phone tablet and desktop hierarchy
        env:
          BASE_URL: http://127.0.0.1:4173
          EVIDENCE_DIR: cp6-direct-evidence
        run: node tools/laws-cp6-direct-language-hierarchy-verify.mjs browser

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: laws-cp6-direct-language-hierarchy
          path: cp6-direct-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Publish verified candidate head
        run: git push origin HEAD:${{ github.head_ref }}
