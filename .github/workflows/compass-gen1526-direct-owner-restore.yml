name: Compass Gen1526 Direct Owner Restore

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.head_ref == 'repair/compass-live-asset-bindings-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Restore exact Gen1526 direct canonical visual owner
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/agent/compass-continuous-renderers-performance-gen1526-v1 -- assets/compass/compass.identity-3d.js
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<script src="/assets/compass/compass.laws-spacecraft.js?v=gen1532-laws-background-v1" defer></script>\n','')
          s=s.replace('/assets/compass/compass.identity-3d.js?v=gen1532-laws-background-v1','/assets/compass/compass.identity-3d.js?v=gen1532-gen1526-direct-owner-v1')
          p.write_text(s)

          expected='04df9de4b20b1420a707d25c2f2b28664a90ca65'
          for fp in [
              Path('.github/ai-router/projects/compass/verify-performance-successor.mjs'),
              Path('.github/ai-router/projects/compass/verify-display-continuity.v1.mjs')
          ]:
              t=fp.read_text()
              t=t.replace("'assets/compass/compass.identity-3d.js':'ec15e347cc613d69f901c3ae9acb386c53dc64e1'",f"'assets/compass/compass.identity-3d.js':'{expected}'")
              t=t.replace("const lawsAdapter=read('assets/compass/compass.laws-spacecraft.js');\n",'')
              t=t.replace("check('LOCAL_SPACECRAFT_RENDERER_DISABLED',identity.includes('DGB_COMPASS_DISABLE_LOCAL_SPACECRAFT'),'Compass-local simplified spacecraft renderer disabled');\n", "check('CANONICAL_LAWS_GEOMETRY_DIRECTLY_CONSUMED',identity.includes(\"sourceModule:'/laws/index.spacecraft.geometry.js'\")&&identity.includes(\"adoption:'DIRECT_CANONICAL_GEOMETRY_MODULE_CONSUMPTION'\")&&identity.includes('source.buildLawsSpacecraftGeometry()'),'exact Gen1526 canonical Laws geometry consumption');\n")
              t=t.replace("check('ACTUAL_LAWS_BACKGROUND_OWNER_ADOPTED',lawsAdapter.includes('/laws/index.spacecraft.background.js?v=LAWS_CP6_TRUE_3D_SPACECRAFT_BACKGROUND_20260801A')&&lawsAdapter.includes('DIRECT_LAWS_PRESENTATION_OWNER'),'later Laws page-background spacecraft owner adopted');\n", "check('SPACECRAFT_RESOURCE_AWARE_SCHEDULING',identity.includes(\"performancePolicy='hardware-30fps-software-static-dpr1'\")&&identity.includes('/SwiftShader|Software|llvmpipe/i')&&identity.includes(\"performanceTier=constrained?'software-static-3d':'hardware-flight-3d'\"),'Gen1526 software-static / hardware-bounded policy');\n")
              t=t.replace("check('LAWS_SPACECRAFT_BOUND_BEFORE_IDENTITY',html.indexOf('compass.laws-spacecraft.js')>=0&&html.indexOf('compass.laws-spacecraft.js')<html.indexOf('compass.identity-3d.js'),'Laws adapter executes before Compass identity runtime');\n", "check('DIRECT_OWNER_BOUND_TO_LIVE_HTML',html.includes('compass.identity-3d.js?v=gen1532-gen1526-direct-owner-v1')&&!html.includes('compass.laws-spacecraft.js'),'live HTML executes direct Gen1526 owner only');\n")
              t=t.replace("check('LOCAL_SPACECRAFT_RENDERER_DISABLED',identity.includes('DGB_COMPASS_DISABLE_LOCAL_SPACECRAFT'),'simplified Compass-local spacecraft renderer disabled');\n", "check('CANONICAL_LAWS_GEOMETRY_DIRECTLY_CONSUMED',identity.includes(\"sourceModule:'/laws/index.spacecraft.geometry.js'\")&&identity.includes(\"adoption:'DIRECT_CANONICAL_GEOMETRY_MODULE_CONSUMPTION'\")&&identity.includes('source.buildLawsSpacecraftGeometry()'),'exact Gen1526 canonical Laws geometry consumption');\n")
              t=t.replace("check('ACTUAL_LAWS_BACKGROUND_OWNER_ADOPTED',lawsAdapter.includes('/laws/index.spacecraft.background.js?v=LAWS_CP6_TRUE_3D_SPACECRAFT_BACKGROUND_20260801A')&&lawsAdapter.includes('DIRECT_LAWS_PRESENTATION_OWNER'),'later Laws background spacecraft presentation owner adopted');\n", "check('SPACECRAFT_RESOURCE_AWARE_SCHEDULING',identity.includes(\"performancePolicy='hardware-30fps-software-static-dpr1'\")&&identity.includes('/SwiftShader|Software|llvmpipe/i')&&identity.includes(\"performanceTier=constrained?'software-static-3d':'hardware-flight-3d'\"),'Gen1526 software-static / hardware-bounded policy');\n")
              t=t.replace("check('LAWS_SPACECRAFT_BOUND_BEFORE_IDENTITY',html.indexOf('compass.laws-spacecraft.js')>=0&&html.indexOf('compass.laws-spacecraft.js')<html.indexOf('compass.identity-3d.js'),'Laws spacecraft adapter loads before identity runtime');\n", "check('DIRECT_OWNER_BOUND_TO_LIVE_HTML',html.includes('compass.identity-3d.js?v=gen1532-gen1526-direct-owner-v1')&&!html.includes('compass.laws-spacecraft.js'),'live HTML executes direct Gen1526 owner only');\n")
              fp.write_text(t)
          PY
          test "$(git rev-parse HEAD:assets/compass/compass.identity-3d.js)" = "04df9de4b20b1420a707d25c2f2b28664a90ca65"
          grep -q 'compass.identity-3d.js?v=gen1532-gen1526-direct-owner-v1' index.html
          ! grep -q 'compass.laws-spacecraft.js' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/compass/compass.identity-3d.js index.html .github/ai-router/projects/compass/verify-performance-successor.mjs .github/ai-router/projects/compass/verify-display-continuity.v1.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Restore exact Gen1526 direct Laws visual owner'
            git push origin HEAD:${{ github.head_ref }}
          fi
