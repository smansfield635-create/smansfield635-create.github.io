        run: |
          timeout 2400s node tools/h-earth-ground-material-comparison.v1.mjs --baseline-dir ../baseline --candidate-dir ../candidate --output "${{ runner.temp }}/ground-material-comparison"
      - name: Preserve comparison evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-groundcover-mapwide-${{ github.run_id }}
          path: ${{ runner.temp }}/ground-material-comparison
          if-no-files-found: error
