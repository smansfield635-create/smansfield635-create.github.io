name: Remote Operation Successor v1

on:
  pull_request:
    paths:
      - '.github/workflows/remote-operation-successor-v1.yml'
      - '.github/ai-router/operation-lifecycle/**'
      - '.github/ai-router/system-continuity/gap-registry.v1.json'
      - '.github/ai-router/router.v1.json'
      - 'AI_ENTRYPOINT.json'
      - 'tools/operation-intake/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/remote-operation-successor-v1.yml'
      - '.github/ai-router/operation-lifecycle/**'
      - '.github/ai-router/system-continuity/gap-registry.v1.json'
      - '.github/ai-router/router.v1.json'
      - 'AI_ENTRYPOINT.json'
      - 'tools/operation-intake/**'
permissions:
  contents: read

concurrency:
  group: remote-operation-successor-v1-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false

env:
  C7_PREDECESSOR_GATE_BLOB: 8b254c43abc53d769e82524c6eded1c07eaffc61
  C7_PREDECESSOR_SELF_TEST_BLOB: edba8f3b024e832fd3da6207ba786ce292aad54c
  C7_GATE_BLOB: 4961e0abbfdcd62a5b2f2856667ba8e30cd81fce
  C7_SELF_TEST_BLOB: 174528c6083ea5ca2660982ee8e3f3ac130d1830

jobs:
  validate-contract:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - name: Check out bounded successor validation working set
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AI_ENTRYPOINT.json
            /.github/workflows/remote-operation-successor-v1.yml
            /.github/ai-router/router.v1.json
            /.github/ai-router/system-continuity/gap-registry.v1.json
            /.github/ai-router/system-continuity/
            /.github/ai-router/operation-lifecycle/
            /tools/operation-intake/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen C7 successor identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:.github/ai-router/operation-lifecycle/repository-operation-successor-gate.v1.mjs)" = "$C7_GATE_BLOB"
          test "$(git rev-parse HEAD:.github/ai-router/operation-lifecycle/repository-operation-successor-self-test.v1.mjs)" = "$C7_SELF_TEST_BLOB"
          test -f .github/ai-router/operation-lifecycle/successor-packet-compiler.v1.mjs
          test -f .github/ai-router/operation-lifecycle/successor-packet-compiler-self-test.v1.mjs
      - name: Run C7 authority and successor adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tools/operation-intake/repository-operation-lock-manager.v1.remote-receipt.test.mjs
          node .github/ai-router/operation-lifecycle/repository-operation-successor-self-test.v1.mjs \
            --output "$RUNNER_TEMP/remote-operation-successor-route-self-test.json"
          node .github/ai-router/operation-lifecycle/successor-packet-compiler-self-test.v1.mjs \
            --output "$RUNNER_TEMP/successor-packet-compiler-self-test.json"
          node - "$RUNNER_TEMP/remote-operation-successor-route-self-test.json" "$RUNNER_TEMP/c7-authority-provenance-integrity-receipt.json" <<'NODE'
          const fs = require('node:fs');
          const successor = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (successor.result !== 'PASS_CLOSED' || successor.failCount !== 0) throw new Error('SUCCESSOR_SELF_TEST_NONPASS');
          const required = [
            'VALID_POST_C7_PROVENANCE_SUCCESSOR_PASS',
            'PLAUSIBLE_UNAUTHORIZED_PREDECESSOR_PROVENANCE_FAILS_CLOSED',
            'LEGACY_PRE_C7_PREDECESSOR_COMPATIBILITY_PASS',
            'REMOTE_CONTENTS_INLINE_BASE64_DOES_NOT_FETCH_BLOB',
            'REMOTE_CONTENTS_ENCODING_NONE_EMPTY_FALLS_BACK_TO_GIT_BLOB',
            'REMOTE_GIT_BLOB_NON_BASE64_FAILS_CLOSED',
            'REMOTE_GIT_BLOB_MALFORMED_JSON_FAILS_CLOSED',
            'REMOTE_GIT_BLOB_LEDGER_SCHEMA_FAILS_CLOSED'
          ];
          for (const id of required) if (!successor.tests?.some(t => t.id === id && t.pass === true)) throw new Error(`C7_TEST_MISSING_OR_FAILED:${id}`);
          const receipt = {
            schema: 'C7_AUTHORITY_PROVENANCE_INTEGRITY_RECEIPT_v1',
            result: 'PASS_CLOSED',
            malformedLedgerFailClosed: true,
            plausibleUnauthorizedAuthorityFailClosed: true,
            manualMutationLineageFailClosed: true,
            validCanonicalSuccessorPreserved: true,
            legacyPreC7CompatibilityPreserved: true,
            successorCasPreserved: true,
            testCount: successor.testCount,
            passCount: successor.passCount
          };
          fs.writeFileSync(process.argv[3], `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
      - name: Verify route registration contract
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const router = JSON.parse(fs.readFileSync('.github/ai-router/router.v1.json', 'utf8'));
          const entry = JSON.parse(fs.readFileSync('AI_ENTRYPOINT.json', 'utf8'));
          const workflow = '.github/workflows/remote-operation-successor-v1.yml';
          const infrastructure = router.routerInfrastructure || {};
          const workflowOwned = infrastructure.ownedExactPaths?.includes(workflow) || infrastructure.ownedPathPrefixes?.some(prefix => workflow.startsWith(prefix));
          if (!workflowOwned) throw new Error('REMOTE_SUCCESSOR_WORKFLOW_NOT_ROUTER_OWNED');
          const lifecycle = entry.operationIntakeGate?.successorLifecycle;
          if (!lifecycle) throw new Error('SUCCESSOR_LIFECYCLE_DISCOVERY_MISSING');
          if (lifecycle.remoteInvocationMarker !== 'REMOTE_OPERATION_SUCCESSOR_REQUEST_V1') throw new Error('REMOTE_SUCCESSOR_MARKER_MISMATCH');
          if (lifecycle.remoteInvocationWorkflow !== workflow) throw new Error('REMOTE_SUCCESSOR_WORKFLOW_DISCOVERY_MISMATCH');
          if (lifecycle.remoteInvocationAuthorityInherited !== false || lifecycle.remoteInvocationGenericCommandAuthority !== false) throw new Error('REMOTE_SUCCESSOR_AUTHORITY_BOUNDARY_INVALID');
          const compiler = lifecycle.postRatificationSuccessorCompiler;
          if (compiler?.remoteInvocationMarker !== 'REMOTE_OPERATION_SUCCESSOR_COMPILE_AND_EXECUTE_REQUEST_V1') throw new Error('SUCCESSOR_COMPILER_MARKER_MISMATCH');
          if (compiler?.authorityInherited !== false || compiler?.automaticEvidenceRelabeling !== false) throw new Error('SUCCESSOR_COMPILER_AUTHORITY_BOUNDARY_INVALID');
          NODE
      - name: Upload validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-operation-successor-route-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/remote-operation-successor-route-self-test.json
            ${{ runner.temp }}/successor-packet-compiler-self-test.json
            ${{ runner.temp }}/c7-authority-provenance-integrity-receipt.json
          if-no-files-found: error
          retention-days: 90

  execute-successor:
    if: >-
      github.event_name == 'issue_comment' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (startsWith(github.event.comment.body, 'REMOTE_OPERATION_SUCCESSOR_REQUEST_V1') ||
       startsWith(github.event.comment.body, 'REMOTE_OPERATION_SUCCESSOR_COMPILE_AND_EXECUTE_REQUEST_V1'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out bounded successor execution working set
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AI_ENTRYPOINT.json
            /.github/workflows/remote-operation-successor-v1.yml
            /.github/ai-router/router.v1.json
            /.github/ai-router/system-continuity/gap-registry.v1.json
            /.github/ai-router/system-continuity/
            /.github/ai-router/operation-lifecycle/
            /tools/operation-intake/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify installed route and C7 tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:.github/ai-router/operation-lifecycle/repository-operation-successor-gate.v1.mjs)" = "$C7_GATE_BLOB"
          test "$(git rev-parse HEAD:.github/ai-router/operation-lifecycle/repository-operation-successor-self-test.v1.mjs)" = "$C7_SELF_TEST_BLOB"
          node --test tools/operation-intake/repository-operation-lock-manager.v1.remote-receipt.test.mjs
          node .github/ai-router/operation-lifecycle/repository-operation-successor-self-test.v1.mjs --output "$RUNNER_TEMP/remote-operation-successor-route-self-test.json"
          node .github/ai-router/operation-lifecycle/successor-packet-compiler-self-test.v1.mjs --output "$RUNNER_TEMP/successor-packet-compiler-self-test.json"
      - name: Parse direct or compile-and-execute request
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP" <<'NODE'
          const fs = require('node:fs'); const path = require('node:path');
          const body = String(process.env.COMMENT_BODY || '').replace(/\r\n/g, '\n');
          const direct = 'REMOTE_OPERATION_SUCCESSOR_REQUEST_V1';
          const compiled = 'REMOTE_OPERATION_SUCCESSOR_COMPILE_AND_EXECUTE_REQUEST_V1';
          const out = process.argv[2];
          if (body.startsWith(`${direct}\n`)) {
            const payload = JSON.parse(body.slice(direct.length + 1).trim());
            const keys = ['constructionProcedure','operationRequest','repository','schema','transition'];
            if (JSON.stringify(Object.keys(payload).sort()) !== JSON.stringify(keys)) throw new Error('DIRECT_REQUEST_KEYS_NOT_CLOSED');
            if (payload.schema !== 'REMOTE_OPERATION_SUCCESSOR_INVOCATION_REQUEST_v1' || payload.repository !== process.env.EXPECTED_REPOSITORY) throw new Error('DIRECT_REQUEST_IDENTITY_MISMATCH');
            fs.writeFileSync(path.join(out,'transition.json'), JSON.stringify(payload.transition,null,2)+'\n');
            fs.writeFileSync(path.join(out,'operation-request.json'), JSON.stringify(payload.operationRequest,null,2)+'\n');
            fs.writeFileSync(path.join(out,'construction-procedure.json'), JSON.stringify(payload.constructionProcedure,null,2)+'\n');
            fs.writeFileSync(path.join(out,'invocation-mode.txt'),'DIRECT\n');
          } else if (body.startsWith(`${compiled}\n`)) {
            const payload = JSON.parse(body.slice(compiled.length + 1).trim());
            if (payload.schema !== 'REMOTE_OPERATION_SUCCESSOR_COMPILE_AND_EXECUTE_INVOCATION_REQUEST_v1' || payload.repository !== process.env.EXPECTED_REPOSITORY || payload.compileRequest?.repository !== process.env.EXPECTED_REPOSITORY) throw new Error('COMPILE_REQUEST_IDENTITY_MISMATCH');
            fs.writeFileSync(path.join(out,'compile-request.json'), JSON.stringify(payload.compileRequest,null,2)+'\n');
            fs.writeFileSync(path.join(out,'invocation-mode.txt'),'COMPILED\n');
          } else throw new Error('REQUEST_MARKER_MISMATCH');
          NODE
      - name: Compile fresh successor packet when requested
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat "$RUNNER_TEMP/invocation-mode.txt")" = "COMPILED" ]; then
            node .github/ai-router/operation-lifecycle/successor-packet-compiler.v1.mjs --input "$RUNNER_TEMP/compile-request.json" --output "$RUNNER_TEMP/compiled-successor-packet.json"
            node - "$RUNNER_TEMP/compiled-successor-packet.json" "$RUNNER_TEMP" <<'NODE'
          const fs=require('node:fs'),path=require('node:path'); const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8')),out=process.argv[3];
          if(p.schema!=='REPOSITORY_OPERATION_SUCCESSOR_COMPILED_PACKET_v1'||p.compilerReceipt?.result!=='PASS_CLOSED'||p.compilerReceipt?.authorityInherited!==false)throw new Error('COMPILED_PACKET_NONPASS');
          fs.writeFileSync(path.join(out,'transition.json'),JSON.stringify(p.transition,null,2)+'\n');
          fs.writeFileSync(path.join(out,'operation-request.json'),JSON.stringify(p.operationRequest,null,2)+'\n');
          fs.writeFileSync(path.join(out,'construction-procedure.json'),JSON.stringify(p.constructionProcedure,null,2)+'\n');
          NODE
          fi
      - name: Execute canonical atomic successor gate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node .github/ai-router/operation-lifecycle/repository-operation-successor-gate.v1.mjs \
            --transition "$RUNNER_TEMP/transition.json" \
            --request "$RUNNER_TEMP/operation-request.json" \
            --procedure "$RUNNER_TEMP/construction-procedure.json" \
            --repository "${GITHUB_REPOSITORY}" \
            --lock-ref refs/heads/operation-locks/repository-operation-intake-v1 \
            --output "$RUNNER_TEMP/remote-operation-successor-invocation-receipt.json"
      - name: Verify native C7 successor receipt
        shell: bash
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/remote-operation-successor-invocation-receipt.json" <<'NODE'
          const fs=require('node:fs'); const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.schema!=='REPOSITORY_OPERATION_SUCCESSOR_TRANSITION_RECEIPT_v1'||r.result!=='SUCCESSOR_ADMITTED_PREDECESSOR_SUPERSEDED')throw new Error('SUCCESSOR_RECEIPT_NONPASS');
          if(r.authorityInherited!==false||r.exactHeadRevalidationRequired!==true||r.oneLedgerMutationRequired!==true)throw new Error('SUCCESSOR_SAFETY_CONTRACT_NONPASS');
          if(r.successor?.authorityProvenanceBound!==true)throw new Error('C7_SUCCESSOR_PROVENANCE_NOT_BOUND');
          if(!['LEGACY_AUTHORITY_SNAPSHOT_ANCHORED','AUTHENTICATED_CANONICAL_AUTHORITY'].includes(r.authorityVerification?.result))throw new Error('C7_PREDECESSOR_AUTHORITY_NOT_VERIFIED');
          NODE
      - name: Preserve workflow failure receipt when native receipt is unavailable
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/remote-operation-successor-invocation-receipt.json" "$RUNNER_TEMP/remote-operation-successor-workflow-failure-receipt.json" <<'NODE'
          const fs=require('node:fs'); try{const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));if(r.schema==='REPOSITORY_OPERATION_SUCCESSOR_TRANSITION_RECEIPT_v1')process.exit(0)}catch{}
          fs.writeFileSync(process.argv[3],JSON.stringify({schema:'REMOTE_OPERATION_SUCCESSOR_WORKFLOW_FAILURE_RECEIPT_v1',result:'FAIL_CLOSED',errorCode:'NATIVE_SUCCESSOR_RECEIPT_UNAVAILABLE',continuationAuthorized:false,authorityInherited:false,authorityUsable:false,successorAdmissionStatus:'UNCONFIRMED_STOP',mergeAuthorityCreated:false,ledgerMutationStatus:'UNKNOWN_NATIVE_RECEIPT_UNAVAILABLE'},null,2)+'\n');
          NODE
      - name: Upload native successor receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-operation-successor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/remote-operation-successor-invocation-receipt.json
            ${{ runner.temp }}/remote-operation-successor-route-self-test.json
            ${{ runner.temp }}/successor-packet-compiler-self-test.json
            ${{ runner.temp }}/compiled-successor-packet.json
            ${{ runner.temp }}/remote-operation-successor-workflow-failure-receipt.json
          if-no-files-found: warn
          retention-days: 90
      - name: Return native receipt to invoking issue
        if: always()
        uses: actions/github-script@v7
        env:
          RECEIPT_PATH: ${{ runner.temp }}/remote-operation-successor-invocation-receipt.json
          FAILURE_PATH: ${{ runner.temp }}/remote-operation-successor-workflow-failure-receipt.json
          MODE_PATH: ${{ runner.temp }}/invocation-mode.txt
        with:
          github-token: ${{ github.token }}
          script: |
            const fs=require('fs');
            let value={schema:'REMOTE_OPERATION_SUCCESSOR_WORKFLOW_FAILURE_RECEIPT_v1',result:'FAIL_CLOSED',errorCode:'SUCCESSOR_RECEIPT_RETURN_INPUTS_UNAVAILABLE',continuationAuthorized:false,authorityInherited:false,authorityUsable:false};
            for(const [p,s] of [[process.env.RECEIPT_PATH,'REPOSITORY_OPERATION_SUCCESSOR_TRANSITION_RECEIPT_v1'],[process.env.FAILURE_PATH,'REMOTE_OPERATION_SUCCESSOR_WORKFLOW_FAILURE_RECEIPT_v1']]){try{const x=JSON.parse(fs.readFileSync(p,'utf8'));if(x.schema===s){value=x;break}}catch{}}
            let mode='UNKNOWN';try{mode=fs.readFileSync(process.env.MODE_PATH,'utf8').trim()||mode}catch{}
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`REMOTE_OPERATION_SUCCESSOR_RECEIPT_V1\nMODE=${mode}\n\n\`\`\`json\n${JSON.stringify(value,null,2)}\n\`\`\``});
      - name: Emit terminal job receipt guard
        if: always()
        run: echo "remote-successor-job-complete"
