name: H-Earth Gen2633 Actual WebGL2 Qualification
on:
  pull_request:
    paths:
      - 'showroom/globe/h-earth/render/compact-four-tree-foliage.v1.js'
      - 'showroom/globe/h-earth/validation/four-tree-compact-webgl2-browser.verify.mjs'
      - '.github/workflows/h-earth-gen2633-actual-webgl2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-webgl2:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Retrieve exact two-file candidate without repository checkout
        shell: bash
        run: |
          set -euo pipefail
          root="showroom/globe/h-earth"
          mkdir -p "$root/render" "$root/validation"
          base="https://raw.githubusercontent.com/smansfield635-create/smansfield635-create.github.io/7afcf8ace10884fffc1ba0e561bc48028440656b"
          curl -fLsS --retry 3 --max-time 60 "$base/$root/render/compact-four-tree-foliage.v1.js" -o "$root/render/compact-four-tree-foliage.v1.js"
          curl -fLsS --retry 3 --max-time 60 "$base/$root/validation/four-tree-compact-webgl2-browser.verify.mjs" -o "$root/validation/four-tree-compact-webgl2-browser.verify.mjs"
          test "$(git hash-object "$root/render/compact-four-tree-foliage.v1.js")" = 698a439c11fc7b439a6dc32b4bab142a55186745
          test "$(git hash-object "$root/validation/four-tree-compact-webgl2-browser.verify.mjs")" = 2d213fea77e87f7862628981e71b82ef28f25a4b
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and draw compact leaves in real WebGL2
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          node showroom/globe/h-earth/validation/four-tree-compact-webgl2-browser.verify.mjs | tee actual-webgl2-receipt.json
      - name: Preserve browser qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-actual-webgl2-${{ github.run_id }}
          path: actual-webgl2-receipt.json
          retention-days: 90
