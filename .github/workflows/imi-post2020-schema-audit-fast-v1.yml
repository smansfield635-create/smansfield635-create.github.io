name: IMI post-2020 schema audit fast v1
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/imi-post2020-schema-audit-fast-v1.yml'
  workflow_dispatch:
jobs:
  audit-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - run: curl -fsSL https://raw.githubusercontent.com/smansfield635-create/smansfield635-create.github.io/e7390bf3e296149aadf5bfeb24a3093ceafa037c/research/imi/post2020_call_report_schema_audit_v1.py -o audit.py
      - run: python audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: imi-post2020-schema-audit-fast-v1
          path: post2020_schema_audit.json
