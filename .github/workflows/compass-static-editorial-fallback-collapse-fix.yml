name: Compass Static Editorial Fallback Collapse Fix

on:
  push:
    branches: [recovery/compass-static-editorial-successor]
    paths:
      - '.github/workflows/compass-static-editorial-fallback-collapse-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/compass-static-editorial-successor
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            index.html
            .github/workflows/compass-static-editorial-fallback-collapse-fix.yml
      - name: Apply exact closed-details visibility guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='.compass-accessibility-routes nav{display:flex;flex-wrap:wrap;gap:.45rem .8rem;padding:.7rem .25rem}'
          new='.compass-accessibility-routes:not([open])>nav{display:none!important}.compass-accessibility-routes[open]>nav{display:flex;flex-wrap:wrap;gap:.45rem .8rem;padding:.7rem .25rem}'
          if old not in s:
              raise SystemExit('EXPECTED_FALLBACK_RULE_NOT_FOUND')
          if new in s:
              raise SystemExit('FALLBACK_GUARD_ALREADY_PRESENT')
          s=s.replace(old,new,1)
          if s.count('compass-accessibility-routes:not([open])>nav')!=1:
              raise SystemExit('FALLBACK_GUARD_COUNT_INVALID')
          p.write_text(s)
          PY
      - name: Commit product fix and remove one-shot carrier
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/compass-static-editorial-fallback-collapse-fix.yml
          git add index.html .github/workflows/compass-static-editorial-fallback-collapse-fix.yml
          git commit -m 'fix(compass): keep accessibility routes visually collapsed'
          git push origin HEAD:recovery/compass-static-editorial-successor
