              node --input-type=module > /tmp/h-earth-exact-evidence/modern-source-binding.json <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const manifestPath='showroom/globe/h-earth/render/assets/precomputed-grass.v1.json';
          const compressedPath='showroom/globe/h-earth/render/assets/precomputed-grass.v1.bin.gz';
