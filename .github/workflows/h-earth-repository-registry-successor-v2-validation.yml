name: H-Earth Registry Successor v2 Validation

on:
  pull_request:
  push:
    branches:
      - 'agent/h-earth-gate-b-post-guardrail-evaluation-001'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute successor validation and acceptance-aware regression corridor
        run: |
          mkdir -p artifacts/successor-v2-regression
          set +e
          commands=(
            "node tools/h-earth-repository-registry-successor-v2-audit.mjs"
            "node tools/h-earth-repository-registry-target-4a-contract-audit.mjs"
            "node tools/h-earth-repository-registry-target-4b-audit.mjs"
            "node tools/h-earth-repository-registry-target-4c-static-audit.mjs"
            "node tools/h-earth-repository-registry-target-4c-audit.mjs"
            "node tools/h-earth-repository-registry-target-4e-static-audit.mjs"
            "node tools/h-earth-repository-registry-target-4e-audit.mjs"
            "node tools/h-earth-repository-registry-target-4f-audit.mjs"
          )
          names=(successor target4a target4b target4c-static target4c-fixtures target4e-static target4e-systemic target4f-accepted-package)
          overall=0
          : > artifacts/successor-v2-regression/summary.txt
          for i in "${!commands[@]}"; do
            bash -lc "${commands[$i]}" > "artifacts/successor-v2-regression/${names[$i]}.log" 2>&1
            code=$?
            echo "${names[$i]}=$code" | tee -a artifacts/successor-v2-regression/summary.txt
            if [ "$code" -ne 0 ]; then overall=1; fi
          done
          exit "$overall"
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-registry-successor-v2-full-validation
          path: artifacts/
