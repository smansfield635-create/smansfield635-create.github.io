name: Laws Compass Six-Authority Benchmark

on:
  pull_request:
    branches:
      - main
    paths:
      - "laws/**"
      - "verification/benchmark-tools/laws-compass-six-authority-benchmark-v1/laws-compass-six-authority-benchmark.mjs"
      - ".github/workflows/laws-compass-six-authority-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laws-six-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXECUTION_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
  EXECUTION_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  PR_BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.sha }}
  HISTORICAL_BASELINE_COMMIT: 3a6eafcb8c10c61849a452a0c068d34a12117cf5
  LAWS_SIX_ORIGIN: http://127.0.0.1:4173

jobs:
  classify-current-contract:
    runs-on: ubuntu-latest
    outputs:
      historical_runtime_benchmark_required: ${{ steps.scope.outputs.required }}
    steps:
      - name: Checkout exact execution head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXECUTION_COMMIT }}
          fetch-depth: 0

      - name: Verify exact checkout identity
        run: test "$(git rev-parse HEAD)" = "$EXECUTION_COMMIT"

      - name: Fetch current pull-request base
        run: git fetch --no-tags origin "$PR_BASE_COMMIT"

      - name: Classify runtime mutation scope
        id: scope
        shell: bash
        run: |
          changed="$(git diff --name-only "$PR_BASE_COMMIT"..."$EXECUTION_COMMIT")"
          printf '%s\n' "$changed"
          relevant="$(printf '%s\n' "$changed" | grep -E '^(laws/index\.(controller|compositor|crystals|interactions|planet|cosmos)\.js|assets/audralia/audralia\.planet\.js|verification/benchmark-tools/laws-compass-six-authority-benchmark-v1/laws-compass-six-authority-benchmark\.mjs)$' || true)"
          if [ -n "$relevant" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify preserved current six-authority contract
        run: |
          grep -F 'data-laws-category-count="6"' laws/index.html
          grep -F 'data-laws-law-count="16"' laws/index.html
          grep -F 'data-laws-nonlaw-member-count="8"' laws/index.html
          grep -F 'data-laws-child-route-count="24"' laws/index.html
          grep -F 'data-laws-test-method="four-member-reversible-admissibility-cluster"' laws/index.html
          grep -F 'const D=Object.freeze(["flow","integrity","reality","structure","test","research"])' laws/index.interactions.js
          grep -F 'singleActiveOuterAuthorityLabel:true' laws/index.interactions.js
          grep -F 'primary-only-star-center-protected-tab' laws/index.interactions.js

      - name: Record content-only compatibility disposition
        if: steps.scope.outputs.required != 'true'
        run: |
          echo 'Historical six-authority construction benchmark is not applicable.'
          echo 'The protected Compass runtime is unchanged; current-contract preservation passed.'

  historical-six-authority-construction-proof:
    needs: classify-current-contract
    if: needs.classify-current-contract.outputs.historical_runtime_benchmark_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASELINE_COMMIT: ${{ env.HISTORICAL_BASELINE_COMMIT }}
    steps:
      - name: Checkout exact execution head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXECUTION_COMMIT }}
          fetch-depth: 1

      - name: Verify exact checkout identity
        run: test "$(git rev-parse HEAD)" = "$EXECUTION_COMMIT"

      - name: Fetch historical bounded comparison baseline
        run: git fetch --no-tags --depth=1 origin "$BASELINE_COMMIT"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install pinned browser driver
        run: npm install --no-save --no-package-lock puppeteer-core@24.15.0

      - name: Validate source syntax
        run: |
          node --check laws/index.controller.js
          node --check laws/index.crystals.js
          node --check laws/index.interactions.js
          node --check verification/benchmark-tools/laws-compass-six-authority-benchmark-v1/laws-compass-six-authority-benchmark.mjs

      - name: Start exact-head static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/laws-six-authority-server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/laws/ >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/laws-six-authority-server.log
          exit 1

      - name: Execute historical six-authority construction benchmark
        id: benchmark
        continue-on-error: true
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node verification/benchmark-tools/laws-compass-six-authority-benchmark-v1/laws-compass-six-authority-benchmark.mjs

      - name: Report historical receipt
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'laws-six-authority-benchmark-v1.json';
          if (!fs.existsSync(file)) throw new Error('LAWS_SIX_AUTHORITY_RECEIPT_MISSING');
          const receipt = JSON.parse(fs.readFileSync(file, 'utf8'));
          console.log(JSON.stringify({
            pass: receipt.pass,
            phase: receipt.phase,
            browserExecuted: receipt.browserExecuted,
            failures: receipt.failures,
            observations: receipt.observations.length,
            screenshots: receipt.screenshotManifest.length,
            changedPathBoundary: receipt.execution
          }, null, 2));
          if (receipt.execution.commit !== process.env.EXECUTION_COMMIT) throw new Error('LAWS_SIX_AUTHORITY_COMMIT_MISMATCH');
          NODE

      - name: Upload historical six-authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laws-compass-six-authority-benchmark-v1-evidence
          path: |
            laws-six-authority-benchmark-v1.json
            laws-six-authority-benchmark-v1-screenshots/**
            /tmp/laws-six-authority-server.log
          if-no-files-found: warn
          retention-days: 30
