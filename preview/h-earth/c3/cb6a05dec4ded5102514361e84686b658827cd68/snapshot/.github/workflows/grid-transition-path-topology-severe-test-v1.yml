name: Grid transition-path topology severe test v1
on:
  pull_request:
    paths:
      - 'research/imi/grid_transition_path_topology_severe_test_v1.py'
      - 'research/imi/GRID_TRANSITION_PATH_TOPOLOGY_SEVERE_TEST_PROTOCOL_v1.md'
  workflow_dispatch:
jobs:
  severe-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            research/imi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: pip install numpy pandas scipy scikit-learn lightgbm requests
      - name: Execute frozen transition-path topology severe test
        run: python research/imi/grid_transition_path_topology_severe_test_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grid-transition-path-topology-severe-test-v1
          path: |
            grid_transition_path_topology_findings_v1.json
            grid_transition_path_topology_rows_v1.csv
            grid_transition_path_topology_states_v1.csv
            grid_transition_path_topology_predictions_v1.csv
            GRID_TRANSITION_PATH_TOPOLOGY_VERDICT_v1.txt
