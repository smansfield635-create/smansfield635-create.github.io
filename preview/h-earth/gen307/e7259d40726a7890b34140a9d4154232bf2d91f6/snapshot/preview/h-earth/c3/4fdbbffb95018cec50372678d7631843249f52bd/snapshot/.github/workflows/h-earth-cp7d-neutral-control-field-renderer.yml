name: H-Earth CP7D Neutral Control-Field Renderer

on:
  pull_request:
    paths:
      - '.github/workflows/h-earth-cp7d-neutral-control-field-renderer.yml'
      - 'h-earth-3d/control-plane/post-cp2-round2/cp7/h-earth.cp7d-neutral-renderer-integration.v1.mjs'
      - 'h-earth-3d/validation/cp7/h-earth.cp7d-neutral-renderer.runner.mjs'
      - 'h-earth-3d/validation/cp7/neutral-renderer/h-earth.cp7d-neutral-renderer.browser.mjs'
      - 'h-earth-3d/validation/cp7/neutral-renderer/h-earth.cp7d-neutral-renderer.harness.html'
      - 'showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-round2-control-field-candidate.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-neutral-renderer-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact CP7D candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bounded Chromium dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start exact candidate server
        run: |
          python3 -m http.server 4177 --bind 127.0.0.1 > /tmp/h-earth-cp7d-server.log 2>&1 &
          echo $! > /tmp/h-earth-cp7d-server.pid
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4177/h-earth-3d/validation/cp7/neutral-renderer/h-earth.cp7d-neutral-renderer.harness.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/h-earth-cp7d-server.log
          exit 1
      - name: Execute CP7D neutral integration gates
        env:
          CP7D_HARNESS_URL: http://127.0.0.1:4177/h-earth-3d/validation/cp7/neutral-renderer/h-earth.cp7d-neutral-renderer.harness.html
        run: node h-earth-3d/validation/cp7/h-earth.cp7d-neutral-renderer.runner.mjs | tee h-earth.cp7d-neutral-renderer.log
      - name: Upload CP7D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-cp7d-neutral-control-field-renderer
          path: |
            h-earth-3d/validation/cp7/h-earth.cp7d-neutral-renderer.receipt.v1.json
            h-earth-3d/validation/cp7/cp7d-evidence/
            h-earth.cp7d-neutral-renderer.log
            /tmp/h-earth-cp7d-server.log
          if-no-files-found: warn
          retention-days: 90
      - name: Enforce CP7D pass
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipt = JSON.parse(fs.readFileSync('h-earth-3d/validation/cp7/h-earth.cp7d-neutral-renderer.receipt.v1.json', 'utf8'));
          if (receipt.result !== 'CP7D_NEUTRAL_RENDERER_INTEGRATION_PASS_CLOSED' || receipt.pass !== true) {
            console.error(JSON.stringify(receipt, null, 2));
            process.exit(1);
          }
          console.log(`CP7D_PASS:${receipt.canonicalControlFieldSha256}:${receipt.canonicalReceiptSha256}`);
          NODE
