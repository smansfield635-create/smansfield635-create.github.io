name: R06 C10 Prospective Candidate 007 Staged Executor

on:
  push:
    branches:
      - work/r06-c10-candidate-007-admission
    paths:
      - .github/ai-router/carriers/r06-c10-prospective-candidate-007.executor-trigger.json

permissions:
  contents: write

concurrency:
  group: h-earth-r06-c10-prospective-candidate-007-staged
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact executor head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recover exact prospective sources
        id: recover
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION_BLOB: f24d137139935cfb78cea02e6b7cd098f63d1fef
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, pathlib, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          blob=os.environ['OPERATION_BLOB']
          request=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/git/blobs/{blob}',
              headers={
                  'Authorization':f'Bearer {os.environ["GH_TOKEN"]}',
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28'
              }
          )
          with urllib.request.urlopen(request) as response:
              payload=json.load(response)
          pathlib.Path('/tmp/r06-c10-original-operation.sh').write_bytes(
              base64.b64decode(payload['content'])
          )
          PY
          test "$(git hash-object /tmp/r06-c10-original-operation.sh)" = "$OPERATION_BLOB"
          git fetch origin work/r06-c10-candidate-006-admission --force
          git show origin/work/r06-c10-candidate-006-admission:.github/ai-router/carriers/r06-c10-prospective-candidate-006.patcher.py \
            > /tmp/r06-c10-candidate-006.patcher.py
          python -m py_compile /tmp/r06-c10-candidate-006.patcher.py

      - name: Build candidate 007 operation
        id: patch
        if: steps.recover.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/r06-c10-candidate-006.patcher.py \
            --source /tmp/r06-c10-original-operation.sh \
            --output /tmp/r06-c10-candidate-006.operation.sh
          python .github/ai-router/carriers/r06-c10-prospective-candidate-007.transformer.py \
            --source /tmp/r06-c10-candidate-006.operation.sh \
            --output /tmp/r06-c10-prospective-candidate-007.operation.sh
          bash -n /tmp/r06-c10-prospective-candidate-007.operation.sh
          chmod +x /tmp/r06-c10-prospective-candidate-007.operation.sh

      - name: Construct fresh successor and run exact gate
        id: operation
        if: steps.recover.outcome == 'success' && steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          /tmp/r06-c10-prospective-candidate-007.operation.sh

      - name: Publish staged execution identity
        if: always()
        shell: bash
        env:
          RECOVER_OUTCOME: ${{ steps.recover.outcome }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          OPERATION_OUTCOME: ${{ steps.operation.outcome }}
        run: |
          set -euo pipefail
          EXEC='/tmp/r06-c10-prospective-candidate-007'
          DEST='h-earth-3d/control-plane/r06-c10/candidate-admission/executions/prospective-candidate-007'
          mkdir -p "$EXEC"
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path('/tmp/r06-c10-prospective-candidate-007')
          record={
            'schema':'H_EARTH_R06_C10_PROSPECTIVE_CANDIDATE_007_STAGED_EXECUTOR_RECEIPT_v1',
            'workflowRunId':os.environ['GITHUB_RUN_ID'],
            'workflowRunAttempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'triggerCommit':os.environ['GITHUB_SHA'],
            'recoverOutcome':os.environ.get('RECOVER_OUTCOME'),
            'patchOutcome':os.environ.get('PATCH_OUTCOME'),
            'operationOutcome':os.environ.get('OPERATION_OUTCOME'),
            'manualMetadataReconstructionUsed':False
          }
          (root/'staged-executor-receipt.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin work/r06-c10-candidate-007-admission --force
          git checkout -B work/r06-c10-candidate-007-admission origin/work/r06-c10-candidate-007-admission
          mkdir -p "$DEST"
          cp -a "$EXEC"/. "$DEST"/
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m 'Record staged candidate 007 execution'
            git push origin HEAD:refs/heads/work/r06-c10-candidate-007-admission
          fi

      - name: Upload staged evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-r06-c10-prospective-candidate-007-staged-execution
          path: /tmp/r06-c10-prospective-candidate-007/
          if-no-files-found: error
          retention-days: 90

      - name: Preserve exact operation conclusion
        if: always()
        shell: bash
        env:
          OPERATION_OUTCOME: ${{ steps.operation.outcome }}
        run: |
          test "$OPERATION_OUTCOME" = 'success'
