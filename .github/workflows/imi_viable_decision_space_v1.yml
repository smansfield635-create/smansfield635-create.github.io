name: IMI viable decision-space test v1

on:
  pull_request:
    paths:
      - 'research/imi/IMI_VIABLE_DECISION_SPACE_PROTOCOL_v1.md'
      - 'research/imi/imi_viable_decision_space_test_v1.py'
      - '.github/workflows/imi_viable_decision_space_v1.yml'
  workflow_dispatch:

jobs:
  vds-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/imi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: pip install numpy pandas requests
      - name: Execute frozen viable decision-space test
        run: python research/imi/imi_viable_decision_space_test_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imi-viable-decision-space-test-v1
          path: |
            imi_viable_decision_space_findings_v1.json
            IMI_VIABLE_DECISION_SPACE_VERDICT_v1.txt
            imi_vds_calibration_panel_v1.csv
            imi_vds_confirmation_panel_v1.csv
          if-no-files-found: warn
