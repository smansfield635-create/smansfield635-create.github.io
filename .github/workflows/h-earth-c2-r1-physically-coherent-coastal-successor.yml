name: H-Earth C2-R1 R1.8B-C3 Exact Review Materialization

on:
  pull_request:
    branches:
      - integration/h-earth-c2-r1-baseline-001
    paths:
      - '.github/workflows/h-earth-c2-r1-physically-coherent-coastal-successor.yml'
  workflow_dispatch:
    inputs:
      candidate_head:
        description: Exact candidate branch head to verify, materialize, and serve
        required: true
        type: string

concurrency:
  group: h-earth-c2-r1-r1-8b-c3-exact-review-materialization
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  execute-r1-8b-c3-through-r1-8d:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      R1_8_TARGET_BRANCH: agent/h-earth-c2-r1-physically-coherent-coastal-successor-001
      R1_8_PRODUCT_AUTHORITY_HEAD: c53362c6f74b01c4e0b53be526b0e3a0b73edede
      R1_8_CORRECTIVE_STARTING_HEAD: c5ec156d0d00979ea2296972374b13f43678f4bf
      R1_8_CORRECTIVE_ROLLBACK_BRANCH: rollback/h-earth-c2-r1-r1-8b-c3-start-001
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.candidate_head }}
          fetch-depth: 0

      - name: Gate exact review materialization execution
        id: gate
        run: |
          set -euo pipefail
          message="$(git log -1 --format=%s)"
          if [ "$message" = "R1.8B-C3: execute exact prematerialized review workflow" ]; then
            echo "execute=true" >> "$GITHUB_OUTPUT"
          else
            echo "execute=false" >> "$GITHUB_OUTPUT"
            echo "R1.8B-C3 skipped for non-launch commit: $message"
          fi

      - name: Resolve exact candidate and rollback identities
        id: identity
        if: steps.gate.outputs.execute == 'true'
        env:
          EVENT_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_SYNTHETIC_SHA: ${{ github.sha }}
          MANUAL_CANDIDATE_HEAD: ${{ inputs.candidate_head }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              expected_candidate_head="$EVENT_PR_HEAD"
              ;;
            workflow_dispatch)
              expected_candidate_head="$MANUAL_CANDIDATE_HEAD"
              ;;
            *)
              echo "Unsupported workflow event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if ! [[ "$expected_candidate_head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected candidate head is not an exact SHA-1 identity" >&2
            exit 1
          fi

          checked_out_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin "refs/heads/$R1_8_TARGET_BRANCH" | awk '{print $1}')"
          rollback_head="$(git ls-remote origin "refs/heads/$R1_8_CORRECTIVE_ROLLBACK_BRANCH" | awk '{print $1}')"

          if [ "$checked_out_head" != "$expected_candidate_head" ]; then
            echo "Checked-out head mismatch: $checked_out_head != $expected_candidate_head" >&2
            exit 1
          fi
          if [ "$remote_head" != "$expected_candidate_head" ]; then
            echo "Remote target branch mismatch: $remote_head != $expected_candidate_head" >&2
            exit 1
          fi
          if [ "$rollback_head" != "$R1_8_CORRECTIVE_STARTING_HEAD" ]; then
            echo "Corrective rollback mismatch: $rollback_head != $R1_8_CORRECTIVE_STARTING_HEAD" >&2
            exit 1
          fi

          git merge-base --is-ancestor "$R1_8_PRODUCT_AUTHORITY_HEAD" "$checked_out_head"
          echo "expected_candidate_head=$expected_candidate_head" >> "$GITHUB_OUTPUT"
          echo "checked_out_head=$checked_out_head" >> "$GITHUB_OUTPUT"
          echo "synthetic_merge_sha=$EVENT_SYNTHETIC_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.execute == 'true'
        with:
          node-version: 22

      - name: Check bounded implementation syntax
        if: steps.gate.outputs.execute == 'true'
        run: |
          set -euo pipefail
          node --check h-earth-3d/control-plane/coastal-morphology/c2-r1/review/r1-8/h-earth.c2-r1.r1-8-review-mesh-materializer.js
          node --check h-earth-3d/control-plane/coastal-morphology/c2-r1/review/r1-8/review.js
          node --check h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.r1-8-integrated-functional-publication.mjs

      - name: Install bounded browser verification environment
        if: steps.gate.outputs.execute == 'true'
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Generate exact asset and execute R1.8B through R1.8D
        if: steps.gate.outputs.execute == 'true'
        env:
          R1_8_EXPECTED_CANDIDATE_HEAD: ${{ steps.identity.outputs.expected_candidate_head }}
          R1_8_PULL_REQUEST_SYNTHETIC_MERGE_SHA: ${{ steps.identity.outputs.synthetic_merge_sha }}
        run: |
          set -euo pipefail
          node h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.r1-8-integrated-functional-publication.mjs

      - name: Run exact resulting-head repository registry preflight
        if: steps.gate.outputs.execute == 'true'
        run: |
          set -euo pipefail
          git diff --name-only "$R1_8_CORRECTIVE_STARTING_HEAD" HEAD > /tmp/r1-8b-c3-paths.txt
          node --experimental-default-type=module tools/h-earth-repository-registry-auto-preflight.mjs \
            --paths-file /tmp/r1-8b-c3-paths.txt \
            --task "R1.8B-C3 exact pre-materialized isolated review mesh, R1.8B verification, R1.8C publication, and R1.8D served capture preparation" \
            --mutation-intent \
            --output /tmp/r1-8b-c3-registry-preflight.json
          cat /tmp/r1-8b-c3-registry-preflight.json

      - name: Upload bounded R1.8B-C3 through R1.8D evidence
        if: always() && steps.gate.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-c2-r1-r1-8b-c3-through-r1-8d-evidence
          path: |
            h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/r1-8
            h-earth-3d/control-plane/coastal-morphology/c2-r1/review/r1-8/identity.json
            h-earth-3d/control-plane/coastal-morphology/c2-r1/review/r1-8/h-earth.c2-r1.r1-8-review-mesh.bin
          if-no-files-found: error
          retention-days: 30
