name: Export Laws conformance sources

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/laws-conformance-source-export.yml
      - verification/laws-repair/shared-compass-cluster-conformance/**

permissions:
  contents: read

jobs:
  export-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate source custody
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 64

      - name: Verify immutable source anchors
        run: |
          git cat-file -e 26e1d2945af837ccbbe0f003c3d148be3d7c41ff^{commit}
          git cat-file -e dedc73841de2b41f5905fd842e9a593116caf300^{commit}
          git cat-file -e ba0f3ecf3087f91d2cb3ff6aa4dd3c040107712e^{commit}

      - name: Export exact source files without mutation
        run: |
          set -euo pipefail
          mkdir -p export/current/laws/validation export/current/products/archcoin export/current/assets/compass export/current/showroom
          mkdir -p export/pre-pr128/laws

          for path in \
            laws/index.crystals.js \
            laws/index.interactions.source.round4.js \
            laws/index.interactions.js \
            laws/index.html \
            laws/index.css \
            laws/validation/laws.orbit-direct-manipulation.harness.mjs \
            laws/validation/laws.orbit-direct-manipulation.receipt.json \
            products/archcoin/index.interactions.source.js \
            products/archcoin/index.crystals.source.js \
            assets/compass/compass.crystals.js \
            showroom/index.crystals.js
          do
            mkdir -p "export/current/$(dirname "$path")"
            git show "26e1d2945af837ccbbe0f003c3d148be3d7c41ff:$path" > "export/current/$path"
          done

          for path in \
            laws/index.crystals.js \
            laws/index.interactions.source.round4.js \
            laws/index.interactions.js \
            laws/index.html \
            laws/index.css
          do
            mkdir -p "export/pre-pr128/$(dirname "$path")"
            git show "dedc73841de2b41f5905fd842e9a593116caf300:$path" > "export/pre-pr128/$path"
          done

          git diff --binary dedc73841de2b41f5905fd842e9a593116caf300 ba0f3ecf3087f91d2cb3ff6aa4dd3c040107712e -- \
            laws/index.crystals.js \
            laws/index.interactions.source.round4.js \
            laws/index.interactions.js \
            laws/index.html \
            laws/index.css \
            laws/validation/laws.orbit-direct-manipulation.harness.mjs \
            laws/validation/laws.orbit-direct-manipulation.receipt.json \
            > export/pr128.patch

          find export -type f -print0 | sort -z | xargs -0 sha256sum > export/SHA256SUMS

      - name: Upload immutable source export
        uses: actions/upload-artifact@v4
        with:
          name: laws-shared-compass-conformance-source-export
          path: export
          if-no-files-found: error
          retention-days: 7
