            if(!proof.woodlandFullyResident)throw Error('WOODLAND_108_BATCHES_NOT_RESIDENT:'+A.batchText);
            const canvas=page.locator('#h-earth-functional-landscape-canvas');
            await canvas.hover();
            await page.mouse.wheel(0,-490);
            await delay(700);
            const B=await shot(page,'woodland-full-b');
            await page.mouse.wheel(0,490);
            await delay(750);
            const A2=await shot(page,'woodland-full-return');
            proof.grassABAReturn=Boolean(A.position&&A2.position&&B.position)&&
              Math.hypot(A.position.x-A2.position.x,A.position.z-A2.position.z)<.15&&
              Math.hypot(A.position.x-B.position.x,A.position.z-B.position.z)>.5&&
              Math.abs(wrapped(A.yawDegrees-A2.yawDegrees))<3;
            if(!proof.grassABAReturn)throw Error('WOODLAND_NATIVE_A_B_A_NOT_RESTORED');
            await turnNative(page,35,'WOODLAND_TURN_AWAY');
            const away=await shot(page,'woodland-look-away-full');
            proof.headingLookAwayObserved=Math.abs(wrapped(away.yawDegrees-A.yawDegrees))>=12;
            await turnNative(page,A.yawDegrees,'WOODLAND_HEADING_RETURN');
            const returned=await shot(page,'woodland-heading-restored');
            proof.headingReturnWithin3Degrees=Math.abs(wrapped(returned.yawDegrees-A.yawDegrees))<=3;
            if(!proof.headingLookAwayObserved||!proof.headingReturnWithin3Degrees)throw Error('WOODLAND_HEADING_GESTURE_NOT_PROVEN');
          
            await open(page,base);
            const coastReady=await waitUntil(page,()=>{
              const root=document.querySelector('#h-earth-functional-landscape-route');
              const loader=document.querySelector('.h-earth-experience-loader');
              const style=loader?getComputedStyle(loader):null;
              const hidden=!loader||style?.display==='none'||style?.visibility==='hidden'||Number(style?.opacity)<.03;
              return root?.dataset.run8eReady==='true'&&root?.dataset.globalGroundcoverGpuResident==='true'&&hidden;
            },120000);
            const coast=await shot(page,'coast-after-global-cover');
            proof.coastGlobalCoverResident=coastReady&&coast.globalCoverResident==='true';
            proof.coastLoaderHidden=coastReady&&coast.loaderHidden;
            proof.coastalArrivalVerified=Boolean(coast.position)&&Math.hypot(coast.position.x,coast.position.z+96)<12;
            if(!proof.coastGlobalCoverResident||!proof.coastLoaderHidden||!proof.coastalArrivalVerified)
              throw Error('COAST_NOT_FULLY_PRESENTED:'+coast.batchText);
            await turnNative(page,165,'COAST_SEAWARD');
            const beach=await shot(page,'coast-seaward-sand');
            proof.coastTurnedSeaward=Number.isFinite(beach.yawDegrees)&&Math.abs(wrapped(beach.yawDegrees-165))<=3;
            proof.browserErrorCount=proof.pageErrors.length+proof.consoleErrors.length+proof.requestFailures.length;
            if(proof.browserErrorCount)throw Error('BROWSER_PAGE_CONSOLE_OR_NETWORK_ERRORS');
            if(!proof.coastTurnedSeaward)throw Error('NO_SEAWARD_VIEW');
            proof.result='PASS_REAL_FULLY_RESIDENT_VIEWS_OWNER_VISUAL_PENDING';
          }
          try{
            await run();
          }catch(e){
            proof.result='INCOMPLETE_OR_FAIL_CLOSED';
            proof.failure=String(e?.stack??e);
            throw e;
          }finally{
            await fs.mkdir(output,{recursive:true});
            await fs.writeFile(output+'/receipt.json',JSON.stringify(proof,null,2)+'\n');
            if(browser)await browser.close();
            server.kill();
          }
          NODE
          node --check .h-earth-gen2711-browser.mjs

      - name: Capture native mobile grass A-B-A and default beach pixels
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          timeout 420s node .h-earth-gen2711-browser.mjs

      - name: Preserve exact-head source and pixel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-gen2711-fast-grass-beach-${{ inputs.target_sha }}
          path: /tmp/h-earth-gen2711-fast
          if-no-files-found: error
          retention-days: 30

  ground-material-comparison:
    if: ${{ inputs.route_query == 'qualification=groundcover-factor-v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require the admitted fixed comparison
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          ROUTE_PATH: ${{ inputs.route_path }}
          EXERCISE: ${{ inputs.exercise_vegetation_residency }}
          TIMING_SHIM: ${{ inputs.apply_timing_shim }}
        run: |
          test "$TARGET_SHA" = 60b3c07f0216645119a1b92b16dac82cae739145
          test "$ROUTE_PATH" = /showroom/globe/h-earth/
          test "$EXERCISE" = false
          test "$TIMING_SHIM" = false
      - name: Check out immutable runner tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - name: Check out complete fixed baseline
        uses: actions/checkout@v4
        with:
          ref: 60b3c07f0216645119a1b92b16dac82cae739145
          path: baseline
          persist-credentials: false
      - name: Check out complete fixed candidate
        uses: actions/checkout@v4
        with:
          ref: 60b3c07f0216645119a1b92b16dac82cae739145
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate bounded comparison tooling
        working-directory: tooling
        run: node --test tools/h-earth-ground-material-comparison.v1.test.mjs tools/h-earth-groundcover-factor-overlay.test.mjs
      - name: Install Chromium
        working-directory: tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture eighteen published-renderer groundcover factor images
        working-directory: tooling
        run: |
          timeout 2400s node tools/h-earth-ground-material-comparison.v1.mjs --baseline-dir ../baseline --candidate-dir ../candidate --output "${{ runner.temp }}/ground-material-comparison"
      - name: Preserve comparison evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-groundcover-factor-${{ github.run_id }}
          path: ${{ runner.temp }}/ground-material-comparison
          if-no-files-found: error
          retention-days: 30

  ground-material-mapwide-scout:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.route_query == 'qualification=groundcover-mapwide-scout-v1') ||
