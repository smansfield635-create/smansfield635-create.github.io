name: Metaverse Benchmark CP7 Visual Spatial Baseline

on:
  pull_request:
    branches:
      - main
    paths:
      - "verification/benchmark-corpus/inventory-pass-v1/checkpoint-07/visual-and-spatial-realization-baseline.mjs"
      - ".github/workflows/metaverse-benchmark-cp7-visual-spatial.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metaverse-benchmark-cp7-visual-spatial-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Execute visual and spatial realization baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout execution head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install browser driver
        run: npm install --no-save --no-package-lock puppeteer-core@24.15.0

      - name: Record browser environment
        shell: bash
        run: |
          set -euo pipefail
          google-chrome-stable --version || google-chrome --version || chromium --version
          node --version

      - name: Execute CP7 browser visual baseline
        id: capture
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node verification/benchmark-corpus/inventory-pass-v1/checkpoint-07/visual-and-spatial-realization-baseline.mjs | tee cp7-visual-and-spatial-realization-baseline.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Anchor execution identity
        if: always()
        shell: bash
        env:
          EXECUTION_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          EXECUTION_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ -f cp7-visual-and-spatial-realization-baseline.json ]; then
            jq \
              --arg branch "$EXECUTION_BRANCH" \
              --arg commit "$EXECUTION_COMMIT" \
              --arg runId "$WORKFLOW_RUN_ID" \
              --arg runAttempt "$WORKFLOW_RUN_ATTEMPT" \
              '.execution={branch:$branch,commit:$commit,workflowRunId:$runId,workflowRunAttempt:$runAttempt}' \
              cp7-visual-and-spatial-realization-baseline.json > cp7-visual-and-spatial-realization-baseline.anchored.json
            mv cp7-visual-and-spatial-realization-baseline.anchored.json cp7-visual-and-spatial-realization-baseline.json
          fi

      - name: Write checkpoint summary
        if: always()
        shell: bash
        run: |
          {
            echo "# CP7 Visual and Spatial Realization Baseline"
            echo
            echo "Execution branch: \`${{ github.event.pull_request.head.ref || github.ref_name }}\`"
            echo
            echo "Execution commit: \`${{ github.event.pull_request.head.sha || github.sha }}\`"
            echo
            echo "Capture exit code: \`${{ steps.capture.outputs.exit_code || 'not-returned' }}\`"
            echo
            if [ -f cp7-visual-and-spatial-realization-baseline.json ]; then
              echo "Status: \`$(jq -r '.status' cp7-visual-and-spatial-realization-baseline.json)\`"
              echo
              echo '```json'
              jq '{status,assertions,benchmarkSummaries,visualBaselineDigest,nextCheckpoint}' cp7-visual-and-spatial-realization-baseline.json
              echo '```'
            else
              echo "Status: \`NO_ARTIFACT_PRODUCED\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CP7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metaverse-benchmark-cp7-visual-spatial-baseline
          path: |
            cp7-visual-and-spatial-realization-baseline.json
            cp7-visual-and-spatial-realization-baseline.log
            cp7-screenshots/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce checkpoint result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f cp7-visual-and-spatial-realization-baseline.json
          test "$(jq -r '.status' cp7-visual-and-spatial-realization-baseline.json)" = "PASS_VISUAL_AND_SPATIAL_REALIZATION_BASELINE"
