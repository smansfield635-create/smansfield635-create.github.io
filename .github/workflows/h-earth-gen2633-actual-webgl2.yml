name: H-Earth Gen2633 Actual WebGL2 Qualification
on:
  pull_request:
    paths:
      - 'showroom/globe/h-earth/render/compact-four-tree-foliage.v1.js'
      - 'showroom/globe/h-earth/validation/four-tree-compact-webgl2-browser.verify.mjs'
      - '.github/workflows/h-earth-gen2633-actual-webgl2.yml'
  workflow_dispatch:
concurrency:
  group: h-earth-gen2633-webgl2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  actual-webgl2:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Retrieve exact two-file candidate without repository checkout
        shell: bash
        run: |
          set -euo pipefail
          root="showroom/globe/h-earth"
          mkdir -p "$root/render" "$root/validation"
          candidate="${{ github.event.pull_request.head.sha || github.sha }}"
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]]
          base="https://raw.githubusercontent.com/${{ github.repository }}/$candidate"
          for file in render/compact-four-tree-foliage.v1.js validation/four-tree-compact-webgl2-browser.verify.mjs; do
            curl -fLsS --retry 3 --max-time 60 "$base/$root/$file" -o "$root/$file"
            expected="$(curl -fLsS --retry 3 --max-time 60 -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${{ github.repository }}/contents/$root/$file?ref=$candidate" | jq -r .sha)"
            actual="$(git hash-object "$root/$file")"
            echo "H_EARTH_EXACT_SOURCE:$file:$actual"
            test "$actual" = "$expected"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and draw compact leaves in real WebGL2
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          node showroom/globe/h-earth/validation/four-tree-compact-webgl2-browser.verify.mjs | tee actual-webgl2-receipt.json
      - name: Preserve browser qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-actual-webgl2-${{ github.run_id }}
          path: actual-webgl2-receipt.json
          retention-days: 90
