name: Characters Adapt Laws Moon

on:
  push:
    branches:
      - agent/characters-night-world-state-proof

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/characters-night-world-state-proof
          fetch-depth: 2
          sparse-checkout: |
            characters
          sparse-checkout-cone-mode: true
      - name: Adapt Laws lunar primitive into Characters moon
        env:
          OLD_B64: 
          NEW_B64: 
        run: |
          python3 -c "import os,base64,pathlib; p=pathlib.Path('characters/app.mjs'); s=p.read_text(); old=base64.b64decode(os.environ['OLD_B64']).decode(); new=base64.b64decode(os.environ['NEW_B64']).decode(); assert old in s or 'float crater(vec2 p,vec2 c,float radius)' in s, 'moon shader anchor missing'; p.write_text(s if 'float crater(vec2 p,vec2 c,float radius)' in s else s.replace(old,new,1))"
          node --check characters/app.mjs
          grep -q "float crater(vec2 p,vec2 c,float radius)" characters/app.mjs
          grep -q "maria" characters/app.mjs
          git diff --check
      - name: Commit moon adaptation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add characters/app.mjs
          git commit -m 'Characters: adapt Laws lunar primitive'
          git pull --rebase origin agent/characters-night-world-state-proof
          git push origin HEAD:agent/characters-night-world-state-proof
