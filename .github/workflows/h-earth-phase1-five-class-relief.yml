name: H-Earth Phase1 Five-Class Relief Measurement
on:
  push:
    branches:
      - h-earth/landscape-definition-phase1-crosswalk-v1
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node h-earth-3d/validation/phase1-five-class-relief.measure.mjs "$PWD" | tee phase1-five-class-relief.json
      - uses: actions/upload-artifact@v4
        with:
          name: h-earth-phase1-five-class-relief
          path: phase1-five-class-relief.json
          retention-days: 90
