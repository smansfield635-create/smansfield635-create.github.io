name: Bounded H-Earth camera envelope and animation standard builder

on:
  push:
    branches:
      - agent/h-earth-camera-envelope-animation-standard-001
    paths:
      - .github/workflows/h-earth-camera-envelope-animation-standard-builder.yml

permissions:
  contents: write

jobs:
  build-audit-and-freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bounded candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/h-earth-camera-envelope-animation-standard-001
          fetch-depth: 0

      - name: Apply exact capacity-only source correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('showroom/globe/h-earth/capacity.js')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "  ownsCameraCapacity: true,\n  ownsNavigationCapacity: true,",
              "  ownsCameraCapacity: true,\n  ownsLivingPresentationCapacity: true,\n  ownsNavigationCapacity: true,",
              'capacity ownership insertion'
          )

          replace_once(
              "  ownsProjectionMathematics: false,\n  ownsProjectedPrimitiveConstruction: false,",
              "  ownsProjectionMathematics: false,\n  ownsLivingPresentationRuntime: false,\n  ownsProjectedPrimitiveConstruction: false,",
              'runtime nonownership insertion'
          )

          replace_once(
              " * Camera capacity.\n */\nexport const H_EARTH_3D_CAMERA_CAPACITY = deepFreeze({",
              " * Camera capacity.\n */\nexport const H_EARTH_3D_CAMERA_ENVELOPE_CORRECTION_ID =\n  'H_EARTH_LANDWARD_GROUND_INSPECTION_CAMERA_ENVELOPE_v1';\n\nexport const H_EARTH_3D_CAMERA_CAPACITY = deepFreeze({",
              'camera correction identity insertion'
          )

          replacements = {
              "      y: 24,\n      z: 64": "      y: 14,\n      z: -240",
              "      y: 0.5,\n      z: -128": "      y: 0.6,\n      z: -48",
              "    verticalFovDegrees: 52,": "    verticalFovDegrees: 60,",
              "    farPlane: 194,": "    farPlane: 512,"
          }
          for old, new in replacements.items():
              replace_once(old, new, f'camera value replacement {old!r}')

          replace_once(
              "    projectionAuthority:\n      'RENDERER'\n  }),\n\n  futureControllerCapacity:",
              "    projectionAuthority:\n      'RENDERER'\n  }),\n\n  initialCompositionIntent: deepFreeze({\n    compositionId:\n      H_EARTH_3D_CAMERA_ENVELOPE_CORRECTION_ID,\n    compositionRole:\n      'LANDWARD_GROUND_INSPECTION_LOOKING_WATERWARD',\n    cameraSide:\n      'LAND_SIDE_NEGATIVE_Z',\n    viewDirection:\n      'TOWARD_POSITIVE_Z_WATER_SIDE',\n    shorelineReferenceZ: -96,\n    wetSandForegroundRequired: true,\n    foamContactSeamRequired: true,\n    waterRecessionRequired: true,\n    futureContextDepthReserved: true,\n    admittedGeometryMutationPermitted: false,\n    animationStandardPreparationOnly: true\n  }),\n\n  futureControllerCapacity:",
              'camera composition intent insertion'
          )

          living_capacity = r'''
/**
 * Bounded living-presentation capacity.
 *
 * This defines motion limits only. It does not create an animation runtime,
 * fluid simulation, traversal, collision, gameplay, or geometry mutation.
 */
export const H_EARTH_3D_LIVING_PRESENTATION_CAPACITY_ID =
  'H_EARTH_MINIMUM_SHORELINE_LIVING_PRESENTATION_CAPACITY_v1';

export const H_EARTH_3D_LIVING_PRESENTATION_CAPACITY = deepFreeze({
  capacityId:
    H_EARTH_3D_LIVING_PRESENTATION_CAPACITY_ID,

  status:
    'CAPACITY_STANDARD_DEFINED_RUNTIME_NOT_CREATED',

  scope: deepFreeze({
    sourceObjectIds: deepFreeze([
      'OBJ_002_FOREGROUND_WET_SAND',
      'OBJ_005_SHORELINE_FOAM_LINE',
      'OBJ_007_WATER_SURFACE_PLANE'
    ]),
    presentationOnly: true,
    minimumShorelinePackageOnly: true
  }),

  geometryBoundary: deepFreeze({
    admittedGeometryMutationPermitted: false,
    admittedVertexMutationPermitted: false,
    admittedIndexMutationPermitted: false,
    admittedBoundsMutationPermitted: false,
    primitiveIdentityMutationPermitted: false,
    sourceObjectIdentityMutationPermitted: false,
    sharedShorelineBoundaryMutationPermitted: false,
    materialPresentationMutationPermitted: true
  }),

  scheduler: deepFreeze({
    singleCoordinatorRequired: true,
    requestAnimationFrameRequired: true,
    maximumActiveFramesPerSecond: 30,
    nominalFrameIntervalMilliseconds: 1000 / 30,
    maximumMainThreadWorkMillisecondsPerFrame: 8,
    unboundedTimersPermitted: false,
    duplicateAnimationLoopsPermitted: false,
    deterministicPhaseSeedsRequired: true
  }),

  suspension: deepFreeze({
    suspendWhenDocumentHidden: true,
    suspendWhenStageOffscreen: true,
    suspendOnPageHide: true,
    controlledResumeRequired: true,
    backgroundAnimationWorkPermitted: false
  }),

  reducedMotion: deepFreeze({
    operatingSystemPreferenceRequired: true,
    staticEquivalentRequired: true,
    animationLoopsMustStop: true,
    timersMustStop: true,
    semanticInformationMustRemainAvailable: true
  }),

  permittedMotionChannels: deepFreeze([
    'TRANSFORM',
    'OPACITY',
    'BACKGROUND_POSITION',
    'BOUNDED_CSS_CUSTOM_PROPERTY'
  ]),

  prohibitedMotionChannels: deepFreeze([
    'LAYOUT_GEOMETRY',
    'DOM_NODE_CHURN',
    'ADMITTED_VERTEX_REWRITE',
    'ADMITTED_INDEX_REWRITE',
    'SHORELINE_BOUNDARY_REWRITE',
    'PHYSICAL_FLUID_SIMULATION'
  ]),

  materialMotionIntent: deepFreeze({
    wetSand:
      'SUBTLE_REFLECTED_LIGHT_AND_DAMP_SHEEN_VARIATION',
    foam:
      'GENTLE_CONTACT_BRIGHTNESS_AND_LATERAL_PHASE_MOTION',
    water:
      'SLOW_SURFACE_SHIMMER_AND_DIRECTIONAL_HIGHLIGHT_DRIFT'
  }),

  qualityCapacity: deepFreeze({
    maximumConcurrentMaterialAnimations: 3,
    devicePixelRatioMustRemainWithinViewportCapacity: true,
    adaptiveQualityPermitted: true,
    frameCostSamplingRequired: true,
    qualityMayDecreaseToProtectFrameBudget: true,
    qualityMayIncreaseOnlyWithinDeclaredCapacity: true
  }),

  lifecycleStates: deepFreeze([
    'IDLE',
    'RUNNING',
    'SUSPENDED',
    'REDUCED_MOTION_STATIC',
    'DISPOSED'
  ]),

  claimCeilings: deepFreeze({
    animationRuntimeCreated: false,
    animationExecuted: false,
    fluidSimulationCreated: false,
    physicalWaveSimulationCreated: false,
    weatherSimulationCreated: false,
    traversalCreated: false,
    gameplayCreated: false,
    visualPassClaim: false,
    productionClaim: false
  })
});

'''
          replace_once(
              "/**\n * Render-stage limits.\n */",
              living_capacity + "/**\n * Render-stage limits.\n */",
              'living presentation capacity insertion'
          )

          replace_once(
              "  fluidSimulationClaim: false,\n\n  matrixCollapse: false",
              "  fluidSimulationClaim: false,\n  livingPresentationRuntimeClaim: false,\n  animationExecutionClaim: false,\n  physicalSimulationClaim: false,\n\n  matrixCollapse: false",
              'claim ceiling insertion'
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify source syntax and geometry source custody
        shell: bash
        env:
          BASE_COMMIT: 6c5c923558766047763b8ecc16b06d52a8f25422
        run: |
          node --experimental-default-type=module --check showroom/globe/h-earth/capacity.js
          git diff --exit-code "$BASE_COMMIT" -- \
            showroom/globe/h-earth/environment.js \
            showroom/globe/h-earth/render/geometry-preview.js \
            showroom/globe/h-earth/render/geometry-ground.js \
            showroom/globe/h-earth/render/geometry-foam.js \
            showroom/globe/h-earth/render/geometry-water.js \
            showroom/globe/h-earth/render/shoreline-preview.js \
            showroom/globe/h-earth/render/geometry-kernel.js \
            showroom/globe/h-earth/render/geometry-kernel.north.js \
            showroom/globe/h-earth/render/geometry-kernel.east.js \
            showroom/globe/h-earth/render/geometry-kernel.south.js \
            showroom/globe/h-earth/render/geometry-kernel.west.js \
            showroom/globe/h-earth/admitted-geometry-frame.js

      - name: Execute camera, geometry-preservation, and animation-capacity audit
        shell: bash
        run: |
          node --experimental-default-type=module --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {
            H_EARTH_3D_CAMERA_ENVELOPE_CORRECTION_ID,
            H_EARTH_3D_CAMERA_CAPACITY,
            H_EARTH_3D_LIVING_PRESENTATION_CAPACITY_ID,
            H_EARTH_3D_LIVING_PRESENTATION_CAPACITY,
            evaluateHEarth3DCameraCapacity
          } from './showroom/globe/h-earth/capacity.js';
          import {
            H_EARTH_3D_SHARED_SHORELINE_BOUNDARY
          } from './showroom/globe/h-earth/environment.js';
          import {
            H_EARTH_3D_MINIMUM_NATIVE_SHORELINE_OBJECT_IDS,
            previewHEarthMinimumShorelineGeometry
          } from './showroom/globe/h-earth/render/shoreline-preview.js';

          const checks = [];
          const check = (id, condition, details = null) => {
            assert.equal(Boolean(condition), true, `${id} failed`);
            checks.push({ id, passed: true, details });
          };

          const camera = H_EARTH_3D_CAMERA_CAPACITY.initialProjectionCandidate;
          const composition = H_EARTH_3D_CAMERA_CAPACITY.initialCompositionIntent;
          const shoreline = H_EARTH_3D_SHARED_SHORELINE_BOUNDARY;
          const shorelineZ = shoreline.samples.reduce(
            (sum, sample) => sum + sample.z,
            0
          ) / shoreline.samples.length;

          check('CAMERA_CORRECTION_ID',
            H_EARTH_3D_CAMERA_ENVELOPE_CORRECTION_ID ===
              'H_EARTH_LANDWARD_GROUND_INSPECTION_CAMERA_ENVELOPE_v1');
          check('CAMERA_POSITION_EXACT',
            camera.position.x === 0 && camera.position.y === 14 && camera.position.z === -240,
            camera.position);
          check('CAMERA_TARGET_EXACT',
            camera.target.x === 0 && camera.target.y === 0.6 && camera.target.z === -48,
            camera.target);
          check('CAMERA_FOV_EXACT', camera.verticalFovDegrees === 60);
          check('CAMERA_NEAR_PLANE_EXACT', camera.nearPlane === 0.25);
          check('CAMERA_FAR_PLANE_EXACT', camera.farPlane === 512);
          check('CAMERA_ON_LAND_SIDE', camera.position.z < shorelineZ, { shorelineZ });
          check('CAMERA_LOOKS_WATERWARD', camera.target.z > shorelineZ, { shorelineZ });
          check('COMPOSITION_INTENT_EXACT',
            composition.compositionRole === 'LANDWARD_GROUND_INSPECTION_LOOKING_WATERWARD');
          check('COMPOSITION_PRESERVES_GEOMETRY',
            composition.admittedGeometryMutationPermitted === false);

          const cameraEvaluation = evaluateHEarth3DCameraCapacity({
            yawDegrees: 0,
            pitchDegrees: 0,
            zoomScale: 1,
            target: camera.target,
            verticalFovDegrees: camera.verticalFovDegrees,
            nearPlane: camera.nearPlane,
            farPlane: camera.farPlane
          });
          check('CAMERA_CAPACITY_EVALUATION', cameraEvaluation.eligible === true,
            cameraEvaluation);
          check('CAMERA_CAPACITY_NO_ADJUSTMENT',
            cameraEvaluation.adjustmentRequired === false,
            cameraEvaluation.normalizedCameraState);

          const subtract = (a, b) => ({ x: a.x-b.x, y: a.y-b.y, z: a.z-b.z });
          const dot = (a, b) => a.x*b.x + a.y*b.y + a.z*b.z;
          const cross = (a, b) => ({
            x: a.y*b.z - a.z*b.y,
            y: a.z*b.x - a.x*b.z,
            z: a.x*b.y - a.y*b.x
          });
          const normalize = (v) => {
            const length = Math.hypot(v.x, v.y, v.z);
            return { x:v.x/length, y:v.y/length, z:v.z/length };
          };
          const forward = normalize(subtract(camera.target, camera.position));
          const right = normalize(cross(forward, camera.up));
          const up = normalize(cross(right, forward));
          check('CAMERA_FORWARD_POSITIVE_Z', forward.z > 0.99, forward);

          const project = (point, aspectRatio) => {
            const relative = subtract(point, camera.position);
            const depth = dot(relative, forward);
            const horizontal = dot(relative, right);
            const vertical = dot(relative, up);
            const tanVertical = Math.tan(camera.verticalFovDegrees * Math.PI / 360);
            const tanHorizontal = tanVertical * aspectRatio;
            return {
              depth,
              x: horizontal / (depth * tanHorizontal),
              y: vertical / (depth * tanVertical),
              depthEligible: depth >= camera.nearPlane && depth <= camera.farPlane
            };
          };

          const anchors = {
            foregroundWetSand: { x:0, y:0, z:-210 },
            shorelineContact: { x:0, y:0.79, z:shorelineZ },
            waterSurface: { x:0, y:0.68, z:-48 },
            futureContext: { x:0, y:10, z:192 }
          };
          for (const [name, point] of Object.entries(anchors)) {
            for (const aspectRatio of [0.5625, 1.6]) {
              const projected = project(point, aspectRatio);
              check(`ANCHOR_${name.toUpperCase()}_${String(aspectRatio).replace('.', '_')}_DEPTH`,
                projected.depthEligible, projected);
              check(`ANCHOR_${name.toUpperCase()}_${String(aspectRatio).replace('.', '_')}_FRUSTUM`,
                Math.abs(projected.x) <= 1 && Math.abs(projected.y) <= 1,
                projected);
            }
          }

          check('LIVING_CAPACITY_ID',
            H_EARTH_3D_LIVING_PRESENTATION_CAPACITY_ID ===
              'H_EARTH_MINIMUM_SHORELINE_LIVING_PRESENTATION_CAPACITY_v1');
          check('LIVING_CAPACITY_FROZEN',
            Object.isFrozen(H_EARTH_3D_LIVING_PRESENTATION_CAPACITY));
          check('SINGLE_SCHEDULER_REQUIRED',
            H_EARTH_3D_LIVING_PRESENTATION_CAPACITY.scheduler.singleCoordinatorRequired === true);
          check('FRAME_RATE_BOUNDED',
            H_EARTH_3D_LIVING_PRESENTATION_CAPACITY.scheduler.maximumActiveFramesPerSecond === 30);
          check('FRAME_WORK_BOUNDED',
            H_EARTH_3D_LIVING_PRESENTATION_CAPACITY.scheduler.maximumMainThreadWorkMillisecondsPerFrame === 8);
          check('HIDDEN_SUSPENSION_REQUIRED',
            H_EARTH_3D_LIVING_PRESENTATION_CAPACITY.suspension.suspendWhenDocumentHidden === true);
          check('OFFSCREEN_SUSPENSION_REQUIRED',
            H_EARTH_3D_LIVING_PRESENTATION_CAPACITY.suspension.suspendWhenStageOffscreen === true);
          check('REDUCED_MOTION_STATIC_EQUIVALENT',
            H_EARTH_3D_LIVING_PRESENTATION_CAPACITY.reducedMotion.staticEquivalentRequired === true);
          check('GEOMETRY_MUTATION_PROHIBITED',
            H_EARTH_3D_LIVING_PRESENTATION_CAPACITY.geometryBoundary.admittedGeometryMutationPermitted === false);
          check('FLUID_SIMULATION_NOT_CREATED',
            H_EARTH_3D_LIVING_PRESENTATION_CAPACITY.claimCeilings.fluidSimulationCreated === false);
          check('ANIMATION_RUNTIME_NOT_CREATED',
            H_EARTH_3D_LIVING_PRESENTATION_CAPACITY.claimCeilings.animationRuntimeCreated === false);

          const preview = previewHEarthMinimumShorelineGeometry({
            sourceObjectId: 'OBJ_002_FOREGROUND_WET_SAND',
            requestedPurpose: 'MINIMUM_NATIVE_SHORELINE_GEOMETRY_PREVIEW',
            requestId: 'H_EARTH_CAMERA_ENVELOPE_EXECUTION_AUDIT_001',
            shorelineBoundary: shoreline
          });
          check('SHORELINE_PREVIEW_EXECUTED', preview.ok === true, preview.issues);
          check('SHORELINE_PRIMITIVE_COUNT', preview.primitives.length === 3,
            preview.primitives.map((primitive) => primitive.primitiveId));
          check('SHORELINE_SOURCE_OBJECT_IDS',
            JSON.stringify(preview.sourceObjectIds) ===
              JSON.stringify(H_EARTH_3D_MINIMUM_NATIVE_SHORELINE_OBJECT_IDS),
            preview.sourceObjectIds);
          check('SHORELINE_BOUNDARY_OCCURRENCE_PRESERVED',
            preview.shorelineBoundary === shoreline);
          check('SHORELINE_BOUNDARY_ID_PRESERVED',
            preview.shorelineBoundaryId === shoreline.boundaryId);
          check('SHORELINE_GEOMETRY_REMAINS_UNADMITTED_AT_PREVIEW',
            preview.admitted === false && preview.WestAdmissionPerformed === false);
          check('SHORELINE_FLUID_SIMULATION_FALSE', preview.fluidSimulation === false);
          check('SHORELINE_PRIMITIVES_FROZEN',
            preview.primitives.every((primitive) => Object.isFrozen(primitive)));

          const receipt = {
            receiptType: 'H_EARTH_CAMERA_ENVELOPE_AND_ANIMATION_STANDARD_EXECUTION_AUDIT',
            status: 'PASS',
            checkCount: checks.length,
            checks,
            camera,
            composition,
            livingPresentationCapacityId: H_EARTH_3D_LIVING_PRESENTATION_CAPACITY_ID,
            shorelineBoundaryId: shoreline.boundaryId,
            sourceObjectIds: preview.sourceObjectIds,
            primitiveCount: preview.primitives.length,
            geometryMutationPerformed: false,
            animationRuntimeCreated: false,
            mainChanged: false
          };
          fs.writeFileSync('/tmp/h-earth-camera-envelope-execution-audit.json',
            JSON.stringify(receipt, null, 2) + '\n');
          console.log(`H_EARTH_CAMERA_ENVELOPE_AUDIT=PASS CHECKS=${checks.length}`);
          NODE

      - name: Build exact audit receipt
        shell: bash
        env:
          BASE_COMMIT: 6c5c923558766047763b8ecc16b06d52a8f25422
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          execution = json.loads(
              Path('/tmp/h-earth-camera-envelope-execution-audit.json').read_text(encoding='utf-8')
          )
          receipt = {
              'receiptType': 'H_EARTH_CAMERA_ENVELOPE_AND_ANIMATION_STANDARD_CANDIDATE_AUDIT_RECEIPT',
              'status': 'PASS',
              'baseCommit': '6c5c923558766047763b8ecc16b06d52a8f25422',
              'branch': 'agent/h-earth-camera-envelope-animation-standard-001',
              'changedProductionPaths': ['showroom/globe/h-earth/capacity.js'],
              'capacityCandidateGitBlob': subprocess.check_output(
                  ['git', 'hash-object', 'showroom/globe/h-earth/capacity.js'], text=True
              ).strip(),
              'geometrySourceCustody': 'PASS_UNCHANGED_FROM_BASE',
              'sourceSyntaxAudit': 'PASS',
              'executionAudit': execution,
              'cameraEnvelopeComplete': True,
              'geometryIdentitiesPreserved': True,
              'animationPerformanceStandardDefined': True,
              'animationRuntimeCreated': False,
              'mainChanged': False,
              'mergeAuthorized': False
          }
          Path('/tmp/h-earth-camera-envelope-audit-receipt.json').write_text(
              json.dumps(receipt, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(receipt, indent=2))
          PY

      - name: Upload bounded audit receipt
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-camera-envelope-animation-standard-audit
          path: /tmp/h-earth-camera-envelope-audit-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Commit audited candidate and remove builder
        shell: bash
        run: |
          CAPACITY_BLOB="$(git hash-object showroom/globe/h-earth/capacity.js)"
          CHECK_COUNT="$(python -c "import json; print(json.load(open('/tmp/h-earth-camera-envelope-execution-audit.json'))['checkCount'])")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/h-earth-camera-envelope-animation-standard-builder.yml
          git add showroom/globe/h-earth/capacity.js
          git commit -m "Correct H-Earth camera envelope and animation capacity" -m "SOURCE_SYNTAX_AUDIT=PASS" -m "GEOMETRY_SOURCE_CUSTODY=PASS_UNCHANGED_FROM_BASE" -m "EXECUTION_AUDIT=PASS" -m "EXECUTION_CHECK_COUNT=${CHECK_COUNT}" -m "CAPACITY_CANDIDATE_GIT_BLOB=${CAPACITY_BLOB}" -m "ANIMATION_RUNTIME_CREATED=FALSE" -m "MAIN_CHANGED=FALSE"
          git push origin HEAD:agent/h-earth-camera-envelope-animation-standard-001
