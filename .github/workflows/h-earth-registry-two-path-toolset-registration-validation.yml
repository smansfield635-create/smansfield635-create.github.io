name: CP10 Operation B Finalization Evidence and Termination

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h-earth-registry-two-path-toolset-registration-validation.yml'

permissions:
  contents: write
  actions: read
  pull-requests: read

env:
  TOOLING_HEAD: f978d62886b71bd0e619e4a713472ebffea43419
  REPAIR_BASE_HEAD: 3d80989e4571e62a5b9997aa70b223c0678ee1d3
  CANDIDATE_HEAD: 603f74d3d4d52909812b0564102b742ded0ee27f
  SUBJECT_HEAD: 7c0b8871928b21cd9b2806f058bce34eed11f2ba
  EVIDENCE_RUN_ID: '30977132925'
  BUILDER_ARTIFACT: cp10-operation-b-finalization-builder-30977132925-1
  VERIFIER_ARTIFACT: cp10-operation-b-finalization-verifier-30977132925-1
  BUILDER_PAYLOAD_SHA256: 92cc76db967ac67994171f2dc02b140b0db154268e9fd315f5158845d527fffe
  VERIFIER_PAYLOAD_SHA256: 68ed87b77f80d190ec8c1be8c5c195fe4223a2c358f4a5bd0db7e82ad58bf1d6
  OPERATION_B_ID: H_EARTH_REGISTRY_TWO_PATH_SUCCESSOR_REPAIR_OPERATION_B_v1
  OPERATION_B_SCOPE: H_EARTH:REGISTRY_TWO_PATH_SUCCESSOR_REPAIR:OPERATION_B:V1
  OPERATION_B_GENERATION: '63'
  FINALIZATION_ID: CP10_OPERATION_B_FINALIZATION_EVIDENCE_AND_TERMINATION_v1
  FINALIZATION_SCOPE: H_EARTH:REGISTRY_TWO_PATH_SUCCESSOR_REPAIR:OPERATION_B:FINALIZATION:V1
  FINALIZATION_GENERATION: '75'
  LOCK_REF: refs/heads/operation-locks/repository-operation-intake-v1
  LEDGER_PATH: .github/operation-intake/active-operation-ledger.v1.json

jobs:
  certify-and-close:
    name: certify-prior-fresh-jobs-and-close-generations-63-and-75
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download exact successful builder evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILDER_ARTIFACT }}
          path: ${{ runner.temp }}/builder
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.EVIDENCE_RUN_ID }}
      - name: Download exact successful fresh-verifier evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.VERIFIER_ARTIFACT }}
          path: ${{ runner.temp }}/verifier
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.EVIDENCE_RUN_ID }}
      - name: Verify immutable pull requests and active locks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/570" > /tmp/pr570.json
          gh api "repos/${GITHUB_REPOSITORY}/pulls/590" > /tmp/pr590.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p570=JSON.parse(fs.readFileSync('/tmp/pr570.json')),p590=JSON.parse(fs.readFileSync('/tmp/pr590.json'));
          if(p570.state!=='open'||p570.draft!==true||p570.merged_at!==null||p570.head.sha!==process.env.SUBJECT_HEAD)throw Error('PR570_IDENTITY_CHANGED');
          if(p590.state!=='open'||p590.draft!==true||p590.merged_at!==null||p590.head.sha!==process.env.CANDIDATE_HEAD)throw Error('PR590_IDENTITY_CHANGED');
          NODE
          git fetch --no-tags origin operation-locks/repository-operation-intake-v1
          git show FETCH_HEAD:"$LEDGER_PATH" > /tmp/preclose-ledger.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const l=JSON.parse(fs.readFileSync('/tmp/preclose-ledger.json'));
          for(const [id,gen,scope] of [[process.env.OPERATION_B_ID,63,process.env.OPERATION_B_SCOPE],[process.env.FINALIZATION_ID,75,process.env.FINALIZATION_SCOPE]]){
            const x=Object.values(l.activeScopes??{}).find(v=>v.operationId===id&&Number(v.lockGeneration)===gen);
            if(!x||x.lockScope!==scope||x.state!=='ADMITTED_LOCKED'||x.released!==false)throw Error(`ACTIVE_LOCK_MISMATCH:${id}`);
          }
          NODE
      - name: Bind exact payload bytes and certify fingerprint equality
        run: |
          set -euo pipefail
          mkdir -p /tmp/cp10-operation-b-final
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const find=(root,name)=>{const hits=[];const walk=d=>{for(const x of fs.readdirSync(d,{withFileTypes:true})){const q=path.join(d,x.name);x.isDirectory()?walk(q):(x.name===name&&hits.push(q));}};walk(root);if(hits.length!==1)throw Error(`ARTIFACT_FILE_CARDINALITY:${root}:${name}:${hits.length}`);return hits[0];};
          const bp=find(process.env.RUNNER_TEMP+'/builder','payload-receipt.json'),vp=find(process.env.RUNNER_TEMP+'/verifier','payload-receipt.json');
          const bt=find(process.env.RUNNER_TEMP+'/builder','transport-receipt.json'),vt=find(process.env.RUNNER_TEMP+'/verifier','transport-receipt.json');
          const bbp=find(process.env.RUNNER_TEMP+'/builder','binding-receipt.json'),vbp=find(process.env.RUNNER_TEMP+'/verifier','binding-receipt.json');
          const bbytes=fs.readFileSync(bp),vbytes=fs.readFileSync(vp),b=JSON.parse(bbytes),v=JSON.parse(vbytes),bb=JSON.parse(fs.readFileSync(bbp)),vb=JSON.parse(fs.readFileSync(vbp));
          if(sha(bbytes)!==process.env.BUILDER_PAYLOAD_SHA256||sha(vbytes)!==process.env.VERIFIER_PAYLOAD_SHA256)throw Error('TRANSPORT_PAYLOAD_BYTE_BINDING_MISMATCH');
          if(b.result!=='PASS_CLOSED_TWO_PATH_SUCCESSOR_REPRODUCED'||v.result!==b.result)throw Error('PAYLOAD_RESULT_MISMATCH');
          if(b.executionHolder!=='CP10_OPERATION_B_BUILDER_HOLDER_002'||v.executionHolder!=='CP10_OPERATION_B_FRESH_VERIFIER_HOLDER_001'||b.executionHolder===v.executionHolder)throw Error('EXECUTION_HOLDER_MISMATCH');
          if(b.baseHead!==process.env.REPAIR_BASE_HEAD||v.baseHead!==b.baseHead||b.candidateHead!==process.env.CANDIDATE_HEAD||v.candidateHead!==b.candidateHead||b.subjectHead!==process.env.SUBJECT_HEAD||v.subjectHead!==b.subjectHead)throw Error('PAYLOAD_IDENTITY_MISMATCH');
          if(b.packageFingerprint!==v.packageFingerprint||bb.packageFingerprint!==b.packageFingerprint||vb.packageFingerprint!==v.packageFingerprint)throw Error('PACKAGE_FINGERPRINT_MISMATCH');
          const expected=['h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.c2-r1-material-only-binding-exact-head.js','h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js'].sort();
          if(JSON.stringify([...b.changedPaths].sort())!==JSON.stringify(expected)||JSON.stringify([...v.changedPaths].sort())!==JSON.stringify(expected))throw Error('TWO_PATH_SCOPE_MISMATCH');
          if(b.subjectChangedPathCount!==25||v.subjectChangedPathCount!==25)throw Error('SUBJECT_PATH_COUNT_MISMATCH');
          for(const x of [b,v])if(x.repairPerformed!==false||x.productMutationPerformed!==false||x.pr570Mutated!==false||x.mergePerformed!==false)throw Error('PROHIBITED_SIDE_EFFECT');
          const c={schema:'CP10_OPERATION_B_FINAL_CERTIFICATION_v1',result:'PASS_CLOSED_TWO_PATH_SUCCESSOR_CONSTRUCTED_AND_INDEPENDENTLY_REPRODUCED',operationId:process.env.OPERATION_B_ID,governingRepairBase:process.env.REPAIR_BASE_HEAD,candidateHead:process.env.CANDIDATE_HEAD,subjectHead:process.env.SUBJECT_HEAD,toolingHead:process.env.TOOLING_HEAD,packageFingerprint:b.packageFingerprint,builderHolder:b.executionHolder,verifierHolder:v.executionHolder,distinctExecutionHolders:true,changedPaths:b.changedPaths,subjectChangedPathCount:b.subjectChangedPathCount,overlayBlob:b.overlayBlob,loaderBlob:b.loaderBlob,predecessorBlob:b.predecessorBlob,builderPayloadSha256:sha(bbytes),verifierPayloadSha256:sha(vbytes),builderTransportRun:30975493311,verifierTransportRun:30975573343,evidenceRun:Number(process.env.EVIDENCE_RUN_ID),productMutationPerformed:false,pr570Mutated:false,mergePerformed:false,mergeAuthority:false};
          c.certificationDigest=sha(Buffer.from(JSON.stringify(c)));
          fs.writeFileSync('/tmp/cp10-operation-b-final/final-certification.json',JSON.stringify(c,null,2)+'\n');
          for(const [src,name] of [[bp,'builder-payload-receipt.json'],[vp,'verifier-payload-receipt.json'],[bt,'builder-transport-receipt.json'],[vt,'verifier-transport-receipt.json'],[bbp,'builder-binding-receipt.json'],[vbp,'verifier-binding-receipt.json']])fs.copyFileSync(src,'/tmp/cp10-operation-b-final/'+name);
          NODE
      - name: Close Operation B generation 63 PASS_CLOSED
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if node tools/operation-intake/repository-operation-lock-manager.v1.mjs --action close --repository "$GITHUB_REPOSITORY" --lock-ref "$LOCK_REF" --operation-id "$OPERATION_B_ID" --lock-scope "$OPERATION_B_SCOPE" --lock-generation "$OPERATION_B_GENERATION" --terminal-disposition PASS_CLOSED --output /tmp/cp10-operation-b-final/operation-b-closure.json; then break; fi
            test "$attempt" -lt 3; sleep $((attempt*2))
          done
          node -e "const r=require('/tmp/cp10-operation-b-final/operation-b-closure.json');if(r.result!=='TERMINAL_CLOSURE_COMMITTED'||!r.lockReleased)process.exit(1)"
      - name: Close finalization generation 75 PASS_CLOSED
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if node tools/operation-intake/repository-operation-lock-manager.v1.mjs --action close --repository "$GITHUB_REPOSITORY" --lock-ref "$LOCK_REF" --operation-id "$FINALIZATION_ID" --lock-scope "$FINALIZATION_SCOPE" --lock-generation "$FINALIZATION_GENERATION" --terminal-disposition PASS_CLOSED --output /tmp/cp10-operation-b-final/finalization-closure.json; then break; fi
            test "$attempt" -lt 3; sleep $((attempt*2))
          done
          node -e "const r=require('/tmp/cp10-operation-b-final/finalization-closure.json');if(r.result!=='TERMINAL_CLOSURE_COMMITTED'||!r.lockReleased)process.exit(1)"
      - name: Verify terminal history and emit authority termination
        run: |
          set -euo pipefail
          git fetch --no-tags origin operation-locks/repository-operation-intake-v1
          git show FETCH_HEAD:"$LEDGER_PATH" > /tmp/postclose-ledger.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import crypto from 'node:crypto';
          const l=JSON.parse(fs.readFileSync('/tmp/postclose-ledger.json'));
          for(const [id,gen] of [[process.env.OPERATION_B_ID,63],[process.env.FINALIZATION_ID,75]]){
            if(Object.values(l.activeScopes??{}).some(x=>x.operationId===id&&Number(x.lockGeneration)===gen))throw Error(`LOCK_STILL_ACTIVE:${id}`);
            const t=(l.terminalHistory??[]).find(x=>x.operationId===id&&Number(x.lockGeneration)===gen);
            if(!t||t.state!=='TERMINAL'||t.released!==true||t.terminalDisposition!=='PASS_CLOSED')throw Error(`TERMINAL_HISTORY_MISMATCH:${id}`);
          }
          const c=JSON.parse(fs.readFileSync('/tmp/cp10-operation-b-final/final-certification.json'));
          const r={schema:'CP10_OPERATION_B_AUTHORITY_TERMINATION_RECEIPT_v1',result:'PASS_CLOSED_OPERATION_B_AUTHORITY_TERMINATED',operationId:process.env.OPERATION_B_ID,lockGeneration:63,terminalDisposition:'PASS_CLOSED',candidateHead:process.env.CANDIDATE_HEAD,packageFingerprint:c.packageFingerprint,constructionAuthorityActive:false,verificationAuthorityActive:false,mergeAuthority:false,pr570Mutation:false,mergePerformed:false,certificationDigest:c.certificationDigest};
          r.receiptDigest=crypto.createHash('sha256').update(JSON.stringify(r)).digest('hex');
          fs.writeFileSync('/tmp/cp10-operation-b-final/authority-termination.json',JSON.stringify(r,null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: cp10-operation-b-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/cp10-operation-b-final/
          if-no-files-found: error
          retention-days: 90
