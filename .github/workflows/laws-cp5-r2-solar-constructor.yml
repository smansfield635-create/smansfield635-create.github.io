name: Laws CP5 R2 Solar Constructor

on:
  push:
    branches:
      - agent/laws-cp5-r2-celestial-visual-correction-001

permissions:
  contents: write

concurrency:
  group: laws-cp5-r2-solar-constructor
  cancel-in-progress: false

jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact CP5-R2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/laws-cp5-r2-celestial-visual-correction-001
          fetch-depth: 0

      - name: Apply bounded solar material and gaseous-expression correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('laws/index.crystals.js')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'Object.freeze({specular:0.18,rim:0.42,emissive:0.88,alpha:1.50,sparkle:0.00,halo:0.58,contrast:1.70}),',
              'Object.freeze({specular:0.03,rim:0.12,emissive:0.24,alpha:1.00,sparkle:0.00,halo:0.76,contrast:1.92}),',
              'solar material'
          )

          replace_once(
          '''    uniform float uHaloPass;
              uniform float uHaloExpansion;

              varying vec3 vNormal;''',
          '''    uniform float uHaloPass;
              uniform float uHaloExpansion;
              uniform float uTime;
              uniform float uCelestialMode;

              varying vec3 vNormal;''',
              'vertex celestial uniforms'
          )

          replace_once(
          '''      if (uHaloPass > 0.5) {
                pos += normalize(aNormal) * uHaloExpansion;
              }''',
          '''      if (uHaloPass > 0.5) {
                float expansionScale = 1.0;
                if (uCelestialMode > 0.5 && uCelestialMode < 1.5) {
                  vec3 direction = normalize(aPosition);
                  float plume =
                    sin(direction.x * 8.7 + direction.y * 5.1 + uTime * 0.31) * 0.46 +
                    sin(direction.y * 11.3 - direction.z * 6.4 - uTime * 0.23) * 0.32 +
                    sin(direction.z * 15.7 + direction.x * 4.9 + uTime * 0.17) * 0.22;
                  expansionScale = 0.22 + smoothstep(0.08, 0.78, plume) * 1.58;
                }
                pos += normalize(aNormal) * uHaloExpansion * expansionScale;
              }''',
              'irregular solar halo expansion'
          )

          replace_once(
          '''    uniform float uHaloStrength;
              uniform float uSaturation;

              uniform vec3 uKeyLight;''',
          '''    uniform float uHaloStrength;
              uniform float uSaturation;
              uniform float uCelestialMode;

              uniform vec3 uKeyLight;''',
              'fragment celestial mode uniform'
          )

          old_halo = '''      if (vHaloPass > 0.5) {
                vec3 haloColor =
                  base *
                  (
                    0.70 +
                    fresnel *
                    1.18 +
                    sideRim *
                    0.42 +
                    rear *
                    0.24
                  ) *
                  uHaloStrength *
                  twinkle;

                float haloAlpha =
                  clamp(
                    (
                      0.040 +
                      fresnel *
                      0.18 +
                      sideRim *
                      0.08
                    ) *
                    uProminence *
                    uHaloStrength,
                    0.0,
                    0.34
                  );

                gl_FragColor =
                  vec4(
                    haloColor,
                    haloAlpha
                  );

                return;
              }'''

          new_halo = '''      if (vHaloPass > 0.5) {
                if (uCelestialMode > 0.5 && uCelestialMode < 1.5) {
                  vec3 coronaDirection = normalize(vWorldPosition);
                  float plume =
                    sin(coronaDirection.x * 9.1 + coronaDirection.y * 4.7 + uTime * 0.29) * 0.44 +
                    sin(coronaDirection.y * 13.4 - coronaDirection.z * 7.3 - uTime * 0.21) * 0.34 +
                    sin(coronaDirection.z * 17.2 + coronaDirection.x * 5.8 + uTime * 0.16) * 0.22;
                  float wisp = smoothstep(0.12, 0.76, plume);
                  float activeEdge = clamp((base.r - base.b) * 0.92 + (0.46 - base.g) * 0.28, 0.0, 1.0);
                  vec3 haloColor =
                    mix(
                      vec3(1.0, 0.20, 0.012),
                      vec3(1.0, 0.82, 0.24),
                      clamp(base.g, 0.0, 1.0)
                    ) *
                    (0.46 + wisp * 1.34 + activeEdge * 0.18) *
                    uHaloStrength;
                  float haloAlpha =
                    clamp(
                      wisp *
                      (0.030 + fresnel * 0.17 + sideRim * 0.08) *
                      uProminence *
                      uHaloStrength,
                      0.0,
                      0.23
                    );
                  gl_FragColor = vec4(haloColor, haloAlpha);
                  return;
                }

                vec3 haloColor =
                  base *
                  (
                    0.70 +
                    fresnel *
                    1.18 +
                    sideRim *
                    0.42 +
                    rear *
                    0.24
                  ) *
                  uHaloStrength *
                  twinkle;

                float haloAlpha =
                  clamp(
                    (
                      0.040 +
                      fresnel *
                      0.18 +
                      sideRim *
                      0.08
                    ) *
                    uProminence *
                    uHaloStrength,
                    0.0,
                    0.34
                  );

                gl_FragColor =
                  vec4(
                    haloColor,
                    haloAlpha
                  );

                return;
              }'''
          replace_once(old_halo, new_halo, 'solar irregular halo branch')

          replace_once(
          '''      float diffuse =
                0.24 +''',
          '''      if (uCelestialMode > 0.5 && uCelestialMode < 1.5) {
                float limb = smoothstep(0.04, 0.88, max(facingToCamera, 0.0));
                float activity = clamp((base.r - base.g) * 1.35 + (0.40 - base.b) * 0.36, 0.0, 1.0);
                float radiance = 0.80 + limb * 0.18 + uProminence * 0.10;
                vec3 solarColor = base * radiance;
                solarColor += vec3(1.0, 0.34, 0.028) * activity * 0.055;
                solarColor *= 0.94 + key * 0.09 + fill * 0.04;
                gl_FragColor = vec4(min(solarColor, vec3(1.0)), 1.0);
                return;
              }

              float diffuse =
                0.24 +''',
              'solar surface shader branch'
          )

          replace_once(
          '''        saturation:
                  gl.getUniformLocation(
                    program,
                    "uSaturation"
                  ),

                haloPass:''',
          '''        saturation:
                  gl.getUniformLocation(
                    program,
                    "uSaturation"
                  ),

                celestialMode:
                  gl.getUniformLocation(
                    program,
                    "uCelestialMode"
                  ),

                haloPass:''',
              'celestial mode uniform location'
          )

          replace_once(
          '''    gl.uniform1f(
              renderer.uniforms.haloExpansion,
              0.075
            );

            applyMaterial(''',
          '''    const celestialMode =
              node.id === "test"
                ? 1
                : node.id === "research"
                  ? 2
                  : 0;

            gl.uniform1f(
              renderer.uniforms.celestialMode,
              celestialMode
            );

            gl.uniform1f(
              renderer.uniforms.haloExpansion,
              celestialMode === 1
                ? 0.115
                : 0.075
            );

            applyMaterial(''',
              'draw-node celestial mode binding'
          )

          crater_anchor = '''    ].map(record => ({
              center: normalizeVector(record.slice(0, 3)),
              radius: record[3],
              depth: record[4]
            }));

            function deterministicField'''

          crater_replacement = '''    ].map(record => ({
              center: normalizeVector(record.slice(0, 3)),
              radius: record[3],
              depth: record[4]
            }));
            const solarCells = [
              [0.62, 0.18, 0.76, 1.04],
              [-0.50, 0.46, 0.73, 0.92],
              [0.14, -0.66, 0.74, 1.08],
              [-0.42, -0.56, 0.71, 0.88],
              [0.78, 0.50, 0.24, 0.96],
              [-0.77, 0.43, 0.30, 1.06],
              [0.73, -0.52, 0.34, 0.90],
              [-0.71, -0.53, 0.33, 1.02],
              [0.10, 0.96, 0.26, 0.94],
              [-0.16, -0.94, 0.28, 1.10],
              [0.44, 0.14, -0.88, 1.00],
              [-0.52, 0.37, -0.77, 0.89],
              [0.24, -0.69, -0.68, 1.07],
              [-0.67, -0.28, -0.69, 0.95]
            ].map(record => ({
              center: normalizeVector(record.slice(0, 3)),
              intensity: record[3]
            }));

            function mixColor(a, b, amount) {
              const t = clamp(amount, 0, 1);
              return [
                a[0] + (b[0] - a[0]) * t,
                a[1] + (b[1] - a[1]) * t,
                a[2] + (b[2] - a[2]) * t
              ];
            }

            function deterministicField'''
          replace_once(crater_anchor, crater_replacement, 'solar cell field insertion')

          old_solar = '''      if (mode === "solar") {
                const broad = deterministicField(nx, ny, nz, 4.6, 0.73);
                const cells = deterministicField(nx, ny, nz, 13.6, 2.17);
                const fine = deterministicField(nx, ny, nz, 31.0, 1.31);
                const spotCenterA = normalizeVector([0.44, 0.18, 0.88]);
                const spotCenterB = normalizeVector([-0.34, -0.36, 0.87]);
                const spotA = Math.exp(-Math.pow(Math.acos(clamp(nx * spotCenterA[0] + ny * spotCenterA[1] + nz * spotCenterA[2], -1, 1)) / 0.14, 2) * 2.8);
                const spotB = Math.exp(-Math.pow(Math.acos(clamp(nx * spotCenterB[0] + ny * spotCenterB[1] + nz * spotCenterB[2], -1, 1)) / 0.11, 2) * 3.2);
                const shade = clamp(0.82 + broad * 0.09 + cells * 0.15 + fine * 0.055 - spotA * 0.24 - spotB * 0.18, 0.48, 1.10);
                relief += broad * 0.0055 + cells * 0.0036 + fine * 0.0014;
                surfaceColor = [
                  clamp(0.93 + shade * 0.12, 0, 1),
                  clamp(color[1] * (0.70 + shade * 0.30), 0, 1),
                  clamp(color[2] * (0.38 + shade * 0.50), 0, 1)
                ];
              } else {'''

          new_solar = '''      if (mode === "solar") {
                let nearest = Infinity;
                let second = Infinity;
                let cellIntensity = 1;
                solarCells.forEach(cell => {
                  const angularDistance = Math.acos(
                    clamp(nx * cell.center[0] + ny * cell.center[1] + nz * cell.center[2], -1, 1)
                  );
                  if (angularDistance < nearest) {
                    second = nearest;
                    nearest = angularDistance;
                    cellIntensity = cell.intensity;
                  } else if (angularDistance < second) {
                    second = angularDistance;
                  }
                });

                const cellCenter = 1 - smoothTransition(0.08, 0.66, nearest);
                const cellBoundary = 1 - smoothTransition(0.035, 0.19, second - nearest);
                const broad = deterministicField(nx, ny, nz, 2.25, 0.73);
                const folds = deterministicField(nx, ny, nz, 5.8, 2.17);
                const fine = deterministicField(nx, ny, nz, 26.0, 1.31);
                const micro = deterministicField(nx, ny, nz, 44.0, 0.47);
                const activityCenters = [
                  [0.44, 0.18, 0.88, 0.19, 0.92],
                  [-0.34, -0.36, 0.87, 0.16, 0.76],
                  [0.67, -0.22, 0.71, 0.13, 0.64]
                ];
                let localizedActivity = 0;
                activityCenters.forEach(record => {
                  const center = normalizeVector(record.slice(0, 3));
                  const angularDistance = Math.acos(
                    clamp(nx * center[0] + ny * center[1] + nz * center[2], -1, 1)
                  );
                  localizedActivity +=
                    Math.exp(-Math.pow(angularDistance / record[3], 2) * 2.7) * record[4];
                });
                localizedActivity = clamp(localizedActivity, 0, 1);

                const heat = clamp(
                  0.62 +
                  cellCenter * 0.42 * cellIntensity -
                  cellBoundary * 0.38 +
                  broad * 0.12 +
                  folds * 0.07 +
                  fine * 0.045 +
                  micro * 0.018 -
                  localizedActivity * 0.24,
                  0.10,
                  1.18
                );
                const darkChannel = clamp(
                  cellBoundary * 0.82 +
                  localizedActivity * 0.68 +
                  smoothTransition(0.42, 0.92, -folds) * 0.18,
                  0,
                  1
                );

                let photosphere;
                if (heat >= 0.86) {
                  photosphere = mixColor(
                    [1.0, 0.76, 0.18],
                    [1.0, 0.99, 0.78],
                    smoothTransition(0.86, 1.14, heat)
                  );
                } else if (heat >= 0.55) {
                  photosphere = mixColor(
                    [0.98, 0.31, 0.025],
                    [1.0, 0.77, 0.16],
                    smoothTransition(0.55, 0.86, heat)
                  );
                } else {
                  photosphere = mixColor(
                    [0.42, 0.045, 0.008],
                    [0.98, 0.31, 0.025],
                    smoothTransition(0.12, 0.55, heat)
                  );
                }

                surfaceColor = mixColor(
                  photosphere,
                  [0.50, 0.040, 0.008],
                  clamp(darkChannel * 0.52, 0, 0.62)
                );
                const granuleLift = clamp(fine * 0.035 + micro * 0.018, -0.035, 0.045);
                surfaceColor = [
                  clamp(surfaceColor[0] + granuleLift, 0, 1),
                  clamp(surfaceColor[1] + granuleLift * 0.72, 0, 1),
                  clamp(surfaceColor[2] + granuleLift * 0.18, 0, 1)
                ];
                relief +=
                  broad * 0.0042 +
                  cellCenter * 0.0030 -
                  cellBoundary * 0.0018 +
                  folds * 0.0022 +
                  fine * 0.0009;
              } else {'''
          replace_once(old_solar, new_solar, 'solar convection field')

          required_preserved = [
              'horizontalRadius:\n        1.68',
              'verticalRadius:\n        1.5008',
              'depthRadius:\n        1.2992',
              'gatewayBodyScale:\n    0.7666667',
              'const terrain = deterministicField(nx, ny, nz, 5.8, 1.43);',
              'const crater = craterField(nx, ny, nz);',
              'relief += terrain * 0.013 + fineTerrain * 0.0055 + crater.relief;'
          ]
          missing = [fragment for fragment in required_preserved if fragment not in text]
          if missing:
              raise SystemExit(f'preservation fragments missing: {missing}')

          path.write_text(text, encoding='utf-8')
          PY

          node --check laws/index.crystals.js
          git diff --check -- laws/index.crystals.js
          test "$(git diff --name-only)" = "laws/index.crystals.js"

      - name: Commit one-file CP5-R2 mutation and remove constructor
        shell: bash
        run: |
          set -euo pipefail
          base="0ff5741803926a6c218415587955aa867f93a0f7"
          rm .github/workflows/laws-cp5-r2-solar-constructor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add laws/index.crystals.js .github/workflows/laws-cp5-r2-solar-constructor.yml
          git commit -m 'Apply bounded Laws CP5-R2 solar visual correction'
          test "$(git diff --name-only "$base" HEAD)" = "laws/index.crystals.js"
          git push origin HEAD:agent/laws-cp5-r2-celestial-visual-correction-001
