name: H-Earth Target 4E Bounded Automatic Activation Audit

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  execute-target-4e:
    if: github.head_ref == 'agent/h-earth-repository-registry-target-4e-execution-001'
    runs-on: ubuntu-latest
    steps:
      - name: Check out actual installation branch
        uses: actions/checkout@v4
        with:
          ref: agent/h-earth-repository-registry-installation-001
          fetch-depth: 0

      - name: Execute integrated Target 4E audit
        shell: bash
        run: |
          set -euo pipefail
          TARGET_COMMIT="$(git rev-parse HEAD)"
          TARGET_BRANCH='agent/h-earth-repository-registry-installation-001' \
          TARGET_COMMIT="$TARGET_COMMIT" \
          node --experimental-default-type=module \
            tools/h-earth-repository-registry-target-4e-audit.mjs \
            > /tmp/target-4e-audit.json

          node -e "
            const fs = require('fs');
            const value = JSON.parse(fs.readFileSync('/tmp/target-4e-audit.json', 'utf8'));
            if (value.result !== 'PASS') process.exit(1);
            if (value.staticActivationAudit.result !== 'PASS') process.exit(1);
            if (value.target4BRegression.passedChecks !== 34) process.exit(1);
            if (value.target4CRegression.staticPassedChecks !== 37) process.exit(1);
            if (value.target4CRegression.passedFixtureCount !== 33) process.exit(1);
            if (value.systemicExecution.passedScenarioCount !== 8) process.exit(1);
            if (value.systemicExecution.allTasksUnprompted !== true) process.exit(1);
            if (value.systemicExecution.allReceiptsDeterministic !== true) process.exit(1);
          "

      - name: Commit durable receipts and remove one-use workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/h-earth-repository-registry-target-4e-bounded-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            h-earth-3d/registry/activation/receipts \
            h-earth-3d/registry/h-earth.repository-registry.target-4e-receipt.json \
            .github/workflows/h-earth-repository-registry-target-4e-bounded-audit.yml
          git commit -m 'Record Target 4E automatic activation and systemic audit receipts'
          git push origin HEAD:agent/h-earth-repository-registry-installation-001
