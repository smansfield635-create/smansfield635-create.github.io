name: PR570 Internal Registry Post-Merge Termination

on:
  pull_request:
    paths:
      - '.github/workflows/h-earth-map-wide-terrain-permanent-instrument-ratification.yml'

permissions:
  contents: write
  actions: read

env:
  PRE_MERGE_MAIN: 2c4e5a21e4e902bee421528498c112998fa783bc
  CANDIDATE_HEAD: 91752782bf93c34031bdfd4c5103d03ac98534fc
  MERGE_COMMIT: a4ba663dbff1d780cf80e8e40ecaa396c2ee85c7
  BASE_REGISTRY_BLOB: 10ab7b203e03fde419e526d0cce2c0af42860911
  BOOTSTRAP_BLOB: e422e814a29e024df91e8410687ab29ffe63c382
  NODE_ID: H_EARTH_MAP_WIDE_TERRAIN_ARTICULATION_ESTATE_RESERVATION_INSTRUMENT
  LOCK_REF: refs/heads/operation-locks/repository-operation-intake-v1
  OPERATION_ID: H_EARTH_MAP_WIDE_INSTRUMENT_INTERNAL_REGISTRY_REGISTRATION_R_001
  LOCK_SCOPE: H_EARTH:MAP_WIDE_INSTRUMENT:INTERNAL_REGISTRY_REGISTRATION:R:V1
  LOCK_GENERATION: '136'

jobs:
  merged-builder:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reproduce active merge
        env:
          HOLDER: PR570_INNER_REGISTRY_POSTMERGE_BUILDER_${{ github.run_id }}_${{ github.run_attempt }}
          OUT: ${{ runner.temp }}/builder
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          read -r commit parent1 parent2 < <(git rev-list --parents -n 1 HEAD)
          test "$commit" = "$MERGE_COMMIT"
          test "$parent1" = "$PRE_MERGE_MAIN"
          test "$parent2" = "$CANDIDATE_HEAD"
          mapfile -t changed < <(git diff --name-only "$parent1" "$MERGE_COMMIT" | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.map-wide-instrument-scope-registration.js'
          test "${changed[1]}" = 'h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js'
          test "$(git rev-parse "$MERGE_COMMIT:h-earth-3d/registry/h-earth.repository-registry.candidate.js")" = "$BASE_REGISTRY_BLOB"
          test "$(git rev-parse "$MERGE_COMMIT:h-earth-3d/registry/h-earth.repository-registry.bootstrap.json")" = "$BOOTSTRAP_BLOB"
          cat > "$OUT/paths.txt" <<'PATHS'
          h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/AGENTS.md
          h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/authority-and-lineage.v1.json
          h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/bootstrap-seed.v1.json
          h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/bootstrap-termination-policy.v1.json
          h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/changed-path-manifest.v1.json
          h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/construction-procedure.v1.json
          h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/instrument.locator.v1.json
          h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/negative-fixtures.v1.json
          h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/operation-request.v1.json
          h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/operator-family-registry.v1.json
          h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/progress-ledger.v1.json
          h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/schemas.v1.json
          h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/synthetic-map-fixture.v1.json
          PATHS
          printf '%s\n' 'h-earth-3d/control-plane/map-wide-terrain-articulation-estate-reservation/unregistered-neighbor.v1.json' > "$OUT/negative.txt"
          node --experimental-default-type=module tools/h-earth-repository-registry-auto-preflight.mjs --paths-file "$OUT/paths.txt" --task PR570_POSTMERGE_BUILDER --mutation-intent --output "$OUT/positive.json"
          set +e
          node --experimental-default-type=module tools/h-earth-repository-registry-auto-preflight.mjs --paths-file "$OUT/negative.txt" --task PR570_POSTMERGE_NEGATIVE_BUILDER --mutation-intent --output "$OUT/negative.json"
          set -e
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { runHEarthC2R1MC5AutomaticRegistryPreflight } from './h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js';
          const p=JSON.parse(fs.readFileSync(`${process.env.OUT}/positive.json`));
          const n=JSON.parse(fs.readFileSync(`${process.env.OUT}/negative.json`));
          const c2=await runHEarthC2R1MC5AutomaticRegistryPreflight();
          const classes=p.pathClassification?.classifications??[];
          if(p.finalDisposition!=='PASS'||classes.length!==13||!classes.every(x=>x.registered&&x.classification==='REGISTERED_H_EARTH_PATH'&&(x.resolvedNodeIds??[]).includes(process.env.NODE_ID)))throw Error('ACTIVE_POSITIVE_REGISTRATION_FAILED');
          if(n.finalDisposition!=='STOP'||n.mutationMayProceed!==false||n.pathClassification?.classifications?.[0]?.registered!==false)throw Error('ACTIVE_NEGATIVE_NEIGHBOR_FAILED');
          if(c2.finalDisposition!=='PASS'||c2.mc5Checks?.allHEarthPathsRegistered!==true)throw Error('ACTIVE_C2_REGRESSION');
          const payload={schema:'PR570_INTERNAL_REGISTRY_POSTMERGE_FINGERPRINT_v1',mergeCommit:process.env.MERGE_COMMIT,preMergeMain:process.env.PRE_MERGE_MAIN,candidateHead:process.env.CANDIDATE_HEAD,baseRegistryBlob:process.env.BASE_REGISTRY_BLOB,bootstrapBlob:process.env.BOOTSTRAP_BLOB,nodeId:process.env.NODE_ID,paths:classes.map(x=>x.repositoryPath).sort(),positive:'PASS',negative:'STOP',c2:'PASS'};
          const receipt={schema:'PR570_INTERNAL_REGISTRY_POSTMERGE_RECEIPT_v1',result:'PASS_CLOSED_ACTIVE_MERGE_REPRODUCED',executionHolder:process.env.HOLDER,...payload,packageFingerprint:crypto.createHash('sha256').update(JSON.stringify(payload)).digest('hex'),pr570Mutated:false,productMutationPerformed:false,terrainMutationPerformed:false};
          fs.writeFileSync(`${process.env.OUT}/receipt.json`,JSON.stringify(receipt,null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: pr570-inner-registry-postmerge-builder-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/builder/
          if-no-files-found: error
          retention-days: 90

  merged-fresh-verifier:
    needs: merged-builder
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: pr570-inner-registry-postmerge-builder-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/builder
      - name: Independently reproduce active merge
        env:
          HOLDER: PR570_INNER_REGISTRY_POSTMERGE_FRESH_VERIFIER_${{ github.run_id }}_${{ github.run_attempt }}
          OUT: ${{ runner.temp }}/verifier
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          cp "$RUNNER_TEMP/builder/paths.txt" "$OUT/paths.txt"
          cp "$RUNNER_TEMP/builder/negative.txt" "$OUT/negative.txt"
          node --experimental-default-type=module tools/h-earth-repository-registry-auto-preflight.mjs --paths-file "$OUT/paths.txt" --task PR570_POSTMERGE_FRESH_VERIFIER --mutation-intent --output "$OUT/positive.json"
          set +e
          node --experimental-default-type=module tools/h-earth-repository-registry-auto-preflight.mjs --paths-file "$OUT/negative.txt" --task PR570_POSTMERGE_NEGATIVE_FRESH_VERIFIER --mutation-intent --output "$OUT/negative.json"
          set -e
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { runHEarthC2R1MC5AutomaticRegistryPreflight } from './h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js';
          const p=JSON.parse(fs.readFileSync(`${process.env.OUT}/positive.json`));
          const n=JSON.parse(fs.readFileSync(`${process.env.OUT}/negative.json`));
          const c2=await runHEarthC2R1MC5AutomaticRegistryPreflight();
          const classes=p.pathClassification?.classifications??[];
          if(p.finalDisposition!=='PASS'||classes.length!==13||!classes.every(x=>x.registered&&x.classification==='REGISTERED_H_EARTH_PATH'&&(x.resolvedNodeIds??[]).includes(process.env.NODE_ID)))throw Error('ACTIVE_POSITIVE_REGISTRATION_FAILED');
          if(n.finalDisposition!=='STOP'||n.mutationMayProceed!==false||n.pathClassification?.classifications?.[0]?.registered!==false)throw Error('ACTIVE_NEGATIVE_NEIGHBOR_FAILED');
          if(c2.finalDisposition!=='PASS'||c2.mc5Checks?.allHEarthPathsRegistered!==true)throw Error('ACTIVE_C2_REGRESSION');
          const payload={schema:'PR570_INTERNAL_REGISTRY_POSTMERGE_FINGERPRINT_v1',mergeCommit:process.env.MERGE_COMMIT,preMergeMain:process.env.PRE_MERGE_MAIN,candidateHead:process.env.CANDIDATE_HEAD,baseRegistryBlob:process.env.BASE_REGISTRY_BLOB,bootstrapBlob:process.env.BOOTSTRAP_BLOB,nodeId:process.env.NODE_ID,paths:classes.map(x=>x.repositoryPath).sort(),positive:'PASS',negative:'STOP',c2:'PASS'};
          const receipt={schema:'PR570_INTERNAL_REGISTRY_POSTMERGE_RECEIPT_v1',result:'PASS_CLOSED_ACTIVE_MERGE_REPRODUCED',executionHolder:process.env.HOLDER,...payload,packageFingerprint:crypto.createHash('sha256').update(JSON.stringify(payload)).digest('hex'),pr570Mutated:false,productMutationPerformed:false,terrainMutationPerformed:false};
          const builder=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/builder/receipt.json`));
          if(builder.executionHolder===receipt.executionHolder||builder.packageFingerprint!==receipt.packageFingerprint)throw Error('POSTMERGE_INDEPENDENT_REPRODUCTION_MISMATCH');
          fs.writeFileSync(`${process.env.OUT}/receipt.json`,JSON.stringify(receipt,null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: pr570-inner-registry-postmerge-verifier-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verifier/
          if-no-files-found: error
          retention-days: 90

  terminate:
    needs: [merged-builder, merged-fresh-verifier]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MERGE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: pr570-inner-registry-postmerge-builder-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/builder
      - uses: actions/download-artifact@v4
        with:
          name: pr570-inner-registry-postmerge-verifier-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verifier
      - name: Verify durable active identity and close generation 136
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$MERGE_COMMIT" origin/main
          for path in \
            h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.map-wide-instrument-scope-registration.js \
            h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js; do
            test "$(git rev-parse "$MERGE_COMMIT:$path")" = "$(git rev-parse "origin/main:$path")"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const b=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/builder/receipt.json`));
          const v=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/verifier/receipt.json`));
          if(b.result!=='PASS_CLOSED_ACTIVE_MERGE_REPRODUCED'||v.result!==b.result||b.executionHolder===v.executionHolder||b.packageFingerprint!==v.packageFingerprint)throw Error('TERMINAL_REPRODUCTION_MISMATCH');
          fs.mkdirSync('/tmp/pr570-inner-registry-terminal',{recursive:true});
          fs.writeFileSync('/tmp/pr570-inner-registry-terminal/builder.json',JSON.stringify(b,null,2)+'\n');
          fs.writeFileSync('/tmp/pr570-inner-registry-terminal/verifier.json',JSON.stringify(v,null,2)+'\n');
          NODE
          node tools/operation-intake/repository-operation-lock-manager.v1.mjs \
            --action close --repository "${{ github.repository }}" --lock-ref "$LOCK_REF" \
            --operation-id "$OPERATION_ID" --lock-scope "$LOCK_SCOPE" --lock-generation "$LOCK_GENERATION" \
            --terminal-disposition PASS_CLOSED --output /tmp/pr570-inner-registry-terminal/closure.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const c=JSON.parse(fs.readFileSync('/tmp/pr570-inner-registry-terminal/closure.json'));
          const b=JSON.parse(fs.readFileSync('/tmp/pr570-inner-registry-terminal/builder.json'));
          if(c.result!=='TERMINAL_CLOSURE_COMMITTED'||!c.lockReleased)throw Error('GENERATION_136_NOT_CLOSED');
          const out={schema:'PR570_INTERNAL_REGISTRY_ACTIVATION_RECEIPT_v1',result:'PASS_CLOSED_INTERNAL_REGISTRY_ACTIVE_AND_AUTHORITY_TERMINATED',mergeCommit:process.env.MERGE_COMMIT,packageFingerprint:b.packageFingerprint,lockGeneration:136,terminalDisposition:'PASS_CLOSED',closureCommit:c.closureCommitSha,baseRegistryCandidatePreserved:true,bootstrapPreserved:true,c2RegistrationPreserved:true,exactRegisteredPathCount:13,negativeNeighborStopped:true,pr570Mutated:false,productOrTerrainMutation:false,residualAuthority:false};
          out.receiptDigest=crypto.createHash('sha256').update(JSON.stringify(out)).digest('hex');
          fs.writeFileSync('/tmp/pr570-inner-registry-terminal/activation.json',JSON.stringify(out,null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: pr570-inner-registry-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/pr570-inner-registry-terminal/
          if-no-files-found: error
          retention-days: 90
