><p>Theory, Evidence, Measure, Limits, source matching, and claim boundaries.</p></article></div></section><section class="panel" id="findings-boundaries"><p class="kicker">Research 4</p><h2>Findings &amp; Boundaries</h2><div class="grid"><article class="card"><h3>Supported findings</h3><p>State only what the preserved evidence supports inside the tested domain.</p></article><article class="card"><h3>Negative and mixed results</h3><p>Failed thresholds and non-incremental measures remain part of the record.</p></article><article class="card"><h3>Unresolved questions</h3><p>Missing telemetry and unproven mechanisms remain explicit.</p></article><article class="card"><h3>Claim ceiling</h3><p>Presentation and navigation cannot create validation.</p></article></div></section></main></div></body></html>'''; write('laws/research/index.html',research_page)

