name: Characters Vegetation V3 Camera-True Representation Qualification v1

on:
  push:
    branches:
      - 'characters/canonical-ecology-camera-true-vegetation-20260905-003'
    paths:
      - 'characters/vegetation-representation.mjs'
      - 'characters/vegetation-population.mjs'
      - 'control-plane/whole-estate/characters-reconstruction-v1/verify-vegetation-v3.v1.mjs'
      - 'control-plane/whole-estate/characters-reconstruction-v1/vegetation-v2-known-instrumental-failure.v1.json'
      - 'control-plane/whole-estate/characters-reconstruction-v1/vegetation-v0-v3-contract.v1.json'
      - '.github/workflows/characters-vegetation-v3-v1.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify V3 camera-true instanced LOD representation
        run: node control-plane/whole-estate/characters-reconstruction-v1/verify-vegetation-v3.v1.mjs --output "$RUNNER_TEMP/vegetation-v3-receipt.json"
      - name: Require V3 pass-closed receipt
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.result == "V3_CAMERA_TRUE_REPRESENTATION_PASS_CLOSED" and .stageResults.V3 == "V3_CAMERA_TRUE_REPRESENTATION_PASS_CLOSED" and .stageResults.V2 == "KNOWN_INSTRUMENTAL_VERIFIER_FAILURE_OWNER_DISPOSITION" and .v2FormalReceiptResult == "FAIL_CLOSED" and .v2FormalReconciliationRequired == true and .canonicalPopulationCount == 818 and .cameraMatrixCount == 10 and .cameraDrivenLodChangeCount > 0 and .aggregateReconciliationAuthorized == true and .v4PlusAuthorized == false and .mergeDeploymentPublicationAuthorized == false' "$RUNNER_TEMP/vegetation-v3-receipt.json" >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vegetation-v3-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vegetation-v3-receipt.json
          if-no-files-found: error
          retention-days: 90
