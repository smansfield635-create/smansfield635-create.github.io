name: Characters Forest Population v1
on:
  pull_request:
    paths:
      - 'characters/app.mjs'
      - 'characters/forest-system.mjs'
      - 'control-plane/whole-estate/characters-reconstruction-v1/forest-population-contract.v1.json'
      - 'control-plane/whole-estate/characters-reconstruction-v1/verify-forest-population.v1.mjs'
      - '.github/workflows/characters-forest-population-v1.yml'
permissions:
  contents: read
jobs:
  verify-forest-population:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Materialize exact Sequence 2 comparison with sparse index
        shell: bash
        env:
          FOREST_BASE: ${{ github.event.pull_request.base.sha }}
          FOREST_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --filter=blob:none origin "$FOREST_BASE"
          git update-ref refs/remotes/origin/forest-base FETCH_HEAD
          git -c protocol.version=2 fetch --no-tags --filter=blob:none origin "$FOREST_HEAD"
          git update-ref refs/remotes/origin/forest-head FETCH_HEAD
          git sparse-checkout init --cone --sparse-index
          git sparse-checkout set characters h-earth-3d showroom/globe/h-earth control-plane/whole-estate/characters-reconstruction-v1 .github/workflows
          git checkout --detach refs/remotes/origin/forest-head
          test "$(git config --bool index.sparse)" = "true"
          test "$(git rev-parse refs/remotes/origin/forest-base^{commit})" = "$FOREST_BASE"
          test "$(git rev-parse HEAD^{commit})" = "$FOREST_HEAD"
          git merge-base "$FOREST_BASE" "$FOREST_HEAD" >/dev/null
          sparse_entries="$(git ls-files --sparse | wc -l | tr -d '[:space:]')"
          materialized_files="$(find . -type f -not -path './.git/*' | wc -l | tr -d '[:space:]')"
          test "$sparse_entries" -lt 10000
          test "$materialized_files" -lt 10000
          echo "FOREST_GATE_SPARSE_INDEX_ENTRIES=$sparse_entries"
          echo "FOREST_GATE_MATERIALIZED_FILES=$materialized_files"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify admitted path scope
        env:
          FOREST_BASE: ${{ github.event.pull_request.base.sha }}
          FOREST_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$FOREST_BASE...$FOREST_HEAD" > /tmp/changed.txt
          while IFS= read -r p; do
            case "$p" in
              characters/app.mjs|characters/forest-system.mjs|control-plane/whole-estate/characters-reconstruction-v1/forest-population-contract.v1.json|control-plane/whole-estate/characters-reconstruction-v1/verify-forest-population.v1.mjs|.github/workflows/characters-forest-population-v1.yml) ;;
              *) echo "PATH_SCOPE_VIOLATION:$p" >&2; exit 1 ;;
            esac
          done < /tmp/changed.txt
      - name: Verify forest population
        run: node control-plane/whole-estate/characters-reconstruction-v1/verify-forest-population.v1.mjs
      - name: Install material-evidence browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Measure exact pre-forest baseline
        shell: bash
        timeout-minutes: 3
        env:
          FOREST_BASE: ${{ github.event.pull_request.base.sha }}
          FOREST_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/forest-material-evidence
          git checkout --detach refs/remotes/origin/forest-base
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/forest-baseline-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/characters/ >/dev/null && break; sleep 1; done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const cases=[{id:'desktop',viewport:{width:1440,height:900}},{id:'mobile',viewport:{width:390,height:844}}];
          const out={};
          async function sample(page){return page.evaluate(async()=>{const d=[];let p=performance.now();const s=new Promise(r=>{const t=n=>{d.push(n-p);p=n;if(d.length>=30)r();else requestAnimationFrame(t)};requestAnimationFrame(t)});await Promise.race([s,new Promise(r=>setTimeout(r,10000))]);if(d.length>1)d.shift();const q=[...d].sort((a,b)=>a-b);const mean=d.reduce((a,b)=>a+b,0)/(d.length||1);const p95=q.length?q[Math.min(q.length-1,Math.floor(q.length*.95))]:Infinity;return{samples:d.length,meanMs:Number(mean.toFixed(3)),p95Ms:Number(p95.toFixed(3))}})}
          for(const c of cases){const page=await browser.newPage({viewport:c.viewport});await page.goto('http://127.0.0.1:4173/characters/',{waitUntil:'domcontentloaded'});const skip=page.getByRole('button',{name:/skip to the coast/i});if(await skip.count())await skip.first().click();await page.waitForTimeout(1200);out[c.id]=await sample(page);await page.close()}
          await browser.close();fs.writeFileSync('/tmp/forest-material-evidence/baseline.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out,null,2));
          NODE
          kill "$server_pid" 2>/dev/null || true
          trap - EXIT
          git checkout --detach refs/remotes/origin/forest-head
          test "$(git rev-parse HEAD^{commit})" = "$FOREST_HEAD"
      - name: Start exact candidate server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/forest-material-server.log 2>&1 &
          echo $! >/tmp/forest-material-server.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/characters/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/forest-material-server.log
          exit 1
      - name: Capture candidate material evidence and compare frame stability
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const baseline=JSON.parse(fs.readFileSync('/tmp/forest-material-evidence/baseline.json','utf8'));
          const browser=await chromium.launch({headless:true});
          const cases=[{id:'desktop',viewport:{width:1440,height:900}},{id:'mobile',viewport:{width:390,height:844}}];
          const receipt={schema:'MIRRORLAND_FOREST_MATERIAL_ACCEPTANCE_RECEIPT_v2',result:'PASS',cases:[]};
          async function sample(page){return page.evaluate(async()=>{const d=[];let p=performance.now();const s=new Promise(r=>{const t=n=>{d.push(n-p);p=n;if(d.length>=30)r();else requestAnimationFrame(t)};requestAnimationFrame(t)});await Promise.race([s,new Promise(r=>setTimeout(r,10000))]);if(d.length>1)d.shift();const q=[...d].sort((a,b)=>a-b);const mean=d.reduce((a,b)=>a+b,0)/(d.length||1);const p95=q.length?q[Math.min(q.length-1,Math.floor(q.length*.95))]:Infinity;return{samples:d.length,meanMs:Number(mean.toFixed(3)),p95Ms:Number(p95.toFixed(3))}})}
          for(const c of cases){const page=await browser.newPage({viewport:c.viewport});const pageErrors=[],consoleErrors=[];page.on('pageerror',e=>pageErrors.push(String(e)));page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});await page.goto('http://127.0.0.1:4173/characters/',{waitUntil:'domcontentloaded'});const skip=page.getByRole('button',{name:/skip to the coast/i});if(await skip.count())await skip.first().click();await page.waitForTimeout(1200);const webgl2=await page.evaluate(()=>!!document.querySelector('#scene')?.getContext('webgl2'));const fatal=await page.locator('#fatal.show').count()>0;const frame=await sample(page);const bodyWidth=await page.evaluate(()=>document.body.scrollWidth);await page.screenshot({path:`/tmp/forest-material-evidence/${c.id}.png`,fullPage:true});const b=baseline[c.id];const enough=frame.samples>=Math.min(5,b.samples)&&b.samples>=5;const meanRatio=frame.meanMs/b.meanMs;const p95Ratio=frame.p95Ms/b.p95Ms;const noMaterialRegression=enough&&meanRatio<=1.35&&p95Ratio<=1.40;const ok=webgl2&&!fatal&&!pageErrors.length&&!consoleErrors.length&&bodyWidth<=c.viewport.width+1&&noMaterialRegression;receipt.cases.push({id:c.id,ok,webgl2,fatal,bodyWidth,viewportWidth:c.viewport.width,baseline:b,frame,meanRatio:Number(meanRatio.toFixed(3)),p95Ratio:Number(p95Ratio.toFixed(3)),noMaterialRegression,pageErrors,consoleErrors});if(!ok)receipt.result='FAIL';await page.close()}
          await browser.close();fs.writeFileSync('/tmp/forest-material-evidence/receipt.json',JSON.stringify(receipt,null,2));console.log(JSON.stringify(receipt,null,2));if(receipt.result!=='PASS')process.exit(1);
          NODE
      - name: Upload forest population receipt
        uses: actions/upload-artifact@v4
        with:
          name: forest-population-receipt-${{ github.event.pull_request.head.sha }}
          path: forest-population-receipt.json
          retention-days: 90
      - name: Upload forest material evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forest-material-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/forest-material-evidence/
            /tmp/forest-baseline-server.log
            /tmp/forest-material-server.log
          if-no-files-found: warn
          retention-days: 90
