name: FAP1 G_C L5 Visible Direct Qualification
on:
  pull_request:
    paths: ['.github/workflows/fap1-gc-l5-visible-direct-qualification.yml']
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 01c38f39fce3ff22b48f07abed338da86e9a218c
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with: {chrome-version: stable}
      - run: npm install --no-save --no-package-lock puppeteer-core@24.15.0
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          for a in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/showroom/globe/audralia/weather-presentation-reconciliation/ >/dev/null && exit 0; sleep .25; done; exit 1
      - name: Probe W5 view intersection at exact product head
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:'new',args:['--no-sandbox','--ignore-gpu-blocklist','--enable-webgl','--use-gl=angle','--use-angle=swiftshader']});
            const page=await browser.newPage();await page.setViewport({width:720,height:1280});
            await page.goto('http://127.0.0.1:4173/showroom/globe/audralia/weather-presentation-reconciliation/',{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForFunction(()=>window.__AUDRALIA_FAP1_W5_HANDOFF__?.l5LightingActive===true,{timeout:90000});
            const result=await page.evaluate(async()=>{
              const spatial=await import('./fap1-spatial-lod.gb.mjs?gcGeometryProbe=1');
              const descriptors=await import('./fap1-gpu-weather-descriptors.mjs?gcGeometryProbe=1');
              const proof=window.__AUDRALIA_WEATHER_PRESENTATION_RECONCILIATION__,ga=window.__AUDRALIA_FAP1_GA_AUTHORITY__,system=ga.descriptorPacket().systems.find(s=>s.weatherClass==='LOW_CUMULIFORM')||ga.descriptorPacket().systems[0];
              const R=6200,D=Math.PI/180,N=[0,.5,-.8660254037844386],M=[0,.8660254037844386,.5],E=[1,0,0],lat=system.latitudeDeg*D,lon=system.longitudeDeg*D,cl=Math.cos(lat),sl=Math.sin(lat),co=Math.cos(lon),si=Math.sin(lon),r=[N[0]*sl+(M[0]*co+E[0]*si)*cl,N[1]*sl+(M[1]*co+E[1]*si)*cl,N[2]*sl+(M[2]*co+E[2]*si)*cl],angle=Math.acos(Math.max(-1,Math.min(1,r[1]))),sine=Math.sin(angle),arc=angle*R,targetU=Math.abs(sine)<1e-7?0:arc*r[0]/sine,targetV=Math.abs(sine)<1e-7?0:arc*r[2]/sine;
              const packet=descriptors.buildFAP1GPUWeatherPacket({canonicalTimeHours:ga.descriptorPacket().canonicalTimeHours||0}),objects=spatial.buildFAP1SpatialWeatherObjects({packet}),object=objects.find(o=>o.ID_i===system.id),samples=[];
              const sleep=ms=>new Promise(res=>setTimeout(res,ms));
              for(const distance of [1200,800,520]){
                proof.setCameraStateForTest({targetU,targetV,distance,pitch:1.25,yaw:0});await sleep(300);
                const camera=proof.getCameraFrame(),state=spatial.evaluateFAP1SpatialLOD(objects,camera),entry=state.objects.find(e=>e.object.ID_i===system.id),interval=spatial.rayWeatherVolumeInterval(camera.eye,camera.forward,object);
                const toCenter=object.V_i.center.map((v,i)=>v-camera.eye[i]),centerDistance=Math.hypot(...toCenter),centerForwardDot=toCenter.reduce((s,v,i)=>s+v*camera.forward[i],0)/(centerDistance||1);
                samples.push({distance,entry:{distanceToVolume:entry.distanceToVolume,inside:entry.inside,forwardDot:entry.forwardDot,localPromoted:entry.localPromoted,alpha:entry.alpha},centerForwardDot,interval,camera:{eye:camera.eye,forward:camera.forward,target:camera.target},object:{center:object.V_i.center,radii:object.V_i.radii}});
              }
              return{schema:'FAP1_GC_W5_VIEW_INTERSECTION_DIAGNOSTIC_v1',systemId:system.id,targetU,targetV,samples};
            });
            console.log(JSON.stringify(result,null,2));await browser.close();
            const promoted=result.samples.every(s=>s.entry.localPromoted),intersections=result.samples.map(s=>!!s.interval);if(!promoted)process.exit(3);if(intersections.every(Boolean))process.exit(4);if(intersections.every(v=>!v))process.exit(2);
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
