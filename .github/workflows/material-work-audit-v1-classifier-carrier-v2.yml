name: Material Work Audit v1 Blinded Classifier Carrier v2

on:
  push:
    branches:
      - agent/material-work-audit-v1-classifier-carrier-ddbe792
    paths:
      - research/material-work-audit/classify-v1-carrier-v2.mjs
      - .github/workflows/material-work-audit-v1-classifier-carrier-v2.yml

permissions:
  contents: write

concurrency:
  group: material-work-audit-v1-blinded-classifier-v2
  cancel-in-progress: false

jobs:
  classify-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Materialize bounded carrier source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir work
          cd work
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 --filter=blob:none origin "${GITHUB_SHA}"
          git sparse-checkout init --cone
          git sparse-checkout set research/material-work-audit
          git checkout --detach FETCH_HEAD
          test -f research/material-work-audit/classify-v1-carrier-v2.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('research/material-work-audit/classify-v1-carrier-v2.mjs')
          s=p.read_text()
          old="function git(args,opts={}){return execFileSync('git',args,{encoding:'utf8',stdio:opts.stdio||['ignore','pipe','pipe']}).trim()}"
          new="function git(args,opts={}){return execFileSync('git',args,{encoding:'utf8',maxBuffer:32*1024*1024,stdio:opts.stdio||['ignore','pipe','pipe']}).trim()}"
          if old not in s:
              raise SystemExit('git helper signature not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Execute Gen1710 conformance closure
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd work
          node research/material-work-audit/classify-v1-carrier-v2.mjs
