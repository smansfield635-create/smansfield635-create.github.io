name: Temporary Products center browser validation

on:
  push:
    branches:
      - agent/products-arena-corrective-continuity-001
    paths:
      - ".github/workflows/temporary-products-center-browser-validation.yml"

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/products-arena-corrective-continuity-001
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify candidate structure
        run: |
          node --check products/index.controller.js
          node --check products/index.crystals.js
          node --check products/index.cosmos.js
          node --check products/index.planet.js
          node --check verification/temporary-products-center-browser-validation.mjs
          git diff --check eb90d5635347c33c2766eaf9e9f4f606307b59cf...HEAD
          test ! -e products/index.controller.center.js
          test ! -e products/index.planet.presentation.adapter.js
          test "$(git hash-object products/index.planet.js)" = "6626b6476b85845b8125b886c69ad68cf4ef645a"
          test "$(git hash-object products/index.crystals.js)" = "6622f9cfd9e44589cf0e94119697256385f1317d"
          ! grep -q "DGB_PRODUCTS_CONTROLLER_CENTER" products/index.controller.js
          ! grep -q "DGB_PRODUCTS_CENTER_CONTROL_RECEIPT" products/index.controller.js

      - name: Install browser dependency
        run: npm install --no-save puppeteer-core@24.15.0

      - name: Resolve Chrome
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            sudo apt-get update
            sudo apt-get install -y chromium
            chrome="$(command -v chromium || command -v chromium-browser)"
          fi
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"

      - name: Start branch-local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/products-center-server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/products/ >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/products-center-server.log
          exit 1

      - name: Execute mobile-profile center validation
        env:
          PRODUCTS_ORIGIN: http://127.0.0.1:4173
        run: node verification/temporary-products-center-browser-validation.mjs

      - name: Remove temporary validation files
        run: |
          rm -f verification/temporary-products-center-browser-validation.mjs
          rm -f .github/workflows/temporary-products-center-browser-validation.yml

      - name: Commit self-cleaned validated candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Validate Products center continuity candidate"
          changed="$(git diff --name-only eb90d5635347c33c2766eaf9e9f4f606307b59cf HEAD)"
          test "$changed" = "$(printf '%s\n' \
            products/index.arena.css \
            products/index.controller.js \
            products/index.html)"
          git push origin HEAD:agent/products-arena-corrective-continuity-001
