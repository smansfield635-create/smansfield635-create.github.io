name: Temporary Showroom Center Hit PR Trigger

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/showroom-center-hit-labels-pr-trigger.yml
      - showroom/index.html
      - showroom/index.css
      - showroom/index.interactions.js

permissions:
  contents: write

jobs:
  verify-samsung-orbit-runtime:
    if: github.event.pull_request.head.ref == 'agent/showroom-compass-center-hit-labels-001'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out task branch
        uses: actions/checkout@v4
        with:
          ref: agent/showroom-compass-center-hit-labels-001
          fetch-depth: 0

      - name: Verify bounded source identities
        run: |
          set -euo pipefail
          node --check showroom/index.interactions.js
          grep -F 'SHOWROOM_CENTER_HIT_PROJECTED_LABELS_20260726A' showroom/index.html
          grep -F 'clamp(9.1rem, 42vw, 11.5rem)' showroom/index.css
          grep -F 'clamp(7.9rem, 36vw, 10.2rem)' showroom/index.css
          grep -F 'frontProjectionOverridesCompass' showroom/index.interactions.js
          grep -F 'scheduleProjectedLabels();' showroom/index.interactions.js
          grep -F 'N · Story' showroom/index.interactions.js
          grep -F 'Unfinished World' showroom/index.interactions.js

      - name: Install Chromium runtime
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Execute Samsung-width orbit runtime verification
        run: |
          set -euo pipefail
          mkdir -p .github/tmp
          python3 -m http.server 4173 >/tmp/showroom-center-hit-server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/showroom/ >/dev/null; then
              break
            fi
            sleep 1
          done
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 360, height: 800 },
              isMobile: true,
              hasTouch: true
            });
            const pageErrors = [];
            const consoleErrors = [];
            page.on('pageerror', error => pageErrors.push(String(error)));
            page.on('console', message => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });

            await page.goto('http://127.0.0.1:4173/showroom/', {
              waitUntil: 'domcontentloaded'
            });
            await page.locator('#showroom-orbit').scrollIntoViewIfNeeded();
            await page.waitForFunction(() => {
              return Boolean(
                window.SHOWROOM_INTERACTIONS &&
                window.SHOWROOM_MIRRORLAND_CONSTELLATION_CONTROLLER &&
                document.querySelectorAll('[data-showroom-projected-label]:not([hidden])').length === 4
              );
            }, { timeout: 30000 });

            const constellation = await page.evaluate(() => {
              const controller = window.SHOWROOM_MIRRORLAND_CONSTELLATION_CONTROLLER;
              const center = document.querySelector('[data-showroom-center-layer]');
              const planet = document.querySelector('.showroom-planet-root');
              const control = document.querySelector('[data-showroom-compass-control]');
              const label = document.querySelector('.showroom-compass-control__label');
              const projection = controller.getSemanticProjection();
              return {
                interactionsPresent: Boolean(window.SHOWROOM_INTERACTIONS),
                centerWidth: center.getBoundingClientRect().width,
                planetWidth: planet.getBoundingClientRect().width,
                controlPointerEvents: getComputedStyle(control).pointerEvents,
                labelPointerEvents: getComputedStyle(label).pointerEvents,
                labels: Array.from(document.querySelectorAll('[data-showroom-projected-label]:not([hidden])')).map(node => node.textContent.trim()).sort(),
                projectionCount: projection.length,
                visibleProjectionCount: projection.filter(record => record.visible !== false).length,
                frontProjectionCount: projection.filter(record => record.visible !== false && record.depthLayer === 'front').length
              };
            });

            const cardinalRequest = await page.evaluate(() =>
              window.SHOWROOM_MIRRORLAND_CONSTELLATION_CONTROLLER.requestCardinalSelection('north')
            );
            await page.waitForFunction(() => {
              const labels = Array.from(document.querySelectorAll('[data-showroom-projected-label]:not([hidden])')).map(node => node.textContent.trim());
              return labels.length === 4 && labels.includes('Welcome') && labels.includes('Mission') && labels.includes('Timeline') && labels.includes('Invitation');
            }, { timeout: 12000 });

            const cluster = await page.evaluate(() => ({
              labels: Array.from(document.querySelectorAll('[data-showroom-projected-label]:not([hidden])')).map(node => node.textContent.trim()).sort(),
              rootMode: document.querySelector('[data-showroom-root]').dataset.showroomPresentationMode,
              activeCluster: document.querySelector('[data-showroom-root]').dataset.showroomActiveCluster
            }));

            const expectedCardinals = ['E · Characters', 'N · Story', 'S · Wonders', 'W · Mysteries'].sort();
            const expectedCluster = ['Invitation', 'Mission', 'Timeline', 'Welcome'].sort();
            const pass = Boolean(
              constellation.interactionsPresent &&
              constellation.centerWidth <= 165 &&
              constellation.planetWidth <= 145 &&
              constellation.controlPointerEvents === 'none' &&
              constellation.labelPointerEvents === 'auto' &&
              JSON.stringify(constellation.labels) === JSON.stringify(expectedCardinals) &&
              cardinalRequest !== false &&
              JSON.stringify(cluster.labels) === JSON.stringify(expectedCluster) &&
              pageErrors.length === 0
            );

            const receipt = {
              schema: 'SHOWROOM_CENTER_HIT_PROJECTED_LABELS_BROWSER_VERIFICATION_v1',
              pass,
              viewport: { width: 360, height: 800, mobile: true, touch: true },
              constellation,
              cardinalRequest,
              cluster,
              pageErrors,
              consoleErrors
            };
            fs.writeFileSync(
              '.github/tmp/showroom-center-hit-labels-diagnostic.json',
              JSON.stringify(receipt, null, 2) + '\n'
            );
            console.log(JSON.stringify(receipt, null, 2));
            await browser.close();
          })().catch(error => {
            const receipt = {
              schema: 'SHOWROOM_CENTER_HIT_PROJECTED_LABELS_BROWSER_VERIFICATION_v1',
              pass: false,
              fatalError: String(error && (error.stack || error.message || error))
            };
            fs.writeFileSync(
              '.github/tmp/showroom-center-hit-labels-diagnostic.json',
              JSON.stringify(receipt, null, 2) + '\n'
            );
            console.error(receipt.fatalError);
          });
          NODE

      - name: Persist browser verification receipt
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189828+github-actions[bot]@users.noreply.github.com'
          git add .github/tmp/showroom-center-hit-labels-diagnostic.json
          if git diff --cached --quiet; then
            echo 'Browser verification receipt unchanged.'
          else
            git commit -m 'Record Showroom center hit and labels browser verification'
            git push origin HEAD:agent/showroom-compass-center-hit-labels-001
          fi

      - name: Enforce browser verification pass
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('.github/tmp/showroom-center-hit-labels-diagnostic.json').read_text())
          if receipt.get('pass') is not True:
              raise SystemExit(f"SHOWROOM_BROWSER_VERIFICATION_FAILED:{receipt}")
          print('SHOWROOM_BROWSER_VERIFICATION=PASS')
          PY
