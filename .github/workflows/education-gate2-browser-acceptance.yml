name: Education Gate 2 Browser Acceptance

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths: [products/education/index.html, .github/workflows/education-gate2-browser-acceptance.yml]
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 1}
      - run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/edu-g2-http.log 2>&1 &
      - name: Prove six-card rail desktop and mobile
        run: |
          mkdir -p /tmp/education-gate2
          node <<'NODE'
          const {chromium}=require('playwright'); const fs=require('fs');
          (async()=>{const browser=await chromium.launch({headless:true}); const receipt={};
          for(const [name,opts] of [['desktop',{viewport:{width:1440,height:1000}}],['mobile',{viewport:{width:390,height:844},isMobile:true,hasTouch:true}]]){
            const ctx=await browser.newContext(opts),page=await ctx.newPage(); await page.goto('http://127.0.0.1:4173/products/education/',{waitUntil:'networkidle'});
            const viewport=page.locator('[data-edu-viewport]'); const cards=page.locator('.edu-standard-card');
            if(await cards.count()!==6) throw Error(name+' card count');
            if(await page.locator('.edu-carousel__tabs:visible').count()) throw Error(name+' legacy tabs visible');
            const active=async()=>Number(await page.locator('.edu-standard-card[data-active="true"]').getAttribute('data-card-index'));
            await viewport.focus(); const seen=[await active()];
            for(let i=0;i<5;i++){await page.keyboard.press('ArrowRight');await page.waitForTimeout(80);seen.push(await active())}
            if(new Set(seen).size!==6) throw Error(name+' keyboard reach '+seen);
            const before=await active(); const adjacent=page.locator('.edu-standard-card[data-adjacent="true"]').last(); const target=Number(await adjacent.getAttribute('data-card-index')); await adjacent.click({position:{x:12,y:12}}); await page.waitForTimeout(80); if(await active()!==target) throw Error(name+' adjacent click target '+target+' active '+await active()+' before '+before);
            const box=await viewport.boundingBox(); if(!box)throw Error(name+' viewport');
            const dragBefore=await active(); await page.mouse.move(box.x+box.width*.72,box.y+box.height*.5);await page.mouse.down();await page.mouse.move(box.x+box.width*.25,box.y+box.height*.5,{steps:6});const during=await page.locator('[data-edu-track]').evaluate(n=>getComputedStyle(n).transform);if(during==='none')throw Error(name+' drag does not follow');await page.mouse.up();await page.waitForTimeout(150);if(await active()===dragBefore)throw Error(name+' release did not snap advance');
            const visibleAdj=await page.locator('.edu-standard-card[data-adjacent="true"]').evaluateAll(es=>es.filter(e=>{const s=getComputedStyle(e);return s.visibility!=='hidden'&&Number(s.opacity)>0}).length);if(visibleAdj<1)throw Error(name+' adjacent not visible');
            await page.screenshot({path:'/tmp/education-gate2/'+name+'.png',fullPage:true}); receipt[name]={seen,active:await active(),visibleAdj};
            await ctx.close();
          } fs.writeFileSync('/tmp/education-gate2/receipt.json',JSON.stringify(receipt,null,2));await browser.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'education-gate2-browser-${{ github.run_id }}', path: /tmp/education-gate2, if-no-files-found: error, retention-days: 30}


# retrigger-whole-card-click
