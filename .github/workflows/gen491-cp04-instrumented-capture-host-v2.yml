name: Gen491 CP-04 Instrumented Capture Host v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gen491-cp04-instrumented-capture-host-v2.yml'

permissions:
  contents: read

env:
  PUBLIC_SOURCE_HEAD: 521c4b146337e16c784b9f3f0a6bb94045b756b5
  OPERATION_ID: CHAPTER_02_CURRENT_H_EARTH_EXPERIENCE_CAPTURE_20260912_001
  PROFILE_ID: H_EARTH_CHAPTER02_GEN491_ONLY

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLIC_SOURCE_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify source and install existing runtimes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$PUBLIC_SOURCE_HEAD"
          test "$(git -C source hash-object showroom/globe/h-earth/index.html)" = 'f4fa5df980c639184352d978909532dc8f1bcbd8'
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe

      - name: Start exact frozen H-Earth source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/source" > "$RUNNER_TEMP/gen491-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/gen491-server.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/showroom/globe/h-earth/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/gen491-server.log"
          exit 1

      - name: Instrument and capture frozen Gen491 choreography
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gen491-frames" "$RUNNER_TEMP/gen491-output/checkpoints"
          cat > "$RUNNER_TEMP/gen491-capture.mjs" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium } from 'playwright';

          const FPS=30, W=1920, H=1080;
          const out=path.join(process.env.RUNNER_TEMP,'gen491-output');
          const frames=path.join(process.env.RUNNER_TEMP,'gen491-frames');
          const checkpoints=path.join(out,'checkpoints');
          const actions=[
            {type:'WAIT_CAPTURE',durationMs:1500},
            {type:'MOUSE_DRAG_CAPTURE',fromX:1200,fromY:540,toX:900,toY:500,durationMs:1500},
            {type:'WAIT_CAPTURE',durationMs:1200},
            {type:'KEY_HOLD_CAPTURE',key:'w',durationMs:6000},
            {type:'MOUSE_DRAG_CAPTURE',fromX:1100,fromY:560,toX:850,toY:430,durationMs:1800},
            {type:'KEY_HOLD_CAPTURE',key:'w',durationMs:6500},
            {type:'WAIT_CAPTURE',durationMs:1200},
            {type:'KEY_HOLD_CAPTURE',key:'s',durationMs:6500},
            {type:'MOUSE_DRAG_CAPTURE',fromX:850,fromY:430,toX:1200,toY:540,durationMs:1800},
            {type:'WAIT_CAPTURE',durationMs:1500}
          ];
          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--use-gl=swiftshader','--enable-unsafe-swiftshader']});
          const page=await browser.newPage({viewport:{width:W,height:H}});
          const consoleMessages=[], pageErrors=[];
          page.on('console',m=>consoleMessages.push({type:m.type(),text:m.text()}));
          page.on('pageerror',e=>pageErrors.push({message:e.message,stack:e.stack??null}));
          await page.goto('http://127.0.0.1:4173/showroom/globe/h-earth/',{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForFunction(()=>globalThis.H_EARTH_RUN8E_PUBLIC_ROUTE?.ready===true || !!globalThis.H_EARTH_RENDERER_STARTUP_DIAGNOSTICS?.getReceipt?.()?.firstFailureStage,null,{timeout:90000});
          const snapshot=()=>page.evaluate(()=>{
            const route=globalThis.H_EARTH_RUN8E_PUBLIC_ROUTE;
            const snap=route?.getSnapshot?.()??null;
            return {
              startup:globalThis.H_EARTH_RENDERER_STARTUP_DIAGNOSTICS?.getReceipt?.()??null,
              routeReady:route?.ready===true,
              eligible:snap?.eligible??null,
              status:snap?.status??null,
              runtimeExclusivity:snap?.runtimeExclusivity??null,
              renderer:{initialized:snap?.liveGpu?.resources?.initialized??null,presentations:Number(snap?.liveGpu?.counters?.gpuFramebufferPresentationCount??0),packageUploadedOnce:snap?.liveGpu?.correspondence?.packageUploadedOnce??null,resourceIdentityStable:snap?.liveGpu?.correspondence?.resourceIdentityStable??null},
              dataset:(()=>{const r=document.getElementById('h-earth-functional-landscape-route');return r?{...r.dataset}:null;})()
            };
          });
          const assertInstrumented=s=>{
            if(s.routeReady!==true) throw new Error(`H_EARTH_ROUTE_NOT_READY:${JSON.stringify(s.startup)}`);
            if(s.runtimeExclusivity?.activeWebGL2ContextCount!==1) throw new Error('WEBGL2_CONTEXT_COUNT_NOT_ONE');
            if(s.renderer?.initialized!==true) throw new Error('RENDERER_NOT_INITIALIZED');
            if(s.renderer?.presentations<1) throw new Error('FRAMEBUFFER_NOT_PRESENTING');
          };
          const checkpoint=async(index,label)=>{
            const s=await snapshot(); assertInstrumented(s);
            fs.writeFileSync(path.join(checkpoints,`${String(index).padStart(2,'0')}-${label}.json`),JSON.stringify(s,null,2)+'\n');
            await page.screenshot({path:path.join(checkpoints,`${String(index).padStart(2,'0')}-${label}.png`),animations:'allow'});
            return s;
          };
          let frame=0;
          const shot=async()=>{await page.screenshot({path:path.join(frames,`frame-${String(frame).padStart(6,'0')}.png`),animations:'allow'});frame++;};
          const captureFor=async ms=>{const count=Math.max(1,Math.round(ms*FPS/1000));const interval=1000/FPS;for(let i=0;i<count;i++){const t=Date.now();await shot();const left=interval-(Date.now()-t);if(left>0)await page.waitForTimeout(left);}};
          const before=await checkpoint(0,'instrumented-ready');
          await page.waitForTimeout(1200);
          await checkpoint(1,'settled-before-capture');
          for(let i=0;i<actions.length;i++){
            const a=actions[i];
            if(a.type==='WAIT_CAPTURE') await captureFor(a.durationMs);
            else if(a.type==='KEY_HOLD_CAPTURE'){await page.keyboard.down(a.key);await captureFor(a.durationMs);await page.keyboard.up(a.key);}
            else if(a.type==='MOUSE_DRAG_CAPTURE'){
              await page.mouse.move(a.fromX,a.fromY);await page.mouse.down();
              const steps=Math.max(2,Math.round(a.durationMs*FPS/1000));
              for(let j=1;j<=steps;j++){const q=j/steps;await page.mouse.move(a.fromX+(a.toX-a.fromX)*q,a.fromY+(a.toY-a.fromY)*q);await shot();await page.waitForTimeout(1000/FPS);}
              await page.mouse.up();
            }
            await checkpoint(i+2,`after-action-${String(i+1).padStart(2,'0')}`);
          }
          const after=await snapshot(); assertInstrumented(after);
          if(frame!==885) throw new Error(`FRAME_COUNT_NOT_885:${frame}`);
          fs.writeFileSync(path.join(out,'instrumentation-session.json'),JSON.stringify({schema:'CH02_GEN491_INSTRUMENTED_CAPTURE_SESSION_v1',result:'PASS',operationId:process.env.OPERATION_ID,generation:491,profileId:process.env.PROFILE_ID,sourceHead:process.env.PUBLIC_SOURCE_HEAD,frameCount:frame,before,after,actions,consoleMessages,pageErrors},null,2)+'\n');
          await browser.close();
          console.log(JSON.stringify({result:'PASS',frameCount:frame}));
          NODE
          node "$RUNNER_TEMP/gen491-capture.mjs"

      - name: Encode and mechanically verify CP-04 source reel
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/gen491-output"
          FRAMES="$RUNNER_TEMP/gen491-frames"
          MP4="$OUT/chapter02-current-h-earth-source-reel.mp4"
          ffmpeg -y -v error -framerate 30 -i "$FRAMES/frame-%06d.png" -c:v libx264 -pix_fmt yuv420p -movflags +faststart -r 30 "$MP4"
          ffmpeg -v error -i "$MP4" -f null -
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -show_entries format=duration,format_name -of json "$MP4" > "$OUT/ffprobe.json"
          sha256sum "$MP4" > "$OUT/sha256.txt"
          export OUT FRAMES MP4
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path(os.environ['OUT']); frames=Path(os.environ['FRAMES']); mp4=Path(os.environ['MP4'])
          probe=json.loads((out/'ffprobe.json').read_text()); s=probe['streams'][0]; f=probe['format']
          raw=mp4.read_bytes(); sha=hashlib.sha256(raw).hexdigest()
          if sha!=(out/'sha256.txt').read_text().split()[0]: raise SystemExit('SHA256_RECHECK_FAILED')
          if s['codec_name']!='h264' or int(s['width'])!=1920 or int(s['height'])!=1080 or s['r_frame_rate']!='30/1' or int(s['nb_frames'])!=885: raise SystemExit('FFPROBE_IDENTITY_MISMATCH')
          records=[]; lines=[]
          for i,p in enumerate(sorted(frames.glob('frame-*.png'))):
              h=hashlib.sha256(p.read_bytes()).hexdigest(); t=round(i*1000/30); records.append({'index':i,'timeMs':t,'sha256':h}); lines.append(f'{i},{t},{h}\n')
          seq=hashlib.sha256(''.join(lines).encode()).hexdigest()
          (out/'chapter02-current-h-earth-source-reel.frame-manifest.json').write_text(json.dumps({'schema':'CH02_HEARTH_SOURCE_REEL_FRAME_MANIFEST_v1','result':'PASS','sourceHead':os.environ['PUBLIC_SOURCE_HEAD'],'fps':30,'frameCount':885,'sequenceSha256':seq,'frames':records},indent=2)+'\n')
          manifest={'schema':'CH02_HEARTH_SOURCE_REEL_MANIFEST_v1','result':'MATERIALIZED_UNQUALIFIED','status':'CH02_HEARTH_SOURCE_REEL_MATERIALIZED_UNQUALIFIED','operationId':os.environ['OPERATION_ID'],'generation':491,'profileId':os.environ['PROFILE_ID'],'sourceRepository':'smansfield635-create/smansfield635-create.github.io','sourceHead':os.environ['PUBLIC_SOURCE_HEAD'],'captureContractId':'ISSUE_598_CP_01','captureContract':'PLANETARY_GLOBE_TO_AUDRALIA_APPROACH_TO_H_EARTH_ENTRY_TO_COASTLINE_TO_BEACH_TERRAIN_TO_MOUNTAIN_TOPOGRAPHY_TO_CONTINUOUS_FORWARD_TRAVERSE_TO_DELIBERATE_WITHDRAWAL_TO_PLANETARY_GLOBE','resolution':{'width':1920,'height':1080},'fps':30,'duration':float(f['duration']),'frameCount':885,'codec':'h264','container':'mp4','formatName':f['format_name'],'sha256':sha,'byteLength':len(raw),'frameSequenceSha256':seq,'instrumentation':'EXISTING_H_EARTH_RUNTIME_INVARIANTS_ASSERTED_IN_SAME_CAPTURE_SESSION','visualQualificationPerformed':False,'productMutationPerformed':False,'repositoryMutationPerformed':False}
          (out/'chapter02-current-h-earth-source-reel.manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          (out/'cp04-execution.receipt.json').write_text(json.dumps({'schema':'CH02_GEN491_CP04_INSTRUMENTED_CAPTURE_EXECUTION_RECEIPT_v1','result':'PASS_CLOSED','sourceHead':manifest['sourceHead'],'mp4Sha256':sha,'frameCount':885,'duration':manifest['duration'],'resolution':manifest['resolution'],'fps':30,'codec':'h264','container':'mp4','fullDecodeErrors':0,'sameSessionInstrumentationPassed':True,'materializationState':'CH02_HEARTH_SOURCE_REEL_MATERIALIZED_UNQUALIFIED','repositoryMutationPerformed':False},indent=2)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: gen491-cp04-instrumented-capture-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gen491-output/**
            ${{ runner.temp }}/gen491-server.log
          if-no-files-found: error
          retention-days: 90
