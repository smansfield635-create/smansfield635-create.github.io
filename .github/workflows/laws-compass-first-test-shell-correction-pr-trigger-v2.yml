name: Laws Compass FIRST Correction PR Trigger v2

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/laws-compass-first-test-shell-correction-pr-trigger-v2.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute production and benchmark-source patch only
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          source = Path('.github/workflows/laws-compass-first-test-shell-correction-apply.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python3 <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          body = '\n'.join((line[10:] if line.startswith('          ') else line) for line in source[start:end]) + '\n'
          body = re.sub(r'\n# Both benchmark workflows serve and test the exact checked-out candidate\..*?\n# Syntax and required-source checks before committing\.', '\n# Syntax and required-source checks before committing.', body, flags=re.S)
          body = body.replace('process.env.FOUR_COMPASS_ORIGIN || "http://127.0.0.1:4173"', 'process.env.FOUR_COMPASS_ORIGIN || "https://smansfield635-create.github.io"')
          Path('/tmp/laws-apply-v2.py').write_text(body)
          PY
          python3 /tmp/laws-apply-v2.py
          node --check laws/index.interactions.js
          node --check laws/index.controller.js
          node --check verification/benchmark-tools/four-compass-benchmark-v1/four-compass-benchmark.config.mjs
          node --check verification/benchmark-tools/four-compass-benchmark-v1/four-compass-browser-baseline.mjs

      - name: Commit bounded correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add laws/index.html laws/index.css laws/index.interactions.js laws/index.controller.js \
            verification/benchmark-tools/four-compass-benchmark-v1/four-compass-benchmark.config.mjs \
            verification/benchmark-tools/four-compass-benchmark-v1/four-compass-browser-baseline.mjs
          git commit -m "Reconcile Laws Compass FIRST labels and shell"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
