            entry:'h-earth-3d/validation/h-earth.gratitude-region.entry-zone-reconciliation.receipt.v1.json',
            manor:'h-earth-3d/validation/h-earth.gratitude-region.mirror-manor-reconciliation.receipt.v1.json',
            cavern:'h-earth-3d/validation/h-earth.gratitude-region.cavern-precinct-reconciliation.receipt.v1.json',
            frontier:'h-earth-3d/validation/h-earth.gratitude-region.frontier-plains-capacity-relationship-reconciliation.receipt.v1.json'
          };
          const FP03={
            status:'PASS_CLOSED_DO_NOT_REOPEN',
            disposition:'ACCEPT_CURRENT_RELATION',
            exteriorFace:{x:40,z:-284},
            apron:{x:48,z:-284},
            precinctCenter:{x:56,z:-284},
            userIntentMateriallySatisfied:true,
            authorizedBaseHead:BASE,
            workflowTriggerHead:'e4533a52171a56b4054fd5e3aba7286b62b136bb',
            executedDetachedCandidateHead:'65454a6d46764505048599dfcc56abef20e3007b',
            executionDigest:'d8aa6c41e6e8bac3ab79ff44b3121e644dcd1be06b43a637a96e86f299d8d57a',
            receiptSha256:'fdd73087f7e8891b04ce8fe23611947dfbba99e55f37f0bdaf6592c44dd9c986',
            githubArtifactId:8740913317,
            driveEvidence:{id:'12QvP0O7sjtRj5MRmJxZeG4t2E3uAjLdE',bytes:10603,sha256:'5910c652169493bc9fe58087c8ed25ada2987010b6d1cd12e533590fd2899fde'},
            driveReceipt:{id:'1dDjdYCipISobV2bKgGKKIFBkx-Dplw5S',bytes:4268,sha256:'034ef94dbdfabbbb363c7c3201ebd7fb285baad150c9b9f7a6fc61e262404038'}
