          program['currentSubcheckpoint']='R1.7C_MINIMAL_CANDIDATE_RENDERER_SAMPLING_INTEGRATION'
          program['nextAuthorizedSubcheckpoint']='R1.7C_MINIMAL_CANDIDATE_RENDERER_SAMPLING_INTEGRATION'
