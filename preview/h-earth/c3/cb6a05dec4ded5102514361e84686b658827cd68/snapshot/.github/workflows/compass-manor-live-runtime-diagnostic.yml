name: Compass Mirror Manor Live Runtime Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compass-manor-live-runtime-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Inspect rendered production House card
        shell: bash
        run: |
          cat > /tmp/manor-live-diagnostic.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:1200}, deviceScaleFactor:1});
          const consoleEvents=[]; const pageErrors=[]; const failed=[]; const manorRequests=[];
          page.on('console',m=>consoleEvents.push({type:m.type(),text:m.text()}));
          page.on('pageerror',e=>pageErrors.push(String(e.stack||e)));
          page.on('requestfailed',r=>failed.push({url:r.url(),failure:r.failure()?.errorText||''}));
          page.on('response',r=>{ if (/compass\.(capability-carousel|house-scene)|manor-blueprint/i.test(r.url())) manorRequests.push({url:r.url(),status:r.status(),fromServiceWorker:r.fromServiceWorker()}); });
          await page.goto('https://diamondgatebridge.com/?manor_runtime_probe=1',{waitUntil:'networkidle',timeout:120000});
          const orbit=page.locator('[data-capability-orbit]');
          await orbit.scrollIntoViewIfNeeded();
          await page.waitForTimeout(1200);
          const plaques=await page.locator('.compass-orbit-plaque').evaluateAll(nodes=>nodes.map(n=>({cap:n.getAttribute('data-capability'),text:(n.textContent||'').trim().slice(0,180),active:n.getAttribute('data-active')})));
          let target=page.locator('.compass-orbit-plaque').filter({hasText:/House|Mirror Manor/i}).first();
          if (await target.count()) { await target.click({force:true}); await page.waitForTimeout(3500); }
          const state=await page.evaluate(()=>{
            const nodes=[...document.querySelectorAll('.compass-orbit-plaque')];
            const house=nodes.find(n=>/House|Mirror Manor/i.test(n.textContent||''));
            const canvases=[...document.querySelectorAll('canvas')].map(c=>({class:c.className,width:c.width,height:c.height,rect:(()=>{const r=c.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}})(),dataset:{...c.dataset}}));
            return {house:house?{cap:house.getAttribute('data-capability'),active:house.getAttribute('data-active'),html:house.innerHTML.slice(0,1200)}:null,canvases,bodyClasses:document.body.className};
          });
          await page.screenshot({path:'/tmp/manor-live.png',fullPage:true});
          const receipt={url:page.url(),plaques,state,consoleEvents,pageErrors,failed,manorRequests};
          fs.writeFileSync('/tmp/manor-live.json',JSON.stringify(receipt,null,2));
          console.log(JSON.stringify(receipt,null,2));
          await browser.close();
          if (!state.house) process.exitCode=2;
          EOF
          node /tmp/manor-live-diagnostic.mjs

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compass-manor-live-runtime-diagnostic
          path: |
            /tmp/manor-live.json
            /tmp/manor-live.png
          if-no-files-found: error
