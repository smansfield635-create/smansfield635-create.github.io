name: Exact Head Pages Deploy v3

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact approved current-main commit SHA to publish
        required: true
        type: string
      surface_id:
        description: Registered public surface verification id
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      surface_id: ${{ steps.surface.outputs.surface_id }}
      manifest_path: ${{ steps.surface.outputs.manifest_path }}
      runtime_enabled: ${{ steps.surface.outputs.runtime_enabled }}
    steps:
      - name: Resolve exact current main
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          requested="$(printf '%s' "$REQUESTED_SHA" | tr -d '[:space:]')"
          test -n "$requested"
          main_sha="$(curl --fail-with-body --silent --show-error -L -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test "$requested" = "$main_sha"
          echo "target_sha=$requested" >> "$GITHUB_OUTPUT"

      - name: Checkout exact approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.target_sha }}
          fetch-depth: 1

      - name: Resolve registered surface
        id: surface
        env:
          REQUESTED_SURFACE: ${{ inputs.surface_id }}
        shell: bash
        run: |
          set -euo pipefail
          surface="$(printf '%s' "$REQUESTED_SURFACE" | tr -d '[:space:]')"
          printf '%s' "$surface" | grep -Eq '^[a-z0-9][a-z0-9._-]{0,79}$'
          manifest=".github/ai-router/publication-surfaces/${surface}.json"
          test -f "$manifest"
          jq -e --arg surface "$surface" '.schema == "PUBLICATION_SURFACE_VERIFICATION_v1" and .surfaceId == $surface and (.checks|type=="array") and (.checks|length>0)' "$manifest" >/dev/null
          runtime_enabled="$(jq -r 'if .runtime?.enabled == true then "true" else "false" end' "$manifest")"
          echo "surface_id=$surface" >> "$GITHUB_OUTPUT"
          echo "manifest_path=$manifest" >> "$GITHUB_OUTPUT"
          echo "runtime_enabled=$runtime_enabled" >> "$GITHUB_OUTPUT"

      - name: Stamp exact-head release marker
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
          SURFACE_ID: ${{ steps.surface.outputs.surface_id }}
          MANIFEST_PATH: ${{ steps.surface.outputs.manifest_path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .well-known
          manifest_sha256="$(sha256sum "$MANIFEST_PATH" | awk '{print $1}')"
          jq -n --arg schema DGB_PUBLIC_RELEASE_MARKER_v3 --arg commit "$TARGET_SHA" --arg surface "$SURFACE_ID" --arg manifest "$MANIFEST_PATH" --arg manifestSha256 "$manifest_sha256" '{schema:$schema,commit:$commit,surface:$surface,verificationManifest:$manifest,verificationManifestSha256:$manifestSha256}' > .well-known/dgb-release.json

      - name: Stage bounded Pages payload
        env:
          PAGES_STAGE: ${{ runner.temp }}/pages-site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PAGES_STAGE"
          mkdir -p "$PAGES_STAGE"
          rsync -a --prune-empty-dirs --exclude='.git/' --exclude='.github/' --exclude='preview/' ./ "$PAGES_STAGE/"
          test -f "$PAGES_STAGE/.well-known/dgb-release.json"
          staged_bytes="$(du -sb "$PAGES_STAGE" | awk '{print $1}')"
          test "$staged_bytes" -lt 1073741824

      - uses: actions/configure-pages@v5
      - name: Upload exact-head Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact-head artifact
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live-exact-head:
    needs: [prepare, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          fetch-depth: 1
      - name: Verify public release marker and surface bytes
        env:
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
          SURFACE_ID: ${{ needs.prepare.outputs.surface_id }}
          MANIFEST_PATH: ${{ needs.prepare.outputs.manifest_path }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          marker_url="${PAGE_URL%/}/.well-known/dgb-release.json"
          expected_manifest_sha="$(sha256sum "$MANIFEST_PATH" | awk '{print $1}')"
          for attempt in $(seq 1 30); do
            marker="$(curl --fail --silent --show-error -L --max-time 20 "$marker_url" 2>/dev/null || true)"
            observed="$(printf '%s' "$marker" | jq -r '.commit // empty' 2>/dev/null || true)"
            marker_surface="$(printf '%s' "$marker" | jq -r '.surface // empty' 2>/dev/null || true)"
            marker_manifest_sha="$(printf '%s' "$marker" | jq -r '.verificationManifestSha256 // empty' 2>/dev/null || true)"
            if [ "$observed" = "$TARGET_SHA" ] && [ "$marker_surface" = "$SURFACE_ID" ] && [ "$marker_manifest_sha" = "$expected_manifest_sha" ]; then
              node tools/publication-live-verify.mjs static "$PAGE_URL" "$MANIFEST_PATH"
              echo "LIVE_EXACT_HEAD_VERIFIED target=$TARGET_SHA surface=$SURFACE_ID"
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Set up Chrome for runtime verification
        if: ${{ needs.prepare.outputs.runtime_enabled == 'true' }}
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Install browser verifier
        if: ${{ needs.prepare.outputs.runtime_enabled == 'true' }}
        run: npm install --no-save --no-package-lock puppeteer-core@24.15.0
      - name: Verify declared runtime readiness
        if: ${{ needs.prepare.outputs.runtime_enabled == 'true' }}
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          MANIFEST_PATH: ${{ needs.prepare.outputs.manifest_path }}
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_PATH="$(command -v google-chrome || command -v chrome || command -v chromium || find /opt/hostedtoolcache/setup-chrome -type f -name chrome 2>/dev/null | head -1)"
          test -x "$CHROME_PATH"
          node tools/publication-live-verify.mjs runtime "$PAGE_URL" "$MANIFEST_PATH"
