name: H-Earth R06-C10 Candidate 95504c Direct Source Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h-earth-r06-c10-preview-95504c-v6-direct-source-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose-exact-source:
    if: github.head_ref == 'publication/h-earth-r06-c10-preview-95504c-001'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_HEAD: 95504c9927922318225da1d61fa303cec70497f9
      SOURCE_URL_PATH: /showroom/globe/h-earth/index.html
      PLAYWRIGHT_VERSION: 1.55.0
    steps:
      - name: Check out exact terrain candidate
        uses: actions/checkout@v4
        with:
          ref: 95504c9927922318225da1d61fa303cec70497f9
          fetch-depth: 1
          path: source

      - name: Install Chromium verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw" "$RUNNER_TEMP/proof"
          cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium

      - name: Diagnose exact untransformed source runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4188 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/source" >"$RUNNER_TEMP/proof/server.log" 2>&1 &
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:4188$SOURCE_URL_PATH" >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          cat > "$RUNNER_TEMP/pw/diagnose.mjs" <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import process from 'node:process';
          import { chromium } from 'playwright';
          const out=path.join(process.env.RUNNER_TEMP,'proof');
          const url=`http://127.0.0.1:4188${process.env.SOURCE_URL_PATH}`;
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:412,height:915},deviceScaleFactor:2,isMobile:true,hasTouch:true});
          const page=await context.newPage();
          const consoleRecords=[],pageErrors=[],requestFailures=[],httpFailures=[];
          page.on('console',m=>consoleRecords.push({type:m.type(),text:m.text()}));
          page.on('pageerror',e=>pageErrors.push({name:e.name,message:e.message,stack:e.stack}));
          page.on('requestfailed',r=>requestFailures.push({url:r.url(),failure:r.failure()}));
          page.on('response',r=>{if(r.status()>=400&&!r.url().endsWith('/favicon.ico'))httpFailures.push({url:r.url(),status:r.status()})});
          await page.goto(url,{waitUntil:'domcontentloaded',timeout:120000});
          await page.waitForTimeout(15000);
          const state=await page.evaluate(async()=>{
            const canvas=document.getElementById('h-earth-functional-landscape-canvas');
            let canvasInfo=null;
            if(canvas){
              const gl=canvas.getContext('webgl2')||canvas.getContext('webgl');
              let pixels=null;
              if(gl&&canvas.width&&canvas.height){
                const w=Math.min(canvas.width,256),h=Math.min(canvas.height,256),data=new Uint8Array(w*h*4);
                gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,data);
                let visible=0,sum=0,max=0;
                for(let i=0;i<data.length;i+=4){const s=data[i]+data[i+1]+data[i+2];sum+=s;max=Math.max(max,s);if(s>18)visible++;}
                pixels={visiblePixelFraction:visible/(w*h),meanRgbSum:sum/(w*h),maximumRgbSum:max,glError:gl.getError()};
              }
              canvasInfo={width:canvas.width,height:canvas.height,hasWebGL:Boolean(gl),pixels};
            }
            let packageRecord=null,packageImportError=null;
            try{
              const module=await import('/showroom/globe/h-earth/render/live-render-package.run8e-r2.js');
              packageRecord=module.getHEarthRun8ER2ImmutableLiveRenderPackage();
            }catch(error){packageImportError={name:error.name,message:error.message,stack:error.stack};}
            return {
              href:location.href,
              canvas:canvasInfo,
              startupReceipt:window.H_EARTH_RENDERER_STARTUP_DIAGNOSTICS?.getReceipt?.()??null,
              runtimeSnapshot:window.H_EARTH_RUNTIME_DIAGNOSTICS?.getSnapshot?.()??null,
              packageRecord,
              packageImportError,
              resources:performance.getEntriesByType('resource').map(r=>r.name)
            };
          });
          const result={sourceHead:process.env.SOURCE_HEAD,url,consoleRecords,pageErrors,requestFailures,httpFailures,state};
          fs.writeFileSync(path.join(out,'direct-source-diagnostic.json'),JSON.stringify(result,null,2)+'\n');
          await page.screenshot({path:path.join(out,'direct-source-diagnostic.png'),fullPage:true});
          console.log(JSON.stringify({pageErrors,requestFailures,httpFailures,startupReceipt:state.startupReceipt,packageRecord:state.packageRecord,canvas:state.canvas},null,2));
          await context.close(); await browser.close();
          if(pageErrors.length||requestFailures.length||httpFailures.length||state.startupReceipt?.firstFailureStage||!state.canvas?.pixels||state.canvas.pixels.visiblePixelFraction<=.01)process.exit(1);
          JS
          cd "$RUNNER_TEMP/pw"
          node diagnose.mjs

      - name: Upload direct-source diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-r06-c10-95504c-direct-source-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof
          if-no-files-found: warn
          retention-days: 30
