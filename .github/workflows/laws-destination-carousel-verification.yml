name: Laws Destination Carousel Verification

on:
  pull_request:
    paths:
      - 'laws/index.destination-carousel.js'
      - 'laws/index.destination-carousel.css'
      - 'laws/index.mobile-background-tabs.js'
      - 'laws/index.mobile-background-tabs.core.js'
      - '.github/workflows/laws-destination-carousel-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Verify JavaScript syntax
        run: |
          node --check laws/index.destination-carousel.js
          node --check laws/index.mobile-background-tabs.js
          node --check laws/index.mobile-background-tabs.core.js
      - name: Verify preserved responsive core identity
        run: |
          test "$(git hash-object laws/index.mobile-background-tabs.core.js)" = "e7718c0a7508fe6e4f938837930517a5c85c83f1"
      - name: Verify carousel construction contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          js = Path('laws/index.destination-carousel.js').read_text()
          css = Path('laws/index.destination-carousel.css').read_text()
          loader = Path('laws/index.mobile-background-tabs.js').read_text()
          required_js = [
              'LAWS_DESTINATION_CAROUSEL_RUNTIME_v2',
              'pointerdown', 'pointermove', 'pointerup',
              'ArrowLeft', 'ArrowRight', 'Home', 'End',
              'LAWS_DESTINATION_CAROUSEL_CHANGED',
              'data-laws-root-rolodex-section',
              'neighbor-select', 'drag-snap'
          ]
          required_css = [
              'position: absolute !important',
              '--laws-carousel-x', '--laws-carousel-z',
              'translateZ', 'rotateY',
              'data-carousel-relative',
              'prefers-reduced-motion'
          ]
          for token in required_js:
              assert token in js, f'missing JS contract token: {token}'
          for token in required_css:
              assert token in css, f'missing CSS contract token: {token}'
          assert 'index.mobile-background-tabs.core.js' in loader
          assert 'index.destination-carousel.js' in loader
          assert 'navigationAuthority: false' in js
          assert 'contentAuthority: false' in js
          assert 'routeAuthority: false' in js
          assert 'evidenceAuthority: false' in js
          print('Laws destination carousel exact-head static qualification PASS')
          PY
