name: Compass Capability Continuity Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/compass-display-continuity-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Serve exact candidate
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/compass-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
      - name: Inspect every rendered capability
        run: |
          mkdir -p /tmp/compass-rendered
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true}),viewports=[['desktop',1440,1000],['tablet',1024,1366],['phone',390,844]],failures=[],results={};
          for(const [id,width,height] of viewports){const ctx=await browser.newContext({viewport:{width,height}}),page=await ctx.newPage(),errors=[];page.on('pageerror',e=>errors.push(String(e.message||e)));await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:30000});await page.waitForSelector('[data-capability-orbit]',{timeout:10000});await page.waitForTimeout(900);const states=[];
            for(let step=0;step<3;step++){const state=await page.evaluate(()=>{const stage=document.querySelector('[data-capability-orbit]'),objectStage=stage?.querySelector('.compass-object-stage'),active=stage?.querySelector('[data-active="true"]'),caption=active?.querySelector('.compass-object-caption'),dock=stage?.querySelector('.compass-action-dock'),portal=active?.querySelector('.compass-object-portal'),rect=n=>n?(()=>{const r=n.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height,b:r.bottom,r:r.right}})():null,c=rect(caption),d=rect(dock),p=rect(portal),os=rect(objectStage),a=rect(active);return{capability:active?.dataset.capability||'',captionText:(caption?.innerText||'').replace(/\s+/g,' ').trim(),dockText:(dock?.innerText||'').replace(/\s+/g,' ').trim(),caption:c,dock:d,portal:p,objectStage:os,active:a,captionDockGap:c&&d?d.y-c.b:null,captionViewportOverflow:c?Math.max(0,-c.x,c.r-innerWidth):0,activeViewportOverflow:a?Math.max(0,-a.x,a.r-innerWidth):0,portalStageEscape:p&&os?Math.max(0,os.y-p.y,p.b-os.b):0,documentOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}});if(!state.captionText)failures.push(`${id}:missing-caption:${state.capability}`);if(state.captionDockGap<0)failures.push(`${id}:caption-action-overlap:${state.capability}`);if(state.captionViewportOverflow>2)failures.push(`${id}:caption-overflow:${state.capability}:${state.captionViewportOverflow}`);if(state.activeViewportOverflow>2)failures.push(`${id}:card-overflow:${state.capability}:${state.activeViewportOverflow}`);if(state.portalStageEscape>2)failures.push(`${id}:object-stage-escape:${state.capability}:${state.portalStageEscape}`);if(state.documentOverflow>2)failures.push(`${id}:document-overflow:${state.documentOverflow}`);states.push(state);await page.locator('[data-capability-orbit]').screenshot({path:`/tmp/compass-rendered/${id}-${state.capability}.png`});await page.locator('[data-capability-orbit] [data-orbit-next]').click();await page.waitForTimeout(700)}results[id]={viewport:{width,height},errors,states};if(errors.length)failures.push(...errors.map(e=>`${id}:pageerror:${e}`));await ctx.close()}
          await browser.close();const receipt={schema:'COMPASS_RENDERED_CONTINUITY_INSPECTION_v3',productBase:'e87cbfe99954f182bd23062aab9775efc01dcd64',results,failures,result:failures.length?'FAIL_CLOSED':'PASS_CLOSED'};fs.writeFileSync('/tmp/compass-rendered/receipt.json',JSON.stringify(receipt,null,2)+'\n');console.log(JSON.stringify(receipt,null,2));if(failures.length)process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-rendered-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/compass-rendered
          retention-days: 30
