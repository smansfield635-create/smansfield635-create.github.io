name: H-Earth Gate B Seven-File Verification

on:
  pull_request:
    branches:
      - agent/h-earth-gate-b-seven-file-verification-001
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'agent/h-earth-gate-b-seven-file-verification-001'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact seven-file identities
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ledger.txt <<'EOF'
          7fbdf7c14cdc51d09fac4dc3af76a10727850fbf showroom/globe/h-earth/environment.js
          2a5b79a58ce411ed820df7ec2166f2e7b6e54b5b showroom/globe/h-earth/render/ground-view-gate-b.js
          978ca951e03ea93975153ebba0c874f84848290a showroom/globe/h-earth/render/tests/ground-view-gate-b.contract.js
          c14600319946c45fca9b6d37e74033eb44680b05 showroom/globe/h-earth/index.html
          2bcb67ebf84f36248475921c85e75236a1115102 h-earth-3d/integration/h-earth.post-west-admitted-geometry-transfer.js
          c45ed4482f0d653c4a51ea838c191f36e7769d26 showroom/globe/h-earth/admitted-geometry-frame.js
          480cd4519a4d3cc364be4b16acc7791aadb5071c showroom/globe/h-earth/compositor.js
          EOF
          while read -r expected path; do
            actual=$(git hash-object "$path")
            printf '%s %s %s\n' "$path" "$expected" "$actual"
            test "$actual" = "$expected"
          done < /tmp/ledger.txt

      - name: Syntax-check JavaScript members
        shell: bash
        run: |
          set -euo pipefail
          node --check showroom/globe/h-earth/environment.js
          node --check showroom/globe/h-earth/render/ground-view-gate-b.js
          node --check showroom/globe/h-earth/render/tests/ground-view-gate-b.contract.js
          node --check h-earth-3d/integration/h-earth.post-west-admitted-geometry-transfer.js
          node --check showroom/globe/h-earth/admitted-geometry-frame.js
          node --check showroom/globe/h-earth/compositor.js

      - name: Execute Gate B contract and package imports
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import process from 'node:process';

          const commit = process.env.GITHUB_SHA;
          const env = await import('./showroom/globe/h-earth/environment.js');
          const gate = await import('./showroom/globe/h-earth/render/ground-view-gate-b.js');
          const tests = await import('./showroom/globe/h-earth/render/tests/ground-view-gate-b.contract.js');
          const transfer = await import('./h-earth-3d/integration/h-earth.post-west-admitted-geometry-transfer.js');
          const frame = await import('./showroom/globe/h-earth/admitted-geometry-frame.js');
          const compositor = await import('./showroom/globe/h-earth/compositor.js');

          const contractResult = tests.runHEarthGroundViewGateBContractTests();
          const routeHtml = fs.readFileSync('./showroom/globe/h-earth/index.html', 'utf8');

          const checks = {
            environmentImport: Boolean(env.H_EARTH_GROUND_VIEW_PHASE_1_CONFIGURATION),
            gateImport: typeof gate.constructHEarthGroundViewGateBGeometry === 'function',
            contractExecutionNoBlockingFindings: Array.isArray(contractResult.blockingFindings) && contractResult.blockingFindings.length === 0,
            concreteMeshExecutionPassed: contractResult.groups?.concreteMeshExecutionTests?.failed === 0,
            packetTransferImport: Object.keys(transfer).length > 0,
            admittedFrameImport: typeof frame.composeHEarth3DAdmittedGeometryFrame === 'function',
            compositorImport: compositor.H_EARTH_3D_COMPOSITOR_CONTRACT_ID === 'H_EARTH_3D_COMPOSITOR_FILE_RENEWAL_STEP_034O_8_ADMITTED_GEOMETRY_FRAME_COMPOSITION_v1',
            compositorHandoffExport: typeof compositor.getHEarth3DCompositorRendererHandoff === 'function',
            routeBootstrapReferencesGateB: routeHtml.includes('ground-view-gate-b') || routeHtml.includes('constructHEarthGroundViewGateBGeometry'),
            routeBootstrapReferencesPacket002: routeHtml.includes('post-west-admitted-geometry-transfer') || routeHtml.includes('buildHEarthPostWestAdmittedGeometryTransfer'),
            diagnosticSeparation: contractResult.records?.some((record) => record.id === 'GB-S17' && record.status === 'PASS') === true,
            controllerExcluded: true
          };

          const failed = Object.entries(checks).filter(([, passed]) => passed !== true);
          const receipt = {
            receiptId: 'H_EARTH_GATE_B_7_FILE_CORRIDOR_EXECUTION_RECEIPT_v2',
            exactCommitSha: commit,
            nodeVersion: process.version,
            packageMembership: '7_FILE_GATE_B_EXECUTABLE_CORRIDOR',
            controllerJsIncluded: false,
            controllerJsExclusionBasis: 'controller.js is outside the frozen seven-file Gate B package and is not required by the Gate B route corridor under review.',
            contractResult,
            checks,
            failedChecks: failed.map(([name]) => name),
            overallPassOrFail: failed.length === 0 ? 'PASS' : 'FAIL',
            sourceIdentitySeparateFromAcceptance: true,
            finalAcceptance: 'NOT_CONFERRED_BY_EXECUTION_ALONE'
          };

          fs.writeFileSync('H_EARTH_GATE_B_7_FILE_CORRIDOR_EXECUTION_RECEIPT_v2.json', JSON.stringify(receipt, null, 2));
          console.log(JSON.stringify(receipt, null, 2));
          if (failed.length > 0) process.exit(1);
          EOF

      - name: Upload machine-readable receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-gate-b-seven-file-receipt
          path: H_EARTH_GATE_B_7_FILE_CORRIDOR_EXECUTION_RECEIPT_v2.json
          if-no-files-found: warn
