name: H-Earth Remove Target 4F Target 2 Dependency

on:
  push:
    branches:
      - agent/h-earth-gate-b-post-guardrail-evaluation-001
    paths:
      - tools/h-earth-remove-target4f-target2-dependency.mjs
      - .github/workflows/h-earth-remove-target4f-target2-dependency.yml

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/h-earth-gate-b-post-guardrail-evaluation-001
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove obsolete Target 2 dependency
        run: node tools/h-earth-remove-target4f-target2-dependency.mjs
      - name: Verify dependency is absent
        run: |
          ! grep -q "target2" tools/h-earth-repository-registry-target-4f-audit.mjs
      - name: Commit renewed Target 4F audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/h-earth-repository-registry-target-4f-audit.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Remove obsolete Target 2 dependency from Target 4F audit'
          git push origin HEAD:agent/h-earth-gate-b-post-guardrail-evaluation-001
