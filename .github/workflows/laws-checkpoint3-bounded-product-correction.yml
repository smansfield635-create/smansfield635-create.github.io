name: Laws Checkpoint 3 Bounded Product Correction

on:
  push:
    branches:
      - agent/laws-compass-checkpoint-2-bounded-construction-002
    paths:
      - ".github/workflows/laws-checkpoint3-bounded-product-correction.yml"

permissions:
  contents: write

jobs:
  correct-product:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/laws-compass-checkpoint-2-bounded-construction-002
          fetch-depth: 0

      - name: Apply retained bounded semantic correction
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess

          source = subprocess.check_output(
              [
                  'git',
                  'show',
                  '0b4fd04e15c28f5e39ab46288c7167173e951fc6:.github/workflows/laws-checkpoint3-bounded-product-correction.yml'
              ],
              text=True
          )
          match = re.search(r"          python3 <<'PY'\n(.*?)\n          PY\n", source, re.S)
          if not match:
              raise SystemExit('ORIGINAL_BOUNDED_PATCH_PAYLOAD_NOT_FOUND')
          payload = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in match.group(1).splitlines()
          )
          prefix = (
              "from pathlib import Path\n"
              "import re\n"
              "p=Path('laws/index.crystals.js')\n"
              "s=p.read_text(encoding='utf-8')\n"
              "s,n=re.subn(r'\\n\\s+normalizeLawId\\(\\s*element\\.dataset\\.lawId\\s*\\);', '\\n               normalizeLawId(\\n                 element.dataset.lawId\\n               );', s, count=1)\n"
              "if n != 1: raise RuntimeError(f'CRYSTALS_CHILD_ID_NORMALIZATION:{n}')\n"
              "s,n=re.subn(r'\\n\\s+type:\\s*\\n\\s+NODE_TYPES\\.LAW,', '\\n                 type:\\n                   NODE_TYPES.LAW,', s, count=1)\n"
              "if n != 1: raise RuntimeError(f'CRYSTALS_CHILD_NODE_CLASS_NORMALIZATION:{n}')\n"
              "s,n=re.subn(r'\\n\\s+label:\\s*\\n\\s+element\\.dataset\\.lawLabel \\|\\|\\s*\\n\\s+element\\.dataset\\.label \\|\\|\\s*\\n\\s+element\\.textContent\\.trim\\(\\),', '\\n                 label:\\n                   element.dataset.lawLabel ||\\n                   element.dataset.label ||\\n                   element.textContent.trim(),', s, count=1)\n"
              "if n != 1: raise RuntimeError(f'CRYSTALS_CHILD_LABEL_NORMALIZATION:{n}')\n"
              "s,n=re.subn(r'\\n\\s+meshKey:\\s*\\n\\s+`law-\\$\\{direction\\}`,', '\\n                 meshKey:\\n                   `law-${direction}`,', s, count=1)\n"
              "if n != 1: raise RuntimeError(f'CRYSTALS_CHILD_MESH_NORMALIZATION:{n}')\n"
              "s,n=re.subn(r'node\\.type === NODE_TYPES\\.LAW &&\\s*\\n\\s*node\\.direction === direction', 'node.type === NODE_TYPES.LAW &&\\n        node.direction === direction', s, count=1)\n"
              "if n != 1: raise RuntimeError(f'CRYSTALS_ACTIVE_CHILD_NORMALIZATION:{n}')\n"
              "s,n=re.subn(r'node\\.type === NODE_TYPES\\.CATEGORY \\|\\|\\s*\\n\\s*node\\.type === NODE_TYPES\\.AUXILIARY \\|\\|\\s*\\n\\s*node\\.type === NODE_TYPES\\.LAW', 'node.type === NODE_TYPES.CATEGORY ||\\n             node.type === NODE_TYPES.AUXILIARY ||\\n             node.type === NODE_TYPES.LAW', s, count=1)\n"
              "if n != 1: raise RuntimeError(f'CRYSTALS_PROJECTION_NORMALIZATION:{n}')\n"
              "p.write_text(s, encoding='utf-8')\n"
          )
          payload = prefix + '\n' + payload
          subprocess.run(['python3', '-c', payload], check=True)
          for temporary in (
              '.github/workflows/laws-checkpoint3-bounded-product-correction-trigger-v2.yml',
              '.github/workflows/laws-checkpoint3-bounded-product-correction-push-v3.yml',
              '.github/workflows/laws-checkpoint3-bounded-product-correction-diagnostic-v4.yml'
          ):
              Path(temporary).unlink(missing_ok=True)
          subprocess.run(
              [
                  'git', 'add', '-u',
                  '.github/workflows/laws-checkpoint3-bounded-product-correction-trigger-v2.yml',
                  '.github/workflows/laws-checkpoint3-bounded-product-correction-push-v3.yml',
                  '.github/workflows/laws-checkpoint3-bounded-product-correction-diagnostic-v4.yml'
              ],
              check=True
          )
          PY

      - name: Validate corrected JavaScript syntax
        run: |
          node --check laws/index.controller.js
          node --check laws/index.crystals.js
          node --check laws/index.interactions.js

      - name: Commit bounded correction and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/laws-checkpoint3-bounded-product-correction.yml
          rm -f .github/workflows/laws-checkpoint3-bounded-product-correction-trigger.yml
          rm -f .github/workflows/laws-checkpoint3-bounded-product-correction-trigger-v2.yml
          rm -f .github/workflows/laws-checkpoint3-bounded-product-correction-push-v3.yml
          rm -f .github/workflows/laws-checkpoint3-bounded-product-correction-diagnostic-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A laws/index.html laws/index.controller.js laws/index.crystals.js laws/index.interactions.js laws/index.css .github/workflows
          git commit -m "Checkpoint 3: separate Law and non-Law cluster members"
          git push origin HEAD:agent/laws-compass-checkpoint-2-bounded-construction-002
