name: Compass v4 materialize

on:
  push:
    branches:
      - agent/compass-reconstruction-v4

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compass-reconstruction-v4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact Compass plan materialization
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          html_path = Path('index.html')
          html = html_path.read_text()
          replacements = {
              '/assets/compass/compass.css?v=display-continuity-reference-v2': '/assets/compass/compass.css?v=compass-plan-reconstruction-v4',
              '/assets/compass/compass.cosmos.js?v=dgb-main-compass-build-door-v1': '/assets/compass/compass.cosmos.js?v=compass-plan-reconstruction-v4',
          }
          for old, new in replacements.items():
              count = html.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              html = html.replace(old, new)
          html_path.write_text(html)

          contract_path = Path('.github/ai-router/projects/compass/route-display-contract.v1.json')
          contract = json.loads(contract_path.read_text())
          freeze = contract['frozenConstructionContext']
          required = [
              'PRIMARY_OBJECT_DOMINANCE',
              'STATE_LED_PAGE_ARCHITECTURE',
              'PROGRESSIVE_DISCLOSURE_NOT_VERTICAL_DUMP',
              'NESTED_READER_LENSES',
              'PERSISTENT_ORIENTATION_FEEDBACK',
              'TRUE_MOBILE_TABLET_COMPOSITION',
              'EDITORIAL_TYPOGRAPHIC_HIERARCHY',
              'SEMANTIC_COLOR_STATES',
              'NARRATIVE_TRANSFORMATION_SPINE',
              'CLAIM_AND_AUTHORITY_SEPARATION',
              'LOCAL_COMPASS_IDENTITY',
              'VISUAL_DIFFERENTIAL_REQUIRED',
          ]
          evidence = {
              'PRIMARY_OBJECT_DOMINANCE': 'assets/compass/compass.css: Compass scene and state panel are the primary interaction sequence after the preserved introduction and short action bridge.',
              'STATE_LED_PAGE_ARCHITECTURE': 'assets/compass/compass.cosmos.js: GLOBAL -> CARDINAL -> CLUSTER -> ROOM -> ENTER context model follows existing controller state without taking authority.',
              'PROGRESSIVE_DISCLOSURE_NOT_VERTICAL_DUMP': 'assets/compass/compass.cosmos.js: Practical Mathematical Context, Supporting Entry Points, and Recognition-through-Built-Different discovery stack are removed from rendered composition; mathematics remains curated.',
              'NESTED_READER_LENSES': 'index.html + existing formula lens runtime: retained only inside curated mathematical artifacts; deeper authority routes outward.',
              'PERSISTENT_ORIENTATION_FEEDBACK': 'assets/compass/compass.css + compass.cosmos.js: data-compass-context-cardinal drives selected semantic color while peers recede.',
              'TRUE_MOBILE_TABLET_COMPOSITION': 'assets/compass/compass.css: 820px and 560px layouts recompose signature controls, state actions, Mirrorland choices, typography and scene proportions.',
              'EDITORIAL_TYPOGRAPHIC_HIERARCHY': 'assets/compass/compass.css: Georgia/Times display hierarchy plus exact Elara-derived Georgia italic editorial accent treatment.',
              'SEMANTIC_COLOR_STATES': 'assets/compass/compass.css: North gold, East cyan, South green, West orange, Mirrorland violet state variables drive feature and selected cardinal emphasis.',
              'NARRATIVE_TRANSFORMATION_SPINE': 'assets/compass/compass.cosmos.js: preserved introduction -> premise-to-action bridge -> interactive orientation -> selected path -> curated mathematics.',
              'CLAIM_AND_AUTHORITY_SEPARATION': 'assets/compass/compass.cosmos.js: presentation observes controller/root state and explicitly owns no navigation/controller/world authority; deep claims removed from Compass.',
              'LOCAL_COMPASS_IDENTITY': 'assets/compass/compass.css: cartographic constellation remains the visual center; borrowed estate constructs are translated into Compass-specific rotation/state language.',
              'VISUAL_DIFFERENTIAL_REQUIRED': 'Candidate materially changes hierarchy, page length, background, introduction composition, interaction instruction, state response, Mirrorland threshold, and mathematical compression; human screenshot acceptance remains mandatory before merge.',
          }
          freeze['implementationAdoptionStatus'] = 'COMPLETE'
          freeze['adoptionEvidence'] = [{'id': item, 'evidence': evidence[item]} for item in required]

          plan = contract['constructionExecutionPlan']
          plan['implementationStatus'] = 'CANDIDATE_CONSTRUCTED_AWAITING_HUMAN_VISUAL_ACCEPTANCE'
          plan['humanVisualAcceptanceStatus'] = 'PENDING'
          plan['candidateImplementationPaths'] = [
              'index.html',
              'assets/compass/compass.css',
              'assets/compass/compass.cosmos.js',
              '.github/ai-router/projects/compass/route-display-contract.v1.json',
          ]
          contract_path.write_text(json.dumps(contract, indent=2) + '\n')
          PY

          git diff --check
          test "$(grep -c 'compass-plan-reconstruction-v4' index.html)" -eq 2
          git rm .github/workflows/compass-v4-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/ai-router/projects/compass/route-display-contract.v1.json
          git commit -m 'Materialize Compass v4 plan binding and cache identity'
          git push origin HEAD:agent/compass-reconstruction-v4
