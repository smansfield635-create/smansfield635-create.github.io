name: Laws Destination Stage Browser Proof

on:
  pull_request:
    paths:
      - 'laws/index.mobile-background-tabs.js'
      - 'laws/index.destination-carousel.js'
      - 'laws/index.destination-carousel.css'
      - 'laws/index.destination-stage.js'
      - 'laws/index.destination-stage.css'
      - 'laws/index.stellar-continuity.css'
      - '.github/workflows/laws-carousel-browser-render-proof.yml'
  workflow_dispatch:
permissions: { contents: read }

jobs:
  browser-proof:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with: { ref: '${{ github.event.pull_request.head.sha || github.sha }}', fetch-depth: 1 }
      - name: Verify JavaScript syntax
        run: |
          node --check laws/index.destination-carousel.js
          node --check laws/index.destination-stage.js
          node --check laws/index.mobile-background-tabs.js
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve exact candidate
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/laws-stage-http.log 2>&1 &
      - name: Prove separate visible stage and shared-ring carousel
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1024,height:1366},deviceScaleFactor:1});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/laws/',{waitUntil:'networkidle'});
            await page.waitForSelector('html[data-laws-destination-carousel-runtime="active"]',{timeout:15000});
            await page.waitForSelector('html[data-laws-destination-stage="active"]',{timeout:15000});
            const identity=await page.evaluate(()=>({contract:document.documentElement.dataset.lawsCarouselContract,reference:document.documentElement.dataset.lawsCarouselReference,build:document.documentElement.dataset.lawsCarouselBuild}));
            if(identity.contract!=='LAWS_DESTINATION_CAROUSEL_RUNTIME_v9_METHODS_REFERENCE_PORT'||identity.reference!=='METHODS_MODELS_SINGLE_AXIS_EUCLIDEAN_CAROUSEL_v1'||identity.build!=='20260816B')throw Error('runtime identity mismatch '+JSON.stringify(identity));
            const hero=page.locator('[data-laws-experience-stage="hero"]');
            const stage=page.locator('[data-laws-root-rolodex-section][data-laws-destination-stage="active"]');
            const heroBox=await hero.boundingBox(),stageBox=await stage.boundingBox();
            if(!heroBox||!stageBox)throw Error('hero or destination stage has no rendered box');
            if(stageBox.y<=heroBox.y+heroBox.height+20)throw Error('destination carousel is not a separate stage below Compass');
            const tabs=stage.locator('.laws-destination-stage__tab'); if(await tabs.count()!==3)throw Error('exactly three family tabs required');
            if(await stage.locator('.laws-destination-stage__tab[aria-selected="true"]').count()!==1)throw Error('ambiguous family selection');
            const field=stage.locator('.laws-rolodex-field[data-destination-stage-state="active"]').first();
            const cards=field.locator('.laws-rolodex-card'),viewport=field.locator('.laws-rolodex-viewport'),track=field.locator('.laws-rolodex-track');
            if(await cards.count()<3)throw Error('active family lacks records');
            if(await field.locator('.laws-rolodex-control').count()!==0)throw Error('surrogate controls present');
            const active=field.locator('.laws-rolodex-card[data-active="true"]'); if(await active.count()!==1)throw Error('exactly one active card required');
            const before=await active.getAttribute('data-destination-id');
            const initialTrack=await track.evaluate(n=>getComputedStyle(n).transform);
            await viewport.focus(); await page.keyboard.press('ArrowRight');
            await page.waitForFunction(before=>{const f=document.querySelector('.laws-rolodex-field[data-destination-stage-state="active"]');const a=f?.querySelector('.laws-rolodex-card[data-active="true"]');return !!a&&a.getAttribute('data-destination-id')!==before&&f.dataset.carouselSettling==='false'&&f.dataset.carouselCanonicalLanding==='true';},before,{timeout:3000});
            const activeAfter=field.locator('.laws-rolodex-card[data-active="true"]'); const after=await activeAfter.getAttribute('data-destination-id'); if(!after||after===before)throw Error('keyboard selection did not advance');
            const activeBox=await activeAfter.boundingBox(),viewportBox=await viewport.boundingBox(); if(!activeBox||!viewportBox)throw Error('missing rendered geometry');
            const centerError=Math.abs((activeBox.x+activeBox.width/2)-(viewportBox.x+viewportBox.width/2)); if(centerError>24)throw Error(`active card lacks center custody: ${centerError}`);
            const finalTrack=await track.evaluate(n=>getComputedStyle(n).transform); if(finalTrack===initialTrack)throw Error('shared ring transform did not rotate');
            await tabs.nth(0).click(); await page.waitForTimeout(250);
            const familyAfter=await stage.getAttribute('data-destination-family'),activeFieldAfter=await stage.locator('.laws-rolodex-field[data-destination-stage-state="active"]').getAttribute('data-rolodex-id'); if(!familyAfter||familyAfter!==activeFieldAfter)throw Error('family tab did not move stage custody');
            if(errors.length)throw Error('page errors '+errors.join(' | '));
            await stage.scrollIntoViewIfNeeded(); await stage.screenshot({path:'laws-destination-stage-render-proof.png'});
            console.log(JSON.stringify({identity,heroBox,stageBox,before,after,centerError,familyAfter},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload rendered proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laws-destination-stage-render-proof
          path: laws-destination-stage-render-proof.png
          if-no-files-found: warn
