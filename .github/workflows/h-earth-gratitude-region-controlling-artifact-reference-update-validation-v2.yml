name: H-Earth Gratitude Region Controlling-Artifact Reference Update Validation v2

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/h-earth-gratitude-region-controlling-artifact-reference-update-validation-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-reference-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact durable candidate
        uses: actions/checkout@v4
        with:
          ref: 5218a8f658b2cc342dfd02bb8517701fcab61d73
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact three-path candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE=d30bb105762b4205df90c3450de6c13076ef072e
          CANDIDATE=5218a8f658b2cc342dfd02bb8517701fcab61d73
          AMENDMENT=h-earth-3d/control-plane/region-001-reconciliation/h-earth.region-001.gratitude-region-coordinate-reconciliation.active-main-reference-amendment.v1.json
          OVERLAY=h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.gratitude-region-controlling-artifact-reference-update.js
          LOADER=h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git merge-base "$BASE" "$CANDIDATE")" = "$BASE"
          mapfile -t paths < <(git diff --name-only "$BASE"..."$CANDIDATE")
          test "${#paths[@]}" -eq 3
          test "$(printf '%s\n' "${paths[@]}" | sort)" = "$(printf '%s\n' "$AMENDMENT" "$OVERLAY" "$LOADER" | sort)"
          test "$(git hash-object "$AMENDMENT")" = "7ef817685ce12a3a93fdf0a03391ac52c2df2664"
          test "$(git hash-object "$OVERLAY")" = "0f3463e99eb735c2964ec933a5bcadf53c77ad2a"
          test "$(git hash-object "$LOADER")" = "dd0e6ae7042f102e8a3c66bcbede4bff20f358b5"
          test "$(git hash-object h-earth-3d/control-plane/region-001-reconciliation/h-earth.region-001.gratitude-region-spatial-interaction-area-development.v1.json)" = "ee5ca94f5ae55ce8f11b460428b800ad4e9a2a9d"
          test "$(git hash-object h-earth-3d/control-plane/region-001-reconciliation/h-earth.region-001.mirrorland-narrative-character-temporal-reconciliation.manifest.v1.json)" = "1702d62036a6b241fdadddfabc304a5288f38652"
          test "$(git rev-parse d30bb105762b4205df90c3450de6c13076ef072e^1)" = "8ed5faaffb3ce62190e5268a2538b3d4c6e4ea2f"
          test "$(git rev-parse d30bb105762b4205df90c3450de6c13076ef072e^2)" = "a0cadd1e5ce70d98c34f11ddacb063c91816bd93"
          if printf '%s\n' "${paths[@]}" | grep -E '^(showroom/|products/|h-earth-3d/(terrain|environment|objects|integration|render|runtime|geometry)/)' ; then
            echo 'Product path entered candidate scope' >&2
            exit 1
          fi

      - name: Execute all analytical regressions
        shell: bash
        run: |
          set -euo pipefail
          H_EARTH_GR_CR_RECEIPT=/tmp/h-earth-gr-cr-receipt.json \
            node h-earth-3d/validation/h-earth.gratitude-region.coordinate-reconciliation.harness.mjs \
            > /tmp/h-earth-gr-cr.log
          H_EARTH_GR_CR_ENTRY_RECEIPT=/tmp/h-earth-gr-cr-entry-receipt.json \
            node h-earth-3d/validation/h-earth.gratitude-region.entry-zone-reconciliation.runner.mjs \
            > /tmp/h-earth-gr-cr-entry.log
          H_EARTH_GR_CR_MANOR_RECEIPT=/tmp/h-earth-gr-cr-manor-receipt.json \
            node h-earth-3d/validation/h-earth.gratitude-region.mirror-manor-reconciliation.runner.mjs \
            > /tmp/h-earth-gr-cr-manor.log
          H_EARTH_GR_CR_CAVERN_RECEIPT=/tmp/h-earth-gr-cr-cavern-receipt.json \
            node h-earth-3d/validation/h-earth.gratitude-region.cavern-precinct-reconciliation.runner.mjs \
            > /tmp/h-earth-gr-cr-cavern.log
          H_EARTH_GR_FRONTIER_PLAINS_RECEIPT=/tmp/h-earth-gr-frontier-plains-receipt.json \
            node h-earth-3d/validation/h-earth.gratitude-region.frontier-plains-capacity-relationship-reconciliation.runner.mjs \
            > /tmp/h-earth-gr-frontier-plains.log

      - name: Execute exact embedded regional closure audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/h-earth-gratitude-region-coordinate-reconciliation.yml')
          lines = source.read_text().splitlines()
          marker = "node --input-type=module <<'NODE' 2>&1 | tee /tmp/h-earth-gratitude-region-candidate-set-closure.log"
          try:
              start = next(index for index, line in enumerate(lines) if marker in line) + 1
              end = next(index for index in range(start, len(lines)) if lines[index].strip() == 'NODE')
          except StopIteration as error:
              raise SystemExit('REGIONAL_CLOSURE_SCRIPT_BOUNDARY_NOT_FOUND') from error
          body = textwrap.dedent('\n'.join(lines[start:end])) + '\n'
          Path('/tmp/h-earth-gratitude-region-candidate-set-closure.mjs').write_text(body)
          PY
          H_EARTH_GR_REGIONAL_CLOSURE_RECEIPT=/tmp/h-earth-gratitude-region-candidate-set-closure.json \
            node /tmp/h-earth-gratitude-region-candidate-set-closure.mjs \
            > /tmp/h-earth-gratitude-region-candidate-set-closure.log

      - name: Execute registry and authority verification twice
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import loadDependencies from './h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js';
          import registryFacade, {
            H_EARTH_GRATITUDE_REGION_CONTROLLING_ARTIFACT_REFERENCE_UPDATE_SCOPE_NODE
          } from './h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.gratitude-region-controlling-artifact-reference-update.js';
          import { runAutomaticHEarthPreflight } from './h-earth-3d/registry/activation/h-earth.repository-registry.auto-preflight.js';

          const BASE = 'd30bb105762b4205df90c3450de6c13076ef072e';
          const CANDIDATE = '5218a8f658b2cc342dfd02bb8517701fcab61d73';
          const PACKAGE_HEAD = 'a0cadd1e5ce70d98c34f11ddacb063c91816bd93';
          const PACKAGE_MERGE = 'd30bb105762b4205df90c3450de6c13076ef072e';
          const AMENDMENT_PATH = '/h-earth-3d/control-plane/region-001-reconciliation/h-earth.region-001.gratitude-region-coordinate-reconciliation.active-main-reference-amendment.v1.json';
          const AMENDMENT_BLOB = '7ef817685ce12a3a93fdf0a03391ac52c2df2664';
          const OVERLAY_PATH = '/h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.gratitude-region-controlling-artifact-reference-update.js';
          const OVERLAY_BLOB = '0f3463e99eb735c2964ec933a5bcadf53c77ad2a';
          const LOADER_PATH = '/h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js';
          const LOADER_BLOB = 'dd0e6ae7042f102e8a3c66bcbede4bff20f358b5';
          const SPATIAL_PATH = '/h-earth-3d/control-plane/region-001-reconciliation/h-earth.region-001.gratitude-region-spatial-interaction-area-development.v1.json';
          const SPATIAL_BLOB = 'ee5ca94f5ae55ce8f11b460428b800ad4e9a2a9d';
          const MANIFEST_PATH = '/h-earth-3d/control-plane/region-001-reconciliation/h-earth.region-001.mirrorland-narrative-character-temporal-reconciliation.manifest.v1.json';
          const MANIFEST_BLOB = '1702d62036a6b241fdadddfabc304a5288f38652';
          const NODE_ID = H_EARTH_GRATITUDE_REGION_CONTROLLING_ARTIFACT_REFERENCE_UPDATE_SCOPE_NODE.nodeId;
          const changedPaths = [AMENDMENT_PATH, OVERLAY_PATH, LOADER_PATH];

          const stable = (value) => value === null || typeof value !== 'object'
            ? JSON.stringify(value)
            : Array.isArray(value)
              ? `[${value.map(stable).join(',')}]`
              : `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${stable(value[key])}`).join(',')}}`;
          const digest = (value) => crypto.createHash('sha256').update(stable(value)).digest('hex');
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const blobAt = (commit, repositoryPath) => {
            const line = git('ls-tree', commit, '--', repositoryPath.replace(/^\//, ''));
            return line.match(/^\d+\s+blob\s+([0-9a-f]{40})\t/)?.[1] ?? null;
          };
          const readJson = (repositoryPath) => JSON.parse(fs.readFileSync(repositoryPath.replace(/^\//, ''), 'utf8'));

          function execute() {
            const issues = [];
            const amendment = readJson(AMENDMENT_PATH);
            const dependencies = loadDependencies();
            const node = registryFacade.getHEarthRepositoryRegistryNode(NODE_ID);
            const packageOccurrences = node.repositoryOccurrences.filter((occurrence) => occurrence.commitSha === PACKAGE_HEAD);
            const exactPackageBlobMatches = packageOccurrences.length === 16
              && packageOccurrences.every((occurrence) => blobAt(PACKAGE_MERGE, occurrence.path) === occurrence.gitBlobSha);

            if (git('rev-parse', 'HEAD') !== CANDIDATE) issues.push('CANDIDATE_HEAD_MISMATCH');
            if (blobAt(CANDIDATE, AMENDMENT_PATH) !== AMENDMENT_BLOB) issues.push('AMENDMENT_BLOB_MISMATCH');
            if (blobAt(CANDIDATE, OVERLAY_PATH) !== OVERLAY_BLOB) issues.push('OVERLAY_BLOB_MISMATCH');
            if (blobAt(CANDIDATE, LOADER_PATH) !== LOADER_BLOB) issues.push('LOADER_BLOB_MISMATCH');
            if (blobAt(CANDIDATE, SPATIAL_PATH) !== SPATIAL_BLOB) issues.push('SPATIAL_V1_BLOB_CHANGED');
            if (blobAt(CANDIDATE, MANIFEST_PATH) !== MANIFEST_BLOB) issues.push('MANIFEST_V1_BLOB_CHANGED');
            if (!exactPackageBlobMatches) issues.push('ACTIVE_MAIN_PACKAGE_BLOB_MISMATCH');
            if (dependencies.identityVerified !== true) issues.push('LOADER_IDENTITY_NOT_VERIFIED');
            if (dependencies.registryFacade !== registryFacade) issues.push('LOADER_NOT_USING_REFERENCE_UPDATE_FACADE');

            if (amendment.activeMainPackageReference.activeMainMergeCommit !== PACKAGE_MERGE) issues.push('AMENDMENT_MERGE_REFERENCE_MISMATCH');
            if (amendment.activeMainPackageReference.activePackagePathCount !== 16) issues.push('AMENDMENT_PATH_COUNT_MISMATCH');
            if (amendment.registryCustody.activeRegistryResolution !== 'PASS_CLOSED') issues.push('AMENDMENT_REGISTRY_STATUS_MISMATCH');
            if (amendment.postMergeExecutionCustody.status !== 'PASS_CLOSED') issues.push('AMENDMENT_POST_MERGE_STATUS_MISMATCH');
            if (amendment.postMergeExecutionCustody.deterministicRepeatExecution !== true) issues.push('AMENDMENT_POST_MERGE_NOT_DETERMINISTIC');
            if (amendment.authorityBoundary.referenceUpdateActiveOnMain !== false) issues.push('REFERENCE_UPDATE_PREMATURELY_ACTIVE');
            for (const key of ['mergeAuthorityCreated','candidateAcceptance','finalCoordinatesAssigned','canonicalization','terrainMutation','geometryConstruction','runtimeMutation','gameplayMutation','publicRouteMutation','livePageChange','productConstruction']) {
              if (amendment.authorityBoundary[key] !== false) issues.push(`AUTHORITY_BOUNDARY_OVERREACH:${key}`);
            }

            for (const repositoryPath of changedPaths) {
              const resolution = registryFacade.resolveHEarthRepositoryRegistryPath(repositoryPath);
              if (resolution.resolved !== true || resolution.unresolved !== false) issues.push(`PATH_UNRESOLVED:${repositoryPath}`);
              if (!resolution.nodes.some((candidateNode) => candidateNode.nodeId === NODE_ID)) issues.push(`NODE_NOT_RESOLVED:${repositoryPath}`);
            }
            const occurrence = registryFacade.resolveHEarthRepositoryRegistryOccurrence({
              path: AMENDMENT_PATH,
              refName: 'agent/h-earth-gratitude-region-controlling-artifact-reference-update-001',
              gitBlobSha: AMENDMENT_BLOB
            });
            if (occurrence.resolved !== true || occurrence.matches.length !== 1) issues.push('AMENDMENT_OCCURRENCE_NOT_EXACTLY_RESOLVED');

            const preflight = runAutomaticHEarthPreflight({
              paths: changedPaths,
              taskText: 'Validate Gratitude Region controlling-artifact active-main reference update candidate only',
              mutationIntent: false
            });
            const failureCodes = preflight.validatorReceipt?.failureCodes ?? [];
            const resolvedPaths = preflight.validatorReceipt?.resolvedPaths ?? [];
            const affectedNodeIds = preflight.scopePreview?.affectedNodeIds ?? [];
            if (preflight.finalDisposition !== 'PASS') issues.push(`PREFLIGHT_${preflight.finalDisposition}`);
            if (preflight.continuation !== 'READ_ONLY_CONTINUATION_PERMITTED') issues.push(`CONTINUATION_${preflight.continuation}`);
            if (failureCodes.length !== 0) issues.push(`FAILURE_CODES:${failureCodes.join(',')}`);
            if (resolvedPaths.length !== 3) issues.push(`RESOLVED_PATHS_${resolvedPaths.length}_NOT_3`);
            if (!affectedNodeIds.includes(NODE_ID)) issues.push('REFERENCE_UPDATE_NODE_NOT_IN_SCOPE');

            if (node.authorityClass !== 'NO_AUTHORITY') issues.push('AUTHORITY_CLASS_OVERREACH');
            if (node.allowedMutationScope !== 'READ_ONLY_INSPECTION') issues.push('MUTATION_SCOPE_OVERREACH');
            if (node.lifecycleStatus !== 'CANDIDATE') issues.push('LIFECYCLE_PROMOTION');
            if (stable(node.unresolvedFields) !== stable(['SEPARATE_FINAL_PLACEMENT_DISPOSITION'])) issues.push('UNRESOLVED_FIELDS_MISMATCH');
            for (const limitation of ['NO_SPATIAL_CANDIDATE_ACCEPTANCE','NO_FINAL_COORDINATES_OR_ANCHORS','NO_CANONICALIZATION','NO_PRODUCT_CONSTRUCTION','NO_LIVE_PAGE_CHANGE']) {
              if (!node.authorityLimitations.includes(limitation)) issues.push(`LIMITATION_MISSING:${limitation}`);
            }

            const receiptPaths = [
              '/tmp/h-earth-gr-cr-receipt.json',
              '/tmp/h-earth-gr-cr-entry-receipt.json',
              '/tmp/h-earth-gr-cr-manor-receipt.json',
              '/tmp/h-earth-gr-cr-cavern-receipt.json',
              '/tmp/h-earth-gr-frontier-plains-receipt.json'
            ];
            const regressions = receiptPaths.map((path) => JSON.parse(fs.readFileSync(path, 'utf8')));
            if (!regressions.every((receipt) => receipt.eligible === true && receipt.deterministicRepeatExecution === true && receipt.firstExecutionDigest === receipt.secondExecutionDigest)) issues.push('ANALYTICAL_REGRESSION_FAILURE');
            if (!regressions.every((receipt) => ['PASS_CLOSED','EXECUTION_PASS_PENDING_DURABLE_CLOSURE'].includes(receipt.sectionStatus))) issues.push('ANALYTICAL_SECTION_STATUS_FAILURE');
            if (!regressions.every((receipt) => ['terrainMutation','geometryConstruction','runtimeMutation','gameplayMutation','publicRouteMutation','productionMutation','controllingManifestMutation'].every((key) => receipt[key] === false))) issues.push('ANALYTICAL_MUTATION_OVERREACH');

            const closure = JSON.parse(fs.readFileSync('/tmp/h-earth-gratitude-region-candidate-set-closure.json', 'utf8'));
            if (closure.status !== 'REGIONAL_CANDIDATE_SET_COMPLETENESS_AND_CLOSURE_AUDIT_PASS_CLOSED') issues.push('REGIONAL_CLOSURE_NOT_PASS_CLOSED');
            if (closure.deterministicClosureExecution !== true) issues.push('REGIONAL_CLOSURE_NONDETERMINISTIC');

            const base = {
              schemaVersion: 'H_EARTH_GRATITUDE_REGION_CONTROLLING_ARTIFACT_REFERENCE_UPDATE_VALIDATION_RECEIPT_v1',
              baseMainHead: BASE,
              candidateHead: CANDIDATE,
              candidateChangedPathCount: 3,
              candidateChangedPaths: changedPaths,
              referenceAmendmentBlob: AMENDMENT_BLOB,
              registryOverlayBlob: OVERLAY_BLOB,
              correctedLoaderBlob: LOADER_BLOB,
              spatialV1BlobPreserved: blobAt(CANDIDATE, SPATIAL_PATH) === SPATIAL_BLOB,
              manifestV1BlobPreserved: blobAt(CANDIDATE, MANIFEST_PATH) === MANIFEST_BLOB,
              activeMainPackageMergeCommit: PACKAGE_MERGE,
              activePackagePathCount: packageOccurrences.length,
              exactActivePackageBlobMatches,
              priorAnalyticalRegressions: regressions.every((receipt) => receipt.eligible === true) ? 'PASS' : 'FAIL',
              regionalClosureAudit: closure.status,
              registryPreflight: preflight.finalDisposition,
              registryPreflightResolvedPathCount: resolvedPaths.length,
              registryPreflightFailureCodes: failureCodes,
              amendmentOccurrenceResolvedExactlyOnce: occurrence.resolved === true && occurrence.matches.length === 1,
              unresolvedFields: node.unresolvedFields,
              referenceUpdateActiveOnMain: false,
              mergeAuthorityCreated: false,
              candidateAcceptance: false,
              finalCoordinatesAssigned: false,
              canonicalization: false,
              terrainMutation: false,
              geometryConstruction: false,
              runtimeMutation: false,
              livePageChange: false,
              productConstruction: false,
              stoppingBoundary: 'STOP_BEFORE_REFERENCE_UPDATE_CANDIDATE_MERGE_OR_FINAL_CANDIDATE_PLACEMENT_DISPOSITION',
              issues
            };
            return { ...base, receiptDigest: digest(base), status: issues.length === 0 ? 'PASS_CLOSED' : 'FAIL_STOPPED' };
          }

          const first = execute();
          const second = execute();
          const deterministic = first.receiptDigest === second.receiptDigest;
          fs.writeFileSync('/tmp/h-earth-gratitude-region-reference-update.first.json', `${JSON.stringify(first, null, 2)}\n`);
          fs.writeFileSync('/tmp/h-earth-gratitude-region-reference-update.second.json', `${JSON.stringify(second, null, 2)}\n`);
          const custody = {
            schemaVersion: 'H_EARTH_GRATITUDE_REGION_CONTROLLING_ARTIFACT_REFERENCE_UPDATE_VALIDATION_CUSTODY_v1',
            status: deterministic && first.status === 'PASS_CLOSED' && second.status === 'PASS_CLOSED' ? 'PASS_CLOSED' : 'FAIL_STOPPED',
            baseMainHead: first.baseMainHead,
            candidateHead: first.candidateHead,
            candidateChangedPathCount: first.candidateChangedPathCount,
            referenceAmendmentBlob: first.referenceAmendmentBlob,
            registryOverlayBlob: first.registryOverlayBlob,
            correctedLoaderBlob: first.correctedLoaderBlob,
            activeMainPackageMergeCommit: first.activeMainPackageMergeCommit,
            activePackagePathCount: first.activePackagePathCount,
            exactActivePackageBlobMatches: first.exactActivePackageBlobMatches,
            firstExecutionDigest: first.receiptDigest,
            secondExecutionDigest: second.receiptDigest,
            deterministicRepeatExecution: deterministic,
            priorAnalyticalRegressions: first.priorAnalyticalRegressions,
            regionalClosureAudit: first.regionalClosureAudit,
            registryPreflight: first.registryPreflight,
            registryPreflightResolvedPathCount: first.registryPreflightResolvedPathCount,
            registryPreflightFailureCodes: first.registryPreflightFailureCodes,
            unresolvedFields: first.unresolvedFields,
            referenceUpdateActiveOnMain: false,
            mergeAuthorityCreated: false,
            candidateAcceptance: false,
            finalCoordinatesAssigned: false,
            canonicalization: false,
            terrainMutation: false,
            geometryConstruction: false,
            runtimeMutation: false,
            livePageChange: false,
            productConstruction: false,
            stoppingBoundary: first.stoppingBoundary
          };
          fs.writeFileSync('/tmp/h-earth-gratitude-region-reference-update.custody.json', `${JSON.stringify(custody, null, 2)}\n`);
          console.log(JSON.stringify(custody, null, 2));
          if (custody.status !== 'PASS_CLOSED') process.exitCode = 1;
          NODE

      - name: Upload reference-update evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-gratitude-region-controlling-artifact-reference-update-evidence-v2
          path: |
            /tmp/h-earth-gr-cr.log
            /tmp/h-earth-gr-cr-receipt.json
            /tmp/h-earth-gr-cr-entry.log
            /tmp/h-earth-gr-cr-entry-receipt.json
            /tmp/h-earth-gr-cr-manor.log
            /tmp/h-earth-gr-cr-manor-receipt.json
            /tmp/h-earth-gr-cr-cavern.log
            /tmp/h-earth-gr-cr-cavern-receipt.json
            /tmp/h-earth-gr-frontier-plains.log
            /tmp/h-earth-gr-frontier-plains-receipt.json
            /tmp/h-earth-gratitude-region-candidate-set-closure.log
            /tmp/h-earth-gratitude-region-candidate-set-closure.json
            /tmp/h-earth-gratitude-region-reference-update.first.json
            /tmp/h-earth-gratitude-region-reference-update.second.json
            /tmp/h-earth-gratitude-region-reference-update.custody.json
          if-no-files-found: warn
          retention-days: 30
