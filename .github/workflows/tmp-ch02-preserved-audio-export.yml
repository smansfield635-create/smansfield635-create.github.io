name: Temporary Chapter 02 preserved audio export
on:
  push:
    branches:
      - tmp/ch02-preserved-audio-export-20260913
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage preserved Chapter 02 carriers
        run: |
          mkdir -p out
          cp showroom/globe/h-earth/awards/media/diamond-gate-h-earth-audralia-30s-vivaldi.mp4 out/approved-30s-vivaldi-carrier.mp4
          cp showroom/globe/h-earth/awards/media/diamond-gate-h-earth-awards-18s-vivaldi.mp4 out/predecessor-18s-vivaldi-carrier.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: preserved-chapter02-approved-audio-predecessors
          path: out/
          if-no-files-found: error
