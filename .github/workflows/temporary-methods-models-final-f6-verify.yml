name: Temporary Final Program F6 Depth And Inquiry Verify

on:
  push:
    branches:
      - construction/methods-models-integrated-environment-v1

permissions:
  contents: read

jobs:
  verify-f6-depth-and-inquiry:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify F6 depth and inquiry fail-closed
        shell: bash
        run: |
          set -euo pipefail
          node control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/f6-depth-and-inquiry/verify.v1.mjs | tee /tmp/f6-verification.log

      - name: Require terminal F6 contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'PASS_F6_DEPTH_AND_INQUIRY_v1' /tmp/f6-verification.log

      - name: Preserve F6 verification log
        uses: actions/upload-artifact@v4
        with:
          name: methods-models-final-program-f6-depth-and-inquiry-verification
          path: /tmp/f6-verification.log
          if-no-files-found: error
          retention-days: 90
