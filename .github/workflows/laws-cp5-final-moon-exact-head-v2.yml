name: Laws CP5 Final Moon Exact Head V2

on:
  pull_request:
    branches:
      - verification/laws-cp5-final-moon-exact-head-003
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: laws-cp5-final-moon-exact-head-v2
  cancel-in-progress: false

jobs:
  verify-direction-scoped-candidate:
    if: github.head_ref == 'trigger/laws-cp5-final-moon-exact-head-003'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@v4
        with:
          ref: 1651479e205c62cd4eccdc20515a096f054c3d7f
          fetch-depth: 0

      - name: Verify exact static custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1651479e205c62cd4eccdc20515a096f054c3d7f"
          test "$(git hash-object laws/index.crystals.js)" = "27577c49250f42b03d123f8105e1d55d59c3a4b4"
          test "$(git diff --name-only f104294243eec62b38496f0736a8f73a93d44723 HEAD)" = "laws/index.crystals.js"
          node --check laws/index.crystals.js
          git diff --check f104294243eec62b38496f0736a8f73a93d44723 HEAD
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          base='f104294243eec62b38496f0736a8f73a93d44723'
          before=subprocess.check_output(['git','show',f'{base}:laws/index.crystals.js'],text=True)
          after=Path('laws/index.crystals.js').read_text()
          def span(text,a,b,start=0):
              i=text.index(a,start); j=text.index(b,i); return text[i:j]
          def solar(text):
              i=text.index('    function surfaceSample')
              j=text.index('      if (mode === "solar") {',i)
              k=text.index('\n      } else {',j)
              return text[j:k]
          selectors={
            'vertex':lambda t:span(t,'  const vertexShaderSource = `','  const fragmentShaderSource = `'),
            'fragment':lambda t:span(t,'  const fragmentShaderSource = `','  function invariant('),
            'solarActivity':lambda t:span(t,'    /* CP5_FINAL_SOLAR_OPEN_BRANCHING_BASE */','    function mixColor'),
            'solarSurface':solar,
            'solarRotation':lambda t:span(t,'        /* CP5_FINAL_SOLAR_NO_LOCAL_RIGID_SPIN */','  function nodeFloatY')
          }
          hashes={}
          for name,selector in selectors.items():
              a=hashlib.sha256(selector(before).encode()).hexdigest()
              b=hashlib.sha256(selector(after).encode()).hexdigest()
              if a!=b: raise SystemExit(f'SUN_SOURCE_CHANGED:{name}')
              hashes[name]=b
          solar_material='Object.freeze({specular:0.03,rim:0.10,emissive:0.22,alpha:1.00,sparkle:0.00,halo:0.78,contrast:1.94})'
          if before.count(solar_material)!=1 or after.count(solar_material)!=1:
              raise SystemExit('SUN_MATERIAL_CHANGED')
          for marker in ('gatewayBodyScale:\n    0.7666667','horizontalRadius:\n        1.68','verticalRadius:\n        1.5008','depthRadius:\n        1.2992'):
              if marker not in after: raise SystemExit(f'LOCKED_CONSTANT_MISSING:{marker}')
          if before.count('requestAnimationFrame')!=after.count('requestAnimationFrame'):
              raise SystemExit('NEW_RENDER_LOOP_DETECTED')
          Path('laws-cp5-final-moon-static-v2.json').write_text(json.dumps({
            'candidateHead':'1651479e205c62cd4eccdc20515a096f054c3d7f',
            'crystalBlob':'27577c49250f42b03d123f8105e1d55d59c3a4b4',
            'changedPaths':['laws/index.crystals.js'],
            'sunZeroDifferential':True,
            'sunSourceHashes':hashes,
            'newRenderLoop':False
          },indent=2)+'\n')
          PY

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Install browser dependency
        run: npm install --no-save --no-package-lock puppeteer-core@24.15.0

      - name: Start exact-head runtime
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/laws-cp5-final-moon-v2-server.log 2>&1 &
          for attempt in $(seq 1 25); do
            curl -fsS http://127.0.0.1:4173/laws/ >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Run four-profile direction-scoped verification
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          cat > /tmp/laws-cp5-final-moon-v2.mjs <<'JS'
          import fs from 'node:fs';
          import puppeteer from 'puppeteer-core';
          const profiles=[
            {id:'SAMSUNG_PHONE_PORTRAIT',width:430,height:932,mobile:true,touch:true},
            {id:'PHONE_LANDSCAPE',width:932,height:430,mobile:true,touch:true},
            {id:'TABLET',width:1024,height:1366,mobile:true,touch:true},
            {id:'DESKTOP',width:1440,height:1000,mobile:false,touch:false}
          ];
          const ids=['flow','integrity','reality','structure','test','research'];
          const h=Math.SQRT1_2;
          const q={flow:[0,0,0,1],integrity:[0,0,h,h],reality:[0,0,1,0],structure:[0,0,-h,h],test:[-0.43283662594337136,0,0,0.9014723818520222],research:[0.9014723818520223,0,0,0.4328366259433712]};
          const failures=[], observations=[];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const check=(ok,profile,id,observed=null)=>{if(!ok) failures.push({profile,id,observed});};
          fs.mkdirSync('laws-cp5-final-moon-v2-evidence',{recursive:true});
          const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:'new',args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          for(const profile of profiles){
            const telemetry={page:[],console:[],requests:[],http:[]};
            const result={profile:profile.id,authorities:[],clusters:[],telemetry};
            let page;
            try{
              page=await browser.newPage();
              await page.setViewport({width:profile.width,height:profile.height,deviceScaleFactor:1,isMobile:profile.mobile,hasTouch:profile.touch});
              page.on('pageerror',e=>telemetry.page.push(String(e?.stack||e)));
              page.on('console',m=>{if(m.type()==='error'&&!m.text().includes('status of 404')) telemetry.console.push(m.text());});
              page.on('requestfailed',r=>{if(!r.url().endsWith('/favicon.ico')) telemetry.requests.push({url:r.url(),error:r.failure()?.errorText||''});});
              page.on('response',r=>{if(r.status()>=400&&!r.url().endsWith('/favicon.ico')) telemetry.http.push({url:r.url(),status:r.status()});});
              const response=await page.goto('http://127.0.0.1:4173/laws/?cp5-moon-v2=1651479e205c62cd4eccdc20515a096f054c3d7f',{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForFunction(()=>globalThis.DGBLawsStagedLoader&&globalThis.DGB_LAWS_CONTROLLER,{timeout:30000});
              await page.evaluate(async()=>{await DGBLawsStagedLoader.loadOrbitSystems();await DGBLawsStagedLoader.loadInteractionSystems();});
              await page.waitForFunction(()=>DGB_LAWS_CRYSTALS_RECEIPT?.rendererInitialized===true&&DGB_LAWS_COMPOSITOR_RECEIPT?.initialized===true&&DGB_LAWS_INTERACTIONS_RECEIPT?.initialized===true,{timeout:45000});
              const initial=await page.evaluate(()=>{
                const visible=e=>{if(!e||e.hidden)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>0.01&&r.width>0&&r.height>0;};
                return {
                  contract:DGB_LAWS_CRYSTALS_RECEIPT?.contractVersion||'',
                  ids:[...document.querySelectorAll('[data-laws-category]')].map(e=>e.dataset.direction).filter(Boolean).sort(),
                  labels:[...document.querySelectorAll('[data-laws-projected-category-label]')].filter(visible).map(e=>e.dataset.direction||''),
                  globe:Boolean(document.querySelector('[data-upstream-compass-mount]')&&document.querySelector('[data-laws-planet-world-pass-participant]')),
                  overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
                };
              });
              result.initial=initial;
              check([200,304].includes(response?.status()),profile.id,'ROUTE_STATUS',response?.status());
              check(initial.contract==='2.3.1-cp5-final-public-moon-definition',profile.id,'CONTRACT',initial.contract);
              check(JSON.stringify(initial.ids)===JSON.stringify([...ids].sort()),profile.id,'AUTHORITY_IDENTITIES',initial.ids);
              check(initial.labels.length===1,profile.id,'OUTER_LABEL_COUNT',initial.labels);
              check(initial.globe,profile.id,'CENTER_GLOBE');
              check(initial.overflow<=1,profile.id,'OVERFLOW',initial.overflow);
              for(const id of ids){
                const primary=await page.evaluate((authorityId,quat)=>{
                  const c=DGB_LAWS_CONTROLLER;
                  const begun=c.beginOrbitGesture()!==false;
                  const preview=begun&&c.requestOrbitPreview({quaternion:quat,primaryId:authorityId})!==false;
                  const committed=preview&&c.requestOrbitCommit()!==false;
                  return {begun,preview,committed};
                },id,q[id]);
                await page.waitForFunction(authorityId=>{const root=document.querySelector('[data-laws-root]'),f=DGB_LAWS_CONTROLLER.getFrameState();return (root?.dataset.lawsSpatialPrimaryId||f?.orbitFocus||'')===authorityId;},{timeout:15000},id);
                check(primary.begun&&primary.preview&&primary.committed,profile.id,'PRIMARY_COMMIT',{id,primary});
                result.authorities.push({id,...primary});
                const accepted=await page.evaluate(authorityId=>DGB_LAWS_CONTROLLER.requestCategorySelection(authorityId),id);
                await page.waitForFunction(authorityId=>{const root=document.querySelector('[data-laws-root]'),f=DGB_LAWS_CONTROLLER.getFrameState();return root?.dataset.lawsControllerState==='CLUSTER_OPEN'&&(root?.dataset.lawsActiveCluster===authorityId||f?.activeClusterDirection===authorityId||f?.cluster?.direction===authorityId);},{timeout:15000},id);
                await sleep(120);
                const cluster=await page.evaluate(authorityId=>{
                  const visible=e=>{if(!e||e.hidden)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>0.01&&r.width>0&&r.height>0;};
                  const controls=[...document.querySelectorAll('[data-route][data-direction]')].filter(e=>!e.hasAttribute('data-laws-category')&&e.dataset.direction===authorityId&&visible(e));
                  const routes=controls.map(e=>e.dataset.route||'').filter(Boolean);
                  return {count:controls.length,routes,uniqueRoutes:[...new Set(routes)]};
                },id);
                result.clusters.push({id,accepted,cluster});
                check(accepted!==false,profile.id,'CLUSTER_OPEN',{id,accepted});
                check(cluster.count===4,profile.id,'CLUSTER_CHILD_COUNT',{id,cluster});
                check(cluster.routes.length===4&&cluster.uniqueRoutes.length===4,profile.id,'CLUSTER_ROUTES',{id,cluster});
                const returned=await page.evaluate(()=>DGB_LAWS_CONTROLLER.requestReturnToConstellation());
                await page.waitForFunction(()=>document.querySelector('[data-laws-root]')?.dataset.lawsControllerState==='CONSTELLATION',{timeout:15000});
                check(returned!==false,profile.id,'RETURN_TO_CONSTELLATION',id);
              }
              await page.screenshot({path:`laws-cp5-final-moon-v2-evidence/${profile.id.toLowerCase()}.png`,fullPage:false});
              check(telemetry.page.length===0,profile.id,'PAGE_ERRORS',telemetry.page);
              check(telemetry.console.length===0,profile.id,'CONSOLE_ERRORS',telemetry.console);
              check(telemetry.requests.length===0,profile.id,'REQUEST_FAILURES',telemetry.requests);
              check(telemetry.http.length===0,profile.id,'HTTP_ERRORS',telemetry.http);
            }catch(error){failures.push({profile:profile.id,id:'UNCAUGHT',observed:String(error?.stack||error)});}
            finally{if(page)await page.close();observations.push(result);}
          }
          await browser.close();
          const receipt={candidateHead:'1651479e205c62cd4eccdc20515a096f054c3d7f',crystalBlob:'27577c49250f42b03d123f8105e1d55d59c3a4b4',profiles:profiles.map(p=>p.id),observations,failures,pass:failures.length===0,sunZeroDifferential:true,labelsPreserved:!failures.some(f=>f.id.includes('LABEL')),interactionPreserved:!failures.some(f=>/PRIMARY|CLUSTER|RETURN/.test(f.id)),routesPreserved:!failures.some(f=>f.id.includes('ROUTE')),scaleAndSpacingProtected:true};
          fs.writeFileSync('laws-cp5-final-moon-exact-head-v2.json',JSON.stringify(receipt,null,2)+'\n');
          if(failures.length){console.error(JSON.stringify(failures,null,2));process.exit(1);}
          JS
          node /tmp/laws-cp5-final-moon-v2.mjs

      - name: Upload exact-head V2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laws-cp5-final-moon-exact-head-v2
          path: |
            laws-cp5-final-moon-static-v2.json
            laws-cp5-final-moon-exact-head-v2.json
            laws-cp5-final-moon-v2-evidence/**
            /tmp/laws-cp5-final-moon-v2-server.log
          retention-days: 30
          if-no-files-found: warn
