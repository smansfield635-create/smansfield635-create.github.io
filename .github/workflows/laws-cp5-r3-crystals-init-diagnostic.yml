name: Laws CP5 R3 Crystals Init Correction

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  correct:
    if: github.head_ref == 'agent/laws-cp5-r2-celestial-visual-correction-001'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/laws-cp5-r2-celestial-visual-correction-001
          fetch-depth: 0
      - name: Apply one bounded shader precision correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object laws/index.crystals.js)" = "04b92e73de18194c0447305fb3f9dd4654c6cd9a"
          test "$(git hash-object laws/index.interactions.js)" = "be365cc331ee5643f916abee204d4f5f45376c04"
          python3 - <<'PY'
          from pathlib import Path
          path=Path('laws/index.crystals.js')
          text=path.read_text()
          old='  const vertexShaderSource = `\n    attribute vec3 aPosition;'
          new='  const vertexShaderSource = `\n    precision mediump float;\n\n    attribute vec3 aPosition;'
          if text.count(old) != 1:
              raise SystemExit(f'VERTEX_PRECISION_ANCHOR_COUNT={text.count(old)}')
          path.write_text(text.replace(old,new,1))
          PY
          node --check laws/index.crystals.js
          git diff --check -- laws/index.crystals.js
          new_blob="$(git hash-object laws/index.crystals.js)"
          test "$new_blob" != "04b92e73de18194c0447305fb3f9dd4654c6cd9a"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/laws-cp5-r3-crystals-init-diagnostic.yml
          git add laws/index.crystals.js
          git commit -m 'Correct CP5 celestial shader uniform precision'
          git push origin HEAD:agent/laws-cp5-r2-celestial-visual-correction-001
          printf 'NEW_CRYSTAL_BLOB=%s\n' "$new_blob"
