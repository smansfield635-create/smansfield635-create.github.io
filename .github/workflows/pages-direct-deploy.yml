name: Direct GitHub Pages Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a --exclude '.git' --exclude '_site' ./ _site/
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('_site/index.html')
          text = path.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="/assets/compass/compass.carousel.css?v=compass-carousel-successor-v9">'
          js = '<script src="/assets/compass/compass.carousel.js?v=compass-carousel-successor-v9" defer></script>'
          text = re.sub(r'<link rel="stylesheet" href="/assets/compass/compass\.carousel\.css\?v=[^"]+">\n?', '', text)
          text = re.sub(r'<script src="/assets/compass/compass\.carousel\.js\?v=[^"]+" defer></script>\n?', '', text)
          text = re.sub(r'/assets/compass/compass\.cosmos\.js\?v=[^"\']+', '/assets/compass/compass.cosmos.js?v=compass-carousel-successor-v9', text)
          text = text.replace('</head>', f'{css}\n</head>', 1)
          text = text.replace('</body>', f'{js}\n</body>', 1)
          path.write_text(text, encoding='utf-8')
          assert 'compass.carousel.css?v=compass-carousel-successor-v9' in text
          assert 'compass.carousel.js?v=compass-carousel-successor-v9' in text
          assert 'compass.cosmos.js?v=compass-carousel-successor-v9' in text
          PY

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
