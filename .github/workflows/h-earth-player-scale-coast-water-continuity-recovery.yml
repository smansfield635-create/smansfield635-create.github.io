name: H-Earth coast water continuity recovery

on:
  pull_request:
    branches: [main]
    paths:
      - 'h-earth-3d/**'
      - 'h-earth-live-*/h-earth-3d/**'
      - '.github/workflows/h-earth-player-scale-coast-water-continuity-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect H-Earth product changes
        id: scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}')"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(h-earth-3d/|h-earth-live-[^/]+/h-earth-3d/)'; then
            echo 'product_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'product_changed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate workflow-only change
        if: github.event_name == 'pull_request' && steps.scope.outputs.product_changed != 'true'
        run: echo 'H-Earth workflow definition changed without H-Earth product bytes; full product qualification is not applicable.'
      - name: Run recovery qualification
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.product_changed == 'true'
        run: node h-earth-3d/validation/h-earth.player-scale-coast-water-continuity-recovery.harness.mjs
