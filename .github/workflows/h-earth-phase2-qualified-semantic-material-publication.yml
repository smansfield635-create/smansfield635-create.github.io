name: H-Earth Phase2 Qualified Semantic Material Publication
on:
  push:
    branches:
      - h-earth/phase2-semantic-material-classifier-v1
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[semantic-material-v2-published]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact-head qualified artifacts
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          find_run () {
            WF="$1"
            for attempt in $(seq 1 60); do
              ID=$(gh api "repos/$REPO/actions/workflows/$WF/runs?branch=h-earth/phase2-semantic-material-classifier-v1&per_page=30" --jq ".workflow_runs[] | select(.head_sha==\"$SHA\" and .conclusion==\"success\") | .id" | head -1)
              if [ -n "$ID" ]; then echo "$ID"; return 0; fi
              sleep 10
            done
            return 1
          }
          BAKE=$(find_run h-earth-phase2-semantic-material-bake.yml)
          QUAL=$(find_run h-earth-phase2-semantic-material-asset-qualification.yml)
          test -n "$BAKE" && test -n "$QUAL"
          echo "bake=$BAKE" >> "$GITHUB_OUTPUT"
          echo "qual=$QUAL" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: h-earth-phase2-semantic-material-v2
          path: bake
          github-token: ${{ github.token }}
          run-id: ${{ steps.evidence.outputs.bake }}
      - uses: actions/download-artifact@v4
        with:
          name: h-earth-phase2-semantic-material-v2-qualification
          path: qualification
          github-token: ${{ github.token }}
          run-id: ${{ steps.evidence.outputs.qual }}
      - name: Verify qualification receipt and publish exact baked bytes
        run: |
          node -e "const fs=require('fs');const q=JSON.parse(fs.readFileSync('qualification/semantic-material-v2-qualification.json'));if(q.eligible!==true)process.exit(1);"
          DEST="showroom/globe/h-earth/render"
          cp bake/semantic-material-v2.rgba "$DEST/terrain-material-field.phase2-semantic-v2.rgba"
          SHA=$(sha256sum bake/semantic-material-v2.rgba | awk '{print $1}')
          QSHA=$(node -e "const q=require('./qualification/semantic-material-v2-qualification.json');process.stdout.write(q.sha256)")
          test "$SHA" = "$QSHA"
          cat > "$DEST/terrain-material-field.phase2-semantic-v2.js" <<EOF
          /** H_EARTH_PHASE2_SEMANTIC_MATERIAL_FIELD_v2 */
          export const H_EARTH_PHASE2_SEMANTIC_MATERIAL_FIELD_ID='H_EARTH_PHASE2_SEMANTIC_MATERIAL_FIELD_v2';
          export const H_EARTH_PHASE2_SEMANTIC_MATERIAL_FIELD_WIDTH=1024;
          export const H_EARTH_PHASE2_SEMANTIC_MATERIAL_FIELD_HEIGHT=1024;
          export const H_EARTH_PHASE2_SEMANTIC_MATERIAL_FIELD_BYTE_LENGTH=4194304;
          export const H_EARTH_PHASE2_SEMANTIC_MATERIAL_FIELD_SHA256='$SHA';
          export const H_EARTH_PHASE2_SEMANTIC_MATERIAL_FIELD_DOMAIN=Object.freeze({xMinimum:-256,xMaximum:256,zMinimum:-320,zMaximum:64,seaLevelY:0});
          const assetUrl=new URL('./terrain-material-field.phase2-semantic-v2.rgba',import.meta.url);
          let cachedPromise=null;
          const digestHex=async buffer=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',buffer))].map(v=>v.toString(16).padStart(2,'0')).join('');
          export async function loadHEarthPhase2SemanticMaterialField(){if(cachedPromise===null)cachedPromise=(async()=>{const r=await fetch(assetUrl);if(!r.ok)throw new Error('PHASE2_SEMANTIC_MATERIAL_FETCH_FAILED:'+r.status);const b=await r.arrayBuffer();if(b.byteLength!==H_EARTH_PHASE2_SEMANTIC_MATERIAL_FIELD_BYTE_LENGTH)throw new Error('PHASE2_SEMANTIC_MATERIAL_BYTE_LENGTH_INVALID');const d=await digestHex(b);if(d!==H_EARTH_PHASE2_SEMANTIC_MATERIAL_FIELD_SHA256)throw new Error('PHASE2_SEMANTIC_MATERIAL_DIGEST_INVALID:'+d);return new Uint8Array(b)})();return new Uint8Array(await cachedPromise)}
          export function getHEarthPhase2SemanticMaterialFieldReceipt(){return Object.freeze({fieldId:H_EARTH_PHASE2_SEMANTIC_MATERIAL_FIELD_ID,width:1024,height:1024,byteLength:4194304,canonicalSha256:H_EARTH_PHASE2_SEMANTIC_MATERIAL_FIELD_SHA256,domain:H_EARTH_PHASE2_SEMANTIC_MATERIAL_FIELD_DOMAIN,mipmapsRequired:true,uniqueWorldCoverage:true,runtimeTextureSamplesPerTerrainFragment:1,encoding:Object.freeze({rgb:'SEMANTIC_FAMILY_BLEND_SRGB8',alpha:'WETNESS_UNORM8'})})}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST/terrain-material-field.phase2-semantic-v2.rgba" "$DEST/terrain-material-field.phase2-semantic-v2.js"
          git commit -m "H-Earth Phase2: publish qualified semantic material v2 [semantic-material-v2-published]"
          git push origin HEAD:h-earth/phase2-semantic-material-classifier-v1
