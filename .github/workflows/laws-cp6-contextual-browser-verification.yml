name: Laws CP6 final detail normalization

on:
  push:
    branches:
      - agent/laws-complete-renewal-batch-001
    paths:
      - .github/workflows/laws-cp6-contextual-browser-verification.yml
      - scripts/laws_cp6_final_detail_normalize.py

permissions:
  contents: write

concurrency:
  group: laws-cp6-final-detail-normalization
  cancel-in-progress: false

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact recovered batch branch
        uses: actions/checkout@v4
        with:
          ref: agent/laws-complete-renewal-batch-001
          fetch-depth: 0

      - name: Apply systematic zero-open and formula normalization
        run: python3 scripts/laws_cp6_final_detail_normalize.py

      - name: Restore permanent verifier and remove one-shot script
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/laws-cp6-contextual-browser-verification.yml
          rm scripts/laws_cp6_final_detail_normalize.py

      - name: Verify bounded normalization scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          receipt = json.loads(Path('laws/control-plane/renewal/laws-complete-renewal-batch-materialization-receipt-v1.json').read_text())
          allowed = {
              raw for raw in receipt['product_files_written'] if raw.endswith('.html')
          } | {
              'laws/categories/flow/signals/index.html',
              'laws/categories/reality/measure.html',
              'laws/test/reverse-audit/index.html',
              'laws/control-plane/renewal/laws-complete-renewal-batch-materialization-receipt-v1.json',
              '.github/workflows/laws-cp6-contextual-browser-verification.yml',
              'scripts/laws_cp6_final_detail_normalize.py',
              'scripts/laws_complete_renewal_batch.py',
              'scripts/laws_complete_renewal_batch_browser_verify.mjs',
              'scripts/laws_complete_renewal_batch_browser_verify_v2.mjs',
              'scripts/laws_complete_renewal_batch_polish.py',
              'scripts/laws_complete_renewal_representative_horizon_patch.py',
              'scripts/laws_complete_renewal_reverse_audit_comparator_patch.py',
              'scripts/laws_complete_renewal_signals_horizon_patch.py',
              'scripts/verify-laws-complete-renewal-batch.py',
              'scripts/verify-laws-complete-renewal-batch-v2.py',
              'scripts/verify-laws-complete-renewal-batch-v3.py',
          }
          observed = {
              line[3:]
              for line in subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
              if line.strip()
          }
          unexpected = sorted(observed - allowed)
          if unexpected:
              raise SystemExit(f'CP6_DETAIL_SCOPE_DRIFT:{unexpected}')
          if 'laws/categories/flow/feedback/index.html' not in observed:
              raise SystemExit('FEEDBACK_DETAIL_REPAIR_NOT_OBSERVED')
          if len([path for path in observed if path.endswith('.html')]) < 20:
              raise SystemExit(f'INSUFFICIENT_SYSTEMATIC_PAGE_NORMALIZATION:{len(observed)}')
          PY
          grep -F '<strong>INPUT_(t+1)</strong>' laws/categories/flow/feedback/index.html
          if grep -R 'aria-selected="true"\|aria-expanded="true"' laws/categories laws/test laws/research frontier/energy/battery-coherence-study/index.html; then
            echo 'Pre-opened reading state remains in the normalized cohort.' >&2
            exit 1
          fi

      - name: Commit normalized cohort and restored verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Normalize CP6 zero-open and formula details [skip ci]'
          git push origin HEAD:agent/laws-complete-renewal-batch-001
