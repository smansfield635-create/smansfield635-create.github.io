name: Laws graphic engineering bootstrap

on:
  pull_request:
    types: [synchronize]
    branches:
      - main
    paths:
      - .github/bootstrap/laws-program.ready
      - .github/workflows/laws-graphic-engineering-bootstrap.yml

permissions:
  contents: write

jobs:
  materialize-coordinated-slice:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Materialize coordinated program files
        shell: bash
        run: |
          cat .github/bootstrap/laws-program.part* | base64 -d > /tmp/laws-program.tar.gz
          tar -tzf /tmp/laws-program.tar.gz >/dev/null
          tar -xzf /tmp/laws-program.tar.gz -C .
          rm -rf .github/bootstrap
          rm .github/workflows/laws-graphic-engineering-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Coordinate Laws lab and Compass vertical slice"
          git push origin HEAD:${{ github.head_ref }}
