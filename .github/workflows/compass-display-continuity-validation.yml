name: Compass Display Continuity Validation

on:
  push:
    branches:
      - agent/compass-interaction-diagnostic-successor-v5
    paths:
      - 'index.html'
      - 'assets/compass/**'
      - '.github/ai-router/projects/compass/**'
      - '.github/workflows/compass-display-continuity-validation.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'assets/compass/**'
      - '.github/ai-router/projects/compass/**'
      - '.github/workflows/compass-display-continuity-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPASS_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify-static-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run fail-closed Compass verifier
        env:
          COMPASS_VERIFICATION_OUTPUT: /tmp/compass-display-continuity-verification-receipt.json
          COMPASS_SCOPE_BASE_SHA: ad395e724cbfea1c19c9ce43393c1148fa557816
        run: node .github/ai-router/projects/compass/verify-display-continuity.v1.mjs
      - name: Upload static verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compass-display-continuity-verification-receipt
          path: /tmp/compass-display-continuity-verification-receipt.json

  qualify-runtime:
    runs-on: ubuntu-latest
    needs: verify-static-contract
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright outside repository contract
        env:
          npm_config_package_lock: 'false'
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Start local static host
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/compass-http.log 2>&1 &
          echo $! >/tmp/compass-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/compass-http.log
          exit 1
      - name: Playwright desktop tablet phone interaction filtering
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const base='http://127.0.0.1:4173/';
          const browser=await chromium.launch({headless:true});
          const checks=[];
          const check=(id,pass,evidence)=>checks.push({id,pass:Boolean(pass),evidence});
          async function qualifyViewport(name,viewport){
            const context=await browser.newContext({viewport});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(base,{waitUntil:'domcontentloaded',timeout:15000});
            await page.waitForSelector('[data-compass-root]',{timeout:10000});
            await page.waitForSelector('[data-compass-cardinal]',{state:'visible',timeout:10000});
            await page.waitForTimeout(400);
            const result=await page.evaluate(()=>({
              cardinals:[...document.querySelectorAll('[data-compass-cardinal]')].map(el=>el.getAttribute('data-cardinal-id')),
              roomDeclarations:document.querySelectorAll('[data-compass-room-declarations] [data-compass-room]').length,
              horizontalOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
              introOpen:document.querySelector('[data-compass-full-introduction]')?.open,
              mathVisible:document.body.textContent.includes('Mathematical Foundation'),
              monuments:document.querySelectorAll('.compass-monument').length,
              successorCapabilityPlaques:document.querySelectorAll('[data-capability-orbit] > [data-capability]').length,
              built:Boolean(document.querySelector('.compass-built')),
              buildCta:Boolean(document.querySelector('.compass-build-cta')),
              mirrorRoutes:document.querySelectorAll('[data-compass-mirrorland-routes] a:not([data-compass-mirrorland-inline-back])').length,
              mirrorBack:Boolean(document.querySelector('[data-compass-mirrorland-inline-back]')),
              cosmos:Boolean(document.querySelector('[data-compass-cosmic-field]')),
              headerTop:document.querySelector('.compass-estate__header')?.getBoundingClientRect().top,
              instrumentTop:document.querySelector('.compass-instrument')?.getBoundingClientRect().top
            }));
            check(`${name}_FOUR_CARDINALS`,JSON.stringify(result.cardinals)===JSON.stringify(['north','east','south','west']),result.cardinals);
            check(`${name}_ROOM_DECLARATIONS`,result.roomDeclarations===19,result.roomDeclarations);
            check(`${name}_NO_OVERFLOW`,result.horizontalOverflow<=2,result.horizontalOverflow);
            check(`${name}_INTRO_COLLAPSED`,result.introOpen===false,result.introOpen);
            check(`${name}_MATH_REMOVED`,!result.mathVisible,result.mathVisible);
            check(`${name}_MONUMENTS`,result.monuments===2||result.successorCapabilityPlaques===2,{sourceMonuments:result.monuments,successorCapabilityPlaques:result.successorCapabilityPlaques});
            check(`${name}_BUILT_AND_BUILD`,result.built&&result.buildCta,result);
            check(`${name}_MIRRORLAND_THREE_ROUTES`,result.mirrorRoutes===3&&result.mirrorBack,result);
            check(`${name}_COSMOS_HOST`,result.cosmos,result.cosmos);
            check(`${name}_OPENING_COMPACT`,Number.isFinite(result.headerTop)&&result.headerTop<140,result);
            check(`${name}_INSTRUMENT_FOLLOWS_OPENING`,Number.isFinite(result.instrumentTop)&&result.instrumentTop<900,result);
            check(`${name}_NO_PAGE_ERRORS`,errors.length===0,errors);
            await page.screenshot({path:`/tmp/compass-${name.toLowerCase()}.png`,fullPage:true});
            await context.close();
          }
          await qualifyViewport('DESKTOP',{width:1440,height:900});
          await qualifyViewport('TABLET',{width:1024,height:768});
          await qualifyViewport('PHONE',{width:390,height:844});
          {
            const context=await browser.newContext({viewport:{width:1280,height:800}});
            const page=await context.newPage();
            await page.goto(base,{waitUntil:'domcontentloaded'});
            const north=page.locator('[data-cardinal-id="north"]');
            await north.focus();
            check('KEYBOARD_FOCUS',await north.evaluate(el=>document.activeElement===el),true);
            await north.press('Enter');
            await page.waitForTimeout(500);
            const state=await page.locator('[data-compass-root]').evaluate(el=>({mode:el.dataset.compassMode,selected:el.dataset.selectedCardinal,preview:el.dataset.clusterPreviewPrimaryRoom||'',guidance:document.querySelector('[data-compass-guidance]')?.textContent.trim(),previewState:document.querySelector('[data-compass-preview-state]')?.textContent.trim(),panelTitle:document.querySelector('[data-compass-panel-title]')?.textContent.trim(),enterDisabled:document.querySelector('[data-compass-enter]')?.disabled}));
            check('CARDINAL_OPEN_STATE',state.mode==='CLUSTER_OPEN'&&state.selected==='north',state);
            check('CLUSTER_GUIDANCE_STATE',state.guidance==='Drag to rotate the cluster. Tap a room star to select it. Swipe across open space to return to the constellation.',state.guidance);
            check('FOREGROUND_ROOM_CONTEXT_AND_ENTRY_AVAILABLE',Boolean(state.preview)&&state.previewState?.includes('ROOM IN FRONT')&&Boolean(state.panelTitle)&&state.enterDisabled===false,state);
            const returnButton=page.locator('[data-compass-return-to-orbit]');
            check('RETURN_CONTROL_HIDDEN_WHILE_CLUSTER_OPEN',!(await returnButton.isVisible()),await returnButton.isVisible());
            const clusterReturned=await page.evaluate(()=>globalThis.DGB_COMPASS_CONTROLLER?.requestReturnToConstellation({source:'playwright-qualification',scrollToScene:false})===true);
            await page.waitForTimeout(200);
            check('CLUSTER_RETURN_TO_CONSTELLATION',clusterReturned&&(await page.locator('[data-compass-root]').getAttribute('data-compass-mode'))==='CONSTELLATION',await page.locator('[data-compass-root]').getAttribute('data-compass-mode'));
            await north.press('Enter');
            await page.waitForTimeout(300);
            const roomSelected=await page.evaluate(()=>globalThis.DGB_COMPASS_CONTROLLER?.requestRoomSelection('north-1')===true);
            await page.waitForTimeout(300);
            const roomState=await page.locator('[data-compass-root]').evaluate(el=>({mode:el.dataset.compassMode,room:el.dataset.selectedRoom,guidance:document.querySelector('[data-compass-guidance]')?.textContent.trim()}));
            check('ROOM_SELECTION_STATE',roomSelected&&roomState.mode==='ROOM_SELECTED'&&roomState.room==='north-1',roomState);
            check('ROOM_GUIDANCE_STATE',roomState.guidance==='Review the selected room. Use Enter Room to continue, Return To Orbit to reopen the cluster, or swipe across open space to return to the constellation.',roomState.guidance);
            check('RETURN_CONTROL_EXPOSED_AFTER_ROOM_SELECTION',await returnButton.isVisible(),await returnButton.isVisible());
            await returnButton.click();
            await page.waitForTimeout(300);
            check('EXPLICIT_RETURN_TO_ORBIT_WORKS',(await page.locator('[data-compass-root]').getAttribute('data-compass-mode'))==='CLUSTER_OPEN',await page.locator('[data-compass-root]').getAttribute('data-compass-mode'));
            await context.close();
          }
          {
            const context=await browser.newContext({viewport:{width:1280,height:800},reducedMotion:'reduce'});
            const page=await context.newPage();
            await page.goto(base,{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(300);
            const reduced=await page.locator('[data-compass-root]').getAttribute('data-reduced-motion');
            check('REDUCED_MOTION_STATE',reduced==='true',reduced);
            check('REDUCED_MOTION_SEMANTIC_EQUIVALENCE',await page.locator('[data-compass-cardinal]').count()===4,await page.locator('[data-compass-cardinal]').count());
            await context.close();
          }
          await browser.close();
          const failures=checks.filter(item=>!item.pass);
          const receipt={schema:'COMPASS_RUNTIME_QUALIFICATION_RECEIPT_v3',operationId:'COMPASS_INTERACTION_AND_DIAGNOSTIC_SUCCESSOR_20260816_v5',lockGeneration:1507,governingHead:'ad395e724cbfea1c19c9ce43393c1148fa557816',candidateHead:process.env.COMPASS_CANDIDATE_HEAD||null,result:failures.length?'FAIL_CLOSED':'PASS',checks,failures:failures.map(item=>item.id)};
          fs.writeFileSync('/tmp/compass-runtime-qualification-receipt.json',`${JSON.stringify(receipt,null,2)}\n`);
          console.log(JSON.stringify(receipt,null,2));
          if(failures.length)process.exit(1);
          NODE
      - name: Qualify candidate-local Compass successor interaction matrix
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { chromium } from 'playwright';
          const base='http://127.0.0.1:4173/';
          const operationId='COMPASS_INTERACTION_AND_DIAGNOSTIC_SUCCESSOR_20260816_v5';
          const governingHead='ad395e724cbfea1c19c9ce43393c1148fa557816';
          const checks=[];
          const check=(id,pass,evidence)=>checks.push({id,pass:Boolean(pass),evidence});
          const text=value=>String(value||'').replace(/\s+/g,' ').trim();
          const errorEvidence=error=>({name:error?.name||'Error',message:String(error?.message||error),stack:String(error?.stack||'').split('\n').slice(0,8)});
          const angularDistance=(a,b)=>Math.abs((((Number(b)-Number(a))+540)%360)-180);
          const browser=await chromium.launch({headless:true});

          async function load(page){
            const errors=[];
            page.on('pageerror',error=>errors.push(String(error)));
            await page.goto(base,{waitUntil:'domcontentloaded',timeout:20000});
            await page.waitForSelector('[data-statement-orbit]',{state:'visible',timeout:10000});
            await page.waitForSelector('[data-capability-orbit]',{state:'visible',timeout:10000});
            await page.waitForFunction(()=>globalThis.CompassEditorialCarousel?.version==='successor-v5',{timeout:10000});
            await page.waitForTimeout(180);
            return errors;
          }

          async function guidanceState(page,stageSelector,guidanceSelector){
            return page.evaluate(({stageSelector,guidanceSelector})=>{
              const stage=document.querySelector(stageSelector),guidance=document.querySelector(guidanceSelector);
              const rect=guidance?.getBoundingClientRect(),style=guidance?getComputedStyle(guidance):null;
              return {
                text:(guidance?.textContent||'').replace(/\s+/g,' ').trim(),
                id:guidance?.id||'',
                describedBy:stage?.getAttribute('aria-describedby')||'',
                visible:Boolean(rect&&rect.width>0&&rect.height>0&&style&&style.display!=='none'&&style.visibility!=='hidden'&&Number(style.opacity||1)>0.01)
              };
            },{stageSelector,guidanceSelector});
          }

          async function depthState(page,cardSelector){
            return page.evaluate(cardSelector=>{
              const all=[...document.querySelectorAll(cardSelector)];
              const describe=el=>{
                if(!el)return null;
                const style=getComputedStyle(el),after=getComputedStyle(el,'::after');
                return {
                  slot:el.dataset.slot||'',
                  inert:el.inert||el.hasAttribute('inert'),
                  ariaHidden:el.getAttribute('aria-hidden'),
                  opacity:Number(style.opacity),
                  filter:style.filter,
                  transform:style.transform,
                  pointerEvents:style.pointerEvents,
                  zIndex:Number.parseFloat(style.zIndex)||0,
                  glossy:style.backgroundImage!=='none'||after.backgroundImage!=='none'
                };
              };
              const front=all.find(el=>el.dataset.slot==='front');
              const rear=all.filter(el=>el!==front);
              return {count:all.length,front:describe(front),rear:rear.map(describe)};
            },cardSelector);
          }

          function proveDepth(prefix,state,expectedCount,{requireInert=true,requireGloss=true}={}){
            check(`${prefix}_ONE_ACTIVE_CARD`,state.count===expectedCount&&Boolean(state.front)&&state.rear.length===expectedCount-1,state);
            check(`${prefix}_ACTIVE_CLEAR`,state.front?.opacity>=0.9&&(state.front?.filter==='none'||state.front?.filter.includes('blur(0')),state.front);
            check(`${prefix}_REAR_OBSCURED_NONINTERACTIVE`,state.rear.every(rear=>(!requireInert||rear.inert)&&rear.ariaHidden==='true'&&rear.pointerEvents==='none'&&/blur\((?!0(?:px)?\))/.test(rear.filter)&&(rear.opacity<state.front.opacity||/brightness\((?:0?\.)/.test(rear.filter))),state);
            check(`${prefix}_DEPTH_AND_GLOSS`,state.rear.every(rear=>rear.transform!==state.front.transform&&rear.zIndex<state.front.zIndex&&(!requireGloss||rear.glossy)),state);
          }

          async function frontIndex(page,cardSelector){
            return page.locator(cardSelector).evaluateAll(cards=>cards.findIndex(card=>card.dataset.slot==='front'));
          }

          async function atomicSwipe(page,{prefix,stageSelector,cardSelector,count}){
            const stage=page.locator(stageSelector);
            await stage.scrollIntoViewIfNeeded();
            await page.waitForTimeout(60);
            const box=await stage.boundingBox();
            if(!box){check(`${prefix}_STAGE_GEOMETRY`,false,null);return;}
            const before=await frontIndex(page,cardSelector);
            const startX=box.x+box.width*.76,endX=box.x+box.width*.24,y=box.y+Math.min(18,box.height*.08);
            const viewport=page.viewportSize();
            const injectionVisible=Boolean(viewport)&&startX>=0&&startX<=viewport.width&&endX>=0&&endX<=viewport.width&&y>=0&&y<=viewport.height;
            check(`${prefix}_STAGE_IN_VIEW_FOR_POINTER_INJECTION`,injectionVisible,{box,viewport,startX,endX,y});
            if(!injectionVisible)return;
            await page.mouse.move(startX,y);
            await page.mouse.down();
            await page.mouse.move(endX,y,{steps:8});
            await page.waitForTimeout(90);
            const held=await frontIndex(page,cardSelector);
            check(`${prefix}_NO_INTERMEDIATE_COMMIT`,held===before,{before,held});
            await page.mouse.up();
            await page.waitForTimeout(560);
            const after=await frontIndex(page,cardSelector);
            check(`${prefix}_ONE_RELEASE_ONE_NEIGHBOR`,after===(before+1)%count,{before,after,expected:(before+1)%count});
          }

          async function qualifyViewport({name,viewport,deviceScaleFactor=1,physicalScreenshot=false}){
            const context=await browser.newContext({viewport,deviceScaleFactor});
            const page=await context.newPage();
            const errors=await load(page);
            const layout=await page.evaluate(()=>{
              const statement=document.querySelector('[data-statement-guidance]'),capability=document.querySelector('[data-capability-guidance]');
              const visible=el=>{const r=el?.getBoundingClientRect(),s=el?getComputedStyle(el):null;return Boolean(r&&r.width>0&&r.height>0&&r.left>=-1&&r.right<=innerWidth+1&&s&&s.display!=='none'&&s.visibility!=='hidden')};
              const capabilityFront=document.querySelector('[data-capability-orbit] > [data-slot="front"]');
              const capabilityRear=document.querySelector('[data-capability-orbit] > [data-slot="rear"]');
              const frontRect=capabilityFront?.getBoundingClientRect(),rearRect=capabilityRear?.getBoundingClientRect();
              const rearExposure=frontRect&&rearRect?Math.max(0,rearRect.right-frontRect.right)+Math.max(0,frontRect.left-rearRect.left):0;
              const activeTargets=[...(capabilityFront?.querySelectorAll('a,button')||[])].filter(visible).map(el=>{const r=el.getBoundingClientRect();return {label:(el.textContent||'').trim(),width:r.width,height:r.height}});
              const brainRect=document.querySelector('[data-human-brain] canvas')?.getBoundingClientRect();
              return {
                viewport:{width:innerWidth,height:innerHeight,dpr:devicePixelRatio},
                overflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-document.documentElement.clientWidth,
                statementGuidance:visible(statement),
                capabilityGuidance:visible(capability),
                statementFront:document.querySelectorAll('[data-statement-orbit] [data-slot="front"]').length,
                capabilityFront:document.querySelectorAll('[data-capability-orbit] > [data-slot="front"]').length,
                rearExposure,
                activeTargets,
                brainRect:brainRect?{width:brainRect.width,height:brainRect.height,left:brainRect.left,right:brainRect.right}:null
              };
            });
            check(`${name}_VIEWPORT_AND_DPR`,layout.viewport.width===viewport.width&&layout.viewport.height===viewport.height&&layout.viewport.dpr===deviceScaleFactor,{expected:{...viewport,deviceScaleFactor},actual:layout.viewport});
            check(`${name}_NO_HORIZONTAL_OVERFLOW`,layout.overflow<=2,layout);
            check(`${name}_GUIDANCE_VISIBLE`,layout.statementGuidance&&layout.capabilityGuidance,layout);
            check(`${name}_ONE_CLEAR_CARD_PER_ORBIT`,layout.statementFront===1&&layout.capabilityFront===1,layout);
            check(`${name}_REAR_PEER_VISIBLY_SIGNALS_ORBIT`,layout.rearExposure>=8,layout.rearExposure);
            check(`${name}_ACTIVE_TARGETS_AT_LEAST_44PX`,layout.activeTargets.length>0&&layout.activeTargets.every(target=>target.width>=44&&target.height>=44),layout.activeTargets);
            check(`${name}_BRAIN_ENVELOPE_USABLE`,Boolean(layout.brainRect)&&layout.brainRect.width>140&&layout.brainRect.height>140&&layout.brainRect.left>=-1&&layout.brainRect.right<=viewport.width+1,layout.brainRect);
            check(`${name}_NO_PAGE_ERRORS`,errors.length===0,errors);
            const screenshotName=name==='PHONE_DPR3'?'dpr3':name.toLowerCase();
            const screenshotPath=`/tmp/compass-interaction-diagnostic-${screenshotName}.png`;
            await page.screenshot({path:screenshotPath,fullPage:!physicalScreenshot});
            if(physicalScreenshot){
              const png=fs.readFileSync(screenshotPath);
              const dimensions={width:png.readUInt32BE(16),height:png.readUInt32BE(20)};
              check(`${name}_PHYSICAL_1080_BY_2340`,dimensions.width===1080&&dimensions.height===2340,dimensions);
            }
            await context.close();
          }

          try{
            await qualifyViewport({name:'DESKTOP',viewport:{width:1440,height:900}});
            await qualifyViewport({name:'TABLET',viewport:{width:1024,height:768}});
            await qualifyViewport({name:'PHONE',viewport:{width:390,height:844}});
            await qualifyViewport({name:'PHONE_DPR3',viewport:{width:360,height:780},deviceScaleFactor:3,physicalScreenshot:true});

            {
              const context=await browser.newContext({viewport:{width:1440,height:900}});
              const page=await context.newPage();
              const errors=await load(page);
              const statementExpected='Not everything is as it first appears. Swipe the thought above.';
              const capabilityExpected='Swipe to rotate the orbit. Tap the clear card to enter.';
              const houseExpected='Swipe to choose a House guide. Tap the clear card to talk. Return to Orbit restores the capability orbit.';

              const statementGuidance=await guidanceState(page,'[data-statement-orbit]','[data-statement-guidance]');
              check('STATEMENT_GUIDANCE_EXACT_AND_ASSOCIATED',statementGuidance.text===statementExpected&&statementGuidance.id==='compass-statement-guidance'&&statementGuidance.describedBy.split(/\s+/).includes(statementGuidance.id)&&statementGuidance.visible,statementGuidance);
              proveDepth('STATEMENT',await depthState(page,'[data-statement-orbit] .compass-statement-object'),2,{requireInert:false,requireGloss:false});
              const statementStage=page.locator('[data-statement-orbit]');
              await statementStage.focus();
              const statementBefore=await frontIndex(page,'[data-statement-orbit] .compass-statement-object');
              await statementStage.press('ArrowRight');
              await page.waitForTimeout(560);
              const statementAfter=await frontIndex(page,'[data-statement-orbit] .compass-statement-object');
              check('STATEMENT_KEYBOARD_PARITY_AND_FOCUS',statementAfter===(statementBefore+1)%2&&await statementStage.evaluate(el=>document.activeElement===el),{statementBefore,statementAfter});
              await atomicSwipe(page,{prefix:'STATEMENT_SWIPE',stageSelector:'[data-statement-orbit]',cardSelector:'[data-statement-orbit] .compass-statement-object',count:2});

              const brainRoot=page.locator('[data-human-brain]');
              const brainCanvas=brainRoot.locator('canvas');
              await brainCanvas.waitFor({state:'visible'});
              const brain=await brainRoot.evaluate(root=>{
                const canvas=root.querySelector('canvas'),rect=canvas?.getBoundingClientRect();
                return {
                  contract:root.dataset.brainContract,
                  view:root.dataset.brainView,
                  axes:(root.dataset.brainAxes||'').split(','),
                  components:(root.dataset.brainComponents||'').split(','),
                  regions:(root.dataset.brainRegions||'').split(','),
                  renderer:canvas?.dataset.brainRenderer,
                  labels:(canvas?.dataset.brainAxisLabels||'').split(','),
                  axisPurpose:canvas?.dataset.brainAxisPurpose||root.dataset.brainAxisPurpose||'',
                  regionsOnCanvas:(canvas?.dataset.brainRegions||'').split(','),
                  motion:canvas?.dataset.brainMotion,
                  yaw:Number(canvas?.dataset.brainYawDegrees),
                  snapshotViews:(root.dataset.brainSnapshotViews||'').split(','),
                  snapshotApi:root.dataset.brainSnapshotApi||'',
                  role:canvas?.getAttribute('role'),
                  ariaLabel:canvas?.getAttribute('aria-label')||'',
                  size:rect?{width:rect.width,height:rect.height}:null
                };
              });
              const components=['left-hemisphere','right-hemisphere','longitudinal-fissure','cerebellum','pons','brainstem'];
              const regions=['frontal','temporal','parietal','occipital'];
              check('BRAIN_ANATOMICAL_CONTRACT',brain.contract==='COMPASS_ANATOMICAL_BRAIN_XYZ_v1'&&brain.renderer==='anatomical-parametric-v2'&&brain.view==='eye-level-parallel'&&components.every(value=>brain.components.includes(value))&&regions.every(value=>brain.regions.includes(value))&&regions.every(value=>brain.regionsOnCanvas.includes(value)),brain);
              check('BRAIN_RIGHT_HANDED_XYZ_AXES',JSON.stringify(brain.axes)===JSON.stringify(['x','y','z'])&&JSON.stringify(brain.labels)===JSON.stringify(['X','Y','Z']),brain);
              check('BRAIN_AXES_SPATIAL_ORIENTATION_ONLY',brain.axisPurpose==='spatial-orientation-only'&&/spatial orientation axes only/i.test(brain.ariaLabel),brain);
              check('BRAIN_ACCESSIBLE_EYE_LEVEL_RENDER',brain.role==='img'&&/human brain/i.test(brain.ariaLabel)&&brain.size?.width>140&&brain.size?.height>140,brain);
              check('BRAIN_NORMAL_MOTION_DECLARED',brain.motion==='slow-yaw',brain.motion);
              await brainRoot.screenshot({path:'/tmp/compass-brain-eye-level.png'});
              const namedBrainViews=['front','side','rear','underside'];
              const brainFrames=[];
              for(const viewName of namedBrainViews){
                const frame=await page.evaluate(viewName=>{
                  const api=globalThis.CompassEditorialCarousel?.brainSnapshots;
                  const canvas=document.querySelector('[data-human-brain] canvas');
                  const metadata=api?.capture(viewName)||null;
