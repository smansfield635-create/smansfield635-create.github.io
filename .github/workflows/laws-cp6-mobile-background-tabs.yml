name: Laws CP6 mobile background and visitor tabs correction

on:
  pull_request:
    paths:
      - 'laws/index.html'
      - 'laws/index.spacecraft.background.js'
      - 'laws/index.mobile-background-tabs.js'
      - 'laws/index.mobile-background-tabs.css'
      - 'tools/laws-cp6-mobile-background-tabs-verify.mjs'
      - '.github/workflows/laws-cp6-mobile-background-tabs.yml'

permissions:
  contents: write

jobs:
  relocate-recompose-verify:
    if: github.head_ref == 'agent/laws-cp6-mobile-background-tabs-correction-001'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Fetch exact current main authority
        run: git fetch origin main

      - name: Install bounded page-level correction loaders
        run: |
          python3 - <<'PY'
          from pathlib import Path

          target = Path('laws/index.html')
          source = target.read_text()

          old_spacecraft = '/laws/index.spacecraft.js?v=LAWS_CP6_TRUE_3D_SPACECRAFT_20260801A'
          new_spacecraft = '/laws/index.spacecraft.background.js?v=LAWS_CP6_TRUE_3D_SPACECRAFT_BACKGROUND_20260801A'
          css_href = '/laws/index.mobile-background-tabs.css?v=LAWS_CP6_MOBILE_BACKGROUND_TABS_20260801A'
          script_src = '/laws/index.mobile-background-tabs.js?v=LAWS_CP6_MOBILE_BACKGROUND_TABS_20260801A'

          if old_spacecraft in source:
              if source.count(old_spacecraft) != 1:
                  raise SystemExit(f'EXPECTED_ONE_OLD_SPACECRAFT_REFERENCE_FOUND_{source.count(old_spacecraft)}')
              source = source.replace(old_spacecraft, new_spacecraft)
          elif new_spacecraft not in source:
              raise SystemExit('SPACECRAFT_LOADER_REFERENCE_NOT_FOUND')

          if css_href not in source:
              marker = '</head>'
              if source.count(marker) != 1:
                  raise SystemExit('HEAD_CLOSE_NOT_UNIQUE')
              css = f'<link data-laws-mobile-background-tabs-css="true" href="{css_href}" rel="stylesheet"/>\n'
              script = f'<script data-laws-mobile-background-tabs="true" data-laws-presentation-only="true" defer src="{script_src}"></script>\n'
              source = source.replace(marker, css + script + marker)
          elif script_src not in source:
              raise SystemExit('CSS_PRESENT_BUT_TABS_SCRIPT_MISSING')

          target.write_text(source)
          PY

      - name: Verify source syntax
        run: |
          node --input-type=module --check < laws/index.spacecraft.background.js
          node --check laws/index.mobile-background-tabs.js
          node --check tools/laws-cp6-mobile-background-tabs-verify.mjs

      - name: Commit bounded loader mutation locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add laws/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Relocate Laws spacecraft and restore mobile visitor tabs"
          fi

      - name: Verify static placement and authority boundaries
        env:
          EVIDENCE_DIR: cp6-mobile-background-tabs-evidence
        run: node tools/laws-cp6-mobile-background-tabs-verify.mjs static

      - name: Verify protected Laws authorities remain unchanged
        run: |
          protected=(
            laws/index.controller.js
            laws/index.compositor.js
            laws/index.crystals.js
            laws/index.interactions.js
            laws/index.cosmos.js
            laws/index.planet.js
            assets/audralia/audralia.planet.js
          )

          changed="$(git diff --name-only origin/main...HEAD -- "${protected[@]}")"
          if [ -n "$changed" ]; then
            printf 'Protected runtime mutation detected:\n%s\n' "$changed"
            exit 1
          fi

      - name: Install browser verifier
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve candidate
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/laws-cp6-mobile-background-tabs-server.log 2>&1 &
          echo $! > /tmp/laws-cp6-mobile-background-tabs-server.pid
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173/laws/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/laws-cp6-mobile-background-tabs-server.log
          exit 1

      - name: Verify page background interaction and five viewport compositions
        env:
          BASE_URL: http://127.0.0.1:4173
          EVIDENCE_DIR: cp6-mobile-background-tabs-evidence
        run: node tools/laws-cp6-mobile-background-tabs-verify.mjs browser

      - name: Upload correction evidence
        uses: actions/upload-artifact@v4
        with:
          name: laws-cp6-mobile-background-tabs
          path: cp6-mobile-background-tabs-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Publish verified correction head
        run: git push origin HEAD:${{ github.head_ref }}
