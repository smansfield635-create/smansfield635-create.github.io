name: H-Earth C2-R1 R1.6 Assembly

on:
  push:
    branches:
      - candidate/h-earth-c2-r1-r1-6-assembly-001
    paths:
      - '.r1-6-assembly/payload-*.b64'
      - '.github/workflows/h-earth-c2-r1-r1-6-assembly.yml'

permissions:
  contents: write

jobs:
  materialize-r1-6:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/h-earth-c2-r1-r1-6-assembly-001
          fetch-depth: 0

      - name: Verify exact transport set and materialize payload
        run: |
          set -euo pipefail
          test "$(find .r1-6-assembly -maxdepth 1 -name 'payload-*.b64' | wc -l)" -eq 6
          cat .r1-6-assembly/payload-*.b64 > /tmp/r1-6-payload.b64
          base64 --decode /tmp/r1-6-payload.b64 > /tmp/r1-6-payload.tar.gz
          echo '5642b8f6268b3149163ec30de22c54ae12cefbcb2852144d9bc0f4c2c7a38168  /tmp/r1-6-payload.tar.gz' | sha256sum --check
          tar -xzf /tmp/r1-6-payload.tar.gz
          node --check h-earth-3d/environment/h-earth.coastal-swash-foam-wetness.c2-r1.js
          node --check h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.r1-6-restrained-swash-foam-wetness.mjs
          node --check h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.c2-r1-candidate-path-disposition.js
          node -e "JSON.parse(require('fs').readFileSync('h-earth-3d/control-plane/coastal-morphology/c2-r1/h-earth.c2-r1.allowed-path-manifest.json')); JSON.parse(require('fs').readFileSync('h-earth-3d/control-plane/coastal-morphology/c2-r1/h-earth.c2-r1.program.json')); JSON.parse(require('fs').readFileSync('h-earth-3d/control-plane/coastal-morphology/c2-r1/h-earth.c2-r1.progress-ledger.json'))"

      - name: Commit only the verified R1.6 payload
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/h-earth.c2-r1.allowed-path-manifest.json \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/h-earth.c2-r1.program.json \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/h-earth.c2-r1.progress-ledger.json \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.r1-6-restrained-swash-foam-wetness.mjs \
            h-earth-3d/environment/h-earth.coastal-swash-foam-wetness.c2-r1.js \
            h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.c2-r1-candidate-path-disposition.js
          test -n "$(git diff --cached --name-only)"
          git commit -m 'C2-R1 R1.6: assemble restrained swash foam and wetness'
          git push origin HEAD:candidate/h-earth-c2-r1-r1-6-assembly-001
