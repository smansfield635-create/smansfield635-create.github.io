              'effectiveClusterQuaternion('
          )
          for token in forbidden_crystals:
              if token in crystals:
                  raise SystemExit(f'FORBIDDEN_CLUSTER_MUTATION_PRESENT:{token}')

          required_crystals = (
              'resolveClusterPresentation(',
