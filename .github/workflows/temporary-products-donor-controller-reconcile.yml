name: Temporary Products Donor Controller Reconcile

on:
  push:
    branches:
      - agent/products-arena-proven-donor-restoration-001

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/products-arena-proven-donor-restoration-001
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact donor controller reconciliation
        run: node verification/temporary-products-donor-controller-reconcile.mjs

      - name: Validate exact production scope
        run: |
          test "$(git diff --name-only HEAD -- products/index.controller.js | wc -l)" -eq 1
          grep -q 'function requestCompassSelection(event)' products/index.controller.js
          grep -q 'function requestReturnToMainCompass(event)' products/index.controller.js
          ! grep -q 'doubleTapWindowMs' products/index.controller.js
          ! grep -q 'centerPointer' products/index.controller.js
          node --check products/index.controller.js
          git diff --check

      - name: Self-clean and commit reconciled candidate
        run: |
          rm verification/temporary-products-donor-controller-reconcile.mjs
          rm .github/workflows/temporary-products-donor-controller-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add products/index.controller.js verification/temporary-products-donor-controller-reconcile.mjs .github/workflows/temporary-products-donor-controller-reconcile.yml
          git commit -m 'Reconcile Products center behavior to proven Compass contract'
          git push origin HEAD:agent/products-arena-proven-donor-restoration-001
