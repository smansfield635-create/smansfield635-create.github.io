name: H-Earth C2-R1 R1.7D Closed Manual Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-closed-r1-7d-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify closed R1.7D repository record
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const root = 'h-earth-3d/control-plane/coastal-morphology/c2-r1';
          const program = JSON.parse(fs.readFileSync(
            `${root}/h-earth.c2-r1.r1-7-subcheckpoint-program.json`,
            'utf8'
          ));
          const ledger = JSON.parse(fs.readFileSync(
            `${root}/h-earth.c2-r1.r1-7-subcheckpoint-ledger.json`,
            'utf8'
          ));
          const manifest = JSON.parse(fs.readFileSync(
            `${root}/evidence/h-earth.c2-r1.r1-7d-evidence-manifest.json`,
            'utf8'
          ));

          if (
            program.subcheckpoints?.['R1.7D']?.status !==
              'PASS_CLOSED_DO_NOT_REOPEN'
          ) {
            throw new Error('R1_7D_PROGRAM_NOT_CLOSED');
          }
          if (program.r1_7OverallStatus !== 'PASS_CLOSED_DO_NOT_REOPEN') {
            throw new Error('R1_7_PROGRAM_NOT_CLOSED');
          }

          const entry = ledger.entries.find(row =>
            row.subcheckpoint.startsWith('R1.7D_')
          );
          if (entry?.status !== 'PASS_CLOSED_DO_NOT_REOPEN') {
            throw new Error('R1_7D_LEDGER_NOT_CLOSED');
          }

          if (
            manifest.result !== 'PASS_CLOSED_DO_NOT_REOPEN' ||
            manifest.exactClosurePathCount !== 9
          ) {
            throw new Error('R1_7D_MANIFEST_NOT_CLOSED');
          }
          if (manifest.productDefaultMutated || manifest.publicRouteMutated) {
            throw new Error('PROHIBITED_MUTATION_RECORDED');
          }
          if (
            manifest.visualSuccessorStatus !== 'NOT_ESTABLISHED' ||
            manifest.userDifferentialReady !== false
          ) {
            throw new Error('VISUAL_STATUS_INVALID');
          }
          if (
            manifest.nextAuthorizedCheckpoint !==
              'R1.8_INTEGRATED_FUNCTIONAL_VERIFICATION_PUBLICATION_AND_HUMAN_REVIEW' ||
            manifest.r1_8AutomaticStart !== false
          ) {
            throw new Error('R1_8_AUTHORITY_INVALID');
          }

          console.log('R1.7D PASS_CLOSED_DO_NOT_REOPEN');
          NODE
