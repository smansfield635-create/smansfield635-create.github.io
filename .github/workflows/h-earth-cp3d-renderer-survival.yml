name: H-Earth CP3D Renderer Survival

on:
  pull_request:
    branches: [main]
    paths:
      - 'showroom/globe/h-earth/**'
      - 'h-earth-3d/terrain/h-earth.successor-terrain-field.run8b.js'
      - 'h-earth-3d/validation/h-earth.touch-motion-calibration.cp3d-**'
      - 'h-earth-3d/validation/h-earth.touch-motion-calibration.cp3d1**'
      - 'h-earth-3d/validation/h-earth.c3c1.browser-renderer-survival.harness.mjs'
      - '.github/workflows/h-earth-cp3d-renderer-survival.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cp3d-renderer-survival:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Record and verify executed head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CP3D_EVIDENCE_DIR: h-earth-3d/validation/evidence/cp3d
        run: |
          mkdir -p "$CP3D_EVIDENCE_DIR"
          executed_head="$(git rev-parse HEAD)"
          printf '%s\n' "$executed_head" | tee "$CP3D_EVIDENCE_DIR/cp3d-executed-head.txt"
          printf '%s\n' "$EXPECTED_HEAD" | tee "$CP3D_EVIDENCE_DIR/cp3d-expected-head.txt"
          test "$executed_head" = "$EXPECTED_HEAD"
          git status --short | tee "$CP3D_EVIDENCE_DIR/cp3d-working-tree.txt"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Start exact branch server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/h-earth-cp3d-server.log 2>&1 &
          echo $! > /tmp/h-earth-cp3d-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/showroom/globe/h-earth/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/h-earth-cp3d-server.log
          exit 1

      - name: Reconfirm CP3D_1D_D shared package boundary equality
        env:
          CP3D_ORIGIN: http://127.0.0.1:4173
          CP3D_EVIDENCE_DIR: h-earth-3d/validation/evidence/cp3d
        run: node h-earth-3d/validation/h-earth.touch-motion-calibration.cp3d1d-corrected-cross-runtime-identity.harness.mjs

      - name: Execute promoted renderer identity corridor
        run: node h-earth-3d/validation/h-earth.touch-motion-calibration.cp3d-runtime-identity-corridor.harness.mjs

      - name: Execute C3C1 browser renderer survival
        env:
          CP3D_ORIGIN: http://127.0.0.1:4173
          CP3D_EVIDENCE_DIR: h-earth-3d/validation/evidence/cp3d
        run: node h-earth-3d/validation/h-earth.c3c1.browser-renderer-survival.harness.mjs

      - name: Probe frozen public inspection transport
        env:
          PREVIEW_URL: https://diamondgatebridge.com/preview/h-earth/c3/96805e300510630185b789f799711527408fce2f/
          FROZEN_SHA: 96805e300510630185b789f799711527408fce2f
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --location "$PREVIEW_URL" > /tmp/h-earth-c3c1-preview.html; then
              break
            fi
            sleep 2
          done
          grep -q "$FROZEN_SHA" /tmp/h-earth-c3c1-preview.html
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const previewUrl = process.env.PREVIEW_URL;
          const frozenSha = process.env.FROZEN_SHA;
          const browser = await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--use-gl=swiftshader','--disable-dev-shm-usage']});
          try {
            const page = await browser.newPage({viewport:{width:694,height:747},deviceScaleFactor:1.5,isMobile:true,hasTouch:true});
            const response = await page.goto(previewUrl,{waitUntil:'domcontentloaded',timeout:60000});
            assert.ok(response && response.status() >= 200 && response.status() < 400, `PREVIEW_HTTP_${response?.status()}`);
            const iframe = page.locator('iframe.candidate');
            await iframe.waitFor({state:'attached',timeout:30000});
            const src = await iframe.getAttribute('src');
            assert.ok(src?.includes(frozenSha), 'PREVIEW_NOT_BOUND_TO_FROZEN_SHA');
            const frame = page.frames().find(candidate => candidate.url().includes(frozenSha));
            assert.ok(frame, 'FROZEN_CANDIDATE_FRAME_NOT_LOADED');
            await frame.waitForFunction(() => globalThis.H_EARTH_RUN8E_PUBLIC_ROUTE?.ready === true, null, {timeout:90000});
            await frame.waitForFunction(() => Number(globalThis.H_EARTH_RUN8E_PUBLIC_ROUTE?.getSnapshot?.()?.liveGpu?.counters?.gpuFramebufferPresentationCount ?? 0) >= 1, null, {timeout:90000});
            const facts = await frame.evaluate(() => {
              const canvas = document.getElementById('h-earth-functional-landscape-canvas');
              const snapshot = globalThis.H_EARTH_RUN8E_PUBLIC_ROUTE?.getSnapshot?.();
              return {
                ready: globalThis.H_EARTH_RUN8E_PUBLIC_ROUTE?.ready === true,
                eligible: snapshot?.eligible === true,
                presentations: Number(snapshot?.liveGpu?.counters?.gpuFramebufferPresentationCount ?? 0),
                initialized: snapshot?.liveGpu?.resources?.initialized === true,
                canvas: canvas instanceof HTMLCanvasElement,
                width: canvas?.width ?? 0,
                height: canvas?.height ?? 0
              };
            });
            assert.equal(facts.ready,true,'PREVIEW_RUNTIME_NOT_READY');
            assert.equal(facts.eligible,true,'PREVIEW_RUNTIME_NOT_ELIGIBLE');
            assert.equal(facts.initialized,true,'PREVIEW_RENDERER_NOT_INITIALIZED');
            assert.ok(facts.presentations >= 1,'PREVIEW_NO_PRESENTED_FRAME');
            assert.equal(facts.canvas,true,'PREVIEW_CANVAS_MISSING');
            assert.ok(facts.width > 0 && facts.height > 0,'PREVIEW_CANVAS_DIMENSIONS_INVALID');
            console.log(JSON.stringify({status:'C3C1_FROZEN_PUBLIC_INSPECTION_TRANSPORT_PASS',previewUrl,frozenSha,facts},null,2));
          } finally {
            await browser.close();
          }
          NODE

      - name: Upload CP3D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-cp3d-renderer-survival
          path: |
            h-earth-3d/validation/evidence/cp3d/**
            /tmp/h-earth-cp3d-server.log
            /tmp/h-earth-c3c1-preview.html
          if-no-files-found: error
