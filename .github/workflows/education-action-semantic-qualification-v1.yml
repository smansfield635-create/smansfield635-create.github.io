name: Education Action Semantic Qualification v1
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Qualify bounded Action semantic repair
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=10 origin "$CANDIDATE_SHA" "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "products/education/index.html"
          git show "$CANDIDATE_SHA:products/education/index.html" > /tmp/education.html
          grep -Fq 'accepted:["music","dogs","pizza"]' /tmp/education.html
          grep -Fq 'task.accepted.includes(normalized)' /tmp/education.html
          node <<'NODE'
          const accepted=["music","dogs","pizza"];
          const check=v=>accepted.includes(v.trim().toLowerCase().replace(/[.!?]+$/,"").trim());
          for(const v of ["music","dogs","pizza","Music","DOGS.","pizza!"]) if(!check(v)) throw new Error("EXPECTED_PASS:"+v);
          for(const v of ["do","walk","asdf","123","do.","walking"]) if(check(v)) throw new Error("EXPECTED_RETRY:"+v);
          console.log("ACTION_SEMANTIC_ACCEPTANCE=PASS");
          NODE
          echo "EDUCATION_ACTION_SEMANTIC_QUALIFICATION=PASS"
