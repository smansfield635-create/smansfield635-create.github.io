# content trigger: prospective candidate 005
name: H-Earth R06 C10 Prospective Candidate 005 Construction and Admission
on:
  push:
    branches:
      - control/r06-c10-prospective-candidate-005-construction-and-admission
    paths-ignore:
      - h-earth-3d/control-plane/r06-c10/candidate-admission/executions/prospective-candidate-005/**
permissions:
  contents: write
concurrency:
  group: h-earth-r06-c10-prospective-candidate-005
  cancel-in-progress: false
jobs:
  construct-and-admit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct checksum-bound carrier
        shell: bash
        run: |
          set -euo pipefail
          BASE=.github/ai-router/carriers/r06-c10-prospective-candidate-005
          cat "${BASE}.bundle.part"*.b64 | base64 -d > "${BASE}.bundle.tar.gz"
          cat "${BASE}.operation.part"*.b64 | base64 -d > "${BASE}.operation.sh"
          test "$(sha256sum "${BASE}.bundle.tar.gz" | awk '{print $1}')" = 7b5dae4b11c2e7d48b0ca4b379a7c5cfcb2d644b64d1e34b44d8f4d5f5ba0b6c
          test "$(sha256sum "${BASE}.operation.sh" | awk '{print $1}')" = 0984048596ecca47fa342ad105f9ad15880ad8ae7bfdcefb3b97bd7b6b9e9754
          chmod +x "${BASE}.operation.sh"
      - name: Construct and execute exact gate
        shell: bash
        run: |
          .github/ai-router/carriers/r06-c10-prospective-candidate-005.operation.sh
      - name: Upload construction and admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-r06-c10-prospective-candidate-005-admission
          path: /tmp/r06-c10-prospective-candidate-005/
          if-no-files-found: error
          retention-days: 90
