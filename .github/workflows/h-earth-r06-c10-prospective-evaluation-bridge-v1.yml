name: H-Earth R06 C10 Prospective Evaluation Bridge v1

on:
  push:
    branches:
      - agent/h-earth-r06-c10-prospective-evaluation-bridge-v1-001
    paths:
      - .github/workflows/h-earth-r06-c10-prospective-evaluation-bridge-v1.yml
      - h-earth-3d/tools/r06-c10/h-earth.r06-c10.prospective-candidate-evaluation-bridge.v1.mjs
      - h-earth-3d/control-plane/r06-c10/prospective-evaluation-bridge/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-exact-candidate-003-evaluator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout instrumentation head with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reconstruct exact Candidate 003 members and expose evaluator stack
        shell: bash
        run: |
          set -euo pipefail
          BASE='b1bd82abe9ab5f8a1535cf2e664c6d67ab91dc7f'
          SOURCE='0064e438303e10bcdbc389ce900becc3cddf16c4'
          SUBJECT='ed8267a0251e70c4f654eef90f5e3d7329fdf419'
          ROOT="$RUNNER_TEMP/r06-c10-candidate-003-diagnostic"
          PACKAGE="$ROOT/package"
          OUTPUT="$ROOT/output"
          CHECKOUT="$ROOT/checkout"
          mkdir -p "$PACKAGE" "$OUTPUT"
          git cat-file -e "$BASE^{commit}"
          git cat-file -e "$SOURCE^{commit}"

          python - "$SOURCE" "$PACKAGE" "$OUTPUT" <<'PY'
          import hashlib, json, pathlib, re, subprocess, sys
          source, package_arg, output_arg = sys.argv[1:]
          root = pathlib.Path(package_arg)
          output = pathlib.Path(output_arg)
          root.mkdir(parents=True, exist_ok=True)
          output.mkdir(parents=True, exist_ok=True)
          source_paths = {
            'manifest':'h-earth-3d/control-plane/r06-c10/candidate-admission/h-earth.r06-c10.current-candidate-admission.manifest.v1.json',
            'camera':'h-earth-3d/control-plane/r06-c10/candidate-admission/h-earth.r06-c10.prospective-landform-candidate-002.matched-camera-manifest.v1.json',
            'request':'h-earth-3d/control-plane/r06-c10/candidate-admission/h-earth.r06-c10.prospective-landform-candidate-002.request.v1.json',
            'candidate':'h-earth-3d/terrain/h-earth.r06-c10.prospective-landform-candidate-002.js',
            'field':'h-earth-3d/terrain/h-earth.successor-terrain-field.run8b.js',
            'evaluator':'h-earth-3d/validation/h-earth.r06-c10.prospective-landform-candidate-002.exact-candidate-evaluator.v1.mjs'
          }
          dest_paths = {
            'manifest':'h-earth-3d/control-plane/r06-c10/candidate-admission/h-earth.r06-c10.current-candidate-admission.manifest.v1.json',
            'camera':'h-earth-3d/control-plane/r06-c10/candidate-admission/h-earth.r06-c10.prospective-landform-candidate-003.matched-camera-manifest.v1.json',
            'request':'h-earth-3d/control-plane/r06-c10/candidate-admission/h-earth.r06-c10.prospective-landform-candidate-003.request.v1.json',
            'candidate':'h-earth-3d/terrain/h-earth.r06-c10.prospective-landform-candidate-003.js',
            'field':'h-earth-3d/terrain/h-earth.successor-terrain-field.run8b.js',
            'evaluator':'h-earth-3d/validation/h-earth.r06-c10.prospective-landform-candidate-003.exact-candidate-evaluator.v1.mjs'
          }
          expected_sha256 = {
            'manifest':'d272ea8c6a6d9d1ceb9b5371db1ddc932906d08e9d6178a1a9466a2709485855',
            'camera':'a85f911dd69c5d41f187ec8f16383e4db5fe4c17a6c29d5931a37739e5b7d84d',
            'request':'5c8ba592af05f7b31fb3682d4e585206279e433c939693e038aecdfd465fb783',
            'candidate':'2c717c223ce98aa06605bf24e22960ed2b8517adb569825e0f735c335e4b527e',
            'field':'f2590beb42a97f896465cfdafdbb56f165ebcd217fa7ae4c4b93a27b4926e1c8',
            'evaluator':'666096c9a6ac3cde5456b4ec123fd997e257f37f59062746d7c0cde6ab19f440'
          }
          def show(path):
            return subprocess.check_output(['git','show',f'{source}:{path}'], text=True)
          def write(key, text):
            path = root / dest_paths[key]
            path.parent.mkdir(parents=True, exist_ok=True)
            path.write_text(text)
          def stable(value):
            if isinstance(value, list): return [stable(v) for v in value]
            if isinstance(value, dict): return {k:stable(value[k]) for k in sorted(value)}
            return value
          request = json.loads(show(source_paths['request']))
          request['operationId'] = 'H_EARTH_R06_C10_PROSPECTIVE_LANDFORM_CANDIDATE_CONSTRUCTION_003'
          request_text = json.dumps(request, indent=2, separators=(',', ': ')) + '\n'
          request_hash = hashlib.sha256(json.dumps(stable(request), separators=(',',':')).encode()).hexdigest()
          write('request', request_text)
          camera = json.loads(show(source_paths['camera']))
          camera['candidateId'] = 'H_EARTH_R06_C10_PROSPECTIVE_LANDFORM_CANDIDATE_003'
          write('camera', json.dumps(camera, indent=2) + '\n')
          manifest = json.loads(show(source_paths['manifest']))
          manifest['evaluatorPath'] = dest_paths['evaluator']
          write('manifest', json.dumps(manifest, indent=2) + '\n')
          candidate = show(source_paths['candidate']).replace('002','003')
          candidate = re.sub(r"H_EARTH_R06_C10_PROSPECTIVE_LANDFORM_REQUEST_SHA256='[0-9a-f]{64}'", f"H_EARTH_R06_C10_PROSPECTIVE_LANDFORM_REQUEST_SHA256='{request_hash}'", candidate)
          write('candidate', candidate)
          field = show(source_paths['field']).replace('prospective-landform-candidate-002.js','prospective-landform-candidate-003.js')
          write('field', field)
          evaluator = show(source_paths['evaluator']).replace('002','003')
          evaluator = evaluator.replace("stdout.split('\\n').filter(Boolean).sort()", "stdout.trim().split(/\\r?\\n/).filter(Boolean).sort()")
          evaluator = evaluator.replace("const failure={schema:'H_EARTH_R06_C10_PROSPECTIVE_CANDIDATE_EVALUATOR_FAILURE_v1'", "const failure={schema:'H_EARTH_R06_C10_PROSPECTIVE_CANDIDATE_EVALUATOR_FAILURE_v1',candidateHead:typeof candidateHead==='string'?candidateHead:null,parentHead:typeof parentHead==='string'?parentHead:null")
          write('evaluator', evaluator)
          records = []
          for key, path_string in dest_paths.items():
            data = (root/path_string).read_bytes()
            actual = hashlib.sha256(data).hexdigest()
            records.append({'key':key,'path':path_string,'bytes':len(data),'sha256':actual,'expectedSha256':expected_sha256[key],'pass':actual==expected_sha256[key]})
          (output/'exact-member-identities.json').write_text(json.dumps(records, indent=2)+'\n')
          assert all(r['pass'] for r in records), records
          evaluator_path = root / dest_paths['evaluator']
          diagnostic = evaluator_path.read_text()
          diagnostic = diagnostic.replace("error:error instanceof Error?error.message:String(error),privateStateUsed:false", "error:error instanceof Error?error.message:String(error),stack:error instanceof Error?error.stack:null,privateStateUsed:false")
          evaluator_path.write_text(diagnostic)
          PY

          git worktree add --detach "$CHECKOUT" "$BASE"
          cp -a "$PACKAGE"/. "$CHECKOUT"/
          cd "$CHECKOUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            h-earth-3d/control-plane/r06-c10/candidate-admission/h-earth.r06-c10.current-candidate-admission.manifest.v1.json \
            h-earth-3d/control-plane/r06-c10/candidate-admission/h-earth.r06-c10.prospective-landform-candidate-003.matched-camera-manifest.v1.json \
            h-earth-3d/control-plane/r06-c10/candidate-admission/h-earth.r06-c10.prospective-landform-candidate-003.request.v1.json \
            h-earth-3d/terrain/h-earth.r06-c10.prospective-landform-candidate-003.js \
            h-earth-3d/terrain/h-earth.successor-terrain-field.run8b.js \
            h-earth-3d/validation/h-earth.r06-c10.prospective-landform-candidate-003.exact-candidate-evaluator.v1.mjs
          git commit -m 'Reconstruct Candidate 003 for evaluator diagnosis'
          DIAGNOSTIC_HEAD=$(git rev-parse HEAD)
          CANDIDATE_BLOB=$(git rev-parse HEAD:h-earth-3d/terrain/h-earth.r06-c10.prospective-landform-candidate-003.js)
          FIELD_BLOB=$(git rev-parse HEAD:h-earth-3d/terrain/h-earth.successor-terrain-field.run8b.js)
          GEOMETRY_BLOB=$(git rev-parse HEAD:showroom/globe/h-earth/render/geometry-successor-terrain.run8b.js)
          printf '%s\n' "$DIAGNOSTIC_HEAD" > "$OUTPUT/diagnostic-head.txt"
          cat > "$OUTPUT/terrain-blob-identities.json" <<JSON
          {
            "subjectCandidateHead": "$SUBJECT",
            "diagnosticCarrierHead": "$DIAGNOSTIC_HEAD",
            "candidateTerrainBlob": "$CANDIDATE_BLOB",
            "successorTerrainFieldBlob": "$FIELD_BLOB",
            "geometryConstructorBlob": "$GEOMETRY_BLOB"
          }
          JSON
          python - "$OUTPUT/terrain-blob-identities.json" <<'PY'
          import json, sys
          value=json.load(open(sys.argv[1]))
          assert {value['candidateTerrainBlob'],value['successorTerrainFieldBlob']} == {
            'eb544a41aaa56bdee5d6d92114e85d6b4e6262f3',
            'aa6111a2e37a0ddfd5004a2ec9920a2451f5a4b8'
          }, value
          assert value['geometryConstructorBlob']=='a1a82bc8d61cdeeb2e34d85ab6d590a6f583ea46', value
          PY

          set +e
          H_EARTH_R06_C10_PRIVATE_STATE_ALLOWED=false \
          H_EARTH_R06_C10_GATE_INPUT_CANDIDATE="$DIAGNOSTIC_HEAD" \
          node h-earth-3d/validation/h-earth.r06-c10.prospective-landform-candidate-003.exact-candidate-evaluator.v1.mjs \
            --candidate-head "$DIAGNOSTIC_HEAD" \
            --output "$OUTPUT/direct-evaluator-receipt.json" \
            > "$OUTPUT/direct-evaluator-stdout.log" \
            2> "$OUTPUT/direct-evaluator-stderr.log"
          EVALUATOR_EXIT=$?
          set -e
          printf '%s\n' "$EVALUATOR_EXIT" > "$OUTPUT/direct-evaluator-exit-code.txt"
          cat "$OUTPUT/direct-evaluator-receipt.json"
          python - "$OUTPUT/direct-evaluator-receipt.json" "$EVALUATOR_EXIT" <<'PY'
          import json, sys
          receipt=json.load(open(sys.argv[1]))
          assert int(sys.argv[2]) == 1
          assert receipt['schema']=='H_EARTH_R06_C10_PROSPECTIVE_CANDIDATE_EVALUATOR_FAILURE_v1'
          assert receipt.get('stack')
          assert 'Cannot read properties of undefined' in receipt.get('error','')
          PY

      - name: Upload exact diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-r06-c10-candidate-003-evaluator-diagnostic
          path: ${{ runner.temp }}/r06-c10-candidate-003-diagnostic/output
          if-no-files-found: error
          retention-days: 90
