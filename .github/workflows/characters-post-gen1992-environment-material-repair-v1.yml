name: Characters Post-Gen1998 Canopy Hydrology Relation Diagnostic v1

on:
  pull_request:
    paths:
      - 'control-plane/whole-estate/characters-reconstruction-v1/post-gen1992-environment-material-repair-contract.v1.json'
      - 'control-plane/whole-estate/characters-reconstruction-v1/verify-post-gen1992-environment-material-repair.v1.mjs'
      - '.github/workflows/characters-post-gen1992-environment-material-repair-v1.yml'

permissions:
  contents: read

env:
  OPERATION_ID: MIRRORLAND_POST_GEN1998_CANOPY_HYDROLOGY_RELATION_DIAGNOSTIC_20260908_001
  LOCK_GENERATION: '2000'
  GOVERNING_MAIN: 8f97bb035dce439cf28ca156b2fcd5bdfc6a1953
  READ_ONLY_SUBJECT: 6363182d880fc3e0d0fb0da7791aa9e641969e0a
  REQUIRED_BRANCH: diagnostic/post-gen1998-canopy-hydrology-relation-20260908-001
  PROTECTED_APP_BLOB: cb7e01ad703ae52b756a4603176bfe6d3b4f5e8a
  V5_BLOB: f3b64eb1ffc1c1bc8e908ff96eb6c833b6bc928d
  V2_TOOLING_HEAD: 834038c23711c3eed83dc21964027bd515852b51
  V2_CONTRACT_BLOB: 84014a5a51a50d43e86c9e4f54bb0804d3655af1
  V2_VERIFIER_BLOB: 6a7007cb37d04ea5af3542783342043c5c0a5829
  V2_WORKFLOW_BLOB: 77b5b2e460adb86a123437c6eeb8d36ea8da5ba2

jobs:
  exact-post-gen1998-read-only-relation-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Materialize exact diagnostic branch with bounded sparse index
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.head_ref }}" = "$REQUIRED_BRANCH"
          mkdir -p candidate
          git -C candidate init
          git -C candidate remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C candidate -c protocol.version=2 fetch --no-tags --depth=64 --filter=blob:none origin \
            "${{ github.event.pull_request.head.sha }}" "$READ_ONLY_SUBJECT" "$GOVERNING_MAIN"
          git -C candidate sparse-checkout init --cone --sparse-index
          git -C candidate sparse-checkout set \
            characters \
            control-plane/whole-estate/characters-reconstruction-v1 \
            .github/workflows \
            h-earth-3d/terrain \
            h-earth-3d/integration \
            h-earth-3d/control-plane/run-8 \
            h-earth-3d/zones \
            h-earth-3d/cells \
            h-earth-3d/objects \
            showroom/globe/h-earth/render
          git -C candidate checkout --detach "${{ github.event.pull_request.head.sha }}"
          test "$(git -C candidate rev-parse HEAD^{commit})" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C candidate config --bool index.sparse)" = "true"
          test "$(git -C candidate config --bool core.sparseCheckoutCone)" = "true"
          test "$(git -C candidate ls-remote origin refs/heads/main | awk '{print $1}')" = "$GOVERNING_MAIN"

      - name: Prove subject ancestry exact three-path scope and product immutability
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git -C candidate rev-parse HEAD^{commit})"
          git -C candidate merge-base --is-ancestor "$READ_ONLY_SUBJECT" "$HEAD_SHA"
          mapfile -t CHANGED < <(git -C candidate diff --name-only "$READ_ONLY_SUBJECT"..."$HEAD_SHA" | sort)
          EXPECTED=(
            '.github/workflows/characters-post-gen1992-environment-material-repair-v1.yml'
            'control-plane/whole-estate/characters-reconstruction-v1/post-gen1992-environment-material-repair-contract.v1.json'
            'control-plane/whole-estate/characters-reconstruction-v1/verify-post-gen1992-environment-material-repair.v1.mjs'
          )
          mapfile -t EXPECTED_SORTED < <(printf '%s\n' "${EXPECTED[@]}" | sort)
          test "${#CHANGED[@]}" -eq 3
          for i in "${!EXPECTED_SORTED[@]}"; do test "${CHANGED[$i]}" = "${EXPECTED_SORTED[$i]}"; done
          test -z "$(git -C candidate diff --name-only "$READ_ONLY_SUBJECT"..."$HEAD_SHA" -- characters)"
          test "$(git -C candidate rev-parse "$READ_ONLY_SUBJECT:characters/app.mjs")" = "$PROTECTED_APP_BLOB"
          test "$(git -C candidate rev-parse "HEAD:characters/app.mjs")" = "$PROTECTED_APP_BLOB"
          test "$(git -C candidate rev-parse "$READ_ONLY_SUBJECT:characters/vegetation-representation.mjs")" = "$V5_BLOB"
          test "$(git -C candidate rev-parse "HEAD:characters/vegetation-representation.mjs")" = "$V5_BLOB"
          test -z "$(git -C candidate status --porcelain)"
          echo "CANDIDATE_HEAD=$HEAD_SHA" >> "$GITHUB_ENV"

      - name: Materialize exact immutable Gen1992 V2 tooling with bounded sparse index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v2-tooling
          git -C v2-tooling init
          git -C v2-tooling remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C v2-tooling -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$V2_TOOLING_HEAD"
          git -C v2-tooling sparse-checkout init --cone --sparse-index
          git -C v2-tooling sparse-checkout set control-plane/whole-estate/characters-reconstruction-v1 .github/workflows
          git -C v2-tooling checkout --detach FETCH_HEAD
          test "$(git -C v2-tooling rev-parse HEAD^{commit})" = "$V2_TOOLING_HEAD"
          test "$(git -C v2-tooling config --bool index.sparse)" = "true"
          test "$(git -C v2-tooling config --bool core.sparseCheckoutCone)" = "true"
          test "$(git -C v2-tooling hash-object control-plane/whole-estate/characters-reconstruction-v1/gen1983-camera-space-environment-diagnostics-v2-contract.v1.json)" = "$V2_CONTRACT_BLOB"
          test "$(git -C v2-tooling hash-object control-plane/whole-estate/characters-reconstruction-v1/verify-gen1983-camera-space-environment-diagnostics-v2.v1.mjs)" = "$V2_VERIFIER_BLOB"
          test "$(git -C v2-tooling hash-object .github/workflows/characters-gen1983-camera-space-environment-diagnostics-v2-v1.yml)" = "$V2_WORKFLOW_BLOB"
          test -z "$(git -C v2-tooling status --porcelain)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Freeze-format validate diagnostic contract and verifier
        shell: bash
        run: |
          set -euo pipefail
          node --check candidate/control-plane/whole-estate/characters-reconstruction-v1/verify-post-gen1992-environment-material-repair.v1.mjs
          node -e "JSON.parse(require('fs').readFileSync('candidate/control-plane/whole-estate/characters-reconstruction-v1/post-gen1992-environment-material-repair-contract.v1.json','utf8'))"
          mkdir -p "$RUNNER_TEMP/post-gen1998-relation-diagnostic"

      - name: Execute read-only relation diagnostic process one
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          node control-plane/whole-estate/characters-reconstruction-v1/verify-post-gen1992-environment-material-repair.v1.mjs \
            --output "$RUNNER_TEMP/post-gen1998-relation-diagnostic/diagnostic-receipt.json"

      - name: Execute read-only relation diagnostic process two
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          node control-plane/whole-estate/characters-reconstruction-v1/verify-post-gen1992-environment-material-repair.v1.mjs \
            --output "$RUNNER_TEMP/post-gen1998-relation-diagnostic/diagnostic-repeat-receipt.json"
          cmp "$RUNNER_TEMP/post-gen1998-relation-diagnostic/diagnostic-receipt.json" "$RUNNER_TEMP/post-gen1998-relation-diagnostic/diagnostic-repeat-receipt.json"

      - name: Run immutable V2 evaluator as post-diagnostic comparison only
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node v2-tooling/control-plane/whole-estate/characters-reconstruction-v1/verify-gen1983-camera-space-environment-diagnostics-v2.v1.mjs \
            --product-root candidate \
            --output "$RUNNER_TEMP/post-gen1998-relation-diagnostic/v2-subject-receipt.json"
          status=$?
          set -e
          test "$status" = 1

      - name: Independently verify diagnostic receipt process one
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          node control-plane/whole-estate/characters-reconstruction-v1/verify-post-gen1992-environment-material-repair.v1.mjs \
            --mode verify-receipt \
            --receipt "$RUNNER_TEMP/post-gen1998-relation-diagnostic/diagnostic-receipt.json" \
            --v2-receipt "$RUNNER_TEMP/post-gen1998-relation-diagnostic/v2-subject-receipt.json" \
            --output "$RUNNER_TEMP/post-gen1998-relation-diagnostic/verification-receipt.json"

      - name: Independently verify diagnostic receipt process two
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          node control-plane/whole-estate/characters-reconstruction-v1/verify-post-gen1992-environment-material-repair.v1.mjs \
            --mode verify-receipt \
            --receipt "$RUNNER_TEMP/post-gen1998-relation-diagnostic/diagnostic-repeat-receipt.json" \
            --v2-receipt "$RUNNER_TEMP/post-gen1998-relation-diagnostic/v2-subject-receipt.json" \
            --output "$RUNNER_TEMP/post-gen1998-relation-diagnostic/verification-repeat-receipt.json"
          cmp "$RUNNER_TEMP/post-gen1998-relation-diagnostic/verification-receipt.json" "$RUNNER_TEMP/post-gen1998-relation-diagnostic/verification-repeat-receipt.json"

      - name: Enforce diagnostic-only closure boundary
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const root=process.env.RUNNER_TEMP+'/post-gen1998-relation-diagnostic/';
          const diagnostic=JSON.parse(fs.readFileSync(root+'diagnostic-receipt.json','utf8'));
          const verification=JSON.parse(fs.readFileSync(root+'verification-receipt.json','utf8'));
          if(diagnostic.result!=='PASS_CLOSED'||diagnostic.failCount!==0)process.exit(1);
          if(verification.result!=='PASS_CLOSED'||verification.failCount!==0)process.exit(1);
          if(diagnostic.productMechanicalState!=='NON_CLEAR'||verification.productMechanicalState!=='NON_CLEAR')process.exit(1);
          if(diagnostic.materialDisposition!=='UNASSIGNED'||verification.materialDisposition!=='UNASSIGNED')process.exit(1);
          if(diagnostic.productRepairAuthority||diagnostic.mergeAuthority||diagnostic.deploymentAuthority||diagnostic.publicationAuthority)process.exit(1);
          if(diagnostic.samplingProof?.repairCoordinatesExported!==false)process.exit(1);
          NODE
          test -z "$(git -C candidate diff --name-only "$READ_ONLY_SUBJECT"..."$CANDIDATE_HEAD" -- characters)"
          test -z "$(git -C candidate status --porcelain)"
          test -z "$(git -C v2-tooling status --porcelain)"

      - name: Upload Gen2000 diagnostic receipts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-gen1998-canopy-hydrology-relation-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/post-gen1998-relation-diagnostic/*.json
          if-no-files-found: warn
          retention-days: 90
