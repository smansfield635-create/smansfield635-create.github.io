name: Compass Tests Architecture Binding Exact Head Certification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/compass-tests-architecture-binding-v1-exact-head-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SUBJECT_HEAD: a0b5951855277cb5f8ed99437e058777da0f096b
  SUBJECT_BRANCH: agent/compass-tests-architecture-binding-v1
  PACKAGE: control-plane/whole-estate/compass-tests-architecture-binding-v1
  EXPECTED_VERIFIER_BLOB: 0d545b99ac135026adb3e4c9fc664bec6a723b0c

jobs:
  exact-head-binding-certification:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact frozen binding subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact subject, branch identity, committed verifier, and binding package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_HEAD"
          git fetch origin "$SUBJECT_BRANCH" --quiet
          test "$(git rev-parse FETCH_HEAD)" = "$SUBJECT_HEAD"
          test "$(git rev-parse HEAD:$PACKAGE/verify.v1.mjs)" = "$EXPECTED_VERIFIER_BLOB"
          node "$PACKAGE/verify.v1.mjs" | tee /tmp/compass-tests-binding-verifier.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const v=JSON.parse(fs.readFileSync('/tmp/compass-tests-binding-verifier.json','utf8'));
          if(v.result!=='PASS_COMPASS_TESTS_ARCHITECTURE_BINDING_v1')throw Error('BINDING_RESULT_NOT_PASS');
          if(v.assertions!==133)throw Error(`ASSERTION_COUNT:${v.assertions}`);
          if(v.requiredCapabilities!==9||v.admittedWithAdapter!==9)throw Error('CAPABILITY_ADMISSION_MISMATCH');
          if(v.constructionAuthorized!==false)throw Error('CONSTRUCTION_AUTHORITY_ESCALATION');
          const receipt={
            schema:'COMPASS_TESTS_ARCHITECTURE_BINDING_EXACT_HEAD_CERTIFICATION_RECEIPT_v1',
            operation:'COMPASS_TESTS_ARCHITECTURE_BINDING_v1',
            validationSubjectHead:process.env.SUBJECT_HEAD,
            validationSubjectBranch:process.env.SUBJECT_BRANCH,
            committedVerifierBlob:process.env.EXPECTED_VERIFIER_BLOB,
            verifierResult:v.result,
            assertions:v.assertions,
            requiredCapabilities:v.requiredCapabilities,
            admittedWithAdapter:v.admittedWithAdapter,
            constructionAuthorized:false,
            publicMutation:false,
            scientificClaimUpgrade:false,
            result:'PASS_CLOSED_EXACT_HEAD_BINDING_CERTIFICATION'
          };
          fs.writeFileSync('/tmp/compass-tests-binding-exact-head-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          NODE

      - name: Upload exact-head certification receipt
        uses: actions/upload-artifact@v4
        with:
          name: compass-tests-architecture-binding-v1-exact-head-certification
          path: |
            /tmp/compass-tests-binding-verifier.json
            /tmp/compass-tests-binding-exact-head-receipt.json
          if-no-files-found: error
