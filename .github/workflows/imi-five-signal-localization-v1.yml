name: IMI five-signal localization v1
on:
  pull_request:
    paths:
      - 'research/imi/IMI_FIVE_SIGNAL_LOCALIZATION_PROTOCOL_v1.md'
      - 'research/imi/imi_five_signal_localization_v1.py'
      - '.github/workflows/imi-five-signal-localization-v1.yml'
  workflow_dispatch:
jobs:
  localization:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            research/imi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: pip install numpy pandas scikit-learn lightgbm requests
      - name: Execute frozen five-signal localization
        run: python research/imi/imi_five_signal_localization_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imi-five-signal-localization-v1
          path: |
            imi_five_signal_localization_findings_v1.json
            IMI_FIVE_SIGNAL_LOCALIZATION_VERDICT_v1.txt
            imi_five_signal_localization_temporal_predictions_v1.csv
