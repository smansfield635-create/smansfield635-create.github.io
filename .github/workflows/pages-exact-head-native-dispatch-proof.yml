name: Exact Head Pages Native Dispatch Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-exact-head-native-dispatch-proof.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  prove-native-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Require native workflow_dispatch acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(curl --fail-with-body --silent --show-error -L -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          payload="$(jq -n --arg ref main --arg sha "$main_sha" --arg surface audralia '{ref:$ref,inputs:{target_sha:$sha,surface_id:$surface}}')"
          status="$(curl --silent --show-error -o /tmp/dispatch-response.json -w '%{http_code}' -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages-exact-head-deploy-v3.yml/dispatches" -d "$payload")"
          if [ "$status" != "204" ]; then
            cat /tmp/dispatch-response.json >&2 || true
            echo "NATIVE_WORKFLOW_DISPATCH_REJECTED status=$status workflow=pages-exact-head-deploy-v3.yml" >&2
            exit 1
          fi
          echo "NATIVE_WORKFLOW_DISPATCH_ACCEPTED workflow=pages-exact-head-deploy-v3.yml target=$main_sha surface=audralia"
