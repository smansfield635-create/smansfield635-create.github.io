name: H-Earth C2-R1 Complete World Integration

on:
  workflow_dispatch:
    inputs:
      expected_candidate_head:
        required: true
        type: string
  pull_request:
    branches: [integration/h-earth-c2-r1-baseline-001]
    paths:
      - '.github/workflows/h-earth-c2-r1-complete-world-integration.yml'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/h-earth.c2-r1.allowed-path-manifest.json'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/**'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.complete-world-integration.mjs'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/complete-world/**'

permissions:
  contents: read

env:
  EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.expected_candidate_head }}
  REVIEW_URL: http://127.0.0.1:4188/h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/index.html
  PLAYWRIGHT_VERSION: 1.55.0

jobs:
  exact-head-and-static-construction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Verify exact identities and path boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin rollback/h-earth-c2-r1-real-package-adapter-start-001:refs/remotes/origin/rollback/h-earth-c2-r1-real-package-adapter-start-001
          git fetch origin rollback/h-earth-c2-r1-startup-performance-start-001:refs/remotes/origin/rollback/h-earth-c2-r1-startup-performance-start-001
          git fetch origin rollback/h-earth-c2-r1-visible-frame-color-start-001:refs/remotes/origin/rollback/h-earth-c2-r1-visible-frame-color-start-001
          test "$(git rev-parse origin/rollback/h-earth-c2-r1-real-package-adapter-start-001)" = 8d41e4eb85a8ef6a2162e46c2bc5d0a92892dc55
          test "$(git rev-parse origin/rollback/h-earth-c2-r1-startup-performance-start-001)" = f171852f3b453a1535fc29ed2798430814351084
          test "$(git rev-parse origin/rollback/h-earth-c2-r1-visible-frame-color-start-001)" = a699c5a64e2bf54d950a69c839c3d9ee41b6514f

          printf '%s\n' \
            .github/workflows/h-earth-c2-r1-complete-world-integration.yml \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/complete-world/h-earth.c2-r1.complete-world-operation-ledger.json \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/complete-world/h-earth.c2-r1.complete-world-role3-entry.json \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/complete-world-render-package.js \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/complete-world.js \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.complete-world-integration.mjs | sort > /tmp/expected-prior-six
          git diff --name-only 8d41e4eb85a8ef6a2162e46c2bc5d0a92892dc55...origin/rollback/h-earth-c2-r1-visible-frame-color-start-001 | sort > /tmp/actual-prior-six
          diff -u /tmp/expected-prior-six /tmp/actual-prior-six

          printf '%s\n' \
            .github/workflows/h-earth-c2-r1-complete-world-integration.yml \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/complete-world-persistent-renderer.js | sort > /tmp/expected-visible-frame-two
          git diff --name-only a699c5a64e2bf54d950a69c839c3d9ee41b6514f...HEAD | sort > /tmp/actual-visible-frame-two
          diff -u /tmp/expected-visible-frame-two /tmp/actual-visible-frame-two

          printf '%s\n' \
            .github/workflows/h-earth-c2-r1-complete-world-integration.yml \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/complete-world/h-earth.c2-r1.complete-world-operation-ledger.json \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/complete-world/h-earth.c2-r1.complete-world-role3-entry.json \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/complete-world/h-earth.c2-r1.complete-world-source-custody.json \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/h-earth.c2-r1.allowed-path-manifest.json \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/complete-world-persistent-renderer.js \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/complete-world-render-package.js \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/complete-world.js \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/identity.json \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/index.html \
            h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.complete-world-integration.mjs | sort > /tmp/expected-eleven
          git diff --name-only e03f211a472fd564b1ed4b8a00096c923a077528...HEAD | sort > /tmp/actual-eleven
          diff -u /tmp/expected-eleven /tmp/actual-eleven
      - name: Run synthetic and exact-cache integration tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/static"
          node h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.complete-world-integration.mjs | tee "$RUNNER_TEMP/static/static-test.log"
          sha256sum "$RUNNER_TEMP/static/static-test.log" > "$RUNNER_TEMP/static/static-test.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: h-earth-c2-r1-complete-world-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/static
          if-no-files-found: error
          retention-days: 30

  browser-execution-transport:
    needs: exact-head-and-static-construction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Provision exact-head same-origin browser host
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p "$RUNNER_TEMP/browser/runtime" "$RUNNER_TEMP/browser/artifacts"
          cd "$RUNNER_TEMP/browser/runtime"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
          python3 -m http.server 4188 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" >"$RUNNER_TEMP/browser/artifacts/server.log" 2>&1 &
          for attempt in $(seq 1 60); do curl -fsS "$REVIEW_URL" >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Execute desktop and touch mobile visible-world matrix
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/browser/runtime/verify.mjs" <<'SCRIPT'
          import fs from 'node:fs';
          import path from 'node:path';
          import process from 'node:process';
          import { chromium } from 'playwright';

          const out = path.join(process.env.RUNNER_TEMP, 'browser/artifacts');
          const check = (value, code, detail = null) => {
            if (!value) {
              const error = new Error(code);
              error.detail = detail;
              throw error;
            }
          };
          const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));

          const VISUAL_THRESHOLDS = Object.freeze({
            minimumIntermediatePixelRatio: 0.05,
            minimumNonBackgroundIntermediatePixelRatio: 0.005,
            maximumBlackPixelRatio: 0.90,
            maximumWhitePixelRatio: 0.90,
            minimumMeanRgbVariance: 0.0005,
            minimumNonBackgroundPixelRatio: 0.01,
            minimumEffectiveLuminanceBands: 3,
            minimumEffectiveRgbBands: 3,
            effectiveBandMinimumRatio: 0.001
          });

          function evaluatePixelBytes(pixels, width, height, backgroundRgb) {
            const pixelCount = width * height;
            if (!(pixelCount > 0) || pixels.length !== pixelCount * 4) {
              throw new Error('FRAMEBUFFER_READBACK_LENGTH_INVALID');
            }
            if (!Array.isArray(backgroundRgb) || backgroundRgb.length !== 3 ||
                backgroundRgb.some(value => !Number.isFinite(value))) {
              throw new Error('FRAMEBUFFER_BACKGROUND_REFERENCE_INVALID');
            }

            let blackPixelCount = 0;
            let whitePixelCount = 0;
            let intermediatePixelCount = 0;
            let nonBackgroundPixelCount = 0;
            let nonBackgroundIntermediatePixelCount = 0;
            const sums = [0, 0, 0];
            const squaredSums = [0, 0, 0];
            const luminanceBands = new Array(16).fill(0);
            const rgbBands = new Map();

            for (let offset = 0; offset < pixels.length; offset += 4) {
              const bytes = [pixels[offset], pixels[offset + 1], pixels[offset + 2]];
              const rgb = bytes.map(value => value / 255);
              const luminance = rgb[0] * 0.2126 + rgb[1] * 0.7152 + rgb[2] * 0.0722;
              if (luminance <= 0.02) blackPixelCount += 1;
              if (luminance >= 0.98) whitePixelCount += 1;
              const intermediate = luminance >= 0.08 && luminance <= 0.92;
              if (intermediate) intermediatePixelCount += 1;

              const backgroundDistance = Math.hypot(
                bytes[0] - backgroundRgb[0],
                bytes[1] - backgroundRgb[1],
                bytes[2] - backgroundRgb[2]
              );
              const nonBackground = backgroundDistance > 12;
              if (nonBackground) {
                nonBackgroundPixelCount += 1;
                if (intermediate) nonBackgroundIntermediatePixelCount += 1;
              }

              for (let channel = 0; channel < 3; channel += 1) {
                sums[channel] += rgb[channel];
                squaredSums[channel] += rgb[channel] * rgb[channel];
              }

              const luminanceBand = Math.min(15, Math.floor(luminance * 16));
              luminanceBands[luminanceBand] += 1;
              const rgbBand = `${bytes[0] >> 5}:${bytes[1] >> 5}:${bytes[2] >> 5}`;
              rgbBands.set(rgbBand, (rgbBands.get(rgbBand) ?? 0) + 1);
            }

            const means = sums.map(value => value / pixelCount);
            const variances = squaredSums.map((value, channel) =>
              Math.max(0, value / pixelCount - means[channel] * means[channel])
            );
            const minimumEffectiveCount = Math.max(
              1,
              Math.ceil(pixelCount * VISUAL_THRESHOLDS.effectiveBandMinimumRatio)
            );

            return {
              width,
              height,
              pixelCount,
              backgroundRgb,
              blackPixelCount,
              blackPixelRatio: blackPixelCount / pixelCount,
              whitePixelCount,
              whitePixelRatio: whitePixelCount / pixelCount,
              intermediatePixelCount,
              intermediatePixelRatio: intermediatePixelCount / pixelCount,
              nonBackgroundPixelCount,
              nonBackgroundPixelRatio: nonBackgroundPixelCount / pixelCount,
              nonBackgroundIntermediatePixelCount,
              nonBackgroundIntermediatePixelRatio:
                nonBackgroundIntermediatePixelCount / pixelCount,
              channelMeans: means,
              channelVariances: variances,
              meanRgbVariance: variances.reduce((sum, value) => sum + value, 0) / 3,
              effectiveLuminanceBandCount:
                luminanceBands.filter(count => count >= minimumEffectiveCount).length,
              effectiveRgbBandCount:
                [...rgbBands.values()].filter(count => count >= minimumEffectiveCount).length,
              luminanceBandCounts: luminanceBands,
              effectiveBandMinimumPixelCount: minimumEffectiveCount
            };
          }

          function visualMetricFailures(metrics) {
            const failures = [];
            if (metrics.intermediatePixelRatio <
                VISUAL_THRESHOLDS.minimumIntermediatePixelRatio) {
              failures.push('INTERMEDIATE_LUMINANCE_INSUFFICIENT');
            }
            if (metrics.nonBackgroundIntermediatePixelRatio <
                VISUAL_THRESHOLDS.minimumNonBackgroundIntermediatePixelRatio) {
              failures.push('NONBACKGROUND_MIDTONE_CONTENT_INSUFFICIENT');
            }
            if (metrics.blackPixelRatio >= VISUAL_THRESHOLDS.maximumBlackPixelRatio) {
              failures.push('NEAR_TOTAL_BLACK_FRAME_DOMINANCE');
            }
            if (metrics.whitePixelRatio >= VISUAL_THRESHOLDS.maximumWhitePixelRatio) {
              failures.push('NEAR_TOTAL_WHITE_FRAME_DOMINANCE');
            }
            if (metrics.meanRgbVariance < VISUAL_THRESHOLDS.minimumMeanRgbVariance) {
              failures.push('RGB_COLOR_VARIANCE_INSUFFICIENT');
            }
            if (metrics.nonBackgroundPixelRatio <
                VISUAL_THRESHOLDS.minimumNonBackgroundPixelRatio) {
              failures.push('NONBACKGROUND_GEOMETRY_OCCUPANCY_INSUFFICIENT');
            }
            if (metrics.effectiveLuminanceBandCount <
                VISUAL_THRESHOLDS.minimumEffectiveLuminanceBands) {
              failures.push('EFFECTIVE_LUMINANCE_BANDS_INSUFFICIENT');
            }
            if (metrics.effectiveRgbBandCount <
                VISUAL_THRESHOLDS.minimumEffectiveRgbBands) {
              failures.push('EFFECTIVE_RGB_COLOR_BANDS_INSUFFICIENT');
            }
            return failures;
          }

          function assertVisibleWorld(metrics, label) {
            const failures = visualMetricFailures(metrics);
            check(failures.length === 0, `VISIBLE_WORLD_METRICS_FAILED:${label}`, {
              failures,
              thresholds: VISUAL_THRESHOLDS,
              metrics
            });
          }

          function executeNegativeRegressionFixture() {
            const width = 10;
            const height = 10;
            const pixels = new Uint8Array(width * height * 4);
            for (let index = 0; index < width * height; index += 1) {
              const black = index < 60;
              const offset = index * 4;
              pixels[offset] = black ? 0 : 255;
              pixels[offset + 1] = black ? 0 : 255;
              pixels[offset + 2] = black ? 0 : 255;
              pixels[offset + 3] = 255;
            }
            const metrics = evaluatePixelBytes(pixels, width, height, [255, 255, 255]);
            const failures = visualMetricFailures(metrics);
            check(
              failures.includes('INTERMEDIATE_LUMINANCE_INSUFFICIENT') &&
              failures.includes('NONBACKGROUND_MIDTONE_CONTENT_INSUFFICIENT') &&
              failures.includes('EFFECTIVE_RGB_COLOR_BANDS_INSUFFICIENT'),
              'NEGATIVE_REGRESSION_FIXTURE_FALSE_PASS',
              { failures, metrics }
            );
            return {
              fixtureClass: 'BLACK_GEOMETRY_WHITE_BACKGROUND',
              priorFalsePass: true,
              updatedVerifierResult: 'FAIL_AS_REQUIRED',
              failures,
              metrics
            };
          }

          async function readVisualMetrics(page) {
            const metricFunctionSource = evaluatePixelBytes.toString();
            return page.evaluate(({ metricFunctionSource }) => {
              const canvas = document.getElementById('complete-world-canvas');
              const gl = canvas?.getContext('webgl2');
              if (!gl) throw new Error('FRAMEBUFFER_WEBGL2_CONTEXT_MISSING');
              const webglErrorBeforeReadback = gl.getError();
              const width = gl.drawingBufferWidth;
              const height = gl.drawingBufferHeight;
              const pixels = new Uint8Array(width * height * 4);
              gl.readPixels(0, 0, width, height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
              const webglErrorAfterReadback = gl.getError();
              const authorityColor =
                window.H_EARTH_C2_R1_COMPLETE_WORLD?.packageRecord
                  ?.environmentDefaults?.skyHorizonColor;
              if (!Array.isArray(authorityColor) || authorityColor.length < 3) {
                throw new Error('FRAMEBUFFER_BACKGROUND_AUTHORITY_MISSING');
              }
              const backgroundRgb = authorityColor.slice(0, 3).map(value =>
                Math.round(Math.min(255, Math.max(0, Number(value))))
              );
              const evaluator = (0, eval)(`(${metricFunctionSource})`);
              return {
                webglErrorBeforeReadback,
                webglErrorAfterReadback,
                metrics: evaluator(pixels, width, height, backgroundRgb)
              };
            }, { metricFunctionSource });
          }

          async function touch(page, steps) {
            await page.evaluate(async rows => {
              const canvas = document.getElementById('complete-world-canvas');
              for (const row of rows) {
                for (const point of row.points) {
                  const released = row.type === 'pointerup';
                  canvas.dispatchEvent(new PointerEvent(row.type, {
                    bubbles: true,
                    cancelable: true,
                    pointerId: point.id,
                    pointerType: 'touch',
                    isPrimary: point.id === 1,
                    clientX: point.x,
                    clientY: point.y,
                    buttons: released ? 0 : 1,
                    pressure: released ? 0 : 0.5
                  }));
                }
                await new Promise(resolve => setTimeout(resolve, row.wait ?? 80));
              }
            }, steps);
          }

          async function interact(page, mobile) {
            if (!mobile) {
              const box = await page.locator('#complete-world-canvas').boundingBox();
              check(box, 'CANVAS_BOX_MISSING');
              const x = box.x + box.width / 2;
              const y = box.y + box.height / 2;
              await page.mouse.move(x, y);
              await page.mouse.down();
              await page.mouse.move(x + 120, y, { steps: 12 });
              await page.mouse.up();
              await page.mouse.wheel(0, -240);
              await wait(250);
              return;
            }
            await touch(page, [
              { type: 'pointerdown', points: [{ id: 1, x: 110, y: 220 }] },
              { type: 'pointermove', points: [{ id: 1, x: 205, y: 220 }], wait: 380 },
              { type: 'pointerup', points: [{ id: 1, x: 205, y: 220 }] }
            ]);
            await touch(page, [
              { type: 'pointerdown', points: [{ id: 1, x: 105, y: 360 }, { id: 2, x: 225, y: 360 }] },
              { type: 'pointermove', points: [{ id: 1, x: 105, y: 275 }, { id: 2, x: 225, y: 275 }], wait: 420 },
              { type: 'pointerup', points: [{ id: 1, x: 105, y: 275 }, { id: 2, x: 225, y: 275 }] }
            ]);
            await touch(page, [
              { type: 'pointerdown', points: [{ id: 1, x: 125, y: 330 }, { id: 2, x: 205, y: 330 }] },
              { type: 'pointermove', points: [{ id: 1, x: 70, y: 330 }, { id: 2, x: 260, y: 330 }], wait: 420 },
              { type: 'pointerup', points: [{ id: 1, x: 70, y: 330 }, { id: 2, x: 260, y: 330 }] }
            ]);
          }

          const negativeRegressionFixture = executeNegativeRegressionFixture();
          fs.writeFileSync(
            path.join(out, 'negative-regression-fixture.json'),
            JSON.stringify(negativeRegressionFixture, null, 2)
          );

          async function run(browser, scenario) {
            const context = await browser.newContext({
              viewport: scenario.viewport,
              deviceScaleFactor: scenario.dpr,
              isMobile: scenario.mobile,
              hasTouch: scenario.mobile
            });
            await context.tracing.start({ screenshots: true, snapshots: true, sources: true });
            const page = await context.newPage();
            const consoleRecords = [];
            const pageErrors = [];
            const requestFailures = [];
            const httpRecords = [];
            page.on('console', message =>
              consoleRecords.push({ type: message.type(), text: message.text() })
            );
            page.on('pageerror', error => pageErrors.push({ message: error.message }));
            page.on('requestfailed', request =>
              requestFailures.push({ url: request.url(), failure: request.failure() })
            );
            page.on('response', response =>
              httpRecords.push({
                url: response.url(),
                status: response.status(),
                contentType: response.headers()['content-type'] ?? null
              })
            );

            try {
              const started = Date.now();
              await page.goto(process.env.REVIEW_URL, {
                waitUntil: 'domcontentloaded',
                timeout: 120000
              });
              await page.waitForFunction(() => {
                const state = window.H_EARTH_C2_R1_COMPLETE_WORLD;
                return state?.ready === true || state?.failed === true;
              }, null, { timeout: 120000, polling: 250 });
              const startupMilliseconds = Date.now() - started;
              const startup = await page.evaluate(() => {
                const state = window.H_EARTH_C2_R1_COMPLETE_WORLD;
                return state.failed
                  ? { failed: true, value: state.getFailureReceipt() }
                  : { failed: false, value: state.getReceipt() };
              });
              check(
                !startup.failed,
                startup.value.rootRejectionCode ?? 'RUNTIME_FAILED',
                startup.value
              );
              const before = startup.value;
              check(startupMilliseconds <= 120000, 'STARTUP_BUDGET_EXCEEDED', {
                startupMilliseconds
              });
              check(
                before.packageBinding.counters.constructionMilliseconds <= 105000,
                'CONSTRUCTION_BUDGET_EXCEEDED',
                before.packageBinding.counters
              );
              check(
                before.packageIdentity === 'H_EARTH_C2_R1_COMPLETE_WORLD_PACKAGE_218F37AE',
                'PACKAGE_IDENTITY_MISMATCH',
                before.packageIdentity
              );
              check(
                before.packageContentDigest === 'fnv1a32:218f37ae',
                'PACKAGE_CONTENT_DIGEST_MISMATCH',
                before.packageContentDigest
              );

              const beforeVisual = await readVisualMetrics(page);
              check(
                beforeVisual.webglErrorBeforeReadback === 0 &&
                beforeVisual.webglErrorAfterReadback === 0,
                'WEBGL_ERROR_AFTER_STARTUP',
                beforeVisual
              );
              assertVisibleWorld(beforeVisual.metrics, `${scenario.name}:BEFORE_INPUT`);
              await page.screenshot({
                path: path.join(out, `${scenario.name}-before.png`),
                fullPage: true
              });

              await interact(page, scenario.mobile);
              const after = await page.evaluate(() =>
                window.H_EARTH_C2_R1_COMPLETE_WORLD.getReceipt()
              );
              const afterVisual = await readVisualMetrics(page);
              check(
                afterVisual.webglErrorBeforeReadback === 0 &&
                afterVisual.webglErrorAfterReadback === 0,
                'WEBGL_ERROR_AFTER_VISIBLE_FRAME_ADVANCEMENT',
                afterVisual
              );
              assertVisibleWorld(afterVisual.metrics, `${scenario.name}:AFTER_INPUT`);
              const webgl = await page.evaluate(() =>
                document.getElementById('complete-world-canvas').getContext('webgl2')
                  instanceof WebGL2RenderingContext
              );
              await page.screenshot({
                path: path.join(out, `${scenario.name}-after.png`),
                fullPage: true
              });

              const rb = before.renderer.counters;
              const ra = after.renderer.counters;
              const ib = before.intake.counters;
              const ia = after.intake.counters;
              check(webgl, 'WEBGL2_NOT_BOUND');
              check(ra.contextCreationCount === 1, 'CONTEXT_COUNT_NOT_ONE', ra);
              check(ra.rendererInitializationCount === 1, 'RENDERER_INIT_NOT_ONE', ra);
              check(
                ra.visiblePresentationCount > rb.visiblePresentationCount,
                'VISIBLE_FRAME_NOT_ADVANCED',
                { rb, ra }
              );
              check(ra.worldRebuildCount === 0, 'WORLD_REBUILD', ra);
              check(
                ra.postInitializationResourceCreationCount === 0,
                'POST_INIT_RESOURCE_CREATION',
                ra
              );
              check(
                ra.postInitializationBufferUploadCount === 0,
                'POST_INIT_BUFFER_UPLOAD',
                ra
              );
              check(
                after.renderer.correspondence.normalizedRgbTransport === true &&
                after.renderer.correspondence.vec3UniformArity === 3 &&
                after.renderer.correspondence.rgba8AuthorityPreserved === true,
                'RGBA8_VEC3_TRANSPORT_RECEIPT_INVALID',
                after.renderer.correspondence
              );
              check(
                after.packageBinding.counters.candidateSampleFailureCount === 0,
                'SAMPLE_FAILURE'
              );
              check(
                after.packageBinding.counters.boundTerrainVertexCount === 10419,
                'TERRAIN_COUNT'
              );
              check(
                after.packageBinding.counters.boundShorelineVertexCount === 299,
                'SHORELINE_COUNT'
              );
              check(
                ia.navigationProposalCount > ib.navigationProposalCount,
                'NAVIGATION_NOT_ADVANCED',
                { ib, ia }
              );

              if (scenario.mobile) {
                check(
                  ia.touchPointerEventCount > ib.touchPointerEventCount,
                  'TOUCH_NOT_RECORDED'
                );
                check(
                  ia.oneFingerLookProposalCount > ib.oneFingerLookProposalCount,
                  'LOOK_NOT_RECORDED'
                );
                check(
                  ia.twoFingerTravelProposalCount > ib.twoFingerTravelProposalCount,
                  'TRAVEL_NOT_RECORDED'
                );
                check(ia.pinchProposalCount > ib.pinchProposalCount, 'PINCH_NOT_RECORDED');
                check(
                  ia.releaseTerminationCount > ib.releaseTerminationCount,
                  'RELEASE_NOT_RECORDED'
                );
              } else {
                check(
                  ia.mousePointerEventCount > ib.mousePointerEventCount,
                  'MOUSE_NOT_RECORDED'
                );
                check(
                  ia.oneFingerLookProposalCount > ib.oneFingerLookProposalCount,
                  'DESKTOP_LOOK_NOT_RECORDED'
                );
                check(ia.wheelEventCount > ib.wheelEventCount, 'WHEEL_NOT_RECORDED');
              }

              check(
                consoleRecords.filter(row => row.type === 'error').length === 0,
                'CONSOLE_ERROR',
                consoleRecords
              );
              check(pageErrors.length === 0, 'PAGE_ERROR', pageErrors);
              check(requestFailures.length === 0, 'REQUEST_FAILURE', requestFailures);
              check(
                httpRecords.filter(
                  row => row.status >= 400 && !row.url.endsWith('/favicon.ico')
                ).length === 0,
                'HTTP_FAILURE',
                httpRecords
              );

              const receipt = {
                receiptType: 'H_EARTH_C2_R1_COMPLETE_WORLD_BROWSER_SCENARIO_v6',
                operationId:
                  'H_EARTH_C2_R1_COMPLETE_WORLD_VISIBLE_FRAME_COLOR_AND_ENVIRONMENT_READABILITY_CORRECTION_001',
                expectedHead: process.env.EXPECTED_HEAD,
                reviewUrl: process.env.REVIEW_URL,
                scenario,
                startupMilliseconds,
                webgl,
                webglErrorResult: 'PASS_ZERO_ERRORS',
                rgba8Vec3TransportResult: 'PASS',
                clearColorNormalizationResult: 'PASS',
                luminanceDistributionResult: 'PASS',
                colorVarianceResult: 'PASS',
                geometryOccupancyResult: 'PASS',
                blackWhiteDominanceRejectionResult: 'PASS',
                beforeVisual,
                afterVisual,
                before,
                after,
                consoleRecords,
                pageErrors,
                requestFailures,
                httpRecords
              };
              fs.writeFileSync(
                path.join(out, `${scenario.name}-receipt.json`),
                JSON.stringify(receipt, null, 2)
              );
              await context.tracing.stop({
                path: path.join(out, `${scenario.name}-trace.zip`)
              });
              return receipt;
            } catch (error) {
              const progress = await page.evaluate(() =>
                window.H_EARTH_C2_R1_COMPLETE_WORLD?.getProgressReceipt?.() ?? null
              ).catch(() => null);
              fs.writeFileSync(
                path.join(out, `${scenario.name}-failure.json`),
                JSON.stringify({
                  error: {
                    name: error.name,
                    message: error.message,
                    detail: error.detail ?? null
                  },
                  progress,
                  consoleRecords,
                  pageErrors,
                  requestFailures,
                  httpRecords
                }, null, 2)
              );
              await context.tracing.stop({
                path: path.join(out, `${scenario.name}-trace.zip`)
              }).catch(() => {});
              throw error;
            } finally {
              await context.close();
            }
          }

          const browser = await chromium.launch({
            headless: true,
            args: [
              '--use-angle=swiftshader',
              '--enable-webgl',
              '--ignore-gpu-blocklist',
              '--disable-dev-shm-usage'
            ]
          });
          try {
            const scenarios = [
              {
                name: 'desktop-1440x900',
                viewport: { width: 1440, height: 900 },
                dpr: 1,
                mobile: false
              },
              {
                name: 'mobile-412x915',
                viewport: { width: 412, height: 915 },
                dpr: 2.625,
                mobile: true
              },
              {
                name: 'mobile-390x844',
                viewport: { width: 390, height: 844 },
                dpr: 3,
                mobile: true
              }
            ];
            const receipts = [];
            for (const scenario of scenarios) receipts.push(await run(browser, scenario));
            fs.writeFileSync(
              path.join(out, 'browser-summary.json'),
              JSON.stringify({
                receiptType:
                  'H_EARTH_C2_R1_COMPLETE_WORLD_VISIBLE_WORLD_BROWSER_SUMMARY_v6',
                operationId:
                  'H_EARTH_C2_R1_COMPLETE_WORLD_VISIBLE_FRAME_COLOR_AND_ENVIRONMENT_READABILITY_CORRECTION_001',
                expectedHead: process.env.EXPECTED_HEAD,
                reviewUrl: process.env.REVIEW_URL,
                roleBoundary: 'ROLE_1_TRANSPORT_NOT_ROLE_3_CERTIFICATION',
                negativeRegressionFixture,
                thresholds: VISUAL_THRESHOLDS,
                packageIdentity: receipts[0]?.after?.packageIdentity ?? null,
                packageContentDigest: receipts[0]?.after?.packageContentDigest ?? null,
                candidateSampleFailureCount:
                  receipts[0]?.after?.packageBinding?.counters
                    ?.candidateSampleFailureCount ?? null,
                boundTerrainVertexCount:
                  receipts[0]?.after?.packageBinding?.counters
                    ?.boundTerrainVertexCount ?? null,
                boundShorelineVertexCount:
                  receipts[0]?.after?.packageBinding?.counters
                    ?.boundShorelineVertexCount ?? null,
                scenarios: receipts.map(receipt => ({
                  name: receipt.scenario.name,
                  startupMilliseconds: receipt.startupMilliseconds,
                  constructionMilliseconds:
                    receipt.after.packageBinding.counters.constructionMilliseconds,
                  webglErrorResult: receipt.webglErrorResult,
                  luminanceDistributionResult: receipt.luminanceDistributionResult,
                  colorVarianceResult: receipt.colorVarianceResult,
                  geometryOccupancyResult: receipt.geometryOccupancyResult,
                  blackWhiteDominanceRejectionResult:
                    receipt.blackWhiteDominanceRejectionResult,
                  beforeVisualMetrics: receipt.beforeVisual.metrics,
                  afterVisualMetrics: receipt.afterVisual.metrics
                }))
              }, null, 2)
            );
          } finally {
            await browser.close();
          }
          SCRIPT
          cd "$RUNNER_TEMP/browser/runtime"
          node verify.mjs
      - name: Digest browser artifacts
        if: always()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/browser/artifacts"
          find . -maxdepth 1 -type f ! -name artifact-sha256.txt -print0 | sort -z | xargs -0 sha256sum > artifact-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h-earth-c2-r1-complete-world-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser/artifacts
          if-no-files-found: error
          retention-days: 30
