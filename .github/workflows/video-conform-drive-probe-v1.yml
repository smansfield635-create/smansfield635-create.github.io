name: Video Conform Drive Source Probe v1

on:
  pull_request:
    paths:
      - '.github/workflows/video-conform-drive-probe-v1.yml'

permissions:
  contents: read

jobs:
  probe-drive-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact registered Compass source from Google Drive
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q gdown
          gdown 1nQKAfKJ2ORMSpIhjyt5A_gy4neYFrh7A -O /tmp/23619.mp4
          test "$(stat -c%s /tmp/23619.mp4)" = "91348244"
          test "$(sha256sum /tmp/23619.mp4 | awk '{print $1}')" = "c5caa176633209bdc618f505f64cafef5535e400ce2bf1728cde79582169c9a3"
          ffprobe -v error -show_entries format=duration -of default=nw=1 /tmp/23619.mp4
