name: About Exact Browser Qualification v2
on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/about-exact-browser-qualification-v2.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repaired exact About candidate
        uses: actions/checkout@v4
        with:
          ref: 2f22289087b92e21b2251685aac3b6d17f71c805
          fetch-depth: 1
          sparse-checkout: |
            about
            assets/compass
            assets/shared
          sparse-checkout-cone-mode: true
      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "2f22289087b92e21b2251685aac3b6d17f71c805"
      - name: Install browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/about-http.log 2>&1 &
          sleep 2
      - name: Run exact rendered qualification
        shell: bash
        run: |
          cat > /tmp/about-qualify.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const candidate='2f22289087b92e21b2251685aac3b6d17f71c805';
          const chromeCandidates=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium-browser','/usr/bin/chromium'];
          const executablePath=chromeCandidates.find(p=>fs.existsSync(p));
          if(!executablePath) throw new Error('No Chrome/Chromium available');
          const browser=await chromium.launch({headless:true,executablePath,args:['--autoplay-policy=no-user-gesture-required']});
          const results=[]; const pass=(name,detail='')=>results.push({name,pass:true,detail}); const fail=(name,detail='')=>results.push({name,pass:false,detail});
          async function desktop(){
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const errors=[]; const badResponses=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('response',r=>{if(r.status()>=400 && !r.url().endsWith('/favicon.ico')) badResponses.push(`${r.status()} ${r.url()}`)});
            await page.goto('http://127.0.0.1:4173/about/',{waitUntil:'networkidle'});
            await page.waitForTimeout(6500);
            const video=await page.locator('[data-audralia-footage]').evaluate(v=>({ready:v.readyState,paused:v.paused,current:v.currentTime,w:v.videoWidth,h:v.videoHeight,error:v.error?{code:v.error.code,message:v.error.message}:null,src:v.currentSrc.slice(0,5),can:v.canPlayType('video/mp4; codecs="avc1.42E01E"')}));
            if(video.ready>=2&&video.w>0&&video.h>0&&video.current>0&&video.src==='blob:') pass('Audralia recovered footage renders and advances',JSON.stringify(video)); else fail('Audralia recovered footage renders and advances',JSON.stringify(video));
            const mirror=await page.locator('[data-compass-mirrorland-window-mount]').count(); if(mirror===1) pass('Mirrorland authoritative mount exists'); else fail('Mirrorland authoritative mount exists',String(mirror));
            const href=await page.locator('.compass-return').getAttribute('href'); if(href==='/') pass('Compass return routes to root'); else fail('Compass return routes to root',String(href));
            const before=await page.locator('[data-title]').innerText(); await page.click('[data-prev]'); const july=await page.locator('[data-title]').innerText(); for(let i=0;i<6;i++) await page.click('[data-prev]'); const jan=await page.locator('[data-title]').innerText(); const disabled=await page.locator('[data-prev]').isDisabled();
            if(before==='August 2026'&&july==='July 2026'&&jan==='January 2026'&&disabled) pass('Calendar opens August and bounds at January'); else fail('Calendar opens August and bounds at January',JSON.stringify({before,july,jan,disabled}));
            await page.reload({waitUntil:'domcontentloaded'}); await page.waitForTimeout(500); await page.click('[data-skip]'); const skip=await page.evaluate(()=>document.documentElement.dataset.filmState); if(skip==='settled') pass('Skip Film converges to settled estate'); else fail('Skip Film converges to settled estate',skip);
            await page.reload({waitUntil:'domcontentloaded'}); await page.waitForTimeout(500); await page.keyboard.press('Escape'); const esc=await page.evaluate(()=>document.documentElement.dataset.filmState); if(esc==='settled') pass('Escape converges to settled estate'); else fail('Escape converges to settled estate',esc);
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2); if(!overflow) pass('Desktop containment'); else fail('Desktop containment','horizontal overflow');
            if(errors.length===0) pass('No uncaught page errors'); else fail('No uncaught page errors',errors.join(' | '));
            if(badResponses.length===0) pass('No material HTTP failures'); else fail('No material HTTP failures',badResponses.join(' | '));
            await page.screenshot({path:'/tmp/about-desktop-v2.png',fullPage:true}); await page.close();
          }
          async function mobile(){
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true}); await page.goto('http://127.0.0.1:4173/about/',{waitUntil:'domcontentloaded'}); await page.waitForTimeout(1000); await page.click('[data-skip]');
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2); const compass=await page.locator('.compass-return').isVisible(); if(!overflow) pass('Mobile containment'); else fail('Mobile containment','horizontal overflow'); if(compass) pass('Compass return visible on mobile'); else fail('Compass return visible on mobile');
            await page.screenshot({path:'/tmp/about-mobile-v2.png',fullPage:true}); await page.close();
          }
          async function reduced(){
            const context=await browser.newContext({viewport:{width:1280,height:800},reducedMotion:'reduce'}); const page=await context.newPage(); await page.goto('http://127.0.0.1:4173/about/',{waitUntil:'domcontentloaded'}); await page.waitForTimeout(400); const state=await page.evaluate(()=>document.documentElement.dataset.filmState); const skip=await page.locator('[data-skip]').isVisible(); if(state==='settled'&&!skip) pass('Reduced motion bypasses film'); else fail('Reduced motion bypasses film',JSON.stringify({state,skip})); await context.close();
          }
          await desktop(); await mobile(); await reduced(); await browser.close(); const failed=results.filter(x=>!x.pass); const report={candidate,browser:executablePath,results}; fs.writeFileSync('/tmp/about-browser-results-v2.json',JSON.stringify(report,null,2)); console.log(JSON.stringify(report,null,2)); if(failed.length) process.exit(1);
          NODE
          node /tmp/about-qualify.mjs
      - name: Upload exact browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: about-exact-browser-qualification-v2
          path: |
            /tmp/about-browser-results-v2.json
            /tmp/about-desktop-v2.png
            /tmp/about-mobile-v2.png
