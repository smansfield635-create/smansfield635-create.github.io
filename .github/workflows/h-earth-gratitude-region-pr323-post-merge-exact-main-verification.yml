name: H-Earth Gratitude Region PR323 Post-Merge Exact Main Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/h-earth-gratitude-region-pr323-post-merge-exact-main-verification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pr323-active-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR323 merge commit
        uses: actions/checkout@v4
        with:
          ref: 343b0c269dd343a57c6ecb7e785141134cc5660f
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main

      - name: Execute exact active-main reference verification twice
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import loadDependencies from './h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js';
          import registryFacade, {
            H_EARTH_GRATITUDE_REGION_CONTROLLING_ARTIFACT_REFERENCE_UPDATE_EVIDENCE,
            H_EARTH_GRATITUDE_REGION_CONTROLLING_ARTIFACT_REFERENCE_UPDATE_SCOPE_NODE
          } from './h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.gratitude-region-controlling-artifact-reference-update.js';
          import { runAutomaticHEarthPreflight } from './h-earth-3d/registry/activation/h-earth.repository-registry.auto-preflight.js';

          const PR323_BASE = 'd30bb105762b4205df90c3450de6c13076ef072e';
          const PR323_AUTHORIZED_HEAD = 'e9c923ed110d43fdef885701059dade50d83b824';
          const PR323_MERGE = '343b0c269dd343a57c6ecb7e785141134cc5660f';
          const PR311_PACKAGE_HEAD = 'a0cadd1e5ce70d98c34f11ddacb063c91816bd93';
          const PR311_PACKAGE_MERGE = 'd30bb105762b4205df90c3450de6c13076ef072e';
          const AMENDMENT_PATH = '/h-earth-3d/control-plane/region-001-reconciliation/h-earth.region-001.gratitude-region-coordinate-reconciliation.active-main-reference-amendment.v1.json';
          const AMENDMENT_BLOB = '7ef817685ce12a3a93fdf0a03391ac52c2df2664';
          const OVERLAY_PATH = '/h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.gratitude-region-controlling-artifact-reference-update.js';
          const OVERLAY_BLOB = '0f3463e99eb735c2964ec933a5bcadf53c77ad2a';
          const LOADER_PATH = '/h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js';
          const LOADER_BLOB = 'dd0e6ae7042f102e8a3c66bcbede4bff20f358b5';
          const SPATIAL_PATH = '/h-earth-3d/control-plane/region-001-reconciliation/h-earth.region-001.gratitude-region-spatial-interaction-area-development.v1.json';
          const SPATIAL_BLOB = 'ee5ca94f5ae55ce8f11b460428b800ad4e9a2a9d';
          const MANIFEST_PATH = '/h-earth-3d/control-plane/region-001-reconciliation/h-earth.region-001.mirrorland-narrative-character-temporal-reconciliation.manifest.v1.json';
          const MANIFEST_BLOB = '1702d62036a6b241fdadddfabc304a5288f38652';
          const NODE_ID = H_EARTH_GRATITUDE_REGION_CONTROLLING_ARTIFACT_REFERENCE_UPDATE_SCOPE_NODE.nodeId;
          const ACTIVE_REFERENCE_PATHS = [AMENDMENT_PATH, OVERLAY_PATH, LOADER_PATH];

          const stable = (value) => value === null || typeof value !== 'object'
            ? JSON.stringify(value)
            : Array.isArray(value)
              ? `[${value.map(stable).join(',')}]`
              : `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${stable(value[key])}`).join(',')}}`;
          const digest = (value) => crypto.createHash('sha256').update(stable(value)).digest('hex');
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const blobAt = (commit, repositoryPath) => {
            const line = git('ls-tree', commit, '--', repositoryPath.replace(/^\//, ''));
            return line.match(/^\d+\s+blob\s+([0-9a-f]{40})\t/)?.[1] ?? null;
          };
          const readJson = (repositoryPath) => JSON.parse(fs.readFileSync(repositoryPath.replace(/^\//, ''), 'utf8'));
          const lines = (value) => value ? value.split('\n').filter(Boolean) : [];

          function execute() {
            const issues = [];
            const currentMainHead = git('rev-parse', 'origin/main');
            const amendment = readJson(AMENDMENT_PATH);
            const dependencies = loadDependencies();
            const node = registryFacade.getHEarthRepositoryRegistryNode(NODE_ID);
            const evidence = H_EARTH_GRATITUDE_REGION_CONTROLLING_ARTIFACT_REFERENCE_UPDATE_EVIDENCE;
            const packageOccurrences = node.repositoryOccurrences.filter((occurrence) => occurrence.commitSha === PR311_PACKAGE_HEAD);
            const pr323DeltaPaths = lines(git('diff', '--name-only', `${PR323_BASE}...${PR323_MERGE}`)).map((path) => `/${path}`);
            const expectedDeltaPaths = [...ACTIVE_REFERENCE_PATHS].sort();
            const actualDeltaPaths = [...pr323DeltaPaths].sort();
            const mergeIsAncestorOfCurrentMain = (() => {
              try {
                execFileSync('git', ['merge-base', '--is-ancestor', PR323_MERGE, currentMainHead]);
                return true;
              } catch {
                return false;
              }
            })();
            const exactActiveReferenceBlobs =
              blobAt(currentMainHead, AMENDMENT_PATH) === AMENDMENT_BLOB
              && blobAt(currentMainHead, OVERLAY_PATH) === OVERLAY_BLOB
              && blobAt(currentMainHead, LOADER_PATH) === LOADER_BLOB;
            const originalV1BlobsUnchanged =
              blobAt(currentMainHead, SPATIAL_PATH) === SPATIAL_BLOB
              && blobAt(currentMainHead, MANIFEST_PATH) === MANIFEST_BLOB;
            const exactPackageBlobsAtPackageMerge = packageOccurrences.length === 16
              && packageOccurrences.every((occurrence) => blobAt(PR311_PACKAGE_MERGE, occurrence.path) === occurrence.gitBlobSha);
            const exactPackageBlobsOnCurrentMain = packageOccurrences.length === 16
              && packageOccurrences.every((occurrence) => blobAt(currentMainHead, occurrence.path) === occurrence.gitBlobSha);

            if (git('rev-parse', 'HEAD') !== PR323_MERGE) issues.push('CHECKOUT_NOT_PR323_MERGE');
            if (git('rev-parse', `${PR323_MERGE}^1`) !== PR323_BASE) issues.push('PR323_FIRST_PARENT_MISMATCH');
            if (git('rev-parse', `${PR323_MERGE}^2`) !== PR323_AUTHORIZED_HEAD) issues.push('PR323_SECOND_PARENT_MISMATCH');
            if (!mergeIsAncestorOfCurrentMain) issues.push('PR323_MERGE_NOT_ANCESTOR_OF_CURRENT_MAIN');
            if (stable(actualDeltaPaths) !== stable(expectedDeltaPaths)) issues.push('PR323_THREE_PATH_DELTA_MISMATCH');
            if (!exactActiveReferenceBlobs) issues.push('ACTIVE_REFERENCE_BLOB_MISMATCH');
            if (!originalV1BlobsUnchanged) issues.push('ORIGINAL_V1_BLOB_CHANGED');
            if (!exactPackageBlobsAtPackageMerge) issues.push('PR311_PACKAGE_MERGE_BLOB_MISMATCH');
            if (!exactPackageBlobsOnCurrentMain) issues.push('PR311_PACKAGE_CURRENT_MAIN_BLOB_MISMATCH');
            if (packageOccurrences.length !== 16) issues.push(`PR311_PACKAGE_OCCURRENCE_COUNT_${packageOccurrences.length}_NOT_16`);
            if (dependencies.identityVerified !== true) issues.push('LOADER_IDENTITY_NOT_VERIFIED');
            if (dependencies.registryFacade !== registryFacade) issues.push('LOADER_NOT_USING_REFERENCE_UPDATE_FACADE');

            if (amendment.activeMainPackageReference.activeMainMergeCommit !== PR311_PACKAGE_MERGE) issues.push('AMENDMENT_PR311_MERGE_REFERENCE_MISMATCH');
            if (amendment.activeMainPackageReference.activePackagePathCount !== 16) issues.push('AMENDMENT_PACKAGE_PATH_COUNT_MISMATCH');
            if (amendment.registryCustody.activeRegistryResolution !== 'PASS_CLOSED') issues.push('AMENDMENT_REGISTRY_CUSTODY_NOT_PASS_CLOSED');
            if (amendment.postMergeExecutionCustody.status !== 'PASS_CLOSED') issues.push('AMENDMENT_POST_MERGE_EXECUTION_NOT_PASS_CLOSED');
            if (amendment.postMergeExecutionCustody.deterministicRepeatExecution !== true) issues.push('AMENDMENT_POST_MERGE_EXECUTION_NOT_DETERMINISTIC');
            if (amendment.preservedAnalyticalDisposition.candidateAcceptance !== false) issues.push('AMENDMENT_CANDIDATE_ACCEPTANCE_TRUE');
            if (amendment.preservedAnalyticalDisposition.finalCoordinatesAssigned !== false) issues.push('AMENDMENT_FINAL_COORDINATES_TRUE');
            if (amendment.authorityBoundary.referenceUpdateActiveOnMain !== false) issues.push('INTERNAL_CANDIDATE_FLAG_CHANGED');
            for (const key of ['mergeAuthorityCreated','candidateAcceptance','finalCoordinatesAssigned','canonicalization','terrainMutation','geometryConstruction','runtimeMutation','gameplayMutation','publicRouteMutation','livePageChange','productConstruction']) {
              if (amendment.authorityBoundary[key] !== false) issues.push(`AUTHORITY_OVERREACH:${key}`);
            }

            if (evidence.activePackageReference.activeMainMergeCommit !== PR311_PACKAGE_MERGE) issues.push('REGISTRY_EVIDENCE_PR311_MERGE_REFERENCE_MISMATCH');
            if (evidence.activePackageReference.activePackagePathCount !== 16) issues.push('REGISTRY_EVIDENCE_PACKAGE_COUNT_MISMATCH');
            if (evidence.activePackageReference.registryResolution !== 'PASS_CLOSED') issues.push('REGISTRY_EVIDENCE_RESOLUTION_NOT_PASS_CLOSED');
            if (evidence.activePackageReference.postMergeExecution !== 'PASS_CLOSED') issues.push('REGISTRY_EVIDENCE_EXECUTION_NOT_PASS_CLOSED');

            for (const path of ACTIVE_REFERENCE_PATHS) {
              const resolution = registryFacade.resolveHEarthRepositoryRegistryPath(path);
              if (resolution.resolved !== true || resolution.unresolved !== false) issues.push(`PATH_UNRESOLVED:${path}`);
              if (!resolution.nodes.some((candidateNode) => candidateNode.nodeId === NODE_ID)) issues.push(`REFERENCE_NODE_NOT_RESOLVED:${path}`);
            }
            const amendmentOccurrence = registryFacade.resolveHEarthRepositoryRegistryOccurrence({
              path: AMENDMENT_PATH,
              refName: 'agent/h-earth-gratitude-region-controlling-artifact-reference-update-001',
              gitBlobSha: AMENDMENT_BLOB
            });
            if (amendmentOccurrence.resolved !== true || amendmentOccurrence.matches.length !== 1) issues.push('AMENDMENT_OCCURRENCE_NOT_EXACTLY_RESOLVED');

            const preflight = runAutomaticHEarthPreflight({
              paths: ACTIVE_REFERENCE_PATHS,
              taskText: 'Verify merged Gratitude Region controlling-artifact reference custody on exact active main before final-placement disposition',
              mutationIntent: false
            });
            const failureCodes = preflight.validatorReceipt?.failureCodes ?? [];
            const resolvedPaths = preflight.validatorReceipt?.resolvedPaths ?? [];
            const affectedNodeIds = preflight.scopePreview?.affectedNodeIds ?? [];
            if (preflight.finalDisposition !== 'PASS') issues.push(`PREFLIGHT_${preflight.finalDisposition}`);
            if (preflight.continuation !== 'READ_ONLY_CONTINUATION_PERMITTED') issues.push(`CONTINUATION_${preflight.continuation}`);
            if (failureCodes.length !== 0) issues.push(`PREFLIGHT_FAILURE_CODES:${failureCodes.join(',')}`);
            if (resolvedPaths.length !== 3) issues.push(`PREFLIGHT_RESOLVED_PATHS_${resolvedPaths.length}_NOT_3`);
            if (!affectedNodeIds.includes(NODE_ID)) issues.push('REFERENCE_UPDATE_NODE_NOT_IN_PREFLIGHT_SCOPE');

            if (node.authorityClass !== 'NO_AUTHORITY') issues.push('NODE_AUTHORITY_CLASS_OVERREACH');
            if (node.allowedMutationScope !== 'READ_ONLY_INSPECTION') issues.push('NODE_MUTATION_SCOPE_OVERREACH');
            if (node.lifecycleStatus !== 'CANDIDATE') issues.push('NODE_LIFECYCLE_PROMOTED');
            if (stable(node.unresolvedFields) !== stable(['SEPARATE_FINAL_PLACEMENT_DISPOSITION'])) issues.push('NODE_UNRESOLVED_FIELDS_MISMATCH');
            for (const limitation of ['NO_SPATIAL_CANDIDATE_ACCEPTANCE','NO_FINAL_COORDINATES_OR_ANCHORS','NO_CANONICALIZATION','NO_PRODUCT_CONSTRUCTION','NO_LIVE_PAGE_CHANGE']) {
              if (!node.authorityLimitations.includes(limitation)) issues.push(`NODE_LIMITATION_MISSING:${limitation}`);
            }

            const base = {
              schemaVersion: 'H_EARTH_GRATITUDE_REGION_PR323_POST_MERGE_EXACT_MAIN_EXECUTION_VERIFICATION_RECEIPT_v1',
              pr323: 323,
              pr323BaseMain: PR323_BASE,
              pr323AuthorizedHead: PR323_AUTHORIZED_HEAD,
              pr323MergeCommit: PR323_MERGE,
              currentMainHead,
              pr323MergeIsAncestorOfCurrentMain: mergeIsAncestorOfCurrentMain,
              pr323ChangedPathCount: pr323DeltaPaths.length,
              pr323ExactChangedPaths: actualDeltaPaths,
              activeReferenceAmendmentBlob: blobAt(currentMainHead, AMENDMENT_PATH),
              activeReferenceRegistryOverlayBlob: blobAt(currentMainHead, OVERLAY_PATH),
              activeRegistryLoaderBlob: blobAt(currentMainHead, LOADER_PATH),
              exactActiveReferenceBlobs,
              originalSpatialV1Blob: blobAt(currentMainHead, SPATIAL_PATH),
              originalManifestV1Blob: blobAt(currentMainHead, MANIFEST_PATH),
              originalV1BlobsUnchanged,
              pr311PackageHead: PR311_PACKAGE_HEAD,
              pr311PackageMergeCommit: PR311_PACKAGE_MERGE,
              activePackagePathCount: packageOccurrences.length,
              exactPackageBlobsAtPackageMerge,
              exactPackageBlobsOnCurrentMain,
              loaderIdentityVerified: dependencies.identityVerified,
              loaderUsesActiveReferenceFacade: dependencies.registryFacade === registryFacade,
              referencePathsResolved: ACTIVE_REFERENCE_PATHS.every((path) => registryFacade.resolveHEarthRepositoryRegistryPath(path).resolved === true),
              amendmentOccurrenceResolvedExactlyOnce: amendmentOccurrence.resolved === true && amendmentOccurrence.matches.length === 1,
              registryPreflightDisposition: preflight.finalDisposition,
              registryPreflightContinuation: preflight.continuation,
              registryPreflightResolvedPathCount: resolvedPaths.length,
              registryPreflightFailureCodes: failureCodes,
              activeMainReferenceCustodyEstablished: exactActiveReferenceBlobs && originalV1BlobsUnchanged && exactPackageBlobsOnCurrentMain,
              internalReferenceRecordClassification: amendment.artifactIdentity.status,
              internalReferenceRecordCanonical: amendment.artifactIdentity.canonical,
              internalReferenceUpdateActiveOnMainFlag: amendment.authorityBoundary.referenceUpdateActiveOnMain,
              registryNodeLifecycleStatus: node.lifecycleStatus,
              registryNodeAuthorityClass: node.authorityClass,
              remainingLifecycleFields: node.unresolvedFields,
              candidateAcceptance: false,
              finalPlacementDispositionResolved: false,
              finalCoordinatesAssigned: false,
              canonicalization: false,
              terrainMutation: false,
              geometryConstruction: false,
              runtimeMutation: false,
              livePageChange: false,
              productConstruction: false,
              stoppingBoundary: 'STOP_BEFORE_FINAL_PLACEMENT_DISPOSITION',
              issues
            };
            return { ...base, receiptDigest: digest(base), status: issues.length === 0 ? 'PASS_CLOSED' : 'FAIL_STOPPED' };
          }

          const first = execute();
          const second = execute();
          const deterministic = first.receiptDigest === second.receiptDigest;
          const custody = {
            schemaVersion: 'H_EARTH_GRATITUDE_REGION_PR323_POST_MERGE_EXACT_MAIN_EXECUTION_VERIFICATION_CUSTODY_v1',
            status: deterministic && first.status === 'PASS_CLOSED' && second.status === 'PASS_CLOSED' ? 'PASS_CLOSED' : 'FAIL_STOPPED',
            pr323: first.pr323,
            pr323AuthorizedHead: first.pr323AuthorizedHead,
            pr323MergeCommit: first.pr323MergeCommit,
            currentMainHead: first.currentMainHead,
            pr323MergeIsAncestorOfCurrentMain: first.pr323MergeIsAncestorOfCurrentMain,
            pr323ChangedPathCount: first.pr323ChangedPathCount,
            activeReferenceAmendmentBlob: first.activeReferenceAmendmentBlob,
            activeReferenceRegistryOverlayBlob: first.activeReferenceRegistryOverlayBlob,
            activeRegistryLoaderBlob: first.activeRegistryLoaderBlob,
            exactActiveReferenceBlobs: first.exactActiveReferenceBlobs,
            originalSpatialV1Blob: first.originalSpatialV1Blob,
            originalManifestV1Blob: first.originalManifestV1Blob,
            originalV1BlobsUnchanged: first.originalV1BlobsUnchanged,
            pr311PackageHead: first.pr311PackageHead,
            pr311PackageMergeCommit: first.pr311PackageMergeCommit,
            activePackagePathCount: first.activePackagePathCount,
            exactPackageBlobsOnCurrentMain: first.exactPackageBlobsOnCurrentMain,
            registryPreflightDisposition: first.registryPreflightDisposition,
            registryPreflightResolvedPathCount: first.registryPreflightResolvedPathCount,
            registryPreflightFailureCodes: first.registryPreflightFailureCodes,
            activeMainReferenceCustodyEstablished: first.activeMainReferenceCustodyEstablished,
            internalReferenceRecordClassification: first.internalReferenceRecordClassification,
            internalReferenceRecordCanonical: first.internalReferenceRecordCanonical,
            registryNodeLifecycleStatus: first.registryNodeLifecycleStatus,
            registryNodeAuthorityClass: first.registryNodeAuthorityClass,
            remainingLifecycleFields: first.remainingLifecycleFields,
            firstExecutionDigest: first.receiptDigest,
            secondExecutionDigest: second.receiptDigest,
            deterministicRepeatExecution: deterministic,
            candidateAcceptance: false,
            finalPlacementDispositionResolved: false,
            finalCoordinatesAssigned: false,
            productConstruction: false,
            livePageChange: false,
            stoppingBoundary: first.stoppingBoundary
          };
          fs.writeFileSync('/tmp/h-earth-gratitude-region-pr323-post-merge.first.json', `${JSON.stringify(first, null, 2)}\n`);
          fs.writeFileSync('/tmp/h-earth-gratitude-region-pr323-post-merge.second.json', `${JSON.stringify(second, null, 2)}\n`);
          fs.writeFileSync('/tmp/h-earth-gratitude-region-pr323-post-merge.custody.json', `${JSON.stringify(custody, null, 2)}\n`);
          console.log(JSON.stringify(custody, null, 2));
          if (custody.status !== 'PASS_CLOSED') process.exitCode = 1;
          NODE

      - name: Upload exact-main verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-gratitude-region-pr323-post-merge-exact-main-evidence
          path: |
            /tmp/h-earth-gratitude-region-pr323-post-merge.first.json
            /tmp/h-earth-gratitude-region-pr323-post-merge.second.json
            /tmp/h-earth-gratitude-region-pr323-post-merge.custody.json
          if-no-files-found: error
          retention-days: 30
