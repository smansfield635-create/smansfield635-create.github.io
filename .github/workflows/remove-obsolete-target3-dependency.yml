name: Remove Obsolete Target 3 Dependency

on:
  push:
    branches:
      - agent/h-earth-gate-b-post-guardrail-evaluation-001
    paths:
      - tools/remove-obsolete-target3-dependency.mjs
      - .github/workflows/remove-obsolete-target3-dependency.yml

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/h-earth-gate-b-post-guardrail-evaluation-001
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove obsolete Target 3 dependency
        run: node tools/remove-obsolete-target3-dependency.mjs
      - name: Commit bounded audit renewal
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/h-earth-repository-registry-target-4f-audit.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Remove obsolete Target 3 dependency from Target 4F audit'
          git push origin HEAD:agent/h-earth-gate-b-post-guardrail-evaluation-001
