name: H-Earth Gratitude Region Registry Occurrence Correction Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/h-earth-gratitude-region-registry-occurrence-correction-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-occurrence-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact correction candidate
        uses: actions/checkout@v4
        with:
          ref: a5fbe389a8a2e594b00d5dd92434b3d86229510c
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify correction candidate identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a5fbe389a8a2e594b00d5dd92434b3d86229510c"
          test "$(git hash-object h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.gratitude-region-coordinate-reconciliation-occurrence-correction.js)" = "c5aaf2ea9cecc838145565484ecafefe9e4b4860"
          test "$(git hash-object h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js)" = "739e28c7bdaf860f6c46f604cc5bf1a6e1b9ee09"
          git fetch --no-tags origin a0cadd1e5ce70d98c34f11ddacb063c91816bd93

      - name: Execute corrected registry verification twice
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import loadDependencies from './h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js';
          import registryFacade, {
            H_EARTH_GRATITUDE_REGION_COORDINATE_RECONCILIATION_CORRECTED_PACKAGE_OCCURRENCES,
            H_EARTH_GRATITUDE_REGION_COORDINATE_RECONCILIATION_CORRECTED_SCOPE_NODE
          } from './h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.gratitude-region.coordinate-reconciliation-occurrence-correction.js';
          import { runAutomaticHEarthPreflight } from './h-earth-3d/registry/activation/h-earth.repository-registry.auto-preflight.js';

          const CANDIDATE_HEAD = 'a5fbe389a8a2e594b00d5dd92434b3d86229510c';
          const PACKAGE_HEAD = 'a0cadd1e5ce70d98c34f11ddacb063c91816bd93';
          const CORRECTION_BLOB = 'c5aaf2ea9cecc838145565484ecafefe9e4b4860';
          const LOADER_BLOB = '739e28c7bdaf860f6c46f604cc5bf1a6e1b9ee09';
          const TARGET_PATH = '/h-earth-3d/validation/h-earth.gratitude-region.mirror-manor-reconciliation.runner.mjs';
          const RETIRED_BLOB = '72d06326cc1a990c5a748d7b4d2b8368b32c2c79';
          const CORRECTED_BLOB = '72d0ffcd9835a2a02b18b220382db105edbc4314';
          const SELF_PATH = '/h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.gratitude-region-coordinate-reconciliation-occurrence-correction.js';
          const LOADER_PATH = '/h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js';
          const NODE_ID = H_EARTH_GRATITUDE_REGION_COORDINATE_RECONCILIATION_CORRECTED_SCOPE_NODE.nodeId;

          const stable = (value) => value === null || typeof value !== 'object'
            ? JSON.stringify(value)
            : Array.isArray(value)
              ? `[${value.map(stable).join(',')}]`
              : `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${stable(value[key])}`).join(',')}}`;
          const digest = (value) => crypto.createHash('sha256').update(stable(value)).digest('hex');
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const blobAt = (commit, repositoryPath) => {
            const line = git('ls-tree', commit, '--', repositoryPath.replace(/^\//, ''));
            return line.match(/^\d+\s+blob\s+([0-9a-f]{40})\t/)?.[1] ?? null;
          };

          function execute() {
            const issues = [];
            const expected = new Map(H_EARTH_GRATITUDE_REGION_COORDINATE_RECONCILIATION_CORRECTED_PACKAGE_OCCURRENCES);
            const paths = [...expected.keys()];
            const governed = paths.filter((path) => path.startsWith('/h-earth-3d/') || path.startsWith('/showroom/globe/h-earth/'));
            const dependencies = loadDependencies();
            const actual = paths.map((path) => ({ path, expectedBlob: expected.get(path), actualBlob: blobAt(PACKAGE_HEAD, path) }));

            if (git('rev-parse', 'HEAD') !== CANDIDATE_HEAD) issues.push('CANDIDATE_HEAD_MISMATCH');
            if (blobAt(CANDIDATE_HEAD, SELF_PATH) !== CORRECTION_BLOB) issues.push('CORRECTION_OVERLAY_BLOB_MISMATCH');
            if (blobAt(CANDIDATE_HEAD, LOADER_PATH) !== LOADER_BLOB) issues.push('CORRECTION_LOADER_BLOB_MISMATCH');
            if (paths.length !== 16) issues.push(`PACKAGE_PATH_COUNT_${paths.length}_NOT_16`);
            if (governed.length !== 15) issues.push(`GOVERNED_PATH_COUNT_${governed.length}_NOT_15`);
            for (const item of actual) if (item.expectedBlob !== item.actualBlob) issues.push(`PACKAGE_BLOB_MISMATCH:${item.path}`);
            if (expected.get(TARGET_PATH) !== CORRECTED_BLOB) issues.push('TARGET_EXPECTED_BLOB_NOT_CORRECTED');
            if (blobAt(PACKAGE_HEAD, TARGET_PATH) !== CORRECTED_BLOB) issues.push('TARGET_GIT_TREE_BLOB_NOT_CORRECTED');
            if (dependencies.identityVerified !== true) issues.push('LOADER_IDENTITY_NOT_VERIFIED');
            if (dependencies.registryFacade !== registryFacade) issues.push('LOADER_NOT_USING_CORRECTED_FACADE');

            for (const path of [...paths, SELF_PATH, LOADER_PATH]) {
              const resolution = registryFacade.resolveHEarthRepositoryRegistryPath(path);
              if (resolution.resolved !== true || resolution.unresolved !== false) issues.push(`PATH_UNRESOLVED:${path}`);
              if (!resolution.nodes.some((node) => node.nodeId === NODE_ID)) issues.push(`NODE_NOT_RESOLVED:${path}`);
            }
            const correctedResolution = registryFacade.resolveHEarthRepositoryRegistryOccurrence({
              path: TARGET_PATH,
              commitSha: PACKAGE_HEAD,
              gitBlobSha: CORRECTED_BLOB
            });
            const retiredResolution = registryFacade.resolveHEarthRepositoryRegistryOccurrence({
              path: TARGET_PATH,
              commitSha: PACKAGE_HEAD,
              gitBlobSha: RETIRED_BLOB
            });
            if (correctedResolution.resolved !== true || correctedResolution.matches.length !== 1) issues.push('CORRECTED_OCCURRENCE_NOT_EXACTLY_RESOLVED');
            if (retiredResolution.resolved !== false || retiredResolution.matches.length !== 0) issues.push('RETIRED_OCCURRENCE_STILL_RESOLVES');

            const preflight = runAutomaticHEarthPreflight({
              paths: governed,
              taskText: 'Validate exact Gratitude Region occurrence correction before active-main admission',
              mutationIntent: false
            });
            const failureCodes = preflight.validatorReceipt?.failureCodes ?? [];
            const resolvedPaths = preflight.validatorReceipt?.resolvedPaths ?? [];
            const affectedNodeIds = preflight.scopePreview?.affectedNodeIds ?? [];
            if (preflight.finalDisposition !== 'PASS') issues.push(`PREFLIGHT_${preflight.finalDisposition}`);
            if (preflight.continuation !== 'READ_ONLY_CONTINUATION_PERMITTED') issues.push(`CONTINUATION_${preflight.continuation}`);
            if (failureCodes.length !== 0) issues.push(`FAILURE_CODES:${failureCodes.join(',')}`);
            if (resolvedPaths.length !== 15) issues.push(`RESOLVED_PATHS_${resolvedPaths.length}_NOT_15`);
            if (!affectedNodeIds.includes(NODE_ID)) issues.push('CORRECTED_NODE_NOT_IN_SCOPE');

            const node = registryFacade.getHEarthRepositoryRegistryNode(NODE_ID);
            if (node.authorityClass !== 'NO_AUTHORITY') issues.push('AUTHORITY_OVERREACH');
            if (node.allowedMutationScope !== 'READ_ONLY_INSPECTION') issues.push('MUTATION_SCOPE_OVERREACH');
            if (node.lifecycleStatus !== 'CANDIDATE') issues.push('LIFECYCLE_PROMOTION');
            for (const limitation of [
              'NO_SPATIAL_CANDIDATE_ACCEPTANCE',
              'NO_FINAL_COORDINATES_OR_ANCHORS',
              'NO_PR_311_RETARGET_OR_MERGE_AUTHORITY',
              'NO_CANONICALIZATION',
              'NO_PRODUCT_CONSTRUCTION'
            ]) if (!node.authorityLimitations.includes(limitation)) issues.push(`LIMITATION_MISSING:${limitation}`);

            const base = {
              schemaVersion: 'H_EARTH_GRATITUDE_REGION_REGISTRY_OCCURRENCE_CORRECTION_VALIDATION_RECEIPT_v1',
              candidateHead: CANDIDATE_HEAD,
              correctionOverlayBlob: CORRECTION_BLOB,
              correctedLoaderBlob: LOADER_BLOB,
              packageHead: PACKAGE_HEAD,
              exactPackagePathCount: paths.length,
              exactPackageBlobMatches: actual.every((item) => item.expectedBlob === item.actualBlob),
              correctedTargetPath: TARGET_PATH,
              retiredUnretrievableBlob: RETIRED_BLOB,
              correctedRetrievedBlob: CORRECTED_BLOB,
              correctedOccurrenceResolved: correctedResolution.resolved,
              retiredOccurrenceResolved: retiredResolution.resolved,
              registrySelfPathResolved: registryFacade.resolveHEarthRepositoryRegistryPath(SELF_PATH).resolved,
              registryLoaderPathResolved: registryFacade.resolveHEarthRepositoryRegistryPath(LOADER_PATH).resolved,
              loaderIdentityVerified: dependencies.identityVerified,
              preflightFinalDisposition: preflight.finalDisposition,
              preflightContinuation: preflight.continuation,
              preflightResolvedPathCount: resolvedPaths.length,
              preflightFailureCodes: failureCodes,
              requestedPathUnresolvedClosed: !failureCodes.includes('REQUESTED_PATH_UNRESOLVED'),
              operationScopeUnresolvedClosed: !failureCodes.includes('OPERATION_SCOPE_UNRESOLVED'),
              spatialCandidateAcceptanceCreated: false,
              finalCoordinateAuthorityCreated: false,
              pr311RetargetAuthorityCreated: false,
              pr311MergeAuthorityCreated: false,
              canonicalizationAuthorityCreated: false,
              terrainMutationAuthorityCreated: false,
              geometryConstructionAuthorityCreated: false,
              productConstructionAuthorityCreated: false,
              issues
            };
            return { ...base, receiptDigest: digest(base), status: issues.length === 0 ? 'PASS_CLOSED' : 'FAIL_STOPPED' };
          }

          const first = execute();
          const second = execute();
          const deterministic = first.receiptDigest === second.receiptDigest;
          fs.writeFileSync('/tmp/h-earth-registry-occurrence-correction.first.json', `${JSON.stringify(first, null, 2)}\n`);
          fs.writeFileSync('/tmp/h-earth-registry-occurrence-correction.second.json', `${JSON.stringify(second, null, 2)}\n`);
          const custody = {
            schemaVersion: 'H_EARTH_GRATITUDE_REGION_REGISTRY_OCCURRENCE_CORRECTION_VALIDATION_CUSTODY_v1',
            status: deterministic && first.status === 'PASS_CLOSED' && second.status === 'PASS_CLOSED' ? 'PASS_CLOSED' : 'FAIL_STOPPED',
            candidateHead: first.candidateHead,
            correctionOverlayBlob: first.correctionOverlayBlob,
            correctedLoaderBlob: first.correctedLoaderBlob,
            packageHead: first.packageHead,
            correctedTargetPath: first.correctedTargetPath,
            retiredUnretrievableBlob: first.retiredUnretrievableBlob,
            correctedRetrievedBlob: first.correctedRetrievedBlob,
            firstExecutionDigest: first.receiptDigest,
            secondExecutionDigest: second.receiptDigest,
            deterministicRepeatExecution: deterministic,
            exactPackagePathCount: first.exactPackagePathCount,
            preflightResolvedPathCount: first.preflightResolvedPathCount,
            preflightFinalDisposition: first.preflightFinalDisposition,
            preflightFailureCodes: first.preflightFailureCodes,
            pr311RetargetAuthorityCreated: false,
            pr311MergeAuthorityCreated: false,
            canonicalizationAuthorityCreated: false,
            productConstructionAuthorityCreated: false
          };
          fs.writeFileSync('/tmp/h-earth-registry-occurrence-correction.custody.json', `${JSON.stringify(custody, null, 2)}\n`);
          console.log(JSON.stringify(custody, null, 2));
          if (custody.status !== 'PASS_CLOSED') process.exitCode = 1;
          NODE

      - name: Upload correction validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-gratitude-region-registry-occurrence-correction-evidence
          path: |
            /tmp/h-earth-registry-occurrence-correction.first.json
            /tmp/h-earth-registry-occurrence-correction.second.json
            /tmp/h-earth-registry-occurrence-correction.custody.json
          if-no-files-found: error
          retention-days: 30
