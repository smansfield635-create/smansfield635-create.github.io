name: H-Earth Gate B Route Adapter Probe

on:
  pull_request:
    branches:
      - agent/h-earth-gate-b-seven-file-verification-001
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'agent/h-earth-gate-b-seven-file-trigger-001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute Gate B route input bridge
        shell: bash
        run: |
          set -euo pipefail
          node --check showroom/globe/h-earth/render/ground-view-gate-b-packet-002-adapter.js
          node --check showroom/globe/h-earth/gate-b-route-input.js
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const routeInput = await import('./showroom/globe/h-earth/gate-b-route-input.js');
          const result = routeInput.buildHEarthGateBRouteInput({
            occurrenceToken: 'ROUTE_INPUT_PROBE_001'
          });
          const receipt = {
            routeInputContractId: routeInput.H_EARTH_GATE_B_ROUTE_INPUT_CONTRACT_ID,
            valid: result.valid,
            packet002Ok: result.packet002Transfer.ok,
            packet002Status: result.packet002Transfer.status,
            packet002IssueCount: result.packet002Transfer.issues?.length ?? null,
            packet002TransferOccurrenceId: result.packet002TransferOccurrenceId,
            compositorFrameOccurrenceId: result.compositorFrameOccurrenceId,
            provenance: result.provenance,
            admittedFrameCompatibility: result.admittedFrameCompatibility,
            routeIntegrated: result.routeIntegrated,
            rendererMaterialized: result.rendererMaterialized,
            validationClaim: result.validationClaim,
            productionClaim: result.productionClaim
          };
          fs.writeFileSync('H_EARTH_GATE_B_ROUTE_INPUT_PROBE_v1.json', JSON.stringify(receipt,null,2));
          console.log(JSON.stringify(receipt,null,2));
          if (receipt.valid !== true || receipt.packet002Ok !== true || receipt.packet002IssueCount !== 0) process.exit(1);
          EOF
      - name: Upload route input receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-gate-b-route-input-probe-v1
          path: H_EARTH_GATE_B_ROUTE_INPUT_PROBE_v1.json
          if-no-files-found: error
