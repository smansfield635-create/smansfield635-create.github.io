name: H-Earth Run 8E R2A Pass-Closed Validation

on:
  push:
    branches:
      - agent/h-earth-run8e-r2-immutable-live-render-package-001
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-run8e-r2a-pass-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      H_EARTH_RUN8E_R2_OUTPUT: /tmp/h-earth-run8e-r2a-final
    steps:
      - name: Check out final R2A branch
        uses: actions/checkout@v4
        with:
          ref: agent/h-earth-run8e-r2-immutable-live-render-package-001
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify final JavaScript and JSON syntax
        run: |
          node --check h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r2.immutable-live-render-package.js
          node --check showroom/globe/h-earth/render/live-render-package.run8e-r2.js
          node --check h-earth-3d/validation/h-earth.run8e-r2.immutable-live-render-package.validation.mjs
          node -e "JSON.parse(require('fs').readFileSync('h-earth-3d/validation/run-8e-r2/h-earth.run8e-r2a.attempt-001.failure.receipt.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('h-earth-3d/validation/run-8e-r2/h-earth.run8e-r2a.pass-closed.receipt.json','utf8'))"

      - name: Verify executed package source identity and cleanup
        run: |
          set -euo pipefail
          test "$(git hash-object showroom/globe/h-earth/render/live-render-package.run8e-r2.js)" = "1699654f39c9e183f4cfc6f75b20ba051641b763"
          test ! -e h-earth-3d/validation/h-earth.run8e-r2a.attempt-002.apply.mjs
          test "$(git show HEAD:.github/workflows/h-earth-run8e-r2-immutable-live-render-package.yml | grep -c 'contents: read')" = "1"
          test "$(git show HEAD:.github/workflows/h-earth-run8e-r2-immutable-live-render-package.yml | grep -c 'contents: write' || true)" = "0"

      - name: Execute final R2A closure validation
        run: |
          mkdir -p "$H_EARTH_RUN8E_R2_OUTPUT"
          set -o pipefail
          node h-earth-3d/validation/h-earth.run8e-r2.immutable-live-render-package.validation.mjs 2>&1 \
            | tee "$H_EARTH_RUN8E_R2_OUTPUT/r2a-final-validation.log"

      - name: Verify exact R2A scope and R2B stopping boundary
        run: |
          set -euo pipefail
          git diff --check
          BASE_SHA=a660d54b0df30e768b95e2314b918d0f263883ed
          git diff --name-only "$BASE_SHA"...HEAD | sort >/tmp/h-earth-run8e-r2a-final-paths.txt
          python3 - <<'PY'
          from pathlib import Path
          paths = [line.strip() for line in Path('/tmp/h-earth-run8e-r2a-final-paths.txt').read_text().splitlines() if line.strip()]
          required = {
              '.github/workflows/h-earth-run8e-r2-immutable-live-render-package.yml',
              'h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r2.immutable-live-render-package.js',
              'h-earth-3d/validation/h-earth.run8e-r2.immutable-live-render-package.validation.mjs',
              'h-earth-3d/validation/run-8e-r2/h-earth.run8e-r2a.attempt-001.failure.receipt.json',
              'h-earth-3d/validation/run-8e-r2/h-earth.run8e-r2a.pass-closed.receipt.json',
              'showroom/globe/h-earth/render/live-render-package.run8e-r2.js'
          }
          actual = set(paths)
          unexpected = sorted(actual - required)
          missing = sorted(required - actual)
          if unexpected:
              raise SystemExit(f'R2A_FINAL_UNEXPECTED_PATHS:{unexpected}')
          if missing:
              raise SystemExit(f'R2A_FINAL_REQUIRED_PATHS_MISSING:{missing}')
          forbidden = [
              path for path in paths
              if path in {
                  'showroom/globe/h-earth/index.html',
                  'showroom/globe/h-earth/index.js',
                  'showroom/globe/h-earth/render/renderer.functional-landscape.js',
                  'showroom/globe/h-earth/render/run8e-successor-environment.js'
              }
              or 'attempt-002.apply' in path.lower()
              or 'run8e-r2b' in path.lower()
              or 'run-8e-r2b' in path.lower()
              or 'run8e-r3' in path.lower()
              or 'run-8e-r3' in path.lower()
          ]
          if forbidden:
              raise SystemExit(f'R2A_FINAL_LATER_CHECKPOINT_PROTECTED_OR_TEMPORARY_PATH:{forbidden}')
          print({
              'checkpoint': 'RUN_8E_R2A',
              'status': 'PASS_CLOSED',
              'pathCount': len(paths),
              'paths': paths,
              'temporaryCorrectionScriptPresent': False,
              'workflowReadOnly': True,
              'run8ER2BStarted': False,
              'run8ER3Started': False,
              'run8EPassClosed': False
          })
          PY

      - name: Upload final R2A closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-run8e-r2a-pass-closed-evidence
          path: |
            /tmp/h-earth-run8e-r2a-final
            /tmp/h-earth-run8e-r2a-final-paths.txt
          if-no-files-found: warn
          retention-days: 90
