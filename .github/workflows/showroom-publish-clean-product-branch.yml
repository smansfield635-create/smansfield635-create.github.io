name: Publish clean Showroom product branch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-clean-product:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.ref == 'agent/showroom-glow-envelope-execution-001'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Create product-only branch from verified main
        env:
          EXPECTED_MAIN: cabe801ec64cb3e58a404774e9408a1b58de285b
          PRODUCT_BRANCH: agent/showroom-glow-envelope-product-001
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          actual_main=$(git rev-parse origin/main)
          test "$actual_main" = "$EXPECTED_MAIN"

          if git ls-remote --exit-code --heads origin "$PRODUCT_BRANCH" >/dev/null 2>&1; then
            echo "Product branch already exists; refusing implicit replacement."
            exit 1
          fi

          git switch --detach "$SOURCE_SHA"
          git switch -c "$PRODUCT_BRANCH" origin/main
          git checkout "$SOURCE_SHA" -- \
            showroom/index.crystals.js \
            showroom/index.crystals.source.js \
            showroom/index.compositor.js \
            showroom/index.html

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            showroom/index.crystals.js \
            showroom/index.crystals.source.js \
            showroom/index.compositor.js \
            showroom/index.html
          git commit -m 'Publish Showroom glow and presentation correction'

          mapfile -t changed < <(git diff --name-only origin/main...HEAD | sort)
          expected=(
            showroom/index.compositor.js
            showroom/index.crystals.js
            showroom/index.crystals.source.js
            showroom/index.html
          )
          test "${#changed[@]}" -eq 4
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done
          cmp --silent showroom/index.crystals.js showroom/index.crystals.source.js
          test ! -e showroom/index.cosmos.source.js
          git push origin "HEAD:refs/heads/$PRODUCT_BRANCH"
