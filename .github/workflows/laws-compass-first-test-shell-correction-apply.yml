name: Laws Compass FIRST Test Shell Correction Apply

on:
  push:
    branches:
      - agent/laws-compass-first-test-shell-correction-cp0-001
    paths:
      - ".github/workflows/laws-compass-first-test-shell-correction-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.ref_name == 'agent/laws-compass-first-test-shell-correction-cp0-001'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/laws-compass-first-test-shell-correction-cp0-001
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply bounded Laws Compass correction
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual}: {old[:100]!r}")
              p.write_text(text.replace(old, new, count))

          # HTML contract, FIRST/Test semantics, and shell controls.
          replace_exact(
              "laws/index.html",
              'data-laws-bounded-round="LAWS_ACTIVE_CLUSTER_SECONDARY_LABELS_20260727A"',
              'data-laws-bounded-round="LAWS_FIRST_TEST_LABEL_AND_SHELL_CONFORMANCE_20260729A"'
          )
          replace_exact(
              "laws/index.html",
              'data-laws-secondary-label-model="active-cluster-four-law-labels-inward-edge-constrained"',
              'data-laws-secondary-label-model="active-cluster-primary-law-label-only"'
          )
          replace_exact(
              "laws/index.html",
              '  data-laws-secondary-label-pointer-authority="none"\n',
              '  data-laws-secondary-label-pointer-authority="none"\n  data-laws-method-acronym="FIRST"\n  data-laws-test-method="cross-cutting-no-fifth-star"\n  data-laws-primary-star-count="4"\n'
          )
          replace_exact(
              "laws/index.html",
              '''            <span data-laws-atlas-category="structure">\n              <strong>S</strong>\n              Structure\n            </span>\n          </div>\n        </div>''',
              '''            <span data-laws-atlas-category="structure">\n              <strong>S</strong>\n              Structure\n            </span>\n\n            <span class="laws-atlas-key__method" data-laws-atlas-method="test">\n              <strong>T</strong>\n              Test\n            </span>\n          </div>\n\n          <section class="laws-first-method" data-laws-first-method aria-label="FIRST method">\n            <span class="laws-first-method__acronym" aria-label="Flow Integrity Reality Structure Test">FIRST</span>\n            <div>\n              <strong>Every law must pass the Test.</strong>\n              <p>Test is the cross-cutting method applied to Flow, Integrity, Reality, and Structure. It is not a fifth law and does not add a fifth star.</p>\n            </div>\n          </section>\n        </div>'''
          )
          replace_exact(
              "laws/index.html",
              '''            data-laws-return-to-orbit\n            disabled\n          >\n            <span data-laws-return-to-orbit-label>\n              Return\n            </span>''',
              '''            data-laws-return-to-orbit\n            hidden\n            aria-hidden="true"\n            aria-disabled="true"\n            tabindex="-1"\n            disabled\n          >\n            <span data-laws-return-to-orbit-label>\n              Return to Orbit\n            </span>'''
          )

          # Shared page styling and shell hierarchy.
          css_path = Path("laws/index.css")
          css = css_path.read_text()
          css = css.replace(
              "- no visible compass/star label bubbles;",
              "- Compass-family category labels use an in-star letter and protected word tab;"
          )
          marker = "/* LAWS_FIRST_TEST_LABEL_AND_SHELL_CONFORMANCE_20260729A */"
          if marker in css:
              raise SystemExit("laws/index.css: correction block already present")
          css += r'''

/* LAWS_FIRST_TEST_LABEL_AND_SHELL_CONFORMANCE_20260729A */
.laws-atlas-key__legend .laws-atlas-key__method {
  border-color: rgba(124, 220, 255, 0.30);
  color: rgba(255, 248, 224, 0.96);
  background: linear-gradient(135deg, rgba(14, 35, 48, 0.78), rgba(45, 35, 18, 0.72));
  box-shadow: 0 0 18px rgba(124, 220, 255, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.07);
}

.laws-first-method {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  gap: 14px;
  margin-top: 2px;
  padding: 13px 14px;
  border: 1px solid rgba(124, 220, 255, 0.20);
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(7, 18, 29, 0.86), rgba(30, 24, 13, 0.72));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

.laws-first-method__acronym {
  display: grid;
  place-items: center;
  min-width: 4.5rem;
  min-height: 4.5rem;
  padding: 0.55rem;
  border: 1px solid rgba(243, 217, 139, 0.46);
  border-radius: 50%;
  color: #120f08;
  background: radial-gradient(circle at 35% 30%, #fff2b8, #c89d48 68%, #6f5324);
  font-size: 0.78rem;
  font-weight: 950;
  letter-spacing: 0.10em;
  box-shadow: 0 0 24px rgba(243, 217, 139, 0.14);
}

.laws-first-method strong {
  color: rgba(255, 248, 224, 0.98);
  font-size: 1rem;
}

.laws-first-method p {
  margin: 0.28rem 0 0;
  color: var(--laws-ink-soft);
  font-size: 0.88rem;
}

.laws-atlas-key__actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.laws-atlas-key__actions > * {
  width: 100%;
}

.laws-atlas-key__main-compass {
  grid-column: 1 / -1;
}

.laws-atlas-key__return:not([hidden]) {
  border-color: rgba(124, 220, 255, 0.30);
  background: linear-gradient(135deg, rgba(7, 24, 37, 0.90), rgba(8, 13, 22, 0.94));
}

@media (max-width: 560px) {
  .laws-first-method {
    grid-template-columns: 1fr;
  }
  .laws-first-method__acronym {
    min-width: 3.8rem;
    min-height: 3.8rem;
    justify-self: start;
  }
  .laws-atlas-key__actions {
    grid-template-columns: 1fr;
  }
  .laws-atlas-key__main-compass {
    grid-column: auto;
  }
}
'''
          css_path.write_text(css)

          # Label presentation remains owned by direct interactions.
          p = Path("laws/index.interactions.js")
          text = p.read_text()
          text = text.replace(
              'version:"1.1.0-main-compass-gesture-continuity",build:"LAWS_ACTIVE_CLUSTER_SECONDARY_LABELS_20260727A"',
              'version:"1.2.0-first-test-label-conformance",build:"LAWS_FIRST_TEST_LABEL_AND_SHELL_CONFORMANCE_20260729A"'
          )
          text = text.replace(
              'const LABEL=Object.freeze({flow:"Flow",integrity:"Integrity",reality:"Reality",structure:"Structure"});',
              'const LABEL=Object.freeze({flow:"Flow",integrity:"Integrity",reality:"Reality",structure:"Structure"});\n  const LETTER=Object.freeze({flow:"F",integrity:"I",reality:"R",structure:"S"});'
          )
          style_pattern = re.compile(r'style\.textContent=`.*?`;document\.head\.append\(style\);', re.S)
          new_style = r'''style.textContent=`[data-laws-projected-category-labels],[data-laws-projected-law-labels]{position:absolute;inset:0;pointer-events:none;overflow:hidden;contain:layout paint}[data-laws-projected-category-labels]{z-index:22}[data-laws-projected-law-labels]{z-index:23}[data-laws-projected-category-label]{position:absolute;display:block;width:clamp(4.8rem,12vw,6.2rem);height:clamp(3.8rem,9vw,5.2rem);padding:0;border:0;background:transparent;color:rgba(246,238,223,.96);cursor:pointer;pointer-events:auto;touch-action:manipulation;transform:translate(-50%,-50%)}[data-laws-projected-category-letter]{position:absolute;left:50%;top:42%;display:grid;place-items:center;width:1.65rem;height:1.65rem;border:1px solid rgba(255,248,224,.34);border-radius:50%;color:#140f07;background:radial-gradient(circle at 35% 28%,#fff4c8,#d7ae5c 66%,#705121);font:950 .82rem/1 Inter,system-ui,sans-serif;letter-spacing:.04em;transform:translate(-50%,-50%);box-shadow:0 0 .9rem rgba(243,217,139,.20),inset 0 1px 0 rgba(255,255,255,.45)}[data-laws-projected-category-word]{position:absolute;left:50%;top:69%;display:block;min-width:4.2rem;padding:.24rem .44rem;border:1px solid rgba(225,218,198,.20);border-radius:999px;color:rgba(255,248,224,.96);background:linear-gradient(135deg,rgba(4,8,16,.88),rgba(20,31,43,.82));font:900 clamp(.54rem,1.12vw,.70rem)/1.05 Inter,system-ui,sans-serif;letter-spacing:.075em;text-transform:uppercase;text-align:center;text-shadow:0 .1rem .18rem #000,0 0 .55rem #000;white-space:nowrap;transform:translate(-50%,-50%);box-shadow:0 .35rem 1rem rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.07);backdrop-filter:blur(3px)}[data-laws-projected-law-label]{position:absolute;max-width:min(10rem,44vw);padding:.28rem .48rem;border:1px solid rgba(225,218,198,.20);border-radius:999px;background:linear-gradient(135deg,rgba(3,6,13,.88),rgba(22,31,42,.80));color:rgba(246,238,223,.96);font:900 clamp(.56rem,1.18vw,.72rem)/1.05 Inter,system-ui,sans-serif;letter-spacing:.075em;text-transform:uppercase;text-align:center;text-shadow:0 .1rem .18rem #000,0 0 .55rem #000;white-space:nowrap;pointer-events:none;touch-action:none;transform:translate(-50%,-50%);box-shadow:0 .35rem 1rem rgba(0,0,0,.46),0 0 .72rem rgba(124,220,255,.08);backdrop-filter:blur(3px)}[data-laws-projected-category-label][data-depth-layer="rear"]{opacity:.48;filter:saturate(.72) brightness(.74)}[data-laws-projected-law-label][data-depth-layer="rear"]{opacity:.58;filter:saturate(.78) brightness(.78)}[data-laws-projected-category-label][data-primary="true"],[data-laws-projected-law-label][data-primary="true"]{opacity:1;color:#fff3be;filter:brightness(1.16) drop-shadow(0 0 .52rem rgba(245,213,130,.38))}`;document.head.append(style);'''
          text, n = style_pattern.subn(new_style, text, count=1)
          if n != 1:
              raise SystemExit(f"laws/index.interactions.js: style replacement count {n}")
          text = text.replace(
              'el.textContent=LABEL[id];el.setAttribute("aria-label",`Open ${LABEL[id]}`);',
              'el.replaceChildren();const letter=document.createElement("span"),word=document.createElement("span");letter.dataset.lawsProjectedCategoryLetter=id;letter.textContent=LETTER[id];letter.setAttribute("aria-hidden","true");word.dataset.lawsProjectedCategoryWord=id;word.textContent=LABEL[id];el.append(letter,word);el.setAttribute("aria-label",`Open ${LABEL[id]}`);'
          )
          text = text.replace(
              'lawLayer.dataset.lawsProjectedLawLabels="active-cluster";',
              'lawLayer.dataset.lawsProjectedLawLabels="active-cluster-primary-only";'
          )
          old_category_position = 'const dx=r.x-cx,dy=r.y-cy,n=Math.hypot(dx,dy)||1,out=Math.min(66,Math.max(36,(finite(r.radiusPx,28)*.66)+10));el.hidden=false;el.style.left=`${r.x+dx/n*out}px`;el.style.top=`${r.y+dy/n*out}px`;'
          new_category_position = 'el.hidden=false;el.style.left=`${r.x}px`;el.style.top=`${r.y}px`;'
          if old_category_position not in text:
              raise SystemExit("laws/index.interactions.js: category position target absent")
          text = text.replace(old_category_position, new_category_position, 1)
          text = text.replace(
              'if(m!==MODE.CLUSTER||!control||!r?.visible||direction(control.dataset.direction)!==active){el.hidden=true;continue;}',
              'if(m!==MODE.CLUSTER||!control||!r?.visible||direction(control.dataset.direction)!==active||id!==primary){el.hidden=true;continue;}'
          )
          text = text.replace(
              'el.dataset.lawsProjectedPlacement="inward-edge-constrained";',
              'el.dataset.lawsProjectedPlacement="primary-only-inward-edge-constrained";'
          )
          for needle in ["LETTER=Object.freeze", "active-cluster-primary-only", "id!==primary", "lawsProjectedCategoryLetter"]:
              if needle not in text:
                  raise SystemExit(f"laws/index.interactions.js: required result absent: {needle}")
          p.write_text(text)

          # Controller keeps behavior but adopts the accepted return identity.
          p = Path("laws/index.controller.js")
          text = p.read_text()
          replacements = {
              'label = "Return"': 'label = "Return to Orbit"',
              '? "Return"\n          : "Return"': '? "Return to Orbit"\n          : "Return to Orbit"',
              'setReturnToOrbitVisible(true, "Return");': 'setReturnToOrbitVisible(true, "Return to Orbit");'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"laws/index.controller.js: target absent: {old!r}")
              text = text.replace(old, new)
          p.write_text(text)

          # Four-Compass config: Laws becomes a positive family member and exact-head local origin is supported.
          replace_exact(
              "verification/benchmark-tools/four-compass-benchmark-v1/four-compass-benchmark.config.mjs",
              'export const ORIGIN = "https://smansfield635-create.github.io";',
              'export const ORIGIN = process.env.FOUR_COMPASS_ORIGIN || "http://127.0.0.1:4173";'
          )
          replace_exact(
              "verification/benchmark-tools/four-compass-benchmark-v1/four-compass-benchmark.config.mjs",
              '''    posture: "NEGATIVE_REFERENCE",\n    root: "div[data-laws-root]",''',
              '''    posture: "POSITIVE_REFERENCE",\n    root: "div[data-laws-root]",'''
          )
          replace_exact(
              "verification/benchmark-tools/four-compass-benchmark-v1/four-compass-benchmark.config.mjs",
              '''    returnControl: "[data-laws-return-to-orbit]",\n    panel: "[data-laws-panel], [data-laws-front-host]",''',
              '''    returnControl: "[data-laws-return-to-orbit]",\n    categoryLabel: "[data-laws-projected-category-label][data-primary='true']",\n    childLabel: "[data-laws-projected-law-label][data-primary='true']",\n    method: "[data-laws-first-method]",\n    panel: "[data-laws-panel], [data-laws-front-host]",'''
          )

          # Exact browser evidence for Laws label counts, FIRST/Test, and return identity.
          p = Path("verification/benchmark-tools/four-compass-benchmark-v1/four-compass-browser-baseline.mjs")
          text = p.read_text()
          text = text.replace(
              '''    returnControl: config.returnControl,\n    panel: config.panel''',
              '''    returnControl: config.returnControl,\n    categoryLabel: config.categoryLabel,\n    childLabel: config.childLabel,\n    method: config.method,\n    panel: config.panel'''
          )
          target = '''  const findings = [];\n  if (metrics.horizontalOverflowPx > 2) findings.push({ id: "HORIZONTAL_OVERFLOW", observed: metrics.horizontalOverflowPx });'''
          addition = '''  const lawsConformance = config.route === "/laws/" ? await page.evaluate(() => {\n    const rendered = element => {\n      if (!element || element.hidden) return false;\n      const style = getComputedStyle(element);\n      const rect = element.getBoundingClientRect();\n      return style.display !== "none" && style.visibility !== "hidden" && Number(style.opacity || 1) > 0.01 && rect.width > 0 && rect.height > 0;\n    };\n    const categories = Array.from(document.querySelectorAll("[data-laws-projected-category-label]"));\n    const laws = Array.from(document.querySelectorAll("[data-laws-projected-law-label]"));\n    const returnControl = document.querySelector("[data-laws-return-to-orbit]");\n    const root = document.querySelector("[data-laws-root]");\n    return {\n      firstMethodPresent: Boolean(document.querySelector("[data-laws-first-method]")),\n      acronym: document.documentElement.dataset.lawsMethodAcronym || "",\n      testMethod: document.documentElement.dataset.lawsTestMethod || "",\n      primaryStarCount: Number(document.documentElement.dataset.lawsPrimaryStarCount || 0),\n      categoryVisibleCount: categories.filter(rendered).length,\n      categoryPrimaryCount: categories.filter(element => rendered(element) && element.dataset.primary === "true").length,\n      categoryLetterCount: categories.filter(element => element.querySelector("[data-laws-projected-category-letter]")).length,\n      categoryWordCount: categories.filter(element => element.querySelector("[data-laws-projected-category-word]")).length,\n      lawVisibleCount: laws.filter(rendered).length,\n      lawPrimaryCount: laws.filter(element => rendered(element) && element.dataset.primary === "true").length,\n      returnText: (returnControl?.textContent || "").replace(/\\s+/g, " ").trim(),\n      returnVisible: rendered(returnControl),\n      controllerState: root?.dataset.lawsControllerState || ""\n    };\n  }) : null;\n  const findings = [];\n  if (metrics.horizontalOverflowPx > 2) findings.push({ id: "HORIZONTAL_OVERFLOW", observed: metrics.horizontalOverflowPx });\n  if (lawsConformance) {\n    if (!lawsConformance.firstMethodPresent || lawsConformance.acronym !== "FIRST" || lawsConformance.testMethod !== "cross-cutting-no-fifth-star" || lawsConformance.primaryStarCount !== 4) findings.push({ id: "LAWS_FIRST_TEST_METHOD_INVALID", observed: lawsConformance });\n    if (["INITIAL", "CONTROLLED_DRAG"].includes(stateLabel) && (lawsConformance.categoryVisibleCount !== 4 || lawsConformance.categoryPrimaryCount !== 1 || lawsConformance.categoryLetterCount !== 4 || lawsConformance.categoryWordCount !== 4)) findings.push({ id: "LAWS_CATEGORY_LABEL_CONFORMANCE_FAILED", observed: lawsConformance });\n    if (["CARDINAL_ATTEMPT", "CHILD_ATTEMPT"].includes(stateLabel) && (lawsConformance.lawVisibleCount !== 1 || lawsConformance.lawPrimaryCount !== 1)) findings.push({ id: "LAWS_CLUSTER_SINGLE_LABEL_FAILED", observed: lawsConformance });\n    if (stateLabel === "CHILD_ATTEMPT" && (!lawsConformance.returnVisible || lawsConformance.returnText !== "Return to Orbit")) findings.push({ id: "LAWS_RETURN_TO_ORBIT_IDENTITY_FAILED", observed: lawsConformance });\n  }'''
          if target not in text:
              raise SystemExit("four-compass-browser-baseline.mjs: findings target absent")
          text = text.replace(target, addition, 1)
          text = text.replace(
              '''  return { stateLabel, fullPage, filename, byteLength: buffer.length, sha256: digestBytes(buffer), state, metrics, elements, overlaps, findings };''',
              '''  return { stateLabel, fullPage, filename, byteLength: buffer.length, sha256: digestBytes(buffer), state, metrics, elements, overlaps, lawsConformance, findings };'''
          )
          p.write_text(text)

          # Both benchmark workflows serve and test the exact checked-out candidate.
          for workflow in [
              ".github/workflows/metaverse-benchmark-four-compass-tool.yml",
              ".github/workflows/metaverse-benchmark-four-compass-tool-smoke.yml"
          ]:
              p = Path(workflow)
              text = p.read_text()
              text = text.replace(
                  '''env:\n  EXECUTION_COMMIT:''',
                  '''env:\n  FOUR_COMPASS_ORIGIN: http://127.0.0.1:4173\n  EXECUTION_COMMIT:'''
              ) if "EXECUTION_BRANCH" not in text else text.replace(
                  '''env:\n  EXECUTION_BRANCH:''',
                  '''env:\n  FOUR_COMPASS_ORIGIN: http://127.0.0.1:4173\n  EXECUTION_BRANCH:'''
              )
              setup_anchor = '''      - name: Execute separated browser baselines\n''' if "browser baselines" in text else '''      - name: Execute separated smoke capture\n'''
              server_step = '''      - name: Start exact-head static server\n        shell: bash\n        run: |\n          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/four-compass-server.log 2>&1 &\n          for attempt in $(seq 1 40); do\n            if curl -fsS http://127.0.0.1:4173/laws/ >/dev/null; then\n              exit 0\n            fi\n            sleep 0.25\n          done\n          cat /tmp/four-compass-server.log\n          exit 1\n\n'''
              if setup_anchor not in text:
                  raise SystemExit(f"{workflow}: execution anchor absent")
              text = text.replace(setup_anchor, server_step + setup_anchor, 1)
              if workflow.endswith("tool.yml"):
                  text = text.replace(
                      '''          if (compass.status !== 'PASS_BOUNDED_LANE_BASELINE') failures.push('compass_status');''',
                      '''          if (compass.status !== 'PASS_BOUNDED_LANE_BASELINE') failures.push('compass_status');\n          const lawsSummary = compass.summaries.find(item => item.authorityId === 'LAWS_COMPASS');\n          const lawsFindings = compass.findings.filter(item => item.authorityId === 'LAWS_COMPASS' && String(item.id || '').startsWith('LAWS_'));\n          if (!lawsSummary || lawsSummary.posture !== 'POSITIVE_REFERENCE') failures.push('laws_posture');\n          if (lawsFindings.length) failures.push(`laws_conformance:${lawsFindings.map(item => item.id).join('|')}`);'''
                  )
              p.write_text(text)

          # Syntax and required-source checks before committing.
          required = {
              "laws/index.html": ["data-laws-method-acronym=\"FIRST\"", "Return to Orbit", "data-laws-first-method"],
              "laws/index.css": ["LAWS_FIRST_TEST_LABEL_AND_SHELL_CONFORMANCE_20260729A"],
              "laws/index.interactions.js": ["active-cluster-primary-only", "lawsProjectedCategoryLetter", "id!==primary"],
              "laws/index.controller.js": ["Return to Orbit"],
              "verification/benchmark-tools/four-compass-benchmark-v1/four-compass-browser-baseline.mjs": ["LAWS_CLUSTER_SINGLE_LABEL_FAILED", "lawsConformance"]
          }
          for file, needles in required.items():
              value = Path(file).read_text()
              for needle in needles:
                  if needle not in value:
                      raise SystemExit(f"{file}: missing {needle}")
          PY

          node --check laws/index.interactions.js
          node --check laws/index.controller.js
          node --check verification/benchmark-tools/four-compass-benchmark-v1/four-compass-benchmark.config.mjs
          node --check verification/benchmark-tools/four-compass-benchmark-v1/four-compass-browser-baseline.mjs

      - name: Commit correction and remove applicator
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/laws-compass-first-test-shell-correction-apply.yml
          git add laws/index.html laws/index.css laws/index.interactions.js laws/index.controller.js \
            verification/benchmark-tools/four-compass-benchmark-v1/four-compass-benchmark.config.mjs \
            verification/benchmark-tools/four-compass-benchmark-v1/four-compass-browser-baseline.mjs \
            .github/workflows/metaverse-benchmark-four-compass-tool.yml \
            .github/workflows/metaverse-benchmark-four-compass-tool-smoke.yml
          git commit -m "Reconcile Laws Compass FIRST labels and shell"
          git push origin HEAD:agent/laws-compass-first-test-shell-correction-cp0-001
