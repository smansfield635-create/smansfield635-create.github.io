name: H-Earth Gratitude Region final-placement repository admission
on:
  pull_request:
    branches:
      - agent/h-earth-gratitude-region-final-placement-disposition-001
permissions:
  contents: read
jobs:
  validate-final-placement-repository-admission:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute exact bounded repository-admission candidate
        env:
          ADMISSION_CANDIDATE_HEAD: ${{ github.event.pull_request.base.sha }}
          ADMISSION_WORKFLOW_TRIGGER_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/h-earth-final-placement-admission "$ADMISSION_CANDIDATE_HEAD"
          cd /tmp/h-earth-final-placement-admission
          export H_EARTH_GRATITUDE_REGION_FINAL_PLACEMENT_ADMISSION_RECEIPT=/tmp/h-earth-final-placement-admission-receipt.json
          node h-earth-3d/validation/h-earth.gratitude-region.final-spatial-placement-disposition.runner.mjs | tee /tmp/h-earth-final-placement-admission.log
          mkdir -p /tmp/h-earth-final-placement-admission-evidence
          cp /tmp/h-earth-final-placement-admission-receipt.json /tmp/h-earth-final-placement-admission-evidence/
          cp /tmp/h-earth-final-placement-admission.log /tmp/h-earth-final-placement-admission-evidence/
          cp h-earth-3d/control-plane/region-001-reconciliation/h-earth.region-001.gratitude-region-final-spatial-placement-disposition.v1.json /tmp/h-earth-final-placement-admission-evidence/
          cp h-earth-3d/validation/h-earth.gratitude-region.final-spatial-placement-disposition.receipt.v1.json /tmp/h-earth-final-placement-admission-evidence/
          cp h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.gratitude-region-final-spatial-placement-disposition.js /tmp/h-earth-final-placement-admission-evidence/
          shasum -a 256 /tmp/h-earth-final-placement-admission-evidence/* > /tmp/h-earth-final-placement-admission-evidence/sha256-manifest.txt
      - name: Upload repository-admission evidence
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-gratitude-region-final-placement-repository-admission-evidence
          path: /tmp/h-earth-final-placement-admission-evidence
          if-no-files-found: error
          retention-days: 90
