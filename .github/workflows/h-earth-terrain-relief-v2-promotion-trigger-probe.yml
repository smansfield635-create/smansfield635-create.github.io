name: H-Earth V2 Promotion Trigger Probe

on:
  push:
    branches:
      - promotion/h-earth-terrain-relief-v2-exact-live-default-001
    paths:
      - .github/workflows/h-earth-terrain-relief-v2-promotion-trigger-probe.yml

permissions:
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Publish trigger receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 529 --repo smansfield635-create/smansfield635-create.github.io --body "H_EARTH_V2_LIVE_PROMOTION_TRIGGER_PASS:${GITHUB_RUN_ID}:${GITHUB_SHA}"
