name: H-Earth Map-Wide Environment Redevelopment Supersede Lock 411

on:
  push:
    branches:
      - closure/h-earth-map-wide-environment-redevelopment-supersede-411-001
    paths:
      - .github/workflows/h-earth-map-wide-environment-redevelopment-supersede-411.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: h-earth-map-wide-environment-redevelopment-supersede-411
  cancel-in-progress: false

env:
  REPOSITORY: smansfield635-create/smansfield635-create.github.io
  EXPECTED_MAIN: 3f51f0cd159df33571905c6cb14253ebdd137e3b
  EXPECTED_BRANCH: closure/h-earth-map-wide-environment-redevelopment-supersede-411-001
  LOCK_REF: refs/heads/operation-locks/repository-operation-intake-v1
  OPERATION_ID: H_EARTH_TERRAIN_AND_ESTATE_CONSTRUCTION_v1
  LOCK_SCOPE: H_EARTH:TERRAIN_AND_ESTATE_CONSTRUCTION:GRATITUDE_REGION_MIRROR_MANOR_PRECINCT:V1:EXACT_32_PATH_SCOPE
  LOCK_GENERATION: '411'
  SCOPE_HASH: 472cb4b8b715a26055afa4ba34cf821a327c30c9d7f4380166e4964165ab2e6f
  REQUIRED_DISPOSITION: SUPERSEDED
  EXPECTED_LOCK_MANAGER_BLOB: 0aa440a3de30e145c7912fcfe2833fb8430ffbb0

jobs:
  close-generation-411:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact governance carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind exact authority and canonical lock manager
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          test "$(git hash-object tools/operation-intake/repository-operation-lock-manager.v1.mjs)" = "$EXPECTED_LOCK_MANAGER_BLOB"
          node --check tools/operation-intake/repository-operation-lock-manager.v1.mjs

      - name: Close generation 411 as SUPERSEDED through canonical lock manager
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/h-earth-411-closure"
          for attempt in $(seq 1 12); do
            set +e
            node tools/operation-intake/repository-operation-lock-manager.v1.mjs \
              --action close \
              --repository "$REPOSITORY" \
              --lock-ref "$LOCK_REF" \
              --operation-id "$OPERATION_ID" \
              --lock-scope "$LOCK_SCOPE" \
              --lock-generation "$LOCK_GENERATION" \
              --terminal-disposition "$REQUIRED_DISPOSITION" \
              --output "$RUNNER_TEMP/h-earth-411-closure/closure.json"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then break; fi
            node --input-type=module <<'NODE'
            import fs from 'node:fs';
            const path = process.env.RUNNER_TEMP + '/h-earth-411-closure/closure.json';
            const receipt = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (receipt.errorCode !== 'LEDGER_COMPARE_AND_SWAP_CONFLICT' || ![409, 422].includes(receipt.httpStatus)) {
              throw new Error(`NONRETRYABLE_CLOSURE_FAILURE:${JSON.stringify(receipt)}`);
            }
            NODE
            test "$attempt" -lt 12
            sleep $((attempt + 1))
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = process.env.RUNNER_TEMP + '/h-earth-411-closure/closure.json';
          const receipt = JSON.parse(fs.readFileSync(path, 'utf8'));
          const expected = {
            result: 'TERMINAL_CLOSURE_COMMITTED',
            operationId: process.env.OPERATION_ID,
            lockScope: process.env.LOCK_SCOPE,
            scopeHash: process.env.SCOPE_HASH,
            lockGeneration: Number(process.env.LOCK_GENERATION),
            terminalDisposition: process.env.REQUIRED_DISPOSITION,
            lockReleased: true
          };
          for (const [key, value] of Object.entries(expected)) {
            if (receipt[key] !== value) throw new Error(`CLOSURE_RECEIPT_MISMATCH:${key}`);
          }
          NODE

      - name: Independently verify terminal history and active-scope removal
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28'
          };
          async function get(url) {
            const response = await fetch(url, {headers});
            const text = await response.text();
            if (!response.ok) throw new Error(`GITHUB_API_ERROR:${response.status}:${text}`);
            return JSON.parse(text);
          }
          const base = `https://api.github.com/repos/${process.env.REPOSITORY}`;
          const ref = await get(`${base}/git/ref/heads/operation-locks/repository-operation-intake-v1`);
          const head = ref.object.sha;
          const file = await get(`${base}/contents/.github/operation-intake/active-operation-ledger.v1.json?ref=${head}`);
          const ledger = JSON.parse(Buffer.from(file.content.replace(/\s/g, ''), 'base64').toString('utf8'));
          if (ledger.activeScopes[process.env.SCOPE_HASH]) throw new Error('SUPERSEDED_SCOPE_STILL_ACTIVE');
          const terminal = ledger.terminalHistory.find((entry) =>
            entry.scopeHash === process.env.SCOPE_HASH &&
            entry.operationId === process.env.OPERATION_ID &&
            entry.lockGeneration === Number(process.env.LOCK_GENERATION) &&
            entry.state === 'TERMINAL' &&
            entry.released === true &&
            entry.terminalDisposition === process.env.REQUIRED_DISPOSITION
          );
          if (!terminal) throw new Error('SUPERSEDED_TERMINAL_HISTORY_NOT_FOUND');
          const closure = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/h-earth-411-closure/closure.json', 'utf8'));
          const output = {
            schema: 'H_EARTH_MAP_WIDE_ENVIRONMENT_REDEVELOPMENT_LOCK_411_SUPERSESSION_RECEIPT_v1',
            result: 'PASS_CLOSED_SUPERSEDED',
            repository: process.env.REPOSITORY,
            governingMain: process.env.EXPECTED_MAIN,
            operationId: process.env.OPERATION_ID,
            lockScope: process.env.LOCK_SCOPE,
            scopeHash: process.env.SCOPE_HASH,
            lockGeneration: Number(process.env.LOCK_GENERATION),
            terminalDisposition: process.env.REQUIRED_DISPOSITION,
            lockReleased: true,
            terminalHistoryPreserved: true,
            activeScopeRemoved: true,
            lockLedgerHead: head,
            lockLedgerBlob: file.sha,
            canonicalClosureReceipt: closure,
            directLedgerEditing: false,
            canonicalLockManagerUsed: true,
            constructionMutationPerformed: false,
            mainMutationPerformed: false
          };
          fs.writeFileSync(process.env.RUNNER_TEMP + '/h-earth-411-closure/verified.json', JSON.stringify(output, null, 2) + '\n');
          NODE

      - name: Upload exact closure evidence
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-map-wide-environment-redevelopment-lock-411-supersession
          path: ${{ runner.temp }}/h-earth-411-closure/
          if-no-files-found: error
          retention-days: 90
