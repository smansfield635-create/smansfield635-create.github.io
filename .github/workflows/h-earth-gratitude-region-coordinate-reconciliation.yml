name: H-Earth Gratitude Region Coordinate Reconciliation

# Isolated validation trigger for bounded Gratitude Region reconciliation.
# Frontier Plains uses its controlling area identity; no GR-CR-05 label is assumed.
on:
  push:
    branches:
      - agent/h-earth-gratitude-region-coordinate-reconciliation-001
  pull_request:
    branches:
      - main
      - agent/h-earth-gratitude-region-coordinate-reconciliation-validation-base-001
  workflow_dispatch:

concurrency:
  group: h-earth-gratitude-region-coordinate-reconciliation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-coordinate-reconciliation:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Check out coordinate-reconciliation branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Execute bounded analysis harness regression
        env:
          H_EARTH_GR_CR_RECEIPT: /tmp/h-earth-gr-cr-receipt.json
        run: |
          set -o pipefail
          node h-earth-3d/validation/h-earth.gratitude-region.coordinate-reconciliation.harness.mjs \
            2>&1 | tee /tmp/h-earth-gr-cr.log

      - name: Execute bounded Entry Zone regression
        env:
          H_EARTH_GR_CR_ENTRY_RECEIPT: /tmp/h-earth-gr-cr-entry-receipt.json
        run: |
          set -o pipefail
          node h-earth-3d/validation/h-earth.gratitude-region.entry-zone-reconciliation.runner.mjs \
            2>&1 | tee /tmp/h-earth-gr-cr-entry.log

      - name: Execute bounded Mirror Manor regression
        env:
          H_EARTH_GR_CR_MANOR_RECEIPT: /tmp/h-earth-gr-cr-manor-receipt.json
        run: |
          set -o pipefail
          node h-earth-3d/validation/h-earth.gratitude-region.mirror-manor-reconciliation.runner.mjs \
            2>&1 | tee /tmp/h-earth-gr-cr-manor.log

      - name: Execute bounded Cavern Precinct regression
        env:
          H_EARTH_GR_CR_CAVERN_RECEIPT: /tmp/h-earth-gr-cr-cavern-receipt.json
        run: |
          set -o pipefail
          node h-earth-3d/validation/h-earth.gratitude-region.cavern-precinct-reconciliation.runner.mjs \
            2>&1 | tee /tmp/h-earth-gr-cr-cavern.log

      - name: Execute bounded Frontier Plains capacity and relationship analysis
        env:
          H_EARTH_GR_FRONTIER_PLAINS_RECEIPT: /tmp/h-earth-gr-frontier-plains-receipt.json
        run: |
          set -o pipefail
          node h-earth-3d/validation/h-earth.gratitude-region.frontier-plains-capacity-relationship-reconciliation.runner.mjs \
            2>&1 | tee /tmp/h-earth-gr-frontier-plains.log

      - name: Verify emitted reconciliation receipts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receiptPaths = [
            '/tmp/h-earth-gr-cr-receipt.json',
            '/tmp/h-earth-gr-cr-entry-receipt.json',
            '/tmp/h-earth-gr-cr-manor-receipt.json',
            '/tmp/h-earth-gr-cr-cavern-receipt.json',
            '/tmp/h-earth-gr-frontier-plains-receipt.json'
          ];
          for (const receiptPath of receiptPaths) {
            if (!fs.existsSync(receiptPath)) process.exit(1);
            const receipt = JSON.parse(fs.readFileSync(receiptPath, 'utf8'));
            if (receipt.eligible !== true || !String(receipt.status).endsWith('_PASS')) process.exit(1);
            if (receipt.terrainMutation !== false) process.exit(1);
            if (receipt.geometryConstruction !== false) process.exit(1);
            if (receipt.runtimeMutation !== false) process.exit(1);
            if (receipt.gameplayMutation !== false) process.exit(1);
            if (receipt.publicRouteMutation !== false) process.exit(1);
            if (receipt.productionMutation !== false) process.exit(1);
            if (receipt.controllingManifestMutation !== false) process.exit(1);
          }
          const frontier = JSON.parse(fs.readFileSync('/tmp/h-earth-gr-frontier-plains-receipt.json', 'utf8'));
          if (frontier.numberedGRCRSectionIdentityAssigned !== false) process.exit(1);
          if (frontier.microCheckpointInventoryAssigned !== false) process.exit(1);
          if (frontier.frontierPlainsCandidateAccepted !== false) process.exit(1);
          if (frontier.exactCellPlacementAuthorized !== false) process.exit(1);
          if (frontier.exactCellPlacementAssigned !== false) process.exit(1);
          if (frontier.elevenFunctionalCellsAssigned !== false) process.exit(1);
          if (frontier.productConstructionAuthorized !== false) process.exit(1);
          NODE

      - name: Upload bounded reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-gratitude-region-coordinate-reconciliation-evidence
          path: |
            /tmp/h-earth-gr-cr.log
            /tmp/h-earth-gr-cr-receipt.json
            /tmp/h-earth-gr-cr-entry.log
            /tmp/h-earth-gr-cr-entry-receipt.json
            /tmp/h-earth-gr-cr-manor.log
            /tmp/h-earth-gr-cr-manor-receipt.json
            /tmp/h-earth-gr-cr-cavern.log
            /tmp/h-earth-gr-cr-cavern-receipt.json
            /tmp/h-earth-gr-frontier-plains.log
            /tmp/h-earth-gr-frontier-plains-receipt.json
          if-no-files-found: warn
          retention-days: 30
