name: H-Earth R06-C10 Candidate Preview 95504c V10 Full Frame

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h-earth-r06-c10-preview-95504c-v10-full-frame.yml'

permissions:
  contents: write

concurrency:
  group: h-earth-r06-c10-preview-95504c-v10-full-frame
  cancel-in-progress: false

jobs:
  prove-and-publish:
    if: github.head_ref == 'publication/h-earth-r06-c10-preview-95504c-001'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_HEAD: 95504c9927922318225da1d61fa303cec70497f9
      PUBLICATION_BRANCH: publication/h-earth-r06-c10-preview-95504c-001
      PREVIEW_ROOT: preview/h-earth/r06-c10/95504c9927922318225da1d61fa303cec70497f9
      PREVIEW_URL_PATH: /preview/h-earth/r06-c10/95504c9927922318225da1d61fa303cec70497f9/index.html
      SOURCE_ENTRY: showroom/globe/h-earth/index.html
      V1_WORKFLOW: .github/workflows/h-earth-r06-c10-preview-95504c.yml
      V8_WORKFLOW: .github/workflows/h-earth-r06-c10-preview-95504c-v8-boundary-compat.yml
      PLAYWRIGHT_VERSION: 1.55.0
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: publication/h-earth-r06-c10-preview-95504c-001
          fetch-depth: 0
          path: publication

      - name: Check out exact terrain candidate
        uses: actions/checkout@v4
        with:
          ref: 95504c9927922318225da1d61fa303cec70497f9
          fetch-depth: 1
          path: source

      - name: Materialize and apply bounded preview compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,textwrap
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])/'publication'
          v1=(root/os.environ['V1_WORKFLOW']).read_text()
          m=re.search(r"- name: Materialize exact self-contained environment preview.*?python3 - <<'PY'\n(.*?)\n          PY",v1,re.S)
          if not m: raise RuntimeError('V1_MATERIALIZER_BLOCK_NOT_FOUND')
          code=textwrap.dedent(m.group(1))
          old='queue = [entry]'
          new="""queue = [
              entry,
              PurePosixPath('showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js'),
              PurePosixPath('showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-round1-1f520809.js'),
              PurePosixPath('showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.js')
          ]"""
          if old not in code: raise RuntimeError('V1_QUEUE_PATCH_TARGET_NOT_FOUND')
          exec(compile(code.replace(old,new,1),'v10-materializer.py','exec'),{'__name__':'__main__'})
          v8=(root/os.environ['V8_WORKFLOW']).read_text()
          p=re.search(r"- name: Install preview-only outer-domain derivative compatibility.*?python3 - <<'PY'\n(.*?)\n          PY",v8,re.S)
          if not p: raise RuntimeError('V8_COMPATIBILITY_BLOCK_NOT_FOUND')
          exec(compile(textwrap.dedent(p.group(1)),'v10-compatibility.py','exec'),{'__name__':'__main__'})
          PY

      - name: Verify package construction after compatibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proof"
          cat > "$RUNNER_TEMP/package-check.mjs" <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import process from 'node:process';
          import { pathToFileURL } from 'node:url';
          const root=path.join(process.env.GITHUB_WORKSPACE,'publication',process.env.PREVIEW_ROOT,'_source');
          const module=await import(pathToFileURL(path.join(root,'showroom/globe/h-earth/render/live-render-package.run8e-r2.js')).href);
          const terrain=await import(pathToFileURL(path.join(root,'h-earth-3d/terrain/h-earth.successor-terrain-field.run8b.js')).href);
          const packageRecord=module.getHEarthRun8ER2ImmutableLiveRenderPackage();
          const witnesses=[[44,-168],[44,-180],[44,-192],[32,-192],[64,-164]].map(([x,z])=>{const s=terrain.sampleHEarthRun8BSuccessorTerrainField(x,z);return{x,z,valid:s.valid,elevation:s.elevation,delta:s.appliedCandidateDelta,slope:s.slope,curvature:s.curvature};});
          const result={packageStatus:packageRecord.status,packageIssueCount:packageRecord.issues?.length??0,packageIssues:packageRecord.issues??[],witnesses};
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'proof','package-check.json'),JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));
          if(packageRecord.status!=='RUN_8E_R2_IMMUTABLE_LIVE_RENDER_PACKAGE_COMPLETE'||(packageRecord.issues?.length??0)>0||!witnesses.every(w=>w.valid&&Number.isFinite(w.elevation)&&Number.isFinite(w.slope)&&Number.isFinite(w.curvature))||!witnesses.some(w=>Math.abs(w.delta)>1e-9))process.exit(1);
          JS
          node "$RUNNER_TEMP/package-check.mjs"

      - name: Install Chromium verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium

      - name: Prove full visible frame on desktop and touch mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4188 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/publication" >"$RUNNER_TEMP/proof/server.log" 2>&1 &
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:4188$PREVIEW_URL_PATH" >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          cat > "$RUNNER_TEMP/pw/verify.mjs" <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import process from 'node:process';
          import { chromium } from 'playwright';
          const url=`http://127.0.0.1:4188${process.env.PREVIEW_URL_PATH}`;
          const out=path.join(process.env.RUNNER_TEMP,'proof');
          const assert=(v,c,d=null)=>{if(!v){const e=new Error(c);e.detail=d;throw e;}};
          async function inspect(browser,profile){
            const context=await browser.newContext({viewport:profile.viewport,deviceScaleFactor:profile.dpr,isMobile:profile.mobile,hasTouch:profile.mobile});
            const page=await context.newPage();
            const consoleErrors=[],pageErrors=[],requestFailures=[],httpFailures=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push({message:e.message,stack:e.stack}));
            page.on('requestfailed',r=>requestFailures.push({url:r.url(),failure:r.failure()}));
            page.on('response',r=>{if(r.status()>=400&&!r.url().endsWith('/favicon.ico'))httpFailures.push({url:r.url(),status:r.status()})});
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForSelector('#h-earth-functional-landscape-canvas',{timeout:120000});
            await page.waitForTimeout(15000);
            const result=await page.evaluate(()=>{
              const c=document.getElementById('h-earth-functional-landscape-canvas');
              const gl=c?.getContext('webgl2')||c?.getContext('webgl');
              if(!c||!gl||!c.width||!c.height)return{canvas:null,startupReceipt:window.H_EARTH_RENDERER_STARTUP_DIAGNOSTICS?.getReceipt?.()??null};
              const p=new Uint8Array(c.width*c.height*4);
              gl.readPixels(0,0,c.width,c.height,gl.RGBA,gl.UNSIGNED_BYTE,p);
              let visible=0,bright=0,sum=0,max=0;
              for(let i=0;i<p.length;i+=4){const s=p[i]+p[i+1]+p[i+2];sum+=s;max=Math.max(max,s);if(s>18)visible++;if(s>90)bright++;}
              const resources=performance.getEntriesByType('resource').map(r=>r.name);
              return{
                canvas:{width:c.width,height:c.height,visiblePixelFraction:visible/(c.width*c.height),brightPixelFraction:bright/(c.width*c.height),meanRgbSum:sum/(c.width*c.height),maximumRgbSum:max,glError:gl.getError()},
                startupReceipt:window.H_EARTH_RENDERER_STARTUP_DIAGNOSTICS?.getReceipt?.()??null,
                runtimeSnapshot:window.H_EARTH_RUNTIME_DIAGNOSTICS?.getSnapshot?.()??null,
                candidateModuleLoaded:resources.some(u=>u.includes('h-earth.r06-c10.official-landform-candidate-001.js')),
                routeDataset:{...(document.getElementById('h-earth-functional-landscape-route')?.dataset??{})},
                bodyText:document.body?.innerText?.slice(0,6000)??null
              };
            });
            await page.screenshot({path:path.join(out,`${profile.name}.png`),fullPage:true});
            const receipt={profile:profile.name,url,result,consoleErrors,pageErrors,requestFailures,httpFailures};
            fs.writeFileSync(path.join(out,`${profile.name}.receipt.json`),JSON.stringify(receipt,null,2)+'\n');
            assert(result.canvas?.visiblePixelFraction>.01,'FULL_VISIBLE_WORLD_FRAME_NOT_PROVEN',receipt);
            assert(result.canvas?.brightPixelFraction>.001,'ENVIRONMENT_CONTRAST_NOT_PROVEN',receipt);
            assert(result.candidateModuleLoaded,'CANDIDATE_TERRAIN_MODULE_NOT_LOADED',receipt);
            assert(!result.startupReceipt?.firstFailureStage,'STARTUP_FAILURE_REPORTED',receipt);
            assert(pageErrors.length===0,'PAGE_ERRORS_PRESENT',receipt);
            assert(requestFailures.length===0,'REQUEST_FAILURES_PRESENT',receipt);
            assert(httpFailures.length===0,'HTTP_FAILURES_PRESENT',receipt);
            await context.close();return receipt;
          }
          const browser=await chromium.launch({headless:true});
          try{
            const desktop=await inspect(browser,{name:'desktop',viewport:{width:1440,height:1000},dpr:1,mobile:false});
            const mobile=await inspect(browser,{name:'touch-mobile',viewport:{width:412,height:915},dpr:2,mobile:true});
            fs.writeFileSync(path.join(out,'browser-proof.summary.json'),JSON.stringify({status:'PASS_VISIBLE_ENVIRONMENT',sourceHead:process.env.SOURCE_HEAD,desktop,mobile},null,2)+'\n');
          }finally{await browser.close();}
          JS
          cd "$RUNNER_TEMP/pw"
          node verify.mjs

      - name: Bind proof and commit verified preview root
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])/'publication'/os.environ['PREVIEW_ROOT']
          receipt_path=root/'publication-receipt.json'
          receipt=json.loads(receipt_path.read_text())
          proof=json.loads((Path(os.environ['RUNNER_TEMP'])/'proof'/'browser-proof.summary.json').read_text())
          package=json.loads((Path(os.environ['RUNNER_TEMP'])/'proof'/'package-check.json').read_text())
          receipt.update({'status':'PASS_VISIBLE_ENVIRONMENT_PROVEN','desktopBrowserProof':'PASS','touchMobileBrowserProof':'PASS','candidateTerrainModuleLoaded':True,'visibleWorldFrameProven':True,'packageConstructionResult':'PASS','browserProofSummary':proof,'packageCheck':package})
          receipt_path.write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          cd "$GITHUB_WORKSPACE/publication"
          git config user.name h-earth-preview-publisher
          git config user.email actions@users.noreply.github.com
          git add "$PREVIEW_ROOT"
          test -n "$(git status --porcelain -- "$PREVIEW_ROOT")"
          git commit -m 'Publish verified R06 C10 candidate environment preview'
          git push origin "HEAD:$PUBLICATION_BRANCH"

      - name: Upload full-frame proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-r06-c10-preview-95504c-v10-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/proof
            publication/${{ env.PREVIEW_ROOT }}/byte-manifest.json
            publication/${{ env.PREVIEW_ROOT }}/byte-manifest.sha256
            publication/${{ env.PREVIEW_ROOT }}/publication-receipt.json
          if-no-files-found: warn
          retention-days: 30
