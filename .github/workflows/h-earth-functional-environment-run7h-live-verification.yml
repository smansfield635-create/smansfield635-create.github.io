name: H-Earth Functional Environment Run 7H Live Verification

on:
  push:
    branches:
      - agent/h-earth-functional-environment-run7h-live-verification-001
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-run7h-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      H_EARTH_RUN7H_LIVE_URL: https://smansfield635-create.github.io/showroom/globe/h-earth/functional-landscape/
      H_EARTH_RUN7H_MERGE_COMMIT: 90d1430dd073e6110c3872fb5d9fe9a8d081824f
    steps:
      - name: Check out live-verification workspace
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Await deployed Run 7H route
        run: |
          set -euo pipefail
          mkdir -p h-earth-run7h-live-artifacts
          for attempt in $(seq 1 90); do
            cache="run7h=${GITHUB_RUN_ID}-${attempt}"
            if curl --fail --silent --show-error --location \
              "${H_EARTH_RUN7H_LIVE_URL}?${cache}" \
              -o h-earth-run7h-live-artifacts/live-index.html && \
              grep -q 'H-Earth · Run 7H' h-earth-run7h-live-artifacts/live-index.html && \
              grep -q './environment-integration.js' h-earth-run7h-live-artifacts/live-index.html; then
              echo "Run 7H deployment observed on attempt ${attempt}."
              exit 0
            fi
            sleep 10
          done
          echo 'Run 7H deployment was not observed within the bounded polling window.'
          exit 1

      - name: Verify deployed source identities
        run: |
          set -euo pipefail
          base="${H_EARTH_RUN7H_LIVE_URL%/}"
          curl --fail --silent --show-error --location \
            "${base}/environment-integration.js?run7h=${GITHUB_RUN_ID}" \
            -o h-earth-run7h-live-artifacts/live-environment-integration.js
          curl --fail --silent --show-error --location \
            "https://smansfield635-create.github.io/h-earth-3d/integration/h-earth.functional-environment-composite.js?run7h=${GITHUB_RUN_ID}" \
            -o h-earth-run7h-live-artifacts/live-composite.js
          curl --fail --silent --show-error --location \
            "https://smansfield635-create.github.io/h-earth-3d/validation/h-earth.functional-environment.run7h.receipt.json?run7h=${GITHUB_RUN_ID}" \
            -o h-earth-run7h-live-artifacts/live-workspace-receipt.json

          cmp --silent \
            showroom/globe/h-earth/functional-landscape/index.html \
            h-earth-run7h-live-artifacts/live-index.html
          cmp --silent \
            showroom/globe/h-earth/functional-landscape/environment-integration.js \
            h-earth-run7h-live-artifacts/live-environment-integration.js
          cmp --silent \
            h-earth-3d/integration/h-earth.functional-environment-composite.js \
            h-earth-run7h-live-artifacts/live-composite.js
          cmp --silent \
            h-earth-3d/validation/h-earth.functional-environment.run7h.receipt.json \
            h-earth-run7h-live-artifacts/live-workspace-receipt.json

          sha256sum \
            h-earth-run7h-live-artifacts/live-index.html \
            h-earth-run7h-live-artifacts/live-environment-integration.js \
            h-earth-run7h-live-artifacts/live-composite.js \
            h-earth-run7h-live-artifacts/live-workspace-receipt.json \
            > h-earth-run7h-live-artifacts/live-source-sha256.txt

      - name: Install bounded Chromium dependency
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Execute live desktop and Samsung browser verification
        run: |
          cat > h-earth-run7h-live-browser.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { chromium } from 'playwright';

          const url = process.env.H_EARTH_RUN7H_LIVE_URL;
          const output = 'h-earth-run7h-live-artifacts';
          const configurations = [
            ['desktop-landscape', 1280, 800, false, false],
            ['samsung-mobile-portrait', 412, 915, true, true],
            ['samsung-mobile-landscape', 915, 412, true, true]
          ];
          const results = [];
          const browser = await chromium.launch({ headless: true });
          try {
            for (const [id, width, height, isMobile, hasTouch] of configurations) {
              const context = await browser.newContext({
                viewport: { width, height },
                isMobile,
                hasTouch,
                deviceScaleFactor: 1
              });
              const page = await context.newPage();
              const consoleErrors = [];
              const pageErrors = [];
              page.on('console', (message) => {
                if (message.type() === 'error') consoleErrors.push(message.text());
              });
              page.on('pageerror', (error) => pageErrors.push(error.message));

              await page.goto(`${url}?liveRun=${Date.now()}-${id}`, {
                waitUntil: 'domcontentloaded',
                timeout: 120000
              });
              await page.waitForFunction(() =>
                window.H_EARTH_FUNCTIONAL_LANDSCAPE_RUN6F?.ready === true &&
                window.H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN7H?.ready === true &&
                document.getElementById('h-earth-functional-landscape-route')?.dataset.run7hReady === 'true',
              null, { timeout: 120000 });

              const initial = await page.evaluate(async () => {
                await window.H_EARTH_FUNCTIONAL_LANDSCAPE_RUN6F.dispatch({ action: 'RESET' });
                await window.H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN7H.refresh();
                return window.H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN7H.getSnapshot();
              });
              assert.equal(initial.ready, true);
              assert.equal(initial.receipt.eligible, true);
              assert.equal(initial.receipt.authorityCollapse, false);
              assert.equal(initial.receipt.rendererAuthorityReplaced, false);
              assert.equal(initial.receipt.cameraAuthorityReplaced, false);
              assert.equal(initial.receipt.navigationAuthorityReplaced, false);

              const before = await page.evaluate(() =>
                window.H_EARTH_FUNCTIONAL_LANDSCAPE_RUN6F.getBrowserReceipt().renderSequence);
              await page.locator('[data-action="MOVE_FORWARD"]').click();
              await page.waitForFunction((sequence) =>
                window.H_EARTH_FUNCTIONAL_LANDSCAPE_RUN6F.getBrowserReceipt().renderSequence > sequence &&
                window.H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN7H.getBrowserReceipt().renderSequence > sequence,
              before, { timeout: 120000 });

              const geographic = await page.evaluate(() =>
                window.H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN7H.runGeographicPath());
              assert.equal(geographic.length, 5);
              assert.equal(geographic.every((entry) =>
                entry.result.ok && entry.environmentReceipt.eligible), true);

              const lifecycle = await page.evaluate(() =>
                window.H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN7H.runLifecycleDistanceProof());
              assert.deepEqual(lifecycle.map((entry) => entry.state),
                ['ACTIVE_DETAIL', 'ACTIVE_REDUCED', 'SLEEPING', 'UNLOADED']);
              assert.equal(lifecycle[2].populationInstanceCount, 0);
              assert.equal(lifecycle[3].populationInstanceCount, 0);

              const final = await page.evaluate(() => {
                const snapshot = window.H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN7H.getSnapshot();
                const ids = ['hud-surface', 'hud-water', 'hud-biome',
                  'hud-traversal', 'hud-lifecycle', 'hud-population'];
                const hud = Object.fromEntries(ids.map((id) =>
                  [id, document.getElementById(id)?.textContent]));
                const canvas = document.getElementById('h-earth-functional-landscape-canvas');
                const pixels = canvas.getContext('2d').getImageData(
                  0, 0, canvas.width, canvas.height).data;
                let opaque = 0;
                const colors = new Set();
                const stride = Math.max(4,
                  Math.floor(pixels.length / 12000 / 4) * 4);
                for (let index = 0; index < pixels.length; index += stride) {
                  const offset = index - index % 4;
                  if (pixels[offset + 3] === 255) opaque += 1;
                  colors.add(`${pixels[offset]},${pixels[offset + 1]},${pixels[offset + 2]}`);
                }
                return {
                  snapshot,
                  hudComplete: Object.values(hud).every((value) =>
                    value && value !== '—'),
                  opaquePixelSamples: opaque,
                  sampledColorCount: colors.size,
                  routeError: document.getElementById(
                    'h-earth-functional-landscape-route').dataset.run7hError
                };
              });
              assert.equal(final.snapshot.ready, true);
              assert.equal(final.hudComplete, true);
              assert.equal(final.opaquePixelSamples > 0, true);
              assert.equal(final.sampledColorCount > 12, true);
              assert.equal(final.routeError, 'false');
              assert.deepEqual(consoleErrors, []);
              assert.deepEqual(pageErrors, []);

              const screenshot = `live-${id}.png`;
              await page.screenshot({
                path: path.join(output, screenshot),
                fullPage: true
              });
              results.push({
                configurationId: id,
                viewport: { width, height },
                isMobile,
                hasTouch,
                lifecycle,
                finalReceipt: final.snapshot.receipt,
                finalComposite: final.snapshot.composite,
                opaquePixelSamples: final.opaquePixelSamples,
                sampledColorCount: final.sampledColorCount,
                screenshot,
                consoleErrors,
                pageErrors
              });
              await context.close();
            }
          } finally {
            await browser.close();
          }

          const receipt = {
            receiptType: 'H_EARTH_FUNCTIONAL_ENVIRONMENT_RUN_7H_LIVE_VERIFICATION_RECEIPT',
            eligible: true,
            status: 'RUN_7H_DEPLOYED_LIVE_PASS',
            mergedMainCommit: process.env.H_EARTH_RUN7H_MERGE_COMMIT,
            liveUrl: url,
            deployedSourceIdentityMatch: true,
            configurationCount: results.length,
            desktopExecution: 'PASS',
            samsungMobilePortraitExecution: 'PASS',
            samsungMobileLandscapeExecution: 'PASS',
            touchAndPointerExecution: 'PASS',
            lifecycleTransitionProof: 'PASS',
            actualLiveBrowserExecution: true,
            physicalSamsungInstrumentation: false,
            configurations: results,
            issues: []
          };
          await fs.writeFile(path.join(output, 'run7h-live-receipt.json'),
            `${JSON.stringify(receipt, null, 2)}\n`, 'utf8');
          console.log(JSON.stringify(receipt, null, 2));
          NODE

          set -o pipefail
          node h-earth-run7h-live-browser.mjs \
            2>&1 | tee h-earth-run7h-live-artifacts/live-browser.log

      - name: Verify live receipt
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const receipt = JSON.parse(readFileSync(
            'h-earth-run7h-live-artifacts/run7h-live-receipt.json', 'utf8'));
          if (
            receipt.eligible !== true ||
            receipt.status !== 'RUN_7H_DEPLOYED_LIVE_PASS' ||
            receipt.mergedMainCommit !== '90d1430dd073e6110c3872fb5d9fe9a8d081824f' ||
            receipt.deployedSourceIdentityMatch !== true ||
            receipt.configurationCount !== 3 ||
            receipt.desktopExecution !== 'PASS' ||
            receipt.samsungMobilePortraitExecution !== 'PASS' ||
            receipt.samsungMobileLandscapeExecution !== 'PASS' ||
            receipt.touchAndPointerExecution !== 'PASS' ||
            receipt.lifecycleTransitionProof !== 'PASS' ||
            receipt.actualLiveBrowserExecution !== true ||
            receipt.physicalSamsungInstrumentation !== false ||
            receipt.issues.length !== 0
          ) process.exit(1);
          NODE

      - name: Upload Run 7H live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-run7h-live-verification-evidence
          path: h-earth-run7h-live-artifacts
          if-no-files-found: error
          retention-days: 30
