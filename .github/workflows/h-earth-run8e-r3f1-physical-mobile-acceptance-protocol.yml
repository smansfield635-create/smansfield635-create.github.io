name: H-Earth Run 8E R3F1 Physical Mobile Acceptance Protocol

on:
  push:
    branches:
      - agent/h-earth-run8e-r3f1-physical-mobile-acceptance-protocol-001
  pull_request:
    branches:
      - agent/h-earth-run8e-r3e5-r3e-closure-r3f-input-decision-001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-run8e-r3f1-physical-mobile-acceptance-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      H_EARTH_RUN8E_R3F1_OUTPUT: /tmp/h-earth-run8e-r3f1
    steps:
      - name: Check out exact R3F1 event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact R3E5 base and pass receipt
        run: |
          set -euo pipefail
          git fetch origin agent/h-earth-run8e-r3e5-r3e-closure-r3f-input-decision-001
          test "$(git merge-base HEAD origin/agent/h-earth-run8e-r3e5-r3e-closure-r3f-input-decision-001)" = "548672ae99cd406805f0c8ca576cc650baf7ed18"
          test "$(git hash-object h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3e5.pass-closed.receipt.json)" = "ddd7fbf4065abbfb51e222c3500328b5b7aaab00"
          test "$(git hash-object h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3f.input-decision.js)" = "f923fa8127c56b1304717e86cfbc44e746d80cc8"

      - name: Verify protected H-Earth runtime identities
        run: |
          set -euo pipefail
          test "$(git hash-object showroom/globe/h-earth/index.html)" = "0daedf61f7e19af095f4db5fc47563a9cd786837"
          test "$(git hash-object showroom/globe/h-earth/functional-landscape/public-live-gpu-integration.run8e-r3e.js)" = "2b0a916b3a6d11da84316925f8abd8a3a1447445"
          test "$(git hash-object showroom/globe/h-earth/functional-landscape/navigation.js)" = "8ab3446c536fc24423d5601acce232b19fa71c91"
          test "$(git hash-object showroom/globe/h-earth/render/live-renderer-contract.run8e-r3a.js)" = "4e187fc38780dfb2020482b674ac331f5a65b2c1"
          test "$(git hash-object showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.js)" = "b8b3c713d5f0b7c79808e8942ce385887589d880"
          test "$(git hash-object showroom/globe/h-earth/diagnostic/run8e-r3d/pointer-touch-intake.js)" = "bb96858fec09d14bbe10aa9ffa8a7f07af3621e6"
          test "$(git hash-object showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js)" = "5017bbaf857a644287cb829037b0fde4646f270d"

      - name: Verify R3F1 syntax and protocol-only boundary
        run: |
          set -euo pipefail
          node --check h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3.live-gpu-presentation-recovery.js
          node --check h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3f1.physical-mobile-acceptance-protocol.js
          node --check h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3f.physical-mobile-evidence-contract.js
          node --check h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.run8e-r3f1-physical-mobile-acceptance-protocol.js
          node --check h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js
          node --check h-earth-3d/validation/h-earth.run8e-r3f1.physical-mobile-acceptance-protocol.harness.mjs
          if test -f h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3f1.pass-closed.receipt.json; then
            node -e "JSON.parse(require('fs').readFileSync('h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3f1.pass-closed.receipt.json','utf8'))"
          fi
          ! git diff --name-only 548672ae99cd406805f0c8ca576cc650baf7ed18...HEAD | grep -Eq '^showroom/'

      - name: Execute R3F1 protocol and evidence-intake validation
        run: |
          set -euo pipefail
          node h-earth-3d/validation/h-earth.run8e-r3f1.physical-mobile-acceptance-protocol.harness.mjs

      - name: Execute automatic repository-registry preflight
        run: |
          set -euo pipefail
          git diff --name-only 548672ae99cd406805f0c8ca576cc650baf7ed18...HEAD \
            | grep -E '^h-earth-3d/' \
            | sort -u > /tmp/h-earth-run8e-r3f1-governed-paths.txt || true
          node --experimental-default-type=module \
            tools/h-earth-repository-registry-auto-preflight.mjs \
            --paths-file /tmp/h-earth-run8e-r3f1-governed-paths.txt \
            --task "Run 8E R3F1 physical mobile acceptance protocol" \
            --mutation-intent \
            --output "$H_EARTH_RUN8E_R3F1_OUTPUT/h-earth.run8e-r3f1.automatic-preflight.receipt.json"
          node - <<'NODE'
          const receipt = require('/tmp/h-earth-run8e-r3f1/h-earth.run8e-r3f1.automatic-preflight.receipt.json');
          if (receipt.finalDisposition !== 'PASS') throw new Error(`R3F1_AUTOMATIC_PREFLIGHT_NOT_PASS:${receipt.finalDisposition}`);
          NODE

      - name: Verify exact scope and R3F2 stopping boundary
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only 548672ae99cd406805f0c8ca576cc650baf7ed18...HEAD | sort > "$H_EARTH_RUN8E_R3F1_OUTPUT/r3f1-changed-paths.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = {line.strip() for line in Path('/tmp/h-earth-run8e-r3f1/r3f1-changed-paths.txt').read_text().splitlines() if line.strip()}
          required = {
            '.github/workflows/h-earth-run8e-r3f1-physical-mobile-acceptance-protocol.yml',
            'h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3.live-gpu-presentation-recovery.js',
            'h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3f1.physical-mobile-acceptance-protocol.js',
            'h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3f.physical-mobile-evidence-contract.js',
            'h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.run8e-r3f1-physical-mobile-acceptance-protocol.js',
            'h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js',
            'h-earth-3d/validation/h-earth.run8e-r3f1.physical-mobile-acceptance-protocol.harness.mjs'
          }
          optional = {'h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3f1.pass-closed.receipt.json'}
          missing = sorted(required - paths)
          unexpected = sorted(paths - required - optional)
          if missing: raise SystemExit(f'R3F1_REQUIRED_PATHS_MISSING:{missing}')
          if unexpected: raise SystemExit(f'R3F1_UNEXPECTED_PATHS:{unexpected}')
          if any(path.startswith('showroom/') for path in paths): raise SystemExit('R3F1_SHOWROOM_MUTATION_OBSERVED')
          receipt = json.loads(Path('/tmp/h-earth-run8e-r3f1/h-earth.run8e-r3f1.physical-mobile-acceptance-protocol.execution.receipt.json').read_text())
          if receipt['eligible'] is not True or receipt['status'] != 'RUN_8E_R3F1_EXECUTION_PASS': raise SystemExit('R3F1_EXECUTION_RECEIPT_INVALID')
          if receipt['protocol']['requiredSessionRecordFieldCount'] != 22: raise SystemExit('R3F1_SESSION_FIELD_COUNT_INVALID')
          if len(receipt['protocol']['deviceLanes']) != 4 or len(receipt['protocol']['subcheckpointSequence']) != 4: raise SystemExit('R3F1_PROTOCOL_MATRIX_INVALID')
          if receipt['protocol']['previewTransportLaw']['productionDeploymentAllowed'] is not False: raise SystemExit('R3F1_DEPLOYMENT_LAW_INVALID')
          if receipt['nextCheckpoint'] != 'RUN_8E_R3F2_NOT_STARTED': raise SystemExit('R3F1_R3F2_STATE_INVALID')
          if receipt['stoppingBoundary'] != 'STOP_BEFORE_REFERENCE_DEVICE_IMMUTABLE_PREVIEW_AND_PHYSICAL_EXECUTION_R3F2': raise SystemExit('R3F1_STOPPING_BOUNDARY_MISMATCH')
          if any(receipt['boundaries'].values()): raise SystemExit('R3F1_EXECUTION_BOUNDARY_VIOLATION')
          PY

      - name: Upload R3F1 protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-run8e-r3f1-physical-mobile-acceptance-protocol-evidence
          path: |
            /tmp/h-earth-run8e-r3f1
            /tmp/h-earth-run8e-r3f1-governed-paths.txt
          if-no-files-found: warn
          retention-days: 90
