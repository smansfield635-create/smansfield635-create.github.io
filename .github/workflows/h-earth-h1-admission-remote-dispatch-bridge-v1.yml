name: H-Earth H1 Admission Remote Dispatch Bridge v1

on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  issues: read
  pull-requests: read

jobs:
  dispatch-exact-h1-admission:
    if: >-
      contains(github.event.comment.body, 'H_EARTH_H1_ADMISSION_REMOTE_DISPATCH_REQUEST_V1') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-24.04
    env:
      EXPECTED_CANDIDATE_HEAD: 575a06d5b97fc1501a00c7fb3535786d63d9442b
      EXPECTED_OPERATION_ID: H_EARTH_REPRESENTATION_TRANSITION_SURFACE_GAP_CLOSURE_H1_20260811_002
      EXPECTED_LOCK_GENERATION: "58"
      EXPECTED_SCOPE_HASH: 9e08d97821f66fb546578bbb91e8a174059384acebbad8a97e1bb406c9faca7a
      EXPECTED_REQUEST_DIGEST: f99ad7d742ecc3fa8b2b553b0e9554ed3389140d07295785eac995948fefb44c
      EXPECTED_PROCEDURE_DIGEST: 3c5dca11f232be665dfeeb0e9ab9c5dc6a548d7b9ea012a092e7b63c3d3cd10a
      EXPECTED_ADMISSION_WORKFLOW_PATH: .github/workflows/h-earth-r06-c10-candidate-admission.yml
      EXPECTED_ADMISSION_WORKFLOW_BLOB: 10d8670f15d7f56ab3c08e145e80381be130045e

    steps:
      - name: Check out exact active public main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Parse and validate exact remote dispatch request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/h-earth-h1-remote-dispatch"
          jq -r '.comment.body' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/h-earth-h1-remote-dispatch/comment-body.txt"
          marker_line="$(grep -n -m1 '^H_EARTH_H1_ADMISSION_REMOTE_DISPATCH_REQUEST_V1$' "$RUNNER_TEMP/h-earth-h1-remote-dispatch/comment-body.txt" | cut -d: -f1)"
          test -n "$marker_line"
          json_line=$((marker_line + 1))
          sed -n "${json_line}p" "$RUNNER_TEMP/h-earth-h1-remote-dispatch/comment-body.txt" > "$RUNNER_TEMP/h-earth-h1-remote-dispatch/request.json"
          jq -e . "$RUNNER_TEMP/h-earth-h1-remote-dispatch/request.json" >/dev/null

          schema="$(jq -r '.schema' "$RUNNER_TEMP/h-earth-h1-remote-dispatch/request.json")"
          expected_main="$(jq -r '.expectedMainHead' "$RUNNER_TEMP/h-earth-h1-remote-dispatch/request.json")"
          candidate="$(jq -r '.candidateHead' "$RUNNER_TEMP/h-earth-h1-remote-dispatch/request.json")"
          operation="$(jq -r '.operationId' "$RUNNER_TEMP/h-earth-h1-remote-dispatch/request.json")"
          generation="$(jq -r '.lockGeneration|tostring' "$RUNNER_TEMP/h-earth-h1-remote-dispatch/request.json")"
          scope="$(jq -r '.scopeHash' "$RUNNER_TEMP/h-earth-h1-remote-dispatch/request.json")"
          request_digest="$(jq -r '.requestDigest' "$RUNNER_TEMP/h-earth-h1-remote-dispatch/request.json")"
          procedure_digest="$(jq -r '.procedureDigest' "$RUNNER_TEMP/h-earth-h1-remote-dispatch/request.json")"

          test "$schema" = "H_EARTH_H1_ADMISSION_REMOTE_DISPATCH_REQUEST_v1"
          test "$expected_main" = "$(git rev-parse HEAD^{commit})"
          test "$candidate" = "$EXPECTED_CANDIDATE_HEAD"
          test "$operation" = "$EXPECTED_OPERATION_ID"
          test "$generation" = "$EXPECTED_LOCK_GENERATION"
          test "$scope" = "$EXPECTED_SCOPE_HASH"
          test "$request_digest" = "$EXPECTED_REQUEST_DIGEST"
          test "$procedure_digest" = "$EXPECTED_PROCEDURE_DIGEST"
          test "$(git rev-parse "HEAD:${EXPECTED_ADMISSION_WORKFLOW_PATH}")" = "$EXPECTED_ADMISSION_WORKFLOW_BLOB"
          git status --porcelain=v1 --untracked-files=all | grep -q . && exit 1 || true

          echo "expected_main=$expected_main" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "operation=$operation" >> "$GITHUB_OUTPUT"
          echo "generation=$generation" >> "$GITHUB_OUTPUT"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "request_digest=$request_digest" >> "$GITHUB_OUTPUT"
          echo "procedure_digest=$procedure_digest" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact active H1 admission workflow
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: ${{ steps.request.outputs.expected_main }}
          CANDIDATE_HEAD: ${{ steps.request.outputs.candidate }}
          OPERATION_ID: ${{ steps.request.outputs.operation }}
          LOCK_GENERATION: ${{ steps.request.outputs.generation }}
          SCOPE_HASH: ${{ steps.request.outputs.scope }}
          REQUEST_DIGEST: ${{ steps.request.outputs.request_digest }}
          PROCEDURE_DIGEST: ${{ steps.request.outputs.procedure_digest }}
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg ref "main" \
            --arg candidate_head "$CANDIDATE_HEAD" \
            --arg operation_id "$OPERATION_ID" \
            --arg lock_generation "$LOCK_GENERATION" \
            --arg scope_hash "$SCOPE_HASH" \
            --arg request_digest "$REQUEST_DIGEST" \
            --arg procedure_digest "$PROCEDURE_DIGEST" \
            '{ref:$ref,inputs:{candidate_head:$candidate_head,operation_id:$operation_id,lock_generation:$lock_generation,scope_hash:$scope_hash,request_digest:$request_digest,procedure_digest:$procedure_digest}}')"

          http_code="$(curl --silent --show-error --output "$RUNNER_TEMP/h-earth-h1-remote-dispatch/dispatch-response.txt" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/h-earth-r06-c10-candidate-admission.yml/dispatches" \
            --data "$payload")"
          test "$http_code" = "204"

          jq -n \
            --arg schema "H_EARTH_H1_ADMISSION_REMOTE_DISPATCH_BRIDGE_RECEIPT_v1" \
            --arg result "PASS" \
            --arg sourceEvent "$GITHUB_EVENT_NAME" \
            --arg sourceRunId "$GITHUB_RUN_ID" \
            --arg expectedMainHead "$EXPECTED_MAIN" \
            --arg candidateHead "$CANDIDATE_HEAD" \
            --arg operationId "$OPERATION_ID" \
            --arg lockGeneration "$LOCK_GENERATION" \
            --arg scopeHash "$SCOPE_HASH" \
            --arg requestDigest "$REQUEST_DIGEST" \
            --arg procedureDigest "$PROCEDURE_DIGEST" \
            --arg admissionWorkflowPath "$EXPECTED_ADMISSION_WORKFLOW_PATH" \
            --arg admissionWorkflowBlob "$EXPECTED_ADMISSION_WORKFLOW_BLOB" \
            '{schema:$schema,result:$result,sourceEvent:$sourceEvent,sourceRunId:$sourceRunId,expectedMainHead:$expectedMainHead,candidateHead:$candidateHead,operationId:$operationId,lockGeneration:($lockGeneration|tonumber),scopeHash:$scopeHash,requestDigest:$requestDigest,procedureDigest:$procedureDigest,admissionWorkflowPath:$admissionWorkflowPath,admissionWorkflowBlob:$admissionWorkflowBlob,dispatchRef:"main",dispatchAccepted:true,candidateMutationPerformed:false,admissionEffect:"NONE_BRIDGE_ONLY",mergeAuthorityCreated:false,deploymentAuthorityCreated:false}' \
            > "$RUNNER_TEMP/h-earth-h1-remote-dispatch/bridge-receipt.json"

      - name: Upload bridge receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-h1-admission-remote-dispatch-bridge-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/h-earth-h1-remote-dispatch/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce bridge-only boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/h-earth-h1-remote-dispatch/bridge-receipt.json"
          jq -e '.result == "PASS" and .dispatchRef == "main" and .dispatchAccepted == true and .candidateMutationPerformed == false and .admissionEffect == "NONE_BRIDGE_ONLY" and .mergeAuthorityCreated == false and .deploymentAuthorityCreated == false' "$RUNNER_TEMP/h-earth-h1-remote-dispatch/bridge-receipt.json" >/dev/null
