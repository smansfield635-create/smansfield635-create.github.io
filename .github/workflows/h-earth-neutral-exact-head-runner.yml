name: H-Earth Neutral Exact Head Runner

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact candidate SHA to execute unchanged
        required: true
        type: string
      route_path:
        description: Optional repository route path; defaults to root H-Earth route
        required: false
        default: '/showroom/globe/h-earth/'
        type: string
      route_query:
        description: Optional query string without leading question mark
        required: false
        default: ''
        type: string
      exercise_vegetation_residency:
        description: After READY, exercise bounded Gen2523 vegetation residency to completion
        required: false
        default: false
        type: boolean
      apply_timing_shim:
        description: Apply Variant-B timing observation shim
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1

      - name: Require exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.target_sha }}"

      - name: Fetch fixed woodland-meadow qualification history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 376210ddefeacbf0f22f66233c7e8746d6be075c
          git fetch --no-tags --depth=1 origin 7804b359aa032caa00f8dd526f8e4186df97fac9
          git fetch --no-tags --depth=1 origin 35e7fc09a9fdae8df7fb9d0f1f90913f9b1d1fba
          git cat-file -e 376210ddefeacbf0f22f66233c7e8746d6be075c^{commit}
          git cat-file -e 7804b359aa032caa00f8dd526f8e4186df97fac9^{commit}
          git cat-file -e 35e7fc09a9fdae8df7fb9d0f1f90913f9b1d1fba^{commit}

      - name: Execute fixed woodland-meadow distribution mechanical validator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/h-earth-exact-evidence
          node h-earth-3d/validation/h-earth.woodland-meadow-distribution-20261006.mjs --output /tmp/h-earth-exact-evidence/woodland-meadow-distribution-mechanical.json

      - name: Upload mechanical validator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-woodland-meadow-distribution-mechanical-${{ inputs.target_sha }}
          path: /tmp/h-earth-exact-evidence/woodland-meadow-distribution-mechanical.json
          if-no-files-found: error
          retention-days: 30

      - name: Install bounded Chromium
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Apply bounded Variant-B timing observation shim
        if: ${{ inputs.route_path == '/preview/h-earth/corridor/38df744ba7402aabe7fd2eaee71b961a451350de/B/showroom/globe/h-earth/' && inputs.apply_timing_shim }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path='preview/h-earth/corridor/38df744ba7402aabe7fd2eaee71b961a451350de/B/showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js';
          let s=fs.readFileSync(path,'utf8');
          s=s.replace('  function renderFrame(packet) {','  const __neutralTiming={drawSubmissionMs:null,getErrorMs:null,presentationMs:null};\n  function renderFrame(packet) {');
          s=s.replace('    for (const range of packet.drawRanges) {','    const __drawStart=performance.now();\n    for (const range of packet.drawRanges) {');
          s=s.replace('    gl.depthMask(true); gl.disable(gl.BLEND);\n    const error = gl.getError();','    gl.depthMask(true); gl.disable(gl.BLEND);\n    __neutralTiming.drawSubmissionMs=performance.now()-__drawStart;\n    const __errorStart=performance.now();\n    const error = gl.getError(); __neutralTiming.getErrorMs=performance.now()-__errorStart;');
          s=s.replace('  function presentColorFrame() {','  function presentColorFrame() {\n    const __presentationStart=performance.now();');
          s=s.replace('    counters.visiblePresentationCount += 1; return Object.freeze({ frameNumber: counters.frameCount, width, height });','    counters.visiblePresentationCount += 1; __neutralTiming.presentationMs=performance.now()-__presentationStart; return Object.freeze({ frameNumber: counters.frameCount, width, height });');
          s=s.replace('    initialize, activateInitialRefinement, renderFrame, presentColorFrame, captureColorFrame, captureDepthSummary, getResourceReceipt','    initialize, activateInitialRefinement, renderFrame, presentColorFrame, captureColorFrame, captureDepthSummary, getResourceReceipt, getNeutralTimingReceipt:()=>Object.freeze({...__neutralTiming})');
          if(!s.includes('getNeutralTimingReceipt')) throw new Error('TIMING_SHIM_APPLY_FAILED');
          fs.writeFileSync(path,s);
          const bindingPath='preview/h-earth/corridor/38df744ba7402aabe7fd2eaee71b961a451350de/B/showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js';
          let b=fs.readFileSync(bindingPath,'utf8');
          const callerLines=b.split('\n');
          const functionStart=callerLines.findIndex(line=>line==='  const presentNavigationState = (navigationState, source) => {');
          const functionEnd=callerLines.findIndex((line,index)=>index>functionStart&&line==='  };');
          if(functionStart<0||functionEnd<0) throw new Error('CALLER_TIMING_FUNCTION_SCOPE_NOT_FOUND');
          const findUnique=(text)=>{const hits=callerLines.map((line,index)=>index>=functionStart&&index<=functionEnd&&line===text?index:-1).filter(index=>index>=0);if(hits.length!==1)throw new Error(`CALLER_TIMING_SCOPED_ANCHOR_COUNT:${text}:${hits.length}`);return hits[0];};
          let line=findUnique('  const presentNavigationState = (navigationState, source) => {');
          callerLines.splice(line,0,'  const __neutralCallerTiming={packetMs:null,renderFrameCallMs:null,presentColorFrameCallMs:null,bookkeepingMs:null,totalMs:null};');
          const directPacketLine=callerLines.findIndex((text,index)=>index>=functionStart&&index<=functionEnd&&text==='    const packet = createHEarthRun8ER3AFrameUniformPacket({');
          const conditionalPacketLine=callerLines.findIndex((text,index)=>index>=functionStart&&index<=functionEnd&&text==='    const reuseWaterPacket = source.kind === \'WATER_ANIMATION_FRAME\' && latestFramePacket !== null;');
          if((directPacketLine>=0)===(conditionalPacketLine>=0)) throw new Error('CALLER_TIMING_PACKET_PATH_AMBIGUOUS');
          line=directPacketLine>=0?directPacketLine:conditionalPacketLine; callerLines.splice(line,0,'    const __packetStart=performance.now();');
          const renderLine=findUnique('    renderer.renderFrame(packet);'); callerLines.splice(renderLine,0,'    __neutralCallerTiming.packetMs=performance.now()-__packetStart;');
          line=findUnique('    renderer.renderFrame(packet);'); callerLines.splice(line,0,'    const __renderCallStart=performance.now();'); callerLines.splice(line+2,0,'    __neutralCallerTiming.renderFrameCallMs=performance.now()-__renderCallStart;');
          line=findUnique('    renderer.presentColorFrame();'); callerLines.splice(line,0,'    const __presentCallStart=performance.now();'); callerLines.splice(line+2,0,'    __neutralCallerTiming.presentColorFrameCallMs=performance.now()-__presentCallStart;');
          line=findUnique('    const responseMs = performance.now() - startedAt;'); callerLines.splice(line,0,'    const __bookkeepingStart=performance.now();'); callerLines.splice(line+2,0,'    __neutralCallerTiming.totalMs=responseMs;');
          line=findUnique('    latestNavigationState = navigationState;'); callerLines.splice(line+1,0,'    __neutralCallerTiming.bookkeepingMs=performance.now()-__bookkeepingStart;');
          b=callerLines.join('\n');
          if(!b.includes('__neutralCallerTiming')) throw new Error('CALLER_TIMING_SHIM_APPLY_FAILED');
          const bLines=b.split('\n');
          const counterLines=bLines.map((line,index)=>line.trim()==='counters,'?index:-1).filter(index=>index>=0);
          if(counterLines.length!==1) throw new Error(`TIMING_RECEIPT_COUNTER_ANCHOR_COUNT:${counterLines.length}`);
          const counterIndex=counterLines[0];
          const indent=bLines[counterIndex].match(/^\s*/)?.[0]??'';
          bLines.splice(counterIndex+1,0,`${indent}neutralRendererTiming: renderer.getNeutralTimingReceipt?.()??null,`,`${indent}neutralCallerTiming: Object.freeze({...__neutralCallerTiming}),`);
          b=bLines.join('\n');
          if(!b.includes('neutralRendererTiming')||!b.includes('neutralCallerTiming')) throw new Error('TIMING_RECEIPT_WIRE_FAILED');
          fs.writeFileSync(bindingPath,b);
          NODE
          node --check preview/h-earth/corridor/38df744ba7402aabe7fd2eaee71b961a451350de/B/showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js
          node --check preview/h-earth/corridor/38df744ba7402aabe7fd2eaee71b961a451350de/B/showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js

      - name: Execute actual H-Earth route unchanged
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          ROUTE_PATH: ${{ inputs.route_path }}
          ROUTE_QUERY: ${{ inputs.route_query }}
          EXERCISE_VEGETATION_RESIDENCY: ${{ inputs.exercise_vegetation_residency }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . >/tmp/h-earth-exact-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            curl --fail --silent "http://127.0.0.1:4173/showroom/globe/h-earth/" >/dev/null && break
            sleep 1
          done
          mkdir -p /tmp/h-earth-exact-evidence
          cat > h-earth-exact-run.mjs <<'NODE'
          import fs from 'node:fs/promises';
          import crypto from 'node:crypto';
          import { chromium } from 'playwright';

          const out='/tmp/h-earth-exact-evidence';
          const targetSha=process.env.TARGET_SHA;
          const query=String(process.env.ROUTE_QUERY||'').replace(/^\?/, '');
          const requestedPath=String(process.env.ROUTE_PATH||'/showroom/globe/h-earth/');
          if(!requestedPath.startsWith('/')||requestedPath.includes('..')||requestedPath.includes('?')||requestedPath.includes('#')) throw new Error('Invalid governed route path');
          const route=requestedPath+(query?'?'+query:'');
          const url='http://127.0.0.1:4173'+route;
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1280,height:800},deviceScaleFactor:1});
          const page=await context.newPage();
          const pageErrors=[];
          const consoleErrors=[];
          const requestsFailed=[];
          const responses=[];
          page.on('pageerror',e=>pageErrors.push(e.message));
          page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
          page.on('requestfailed',r=>requestsFailed.push({url:r.url(),failure:r.failure()}));
          page.on('response',r=>responses.push({url:r.url(),status:r.status(),contentType:r.headers()['content-type']||null}));

          const inspectRuntimeTopology=async () => Promise.all(page.frames().map(async (frame,index) => {
            try {
              return await frame.evaluate(({index,url,name}) => ({
                index,url,name,title:document.title,
                hasRun8ePublicRoute:Boolean(window.H_EARTH_RUN8E_PUBLIC_ROUTE),
                run8ePublicRouteKeys:window.H_EARTH_RUN8E_PUBLIC_ROUTE?Object.keys(window.H_EARTH_RUN8E_PUBLIC_ROUTE).sort():[],
                run8ePublicRouteIntegrationId:window.H_EARTH_RUN8E_PUBLIC_ROUTE?.integrationId??null,
                moduleScriptUrls:[...document.querySelectorAll('script[type="module"][src]')].map(script=>script.src),
                hasWaveReceipt:Boolean(window.H_EARTH_RUN8E_PUBLIC_ROUTE?.getWaveAnimationReceipt),
                hasLiveGpuReceipt:Boolean(window.H_EARTH_RUN8E_PUBLIC_ROUTE?.getLiveGpuReceipt),
                canvasPresent:document.getElementById('h-earth-functional-landscape-canvas') instanceof HTMLCanvasElement,
                routeReady:document.getElementById('h-earth-functional-landscape-route')?.dataset.run8eReady??null
              }),{index,url:frame.url(),name:frame.name()});
            } catch(error) { return {index,url:frame.url(),name:frame.name(),evaluationError:error?.message??String(error)}; }
          }));
          const sample=async label => {
            const runtimeTopology=await inspectRuntimeTopology();
            const moduleContentIdentity=await page.evaluate(async () => {
              const urls=[...document.querySelectorAll('script[type="module"][src]')].map(script=>script.src).filter(url=>/public-live-gpu-integration\.run8e-r3e(?:\.receipt)?\.js/.test(url));
              const rows=[];
              for(const url of urls){
                try{
                  const text=await fetch(url,{cache:'no-store'}).then(response=>response.text());
                  const bytes=new TextEncoder().encode(text);
                  const digest=await crypto.subtle.digest('SHA-256',bytes);
                  rows.push({url,sha256:[...new Uint8Array(digest)].map(v=>v.toString(16).padStart(2,'0')).join(''),length:text.length,hasWaveExport:text.includes('getWaveAnimationReceipt')});
                }catch(error){rows.push({url,error:error?.message??String(error)})}
              }
              const integrationUrl=new URL('./functional-landscape/public-live-gpu-integration.run8e-r3e.js?v=run8e-cache-coherence-v1',location.href).href;
              try{
                const text=await fetch(integrationUrl,{cache:'no-store'}).then(response=>response.text());
                const bytes=new TextEncoder().encode(text);
                const digest=await crypto.subtle.digest('SHA-256',bytes);
                rows.push({url:integrationUrl,kind:'IMPORTED_INTEGRATION_MODULE',sha256:[...new Uint8Array(digest)].map(v=>v.toString(16).padStart(2,'0')).join(''),length:text.length,hasWaveExport:text.includes('getWaveAnimationReceipt'),assignmentMentions:(text.match(/H_EARTH_RUN8E_PUBLIC_ROUTE/g)||[]).length});
              }catch(error){rows.push({url:integrationUrl,kind:'IMPORTED_INTEGRATION_MODULE',error:error?.message??String(error)})}
              return rows;
            });
            const state=await page.evaluate(() => {
              const text=document.body?.innerText||'';
              const owningWindow=[window,...Array.from(document.querySelectorAll('iframe')).map(frame=>{try{return frame.contentWindow}catch{return null}}).filter(Boolean)].find(candidate=>candidate?.H_EARTH_RUN8E_PUBLIC_ROUTE?.getLiveGpuReceipt)||null;
              const owningRoute=owningWindow?.H_EARTH_RUN8E_PUBLIC_ROUTE??null;
              const renderer=window.H_EARTH_3D_RENDERER??null;
              const contract=window.H_EARTH_3D_RENDERER_CONTRACT??null;
              const globals={};
              for(const key of Object.keys(window)){
                if(/H_EARTH/i.test(key)&&/(FRAME|ANIM|REBUILD|RENDERER|WORLD)/i.test(key)){
                  const value=window[key];
                  if(['string','number','boolean'].includes(typeof value)||value===null) globals[key]=value;
                }
              }
              const liveGpuReceipt=owningRoute?.getLiveGpuReceipt?.()??null;
              const waveAnimationReceipt=owningRoute?.getWaveAnimationReceipt?.()??null;
              return {
                title:document.title,
                bodyText:text.slice(0,3000),
                finalUrl:location.href,
                canvasPresent:document.getElementById('h-earth-functional-landscape-canvas') instanceof HTMLCanvasElement,
                canvasPresentation:(() => {
                  const canvas=document.getElementById('h-earth-functional-landscape-canvas');
                  if(!(canvas instanceof HTMLCanvasElement)) return null;
                  const style=getComputedStyle(canvas);
                  const rect=canvas.getBoundingClientRect();
                      return {display:style.display,visibility:style.visibility,opacity:style.opacity,zIndex:style.zIndex,width:rect.width,height:rect.height,top:rect.top,left:rect.left,connected:canvas.isConnected};
                })(),
                routeReady:document.getElementById('h-earth-functional-landscape-route')?.dataset.run8eReady??null,
                startupReceipt:window.H_EARTH_RENDERER_STARTUP_DIAGNOSTICS?.getReceipt?.()??null,
                rendererModel:renderer?.outputModel??contract?.outputModel??null,
                rendererVariant:renderer?.variant??renderer?.rendererVariant??contract?.variant??contract?.rendererVariant??null,
                selectedRendererPath:liveGpuReceipt?.selectedRendererPath??null,
                oceanPresentationRequested:liveGpuReceipt?.oceanPresentationRequested??null,
                animationRunning:liveGpuReceipt?.animation?.running??null,
                animationFrame:liveGpuReceipt?.counters?.animationFrameCount ?? renderer?.animationFrame ?? renderer?.frameCount ?? contract?.animationFrame ?? contract?.frameCount ?? globals.H_EARTH_ANIMATION_FRAME ?? globals.H_EARTH_FRAME_COUNT ?? null,
                renderFrameCallCount:liveGpuReceipt?.counters?.renderFrameCallCount??null,
                gpuFramebufferPresentationCount:liveGpuReceipt?.counters?.gpuFramebufferPresentationCount??null,
                worldRebuildCount:liveGpuReceipt?.counters?.worldRebuildCount ?? renderer?.worldRebuildCount ?? contract?.worldRebuildCount ?? globals.H_EARTH_WORLD_REBUILD_COUNT ?? null,
                blitStateDiagnostic:window.__H_EARTH_BLIT_STATE_DIAGNOSTIC__??null,
                liveGpuReceipt,
                waveAnimationReceipt,
                globals
              };
            });
            const screenshot=label+'.png';
            await page.screenshot({path:out+'/'+screenshot,fullPage:true});
            const bytes=await fs.readFile(out+'/'+screenshot);
            const canvas=page.locator('#h-earth-functional-landscape-canvas');
            const canvasScreenshot=label+'-canvas.png';
            let canvasScreenshotSha256=null;
            let canvasBox=null;
            if(await canvas.count()){
              canvasBox=await canvas.boundingBox();
              await canvas.screenshot({path:out+'/'+canvasScreenshot});
              const canvasBytes=await fs.readFile(out+'/'+canvasScreenshot);
              canvasScreenshotSha256=crypto.createHash('sha256').update(canvasBytes).digest('hex');
            }
            return {...state,runtimeTopology,moduleContentIdentity,screenshot,screenshotSha256:crypto.createHash('sha256').update(bytes).digest('hex'),canvasScreenshot,canvasScreenshotSha256,canvasBox};
          };

          let readiness='TIMEOUT';
          let initial=null;
          let later=null;
          let residencySamples=[];
          let vegetationExercise=null;
          try {
            await page.goto(url,{waitUntil:'networkidle',timeout:180000});
            readiness=await page.waitForFunction(() => {
              const text=document.body?.innerText||'';
              const routeWindows=[window,...Array.from(document.querySelectorAll('iframe')).map(frame=>{try{return frame.contentWindow}catch{return null}}).filter(Boolean)];
              const liveGpuReceipt=routeWindows.find(candidate=>candidate?.H_EARTH_RUN8E_PUBLIC_ROUTE?.getLiveGpuReceipt)?.H_EARTH_RUN8E_PUBLIC_ROUTE?.getLiveGpuReceipt?.()??null;
              const activeLiveGpu=Boolean(
                liveGpuReceipt?.selectedRendererPath &&
                liveGpuReceipt?.animation?.running===true &&
                Number(liveGpuReceipt?.counters?.gpuFramebufferPresentationCount)>0
              );
              const startupReceipt=window.H_EARTH_RENDERER_STARTUP_DIAGNOSTICS?.getReceipt?.()??null;
              const authoritativeReady=Boolean(startupReceipt?.stages?.READY_PUBLISHED==='PASS'&&startupReceipt?.firstFailureStage==null);
              const routeReady=document.getElementById('h-earth-functional-landscape-route')?.dataset.run8eReady==='true';
              if(activeLiveGpu||authoritativeReady||routeReady) return 'READY';
              if(startupReceipt?.firstFailureStage||/Initialization failed\.|RENDERER_CONSTRUCTION_EXCEPTION/.test(text)) return 'FAILED';
              const initializing=/H-EARTH · LIVE WORLD INITIALIZATION|Constructing world renderer|Entering the coast\./i.test(text);
              const live=/LIVE ENVIRONMENT/i.test(text)&&/H_EARTH_GROUND_CELL_001:[A-Z0-9:]+/i.test(text);
              const mounted=window.H_EARTH_3D_RENDERER!=null||window.H_EARTH_3D_RENDERER_CONTRACT!=null||/RENDERER_MOUNTED|Entering complete|World ready|Initialization complete/i.test(text)||(!initializing&&live);
              return mounted?'READY':false;
            },null,{timeout:120000}).then(h=>h.jsonValue()).catch(()=> 'TIMEOUT');
            initial=await sample('initial');
            await page.waitForTimeout(3000);
            later=await sample('later');
            const exerciseVegetation=String(process.env.EXERCISE_VEGETATION_RESIDENCY||'false')==='true';
            if(exerciseVegetation){
              const browserProbe=page.evaluate(() => {
                const routeWindows=[window,...Array.from(document.querySelectorAll('iframe')).map(frame=>{try{return frame.contentWindow}catch{return null}}).filter(Boolean)];
                const owner=routeWindows.find(candidate=>candidate?.H_EARTH_RUN8E_PUBLIC_ROUTE?.getLiveGpuReceipt)||null;
                const route=owner?.H_EARTH_RUN8E_PUBLIC_ROUTE??null;
                if(!route?.materializeNextVegetationBatch) return {executed:false,error:'VEGETATION_RESIDENCY_API_UNAVAILABLE',routeKeys:route?Object.keys(route).sort():[]};
                const snapshot=()=>{const receipt=route.getLiveGpuReceipt?.()??null;return {residency:receipt?.resources?.vegetationResidency??null,worldRebuildCount:receipt?.counters?.worldRebuildCount??null};};
                const transitions=[];
                for(let batchIndex=0;batchIndex<108;batchIndex++){
                  const pre=snapshot(),started=performance.now();
                  try{
                    const returnedState=route.materializeNextVegetationBatch();
                    const post=snapshot();
                    transitions.push({batchIndex,elapsedMilliseconds:performance.now()-started,preResidency:pre.residency,returnedState,postResidency:post.residency,worldRebuildCount:post.worldRebuildCount});
                  }catch(error){
                    const post=snapshot();
                    return {executed:false,batchIndex,transitions,elapsedMilliseconds:performance.now()-started,preResidency:pre.residency,postResidency:post.residency,worldRebuildCount:post.worldRebuildCount,failure:{error:{name:error?.name??null,message:error?.message??String(error),stack:error?.stack??null}}};
                  }
                }
                const final=snapshot();
                return {executed:true,transitions,finalResidency:final.residency,worldRebuildCount:final.worldRebuildCount};
              });
              try{
                vegetationExercise=await Promise.race([
                  browserProbe,
                  new Promise(resolve=>setTimeout(()=>resolve({executed:false,phase:'NODE_FULL_RESIDENCY_TIMEOUT',timeoutMilliseconds:600000}),600000))
                ]);
              }catch(error){
                vegetationExercise={executed:false,phase:'NODE_PAGE_EVALUATE_REJECTED',failure:{error:{name:error?.name??null,message:error?.message??String(error),stack:error?.stack??null}}};
              }
            }
            residencySamples=[];
            for(let sampleIndex=0;sampleIndex<8;sampleIndex+=1){
              await page.waitForTimeout(2000);
              const live=await page.evaluate(() => {
                const routeWindows=[window,...Array.from(document.querySelectorAll('iframe')).map(frame=>{try{return frame.contentWindow}catch{return null}}).filter(Boolean)];
                const receipt=routeWindows.find(candidate=>candidate?.H_EARTH_RUN8E_PUBLIC_ROUTE?.getLiveGpuReceipt)?.H_EARTH_RUN8E_PUBLIC_ROUTE?.getLiveGpuReceipt?.()??null;
                const residency=receipt?.resources?.vegetationResidency??null;
                return {residency,worldRebuildCount:receipt?.counters?.worldRebuildCount??null,gpuFramebufferPresentationCount:receipt?.counters?.gpuFramebufferPresentationCount??null};
              });
              residencySamples.push(live);
            }
          } finally {
            await context.close();
            await browser.close();
          }
          const sampledAuthoritativeReady=[initial,later].some(sample=>sample?.startupReceipt?.stages?.READY_PUBLISHED==='PASS'&&sample?.startupReceipt?.firstFailureStage==null);
          const sampledRouteReady=[initial,later].some(sample=>sample?.routeReady==='true');
          const finalReadiness=(readiness==='READY'||sampledAuthoritativeReady||sampledRouteReady)?'READY':readiness;
          const receipt={
            schema:'H_EARTH_NEUTRAL_EXACT_HEAD_RUNNER_v1',
            targetSha,
            route,
            url,
            exactHeadRequired:true,
            productMaterialization:['EXACT_CHECKED_OUT_REPOSITORY_ROOT'],
            substitutionsPerformed:false,
            observationShimApplied:false,
            observationShimScope:'NONE',
            actualBrowserExecution:true,
            readinessDiagnostic:finalReadiness,
            materialized:Boolean(initial?.canvasPresent&&later?.canvasPresent),
            pageErrors,
            consoleErrors,
            requestsFailed,
            responses,
            initial,
            later,
            screenshotChanged:Boolean(initial&&later&&initial.screenshotSha256!==later.screenshotSha256),
            canvasScreenshotChanged:Boolean(initial?.canvasScreenshotSha256&&later?.canvasScreenshotSha256&&initial.canvasScreenshotSha256!==later.canvasScreenshotSha256),
            rendererDefaultFramebufferReadbackInitial:initial?.liveGpuReceipt?.resources?.latestDefaultFramebufferT4Readback??null,
            rendererDefaultFramebufferReadbackLater:later?.liveGpuReceipt?.resources?.latestDefaultFramebufferT4Readback??null,
            rendererDefaultFramebufferChanged:Boolean(initial?.liveGpuReceipt?.resources?.latestDefaultFramebufferT4Readback?.byteHash&&later?.liveGpuReceipt?.resources?.latestDefaultFramebufferT4Readback?.byteHash&&initial.liveGpuReceipt.resources.latestDefaultFramebufferT4Readback.byteHash!==later.liveGpuReceipt.resources.latestDefaultFramebufferT4Readback.byteHash),
            animationFrameAdvanced:Number.isFinite(initial?.animationFrame)&&Number.isFinite(later?.animationFrame)?later.animationFrame>initial.animationFrame:null,
            worldRebuildStayedZero:initial?.worldRebuildCount===0&&later?.worldRebuildCount===0?true:(initial?.worldRebuildCount==null&&later?.worldRebuildCount==null?null:false),
            residencySamples,
            vegetationExercise,
            vegetationResidencyMonotonic:residencySamples.every((sample,index,array)=>index===0||!sample?.residency||!array[index-1]?.residency||(sample.residency.residentBatchCount>=array[index-1].residency.residentBatchCount&&sample.residency.residentInstanceCount>=array[index-1].residency.residentInstanceCount)),
            residencyWorldRebuildStayedZero:residencySamples.every(sample=>sample?.worldRebuildCount===0)
          };
          await fs.writeFile(out+'/receipt.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          if(!receipt.materialized||pageErrors.length||consoleErrors.length||requestsFailed.length) process.exitCode=1;
          if(String(process.env.EXERCISE_VEGETATION_RESIDENCY||'false')==='true'){
            const v=receipt.vegetationExercise;
            if(v?.executed!==true||v?.transitions?.length!==108||v?.finalResidency?.residentBatchCount!==108||v?.finalResidency?.residentInstanceCount!==27585||v?.finalResidency?.complete!==true||v?.finalResidency?.droppedPlacementCount!==0||v?.worldRebuildCount!==0) process.exitCode=1;
          }
          NODE
          node h-earth-exact-run.mjs

      - name: Upload exact-head runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-neutral-exact-head-${{ inputs.target_sha }}
          path: |
            /tmp/h-earth-exact-evidence
            /tmp/h-earth-exact-server.log
          if-no-files-found: error
          retention-days: 30
