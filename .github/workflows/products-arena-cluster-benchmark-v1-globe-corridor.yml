name: Products Arena Cluster Benchmark v1 Globe Corridor

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "products/**"
      - "verification/benchmark-tools/products-arena-cluster-benchmark-v1/**"
      - ".github/workflows/products-arena-cluster-benchmark-v1-globe-corridor.yml"

permissions:
  contents: read

jobs:
  products-globe-corridor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install benchmark dependency
        run: npm install --no-save puppeteer-core@24.15.0

      - name: Resolve Chrome
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            sudo apt-get update
            sudo apt-get install -y chromium
            chrome="$(command -v chromium || command -v chromium-browser)"
          fi
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version

      - name: Source and syntax assertions
        shell: bash
        run: |
          node --check products/index.globe-guard.js
          node --check verification/benchmark-tools/products-arena-cluster-benchmark-v1/products-globe-touch-corridor.mjs
          grep -F 'src="/products/index.globe-guard.js"' products/index.html
          grep -F 'PRODUCTS_GLOBE_DISCLOSURE_ISOLATION_GUARD_v1' products/index.globe-guard.js
          grep -F 'createsSecondController: false' products/index.globe-guard.js
          grep -F 'ownsNavigation: false' products/index.globe-guard.js
          grep -F 'z-index: 5 !important' products/index.globe-guard.css
          grep -F -- '--products-globe-corridor-pad' products/index.globe-guard.css

      - name: Start branch-local static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/products-globe-corridor-server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/products/ >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/products-globe-corridor-server.log
          exit 1

      - name: Execute Benchmark V1 globe corridor scenario
        env:
          PRODUCTS_ARENA_ORIGIN: http://127.0.0.1:4173
        run: node verification/benchmark-tools/products-arena-cluster-benchmark-v1/products-globe-touch-corridor.mjs

      - name: Upload executed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: products-arena-cluster-benchmark-v1-globe-corridor-evidence
          if-no-files-found: warn
          path: |
            products-globe-touch-corridor-v1.json
            products-globe-touch-corridor-reference-mobile.png
            /tmp/products-globe-corridor-server.log
