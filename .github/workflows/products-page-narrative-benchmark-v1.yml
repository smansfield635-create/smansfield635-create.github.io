name: Products Page Narrative Benchmark v1

on:
  pull_request:
    paths:
      - "products/**"
      - "verification/benchmark-tools/products-page-narrative-v1/**"
      - ".github/workflows/products-page-narrative-benchmark-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  products-page-narrative:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install benchmark dependency
        run: npm install --no-save puppeteer-core@24.16.0

      - name: Resolve Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Verify frozen compass source scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}" > /tmp/products-page-changed-paths.txt || true
          cat /tmp/products-page-changed-paths.txt
          if grep -E '^products/(index\.controller\.js|index\.crystals\.js|index\.compositor\.js|index\.planet\.js|index\.compass\.css)$' /tmp/products-page-changed-paths.txt; then
            echo "Frozen compass authority changed in page correction lane" >&2
            exit 1
          fi

      - name: Reject one-off narrative stylesheet
        shell: bash
        run: |
          set -euo pipefail
          test ! -e products/index.narrative.css
          ! grep -q '/products/index.narrative.css' products/index.html

      - name: Start branch-local static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/products-page-narrative-server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/products/ >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/products-page-narrative-server.log
          exit 1

      - name: Execute page narrative benchmark
        env:
          PRODUCTS_PAGE_ORIGIN: http://127.0.0.1:4173
        run: node verification/benchmark-tools/products-page-narrative-v1/products-page-narrative-benchmark.mjs

      - name: Upload executed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: products-page-narrative-benchmark-v1-evidence
          if-no-files-found: warn
          path: |
            products-page-narrative-benchmark-v1.json
            products-page-narrative-*.png
            /tmp/products-page-narrative-server.log
