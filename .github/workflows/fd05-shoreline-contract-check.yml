name: FD05 shoreline multi-primitive contract check

on:
  pull_request:
    branches:
      - agent/fd05-shoreline-contract-check-001
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  check-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fd05-shoreline-contract-check-001
          fetch-depth: 0
      - name: Run current-contract check
        run: node --experimental-default-type=module .fd05/shoreline-contract-check.mjs
      - name: Commit isolated evidence
        run: |
          git config user.name "OpenAI Engineering Agent"
          git config user.email "engineering-agent@users.noreply.github.com"
          git add .fd05/shoreline-contract-check-output/contract-check.json
          git commit -m "Record shoreline multi-primitive contract check"
          git push origin HEAD:agent/fd05-shoreline-contract-check-001
