name: Compass Laws Spacecraft Adoption Executor
on:
  pull_request:
    types: [synchronize]
    branches: [main]
permissions:
  contents: write
jobs:
  adopt:
    if: github.head_ref == 'repair/compass-live-asset-bindings-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ github.token }}
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          identity=Path('assets/compass/compass.identity-3d.js')
          s=identity.read_text()
          old='async function mountLawsCraft(){if(reduce.matches||innerWidth<=720||document.querySelector(\'[data-compass-spacecraft-layer]\'))return;'
          new='async function mountLawsCraft(){if(globalThis.DGB_COMPASS_DISABLE_LOCAL_SPACECRAFT||reduce.matches||innerWidth<=720||document.querySelector(\'[data-compass-spacecraft-layer]\'))return;'
          if old in s:
              s=s.replace(old,new,1)
          elif 'globalThis.DGB_COMPASS_DISABLE_LOCAL_SPACECRAFT' not in s:
              raise SystemExit('identity mount guard not found')
          identity.write_text(s)

          html=Path('index.html')
          h=html.read_text()
          adapter='<script src="/assets/compass/compass.laws-spacecraft.js?v=gen1532-laws-background-v1" defer></script>\n'
          anchor='<script src="/assets/compass/compass.identity-3d.js?v=gen1532-live-binding-v1" defer></script>'
          if 'compass.laws-spacecraft.js' not in h:
              if anchor not in h: raise SystemExit('identity script anchor not found')
              h=h.replace(anchor,adapter+anchor,1)
          h=h.replace('/assets/compass/compass.identity-3d.js?v=gen1532-live-binding-v1','/assets/compass/compass.identity-3d.js?v=gen1532-laws-background-v1')
          html.write_text(h)
          PY
          grep -q 'DGB_COMPASS_DISABLE_LOCAL_SPACECRAFT' assets/compass/compass.identity-3d.js
          grep -q 'compass.laws-spacecraft.js?v=gen1532-laws-background-v1' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- assets/compass/compass.identity-3d.js index.html; then
            git add assets/compass/compass.identity-3d.js index.html
            git commit -m 'Use actual Laws background spacecraft presentation'
            git push origin HEAD:${{ github.head_ref }}
          fi
