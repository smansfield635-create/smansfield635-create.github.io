name: Grid stressed maneuverability replication v1
on:
  pull_request:
    paths:
      - 'research/imi/grid_stressed_maneuverability_replication_v1.py'
      - 'research/imi/grid_stressed_maneuverability_replication_sourcefix_v1.py'
      - 'research/imi/GRID_STRESSED_MANEUVERABILITY_REPLICATION_PROTOCOL_v1.md'
      - 'research/imi/GRID_STRESSED_MANEUVERABILITY_SOURCE_ADAPTER_ADDENDUM_v1.md'
  workflow_dispatch:
jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            research/imi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: pip install numpy pandas scipy scikit-learn lightgbm requests
      - name: Execute frozen stressed-grid replication
        run: python research/imi/grid_stressed_maneuverability_replication_sourcefix_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grid-stressed-maneuverability-replication-v1
          path: |
            grid_stressed_maneuverability_findings_v1.json
            grid_stressed_state_contingency_rows_v1.csv
            grid_stressed_state_summary_v1.csv
            grid_stressed_predictions_v1.csv
            grid_stressed_matched_pairs_v1.csv
            GRID_STRESSED_MANEUVERABILITY_VERDICT_v1.txt
