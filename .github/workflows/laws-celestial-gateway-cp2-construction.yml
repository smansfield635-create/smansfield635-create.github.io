              'laws/index.html',
              'laws/index.interactions.js',
              'laws/research/index.html',
              'laws/test/index.html',
          ]

          subprocess.run(['git', 'reset', '--hard', base], check=True)
          subprocess.run(['git', 'checkout', candidate, '--', *paths], check=True)

