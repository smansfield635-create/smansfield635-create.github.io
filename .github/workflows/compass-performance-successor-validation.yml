name: Compass Performance Successor Validation

on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/compass/compass.orbit-input.js'
      - 'assets/compass/compass.statement-carousel.js'
      - 'assets/compass/compass.statement-carousel.css'
      - 'assets/compass/compass.brain-scene.js'
      - 'assets/compass/compass.capability-carousel.js'
      - 'assets/compass/compass.capability-carousel.css'
      - '.github/ai-router/router.v1.json'
      - '.github/ai-router/projects/compass/entrypoint.v1.json'
      - '.github/ai-router/projects/compass/verify-performance-successor.mjs'
      - '.github/workflows/compass-performance-successor-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPASS_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact checkout and static contract
        run: |
          test "$(git rev-parse HEAD^{commit})" = "$COMPASS_CANDIDATE_HEAD"
          node .github/ai-router/projects/compass/verify-performance-successor.mjs
          node --check assets/compass/compass.orbit-input.js
          node --check assets/compass/compass.statement-carousel.js
          node --check assets/compass/compass.brain-scene.js
          node --check assets/compass/compass.capability-carousel.js
      - name: Install Playwright outside repository contract
        env:
          npm_config_package_lock: 'false'
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Start candidate host
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/compass-performance-host.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/compass-performance-host.log
          exit 1
      - name: Qualify devices interactions anatomy accessibility and fallback
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {chromium} from 'playwright';const browser=await chromium.launch({headless:true}),checks=[];const check=(id,pass,evidence)=>checks.push({id,pass:Boolean(pass),evidence});let fatal=null;
          const load=async(context,name)=>{const page=await context.newPage(),errors=[];page.on('pageerror',error=>errors.push(String(error)));await page.goto(`http://127.0.0.1:4173/?surface=${name}`,{waitUntil:'domcontentloaded'});await page.waitForFunction(()=>globalThis.CompassEditorialCarousel?.version==='awards-trl-brain-successor-v1');await page.waitForTimeout(700);return{page,errors}};
          const active=page=>page.locator('[data-capability-orbit] > [data-capability][data-slot="front"]');
          const state=page=>page.evaluate(()=>({capability:document.querySelector('[data-capability][data-slot="front"]')?.dataset.capability,slots:[...document.querySelectorAll('[data-capability-orbit] > [data-capability]')].map(node=>({id:node.dataset.capability,slot:node.dataset.slot,inert:node.inert,hidden:node.getAttribute('aria-hidden'),focusable:[...node.querySelectorAll('a,button')].some(control=>control.tabIndex>=0)})),proof:document.querySelector('[data-proof-card][data-slot="front"]')?.dataset.proofCard,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}));
          async function pointerSwipe(page,selector,direction=1){const stage=page.locator(selector);await stage.scrollIntoViewIfNeeded();const box=await stage.boundingBox(),x=box.x+box.width*.55,y=box.y+Math.min(box.height*.25,110),geometry=()=>stage.evaluate(node=>[...node.querySelectorAll('[data-slot]')].map(card=>({slot:card.dataset.slot,transform:getComputedStyle(card).transform}))),before=await geometry();await page.mouse.move(x,y);await page.mouse.down();await page.mouse.move(x-direction*box.width*.3,y+2,{steps:5});const held=await geometry();await page.mouse.up();return{before,held}}
