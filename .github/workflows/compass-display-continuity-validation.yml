name: Compass Gen1561 Protected Reconciliation Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/compass/**'
      - '.github/ai-router/projects/compass/verify-experience-consolidation.v1.mjs'
      - '.github/workflows/compass-display-continuity-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPASS_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  COMPASS_GOVERNING_HEAD: b3b0d52f28c09e75389552a8d4b3de26b080db1b
  COMPASS_EXPERIENCE_OUTPUT: /tmp/compass-experience-consolidation-receipt.json
  COMPASS_EXPERIENCE_CAPTURE_INPUT: /tmp/compass-experience-capture-receipt.json

jobs:
  engineering-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMPASS_CANDIDATE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact head, scope, and protected lower carousel
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "$COMPASS_CANDIDATE_HEAD"
          node --check assets/compass/compass.capability-carousel.js
          node --check assets/compass/compass.controller.js
          node --check assets/compass/compass.crystals.js
          node --check assets/compass/compass.mirrorland-window.js
          node --check assets/compass/compass.statement-carousel.js
          node --check assets/compass/compass.brain-scene.js
          node --check assets/compass/compass.house-scene.js
          node --check .github/ai-router/projects/compass/verify-experience-consolidation.v1.mjs
          git show "$COMPASS_GOVERNING_HEAD:assets/compass/compass.capability-carousel.js" > /tmp/governing-capability.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import cp from 'node:child_process';
          const base=process.env.COMPASS_GOVERNING_HEAD;
          const allowed=new Set(['index.html','assets/compass/compass.capability-carousel.js','assets/compass/compass.capability-carousel.css','assets/compass/compass.identity-3d.js','assets/compass/compass.identity-3d.css','assets/compass/compass.trophy-scene.js','.github/ai-router/projects/compass/verify-experience-consolidation.v1.mjs','.github/workflows/compass-display-continuity-validation.yml']);
          const protectedPaths=['assets/compass/compass.controller.js','assets/compass/compass.crystals.js','assets/compass/compass.mirrorland-window.js','assets/compass/compass.cosmos.js','assets/compass/compass.statement-carousel.js','assets/compass/compass.statement-carousel.css','assets/compass/compass.brain-scene.js','assets/compass/compass.house-scene.js','assets/compass/compass.gen1537.recovery.js'];
          const changed=cp.execFileSync('git',['diff','--name-only',`${base}...HEAD`],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const current=fs.readFileSync('assets/compass/compass.capability-carousel.js','utf8');
          const governing=fs.readFileSync('/tmp/governing-capability.js','utf8');
          const extract=src=>{const start=src.indexOf('function mountProof(){');if(start<0)return'';const tail=src.slice(start);const m=tail.match(/function mountProof\(\)\{[\s\S]*?\nfunction /);return m?m[0].slice(0,-10):''};
          const currentProof=extract(current),governingProof=extract(governing);
          const recovery=fs.readFileSync('assets/compass/compass.gen1537.recovery.js','utf8');
          const checks={exactHead:cp.execFileSync('git',['rev-parse','HEAD^{commit}'],{encoding:'utf8'}).trim()===process.env.COMPASS_CANDIDATE_HEAD,exactScope:changed.every(p=>allowed.has(p)),protectedPathsUnchanged:protectedPaths.every(p=>!changed.includes(p)),lowerProofFunctionByteIdentical:Boolean(currentProof)&&currentProof===governingProof,noProofTabs:!current.includes('compass-proof-choice')&&!current.includes('data-built-proof-choice'),upperStageOnly:current.includes("stage.dataset.reconciliationStage='gen1561'")&&current.includes('compass-action-dock'),noTrophyActivation:!current.includes('CompassTrophyScene?.activate'),noFixedCenterCompass:!recovery.includes('mountInstrument()')&&!recovery.includes('FIXED_CENTER_TRUE_3D_PRIMARY_INSTRUMENT'),clusterInstruction:current.includes('Choose a room · <span class="compass-guidance__swipe">Swipe to rotate the cluster</span> · Return to Orbit.')};
          const failures=Object.entries(checks).filter(([,v])=>!v).map(([k])=>k);
          const receipt={schema:'COMPASS_GEN1561_ENGINEERING_FLOOR_RECEIPT_v1',candidateHead:process.env.COMPASS_CANDIDATE_HEAD,governingHead:base,changedPaths:changed,checks,failures,result:failures.length?'FAIL_CLOSED':'PASS_CLOSED'};
          fs.writeFileSync('/tmp/compass-engineering-floor-receipt.json',JSON.stringify(receipt,null,2)+'\n');console.log(JSON.stringify(receipt,null,2));if(failures.length)process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-gen1561-engineering-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/compass-engineering-floor-receipt.json
          retention-days: 90

  experience:
    runs-on: ubuntu-latest
    needs: engineering-floor
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMPASS_CANDIDATE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Host exact candidate and governing baseline
        run: |
          git worktree add --detach /tmp/compass-governing "$COMPASS_GOVERNING_HEAD"
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/compass-candidate-http.log 2>&1 &
          (cd /tmp/compass-governing && python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/compass-governing-http.log 2>&1) &
          for port in 4173 4174; do for i in $(seq 1 30); do curl -fsS "http://127.0.0.1:${port}/" >/dev/null && break; sleep 1; done; curl -fsS "http://127.0.0.1:${port}/" >/dev/null; done
      - name: Capture protected experience and Trophy stress matrix
        shell: bash
        run: |
          mkdir -p /tmp/compass-experience-captures
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});const candidateHead=process.env.COMPASS_CANDIDATE_HEAD,governingHead=process.env.COMPASS_GOVERNING_HEAD;
          const viewports=[['desktop',1440,1000],['tablet',1024,1366],['phone',390,844]],errors=[],metrics={},detail={};
          const hardZero={lowerProofOrbitPreserved:true,noCenterCompass:true,mirrorlandObjectivePresent:true,clusterGuidanceComplete:true,trophyStressStable:true,upperForegroundExclusive:true,localActionMatchesSelection:true,noNavigationDuringDrag:true,spatialEconomy:true,responsiveIntegrity:true,protectedConstellationTraversal:true,protectedStatementPresence:true,noBrowserErrors:true,noHorizontalOverflow:true};const fail=k=>{hardZero[k]=false};
          const shot=(p,n)=>p.screenshot({path:`/tmp/compass-experience-captures/${n}.png`,fullPage:true});
          const lowerSignature=p=>p.evaluate(()=>({cards:[...document.querySelectorAll('[data-proof-orbit] [data-proof-card]')].map(n=>({id:n.dataset.proofCard,title:n.querySelector('h3')?.textContent?.trim()||'',text:n.innerText.replace(/\s+/g,' ').trim(),hrefs:[...n.querySelectorAll('a')].map(a=>a.getAttribute('href'))})),tabCount:document.querySelectorAll('[data-proof-orbit] [role="tab"], [data-proof-orbit] .compass-proof-choice').length,front:document.querySelector('[data-proof-orbit] [data-slot="front"]')?.dataset.proofCard||'',controls:document.querySelectorAll('[data-proof-orbit] [data-orbit-previous], [data-proof-orbit] [data-orbit-next]').length}));
          const load=async(p,port=4173)=>{await p.goto(`http://127.0.0.1:${port}/?candidate=${candidateHead}`,{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(1200)};
          for(const [id,width,height] of viewports){const context=await browser.newContext({viewport:{width,height},reducedMotion:'no-preference'}),page=await context.newPage();page.on('pageerror',e=>errors.push(`${id}:${e.message||e}`));await load(page);await shot(page,`${id}-initial`);
            const initial=await page.evaluate(()=>({centerCompass:document.querySelectorAll('[data-gen1537-compass-instrument],.compass-gen1537-instrument,[data-upstream-compass-mount]').length,objective:(document.querySelector('.compass-orbit-intro')?.innerText||''),statement:Boolean(document.querySelector('.compass-statement-orbit')),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,stageHeight:document.querySelector('.compass-capability-orbit')?.getBoundingClientRect().height||0,active:document.querySelectorAll('.compass-capability-orbit [data-active="true"]').length,dock:(document.querySelector('.compass-capability-orbit .compass-action-dock')?.innerText||'').trim()}));
            if(initial.centerCompass!==0)fail('noCenterCompass');if(!/Mirrorland/i.test(initial.objective)||!/Rotate the Compass/i.test(initial.objective))fail('mirrorlandObjectivePresent');if(!initial.statement)fail('protectedStatementPresence');if(initial.overflow>2)fail('noHorizontalOverflow');if(initial.active!==1)fail('upperForegroundExclusive');if(!/Enter Coheriscope/i.test(initial.dock))fail('localActionMatchesSelection');if(initial.stageHeight>(id==='phone'?360:410))fail('spatialEconomy');
            const gc=await browser.newContext({viewport:{width,height}}),gp=await gc.newPage();await load(gp,4174);const candidateProof=await lowerSignature(page),governingProof=await lowerSignature(gp);if(JSON.stringify(candidateProof.cards)!==JSON.stringify(governingProof.cards)||candidateProof.cards.length!==3||candidateProof.tabCount!==0||candidateProof.controls<2)fail('lowerProofOrbitPreserved');await gc.close();
            const upper=page.locator('.compass-capability-orbit .compass-object-stage'),box=await upper.boundingBox();if(box){const before=page.url();await page.mouse.move(box.x+box.width*.55,box.y+box.height*.5);await page.mouse.down();await page.mouse.move(box.x+box.width*.72,box.y+box.height*.5,{steps:5});const during=await page.evaluate(()=>({busy:document.querySelector('.compass-capability-orbit .compass-action-dock')?.getAttribute('aria-busy'),href:location.href}));if(during.busy!=='true'||during.href!==before)fail('noNavigationDuringDrag');await page.mouse.up();await page.waitForTimeout(650)}
            const next=page.locator('.compass-capability-orbit [data-orbit-next]');let trophyArrivals=0;for(let r=0;r<10;r++){for(let s=0;s<3;s++){await next.click();await page.waitForTimeout(620);const x=await page.evaluate(()=>({active:document.querySelector('.compass-capability-orbit [data-active="true"]')?.dataset.capability||'',count:document.querySelectorAll('.compass-capability-orbit [data-active="true"]').length,dock:(document.querySelector('.compass-action-dock')?.innerText||'').trim()}));if(x.count!==1)fail('upperForegroundExclusive');if(x.active==='awards'){trophyArrivals++;if(!/Enter Awards/i.test(x.dock))fail('localActionMatchesSelection')}if(x.active==='house'&&(!/Jeeves/i.test(x.dock)||!/Elara/i.test(x.dock)||!/Auren/i.test(x.dock)))fail('localActionMatchesSelection');if(x.active==='diagnostic'&&!/Enter Coheriscope/i.test(x.dock))fail('localActionMatchesSelection')}}if(trophyArrivals<10)fail('trophyStressStable');await shot(page,`${id}-post-trophy-stress`);
            const proofBefore=await page.evaluate(()=>document.querySelector('[data-proof-orbit] [data-slot="front"]')?.dataset.proofCard||'');await page.locator('[data-proof-orbit] [data-orbit-next]').click();await page.waitForTimeout(380);const proofAfter=await page.evaluate(()=>document.querySelector('[data-proof-orbit] [data-slot="front"]')?.dataset.proofCard||'');if(!proofBefore||!proofAfter||proofBefore===proofAfter)fail('lowerProofOrbitPreserved');
            const ctrl=await page.evaluate(async()=>{const c=globalThis.DGB_COMPASS_CONTROLLER;if(!c)return{ok:false};try{c.requestCardinalSelection?.('east');await new Promise(r=>setTimeout(r,450));const root=document.querySelector('[data-compass-root]'),guidance=document.querySelector('[data-compass-guidance]')?.innerText||'',cluster=root?.dataset.compassMode||'';c.requestRoomSelection?.('east-1');await new Promise(r=>setTimeout(r,450));const room=root?.dataset.compassMode||'';c.requestReturnToOrbit?.();await new Promise(r=>setTimeout(r,450));const returned=root?.dataset.compassMode||'';return{ok:true,cluster,room,returned,guidance}}catch(e){return{ok:false,error:String(e)}}});if(!ctrl.ok||!/(CLUSTER_OPEN|ROOM_SELECTED)/.test(`${ctrl.cluster} ${ctrl.room}`)||!/CONSTELLATION|CLUSTER_OPEN/.test(ctrl.returned))fail('protectedConstellationTraversal');if(!/Choose a room/i.test(ctrl.guidance)||!/Swipe/i.test(ctrl.guidance)||!/Return to Orbit/i.test(ctrl.guidance))fail('clusterGuidanceComplete');await shot(page,`${id}-cluster-guidance`);
            await load(page);const door=page.locator('[data-compass-object="mirrorland"]');if(await door.count()){await door.click({force:true});await page.waitForTimeout(650);const mirror=await page.evaluate(()=>document.querySelector('[data-compass-root]')?.dataset.compassMode||'');if(!/MIRRORLAND/.test(mirror))fail('protectedConstellationTraversal')}else fail('mirrorlandObjectivePresent');
            const finalState=await page.evaluate(()=>({overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,active:document.querySelectorAll('.compass-capability-orbit [data-active="true"]').length,proof:document.querySelectorAll('[data-proof-orbit] [data-proof-card]').length}));if(finalState.overflow>2)fail('noHorizontalOverflow');if(finalState.active!==1||finalState.proof!==3)fail('responsiveIntegrity');metrics[id]={trophyArrivals,stageHeight:initial.stageHeight,overflow:Math.max(initial.overflow,finalState.overflow),proofBefore,proofAfter};detail[id]={initial,candidateProof,governingProof,ctrl,finalState};await context.close()}
          if(errors.length){hardZero.noBrowserErrors=false;hardZero.trophyStressStable=false}await browser.close();const receipt={schema:'COMPASS_EXPERIENCE_CAPTURE_RECEIPT_v3',candidateHead,governingHead,viewports:viewports.map(v=>v[0]),hardZero,metrics,detail,errors,stateMatrixComplete:Object.values(hardZero).every(Boolean),result:Object.values(hardZero).every(Boolean)?'PASS_CLOSED':'EXPERIENCE_FAIL_CLOSED'};fs.writeFileSync('/tmp/compass-experience-capture-receipt.json',JSON.stringify(receipt,null,2)+'\n');console.log(JSON.stringify(receipt,null,2));if(receipt.result!=='PASS_CLOSED')process.exit(1);
          NODE
      - name: Verify Gen1561 reconciliation receipt
        if: always()
        run: node .github/ai-router/projects/compass/verify-experience-consolidation.v1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-gen1561-experience-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/compass-experience-capture-receipt.json
            /tmp/compass-experience-consolidation-receipt.json
            /tmp/compass-experience-captures/
          retention-days: 90
