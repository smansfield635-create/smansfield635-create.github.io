name: Methods page mandatory excellence blind baseline

on:
  pull_request:
    branches: [main]
    paths:
      - 'AI_ENTRYPOINT.json'
      - '.github/ai-router/router.v1.json'
      - '.github/ai-router/page-excellence-toolchain/**'
      - '.github/workflows/methods-page-mandatory-excellence-blind-baseline-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: methods-page-blind-baseline-${{ github.ref }}
  cancel-in-progress: false

env:
  SUBJECT_HEAD: 2044e7ab5d27af7bcfbd477a6c3ee046549744ed
  PACKAGING_HEAD: 6c9f32d4ea13905b87f3519f9c18c425ae0e449c
  CANDIDATE_ROOT: control-plane/methods-information-benchmark/page-implementation-candidate-v1

jobs:
  toolchain-self-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout activation candidate
        uses: actions/checkout@v4
      - name: Validate toolchain schemas and route classifier
        run: |
          node .github/ai-router/page-excellence-toolchain/self-test.v1.mjs
          node .github/ai-router/page-excellence-toolchain/page-operation-entry-gate.v1.mjs --self-test
      - name: Validate JavaScript syntax
        run: |
          for file in .github/ai-router/page-excellence-toolchain/*.mjs; do node --check "$file"; done

  blind-evaluation:
    needs: toolchain-self-test
    strategy:
      fail-fast: false
      matrix:
        holder: [builder, fresh-verifier]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout activation candidate
        uses: actions/checkout@v4
        with:
          path: toolchain

      - name: Checkout packaging successor
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PACKAGING_HEAD }}
          fetch-depth: 0
          path: subject

      - name: Prove immutable visual subject
        shell: bash
        run: |
          cd subject
          mapfile -t changed < <(git diff --name-only "$SUBJECT_HEAD" "$PACKAGING_HEAD")
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$CANDIDATE_ROOT/state-schema.v1.json"
          echo 'VISUAL_BYTES_PRESERVED=true' >> "$GITHUB_ENV"

      - name: Reproduce packaged deterministic validation
        shell: bash
        run: |
          cd "subject/$CANDIDATE_ROOT"
          node validate.mjs | tee "$RUNNER_TEMP/static-validation.json"
          node -e "const r=require(process.argv[1]); if(r.result!=='PASS'||r.checks.length!==30) process.exit(1)" "$RUNNER_TEMP/static-validation.json"
          for file in candidate/*.mjs; do node --check "$file"; done
          echo 'PACKAGING_VALIDATION_PASS=true' >> "$GITHUB_ENV"

      - name: Install blind runtime instrumentation
        shell: bash
        working-directory: toolchain
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright @axe-core/playwright
          npx playwright install --with-deps chromium firefox webkit

      - name: Execute blind browser, accessibility, responsive, performance, and state evaluation
        shell: bash
        run: |
          mkdir -p "toolchain/artifacts"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "subject/$CANDIDATE_ROOT/candidate" >"$RUNNER_TEMP/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
          node toolchain/.github/ai-router/page-excellence-toolchain/blind-evaluator.v1.mjs \
            --base-url http://127.0.0.1:4173/index.html \
            --subject-dir "$GITHUB_WORKSPACE/subject/$CANDIDATE_ROOT" \
            --subject-head "$SUBJECT_HEAD" \
            --packaging-head "$PACKAGING_HEAD" \
            --holder "${{ matrix.holder }}" \
            --browsers chromium,firefox,webkit \
            --toolset-bundle toolchain/.github/ai-router/page-excellence-toolchain/toolset.bundle.v1.json \
            --output "toolchain/artifacts/${{ matrix.holder }}.json"

      - name: Upload blind JSON receipt
        uses: actions/upload-artifact@v4
        with:
          name: methods-page-blind-${{ matrix.holder }}
          path: toolchain/artifacts/${{ matrix.holder }}.json
          if-no-files-found: error
          retention-days: 30

  independent-reproduction:
    needs: blind-evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout activation candidate
        uses: actions/checkout@v4
        with:
          path: toolchain
      - name: Download builder receipt
        uses: actions/download-artifact@v4
        with:
          name: methods-page-blind-builder
          path: receipts/builder
      - name: Download fresh-verifier receipt
        uses: actions/download-artifact@v4
        with:
          name: methods-page-blind-fresh-verifier
          path: receipts/fresh-verifier
      - name: Compare normalized score identities
        continue-on-error: true
        run: |
          mkdir -p final
          node toolchain/.github/ai-router/page-excellence-toolchain/compare-reproductions.v1.mjs \
            --builder receipts/builder/builder.json \
            --verifier receipts/fresh-verifier/fresh-verifier.json \
            --output final/methods-page-blind-baseline-result.v1.json
      - name: Upload final blind decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: methods-page-blind-baseline-final
          path: final/methods-page-blind-baseline-result.v1.json
          if-no-files-found: error
          retention-days: 30
