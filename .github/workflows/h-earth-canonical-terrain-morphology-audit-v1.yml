name: H-Earth Canonical Terrain Morphology Audit v1
on: workflow_dispatch
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node h-earth-3d/audits/h-earth-canonical-terrain-morphology-audit.v1.mjs | tee h-earth-canonical-morphology.json
      - uses: actions/upload-artifact@v4
        with:
          name: h-earth-canonical-morphology-${{ github.run_id }}
          path: h-earth-canonical-morphology.json
