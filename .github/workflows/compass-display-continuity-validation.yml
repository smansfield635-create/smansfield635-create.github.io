      - name: Assert 19 rendered foreground room labels
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:800}});
          const failures=[];
          const observations=[];
          const fail=(id,evidence)=>failures.push({id,evidence});
          const normalize=v=>{const m=Math.hypot(...v)||1;return v.map(n=>n/m);};
          const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
          const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
          const quaternionFromTo=(from,to)=>{
            const a=normalize(from),b=normalize(to),d=Math.max(-1,Math.min(1,dot(a,b)));
            if(d>0.999999) return [0,0,0,1];
            if(d<-0.999999){
              let axis=cross(a,[1,0,0]);
              if(Math.hypot(...axis)<1e-6) axis=cross(a,[0,1,0]);
              axis=normalize(axis);
              return [axis[0],axis[1],axis[2],0];
            }
            const c=cross(a,b),s=Math.sqrt((1+d)*2),inv=1/s;
            return normalize([c[0]*inv,c[1]*inv,c[2]*inv,s*0.5]);
          };
          const roomVector=(index,count)=>{
            const safeCount=Math.max(1,count);
            const longitude=(Math.PI*2*index)/safeCount-Math.PI/2;
            const latitude=Math.sin((index+0.5)*1.73)*0.48;
            const cosineLatitude=Math.cos(latitude);
            return normalize([Math.cos(longitude)*cosineLatitude,Math.sin(latitude),Math.sin(longitude)*cosineLatitude]);
          };
          const primaryAnchor=normalize([0,0.70,0.714]);
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:20000});
          await page.waitForSelector('[data-compass-root]',{timeout:10000});
          await page.waitForSelector('[data-compass-projected-room-label]',{state:'attached',timeout:10000});
          await page.waitForFunction(()=>Boolean(globalThis.DGB_COMPASS_CONTROLLER),{timeout:10000});
          const declarations=await page.evaluate(()=>[...document.querySelectorAll('[data-compass-room-declarations] [data-compass-room]')].map(el=>({id:el.dataset.roomId,label:(el.dataset.label||'').trim(),wing:el.dataset.wing})));
          if(declarations.length!==19) fail('DECLARATION_COUNT',declarations.length);
          for(const wing of ['north','east','south','west']){
            await page.evaluate(w=>document.querySelector(`[data-compass-cardinal][data-cardinal-id="${w}"]`)?.click(),wing);
            await page.waitForFunction(w=>{const root=document.querySelector('[data-compass-root]');return root?.dataset.compassMode==='CLUSTER_OPEN'&&root?.dataset.selectedCardinal===w;},wing,{timeout:10000});
            const rooms=declarations.filter(item=>item.wing===wing);
            for(let index=0;index<rooms.length;index++){
              const room=rooms[index];
              const quaternion=quaternionFromTo(roomVector(index,rooms.length),primaryAnchor);
              const committed=await page.evaluate(({wing,roomId,quaternion})=>globalThis.DGB_COMPASS_CONTROLLER?.requestClusterCommit(wing,{quaternion,primaryRoom:roomId,source:'foreground-label-render-gate'})===true,{wing,roomId:room.id,quaternion});
              await page.waitForTimeout(220);
              const state=await page.evaluate(()=>{
                const root=document.querySelector('[data-compass-root]');
                const label=document.querySelector('[data-compass-projected-room-label]');
                const style=label?getComputedStyle(label):null;
                const rect=label?.getBoundingClientRect();
                return {mode:root?.dataset.compassMode||'',foreground:root?.dataset.clusterPreviewPrimaryRoom||root?.dataset.clusterPrimaryRoom||'',selectedRoom:root?.dataset.selectedRoom||'',renderedRoomId:label?.dataset.roomId||'',text:(label?.textContent||'').replace(/\s+/g,' ').trim(),visible:Boolean(label&&!label.hidden&&style&&style.display!=='none'&&style.visibility!=='hidden'&&Number(style.opacity||1)>0.01&&rect&&rect.width>0&&rect.height>0),background:style?.backgroundImage||style?.backgroundColor||''};
              });
              const correct=committed&&state.mode==='CLUSTER_OPEN'&&state.selectedRoom===''&&state.foreground===room.id&&state.renderedRoomId===room.id&&state.text===room.label&&state.visible&&!/^rgb\(0, 0, 0\)$/.test(state.background||'');
              observations.push({wing,roomId:room.id,expectedLabel:room.label,committed,quaternion,state,correct});
              if(!correct) fail(`${room.id}_FOREGROUND_LABEL_INVALID`,observations.at(-1));
            }
            await page.evaluate(()=>globalThis.DGB_COMPASS_CONTROLLER?.requestReturnToConstellation?.({source:'foreground-label-render-gate',scrollToScene:false}));
            await page.waitForTimeout(120);
          }
          await page.screenshot({path:'/tmp/compass-foreground-room-label-final.png',fullPage:true});
          await browser.close();
          const proved=observations.filter(item=>item.correct).map(item=>item.roomId);
          if(proved.length!==19) fail('NINETEEN_FOREGROUND_LABELS_NOT_PROVEN',{count:proved.length,ids:proved});
          const receipt={schema:'COMPASS_RENDERED_FOREGROUND_ROOM_LABEL_RECEIPT_v3',candidateHead:process.env.COMPASS_CANDIDATE_HEAD||null,result:failures.length?'FAIL_CLOSED':'PASS_CLOSED',provedForegroundLabels:proved,observations,failures};
          fs.writeFileSync('/tmp/compass-foreground-room-label-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          if(failures.length) process.exit(1);
          NODE
