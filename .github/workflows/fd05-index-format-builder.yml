name: FD05 format and revalidate index viewport candidate

on:
  pull_request:
    branches:
      - agent/fd05-index-format-builder-001
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format-and-revalidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fd05-index-format-builder-001
          fetch-depth: 0
      - name: Format inserted blocks and rerun gates
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git show origin/agent/fd05-index-format-builder-001:.fd05/format-index-viewport.py > /tmp/format-index-viewport.py
          git show origin/agent/fd05-index-compositor-viewport-work-001:.fd05/test-index-viewport.mjs > /tmp/test-index-viewport.mjs
          git checkout -B agent/fd05-index-compositor-viewport-work-001 origin/agent/fd05-index-compositor-viewport-work-001
          python3 /tmp/format-index-viewport.py
          node --check showroom/globe/h-earth/index.js
          cp /tmp/test-index-viewport.mjs .fd05-test-index-viewport.mjs
          node --experimental-default-type=module .fd05-test-index-viewport.mjs
          rm .fd05-test-index-viewport.mjs
          test "$(git status --short | awk '{print $2}')" = "showroom/globe/h-earth/index.js"
          echo "FORMATTED_BYTES=$(wc -c < showroom/globe/h-earth/index.js | tr -d ' ')"
          echo "FORMATTED_SHA256=$(sha256sum showroom/globe/h-earth/index.js | awk '{print $1}')"
          echo "FORMATTED_GIT_BLOB=$(git hash-object showroom/globe/h-earth/index.js)"
          git config user.name "OpenAI Engineering Agent"
          git config user.email "engineering-agent@users.noreply.github.com"
          git add showroom/globe/h-earth/index.js
          git commit -m "Normalize compositor viewport initialization formatting"
          git push origin HEAD:agent/fd05-index-compositor-viewport-work-001
