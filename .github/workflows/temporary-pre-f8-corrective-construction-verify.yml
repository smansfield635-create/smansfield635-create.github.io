name: Temporary Pre-F8 Corrective Construction Verify
on:
  push:
    branches:
      - construction/methods-models-integrated-environment-v1
    paths:
      - 'control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/pre-f8-corrective-construction-v1/**'
      - '.github/workflows/temporary-pre-f8-corrective-construction-verify.yml'
concurrency:
  group: pre-f8-corrective-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify-pre-f8-corrective:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify corrective package
        run: node control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/pre-f8-corrective-construction-v1/verify.v1.mjs
      - name: Prove no public or F8 construction paths changed from F7 terminal
        shell: bash
        run: |
          git diff --name-only 915538c30b17ef1a1746352a7bb221181190b739..HEAD > /tmp/changed.txt
          cat /tmp/changed.txt
          unexpected=$(grep -Ev '^(control-plane/methods-information-benchmark/methods-models-integrated-environment-construction-v1/pre-f8-corrective-construction-v1/|\.github/workflows/temporary-pre-f8-corrective-construction-verify\.yml$)' /tmp/changed.txt || true)
          if [ -n "$unexpected" ]; then echo "$unexpected"; echo 'Unexpected path changed'; exit 1; fi
          public=$(grep -E '^(laws/|frontier/|showroom/)' /tmp/changed.txt || true)
          if [ -n "$public" ]; then echo "$public"; echo 'Public mutation detected'; exit 1; fi
          spatial=$(grep -Ei 'f8-spatial|geometry|webgl' /tmp/changed.txt | grep -v 'pre-f8-corrective-construction-v1' || true)
          if [ -n "$spatial" ]; then echo "$spatial"; echo 'F8/geometry path detected'; exit 1; fi
