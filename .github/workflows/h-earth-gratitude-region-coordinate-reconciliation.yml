name: H-Earth Gratitude Region Coordinate Reconciliation

# Isolated validation trigger for bounded Gratitude Region reconciliation.
# Frontier Plains and the regional closure use controlling identities; no GR-CR-05 label is assumed.
on:
  push:
    branches:
      - agent/h-earth-gratitude-region-coordinate-reconciliation-001
  pull_request:
    branches:
      - main
      - agent/h-earth-gratitude-region-coordinate-reconciliation-validation-base-001
  workflow_dispatch:

concurrency:
  group: h-earth-gratitude-region-coordinate-reconciliation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-coordinate-reconciliation:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Check out coordinate-reconciliation branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Execute bounded analysis harness regression
        env:
          H_EARTH_GR_CR_RECEIPT: /tmp/h-earth-gr-cr-receipt.json
        run: |
          set -o pipefail
          node h-earth-3d/validation/h-earth.gratitude-region.coordinate-reconciliation.harness.mjs \
            2>&1 | tee /tmp/h-earth-gr-cr.log

      - name: Execute bounded Entry Zone regression
        env:
          H_EARTH_GR_CR_ENTRY_RECEIPT: /tmp/h-earth-gr-cr-entry-receipt.json
        run: |
          set -o pipefail
          node h-earth-3d/validation/h-earth.gratitude-region.entry-zone-reconciliation.runner.mjs \
            2>&1 | tee /tmp/h-earth-gr-cr-entry.log

      - name: Execute bounded Mirror Manor regression
        env:
          H_EARTH_GR_CR_MANOR_RECEIPT: /tmp/h-earth-gr-cr-manor-receipt.json
        run: |
          set -o pipefail
          node h-earth-3d/validation/h-earth.gratitude-region.mirror-manor-reconciliation.runner.mjs \
            2>&1 | tee /tmp/h-earth-gr-cr-manor.log

      - name: Execute bounded Cavern Precinct regression
        env:
          H_EARTH_GR_CR_CAVERN_RECEIPT: /tmp/h-earth-gr-cr-cavern-receipt.json
        run: |
          set -o pipefail
          node h-earth-3d/validation/h-earth.gratitude-region.cavern-precinct-reconciliation.runner.mjs \
            2>&1 | tee /tmp/h-earth-gr-cr-cavern.log

      - name: Execute bounded Frontier Plains capacity and relationship analysis
        env:
          H_EARTH_GR_FRONTIER_PLAINS_RECEIPT: /tmp/h-earth-gr-frontier-plains-receipt.json
        run: |
          set -o pipefail
          node h-earth-3d/validation/h-earth.gratitude-region.frontier-plains-capacity-relationship-reconciliation.runner.mjs \
            2>&1 | tee /tmp/h-earth-gr-frontier-plains.log

      - name: Execute non-numbered regional candidate-set completeness and closure audit
        env:
          H_EARTH_GR_REGIONAL_CLOSURE_RECEIPT: /tmp/h-earth-gratitude-region-candidate-set-closure.json
        run: |
          set -o pipefail
          node --input-type=module <<'NODE' 2>&1 | tee /tmp/h-earth-gratitude-region-candidate-set-closure.log
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const readJson = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const hashFile = (path) => execFileSync('git', ['hash-object', path], { encoding: 'utf8' }).trim();
          const stable = (value) => value === null || typeof value !== 'object'
            ? JSON.stringify(value)
            : Array.isArray(value)
              ? `[${value.map(stable).join(',')}]`
              : `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${stable(value[key])}`).join(',')}}`;
          const digest = (value) => crypto.createHash('sha256').update(stable(value)).digest('hex');
          const sameSet = (left, right) => left.length === right.length
            && [...left].sort().every((value, index) => value === [...right].sort()[index]);
          const boundsDistance = (left, right) => {
            const dx = left.xMaximum < right.xMinimum
              ? right.xMinimum - left.xMaximum
              : right.xMaximum < left.xMinimum
                ? left.xMinimum - right.xMaximum
                : 0;
            const dz = left.zMaximum < right.zMinimum
              ? right.zMinimum - left.zMaximum
              : right.zMaximum < left.zMinimum
                ? left.zMinimum - right.zMaximum
                : 0;
            return Math.hypot(dx, dz);
          };
          const requireCheck = (condition, code, issues) => {
            if (!condition) issues.push(code);
          };

          const paths = Object.freeze({
            spatial: 'h-earth-3d/control-plane/region-001-reconciliation/h-earth.region-001.gratitude-region-spatial-interaction-area-development.v1.json',
            manifest: 'h-earth-3d/control-plane/region-001-reconciliation/h-earth.region-001.mirrorland-narrative-character-temporal-reconciliation.manifest.v1.json',
            ledger: 'h-earth-3d/control-plane/region-001-reconciliation/h-earth.gratitude-region.coordinate-reconciliation.input-ledger.v1.json',
            entrySource: 'h-earth-3d/validation/h-earth.gratitude-region.entry-zone-reconciliation.mjs',
            manorSource: 'h-earth-3d/validation/h-earth.gratitude-region.mirror-manor-reconciliation.mjs',
            cavernSource: 'h-earth-3d/validation/h-earth.gratitude-region.cavern-precinct-reconciliation.mjs',
            frontierSource: 'h-earth-3d/validation/h-earth.gratitude-region.frontier-plains-capacity-relationship-reconciliation.mjs',
            entryDurable: 'h-earth-3d/validation/h-earth.gratitude-region.entry-zone-reconciliation.receipt.v1.json',
            manorDurable: 'h-earth-3d/validation/h-earth.gratitude-region.mirror-manor-reconciliation.receipt.v1.json',
            cavernDurable: 'h-earth-3d/validation/h-earth.gratitude-region.cavern-precinct-reconciliation.receipt.v1.json',
            frontierDurable: 'h-earth-3d/validation/h-earth.gratitude-region.frontier-plains-capacity-relationship-reconciliation.receipt.v1.json',
            entryCurrent: '/tmp/h-earth-gr-cr-entry-receipt.json',
            manorCurrent: '/tmp/h-earth-gr-cr-manor-receipt.json',
            cavernCurrent: '/tmp/h-earth-gr-cr-cavern-receipt.json',
            frontierCurrent: '/tmp/h-earth-gr-frontier-plains-receipt.json'
          });

          const expectedBlobs = Object.freeze({
            spatial: 'ee5ca94f5ae55ce8f11b460428b800ad4e9a2a9d',
            manifest: '1702d62036a6b241fdadddfabc304a5288f38652',
            entrySource: 'b7e5d6378a772e3ba62320e609cb491365002d05',
            manorSource: 'ea41fe679c0b3f38efa8fd463418b9288b9387fb',
            cavernSource: '2eb292b1a95abbb01f51a0492738cfccbf474b7d',
            frontierSource: '3b1123831ab195900365560b47d10c496f223609',
            entryDurable: 'cefc91a7ffa3047317e3902f3b29a591aaabe468',
            manorDurable: '9dfc45298d0e5f07537807e0518e9743840839d9',
            cavernDurable: '48c51c8c889695cbd81b2bc0777e5d28a716776f',
            frontierDurable: '7b5c8596f39d6855cd975ada282c9a9b18f28fe9'
          });

          const spatial = readJson(paths.spatial);
          const manifest = readJson(paths.manifest);
          const ledger = readJson(paths.ledger);
          const entryDurable = readJson(paths.entryDurable);
          const manorDurable = readJson(paths.manorDurable);
          const cavernDurable = readJson(paths.cavernDurable);
          const frontierDurable = readJson(paths.frontierDurable);
          const entryCurrent = readJson(paths.entryCurrent);
          const manorCurrent = readJson(paths.manorCurrent);
          const cavernCurrent = readJson(paths.cavernCurrent);
          const frontierCurrent = readJson(paths.frontierCurrent);

          const requiredAreaIds = Object.freeze([
            'GRATITUDE_REGION_ENTRY_ZONE',
            'GRATITUDE_REGION_MIRROR_MANOR_PRECINCT',
            'GRATITUDE_REGION_CAVERN_PRECINCT',
            'GRATITUDE_REGION_FRONTIER_PLAINS'
          ]);
          const areaRecords = Object.fromEntries(
            spatial.interactionAreaProgram.areas.map((area) => [area.areaId, area])
          );

          function buildClosureAudit() {
            const issues = [];

            requireCheck(hashFile(paths.spatial) === expectedBlobs.spatial, 'CONTROLLING_SPATIAL_ARTIFACT_BLOB_MISMATCH', issues);
            requireCheck(hashFile(paths.manifest) === expectedBlobs.manifest, 'CONTROLLING_MANIFEST_BLOB_MISMATCH', issues);
            requireCheck(ledger.authority.neighboringSpatialArtifact.gitBlob === expectedBlobs.spatial, 'INPUT_LEDGER_SPATIAL_REFERENCE_MISMATCH', issues);
            requireCheck(spatial.interactionAreaProgram.requiredAreaCount === 4, 'ROADMAP_REQUIRED_AREA_COUNT_NOT_FOUR', issues);
            requireCheck(sameSet(spatial.interactionAreaProgram.areas.map((area) => area.areaId), requiredAreaIds), 'ROADMAP_REQUIRED_AREA_INVENTORY_MISMATCH', issues);
            requireCheck(sameSet(manifest.coordinateReconciliationAuthorization.targetAreas, requiredAreaIds), 'MANIFEST_AUTHORIZED_TARGET_INVENTORY_MISMATCH', issues);
            requireCheck(manifest.coordinateReconciliationAuthorization.stoppingBoundary === 'STOP_AFTER_READ_ONLY_EVIDENCE_CANDIDATE_ENVELOPE_AND_INTEGRATED_REVIEW_PACKAGE_BEFORE_ACCEPTANCE_PLACEMENT_OR_CONSTRUCTION', 'MANIFEST_STOPPING_BOUNDARY_MISMATCH', issues);

            for (const [key, expectedBlob] of Object.entries(expectedBlobs)) {
              if (key === 'spatial' || key === 'manifest') continue;
              requireCheck(hashFile(paths[key]) === expectedBlob, `${key.toUpperCase()}_BLOB_MISMATCH`, issues);
            }

            const durableStatus = [entryDurable, manorDurable, cavernDurable, frontierDurable];
            requireCheck(durableStatus.every((receipt) => receipt.status === 'PASS_CLOSED'), 'DURABLE_RECEIPT_SET_NOT_PASS_CLOSED', issues);

            const regressionPairs = [
              [entryCurrent, entryDurable.executionReceipt.firstExecutionDigest],
              [manorCurrent, manorDurable.executionReceipt.firstExecutionDigest],
              [cavernCurrent, cavernDurable.executionCustody.firstExecutionDigest],
              [frontierCurrent, frontierDurable.executionCustody.firstExecutionDigest]
            ];
            requireCheck(regressionPairs.every(([current, durableDigest]) =>
              current.eligible === true
              && current.deterministicRepeatExecution === true
              && current.firstExecutionDigest === current.secondExecutionDigest
              && current.firstExecutionDigest === durableDigest
            ), 'CURRENT_REGRESSION_SET_DOES_NOT_MATCH_DURABLE_EXECUTION_IDENTITIES', issues);

            const frontierPrimary = frontierCurrent.evidence.primaryCandidate;
            const frontierFormations = frontierPrimary.formationEvidence.formationSampleCounts
              .map((entry) => entry.formationId);
            const preservationRules = (areaId) => areaRecords[areaId].preservationRules;

            const candidateSetTable = [
              {
                CANDIDATE_CLASS: 'ENTRY_ZONE_CANDIDATE',
                CANDIDATE_ID: entryDurable.entryZoneCandidate.candidateId,
                SOURCE_EXECUTED_HEAD: entryDurable.executionCustody.executedHead,
                SOURCE_BLOB: entryDurable.executionCustody.entryReconciliationGitBlob,
                DURABLE_RECEIPT_BLOB: expectedBlobs.entryDurable,
                EXECUTION_DIGEST: entryDurable.executionReceipt.firstExecutionDigest,
                ELIGIBLE: entryDurable.entryZoneCandidate.eligible,
                ACCEPTED: entryDurable.entryZoneCandidate.accepted,
                FINAL_PLACEMENT: entryDurable.entryZoneCandidate.finalPlacement,
                BOUNDS: entryDurable.entryZoneCandidate.bounds,
                FORMATION: entryDurable.entryZoneCandidate.formationMembership,
                SEMANTIC_ADDRESS: [entryDurable.entryZoneCandidate.centerSemanticAddressId],
                PHYSICAL_CHUNK: [entryDurable.entryZoneCandidate.centerPhysicalChunkId],
                PRESERVATION_RULES: preservationRules('GRATITUDE_REGION_ENTRY_ZONE'),
                UNRESOLVED_FIELDS: [
                  'FINAL_ENTRY_ZONE_ENVELOPE',
                  'FINAL_ENTRY_ANCHOR',
                  'FINAL_ENTRY_FACING_ACCEPTANCE',
                  'FUTURE_ALARIC_STAR_ANCHOR_ENVELOPE',
                  'FUTURE_MAP_PROJECTION_MEETING_ENVELOPE',
                  'FINAL_ROUTES',
                  'FINAL_COORDINATES'
                ]
              },
              {
                CANDIDATE_CLASS: 'MIRROR_MANOR_SITE_ENVELOPE_CANDIDATE',
                CANDIDATE_ID: manorDurable.mirrorManorCandidate.candidateId,
                SOURCE_EXECUTED_HEAD: manorDurable.executionCustody.executedHead,
                SOURCE_BLOB: manorDurable.executionCustody.mirrorManorReconciliationGitBlob,
                DURABLE_RECEIPT_BLOB: expectedBlobs.manorDurable,
                EXECUTION_DIGEST: manorDurable.executionReceipt.firstExecutionDigest,
                ELIGIBLE: manorDurable.mirrorManorCandidate.eligible,
                ACCEPTED: manorDurable.mirrorManorCandidate.accepted,
                FINAL_PLACEMENT: manorDurable.mirrorManorCandidate.finalPlacement,
                BOUNDS: manorDurable.mirrorManorCandidate.bounds,
                FORMATION: manorDurable.mirrorManorCandidate.formationMembership,
                SEMANTIC_ADDRESS: [manorDurable.mirrorManorCandidate.centerSemanticAddressId],
                PHYSICAL_CHUNK: [manorDurable.mirrorManorCandidate.centerPhysicalChunkId],
                PRESERVATION_RULES: preservationRules('GRATITUDE_REGION_MIRROR_MANOR_PRECINCT'),
                UNRESOLVED_FIELDS: [
                  'FINAL_MIRROR_MANOR_PRECINCT_ENVELOPE',
                  'FINAL_MANOR_ANCHOR',
                  'SELECTED_MANOR_FOOTPRINT_CLASS',
                  'FINAL_MANOR_APPROACH_ROUTE',
                  'FINAL_MANOR_SCALE',
                  'FINAL_COORDINATES'
                ]
              },
              {
                CANDIDATE_CLASS: 'CAVERN_EXTERIOR_ENTRANCE_RELATION_CANDIDATE',
                CANDIDATE_ID: cavernDurable.cavernCandidate.candidateId,
                SOURCE_EXECUTED_HEAD: cavernDurable.executionCustody.finalExecutedHead,
                SOURCE_BLOB: cavernDurable.executionCustody.reconciliationBlob,
                DURABLE_RECEIPT_BLOB: expectedBlobs.cavernDurable,
                EXECUTION_DIGEST: cavernDurable.executionCustody.firstExecutionDigest,
                ELIGIBLE: cavernDurable.cavernCandidate.eligible,
                ACCEPTED: cavernDurable.cavernCandidate.accepted,
                FINAL_PLACEMENT: cavernDurable.cavernCandidate.finalPlacement,
                BOUNDS: cavernDurable.cavernCandidate.precinctEnvelope.bounds,
                FORMATION: [cavernDurable.cavernCandidate.exteriorFace.formationId],
                SEMANTIC_ADDRESS: [],
                SEMANTIC_ADDRESS_STATUS: cavernDurable.cavernCandidate.surfaceCorrespondence.semanticProjectionStatus,
                PHYSICAL_CHUNK: [],
                PRESERVATION_RULES: [
                  ...preservationRules('GRATITUDE_REGION_CAVERN_PRECINCT'),
                  'EXCLUDE_WORLD_BOUNDARY_PRECINCT_CENTERS_AND_BOUNDARY_CLIPPED_ENVELOPES',
                  'EXTERIOR_ENTRANCE_RELATION_IS_NOT_CONSTRUCTION_READY_ENTRANCE_GEOMETRY'
                ],
                UNRESOLVED_FIELDS: [
                  'FINAL_CAVERN_PRECINCT_ENVELOPE',
                  'FINAL_CAVE_ENTRANCE_ANCHOR',
                  'ENTRANCE_BUILDABLE_SURFACE_OR_ARCHITECTURAL_TRANSITION',
                  'INTERIOR_TRANSITION_ANCHOR',
                  'INTERIOR_COORDINATES',
                  'CAVERN_SHAPE_SIZE_CONTENTS',
                  'FINAL_ROUTE',
                  'FINAL_COORDINATES'
                ]
              },
              {
                CANDIDATE_CLASS: 'FRONTIER_PLAINS_PRECINCT_ENVELOPE_CANDIDATE',
                CANDIDATE_ID: frontierDurable.primaryNonfinalCandidate.candidateId,
                SOURCE_EXECUTED_HEAD: frontierDurable.executionCustody.finalAnalyticalHead,
                SOURCE_BLOB: frontierDurable.executionCustody.analysisBlob,
                DURABLE_RECEIPT_BLOB: expectedBlobs.frontierDurable,
                EXECUTION_DIGEST: frontierDurable.executionCustody.firstExecutionDigest,
                ELIGIBLE: frontierDurable.primaryNonfinalCandidate.eligible,
                ACCEPTED: frontierDurable.primaryNonfinalCandidate.accepted,
                FINAL_PLACEMENT: frontierDurable.primaryNonfinalCandidate.finalPlacement,
                BOUNDS: frontierDurable.primaryNonfinalCandidate.bounds,
                FORMATION: frontierFormations,
                SEMANTIC_ADDRESS: frontierDurable.addressEvidence.representativeSemanticAddressIds,
                PHYSICAL_CHUNK: frontierDurable.addressEvidence.physicalChunkIds,
                PRESERVATION_RULES: [
                  ...preservationRules('GRATITUDE_REGION_FRONTIER_PLAINS'),
                  'ONE_INTEGRATED_CLOSED_SYSTEM_PRECINCT',
                  'ELEVEN_FUNCTIONS_REMAIN_INTERDEPENDENT_CAPACITY_MODEL',
                  'EXACT_LANE_TO_CELL_MAPPING_DEFERRED'
                ],
                UNRESOLVED_FIELDS: [
                  'FINAL_FRONTIER_PLAINS_ENVELOPE',
                  'FINAL_FRONTIER_ANCHOR',
                  'EXACT_LANE_TO_CELL_MAPPING',
                  'ELEVEN_EXACT_CELL_PLACEMENTS',
                  'ACCEPTED_ENTRY_AND_MANOR_ROUTES',
                  'WATER_INFRASTRUCTURE',
                  'INTERNAL_SHARED_FLOW_CENTERLINES',
                  'FINAL_COORDINATES'
                ]
              }
            ];

            requireCheck(candidateSetTable.every((candidate) => candidate.ELIGIBLE === true), 'ONE_OR_MORE_REGIONAL_CANDIDATES_INELIGIBLE', issues);
            requireCheck(candidateSetTable.every((candidate) => candidate.ACCEPTED === false), 'ONE_OR_MORE_REGIONAL_CANDIDATES_ACCEPTED_WITHOUT_AUTHORITY', issues);
            requireCheck(candidateSetTable.every((candidate) => candidate.FINAL_PLACEMENT === false), 'ONE_OR_MORE_FINAL_PLACEMENTS_ASSIGNED_WITHOUT_AUTHORITY', issues);

            const entryBounds = candidateSetTable[0].BOUNDS;
            const manorBounds = candidateSetTable[1].BOUNDS;
            const cavernBounds = candidateSetTable[2].BOUNDS;
            const frontierBounds = candidateSetTable[3].BOUNDS;

            const relationshipMatrix = [
              {
                RELATION: 'ENTRY_TO_MANOR',
                STATUS: boundsDistance(entryBounds, manorBounds) > 0
                  && manorDurable.mirrorManorCandidate.approachEvidence.eligible === true
                  && manorDurable.twoHillAndCorridorEvidence.lowCorridor.noBuildHalfWidth === 6
                  ? 'PASS'
                  : 'FAIL',
                EVIDENCE: {
                  ENVELOPE_SEPARATION: boundsDistance(entryBounds, manorBounds),
                  MANOR_APPROACH_DERIVED_NOT_ACCEPTED: manorDurable.mirrorManorCandidate.approachEvidence.accepted === false,
                  MANOR_LOW_CORRIDOR_NO_BUILD_HALF_WIDTH: manorDurable.twoHillAndCorridorEvidence.lowCorridor.noBuildHalfWidth,
                  TWO_HILL_RELATION_DERIVED: Boolean(manorDurable.twoHillAndCorridorEvidence.leftHill && manorDurable.twoHillAndCorridorEvidence.rightHill),
                  BEACHWARD_SIGHTLINE: manorDurable.mirrorManorCandidate.viewEvidence.beachwardGroundView,
                  MOUNTAINWARD_SIGHTLINE: manorDurable.mirrorManorCandidate.viewEvidence.mountainwardGroundView
                }
              },
              {
                RELATION: 'ENTRY_TO_CAVERN',
                STATUS: boundsDistance(entryBounds, cavernBounds) > 0
                  && cavernDurable.cavernCandidate.distanceEvidence.entryZoneStraightLineDistance > 0
                  && cavernDurable.cavernCandidate.precinctEnvelope.mountainCoreConflictSampleCount === 0
                  ? 'PASS'
                  : 'FAIL',
                EVIDENCE: {
                  ENVELOPE_SEPARATION: boundsDistance(entryBounds, cavernBounds),
                  STRAIGHT_LINE_DISTANCE: cavernDurable.cavernCandidate.distanceEvidence.entryZoneStraightLineDistance,
                  VISIBILITY_CLASS: cavernDurable.cavernCandidate.visibilityEvidence.entryZone,
                  NARRATIVE_MEANING_ASSIGNED: cavernDurable.cavernCandidate.visibilityEvidence.narrativeMeaningAssigned
                }
              },
              {
                RELATION: 'ENTRY_TO_FRONTIER',
                STATUS: frontierDurable.accessAndRelationshipEvidence.entryZoneRoute.eligible === true
                  && frontierDurable.primaryNonfinalCandidate.entryZoneBufferConflictSampleCount === 0
                  && frontierDurable.accessAndRelationshipEvidence.separation.entryZoneEnvelopeDistance > 0
                  ? 'PASS'
                  : 'FAIL',
                EVIDENCE: {
                  ROUTE_STATUS: frontierDurable.accessAndRelationshipEvidence.entryZoneRoute.status,
                  ROUTE_ACCEPTED: frontierDurable.accessAndRelationshipEvidence.entryZoneRoute.accepted,
                  ENTRY_BUFFER_CONFLICT_SAMPLE_COUNT: frontierDurable.primaryNonfinalCandidate.entryZoneBufferConflictSampleCount,
                  ENVELOPE_SEPARATION: frontierDurable.accessAndRelationshipEvidence.separation.entryZoneEnvelopeDistance
                }
              },
              {
                RELATION: 'MANOR_TO_CAVERN',
                STATUS: boundsDistance(manorBounds, cavernBounds) > 0
                  && cavernDurable.cavernCandidate.distanceEvidence.mirrorManorStraightLineDistance > 0
                  && cavernDurable.cavernCandidate.lawfulApproachCandidate.eligible === true
                  ? 'PASS'
                  : 'FAIL',
                EVIDENCE: {
                  ENVELOPE_SEPARATION: boundsDistance(manorBounds, cavernBounds),
                  STRAIGHT_LINE_DISTANCE: cavernDurable.cavernCandidate.distanceEvidence.mirrorManorStraightLineDistance,
                  APPROACH_PATH_DISTANCE: cavernDurable.cavernCandidate.distanceEvidence.mirrorManorApproachPathDistance,
                  VISIBILITY_CLASS: cavernDurable.cavernCandidate.visibilityEvidence.mirrorManor,
                  APPROACH_ACCEPTED: cavernDurable.cavernCandidate.lawfulApproachCandidate.accepted
                }
              },
              {
                RELATION: 'MANOR_TO_FRONTIER',
                STATUS: frontierDurable.accessAndRelationshipEvidence.mirrorManorRoute.eligible === true
                  && frontierDurable.primaryNonfinalCandidate.mirrorManorBufferConflictSampleCount === 0
                  && frontierDurable.accessAndRelationshipEvidence.separation.mirrorManorEnvelopeDistance > 0
                  ? 'PASS'
                  : 'FAIL',
                EVIDENCE: {
                  ROUTE_STATUS: frontierDurable.accessAndRelationshipEvidence.mirrorManorRoute.status,
                  ROUTE_ACCEPTED: frontierDurable.accessAndRelationshipEvidence.mirrorManorRoute.accepted,
                  MANOR_BUFFER_CONFLICT_SAMPLE_COUNT: frontierDurable.primaryNonfinalCandidate.mirrorManorBufferConflictSampleCount,
                  ENVELOPE_SEPARATION: frontierDurable.accessAndRelationshipEvidence.separation.mirrorManorEnvelopeDistance
                }
              },
              {
                RELATION: 'CAVERN_TO_FRONTIER',
                STATUS: frontierDurable.primaryNonfinalCandidate.cavernPrecinctBufferConflictSampleCount === 0
                  && frontierDurable.primaryNonfinalCandidate.cavernApproachConflictSampleCount === 0
                  && frontierDurable.accessAndRelationshipEvidence.separation.cavernPrecinctEnvelopeDistance > 0
                  && frontierDurable.accessAndRelationshipEvidence.separation.cavernApproachMinimumDistance > 0
                  && frontierDurable.accessAndRelationshipEvidence.separation.mountainCoreMinimumDistance > 0
                  ? 'PASS'
                  : 'FAIL',
                EVIDENCE: {
                  CAVERN_PRECINCT_BUFFER_CONFLICT_SAMPLE_COUNT: frontierDurable.primaryNonfinalCandidate.cavernPrecinctBufferConflictSampleCount,
                  CAVERN_APPROACH_CONFLICT_SAMPLE_COUNT: frontierDurable.primaryNonfinalCandidate.cavernApproachConflictSampleCount,
                  CAVERN_PRECINCT_ENVELOPE_SEPARATION: frontierDurable.accessAndRelationshipEvidence.separation.cavernPrecinctEnvelopeDistance,
                  CAVERN_APPROACH_MINIMUM_DISTANCE: frontierDurable.accessAndRelationshipEvidence.separation.cavernApproachMinimumDistance,
                  MOUNTAIN_CORE_MINIMUM_DISTANCE: frontierDurable.accessAndRelationshipEvidence.separation.mountainCoreMinimumDistance
                }
              }
            ];

            requireCheck(relationshipMatrix.every((relation) => relation.STATUS === 'PASS'), 'REGIONAL_RELATIONSHIP_MATRIX_CONFLICT', issues);

            const localSharedDepartureException = {
              EXCEPTION_ID: 'MANOR_ROUTE_CAVERN_APPROACH_SHARED_DEPARTURE_LOCAL_EXCEPTION',
              STATUS: 'BOUNDED_LOCAL_EXCEPTION_PRESERVED',
              ALLOWED_ONLY_WITHIN_WORLD_UNITS_OF_MANOR_ROUTE_ORIGIN: 32,
              CAVERN_APPROACH_EXCLUSION_PRESERVED_BEYOND_LOCAL_OVERLAP: true,
              GENERAL_PERMISSION_FOR_ROUTE_OVERLAP: false,
              CANDIDATE_ENVELOPE_RULES_RELAXED: frontierDurable.preservedCorrectionHistory.candidateEnvelopeRulesRelaxed,
              CAPACITY_THRESHOLDS_RELAXED: frontierDurable.preservedCorrectionHistory.capacityThresholdsRelaxed,
              PRESERVATION_BOUNDARY_RELAXED_BEYOND_SHARED_DEPARTURE: frontierDurable.preservedCorrectionHistory.preservationBoundaryRelaxedBeyondSharedDeparture
            };
            requireCheck(localSharedDepartureException.CANDIDATE_ENVELOPE_RULES_RELAXED === false, 'LOCAL_EXCEPTION_RELAXED_CANDIDATE_ENVELOPE_RULES', issues);
            requireCheck(localSharedDepartureException.CAPACITY_THRESHOLDS_RELAXED === false, 'LOCAL_EXCEPTION_RELAXED_CAPACITY_THRESHOLDS', issues);
            requireCheck(localSharedDepartureException.PRESERVATION_BOUNDARY_RELAXED_BEYOND_SHARED_DEPARTURE === false, 'LOCAL_EXCEPTION_GENERALIZED_BEYOND_DEPARTURE', issues);

            const preservationAudit = {
              ENTRY_WATERWARD_EXCLUSION: entryCurrent.evidence.waterwardExclusion.eligible === true
                && entryCurrent.evidence.waterwardExclusion.accepted === false
                && entryCurrent.evidence.waterwardExclusion.finalBoundary === false
                && entryCurrent.evidence.waterwardExclusion.exclusionTrace.length > 0,
              MANOR_LOW_CORRIDOR: manorDurable.twoHillAndCorridorEvidence.lowCorridor.accepted === false
                && manorDurable.twoHillAndCorridorEvidence.lowCorridor.finalCenterline === false
                && manorDurable.twoHillAndCorridorEvidence.lowCorridor.noBuildHalfWidth === 6,
              MANOR_TWO_HILL_RELATION: Boolean(manorDurable.twoHillAndCorridorEvidence.leftHill && manorDurable.twoHillAndCorridorEvidence.rightHill && manorDurable.twoHillAndCorridorEvidence.saddle),
              MANOR_BEACHWARD_AND_MOUNTAINWARD_SIGHTLINES: manorDurable.mirrorManorCandidate.viewEvidence.beachwardGroundView === 'CLEAR'
                && manorDurable.mirrorManorCandidate.viewEvidence.mountainwardGroundView === 'CLEAR',
              CAVERN_MOUNTAIN_CORE_EXCLUSION: cavernDurable.cavernCandidate.precinctEnvelope.mountainCoreConflictSampleCount === 0,
              CAVERN_WORLD_BOUNDARY_CLEARANCE: cavernDurable.cavernCandidate.precinctEnvelope.worldBoundaryClearance === 24
                && cavernDurable.cavernCandidate.precinctEnvelope.boundaryClipped === false,
              CAVERN_APPROACH_EXCLUSION: frontierDurable.primaryNonfinalCandidate.cavernApproachConflictSampleCount === 0
                && localSharedDepartureException.CAVERN_APPROACH_EXCLUSION_PRESERVED_BEYOND_LOCAL_OVERLAP === true,
              FRONTIER_ENTRY_AND_MANOR_BUFFERS: frontierDurable.primaryNonfinalCandidate.entryZoneBufferConflictSampleCount === 0
                && frontierDurable.primaryNonfinalCandidate.mirrorManorBufferConflictSampleCount === 0,
              FRONTIER_CAVERN_PRECINCT_BUFFER: frontierDurable.primaryNonfinalCandidate.cavernPrecinctBufferConflictSampleCount === 0,
              FRONTIER_MOUNTAIN_CORE_SEPARATION: frontierDurable.accessAndRelationshipEvidence.separation.mountainCoreMinimumDistance > 0,
              FRONTIER_EXPANSION_CAPACITY: frontierDurable.primaryNonfinalCandidate.expansionCapacityWorldUnitsSquared > 0
            };
            requireCheck(Object.values(preservationAudit).every(Boolean), 'REGIONAL_PRESERVATION_AUDIT_FAILED', issues);

            const frontierCapacityDisposition = {
              ELEVEN_FUNCTIONAL_CAPACITIES_SUPPORTED: frontierDurable.integratedCapacityModel.capacitySupported,
              ELEVEN_EXACT_CELLS_ASSIGNED: frontierDurable.integratedCapacityModel.elevenFunctionalCellsAssigned,
              EQUAL_SHARE_CAPACITY_ARITHMETIC_IS_PLACEMENT: !frontierDurable.integratedCapacityModel.nominalAreaIsNotPlacement,
              WATER_INFRASTRUCTURE_ASSIGNED: frontierDurable.accessAndRelationshipEvidence.optionalWaterRelation.waterInfrastructureAssigned,
              INTERNAL_SHARED_FLOW_CENTERLINES_ASSIGNED: frontierDurable.sharedFlowAndInfrastructureRelations
                .find((relation) => relation.corridorClass === 'INTERNAL_SHARED_FLOW_RESERVE')
                .exactInfrastructureAssigned
            };
            requireCheck(frontierCapacityDisposition.ELEVEN_FUNCTIONAL_CAPACITIES_SUPPORTED === true, 'FRONTIER_ELEVEN_CAPACITIES_NOT_SUPPORTED', issues);
            requireCheck(frontierCapacityDisposition.ELEVEN_EXACT_CELLS_ASSIGNED === false, 'FRONTIER_EXACT_CELLS_ASSIGNED_WITHOUT_AUTHORITY', issues);
            requireCheck(frontierCapacityDisposition.EQUAL_SHARE_CAPACITY_ARITHMETIC_IS_PLACEMENT === false, 'FRONTIER_CAPACITY_ARITHMETIC_MISCLASSIFIED_AS_PLACEMENT', issues);
            requireCheck(frontierCapacityDisposition.WATER_INFRASTRUCTURE_ASSIGNED === false, 'FRONTIER_WATER_INFRASTRUCTURE_ASSIGNED_WITHOUT_AUTHORITY', issues);
            requireCheck(frontierCapacityDisposition.INTERNAL_SHARED_FLOW_CENTERLINES_ASSIGNED === false, 'FRONTIER_SHARED_FLOW_CENTERLINES_ASSIGNED_WITHOUT_AUTHORITY', issues);

            const allMutationHolds = [
              entryCurrent,
              manorCurrent,
              cavernCurrent,
              frontierCurrent
            ].every((receipt) =>
              receipt.terrainMutation === false
              && receipt.geometryConstruction === false
              && receipt.runtimeMutation === false
              && receipt.gameplayMutation === false
              && receipt.publicRouteMutation === false
              && receipt.productionMutation === false
              && receipt.controllingManifestMutation === false
            );
            requireCheck(allMutationHolds, 'REGIONAL_MUTATION_HOLD_VIOLATION', issues);

            const base = {
              schemaVersion: 'H_EARTH_GRATITUDE_REGION_COORDINATE_RECONCILIATION_CANDIDATE_SET_COMPLETENESS_AND_CLOSURE_AUDIT_RECEIPT_v1',
              operation: 'GRATITUDE_REGION_COORDINATE_RECONCILIATION_CANDIDATE_SET_COMPLETENESS_AND_CLOSURE_AUDIT',
              operationClass: 'READ_ONLY_CONTROL_AND_EVIDENCE_RECONCILIATION',
              numberedGRCRSectionIdentityAssigned: false,
              additionalGeographicProgramTargetAssigned: false,
              authorityQuestion: 'DO_THE_ENTRY_MANOR_CAVERN_AND_FRONTIER_RESULTS_FORM_A_COMPLETE_NONCONTRADICTORY_NONFINAL_REGIONAL_CANDIDATE_SET?',
              controllingRoadmap: {
                artifactId: spatial.artifactIdentity.artifactId,
                path: paths.spatial,
                gitBlob: expectedBlobs.spatial,
                requiredAreaCount: spatial.interactionAreaProgram.requiredAreaCount,
                requiredAreaIds,
                inventoryComplete: sameSet(spatial.interactionAreaProgram.areas.map((area) => area.areaId), requiredAreaIds)
              },
              controllingManifestAuthorization: {
                path: paths.manifest,
                gitBlob: expectedBlobs.manifest,
                targetAreas: manifest.coordinateReconciliationAuthorization.targetAreas,
                resultsClassification: manifest.coordinateReconciliationAuthorization.resultsClassification,
                stoppingBoundary: manifest.coordinateReconciliationAuthorization.stoppingBoundary
              },
              candidateSetTable,
              regionalRelationshipMatrix: relationshipMatrix,
              localSharedDepartureException,
              preservationAudit,
              frontierCapacityDisposition,
              closureDisposition: {
                REGIONAL_REQUIRED_AREA_SET_COMPLETE: spatial.interactionAreaProgram.requiredAreaCount === 4
                  && sameSet(spatial.interactionAreaProgram.areas.map((area) => area.areaId), requiredAreaIds),
                REGIONAL_CANDIDATE_SET_DETERMINISTIC: regressionPairs.every(([current, durableDigest]) =>
                  current.deterministicRepeatExecution === true
                  && current.firstExecutionDigest === durableDigest
                ),
                REGIONAL_RELATIONSHIP_CONFLICT_AUDIT: relationshipMatrix.every((relation) => relation.STATUS === 'PASS') ? 'PASS' : 'FAIL',
                ALL_CANDIDATES_ELIGIBLE: candidateSetTable.every((candidate) => candidate.ELIGIBLE === true),
                ANY_CANDIDATE_ACCEPTED: candidateSetTable.some((candidate) => candidate.ACCEPTED === true),
                FINAL_REGIONAL_PLACEMENT_ACCEPTED: false,
                FINAL_COORDINATES_ASSIGNED: false,
                TERRAIN_MUTATION: false,
                GEOMETRY_CONSTRUCTION: false,
                PRODUCT_CONSTRUCTION: false
              },
              repositoryLifecycleNextLane: [
                'REPOSITORY_REGISTRY_ADMISSION',
                'PR_BASE_AND_DELTA_RECONCILIATION',
                'PR_RETARGETING_DECISION',
                'MERGE_DECISION',
                'CONTROLLING_ARTIFACT_REFERENCE_UPDATE',
                'SEPARATE_FINAL_PLACEMENT_AUTHORITY',
                'LATER_CONSTRUCTION'
              ],
              registryAdmissionState: {
                status: 'OPEN_SEPARATE_LIFECYCLE_LANE',
                existingFailureCodes: ['OPERATION_SCOPE_UNRESOLVED', 'REQUESTED_PATH_UNRESOLVED'],
                pathsRequiringOccurrenceResolution: 16,
                PR_311_RETARGET_TO_MAIN: 'NOT_AUTHORIZED',
                PR_311_MERGE: 'NOT_AUTHORIZED',
                CANONICALIZATION: 'NOT_AUTHORIZED'
              },
              finalPlacementAuthorityRequiredFor: [
                'CANDIDATE_ACCEPTANCE',
                'FINAL_CANDIDATE_CENTERS_OR_ANCHORS',
                'ROUTE_RELATION_ACCEPTANCE',
                'MANOR_FOOTPRINT_CLASS_SELECTION',
                'CAVERN_EXTERIOR_RELATION_ACCEPTANCE',
                'FRONTIER_FUNCTION_DISTRIBUTION'
              ],
              productConstructionAuthorized: false,
              issues
            };
            return { ...base, closureAuditDigest: digest(base) };
          }

          const first = buildClosureAudit();
          const second = buildClosureAudit();
          const firstDigest = digest(first);
          const secondDigest = digest(second);
          const receipt = {
            ...first,
            firstClosureExecutionDigest: firstDigest,
            secondClosureExecutionDigest: secondDigest,
            deterministicClosureExecution: firstDigest === secondDigest,
            status: first.issues.length === 0 && firstDigest === secondDigest
              ? 'REGIONAL_CANDIDATE_SET_COMPLETENESS_AND_CLOSURE_AUDIT_PASS_CLOSED'
              : 'REGIONAL_CANDIDATE_SET_COMPLETENESS_AND_CLOSURE_AUDIT_FAIL_STOPPED'
          };
          if (firstDigest !== secondDigest) receipt.issues.push('REGIONAL_CLOSURE_AUDIT_NONDETERMINISTIC');

          fs.writeFileSync(process.env.H_EARTH_GR_REGIONAL_CLOSURE_RECEIPT, `${JSON.stringify(receipt, null, 2)}\n`);
          console.log(JSON.stringify(receipt, null, 2));
          if (receipt.issues.length > 0 || receipt.deterministicClosureExecution !== true) process.exitCode = 1;
          NODE

      - name: Verify emitted reconciliation and regional closure receipts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receiptPaths = [
            '/tmp/h-earth-gr-cr-receipt.json',
            '/tmp/h-earth-gr-cr-entry-receipt.json',
            '/tmp/h-earth-gr-cr-manor-receipt.json',
            '/tmp/h-earth-gr-cr-cavern-receipt.json',
            '/tmp/h-earth-gr-frontier-plains-receipt.json'
          ];
          for (const receiptPath of receiptPaths) {
            if (!fs.existsSync(receiptPath)) process.exit(1);
            const receipt = JSON.parse(fs.readFileSync(receiptPath, 'utf8'));
            if (receipt.eligible !== true || !String(receipt.status).endsWith('_PASS')) process.exit(1);
            if (receipt.terrainMutation !== false) process.exit(1);
            if (receipt.geometryConstruction !== false) process.exit(1);
            if (receipt.runtimeMutation !== false) process.exit(1);
            if (receipt.gameplayMutation !== false) process.exit(1);
            if (receipt.publicRouteMutation !== false) process.exit(1);
            if (receipt.productionMutation !== false) process.exit(1);
            if (receipt.controllingManifestMutation !== false) process.exit(1);
          }
          const frontier = JSON.parse(fs.readFileSync('/tmp/h-earth-gr-frontier-plains-receipt.json', 'utf8'));
          if (frontier.numberedGRCRSectionIdentityAssigned !== false) process.exit(1);
          if (frontier.microCheckpointInventoryAssigned !== false) process.exit(1);
          if (frontier.frontierPlainsCandidateAccepted !== false) process.exit(1);
          if (frontier.exactCellPlacementAuthorized !== false) process.exit(1);
          if (frontier.exactCellPlacementAssigned !== false) process.exit(1);
          if (frontier.elevenFunctionalCellsAssigned !== false) process.exit(1);
          if (frontier.productConstructionAuthorized !== false) process.exit(1);

          const closure = JSON.parse(fs.readFileSync('/tmp/h-earth-gratitude-region-candidate-set-closure.json', 'utf8'));
          if (closure.status !== 'REGIONAL_CANDIDATE_SET_COMPLETENESS_AND_CLOSURE_AUDIT_PASS_CLOSED') process.exit(1);
          if (closure.numberedGRCRSectionIdentityAssigned !== false) process.exit(1);
          if (closure.additionalGeographicProgramTargetAssigned !== false) process.exit(1);
          if (closure.deterministicClosureExecution !== true) process.exit(1);
          if (closure.closureDisposition.REGIONAL_REQUIRED_AREA_SET_COMPLETE !== true) process.exit(1);
          if (closure.closureDisposition.REGIONAL_CANDIDATE_SET_DETERMINISTIC !== true) process.exit(1);
          if (closure.closureDisposition.REGIONAL_RELATIONSHIP_CONFLICT_AUDIT !== 'PASS') process.exit(1);
          if (closure.closureDisposition.ALL_CANDIDATES_ELIGIBLE !== true) process.exit(1);
          if (closure.closureDisposition.ANY_CANDIDATE_ACCEPTED !== false) process.exit(1);
          if (closure.closureDisposition.FINAL_REGIONAL_PLACEMENT_ACCEPTED !== false) process.exit(1);
          if (closure.closureDisposition.FINAL_COORDINATES_ASSIGNED !== false) process.exit(1);
          if (closure.closureDisposition.TERRAIN_MUTATION !== false) process.exit(1);
          if (closure.closureDisposition.GEOMETRY_CONSTRUCTION !== false) process.exit(1);
          if (closure.closureDisposition.PRODUCT_CONSTRUCTION !== false) process.exit(1);
          if (closure.candidateSetTable.length !== 4) process.exit(1);
          if (closure.regionalRelationshipMatrix.length !== 6) process.exit(1);
          if (closure.frontierCapacityDisposition.ELEVEN_FUNCTIONAL_CAPACITIES_SUPPORTED !== true) process.exit(1);
          if (closure.frontierCapacityDisposition.ELEVEN_EXACT_CELLS_ASSIGNED !== false) process.exit(1);
          if (closure.frontierCapacityDisposition.EQUAL_SHARE_CAPACITY_ARITHMETIC_IS_PLACEMENT !== false) process.exit(1);
          if (closure.frontierCapacityDisposition.WATER_INFRASTRUCTURE_ASSIGNED !== false) process.exit(1);
          if (closure.frontierCapacityDisposition.INTERNAL_SHARED_FLOW_CENTERLINES_ASSIGNED !== false) process.exit(1);
          if (closure.registryAdmissionState.pathsRequiringOccurrenceResolution !== 16) process.exit(1);
          if (closure.registryAdmissionState.PR_311_RETARGET_TO_MAIN !== 'NOT_AUTHORIZED') process.exit(1);
          if (closure.registryAdmissionState.PR_311_MERGE !== 'NOT_AUTHORIZED') process.exit(1);
          if (closure.registryAdmissionState.CANONICALIZATION !== 'NOT_AUTHORIZED') process.exit(1);
          NODE

      - name: Upload bounded reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-gratitude-region-coordinate-reconciliation-evidence
          path: |
            /tmp/h-earth-gr-cr.log
            /tmp/h-earth-gr-cr-receipt.json
            /tmp/h-earth-gr-cr-entry.log
            /tmp/h-earth-gr-cr-entry-receipt.json
            /tmp/h-earth-gr-cr-manor.log
            /tmp/h-earth-gr-cr-manor-receipt.json
            /tmp/h-earth-gr-cr-cavern.log
            /tmp/h-earth-gr-cr-cavern-receipt.json
            /tmp/h-earth-gr-frontier-plains.log
            /tmp/h-earth-gr-frontier-plains-receipt.json
            /tmp/h-earth-gratitude-region-candidate-set-closure.log
            /tmp/h-earth-gratitude-region-candidate-set-closure.json
          if-no-files-found: warn
          retention-days: 30
