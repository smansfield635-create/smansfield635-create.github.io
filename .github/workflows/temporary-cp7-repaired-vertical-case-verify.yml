name: Temporary CP7 Repaired Vertical Case Verify

on:
  push:
    branches:
      - checkpoint/first-safe-vertical-case-selection-v1
    paths:
      - 'control-plane/whole-estate/first-safe-vertical-case-selection-v1/**'
      - '.github/workflows/temporary-cp7-repaired-vertical-case-verify.yml'

permissions:
  actions: read
  contents: read

jobs:
  verify-repaired-cp7:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repaired CP7 candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch immutable PR709 scientific source head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin pull/709/head
          git cat-file -e 54e0f3cf59cffab6a195c9c2ffe4f104185b5e81^{commit}
          echo 'PASS_PR709_SOURCE_HEAD_AVAILABLE'

      - name: Recover exact corrected hurricane artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -LfsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9001275013/zip" \
            -o /tmp/cp7-hurricane-artifact.zip
          echo "637f00dbcd701a90f5348b812f4dcb8a9d41a41effcc8ec548a4726aaa17ba9c  /tmp/cp7-hurricane-artifact.zip" | sha256sum -c -
          echo 'PASS_HURRICANE_ARTIFACT_ZIP_RECOVERED'

      - name: Execute repaired fail-closed CP7 verifier
        env:
          CP7_HURRICANE_ARTIFACT_ZIP: /tmp/cp7-hurricane-artifact.zip
        shell: bash
        run: |
          set -euo pipefail
          node control-plane/whole-estate/first-safe-vertical-case-selection-v1/verify.v1.mjs

      - name: Terminal repaired CP7 gate
        shell: bash
        run: |
          set -euo pipefail
          echo 'PASS_FIRST_SAFE_VERTICAL_CASE_SELECTION_REPAIRED_v1'
