name: Agentic Frontier Paired Execution v1

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read

jobs:
  paired-smoke-af-ir-01:
    if: >-
      github.event.issue.number == 2089 &&
      contains(github.event.comment.body, 'AGENTIC_FRONTIER_PAIRED_SMOKE_AF_IR_01_V1')
    runs-on: ubuntu-latest
    env:
      OLLAMA_MODEL: qwen2.5-coder:1.5b
      OLLAMA_HOST_URL: http://127.0.0.1:11434
    steps:
      - name: Checkout paired runner from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned OpenHands CLI 1.14.0
        run: |
          python -m pip install --disable-pip-version-check 'openhands==1.14.0'
          openhands --version

      - name: Start common local model runtime
        run: |
          set -euo pipefail
          docker pull ollama/ollama:0.32.14
          docker run -d --name agentic-frontier-ollama -e OLLAMA_CONTEXT_LENGTH=32768 -p 11434:11434 ollama/ollama:0.32.14
          for i in $(seq 1 60); do
            curl -fsS "$OLLAMA_HOST_URL/api/tags" >/dev/null && break
            sleep 2
          done
          docker exec agentic-frontier-ollama ollama pull "$OLLAMA_MODEL"

      - name: Execute frozen AF-IR-01 pair
        id: pair
        run: |
          set +e
          python tools/research/agentic-frontier/paired-smoke-ir01-v1.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload paired evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentic-frontier-paired-smoke-af-ir-01-v1
          path: agentic-frontier-ir01-paired-receipt.json
          if-no-files-found: error

      - name: Enforce paired smoke
        run: |
          test "${{ steps.pair.outputs.exit_code }}" = "0"
