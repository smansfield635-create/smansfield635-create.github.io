name: Universal Coherence Invariant Proof v1

on:
  pull_request:
    paths:
      - 'research/route-operator-platform-v1/registered-challenges/independent-constitutive-route-identification-challenge-v1/universal-coherence-invariant-proof-v1/**'
      - '.github/workflows/universal-coherence-invariant-proof-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify invariant proof package
        run: >-
          python
          research/route-operator-platform-v1/registered-challenges/independent-constitutive-route-identification-challenge-v1/universal-coherence-invariant-proof-v1/verify-universal-coherence-invariant-proof-v1.py
