name: H-Earth T4.1 Additive Ownership Qualification
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: T4.1 ownership invariant
        shell: bash
        run: |
          set -euo pipefail
          BASE="preview/h-earth/corridor/38df744ba7402aabe7fd2eaee71b961a451350de/B/showroom/globe/h-earth"
          BIND="$BASE/diagnostic/run8e-r3d/live-gpu-binding.js"
          CP2="$BASE/render/persistent-live-renderer.run8e-r3c.cp2-round1-1f520809.js"
          P5="$BASE/render/persistent-live-renderer.run8e-r3c.phase5-microrelief-v1.js"
          DRAW="$BASE/render/t4-post-terrain-draw-v1.js"
          BATCH="$BASE/render/t4-static-gpu-batches-v1.js"
          CONTRACT="$BASE/render/t4-additive-extension-contract-v1.js"
          DATA="$BASE/render/t4-frozen-placement-v1.js"

          # T4 MAY ADD DRAWS.
          grep -q "gl.drawArraysInstanced" "$BATCH"
          grep -q "drawCalls>2" "$BATCH"
          grep -q "drawAfterTerrain" "$DRAW"
          grep -q '"total":647' "$DATA"
          grep -q '"TUFT":617' "$DATA"
          grep -q '"ROCK":30' "$DATA"

          # T4 MAY NOT OWN PRESENTATION OR RENDERER LIFECYCLE.
          for file in "$DRAW" "$BATCH" "$CONTRACT" "$DATA"; do
            ! grep -q "bindFramebuffer" "$file"
            ! grep -q "createFramebuffer" "$file"
            ! grep -q "presentColorFrame" "$file"
            ! grep -q "createHEarthRun8ER3CPersistentRendererT4" "$file"
            ! grep -q "OW01" "$file"
            ! grep -q "live-render-package.run8e-r2" "$file"
          done
          ! grep -Eq "(^|[^A-Za-z])initialize[[:space:]]*[:=(]" "$DRAW"
          ! grep -Eq "(^|[^A-Za-z])renderFrame[[:space:]]*[:=(]" "$DRAW"

          # Phase 5 remains lifecycle/presentation authority.
          grep -q "acceptedRenderer.initialize(packet)" "$P5"
          grep -q "acceptedRenderer.renderFrame(packet)" "$P5"
          grep -q "presentColorFrame: acceptedRenderer.presentColorFrame" "$P5"
          grep -q "gl.bindFramebuffer(gl.FRAMEBUFFER, resources.geometryFramebuffer)" "$CP2"
          grep -q "function presentColorFrame()" "$CP2"

          # T4 enters only through the bounded post-terrain seam.
          grep -q "postTerrainDraw(Object.freeze({ gl, packet, width, height }))" "$CP2"
          grep -q "createAcceptedCp2Renderer({ ...options, postTerrainDraw })" "$P5"
          grep -q "t4Requested ? createHEarthT4PostTerrainDraw" "$BIND"
          grep -q "postTerrainDraw: t4Extension?.drawAfterTerrain" "$BIND"
          ! grep -q "T4_RENDERER_PATH" "$BIND"

      - name: T4.1 module syntax
        run: |
          node --check "preview/h-earth/corridor/38df744ba7402aabe7fd2eaee71b961a451350de/B/showroom/globe/h-earth/render/t4-static-gpu-batches-v1.js"
          node --check "preview/h-earth/corridor/38df744ba7402aabe7fd2eaee71b961a451350de/B/showroom/globe/h-earth/render/t4-post-terrain-draw-v1.js"
          node --check "preview/h-earth/corridor/38df744ba7402aabe7fd2eaee71b961a451350de/B/showroom/globe/h-earth/render/t4-additive-extension-contract-v1.js"
          node --check "preview/h-earth/corridor/38df744ba7402aabe7fd2eaee71b961a451350de/B/showroom/globe/h-earth/render/t4-frozen-placement-v1.js"
