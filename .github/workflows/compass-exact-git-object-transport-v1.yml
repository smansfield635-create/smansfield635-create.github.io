name: Compass Exact Git Object Transport v1

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/compass-exact-git-object-transport-v1.yml"

permissions:
  contents: read

jobs:
  package-exact-git-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUBLIC_REPOSITORY: smansfield635-create/smansfield635-create.github.io
      CANDIDATE_SHA: 0251792801761778b1492b2b97f60b4ebc6dbbb9
      BASE_SHA: d63c1b3e60bdd2af9d8b868247559a5222c26d31
      PLAYWRIGHT_VERSION: 1.55.0
    steps:
      - name: Prepare empty transport workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.[!.]* "$GITHUB_WORKSPACE"/..?* 2>/dev/null || true
          mkdir -p "$GITHUB_WORKSPACE/transport"

      - name: Materialize exact public Git objects
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/exact-public"
          git init -q "$RUNNER_TEMP/exact-public"
          git -C "$RUNNER_TEMP/exact-public" remote add origin "https://github.com/${PUBLIC_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/exact-public" fetch --no-tags origin "$CANDIDATE_SHA" "$BASE_SHA"
          git -C "$RUNNER_TEMP/exact-public" update-ref refs/transport/candidate "$CANDIDATE_SHA"
          git -C "$RUNNER_TEMP/exact-public" update-ref refs/transport/base "$BASE_SHA"

      - name: Verify exact candidate lineage and object presence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$RUNNER_TEMP/exact-public" rev-parse refs/transport/candidate^{commit})" = "$CANDIDATE_SHA"
          test "$(git -C "$RUNNER_TEMP/exact-public" rev-parse refs/transport/base^{commit})" = "$BASE_SHA"
          git -C "$RUNNER_TEMP/exact-public" cat-file -p "$CANDIDATE_SHA" | grep -Fx "parent $BASE_SHA"

      - name: Create Git-native bundle
        shell: bash
        run: |
          set -euo pipefail
          git -C "$RUNNER_TEMP/exact-public" bundle create "$GITHUB_WORKSPACE/transport/compass-02517928.bundle" refs/transport/candidate refs/transport/base
          git -C "$RUNNER_TEMP/exact-public" bundle verify "$GITHUB_WORKSPACE/transport/compass-02517928.bundle"

      - name: Prove bundle reconstructs the exact Git subject
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/reconstructed"
          git init -q "$RUNNER_TEMP/reconstructed"
          git -C "$RUNNER_TEMP/reconstructed" fetch --no-tags "$GITHUB_WORKSPACE/transport/compass-02517928.bundle" refs/transport/candidate:refs/transport/candidate refs/transport/base:refs/transport/base
          test "$(git -C "$RUNNER_TEMP/reconstructed" rev-parse refs/transport/candidate^{commit})" = "$CANDIDATE_SHA"
          test "$(git -C "$RUNNER_TEMP/reconstructed" rev-parse refs/transport/base^{commit})" = "$BASE_SHA"
          git -C "$RUNNER_TEMP/reconstructed" cat-file -p refs/transport/candidate | grep -Fx "parent $BASE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Package pinned Playwright execution runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transport/playwright-runtime transport/playwright-browsers
          npm install --prefix transport/playwright-runtime --no-save "playwright@${PLAYWRIGHT_VERSION}"
          PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/transport/playwright-browsers" node transport/playwright-runtime/node_modules/playwright/cli.js install chromium
          test "$(node -p "require('./transport/playwright-runtime/node_modules/playwright/package.json').version")" = "$PLAYWRIGHT_VERSION"
          test -n "$(find transport/playwright-browsers -type f \( -name chrome -o -name headless_shell \) | head -1)"

      - name: Package explicit SwiftShader WebGL launch profile
        shell: bash
        run: |
          set -euo pipefail
          cat > transport/launch-chromium-webgl.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          transport_root="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          browser="$(find "$transport_root/playwright-browsers" -type f \( -name chrome -o -name headless_shell \) -perm -111 | head -1)"
          if [ -z "$browser" ]; then
            echo "TRANSPORTED_CHROMIUM_EXECUTABLE_NOT_FOUND" >&2
            exit 1
          fi
          filtered=()
          for arg in "$@"; do
            case "$arg" in
              --use-gl=*|--use-angle=*|--enable-unsafe-swiftshader|--disable-webgl|--disable-gpu)
                ;;
              *) filtered+=("$arg") ;;
            esac
          done
          exec "$browser" "${filtered[@]}" \
            --use-gl=angle \
            --use-angle=swiftshader \
            --enable-unsafe-swiftshader \
            --enable-webgl \
            --ignore-gpu-blocklist
          EOF
          chmod +x transport/launch-chromium-webgl.sh

      - name: Verify transported Chromium exposes WebGL through SwiftShader
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { chromium } from "./transport/playwright-runtime/node_modules/playwright/index.mjs";
          const browser = await chromium.launch({
            executablePath: "./transport/launch-chromium-webgl.sh",
            headless: true,
            args: ["--no-sandbox", "--disable-dev-shm-usage"]
          });
          const page = await browser.newPage();
          const capability = await page.evaluate(() => {
            const canvas = document.createElement("canvas");
            const webgl = canvas.getContext("webgl");
            const webgl2 = canvas.getContext("webgl2");
            const context = webgl || webgl2;
            return {webgl:Boolean(webgl),webgl2:Boolean(webgl2),renderer:context?String(context.getParameter(context.RENDERER)||""):""};
          });
          await browser.close();
          const receipt={schema:"COMPASS_TRANSPORT_WEBGL_CAPABILITY_v1",result:capability.webgl?"PASS_CLOSED":"FAIL_CLOSED",...capability};
          fs.writeFileSync("transport/webgl-capability.json",JSON.stringify(receipt,null,2));
          console.log(JSON.stringify(receipt,null,2));
          if(!capability.webgl) process.exitCode=1;
          NODE

      - name: Package exact external runtime dependencies for connected reproduction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transport/external-runtime/ccf-ontology transport/external-runtime/wikimedia
          curl --fail --location --retry 3 \
            'https://ccf-ontology.hubmapconsortium.org/objects/v1.2/Allen_M_Brain.glb' \
            -o transport/external-runtime/ccf-ontology/Allen_M_Brain.glb
          curl --fail --location --retry 3 \
            'https://upload.wikimedia.org/wikipedia/commons/c/c2/Saint-Saens_-_The_Carnival_of_the_Animals_-_07_Aquarium.ogg' \
            -o transport/external-runtime/wikimedia/Aquarium.ogg
          sha256sum \
            transport/external-runtime/ccf-ontology/Allen_M_Brain.glb \
            transport/external-runtime/wikimedia/Aquarium.ogg \
            > transport/external-runtime/sha256.txt

      - name: Verify exact composed Compass root under transported browser host
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/compass-runtime-root"
          mkdir -p "$RUNNER_TEMP/compass-runtime-root"
          git -C "$RUNNER_TEMP/exact-public" archive "$CANDIDATE_SHA" \
            index.html assets/compass compass-composite laws \
            showroom/globe/h-earth/render showroom/globe/h-earth/awards/media \
            | tar -x -C "$RUNNER_TEMP/compass-runtime-root"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/compass-runtime-root" \
            > "$RUNNER_TEMP/compass-runtime-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .25; done
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {chromium} from "./transport/playwright-runtime/node_modules/playwright/index.mjs";
          const browser=await chromium.launch({executablePath:"./transport/launch-chromium-webgl.sh",headless:true,args:["--no-sandbox","--disable-dev-shm-usage"]});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const consoleErrors=[]; const pageErrors=[]; const failures=[];
          page.on("console",m=>{if(m.type()==="error")consoleErrors.push(m.text())});
          page.on("pageerror",e=>pageErrors.push(String(e?.message||e)));
          page.on("requestfailed",r=>failures.push({url:r.url(),error:r.failure()?.errorText||""}));
          const response=await page.goto("http://127.0.0.1:4173/",{waitUntil:"networkidle",timeout:60000});
          await page.waitForTimeout(2500);
          const state=await page.evaluate(()=>({
            webgl:!!document.createElement("canvas").getContext("webgl"),
            webgl2:!!document.createElement("canvas").getContext("webgl2"),
            canvasCount:document.querySelectorAll("canvas").length,
            spacecraftSource:document.querySelector('[data-compass-root]')?.dataset?.compassSpacecraftSource||"",
            spacecraftFailure:document.querySelector('[data-compass-root]')?.dataset?.compassSpacecraftFailure||"",
            spacecraftApi:Boolean(globalThis.DGB_LAWS_SPACECRAFT)
          }));
          const receipt={schema:"COMPASS_COMPOSED_ROOT_HOST_PROBE_v1",result:response?.ok()&&state.webgl&&consoleErrors.length===0&&pageErrors.length===0?"PASS_CLOSED":"FAIL_CLOSED",httpStatus:response?.status()??null,state,consoleErrors,pageErrors,requestFailures:failures};
          fs.writeFileSync("transport/composed-root-host-probe.json",JSON.stringify(receipt,null,2));
          console.log(JSON.stringify(receipt,null,2));
          await browser.close();
          if(receipt.result!=="PASS_CLOSED") process.exitCode=1;
          NODE

      - name: Emit transport-only provenance receipt
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_SHA256="$(sha256sum transport/compass-02517928.bundle | awk '{print $1}')"
          cat > transport/receipt.json <<JSON
          {
            "schema": "EXACT_PUBLIC_GIT_OBJECT_TRANSPORT_RECEIPT_v1",
            "result": "PASS_CLOSED",
            "repository": "$PUBLIC_REPOSITORY",
            "candidateSha": "$CANDIDATE_SHA",
            "baseSha": "$BASE_SHA",
            "format": "GIT_BUNDLE",
            "bundleSha256": "$BUNDLE_SHA256",
            "bundleVerified": true,
            "reconstructionVerified": true,
            "playwrightVersion": "$PLAYWRIGHT_VERSION",
            "playwrightRuntimeTransported": true,
            "browserLaunchProfile": "SWIFTSHADER_WEBGL_EXPLICIT_OPT_IN_v1",
            "browserLaunchProfileTransported": true,
            "webglCapabilityReceipt": "webgl-capability.json",
            "composedRootHostProbeReceipt": "composed-root-host-probe.json",
            "externalRuntimeDependenciesTransported": true,
            "browserLaunchFlags": ["--use-gl=angle","--use-angle=swiftshader","--enable-unsafe-swiftshader","--enable-webgl","--ignore-gpu-blocklist"],
            "qualificationAuthorityCreated": false,
            "productMutationAuthorityCreated": false,
            "mergeAuthorityCreated": false,
            "deploymentAuthorityCreated": false,
            "ownerAcceptanceCreated": false,
            "userApprovalCreated": false
          }
          JSON

      - name: Upload exact Git object transport artifact
        uses: actions/upload-artifact@v4
        with:
          name: compass-exact-git-object-transport-02517928
          path: transport/
          if-no-files-found: error
          retention-days: 30
