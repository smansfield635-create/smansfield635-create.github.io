name: Compass Gen1538 Room Selected Continuity

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/compass/compass.crystals.js'
      - '.github/workflows/compass-display-continuity-validation.yml'

permissions:
  contents: write

env:
  COMPASS_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  materialize-pointer-lifecycle-repair:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize bounded accepted-pointer lifecycle repair and restore read-only verifier
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/compass/compass.crystals.js')
          s=p.read_text()
          old='''    try {\n      event.currentTarget\n        .setPointerCapture(\n          event.pointerId\n        );\n    } catch (_) {}\n'''
          new='''    /*\n     * Once Compass has lawfully accepted this pointer territory, suppress\n     * browser-native link/image dragging before capture. This is required\n     * when a rendered room star geometrically overlaps a dormant Mirrorland\n     * anchor: the crystal owner may own the gesture even though the physical\n     * DOM target is an <a>. Without pointerdown default suppression Chromium\n     * can begin native HTML drag-and-drop and cancel the PointerEvent stream.\n     */\n    event.preventDefault();\n\n    try {\n      event.currentTarget\n        .setPointerCapture(\n          event.pointerId\n        );\n    } catch (_) {}\n'''
          if old not in s:
              raise SystemExit('expected pointer-capture block not found exactly')
          if 'browser-native link/image dragging before capture' in s:
              raise SystemExit('pointer lifecycle repair already materialized unexpectedly')
          p.write_text(s.replace(old,new,1))
          PY
          node --check assets/compass/compass.crystals.js
          git show HEAD^:.github/workflows/compass-display-continuity-validation.yml > .github/workflows/compass-display-continuity-validation.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/compass/compass.crystals.js .github/workflows/compass-display-continuity-validation.yml
          git diff --cached --quiet && { echo 'no materialization delta'; exit 1; }
          git commit -m 'compass: preserve accepted pointer stream across overlays'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
