name: Education Question Render Qualification v1
on:
  workflow_dispatch:
    inputs:
      candidate_sha: {required: true, type: string}
      base_sha: {required: true, type: string}
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Qualify adaptive question renderer
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=10 origin "$CANDIDATE_SHA" "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = products/education/index.html
          git show "$CANDIDATE_SHA:products/education/index.html" >/tmp/e.html
          grep -Fq 'const escapeEducationHTML=' /tmp/e.html
          awk '/function renderQuestion\(\)/,/function submitAdaptiveAnswer\(\)/' /tmp/e.html >/tmp/render.txt
          grep -Fq 'escapeEducationHTML(gateT.stage)' /tmp/render.txt
          grep -Fq 'escapeEducationHTML(item.evidenceClass.replaceAll("_"," "))' /tmp/render.txt
          grep -Fq 'escapeEducationHTML(gateT.hintBody)' /tmp/render.txt
          ! grep -Fq 'esc(' /tmp/render.txt
          grep -Fq 'id="question-host"' /tmp/e.html
          grep -Fq 'item.o.map((x,i)=>' /tmp/render.txt
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('/tmp/e.html','utf8');
          for(const src of [...s.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]))new Function(src);
          console.log('JS_PARSE=PASS');
          NODE
          echo EDUCATION_QUESTION_RENDER_QUALIFICATION=PASS
