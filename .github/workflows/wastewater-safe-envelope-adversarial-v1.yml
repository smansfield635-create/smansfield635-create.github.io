name: Wastewater safe-envelope adversarial v1
on:
  pull_request:
    paths:
      - 'research/imi/WASTEWATER_SAFE_ENVELOPE_ADVERSARIAL_PROTOCOL_v1.md'
      - 'research/imi/wastewater_safe_envelope_adversarial_v1.py'
      - '.github/workflows/wastewater-safe-envelope-adversarial-v1.yml'
  workflow_dispatch:
jobs:
  severe-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            research/imi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: pip install numpy pandas scikit-learn lightgbm requests
      - name: Execute frozen wastewater severe test
        run: python research/imi/wastewater_safe_envelope_adversarial_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wastewater-safe-envelope-adversarial-v1
          path: |
            wastewater_safe_envelope_findings_v1.json
            wastewater_safe_envelope_temporal_predictions_v1.csv
            wastewater_safe_envelope_snapshot_sample_v1.csv
            WASTEWATER_SAFE_ENVELOPE_VERDICT_v1.txt
