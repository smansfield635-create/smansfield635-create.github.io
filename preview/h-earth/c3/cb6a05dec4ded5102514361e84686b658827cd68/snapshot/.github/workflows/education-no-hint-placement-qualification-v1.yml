name: Education No-Hint Placement Qualification v1
on:
  workflow_dispatch:
    inputs:
      candidate_sha: {required: true, type: string}
      base_sha: {required: true, type: string}
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Qualify no-hint placement runtime
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=10 origin "$CANDIDATE_SHA" "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = products/education/index.html
          git show "$CANDIDATE_SHA:products/education/index.html" >/tmp/e.html
          ! grep -Fq 'id="placement-hint"' /tmp/e.html
          ! grep -Fq 'id="placement-hint-body"' /tmp/e.html
          ! grep -Fq 'hintsUsed' /tmp/e.html
          ! grep -Fq 'currentItemAssisted' /tmp/e.html
          ! grep -Fq 'ASSISTED_HINT_USED' /tmp/e.html
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('/tmp/e.html','utf8');
          for(const src of [...s.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]))new Function(src);
          const a=s.indexOf('const BANK='),b=s.indexOf('const EDUCATION_STATE_KEY=',a),BANK=Function(s.slice(a,b)+';return BANK')();
          const flat=Object.values(BANK).flat();if(flat.length!==64)throw Error('bank cardinality');
          for(let d=1;d<=8;d++)if(BANK[d]?.length!==8)throw Error('D'+d);
          console.log('EDUCATION_NO_HINT_PLACEMENT_QUALIFICATION=PASS');
          NODE
