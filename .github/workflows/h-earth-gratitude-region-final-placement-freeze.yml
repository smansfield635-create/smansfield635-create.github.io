name: H-Earth Gratitude Region FP-05 regional composite closure
on:
  pull_request:
    branches: [agent/h-earth-gratitude-region-fp05-execution-001]
permissions:
  contents: read
jobs:
  execute-fp05:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Execute exact bounded FP-05 candidate
        shell: bash
        env:
          FP05_EXECUTION_COMMIT: ${{ github.event.pull_request.base.sha }}
          FP05_WORKFLOW_TRIGGER_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/h-earth-fp05 "$FP05_EXECUTION_COMMIT"
          cd /tmp/h-earth-fp05
          mkdir -p fp05-evidence
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {executeGratitudeRegionFinalPlacementBaseline as baselineRun} from './h-earth-3d/validation/h-earth.gratitude-region.final-spatial-placement-disposition.mjs';
          import {loadHEarthRepositoryRegistryValidatorDependencies as registryLoad} from './h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js';

          const BASE='554a693c82876d9533bd577475a818a570d03b0d';
          const WF='.github/workflows/h-earth-gratitude-region-final-placement-freeze.yml';
