th===0,errors);await page.screenshot({path:`/tmp/compass-performance-${name}.png`,fullPage:true});await context.close();
            }
            const context=await browser.newContext({viewport:{width:1280,height:900}}),{page,errors}=await load(context,'interaction'),stage=page.locator('[data-capability-orbit]');await stage.scrollIntoViewIfNeeded();await stage.focus();await stage.press('ArrowRight');await page.waitForTimeout(380);check('KEYBOARD_DIAGNOSTIC_TO_AWARDS',await active(page).getAttribute('data-capability')==='awards',await state(page));const awards=active(page),awardsState=await awards.evaluate(node=>({facets:node.querySelectorAll('.compass-awards-facets li').length,visual:node.querySelectorAll('.compass-award-diamond i').length,href:node.querySelector('a')?.getAttribute('href'),text:node.textContent.replace(/\s+/g,' ').trim()}));check('AWARDS_EXACT',awardsState.facets===5&&awardsState.visual===5&&awardsState.href==='/showroom/globe/h-earth/awards/'&&awardsState.text.includes('Interactive worlds. Original characters. Browser-native 3D. A growing software platform. Governed construction that keeps the whole estate coherent as it evolves.')&&awardsState.text.includes('Built in 2026 · Entering the 2027 award season'),awardsState);await page.waitForTimeout(1300);check('AWARDS_FINITE',(await awards.evaluate(node=>node.getAnimations({subtree:true}).filter(animation=>animation.playState==='running').length))===0,true);
            const frames1=await page.evaluate(()=>CompassBrainScene.inspect().frames);await page.waitForTimeout(400);const frames2=await page.evaluate(()=>CompassBrainScene.inspect().frames);check('BRAIN_FOREGROUND_SUSPENSION',frames1===frames2,{frames1,frames2});await stage.locator(':scope > .compass-orbit-controls [data-orbit-next]').click();await page.waitForTimeout(380);check('BUTTON_AWARDS_TO_HOUSE',await active(page).getAttribute('data-capability')==='house',await state(page));await stage.press('ArrowRight');await page.waitForTimeout(380);check('THREE_CARD_CYCLE',await active(page).getAttribute('data-capability')==='diagnostic',await state(page));await stage.press('ArrowLeft');await page.waitForTimeout(380);check('REVERSE_DIAGNOSTIC_TO_HOUSE',await active(page).getAttribute('data-capability')==='house',await state(page));
            await page.locator('[data-enter-house]').click();const house=await page.evaluate(()=>({mode:document.querySelector('[data-capability-orbit]').dataset.capabilityMode,routes:Object.fromEntries([...document.querySelectorAll('[data-house-function]')].map(link=>[link.dataset.houseFunction,link.getAttribute('href')])),front:document.querySelector('.house-orbit-member[data-slot="front"]')?.dataset.member}));check('HOUSE_NESTED_CANONICAL',house.mode==='house-members'&&house.front==='jeeves'&&JSON.stringify(house.routes)===JSON.stringify({jeeves:'/showroom/globe/hearth/jeeves/',elara:'/elara/',auren:'/products/auren/'}),house);await page.locator('.house-orbit-member[data-slot="front"] [data-return-house]').click();check('HOUSE_RETURN_EXACT',(await active(page).getAttribute('data-capability'))==='house'&&(await stage.getAttribute('data-capability-mode'))==='orbit',await state(page));
            await stage.press('ArrowRight');await page.waitForTimeout(380);const canvas=page.locator('[data-human-brain] canvas'),brainBefore=await active(page).getAttribute('data-capability');const box=await canvas.boundingBox();await page.mouse.move(box.x+box.width*.3,box.y+box.height*.5);await page.mouse.down();await page.mouse.move(box.x+box.width*.7,box.y+box.height*.5,{steps:4});await page.mouse.up();check('BRAIN_GESTURE_ISOLATED',await active(page).getAttribute('data-capability')===brainBefore,await state(page));
            const morphology=await page.evaluate(()=>{const named=['front','side','rear','underside'].map(view=>CompassBrainScene.capture(view));const yaw=[];for(let angle=0;angle<360;angle+=22.5)yaw.push(CompassBrainScene.capture(angle));const mesh=CompassBrainScene.inspect();CompassBrainScene.restore();return{named,yaw,mesh}});const widths=morphology.yaw.map(value=>value.silhouetteWidth),rotationRatio=Math.min(...widths)/Math.max(...widths),sideRatio=morphology.named[1].silhouetteWidth/morphology.named[0].silhouetteWidth;check('BRAIN_DEPTH_ROTATION',rotationRatio>=.72&&sideRatio>=.80&&sideRatio<=1.45&&morphology.mesh.occupancy>=.12,{rotationRatio,sideRatio,widths,mesh:morphology.mesh});check('BRAIN_NAMED_HASHES',new Set(morphology.named.map(value=>value.hash)).size===4,morphology.named.map(value=>({view:value.view,hash:value.hash})));check('BRAIN_NO_CROP',morphology.yaw.every(value=>value.insets&&Math.min(...Object.values(value.insets))>=Math.min(value.width,value.height)*.02),morphology.yaw.map(value=>value.insets));for(const view of ['front','side','rear','underside']){await page.evaluate(view=>CompassBrainScene.capture(view),view);await canvas.screenshot({path:`/tmp/compass-brain-${view}.png`})}await page.evaluate(()=>CompassBrainScene.restore());
            const proof=page.locator('[data-proof-orbit]'),capabilityBefore=await active(page).getAttribute('data-capability'),held=await pointerSwipe(page,'[data-proof-orbit]',1);check('PROOF_NO_INTERMEDIATE_GEOMETRY',JSON.stringify(held.before)===JSON.stringify(held.held),held);await page.waitForTimeout(340);check('PROOF_SWIPE_ONE_AND_ISOLATED',(await page.locator('[data-proof-card][data-slot="front"]').getAttribute('data-proof-card'))==='bounded'&&(await active(page).getAttribute('data-capability'))===capabilityBefore,await state(page));await proof.locator(':scope > .compass-orbit-controls [data-orbit-next]').click();await page.waitForTimeout(340);check('PROOF_BUTTON_ONE',(await page.locator('[data-proof-card][data-slot="front"]').getAttribute('data-proof-card'))==='experience',await state(page));await proof.focus();await proof.press('ArrowRight');await page.waitForTimeout(340);check('PROOF_KEYBOARD_CYCLE',(await page.locator('[data-proof-card][data-slot="front"]').getAttribute('data-proof-card'))==='trl7',await state(page));
