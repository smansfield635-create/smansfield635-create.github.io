name: H-Earth OW01 Anchor Qualification v1

on:
  push:
    branches:
      - control-plane-delivery/h-earth-ow01-public-product-20260814-014

permissions:
  contents: write

jobs:
  qualify:
    if: ${{ !contains(github.event.head_commit.message, '[anchor evidence]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_HEAD: ba67174c834322599b94be9237fae5f9ac4a3a09
      PRODUCT_BLOB: b3d5634b5bd30e9a3d7e4a20800188606e96220e
      BASE_HEAD: aefb54971ae0f91a9abf9e8fc8e588f82f3a5744
      ANCHOR_SHA256: 7757fb4fe731456b3058ec595369133f5c2136c99b282eb6b4df108600bca573
      ROUTE: /showroom/globe/h-earth/
      EVIDENCE_STEM: h-earth-3d/experience-anchor/evidence/OW01_GRATITUDE_COASTAL_ENTRY_20260815_001
      RECEIPT_PATH: h-earth-3d/experience-anchor/receipts/OW01_GRATITUDE_COASTAL_ENTRY_20260815_001.json
    steps:
      - name: Checkout exact qualification candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify product bytes remain frozen
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object h-earth-3d/terrain/h-earth.terrain-field.js)" = "$PRODUCT_BLOB"
          test "$(git diff --name-only "$PRODUCT_HEAD"...HEAD | sort)" = ".github/workflows/h-earth-ow01-anchor-qualification-v1.yml"
          git cat-file -e "$BASE_HEAD^{commit}"
          git cat-file -e "$PRODUCT_HEAD^{commit}"

      - name: Materialize exact baseline worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/h-earth-ow01-base "$BASE_HEAD"

      - name: Install bounded browser harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/h-earth-ow01-browser
          npm --prefix /tmp/h-earth-ow01-browser init -y >/dev/null
          npm --prefix /tmp/h-earth-ow01-browser install playwright@1.55.0 >/dev/null
          /tmp/h-earth-ow01-browser/node_modules/.bin/playwright install --with-deps chromium >/dev/null

      - name: Serve base and candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" >/tmp/ow01-candidate-server.log 2>&1 &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/h-earth-ow01-base >/tmp/ow01-base-server.log 2>&1 &
          for port in 4173 4174; do
            for attempt in $(seq 1 60); do
              if curl -fsS "http://127.0.0.1:$port$ROUTE" >/dev/null; then break; fi
              sleep 1
            done
            curl -fsS "http://127.0.0.1:$port$ROUTE" >/dev/null
          done

      - name: Capture exact base candidate and anchor
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/h-earth-ow01-browser/qualify.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import path from 'node:path';

          const workspace=process.env.GITHUB_WORKSPACE;
          const stem=path.join(workspace,process.env.EVIDENCE_STEM);
          fs.mkdirSync(path.dirname(stem),{recursive:true});
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});

          async function capture(label,port){
            const context=await browser.newContext({viewport:{width:1440,height:900},hasTouch:true,isMobile:false});
            const page=await context.newPage();
            const pageErrors=[]; const consoleErrors=[]; const requestFailures=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error'&&!/favicon/i.test(m.text())) consoleErrors.push(m.text())});
            page.on('requestfailed',r=>requestFailures.push(`${r.url()} :: ${r.failure()?.errorText??'unknown'}`));
            const response=await page.goto(`http://127.0.0.1:${port}${process.env.ROUTE}`,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(5000);
            const canvasCount=await page.locator('canvas').count();
            const beforeGesture=await page.evaluate(()=>document.documentElement.getAttribute('data-gesture-used')||document.body.getAttribute('data-gesture-used')||document.querySelector('[data-gesture-used]')?.getAttribute('data-gesture-used')||null);
            let interactionTarget=null;
            if(canvasCount>0){
              const canvases=page.locator('canvas'); let best={area:0,index:0,box:null};
              for(let i=0;i<canvasCount;i++){const b=await canvases.nth(i).boundingBox(); const area=b?b.width*b.height:0; if(area>best.area) best={area,index:i,box:b};}
              if(best.box&&best.area>0){
                interactionTarget=best;
                const x=best.box.x+best.box.width*0.52, y=best.box.y+best.box.height*0.52;
                await page.mouse.move(x,y); await page.mouse.down(); await page.mouse.move(x+90,y-25,{steps:8}); await page.mouse.up();
                await page.mouse.wheel(0,-320); await page.waitForTimeout(900);
              }
            }
            const afterGesture=await page.evaluate(()=>document.documentElement.getAttribute('data-gesture-used')||document.body.getAttribute('data-gesture-used')||document.querySelector('[data-gesture-used]')?.getAttribute('data-gesture-used')||null);
            const screenshot=`${stem}.${label}.png`;
            await page.screenshot({path:screenshot,fullPage:true});
            const bytes=fs.readFileSync(screenshot);
            const result={label,status:response?.status()??null,title:await page.title(),url:page.url(),canvasCount,interactionTarget,beforeGesture,afterGesture,pageErrors,consoleErrors,requestFailures,screenshotSha256:crypto.createHash('sha256').update(bytes).digest('hex'),screenshotBytes:bytes.length};
            await context.close(); return result;
          }

          const base=await capture('base',4174);
          const candidate=await capture('candidate',4173);
          const context=await browser.newContext({viewport:{width:1440,height:900}});
          const anchorPage=await context.newPage();
          const anchorResponse=await anchorPage.goto('http://127.0.0.1:4173/h-earth-3d/experience-anchor/H_EARTH_EXPERIENCE_ANCHOR_v1.contact-sheet.svg',{waitUntil:'load',timeout:60000});
          const anchorPath=`${stem}.anchor.png`; await anchorPage.screenshot({path:anchorPath,fullPage:true});
          const anchorBytes=fs.readFileSync(anchorPath);
          const anchor={status:anchorResponse?.status()??null,screenshotSha256:crypto.createHash('sha256').update(anchorBytes).digest('hex'),screenshotBytes:anchorBytes.length};
          await context.close(); await browser.close();

          const terrainPath=path.join(workspace,'h-earth-3d/terrain/h-earth.terrain-field.js');
          const terrainSha256=crypto.createHash('sha256').update(fs.readFileSync(terrainPath)).digest('hex');
          const evidence={schema:'H_EARTH_OW01_ANCHOR_BROWSER_EVIDENCE_v1',evidenceId:'OW01_GRATITUDE_COASTAL_ENTRY_20260815_001',productHead:process.env.PRODUCT_HEAD,qualificationHead:process.env.GITHUB_SHA,baseHead:process.env.BASE_HEAD,anchorId:'H_EARTH_GROUND_EXPERIENCE_VIDEO_20260814_001',anchorSha256:process.env.ANCHOR_SHA256,route:process.env.ROUTE,terrainFieldSha256:terrainSha256,base,candidate,anchor,automatedFindings:{baseRouteLoaded:base.status===200,candidateRouteLoaded:candidate.status===200,baseCanvasPresent:base.canvasCount>0,candidateCanvasPresent:candidate.canvasCount>0,baseNoPageErrors:base.pageErrors.length===0,candidateNoPageErrors:candidate.pageErrors.length===0,candidateInteractionExercised:!!candidate.interactionTarget,sameCanonicalRoute:base.title===candidate.title&&base.url.replace(':4174',':PORT')===candidate.url.replace(':4173',':PORT'),visualStateChanged:base.screenshotSha256!==candidate.screenshotSha256,anchorContactSheetCaptured:anchor.status===200},disposition:'PENDING_INDEPENDENT_VISUAL_REVIEW'};
          fs.writeFileSync(`${stem}.json`,JSON.stringify(evidence,null,2)+'\n');
          NODE
          cd /tmp/h-earth-ow01-browser
          node qualify.mjs

      - name: Write fail-closed provisional anchor receipt
        shell: bash
        run: |
          set -euo pipefail
          TERRAIN_SHA="$(sha256sum h-earth-3d/terrain/h-earth.terrain-field.js | awk '{print $1}')"
          mkdir -p "$(dirname "$RECEIPT_PATH")"
          jq -n --arg terrain_sha "$TERRAIN_SHA" --arg evidence "$EVIDENCE_STEM.json" --arg visual "$EVIDENCE_STEM.candidate.png" '{schema:"H_EARTH_EXPERIENCE_ANCHOR_ACCEPTANCE_RECEIPT_v1",anchorId:"H_EARTH_GROUND_EXPERIENCE_VIDEO_20260814_001",anchorSha256:"7757fb4fe731456b3058ec595369133f5c2136c99b282eb6b4df108600bca573",reviewedAgainstAnchor:false,disposition:"BLOCK_PENDING_ANCHOR_REVIEW",visualEvidence:[$visual,$evidence],interactionEvidence:[$evidence],continuityEvidence:[$evidence],experienceFiles:[{path:"h-earth-3d/terrain/h-earth.terrain-field.js",sha256:$terrain_sha}],invariants:{SAME_CANONICAL_WORLD_IDENTITY:false,PLANETARY_TO_REGIONAL_TO_GROUND_CONTINUITY:false,CONTINUOUS_TERRAIN_AND_GEOGRAPHIC_SPACE:false,EMBODIED_LOCAL_GROUND_EXPERIENCE:false,DIRECT_LOOK_AND_TRAVEL_INTERACTION:false,MINIMAL_INTERFACE_INTRUSION_OVER_WORLD:false,TERRAIN_COAST_ELEVATION_AND_HORIZON_READ_AS_ONE_NAVIGABLE_SURFACE:false,NO_PARALLEL_OR_DUPLICATE_H_EARTH_PRODUCT:false,NO_DASHBOARD_MAP_APP_OR_CARD_UI_SUBSTITUTION_FOR_WORLD_EXPERIENCE:false,GLOBE_IS_HIGHER_ALTITUDE_EXPRESSION_OF_THE_SAME_WORLD:false,REGION_ENTRY_MUST_NOT_CREATE_A_VISUALLY_OR_INTERACTIONALLY_UNRELATED_PRODUCT:false}}' > "$RECEIPT_PATH"

      - name: Upload independent-review package
        uses: actions/upload-artifact@v4
        with:
          name: ow01-gratitude-coastal-entry-anchor-qualification
          path: |
            h-earth-3d/experience-anchor/evidence/OW01_GRATITUDE_COASTAL_ENTRY_20260815_001.base.png
            h-earth-3d/experience-anchor/evidence/OW01_GRATITUDE_COASTAL_ENTRY_20260815_001.candidate.png
            h-earth-3d/experience-anchor/evidence/OW01_GRATITUDE_COASTAL_ENTRY_20260815_001.anchor.png
            h-earth-3d/experience-anchor/evidence/OW01_GRATITUDE_COASTAL_ENTRY_20260815_001.json
            h-earth-3d/experience-anchor/receipts/OW01_GRATITUDE_COASTAL_ENTRY_20260815_001.json
            /tmp/ow01-candidate-server.log
            /tmp/ow01-base-server.log
          retention-days: 90

      - name: Commit qualification evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            h-earth-3d/experience-anchor/evidence/OW01_GRATITUDE_COASTAL_ENTRY_20260815_001.base.png \
            h-earth-3d/experience-anchor/evidence/OW01_GRATITUDE_COASTAL_ENTRY_20260815_001.candidate.png \
            h-earth-3d/experience-anchor/evidence/OW01_GRATITUDE_COASTAL_ENTRY_20260815_001.anchor.png \
            h-earth-3d/experience-anchor/evidence/OW01_GRATITUDE_COASTAL_ENTRY_20260815_001.json \
            h-earth-3d/experience-anchor/receipts/OW01_GRATITUDE_COASTAL_ENTRY_20260815_001.json
          git commit -m 'Record OW01 anchor qualification evidence [anchor evidence]'
          git push origin HEAD:control-plane-delivery/h-earth-ow01-public-product-20260814-014
