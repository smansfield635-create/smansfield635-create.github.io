name: Build Awards final media polish

on:
  push:
    branches:
      - agent/awards-final-media-polish-20260815

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/awards-final-media-polish-20260815
          fetch-depth: 0
      - name: Apply tighter crop and centered page play control
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('showroom/globe/h-earth/awards/index.html')
          s=p.read_text()
          replacements=[
            ('width:min(520px,100%)','width:min(500px,100%)'),
            ('object-position:center 60%','object-position:center 62%'),
            ('transform:scale(1.48)','transform:scale(1.62)'),
            ('.lens-media p{margin:9px 2px 0;', '.media-play{position:absolute;left:50%;top:50%;z-index:4;width:76px;height:76px;margin:0;padding:0;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.58);border-radius:50%;background:rgba(245,245,245,.92);box-shadow:0 10px 34px rgba(0,0,0,.38);cursor:pointer}.media-play:before{content:"";display:block;width:0;height:0;margin-left:29px;border-top:15px solid transparent;border-bottom:15px solid transparent;border-left:23px solid #111}.media-play[hidden]{display:none}.lens-media p{margin:9px 2px 0;'),
            ('playsinline controls preload="metadata" aria-label="36-second Compass and Mirrorland presentation with continuous embedded audio" src="/showroom/globe/h-earth/awards/media/diamond-gate-compass-mirrorland-36s.mp4"></video>', 'playsinline preload="metadata" aria-label="36-second Compass and Mirrorland presentation with continuous embedded audio" src="/showroom/globe/h-earth/awards/media/diamond-gate-compass-mirrorland-36s.mp4"></video><button class="media-play" type="button" data-media-play="compass-reel" aria-label="Play Compass and Mirrorland presentation"></button>'),
            ('playsinline controls preload="metadata" aria-label="30-second H-Earth and Audralia world-navigation presentation with embedded Vivaldi score" src="/showroom/globe/h-earth/awards/media/diamond-gate-h-earth-audralia-30s-vivaldi.mp4"></video>', 'playsinline preload="metadata" aria-label="30-second H-Earth and Audralia world-navigation presentation with embedded Vivaldi score" src="/showroom/globe/h-earth/awards/media/diamond-gate-h-earth-audralia-30s-vivaldi.mp4"></video><button class="media-play" type="button" data-media-play="world-reel" aria-label="Play H-Earth and Audralia presentation"></button>'),
            ("const compassMedia=document.getElementById('compass-media')", "document.querySelectorAll('[data-media-play]').forEach(btn=>{const v=document.getElementById(btn.dataset.mediaPlay);if(!v)return;const sync=()=>{btn.hidden=!v.paused&&!v.ended};btn.addEventListener('click',e=>{e.stopPropagation();if(v.paused||v.ended){if(v.ended)v.currentTime=0;v.play().catch(()=>{})}else{v.pause()}});v.addEventListener('play',sync);v.addEventListener('pause',sync);v.addEventListener('ended',sync);v.addEventListener('click',()=>{if(v.paused||v.ended){if(v.ended)v.currentTime=0;v.play().catch(()=>{})}else{v.pause()}});sync()});const compassMedia=document.getElementById('compass-media')")
          ]
          for old,new in replacements:
            if old not in s:
              raise SystemExit(f'missing expected token: {old[:100]}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify bounded page-only mutation
        run: |
          test "$(git diff --name-only | grep -v '^showroom/globe/h-earth/awards/index.html$' | wc -l)" -eq 0
          grep -q 'transform:scale(1.62)' showroom/globe/h-earth/awards/index.html
          grep -q 'data-media-play="compass-reel"' showroom/globe/h-earth/awards/index.html
          grep -q 'data-media-play="world-reel"' showroom/globe/h-earth/awards/index.html
      - name: Commit page-only correction and retire builder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add showroom/globe/h-earth/awards/index.html
          git commit -m "Polish Awards media crop and center play controls"
          git rm .github/workflows/build-awards-final-media-polish.yml
          git commit -m "Retire Awards final media polish builder"
          git push origin HEAD:agent/awards-final-media-polish-20260815
