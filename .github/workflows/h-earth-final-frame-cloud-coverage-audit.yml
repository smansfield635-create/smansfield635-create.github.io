name: H-Earth Final Screen Cloud Model Sweep

on:
  pull_request:
    branches:
      - agent/h-earth-multiscale-atmosphere-convergence-24055-20260821
    paths:
      - 'showroom/globe/audralia/**'
      - '.github/workflows/h-earth-final-frame-cloud-coverage-audit.yml'

permissions:
  contents: read

jobs:
  rendered-cloud-model-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4

      - name: Start repository-local inspection server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/h-earth-server.log 2>&1 &
          echo $! >/tmp/h-earth-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/showroom/globe/audralia/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/h-earth-server.log
          exit 1

      - name: Install browser controller
        run: |
          mkdir -p /tmp/cloud-sweep
          npm install --prefix /tmp/cloud-sweep --no-save playwright-core@1.55.0 >/tmp/playwright-install.log 2>&1

      - name: Capture 60 deterministic planetary final-screen models
        run: |
          set -euo pipefail
          export CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo 'No Chrome/Chromium binary found on runner.' >&2
            exit 1
          fi
          mkdir -p /tmp/cloud-sweep
          cat > /tmp/cloud-sweep/capture.mjs <<'EOF'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs/promises';
          const browser=await chromium.launch({
            executablePath:process.env.CHROME,
            headless:true,
            args:['--no-sandbox','--disable-dev-shm-usage','--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist']
          });
          const context=await browser.newContext({viewport:{width:1280,height:900},deviceScaleFactor:1});
          const page=await context.newPage();
          const rows=['model\twidth\tbroken\tsupport\tbytes\tcameraDistance\tviewScale'];
          for(let model=1;model<=60;model++){
            const padded=String(model).padStart(2,'0');
            await page.goto(`http://127.0.0.1:4173/showroom/globe/audralia/?cloudModel=${model}&fap1Quality=capture`,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>window.__AUDRALIA_WEATHER_PRESENTATION_RECONCILIATION__?.renderer,{timeout:120000});
            await page.waitForTimeout(900);
            const evidence=await page.evaluate(()=>{
              const receipt=window.__AUDRALIA_WEATHER_PRESENTATION_RECONCILIATION__;
              receipt.setCameraStateForTest({yaw:-0.62,pitch:1.02,distance:5000,targetU:0,targetV:-4});
              const tuning=window.__AUDRALIA_FAP1_ORBITAL_SUPPORT_TUNING__;
              const snapshot=receipt.renderer.getSnapshot();
              return {
                width:tuning?.parameterization?.widthOuter ?? null,
                broken:tuning?.parameterization?.brokenLow ?? null,
                support:tuning?.parameterization?.supportScale ?? null,
                cameraDistance:snapshot.distance,
                viewScale:snapshot.viewScale
              };
            });
            await page.waitForTimeout(700);
            const path=`/tmp/cloud-sweep/model-${padded}.png`;
            await page.screenshot({path,fullPage:true});
            const stat=await fs.stat(path);
            rows.push([model,evidence.width,evidence.broken,evidence.support,stat.size,evidence.cameraDistance,evidence.viewScale].join('\t'));
          }
          await fs.writeFile('/tmp/cloud-sweep/manifest.tsv',rows.join('\n')+'\n','utf8');
          await context.close();
          await browser.close();
          EOF
          node /tmp/cloud-sweep/capture.mjs
          test "$(find /tmp/cloud-sweep -name 'model-*.png' | wc -l)" -eq 60
          test "$(wc -l < /tmp/cloud-sweep/manifest.tsv)" -eq 61

      - name: Preserve final-screen sweep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-final-screen-cloud-model-sweep-60
          path: |
            /tmp/cloud-sweep/model-*.png
            /tmp/cloud-sweep/manifest.tsv
            /tmp/h-earth-server.log
            /tmp/playwright-install.log
          if-no-files-found: error
