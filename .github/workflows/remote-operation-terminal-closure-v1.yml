name: Remote Operation Terminal Closure v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/remote-operation-terminal-closure-v1.yml'
      - 'tools/operation-intake/repository-operation-lock-manager.v1.mjs'
      - 'tools/operation-intake/remote-operation-terminal-closure-bridge.v1.mjs'
      - 'tools/operation-intake/remote-operation-terminal-closure-bridge.v1.test.mjs'
      - 'tools/operation-intake/repository-operation-lock-manager.v1.remote-receipt.test.mjs'
  issue_comment:
    types: [created]

permissions: {}

env:
  ROUTE_ID: REMOTE_OPERATION_TERMINAL_CLOSURE_v1
  REQUEST_MARKER: REMOTE_OPERATION_TERMINAL_CLOSURE_REQUEST_V1
  WORKFLOW_PATH: .github/workflows/remote-operation-terminal-closure-v1.yml
  BRIDGE_PATH: tools/operation-intake/remote-operation-terminal-closure-bridge.v1.mjs
  BRIDGE_BLOB: 7d8dd52e177805717916bf524acded9f4152c174
  TEST_PATH: tools/operation-intake/remote-operation-terminal-closure-bridge.v1.test.mjs
  TEST_BLOB: e34f3110a1630f087a8b9829059e5efb9de7512a
  REMOTE_RECEIPT_TEST_PATH: tools/operation-intake/repository-operation-lock-manager.v1.remote-receipt.test.mjs
  REMOTE_RECEIPT_TEST_BLOB: e134d08cb9ccfd237dfd23803ae8ba6cc0ff1a93
  LOCK_MANAGER_PATH: tools/operation-intake/repository-operation-lock-manager.v1.mjs
  LOCK_MANAGER_BLOB: edb249f76cc326ea2f07aae20510f894c0e4511c
  LOCK_REF: refs/heads/operation-locks/repository-operation-intake-v1

jobs:
  validate-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify immutable identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD:"$LOCK_MANAGER_PATH")" = "$LOCK_MANAGER_BLOB"
          test "$(git rev-parse HEAD:"$BRIDGE_PATH")" = "$BRIDGE_BLOB"
          test "$(git rev-parse HEAD:"$TEST_PATH")" = "$TEST_BLOB"
          test "$(git rev-parse HEAD:"$REMOTE_RECEIPT_TEST_PATH")" = "$REMOTE_RECEIPT_TEST_BLOB"

      - name: Run exact bridge and remote-receipt self-tests
        shell: bash
        run: node --test "$TEST_PATH" "$REMOTE_RECEIPT_TEST_PATH"

      - name: Verify narrow workflow contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'issue_comment:' "$WORKFLOW_PATH"
          grep -Fq "startsWith(github.event.comment.body, 'REMOTE_OPERATION_TERMINAL_CLOSURE_REQUEST_V1')" "$WORKFLOW_PATH"
          grep -Fq 'contents: write' "$WORKFLOW_PATH"
          grep -Fq 'issues: write' "$WORKFLOW_PATH"
          grep -Fq 'pull-requests: write' "$WORKFLOW_PATH"
          grep -Fq 'persist-credentials: false' "$WORKFLOW_PATH"
          grep -Fq 'closeRemote' "$BRIDGE_PATH"
          grep -Fq "schema:'REPOSITORY_OPERATION_REMOTE_CLOSURE_RECEIPT_v1'" "$LOCK_MANAGER_PATH"
          grep -Fq 'directLedgerEditPerformed: false' "$BRIDGE_PATH"
          grep -Fq 'genericCommandAuthority: false' "$BRIDGE_PATH"
          ! grep -Eq 'create_file|update_file|delete_file|/contents/|git/refs|child_process|spawnSync|execSync|eval\(' "$BRIDGE_PATH"

      - name: Write validation receipt
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipt = {
            schema: 'REMOTE_OPERATION_TERMINAL_CLOSURE_CONTRACT_VALIDATION_RECEIPT_v1',
            result: 'PASS_CLOSED',
            routeId: process.env.ROUTE_ID,
            pullRequestHead: process.env.GITHUB_SHA,
            lockManagerBlob: process.env.LOCK_MANAGER_BLOB,
            bridgeBlob: process.env.BRIDGE_BLOB,
            testBlob: process.env.TEST_BLOB,
            remoteReceiptTestBlob: process.env.REMOTE_RECEIPT_TEST_BLOB,
            authenticatedIssueCommentInvocation: true,
            nativeCloseRemoteOnly: true,
            remoteReceiptSchemaRegressionCovered: true,
            pullRequestReceiptReturnPermissionBound: true,
            directLedgerEditAuthorized: false,
            genericCommandAuthority: false,
            semanticAuthorityCreated: false
          };
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/remote-operation-terminal-closure-contract-validation.json`, JSON.stringify(receipt, null, 2) + '\n');
          NODE

      - name: Upload validation receipt
        uses: actions/upload-artifact@v4
        with:
          name: remote-operation-terminal-closure-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/remote-operation-terminal-closure-contract-validation.json
          if-no-files-found: error
          retention-days: 90

  execute-closure:
    if: >-
      github.event_name == 'issue_comment' &&
      startsWith(github.event.comment.body, 'REMOTE_OPERATION_TERMINAL_CLOSURE_REQUEST_V1') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out exact installed event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify installed route identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:"$LOCK_MANAGER_PATH")" = "$LOCK_MANAGER_BLOB"
          test "$(git rev-parse HEAD:"$BRIDGE_PATH")" = "$BRIDGE_BLOB"
          test "$(git rev-parse HEAD:"$TEST_PATH")" = "$TEST_BLOB"
          test "$(git rev-parse HEAD:"$REMOTE_RECEIPT_TEST_PATH")" = "$REMOTE_RECEIPT_TEST_BLOB"
          node --test "$TEST_PATH" "$REMOTE_RECEIPT_TEST_PATH"

      - name: Extract exact closure request
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set +e
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const marker = process.env.REQUEST_MARKER;
          const body = String(process.env.COMMENT_BODY ?? '').trim();
          let status = 0;
          try {
            if (!body.startsWith(marker)) throw new Error('REQUEST_MARKER_MISSING');
            const tail = body.slice(marker.length).trim();
            if (!tail.startsWith('{') || !tail.endsWith('}')) throw new Error('REQUEST_JSON_NOT_EXACT');
            const request = JSON.parse(tail);
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/closure-input.json`, JSON.stringify(request, null, 2) + '\n');
          } catch (error) {
            status = 1;
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/workflow-failure-receipt.json`, JSON.stringify({
              schema: 'REMOTE_OPERATION_TERMINAL_CLOSURE_WORKFLOW_FAILURE_RECEIPT_v1',
              result: 'FAIL_CLOSED_NO_CLOSURE',
              routeId: process.env.ROUTE_ID,
              errorCode: error.message,
              directLedgerEditPerformed: false,
              genericCommandAuthority: false
            }, null, 2) + '\n');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `status=${status}\n`);
          NODE
          exit 0

      - name: Execute canonical closeRemote bridge
        id: closure
        if: steps.parse.outputs.status == '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          node "$BRIDGE_PATH" \
            --input "$RUNNER_TEMP/closure-input.json" \
            --output "$RUNNER_TEMP/remote-operation-terminal-closure-receipt.json" \
            --native-output "$RUNNER_TEMP/native-remote-closure-receipt.json"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify returned receipt identity
        if: always() && steps.parse.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const wrapperPath = `${process.env.RUNNER_TEMP}/remote-operation-terminal-closure-receipt.json`;
          if (!fs.existsSync(wrapperPath)) throw new Error('INVOCATION_RECEIPT_MISSING');
          const wrapper = JSON.parse(fs.readFileSync(wrapperPath, 'utf8'));
          if (wrapper.schema !== 'REMOTE_OPERATION_TERMINAL_CLOSURE_INVOCATION_RECEIPT_v1') throw new Error('INVOCATION_RECEIPT_SCHEMA_MISMATCH');
          if (wrapper.routeId !== process.env.ROUTE_ID || wrapper.lockManagerBlob !== process.env.LOCK_MANAGER_BLOB || wrapper.nativeReceiptRewritten !== false || wrapper.directLedgerEditPerformed !== false || wrapper.genericCommandAuthority !== false || wrapper.semanticAuthorityCreated !== false) throw new Error('INVOCATION_RECEIPT_IDENTITY_MISMATCH');
          if (wrapper.result === 'TERMINAL_CLOSURE_COMMITTED') {
            const nativePath = `${process.env.RUNNER_TEMP}/native-remote-closure-receipt.json`;
            if (!fs.existsSync(nativePath)) throw new Error('NATIVE_RECEIPT_MISSING');
            const nativeBytes = fs.readFileSync(nativePath);
            const native = JSON.parse(nativeBytes);
            if (native.schema !== 'REPOSITORY_OPERATION_REMOTE_CLOSURE_RECEIPT_v1' || native.result !== 'TERMINAL_CLOSURE_COMMITTED' || native.lockReleased !== true) throw new Error('NATIVE_RECEIPT_NOT_CLOSED');
            if (crypto.createHash('sha256').update(nativeBytes).digest('hex') !== wrapper.nativeReceiptSha256) throw new Error('NATIVE_RECEIPT_DIGEST_MISMATCH');
          }
          NODE

      - name: Upload closure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-operation-terminal-closure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/remote-operation-terminal-closure-receipt.json
            ${{ runner.temp }}/native-remote-closure-receipt.json
            ${{ runner.temp }}/workflow-failure-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Return receipt to invoking conversation
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const candidates = [
            `${process.env.RUNNER_TEMP}/remote-operation-terminal-closure-receipt.json`,
            `${process.env.RUNNER_TEMP}/workflow-failure-receipt.json`
          ];
          const file = candidates.find(candidate => fs.existsSync(candidate));
          const receipt = file ? JSON.parse(fs.readFileSync(file, 'utf8')) : {
            schema: 'REMOTE_OPERATION_TERMINAL_CLOSURE_WORKFLOW_FAILURE_RECEIPT_v1',
            result: 'FAIL_CLOSED_NO_CLOSURE',
            routeId: process.env.ROUTE_ID,
            errorCode: 'RECEIPT_NOT_PRODUCED',
            directLedgerEditPerformed: false,
            genericCommandAuthority: false
          };
          const body = `REMOTE_OPERATION_TERMINAL_CLOSURE_RECEIPT_V1\n\n\`\`\`json\n${JSON.stringify(receipt, null, 2)}\n\`\`\``;
          const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/issues/${process.env.ISSUE_NUMBER}/comments`, {
            method: 'POST',
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ body })
          });
          if (!response.ok) throw new Error(`RECEIPT_COMMENT_RETURN_FAILED:${response.status}`);
          NODE

      - name: Enforce fail-closed result
        if: always()
        env:
          PARSE_STATUS: ${{ steps.parse.outputs.status }}
          CLOSURE_STATUS: ${{ steps.closure.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PARSE_STATUS" = "0"
          test "$CLOSURE_STATUS" = "0"
