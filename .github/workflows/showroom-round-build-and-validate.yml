name: Showroom bounded product materialization

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/showroom-startup-spatial-cosmos-001'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/showroom-startup-spatial-cosmos-001
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Construct bounded Showroom product
        run: python3 .github/scripts/showroom_materialize.py

      - name: Static and structural verification
        shell: bash
        run: |
          set -euo pipefail
          node --check showroom/index.cosmos.js
          node --check showroom/index.crystals.js
          cmp showroom/index.crystals.js showroom/index.crystals.source.js
          test ! -e showroom/index.cosmos.source.js
          ! grep -q 'XMLHttpRequest' showroom/index.cosmos.js
          ! grep -q 'loadSourceSynchronously' showroom/index.cosmos.js
          ! grep -q 'index.cosmos.source.js' showroom/index.cosmos.js
          grep -q 'SHOWROOM_COSMOS_ARCHCOIN_SCENE_FIELD_v1' showroom/index.cosmos.js
          grep -q 'SHOWROOM_CANONICAL_CRYSTAL_SPATIAL_INTEGRATION_v2' showroom/index.crystals.js
          grep -q 'haloPassEnabled: false' showroom/index.crystals.js
          grep -q 'node.target.float = 0;' showroom/index.crystals.js
          grep -q 'SHOWROOM_COMPASS_SPATIAL_COSMOS_20260726J' showroom/index.html
          test "$(grep -F -c '"data-showroom-child": "cosmos"' showroom/index.html)" -eq 1
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('showroom/index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,flags=re.I)
          for i,s in enumerate(scripts): Path(f'/tmp/showroom-inline-{i}.js').write_text(s)
          print(f'inline_scripts={len(scripts)}')
          PY
          for file in /tmp/showroom-inline-*.js; do node --check "$file"; done

      - name: Install browser runtime
        run: |
          mkdir -p /tmp/showroom-browser
          cd /tmp/showroom-browser
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null

      - name: Three-viewport runtime verification
        id: runtime
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/showroom-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2
          cat >/tmp/showroom-browser-test.cjs <<'NODE'
          const { chromium } = require('/tmp/showroom-browser/node_modules/playwright');
          const profiles=[
            {name:'phone',width:390,height:844,dpr:3},
            {name:'tablet',width:768,height:1024,dpr:2},
            {name:'desktop',width:1440,height:900,dpr:1}
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const results=[];
            for(const p of profiles){
              const context=await browser.newContext({viewport:{width:p.width,height:p.height},deviceScaleFactor:p.dpr});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              await page.goto('http://127.0.0.1:4173/showroom/',{waitUntil:'domcontentloaded',timeout:30000});
              await page.locator('#showroom-orbit').scrollIntoViewIfNeeded();
              await page.waitForFunction(()=>Boolean(window.SHOWROOM_COSMOS_RECEIPT?.initialized),null,{timeout:15000});
              await page.waitForFunction(()=>Boolean(window.SHOWROOM_CRYSTALS_RECEIPT),null,{timeout:15000});
              const result=await page.evaluate(()=>({
                cosmosContract:window.SHOWROOM_COSMOS_RECEIPT?.contract,
                crystalContract:window.SHOWROOM_CRYSTALS_RECEIPT?.contract,
                cosmosCanvases:document.querySelectorAll('[data-showroom-cosmos-canvas]').length,
                compositorCanvases:document.querySelectorAll('canvas[data-showroom-compositor-layer]').length,
                oldSourceReferences:[...document.scripts].filter(s=>s.src.includes('index.cosmos.source.js')).length,
                rootCosmosStatus:document.querySelector('[data-showroom-root]')?.dataset.showroomCosmosStatus,
                crystalReady:document.querySelector('[data-showroom-root]')?.dataset.showroomCrystalsReady
              }));
              result.profile=p.name; result.errors=errors;
              if(result.cosmosContract!=='SHOWROOM_COSMOS_ARCHCOIN_SCENE_FIELD_v1') throw new Error(`${p.name}: cosmos contract`);
              if(result.crystalContract!=='SHOWROOM_CANONICAL_CRYSTAL_SPATIAL_INTEGRATION_v2') throw new Error(`${p.name}: crystal contract`);
              if(result.cosmosCanvases!==2) throw new Error(`${p.name}: cosmos canvas count ${result.cosmosCanvases}`);
              if(result.compositorCanvases!==2) throw new Error(`${p.name}: compositor canvas count ${result.compositorCanvases}`);
              if(result.oldSourceReferences!==0) throw new Error(`${p.name}: retired source reference`);
              if(errors.length) throw new Error(`${p.name}: runtime errors ${errors.join(' | ')}`);
              results.push(result);
              await context.close();
            }
            console.log(JSON.stringify(results,null,2));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
          set +e
          node /tmp/showroom-browser-test.cjs 2>&1 | tee /tmp/showroom-runtime.log
          status=${PIPESTATUS[0]}
          echo "exit_status=$status" >> /tmp/showroom-runtime.log
          exit $status

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showroom-runtime-evidence
          path: |
            /tmp/showroom-runtime.log
            /tmp/showroom-server.log
          if-no-files-found: warn

      - name: Commit materialized product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add showroom/index.html showroom/index.cosmos.js showroom/index.crystals.js showroom/index.crystals.source.js
          git add -u showroom/index.cosmos.source.js
          if git diff --cached --quiet; then
            echo 'No product delta to commit.'
          else
            git commit -m 'Materialize verified Showroom spatial Cosmos product'
            git push origin HEAD:agent/showroom-startup-spatial-cosmos-001
          fi
