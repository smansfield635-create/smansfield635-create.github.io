name: Characters Post-Gen2003 Canopy Void Feasibility Diagnostic v1

on:
  pull_request:
    paths:
      - 'control-plane/whole-estate/characters-reconstruction-v1/post-gen2003-canopy-void-feasibility-contract.v1.json'
      - 'control-plane/whole-estate/characters-reconstruction-v1/diagnose-post-gen2003-canopy-void-feasibility.v1.mjs'
      - 'control-plane/whole-estate/characters-reconstruction-v1/verify-post-gen2003-canopy-void-feasibility.v1.mjs'
      - '.github/workflows/characters-post-gen1992-environment-material-repair-v1.yml'

permissions:
  contents: read

env:
  OPERATION_ID: MIRRORLAND_POST_GEN2003_CANOPY_VOID_FEASIBILITY_DIAGNOSTIC_20260908_001
  LOCK_GENERATION: '2006'
  GOVERNING_MAIN: 691339e6becbaf724e4ac28bd4cd9c1834254d83
  GEN2001: fc466a0d08adbaeb9672d4618f670105cf1af87c
  GEN2002: 3a5dd83b936c7041257e73a3ebe30c306a7516f5
  GEN2003: 33b8878ad6b6fd5fad942138a26f48881187bfc7
  V2_TOOLING_HEAD: 834038c23711c3eed83dc21964027bd515852b51
  V2_CONTRACT_BLOB: 84014a5a51a50d43e86c9e4f54bb0804d3655af1
  V2_VERIFIER_BLOB: 6a7007cb37d04ea5af3542783342043c5c0a5829
  V2_WORKFLOW_BLOB: 77b5b2e460adb86a123437c6eeb8d36ea8da5ba2
  AHBK_HEAD: d1d2580509c5f66802899ef6a07174a124604d08
  REQUIRED_BRANCH: diagnostic/post-gen2003-canopy-void-feasibility-20260908-001

jobs:
  fixed-818-read-only-feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Materialize exact diagnostic candidate with bounded sparse index
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.head_ref }}" = "$REQUIRED_BRANCH"
          mkdir -p candidate
          git -C candidate init
          git -C candidate remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C candidate -c protocol.version=2 fetch --no-tags --depth=8 --filter=blob:none origin "${{ github.event.pull_request.head.sha }}" "$GOVERNING_MAIN"
          git -C candidate sparse-checkout init --cone --sparse-index
          git -C candidate sparse-checkout set control-plane/whole-estate/characters-reconstruction-v1 .github/workflows
          git -C candidate checkout --detach "${{ github.event.pull_request.head.sha }}"
          test "$(git -C candidate rev-parse HEAD^{commit})" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C candidate config --bool index.sparse)" = true
          test "$(git -C candidate config --bool core.sparseCheckoutCone)" = true
          git -C candidate merge-base --is-ancestor "$GOVERNING_MAIN" HEAD
          mapfile -t CHANGED < <(git -C candidate diff --name-only "$GOVERNING_MAIN"...HEAD | sort)
          EXPECTED=(
            '.github/workflows/characters-post-gen1992-environment-material-repair-v1.yml'
            'control-plane/whole-estate/characters-reconstruction-v1/diagnose-post-gen2003-canopy-void-feasibility.v1.mjs'
            'control-plane/whole-estate/characters-reconstruction-v1/post-gen2003-canopy-void-feasibility-contract.v1.json'
            'control-plane/whole-estate/characters-reconstruction-v1/verify-post-gen2003-canopy-void-feasibility.v1.mjs'
          )
          mapfile -t EXPECTED_SORTED < <(printf '%s\n' "${EXPECTED[@]}" | sort)
          test "${#CHANGED[@]}" -eq 4
          for i in "${!EXPECTED_SORTED[@]}"; do test "${CHANGED[$i]}" = "${EXPECTED_SORTED[$i]}"; done
          test -z "$(git -C candidate diff --name-only "$GOVERNING_MAIN"...HEAD -- characters h-earth-3d infrastructure/state-bound-admissibility-kernel-v1)"
          echo "CANDIDATE_HEAD=$(git -C candidate rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Materialize three frozen product subjects read-only with bounded sparse index
        shell: bash
        run: |
          set -euo pipefail
          for pair in "gen2001:$GEN2001" "gen2002:$GEN2002" "gen2003:$GEN2003"; do
            name="${pair%%:*}"; sha="${pair#*:}"
            mkdir -p "$name"
            git -C "$name" init
            git -C "$name" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git -C "$name" -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$sha"
            git -C "$name" sparse-checkout init --cone --sparse-index
            git -C "$name" sparse-checkout set \
              characters \
              h-earth-3d/terrain \
              h-earth-3d/integration \
              h-earth-3d/control-plane/run-8 \
              h-earth-3d/zones \
              h-earth-3d/cells \
              h-earth-3d/objects \
              showroom/globe/h-earth/render
            git -C "$name" checkout --detach FETCH_HEAD
            test "$(git -C "$name" rev-parse HEAD^{commit})" = "$sha"
            test "$(git -C "$name" config --bool index.sparse)" = true
            test "$(git -C "$name" config --bool core.sparseCheckoutCone)" = true
            test -z "$(git -C "$name" status --porcelain)"
          done

      - name: Materialize immutable V2 and AHBK references read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v2-tooling ahbk
          git -C v2-tooling init
          git -C v2-tooling remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C v2-tooling -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$V2_TOOLING_HEAD"
          git -C v2-tooling sparse-checkout init --cone --sparse-index
          git -C v2-tooling sparse-checkout set control-plane/whole-estate/characters-reconstruction-v1 .github/workflows
          git -C v2-tooling checkout --detach FETCH_HEAD
          test "$(git -C v2-tooling rev-parse HEAD^{commit})" = "$V2_TOOLING_HEAD"
          test "$(git -C v2-tooling hash-object control-plane/whole-estate/characters-reconstruction-v1/gen1983-camera-space-environment-diagnostics-v2-contract.v1.json)" = "$V2_CONTRACT_BLOB"
          test "$(git -C v2-tooling hash-object control-plane/whole-estate/characters-reconstruction-v1/verify-gen1983-camera-space-environment-diagnostics-v2.v1.mjs)" = "$V2_VERIFIER_BLOB"
          test "$(git -C v2-tooling hash-object .github/workflows/characters-gen1983-camera-space-environment-diagnostics-v2-v1.yml)" = "$V2_WORKFLOW_BLOB"
          git -C ahbk init
          git -C ahbk remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C ahbk -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$AHBK_HEAD"
          git -C ahbk sparse-checkout init --cone --sparse-index
          git -C ahbk sparse-checkout set infrastructure/state-bound-admissibility-kernel-v1
          git -C ahbk checkout --detach FETCH_HEAD
          test "$(git -C ahbk rev-parse HEAD^{commit})" = "$AHBK_HEAD"
          test -z "$(git -C v2-tooling status --porcelain)"
          test -z "$(git -C ahbk status --porcelain)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Freeze-format validate diagnostic package
        shell: bash
        run: |
          set -euo pipefail
          node --check candidate/control-plane/whole-estate/characters-reconstruction-v1/diagnose-post-gen2003-canopy-void-feasibility.v1.mjs
          node --check candidate/control-plane/whole-estate/characters-reconstruction-v1/verify-post-gen2003-canopy-void-feasibility.v1.mjs
          node -e "JSON.parse(require('fs').readFileSync('candidate/control-plane/whole-estate/characters-reconstruction-v1/post-gen2003-canopy-void-feasibility-contract.v1.json','utf8'))"
          mkdir -p "$RUNNER_TEMP/gen2006"

      - name: Execute diagnostic twice and require byte identity
        shell: bash
        run: |
          set -euo pipefail
          CMD=(node candidate/control-plane/whole-estate/characters-reconstruction-v1/diagnose-post-gen2003-canopy-void-feasibility.v1.mjs \
            --gen2001-root gen2001 --gen2002-root gen2002 --gen2003-root gen2003 \
            --v2-contract v2-tooling/control-plane/whole-estate/characters-reconstruction-v1/gen1983-camera-space-environment-diagnostics-v2-contract.v1.json)
          "${CMD[@]}" --output "$RUNNER_TEMP/gen2006/diagnostic-receipt.json" --witness-module-output "$RUNNER_TEMP/gen2006/witness-one.mjs"
          "${CMD[@]}" --output "$RUNNER_TEMP/gen2006/diagnostic-repeat-receipt.json" --witness-module-output "$RUNNER_TEMP/gen2006/witness-two.mjs"
          cmp "$RUNNER_TEMP/gen2006/diagnostic-receipt.json" "$RUNNER_TEMP/gen2006/diagnostic-repeat-receipt.json"
          if test -f "$RUNNER_TEMP/gen2006/witness-one.mjs" || test -f "$RUNNER_TEMP/gen2006/witness-two.mjs"; then cmp "$RUNNER_TEMP/gen2006/witness-one.mjs" "$RUNNER_TEMP/gen2006/witness-two.mjs"; fi

      - name: Independently verify diagnostic receipt twice
        shell: bash
        run: |
          set -euo pipefail
          V=candidate/control-plane/whole-estate/characters-reconstruction-v1/verify-post-gen2003-canopy-void-feasibility.v1.mjs
          node "$V" --receipt "$RUNNER_TEMP/gen2006/diagnostic-receipt.json" --output "$RUNNER_TEMP/gen2006/verification-receipt.json"
          node "$V" --receipt "$RUNNER_TEMP/gen2006/diagnostic-repeat-receipt.json" --output "$RUNNER_TEMP/gen2006/verification-repeat-receipt.json"
          cmp "$RUNNER_TEMP/gen2006/verification-receipt.json" "$RUNNER_TEMP/gen2006/verification-repeat-receipt.json"

      - name: Cross-check all three subject canopy metrics with immutable V2
        shell: bash
        run: |
          set -euo pipefail
          V2=v2-tooling/control-plane/whole-estate/characters-reconstruction-v1/verify-gen1983-camera-space-environment-diagnostics-v2.v1.mjs
          for name in gen2001 gen2002 gen2003; do
            set +e
            node "$V2" --product-root "$name" --output "$RUNNER_TEMP/gen2006/$name-v2.json" >/dev/null
            set -e
          done
          node - <<'NODE'
          const fs=require('fs'),root=process.env.RUNNER_TEMP+'/gen2006/';
          const d=JSON.parse(fs.readFileSync(root+'diagnostic-receipt.json'));
          for(const [dir,key] of [['gen2001','GEN2001'],['gen2002','GEN2002'],['gen2003','GEN2003']]){
            const v=JSON.parse(fs.readFileSync(root+dir+'-v2.json'));
            const observed=v.metrics.stateMetrics.map(x=>x.canopyFieldContinuity);
            const declared=d.subjects[key].map(x=>({state:x.state,...x.metrics}));
            const fields=['state','eligibleCellCount','occupiedCellCount','occupiedCellRatio','largestConnectedOccupiedCells','largestComponentRatio','maxEmptyCorridorCells','risk'];
            if(observed.length!==declared.length)throw new Error(`SUBJECT_V2_METRIC_COUNT_MISMATCH:${key}:${observed.length}:${declared.length}`);
            for(let i=0;i<observed.length;i++)for(const field of fields){
              if(!Object.hasOwn(observed[i],field)||!Object.hasOwn(declared[i],field)||observed[i][field]!==declared[i][field]){
                throw new Error(`SUBJECT_V2_METRIC_MISMATCH:${key}:${i}:${field}:${String(observed[i]?.[field])}:${String(declared[i]?.[field])}`);
              }
            }
          }
          NODE

      - name: If feasible independently evaluate exact 818 witness with immutable V2
        shell: bash
        run: |
          set -euo pipefail
          disposition="$(jq -r '.feasibility.disposition' "$RUNNER_TEMP/gen2006/diagnostic-receipt.json")"
          if test "$disposition" != FEASIBLE; then echo "No witness evaluation required: $disposition"; exit 0; fi
          test -s "$RUNNER_TEMP/gen2006/witness-one.mjs"
          mkdir -p witness-root
          rsync -a --exclude=.git gen2001/ witness-root/
          cp "$RUNNER_TEMP/gen2006/witness-one.mjs" witness-root/characters/vegetation-population.mjs
          set +e
          node v2-tooling/control-plane/whole-estate/characters-reconstruction-v1/verify-gen1983-camera-space-environment-diagnostics-v2.v1.mjs \
            --product-root witness-root --output "$RUNNER_TEMP/gen2006/witness-v2.json" >/dev/null
          set -e
          jq -e '.metrics.familyRisk.CANOPY_FIELD_CONTINUITY == false' "$RUNNER_TEMP/gen2006/witness-v2.json" >/dev/null
          jq -e '[.metrics.stateMetrics[].canopyFieldContinuity.risk] | all(. == false)' "$RUNNER_TEMP/gen2006/witness-v2.json" >/dev/null
          node - <<'NODE'
          const fs=require('fs'),root=process.env.RUNNER_TEMP+'/gen2006/';
          const d=JSON.parse(fs.readFileSync(root+'diagnostic-receipt.json'));
          const v=JSON.parse(fs.readFileSync(root+'witness-v2.json'));
          const observed=v.metrics.stateMetrics.map(x=>x.canopyFieldContinuity);
          if(JSON.stringify(observed)!==JSON.stringify(d.feasibility.witnessCanopyMetrics))throw new Error('WITNESS_V2_METRIC_MISMATCH');
          NODE
          rm -rf witness-root

      - name: Enforce read-only terminal boundary
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.result=="PASS_CLOSED" and .diagnosticValid==true and .productMutationDetected==false and .productRepairAuthority==false and .mergeAuthority==false and .deploymentAuthority==false and .publicationAuthority==false' "$RUNNER_TEMP/gen2006/diagnostic-receipt.json" >/dev/null
          jq -e '.result=="PASS_CLOSED" and .failCount==0 and .productMutationAuthority==false and .repairAuthority==false' "$RUNNER_TEMP/gen2006/verification-receipt.json" >/dev/null
          test -z "$(git -C candidate diff --name-only "$GOVERNING_MAIN"..."$CANDIDATE_HEAD" -- characters h-earth-3d infrastructure/state-bound-admissibility-kernel-v1)"
          for d in candidate gen2001 gen2002 gen2003 v2-tooling ahbk; do test -z "$(git -C "$d" status --porcelain)"; done

      - name: Upload Gen2006 diagnostic evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-gen2003-canopy-void-feasibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gen2006/*.json
          if-no-files-found: warn
          retention-days: 90
