name: H-Earth Gate B Seven-File Verification

on:
  pull_request:
    branches:
      - agent/h-earth-gate-b-seven-file-verification-001
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'agent/h-earth-gate-b-seven-file-verification-001'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source, syntax, matrix, and executable corridor audit
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const ledger = [
            ['showroom/globe/h-earth/environment.js','7fbdf7c14cdc51d09fac4dc3af76a10727850fbf'],
            ['showroom/globe/h-earth/render/ground-view-gate-b.js','2a5b79a58ce411ed820df7ec2166f2e7b6e54b5b'],
            ['showroom/globe/h-earth/render/tests/ground-view-gate-b.contract.js','978ca951e03ea93975153ebba0c874f84848290a'],
            ['showroom/globe/h-earth/index.html','c14600319946c45fca9b6d37e74033eb44680b05'],
            ['h-earth-3d/integration/h-earth.post-west-admitted-geometry-transfer.js','2bcb67ebf84f36248475921c85e75236a1115102'],
            ['showroom/globe/h-earth/admitted-geometry-frame.js','c45ed4482f0d653c4a51ea838c191f36e7769d26'],
            ['showroom/globe/h-earth/compositor.js','480cd4519a4d3cc364be4b16acc7791aadb5071c']
          ];
          const sourceIdentity = ledger.map(([path,expected]) => { const actual = execFileSync('git',['hash-object',path],{encoding:'utf8'}).trim(); return {path,expected,actual,passed:actual===expected}; });
          const syntax = {};
          for (const [path] of ledger.filter(([p]) => p.endsWith('.js'))) { try { execFileSync(process.execPath,['--check',path],{stdio:'pipe'}); syntax[path]='PASS'; } catch { syntax[path]='FAIL'; } }
          const env = await import('./showroom/globe/h-earth/environment.js');
          const gate = await import('./showroom/globe/h-earth/render/ground-view-gate-b.js');
          const tests = await import('./showroom/globe/h-earth/render/tests/ground-view-gate-b.contract.js');
          const transfer = await import('./h-earth-3d/integration/h-earth.post-west-admitted-geometry-transfer.js');
          const frame = await import('./showroom/globe/h-earth/admitted-geometry-frame.js');
          const compositor = await import('./showroom/globe/h-earth/compositor.js');
          const contractResult = tests.runHEarthGroundViewGateBContractTests();
          const html = fs.readFileSync('./showroom/globe/h-earth/index.html','utf8');
          const matrix = {
            ENVIRONMENT_AUTHORITY:Boolean(env.H_EARTH_GROUND_VIEW_PHASE_1_CONFIGURATION),
            GATE_B_PROVIDER:typeof gate.constructHEarthGroundViewGateBGeometry==='function',
            CONTRACT_NO_BLOCKERS:contractResult.blockingFindings.length===0,
            CONCRETE_MESH:contractResult.groups.concreteMeshExecutionTests.failed===0,
            PACKET_002:typeof transfer.buildHEarthPostWestAdmittedGeometryTransfer==='function',
            ADMITTED_FRAME:typeof frame.composeHEarth3DAdmittedGeometryFrame==='function',
            COMPOSITOR:compositor.H_EARTH_3D_COMPOSITOR_CONTRACT_ID==='H_EARTH_3D_COMPOSITOR_FILE_RENEWAL_STEP_034O_8_ADMITTED_GEOMETRY_FRAME_COMPOSITION_v1',
            COMPOSITOR_HANDOFF:typeof compositor.getHEarth3DCompositorRendererHandoff==='function',
            ROUTE_GATE_B_REFERENCE:html.includes('ground-view-gate-b')&&html.includes('constructHEarthGroundViewGateBGeometry'),
            DIAGNOSTIC_SEPARATION:contractResult.records.some(r=>r.id==='GB-S17'&&r.status==='PASS')
          };
          const failed = [...sourceIdentity.filter(r=>!r.passed).map(r=>`SOURCE:${r.path}`), ...Object.entries(syntax).filter(([,v])=>v!=='PASS').map(([p])=>`SYNTAX:${p}`), ...Object.entries(matrix).filter(([,v])=>v!==true).map(([k])=>`MATRIX:${k}`)];
          const receipt={receiptId:'H_EARTH_GATE_B_7_FILE_CORRIDOR_EXECUTION_RECEIPT_v3',exactCommitSha:process.env.GITHUB_SHA,nodeVersion:process.version,sourceIdentity,syntax,matrix,matrixRowsExpected:Object.keys(matrix).length,matrixRowsPassed:Object.values(matrix).filter(Boolean).length,matrixRowsFailed:Object.values(matrix).filter(v=>!v).length,contractResult,failedChecks:failed,overallPassOrFail:failed.length?'FAIL':'PASS',controllerJsIncluded:false,finalAcceptance:'NOT_CONFERRED_BY_EXECUTION_ALONE'};
          fs.writeFileSync('H_EARTH_GATE_B_7_FILE_CORRIDOR_EXECUTION_RECEIPT_v3.json',JSON.stringify(receipt,null,2));
          console.log(JSON.stringify(receipt,null,2));
          if(failed.length) process.exit(1);
          EOF
      - name: Upload machine-readable receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-gate-b-seven-file-receipt-v3
          path: H_EARTH_GATE_B_7_FILE_CORRIDOR_EXECUTION_RECEIPT_v3.json
          if-no-files-found: error
