name: Education Evidence Sufficiency Qualification v1
on:
  workflow_dispatch:
    inputs:
      candidate_sha: {required: true, type: string}
      base_sha: {required: true, type: string}
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Qualify evidence-sufficiency runtime
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=10 origin "$CANDIDATE_SHA" "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = products/education/index.html
          git show "$CANDIDATE_SHA:products/education/index.html" >/tmp/e.html
          grep -Fq 'Math.max(1,Math.min(8,claimed))' /tmp/e.html
          grep -Fq 'Math.max(1,Math.min(8,stage))' /tmp/e.html
          grep -Fq 'usedItems:[],stageEvidence:{}' /tmp/e.html
          grep -Fq 'const fresh=!adaptiveState.usedItems.includes(item.id)' /tmp/e.html
          grep -Fq 'if(fresh)adaptiveState.usedItems.push(item.id)' /tmp/e.html
          grep -Fq 'if(unique===2&&ratio===1&&probeStage<8)' /tmp/e.html
          grep -Fq 'if(unique===2&&ratio===0&&probeStage>1)' /tmp/e.html
          grep -Fq 'if(unique>=5)' /tmp/e.html
          grep -Fq 'bucket.unassistedCorrect>=4' /tmp/e.html
          grep -Fq 'if(unique>=8){resolveAdaptiveBoundary(probeStage);return}' /tmp/e.html
          grep -Fq 'if(probeStage===1){resolveAdaptiveBoundary(1);return}' /tmp/e.html
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('/tmp/e.html','utf8');
          for(const src of [...s.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]))new Function(src);
          const a=s.indexOf('const BANK='),b=s.indexOf('const EDUCATION_STATE_KEY=',a);
          const BANK=Function(s.slice(a,b)+';return BANK')();
          for(let i=1;i<=8;i++)if(BANK[i]?.length!==8)throw Error('bank regression stage '+i);
          console.log('JS_PARSE_AND_BANK=PASS');
          NODE
          echo EDUCATION_EVIDENCE_SUFFICIENCY_QUALIFICATION=PASS
