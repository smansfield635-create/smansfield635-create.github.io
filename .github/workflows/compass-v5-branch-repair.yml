name: Compass v5 Branch Repair

on:
  push:
    branches:
      - compass/cache-bust-v5-20260814

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compass/cache-bust-v5-20260814
          fetch-depth: 0
      - name: Remove feedback observer and self-clean
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          bad = "new MutationObserver(()=>{const mode=root.dataset.compassMode||'';if(mode==='CLUSTER_OPEN'||mode==='ROOM_SELECTED')queueMicrotask(sync)}).observe(panel,{subtree:true,childList:true,characterData:true});"
          if bad not in s:
              raise SystemExit('feedback observer not found')
          s = s.replace(bad, '', 1)
          if 'compass-contextual-quick-pass-v5' not in s:
              raise SystemExit('v5 cache key missing')
          if 'button[data-compass-room-proxy][data-label]:not([data-label=""])::after' not in s:
              raise SystemExit('empty-label guard missing')
          p.write_text(s)
          Path('.github/workflows/compass-v5-branch-repair.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/compass-v5-branch-repair.yml
          git commit -m "Remove Compass panel feedback loop before v5 delivery"
          git push origin HEAD:compass/cache-bust-v5-20260814
