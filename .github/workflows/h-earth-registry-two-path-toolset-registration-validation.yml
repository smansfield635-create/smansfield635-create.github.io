name: CP10 Remote Admission Projection Compatibility Verification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h-earth-registry-two-path-toolset-registration-validation.yml'

permissions:
  contents: write
  actions: read

env:
  CANONICAL_RECEIPT_HEAD: 3d2b22d9e7860d867da7bbbb1e70bcbd8faa6494
  CANONICAL_RECEIPT_PATH: h-earth-3d/control-plane/registry-two-path-operation-b/evidence/admission-receipt.v1.json
  CANONICAL_RECEIPT_SHA256: 62a5b9538fa69625432859282dcd1b5b506943f48206778b90bdf0c35d0bda41
  BLOCKED_OPERATION_ID: H_EARTH_REGISTRY_TWO_PATH_SUCCESSOR_REPAIR_OPERATION_B_v1
  BLOCKED_LOCK_SCOPE: H_EARTH:REGISTRY_TWO_PATH_SUCCESSOR_REPAIR:OPERATION_B:V1
  BLOCKED_LOCK_GENERATION: '63'
  REPAIR_OPERATION_ID: CP10_OPERATION_B_REMOTE_ADMISSION_PROJECTION_COMPATIBILITY_REPAIR_v1
  REPAIR_LOCK_SCOPE: H_EARTH:AI_ROOM_TRANSPORT:REMOTE_ADMISSION_PROJECTION:CP10:V1
  REPAIR_LOCK_GENERATION: '66'
  LOCK_REF: refs/heads/operation-locks/repository-operation-intake-v1
  LEDGER_PATH: .github/operation-intake/active-operation-ledger.v1.json

jobs:
  builder:
    name: command-emitted-projection-builder
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve canonical receipt and live Operation B lock
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CANONICAL_RECEIPT_HEAD"
          git show "$CANONICAL_RECEIPT_HEAD:$CANONICAL_RECEIPT_PATH" > /tmp/canonical-admission.json
          test "$(sha256sum /tmp/canonical-admission.json | awk '{print $1}')" = "$CANONICAL_RECEIPT_SHA256"
          git fetch --no-tags origin operation-locks/repository-operation-intake-v1
          git show FETCH_HEAD:"$LEDGER_PATH" > /tmp/live-ledger.json
          echo "LOCK_HEAD=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
      - name: Emit deterministic compatibility projection
        env:
          EXECUTION_HOLDER: CP10_REMOTE_ADMISSION_PROJECTION_BUILDER
        run: |
          set -euo pipefail
          mkdir -p /tmp/cp10-admission-projection/builder
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const canonicalBytes=fs.readFileSync('/tmp/canonical-admission.json');
          const canonical=JSON.parse(canonicalBytes);
          const ledger=JSON.parse(fs.readFileSync('/tmp/live-ledger.json','utf8'));
          const active=Object.values(ledger.activeScopes??{}).find(x=>x.operationId===process.env.BLOCKED_OPERATION_ID&&Number(x.lockGeneration)===Number(process.env.BLOCKED_LOCK_GENERATION));
          if(!active)throw Error('BLOCKED_OPERATION_LOCK_NOT_ACTIVE');
          if(active.lockScope!==process.env.BLOCKED_LOCK_SCOPE||active.state!=='ADMITTED_LOCKED'||active.released!==false)throw Error('BLOCKED_OPERATION_LOCK_NOT_EXECUTABLE');
          if(canonical.schema!=='REPOSITORY_OPERATION_ADMISSION_RECEIPT_v1'||canonical.result!=='ADMITTED_AND_LOCKED'||canonical.operationId!==process.env.BLOCKED_OPERATION_ID||canonical.projectId!=='H_EARTH')throw Error('CANONICAL_RECEIPT_IDENTITY_MISMATCH');
          const projection={
            ...canonical,
            lock:active,
            projectionSchema:'REPOSITORY_OPERATION_REMOTE_ADMISSION_EXECUTION_PROJECTION_v1',
            projectionResult:'CANONICAL_RECEIPT_AND_LIVE_LEDGER_BOUND',
            canonicalReceiptIdentity:{sourceClass:'REPOSITORY_PATH_AT_EXACT_HEAD',exactHead:process.env.CANONICAL_RECEIPT_HEAD,path:process.env.CANONICAL_RECEIPT_PATH,sha256:process.env.CANONICAL_RECEIPT_SHA256},
            canonicalRemoteLockReceipt:canonical.lock,
            liveLedgerIdentity:{lockRef:process.env.LOCK_REF,ledgerHead:process.env.LOCK_HEAD,ledgerPath:process.env.LEDGER_PATH,lockGeneration:Number(process.env.BLOCKED_LOCK_GENERATION)},
            implementationInferenceAuthorized:false,
            compatibilityProjectionOnly:true
          };
          const text=JSON.stringify(projection,null,2)+'\n';
          fs.writeFileSync('/tmp/cp10-admission-projection/builder/admission-projection.json',text);
          fs.writeFileSync('/tmp/cp10-admission-projection/builder/builder-metadata.json',JSON.stringify({schema:'CP10_REMOTE_ADMISSION_PROJECTION_EXECUTION_METADATA_v1',result:'PASS_CLOSED_PROJECTION_EMITTED',executionHolder:process.env.EXECUTION_HOLDER,projectionSha256:crypto.createHash('sha256').update(text).digest('hex'),canonicalReceiptSha256:process.env.CANONICAL_RECEIPT_SHA256,ledgerHead:process.env.LOCK_HEAD,blockedOperationStillActive:true,repositoryMutationPerformed:false,mergePerformed:false},null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: cp10-admission-projection-builder-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/cp10-admission-projection/builder/
          if-no-files-found: error
          retention-days: 90

  fresh-verifier:
    name: command-emitted-projection-fresh-verifier
    needs: builder
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: cp10-admission-projection-builder-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/builder
      - name: Independently resolve source identities
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CANONICAL_RECEIPT_HEAD"
          git show "$CANONICAL_RECEIPT_HEAD:$CANONICAL_RECEIPT_PATH" > /tmp/canonical-admission.json
          test "$(sha256sum /tmp/canonical-admission.json | awk '{print $1}')" = "$CANONICAL_RECEIPT_SHA256"
          git fetch --no-tags origin operation-locks/repository-operation-intake-v1
          git show FETCH_HEAD:"$LEDGER_PATH" > /tmp/live-ledger.json
          echo "LOCK_HEAD=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
      - name: Independently reproduce exact projection bytes
        env:
          EXECUTION_HOLDER: CP10_REMOTE_ADMISSION_PROJECTION_FRESH_VERIFIER
        run: |
          set -euo pipefail
          mkdir -p /tmp/cp10-admission-projection/verifier
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const canonical=JSON.parse(fs.readFileSync('/tmp/canonical-admission.json','utf8'));
          const ledger=JSON.parse(fs.readFileSync('/tmp/live-ledger.json','utf8'));
          const active=Object.values(ledger.activeScopes??{}).find(x=>x.operationId===process.env.BLOCKED_OPERATION_ID&&Number(x.lockGeneration)===Number(process.env.BLOCKED_LOCK_GENERATION));
          if(!active||active.lockScope!==process.env.BLOCKED_LOCK_SCOPE||active.state!=='ADMITTED_LOCKED'||active.released!==false)throw Error('BLOCKED_OPERATION_LOCK_NOT_EXECUTABLE');
          const projection={...canonical,lock:active,projectionSchema:'REPOSITORY_OPERATION_REMOTE_ADMISSION_EXECUTION_PROJECTION_v1',projectionResult:'CANONICAL_RECEIPT_AND_LIVE_LEDGER_BOUND',canonicalReceiptIdentity:{sourceClass:'REPOSITORY_PATH_AT_EXACT_HEAD',exactHead:process.env.CANONICAL_RECEIPT_HEAD,path:process.env.CANONICAL_RECEIPT_PATH,sha256:process.env.CANONICAL_RECEIPT_SHA256},canonicalRemoteLockReceipt:canonical.lock,liveLedgerIdentity:{lockRef:process.env.LOCK_REF,ledgerHead:process.env.LOCK_HEAD,ledgerPath:process.env.LEDGER_PATH,lockGeneration:Number(process.env.BLOCKED_LOCK_GENERATION)},implementationInferenceAuthorized:false,compatibilityProjectionOnly:true};
          const text=JSON.stringify(projection,null,2)+'\n';
          fs.writeFileSync('/tmp/cp10-admission-projection/verifier/admission-projection.json',text);
          fs.writeFileSync('/tmp/cp10-admission-projection/verifier/verifier-metadata.json',JSON.stringify({schema:'CP10_REMOTE_ADMISSION_PROJECTION_EXECUTION_METADATA_v1',result:'PASS_CLOSED_PROJECTION_REPRODUCED',executionHolder:process.env.EXECUTION_HOLDER,projectionSha256:crypto.createHash('sha256').update(text).digest('hex'),canonicalReceiptSha256:process.env.CANONICAL_RECEIPT_SHA256,ledgerHead:process.env.LOCK_HEAD,blockedOperationStillActive:true,repositoryMutationPerformed:false,mergePerformed:false},null,2)+'\n');
          NODE
          cmp /tmp/builder/admission-projection.json /tmp/cp10-admission-projection/verifier/admission-projection.json
      - uses: actions/upload-artifact@v4
        with:
          name: cp10-admission-projection-verifier-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/cp10-admission-projection/verifier/
          if-no-files-found: error
          retention-days: 90

  certify-and-close-repair:
    name: certify-projection-and-close-generation-66
    needs: [builder, fresh-verifier]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: cp10-admission-projection-builder-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/builder
      - uses: actions/download-artifact@v4
        with:
          name: cp10-admission-projection-verifier-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/verifier
      - name: Certify byte equality and distinct execution holders
        run: |
          set -euo pipefail
          cmp /tmp/builder/admission-projection.json /tmp/verifier/admission-projection.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import crypto from 'node:crypto';
          const b=JSON.parse(fs.readFileSync('/tmp/builder/builder-metadata.json','utf8')),v=JSON.parse(fs.readFileSync('/tmp/verifier/verifier-metadata.json','utf8'));
          if(b.executionHolder===v.executionHolder||b.projectionSha256!==v.projectionSha256)throw Error('INDEPENDENT_REPRODUCTION_MISMATCH');
          const bytes=fs.readFileSync('/tmp/builder/admission-projection.json');
          fs.writeFileSync('/tmp/certification.json',JSON.stringify({schema:'CP10_REMOTE_ADMISSION_PROJECTION_CERTIFICATION_v1',result:'PASS_CLOSED_INDEPENDENTLY_REPRODUCED',repairOperationId:process.env.REPAIR_OPERATION_ID,blockedOperationId:process.env.BLOCKED_OPERATION_ID,blockedLockGeneration:Number(process.env.BLOCKED_LOCK_GENERATION),projectionSha256:crypto.createHash('sha256').update(bytes).digest('hex'),builderHolder:b.executionHolder,verifierHolder:v.executionHolder,distinctExecutionHolders:true,canonicalReceiptPreservedAtPriorExactHead:true,activeResolverMutated:false,blockedOperationClosed:false,mergePerformed:false},null,2)+'\n');
          NODE
      - name: Confirm Operation B remains active before repair closure
        run: |
          set -euo pipefail
          git fetch --no-tags origin operation-locks/repository-operation-intake-v1
          git show FETCH_HEAD:"$LEDGER_PATH" > /tmp/pre-close-ledger.json
          node -e "const l=require('/tmp/pre-close-ledger.json');const x=Object.values(l.activeScopes||{}).find(x=>x.operationId===process.env.BLOCKED_OPERATION_ID&&Number(x.lockGeneration)===Number(process.env.BLOCKED_LOCK_GENERATION));if(!x||x.state!=='ADMITTED_LOCKED'||x.released!==false)process.exit(1)"
      - name: Close only compatibility repair generation 66
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if node tools/operation-intake/repository-operation-lock-manager.v1.mjs \
              --action close --repository "${{ github.repository }}" --lock-ref "$LOCK_REF" \
              --operation-id "$REPAIR_OPERATION_ID" --lock-scope "$REPAIR_LOCK_SCOPE" \
              --lock-generation "$REPAIR_LOCK_GENERATION" --terminal-disposition PASS_CLOSED \
              --output /tmp/repair-closure.json; then break; fi
            test "$attempt" -lt 3; sleep $((attempt * 2))
          done
          node -e "const r=require('/tmp/repair-closure.json');if(r.result!=='TERMINAL_CLOSURE_COMMITTED'||!r.lockReleased)process.exit(1)"
      - name: Verify Operation B generation 63 remains active after closure
        run: |
          set -euo pipefail
          git fetch --no-tags origin operation-locks/repository-operation-intake-v1
          git show FETCH_HEAD:"$LEDGER_PATH" > /tmp/post-close-ledger.json
          node -e "const l=require('/tmp/post-close-ledger.json');const x=Object.values(l.activeScopes||{}).find(x=>x.operationId===process.env.BLOCKED_OPERATION_ID&&Number(x.lockGeneration)===Number(process.env.BLOCKED_LOCK_GENERATION));if(!x||x.state!=='ADMITTED_LOCKED'||x.released!==false)process.exit(1)"
      - name: Package terminal projection evidence
        run: |
          mkdir -p /tmp/cp10-admission-projection/final
          cp /tmp/builder/admission-projection.json /tmp/cp10-admission-projection/final/
          cp /tmp/builder/builder-metadata.json /tmp/cp10-admission-projection/final/
          cp /tmp/verifier/verifier-metadata.json /tmp/cp10-admission-projection/final/
          cp /tmp/certification.json /tmp/cp10-admission-projection/final/
          cp /tmp/repair-closure.json /tmp/cp10-admission-projection/final/
      - uses: actions/upload-artifact@v4
        with:
          name: cp10-admission-projection-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/cp10-admission-projection/final/
          if-no-files-found: error
          retention-days: 90
