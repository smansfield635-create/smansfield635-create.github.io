name: H-Earth Run 8E R3F2-P3 Non-Production Publication Configuration

on:
  pull_request:
    branches:
      - agent/h-earth-run8e-r3f2-p2-exact-preview-package-materialization-001
    paths:
      - '.github/workflows/h-earth-run8e-r3f2-p3-non-production-publication-configuration.yml'
      - '.github/workflows/h-earth-run8e-r3f2-p4-immutable-preview-publication.yml'
      - 'h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3f2-p3.non-production-publication-configuration.js'
      - 'h-earth-3d/deployment/run-8e-r3f2/**'
      - 'h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.run8e-r3f2-p3-non-production-publication-configuration.js'
      - 'h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js'
      - 'h-earth-3d/validation/h-earth.run8e-r3f2-p3.non-production-publication-configuration.harness.mjs'
      - 'h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3f2-p3.pass-closed.receipt.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  H_EARTH_RUN8E_R3F2_P3_OUTPUT: /tmp/h-earth-run8e-r3f2-p3
  P2_BASE_HEAD: 75ecf5ad0b618318aea384c9422591425320de8f
  PREVIEW_ROOT: preview/h-earth/run8e/r3f2/sha256-3020154361523cf19113e4c759c234a6c74ff5a493b8e47124ca59470da7a234

jobs:
  validate-run8e-r3f2-p3-configuration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact P3 event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact P2 base and protected preview identities
        run: |
          set -euo pipefail
          git cat-file -e "${P2_BASE_HEAD}^{commit}"
          git merge-base --is-ancestor "$P2_BASE_HEAD" HEAD
          test "$(git rev-parse HEAD:h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3f2-p2.pass-closed.receipt.json)" = "203f960330da70e2947082ac356586caa5e166f0"
          test "$(git rev-parse HEAD:$PREVIEW_ROOT/index.html)" = "c5127e2d4d9d3558230a8eccd757dade74d6d8c3"
          test "$(git rev-parse HEAD:$PREVIEW_ROOT/preview-manifest.json)" = "81dbbb97898023ae0dabea313ac69b865302d533"
          test "$(git rev-parse HEAD:$PREVIEW_ROOT/device-evidence-receipt.schema.json)" = "987268f38fc8b6db6f19b982cc8386439aa0de48"
          git diff --exit-code "$P2_BASE_HEAD" -- "$PREVIEW_ROOT"

      - name: Verify P3 syntax and configuration boundary
        run: |
          set -euo pipefail
          node --check h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3f2-p3.non-production-publication-configuration.js
          node --check h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.run8e-r3f2-p3-non-production-publication-configuration.js
          node --check h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js
          node --check h-earth-3d/validation/h-earth.run8e-r3f2-p3.non-production-publication-configuration.harness.mjs
          node -e "JSON.parse(require('fs').readFileSync('h-earth-3d/deployment/run-8e-r3f2/h-earth.run8e-r3f2-p3.cloudflare-pages-direct-upload.config.json','utf8'))"
          if test -f h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3f2-p3.pass-closed.receipt.json; then
            node -e "JSON.parse(require('fs').readFileSync('h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3f2-p3.pass-closed.receipt.json','utf8'))"
          fi
          grep -q '^  workflow_dispatch:' .github/workflows/h-earth-run8e-r3f2-p4-immutable-preview-publication.yml
          if grep -Eq '^  (push|pull_request):' .github/workflows/h-earth-run8e-r3f2-p4-immutable-preview-publication.yml; then
            echo P3_AUTOMATIC_PUBLICATION_TRIGGER_PRESENT
            exit 1
          fi

      - name: Execute P3 configuration validation
        run: |
          set -euo pipefail
          rm -rf "$H_EARTH_RUN8E_R3F2_P3_OUTPUT"
          mkdir -p "$H_EARTH_RUN8E_R3F2_P3_OUTPUT"
          node h-earth-3d/validation/h-earth.run8e-r3f2-p3.non-production-publication-configuration.harness.mjs

      - name: Execute automatic repository-registry preflight
        run: |
          set -euo pipefail
          cat > /tmp/r3f2-p3-paths.txt <<'EOF'
          h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3f2-p3.non-production-publication-configuration.js
          h-earth-3d/deployment/run-8e-r3f2/h-earth.run8e-r3f2-p3.cloudflare-pages-direct-upload.config.json
          h-earth-3d/deployment/run-8e-r3f2/h-earth.run8e-r3f2-p3.cloudflare-pages.headers.txt
          h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.run8e-r3f2-p3-non-production-publication-configuration.js
          h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js
          h-earth-3d/validation/h-earth.run8e-r3f2-p3.non-production-publication-configuration.harness.mjs
          EOF
          if test -f h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3f2-p3.pass-closed.receipt.json; then
            echo h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3f2-p3.pass-closed.receipt.json >> /tmp/r3f2-p3-paths.txt
          fi
          node --experimental-default-type=module tools/h-earth-repository-registry-auto-preflight.mjs \
            --paths-file /tmp/r3f2-p3-paths.txt \
            --task 'Validate Run 8E R3F2-P3 non-production publication configuration without network publication' \
            --mutation-intent \
            --output "$H_EARTH_RUN8E_R3F2_P3_OUTPUT/h-earth.run8e-r3f2-p3.registry-preflight.receipt.json"

      - name: Verify exact P3 scope and P4 stopping boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed = {
            '.github/workflows/h-earth-run8e-r3f2-p3-non-production-publication-configuration.yml',
            '.github/workflows/h-earth-run8e-r3f2-p4-immutable-preview-publication.yml',
            'h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3f2-p3.non-production-publication-configuration.js',
            'h-earth-3d/deployment/run-8e-r3f2/h-earth.run8e-r3f2-p3.cloudflare-pages-direct-upload.config.json',
            'h-earth-3d/deployment/run-8e-r3f2/h-earth.run8e-r3f2-p3.cloudflare-pages.headers.txt',
            'h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.run8e-r3f2-p3-non-production-publication-configuration.js',
            'h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js',
            'h-earth-3d/validation/h-earth.run8e-r3f2-p3.non-production-publication-configuration.harness.mjs',
            'h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3f2-p3.pass-closed.receipt.json'
          }
          paths = set(subprocess.check_output(['git','diff','--name-only','75ecf5ad0b618318aea384c9422591425320de8f','HEAD'], text=True).splitlines())
          unexpected = sorted(paths - allowed)
          required = allowed - {'h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3f2-p3.pass-closed.receipt.json'}
          missing = sorted(required - paths)
          if unexpected: raise SystemExit(f'P3_UNEXPECTED_PATHS:{unexpected}')
          if missing: raise SystemExit(f'P3_MISSING_PATHS:{missing}')
          if len(paths) not in (8, 9): raise SystemExit(f'P3_PATH_COUNT_INVALID:{len(paths)}')
          if any(path.startswith('showroom/') or path == 'wrangler.toml' for path in paths): raise SystemExit('P3_LIVE_OR_GLOBAL_DEPLOYMENT_PATH_CHANGED')
          PY
          node - <<'NODE'
          const fs = require('fs');
          const receipt = JSON.parse(fs.readFileSync('/tmp/h-earth-run8e-r3f2-p3/h-earth.run8e-r3f2-p3.configuration.validation.receipt.json','utf8'));
          if (receipt.eligible !== true) throw new Error('P3_CONFIGURATION_NOT_ELIGIBLE');
          if (receipt.networkPublicationPerformed !== false || receipt.previewUrlIssued !== false) throw new Error('P3_PUBLICATION_BOUNDARY_VIOLATION');
          if (receipt.stoppingBoundary !== 'STOP_BEFORE_FIRST_NETWORK_PUBLICATION') throw new Error('P3_STOPPING_BOUNDARY_MISMATCH');
          NODE

      - name: Upload P3 configuration evidence
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-run8e-r3f2-p3-non-production-publication-configuration-evidence
          path: /tmp/h-earth-run8e-r3f2-p3
          if-no-files-found: error
          retention-days: 90
