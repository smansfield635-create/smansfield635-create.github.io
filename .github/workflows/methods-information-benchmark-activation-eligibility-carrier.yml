name: Methods Information Benchmark Activation Eligibility Carrier

on:
  push:
    branches:
      - control/methods-information-benchmark-activation-eligibility-v1-001
    paths:
      - control-plane/methods-information-benchmark/receipts/user-acceptance.receipt.v1.json
      - .github/workflows/methods-information-benchmark-activation-eligibility-carrier.yml
  pull_request:
    branches:
      - agent/methods-information-benchmark-pre-role-bootstrap-v1
    paths:
      - control-plane/methods-information-benchmark/receipts/user-acceptance.receipt.v1.json
      - .github/workflows/methods-information-benchmark-activation-eligibility-carrier.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: methods-information-benchmark-activation-eligibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: activation-eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXACT_CANDIDATE_HEAD: 3c303a49b4e90cf8672cd76f9f2c31041c2e56d1
      EXACT_BASE_HEAD: b1bd82abe9ab5f8a1535cf2e664c6d67ab91dc7f
      BOOTSTRAP_FINGERPRINT: 86597f327a3ad0b49a1f4580ed25f07a8032197f470490bcd060ed15d6e2cb54
      VERIFIER_WORKFLOW_RUN_ID: "30926342886"
      VERIFIER_ARTIFACT_ID: "8899242983"
      VERIFIER_ARTIFACT_NAME: methods-information-benchmark-independent-bootstrap-verifier-receipt-30926342886
      VERIFIER_ARTIFACT_SIZE_BYTES: "2655"
      VERIFIER_ARTIFACT_SHA256: f0cc59f5fc7209ab538316bfd28d8983d9b22e91d1c1f1f9dd05e4626759ed3c
      ACCEPTANCE_RECEIPT_COMMIT: b1ccae15d9896be46a1fd2c1109942b54192cf80
      ACCEPTANCE_RECEIPT_PATH: control-plane/methods-information-benchmark/receipts/user-acceptance.receipt.v1.json
      ACCEPTANCE_RECEIPT_GIT_BLOB: e58ffcc0231e7c5e656183e626c959852d7a80dc
      CARRIER_DEFINITION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact verified candidate head
        uses: actions/checkout@v4
        with:
          ref: 3c303a49b4e90cf8672cd76f9f2c31041c2e56d1
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up canonical execution class
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Assert exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "$EXACT_CANDIDATE_HEAD"
          git merge-base --is-ancestor "$EXACT_BASE_HEAD" "$EXACT_CANDIDATE_HEAD"
          test -z "$(git status --porcelain)"
          test "$(node -p 'process.versions.node.split(`.`)[0]')" = "22"
          test "$(node -p 'process.platform')" = "linux"
          test "$(node -p 'process.arch')" = "x64"
          printf '%s\n' "$EXACT_CANDIDATE_HEAD" > "$RUNNER_TEMP/executed-head.txt"

      - name: Authenticate and materialize user acceptance receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/contents/${ACCEPTANCE_RECEIPT_PATH}?ref=${ACCEPTANCE_RECEIPT_COMMIT}" \
            > "$RUNNER_TEMP/acceptance-metadata.json"

          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          metadata = json.loads((temp / "acceptance-metadata.json").read_text())
          assert metadata["path"] == os.environ["ACCEPTANCE_RECEIPT_PATH"]
          assert metadata["sha"] == os.environ["ACCEPTANCE_RECEIPT_GIT_BLOB"]
          receipt_bytes = base64.b64decode(metadata["content"])
          receipt_path = temp / "user-acceptance.json"
          receipt_path.write_bytes(receipt_bytes)
          receipt = json.loads(receipt_bytes)

          assert receipt["schema"] == "METHODS_INFORMATION_BENCHMARK_USER_ACCEPTANCE_RECEIPT_v1"
          assert receipt["originAuthority"] == "USER"
          assert receipt["repository"] == os.environ["GITHUB_REPOSITORY"]
          assert receipt["canonicalPullRequest"] == 551
          assert receipt["candidateHead"] == os.environ["EXACT_CANDIDATE_HEAD"]
          assert receipt["bootstrapFingerprint"] == os.environ["BOOTSTRAP_FINGERPRINT"]
          assert str(receipt["verifierArtifactId"]) == os.environ["VERIFIER_ARTIFACT_ID"]
          assert receipt["verifierArtifactSha256"] == os.environ["VERIFIER_ARTIFACT_SHA256"]
          assert receipt["decisionText"] == "Accept."
          assert receipt["accepted"] is True
          assert "AUTOMATICALLY_ASSIGN_ROLE_6" in receipt["notAuthorized"]
          assert "MERGE_PR_551" in receipt["notAuthorized"]
          assert "SELECT_CANONICAL_BENCHMARK" in receipt["notAuthorized"]
          (temp / "user-acceptance-sha256.txt").write_text(
              hashlib.sha256(receipt_bytes).hexdigest() + "\n"
          )
          PY

      - name: Authenticate canonical Verifier artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${VERIFIER_ARTIFACT_ID}" \
            > "$RUNNER_TEMP/verifier-artifact-metadata.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads((Path(os.environ["RUNNER_TEMP"]) / "verifier-artifact-metadata.json").read_text())
          assert str(metadata["id"]) == os.environ["VERIFIER_ARTIFACT_ID"]
          assert metadata["name"] == os.environ["VERIFIER_ARTIFACT_NAME"]
          assert str(metadata["size_in_bytes"]) == os.environ["VERIFIER_ARTIFACT_SIZE_BYTES"]
          assert metadata["expired"] is False
          assert metadata.get("digest") == f"sha256:{os.environ['VERIFIER_ARTIFACT_SHA256']}"
          workflow_run = metadata.get("workflow_run") or {}
          assert str(workflow_run.get("id")) == os.environ["VERIFIER_WORKFLOW_RUN_ID"]
          PY

      - name: Download and authenticate canonical Verifier artifact bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERIFIER_ZIP="$RUNNER_TEMP/verifier-artifact-${VERIFIER_ARTIFACT_ID}.zip"
          VERIFIER_DIR="$RUNNER_TEMP/verifier-evidence"
          mkdir -p "$VERIFIER_DIR"

          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${VERIFIER_ARTIFACT_ID}/zip" \
            > "$VERIFIER_ZIP"

          printf '%s  %s\n' "$VERIFIER_ARTIFACT_SHA256" "$VERIFIER_ZIP" | sha256sum --check -
          unzip -q "$VERIFIER_ZIP" -d "$VERIFIER_DIR"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["RUNNER_TEMP"]) / "verifier-evidence"
          expected = {
              "verification.json",
              "carrier-execution-receipt.json",
              "builder-artifact-metadata.json",
              "builder-receipt-sha256.txt",
              "executed-head.txt",
              "builder-execution-holder.txt",
              "verifier-execution-holder.txt",
          }
          actual = {
              str(path.relative_to(evidence))
              for path in evidence.rglob("*")
              if path.is_file()
          }
          assert actual == expected, {
              "missing": sorted(expected - actual),
              "unexpected": sorted(actual - expected),
          }

          receipt = json.loads((evidence / "verification.json").read_text())
          carrier = json.loads((evidence / "carrier-execution-receipt.json").read_text())
          assert receipt["schema"] == "METHODS_INFORMATION_BENCHMARK_BOOTSTRAP_VERIFICATION_RECEIPT_v2"
          assert receipt["candidateHead"] == os.environ["EXACT_CANDIDATE_HEAD"]
          assert receipt["baseHead"] == os.environ["EXACT_BASE_HEAD"]
          assert receipt["builderFingerprint"] == os.environ["BOOTSTRAP_FINGERPRINT"]
          assert receipt["verifierFingerprint"] == os.environ["BOOTSTRAP_FINGERPRINT"]
          assert receipt["fingerprintMatch"] is True
          assert receipt["distinctExecutionHolders"] is True
          assert receipt["originSeedIdentityMatch"] is True
          assert receipt["changedPathBlobMapMatch"] is True
          assert receipt["repairPerformed"] is False
          assert receipt["privateStateDependency"] is False
          assert receipt["pass"] is True
          assert (evidence / "executed-head.txt").read_text().strip() == os.environ["EXACT_CANDIDATE_HEAD"]
          assert carrier["canonicalVerifierPass"] is True
          assert carrier["candidateMutationPerformed"] is False
          assert carrier["permanentRoleAuthorityActivated"] is False
          assert carrier["mergePerformed"] is False
          PY

      - name: Run unmodified mechanical activation eligibility gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "$EXACT_CANDIDATE_HEAD"
          test -z "$(git status --porcelain)"

          node methods-information-benchmark/validation/pre-role-bootstrap/bootstrap.mjs \
            role-system-activation-gate \
            --receipt "$RUNNER_TEMP/verifier-evidence/verification.json" \
            --acceptance "$RUNNER_TEMP/user-acceptance.json" \
            --output "$RUNNER_TEMP/activation-eligibility.json"

      - name: Validate activation eligibility receipt and inactive boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          eligibility = json.loads((temp / "activation-eligibility.json").read_text())
          assert eligibility["schema"] == "METHODS_INFORMATION_BENCHMARK_ROLE_SYSTEM_ACTIVATION_GATE_RECEIPT_v2"
          assert eligibility["gateResult"] == "ELIGIBLE_FOR_SEPARATE_FIRST_ASSIGNMENT_OPERATION"
          assert eligibility["firstRoleCandidate"] == "ROLE_6_REQUIREMENTS_AND_CAUSAL_AUTHORITY"
          assert eligibility["automaticActivationPerformed"] is False
          assert eligibility["permanentRoleAuthorityActivated"] is False

          carrier = {
              "schema": "METHODS_INFORMATION_BENCHMARK_ACTIVATION_ELIGIBILITY_CARRIER_RECEIPT_v1",
              "carrierWorkflowRunId": os.environ["GITHUB_RUN_ID"],
              "carrierWorkflowRunAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "carrierDefinitionHead": os.environ["CARRIER_DEFINITION_HEAD"],
              "executedCandidateHead": os.environ["EXACT_CANDIDATE_HEAD"],
              "userAcceptanceCommit": os.environ["ACCEPTANCE_RECEIPT_COMMIT"],
              "userAcceptanceGitBlob": os.environ["ACCEPTANCE_RECEIPT_GIT_BLOB"],
              "verifierArtifactId": int(os.environ["VERIFIER_ARTIFACT_ID"]),
              "verifierArtifactSha256": os.environ["VERIFIER_ARTIFACT_SHA256"],
              "gateResult": eligibility["gateResult"],
              "firstRoleCandidate": eligibility["firstRoleCandidate"],
              "automaticActivationPerformed": eligibility["automaticActivationPerformed"],
              "permanentRoleAuthorityActivated": eligibility["permanentRoleAuthorityActivated"],
              "candidateMutationPerformed": False,
              "roleAssignmentPerformed": False,
              "mergePerformed": False,
          }
          (temp / "activation-eligibility-carrier-receipt.json").write_text(
              json.dumps(carrier, indent=2) + "\n"
          )
          PY

      - name: Prove no candidate mutation or role assignment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "$EXACT_CANDIDATE_HEAD"
          test -z "$(git status --porcelain)"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Upload activation eligibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: methods-information-benchmark-activation-eligibility-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/user-acceptance.json
            ${{ runner.temp }}/user-acceptance-sha256.txt
            ${{ runner.temp }}/activation-eligibility.json
            ${{ runner.temp }}/activation-eligibility-carrier-receipt.json
            ${{ runner.temp }}/verifier-artifact-metadata.json
            ${{ runner.temp }}/executed-head.txt
          if-no-files-found: error
          retention-days: 30
