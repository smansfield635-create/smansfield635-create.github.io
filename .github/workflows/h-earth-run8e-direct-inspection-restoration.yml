name: H-Earth Run 8E Direct Inspection Restoration

on:
  push:
    branches:
      - agent/h-earth-run8e-direct-inspection-restoration-001
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-run8e-direct-inspection-restoration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      H_EARTH_DIRECT_INSPECTION_URL: http://127.0.0.1:4173/showroom/globe/h-earth/
      H_EARTH_DIRECT_INSPECTION_OUTPUT: /tmp/h-earth-run8e-direct-inspection-restoration
    steps:
      - name: Check out direct-inspection workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize bounded restoration
        run: |
          set -euo pipefail
          node h-earth-3d/validation/h-earth.run8e-direct-inspection-restoration.idempotency-gate.mjs \
            2>&1 | tee /tmp/h-earth-run8e-direct-inspection-idempotency.log
          if [ ! -f /tmp/h-earth-run8e-direct-inspection-already-restored ]; then
            node h-earth-3d/validation/h-earth.run8e-direct-inspection-restoration.constructor.mjs \
              2>&1 | tee /tmp/h-earth-run8e-direct-inspection-constructor.log
          else
            echo 'Constructor skipped: exact restoration already present.' | \
              tee /tmp/h-earth-run8e-direct-inspection-constructor.log
          fi
          node h-earth-3d/validation/h-earth.run8e-direct-inspection-restoration.harness-accounting-fix.mjs \
            2>&1 | tee /tmp/h-earth-run8e-direct-inspection-harness-fix.log
          node h-earth-3d/validation/h-earth.run8e-direct-inspection-restoration.pointer-isolation-fix.mjs \
            2>&1 | tee /tmp/h-earth-run8e-direct-inspection-pointer-fix.log
          node h-earth-3d/validation/h-earth.run8e-direct-inspection-restoration.resize-dedup-fix.mjs \
            2>&1 | tee /tmp/h-earth-run8e-direct-inspection-resize-fix.log

      - name: Install bounded Chromium dependency
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Start bounded workspace server
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > /tmp/h-earth-run8e-direct-inspection-server.log 2>&1 &
          echo $! > /tmp/h-earth-run8e-direct-inspection-server.pid
          for attempt in $(seq 1 50); do
            if curl --fail --silent "$H_EARTH_DIRECT_INSPECTION_URL" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/h-earth-run8e-direct-inspection-server.log
          exit 1

      - name: Execute Samsung direct-inspection matrix
        run: |
          set -euo pipefail
          node h-earth-3d/validation/h-earth.run8e-direct-inspection-restoration.harness.mjs \
            2>&1 | tee /tmp/h-earth-run8e-direct-inspection-restoration.log

      - name: Verify bounded restoration scope
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          {
            git diff --name-only origin/main...HEAD
            git diff --name-only
            git ls-files --others --exclude-standard | grep -v '^node_modules/' || true
          } | sed '/^$/d' | sort -u > /tmp/h-earth-run8e-direct-inspection-paths.txt
          cat /tmp/h-earth-run8e-direct-inspection-paths.txt
          python3 - <<'PY'
          from pathlib import Path
          allowed = {
            '.github/workflows/h-earth-run8e-direct-inspection-restoration.yml',
            'h-earth-3d/validation/h-earth.run8e-direct-inspection-restoration.constructor.mjs',
            'h-earth-3d/validation/h-earth.run8e-direct-inspection-restoration.harness-accounting-fix.mjs',
            'h-earth-3d/validation/h-earth.run8e-direct-inspection-restoration.idempotency-gate.mjs',
            'h-earth-3d/validation/h-earth.run8e-direct-inspection-restoration.pointer-isolation-fix.mjs',
            'h-earth-3d/validation/h-earth.run8e-direct-inspection-restoration.resize-dedup-fix.mjs',
            'h-earth-3d/validation/h-earth.run8e-direct-inspection-restoration.harness.mjs',
            'h-earth-3d/validation/h-earth.run8e-direct-inspection-restoration.receipt.json',
            'showroom/globe/h-earth/index.html',
            'showroom/globe/h-earth/functional-landscape/environment-integration.js',
            'showroom/globe/h-earth/functional-landscape/direct-manipulation.js',
            'showroom/globe/h-earth/functional-landscape/mobile-navigation-controls.js',
            'h-earth-3d/control-plane/run-8/h-earth.run8e.integration-and-live-delivery.js',
            'h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.run8e-direct-inspection-restoration-scope.js',
            'h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js'
          }
          paths = {
            line.strip()
            for line in Path('/tmp/h-earth-run8e-direct-inspection-paths.txt').read_text().splitlines()
            if line.strip()
          }
          unexpected = sorted(paths - allowed)
          required_initial = {
            '.github/workflows/h-earth-run8e-direct-inspection-restoration.yml',
            'h-earth-3d/validation/h-earth.run8e-direct-inspection-restoration.constructor.mjs',
            'h-earth-3d/validation/h-earth.run8e-direct-inspection-restoration.harness-accounting-fix.mjs',
            'h-earth-3d/validation/h-earth.run8e-direct-inspection-restoration.idempotency-gate.mjs',
            'h-earth-3d/validation/h-earth.run8e-direct-inspection-restoration.pointer-isolation-fix.mjs',
            'h-earth-3d/validation/h-earth.run8e-direct-inspection-restoration.resize-dedup-fix.mjs',
            'h-earth-3d/validation/h-earth.run8e-direct-inspection-restoration.harness.mjs',
            'showroom/globe/h-earth/index.html',
            'showroom/globe/h-earth/functional-landscape/environment-integration.js',
            'showroom/globe/h-earth/functional-landscape/direct-manipulation.js',
            'showroom/globe/h-earth/functional-landscape/mobile-navigation-controls.js'
          }
          missing = sorted(required_initial - paths)
          if unexpected:
            raise SystemExit(f'UNEXPECTED_DIRECT_INSPECTION_PATHS:{unexpected}')
          if missing:
            raise SystemExit(f'MISSING_DIRECT_INSPECTION_PATHS:{missing}')
          if not 11 <= len(paths) <= 15:
            raise SystemExit(f'INVALID_DIRECT_INSPECTION_PATH_COUNT:{len(paths)}')
          PY

      - name: Persist exact restoration sources and receipt
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/h-earth-run8e-direct-inspection-restoration-001'
        run: |
          set -euo pipefail
          target='h-earth-3d/validation/h-earth.run8e-direct-inspection-restoration.receipt.json'
          candidate='/tmp/h-earth-run8e-direct-inspection-restoration/h-earth.run8e-direct-inspection-restoration.receipt.json'
          cp "$candidate" "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            showroom/globe/h-earth/index.html \
            showroom/globe/h-earth/functional-landscape/environment-integration.js \
            showroom/globe/h-earth/functional-landscape/direct-manipulation.js \
            showroom/globe/h-earth/functional-landscape/mobile-navigation-controls.js \
            h-earth-3d/validation/h-earth.run8e-direct-inspection-restoration.harness.mjs \
            "$target"
          if git diff --cached --quiet; then
            echo 'Exact direct-inspection restoration already persisted.'
            exit 0
          fi
          git commit -m 'Restore direct inspection and coalesce Run 8E rendering'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload restoration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-run8e-direct-inspection-restoration-evidence
          path: |
            /tmp/h-earth-run8e-direct-inspection-idempotency.log
            /tmp/h-earth-run8e-direct-inspection-constructor.log
            /tmp/h-earth-run8e-direct-inspection-harness-fix.log
            /tmp/h-earth-run8e-direct-inspection-pointer-fix.log
            /tmp/h-earth-run8e-direct-inspection-resize-fix.log
            /tmp/h-earth-run8e-direct-inspection-server.log
            /tmp/h-earth-run8e-direct-inspection-restoration.log
            /tmp/h-earth-run8e-direct-inspection-restoration
            /tmp/h-earth-run8e-direct-inspection-paths.txt
          if-no-files-found: error
          retention-days: 90
