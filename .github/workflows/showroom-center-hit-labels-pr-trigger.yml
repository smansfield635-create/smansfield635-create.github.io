name: Temporary Showroom Center Hit PR Trigger

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/showroom-center-hit-labels-temp.yml
      - .github/workflows/showroom-center-hit-labels-pr-trigger.yml
      - showroom/index.html
      - showroom/index.css
      - showroom/index.interactions.js

permissions:
  contents: write

jobs:
  construct-diagnose-and-persist:
    if: github.event.pull_request.head.ref == 'agent/showroom-compass-center-hit-labels-001'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out task branch
        uses: actions/checkout@v4
        with:
          ref: agent/showroom-compass-center-hit-labels-001
          fetch-depth: 0

      - name: Materialize bounded candidate when absent
        run: |
          set -euo pipefail
          if grep -Fq 'SHOWROOM_CENTER_HIT_PROJECTED_LABELS_20260726A' showroom/index.html; then
            echo 'Bounded production candidate already materialized.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/showroom-center-hit-labels-temp.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line == "          python3 - <<'PY'")
          end = next(i for i in range(start + 1, len(source)) if source[i] == '          PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end + 1]) + '\n'
          Path('/tmp/showroom-apply.sh').write_text(script)
          PY
          bash /tmp/showroom-apply.sh

      - name: Apply bounded mobile-scale and label-startup correction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('showroom/index.css')
          js_path = Path('showroom/index.interactions.js')
          css = css_path.read_text()
          js = js_path.read_text()

          mobile_old = '''    --showroom-center-size:\n      clamp(10.6rem, 48vw, 14.8rem);\n\n    --showroom-planet-size:\n      clamp(9.4rem, 42vw, 13rem);'''
          mobile_new = '''    --showroom-center-size:\n      clamp(9.35rem, 42vw, 12rem);\n\n    --showroom-planet-size:\n      clamp(8.15rem, 36vw, 10.8rem);'''
          tiny_old = '''    --showroom-center-size:\n      clamp(9.5rem, 53vw, 12.75rem);\n\n    --showroom-planet-size:\n      clamp(8.55rem, 47vw, 11.4rem);'''
          tiny_new = '''    --showroom-center-size:\n      clamp(9.1rem, 42vw, 11.5rem);\n\n    --showroom-planet-size:\n      clamp(7.9rem, 36vw, 10.2rem);'''

          if mobile_old in css:
              css = css.replace(mobile_old, mobile_new, 1)
          elif mobile_new not in css:
              raise SystemExit('MOBILE_SCALE_BASELINE_NOT_FOUND')

          if tiny_old in css:
              css = css.replace(tiny_old, tiny_new, 1)
          elif tiny_new not in css:
              raise SystemExit('TINY_SCALE_BASELINE_NOT_FOUND')

          startup_old = '''      attemptRuntimeActivation(\n        "startup"\n      );'''
          startup_new = '''      attemptRuntimeActivation(\n        "startup"\n      );\n\n      scheduleProjectedLabels();'''
          if startup_new not in js:
              if js.count(startup_old) != 1:
                  raise SystemExit(f'LABEL_STARTUP_BASELINE_COUNT:{js.count(startup_old)}')
              js = js.replace(startup_old, startup_new, 1)

          css_path.write_text(css)
          js_path.write_text(js)
          PY

      - name: Verify JavaScript and bounded identities
        run: |
          set -euo pipefail
          node --check showroom/index.interactions.js
          grep -F 'SHOWROOM_CENTER_HIT_PROJECTED_LABELS_20260726A' showroom/index.html
          grep -F 'clamp(9.35rem, 18vw, 14.25rem)' showroom/index.css
          grep -F 'clamp(8.15rem, 15.8vw, 12.35rem)' showroom/index.css
          grep -F 'clamp(9.1rem, 42vw, 11.5rem)' showroom/index.css
          grep -F 'clamp(7.9rem, 36vw, 10.2rem)' showroom/index.css
          grep -F 'frontProjectionOverridesCompass' showroom/index.interactions.js
          grep -F 'scheduleProjectedLabels();' showroom/index.interactions.js
          grep -F 'N · Story' showroom/index.interactions.js
          grep -F 'Unfinished World' showroom/index.interactions.js

      - name: Install Chromium runtime
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Execute Samsung-width browser diagnostics
        run: |
          set -euo pipefail
          mkdir -p .github/tmp
          python3 -m http.server 4173 >/tmp/showroom-center-hit-server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/showroom/ >/dev/null; then
              break
            fi
            sleep 1
          done
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 360, height: 800 },
              isMobile: true,
              hasTouch: true
            });
            const pageErrors = [];
            const consoleErrors = [];
            page.on('pageerror', error => pageErrors.push(String(error)));
            page.on('console', message => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });

            await page.goto('http://127.0.0.1:4173/showroom/', {
              waitUntil: 'domcontentloaded'
            });
            await page.waitForTimeout(8000);

            const constellation = await page.evaluate(() => {
              const controller = window.SHOWROOM_MIRRORLAND_CONSTELLATION_CONTROLLER;
              const center = document.querySelector('[data-showroom-center-layer]');
              const planet = document.querySelector('.showroom-planet-root');
              const control = document.querySelector('[data-showroom-compass-control]');
              const label = document.querySelector('.showroom-compass-control__label');
              const root = document.querySelector('[data-showroom-root]');
              let projection = [];
              try {
                projection = controller && typeof controller.getSemanticProjection === 'function'
                  ? controller.getSemanticProjection()
                  : [];
              } catch (_) {}
              return {
                controllerPresent: Boolean(controller),
                centerPresent: Boolean(center),
                planetPresent: Boolean(planet),
                centerWidth: center ? center.getBoundingClientRect().width : null,
                planetWidth: planet ? planet.getBoundingClientRect().width : null,
                controlPointerEvents: control ? getComputedStyle(control).pointerEvents : null,
                labelPointerEvents: label ? getComputedStyle(label).pointerEvents : null,
                labels: Array.from(document.querySelectorAll('[data-showroom-projected-label]:not([hidden])')).map(node => node.textContent.trim()).sort(),
                projectionCount: Array.from(projection || []).length,
                visibleProjectionCount: Array.from(projection || []).filter(record => record.visible !== false).length,
                frontProjectionCount: Array.from(projection || []).filter(record => record.visible !== false && record.depthLayer === 'front').length,
                rootDatasets: root ? {
                  controllerStatus: root.dataset.showroomControllerStatus,
                  compositorReady: root.dataset.showroomCompositorReady,
                  crystalsReady: root.dataset.showroomCrystalsReady,
                  interactionsStatus: root.dataset.showroomInteractionsStatus,
                  presentationMode: root.dataset.showroomPresentationMode,
                  semanticProjectionRevision: root.dataset.showroomSemanticProjectionRevision
                } : null
              };
            });

            let cardinalRequest = false;
            try {
              cardinalRequest = await page.evaluate(() => {
                const controller = window.SHOWROOM_MIRRORLAND_CONSTELLATION_CONTROLLER;
                return Boolean(controller && controller.requestCardinalSelection('north'));
              });
            } catch (_) {}
            await page.waitForTimeout(3000);

            const cluster = await page.evaluate(() => ({
              labels: Array.from(document.querySelectorAll('[data-showroom-projected-label]:not([hidden])')).map(node => node.textContent.trim()).sort(),
              rootMode: document.querySelector('[data-showroom-root]')?.dataset.showroomPresentationMode || '',
              activeCluster: document.querySelector('[data-showroom-root]')?.dataset.showroomActiveCluster || ''
            }));

            const expectedCardinals = ['E · Characters', 'N · Story', 'S · Wonders', 'W · Mysteries'].sort();
            const expectedCluster = ['Invitation', 'Mission', 'Timeline', 'Welcome'].sort();
            const pass = Boolean(
              constellation.controllerPresent &&
              constellation.centerWidth !== null && constellation.centerWidth <= 165 &&
              constellation.planetWidth !== null && constellation.planetWidth <= 145 &&
              constellation.controlPointerEvents === 'none' &&
              constellation.labelPointerEvents === 'auto' &&
              JSON.stringify(constellation.labels) === JSON.stringify(expectedCardinals) &&
              cardinalRequest &&
              JSON.stringify(cluster.labels) === JSON.stringify(expectedCluster) &&
              pageErrors.length === 0
            );

            const receipt = {
              schema: 'SHOWROOM_CENTER_HIT_PROJECTED_LABELS_BROWSER_DIAGNOSTIC_v2',
              pass,
              viewport: { width: 360, height: 800, mobile: true, touch: true },
              constellation,
              cardinalRequest,
              cluster,
              pageErrors,
              consoleErrors
            };
            fs.writeFileSync(
              '.github/tmp/showroom-center-hit-labels-diagnostic.json',
              JSON.stringify(receipt, null, 2) + '\n'
            );
            console.log(JSON.stringify(receipt, null, 2));
            await browser.close();
          })().catch(error => {
            const receipt = {
              schema: 'SHOWROOM_CENTER_HIT_PROJECTED_LABELS_BROWSER_DIAGNOSTIC_v2',
              pass: false,
              fatalError: String(error && (error.stack || error.message || error))
            };
            fs.writeFileSync(
              '.github/tmp/showroom-center-hit-labels-diagnostic.json',
              JSON.stringify(receipt, null, 2) + '\n'
            );
            console.error(receipt.fatalError);
          });
          NODE

      - name: Commit bounded candidate and diagnostic
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189828+github-actions[bot]@users.noreply.github.com'
          git add showroom/index.html showroom/index.css showroom/index.interactions.js .github/tmp/showroom-center-hit-labels-diagnostic.json
          if git diff --cached --quiet; then
            echo 'No candidate or diagnostic delta remains.'
            exit 0
          fi
          git commit -m 'Correct Showroom mobile scale and projected-label startup'
          git push origin HEAD:agent/showroom-compass-center-hit-labels-001
