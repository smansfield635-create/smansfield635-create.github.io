name: Bounded H-Earth camera envelope candidate builder

on:
  push:
    branches:
      - agent/h-earth-camera-envelope-animation-standard-001
    paths:
      - .github/workflows/h-earth-camera-envelope-animation-standard-builder.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/h-earth-camera-envelope-animation-standard-001
          fetch-depth: 0

      - name: Patch capacity source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('showroom/globe/h-earth/capacity.js')
          s = p.read_text(encoding='utf-8')

          def once(old, new, name):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{name}: expected 1 occurrence, found {n}')
              s = s.replace(old, new, 1)

          once(
              "  ownsCameraCapacity: true,\n  ownsNavigationCapacity: true,",
              "  ownsCameraCapacity: true,\n  ownsLivingPresentationCapacity: true,\n  ownsNavigationCapacity: true,",
              'capacity ownership'
          )
          once(
              "  ownsProjectionMathematics: false,\n  ownsProjectedPrimitiveConstruction: false,",
              "  ownsProjectionMathematics: false,\n  ownsLivingPresentationRuntime: false,\n  ownsProjectedPrimitiveConstruction: false,",
              'runtime nonownership'
          )
          once(
              " * Camera capacity.\n */\nexport const H_EARTH_3D_CAMERA_CAPACITY = deepFreeze({",
              " * Camera capacity.\n */\nexport const H_EARTH_3D_CAMERA_ENVELOPE_CORRECTION_ID =\n  'H_EARTH_LANDWARD_GROUND_INSPECTION_CAMERA_ENVELOPE_v1';\n\nexport const H_EARTH_3D_CAMERA_CAPACITY = deepFreeze({",
              'camera correction identity'
          )
          once("      y: 24,\n      z: 64", "      y: 14,\n      z: -240", 'camera position')
          once("      y: 0.5,\n      z: -128", "      y: 0.6,\n      z: -48", 'camera target')
          once("    verticalFovDegrees: 52,", "    verticalFovDegrees: 60,", 'camera fov')
          once("    farPlane: 194,", "    farPlane: 512,", 'camera far plane')
          once(
              "    projectionAuthority:\n      'RENDERER'\n  }),\n\n  futureControllerCapacity:",
              "    projectionAuthority:\n      'RENDERER'\n  }),\n\n  initialCompositionIntent: deepFreeze({\n    compositionId:\n      H_EARTH_3D_CAMERA_ENVELOPE_CORRECTION_ID,\n    compositionRole:\n      'LANDWARD_GROUND_INSPECTION_LOOKING_WATERWARD',\n    cameraSide: 'LAND_SIDE_NEGATIVE_Z',\n    viewDirection: 'TOWARD_POSITIVE_Z_WATER_SIDE',\n    shorelineReferenceZ: -96,\n    wetSandForegroundRequired: true,\n    foamContactSeamRequired: true,\n    waterRecessionRequired: true,\n    futureContextDepthReserved: true,\n    admittedGeometryMutationPermitted: false,\n    animationStandardPreparationOnly: true\n  }),\n\n  futureControllerCapacity:",
              'composition intent'
          )

          living = r'''/**
 * Bounded living-presentation capacity.
 * Defines presentation limits only; it creates no animation runtime or
 * physical simulation and may not alter admitted geometry.
 */
export const H_EARTH_3D_LIVING_PRESENTATION_CAPACITY_ID =
  'H_EARTH_MINIMUM_SHORELINE_LIVING_PRESENTATION_CAPACITY_v1';

export const H_EARTH_3D_LIVING_PRESENTATION_CAPACITY = deepFreeze({
  capacityId: H_EARTH_3D_LIVING_PRESENTATION_CAPACITY_ID,
  status: 'CAPACITY_STANDARD_DEFINED_RUNTIME_NOT_CREATED',
  sourceObjectIds: deepFreeze([
    'OBJ_002_FOREGROUND_WET_SAND',
    'OBJ_005_SHORELINE_FOAM_LINE',
    'OBJ_007_WATER_SURFACE_PLANE'
  ]),
  geometryBoundary: deepFreeze({
    admittedGeometryMutationPermitted: false,
    admittedVertexMutationPermitted: false,
    admittedIndexMutationPermitted: false,
    admittedBoundsMutationPermitted: false,
    primitiveIdentityMutationPermitted: false,
    sourceObjectIdentityMutationPermitted: false,
    sharedShorelineBoundaryMutationPermitted: false,
    materialPresentationMutationPermitted: true
  }),
  scheduler: deepFreeze({
    singleCoordinatorRequired: true,
    requestAnimationFrameRequired: true,
    maximumActiveFramesPerSecond: 30,
    maximumMainThreadWorkMillisecondsPerFrame: 8,
    unboundedTimersPermitted: false,
    duplicateAnimationLoopsPermitted: false,
    deterministicPhaseSeedsRequired: true
  }),
  suspension: deepFreeze({
    suspendWhenDocumentHidden: true,
    suspendWhenStageOffscreen: true,
    suspendOnPageHide: true,
    controlledResumeRequired: true,
    backgroundAnimationWorkPermitted: false
  }),
  reducedMotion: deepFreeze({
    operatingSystemPreferenceRequired: true,
    staticEquivalentRequired: true,
    animationLoopsMustStop: true,
    timersMustStop: true,
    semanticInformationMustRemainAvailable: true
  }),
  permittedMotionChannels: deepFreeze([
    'TRANSFORM',
    'OPACITY',
    'BACKGROUND_POSITION',
    'BOUNDED_CSS_CUSTOM_PROPERTY'
  ]),
  prohibitedMotionChannels: deepFreeze([
    'LAYOUT_GEOMETRY',
    'DOM_NODE_CHURN',
    'ADMITTED_VERTEX_REWRITE',
    'ADMITTED_INDEX_REWRITE',
    'SHORELINE_BOUNDARY_REWRITE',
    'PHYSICAL_FLUID_SIMULATION'
  ]),
  materialMotionIntent: deepFreeze({
    wetSand: 'SUBTLE_REFLECTED_LIGHT_AND_DAMP_SHEEN_VARIATION',
    foam: 'GENTLE_CONTACT_BRIGHTNESS_AND_LATERAL_PHASE_MOTION',
    water: 'SLOW_SURFACE_SHIMMER_AND_DIRECTIONAL_HIGHLIGHT_DRIFT'
  }),
  qualityCapacity: deepFreeze({
    maximumConcurrentMaterialAnimations: 3,
    devicePixelRatioMustRemainWithinViewportCapacity: true,
    adaptiveQualityPermitted: true,
    frameCostSamplingRequired: true,
    qualityMayDecreaseToProtectFrameBudget: true
  }),
  lifecycleStates: deepFreeze([
    'IDLE', 'RUNNING', 'SUSPENDED', 'REDUCED_MOTION_STATIC', 'DISPOSED'
  ]),
  claimCeilings: deepFreeze({
    animationRuntimeCreated: false,
    animationExecuted: false,
    fluidSimulationCreated: false,
    physicalWaveSimulationCreated: false,
    weatherSimulationCreated: false,
    traversalCreated: false,
    gameplayCreated: false,
    visualPassClaim: false,
    productionClaim: false
  })
});

'''
          once("/**\n * Render-stage limits.\n */", living + "/**\n * Render-stage limits.\n */", 'living capacity')
          once(
              "  fluidSimulationClaim: false,\n\n  matrixCollapse: false",
              "  fluidSimulationClaim: false,\n  livingPresentationRuntimeClaim: false,\n  animationExecutionClaim: false,\n  physicalSimulationClaim: false,\n\n  matrixCollapse: false",
              'claim ceilings'
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Audit source custody and execute candidate
        shell: bash
        run: |
          BASE="$(git merge-base HEAD origin/main)"
          node --experimental-default-type=module --check showroom/globe/h-earth/capacity.js
          git diff --exit-code "$BASE" -- \
            showroom/globe/h-earth/environment.js \
            showroom/globe/h-earth/render/geometry-preview.js \
            showroom/globe/h-earth/render/geometry-ground.js \
            showroom/globe/h-earth/render/geometry-foam.js \
            showroom/globe/h-earth/render/geometry-water.js \
            showroom/globe/h-earth/render/shoreline-preview.js \
            showroom/globe/h-earth/render/geometry-kernel.js \
            showroom/globe/h-earth/render/geometry-kernel.north.js \
            showroom/globe/h-earth/render/geometry-kernel.east.js \
            showroom/globe/h-earth/render/geometry-kernel.south.js \
            showroom/globe/h-earth/render/geometry-kernel.west.js \
            showroom/globe/h-earth/admitted-geometry-frame.js

          node --experimental-default-type=module --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {
            H_EARTH_3D_CAMERA_CAPACITY,
            H_EARTH_3D_CAMERA_ENVELOPE_CORRECTION_ID,
            H_EARTH_3D_LIVING_PRESENTATION_CAPACITY,
            H_EARTH_3D_LIVING_PRESENTATION_CAPACITY_ID,
            evaluateHEarth3DCameraCapacity
          } from './showroom/globe/h-earth/capacity.js';
          import { H_EARTH_3D_SHARED_SHORELINE_BOUNDARY as boundary }
            from './showroom/globe/h-earth/environment.js';
          import {
            H_EARTH_3D_MINIMUM_NATIVE_SHORELINE_OBJECT_IDS,
            previewHEarthMinimumShorelineGeometry
          } from './showroom/globe/h-earth/render/shoreline-preview.js';

          let count = 0;
          const pass = (condition, id) => {
            assert.equal(Boolean(condition), true, id);
            count += 1;
          };
          const camera = H_EARTH_3D_CAMERA_CAPACITY.initialProjectionCandidate;
          const intent = H_EARTH_3D_CAMERA_CAPACITY.initialCompositionIntent;
          const shorelineZ = boundary.samples.reduce((n, s) => n + s.z, 0) / boundary.samples.length;

          pass(H_EARTH_3D_CAMERA_ENVELOPE_CORRECTION_ID ===
            'H_EARTH_LANDWARD_GROUND_INSPECTION_CAMERA_ENVELOPE_v1', 'camera identity');
          pass(camera.position.x === 0 && camera.position.y === 14 && camera.position.z === -240,
            'camera position');
          pass(camera.target.x === 0 && camera.target.y === 0.6 && camera.target.z === -48,
            'camera target');
          pass(camera.verticalFovDegrees === 60 && camera.nearPlane === 0.25 && camera.farPlane === 512,
            'camera lens');
          pass(camera.position.z < shorelineZ && camera.target.z > shorelineZ,
            'land-to-water orientation');
          pass(intent.admittedGeometryMutationPermitted === false &&
            intent.futureContextDepthReserved === true, 'composition boundaries');

          const evaluated = evaluateHEarth3DCameraCapacity({
            yawDegrees: 0,
            pitchDegrees: 0,
            zoomScale: 1,
            target: camera.target,
            verticalFovDegrees: camera.verticalFovDegrees,
            nearPlane: camera.nearPlane,
            farPlane: camera.farPlane
          });
          pass(evaluated.eligible === true && evaluated.adjustmentRequired === false,
            'camera capacity evaluation');

          const sub = (a,b) => ({x:a.x-b.x,y:a.y-b.y,z:a.z-b.z});
          const dot = (a,b) => a.x*b.x+a.y*b.y+a.z*b.z;
          const cross = (a,b) => ({x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x});
          const norm = (v) => { const n=Math.hypot(v.x,v.y,v.z); return {x:v.x/n,y:v.y/n,z:v.z/n}; };
          const f = norm(sub(camera.target,camera.position));
          const r = norm(cross(f,camera.up));
          const u = norm(cross(r,f));
          pass(f.z > 0.99, 'positive-z view direction');

          const project = (p, aspect) => {
            const q=sub(p,camera.position), d=dot(q,f);
            const t=Math.tan(camera.verticalFovDegrees*Math.PI/360);
            return {d,x:dot(q,r)/(d*t*aspect),y:dot(q,u)/(d*t)};
          };
          const anchors = [
            {x:0,y:0,z:-210},
            {x:0,y:0.79,z:shorelineZ},
            {x:0,y:0.68,z:-48},
            {x:0,y:10,z:192}
          ];
          for (const aspect of [0.5625,1.6]) {
            for (const anchor of anchors) {
              const p=project(anchor,aspect);
              pass(p.d>=camera.nearPlane && p.d<=camera.farPlane &&
                Math.abs(p.x)<=1 && Math.abs(p.y)<=1, 'composition anchor visibility');
            }
          }

          pass(H_EARTH_3D_LIVING_PRESENTATION_CAPACITY_ID ===
            'H_EARTH_MINIMUM_SHORELINE_LIVING_PRESENTATION_CAPACITY_v1', 'living capacity identity');
          pass(Object.isFrozen(H_EARTH_3D_LIVING_PRESENTATION_CAPACITY), 'living capacity frozen');
          pass(H_EARTH_3D_LIVING_PRESENTATION_CAPACITY.scheduler.maximumActiveFramesPerSecond === 30 &&
            H_EARTH_3D_LIVING_PRESENTATION_CAPACITY.scheduler.maximumMainThreadWorkMillisecondsPerFrame === 8,
            'bounded scheduler');
          pass(H_EARTH_3D_LIVING_PRESENTATION_CAPACITY.suspension.suspendWhenDocumentHidden === true &&
            H_EARTH_3D_LIVING_PRESENTATION_CAPACITY.suspension.suspendWhenStageOffscreen === true,
            'suspension standard');
          pass(H_EARTH_3D_LIVING_PRESENTATION_CAPACITY.reducedMotion.staticEquivalentRequired === true,
            'reduced motion standard');
          pass(H_EARTH_3D_LIVING_PRESENTATION_CAPACITY.geometryBoundary.admittedGeometryMutationPermitted === false,
            'geometry mutation prohibited');
          pass(H_EARTH_3D_LIVING_PRESENTATION_CAPACITY.claimCeilings.animationRuntimeCreated === false &&
            H_EARTH_3D_LIVING_PRESENTATION_CAPACITY.claimCeilings.fluidSimulationCreated === false,
            'runtime and simulation withheld');

          const preview = previewHEarthMinimumShorelineGeometry({
            sourceObjectId: 'OBJ_002_FOREGROUND_WET_SAND',
            requestedPurpose: 'MINIMUM_NATIVE_SHORELINE_GEOMETRY_PREVIEW',
            requestId: 'H_EARTH_CAMERA_ENVELOPE_EXECUTION_AUDIT_001',
            shorelineBoundary: boundary
          });
          pass(preview.ok === true && preview.primitives.length === 3, 'preview execution');
          pass(JSON.stringify(preview.sourceObjectIds) ===
            JSON.stringify(H_EARTH_3D_MINIMUM_NATIVE_SHORELINE_OBJECT_IDS), 'object identities');
          pass(preview.shorelineBoundary === boundary &&
            preview.shorelineBoundaryId === boundary.boundaryId, 'boundary occurrence');
          pass(preview.admitted === false && preview.WestAdmissionPerformed === false,
            'preview remains unadmitted');
          pass(preview.fluidSimulation === false, 'fluid simulation false');

          console.log(`H_EARTH_CAMERA_ENVELOPE_EXECUTION_AUDIT=PASS CHECKS=${count}`);
          NODE

      - name: Freeze audited candidate
        shell: bash
        run: |
          BLOB="$(git hash-object showroom/globe/h-earth/capacity.js)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/h-earth-camera-envelope-animation-standard-builder.yml
          git add showroom/globe/h-earth/capacity.js
          git commit -m "Correct H-Earth camera envelope and animation capacity" \
            -m "SOURCE_SYNTAX_AUDIT=PASS" \
            -m "GEOMETRY_SOURCE_CUSTODY=PASS_UNCHANGED_FROM_MERGE_BASE" \
            -m "EXECUTION_AUDIT=PASS" \
            -m "CAPACITY_CANDIDATE_GIT_BLOB=${BLOB}" \
            -m "ANIMATION_RUNTIME_CREATED=FALSE" \
            -m "MAIN_CHANGED=FALSE"
          git push origin HEAD:agent/h-earth-camera-envelope-animation-standard-001
