name: Capability Carousel Stability Audit v1
on:
  pull_request:
    paths:
      - '.github/workflows/capability-carousel-stability-audit-v1.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Audit live capability orbit stability
        run: |
          cat > .capability-audit.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const sizes=[{name:'phone',w:390,h:844},{name:'tablet',w:960,h:1536},{name:'desktop',w:1440,h:1000}];
          const reports=[];
          for(const s of sizes){
            const page=await browser.newPage({viewport:{width:s.w,height:s.h}});
            await page.goto('https://diamondgatebridge.com/?capability-audit='+Date.now(),{waitUntil:'networkidle',timeout:120000});
            await page.waitForTimeout(1200);
            const snap=()=>page.evaluate(()=>{
              const orbit=document.querySelector('.compass-capability-orbit');
              if(!orbit)return {missing:true};
              const rect=o=>{const r=o.getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom}};
              const sty=o=>{const c=getComputedStyle(o);return {display:c.display,visibility:c.visibility,opacity:+c.opacity,transform:c.transform,transition:c.transitionDuration,position:c.position,z:c.zIndex,pointer:c.pointerEvents,filter:c.filter}};
              const plaques=[...orbit.querySelectorAll('.compass-orbit-plaque')].map((el,i)=>({i,text:(el.innerText||'').trim().replace(/\s+/g,' ').slice(0,140),active:el.dataset.active||null,rect:rect(el),style:sty(el),cls:el.className,canvas:el.querySelector('canvas')?{rect:rect(el.querySelector('canvas')),style:sty(el.querySelector('canvas'))}:null}));
              const canvases=[...orbit.querySelectorAll('canvas')].map((el,i)=>({i,rect:rect(el),style:sty(el),parent:el.parentElement?.className||''}));
              const semantic=[...orbit.querySelectorAll('button,a,[role="button"],[tabindex]')].map((el,i)=>({i,text:(el.innerText||el.getAttribute('aria-label')||'').trim().replace(/\s+/g,' ').slice(0,120),rect:rect(el),style:sty(el),active:el.dataset.active||null,selected:el.getAttribute('aria-selected'),pressed:el.getAttribute('aria-pressed'),cls:el.className}));
              const visiblePlaques=plaques.filter(x=>x.style.display!=='none'&&x.style.visibility!=='hidden'&&x.style.opacity>.02&&x.rect.w>1&&x.rect.h>1);
              const visibleCanvas=canvases.filter(x=>x.style.display!=='none'&&x.style.visibility!=='hidden'&&x.style.opacity>.02&&x.rect.w>1&&x.rect.h>1);
              const descendants=[...orbit.querySelectorAll('*')].filter(el=>{const r=el.getBoundingClientRect(),c=getComputedStyle(el);return r.width>20&&r.height>20&&c.display!=='none'&&c.visibility!=='hidden'&&+c.opacity>.02}).map((el,i)=>({i,tag:el.tagName,cls:el.className||'',text:(el.innerText||'').trim().replace(/\s+/g,' ').slice(0,80),rect:rect(el),style:sty(el)}));
              return {missing:false,orbit:{rect:rect(orbit),style:sty(orbit),htmlClass:orbit.className},plaques,visiblePlaques,canvases,visibleCanvas,semantic,descendants,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};
            });
            const base=await snap(); if(base.missing)throw new Error(s.name+' ORBIT_MISSING');
            const idle=[]; let prev=base;
            for(const t of [150,350,750,1400]){await page.waitForTimeout(t-(idle.at(-1)?.t||0));const cur=await snap();const movement=[];for(let i=0;i<Math.min(prev.descendants.length,cur.descendants.length);i++){const a=prev.descendants[i],b=cur.descendants[i];if(a.tag===b.tag&&a.cls===b.cls){const d=Math.hypot(a.rect.x-b.rect.x,a.rect.y-b.rect.y);if(d>1.5)movement.push({i,d:+d.toFixed(2),tag:a.tag,cls:String(a.cls).slice(0,70)});}}idle.push({t,movement});prev=cur;}
            const orbitLoc=page.locator('.compass-capability-orbit');const box=await orbitLoc.boundingBox();let afterDrag=null;
            if(box){await page.mouse.move(box.x+box.width*.72,box.y+box.height*.55);await page.mouse.down();await page.mouse.move(box.x+box.width*.24,box.y+box.height*.55,{steps:10});await page.mouse.up();await page.waitForTimeout(900);afterDrag=await snap();}
            reports.push({size:s.name,base,idle,afterDrag}); await page.close();
          }
          console.log('CAPABILITY_AUDIT '+JSON.stringify(reports));
          const weaknesses=[];
          for(const r of reports){
            if(r.base.overflow>2)weaknesses.push([r.size,'horizontal-overflow',r.base.overflow]);
            if(r.base.visiblePlaques.length!==1)weaknesses.push([r.size,'visible-plaque-count',r.base.visiblePlaques.length]);
            if(r.base.plaques.filter(x=>x.active==='true').length!==1)weaknesses.push([r.size,'active-plaque-count',r.base.plaques.filter(x=>x.active==='true').length]);
            const drift=r.idle.flatMap(x=>x.movement);if(drift.length)weaknesses.push([r.size,'idle-drift',drift.slice(0,20)]);
            if(r.afterDrag){if(r.afterDrag.visiblePlaques.length!==1)weaknesses.push([r.size,'post-drag-visible-plaque-count',r.afterDrag.visiblePlaques.length]);if(r.afterDrag.plaques.filter(x=>x.active==='true').length!==1)weaknesses.push([r.size,'post-drag-active-plaque-count',r.afterDrag.plaques.filter(x=>x.active==='true').length]);}
            const vis=r.base.visibleCanvas.map(x=>Math.min(x.rect.w,x.rect.h)).filter(Boolean);if(vis.length>1&&Math.max(...vis)-Math.min(...vis)>24)weaknesses.push([r.size,'visible-canvas-size-imbalance',vis]);
          }
          console.log('WEAKNESSES '+JSON.stringify(weaknesses));
          await browser.close();
          NODE
          node ./.capability-audit.mjs
