name: Apply Laws Orbit Parity

on:
  push:
    branches:
      - agent/laws-orbit-main-compass-parity-001

permissions:
  contents: write

jobs:
  apply-orbit-parity:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Transplant Main Compass cluster geometry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('laws/index.crystals.js')
          source = path.read_text(encoding='utf-8')

          def replace_once(pattern, replacement, label):
              global source
              source, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one replacement, found {count}')

          replace_once(
              r'(cluster:\s*Object\.freeze\(\{\s*horizontalRadius:\s*)1\.04(\s*,\s*verticalRadius:\s*)0\.90(\s*,\s*depthRadius:\s*)0\.84(\s*,\s*)centerRadius:\s*0\.26\s*,\s*',
              r'\g<1>1.36\g<2>1.18\g<3>1.04\g<4>',
              'MAIN_COMPASS_CLUSTER_RADII'
          )

          replace_once(
              r'  function effectiveClusterQuaternion\(\s*localQuaternion\s*\) \{.*?\n  \}\n\n  function rotatedLawUnitVector\(\s*node,\s*localQuaternion\s*\) \{.*?\n  \}',
              '''  function rotatedLawUnitVector(
            node,
            localQuaternion
          ) {
            return normalizeVector(
              quaternionRotateVector(
                localQuaternion,
                node.sphereVector
              )
            );
          }''',
              'INDEPENDENT_CLUSTER_QUATERNION'
          )

          replace_once(
              r'  function sphericalLawPosition\(\s*node,\s*localQuaternion\s*\) \{.*?\n  \}\n\n  function setUniformScale',
              '''  function sphericalLawPosition(
            node,
            localQuaternion
          ) {
            const unit =
              rotatedLawUnitVector(
                node,
                localQuaternion
              );

            return {
              x:
                unit[0] *
                SPHERE.cluster
                  .horizontalRadius,

              y:
                unit[1] *
                SPHERE.cluster
                  .verticalRadius,

              z:
                unit[2] *
                SPHERE.cluster
                  .depthRadius,

              depth:
                (unit[2] + 1) / 2,

              primary:
                clamp(
                  (
                    dot(
                      unit,
                      clusterAnchorVector()
                    ) +
                    1
                  ) /
                    2,
                  0,
                  1
                )
            };
          }

          function setUniformScale''',
              'MAIN_COMPASS_SPHERICAL_POSITION'
          )

          replace_once(
              r'y:\s*sphere\.y\s*-\s*0\.06\s*,\s*z:\s*sphere\.z\s*\+\s*0\.14\s*,',
              '''y:
                         sphere.y,

                       z:
                         sphere.z,''',
              'REMOVE_MANUAL_YZ_NUDGES'
          )

          forbidden = (
              'centerRadius:',
              'effectiveClusterQuaternion(',
              'sphere.y - 0.06',
              'sphere.z + 0.14'
          )
          for token in forbidden:
              if token in source:
                  raise SystemExit(f'FORBIDDEN_ORBIT_DISTORTION_REMAINS:{token}')

          required = (
              'horizontalRadius:\n          1.36',
              'verticalRadius:\n          1.18',
              'depthRadius:\n          1.04',
              'quaternionRotateVector(\n        localQuaternion,',
              'sphere.y,',
              'sphere.z,'
          )
          for token in required:
              if token not in source:
                  raise SystemExit(f'MAIN_COMPASS_PARITY_TOKEN_MISSING:{token}')

          path.write_text(source, encoding='utf-8')
          PY

      - name: Validate JavaScript syntax and parity invariants
        shell: bash
        run: |
          node --check laws/index.crystals.js
          python - <<'PY'
          import math

          radii = (1.36, 1.18, 1.04)
          latitude_amplitude = 0.48
          latitude_frequency = 1.73
          count = 4
          vectors = []
          for index in range(count):
              longitude = (math.tau * index) / count - math.pi / 2
              latitude = math.sin((index + 0.5) * latitude_frequency) * latitude_amplitude
              cosine_latitude = math.cos(latitude)
              vector = (
                  math.cos(longitude) * cosine_latitude,
                  math.sin(latitude),
                  math.sin(longitude) * cosine_latitude,
              )
              length = math.sqrt(sum(component * component for component in vector))
              vectors.append(tuple(component / length for component in vector))

          positions = [
              (
                  vector[0] * radii[0],
                  vector[1] * radii[1],
                  vector[2] * radii[2],
              )
              for vector in vectors
          ]

          minimum_center_distance = min(
              math.sqrt(sum(component * component for component in position))
              for position in positions
          )
          minimum_pair_distance = min(
              math.dist(positions[left], positions[right])
              for left in range(count)
              for right in range(left + 1, count)
          )

          assert minimum_center_distance > 1.0, minimum_center_distance
          assert minimum_pair_distance > 1.25, minimum_pair_distance
          assert len({tuple(round(value, 9) for value in position) for position in positions}) == 4

          print('LAWS_ORBIT_PARITY_HARNESS=PASS')
          print(f'MINIMUM_CENTER_DISTANCE={minimum_center_distance:.6f}')
          print(f'MINIMUM_PAIR_DISTANCE={minimum_pair_distance:.6f}')
          PY

      - name: Commit only the Laws orbital correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-laws-orbit-parity.yml
          git add laws/index.crystals.js
          git commit -m "Align Laws clusters with Main Compass orbit geometry"
          git push
