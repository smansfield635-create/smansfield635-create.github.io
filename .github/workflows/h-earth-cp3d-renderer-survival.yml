name: H-Earth CP3D Renderer Survival

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h-earth-cp3d-renderer-survival.yml'

permissions:
  contents: read

jobs:
  cp3d-renderer-survival:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Diagnose exact frozen C3C2 preview boot
        env:
          PREVIEW_URL: https://diamondgatebridge.com/preview/h-earth/c3/4fdbbffb95018cec50372678d7631843249f52bd/
          FROZEN_SHA: 4fdbbffb95018cec50372678d7631843249f52bd
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--use-gl=swiftshader','--disable-dev-shm-usage']});
          const page=await browser.newPage({viewport:{width:694,height:747},deviceScaleFactor:1.5,isMobile:true,hasTouch:true});
          const consoleErrors=[],pageErrors=[],failures=[];
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
          page.on('pageerror',e=>pageErrors.push(String(e?.stack||e)));
          page.on('requestfailed',r=>failures.push({url:r.url(),failure:r.failure()}));
          const response=await page.goto(process.env.PREVIEW_URL,{waitUntil:'domcontentloaded',timeout:60000});
          const iframe=page.locator('iframe.candidate');
          await iframe.waitFor({state:'attached',timeout:30000});
          const src=await iframe.getAttribute('src');
          await page.waitForTimeout(20000);
          const frame=page.frames().find(f=>f.url().includes(process.env.FROZEN_SHA));
          const facts=frame?await frame.evaluate(()=>({
            href:location.href,
            ready:globalThis.H_EARTH_RUN8E_PUBLIC_ROUTE?.ready===true,
            snapshot:globalThis.H_EARTH_RUN8E_PUBLIC_ROUTE?.getSnapshot?.()??null,
            startup:globalThis.H_EARTH_RENDERER_STARTUP_DIAGNOSTICS?.getReceipt?.()??null,
            runtime:globalThis.H_EARTH_RUNTIME_DIAGNOSTICS?.getSnapshot?.()??null,
            moduleSrc:document.getElementById('h-earth-current-run8e-module')?.src??null
          })):null;
          console.log(JSON.stringify({http:response?.status()??null,src,frameUrl:frame?.url()??null,facts,consoleErrors,pageErrors,failures},null,2));
          await browser.close();
          NODE
