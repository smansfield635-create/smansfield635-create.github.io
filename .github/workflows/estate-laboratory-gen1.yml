name: Estate Laboratory Navigation Reconciliation Constructor

on:
  push:
    branches:
      - 'ESTATE_LABORATORY_NAVIGATION_RECONCILIATION_20260824_003'
    paths:
      - '.github/workflows/estate-laboratory-gen1.yml'
  pull_request:
    paths:
      - '.github/workflows/estate-laboratory-gen1.yml'

permissions:
  contents: write

jobs:
  construct-final-candidate:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact admitted branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Revalidate governing head and scope
        shell: bash
        run: |
          set -euo pipefail
          BASE='bc4078f8f884921e8c58fe5a30f6a7c9c577d6f0'
          test "$GITHUB_REF_NAME" = 'ESTATE_LABORATORY_NAVIGATION_RECONCILIATION_20260824_003'
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main^{commit})" = "$BASE"
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          allowed='^(index.html|site-guide/index.html|instruments/index.html|instruments/laboratory.js|showroom/globe/audralia/disposition/index.html|showroom/globe/audralia/disposition/laboratory.js|showroom/globe/audralia/diagnostic/index.html|showroom/globe/h-earth/diagnostic/index.html|showroom/globe/hearth/diagnostic/index.html|coherence-diagnostic/index.html|tools/estate-laboratory-gen1-verify.mjs|tools/h-earth-experience-anchor-gate.mjs|\.github/workflows/estate-laboratory-gen1.yml)$'
          changed="$(git diff --name-only "$BASE"...HEAD)"
          test -n "$changed"
          if printf '%s\n' "$changed" | grep -Ev "$allowed"; then
            echo 'ESTATE_LABORATORY_CONSTRUCTOR_OUT_OF_SCOPE_PATH' >&2
            exit 1
          fi
          for prohibited in showroom/globe/audralia/index.html showroom/globe/audralia/render.js showroom/globe/audralia/world_kernel.js evidence/readiness/governance-gen3-entitlement/evidence-identity.v1.json; do
            if printf '%s\n' "$changed" | grep -Fxq "$prohibited"; then
              echo "ESTATE_LABORATORY_CONSTRUCTOR_PROHIBITED_PATH:$prohibited" >&2
              exit 1
            fi
          done

      - name: Apply one-line Coherence Laboratory return
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('coherence-diagnostic/index.html')
          s=p.read_text()
          old='''      <nav class="route-links" aria-label="Route links">
        <a href="/">Compass</a>
        <a href="/showroom/globe/">Mirrorland</a>
        <a href="/gauges/">Triple G</a>
      </nav>'''
          new='''      <nav class="route-links" aria-label="Route links">
        <a href="/">Compass</a>
        <a href="/showroom/globe/">Mirrorland</a>
        <a href="/instruments/" data-estate-laboratory-return>Estate Laboratory</a>
        <a href="/gauges/">Triple G</a>
      </nav>'''
          count=s.count(old)
          if count != 1:
              raise SystemExit(f'COHERENCE_DIAGNOSTIC_RETURN_PATCH_MATCH_COUNT:{count}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check -- coherence-diagnostic/index.html
          test "$(git diff --numstat -- coherence-diagnostic/index.html | awk '{print $1":"$2}')" = '1:0'

      - name: Restore final read-only exact-head qualifier
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 'ESTATE_LABORATORY_NAVIGATION_RECONCILIATION_20260824_002:refs/remotes/origin/estate-laboratory-stale-002'
          git show refs/remotes/origin/estate-laboratory-stale-002:.github/workflows/estate-laboratory-gen1.yml > .github/workflows/estate-laboratory-gen1.yml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/estate-laboratory-gen1.yml')
          s=p.read_text()
          old='6419f78d2c048d51827bb6c631e557d83fe4f061'
          new='bc4078f8f884921e8c58fe5a30f6a7c9c577d6f0'
          count=s.count(old)
          if count < 1:
              raise SystemExit('FINAL_QUALIFIER_OLD_BASE_BINDING_NOT_FOUND')
          p.write_text(s.replace(old,new))
          PY
          grep -Fq 'bc4078f8f884921e8c58fe5a30f6a7c9c577d6f0' .github/workflows/estate-laboratory-gen1.yml
          ! grep -Fq '6419f78d2c048d51827bb6c631e557d83fe4f061' .github/workflows/estate-laboratory-gen1.yml

      - name: Prove static final candidate before write
        shell: bash
        run: |
          set -euo pipefail
          node tools/estate-laboratory-gen1-verify.mjs --static > "$RUNNER_TEMP/static-verification.json"
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/static-verification.json','utf8'));
          if(r.result!=='PASS'||r.canonicalLaboratoryRoute!=='/instruments/'||r.deepChamberReturnSemantics!==true||r.siteGuideInstrumentsIdentityReconciled!==true)process.exit(1);
          NODE

      - name: Commit only finalization bytes
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed" | grep -Fxq 'coherence-diagnostic/index.html'
          printf '%s\n' "$changed" | grep -Fxq '.github/workflows/estate-laboratory-gen1.yml'
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')" = '2'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- coherence-diagnostic/index.html .github/workflows/estate-laboratory-gen1.yml
          git commit -m 'Estate Laboratory: finalize Coherence return and exact-head qualifier [constructed]'
          git push origin "HEAD:$GITHUB_REF_NAME"
