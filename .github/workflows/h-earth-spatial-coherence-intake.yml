name: H-Earth Spatial Coherence Intake

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  intake:
    runs-on: ubuntu-24.04
    steps:
      - name: Mint private repository token
        id: private-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.PRIVATE_EXECUTION_APP_ID }}
          private-key: ${{ secrets.PRIVATE_EXECUTION_APP_PRIVATE_KEY }}
          owner: smansfield635-create
          repositories: geodiametrics1
          permission-contents: write
          permission-issues: read
      - name: Checkout private control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: smansfield635-create/geodiametrics1
          ref: 367f9f77c264c2eabe7398bfa1fdd0edcdbbb6ab
          token: ${{ steps.private-token.outputs.token }}
          path: private-control-plane
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch and execute canonical intake request
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ steps.private-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $PRIVATE_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' https://api.github.com/repos/smansfield635-create/geodiametrics1/issues/comments/5337975349 > "$RUNNER_TEMP/request-comment.json"
          python - <<'PY'
          import json,os
          c=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'request-comment.json')))
          marker='PRE_REGISTRATION_INTAKE_BRIDGE_REQUEST_V1'
          body=c['body']
          if not body.startswith(marker): raise SystemExit('INTAKE_MARKER_MISSING')
          env=json.loads(body[len(marker):].strip())
          for name,key in [('request','operationRequest'),('procedure','constructionProcedure')]:
            with open(os.path.join(os.environ['RUNNER_TEMP'],name+'.json'),'w') as f: json.dump(env[key],f,sort_keys=True,separators=(',',':')); f.write('\n')
          PY
          node private-control-plane/tools/operation-intake/repository-operation-intake.v1.mjs --request "$RUNNER_TEMP/request.json" --procedure "$RUNNER_TEMP/procedure.json" --repository smansfield635-create/geodiametrics1 --lock-ref refs/heads/operation-locks/repository-operation-intake-v1 --output "$RUNNER_TEMP/receipt.json"
          python - <<'PY' > "$RUNNER_TEMP/body.txt"
          import json,os
          r=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'receipt.json')))
          print('H_EARTH_SPATIAL_COHERENCE_INTAKE_RESULT_V1')
          for k in ['result','operationId','lockGeneration','scopeHash','requestDigest','procedureDigest','state']:
            print(f'{k}: {r.get(k)}')
          PY
          jq -n --rawfile body "$RUNNER_TEMP/body.txt" '{body:$body}' > "$RUNNER_TEMP/comment.json"
          curl --fail-with-body --silent --show-error -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' https://api.github.com/repos/$GITHUB_REPOSITORY/issues/1390/comments --data-binary "@$RUNNER_TEMP/comment.json" >/dev/null