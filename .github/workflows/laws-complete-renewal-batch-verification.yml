name: Laws complete renewal batch verification

on:
  push:
    branches:
      - agent/laws-complete-renewal-batch-001
    paths:
      - .github/workflows/laws-complete-renewal-batch-verification.yml
      - scripts/verify-laws-complete-renewal-batch.py
      - scripts/verify-laws-complete-renewal-batch-v2.py
      - scripts/laws_complete_renewal_batch_browser_verify.mjs
      - scripts/laws_complete_renewal_batch_browser_verify_v2.mjs
      - scripts/laws_complete_renewal_batch_polish.py
      - assets/laws-destination/renewal.js
      - assets/laws-destination/renewal-navigation.css
      - assets/laws-destination/renewal-batch.css
      - laws/**
      - frontier/energy/battery-coherence-study/index.html
  pull_request:
    types:
      - synchronize
      - ready_for_review
    branches:
      - main
    paths:
      - .github/workflows/laws-complete-renewal-batch-verification.yml
      - scripts/verify-laws-complete-renewal-batch.py
      - scripts/verify-laws-complete-renewal-batch-v2.py
      - scripts/laws_complete_renewal_batch_browser_verify.mjs
      - scripts/laws_complete_renewal_batch_browser_verify_v2.mjs
      - scripts/laws_complete_renewal_batch_polish.py
      - assets/laws-destination/renewal.js
      - assets/laws-destination/renewal-navigation.css
      - assets/laws-destination/renewal-batch.css
      - laws/**
      - frontier/energy/battery-coherence-study/index.html

permissions:
  contents: write

concurrency:
  group: laws-complete-renewal-batch-verification
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact Laws batch branch
        uses: actions/checkout@v4
        with:
          ref: agent/laws-complete-renewal-batch-001
          fetch-depth: 0

      - name: Fetch current main for mutation-boundary comparison
        run: git fetch origin main

      - name: Run complete public-layer authority and custody verification
        run: python3 scripts/verify-laws-complete-renewal-batch-v2.py

      - name: Install browser verifier
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start exact candidate server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/laws-complete-renewal-server.log 2>&1 &
          echo $! >/tmp/laws-complete-renewal-server.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/laws/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/laws-complete-renewal-server.log
          exit 1

      - name: Execute integrated visible-current-layer browser matrix
        run: node scripts/laws_complete_renewal_batch_browser_verify_v2.mjs

      - name: Materialize exact-head verification receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          static = json.loads(Path('artifacts/laws-complete-renewal-batch-verification/static-result.json').read_text(encoding='utf-8'))
          browser = json.loads(Path('artifacts/laws-complete-renewal-batch-verification/browser-result.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          receipt = {
              'contract': 'LAWS_COMPLETE_RENEWAL_BATCH_INTEGRATED_VERIFICATION_RECEIPT_v1',
              'status': 'PASS_ENGINEERING_PENDING_MERGE_AND_LIVE_USER_DIFFERENTIAL',
              'candidateHead': head,
              'workflowRunId': os.environ.get('GITHUB_RUN_ID'),
              'workflowRunAttempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'staticVerification': static,
              'browserVerification': {
                  key: browser[key]
                  for key in [
                      'status', 'childRoutes', 'integratedRoutes', 'batteryPublicSurfaces',
                      'profiles', 'profilePageExecutions', 'reducedMotionExecutions',
                      'staticNoJavaScriptExecutions', 'collapsibleNavigation',
                      'keyboardPointerTouchTabs', 'auditDisclosure',
                      'horizontalOverflow', 'browserErrors'
                  ]
              },
              'protectedBoundaries': {
                  'representativeHtmlMutations': 0,
                  'compassRuntimeMutations': 0,
                  'routeDeletions': 0,
                  'redirectsCreated': 0,
                  'frontierMutationsOutsideCompleteBatteryRecord': 0,
                  'evidenceStatusUpgrades': 0,
                  'claimCeilingUpgrades': 0,
              },
              'mergeAuthority': False,
              'liveUserDifferentialRequired': True,
              'checkpoint6Closure': False,
          }
          target = Path('laws/control-plane/renewal/laws-complete-renewal-batch-browser-verification-v1.json')
          target.write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(receipt, indent=2))
          PY

      - name: Commit passing verification receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add laws/control-plane/renewal/laws-complete-renewal-batch-browser-verification-v1.json
          git commit -m 'Record complete Laws chamber browser verification pass'
          git push origin HEAD:agent/laws-complete-renewal-batch-001

      - name: Upload complete verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laws-complete-renewal-batch-verification
          path: |
            artifacts/laws-complete-renewal-batch-verification/
            laws/control-plane/renewal/laws-complete-renewal-batch-browser-verification-v1.json
            /tmp/laws-complete-renewal-server.log
          if-no-files-found: warn
          retention-days: 14
