name: H-Earth Band-Limited Terrain Relief V2 Bootstrap

on:
  push:
    branches:
      - agent/h-earth-current-live-bandlimited-terrain-relief-v2-002
    paths:
      - .github/workflows/h-earth-bandlimited-relief-v2-bootstrap.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  build-validate-publish-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and verify canonical Role 6 package
        shell: bash
        run: |
          set -euo pipefail
          cat .role6-v2-package/part-* > /tmp/role6-package.b64
          base64 -d /tmp/role6-package.b64 > /tmp/role6-package.zip
          printf '%s  %s\n' '676534a0cc3f75ca518c4dcd2dcf23af96f19ab01b4a8d8881f61298d7f056cd' /tmp/role6-package.zip | sha256sum -c -
          rm -rf /tmp/role6-package
          mkdir -p /tmp/role6-package
          unzip -q /tmp/role6-package.zip -d /tmp/role6-package
          PKG=/tmp/role6-package/ROLE_6_H_EARTH_BAND_LIMITED_TERRAIN_RELIEF_V2_COMPLETE_PRESCRIPTION_v1
          (cd "$PKG" && sha256sum -c SHA256SUMS.txt)
          test "$(find "$PKG" -maxdepth 1 -type f | wc -l)" -eq 6
          echo "PKG=$PKG" >> "$GITHUB_ENV"
      - name: Verify exact accepted source custody
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 584cd0fce9fd4b631697ad904b39b70765258a2c HEAD
          test "$(git hash-object showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-round1-1f520809.js)" = de55609b0b0bd66601445a369c727ff7a6d7065d
          test "$(git hash-object showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js)" = 5eb1b6f2e72ac0525f608850234182b2c646f66f
          if git merge-base --is-ancestor 14e0f0ad03f9d6355b36d24a89e136bf3fe063aa HEAD 2>/dev/null; then
            echo 'FAILED_PR_524_LINEAGE_DETECTED' >&2
            exit 1
          fi
      - name: Generate exact V2 product files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/generated-role6-terrain-relief-v2
          node "$PKG/apply-role6-terrain-relief-v2.mjs" \
            showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-round1-1f520809.js \
            showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js \
            /tmp/generated-role6-terrain-relief-v2 \
            | tee /tmp/role6-transform-output.json
          cp /tmp/generated-role6-terrain-relief-v2/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js \
            showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js
          cp /tmp/generated-role6-terrain-relief-v2/live-gpu-binding.terrain-relief-v2.js \
            showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js
          cp /tmp/generated-role6-terrain-relief-v2/generated-output-manifest.json /tmp/generated-output-manifest.json
      - name: Validate exact source contract and ES modules
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js
          node --input-type=module --check < showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const rendererPath = 'showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js';
          const bindingPath = 'showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js';
          const acceptedPath = 'showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-round1-1f520809.js';
          const renderer = fs.readFileSync(rendererPath, 'utf8');
          const binding = fs.readFileSync(bindingPath, 'utf8');
          const index = fs.readFileSync('showroom/globe/h-earth/index.html', 'utf8');
          const accepted = fs.readFileSync(acceptedPath, 'utf8');
          const requiredRenderer = [
            "'H_EARTH_CURRENT_LIVE_BAND_LIMITED_TERRAIN_RELIEF_PRESENTATION_PROFILE_v2'",
            'vec3 perturbTerrainNormal(',
            'vec3 limitTerrainNormalDeviation(',
            '3.306939635357677',
            '2.7318196987737333',
            '2.243994752564138',
            '0.9271838545667874',
            '0.3746065934159120',
            'microReliefSignal=',
            'microReliefHeight=',
            '0.95*terrainReliefEnvelope',
            'geometricDiffuse-0.28',
            'geometricDiffuse+0.28',
            '0.85*terrainReliefEnvelope',
            'vRoleCode==1u?18.0:24.0',
            'mix(0.07,0.14,terrainReliefEnvelope)'
          ];
          for (const token of requiredRenderer) if (!renderer.includes(token)) throw new Error(`RENDERER_CONTRACT_MISSING:${token}`);
          const requiredBinding = [
            "const ADDITIVE_VISUAL_QUERY_KEY = 'visual';",
            "const ADDITIVE_VISUAL_QUERY_VALUE = 'terrain-relief-v2';",
            "'../../render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js';",
            "'../../render/persistent-live-renderer.run8e-r3c.cp2-round1-1f520809.js';",
            "'../../render/persistent-live-renderer.run8e-r3c.js';",
            'const selectedRendererModule = await import(selectedRendererPath);'
          ];
          for (const token of requiredBinding) if (!binding.includes(token)) throw new Error(`BINDING_CONTRACT_MISSING:${token}`);
          if (!index.includes("parameters.set('cp2', 'round1-1f520809')")) throw new Error('ACCEPTED_DEFAULT_CP2_PROMOTION_MISSING');
          const sha256 = text => crypto.createHash('sha256').update(text, 'utf8').digest('hex');
          const manifest = JSON.parse(fs.readFileSync('/tmp/generated-output-manifest.json', 'utf8'));
          if (manifest.outputs.renderer.sha256 !== sha256(renderer)) throw new Error('RENDERER_OUTPUT_SHA_MISMATCH');
          if (manifest.outputs.binding.sha256 !== sha256(binding)) throw new Error('BINDING_OUTPUT_SHA_MISMATCH');
          const acceptedGitBlob = crypto.createHash('sha1').update(`blob ${Buffer.byteLength(accepted)}\0`).update(accepted).digest('hex');
          if (acceptedGitBlob !== 'de55609b0b0bd66601445a369c727ff7a6d7065d') throw new Error('ACCEPTED_RENDERER_CHANGED');
          NODE
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Start exact-branch server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/h-earth-v2-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/showroom/globe/h-earth/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/h-earth-v2-server.log
          exit 1
      - name: Compile, link, render, and verify selector behavior
        shell: bash
        run: |
          cat > /tmp/verify-terrain-relief-v2.cjs <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          const CP2 = '../../render/persistent-live-renderer.run8e-r3c.cp2-round1-1f520809.js';
          const V2 = '../../render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js';
          async function runCase(browser, label, query, expectedPath, additive, cp2) {
            const context = await browser.newContext({ viewport: { width: 1280, height: 720 } });
            const page = await context.newPage();
            const consoleErrors = [], pageErrors = [], requestFailures = [];
            page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            page.on('pageerror', e => pageErrors.push(e.stack || e.message));
            page.on('requestfailed', r => requestFailures.push({ url: r.url(), error: r.failure()?.errorText ?? null }));
            const url = `http://127.0.0.1:4173/showroom/globe/h-earth/${query}`;
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => document.getElementById('h-earth-functional-landscape-route')?.dataset?.run8eReady === 'true' && typeof window.H_EARTH_RUN8E_PUBLIC_ROUTE?.getLiveGpuReceipt === 'function', null, { timeout: 120000 });
            const snapshot = await page.evaluate(() => {
              const root = document.getElementById('h-earth-functional-landscape-route');
              const canvas = document.getElementById('h-earth-functional-landscape-canvas');
              const receipt = window.H_EARTH_RUN8E_PUBLIC_ROUTE.getLiveGpuReceipt();
              const gl = canvas?.getContext?.('webgl2') ?? null;
              return { href: location.href, ready: root?.dataset?.run8eReady, error: root?.dataset?.run8eError, canvas: canvas instanceof HTMLCanvasElement, webgl: Boolean(gl), lost: gl?.isContextLost?.() ?? null, receipt };
            });
            const r = snapshot.receipt;
            const failures = [];
            if (response?.status() !== 200) failures.push(`HTTP_${response?.status()}`);
            if (snapshot.ready !== 'true' || snapshot.error === 'true') failures.push('RUNTIME_NOT_READY');
            if (!snapshot.canvas || !snapshot.webgl || snapshot.lost !== false) failures.push('WEBGL2_INVALID');
            if (r?.selectedRendererPath !== expectedPath) failures.push(`PATH:${r?.selectedRendererPath}`);
            if (r?.additiveVisualRequested !== additive) failures.push('ADDITIVE_FLAG');
            if (r?.liveDifferential?.requested !== cp2) failures.push('CP2_FLAG');
            if (r?.resources?.counters?.shaderCompileCount !== 4) failures.push(`SHADER_COMPILE:${r?.resources?.counters?.shaderCompileCount}`);
            if (r?.resources?.counters?.programLinkCount !== 2) failures.push(`PROGRAM_LINK:${r?.resources?.counters?.programLinkCount}`);
            if (r?.resources?.counters?.contextCreationCount !== 1) failures.push('CONTEXT_COUNT');
            if (r?.counters?.rendererInitializationCount !== 1) failures.push('RENDERER_COUNT');
            if ((r?.counters?.gpuFramebufferPresentationCount ?? 0) < 1) failures.push('NO_FRAME');
            if (r?.resources?.packageUploadedOnce !== true) failures.push('PACKAGE_UPLOAD');
            if (r?.resources?.resourceIdentityStable !== true) failures.push('RESOURCE_IDENTITY');
            if (r?.resources?.noPostInitializationResourceCreation !== true) failures.push('POST_INIT_RESOURCE');
            if (r?.resources?.noPostInitializationBufferUpload !== true) failures.push('POST_INIT_UPLOAD');
            const blockingConsole = consoleErrors.filter(x => !/favicon|404 \(File not found\)/i.test(x));
            const blockingRequests = requestFailures.filter(x => !/favicon/i.test(x.url));
            if (pageErrors.length) failures.push(`PAGE:${JSON.stringify(pageErrors)}`);
            if (blockingConsole.length) failures.push(`CONSOLE:${JSON.stringify(blockingConsole)}`);
            if (blockingRequests.length) failures.push(`REQUEST:${JSON.stringify(blockingRequests)}`);
            const result = { label, requestedUrl: url, finalUrl: snapshot.href, httpStatus: response?.status() ?? null, selectedRendererPath: r?.selectedRendererPath ?? null, additiveVisualRequested: r?.additiveVisualRequested ?? null, cp2Requested: r?.liveDifferential?.requested ?? null, shaderCompileCount: r?.resources?.counters?.shaderCompileCount ?? null, programLinkCount: r?.resources?.counters?.programLinkCount ?? null, visibleFrames: r?.counters?.gpuFramebufferPresentationCount ?? null, packageUploadedOnce: r?.resources?.packageUploadedOnce ?? null, resourceIdentityStable: r?.resources?.resourceIdentityStable ?? null, noPostInitializationResourceCreation: r?.resources?.noPostInitializationResourceCreation ?? null, noPostInitializationBufferUpload: r?.resources?.noPostInitializationBufferUpload ?? null, failures };
            await context.close();
            if (failures.length) throw new Error(`${label}:${failures.join('|')}`);
            return result;
          }
          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist', '--disable-dev-shm-usage'] });
            const results = [];
            try {
              results.push(await runCase(browser, 'ACCEPTED_DEFAULT', '', CP2, false, true));
              results.push(await runCase(browser, 'EXPLICIT_CP2', '?cp2=round1-1f520809', CP2, false, true));
              results.push(await runCase(browser, 'V2_QUERY', '?visual=terrain-relief-v2', V2, true, true));
              results.push(await runCase(browser, 'V2_PRECEDENCE', '?cp2=round1-1f520809&visual=terrain-relief-v2', V2, true, true));
            } finally { await browser.close(); }
            const manifest = JSON.parse(fs.readFileSync('/tmp/generated-output-manifest.json', 'utf8'));
            const receipt = { receiptType: 'H_EARTH_CURRENT_LIVE_BAND_LIMITED_TERRAIN_RELIEF_V2_EXACT_HEAD_VALIDATION_v1', result: 'PASS', workflowRunId: process.env.GITHUB_RUN_ID, bootstrapHead: process.env.GITHUB_SHA, packageSha256: '676534a0cc3f75ca518c4dcd2dcf23af96f19ab01b4a8d8881f61298d7f056cd', javascriptSyntax: 'PASS', exactPhaseConstants: 'PASS', sourceSelectorContract: 'PASS', shaderCompile: 'PASS_4_OF_4', programLink: 'PASS_2_OF_2', acceptedDefaultSelectionPreserved: 'PASS', v2Precedence: 'PASS', visibleFrame: 'PASS', resourceLifecycle: 'PASS', outputManifest: manifest, results, timestamp: new Date().toISOString() };
            fs.writeFileSync('/tmp/terrain-relief-v2-validation-receipt.json', JSON.stringify(receipt, null, 2) + '\n');
            console.log(JSON.stringify(receipt, null, 2));
          })().catch(error => {
            const receipt = { receiptType: 'H_EARTH_CURRENT_LIVE_BAND_LIMITED_TERRAIN_RELIEF_V2_EXACT_HEAD_VALIDATION_v1', result: 'FAIL', workflowRunId: process.env.GITHUB_RUN_ID, bootstrapHead: process.env.GITHUB_SHA, error: error.stack || error.message || String(error), timestamp: new Date().toISOString() };
            fs.writeFileSync('/tmp/terrain-relief-v2-validation-receipt.json', JSON.stringify(receipt, null, 2) + '\n');
            console.error(JSON.stringify(receipt, null, 2));
            process.exit(1);
          });
          NODE
          node /tmp/verify-terrain-relief-v2.cjs
      - name: Commit exact product candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js \
            showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js
          git diff --cached --name-only > /tmp/staged-paths.txt
          test "$(wc -l < /tmp/staged-paths.txt)" -eq 2
          grep -Fx 'showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js' /tmp/staged-paths.txt
          grep -Fx 'showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js' /tmp/staged-paths.txt
          git commit -m 'Add band-limited terrain relief v2 candidate'
          git push origin HEAD:agent/h-earth-current-live-bandlimited-terrain-relief-v2-002
          echo "FINAL_PRODUCT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SUCCESSOR_RENDERER_BLOB=$(git hash-object showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js)" >> "$GITHUB_ENV"
          echo "UPDATED_BINDING_BLOB=$(git hash-object showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js)" >> "$GITHUB_ENV"
      - name: Open draft product PR and publish receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='agent/h-earth-current-live-bandlimited-terrain-relief-v2-002'
          PR_NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            cat > /tmp/pr-body.md <<EOF
          ## Operation

          \`H_EARTH_CURRENT_LIVE_BAND_LIMITED_TERRAIN_RELIEF_V2_IMPLEMENTATION_002\`

          ## Exact custody

          - source base: \`584cd0fce9fd4b631697ad904b39b70765258a2c\`
          - accepted renderer blob: \`de55609b0b0bd66601445a369c727ff7a6d7065d\`
          - accepted binding blob: \`5eb1b6f2e72ac0525f608850234182b2c646f66f\`
          - failed PR #524 was not used as source

          ## Authorized product changes

          1. \`showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js\`
          2. \`showroom/globe/h-earth/diagnostic/run8e-r3d/live-gpu-binding.js\`

          Candidate route: \`/showroom/globe/h-earth/?visual=terrain-relief-v2\`

          The candidate is open, draft, and unmerged. Main merge, live promotion, perceptual advancement, and user acceptance are not claimed.
          EOF
            gh pr create --draft --base main --head "$BRANCH" --title 'Add band-limited terrain relief v2 candidate' --body-file /tmp/pr-body.md >/tmp/pr-url.txt
            PR_NUMBER=$(gh pr view "$BRANCH" --json number --jq '.number')
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipt = JSON.parse(fs.readFileSync('/tmp/terrain-relief-v2-validation-receipt.json', 'utf8'));
          receipt.exactCandidateHead = process.env.FINAL_PRODUCT_HEAD;
          receipt.successorRendererGitBlob = process.env.SUCCESSOR_RENDERER_BLOB;
          receipt.updatedBindingGitBlob = process.env.UPDATED_BINDING_BLOB;
          fs.writeFileSync('/tmp/terrain-relief-v2-validation-receipt.final.json', JSON.stringify(receipt, null, 2) + '\n');
          NODE
          {
            echo '## Band-limited terrain relief V2 exact-head validation'
            echo
            echo "Workflow run: \`${GITHUB_RUN_ID}\`"
            echo
            echo "Product head: \`${FINAL_PRODUCT_HEAD}\`"
            echo
            echo '```json'
            cat /tmp/terrain-relief-v2-validation-receipt.final.json
            echo '```'
          } > /tmp/pr-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/pr-comment.md
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-bandlimited-terrain-relief-v2-bootstrap-${{ github.run_id }}
          path: |
            /tmp/terrain-relief-v2-validation-receipt.json
            /tmp/terrain-relief-v2-validation-receipt.final.json
            /tmp/generated-output-manifest.json
            /tmp/role6-transform-output.json
            /tmp/h-earth-v2-server.log
          if-no-files-found: warn
          retention-days: 30
