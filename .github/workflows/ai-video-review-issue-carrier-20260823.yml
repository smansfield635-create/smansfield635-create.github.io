name: AI Video Review Issue Carrier 20260823

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write

jobs:
  materialize-proxy:
    if: contains(github.event.comment.body, 'AI_VIDEO_REVIEW_20260823_RUN')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install gdown
        run: python -m pip install --quiet gdown
      - name: Materialize owner-provided Drive recording
        run: |
          set -euo pipefail
          gdown '1JmBeYxcjnq8v-fwkSnPXqfbiEEvgjAP8' -O source.mp4
          stat -c '%s' source.mp4 | tee source-bytes.txt
          sha256sum source.mp4 | tee source-sha256.txt
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of json source.mp4 > probe.json
      - name: Build bounded review package
        run: |
          set -euo pipefail
          mkdir -p review/frames
          ffmpeg -hide_banner -loglevel error -i source.mp4 -vf "scale=-2:540,fps=24" -c:v libx264 -preset veryfast -crf 30 -c:a aac -b:a 64k -movflags +faststart review/proxy-540p.mp4
          ffmpeg -hide_banner -loglevel error -i source.mp4 -vf "fps=1/8,scale=-2:720" -q:v 3 review/frames/frame-%04d.jpg
          ffmpeg -hide_banner -loglevel error -i source.mp4 -vn -c:a libmp3lame -b:a 64k review/audio.mp3
          cp probe.json source-bytes.txt source-sha256.txt review/
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: diamond-gate-seven-minute-review-proxy-${{ github.run_id }}
          path: review/
          retention-days: 7
      - name: Return run identity
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `AI_VIDEO_REVIEW_RETURN_v1\nrun_id=${context.runId}\nrun_attempt=${process.env.GITHUB_RUN_ATTEMPT}`
            })
