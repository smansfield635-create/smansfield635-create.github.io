name: Laws celestial gateway CP2 registry repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/laws-celestial-gateway-cp2-construction.yml
      - .cp2-repair-trigger/registry-repair.request

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/laws-celestial-gateway-cp2-execution-001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
