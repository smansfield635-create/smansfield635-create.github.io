name: Temporary Laws Secondary Label and Glow Round

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/laws-secondary-label-glow-temp.yml

permissions:
  contents: write

jobs:
  construct-verify-and-persist:
    if: github.event.pull_request.head.ref == 'agent/laws-compass-secondary-label-glow-001'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out bounded Laws task branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/laws-compass-secondary-label-glow-001
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply bounded Laws glow and secondary labels
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          marker = "LAWS_MOBILE_HALO_SECONDARY_LABELS_20260726J"

          for name in ("laws/index.crystals.js", "laws/index.crystals.source.js"):
              path = Path(name)
              source = path.read_text()
              old = "bloomDisableWidthPx:\n    420,"
              new = "bloomDisableWidthPx:\n    0,"
              if source.count(old) != 1:
                  raise SystemExit(f"INVALID_BLOOM_GATE_COUNT:{name}:{source.count(old)}")
              source = source.replace(old, new, 1)
              if marker not in source:
                  source = f"/* {marker} */\n" + source
              path.write_text(source)

          interaction_path = Path("laws/index.interactions.js")
          interaction = interaction_path.read_text()
          state_old = "controls:new Map(),labels:new Map(),pointer:"
          state_new = "controls:new Map(),labels:new Map(),lawLabels:new Map(),pointer:"
          if interaction.count(state_old) != 1:
              raise SystemExit(f"INVALID_INTERACTION_STATE_COUNT:{interaction.count(state_old)}")
          interaction = interaction.replace(state_old, state_new, 1)

          replacement = r'''  function installLabels(){
            if(!document.getElementById("laws-direct-interactions-label-style")){
              const style=document.createElement("style");
              style.id="laws-direct-interactions-label-style";
              style.textContent=`
                [data-laws-projected-category-labels]{position:absolute;inset:0;z-index:22;pointer-events:none}
                [data-laws-projected-category-label]{position:absolute;min-width:4.4rem;padding:.34rem .52rem;border:0;background:transparent;color:rgba(246,238,223,.94);font:850 clamp(.62rem,1.35vw,.78rem)/1.05 Inter,system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;text-shadow:0 .1rem .18rem #000,0 0 .55rem #000;white-space:nowrap;cursor:pointer;pointer-events:auto;touch-action:manipulation;transform:translate(-50%,-50%)}
                [data-laws-projected-category-label][data-depth-layer="rear"]{opacity:.44;filter:saturate(.68) brightness(.68)}
                [data-laws-projected-category-label][data-primary="true"]{opacity:1;color:#fff3be;filter:brightness(1.16) drop-shadow(0 0 .52rem rgba(245,213,130,.38))}
                [data-laws-projected-law-label]{position:absolute;max-width:min(10rem,44vw);padding:.24rem .42rem;border:0;border-radius:999px;background:rgba(3,6,13,.46);color:rgba(246,238,223,.94);font:850 clamp(.56rem,1.18vw,.72rem)/1.05 Inter,system-ui,sans-serif;letter-spacing:.075em;text-transform:uppercase;text-align:center;text-shadow:0 .1rem .18rem #000,0 0 .55rem #000;white-space:nowrap;pointer-events:none;touch-action:none;transform:translate(-50%,-50%);box-shadow:0 0 .72rem rgba(0,0,0,.42);backdrop-filter:blur(2px)}
                [data-laws-projected-law-label][data-depth-layer="rear"]{opacity:.54;filter:saturate(.74) brightness(.74)}
                [data-laws-projected-law-label][data-primary="true"]{opacity:1;color:#fff3be;filter:brightness(1.16) drop-shadow(0 0 .52rem rgba(245,213,130,.38))}
              `;
              document.head.append(style);
            }
            let layer=S.field.querySelector("[data-laws-projected-category-labels]");
            if(!layer){
              layer=document.createElement("div");
              layer.dataset.lawsProjectedCategoryLabels="true";
              S.field.append(layer);
            }
            for(const id of D){
              let el=layer.querySelector(`[data-laws-projected-category-label="${id}"]`);
              if(!el){
                el=document.createElement("button");
                el.type="button";
                el.dataset.lawsProjectedCategoryLabel=id;
                el.dataset.direction=id;
                el.textContent=LABEL[id];
                el.setAttribute("aria-label",`Open ${LABEL[id]}`);
                layer.append(el);
              }
              S.labels.set(id,el);
            }
            for(const control of S.root.querySelectorAll("[data-laws-law][data-law-id]")){
              const id=text(control.dataset.lawId);
              if(!id)continue;
              let el=layer.querySelector(`[data-laws-projected-law-label="${escapeCss(id)}"]`);
              if(!el){
                el=document.createElement("span");
                el.dataset.lawsProjectedLawLabel=id;
                el.setAttribute("aria-hidden","true");
                layer.append(el);
              }
              el.textContent=text(control.dataset.lawLabel||control.dataset.label||id);
              S.lawLabels.set(id,el);
            }
          }
          function applyProjection(){
            if(!S.root||S.disposed)return;
            const m=mode();
            const primary=m===MODE.CONSTELLATION?primaryDirection(orbitQ()):m===MODE.CLUSTER?primaryLaw(S.frame?.cluster?.lawIds,clusterQ()):"";
            S.root.dataset.lawsSpatialPrimaryKind=m===MODE.CLUSTER?"law":m===MODE.CONSTELLATION?"category":"";
            S.root.dataset.lawsSpatialPrimaryId=primary;
            S.root.dataset.lawsSpatialPrimarySelection=primary?"active":"inactive";
            for(const el of S.root.querySelectorAll("[data-laws-spatial-primary='true']"))el.removeAttribute("data-laws-spatial-primary");
            if(primary){
              const el=S.root.querySelector(m===MODE.CLUSTER?`[data-laws-law][data-law-id="${escapeCss(primary)}"]`:`[data-laws-category][data-direction="${escapeCss(primary)}"]`);
              if(el)el.dataset.lawsSpatialPrimary="true";
            }
            for(const r of S.projections){
              const el=controlFor(r);
              if(!el)continue;
              const p=priority(r),z=radius(r);
              Object.assign(el.style,{position:"absolute",left:`${r.x}px`,top:`${r.y}px`,width:`${z*2}px`,height:`${z*2}px`,margin:"0",transform:"translate(-50%, -50%)",pointerEvents:p>P.OFF?"auto":"none"});
              el.dataset.projectionVisible=String(r.visible);
              el.dataset.projectionDepthLayer=r.depthLayer;
              el.dataset.projectionInteractionPriority=String(p);
              if(p>P.OFF){
                el.removeAttribute("aria-hidden");
                if(el.dataset.active==="true")el.removeAttribute("tabindex");
              }else{
                el.setAttribute("aria-hidden","true");
                el.setAttribute("tabindex","-1");
              }
            }
            const rect=S.field.getBoundingClientRect(),cx=rect.width/2,cy=rect.height/2;
            const categoryById=new Map(S.projections.filter(categoryRecord).map(r=>[r.id,r]));
            for(const id of D){
              const el=S.labels.get(id),r=categoryById.get(id);
              if(!el)continue;
              if(m!==MODE.CONSTELLATION||!r?.visible){el.hidden=true;continue;}
              const dx=r.x-cx,dy=r.y-cy,n=Math.hypot(dx,dy)||1,out=Math.min(66,Math.max(36,(finite(r.radiusPx,28)*.66)+10));
              el.hidden=false;
              el.style.left=`${r.x+dx/n*out}px`;
              el.style.top=`${r.y+dy/n*out}px`;
              el.style.zIndex=r.depthLayer==="rear"?"2":"9";
              el.dataset.depthLayer=r.depthLayer;
              el.dataset.primary=String(id===primary);
            }
            const lawById=new Map(S.projections.filter(lawRecord).map(r=>[r.id,r]));
            const clusterDirection=activeDirection();
            for(const [id,el] of S.lawLabels){
              const r=lawById.get(id);
              const canonical=lawCanonical(id);
              if(m!==MODE.CLUSTER||!r?.visible||(clusterDirection&&direction(canonical?.direction)!==clusterDirection)){
                el.hidden=true;
                continue;
              }
              const dx=r.x-cx,dy=r.y-cy,n=Math.hypot(dx,dy)||1;
              const inward=Math.min(36,Math.max(20,(finite(r.radiusPx,24)*.30)+8));
              const candidateLeft=r.x-dx/n*inward;
              const candidateTop=r.y-dy/n*inward;
              el.hidden=false;
              el.style.visibility="hidden";
              el.style.left="0px";
              el.style.top="0px";
              const measured=el.getBoundingClientRect();
              const width=Math.max(1,measured.width||el.offsetWidth||1);
              const height=Math.max(1,measured.height||el.offsetHeight||1);
              const inset=8;
              const minLeft=inset+width/2;
              const maxLeft=Math.max(minLeft,rect.width-inset-width/2);
              const minTop=inset+height/2;
              const maxTop=Math.max(minTop,rect.height-inset-height/2);
              const left=Math.min(maxLeft,Math.max(minLeft,candidateLeft));
              const top=Math.min(maxTop,Math.max(minTop,candidateTop));
              el.style.left=`${left}px`;
              el.style.top=`${top}px`;
              el.style.zIndex=r.depthLayer==="rear"?"3":"10";
              el.style.visibility="visible";
              el.dataset.depthLayer=r.depthLayer;
              el.dataset.primary=String(id===primary);
              el.dataset.lawsProjectedPlacement="inward-edge-constrained";
              el.dataset.lawsProjectedClamped=String(Math.abs(left-candidateLeft)>.5||Math.abs(top-candidateTop)>.5);
            }
          }
          function setProjections(records){'''

          pattern = re.compile(r"  function installLabels\(\)\{.*?\n  function setProjections\(records\)\{", re.S)
          interaction, count = pattern.subn(replacement, interaction, count=1)
          if count != 1:
              raise SystemExit(f"INVALID_LABEL_FUNCTION_REPLACEMENT_COUNT:{count}")
          if marker not in interaction:
              interaction = f"/* {marker} */\n" + interaction
          interaction_path.write_text(interaction)

          html_path = Path("laws/index.html")
          html = html_path.read_text()
          replacements = {
              'data-laws-bounded-round="LAWS_SHOWROOM_CANONICAL_CRYSTAL_CLONE_20260726H"': 'data-laws-bounded-round="LAWS_MOBILE_HALO_SECONDARY_LABELS_20260726J"\n  data-laws-secondary-label-model="active-cluster-four-law-labels-inward-edge-constrained"\n  data-laws-mobile-halo-model="showroom-strength-full-mesh-halo"',
              '/laws/index.crystals.js?v=LAWS_CANONICAL_MAIN_CRYSTAL_CLONE_20260726H': '/laws/index.crystals.js?v=LAWS_MOBILE_HALO_SECONDARY_LABELS_20260726J',
              '/laws/index.interactions.js?v=LAWS_MAIN_GESTURE_CONTINUITY_V8_20260726D': '/laws/index.interactions.js?v=LAWS_MOBILE_HALO_SECONDARY_LABELS_20260726J'
          }
          for old,new in replacements.items():
              if html.count(old) != 1:
                  raise SystemExit(f"INVALID_HTML_IDENTITY_COUNT:{old}:{html.count(old)}")
              html = html.replace(old,new,1)
          if marker not in html:
              html = f"<!-- {marker} -->\n" + html
          html_path.write_text(html)
          PY

      - name: Verify bounded source identities and syntax
        run: |
          set -euo pipefail
          node --check laws/index.crystals.js
          node --check laws/index.crystals.source.js
          node --check laws/index.interactions.js
          python3 - <<'PY'
          from pathlib import Path
          marker = "LAWS_MOBILE_HALO_SECONDARY_LABELS_20260726J"
          for name in ("laws/index.crystals.js", "laws/index.crystals.source.js"):
              text = Path(name).read_text()
              assert text.count("bloomDisableWidthPx:\n    0,") == 1, name
              assert "bloomDisableWidthPx:\n    420," not in text, name
              assert marker in text, name
          interactions = Path("laws/index.interactions.js").read_text()
          assert "lawLabels:new Map()" in interactions
          assert "data-laws-projected-law-label" in interactions
          assert "inward-edge-constrained" in interactions
          assert "pointer-events:none" in interactions
          html = Path("laws/index.html").read_text()
          assert html.count("LAWS_MOBILE_HALO_SECONDARY_LABELS_20260726J") >= 4
          assert 'data-laws-secondary-label-model="active-cluster-four-law-labels-inward-edge-constrained"' in html
          PY
          git diff --check

      - name: Install bounded Chromium runtime
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Start bounded Laws server
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > /tmp/laws-secondary-label-server.log 2>&1 &
          echo $! > /tmp/laws-secondary-label-server.pid
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:4173/laws/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/laws-secondary-label-server.log
          exit 1

      - name: Execute multi-viewport Laws label and glow verification
        run: |
          set -euo pipefail
          cat > /tmp/laws-secondary-label-check.mjs <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const configurations = [
            { name: 'samsung-portrait', width: 360, height: 800 },
            { name: 'large-phone', width: 412, height: 915 },
            { name: 'tablet', width: 768, height: 1024 },
            { name: 'desktop', width: 1280, height: 900 }
          ];
          const expectedPrimary = ['Flow','Integrity','Reality','Structure'];
          const expectedFlow = ['Signals','Feedback','Cycles','Handoffs'];
          const results = [];
          const browser = await chromium.launch({ headless: true });

          for (const config of configurations) {
            const page = await browser.newPage({ viewport: { width: config.width, height: config.height } });
            const errors = [];
            page.on('pageerror', error => errors.push(String(error)));
            page.on('console', message => {
              if (message.type() === 'error') errors.push(message.text());
            });
            await page.goto('http://127.0.0.1:4173/laws/', { waitUntil: 'domcontentloaded' });
            await page.locator('#laws-orbit').scrollIntoViewIfNeeded();
            await page.waitForFunction(() => {
              const root = document.querySelector('[data-laws-root]');
              return root?.getAttribute('data-laws-staged-orbit-loaded') === 'true' &&
                root?.getAttribute('data-laws-staged-interaction-loaded') === 'true';
            }, null, { timeout: 20000 });
            await page.waitForFunction(() => document.querySelectorAll('[data-laws-projected-category-label]:not([hidden])').length === 4, null, { timeout: 15000 });

            const primary = await page.locator('[data-laws-projected-category-label]:not([hidden])').allTextContents();
            if (primary.join('|') !== expectedPrimary.join('|')) {
              throw new Error(`${config.name}:PRIMARY_LABELS_CHANGED:${primary.join('|')}`);
            }

            await page.locator('[data-laws-projected-category-label="flow"]').click({ force: true });
            await page.waitForFunction(() => String(document.querySelector('[data-laws-root]')?.getAttribute('data-laws-presentation-mode') || '').toUpperCase() === 'CLUSTER', null, { timeout: 10000 });
            await page.waitForFunction(() => document.querySelectorAll('[data-laws-projected-law-label]:not([hidden])').length === 4, null, { timeout: 10000 });

            const audit = await page.evaluate(expected => {
              const field = document.querySelector('[data-laws-scene-field]');
              const fieldRect = field.getBoundingClientRect();
              const labels = [...document.querySelectorAll('[data-laws-projected-law-label]:not([hidden])')];
              const texts = labels.map(label => label.textContent.trim());
              const contained = labels.every(label => {
                const rect = label.getBoundingClientRect();
                const style = getComputedStyle(label);
                return rect.width > 0 && rect.height > 0 &&
                  style.visibility === 'visible' && style.display !== 'none' &&
                  style.pointerEvents === 'none' &&
                  rect.left >= fieldRect.left - 0.5 && rect.right <= fieldRect.right + 0.5 &&
                  rect.top >= fieldRect.top - 0.5 && rect.bottom <= fieldRect.bottom + 0.5;
              });
              const activeControls = [...document.querySelectorAll('[data-laws-law][data-direction="flow"][data-projection-visible="true"]')]
                .filter(control => getComputedStyle(control).pointerEvents !== 'none').length;
              return {
                texts,
                contained,
                activeControls,
                placement: labels.every(label => label.dataset.lawsProjectedPlacement === 'inward-edge-constrained'),
                haloIdentity: document.documentElement.innerHTML.includes('LAWS_MOBILE_HALO_SECONDARY_LABELS_20260726J')
              };
            }, expectedFlow);

            if (audit.texts.join('|') !== expectedFlow.join('|')) {
              throw new Error(`${config.name}:SECONDARY_LABELS_INVALID:${audit.texts.join('|')}`);
            }
            if (!audit.contained || !audit.placement || audit.activeControls !== 4 || !audit.haloIdentity) {
              throw new Error(`${config.name}:SECONDARY_LABEL_CONTRACT_FAILED:${JSON.stringify(audit)}`);
            }
            if (errors.length) {
              throw new Error(`${config.name}:PAGE_ERRORS:${errors.join(' || ')}`);
            }

            await page.screenshot({ path: `/tmp/laws-${config.name}.png`, fullPage: false });
            results.push({ config, primary, secondary: audit.texts, contained: audit.contained, activeControls: audit.activeControls, errors });
            await page.close();
          }

          await browser.close();
          fs.writeFileSync('/tmp/laws-secondary-label-glow-results.json', JSON.stringify({ status: 'PASS', results }, null, 2));
          console.log(JSON.stringify({ status: 'PASS', results }, null, 2));
          NODE
          node /tmp/laws-secondary-label-check.mjs

      - name: Verify bounded path set
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          {
            git diff --name-only origin/main...HEAD
            git diff --name-only
            git ls-files --others --exclude-standard | grep -v '^node_modules/' || true
          } | sed '/^$/d' | sort -u > /tmp/laws-secondary-label-paths.txt
          cat /tmp/laws-secondary-label-paths.txt
          python3 - <<'PY'
          from pathlib import Path
          allowed = {
              '.github/workflows/laws-secondary-label-glow-temp.yml',
              'laws/index.html',
              'laws/index.crystals.js',
              'laws/index.crystals.source.js',
              'laws/index.interactions.js'
          }
          paths = {line.strip() for line in Path('/tmp/laws-secondary-label-paths.txt').read_text().splitlines() if line.strip()}
          unexpected = sorted(paths - allowed)
          missing = sorted(allowed - paths)
          if unexpected:
              raise SystemExit(f'UNEXPECTED_PATHS:{unexpected}')
          if missing:
              raise SystemExit(f'MISSING_PATHS:{missing}')
          PY

      - name: Commit verified bounded production files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add laws/index.html laws/index.crystals.js laws/index.crystals.source.js laws/index.interactions.js
          git commit -m 'Add Laws secondary labels and restore mobile crystal halo'
          git push origin HEAD:agent/laws-compass-secondary-label-glow-001

      - name: Upload bounded verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laws-secondary-label-glow-evidence
          path: |
            /tmp/laws-secondary-label-server.log
            /tmp/laws-secondary-label-glow-results.json
            /tmp/laws-secondary-label-paths.txt
            /tmp/laws-samsung-portrait.png
            /tmp/laws-large-phone.png
            /tmp/laws-tablet.png
            /tmp/laws-desktop.png
          if-no-files-found: warn
          retention-days: 30
