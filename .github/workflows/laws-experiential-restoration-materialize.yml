name: Laws Experiential Restoration Activation Probe

on:
  push:
    branches:
      - agent/laws-experiential-architecture-restoration-001
    paths:
      - '.github/workflows/laws-experiential-restoration-materialize.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/laws-experiential-restoration-materialize.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laws-experiential-restoration-activation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXECUTION_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  EXPECTED_MAIN_BASE: ef2ffdb1da7911238652f076a6b44326061493ef
  BASE_URL: http://127.0.0.1:4173
  EVIDENCE_DIR: artifacts/laws-experiential-restoration/interaction-diagnostic

jobs:
  activation-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXECUTION_COMMIT }}
          fetch-depth: 0

      - name: Lock exact checkout and product hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXECUTION_COMMIT"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_BASE"
          test "$(git merge-base origin/main HEAD)" = "$EXPECTED_MAIN_BASE"
          echo '8fff5010933b90ffd396fddab393fb4044954b1b2838299b2a454f598c246854  laws/index.html' | sha256sum --check --strict
          echo '4a48242720d7f42dcf582ff910766882091c1b00a0ad3fad72807d5a5090d196  laws/index.experience.css' | sha256sum --check --strict
          echo 'e5a289b9e6792f7549be7797880ffe6911a6fea3e4f5e02b48ada1b71158a59f  laws/index.experience.polish.css' | sha256sum --check --strict
          echo '2722d0f4da22b07d40fb2ecd14eea0d07c9bb21181013352136800a4934a9062  laws/index.experience.js' | sha256sum --check --strict

      - name: Install pinned browser verifier
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start exact candidate server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/laws-activation-server.log 2>&1 &
          for attempt in $(seq 1 50); do
            curl --fail --silent http://127.0.0.1:4173/laws/ > /dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Record raw touch and pointer activation receipts
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          printf '{"contract":"LAWS_ACTIVATION_PROBE_BOOTSTRAP_v1","head":"%s","status":"NODE_NOT_STARTED"}\n' "$EXECUTION_COMMIT" > "$EVIDENCE_DIR/activation-probe.json"
          cat > tools/.laws-activation-probe.mjs <<'JS'
          import fs from "node:fs/promises";
          import { chromium } from "playwright";

          const output = `${process.env.EVIDENCE_DIR}/activation-probe.json`;
          const receipt = {
            contract: "LAWS_EXPERIENTIAL_RESTORATION_ACTIVATION_PROBE_v1",
            head: process.env.EXECUTION_COMMIT,
            status: "STARTED",
            results: [],
            error: null
          };
          const persist = () => fs.writeFile(output, `${JSON.stringify(receipt, null, 2)}\n`, "utf8");
          await persist();

          const snapshot = () => {
            const root = document.querySelector("[data-laws-root]");
            let frame = null;
            try { frame = globalThis.DGB_LAWS_CONTROLLER?.getFrame?.() || null; } catch (_) {}
            return {
              scrollY,
              controllerState: root?.dataset.lawsControllerState || "",
              activeDirection: root?.dataset.lawsActiveDirection || "",
              activeCategory: root?.dataset.lawsActiveCategory || "",
              experienceDirection: document.documentElement.dataset.lawsExperienceDirection || "",
              visibleLabelId: root?.dataset.lawsVisibleOuterAuthorityLabelId || "",
              controllerFrameState: frame?.state || "",
              controllerFrameDirection: frame?.compass?.selectedDirection || "",
              controllerFrameClusterDirection: frame?.activeClusterDirection || frame?.cluster?.direction || "",
              interactionReceipt: globalThis.DGB_LAWS_INTERACTIONS?.getReceipt?.() || null
            };
          };

          const hitPoint = () => {
            const root = document.querySelector("[data-laws-root]");
            const id = root?.dataset.lawsVisibleOuterAuthorityLabelId || "";
            const label = document.querySelector(`[data-laws-projected-category-label="${id}"]`);
            const rect = label?.getBoundingClientRect();
            if (!rect) return null;
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            const top = x >= 0 && y >= 0 && x < innerWidth && y < innerHeight
              ? document.elementFromPoint(x, y) : null;
            return {
              id, x, y,
              labelRect: { left: rect.left, top: rect.top, width: rect.width, height: rect.height },
              inViewport: x >= 0 && y >= 0 && x < innerWidth && y < innerHeight,
              topTag: top?.tagName || "",
              topClass: typeof top?.className === "string" ? top.className : "",
              owned: Boolean(top?.closest?.(`[data-laws-projected-category-label="${id}"]`))
            };
          };

          let browser;
          try {
            browser = await chromium.launch({ headless: true });
            for (const method of ["touch", "pointer"]) {
              const context = await browser.newContext({
                viewport: { width: 390, height: 844 },
                isMobile: true,
                hasTouch: true,
                deviceScaleFactor: 1
              });
              const page = await context.newPage();
              const result = { method, browserErrors: [] };
              page.on("pageerror", error => result.browserErrors.push(`pageerror:${error.message}`));
              page.on("console", message => {
                if (message.type() === "error" && !message.text().includes("404")) {
                  result.browserErrors.push(`console:${message.text()}`);
                }
              });
              try {
                await page.goto(`${process.env.BASE_URL}/laws/`, { waitUntil: "networkidle" });
                await page.waitForFunction(() => {
                  const root = document.querySelector("[data-laws-root]");
                  return Boolean(globalThis.DGB_LAWS_CONTROLLER && globalThis.DGB_LAWS_EXPERIENCE && globalThis.DGBLawsStagedLoader) &&
                    root?.dataset.lawsControllerStatus === "available";
                }, null, { timeout: 30000 });
                result.preload = await page.evaluate(() => globalThis.DGB_LAWS_EXPERIENCE.requestCompassRuntimePreload());
                await page.waitForFunction(() => {
                  const root = document.querySelector("[data-laws-root]");
                  return Boolean(globalThis.DGB_LAWS_INTERACTIONS) && root?.dataset.lawsInteractionsStatus === "available";
                }, null, { timeout: 30000 });
                await page.evaluate(() => document.querySelector("[data-laws-scene-field]")?.scrollIntoView({
                  block: "center", inline: "nearest", behavior: "instant"
                }));
                await page.waitForTimeout(400);
                result.before = await page.evaluate(snapshot);
                result.hit = await page.evaluate(hitPoint);
                if (!result.hit?.owned) throw new Error(`UNOWNED_HIT:${JSON.stringify(result.hit)}`);
                if (method === "touch") {
                  await page.touchscreen.tap(result.hit.x, result.hit.y);
                } else {
                  await page.mouse.click(result.hit.x, result.hit.y);
                }
                await page.waitForTimeout(1600);
                result.after = await page.evaluate(snapshot);
              } catch (error) {
                result.error = { message: error.message, stack: error.stack || "" };
              }
              receipt.results.push(result);
              await persist();
              await context.close();
            }
            receipt.status = "COMPLETE";
          } catch (error) {
            receipt.status = "ERROR";
            receipt.error = { message: error.message, stack: error.stack || "" };
          } finally {
            await persist();
            if (browser) await browser.close();
          }
          if (receipt.status !== "COMPLETE") process.exitCode = 1;
          JS
          set +e
          node tools/.laws-activation-probe.mjs > "$EVIDENCE_DIR/node-output.log" 2>&1
          status=$?
          set -e
          rm -f tools/.laws-activation-probe.mjs
          exit $status

      - name: Upload activation probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laws-activation-probe-${{ env.EXECUTION_COMMIT }}
          path: |
            artifacts/laws-experiential-restoration/interaction-diagnostic/**
            /tmp/laws-activation-server.log
          if-no-files-found: error
          retention-days: 30
