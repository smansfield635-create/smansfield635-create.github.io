name: H-Earth C2-R1 Complete World Integration

on:
  pull_request:
    branches: [integration/h-earth-c2-r1-baseline-001]
    paths:
      - '.github/workflows/h-earth-c2-r1-complete-world-integration.yml'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/complete-world/**'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/**'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.complete-world-integration.mjs'

permissions:
  contents: write
  actions: read

jobs:
  install-exact-cache-carriers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install exact binding cache carriers when absent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          LEDGER='h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/complete-world/h-earth.c2-r1.complete-world-operation-ledger.json'
          ROLE3='h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/complete-world/h-earth.c2-r1.complete-world-role3-entry.json'
          if python3 - "$LEDGER" "$ROLE3" <<'PY'
          import json,sys
          try:
              a=json.load(open(sys.argv[1])); b=json.load(open(sys.argv[2]))
              ok=(a.get('exactBindingCacheCarrier',{}).get('partIndex')==1 and
                  b.get('exactBindingCacheCarrier',{}).get('partIndex')==2 and
                  a.get('exactBindingCacheCarrier',{}).get('partCount')==2 and
                  b.get('exactBindingCacheCarrier',{}).get('partCount')==2)
          except Exception:
              ok=False
          raise SystemExit(0 if ok else 1)
          PY
          then
            echo 'Exact binding cache carriers already installed.'
            exit 0
          fi

          mkdir -p "$RUNNER_TEMP/exact-cache-carrier"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/smansfield635-create/smansfield635-create.github.io/actions/artifacts/8822791254/zip' \
            --output "$RUNNER_TEMP/exact-cache-carrier/cache.zip"
          unzip -q "$RUNNER_TEMP/exact-cache-carrier/cache.zip" -d "$RUNNER_TEMP/exact-cache-carrier/unpacked"
          CACHE="$RUNNER_TEMP/exact-cache-carrier/unpacked/complete-world-adapter-cache.json"
          test -s "$CACHE"
          test "$(sha256sum "$CACHE" | awk '{print $1}')" = '0c01a65ce7a8304874fc9ec43ce1972a5f0e828b2ceb369c3d4faf603f1ff0d1'

          python3 - "$CACHE" "$LEDGER" "$ROLE3" <<'PY'
          import base64,gzip,json,sys
          from pathlib import Path
          cache_path,ledger_path,role3_path=map(Path,sys.argv[1:])
          raw=cache_path.read_bytes()
          encoded=base64.b64encode(gzip.compress(raw,compresslevel=9,mtime=0)).decode()
          midpoint=(len(encoded)//2//4)*4
          part1,part2=encoded[:midpoint],encoded[midpoint:]
          cache=json.loads(raw)
          base={
            'objectId':'H_EARTH:C2_R1:COASTAL_SUCCESSOR',
            'executionHistoryId':'H_EARTH:C2_R1:PR_418:HISTORY_001',
            'activeEdgeId':'H_EARTH:C2_R1:COASTAL_COMPONENT_TO_COMPLETE_WORLD_CANDIDATE',
            'branch':'agent/h-earth-c2-r1-physically-coherent-coastal-successor-001',
            'operationStartingHead':'e03f211a472fd564b1ed4b8a00096c923a077528',
            'startupPerformanceStartingHead':'f171852f3b453a1535fc29ed2798430814351084',
            'acceptedBaselineHead':'4bc08c26548c36ab9fd96bdaead7434ca08cf8ac',
            'acceptedCoastalComponentSourceHead':'c53362c6f74b01c4e0b53be526b0e3a0b73edede',
            'rollbackBranch':'rollback/h-earth-c2-r1-startup-performance-start-001',
            'rollbackHead':'f171852f3b453a1535fc29ed2798430814351084',
            'cacheArtifactId':8822791254,
            'cacheArtifactZipDigest':'sha256:ac78a365c21748ac946d96ee53f29241ca6cdd1c87cf7b430f5ade88675707a7',
            'cacheJsonDigest':'sha256:0c01a65ce7a8304874fc9ec43ce1972a5f0e828b2ceb369c3d4faf603f1ff0d1',
            'cacheSourceHead':'5fed66e1747391ab15c6dd55c86de0215a2c39db',
            'completeWorldPackageIdentity':cache['completeWorldPackageIdentity'],
            'completeWorldPackageContentDigest':cache['completeWorldPackageContentDigest'],
            'candidateSampleFailureCount':cache['counters']['candidateSampleFailureCount'],
            'boundTerrainVertexCount':cache['counters']['boundTerrainVertexCount'],
            'boundShorelineVertexCount':cache['counters']['boundShorelineVertexCount'],
            'adapterBoundaryExcludedVertexCount':cache['counters']['adapterBoundaryExcludedVertexCount'],
            'exactBoundaryExclusion':{'vertexIndex':24327,'roleCode':1,'worldX':128,'worldZ':64},
            'overallCompleteWorldPathCount':11,
            'correctivePathCount':6,
            'closedComponentSourceMutation':False,
            'completeWorldRendererMutation':False,
            'publicRouteMutation':False,
            'mainMutation':False,
            'independentExecutionPass':'NOT_PERFORMED_BY_ROLE_1',
            'userDifferential':'NOT_PERFORMED',
            'mergePromotionOrClosure':'NOT_AUTHORIZED'
          }
          ledger={
            'ledgerType':'H_EARTH_C2_R1_COMPLETE_WORLD_INTEGRATION_OPERATION_LEDGER_v3',
            'operationId':'H_EARTH_C2_R1_COMPLETE_WORLD_INTEGRATION_001',
            'correctiveOperationId':'H_EARTH_C2_R1_COMPLETE_WORLD_REAL_PACKAGE_ADAPTER_CORRECTION_001',
            'performanceCorrectionOperationId':'H_EARTH_C2_R1_COMPLETE_WORLD_STARTUP_PERFORMANCE_CORRECTION_001',
            'fromRole':'ROLE_1_PRODUCT_INTEGRATION_AND_SOURCE_AUTHORITY',
            'nextRole':'ROLE_3_EXECUTION_VERIFICATION_AND_RECEIPT_CUSTODY',
            **base,
            'resultingHead':'COMMIT_CONTAINING_THIS_RECORD',
            'status':'ROLE_1_EXACT_CACHE_INSTALLED_PENDING_FINAL_BROWSER_EXECUTION',
            'exactBindingCacheCarrier':{'partIndex':1,'partCount':2,'encoding':'BASE64_GZIP_JSON','value':part1},
            'stopBoundary':['NO_ROLE_1_SELF_CERTIFICATION','NO_USER_DIFFERENTIAL','NO_MERGE','NO_PROMOTION','NO_FINAL_CLOSURE']
          }
          role3={
            'entryType':'H_EARTH_C2_R1_COMPLETE_WORLD_ROLE_3_ENTRY_v3',
            'operationId':'H_EARTH_C2_R1_COMPLETE_WORLD_INTEGRATION_001',
            'performanceCorrectionOperationId':'H_EARTH_C2_R1_COMPLETE_WORLD_STARTUP_PERFORMANCE_CORRECTION_001',
            **base,
            'exactExternalizedHead':'COMMIT_CONTAINING_THIS_RECORD',
            'reviewEntry':'/h-earth-3d/control-plane/coastal-morphology/c2-r1/review/complete-world/index.html',
            'workflow':'.github/workflows/h-earth-c2-r1-complete-world-integration.yml',
            'staticJob':'exact-head-and-static-construction',
            'browserJob':'browser-execution-transport',
            'currentRole1Status':'EXACT_CACHE_INSTALLED_PENDING_FINAL_BROWSER_EXECUTION',
            'exactBindingCacheCarrier':{'partIndex':2,'partCount':2,'encoding':'BASE64_GZIP_JSON','value':part2},
            'browserMatrix':[
              {'name':'desktop-1440x900','width':1440,'height':900,'touchEnabled':False},
              {'name':'mobile-412x915','width':412,'height':915,'deviceScaleFactor':2.625,'touchEnabled':True},
              {'name':'mobile-390x844','width':390,'height':844,'deviceScaleFactor':3,'touchEnabled':True}
            ],
            'requiredReceipts':['EXACT_HEAD_BRANCH_AND_ROLLBACK_IDENTITY','EXACT_SIX_PATH_CORRECTIVE_DIFF','EXACT_ELEVEN_PATH_OVERALL_DIFF','EXACT_CACHE_STATIC_INTEGRATION','DESKTOP_BROWSER_1440_BY_900','MOBILE_BROWSER_412_BY_915_TOUCH_ENABLED','MOBILE_BROWSER_390_BY_844_TOUCH_ENABLED','CONSOLE_HTTP_AND_PERFORMANCE','PLAYWRIGHT_TRACES_AND_REFERENCE_CAPTURES','ARTIFACT_SHA256_DIGEST_CHAIN','ENGINEERING_EXECUTION_DISPOSITION_BY_ROLE_3'],
            'stopBoundary':['NO_SOURCE_REPAIR_BY_ROLE_3','NO_USER_DIFFERENTIAL','NO_PROJECT_EDGE_ADJUDICATION','NO_MERGE_PROMOTION_OR_FINAL_CLOSURE']
          }
          ledger_path.write_text(json.dumps(ledger,separators=(',',':'))+'\n')
          role3_path.write_text(json.dumps(role3,separators=(',',':'))+'\n')
          PY

          git config user.name 'h-earth-role1-cache-carrier'
          git config user.email 'actions@users.noreply.github.com'
          git add "$LEDGER" "$ROLE3"
          git commit -m 'C2-R1: install exact binding cache carriers'
          git push origin "HEAD:$TARGET_BRANCH"
