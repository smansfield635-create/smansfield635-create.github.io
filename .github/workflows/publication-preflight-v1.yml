name: Publication Fast Preflight v1

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact candidate commit SHA to preflight
        required: true
        type: string
      surface_id:
        description: Registered public surface verification id
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publication-preflight-${{ inputs.surface_id }}-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require canonical main dispatch and valid target SHA
        id: resolve
        env:
          REQUESTED_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          requested="$(printf '%s' "$REQUESTED_SHA" | tr -d '[:space:]')"
          printf '%s' "$requested" | grep -Eq '^[0-9a-f]{40}$'
          test "$GITHUB_REF" = "refs/heads/main"
          echo "target_sha=$requested" >> "$GITHUB_OUTPUT"

      - name: Materialize bounded publication sparse index
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$TARGET_SHA"
          git sparse-checkout init --cone --sparse-index

          mapfile -t top_dirs < <(git ls-tree -d --name-only FETCH_HEAD)
          sparse_paths=(".github/ai-router/publication-surfaces")
          for root in "${top_dirs[@]}"; do
            case "$root" in
              .github|preview|node_modules|h-earth-live-6d18e158)
                ;;
              inspection)
                while IFS= read -r child; do
                  test -n "$child" || continue
                  test "$child" = "audralia-24057-exact" && continue
                  sparse_paths+=("inspection/$child")
                done < <(git ls-tree -d --name-only "FETCH_HEAD:inspection")
                ;;
              *)
                sparse_paths+=("$root")
                ;;
            esac
          done

          git sparse-checkout set -- "${sparse_paths[@]}"
          git checkout --detach FETCH_HEAD
          test "$(git config --bool index.sparse)" = "true"
          sparse_entries="$(git ls-files --sparse | wc -l | tr -d '[:space:]')"
          materialized_files="$(find . -type f -not -path './.git/*' | wc -l | tr -d '[:space:]')"
          test "$sparse_entries" -lt 20000
          test "$materialized_files" -lt 20000
          test -f tools/publication-preflight.v1.mjs
          test -d .github/ai-router/publication-surfaces
          test ! -e preview
          test ! -e h-earth-live-6d18e158
          test ! -e inspection/audralia-24057-exact
          echo "PUBLICATION_SPARSE_INDEX_ENTRIES=$sparse_entries"
          echo "PUBLICATION_MATERIALIZED_FILES=$materialized_files"

      - name: Validate registered surface
        id: surface
        env:
          SURFACE_ID: ${{ inputs.surface_id }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SURFACE_ID" | grep -Eq '^[a-z0-9][a-z0-9._-]{0,79}$'
          manifest=".github/ai-router/publication-surfaces/${SURFACE_ID}.json"
          test -f "$manifest"
          jq -e --arg id "$SURFACE_ID" '.schema=="PUBLICATION_SURFACE_VERIFICATION_v1" and .surfaceId==$id and (.checks|type=="array") and (.checks|length>0)' "$manifest" >/dev/null
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "runtime=$(jq -r 'if .runtime?.enabled == true then "true" else "false" end' "$manifest")" >> "$GITHUB_OUTPUT"

      - name: Build and size-check exact Pages payload
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
          SURFACE_ID: ${{ inputs.surface_id }}
          STAGE: ${{ runner.temp }}/pages-site
          RECEIPT: ${{ runner.temp }}/publication-preflight-receipt.json
        shell: bash
        run: |
          set -euo pipefail
          node tools/publication-preflight.v1.mjs build \
            --target-sha "$TARGET_SHA" \
            --surface-id "$SURFACE_ID" \
            --stage "$STAGE" \
            --receipt "$RECEIPT"
          jq -e '.schema=="PUBLICATION_FAST_PREFLIGHT_RECEIPT_v1" and .result=="PAYLOAD_BUILT" and .deploymentPerformed==false' "$RECEIPT" >/dev/null
          echo "PAGES_PAYLOAD_BYTES=$(jq -r '.payloadBytes' "$RECEIPT")"

      - name: Set up Chrome
        if: ${{ steps.surface.outputs.runtime == 'true' }}
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install runtime verifier
        if: ${{ steps.surface.outputs.runtime == 'true' }}
        run: npm install --no-save --no-package-lock puppeteer-core@24.15.0

      - name: Verify exact staged payload
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
          SURFACE_ID: ${{ inputs.surface_id }}
          STAGE: ${{ runner.temp }}/pages-site
          RECEIPT: ${{ runner.temp }}/publication-preflight-receipt.json
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.surface.outputs.runtime }}" = "true" ]; then
            export CHROME_PATH="$(command -v google-chrome || command -v chrome || command -v chromium || find /opt/hostedtoolcache/setup-chrome -type f -name chrome 2>/dev/null | head -1)"
            test -n "$CHROME_PATH"
          fi
          node tools/publication-preflight.v1.mjs verify \
            --target-sha "$TARGET_SHA" \
            --surface-id "$SURFACE_ID" \
            --stage "$STAGE" \
            --receipt "$RECEIPT"
          jq -e '.schema=="PUBLICATION_FAST_PREFLIGHT_RECEIPT_v1" and .result=="PREFLIGHT_PASS" and .deploymentPerformed==false' "$RECEIPT" >/dev/null

      - name: Capture browser visual evidence and Awards recognition matrix
        if: ${{ steps.surface.outputs.runtime == 'true' && inputs.surface_id == 'awards' }}
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
          STAGE: ${{ runner.temp }}/pages-site
          SCREENSHOT: ${{ runner.temp }}/publication-preflight-screenshot.png
          EVIDENCE_DIR: ${{ runner.temp }}/awards-recognition-evidence
          EVIDENCE_MANIFEST: ${{ runner.temp }}/awards-recognition-evidence/recognition-evidence-manifest.json
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_PATH="$(command -v google-chrome || command -v chrome || command -v chromium || find /opt/hostedtoolcache/setup-chrome -type f -name chrome 2>/dev/null | head -1)"
          test -n "$CHROME_PATH"
          mkdir -p "$EVIDENCE_DIR"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {spawn} from 'node:child_process';
          import puppeteer from 'puppeteer-core';

          const stage=process.env.STAGE;
          const screenshot=process.env.SCREENSHOT;
          const evidenceDir=process.env.EVIDENCE_DIR;
          const evidenceManifest=process.env.EVIDENCE_MANIFEST;
          const targetSha=process.env.TARGET_SHA;
          const chrome=process.env.CHROME_PATH;
          const baseUrl='http://127.0.0.1:4173';
          const awardsPath='/showroom/globe/h-earth/awards/';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const objects=['experience','world','coherence','trust','estate'];
          const viewports=[
            {name:'phone',width:412,height:915,deviceScaleFactor:2,isMobile:true,hasTouch:true},
            {name:'tablet',width:800,height:1280,deviceScaleFactor:2,isMobile:true,hasTouch:true},
            {name:'desktop',width:1440,height:1000,deviceScaleFactor:1,isMobile:false,hasTouch:false}
          ];
          const captures=[];
          const server=spawn('python3',['-m','http.server','4173','--bind','127.0.0.1','--directory',stage],{stdio:'ignore'});
          let browser;

          const standalonePath=path.join(stage,'showroom','globe','h-earth','awards','__recognition-standalone.html');
          fs.writeFileSync(standalonePath,`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
          *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01040a}body{display:grid;place-items:center}.field{width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 48%,rgba(80,128,148,.13),#01040a 70%)}#host{position:relative;overflow:visible;contain:layout paint style}#host[data-story="experience"]{width:min(46vw,300px);aspect-ratio:2/3}#host[data-story="world"]{width:min(78vw,720px);aspect-ratio:16/9}#host[data-story="coherence"]{width:min(62vw,480px);aspect-ratio:6/5}#host[data-story="trust"]{width:min(80vw,760px);aspect-ratio:2/1}#host[data-story="estate"]{width:min(72vw,620px);aspect-ratio:4/3}#host>*{width:100%;height:100%}
          </style></head><body><main class="field"><div id="host"></div></main><script type="module">
          const story=new URLSearchParams(location.search).get('story');const host=document.getElementById('host');host.dataset.story=story;
          let api;
          if(story==='experience'){const m=await import('./living-objects/experience-cycle-a.mjs');api=m.mountExperienceLivingObject(host,{reducedMotion:false});}
          else if(story==='world'){const m=await import('./living-objects/world-cycle-b.mjs');api=m.mountWorldLivingObject(host,{reducedMotion:false});}
          else if(story==='coherence'){const m=await import('./living-objects/coherence-cycle-c.mjs');api=m.mountCoherenceLivingObject(host,{reducedMotion:false});if(api.ready)await api.ready;}
          else if(story==='trust'){const m=await import('./living-objects/trust-cycle-d.mjs');api=m.mountTrustLivingObject(host,{reducedMotion:false});}
          else if(story==='estate'){const m=await import('./living-objects/estate-cycle-e.mjs');api=m.createAwardsEstateCycleE({document,reducedMotion:false});host.replaceChildren(api.element);api.rest?.();}
          else throw new Error('UNKNOWN_STORY:'+story);
          window.__recognitionApi=api;window.__recognitionReady=true;
          </script></body></html>`);

          async function waitServer(){
            for(let i=0;i<30;i++){
              try{const r=await fetch(baseUrl+awardsPath);if(r.ok)return;}catch{}
              await sleep(200);
            }
            throw new Error('LOCAL_STAGE_SERVER_UNAVAILABLE');
          }
          async function canvasReady(page,selector){
            await page.waitForSelector(selector,{timeout:20000});
            await page.waitForFunction(sel=>{
              const el=document.querySelector(sel);const c=el?.querySelector('canvas')||(el instanceof HTMLCanvasElement?el:null);
              if(!el||!c)return false;
              return c.width>=120&&c.height>=120;
            },{timeout:30000},selector);
            await page.evaluate(()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve))));
            await sleep(900);
          }
          async function captureElement(page,selector,file,entry){
            const handle=await page.$(selector);if(!handle)throw new Error('CAPTURE_SELECTOR_MISSING:'+selector);
            const box=await handle.boundingBox();if(!box||box.width<80||box.height<80)throw new Error('CAPTURE_BOX_TOO_SMALL:'+selector);
            await handle.screenshot({path:file,type:'png'});
            const stat=fs.statSync(file);if(stat.size<800)throw new Error('CAPTURE_PNG_TOO_SMALL:'+file);
            captures.push({...entry,selector,file:path.basename(file),cssPixels:{width:Math.round(box.width),height:Math.round(box.height)},bytes:stat.size,captureResult:'CAPTURED',expectedDisposition:'REVIEW_REQUIRED'});
          }
          async function setViewport(page,v){await page.setViewport({width:v.width,height:v.height,deviceScaleFactor:v.deviceScaleFactor,isMobile:v.isMobile,hasTouch:v.hasTouch});}

          try{
            await waitServer();
            browser=await puppeteer.launch({executablePath:chrome,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--use-gl=swiftshader']});

            // Preserve the existing World raw-canvas compatibility evidence exactly in role.
            {
              const page=await browser.newPage();
              await setViewport(page,viewports[0]);
              await page.goto(baseUrl+awardsPath,{waitUntil:'networkidle0',timeout:45000});
              await page.waitForSelector('[data-achievement-stage]',{timeout:15000});
              const next='[data-achievement-next]';
              await page.waitForSelector(next,{timeout:10000});
              await page.click(next);
              await page.waitForFunction(()=>document.querySelector('[data-achievement-stage] .instrument-card[data-story="world"]')?.getAttribute('aria-current')==='true',{timeout:10000});
              await sleep(1400);
              const selector='[data-achievement-stage] .instrument-card[data-story="world"] .living-object-shell canvas.awards-world-true3d';
              await page.waitForSelector(selector,{timeout:10000});
              await page.evaluate(()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve))));
              const dataUrl=await page.$eval(selector,canvas=>{
                if(!(canvas instanceof HTMLCanvasElement))throw new Error('WORLD_WEBGL_CANVAS_NOT_FOUND');
                if(canvas.width<120||canvas.height<120)throw new Error('WORLD_WEBGL_CANVAS_TOO_SMALL');
                return canvas.toDataURL('image/png');
              });
              if(!dataUrl.startsWith('data:image/png;base64,'))throw new Error('WORLD_WEBGL_CANVAS_PNG_INVALID');
              fs.writeFileSync(screenshot,Buffer.from(dataUrl.slice('data:image/png;base64,'.length),'base64'));
              await page.close();
            }

            // Standalone matrix: no explanatory typography exists in the runner-local harness.
            for(const v of viewports){
              for(const story of objects){
                const page=await browser.newPage();
                await setViewport(page,v);
                await page.goto(`${baseUrl}${awardsPath}__recognition-standalone.html?story=${story}`,{waitUntil:'networkidle0',timeout:45000});
                await page.waitForFunction(()=>window.__recognitionReady===true,{timeout:30000});
                await canvasReady(page,'#host');
                const file=path.join(evidenceDir,`standalone-${story}-${v.name}.png`);
                await captureElement(page,'#host',file,{targetSha,mode:'standalone',object:story,viewport:{name:v.name,width:v.width,height:v.height,deviceScaleFactor:v.deviceScaleFactor},textHidden:true});
                await page.close();
              }
            }

            // Integrated matrix: select through the real Awards Next control and hide explanatory copy only for evidence capture.
            for(const v of viewports){
              const page=await browser.newPage();
              await setViewport(page,v);
              await page.goto(baseUrl+awardsPath,{waitUntil:'networkidle0',timeout:45000});
              await page.waitForSelector('[data-achievement-stage]',{timeout:15000});
              for(const story of objects){
                for(let guard=0;guard<6;guard++){
                  const active=await page.$eval('[data-achievement-stage]',(stage,target)=>stage.querySelector(`.instrument-card[data-story="${target}"]`)?.getAttribute('aria-current')==='true',story);
                  if(active)break;
                  await page.click('[data-achievement-next]');
                  await sleep(650);
                }
                await page.waitForFunction(target=>document.querySelector(`[data-achievement-stage] .instrument-card[data-story="${target}"]`)?.getAttribute('aria-current')==='true',{timeout:10000},story);
                const cardSel=`[data-achievement-stage] .instrument-card[data-story="${story}"]`;
                const hostSel=`${cardSel} .living-object-shell`;
                await canvasReady(page,hostSel);
                await page.$eval(cardSel,card=>{
                  for(const el of card.querySelectorAll('.surface-copy,.kicker,h3,.surface-thought,.open-cue'))el.style.visibility='hidden';
                });
                const file=path.join(evidenceDir,`integrated-${story}-${v.name}.png`);
                await captureElement(page,hostSel,file,{targetSha,mode:'integrated',object:story,viewport:{name:v.name,width:v.width,height:v.height,deviceScaleFactor:v.deviceScaleFactor},textHidden:true});
              }
              await page.close();
            }

            if(captures.length!==30)throw new Error(`RECOGNITION_MATRIX_INCOMPLETE:${captures.length}`);
            const manifest={schema:'AWARDS_RECOGNITION_EVIDENCE_MANIFEST_v1',result:'EVIDENCE_CAPTURED_NOT_SEMANTIC_PASS',targetSha,surfaceId:'awards',captureCount:captures.length,objects,viewports:viewports.map(({name,width,height,deviceScaleFactor})=>({name,width,height,deviceScaleFactor})),modes:['standalone','integrated'],textHidden:true,semanticRecognitionAuthority:'SEPARATE_NONCOMPENSATORY_REVIEW',negativeControlSupport:{expectedDispositionField:true,decisionOwnedByParentRecovery:true},captures};
            fs.writeFileSync(evidenceManifest,JSON.stringify(manifest,null,2)+'\n');
          } finally {
            if(browser)await browser.close();
            server.kill('SIGTERM');
          }
          NODE
          test -s "$SCREENSHOT"
          test -s "$EVIDENCE_MANIFEST"
          test "$(find "$EVIDENCE_DIR" -maxdepth 1 -type f -name '*.png' | wc -l | tr -d '[:space:]')" -eq 30
          jq -e --arg sha "$TARGET_SHA" '.schema=="AWARDS_RECOGNITION_EVIDENCE_MANIFEST_v1" and .result=="EVIDENCE_CAPTURED_NOT_SEMANTIC_PASS" and .targetSha==$sha and .captureCount==30 and (.captures|length)==30 and ([.captures[].mode]|unique|sort)==["integrated","standalone"] and ([.captures[].object]|unique|sort)==["coherence","estate","experience","trust","world"] and ([.captures[].viewport.name]|unique|sort)==["desktop","phone","tablet"]' "$EVIDENCE_MANIFEST" >/dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-fast-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/publication-preflight-receipt.json
            ${{ runner.temp }}/publication-preflight-screenshot.png
            ${{ runner.temp }}/awards-recognition-evidence/recognition-evidence-manifest.json
            ${{ runner.temp }}/awards-recognition-evidence/*.png
          if-no-files-found: error
          retention-days: 90
