name: Workflow Lifecycle V2 Authenticated Assessment Carrier

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/ai-room-transport/workflow-lifecycle-continuity-v2-remote-execution.v1.mjs'
      - '.github/workflows/workflow-lifecycle-continuity-v2-authenticated-assessment.yml'
  issue_comment:
    types: [created]

permissions: {}

env:
  REQUEST_MARKER: WORKFLOW_LIFECYCLE_V2_AUTHENTICATED_ASSESSMENT_REQUEST_V1
  REGISTRATION_BASE: b46d6453b8d2a8c39b0dd91c1d32db34aee6f073
  ADAPTER_PATH: tools/ai-room-transport/workflow-lifecycle-continuity-v2-remote-execution.v1.mjs
  ADAPTER_BLOB: 74016765e1ed5331798c5494c92955b3c1a60c08
  VERIFIER_PATH: .github/ai-router/workflow-lifecycle-continuity/workflow-lifecycle-continuity-verifier.v1.mjs
  VERIFIER_BLOB: 1252498ced4960ce7066a51b916f833d8b2895f6
  DISCOVERY_PATH: .github/ai-router/workflow-lifecycle-continuity/consumer-discovery.v2.mjs
  DISCOVERY_BLOB: 074a0a0ca772f7e31d8552a5d05308c0bc49f3b8

jobs:
  validate-candidate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact two-stage two-path candidate
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_HEAD="$(git rev-parse HEAD^{commit})"
          test "$CANDIDATE_HEAD" = "${{ github.event.pull_request.head.sha }}"
          TOOLING_HEAD="$(git rev-parse "$CANDIDATE_HEAD^")"
          test "$(git rev-parse "$TOOLING_HEAD^")" = "$REGISTRATION_BASE"
          git diff --name-only "$REGISTRATION_BASE" "$TOOLING_HEAD" | sort > "$RUNNER_TEMP/tooling.txt"
          printf '%s\n' "$ADAPTER_PATH" | sort > "$RUNNER_TEMP/tooling.expected"
          diff -u "$RUNNER_TEMP/tooling.expected" "$RUNNER_TEMP/tooling.txt"
          git diff --name-only "$TOOLING_HEAD" "$CANDIDATE_HEAD" | sort > "$RUNNER_TEMP/carrier.txt"
          printf '%s\n' '.github/workflows/workflow-lifecycle-continuity-v2-authenticated-assessment.yml' | sort > "$RUNNER_TEMP/carrier.expected"
          diff -u "$RUNNER_TEMP/carrier.expected" "$RUNNER_TEMP/carrier.txt"
          test "$(git rev-parse "$CANDIDATE_HEAD:$ADAPTER_PATH")" = "$ADAPTER_BLOB"
          test "$(git rev-parse "$CANDIDATE_HEAD:$VERIFIER_PATH")" = "$VERIFIER_BLOB"
          test "$(git rev-parse "$CANDIDATE_HEAD:$DISCOVERY_PATH")" = "$DISCOVERY_BLOB"
          echo "CANDIDATE_HEAD=$CANDIDATE_HEAD" >> "$GITHUB_ENV"
          echo "TOOLING_HEAD=$TOOLING_HEAD" >> "$GITHUB_ENV"
      - name: Verify read-only workflow contract
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          grep -Fq 'issue_comment:' '.github/workflows/workflow-lifecycle-continuity-v2-authenticated-assessment.yml'
          grep -Fq 'contents: read' '.github/workflows/workflow-lifecycle-continuity-v2-authenticated-assessment.yml'
          grep -Fq 'actions: read' '.github/workflows/workflow-lifecycle-continuity-v2-authenticated-assessment.yml'
          grep -Fq 'pull-requests: read' '.github/workflows/workflow-lifecycle-continuity-v2-authenticated-assessment.yml'
          ! grep -Eq 'contents: write|actions: write|pull-requests: write|issues: write|deployments: write|packages: write' '.github/workflows/workflow-lifecycle-continuity-v2-authenticated-assessment.yml'
          forbidden='fixed-command-dispatcher.'
          forbidden="${forbidden}v1.mjs"
          ! grep -Fq "$forbidden" '.github/workflows/workflow-lifecycle-continuity-v2-authenticated-assessment.yml'
      - name: Run adapter self-test
        shell: bash
        run: |
          set -euo pipefail
          node --check "$ADAPTER_PATH"
          node "$ADAPTER_PATH" --self-test --output "$RUNNER_TEMP/adapter-self-test.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/adapter-self-test.json');if(r.result!=='PASS_CLOSED'||r.negativeFixturesPassed!==r.negativeFixtureCount||r.genericCommandAuthority)process.exit(1)"
      - name: Prove GitHub token reaches native v2 verifier
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const head=process.env.CANDIDATE_HEAD;
          const A=(type,predicate,extra={})=>({type,predicate,assertions:type==='ACTIONS_WORKFLOW_INVENTORY'?undefined:[{kind:'TEXT_CONTAINS',value:'x'}],...extra});
          const req={
            FULL_ACTIONS_SURFACE_INVENTORY:{status:'PASS',evidence:[{type:'ACTIONS_WORKFLOW_INVENTORY',predicate:'FULL_ACTIONS_SURFACE_INVENTORY',expectedCount:0,workflowIds:[],identitiesDigest:'4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945'}]},
            CURRENT_AUTHORITY_CLASSIFICATION:{status:'PASS',evidence:[A('REPOSITORY_BLOB','CURRENT_AUTHORITY_CLASSIFICATION',{path:'AI_ENTRYPOINT.json',blobSha:'0'.repeat(40),ref:head})]},
            ZERO_JOB_AND_EXPECTED_FAILURE_SIGNAL_NORMALIZATION:{status:'PASS',evidence:[A('WORKFLOW_RUN_JOB_OBSERVATION','ZERO_JOB_AND_EXPECTED_FAILURE_SIGNAL_NORMALIZATION',{runId:1,executedJobCount:0,expectedHead:head})]},
            PROTECTED_LIVE_WORKSTREAM_NONINTERFERENCE:{status:'PASS',evidence:[A('GITHUB_PR','PROTECTED_LIVE_WORKSTREAM_NONINTERFERENCE',{number:1,expectedHead:head})]},
            CONTINUITY_PROOF_FOR_EACH_PHYSICAL_RETIREMENT_CLASS:{status:'PASS',evidence:[A('GITHUB_COMMIT','CONTINUITY_PROOF_FOR_EACH_PHYSICAL_RETIREMENT_CLASS',{sha:head})]},
            POST_MERGE_OBSERVATION_PROOF:{status:'PASS',evidence:[A('GITHUB_COMMIT','POST_MERGE_OBSERVATION_PROOF',{sha:head})]}
          };
          for(const group of Object.values(req))for(const e of group.evidence)if(e.assertions===undefined)delete e.assertions;
          const assessment={schema:'WORKFLOW_LIFECYCLE_RETIREMENT_CONTINUITY_ASSESSMENT_v2',governingHead:head,gapId:'WORKFLOW_INSTRUMENT_LIFECYCLE_ADOPTION_RETIREMENT_SIGNAL_CONTINUITY',requirements:req,signals:[{class:'ZERO_JOB_FAILURE_SIGNAL',executedJobCount:0}],authorityEffects:{physicalRetirementAuthorized:false,gapRegistryMutationAuthorized:false,mergeAuthorized:false,productMutationAuthorized:false,workflowMutationAuthorized:false},consumerDiscovery:{schema:'WORKFLOW_LIFECYCLE_CONSUMER_DISCOVERY_REQUEST_v2',searchRoots:['.'],tokens:['__TOKEN_REACHABILITY_FIXTURE__'],expectedReceipt:{receiptDigest:'0'.repeat(64),scannedPathDigest:'0'.repeat(64)},allowedConsumers:[]}};
          fs.writeFileSync(process.env.RUNNER_TEMP+'/token-path-assessment.b64',Buffer.from(JSON.stringify(assessment)).toString('base64'));
          NODE
          set +e
          node "$ADAPTER_PATH" \
            --subject-head "$CANDIDATE_HEAD" \
            --assessment-base64 "$(cat "$RUNNER_TEMP/token-path-assessment.b64")" \
            --execution-holder WORKFLOW_LIFECYCLE_V2_TOKEN_PATH_VALIDATION \
            --output "$RUNNER_TEMP/token-path-receipt.json"
          status=$?
          set -e
          test "$status" -ne 0
          node - <<'NODE'
          const r=require(process.env.RUNNER_TEMP+'/token-path-receipt.json');
          if(r.schema!=='WORKFLOW_LIFECYCLE_V2_REMOTE_EXECUTION_RECEIPT_v1'||r.result!=='FAIL_CLOSED')process.exit(1);
          if(!r.nativeReceipt||r.nativeReceipt.errorCode==='GITHUB_TOKEN_REQUIRED'||r.nativeReceipt.errorCode==='GOVERNING_MAIN_AUTHENTICATION_ERROR')process.exit(1);
          if(r.nativeReceipt.errorCode!=='GOVERNING_MAIN_MISMATCH')process.exit(1);
          if(!r.repositoryCleanBefore||!r.repositoryCleanAfter||!r.subjectWorktreeCleanBefore||!r.subjectWorktreeCleanAfter)process.exit(1);
          NODE
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Emit candidate validation receipt
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');const s=require(process.env.RUNNER_TEMP+'/adapter-self-test.json');const t=require(process.env.RUNNER_TEMP+'/token-path-receipt.json');
          const out={schema:'WORKFLOW_LIFECYCLE_V2_DEDICATED_CARRIER_VALIDATION_RECEIPT_v1',result:'PASS_CLOSED',candidateHead:process.env.CANDIDATE_HEAD,toolingHead:process.env.TOOLING_HEAD,adapterBlob:process.env.ADAPTER_BLOB,verifierBlob:process.env.VERIFIER_BLOB,consumerDiscoveryBlob:process.env.DISCOVERY_BLOB,adapterSelfTest:s.result,tokenPathNativeResult:t.nativeReceipt?.result,tokenPathNativeErrorCode:t.nativeReceipt?.errorCode,tokenReachedNativeVerifier:t.nativeReceipt?.errorCode==='GOVERNING_MAIN_MISMATCH',repositoryWritePermission:false,genericDispatcherMutation:false,genericCommandAuthority:false,gapClosureAuthorized:false,physicalRetirementAuthorized:false,productMutationAuthorized:false,mergeAuthorized:false,realV2AssessmentExecuted:false};
          fs.writeFileSync(process.env.RUNNER_TEMP+'/carrier-validation.json',JSON.stringify(out,null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: workflow-lifecycle-v2-carrier-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/adapter-self-test.json
            ${{ runner.temp }}/token-path-receipt.json
            ${{ runner.temp }}/carrier-validation.json
          if-no-files-found: error
          retention-days: 90

  execute-authenticated-assessment:
    if: >-
      github.event_name == 'issue_comment' &&
      startsWith(github.event.comment.body, 'WORKFLOW_LIFECYCLE_V2_AUTHENTICATED_ASSESSMENT_REQUEST_V1') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify installed immutable identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:$ADAPTER_PATH)" = "$ADAPTER_BLOB"
          test "$(git rev-parse HEAD:$VERIFIER_PATH)" = "$VERIFIER_BLOB"
          test "$(git rev-parse HEAD:$DISCOVERY_PATH)" = "$DISCOVERY_BLOB"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Parse exact authenticated assessment request
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');const marker=process.env.REQUEST_MARKER;const body=String(process.env.COMMENT_BODY||'').trim();
          if(!body.startsWith(marker))throw Error('REQUEST_MARKER_MISSING');const tail=body.slice(marker.length).trim();if(!tail.startsWith('{')||!tail.endsWith('}'))throw Error('REQUEST_JSON_NOT_EXACT');
          const q=JSON.parse(tail);const keys=Object.keys(q).sort(),expected=['assessmentBase64','executionHolder','requestNonce','schema','subjectHead'].sort();if(JSON.stringify(keys)!==JSON.stringify(expected))throw Error('REQUEST_KEYSET_INVALID');
          if(q.schema!=='WORKFLOW_LIFECYCLE_V2_AUTHENTICATED_ASSESSMENT_INVOCATION_REQUEST_v1')throw Error('REQUEST_SCHEMA_INVALID');if(!/^[0-9a-f]{40}$/.test(q.subjectHead)||q.subjectHead!==process.env.GITHUB_SHA)throw Error('SUBJECT_HEAD_NOT_EVENT_MAIN');
          if(typeof q.assessmentBase64!=='string'||q.assessmentBase64.length<4||!/^[A-Za-z0-9+/]+={0,2}$/.test(q.assessmentBase64))throw Error('ASSESSMENT_BASE64_INVALID');if(!/^[A-Z0-9][A-Z0-9_.:-]{2,127}$/.test(q.executionHolder))throw Error('EXECUTION_HOLDER_INVALID');if(!/^[0-9a-f]{64}$/.test(q.requestNonce))throw Error('REQUEST_NONCE_INVALID');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/carrier-request.json',JSON.stringify(q,null,2)+'\n');
          NODE
      - name: Execute fixed v2 adapter with GitHub token
        id: execute
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          node - <<'NODE'
          const fs=require('fs');const q=require(process.env.RUNNER_TEMP+'/carrier-request.json');
          fs.appendFileSync(process.env.RUNNER_TEMP+'/args.env',`SUBJECT_HEAD=${q.subjectHead}\nEXECUTION_HOLDER=${q.executionHolder}\n`);
          fs.writeFileSync(process.env.RUNNER_TEMP+'/assessment.b64',q.assessmentBase64);
          NODE
          source "$RUNNER_TEMP/args.env"
          node "$ADAPTER_PATH" --subject-head "$SUBJECT_HEAD" --assessment-base64 "$(cat "$RUNNER_TEMP/assessment.b64")" --execution-holder "$EXECUTION_HOLDER" --output "$RUNNER_TEMP/v2-remote-execution-receipt.json"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify bounded receipt and clean repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/v2-remote-execution-receipt.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/v2-remote-execution-receipt.json');if(r.schema!=='WORKFLOW_LIFECYCLE_V2_REMOTE_EXECUTION_RECEIPT_v1'||r.productMutationPerformed||r.gapRegistryMutationPerformed||r.physicalRetirementPerformed||r.workflowMutationPerformed||r.branchCreated||r.genericCommandAuthority||r.mergePerformed||r.deploymentPerformed||r.releasePerformed)process.exit(1)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-lifecycle-v2-authenticated-assessment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v2-remote-execution-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce native disposition
        if: always()
        env:
          EXECUTION_STATUS: ${{ steps.execute.outputs.status }}
        shell: bash
        run: test "$EXECUTION_STATUS" = "0"
