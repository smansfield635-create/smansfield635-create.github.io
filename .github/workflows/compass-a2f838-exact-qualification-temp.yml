name: Compass practical publishability smoke

on:
  push:
    branches:
      - compass-a2f838-exact-qualification-temp

permissions:
  contents: read

jobs:
  practical-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact Compass candidate
        uses: actions/checkout@v4
        with:
          ref: aee18d9eb7f72e75f78e2fbb1c8cdaacbe9bdd5d
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            index.html
            assets/compass
          sparse-checkout-cone-mode: true
      - name: Prove exact candidate
        run: test "$(git rev-parse HEAD)" = "aee18d9eb7f72e75f78e2fbb1c8cdaacbe9bdd5d"
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Install browser dependency
        run: npm install --no-save --no-package-lock puppeteer-core@24.15.0
      - name: Serve exact candidate
        run: |
          python3 -m http.server 4173 >/tmp/compass-practical-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Verify practical Compass publishability
        shell: bash
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chrome || command -v chromium || find /opt/hostedtoolcache/setup-chrome -type f -name chrome 2>/dev/null | head -1)"
          node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:'new',args:['--no-sandbox','--ignore-gpu-blocklist','--enable-webgl','--use-gl=angle','--use-angle=swiftshader']});
          const page=await browser.newPage();
          await page.setViewport({width:900,height:1000,deviceScaleFactor:1});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:60000});
          await new Promise(r=>setTimeout(r,1600));
          const scene=await page.$('[data-compass-scene]');
          if(!scene) throw new Error('NO_COMPASS_SCENE');
          await scene.evaluate(el=>el.scrollIntoView({block:'center',inline:'nearest'}));
          await new Promise(r=>setTimeout(r,250));
          const snap=()=>page.evaluate(()=>{
            const rr=e=>{const r=e?.getBoundingClientRect();return r?{cx:r.x+r.width/2,cy:r.y+r.height/2,width:r.width,height:r.height,x:r.x,y:r.y}:null};
            const root=document.querySelector('[data-compass-root]');
            const intro=document.querySelector('.compass-orbit-intro');
            const heading=intro?.querySelector('h2');
            const cardinals=[...document.querySelectorAll('[data-compass-cardinal]')].map(e=>({wing:e.dataset.wing,primary:e.dataset.primary==='true',rect:rr(e),labelVisible:[...e.querySelectorAll(':scope>span')].some(s=>{const cs=getComputedStyle(s),r=s.getBoundingClientRect();return cs.visibility!=='hidden'&&Number(cs.opacity)>.5&&r.width>0&&r.height>0})}));
            return {url:location.href,focus:root?.dataset.orbitFocus||'',preview:root?.dataset.orbitPreviewFocus||'',phase:root?.dataset.orbitPhase||'',dragging:root?.dataset.compassDragging||'',gestureScope:root?.dataset.compassGestureScope||'',scene:rr(document.querySelector('[data-compass-scene]')),heading:rr(heading),cardinals,primary:cardinals.filter(x=>x.primary).map(x=>x.wing),visible:cardinals.filter(x=>x.labelVisible).map(x=>x.wing),overflow:document.documentElement.scrollWidth-innerWidth,crystalsReceipt:globalThis.DGB_COMPASS_CRYSTALS_RECEIPT||null,controllerReceipt:globalThis.DGB_COMPASS_CONTROLLER_RECEIPT||null};
          });
          const initial=await snap();
          if(initial.cardinals.length!==4) throw new Error('FOUR_STAR_PRESENCE_FAIL');
          if(initial.primary.length!==1||initial.visible.length!==1||initial.primary[0]!==initial.visible[0]) throw new Error('INITIAL_CORRESPONDENCE_FAIL');
          if(Math.abs(initial.scene.cx-450)>18) throw new Error('TABLET_SCENE_ALIGNMENT_FAIL');
          if(Math.abs(initial.heading.cx-450)>12) throw new Error('TABLET_HEADING_ALIGNMENT_FAIL');
          if(Math.abs(initial.overflow)>1) throw new Error('HORIZONTAL_OVERFLOW_FAIL');
          const anchor={cx:initial.cardinals.find(x=>x.primary).rect.cx,cy:initial.cardinals.find(x=>x.primary).rect.cy};
          const visited=new Set([initial.focus]);
          const transitions=[];
          for(let attempt=0;attempt<6&&visited.size<4;attempt++){
            const before=await snap();
            const active=before.cardinals.find(x=>x.primary);
            if(!active?.rect) throw new Error('NO_ACTIVE_PRIMARY_RECT');
            const startX=active.rect.cx,startY=active.rect.cy;
            const sceneWidth=before.scene.width;
            const direction=attempt%2===0?-1:1;
            const endX=Math.max(before.scene.x+24,Math.min(before.scene.x+before.scene.width-24,startX+direction*sceneWidth*.48));
            await page.mouse.move(startX,startY);
            await page.mouse.down();
            for(let i=1;i<=24;i++){const t=i/24;await page.mouse.move(startX+(endX-startX)*t,startY,{steps:1});await new Promise(r=>setTimeout(r,20));}
            const during=await snap();
            console.log('DURING',attempt+1,JSON.stringify({focus:during.focus,preview:during.preview,phase:during.phase,dragging:during.dragging,scope:during.gestureScope,crystals:during.crystalsReceipt?.lastGestureType||null}));
            await page.mouse.up();
            await new Promise(r=>setTimeout(r,300));
            const early=await snap();
            await new Promise(r=>setTimeout(r,650));
            const after=await snap();
            console.log('AFTER',attempt+1,JSON.stringify({from:before.focus,to:after.focus,phase:after.phase,url:after.url,primary:after.primary,visible:after.visible,crystals:after.crystalsReceipt?.lastGestureType||null}));
            if(after.url!=='http://127.0.0.1:4173/') throw new Error(`ACCIDENTAL_NAVIGATION:${after.url}`);
            if(after.focus!==before.focus&&after.phase==='COMMITTED'){
              visited.add(after.focus);
              const incoming=after.cardinals.find(x=>x.wing===after.focus);
              const incomingEarly=early.cardinals.find(x=>x.wing===after.focus);
              const anchorError=Math.hypot(incoming.rect.cx-anchor.cx,incoming.rect.cy-anchor.cy);
              const drift=Math.hypot(incoming.rect.cx-incomingEarly.rect.cx,incoming.rect.cy-incomingEarly.rect.cy);
              const correspondence=after.primary.length===1&&after.visible.length===1&&after.primary[0]===after.focus&&after.visible[0]===after.focus;
              transitions.push({from:before.focus,to:after.focus,anchorError,drift,correspondence});
              if(anchorError>24) throw new Error(`FOREGROUND_SETTLEMENT_FAIL:${after.focus}:${anchorError}`);
              if(drift>8) throw new Error(`RELEASE_STABILITY_FAIL:${after.focus}:${drift}`);
              if(!correspondence) throw new Error(`CARDINAL_CORRESPONDENCE_FAIL:${after.focus}`);
            }
          }
          if(visited.size<3) throw new Error(`INSUFFICIENT_PRIMARY_STAR_DRAG_TRANSITIONS:${[...visited].join(',')}`);
          if(errors.length) throw new Error(`BROWSER_ERRORS:${errors.join('|')}`);
          console.log(JSON.stringify({status:'PASS',candidate:'aee18d9eb7f72e75f78e2fbb1c8cdaacbe9bdd5d',visited:[...visited],transitions,tablet:{sceneCenterError:initial.scene.cx-450,headingCenterError:initial.heading.cx-450},errors},null,2));
          await browser.close();
          NODE
