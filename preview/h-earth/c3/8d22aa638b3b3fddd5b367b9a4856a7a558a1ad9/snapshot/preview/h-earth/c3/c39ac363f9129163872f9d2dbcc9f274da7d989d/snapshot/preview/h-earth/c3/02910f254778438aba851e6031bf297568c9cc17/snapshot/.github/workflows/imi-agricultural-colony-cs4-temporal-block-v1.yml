name: IMI Agricultural Colony CS4 Temporal Block v1

on:
  pull_request:
    branches: [main]
    paths:
      - "research/route-operator-platform-v1/extensions/imi-falsification-route-extension-v1/executions/agricultural-colony-cs4-next-quarter-loss-retrospective-temporal-block-v1/**"
      - ".github/workflows/imi-agricultural-colony-cs4-temporal-block-v1.yml"
  push:
    branches: [main]
    paths:
      - "research/route-operator-platform-v1/extensions/imi-falsification-route-extension-v1/executions/agricultural-colony-cs4-next-quarter-loss-retrospective-temporal-block-v1/**"
      - ".github/workflows/imi-agricultural-colony-cs4-temporal-block-v1.yml"

permissions:
  contents: read

jobs:
  verify-execution-pointer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify agricultural temporal-block execution pointer
        run: >-
          python
          research/route-operator-platform-v1/extensions/imi-falsification-route-extension-v1/executions/agricultural-colony-cs4-next-quarter-loss-retrospective-temporal-block-v1/verify_execution_pointer_v1.py
