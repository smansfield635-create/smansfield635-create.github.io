name: Agentic Frontier Paired Execution v1

on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  paired-smoke-af-ir-01:
    if: >-
      github.event.issue.number == 2089 &&
      contains(github.event.comment.body, 'AGENTIC_FRONTIER_PAIRED_SMOKE_AF_IR_01_V1')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OLLAMA_MODEL: qwen2.5-coder:7b
      OLLAMA_HOST_URL: http://127.0.0.1:11434
      MODEL_FIRST_TOKEN_TIMEOUT_S: '90'
      MODEL_HARD_TIMEOUT_S: '240'
      OPENHANDS_INACTIVITY_S: '180'
      OPENHANDS_HARD_TIMEOUT_S: '600'
      PAIR_HEARTBEAT_S: '15'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout paired runner from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Report runner capacity
        run: |
          set -euo pipefail
          echo "CPU cores: $(nproc)"
          free -h
          mem_kb=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          if [ "$mem_kb" -lt 6000000 ]; then
            echo "Insufficient RAM for bounded 7B local comparison lane"
            exit 2
          fi
          echo "Capacity gate passed for qwen2.5-coder:7b"

      - name: Restore pinned OpenHands environment
        id: openhands-cache
        uses: actions/cache@v4
        with:
          path: .cache/agentic-frontier/openhands-1.14.0
          key: ${{ runner.os }}-py312-openhands-1.14.0-v1

      - name: Install pinned OpenHands CLI 1.14.0 only on cache miss
        run: |
          set -euo pipefail
          VENV="$GITHUB_WORKSPACE/.cache/agentic-frontier/openhands-1.14.0"
          if [ ! -x "$VENV/bin/openhands" ]; then
            rm -rf "$VENV"
            python -m venv "$VENV"
            "$VENV/bin/python" -m pip install --disable-pip-version-check 'openhands==1.14.0'
          fi
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/openhands" --version

      - name: Restore local model cache
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ${{ runner.os }}-ollama-qwen2.5-coder-7b-v1

      - name: Start common local model runtime
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ollama/models"
          docker pull ollama/ollama:0.32.14
          docker run -d --name agentic-frontier-ollama \
            -e OLLAMA_CONTEXT_LENGTH=8192 \
            -v "$HOME/.ollama:/root/.ollama" \
            -p 11434:11434 \
            ollama/ollama:0.32.14
          for i in $(seq 1 45); do
            curl -fsS "$OLLAMA_HOST_URL/api/tags" >/dev/null && break
            sleep 2
          done
          if docker exec agentic-frontier-ollama ollama list | grep -Fq "$OLLAMA_MODEL"; then
            echo "Model $OLLAMA_MODEL restored from cache; skipping pull."
          else
            echo "Model $OLLAMA_MODEL absent from cache; pulling once."
            docker exec agentic-frontier-ollama ollama pull "$OLLAMA_MODEL"
          fi

      - name: Execute frozen AF-IR-01 pair with fail-fast model gate
        id: pair
        run: |
          set +e
          python tools/research/agentic-frontier/paired-smoke-ir01-v1.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload paired evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentic-frontier-paired-smoke-af-ir-01-v1
          path: agentic-frontier-ir01-paired-receipt.json
          if-no-files-found: error

      - name: Enforce paired smoke
        run: |
          test "${{ steps.pair.outputs.exit_code }}" = "0"
