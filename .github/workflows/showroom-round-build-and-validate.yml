name: Showroom live deployment verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-showroom:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/showroom-startup-spatial-cosmos-001'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Poll public HTML and asset identities
        shell: bash
        run: |
          set -euo pipefail
          live=https://diamondgatebridge.com/showroom/
          cache=SHOWROOM_COMPASS_SPATIAL_COSMOS_20260726J
          contract=SHOWROOM_MIRRORLAND_IMMERSIVE_MISSION_CONTEXT_HTML_TNT_v17_10_SPATIAL_COSMOS_CONTINUITY
          confirmed=false
          for attempt in $(seq 1 30); do
            if curl -fsSL -H 'Cache-Control: no-cache' "${live}?cb=2aded111a95d727a4ca12da62d9ebe5f02ddd727-${attempt}" -o /tmp/showroom-live.html \
              && grep -q "$cache" /tmp/showroom-live.html \
              && grep -q "$contract" /tmp/showroom-live.html; then
              confirmed=true
              break
            fi
            sleep 10
          done
          test "$confirmed" = true
          grep -q "/showroom/index.cosmos.js?v=$cache" /tmp/showroom-live.html
          grep -q "/showroom/index.crystals.js?v=$cache" /tmp/showroom-live.html
          grep -q 'SHOWROOM_MIRRORLAND_NARRATIVE_ATLAS_CSS_TNT_v14_0_COSMOS_COMPLEMENTARY_STAGE_RENEWAL' /tmp/showroom-live.html

          curl -fsSL -H 'Cache-Control: no-cache' "https://diamondgatebridge.com/showroom/index.cosmos.js?v=${cache}&cb=2aded111a95d727a4ca12da62d9ebe5f02ddd727" -o /tmp/showroom-live-cosmos.js
          curl -fsSL -H 'Cache-Control: no-cache' "https://diamondgatebridge.com/showroom/index.crystals.js?v=${cache}&cb=2aded111a95d727a4ca12da62d9ebe5f02ddd727" -o /tmp/showroom-live-crystals.js
          grep -q 'SHOWROOM_COSMOS_ARCHCOIN_SCENE_FIELD_v1' /tmp/showroom-live-cosmos.js
          grep -q 'SHOWROOM_CANONICAL_CRYSTAL_SPATIAL_INTEGRATION_v2' /tmp/showroom-live-crystals.js
          ! grep -q 'XMLHttpRequest' /tmp/showroom-live-cosmos.js
          status=$(curl -sS -o /tmp/showroom-retired-source-response -w '%{http_code}' -H 'Cache-Control: no-cache' "https://diamondgatebridge.com/showroom/index.cosmos.source.js?cb=2aded111a95d727a4ca12da62d9ebe5f02ddd727")
          test "$status" = 404
          printf 'public_html=PASS\npublic_cosmos=PASS\npublic_crystals=PASS\nretired_source_status=%s\n' "$status" | tee /tmp/showroom-live-fetch.txt

      - name: Install live-browser runtime
        run: |
          mkdir -p /tmp/showroom-live-browser
          cd /tmp/showroom-live-browser
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null

      - name: Execute public runtime at three viewports
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/showroom-live-browser.cjs <<'NODE'
          const { chromium } = require('/tmp/showroom-live-browser/node_modules/playwright');
          const fs = require('node:fs');
          const profiles=[
            {name:'phone',width:390,height:844,dpr:3},
            {name:'tablet',width:768,height:1024,dpr:2},
            {name:'desktop',width:1440,height:900,dpr:1}
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            const results=[];
            for(const p of profiles){
              const context=await browser.newContext({viewport:{width:p.width,height:p.height},deviceScaleFactor:p.dpr});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              await page.goto(`https://diamondgatebridge.com/showroom/?cb=2aded111a95d727a4ca12da62d9ebe5f02ddd727-${p.name}`,{waitUntil:'domcontentloaded',timeout:30000});
              await page.locator('#showroom-orbit').scrollIntoViewIfNeeded();
              await page.waitForFunction(()=>Boolean(window.SHOWROOM_COSMOS_RECEIPT?.initialized),null,{timeout:20000});
              await page.waitForFunction(()=>Boolean(window.SHOWROOM_CRYSTALS?.getState?.().ready),null,{timeout:20000});
              const result=await page.evaluate(()=>({
                htmlContract:document.documentElement.dataset.contract,
                cosmosContract:window.SHOWROOM_COSMOS_RECEIPT?.contract,
                crystalContract:window.SHOWROOM_CRYSTALS?.contract,
                cosmosCanvases:document.querySelectorAll('[data-showroom-cosmos-canvas]').length,
                compositorCanvases:document.querySelectorAll('canvas[data-showroom-compositor-layer]').length,
                oldSourceReferences:[...document.scripts].filter(s=>s.src.includes('index.cosmos.source.js')).length,
                cosmosStatus:document.querySelector('[data-showroom-root]')?.dataset.showroomCosmosStatus,
                crystalReady:window.SHOWROOM_CRYSTALS?.getState?.().ready
              }));
              result.profile=p.name; result.errors=errors;
              if(result.htmlContract!=='SHOWROOM_MIRRORLAND_IMMERSIVE_MISSION_CONTEXT_HTML_TNT_v17_10_SPATIAL_COSMOS_CONTINUITY') throw new Error(`${p.name}: html contract`);
              if(result.cosmosContract!=='SHOWROOM_COSMOS_ARCHCOIN_SCENE_FIELD_v1') throw new Error(`${p.name}: cosmos contract`);
              if(result.crystalContract!=='SHOWROOM_CANONICAL_CRYSTAL_SPATIAL_INTEGRATION_v2') throw new Error(`${p.name}: crystal contract`);
              if(result.cosmosCanvases!==2 || result.compositorCanvases!==2) throw new Error(`${p.name}: canvas closure`);
              if(result.oldSourceReferences!==0) throw new Error(`${p.name}: retired source reference`);
              if(errors.length) throw new Error(`${p.name}: runtime errors ${errors.join(' | ')}`);
              results.push(result);
              await context.close();
            }
            await browser.close();
            fs.writeFileSync('/tmp/showroom-live-runtime.json',JSON.stringify(results,null,2));
            console.log(JSON.stringify(results,null,2));
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
          node /tmp/showroom-live-browser.cjs

      - name: Upload live verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showroom-live-verification-evidence
          path: |
            /tmp/showroom-live-fetch.txt
            /tmp/showroom-live-runtime.json
            /tmp/showroom-live.html
          if-no-files-found: warn
