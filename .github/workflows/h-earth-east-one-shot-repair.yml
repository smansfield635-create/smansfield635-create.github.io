name: H-Earth East one-shot repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-verified-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify pinned bytes and apply exact repair
        shell: bash
        run: |
          python3 - <<'PY'
          from hashlib import sha1, sha256
          from pathlib import Path
          import json

          path = Path('showroom/globe/h-earth/render/geometry-kernel.east.js')
          source = path.read_bytes()

          def git_blob_sha(data: bytes) -> str:
              return sha1(f'blob {len(data)}\0'.encode('ascii') + data).hexdigest()

          source_identity = {
              'byteLength': len(source),
              'sha256': sha256(source).hexdigest(),
              'gitBlobSha1': git_blob_sha(source),
          }
          assert source_identity == {
              'byteLength': 128722,
              'sha256': '5ce77ab2e477ff1585e2e5835c6c95cac32219e28e44b589f43d15a10afe8e2c',
              'gitBlobSha1': 'b9872c89291f9ec6d404fd7203d7de57826670cf',
          }, source_identity

          replacements = (
              (b'? ${first}:${second}', b'? `${first}:${second}`'),
              (b': ${second}:${first};', b': `${second}:${first}`;'),
              (b'return ${first}:${second};', b'return `${first}:${second}`;'),
          )

          candidate = source
          replacement_counts = []
          for old, new in replacements:
              count = candidate.count(old)
              assert count == 1, (old, count)
              candidate = candidate.replace(old, new, 1)
              replacement_counts.append(count)

          candidate_identity = {
              'byteLength': len(candidate),
              'sha256': sha256(candidate).hexdigest(),
              'gitBlobSha1': git_blob_sha(candidate),
          }
          assert candidate_identity == {
              'byteLength': 128728,
              'sha256': '4e586ab473123bd0fc4a77c10e07d7f742a48f10d9d8afbb6ae65282136fa6ba',
              'gitBlobSha1': '261e73cc2c561dbf8d4f2f8210e51dad361cec91',
          }, candidate_identity

          for old, new in replacements:
              assert old not in candidate
              assert candidate.count(new) == 1

          path.write_bytes(candidate)
          report = {
              'result': 'EXACT_EAST_CANDIDATE_CONSTRUCTED',
              'sourceIdentity': source_identity,
              'candidateIdentity': candidate_identity,
              'replacementCount': sum(replacement_counts),
              'changedRepositoryPath': '/showroom/globe/h-earth/render/geometry-kernel.east.js',
              'sourceCorrectionAuthority': 'DIRECT_ORIGIN_AUTHORITY_BOUNDED_TO_ESTABLISHED_DEFECT',
              'productionClaimAuthority': 'NONE',
          }
          Path('east-repair-verification.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, indent=2))
          PY

      - name: Run East syntax check
        shell: bash
        run: node --check showroom/globe/h-earth/render/geometry-kernel.east.js

      - name: Parse and link all nineteen governed roots
        shell: bash
        run: |
          node --experimental-vm-modules --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import path from 'node:path';
          import vm from 'node:vm';
          import { fileURLToPath, pathToFileURL } from 'node:url';

          const root = process.cwd();
          const manifestModule = await import(pathToFileURL(
            path.join(root, 'showroom/globe/h-earth/diagnostic/manifest-projection.js')
          ).href);
          const manifest = manifestModule.H_EARTH_FD05_MANIFEST_PROJECTION;
          if (!manifest || !Array.isArray(manifest.rows) || manifest.rows.length !== 19) {
            throw new Error('EXACT_NINETEEN_MANIFEST_ROWS_REQUIRED');
          }

          const cache = new Map();
          async function loadModule(absolutePath) {
            const normalized = path.normalize(absolutePath);
            if (cache.has(normalized)) return cache.get(normalized);
            const source = await readFile(normalized, 'utf8');
            const module = new vm.SourceTextModule(source, {
              identifier: pathToFileURL(normalized).href
            });
            cache.set(normalized, module);
            await module.link(async (specifier, referencingModule) => {
              let resolved;
              if (specifier.startsWith('/')) {
                resolved = path.join(root, specifier.slice(1));
              } else if (specifier.startsWith('.')) {
                resolved = fileURLToPath(new URL(specifier, referencingModule.identifier));
              } else {
                throw new Error(`UNSUPPORTED_BARE_IMPORT:${specifier}`);
              }
              return loadModule(resolved);
            });
            return module;
          }

          const fulfilled = [];
          for (const row of manifest.rows) {
            const module = await loadModule(path.join(root, row.repositoryPath.slice(1)));
            if (module.status !== 'linked') {
              throw new Error(`MODULE_NOT_LINKED:${row.repositoryPath}:${module.status}`);
            }
            fulfilled.push(row.captureOrder);
          }
          console.log(`FULFILLED_${fulfilled.length}_OF_19`);
          NODE

      - name: Enforce exact one-file source delta
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only)" = "showroom/globe/h-earth/render/geometry-kernel.east.js"

      - name: Upload verified candidate
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-east-verified-candidate
          path: |
            showroom/globe/h-earth/render/geometry-kernel.east.js
            east-repair-verification.json
          if-no-files-found: error
          retention-days: 1
