name: H-Earth Run 8E R3F2-P1 Immutable Preview Occurrence Contract

on:
  push:
    branches:
      - agent/h-earth-run8e-r3f2-p1-immutable-preview-occurrence-contract-001
  pull_request:
    branches:
      - agent/h-earth-run8e-r3f2-validated-package-baseline-001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-run8e-r3f2-p1-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      H_EARTH_RUN8E_R3F2_P1_OUTPUT: /tmp/h-earth-run8e-r3f2-p1
      H_EARTH_RUN8E_R3F2_P1_EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact P1 event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact validated-package baseline and protected H-Earth identities
        run: |
          set -euo pipefail
          git fetch origin agent/h-earth-run8e-r3f2-validated-package-baseline-001
          test "$(git merge-base HEAD origin/agent/h-earth-run8e-r3f2-validated-package-baseline-001)" = "fcdcb4e80a98a86773d5276447b880efde2099c9"
          test "$(git rev-parse origin/agent/h-earth-run8e-r3f2-validated-package-baseline-001)" = "fcdcb4e80a98a86773d5276447b880efde2099c9"
          test "$(git hash-object showroom/globe/h-earth/index.html)" = "0daedf61f7e19af095f4db5fc47563a9cd786837"
          test "$(git hash-object showroom/globe/h-earth/functional-landscape/public-live-gpu-integration.run8e-r3e.js)" = "2b0a916b3a6d11da84316925f8abd8a3a1447445"
          test "$(git hash-object showroom/globe/h-earth/functional-landscape/index.css)" = "481148416a8d0466e76c4cb2eca7a67d8932a242"
          test "$(git hash-object showroom/globe/h-earth/index.css)" = "f208b7f11096a7bf5da282226903ac634c1eab01"

      - name: Verify P1 syntax and stopping boundary
        run: |
          set -euo pipefail
          node --check h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3f2-p1.immutable-preview-occurrence-contract.js
          node --check h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.run8e-r3f2-p1-immutable-preview-occurrence-contract.js
          node --check h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js
          node --check h-earth-3d/validation/h-earth.run8e-r3f2-p1.immutable-preview-occurrence-contract.harness.mjs
          if test -f h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3f2-p1.pass-closed.receipt.json; then
            node -e "JSON.parse(require('fs').readFileSync('h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3f2-p1.pass-closed.receipt.json','utf8'))"
          fi
          ! git diff --name-only fcdcb4e80a98a86773d5276447b880efde2099c9...HEAD | grep -Eq '^(showroom/|preview/|public/preview/|\.github/pages|vercel\.json$|netlify\.toml$)'

      - name: Execute P1 contract validation
        run: |
          set -o pipefail
          mkdir -p "$H_EARTH_RUN8E_R3F2_P1_OUTPUT"
          node --experimental-default-type=module \
            h-earth-3d/validation/h-earth.run8e-r3f2-p1.immutable-preview-occurrence-contract.harness.mjs \
            2>&1 | tee "$H_EARTH_RUN8E_R3F2_P1_OUTPUT/h-earth.run8e-r3f2-p1.contract-validation.log"

      - name: Execute automatic repository-registry preflight
        run: |
          set -euo pipefail
          git diff --name-only fcdcb4e80a98a86773d5276447b880efde2099c9...HEAD \
            | grep -E '^h-earth-3d/' \
            | sort -u > /tmp/h-earth-run8e-r3f2-p1-governed-paths.txt || true
          node --experimental-default-type=module \
            tools/h-earth-repository-registry-auto-preflight.mjs \
            --paths-file /tmp/h-earth-run8e-r3f2-p1-governed-paths.txt \
            --task "Run 8E R3F2-P1 immutable preview occurrence contract" \
            --mutation-intent \
            --output "$H_EARTH_RUN8E_R3F2_P1_OUTPUT/h-earth.run8e-r3f2-p1.automatic-preflight.receipt.json"
          node - <<'NODE'
          const receipt = require('/tmp/h-earth-run8e-r3f2-p1/h-earth.run8e-r3f2-p1.automatic-preflight.receipt.json');
          if (receipt.finalDisposition !== 'PASS') throw new Error(`R3F2_P1_AUTOMATIC_PREFLIGHT_NOT_PASS:${receipt.finalDisposition}`);
          NODE

      - name: Verify exact P1 scope and P2 stopping boundary
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only fcdcb4e80a98a86773d5276447b880efde2099c9...HEAD | sort > "$H_EARTH_RUN8E_R3F2_P1_OUTPUT/r3f2-p1-changed-paths.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = {line.strip() for line in Path('/tmp/h-earth-run8e-r3f2-p1/r3f2-p1-changed-paths.txt').read_text().splitlines() if line.strip()}
          required = {
            '.github/workflows/h-earth-run8e-r3f2-p1-immutable-preview-occurrence-contract.yml',
            'h-earth-3d/control-plane/run-8/recovery/h-earth.run8e-r3f2-p1.immutable-preview-occurrence-contract.js',
            'h-earth-3d/registry/accepted-amendments/h-earth.repository-registry.run8e-r3f2-p1-immutable-preview-occurrence-contract.js',
            'h-earth-3d/registry/h-earth.repository-registry.validator-engine.loader.js',
            'h-earth-3d/validation/h-earth.run8e-r3f2-p1.immutable-preview-occurrence-contract.harness.mjs'
          }
          optional = {'h-earth-3d/validation/run-8e-r3/h-earth.run8e-r3f2-p1.pass-closed.receipt.json'}
          missing = sorted(required - paths)
          unexpected = sorted(paths - required - optional)
          if missing: raise SystemExit(f'R3F2_P1_REQUIRED_PATHS_MISSING:{missing}')
          if unexpected: raise SystemExit(f'R3F2_P1_UNEXPECTED_PATHS:{unexpected}')
          if any(path.startswith(('showroom/','preview/','public/preview/')) for path in paths): raise SystemExit('R3F2_P1_PREVIEW_OR_SHOWROOM_MUTATION_OBSERVED')
          receipt = json.loads(Path('/tmp/h-earth-run8e-r3f2-p1/h-earth.run8e-r3f2-p1.contract.execution.receipt.json').read_text())
          if receipt['eligible'] is not True: raise SystemExit('R3F2_P1_EXECUTION_RECEIPT_NOT_ELIGIBLE')
          if receipt['status'] not in {'RUN_8E_R3F2_P1_CONTRACT_VALIDATION_PASS','RUN_8E_R3F2_P1_FINAL_VALIDATION_PASS'}: raise SystemExit('R3F2_P1_EXECUTION_STATUS_INVALID')
          if receipt['contractIdentity']['allowedServedFileCount'] != 3: raise SystemExit('R3F2_P1_ALLOWED_FILE_COUNT_INVALID')
          if receipt['contractIdentity']['requiredDeviceReceiptFieldCount'] != 23: raise SystemExit('R3F2_P1_DEVICE_RECEIPT_SCHEMA_INVALID')
          if any(receipt['boundaries'].values()): raise SystemExit('R3F2_P1_BOUNDARY_VIOLATION')
          if receipt['nextCheckpoint'] != 'RUN_8E_R3F2_P2_EXACT_PREVIEW_PACKAGE_MATERIALIZATION': raise SystemExit('R3F2_P1_NEXT_CHECKPOINT_INVALID')
          if receipt['stoppingBoundary'] != 'STOP_BEFORE_PREVIEW_FILES_OR_DEPLOYMENT_CONFIGURATION': raise SystemExit('R3F2_P1_STOPPING_BOUNDARY_INVALID')
          PY

      - name: Upload P1 contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-run8e-r3f2-p1-immutable-preview-occurrence-contract-evidence
          path: |
            /tmp/h-earth-run8e-r3f2-p1
            /tmp/h-earth-run8e-r3f2-p1-governed-paths.txt
          if-no-files-found: warn
          retention-days: 90
