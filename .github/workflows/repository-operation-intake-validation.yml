  EXPECTED_PATHS_JSON: '[".github/workflows/methods-spatial-database-nested-tab-recomposition-v1.yml","control-plane/methods-information-benchmark/spatial-database-nested-tab-recomposition-v1/README.md","control-plane/methods-information-benchmark/spatial-database-nested-tab-recomposition-v1/index.html","control-plane/methods-information-benchmark/spatial-database-nested-tab-recomposition-v1/styles.css","control-plane/methods-information-benchmark/spatial-database-nested-tab-recomposition-v1/data.mjs","control-plane/methods-information-benchmark/spatial-database-nested-tab-recomposition-v1/math.mjs","control-plane/methods-information-benchmark/spatial-database-nested-tab-recomposition-v1/state.mjs","control-plane/methods-information-benchmark/spatial-database-nested-tab-recomposition-v1/renderer.mjs","control-plane/methods-information-benchmark/spatial-database-nested-tab-recomposition-v1/navigation.mjs","control-plane/methods-information-benchmark/spatial-database-nested-tab-recomposition-v1/app.mjs","control-plane/methods-information-benchmark/spatial-database-nested-tab-recomposition-v1/design-grammar.v1.json","control-plane/methods-information-benchmark/spatial-database-nested-tab-recomposition-v1/information-architecture.v1.json","control-plane/methods-information-benchmark/spatial-database-nested-tab-recomposition-v1/interaction-state-contract.v1.json","control-plane/methods-information-benchmark/spatial-database-nested-tab-recomposition-v1/proof-contract.v1.json","control-plane/methods-information-benchmark/spatial-database-nested-tab-recomposition-v1/verify.v1.mjs","control-plane/methods-information-benchmark/spatial-database-nested-tab-recomposition-v1/receipts/builder.receipt.v1.json","control-plane/methods-information-benchmark/spatial-database-nested-tab-recomposition-v1/receipts/fresh-verifier.receipt.v1.json","control-plane/methods-information-benchmark/spatial-database-nested-tab-recomposition-v1/receipts/independent-equality.receipt.v1.json","control-plane/methods-information-benchmark/spatial-database-nested-tab-recomposition-v1/receipts/operation-closure.receipt.v1.json"]'
