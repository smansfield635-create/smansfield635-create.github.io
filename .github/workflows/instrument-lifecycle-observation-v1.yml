name: Instrument Lifecycle Observation v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'AI_ENTRYPOINT.json'
      - '.github/ai-router/router.v1.json'
      - '.github/ai-router/system-continuity/gap-registry.v1.json'
      - '.github/ai-router/instrument-lifecycle/**'
      - '.github/ai-router/development-pipeline/**'
      - '.github/workflows/instrument-lifecycle-observation-v1.yml'
      - '.github/workflows/integrated-development-pipeline-v1.yml'
  push:
    branches: [main]
    paths:
      - 'AI_ENTRYPOINT.json'
      - '.github/ai-router/router.v1.json'
      - '.github/ai-router/system-continuity/gap-registry.v1.json'
      - '.github/ai-router/instrument-lifecycle/**'
      - '.github/ai-router/development-pipeline/**'
      - '.github/workflows/instrument-lifecycle-observation-v1.yml'
      - '.github/workflows/integrated-development-pipeline-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instrument-lifecycle-observation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PROTOCOL_PATH: .github/ai-router/instrument-lifecycle/instrument-lifecycle-protocol.v1.json
  REGISTRY_PATH: .github/ai-router/instrument-lifecycle/instrument-lifecycle-registry.v1.json
  PROTECTED_PATH: .github/ai-router/instrument-lifecycle/protected-live-operations.v1.json
  GATE_PATH: .github/ai-router/instrument-lifecycle/instrument-lifecycle-gate.v1.mjs
  SELF_TEST_PATH: .github/ai-router/instrument-lifecycle/instrument-lifecycle-self-test.v1.mjs

jobs:
  observe-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Observe changed paths without foreign construction-scope enforcement
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE="HEAD^"
          fi
          git diff --name-only "$BASE" HEAD | sort > "$RUNNER_TEMP/changed.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const changed=fs.readFileSync(process.env.RUNNER_TEMP+'/changed.txt','utf8').split(/\r?\n/).filter(Boolean);
          const out={
            schema:'INSTRUMENT_LIFECYCLE_CHANGED_PATH_OBSERVATION_v1',
            result:'OBSERVED_NO_FOREIGN_SCOPE_ENFORCEMENT',
            changedPaths:changed,
            changedPathCount:changed.length,
            originalConstructionScopeEnforcedAgainstThisOperation:false,
            repositoryMutationPerformed:false,
            foreignOperationAuthorityCreated:false
          };
          fs.writeFileSync(process.env.RUNNER_TEMP+'/changed-path-observation.json',JSON.stringify(out,null,2)+'\n');
          NODE

      - name: Verify lifecycle package identities and self-test
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./${PROTOCOL_PATH}'),r=require('./${REGISTRY_PATH}'),x=require('./${PROTECTED_PATH}');if(p.status!=='OBSERVATION_ONLY_FAIL_CLOSED'||r.status!=='OBSERVATION_ONLY_FAIL_CLOSED'||x.status!=='ACTIVE_OBSERVATION_PROTECTION')process.exit(1);if(!p.laws.includes('OBSERVATION_WORKFLOW_MUST_NOT_FAIL_SOLELY_BECAUSE_AN_UNRELATED_PR_MODIFIES_PATHS_OUTSIDE_ITS_ORIGINAL_CONSTRUCTION_SCOPE'))process.exit(1)"
          node --check "$GATE_PATH"
          node --check "$SELF_TEST_PATH"
          node "$SELF_TEST_PATH" --output "$RUNNER_TEMP/self-test.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/self-test.json');if(r.result!=='PASS'||r.failedCount!==0||r.repositoryMutationPerformed!==false||r.workflowDeactivationPerformed!==false||r.physicalRetirementPerformed!==false)process.exit(1)"

      - name: Observe current Actions surface
        shell: bash
        run: |
          set -euo pipefail
          node "$GATE_PATH" \
            --repo-root . \
            --registry "$REGISTRY_PATH" \
            --router .github/ai-router/router.v1.json \
            --protected "$PROTECTED_PATH" \
            --output "$RUNNER_TEMP/observation.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/observation.json');if(r.result!=='PASS_OBSERVATION'||r.systemGapClosed!==false||r.enforcementAuthorized!==false||r.physicalRetirementPerformed!==false)process.exit(1)"

      - name: Verify repository router without mutation
        shell: bash
        run: |
          set -euo pipefail
          node tools/repository-ai-entry-router.mjs --self-test --output "$RUNNER_TEMP/router-self-test.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/router-self-test.json');if(r.result!=='PASS')process.exit(1)"

      - name: Build exact-head observer receipt
        shell: bash
        run: |
          set -euo pipefail
          SUBJECT_HEAD="$(git rev-parse HEAD^{commit})"
          export SUBJECT_HEAD
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const changed=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/changed-path-observation.json','utf8'));
          const observation=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/observation.json','utf8'));
          const selfTest=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/self-test.json','utf8'));
          const receipt={
            schema:'INSTRUMENT_LIFECYCLE_CONCURRENCY_SAFE_OBSERVATION_RECEIPT_v1',
            result:'PASS',
            subjectHead:process.env.SUBJECT_HEAD,
            changedPathObservation:changed,
            lifecycleObservationResult:observation.result,
            selfTestResult:selfTest.result,
            historicalConstructionScopeEnforced:false,
            existingWorkflowTriggerMutationPerformed:false,
            workflowDeactivationPerformed:false,
            physicalRetirementPerformed:false,
            repositoryMutationPerformed:false,
            enforcementAuthorityCreated:false,
            foreignOperationAuthorityCreated:false
          };
          fs.writeFileSync(process.env.RUNNER_TEMP+'/concurrency-safe-observer-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          NODE

      - name: Package observation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/instrument-lifecycle
          cp "$RUNNER_TEMP/changed-path-observation.json" artifacts/instrument-lifecycle/changed-path-observation.json
          cp "$RUNNER_TEMP/self-test.json" artifacts/instrument-lifecycle/self-test.json
          cp "$RUNNER_TEMP/observation.json" artifacts/instrument-lifecycle/observation-receipt.json
          cp "$RUNNER_TEMP/router-self-test.json" artifacts/instrument-lifecycle/router-self-test.json
          cp "$RUNNER_TEMP/concurrency-safe-observer-receipt.json" artifacts/instrument-lifecycle/concurrency-safe-observer-receipt.json
          test -z "$(git status --porcelain=v1 --untracked-files=all | grep -v '^?? artifacts/instrument-lifecycle/' || true)"

      - uses: actions/upload-artifact@v4
        with:
          name: instrument-lifecycle-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/instrument-lifecycle/
          if-no-files-found: error
          retention-days: 90
