name: H-Earth Gate B Compositor Mode Renewal

on:
  pull_request:
    branches:
      - agent/h-earth-gate-b-seven-file-verification-001
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  renew:
    if: github.head_ref == 'agent/h-earth-gate-b-seven-file-trigger-001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/h-earth-gate-b-seven-file-verification-001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded compositor-mode renewal
        run: |
          python .github/scripts/renew-h-earth-gate-b-compositor-mode.py
          node --check showroom/globe/h-earth/compositor.js
          git diff --check
      - name: Commit isolated renewal
        id: publish
        shell: bash
        run: |
          set +e
          exec > >(tee H_EARTH_GATE_B_COMPOSITOR_RENEWAL_PUBLISH.log) 2>&1
          if git diff --quiet -- showroom/globe/h-earth/compositor.js; then
            echo 'No compositor change produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add showroom/globe/h-earth/compositor.js
          git commit -m 'Admit Gate B presentation mode in compositor'
          commit_status=$?
          if [ "$commit_status" -ne 0 ]; then exit "$commit_status"; fi
          git fetch origin agent/h-earth-gate-b-seven-file-verification-001
          fetch_status=$?
          if [ "$fetch_status" -ne 0 ]; then exit "$fetch_status"; fi
          git rebase origin/agent/h-earth-gate-b-seven-file-verification-001
          rebase_status=$?
          if [ "$rebase_status" -ne 0 ]; then exit "$rebase_status"; fi
          git push origin HEAD:agent/h-earth-gate-b-seven-file-verification-001
          exit $?
      - name: Upload publication diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-gate-b-compositor-renewal-publish-log
          path: H_EARTH_GATE_B_COMPOSITOR_RENEWAL_PUBLISH.log
          if-no-files-found: warn
