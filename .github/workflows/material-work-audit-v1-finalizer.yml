name: Material Work Audit v1 Post-Freeze Finalizer

on:
  push:
    branches:
      - agent/material-work-audit-v1-classifier-carrier-ddbe792
    paths:
      - research/material-work-audit/finalize-v1-after-unblind.mjs
      - .github/workflows/material-work-audit-v1-finalizer.yml

permissions:
  contents: write

concurrency:
  group: material-work-audit-v1-post-freeze-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Materialize bounded finalizer source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir work
          cd work
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 --filter=blob:none origin "${GITHUB_SHA}"
          git sparse-checkout init --cone
          git sparse-checkout set research/material-work-audit
          git checkout --detach FETCH_HEAD
          test -f research/material-work-audit/finalize-v1-after-unblind.mjs
      - name: Unblind and finalize durable audit outputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd work
          node research/material-work-audit/finalize-v1-after-unblind.mjs
