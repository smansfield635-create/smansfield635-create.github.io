name: Laws Carousel V5 Live Proof

on:
  push:
    branches: [main]
    paths:
      - 'laws/index.html'
      - 'laws/index.destination-carousel.js'
      - 'laws/index.mobile-background-tabs.js'
      - 'laws/index.mobile-background-tabs.core.js'
      - '.github/workflows/laws-carousel-v4-live-proof.yml'

permissions:
  contents: read

jobs:
  live-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public Laws V5 delivery
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            stamp="${GITHUB_SHA}-${attempt}"
            html="$(curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "https://diamondgatebridge.com/laws/?v5-proof=${stamp}" || true)"
            bootstrap="$(curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "https://diamondgatebridge.com/laws/index.mobile-background-tabs.js?v=LAWS_DESTINATION_STAGE_LIVE_20260816E&v5-proof=${stamp}" || true)"
            core="$(curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "https://diamondgatebridge.com/laws/index.mobile-background-tabs.core.js?v=LAWS_ROOT_ROLODEX_RESPONSIVE_CONTINUITY_V5_ORBIT_CUSTODY&v5-proof=${stamp}" || true)"
            runtime="$(curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "https://diamondgatebridge.com/laws/index.destination-carousel.js?v=LAWS_DESTINATION_CAROUSEL_RUNTIME_V5_20260816A&v5-proof=${stamp}" || true)"

            if grep -q 'LAWS_DESTINATION_STAGE_LIVE_20260816E' <<<"$html" \
              && grep -q 'laws-root-rolodex-cards' <<<"$bootstrap" \
              && grep -q 'verticalDocumentScroll: false' <<<"$bootstrap" \
              && grep -q 'LAWS_ROOT_ROLODEX_RESPONSIVE_CONTINUITY_V5_ORBIT_CUSTODY' <<<"$bootstrap" \
              && grep -q 'LAWS_DESTINATION_CAROUSEL_RUNTIME_V5_20260816A' <<<"$bootstrap" \
              && grep -q 'LAWS_ROOT_ROLODEX_RESPONSIVE_CONTINUITY_v5' <<<"$core" \
              && grep -q 'COMPASS_ORBIT = "O1"' <<<"$core" \
              && grep -q 'DESTINATION_ORBIT = "O2"' <<<"$core" \
              && grep -q 'LAWS_DESTINATION_CAROUSEL_RUNTIME_v5' <<<"$runtime" \
              && grep -q 'directionOnlyGesture: true' <<<"$runtime" \
              && grep -q 'liveGestureGeometry: false' <<<"$runtime" \
              && grep -q 'atomicRotation: true' <<<"$runtime" \
              && grep -q 'Return to Orbit' <<<"$runtime"; then
              echo 'LIVE_LAWS_CAROUSEL_V5_ENTRY_SCROLL_CUSTODY_VERIFIED'
              echo "attempt=$attempt"
              exit 0
            fi

            echo "Public V5 entry-scroll custody delivery not settled yet; attempt $attempt/30"
            sleep 10
          done
          echo 'LIVE_LAWS_CAROUSEL_V5_ENTRY_SCROLL_CUSTODY_NOT_VERIFIED' >&2
          exit 1
