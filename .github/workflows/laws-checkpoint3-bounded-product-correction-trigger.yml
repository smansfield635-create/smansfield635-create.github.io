name: Laws Checkpoint 3 Bounded Product Correction Trigger

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/laws-checkpoint3-bounded-product-correction-trigger.yml"

permissions:
  contents: write

jobs:
  execute-bounded-correction:
    if: github.event.pull_request.head.ref == 'agent/laws-compass-checkpoint-2-bounded-construction-002'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Execute retained bounded patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess

          workflow = Path('.github/workflows/laws-checkpoint3-bounded-product-correction.yml').read_text(encoding='utf-8')
          match = re.search(r"          python3 <<'PY'\n(.*?)\n          PY\n", workflow, re.S)
          if not match:
              raise SystemExit('BOUNDED_PATCH_PAYLOAD_NOT_FOUND')
          payload = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in match.group(1).splitlines()
          )
          subprocess.run(['python3', '-c', payload], check=True)
          PY

      - name: Validate corrected JavaScript syntax
        run: |
          node --check laws/index.controller.js
          node --check laws/index.crystals.js
          node --check laws/index.interactions.js

      - name: Commit bounded correction and remove temporary workflows
        shell: bash
        run: |
          rm .github/workflows/laws-checkpoint3-bounded-product-correction.yml
          rm .github/workflows/laws-checkpoint3-bounded-product-correction-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add laws/index.html laws/index.controller.js laws/index.crystals.js laws/index.interactions.js laws/index.css .github/workflows/laws-checkpoint3-bounded-product-correction.yml .github/workflows/laws-checkpoint3-bounded-product-correction-trigger.yml
          git commit -m "Checkpoint 3: separate Law and non-Law cluster members"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
