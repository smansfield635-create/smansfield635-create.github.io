name: H-Earth B2 Protection Model
# execution-trigger: 1

on:
  pull_request:
    paths:
      - '.github/workflows/h-earth-b2-protection-model.yml'
      - 'h-earth-3d/analysis/morphology/h-earth.b2-*'
      - 'h-earth-3d/control-plane/post-cp2-round2/morphology/h-earth.b2-*'
      - 'h-earth-3d/validation/morphology/h-earth.b2-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-p0-p1-p2-protection-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact B2 candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute B2 verifier first pass
        run: node h-earth-3d/validation/morphology/h-earth.b2-protection-model.mjs > /tmp/b2-first.json
      - name: Execute B2 verifier second pass
        run: node h-earth-3d/validation/morphology/h-earth.b2-protection-model.mjs > /tmp/b2-second.json
      - name: Require identical receipts
        run: cmp /tmp/b2-first.json /tmp/b2-second.json
      - name: Upload B2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-b2-protection-model
          path: /tmp/b2-first.json
      - name: Enforce B2 pass
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync('/tmp/b2-first.json', 'utf8'));
          if (receipt.pass !== true || receipt.result !== 'B2_PROTECTION_MODEL_PASS_CLOSED') process.exit(1);
          console.log(`B2_PASS:${receipt.protectionDigest}:${receipt.canonicalReceiptSha256}`);
          NODE
