name: H-Earth Gratitude Region FP-03 bounded execution
on:
  push:
    branches: [agent/h-earth-gratitude-region-fp03-execution-001]
  pull_request:
    branches: [agent/h-earth-gratitude-region-final-placement-disposition-001]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  execute:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify authorized base
        shell: bash
        run: |
          set -euo pipefail
          B=554a693c82876d9533bd577475a818a570d03b0d
          test "$(git merge-base HEAD "$B")" = "$B"
          test "$(git diff --name-only "$B"..HEAD)" = ".github/workflows/h-earth-gratitude-region-final-placement-freeze.yml"
      - name: Execute FP-00 through FP-03 twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fp03-evidence
          node --input-type=module <<'NODE'
