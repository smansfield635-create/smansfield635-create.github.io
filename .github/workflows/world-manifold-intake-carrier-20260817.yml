name: World Manifold Gen306 Private Preflight Rebind Qualification

on:
  push:
    branches:
      - control-plane-carrier/world-manifold-intake-20260817
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRIVATE_CANDIDATE: cfc5b0fc1a35228da58d3c59919aed5ed07aa9fc
      TOOLING_HEAD: 46b2cca200f1db036cae8288329f870a8336505a
      TOOLING_TREE: b53fe28b6e2c1ab0fd334ba6147922b491b79f53
    steps:
      - name: Mint private read token
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.PRIVATE_EXECUTION_APP_ID }}
          private-key: ${{ secrets.PRIVATE_EXECUTION_APP_PRIVATE_KEY }}
          owner: smansfield635-create
          repositories: geodiametrics1
          permission-contents: read

      - name: Checkout exact private rebind candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: smansfield635-create/geodiametrics1
          ref: ${{ env.PRIVATE_CANDIDATE }}
          token: ${{ steps.token.outputs.token }}
          path: private-control-plane
          fetch-depth: 1
          persist-credentials: false

      - name: Run installed connected-backend self-tests
        working-directory: private-control-plane
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRIVATE_CANDIDATE"
          node tools/ai-room-transport/connected-public-h-earth-preflight-evidence-compiler-self-test.v1.mjs
          node tools/ai-room-transport/connected-public-h-earth-preflight-self-test.v1.mjs

      - name: Verify five-surface exact tooling consistency
        working-directory: private-control-plane
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { TOOLING_HEAD as compilerHead, NATIVE_TOOL_BLOB as compilerNativeBlob, ACTIVATION_BLOB as compilerActivationBlob } from './tools/ai-room-transport/connected-public-h-earth-preflight-evidence-compiler.v1.mjs';
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const expected = process.env.TOOLING_HEAD;
          const tree = process.env.TOOLING_TREE;
          const binding = read('.github/ai-router/canonical-execution-substrate/h-earth-connected-public-preflight-backend-binding.v1.json');
          const executorDescriptor = read('.github/ai-router/canonical-execution-substrate/connected-public-h-earth-preflight.v1.json');
          const compilerDescriptor = read('.github/ai-router/canonical-execution-substrate/connected-public-h-earth-preflight-evidence-compiler.v1.json');
          const executorSource = fs.readFileSync('tools/ai-room-transport/connected-public-h-earth-preflight.v1.mjs','utf8');
          const checks = {
            binding: binding.fixedToolingHead === expected,
            bindingReconciled: binding.reconciliation?.reconciledToolingHead === expected && binding.reconciliation?.reconciledToolingRootTree === tree,
            executorDescriptor: executorDescriptor.fixedBinding?.toolingHead === expected,
            compilerDescriptor: compilerDescriptor.fixedBinding?.toolingHead === expected,
            compilerRuntime: compilerHead === expected,
            executorRuntime: executorSource.includes(`const TOOLING_HEAD='${expected}'`),
            nativeToolStable: compilerNativeBlob === executorDescriptor.fixedBinding?.nativeToolBlob && compilerNativeBlob === compilerDescriptor.fixedBinding?.nativeToolBlob,
            activationStable: compilerActivationBlob === executorDescriptor.fixedBinding?.activationBlob && compilerActivationBlob === compilerDescriptor.fixedBinding?.activationBlob,
            noAuthorityInflation: Object.values(binding.authorityBoundary ?? {}).every(v => v === false)
          };
          const failed = Object.entries(checks).filter(([,v]) => v !== true).map(([k]) => k);
          console.log(JSON.stringify({schema:'GEN306_CONNECTED_PREFLIGHT_REBIND_QUALIFICATION_v1',result:failed.length?'FAIL_CLOSED':'PASS_CLOSED',toolingHead:expected,toolingTree:tree,checks,failed},null,2));
          if (failed.length) process.exit(1);
          NODE
