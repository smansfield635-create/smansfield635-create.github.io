name: Temporary CP5 Methods Models Role Constitution Verify

on:
  pull_request:
    paths:
      - 'control-plane/whole-estate/methods-models-role-constitution-v1/**'
      - '.github/workflows/temporary-cp5-methods-models-role-constitution-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-checkpoint-5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Checkpoint 5 Methods and Models role constitution
        run: node control-plane/whole-estate/methods-models-role-constitution-v1/verify.v1.mjs
