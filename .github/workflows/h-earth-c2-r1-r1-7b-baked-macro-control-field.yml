name: H-Earth C2-R1 R1.7B Baked Macro Control Field

on:
  pull_request:
    branches:
      - integration/h-earth-c2-r1-baseline-001
    paths:
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/h-earth.c2-r1.baked-macro-control-field.js'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/h-earth.c2-r1.r1-7-subcheckpoint-program.json'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/h-earth.c2-r1.r1-7-subcheckpoint-ledger.json'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/tools/h-earth.c2-r1.r1-7b-bake-macro-control-field.mjs'
      - 'h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.r1-7b-baked-macro-control-field.mjs'
      - '.github/workflows/h-earth-c2-r1-r1-7b-baked-macro-control-field.yml'
  workflow_dispatch:

concurrency:
  group: h-earth-c2-r1-r1-7b-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-r1-7b:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deterministic bounded baked macro control field
        env:
          C2_R1_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node h-earth-3d/control-plane/coastal-morphology/c2-r1/tools/h-earth.c2-r1.r1-7b-bake-macro-control-field.mjs --check
          node h-earth-3d/control-plane/coastal-morphology/c2-r1/tests/h-earth.c2-r1.r1-7b-baked-macro-control-field.mjs

      - name: Upload R1.7B receipt and engineering captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-c2-r1-r1-7b-engineering-evidence
          path: |
            h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/h-earth.c2-r1.r1-7b-verification.json
            h-earth-3d/control-plane/coastal-morphology/c2-r1/evidence/r1-7b-engineering-captures/*.svg
          if-no-files-found: error
          retention-days: 30
