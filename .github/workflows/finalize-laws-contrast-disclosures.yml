# trigger revision 2
name: Finalize Laws contrast disclosures and labels

on:
  push:
    paths:
      - ".github/workflows/finalize-laws-contrast-disclosures.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded Laws-only correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          crystals = Path("laws/index.crystals.js")
          css = Path("laws/index.css")
          html = Path("laws/index.html")

          crystal_text = crystals.read_text(encoding="utf-8")

          def replace_scalar(source, property_name, value):
              pattern = re.compile(rf'({re.escape(property_name)}:\s*\n\s+)([0-9.]+)')
              output, count = pattern.subn(
                  lambda match: match.group(1) + value,
                  source,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"Expected one scalar {property_name}; found {count}.")
              return output

          for property_name, value in (
              ("categoryScale", "0.96"),
              ("focusedCategoryScale", "1.30"),
              ("lawScale", "0.88"),
              ("primaryLawScale", "1.12"),
              ("selectedLawScale", "1.18"),
          ):
              crystal_text = replace_scalar(crystal_text, property_name, value)

          material_start = crystal_text.index("  const MATERIALS = Object.freeze({")
          material_end = crystal_text.index("\n\n  const RECEIPT =", material_start)
          new_materials = '''  const MATERIALS = Object.freeze({
    CATEGORY_IDLE:
      Object.freeze({
        specular:
          1.18,
        rim:
          1.02,
        emissive:
          0.17,
        alpha:
          0.90,
        sparkle:
          0.26,
        halo:
          0.82,
        contrast:
          1.16
      }),
    CATEGORY_FOCUSED:
      Object.freeze({
        specular:
          1.50,
        rim:
          1.30,
        emissive:
          0.24,
        alpha:
          0.96,
        sparkle:
          0.36,
        halo:
          1.18,
        contrast:
          1.24
      }),
    LAW_IDLE:
      Object.freeze({
        specular:
          1.04,
        rim:
          0.90,
        emissive:
          0.15,
        alpha:
          0.88,
        sparkle:
          0.22,
        halo:
          0.64,
        contrast:
          1.10
      }),
    LAW_PRIMARY:
      Object.freeze({
        specular:
          1.24,
        rim:
          1.08,
        emissive:
          0.21,
        alpha:
          0.94,
        sparkle:
          0.30,
        halo:
          0.86,
        contrast:
          1.17
      }),
    LAW_SELECTED:
      Object.freeze({
        specular:
          1.34,
        rim:
          1.14,
        emissive:
          0.24,
        alpha:
          0.95,
        sparkle:
          0.34,
        halo:
          0.96,
        contrast:
          1.20
      })
  });'''
          crystal_text = crystal_text[:material_start] + new_materials + crystal_text[material_end:]
          crystals.write_text(crystal_text, encoding="utf-8")

          css_text = css.read_text(encoding="utf-8")
          marker = "LAWS_COLLAPSED_DISCLOSURE_STANDARD_v1"
          if marker not in css_text:
              css_text += '''

/* ============================================================
   LAWS_COLLAPSED_DISCLOSURE_STANDARD_v1
   Closed = plus. Open = minus. Independent native details state.
   ============================================================ */

[data-laws-root] details > summary {
  position: relative;
  padding-right: 3.1rem;
  list-style: none;
  cursor: pointer;
}

[data-laws-root] details > summary::-webkit-details-marker {
  display: none;
}

[data-laws-root] details > summary::marker {
  content: "";
}

[data-laws-root] details > summary::after {
  content: "+" !important;
  position: absolute;
  top: 50%;
  right: .45rem;
  display: grid;
  width: 1.85rem;
  height: 1.85rem;
  place-items: center;
  border: 1px solid rgba(216, 184, 106, .34);
  border-radius: 999px;
  color: var(--laws-gold-hot);
  background: rgba(6, 10, 18, .76);
  font: 800 1.18rem/1 ui-sans-serif, system-ui, sans-serif;
  transform: translateY(-50%);
  box-shadow:
    0 0 1rem rgba(216, 184, 106, .10),
    inset 0 1px 0 rgba(255, 255, 255, .05);
}

[data-laws-root] details[open] > summary::after {
  content: "−" !important;
}

[data-laws-root] details > summary:hover::after,
[data-laws-root] details > summary:focus-visible::after {
  border-color: rgba(243, 217, 139, .66);
  color: #fff3be;
  background: rgba(14, 20, 31, .90);
}
'''
          css.write_text(css_text, encoding="utf-8")

          html_text = html.read_text(encoding="utf-8")
          html_text, open_count = re.subn(
              r'(<details\b[^>]*?)\s+open(\s*>)',
              r'\1\2',
              html_text,
              flags=re.IGNORECASE | re.DOTALL,
          )

          replacements = {
              "/laws/index.css?v=LAWS_COMPASS_WORLD_PASS_PLANET_AND_SHOWROOM_COSMOS_READY_CSS_TNT_v2_3_0":
                  "/laws/index.css?v=LAWS_COMPASS_FAMILY_CONTRAST_DISCLOSURES_v3",
              "/laws/index.crystals.js?v=LAWS_COMPASS_CRYSTALS_WITH_PLANET_PARTICIPANT_TNT_v1":
                  "/laws/index.crystals.js?v=LAWS_COMPASS_FAMILY_ORBITAL_CONTRAST_v2",
              "/laws/index.interactions.js?v=LAWS_SPATIAL_PRIMARY_SELECTION_NATIVE_GLOW_v2":
                  "/laws/index.interactions.js?v=LAWS_COMPASS_FAMILY_CONTRAST_DISCLOSURE_LABELS_v3",
          }

          for old, new in replacements.items():
              if old in html_text:
                  html_text = html_text.replace(old, new, 1)
              elif new not in html_text:
                  raise SystemExit(f"Missing Laws cache-key target: {old}")

          old_baseline = 'data-laws-css-visual-baseline="pending-compass-format-alignment"'
          new_baseline = 'data-laws-css-visual-baseline="compass-family-orbital-contrast-and-collapsed-disclosures"'
          if old_baseline in html_text:
              html_text = html_text.replace(old_baseline, new_baseline, 1)
          elif new_baseline not in html_text:
              raise SystemExit("Missing Laws visual-baseline target.")

          html.write_text(html_text, encoding="utf-8")

          for workflow in (
              Path(".github/workflows/bounded-laws-contrast-disclosures.yml"),
              Path(".github/workflows/finalize-laws-contrast-disclosures.yml"),
          ):
              if workflow.exists():
                  workflow.unlink()

          print(f"Collapsed {open_count} default-open Laws disclosures.")
          PY

          node --check laws/index.crystals.js
          node --check laws/index.interactions.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            laws/index.crystals.js \
            laws/index.css \
            laws/index.html \
            .github/workflows/bounded-laws-contrast-disclosures.yml \
            .github/workflows/finalize-laws-contrast-disclosures.yml
          git commit -m "Apply Laws Compass contrast labels and collapsed disclosures"
          git push origin HEAD:main
