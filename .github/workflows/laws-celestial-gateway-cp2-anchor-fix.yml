name: Laws celestial gateway CP2 anchor fix

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/laws-celestial-gateway-cp2-anchor-fix.yml]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/laws-celestial-gateway-cp2-anchor-fix-001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/laws-celestial-gateway-cp2-execution-001
          fetch-depth: 0
      - name: Correct constructor material anchor only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/laws-celestial-gateway-cp2-construction.yml')
          text = path.read_text(encoding='utf-8')
          old = "mk='    LAW_IDLE:\\n       Object.freeze({'"
          new = "mk='    LAW_IDLE:\\n      Object.freeze({'"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'anchor occurrence count={count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/laws-celestial-gateway-cp2-construction.yml
          git commit -m "Correct Laws CP2 material anchor"
          git push origin HEAD:agent/laws-celestial-gateway-cp2-execution-001
