name: Compass Gen1538 Room Selected Continuity

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/compass/compass.crystals.js'
      - '.github/workflows/compass-display-continuity-validation.yml'

permissions:
  contents: write

env:
  COMPASS_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  materialize-pointer-ownership-repair:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize bounded Mirrorland/room-star ownership repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/compass/compass.crystals.js')
          s=p.read_text()
          old='''    if (\n      event.target &&\n      event.target.closest &&\n      event.target.closest(\n        "[data-compass-object=\'mirrorland\']"\n      )\n    ) {\n      return {\n        territory:\n          POINTER_TERRITORIES\n            .MIRRORLAND_THRESHOLD,\n\n        nodeId:\n          ""\n      };\n    }\n'''
          new='''    if (\n      event.target &&\n      event.target.closest &&\n      event.target.closest(\n        "[data-compass-object=\'mirrorland\']"\n      )\n    ) {\n      /*\n       * Mirrorland owns its direct threshold, but it must not mask an\n       * actually rendered room star while the cluster is manipulable.\n       * Resolve the crystal renderer's own geometric hit first; this keeps\n       * dormant/overlapping Mirrorland presentation from stealing the\n       * declared ROOM_SELECTED manipulation capability.\n       */\n      const overlappingRoomHit =\n        clusterCanRotate()\n          ? findHitAtClientPoint(\n              event.clientX,\n              event.clientY,\n              [\n                NODE_TYPES.ROOM\n              ]\n            )\n          : null;\n\n      if (overlappingRoomHit) {\n        return {\n          territory:\n            POINTER_TERRITORIES\n              .RENDERED_ROOM,\n\n          nodeId:\n            overlappingRoomHit.id\n        };\n      }\n\n      return {\n        territory:\n          POINTER_TERRITORIES\n            .MIRRORLAND_THRESHOLD,\n\n        nodeId:\n          ""\n      };\n    }\n'''
          if old not in s:
              raise SystemExit('expected Mirrorland classifier block not found exactly')
          if 'const overlappingRoomHit =' in s:
              raise SystemExit('repair already materialized unexpectedly')
          p.write_text(s.replace(old,new,1))
          PY
          node --check assets/compass/compass.crystals.js
          git diff --check
          git diff --exit-code -- . ':(exclude)assets/compass/compass.crystals.js' || { echo 'Unexpected mutation outside crystals'; exit 1; }
      - name: Commit bounded product repair
        run: |
          if git diff --quiet -- assets/compass/compass.crystals.js; then
            echo 'No product change materialized'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/compass/compass.crystals.js
          git commit -m 'compass: preserve room-star pointer ownership over dormant Mirrorland'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
