name: Track B overlap retirement migration
on:
  push:
    branches: [track-b/remove-overlap-authorities]
    paths:
      - '.github/workflows/track-b-overlap-retirement.yml'
permissions:
  contents: write
jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: track-b/remove-overlap-authorities
          fetch-depth: 0
      - name: Bind capability runtime to canonical empty mount
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('assets/compass/compass.capability-carousel.js')
          s=p.read_text(); before=s
          s=s.replace("const legacy=document.querySelector('[data-compass-capability-switcher]');\n  if(!legacy||document.querySelector('[data-capability-orbit]'))return;","const mount=document.querySelector('[data-compass-capability-mount]');\n  if(!mount||document.querySelector('[data-capability-orbit]'))return;",1)
          old="const target=document.querySelector('.compass-build-cta')||document.querySelector('.compass-built'),cue=document.querySelector('.compass-capability-cue');if(target){if(cue){target.after(cue);cue.after(stage)}else target.after(stage);legacy.remove()}else legacy.replaceWith(stage);"
          assert old in s,'legacy replacement boundary missing'
          s=s.replace(old,"mount.replaceWith(stage);",1)
          s=s.replace("function positionTrackBPlaceholder(){const legacy=document.querySelector('[data-compass-capability-switcher]'),cue=document.querySelector('.compass-capability-cue'),built=document.querySelector('.compass-built'),build=document.querySelector('.compass-build-cta');if(!legacy||!built)return;if(build){if(cue){build.after(cue);cue.after(legacy)}else build.after(legacy)}else if(cue){built.after(cue);cue.after(legacy)}else built.after(legacy)}\n",'',1)
          s=s.replace("function mount(){protectMirrorland();positionTrackBPlaceholder();reconcileInstructions();mountCapability();mountProof();","function mount(){protectMirrorland();reconcileInstructions();mountCapability();mountProof();",1)
          s=s.replace("const ready=document.querySelector('[data-compass-capability-switcher]')&&document.querySelector('.compass-built')&&document.querySelector('.compass-build-cta');","const ready=document.querySelector('[data-compass-capability-mount]')&&document.querySelector('.compass-built')&&document.querySelector('.compass-build-cta');",1)
          assert s!=before
          p.write_text(s)

          q=Path('assets/compass/compass.track-b.js')
          t=q.read_text(); before=t
          # Static entry now owns intro, directory retirement, and lower ordering. Track B only validates/annotates them.
          t=re.sub(r"function removeLegacyWhy\(\).*?\nfunction removeDirectoryClutter\(\).*?\nfunction guidanceFor", "function removeLegacyWhy(){return !document.querySelector('.compass-introduction')}\nfunction removeDirectoryClutter(){return ![...document.querySelectorAll('a')].some(a=>['Products','Worlds','Instruments','Frontier','Guide Desk'].includes(a.textContent.trim()))&&!document.querySelector('.compass-accessibility-note')}\nfunction guidanceFor", t, count=1, flags=re.S)
          t=re.sub(r"function reconcileLowerOrder\(\)\{.*?\}\nfunction annotateScene", "function reconcileLowerOrder(){const orbit=document.querySelector('[data-capability-orbit]'),built=findBuilt(),build=findBuildCta();if(!orbit||!built||!build)return false;orbit.dataset.trackBCapabilityBlock='true';orbit.classList.add('compass-track-b-relocated-orbit');built.dataset.trackBBuiltEvidence='true';build.dataset.trackBBuildCta='true';return Boolean(built.compareDocumentPosition(orbit)&Node.DOCUMENT_POSITION_FOLLOWING)&&Boolean(orbit.compareDocumentPosition(build)&Node.DOCUMENT_POSITION_FOLLOWING)}\nfunction annotateScene", t, count=1, flags=re.S)
          if t!=before:q.write_text(t)
          PY
      - name: Verify single presentation authority
        run: |
          node --check assets/compass/compass.capability-carousel.js
          node --check assets/compass/compass.track-b.js
          grep -q 'data-compass-capability-mount' index.html
          grep -q 'class="compass-track-b-intro"' index.html
          ! grep -q 'data-compass-capability-switcher' index.html
          ! grep -q 'class="compass-selective-routes"' index.html
          ! grep -q 'class="compass-accessibility-note"' index.html
          grep -q "document.querySelector('\[data-compass-capability-mount\]')" assets/compass/compass.capability-carousel.js
          ! grep -q 'positionTrackBPlaceholder' assets/compass/compass.capability-carousel.js
      - name: Commit canonical authority repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/compass/compass.capability-carousel.js assets/compass/compass.track-b.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor(track-b): mount canonical presentation without overlap'
          git push origin HEAD:track-b/remove-overlap-authorities
