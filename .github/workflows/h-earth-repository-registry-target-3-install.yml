name: H-Earth Repository Registry Target 3 Installation

on:
  push:
    branches:
      - agent/h-earth-repository-registry-installation-001
    paths:
      - .transport/h-earth-repository-registry-target-3/target-3-files.tar.xz.b64
      - .github/workflows/h-earth-repository-registry-target-3-install.yml

permissions:
  contents: write

jobs:
  install-audit-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: agent/h-earth-repository-registry-installation-001
      PAYLOAD_PATH: .transport/h-earth-repository-registry-target-3/target-3-files.tar.xz.b64
      WORKFLOW_PATH: .github/workflows/h-earth-repository-registry-target-3-install.yml
      EXPECTED_PAYLOAD_BLOB: 9098433f653ec6d54bbd875c95d273db25d0cee2
      CANDIDATE_PATH: h-earth-3d/registry/h-earth.repository-registry.candidate.js
      FACADE_PATH: h-earth-3d/registry/h-earth.repository-registry.js
      INSTALLATION_RECEIPT_PATH: h-earth-3d/registry/h-earth.repository-registry.installation-receipt.json
      DIAGNOSTIC_PATH: showroom/globe/h-earth/diagnostic/repository-registry-projection.js
      TARGET_2_AUDIT_PATH: tools/h-earth-repository-registry-audit.mjs
      TARGET_3_RECEIPT_PATH: h-earth-3d/registry/h-earth.repository-registry.target-3-receipt.json

    steps:
      - name: Check out governed installation branch
        uses: actions/checkout@v4
        with:
          ref: agent/h-earth-repository-registry-installation-001
          fetch-depth: 0

      - name: Verify staged payload and protected Target 2 identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$PAYLOAD_PATH")" = "$EXPECTED_PAYLOAD_BLOB"
          test "$(git hash-object "$CANDIDATE_PATH")" = "10ab7b203e03fde419e526d0cce2c0af42860911"
          test "$(git hash-object "$FACADE_PATH")" = "e1894f4d6510fe2df8d0fe21943dfd0238263051"
          test "$(git hash-object "$INSTALLATION_RECEIPT_PATH")" = "4fe770c238a81ade6334b32ca0027cb24e1dbebf"
          test "$(git hash-object "$DIAGNOSTIC_PATH")" = "b740d8816dd28b2d4ce37c8fd956a6b2b64fb57a"
          test "$(git hash-object "$TARGET_2_AUDIT_PATH")" = "ca180bc58d804a95a21894e9898946d4bcf47a17"

      - name: Validate and extract Target 3 package
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/target-3-files.tar.xz"
          listing="$RUNNER_TEMP/target-3-files.list"
          base64 --decode "$PAYLOAD_PATH" > "$archive"
          tar --list --xz --file "$archive" > "$listing"
          test -s "$listing"

          while IFS= read -r entry; do
            test -n "$entry"
            case "$entry" in
              /*|*../*|../*|*/..|..)
                echo "Unsafe archive entry: $entry" >&2
                exit 1
                ;;
              .github/instructions/*|.github/copilot-instructions.md|h-earth-3d/AGENTS.md|h-earth-3d/registry/*|showroom/globe/h-earth/AGENTS.md|tools/h-earth-repository-registry-target-3-*)
                ;;
              *)
                echo "Out-of-scope archive entry: $entry" >&2
                exit 1
                ;;
            esac
          done < "$listing"

          tar --extract --xz --file "$archive" --directory .

      - name: Execute Target 3 instruction audit
        shell: bash
        run: |
          set -euo pipefail
          audit_script="$(find tools -maxdepth 1 -type f \( -name 'h-earth-repository-registry-target-3-audit.mjs' -o -name '*repository-registry*target-3*audit*.mjs' \) | sort | head -n 1)"
          test -n "$audit_script"
          node "$audit_script" > "$RUNNER_TEMP/target-3-audit.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const auditPath = process.env.RUNNER_TEMP + '/target-3-audit.json';
          const audit = JSON.parse(fs.readFileSync(auditPath, 'utf8'));
          const pass = audit.result === 'PASS' || audit.status === 'PASS' || audit.pass === true;
          if (!pass) throw new Error('TARGET_3_AUDIT_DID_NOT_PASS');
          NODE

      - name: Reverify protected Target 2 identities after extraction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$CANDIDATE_PATH")" = "10ab7b203e03fde419e526d0cce2c0af42860911"
          test "$(git hash-object "$FACADE_PATH")" = "e1894f4d6510fe2df8d0fe21943dfd0238263051"
          test "$(git hash-object "$INSTALLATION_RECEIPT_PATH")" = "4fe770c238a81ade6334b32ca0027cb24e1dbebf"
          test "$(git hash-object "$DIAGNOSTIC_PATH")" = "b740d8816dd28b2d4ce37c8fd956a6b2b64fb57a"
          test "$(git hash-object "$TARGET_2_AUDIT_PATH")" = "ca180bc58d804a95a21894e9898946d4bcf47a17"

      - name: Write durable Target 3 receipt
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const audit = JSON.parse(
            fs.readFileSync(process.env.RUNNER_TEMP + '/target-3-audit.json', 'utf8')
          );
          const receipt = {
            receiptId: 'H_EARTH_REPOSITORY_REGISTRY_TARGET_3_GITHUB_TOOL_INSTRUCTION_RECEIPT_v1',
            targetNumber: 3,
            targetName: 'GITHUB_TOOL_INSTRUCTION',
            result: 'PASS',
            branch: process.env.TARGET_BRANCH,
            sourcePushCommit: process.env.GITHUB_SHA,
            completionCommitIdentity: 'THE_COMMIT_CONTAINING_THIS_RECEIPT',
            installationClass: 'CANDIDATE_GITHUB_TOOL_INSTRUCTION_AND_SCOPED_AGENT_GUIDANCE',
            audit,
            boundaries: {
              registryAccepted: false,
              registryCanonicalized: false,
              sourceAuthorityCreated: false,
              mutationAuthorityCreated: false,
              mergeAuthorityCreated: false,
              validatorInstalled: false,
              workflowEnforcementInstalled: false,
              runtimeActivationCreated: false,
              productionClaimCreated: false,
              mainChanged: false,
              targetFourStillRequired: true
            }
          };
          fs.mkdirSync(path.dirname(process.env.TARGET_3_RECEIPT_PATH), { recursive: true });
          fs.writeFileSync(
            process.env.TARGET_3_RECEIPT_PATH,
            JSON.stringify(receipt, null, 2) + '\n'
          );
          NODE

      - name: Remove temporary files and commit bounded Target 3 completion
        shell: bash
        run: |
          set -euo pipefail
          git rm "$PAYLOAD_PATH" "$WORKFLOW_PATH"
          git add -A

          mapfile -t changed < <(git diff --cached --name-only | sort)
          test "${#changed[@]}" -ge 7
          for changed_path in "${changed[@]}"; do
            case "$changed_path" in
              .github/workflows/h-earth-repository-registry-target-3-install.yml|.transport/h-earth-repository-registry-target-3/target-3-files.tar.xz.b64|.github/instructions/*|.github/copilot-instructions.md|h-earth-3d/AGENTS.md|h-earth-3d/registry/*|showroom/globe/h-earth/AGENTS.md|tools/h-earth-repository-registry-target-3-*)
                ;;
              *)
                echo "Out-of-scope staged path: $changed_path" >&2
                exit 1
                ;;
            esac
          done

          test "$(git hash-object "$CANDIDATE_PATH")" = "10ab7b203e03fde419e526d0cce2c0af42860911"
          test "$(git hash-object "$FACADE_PATH")" = "e1894f4d6510fe2df8d0fe21943dfd0238263051"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete H-Earth repository registry Target 3 tool instruction'
          git push origin "HEAD:$TARGET_BRANCH"
