name: H-Earth Connected Preflight Successor Transport

on:
  push:
    branches:
      - repair/h-earth-connected-preflight-successor-transport-20260817
    paths:
      - '.github/workflows/h-earth-connected-preflight-successor-transport-20260817.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Mint private control-plane read token
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.PRIVATE_EXECUTION_APP_ID }}
          private-key: ${{ secrets.PRIVATE_EXECUTION_APP_PRIVATE_KEY }}
          owner: smansfield635-create
          repositories: geodiametrics1
          permission-contents: read

      - name: Check out authoritative private control-plane head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: smansfield635-create/geodiametrics1
          ref: 4c19e9ba783767f9324ab10df8a8541479f26c86
          token: ${{ steps.token.outputs.token }}
          path: private-control-plane
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact public tooling head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: smansfield635-create/smansfield635-create.github.io
          ref: 012213de030780938ace85aae90e9330fac6d838
          path: public-tooling
          fetch-depth: 0
          persist-credentials: false

      - name: Execute authoritative Gen305 preflight semantics
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/h-earth-gen305-preflight"
          mkdir -p "$work"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const bindingPath = `${process.env.GITHUB_WORKSPACE}/private-control-plane/.github/ai-router/canonical-execution-substrate/h-earth-connected-public-preflight-backend-binding.v1.json`;
          const b = JSON.parse(fs.readFileSync(bindingPath, 'utf8'));
          const fail = (c) => { throw new Error(c); };
          if (b.status !== 'RATIFIED_ACTIVE_RECONCILED_TOOLING') fail('BINDING_NOT_ACTIVE');
          if (b.projectId !== 'H_EARTH' || b.executionClass !== 'PREFLIGHT') fail('BINDING_CLASS_MISMATCH');
          if (b.registeredBackendId !== 'CONNECTED_GITHUB_EXACT_PUBLIC_H_EARTH_PREFLIGHT_V1') fail('BACKEND_ID_MISMATCH');
          if (b.fixedRepository !== 'smansfield635-create/smansfield635-create.github.io') fail('REPOSITORY_MISMATCH');
          if (b.fixedToolingHead !== '012213de030780938ace85aae90e9330fac6d838') fail('TOOLING_HEAD_MISMATCH');
          if (b.executor !== 'tools/ai-room-transport/connected-public-h-earth-preflight.v1.mjs') fail('EXECUTOR_MISMATCH');
          NODE

          cd "$GITHUB_WORKSPACE/public-tooling"
          test "$(git rev-parse HEAD^{commit})" = '012213de030780938ace85aae90e9330fac6d838'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git rev-parse HEAD:tools/h-earth-repository-registry-auto-preflight.mjs)" = '6d4af698ca75b96aaa660033e9ae24c704673eb7'
          test "$(git rev-parse HEAD:h-earth-3d/registry/activation/h-earth.repository-registry.auto-preflight.js)" = 'b3c51381af190b6aab296db222296dc851cb7e9a'
          git cat-file -e '2152ad18c1691c4056e9ae39795ad44228dbdc19^{commit}'

          node --experimental-default-type=module tools/h-earth-repository-registry-auto-preflight.mjs \
            --mutation-intent \
            --task 'Gen305 S26 performance and world-envelope successor pre-mutation preflight' \
            --path h-earth-3d/docs/H_EARTH_C3C3R5_S26_PERFORMANCE_WORLD_ENVELOPE_SUCCESSOR_CONTRACT_v1.md \
            --path h-earth-3d/validation/h-earth.c3c3r5.s26-performance-world-envelope.browser.harness.mjs \
            --path showroom/globe/h-earth/render/functional-landscape-frame.js \
            --path showroom/globe/h-earth/render/geometry-distant-context.js \
            --path showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.js \
            --path showroom/globe/h-earth/render/persistent-live-renderer.run8e-r3c.cp2-additive-bandlimited-relief-v2.js \
            --path showroom/globe/h-earth/render/run8e-successor-environment.js \
            --output "$work/native-receipt.json"
          cat "$work/native-receipt.json"

          node --input-type=module - "$work/native-receipt.json" "$work/transport-receipt.json" <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const [nativePath, transportPath] = process.argv.slice(2);
          const bytes = fs.readFileSync(nativePath);
          const n = JSON.parse(bytes);
          const fail = (c) => { throw new Error(c); };
          if (n.activationId !== 'H_EARTH_REPOSITORY_REGISTRY_AUTOMATIC_PREFLIGHT_ACTIVATION_v1') fail('ACTIVATION_MISMATCH');
          if (n.activationStatus !== 'ACTIVATED') fail('ACTIVATION_NOT_ACTIVE');
          if (n.dependenciesVerified !== true) fail('DEPENDENCIES_NOT_VERIFIED');
          if (n.mutationIntentDetected !== true || n.mutationMayProceed !== false) fail('MUTATION_BOUNDARY_INVALID');
          const receipt = {
            schema: 'H_EARTH_CONNECTED_PREFLIGHT_SUCCESSOR_TRANSPORT_RECEIPT_v1',
            backendId: 'CONNECTED_GITHUB_EXACT_PUBLIC_H_EARTH_PREFLIGHT_V1',
            authoritativePrivateHead: '4c19e9ba783767f9324ab10df8a8541479f26c86',
            toolingHead: '012213de030780938ace85aae90e9330fac6d838',
            subjectHead: '2152ad18c1691c4056e9ae39795ad44228dbdc19',
            nativeReceiptSha256: crypto.createHash('sha256').update(bytes).digest('hex'),
            nativeDisposition: n.finalDisposition,
            continuation: n.continuation,
            result: n.finalDisposition === 'PASS' ? 'PASS_CLOSED' : 'FAIL_CLOSED',
            productMutationPerformed: false,
            constructionAuthorityGranted: false,
            mergePerformed: false,
            deploymentPerformed: false,
            releasePerformed: false
          };
          fs.writeFileSync(transportPath, JSON.stringify(receipt, null, 2) + '\n');
          if (n.finalDisposition !== 'PASS') fail(`NATIVE_PREFLIGHT_NONPASS:${n.finalDisposition}`);
          if (n.continuation !== 'SEPARATE_MUTATION_AUTHORITY_REQUIRED_BEFORE_CHANGE') fail('CONTINUATION_MISMATCH');
          NODE

          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload exact preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-earth-gen305-authoritative-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/h-earth-gen305-preflight/native-receipt.json
            ${{ runner.temp }}/h-earth-gen305-preflight/transport-receipt.json
          if-no-files-found: error
          retention-days: 90
