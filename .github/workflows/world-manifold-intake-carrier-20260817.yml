name: World Manifold Gen306 Bound Post-Merge Preflight

on:
  push:
    branches:
      - control-plane-carrier/world-manifold-intake-20260817
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TOOLING_HEAD: 46b2cca200f1db036cae8288329f870a8336505a
      NATIVE_TOOL_BLOB: 6d4af698ca75b96aaa660033e9ae24c704673eb7
      ACTIVATION_BLOB: b3c51381af190b6aab296db222296dc851cb7e9a
    steps:
      - name: Checkout exact bound tooling head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: smansfield635-create/smansfield635-create.github.io
          ref: ${{ env.TOOLING_HEAD }}
          path: tooling
          fetch-depth: 1
          persist-credentials: false

      - name: Execute bound exact Gen306 eleven-path native preflight
        working-directory: tooling
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TOOLING_HEAD"
          test "$(git rev-parse HEAD:tools/h-earth-repository-registry-auto-preflight.mjs)" = "$NATIVE_TOOL_BLOB"
          test "$(git rev-parse HEAD:h-earth-3d/registry/activation/h-earth.repository-registry.auto-preflight.js)" = "$ACTIVATION_BLOB"
          node tools/h-earth-repository-registry-auto-preflight.mjs \
            --mutation-intent \
            --task 'Gen306 world-manifold architecture authoritative post-rebind preflight' \
            --path h-earth-3d/terrain/h-earth.world-manifold-domain.js \
            --path h-earth-3d/integration/h-earth.world-representation-plan.js \
            --path h-earth-3d/integration/h-earth.world-manifold-union-admission.js \
            --path h-earth-3d/validation/h-earth.world-manifold-architecture.harness.mjs \
            --path h-earth-3d/terrain/h-earth.successor-terrain-field.run8b.js \
            --path showroom/globe/h-earth/render/geometry-successor-terrain.run8b.js \
            --path showroom/globe/h-earth/render/geometry-shoreline.js \
            --path showroom/globe/h-earth/render/geometry-distant-context.js \
            --path showroom/globe/h-earth/render/landscape-preview.js \
            --path h-earth-3d/integration/h-earth.run8e-successor-environment-transfer.js \
            --path showroom/globe/h-earth/render/run8e-successor-environment.js \
            --output "$RUNNER_TEMP/native-preflight.json"
          test "$(jq -r '.activationStatus' "$RUNNER_TEMP/native-preflight.json")" = 'ACTIVATED'
          test "$(jq -r '.dependenciesVerified' "$RUNNER_TEMP/native-preflight.json")" = 'true'
          test "$(jq -r '.finalDisposition' "$RUNNER_TEMP/native-preflight.json")" = 'PASS'
          test "$(jq '[.pathClassification.classifications[] | select(.registered != true)] | length' "$RUNNER_TEMP/native-preflight.json")" = '0'
          jq '{activationStatus,dependenciesVerified,finalDisposition,continuation,registeredPathCount:(.pathClassification.classifications|length),failureCodes:.validatorReceipt.failureCodes}' "$RUNNER_TEMP/native-preflight.json"
